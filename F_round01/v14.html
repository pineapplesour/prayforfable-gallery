<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>tundra aurora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#070b14;}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #cap{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    color:rgba(214,228,240,.5);font:11px/1.5 "Space Mono","Courier New",monospace;
    letter-spacing:.30em;text-transform:lowercase;
    pointer-events:none;white-space:nowrap;user-select:none;
    text-shadow:0 1px 8px rgba(0,0,0,.6);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">tundra · aurora drifting over still ice</div>
<script>
'use strict';
(()=>{
const TAU=Math.PI*2;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});

let W=0,H=0,dpr=1;

/* ---------- offscreen layers ---------- */
// sky/ground are repainted on resize only (static base)
const baseCan=document.createElement('canvas'), bctx=baseCan.getContext('2d');
// noise tile
const noiseCan=document.createElement('canvas'), nctx=noiseCan.getContext('2d');

/* ---------- palette (muted cold) ---------- */
const SKY_TOP   ='#0a1020';
const SKY_MID   ='#101a2c';
const SKY_LOW   ='#16243a';
const GROUND_TOP='#1a2a3a';
const GROUND_LOW='#0c141f';

/* ---------- aurora ribbons ---------- */
// each ribbon = a slow horizontal band of vertical light curtains,
// drifting laterally, breathing in intensity. these are the "swimming" elements.
function makeRibbon(cfg){
  return Object.assign({
    yBase:0.32, amp:0.05, span:1.3, x:Math.random(),
    drift:0.006+Math.random()*0.01, // horizontal drift speed
    wob:0.4+Math.random()*0.5,      // vertical wobble freq
    wobPh:Math.random()*TAU,
    hueA:140, hueB:175, sat:55, light:62,
    height:0.30, alpha:0.5, blur:0,
    breathePh:Math.random()*TAU, breatheSp:0.10+Math.random()*0.10,
    seed:Math.random()*1000
  },cfg);
}
let ribbons=[];

/* ---------- floating frosted disks (the bubble disks) ---------- */
function makeDisk(){
  const depth=Math.random();            // 0 far(blurred,dim) .. 1 near(sharp,bright)
  return{
    x:Math.random(), y:Math.random(),
    r:(0.012+Math.random()*0.05)*(0.4+depth),
    depth,
    vx:(Math.random()-0.5)*0.004*(0.3+depth),
    vy:-0.002-Math.random()*0.006*(0.3+depth), // slowly rise
    rot:Math.random()*TAU, vr:(Math.random()-0.5)*0.05,
    wob:Math.random()*TAU, wobSp:0.2+Math.random()*0.5,
    hollow:Math.random()<0.55
  };
}
let disks=[];

/* ---------- drifting snow / ice motes ---------- */
function makeMote(){
  const depth=Math.random();
  return{
    x:Math.random(), y:Math.random(),
    r:(0.6+Math.random()*1.8)*(0.5+depth),
    depth,
    vx:(0.004+Math.random()*0.012)*(Math.random()<0.5?-1:1),
    vy:0.004+Math.random()*0.014,
    swPh:Math.random()*TAU, swSp:0.4+Math.random()*0.8, swAmp:0.003+Math.random()*0.006
  };
}
let motes=[];

/* ---------- stars ---------- */
let stars=[];
function makeStars(n){
  const a=[];
  for(let i=0;i<n;i++) a.push({
    x:Math.random(), y:Math.random()*0.62,
    r:Math.random()*1.1+0.25,
    tw:Math.random()*TAU, tws:0.3+Math.random()*1.2,
    base:0.25+Math.random()*0.55
  });
  return a;
}

/* ---------- distant ridge silhouette ---------- */
let ridge=[];
function makeRidge(){
  // layered low hills near horizon
  ridge=[];
  const layers=[
    {y:0.66, amp:0.020, col:'#0e1826', n:5},
    {y:0.70, amp:0.030, col:'#0a121d', n:4},
    {y:0.75, amp:0.045, col:'#070d16', n:3}
  ];
  for(const L of layers){
    const pts=[]; const segs=L.n;
    for(let i=0;i<=segs;i++){
      pts.push({x:i/segs, y:L.y + (Math.random()-0.5)*L.amp});
    }
    ridge.push({pts,col:L.col,y:L.y});
  }
}

/* ---------- noise ---------- */
function buildNoise(){
  const s=160; noiseCan.width=s; noiseCan.height=s;
  const id=nctx.createImageData(s,s); const d=id.data;
  for(let i=0;i<d.length;i+=4){
    const v=Math.random()*255;
    d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
  }
  nctx.putImageData(id,0,0);
}

/* ---------- paint static base (sky gradient + ground + ridge + stars baked separately) ---------- */
function paintBase(){
  const c=bctx, w=W, h=H;
  baseCan.width=w; baseCan.height=h;
  // sky vertical gradient
  const g=c.createLinearGradient(0,0,0,h);
  g.addColorStop(0,SKY_TOP);
  g.addColorStop(0.30,SKY_MID);
  g.addColorStop(0.58,SKY_LOW);
  g.addColorStop(0.62,GROUND_TOP);
  g.addColorStop(1,GROUND_LOW);
  c.fillStyle=g; c.fillRect(0,0,w,h);

  // soft horizon glow (cold teal)
  const hy=h*0.60;
  const hg=c.createRadialGradient(w*0.5,hy,0,w*0.5,hy,Math.max(w,h)*0.55);
  hg.addColorStop(0,'rgba(58,120,120,0.20)');
  hg.addColorStop(0.5,'rgba(40,90,100,0.07)');
  hg.addColorStop(1,'rgba(40,90,100,0)');
  c.fillStyle=hg; c.fillRect(0,0,w,h);

  // ridge silhouettes
  for(const L of ridge){
    c.beginPath();
    c.moveTo(0,h);
    c.lineTo(0,L.pts[0].y*h);
    for(let i=0;i<L.pts.length-1;i++){
      const p=L.pts[i], q=L.pts[i+1];
      const mx=(p.x+q.x)/2*w, my=(p.y+q.y)/2*h;
      c.quadraticCurveTo(p.x*w,p.y*h,mx,my);
    }
    c.lineTo(w,L.pts[L.pts.length-1].y*h);
    c.lineTo(w,h); c.closePath();
    c.fillStyle=L.col; c.fill();
  }

  // frozen ground sheen — faint reflective streaks
  c.save();
  c.globalCompositeOperation='screen';
  for(let i=0;i<26;i++){
    const yy=h*(0.64+Math.random()*0.34);
    const ww=w*(0.1+Math.random()*0.5);
    const xx=Math.random()*w;
    const sg=c.createLinearGradient(xx,yy,xx+ww,yy);
    sg.addColorStop(0,'rgba(120,160,180,0)');
    sg.addColorStop(0.5,'rgba(120,160,180,'+(0.015+Math.random()*0.03).toFixed(3)+')');
    sg.addColorStop(1,'rgba(120,160,180,0)');
    c.fillStyle=sg;
    c.fillRect(xx,yy,ww,1+Math.random()*1.5);
  }
  c.restore();
}

/* ---------- draw one aurora ribbon to a target ctx ---------- */
function drawRibbon(c,r,t){
  const w=W,h=H;
  // breathing intensity
  const breathe=0.55+0.45*Math.sin(t*r.breatheSp+r.breathePh);
  const a=r.alpha*breathe;
  if(a<=0.01) return;

  const cy=r.yBase*h;
  const ribH=r.height*h;
  const xCenter=((r.x + t*r.drift)%1.3 -0.15)*w;

  c.save();
  c.globalCompositeOperation='screen';
  if(r.blur>0) c.filter='blur('+r.blur+'px)';

  // vertical curtain strands across the span
  const span=r.span*w;
  const x0=xCenter - span*0.5;
  const strands=Math.max(40,Math.round(span/9));
  for(let i=0;i<=strands;i++){
    const u=i/strands;                 // 0..1 along ribbon
    const px=x0 + u*span;
    if(px<-40||px>w+40) continue;
    // vertical wobble of the curtain base
    const wob=Math.sin(u*6.0*r.wob + t*0.5 + r.wobPh + r.seed)*r.amp*h
            + Math.sin(u*13.0*r.wob - t*0.33 + r.seed*1.7)*r.amp*0.45*h;
    const topY=cy+wob;
    // per-strand height flicker (the shimmering rays)
    const flick=0.7+0.3*Math.sin(u*40.0 - t*2.2 + r.seed*3.1);
    const segH=ribH*flick;
    // envelope so ribbon fades at lateral ends
    const env=Math.sin(Math.PI*Math.min(Math.max(u,0),1));
    const sa=a*env*env;
    if(sa<0.01) continue;

    const grad=c.createLinearGradient(px,topY,px,topY+segH);
    const hue=r.hueA + (r.hueB-r.hueA)*(0.5+0.5*Math.sin(u*3.0+t*0.2+r.seed));
    grad.addColorStop(0,    'hsla('+hue+','+r.sat+'%,'+r.light+'%,'+(sa*0.9).toFixed(3)+')');
    grad.addColorStop(0.35, 'hsla('+(hue+8)+','+(r.sat-6)+'%,'+(r.light-8)+'%,'+(sa*0.6).toFixed(3)+')');
    grad.addColorStop(0.75, 'hsla('+(hue+20)+','+(r.sat-12)+'%,'+(r.light-18)+'%,'+(sa*0.22).toFixed(3)+')');
    grad.addColorStop(1,    'hsla('+(hue+30)+','+(r.sat-12)+'%,'+(r.light-22)+'%,0)');
    c.fillStyle=grad;
    const sw=Math.max(2,span/strands*1.9);
    c.fillRect(px-sw*0.5,topY,sw,segH);
  }

  // soft top crown glow along the ribbon
  const cg=c.createLinearGradient(xCenter-span*0.5,cy,xCenter+span*0.5,cy);
  cg.addColorStop(0,'hsla('+r.hueA+','+r.sat+'%,'+(r.light+6)+'%,0)');
  cg.addColorStop(0.5,'hsla('+r.hueA+','+r.sat+'%,'+(r.light+6)+'%,'+(a*0.18).toFixed(3)+')');
  cg.addColorStop(1,'hsla('+r.hueA+','+r.sat+'%,'+(r.light+6)+'%,0)');
  c.fillStyle=cg;
  c.fillRect(xCenter-span*0.5,cy-6,span,12);

  c.restore();
}

/* ---------- draw floating frosted disk ---------- */
function drawDisk(c,dk,t){
  const w=W,h=H;
  const wobx=Math.sin(t*dk.wobSp+dk.wob)*0.004;
  const x=(dk.x+wobx)*w, y=dk.y*h;
  const r=dk.r*Math.min(w,h);
  const blur=(1-dk.depth)*7;          // far disks blurred
  const alpha=0.10+dk.depth*0.30;

  c.save();
  if(blur>0.4) c.filter='blur('+blur.toFixed(2)+'px)';
  c.translate(x,y);
  c.rotate(dk.rot);

  if(dk.hollow){
    // ring disk (like the bubble rings in ref)
    c.lineWidth=Math.max(1.2,r*0.16);
    const rg=c.createRadialGradient(0,0,r*0.6,0,0,r);
    rg.addColorStop(0,'rgba(190,220,235,0)');
    rg.addColorStop(0.7,'rgba(190,220,235,'+(alpha*0.9).toFixed(3)+')');
    rg.addColorStop(1,'rgba(150,190,210,0)');
    c.strokeStyle='rgba(200,224,238,'+alpha.toFixed(3)+')';
    c.beginPath(); c.arc(0,0,r,0,TAU); c.stroke();
    // inner faint fill
    c.fillStyle='rgba(120,160,185,'+(alpha*0.18).toFixed(3)+')';
    c.beginPath(); c.arc(0,0,r*0.92,0,TAU); c.fill();
    // tiny highlight
    c.fillStyle='rgba(235,245,250,'+(alpha*0.6).toFixed(3)+')';
    c.beginPath(); c.arc(-r*0.45,-r*0.45,r*0.10,0,TAU); c.fill();
  }else{
    const g=c.createRadialGradient(-r*0.3,-r*0.3,r*0.05,0,0,r);
    g.addColorStop(0,'rgba(225,238,246,'+(alpha*0.9).toFixed(3)+')');
    g.addColorStop(0.4,'rgba(150,188,208,'+(alpha*0.5).toFixed(3)+')');
    g.addColorStop(0.85,'rgba(90,130,160,'+(alpha*0.22).toFixed(3)+')');
    g.addColorStop(1,'rgba(80,120,150,0)');
    c.fillStyle=g;
    c.beginPath(); c.arc(0,0,r,0,TAU); c.fill();
    // rim
    c.strokeStyle='rgba(210,230,242,'+(alpha*0.4).toFixed(3)+')';
    c.lineWidth=Math.max(0.6,r*0.04);
    c.beginPath(); c.arc(0,0,r*0.96,0,TAU); c.stroke();
    // specular
    c.fillStyle='rgba(245,250,253,'+(alpha*0.7).toFixed(3)+')';
    c.beginPath(); c.ellipse(-r*0.4,-r*0.4,r*0.16,r*0.10,-0.6,0,TAU); c.fill();
  }
  c.restore();
}

/* ---------- update particles ---------- */
function updateDisks(dt){
  for(const d of disks){
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.rot+=d.vr*dt;
    if(d.y<-0.12){ d.y=1.12; d.x=Math.random(); }
    if(d.x<-0.12) d.x=1.12; if(d.x>1.12) d.x=-0.12;
  }
}
function updateMotes(dt,t){
  for(const m of motes){
    m.x+=m.vx*dt + Math.sin(t*m.swSp+m.swPh)*m.swAmp*dt*6;
    m.y+=m.vy*dt;
    if(m.y>1.08){ m.y=-0.05; m.x=Math.random(); }
    if(m.x<-0.05) m.x=1.05; if(m.x>1.05) m.x=-0.05;
  }
}

/* ---------- compose frame ---------- */
function drawMotes(c,t){
  const w=W,h=H;
  for(const m of motes){
    const x=m.x*w, y=m.y*h;
    const a=(0.12+m.depth*0.45);
    const blur=(1-m.depth)*2.2;
    c.save();
    if(blur>0.5) c.filter='blur('+blur.toFixed(2)+'px)';
    c.fillStyle='rgba(225,238,248,'+a.toFixed(3)+')';
    c.beginPath(); c.arc(x,y,m.r,0,TAU); c.fill();
    c.restore();
  }
}
function drawStars(c,t){
  const w=W,h=H;
  for(const s of stars){
    const tw=s.base*(0.55+0.45*Math.sin(t*s.tws+s.tw));
    c.fillStyle='rgba(220,232,245,'+tw.toFixed(3)+')';
    c.beginPath(); c.arc(s.x*w,s.y*h,s.r,0,TAU); c.fill();
  }
}

function frame(ts){
  requestAnimationFrame(frame);
  const t=ts/1000;
  const dt=Math.min(0.05,Math.max(0.001,t-(frame._last||t)));
  frame._last=t;

  updateDisks(dt); updateMotes(dt,t);

  // base
  ctx.globalCompositeOperation='source-over';
  ctx.filter='none';
  ctx.drawImage(baseCan,0,0);

  // stars (above sky, below aurora)
  drawStars(ctx,t);

  // aurora ribbons — far(blurred) first, near last
  for(const r of ribbons) drawRibbon(ctx,r,t);

  // aurora reflection on the ice (vertical flip, lower band, dim+blur)
  ctx.save();
  ctx.filter='blur(6px)';
  ctx.globalAlpha=0.22;
  ctx.globalCompositeOperation='screen';
  const horizon=H*0.61;
  ctx.translate(0,horizon*2);
  ctx.scale(1,-1);
  for(const r of ribbons){
    // draw a squashed copy
    drawRibbon(ctx,r,t);
  }
  ctx.restore();

  // frosted disks
  for(const d of disks) drawDisk(ctx,d,t);

  // snow motes
  ctx.filter='none';
  drawMotes(ctx,t);

  // vignette
  ctx.save();
  ctx.globalCompositeOperation='source-over';
  const vg=ctx.createRadialGradient(W*0.5,H*0.46,Math.min(W,H)*0.2,W*0.5,H*0.5,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(0.7,'rgba(4,7,14,0.18)');
  vg.addColorStop(1,'rgba(4,7,14,0.62)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  ctx.restore();

  // fine grain noise
  ctx.save();
  ctx.globalCompositeOperation='overlay';
  ctx.globalAlpha=0.045;
  const ox=(t*7)%160, oy=(t*4)%160;
  for(let yy=-160+( -oy);yy<H;yy+=160){
    for(let xx=-160+(-ox);xx<W;xx+=160){
      ctx.drawImage(noiseCan,xx,yy);
    }
  }
  ctx.restore();
}

/* ---------- resize / init ---------- */
function resize(){
  W=window.innerWidth; H=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // ctx works in CSS px because of the transform
  makeRidge();
  paintBase();
}

function buildScene(){
  // ribbons: 3 layers, far->near
  ribbons=[
    makeRibbon({yBase:0.20, height:0.34, amp:0.030, span:1.5, alpha:0.30, blur:9,
                hueA:155,hueB:185, sat:48, light:58, drift:0.004, breatheSp:0.07}),
    makeRibbon({yBase:0.28, height:0.40, amp:0.045, span:1.4, alpha:0.46, blur:4,
                hueA:135,hueB:172, sat:58, light:62, drift:0.0065, breatheSp:0.10}),
    makeRibbon({yBase:0.34, height:0.34, amp:0.055, span:1.2, alpha:0.55, blur:1.2,
                hueA:120,hueB:160, sat:62, light:66, drift:0.009, breatheSp:0.13}),
    // a faint magenta-edged high ribbon for color variety
    makeRibbon({yBase:0.15, height:0.26, amp:0.025, span:1.3, alpha:0.20, blur:7,
                hueA:185,hueB:285, sat:46, light:60, drift:0.003, breatheSp:0.06})
  ];
  disks=[]; for(let i=0;i<16;i++) disks.push(makeDisk());
  motes=[]; for(let i=0;i<140;i++) motes.push(makeMote());
  stars=makeStars(170);
}

buildNoise();
resize();
buildScene();
window.addEventListener('resize',()=>{ resize(); });
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
