<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>黄昏の砂丘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300&family=JetBrains+Mono:wght@300&display=swap"
  media="print" onload="this.media='all'">
<noscript><link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300&family=JetBrains+Mono:wght@300&display=swap"></noscript>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1320;}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:none;}
  #cap{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    color:rgba(248,235,222,.62);
    font:300 11px/1.6 "JetBrains Mono","Hiragino Kaku Gothic ProN",monospace;
    letter-spacing:.26em;background:rgba(40,22,30,.30);padding:7px 20px;border-radius:99px;
    backdrop-filter:blur(7px);pointer-events:none;transition:opacity 2.4s;white-space:nowrap;
    text-transform:uppercase;}
  #title{position:fixed;left:50%;top:34px;transform:translateX(-50%);
    color:rgba(250,238,226,.5);
    font:300 13px/1.6 "Zen Kaku Gothic New",sans-serif;letter-spacing:.5em;
    pointer-events:none;transition:opacity 2.4s;white-space:nowrap;text-indent:.5em;}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="title">黄昏の砂丘</div>
<div id="cap">dusk over the dunes — drift &amp; settle</div>
<script>
'use strict';
(()=>{
const TAU=Math.PI*2;
const canvas=document.getElementById('scene');
const cap=document.getElementById('cap');
const title=document.getElementById('title');
const ctx=canvas.getContext('2d',{alpha:false});

let W=0,H=0,dpr=1;
let t=0,last=0;

/* ---- layered offscreen buffers ---- */
const sky=document.createElement('canvas'),sctx=sky.getContext('2d');     // static sky gradient
const grain=document.createElement('canvas'),gctx=grain.getContext('2d'); // fine noise tile
const blurBuf=document.createElement('canvas'),bbctx=blurBuf.getContext('2d'); // for soft glow compositing

/* palette — muted twilight desert */
const PAL={
  skyTop:'#241a2e',     // deep dusk indigo
  skyMid:'#5b3f52',     // dusty plum
  skyHaze:'#9c6a5f',    // muted rose
  horizon:'#c98e63',    // warm ochre glow
  sunCore:'#f3c98e',    // soft amber
  duneLight:'#caa074',
  duneMid:'#9c7a58',
  duneDark:'#6b513e',
  duneFar:'#b08a72'
};

/* ---------- noise (value noise, smooth) ---------- */
const perm=new Uint8Array(512);
(function(){const p=new Uint8Array(256);for(let i=0;i<256;i++)p[i]=i;
  for(let i=255;i>0;i--){const j=(Math.random()*(i+1))|0;const tmp=p[i];p[i]=p[j];p[j]=tmp;}
  for(let i=0;i<512;i++)perm[i]=p[i&255];})();
const fade=x=>x*x*x*(x*(x*6-15)+10);
const lerp=(a,b,x)=>a+(b-a)*x;
function grad(h,x){return (h&1?-1:1)*( ( (h>>1)&1 )?x*0.7:x );}
function vnoise(x){
  const xi=Math.floor(x)&255,xf=x-Math.floor(x);
  const u=fade(xf);
  const a=perm[xi],b=perm[xi+1];
  return lerp((a/255*2-1),(b/255*2-1),u);
}
// 1D fbm for dune crests
function fbm(x){
  let v=0,amp=0.5,f=1;
  for(let o=0;o<4;o++){v+=amp*vnoise(x*f);f*=2.04;amp*=0.5;}
  return v;
}

/* ---------- dune layers (slow horizontal parallax) ---------- */
let dunes=[];
function buildDunes(){
  dunes=[
    {base:0.50, amp:0.045, freq:0.0016, seed:11.3, speed:1.7,  col:PAL.duneFar,  haze:0.62, blur:7},
    {base:0.60, amp:0.060, freq:0.0021, seed:42.7, speed:3.4,  col:PAL.duneMid,  haze:0.42, blur:4},
    {base:0.72, amp:0.080, freq:0.0026, seed:88.1, speed:6.0,  col:PAL.duneDark, haze:0.22, blur:2},
    {base:0.86, amp:0.110, freq:0.0030, seed:5.2,  speed:10.0, col:'#503c30',    haze:0.06, blur:0}
  ];
}

/* ---------- floating motes / pollen discs (the "swimming" drifters) ---------- */
let motes=[];
function makeMote(){
  const depth=Math.random();              // 0 far(blurry,small,slow) .. 1 near
  return{
    x:Math.random()*W,
    y:H*0.18+Math.random()*H*0.72,
    depth,
    r:(2+depth*depth*16)*(0.6+Math.random()*0.8),
    vx:(8+depth*26)*(Math.random()<0.5?-1:1)*0.5,
    vy:-(3+depth*9)*(0.5+Math.random()),
    drift:Math.random()*TAU,
    driftSp:0.2+Math.random()*0.5,
    driftAmp:6+depth*24,
    blur:(1-depth)*9+ (Math.random()<0.3?5:0),
    glow:0.12+depth*0.5,
    warm:Math.random()<0.6
  };
}
function buildMotes(){
  motes=[];
  const n=Math.round(W*H/52000)+10;
  for(let i=0;i<n;i++)motes.push(makeMote());
}

/* ---------- birds (slow gliding flock — koi analogue) ---------- */
let birds=[];
function makeBird(near){
  const depth=near?0.65+Math.random()*0.3:0.18+Math.random()*0.4;
  return{
    x:Math.random()*W,
    y:H*0.16+Math.random()*H*0.42,
    depth,
    sz:6+depth*depth*30,
    sp:(14+depth*40)*(0.7+Math.random()*0.6),
    dir:Math.random()<0.5?-1:1,
    flap:Math.random()*TAU,
    flapSp:1.6+Math.random()*1.4,
    bob:Math.random()*TAU,
    bobSp:0.4+Math.random()*0.5,
    bobAmp:5+depth*16
  };
}
function buildBirds(){
  birds=[];
  const n=5+Math.round(W/420);
  for(let i=0;i<n;i++)birds.push(makeBird(i%3===0));
}

/* ---------- grain tile ---------- */
function buildGrain(){
  const gs=160;grain.width=gs;grain.height=gs;
  const id=gctx.createImageData(gs,gs);const d=id.data;
  for(let i=0;i<d.length;i+=4){
    const v=200+(Math.random()*55|0);
    d[i]=d[i+1]=d[i+2]=v;
    d[i+3]=Math.random()*16|0;
  }
  gctx.putImageData(id,0,0);
}

/* ---------- static sky ---------- */
function paintSky(){
  sky.width=W;sky.height=H;
  const g=sctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0.00,PAL.skyTop);
  g.addColorStop(0.30,PAL.skyMid);
  g.addColorStop(0.52,PAL.skyHaze);
  g.addColorStop(0.66,PAL.horizon);
  g.addColorStop(0.74,'#d9a06f');
  sctx.fillStyle=g;sctx.fillRect(0,0,W,H);

  // low sun glow near horizon, slightly right of center
  const sx=W*0.62, sy=H*0.665;
  const sun=sctx.createRadialGradient(sx,sy,0,sx,sy,Math.max(W,H)*0.55);
  sun.addColorStop(0,'rgba(255,232,190,0.85)');
  sun.addColorStop(0.10,'rgba(247,210,150,0.55)');
  sun.addColorStop(0.32,'rgba(214,140,96,0.22)');
  sun.addColorStop(0.7,'rgba(120,70,80,0)');
  sctx.globalCompositeOperation='lighter';
  sctx.fillStyle=sun;sctx.beginPath();sctx.arc(sx,sy,Math.max(W,H)*0.55,0,TAU);sctx.fill();
  // sun disc soft
  const disc=sctx.createRadialGradient(sx,sy,0,sx,sy,Math.max(W,H)*0.07);
  disc.addColorStop(0,'rgba(255,243,222,0.95)');
  disc.addColorStop(0.6,'rgba(250,214,160,0.5)');
  disc.addColorStop(1,'rgba(250,214,160,0)');
  sctx.fillStyle=disc;sctx.beginPath();sctx.arc(sx,sy,Math.max(W,H)*0.07,0,TAU);sctx.fill();
  sctx.globalCompositeOperation='source-over';

  // soft horizontal haze bands (depth)
  for(let i=0;i<5;i++){
    const y=H*(0.42+i*0.045);
    const bg=sctx.createLinearGradient(0,y-H*0.03,0,y+H*0.03);
    bg.addColorStop(0,'rgba(220,170,140,0)');
    bg.addColorStop(0.5,'rgba(220,175,150,'+(0.05+i*0.01)+')');
    bg.addColorStop(1,'rgba(220,170,140,0)');
    sctx.fillStyle=bg;sctx.fillRect(0,y-H*0.03,W,H*0.06);
  }
}

/* ---------- draw one dune layer ---------- */
function drawDune(layer){
  const yBase=H*layer.base;
  const ampPx=H*layer.amp;
  const off=t*layer.speed;
  const step=Math.max(2,Math.round(W/360));
  ctx.save();
  if(layer.blur>0)ctx.filter='blur('+layer.blur+'px)';
  ctx.beginPath();
  ctx.moveTo(-20,H+20);
  let firstY=0;
  for(let x=-20;x<=W+20;x+=step){
    const nx=(x+off)*layer.freq+layer.seed;
    const y=yBase - fbm(nx)*ampPx - fbm(nx*0.37+9.0)*ampPx*0.55;
    if(x===-20)firstY=y;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W+20,H+20);
  ctx.closePath();
  // vertical shading gradient on the dune body
  const dg=ctx.createLinearGradient(0,yBase-ampPx*1.5,0,H);
  dg.addColorStop(0,shade(layer.col,1.18));
  dg.addColorStop(0.25,layer.col);
  dg.addColorStop(1,shade(layer.col,0.55));
  ctx.fillStyle=dg;
  ctx.fill();
  // sunlit crest rim toward the sun side (lighter)
  ctx.restore();

  // atmospheric haze veil over far layers (paint after, no blur needed)
  if(layer.haze>0){
    ctx.save();
    if(layer.blur>0)ctx.filter='blur('+(layer.blur*0.6)+'px)';
    const hz=ctx.createLinearGradient(0,yBase-ampPx,0,yBase+ampPx*1.2);
    hz.addColorStop(0,'rgba(210,158,128,'+(layer.haze*0.55)+')');
    hz.addColorStop(1,'rgba(180,120,110,0)');
    ctx.beginPath();
    ctx.moveTo(-20,H+20);
    for(let x=-20;x<=W+20;x+=step){
      const nx=(x+off)*layer.freq+layer.seed;
      const y=yBase - fbm(nx)*ampPx - fbm(nx*0.37+9.0)*ampPx*0.55;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(W+20,H+20);ctx.closePath();
    ctx.fillStyle=hz;ctx.fill();
    ctx.restore();
  }
  return firstY;
}

function shade(hex,f){
  const c=hex.replace('#','');
  let r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  r=Math.min(255,r*f)|0;g=Math.min(255,g*f)|0;b=Math.min(255,b*f)|0;
  return 'rgb('+r+','+g+','+b+')';
}

/* ---------- motes ---------- */
function drawMotes(){
  for(const m of motes){
    m.x+=m.vx*0.016 + Math.cos(m.drift)*m.driftAmp*0.012;
    m.y+=m.vy*0.016;
    m.drift+=m.driftSp*0.016;
    if(m.y<-30||m.x<-40||m.x>W+40){
      Object.assign(m,makeMote());
      m.y=H+20;
    }
    ctx.save();
    if(m.blur>0)ctx.filter='blur('+m.blur+'px)';
    const col=m.warm?'255,224,182':'236,206,206';
    const g=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r);
    g.addColorStop(0,'rgba('+col+','+m.glow+')');
    g.addColorStop(0.5,'rgba('+col+','+(m.glow*0.45)+')');
    g.addColorStop(1,'rgba('+col+',0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,TAU);ctx.fill();
    // crisp tiny core for near ones (the "disc" feel)
    if(m.depth>0.55&&m.blur<3){
      ctx.filter='none';
      ctx.fillStyle='rgba('+col+','+(m.glow*0.6)+')';
      ctx.beginPath();ctx.arc(m.x,m.y,m.r*0.22,0,TAU);ctx.fill();
    }
    ctx.restore();
  }
}

/* ---------- birds ---------- */
function drawBird(b){
  b.x+=b.dir*b.sp*0.016;
  b.flap+=b.flapSp*0.016;
  b.bob+=b.bobSp*0.016;
  if(b.dir>0&&b.x>W+60){b.x=-60;b.y=H*0.16+Math.random()*H*0.42;}
  if(b.dir<0&&b.x<-60){b.x=W+60;b.y=H*0.16+Math.random()*H*0.42;}
  const yy=b.y+Math.sin(b.bob)*b.bobAmp;
  const s=b.sz;
  const flap=Math.sin(b.flap)*0.5+0.5; // 0..1 wing raise
  const wingUp=s*(0.25+flap*0.55);
  ctx.save();
  ctx.translate(b.x,yy);
  ctx.scale(b.dir,1);
  const blur=(1-b.depth)*4;
  if(blur>0.4)ctx.filter='blur('+blur+'px)';
  ctx.strokeStyle='rgba(46,30,38,'+(0.35+b.depth*0.5)+')';
  ctx.lineWidth=Math.max(1,s*0.10);
  ctx.lineCap='round';
  ctx.beginPath();
  // simple V silhouette with curved wings
  ctx.moveTo(-s*0.9, wingUp);
  ctx.quadraticCurveTo(-s*0.35, -wingUp*0.5, 0, 0);
  ctx.quadraticCurveTo( s*0.35, -wingUp*0.5, s*0.9, wingUp);
  ctx.stroke();
  ctx.restore();
}

/* ---------- overall soft vignette + grain ---------- */
function postFx(){
  // warm vignette
  const vg=ctx.createRadialGradient(W*0.6,H*0.55,Math.min(W,H)*0.2,W*0.5,H*0.5,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(0.7,'rgba(30,15,25,0.12)');
  vg.addColorStop(1,'rgba(20,10,22,0.46)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  // subtle top-color wash to unify
  const wash=ctx.createLinearGradient(0,0,0,H);
  wash.addColorStop(0,'rgba(50,30,60,0.10)');
  wash.addColorStop(0.6,'rgba(200,140,100,0)');
  wash.addColorStop(1,'rgba(60,35,40,0.10)');
  ctx.fillStyle=wash;ctx.fillRect(0,0,W,H);

  // animated grain
  ctx.save();
  ctx.globalAlpha=0.85;
  const gs=grain.width;
  const ox=(Math.random()*gs)|0, oy=(Math.random()*gs)|0;
  const p=ctx.createPattern(grain,'repeat');
  ctx.fillStyle=p;
  ctx.translate(-ox,-oy);
  ctx.fillRect(ox,oy,W+gs,H+gs);
  ctx.restore();
}

/* ---------- frame ---------- */
function frame(ts){
  requestAnimationFrame(frame);
  const nt=ts/1000;
  const dt=Math.min(0.05,Math.max(0.001,nt-last));
  last=nt;
  t=nt;

  ctx.setTransform(dpr,0,0,dpr,0,0);
  // sky
  ctx.drawImage(sky,0,0,W,H);
  // far drifting motes (behind dunes? keep some in air above all dunes)
  // dunes far->near
  for(let i=0;i<dunes.length;i++){
    if(i===1){ // birds glide above mid-distance, in front of far dunes
      ctx.filter='none';
      for(const b of birds)drawBird(b);
    }
    drawDune(dunes[i]);
  }
  ctx.filter='none';
  // motes float in the air in front of dunes (depth-sorted near last)
  drawMotes();
  ctx.filter='none';
  postFx();
}

/* ---------- interaction: puff of motes on click ---------- */
canvas.addEventListener('pointerdown',e=>{
  const x=e.clientX,y=e.clientY;
  for(let i=0;i<10;i++){
    const m=makeMote();
    m.x=x+(Math.random()-0.5)*30;
    m.y=y+(Math.random()-0.5)*30;
    m.vy=-(10+Math.random()*20);
    m.vx=(Math.random()-0.5)*30;
    m.depth=0.4+Math.random()*0.5;
    m.r=4+Math.random()*12;
    m.glow=0.3+Math.random()*0.3;
    m.blur=Math.random()*5;
    motes.push(m);
  }
  if(motes.length>600)motes.splice(0,10);
  cap.style.opacity=0;title.style.opacity=0;
});

/* ---------- resize ---------- */
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  buildDunes();buildMotes();buildBirds();buildGrain();paintSky();
}
window.addEventListener('resize',()=>{clearTimeout(resize._t);resize._t=setTimeout(resize,150);});

resize();
setTimeout(()=>{cap.style.opacity=0.0;},12000);
// keep caption visible a while then fade handled above; restore on load subtle
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
