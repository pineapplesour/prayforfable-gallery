<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>湖の初雪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 폰트는 비차단 로드: 오프라인/실패해도 씬 첫 페인트가 막히지 않는다(모노 폴백) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" media="print" onload="this.media='all'">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0c1417;}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;}
  #cap{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    color:rgba(225,234,236,.62);
    font:300 11px/1.5 "JetBrains Mono",ui-monospace,monospace;
    letter-spacing:.30em;
    background:rgba(12,20,23,.30);padding:7px 18px;border-radius:99px;
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    pointer-events:none;white-space:nowrap;
    box-shadow:0 0 0 1px rgba(255,255,255,.04) inset;
    user-select:none;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="cap">湖面に触れる ─ 初雪、ひそやかに</div>
<script>
'use strict';
(()=>{
const TAU=Math.PI*2;
const cv=document.getElementById('scene');
const cap=document.getElementById('cap');
const ctx=cv.getContext('2d',{alpha:false});

let W=0,H=0,DPR=1,T=0,last=0;

/* ---------- 정적 깊이 레이어(탁한 호수 바닥/심도) ---------- */
const depthCan=document.createElement('canvas');
const dctx=depthCan.getContext('2d');
const grainCan=document.createElement('canvas');
const gctx=grainCan.getContext('2d');

const rnd=(a,b)=>a+Math.random()*(b-a);

/* 잠긴 형상(수초·돌·얼음 그림자) — 깊이별로 흐릿하게 */
let blobs=[];
function buildDepth(){
  const w=W,h=H;
  depthCan.width=Math.max(2,Math.round(w*DPR));
  depthCan.height=Math.max(2,Math.round(h*DPR));
  dctx.setTransform(DPR,0,0,DPR,0,0);
  /* 위에서 본 탁한 겨울 물 — 차가운 청록-회색 방사 그라데이션 */
  const g=dctx.createRadialGradient(w*0.42,h*0.36,0,w*0.5,h*0.52,Math.max(w,h)*0.85);
  g.addColorStop(0,'#3a4f53');
  g.addColorStop(0.42,'#2c4145');
  g.addColorStop(0.74,'#21333a');
  g.addColorStop(1,'#16242b');
  dctx.fillStyle=g;dctx.fillRect(0,0,w,h);

  /* 어두운 심도 패치 — 깊은 곳 */
  for(let i=0;i<10;i++){
    const x=rnd(0,w),y=rnd(0,h),r=rnd(90,260);
    const ag=dctx.createRadialGradient(x,y,0,x,y,r);
    ag.addColorStop(0,'rgba(12,24,28,0.34)');
    ag.addColorStop(1,'rgba(12,24,28,0)');
    dctx.fillStyle=ag;dctx.beginPath();dctx.arc(x,y,r,0,TAU);dctx.fill();
  }
  /* 옅은 한기 하이라이트 패치 — 얼음 빛 */
  for(let i=0;i<6;i++){
    const x=rnd(0,w),y=rnd(0,h*0.7),r=rnd(120,300);
    const ag=dctx.createRadialGradient(x,y,0,x,y,r);
    ag.addColorStop(0,'rgba(150,182,188,0.06)');
    ag.addColorStop(1,'rgba(150,182,188,0)');
    dctx.fillStyle=ag;dctx.beginPath();dctx.arc(x,y,r,0,TAU);dctx.fill();
  }

  /* 잠긴 흐릿한 형상(수초 덩어리/잠긴 가지) — depth blur */
  blobs=[];
  const N=Math.max(7,Math.round(w*h/120000));
  for(let i=0;i<N;i++){
    blobs.push({
      x:rnd(0,w),y:rnd(0,h),
      r:rnd(40,140),
      depth:rnd(0,1),
      rot:rnd(0,TAU),
      el:rnd(0.45,0.9)
    });
  }
  for(const b of blobs){
    dctx.save();
    dctx.translate(b.x,b.y);dctx.rotate(b.rot);
    const blur=2+b.depth*9;
    dctx.filter='blur('+blur.toFixed(1)+'px)';
    const al=0.10+(1-b.depth)*0.16;
    const dark=dctx.createRadialGradient(0,0,0,0,0,b.r);
    dark.addColorStop(0,'rgba(20,38,34,'+al.toFixed(3)+')');
    dark.addColorStop(0.7,'rgba(20,38,34,'+(al*0.5).toFixed(3)+')');
    dark.addColorStop(1,'rgba(20,38,34,0)');
    dctx.fillStyle=dark;
    dctx.beginPath();dctx.ellipse(0,0,b.r,b.r*b.el,0,0,TAU);dctx.fill();
    dctx.restore();
  }
  dctx.filter='none';

  /* 미세 침전물 점묘(탁함) */
  dctx.save();
  for(let i=0;i<2600;i++){
    const x=rnd(0,w),y=rnd(0,h),r=rnd(0.3,1.6);
    dctx.fillStyle=Math.random()<0.5
      ?'rgba(190,212,214,'+(Math.random()*0.05).toFixed(3)+')'
      :'rgba(8,18,20,'+(Math.random()*0.11).toFixed(3)+')';
    dctx.beginPath();dctx.arc(x,y,r,0,TAU);dctx.fill();
  }
  dctx.restore();
}

/* 미세 노이즈 그레인 타일 */
function buildGrain(){
  const s=160;
  grainCan.width=s;grainCan.height=s;
  const id=gctx.createImageData(s,s);
  const d=id.data;
  for(let i=0;i<d.length;i+=4){
    const v=(Math.random()*255)|0;
    d[i]=d[i+1]=d[i+2]=v;
    d[i+3]=Math.random()*16;
  }
  gctx.putImageData(id,0,0);
}

/* ---------- 떠다니는 눈송이 디스크(bokeh, 깊이별) ---------- */
let flakes=[];
function buildFlakes(){
  flakes=[];
  const N=Math.round(Math.min(150,Math.max(46,W*H/14000)));
  for(let i=0;i<N;i++){
    const depth=Math.random();       // 0=가까움(크고 흐림), 1=멈
    flakes.push({
      x:rnd(0,W),y:rnd(0,H),
      depth,
      r:(1-depth)*9+2.2,
      drift:rnd(-1,1)*(1-depth)*5,    // 가로 표류 속도
      fall:(1-depth)*5+1.6,           // 천천히 가라앉음(수면 위 표류)
      sway:rnd(0,TAU),
      swayA:rnd(8,26)*(1-depth*0.6),
      swaySp:rnd(0.10,0.30),
      op:0.16+(1-depth)*0.5,
      spin:rnd(0,TAU),spinSp:rnd(-0.3,0.3)
    });
  }
  flakes.sort((a,b)=>b.depth-a.depth); // 먼 것 먼저(뒤에) 그림
}

/* ---------- 수면에 닿아 퍼지는 잔물결(녹는 눈) ---------- */
let ripples=[];
function addRipple(x,y,r0,life){
  ripples.push({x,y,r:r0,max:r0+rnd(40,90),t:0,life:life||rnd(3.2,5.5)});
  if(ripples.length>60)ripples.shift();
}

/* ---------- 차가운 물속을 미끄러지는 그림자 물고기(겨울 코이) ---------- */
function fishPalette(type){
  if(type==='pale')   return{core:'rgba(196,210,206,',mid:'rgba(150,170,170,',edge:'rgba(96,118,120,'};
  if(type==='dusk')   return{core:'rgba(120,142,144,',mid:'rgba(78,100,104,',edge:'rgba(44,64,68,'};
  if(type==='emberg') return{core:'rgba(200,158,128,',mid:'rgba(160,112,82,',edge:'rgba(104,66,46,'}; // 흐릿한 잔불빛 한 마리(포인트)
  return{core:'rgba(170,188,186,',mid:'rgba(118,140,140,',edge:'rgba(70,92,94,'};
}
let fishes=[];
function makeFish(type,len){
  const pal=fishPalette(type);
  return{
    x:rnd(W*0.15,W*0.85),y:rnd(H*0.15,H*0.85),
    a:rnd(0,TAU),len,type,
    phase:rnd(0,10),speed:14,spT:rnd(16,26),turn:0,changeT:rnd(0,3),
    depth:rnd(0.25,0.95),  // 깊을수록 흐리고 어두움
    wakeT:rnd(0,0.4),
    pal
  };
}
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;};

function updateFish(f,dt){
  f.changeT-=dt;
  if(f.changeT<=0){
    f.spT=10+Math.random()*22;
    if(Math.random()<0.12)f.spT=34+Math.random()*16;
    f.changeT=2.5+Math.random()*5;
  }
  f.turn+=(Math.random()-0.5)*2.0*dt;
  f.turn*=Math.exp(-dt*1.3);
  let ta=f.a+f.turn;
  const m=Math.min(W,H)*0.10+40;
  if(f.x<m||f.y<m||f.x>W-m||f.y>H-m)
    ta=Math.atan2(H*0.5-f.y,W*0.5-f.x);
  const da=angDiff(ta,f.a);
  const mt=0.9*dt;
  f.a+=Math.max(-mt,Math.min(mt,da));
  f.speed+=(f.spT-f.speed)*Math.min(1,dt*1.5);
  f.x+=Math.cos(f.a)*f.speed*dt;
  f.y+=Math.sin(f.a)*f.speed*dt;
  f.x=Math.max(16,Math.min(W-16,f.x));
  f.y=Math.max(16,Math.min(H-16,f.y));
  f.phase+=dt*(2.0+f.speed*0.05)*2.0;
  /* 가끔 수면에 살짝 닿으며 미세 파문 */
  f.wakeT-=dt;
  if(f.wakeT<=0&&f.depth<0.5&&f.speed>16){
    addRipple(f.x+Math.cos(f.a)*f.len*0.3,f.y+Math.sin(f.a)*f.len*0.3,3,rnd(2.0,3.2));
    f.wakeT=1.4+Math.random()*1.6;
  }
}

function drawFish(c,f){
  const L=f.len;
  const fade=0.20+(1-f.depth)*0.55;   // 깊을수록 흐릿
  const blur=f.depth*7+1.2;
  c.save();
  c.filter='blur('+blur.toFixed(1)+'px)';
  c.translate(f.x,f.y);c.rotate(f.a);
  const segs=14,pts=[];
  const amp=L*(0.05+0.05*Math.min(1,f.speed/40));
  for(let i=0;i<=segs;i++){
    const s=i/segs;
    pts.push({x:L*0.46-s*L*0.92,y:Math.sin(f.phase-s*4.0)*amp*Math.pow(s,1.4),s});
  }
  const wmax=L*0.15;
  const wf=s=>wmax*Math.pow(Math.sin(Math.PI*Math.min(0.10+s*0.90,1)),0.85)*(1-0.55*s)+L*0.02;

  /* 꼬리(부드러운 페이드) */
  const tp=pts[segs],tq=pts[segs-1];
  const tang=Math.atan2(tp.y-tq.y,tp.x-tq.x);
  c.save();c.translate(tp.x,tp.y);c.rotate(tang);
  const tl=L*0.6, sw=Math.sin(f.phase-5.0)*tl*0.26;
  const tg=c.createRadialGradient(0,0,tl*0.05,0,0,tl);
  tg.addColorStop(0,f.pal.mid+(fade*0.7).toFixed(3)+')');
  tg.addColorStop(0.6,f.pal.edge+(fade*0.4).toFixed(3)+')');
  tg.addColorStop(1,f.pal.edge+'0)');
  c.fillStyle=tg;
  const lobe=(len,spread,s2)=>{
    c.beginPath();c.moveTo(0,0);
    c.bezierCurveTo(len*0.32,spread*0.06+s2*0.2,len*0.72,(spread+s2)*0.6,len,spread+s2);
    c.bezierCurveTo(len*0.78,(spread+s2)*0.98,len*0.30,spread*0.55+s2*0.25,0,0);
    c.closePath();c.fill();
  };
  lobe(tl,tl*0.5,sw);
  lobe(tl,-tl*0.5,sw*0.85);
  c.restore();

  /* 가슴지느러미 */
  const pp=pts[5],wp=wf(pts[5].s);
  const fl=Math.sin(f.phase*1.1)*0.2;
  c.fillStyle=f.pal.mid+(fade*0.35).toFixed(3)+')';
  const fin=(x,y,ang,len,flip)=>{
    c.save();c.translate(x,y);c.rotate(ang);if(flip)c.scale(1,-1);
    c.beginPath();c.moveTo(0,0);
    c.quadraticCurveTo(len*0.55,-len*0.10,len,len*0.22);
    c.quadraticCurveTo(len*0.45,len*0.34,0,0);c.closePath();c.fill();c.restore();
  };
  fin(pp.x,pp.y+wp*0.85,2.3+fl,L*0.22,false);
  fin(pp.x,pp.y-wp*0.85,-2.3-fl,L*0.22,true);

  /* 몸통 윤곽 */
  const top=[],bot=[];
  for(let i=0;i<pts.length;i++){
    const p=pts[i];
    const pa=pts[Math.max(0,i-1)],pb=pts[Math.min(pts.length-1,i+1)];
    let dx=pb.x-pa.x,dy=pb.y-pa.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
    const w=wf(p.s);
    top.push({x:p.x-dy*w,y:p.y+dx*w});
    bot.push({x:p.x+dy*w,y:p.y-dx*w});
  }
  const path=()=>{
    c.beginPath();c.moveTo(top[0].x,top[0].y);
    for(let i=1;i<top.length;i++)c.lineTo(top[i].x,top[i].y);
    for(let i=bot.length-1;i>=0;i--)c.lineTo(bot[i].x,bot[i].y);
    c.quadraticCurveTo(pts[0].x+L*0.16,pts[0].y,top[0].x,top[0].y);c.closePath();
  };
  const bg=c.createRadialGradient(L*0.12,0,L*0.05,L*0.05,0,L*0.6);
  bg.addColorStop(0,f.pal.core+fade.toFixed(3)+')');
  bg.addColorStop(0.55,f.pal.mid+fade.toFixed(3)+')');
  bg.addColorStop(1,f.pal.edge+(fade*0.85).toFixed(3)+')');
  path();c.fillStyle=bg;c.fill();

  /* 잔불빛 한 마리 등 얼룩(아주 흐리게) */
  if(f.type==='emberg'){
    c.save();path();c.clip();
    c.fillStyle='rgba(214,150,104,'+(fade*0.5).toFixed(3)+')';
    c.beginPath();c.ellipse(L*0.10,0,L*0.18,L*0.10,0,0,TAU);c.fill();
    c.restore();
  }

  /* 등 미세 하이라이트 */
  c.save();path();c.clip();
  const hg=c.createRadialGradient(L*0.15,0,0,L*0.10,0,L*0.5);
  hg.addColorStop(0,'rgba(232,242,242,'+(fade*0.28).toFixed(3)+')');
  hg.addColorStop(1,'rgba(232,242,242,0)');
  c.fillStyle=hg;c.beginPath();c.ellipse(L*0.10,0,L*0.42,wmax*0.55,0,0,TAU);c.fill();
  c.restore();
  c.restore();
}

/* ---------- 그리기 루프 ---------- */
function draw(t){
  /* 정적 깊이 배경 */
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(depthCan,0,0,W,H);
  ctx.setTransform(DPR,0,0,DPR,0,0);

  /* 아주 느린 수면 빛 흔들림(글로벌) — 차가운 색조 오버레이 */
  const shimX=Math.sin(t*0.07)*W*0.04;
  const shimY=Math.cos(t*0.05)*H*0.04;
  const sg=ctx.createRadialGradient(
    W*0.5+shimX,H*0.42+shimY,0,
    W*0.5+shimX,H*0.5+shimY,Math.max(W,H)*0.7);
  sg.addColorStop(0,'rgba(120,150,156,0.05)');
  sg.addColorStop(1,'rgba(8,18,22,0.04)');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);

  /* 물고기(배경 깊이층) */
  for(const f of fishes)drawFish(ctx,f);
  ctx.filter='none';

  /* 잔물결(녹는 눈 / 물고기 자취) */
  for(const r of ripples){
    const k=r.t/r.life;            // 0..1
    const rad=r.r+(r.max-r.r)*Math.pow(k,0.6);
    const a=(1-k)*0.22;
    if(a<=0)continue;
    ctx.lineWidth=1.1;
    ctx.strokeStyle='rgba(214,230,232,'+a.toFixed(3)+')';
    ctx.beginPath();ctx.arc(r.x,r.y,rad,0,TAU);ctx.stroke();
    if(k<0.5){
      ctx.strokeStyle='rgba(214,230,232,'+(a*0.5).toFixed(3)+')';
      ctx.beginPath();ctx.arc(r.x,r.y,rad*0.62,0,TAU);ctx.stroke();
    }
  }

  /* 떠다니는 눈송이 디스크(bokeh) */
  for(const fk of flakes){
    const sx=fk.x+Math.sin(fk.sway)*fk.swayA;
    const sy=fk.y;
    ctx.save();
    const blur=fk.depth*4.5+0.4;
    ctx.filter=blur>0.6?'blur('+blur.toFixed(1)+'px)':'none';
    const g=ctx.createRadialGradient(sx,sy,0,sx,sy,fk.r);
    g.addColorStop(0,'rgba(238,246,247,'+fk.op.toFixed(3)+')');
    g.addColorStop(0.55,'rgba(220,234,236,'+(fk.op*0.55).toFixed(3)+')');
    g.addColorStop(1,'rgba(220,234,236,0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(sx,sy,fk.r,0,TAU);ctx.fill();
    ctx.restore();
  }
  ctx.filter='none';

  /* 미세 노이즈 그레인 */
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha=0.5;
  const gx=(t*7)%160, gy=(t*5)%160;
  for(let x=-160;x<cv.width;x+=160)
    for(let y=-160;y<cv.height;y+=160)
      ctx.drawImage(grainCan,x-gx,y-gy);
  ctx.globalAlpha=1;
  ctx.setTransform(DPR,0,0,DPR,0,0);

  /* 가장자리 비네팅(고요·집중) */
  const vg=ctx.createRadialGradient(W*0.5,H*0.5,Math.min(W,H)*0.32,W*0.5,H*0.5,Math.max(W,H)*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(4,10,13,0.55)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

function update(dt,t){
  for(const f of fishes)updateFish(f,dt);
  /* 눈 표류/녹음 */
  for(const fk of flakes){
    fk.sway+=fk.swaySp*dt;
    fk.x+=fk.drift*dt*0.4;
    fk.y+=fk.fall*dt*0.5;
    fk.spin+=fk.spinSp*dt;
    if(fk.y-fk.r>H+8){            // 수면에 닿아 녹음 → 잔물결 후 재생성 위
      if(fk.depth<0.55&&Math.random()<0.6)
        addRipple(fk.x,H-rnd(0,H*0.4),fk.r*0.6,rnd(2.5,4.5));
      fk.y=-fk.r-rnd(0,40);
      fk.x=rnd(0,W);
    }
    if(fk.x<-30)fk.x=W+20;else if(fk.x>W+30)fk.x=-20;
  }
  /* 잔물결 수명 */
  for(let i=ripples.length-1;i>=0;i--){
    ripples[i].t+=dt;
    if(ripples[i].t>=ripples[i].life)ripples.splice(i,1);
  }
}

/* 앰비언트: 가끔 어딘가 눈이 수면에 닿는 잔물결 */
let ambT=2.0;

function frame(ts){
  requestAnimationFrame(frame);
  const t=ts/1000;
  const dt=Math.min(0.05,Math.max(0.001,t-last));
  last=t;T=t;
  ambT-=dt;
  if(ambT<=0){
    addRipple(rnd(W*0.08,W*0.92),rnd(H*0.08,H*0.92),3,rnd(3.5,5.5));
    ambT=1.6+Math.random()*2.6;
  }
  update(dt,t);
  draw(t);
}

/* ---------- 레이아웃 / 입력 ---------- */
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*DPR);
  cv.height=Math.round(H*DPR);
  buildDepth();
  buildFlakes();
  for(const f of fishes){
    f.x=Math.max(30,Math.min(W-30,f.x));
    f.y=Math.max(30,Math.min(H-30,f.y));
  }
}
window.addEventListener('resize',resize);

cv.addEventListener('pointerdown',e=>{
