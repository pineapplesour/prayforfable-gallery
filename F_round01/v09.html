<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>蛍の草原</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#070b0a;}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #cap{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
    color:rgba(214,226,200,.62);
    font:11px/1.6 "Space Mono","Courier New",monospace;
    letter-spacing:.30em;text-transform:lowercase;
    background:rgba(8,16,12,.30);padding:7px 20px;border-radius:99px;
    -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
    pointer-events:none;white-space:nowrap;transition:opacity 2s;user-select:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">a meadow remembers the light</div>
<script>
'use strict';
(()=>{
const TAU=Math.PI*2;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});
const cap=document.getElementById('cap');

let W=0,H=0,dpr=1;
const rnd=(a=1,b=0)=>b+Math.random()*(a-b);

/* ---- layered offscreen buffers (painterly depth) ---- */
const bgCan=document.createElement('canvas'),bgx=bgCan.getContext('2d');     // static painted background
const grassFarCan=document.createElement('canvas'),gfx=grassFarCan.getContext('2d'); // blurred far grass (static)
const noiseCan=document.createElement('canvas'),nx=noiseCan.getContext('2d'); // grain tile
const sceneCan=document.createElement('canvas'),sx=sceneCan.getContext('2d'); // composite at css res for cheap blur reuse

/* ---- entities ---- */
let bokeh=[];     // floating blurred depth discs (the "water-drop discs")
let fireflies=[]; // the "swimming koi" -> drifting glowing fireflies
let grass=[];     // foreground swaying blades
let pollen=[];    // tiny drifting motes (the micro floating specks)

/* ---------- painted static background ---------- */
function paintBackground(){
  const w=W,h=H,c=bgx;
  bgCan.width=w;bgCan.height=h;
  // vertical night gradient: deep teal-night sky -> muted mossy ground
  const g=c.createLinearGradient(0,0,0,h);
  g.addColorStop(0.00,'#0c1518');
  g.addColorStop(0.34,'#13201c');
  g.addColorStop(0.62,'#1a2a1f');
  g.addColorStop(0.84,'#1d2c1d');
  g.addColorStop(1.00,'#141f14');
  c.fillStyle=g;c.fillRect(0,0,w,h);
  // soft moon-glow bloom upper-left (muted)
  const mg=c.createRadialGradient(w*0.26,h*0.18,0,w*0.26,h*0.18,Math.max(w,h)*0.62);
  mg.addColorStop(0,'rgba(150,180,150,0.16)');
  mg.addColorStop(0.4,'rgba(110,150,130,0.06)');
  mg.addColorStop(1,'rgba(110,150,130,0)');
  c.fillStyle=mg;c.fillRect(0,0,w,h);
  // mist patches near the horizon line for atmospheric depth
  for(let i=0;i<7;i++){
    const x=rnd(w),y=h*(0.40+Math.random()*0.30),r=Math.max(w,h)*(0.18+Math.random()*0.22);
    const ag=c.createRadialGradient(x,y,0,x,y,r);
    ag.addColorStop(0,'rgba(120,150,135,0.07)');
    ag.addColorStop(1,'rgba(120,150,135,0)');
    c.fillStyle=ag;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
  }
  // grounding shadow at the very bottom (depth)
  const sg=c.createLinearGradient(0,h*0.7,0,h);
  sg.addColorStop(0,'rgba(6,12,8,0)');
  sg.addColorStop(1,'rgba(6,12,8,0.55)');
  c.fillStyle=sg;c.fillRect(0,h*0.7,w,h*0.3);
}

/* ---------- blurred far-grass silhouette band (static, painterly) ---------- */
function paintFarGrass(){
  const w=W,h=H,c=gfx;
  grassFarCan.width=w;grassFarCan.height=h;
  c.clearRect(0,0,w,h);
  c.save();
  c.filter='blur('+Math.max(3,Math.round(Math.min(w,h)*0.012))+'px)';
  const baseY=h*0.74;
  const n=Math.round(w/14)+18;
  for(let i=0;i<n;i++){
    const x=rnd(w);
    const bh=rnd(h*0.30,h*0.10);
    const lean=rnd(28,-28);
    const wd=rnd(9,3);
    const shade=12+Math.random()*16;
    c.fillStyle='rgba('+(shade)+','+(shade+10)+','+(shade)+',0.55)';
    c.beginPath();
    c.moveTo(x-wd,baseY+rnd(h*0.18,0));
    c.quadraticCurveTo(x+lean*0.5,baseY-bh*0.6,x+lean,baseY-bh);
    c.quadraticCurveTo(x+lean*0.5+wd,baseY-bh*0.6,x+wd,baseY+rnd(h*0.18,0));
    c.closePath();c.fill();
  }
  c.restore();
}

/* ---------- noise grain tile ---------- */
function buildNoise(){
  const s=160;noiseCan.width=s;noiseCan.height=s;
  const img=nx.createImageData(s,s);
  const d=img.data;
  for(let i=0;i<d.length;i+=4){
    const v=Math.random()*255;
    d[i]=d[i+1]=d[i+2]=v;
    d[i+3]=Math.random()*18; // very subtle
  }
  nx.putImageData(img,0,0);
}

/* ---------- entity spawns ---------- */
function spawnBokeh(){
  bokeh=[];
  const count=Math.round((W*H)/95000)+7;
  for(let i=0;i<count;i++){
    const depth=Math.random();              // 0 far(small,faint) .. 1 near(big,blurry,bright)
    const r=rnd(10,3)+depth*rnd(70,22);
    bokeh.push({
      x:rnd(W),y:rnd(H),r,
      depth,
      hue:rnd(108,72),                       // green-yellow muted
      alpha:(0.05+depth*0.16)*rnd(1.1,0.7),
      vx:rnd(0.10,-0.10)*(0.4+depth),
      vy:rnd(0.02,-0.10)*(0.4+depth),        // gentle upward drift
      ph:rnd(TAU),pulse:rnd(0.5,0.18),
      sway:rnd(0.4,0.12)
    });
  }
  bokeh.sort((a,b)=>a.depth-b.depth);
}

function spawnFireflies(){
  fireflies=[];
  const count=Math.round((W*H)/52000)+9;
  for(let i=0;i<count;i++){
    const depth=Math.random();
    fireflies.push({
      x:rnd(W),y:rnd(H*0.92,H*0.05),
      depth,
      r:1.1+depth*2.6,
      glow:(7+depth*22),
      hue:rnd(95,58),
      // smooth wandering via two oscillators + slow heading
      a:rnd(TAU),
      sp:(6+depth*14),
      t1:rnd(TAU),t2:rnd(TAU),
      f1:rnd(0.6,0.2),f2:rnd(1.1,0.4),
      blinkPh:rnd(TAU),
      blinkSp:rnd(1.2,0.45),
      // trail memory
      trail:[],
      bright:0
    });
  }
  fireflies.sort((a,b)=>a.depth-b.depth);
}

function spawnGrass(){
  grass=[];
  const baseY=H*1.02;
  const n=Math.round(W/22)+10;
  for(let i=0;i<n;i++){
    grass.push({
      x:rnd(W*1.04,-W*0.02),
      h:rnd(H*0.42,H*0.16),
      w:rnd(7,3),
      lean:rnd(34,-34),
      shade:10+Math.random()*14,
      ph:rnd(TAU),
      swSp:rnd(0.6,0.25),
      swAmp:rnd(16,6),
      baseY
    });
  }
}

function spawnPollen(){
  pollen=[];
  const count=Math.round((W*H)/16000)+20;
  for(let i=0;i<count;i++){
    pollen.push({
      x:rnd(W),y:rnd(H),
      r:rnd(1.4,0.4),
      vx:rnd(0.18,-0.18),
      vy:rnd(-0.05,-0.30),
      alpha:rnd(0.22,0.05),
      ph:rnd(TAU),swSp:rnd(1.4,0.4),swAmp:rnd(0.6,0.15)
    });
  }
}

/* ---------- update ---------- */
function update(dt,t){
  // bokeh slow drift + wrap
  for(const b of bokeh){
    b.x+=b.vx+Math.sin(t*b.sway+b.ph)*0.10;
    b.y+=b.vy;
    if(b.y<-b.r) {b.y=H+b.r;b.x=rnd(W);}
    if(b.x<-b.r) b.x=W+b.r; else if(b.x>W+b.r) b.x=-b.r;
  }
  // fireflies smooth wander
  for(const f of fireflies){
    f.t1+=dt*f.f1;f.t2+=dt*f.f2;
    const driftA=Math.sin(f.t1)*1.0+Math.cos(f.t2*0.7)*0.7;
    f.a+=driftA*dt*0.9;
    f.x+=Math.cos(f.a)*f.sp*dt + Math.sin(f.t2)*4*dt;
    f.y+=Math.sin(f.a)*f.sp*dt*0.7 - Math.cos(f.t1*0.8)*3*dt;
    // gentle bounds steer back toward center
    const m=W*0.06;
    if(f.x<m||f.x>W-m||f.y<H*0.04||f.y>H*0.96){
      const ta=Math.atan2(H*0.5-f.y,W*0.5-f.x);
      let d=ta-f.a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;
      f.a+=d*Math.min(1,dt*2.4);
      f.x=Math.max(2,Math.min(W-2,f.x));
      f.y=Math.max(2,Math.min(H-2,f.y));
    }
    // breathing blink: stays mostly lit, occasionally dims (organic)
    f.blinkPh+=dt*f.blinkSp;
    const base=0.55+0.45*Math.sin(f.blinkPh);
    f.bright=0.30+0.70*Math.max(0,base);
    // trail
    f.trail.push({x:f.x,y:f.y});
    if(f.trail.length>14)f.trail.shift();
  }
  for(const p of pollen){
    p.x+=p.vx+Math.sin(t*p.swSp+p.ph)*p.swAmp;
    p.y+=p.vy;
    if(p.y<-4){p.y=H+4;p.x=rnd(W);}
    if(p.x<-4)p.x=W+4;else if(p.x>W+4)p.x=-4;
  }
}

/* ---------- render ---------- */
let noiseShift=0;
function render(t){
  const c=sx;
  sceneCan.width!==W&&(sceneCan.width=W);
  sceneCan.height!==H&&(sceneCan.height=H);

  // base painted bg
  c.globalCompositeOperation='source-over';
  c.globalAlpha=1;
  c.clearRect(0,0,W,H);
  c.drawImage(bgCan,0,0);

  // far blurred bokeh first (depth) — additive soft glow, low depth
  c.globalCompositeOperation='lighter';
  for(const b of bokeh){
    if(b.depth>0.5)continue;
    drawBokeh(c,b,t);
  }
  // far grass band (static blurred silhouette)
  c.globalCompositeOperation='source-over';
  c.drawImage(grassFarCan,0,0);

  // near bokeh (over grass band, bigger, blurrier)
  c.globalCompositeOperation='lighter';
  for(const b of bokeh){
    if(b.depth<=0.5)continue;
    drawBokeh(c,b,t);
  }

  // pollen motes
  for(const p of pollen){
    c.globalAlpha=p.alpha;
    c.fillStyle='rgba(220,230,180,1)';
    c.beginPath();c.arc(p.x,p.y,p.r,0,TAU);c.fill();
  }
  c.globalAlpha=1;

  // fireflies (additive glow + core + trail)
  for(const f of fireflies){
    drawFirefly(c,f);
  }

  // foreground swaying grass (sharp, dark, over everything) -> depth framing
  c.globalCompositeOperation='source-over';
  drawForegroundGrass(c,t);

  // vignette
  c.globalCompositeOperation='source-over';
  const vg=c.createRadialGradient(W*0.5,H*0.46,Math.min(W,H)*0.2,W*0.5,H*0.5,Math.max(W,H)*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(2,6,4,0.55)');
  c.fillStyle=vg;c.fillRect(0,0,W,H);

  // ---- blit scene to main canvas (dpr) ----
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  ctx.drawImage(sceneCan,0,0,W,H);

  // film grain on top, slowly shifting
  noiseShift=(noiseShift+0.37)%160;
  ctx.globalCompositeOperation='overlay';
  ctx.globalAlpha=0.55;
  const tile=noiseCan.width;
  for(let y=-tile;y<H+tile;y+=tile){
    for(let x=-tile;x<W+tile;x+=tile){
      ctx.drawImage(noiseCan,x+ (noiseShift%tile),y+(noiseShift*0.6%tile));
    }
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
}

function drawBokeh(c,b,t){
  const pulse=0.78+0.22*Math.sin(t*b.pulse+b.ph);
  const a=b.alpha*pulse;
  const g=c.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
  const col='hsla('+b.hue+',38%,72%,';
  g.addColorStop(0,col+(a*0.95)+')');
  g.addColorStop(0.55,col+(a*0.45)+')');
  g.addColorStop(0.82,'hsla('+b.hue+',40%,66%,'+(a*0.18)+')');
  g.addColorStop(1,'hsla('+b.hue+',40%,66%,0)');
  c.fillStyle=g;
  c.beginPath();c.arc(b.x,b.y,b.r,0,TAU);c.fill();
  // faint ring for the "disc" read, near ones only
  if(b.depth>0.55){
    c.globalAlpha=a*0.5;
    c.lineWidth=Math.max(1,b.r*0.04);
    c.strokeStyle=col+(0.5)+')';
    c.beginPath();c.arc(b.x,b.y,b.r*0.86,0,TAU);c.stroke();
    c.globalAlpha=1;
  }
}

function drawFirefly(c,f){
  const br=f.bright;
  // trail glow
  c.globalCompositeOperation='lighter';
  for(let i=0;i<f.trail.length;i++){
    const tp=f.trail[i];
    const k=i/f.trail.length;
    const ta=br*k*k*0.20;
    if(ta<0.01)continue;
    const r=f.glow*(0.4+k*0.4);
    const g=c.createRadialGradient(tp.x,tp.y,0,tp.x,tp.y,r);
    g.addColorStop(0,'hsla('+f.hue+',85%,72%,'+ta+')');
    g.addColorStop(1,'hsla('+f.hue+',85%,72%,0)');
    c.fillStyle=g;c.beginPath();c.arc(tp.x,tp.y,r,0,TAU);c.fill();
  }
  // outer halo
  const R=f.glow*(0.9+br*0.6);
  const gg=c.createRadialGradient(f.x,f.y,0,f.x,f.y,R);
  gg.addColorStop(0,'hsla('+f.hue+',90%,78%,'+(0.55*br)+')');
  gg.addColorStop(0.35,'hsla('+f.hue+',88%,66%,'+(0.22*br)+')');
  gg.addColorStop(1,'hsla('+f.hue+',88%,60%,0)');
  c.fillStyle=gg;c.beginPath();c.arc(f.x,f.y,R,0,TAU);c.fill();
  // hot core
  c.fillStyle='rgba(245,255,210,'+(0.9*br)+')';
  c.beginPath();c.arc(f.x,f.y,f.r,0,TAU);c.fill();
  c.globalCompositeOperation='source-over';
}

function drawForegroundGrass(c,t){
  const baseY=H*1.02;
  for(const bl of grass){
    const sway=Math.sin(t*bl.swSp+bl.ph)*bl.swAmp;
    const tipX=bl.x+bl.lean+sway;
    const tipY=baseY-bl.h;
    const g=c.createLinearGradient(bl.x,baseY,tipX,tipY);
    g.addColorStop(0,'rgba('+(bl.shade*0.4)+','+(bl.shade*0.6)+','+(bl.shade*0.4)+',0.96)');
    g.addColorStop(1,'rgba('+(bl.shade+8)+','+(bl.shade+18)+','+(bl.shade+4)+',0.88)');
    c.fillStyle=g;
    c.beginPath();
    c.moveTo(bl.x-bl.w,baseY);
    c.quadraticCurveTo(bl.x+bl.lean*0.45+sway*0.5,baseY-bl.h*0.55,tipX,tipY);
    c.quadraticCurveTo(bl.x+bl.lean*0.45+sway*0.5+bl.w,baseY-bl.h*0.55,bl.x+bl.w,baseY);
    c.closePath();c.fill();
  }
}

/* ---------- resize / loop ---------- */
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  paintBackground();
  paintFarGrass();
  spawnBokeh();
  spawnFireflies();
  spawnGrass();
  spawnPollen();
}
window.addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(resize,150);});

buildNoise();
resize();

// click/tap: gentle local firefly bloom (subtle interaction, optional)
canvas.addEventListener('pointerdown',e=>{
  const x=e.clientX,y=e.clientY;
  for(let i=0;i<3;i++){
    const depth=rnd(1,0.4);
    fireflies.push({
      x:x+rnd(30,-30),y:y+rnd(30,-30),depth,
      r:1.1+depth*2.6,glow:7+depth*22,hue:rnd(95,58),
      a:rnd(TAU),sp:6+depth*14,t1:rnd(TAU),t2:rnd(TAU),
      f1:rnd(0.6,0.2),f2:rnd(1.1,0.4),blinkPh:rnd(TAU),blinkSp:rnd(1.2,0.45),
      trail:[],bright:1
    });
  }
  if(fireflies.length>120)fireflies.splice(0,fireflies.length-120);
  cap.style.opacity=0;
});

let last=performance.now();
function frame(ts){
  requestAnimationFrame(frame);
  const t=ts/1000;
  let dt=(ts-last)/1000;last=ts;
  dt=Math.min(0.05,Math.max(0.001,dt));
  update(dt,t);
  render(t);
}
requestAnimationFrame(frame);

setTimeout(()=>{cap.style.opacity=0.0;},11000);
})();
</script>
</body>
</html>
