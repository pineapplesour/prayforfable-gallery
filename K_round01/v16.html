<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기근연대기.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  body{display:flex;flex-direction:column}
  #titlebar,#menubar,#fbar,#tabs,#statusbar{flex:0 0 auto}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px;white-space:nowrap}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px}
  #namebox{width:64px;min-width:64px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333}
  #fx{width:28px;min-width:28px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #main{position:relative;overflow:hidden;background:#fff;flex:1 1 auto;min-height:0}
  #sheetwrap{position:absolute;inset:0;overflow:hidden;background:#fff}
  #sheet{display:grid;background:#fff}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:10.5px}
  .cell{border-right:1px solid #e6e6e6;border-bottom:1px solid #e6e6e6;
    display:flex;align-items:center;justify-content:center;font-size:11px;
    overflow:hidden;cursor:cell;position:relative}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:3}
  .cell .em{position:absolute;top:0;right:1px;font-size:8px;line-height:8px;opacity:.92}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #ff2d2d}50%{box-shadow:inset 0 0 0 2px #ffb3b3}}
  .war{animation:warf .3s 3}
  @keyframes rev{0%,100%{box-shadow:inset 0 0 0 2px #7c3aed}50%{box-shadow:inset 0 0 0 2px #d8b4fe}}
  .revolt{animation:rev .32s 3}
  /* panels (sheets that aren't the map) */
  #panel{position:absolute;inset:0;background:#fff;overflow:auto;display:none}
  #panelHead{position:sticky;top:0;background:#f5f5f5;border-bottom:1px solid #d0d0d0;
    padding:6px 12px;font-weight:600;color:#107c41;font-size:12px;z-index:2}
  table.x{border-collapse:collapse;width:100%;font-size:11px}
  table.x th{background:#f5f5f5;border:1px solid #d8d8d8;padding:3px 7px;color:#555;
    text-align:left;position:sticky;top:27px;font-weight:600}
  table.x td{border:1px solid #ececec;padding:2px 7px;vertical-align:top;line-height:1.45}
  table.x tr:nth-child(even) td{background:#fafafa}
  .pill{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .dead{color:#a33;text-decoration:line-through;opacity:.7}
  .barwrap{display:inline-block;width:54px;height:8px;background:#eee;border-radius:2px;overflow:hidden;vertical-align:-1px}
  .bar{height:100%}
  /* inspector */
  #legend{position:absolute;top:8px;right:10px;width:222px;background:#fffdf2;border:1px solid #d8c66a;
    box-shadow:2px 4px 12px rgba(0,0,0,.2);padding:9px 11px;font-size:11px;z-index:6;line-height:1.65}
  #legend h4{margin:0 0 4px;font-size:11px;color:#7a6a1f;border-bottom:1px solid #e6d98a;padding-bottom:2px}
  #legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  #legend .small{font-size:10px;color:#766}
  #legend .em{font-size:11px}
  #inspector{position:absolute;left:8px;bottom:8px;width:300px;max-width:calc(100% - 18px);
    background:#ffffff;border:1px solid #bcd;box-shadow:0 4px 14px rgba(0,0,0,.18);
    padding:9px 11px;font-size:11px;z-index:6;line-height:1.6;display:none}
  #inspector h4{margin:0 0 4px;font-size:11.5px;color:#0a5}
  #inspector .row{display:flex;justify-content:space-between;gap:8px}
  #inspector .mem{color:#555;font-size:10.5px;border-top:1px dashed #ddd;margin-top:5px;padding-top:4px}
  #inspector .acts{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
  #inspector button{font-size:10.5px;padding:3px 7px;border:1px solid #bbb;border-radius:3px;
    background:#f7f7f7;cursor:pointer;color:#333}
  #inspector button:hover{background:#107c41;color:#fff;border-color:#107c41}
  #inspector .close{position:absolute;top:5px;right:7px;cursor:pointer;color:#999;font-size:13px}
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 10px;font-size:11px;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 8px;opacity:.45}
  #statusbar #ev{overflow:hidden;text-overflow:ellipsis}
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:18px;
    border-top:1px solid #d4d4d4;font-size:11px}
  #tabs div{padding:3px 11px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  #speed{margin-left:auto;display:flex;align-items:center;gap:4px;padding-right:8px}
  #speed button{font-size:10.5px;padding:1px 7px;border:1px solid #c9c9c9;background:#fff;cursor:pointer;border-radius:3px;color:#444}
  #speed button.on{background:#107c41;color:#fff;border-color:#107c41}
</style>
</head>
<body>
<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <span>기근연대기.xlsx - Excel</span>
</div>
<div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
<div id="fbar">
  <div id="namebox">A1</div>
  <div id="fx">fx</div>
  <div id="formula"></div>
</div>
<div id="main">
  <div id="sheetwrap"><div id="sheet"></div></div>
  <div id="panel"><div id="panelHead"></div><div id="panelBody"></div></div>
  <div id="legend"></div>
  <div id="inspector"></div>
</div>
<div id="tabs">
  <div class="on" data-sheet="map">세계지도</div>
  <div data-sheet="clans">씨족명부</div>
  <div data-sheet="orders">지휘체계</div>
  <div data-sheet="chron">연대기</div>
  <div data-sheet="dead">멸망기록 (0)</div>
  <div id="speed">
    <span style="color:#777">속도</span>
    <button data-spd="0">⏸</button>
    <button data-spd="1" class="on">▶</button>
    <button data-spd="3">▶▶</button>
  </div>
</div>
<div id="statusbar"></div>

<script>
(() => {
"use strict";
// ============================================================
//  기근연대기 — 창발적 AI 문명 시뮬레이션 (엑셀 위장)
//  렌즈: 기근 속 생존 본능. 대본 없음. 매 실행마다 다른 역사.
// ============================================================
const CW = 32, CH = 22;
const COLS = Math.max(16, Math.min(42, Math.floor((innerWidth - 50) / CW)));
const ROWS = Math.max(13, Math.min(30, Math.floor((innerHeight - 168) / CH)));
const N = COLS * ROWS;

const $ = id => document.getElementById(id);
const sheet=$('sheet'), fmla=$('formula'), namebox=$('namebox'),
      statusbar=$('statusbar'), legend=$('legend'), inspector=$('inspector'),
      panel=$('panel'), panelHead=$('panelHead'), panelBody=$('panelBody'),
      sheetwrap=$('sheetwrap');

sheet.style.gridTemplateColumns = `40px repeat(${COLS}, ${CW}px)`;
sheet.style.gridAutoRows = CH + 'px';

// ---- utils ----
const rnd = Math.random;
const ri = n => rnd()*n|0;
const pick = a => a[ri(a.length)];
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
const ref = i => colName(i%COLS)+(((i/COLS)|0)+1);
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}

// ============================================================
//  지형 (값 노이즈) — 비옥도/물/숲/산
// ============================================================
const GW=9, GH=6, gz=[];
for(let i=0;i<GW*GH;i++) gz[i]=rnd();
function noise(x,y){
  const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=gz[y0*GW+x0], b=gz[y0*GW+Math.min(GW-1,x0+1)];
  const c=gz[Math.min(GH-1,y0+1)*GW+x0], d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}
// 비옥도 노이즈 (지형과 독립) — 기근의 핵심
const fz=[]; for(let i=0;i<GW*GH;i++) fz[i]=rnd();
function fertNoise(x,y){
  const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=fz[y0*GW+x0], b=fz[y0*GW+Math.min(GW-1,x0+1)];
  const c=fz[Math.min(GH-1,y0+1)*GW+x0], d=fz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}

// 셀: 지형 + (정주시) 씨족 에이전트
// st: water/forest/mtn/land/ruin
const cells = new Array(N);
for(let i=0;i<N;i++){
  const x=i%COLS, y=i/COLS|0;
  const v=noise(x,y)+(rnd()-.5)*.12;
  let st='land';
  if(v<.30) st='water';
  else if(v>.78) st='mtn';
  else if(v>.60 && rnd()<.6) st='forest';
  // 비옥도 0~1: 물가/숲 가까울수록 높음
  let fert = clamp(fertNoise(x,y)*0.8 + (st==='forest'?.18:0) + (rnd()*.16), 0.04, 1);
  if(st==='mtn') fert=clamp(fert*0.3,0.02,0.4);
  cells[i] = { st, fert, base:fert, clan:null, ruinT:0, hist:[terrLabel(st)] };
}
function terrLabel(st){return st==='water'?'바다':st==='forest'?'숲':st==='mtn'?'산':'들판';}

function nbrs(i){
  const x=i%COLS,y=i/COLS|0,out=[];
  if(x>0)out.push(i-1); if(x<COLS-1)out.push(i+1);
  if(y>0)out.push(i-COLS); if(y<ROWS-1)out.push(i+COLS);
  return out;
}

// ============================================================
//  씨족 에이전트 (셀 단위) — 목표/성격/기억/감정
// ============================================================
// 성격 traits (0~1): greed(저장강박) loyalty(충성) aggression(공격) altruism(나눔)
// 감정(희노애락): joy 기쁨, anger 분노, sorrow 슬픔, pleasure 즐거움(쾌락) — -1~1
// 동적으로 사건에서 생성됨. 대본 없음.
const EMO = {joy:'喜', anger:'怒', sorrow:'哀', pleasure:'樂'};
let clanSeq=0;
function newClan(facId, fert){
  return {
    cid: clanSeq++,
    fac: facId,
    food: 6 + rnd()*6,          // 식량 저장고
    pop: 8 + rnd()*8,           // 인구
    level: 1,                   // 1개척 2농장 3마을 4성읍
    // 성격
    t:{ greed:rnd(), loyalty:.35+rnd()*.55, aggr:rnd(), altruism:rnd() },
    // 감정 (창발)
    e:{ joy:0, anger:0, sorrow:0, pleasure:0 },
    mem:[],                     // 최근 경험 기억
    grudge:{},                  // facId -> 원한 누적
    starveT:0,                  // 연속 기근 턴
    name: clanName(),
  };
}
const CLAN_SUR=['바람','돌','강','늑대','재','보리','서리','불씨','잿빛','뿌리','매','소금','진흙','새벽','검은','마른'];
const CLAN_GIV=['일족','가문','무리','부족','촌','일가','문중','겨레'];
function clanName(){return pick(CLAN_SUR)+pick(CLAN_GIV);}

function remember(cl, txt){ cl.mem.push(`${year}년 ${txt}`); if(cl.mem.length>6) cl.mem.shift(); }
function feel(cl, k, d){ cl.e[k]=clamp(cl.e[k]+d,-1,1); }

// 지배적 감정
function domEmo(cl){
  let best='', bv=0.18;
  for(const k in cl.e){ if(cl.e[k]>bv){bv=cl.e[k];best=k;} }
  return best;
}

// ============================================================
//  세력(국가) — 지도자 + 국시(목표) + 정책 디렉티브
// ============================================================
const F_NAMES=['북부 왕국','붉은 제국','해안 연맹','유목 칸국','삼나무 공화국','잿빛 교단','동방 상단','검은강 부족','여명 왕조','소금사막 민족'];
const F_COLORS=['#2563eb','#dc2626','#059669','#7c3aed','#d97706','#0d9488','#be185d','#4d7c0f','#9333ea','#b45309'];
const LEADER_SUR=['카이','테무','오린','바실','세라','드락','이루','한','노바','질'];
const LEADER_TIT=['대공','칸','집정관','대사제','족장','여왕','왕','총독','선지자','대모'];
// 국시(정책) — 지도자가 내리는 명령 유형
const DIRECTIVES = {
  HOARD:    {label:'비축령',   fx:'HOARD',     desc:'식량을 중앙 창고에 비축하라'},
  SHARE:    {label:'구휼령',   fx:'RELIEF',    desc:'굶주린 씨족에 식량을 나누라'},
  EXPAND:   {label:'개척령',   fx:'EXPAND',    desc:'새 땅을 개간하라'},
  RAID:     {label:'약탈령',   fx:'RAID',      desc:'이웃의 곡창을 약탈하라'},
  MIGRATE:  {label:'천도령',   fx:'MIGRATE',   desc:'비옥한 땅으로 이주하라'},
  FORTIFY:  {label:'수성령',   fx:'FORTIFY',   desc:'성읍을 키우고 지키라'},
};
let facSeq=0, nameIdx=0;
let factions=[];
function newFaction(){
  if(nameIdx>=F_NAMES.length) nameIdx=0;
  const f={
    id: facSeq++,
    name: F_NAMES[nameIdx],
    color: F_COLORS[nameIdx%F_COLORS.length],
    leader: pick(LEADER_SUR)+' '+pick(LEADER_TIT),
    // 지도자 성격 — 국가 정책의 기반
    t:{ greed:rnd(), wisdom:.2+rnd()*.7, cruelty:rnd(), care:rnd() },
    directive:'EXPAND',
    treasury: 10,               // 중앙 곡창
    morale: 0.5,                // 민심 (창발)
    clans:[], size:0, pop:0, food:0,
    golden:0, age:0,
    deaths:0,
  };
  nameIdx++;
  factions.push(f);
  return f;
}
const facById = id => factions.find(f=>f.id===id);

function spawnFaction(announce){
  const f=newFaction();
  for(let t=0;t<400;t++){
    const i=ri(N), c=cells[i];
    if((c.st==='land'||c.st==='forest') && !c.clan && c.fert>0.25){
      if(c.st==='forest'){c.st='land';}
      settle(i, f.id, newClan(f.id, c.fert));
      if(announce) logEvent(`${f.name}의 ${f.leader}이(가) ${ref(i)}에 깃발을 세웠다.`, `=FOUND("${f.name}", ${ref(i)})`, 'found');
      return f;
    }
  }
  return f;
}
function settle(i, facId, clan){
  const c=cells[i];
  c.clan=clan; clan.fac=facId; c.st='land';
  c.hist.push('정착'); if(c.hist.length>8)c.hist.shift();
  dirty.add(i);
}

// ============================================================
//  연대기 / 멸망기록 / 명령기록
// ============================================================
const chronicle=[];   // {year,kind,txt}
const obituaries=[];  // {year,name,leader,cause}
const orderLog=[];    // {year,fac,dir,outcome}
let year=0, lastEvent='천지가 갈라지고, 굶주린 땅 위로 첫 씨족이 깨어났다.';
const dirty=new Set();
let selected=-1, selClan=-1;

function logEvent(msg, formula, kind){
  lastEvent=`서기 ${year}년 — ${msg}`;
  if(formula) fmla.textContent=formula;
  if(kind) chronicle.push({year, kind, txt:msg});
  if(chronicle.length>400) chronicle.shift();
}
const KIND_ICON={found:'⚑',war:'⚔',famine:'☠',revolt:'✊',betray:'🗡',relief:'🍚',
  golden:'✦',city:'城',collapse:'†',plague:'疫',migrate:'➤',feast:'宴',alliance:'🤝',cannibal:'⚱'};

// ============================================================
//  DOM 셀 생성
// ============================================================
const cellEls=new Array(N);
{
  const frag=document.createDocumentFragment();
  frag.appendChild(Object.assign(document.createElement('div'),{className:'hd'}));
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd';h.textContent=colName(c);frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd';h.textContent=r+1;frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';
      const idx=r*COLS+c; d.dataset.i=idx;
      const em=document.createElement('span'); em.className='em'; d.appendChild(em);
      cellEls[idx]=d; frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

const LV_TXT=['','·','禾','邑','城'];
const LV_LABEL=['','개척지','농장','마을','성읍'];

function paint(i){
  const c=cells[i], el=cellEls[i], em=el.firstChild;
  let bg='', tx='', col='#333', w='', emo='';
  if(c.st==='water'){ bg=hexA('#9dc3e6',.25); tx='≈'; col='#7fa8d0'; }
  else if(c.st==='mtn'){ bg='#efe9e1'; tx='⛰'; col='#9b8d77'; }
  else if(c.st==='forest'){ bg='#e2efda'; tx='木'; col='#6a9a3c'; }
  else if(c.st==='ruin'){ bg='#ededed'; tx='墟'; col='#aaa'; }
  else if(c.clan){
    const cl=c.clan, f=facById(cl.fac);
    if(f){
      // 색조: 비옥/식량으로 명도 변화 — 기근이면 회색빛
      const starv = cl.food < 2;
      const sat = clamp(.13 + cl.level*.16 + (cl.food>8?.06:0), .12, .85);
      bg = starv ? hexA('#bbb', .35+cl.level*.1) : hexA(f.color, sat);
      tx = starv ? '飢' : LV_TXT[cl.level];
      col = starv ? '#8a6d3b' : f.color;
      w = cl.level>=3?'700':'';
      const de=domEmo(cl);
      if(de) emo=EMO[de];
    } else { c.clan=null; }
  } else {
    // 빈 들판: 비옥도 옅게
    bg = hexA('#a9c46a', clamp(c.fert*0.18,0,.18));
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  // textContent를 쓰면 em span이 날아가므로 직접 관리
  while(el.childNodes.length>1 && el.lastChild!==em) el.removeChild(el.lastChild);
  if(el.firstChild!==em){ /* keep em first */ }
  // set main glyph as a text node after em
  let glyph=el.querySelector('.glyph');
  if(!glyph){glyph=document.createElement('span');glyph.className='glyph';el.appendChild(glyph);}
  glyph.textContent=tx;
  em.textContent=emo;
  em.style.color = emo==='喜'?'#e0a000':emo==='怒'?'#c00':emo==='哀'?'#3a6ea5':'#0a8a3a';
}

function flash(i, cls){ const el=cellEls[i]; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls),1000); }

// ============================================================
//  지도자 AI — 상황을 보고 국시(디렉티브)를 스스로 결정
// ============================================================
function leaderThink(f){
  if(f.size===0) return;
  // 상황 인식
  const avgFood = f.food / f.size;
  const starving = f.clans.filter(c=>c.food<2.5).length;
  const starveRatio = starving / f.size;
  const enemyNear = countEnemyBorders(f) > 0;
  const t=f.t;
  // 점수 기반 결정 (성격 가중) — 같은 상황도 지도자 성격 따라 다른 선택 = 창발
  const score={
    HOARD:   (avgFood<3?0.2:0.6) + t.greed*0.9 - t.care*0.4,
    SHARE:   starveRatio*1.6 + t.care*1.1 - t.greed*0.7,
    EXPAND:  (avgFood>4?0.8:0.3) + t.wisdom*0.5 + (f.size<5?0.6:0) - starveRatio*0.5,
    RAID:    starveRatio*0.9 + t.cruelty*1.0 + (enemyNear?0.6:-0.4) + (avgFood<2?0.7:0),
    MIGRATE: (starveRatio>0.4?1.1:0) + (avgFood<1.5?0.8:0) - t.greed*0.3,
    FORTIFY: (enemyNear?0.8:0.1) + t.greed*0.3 + (f.golden?0.4:0),
  };
  // 황금기엔 확장/구휼 선호
  if(f.golden){score.EXPAND+=0.5; score.SHARE+=0.3;}
  let best='EXPAND', bv=-9;
  for(const k in score){ const v=score[k]+rnd()*0.25; if(v>bv){bv=v;best=k;} }
  if(best!==f.directive){
    const d=DIRECTIVES[best];
    orderLog.push({year, fac:f.name, color:f.color, dir:d.label,
      reason: starveRatio>0.4?'기근 심각':avgFood>4?'식량 풍족':enemyNear?'적 접경':'정세 판단'});
    if(orderLog.length>200) orderLog.shift();
    f.directive=best;
    // 굵직한 명령만 연대기에
    if(best==='RAID'||best==='MIGRATE'||best==='SHARE'){
      logEvent(`${f.leader}이(가) "${d.label}"을 선포했다. (${d.desc})`,
        `=DECREE("${f.name}", "${d.fx}")`, best==='RAID'?'war':best==='MIGRATE'?'migrate':'relief');
    }
  }
}

  // cheaper: iterate cells once per call is too much; approximate using border map built in tick
  return f._enemyBorder||0;

// ============================================================
//  씨족 AI — 명령을 해석/수행/항명/배신.  기근 = 생존본능이 충성을 압도
// ============================================================
// 반환: 행동 결정. 굶주릴수록 자기보존 우선.
function clanDecide(i, c, f){
  const cl=c.clan;
  const hunger = clamp(1 - cl.food/6, 0, 1);          // 0배부름~1굶주림
  const survival = hunger;                             // 생존본능 강도
  // 충성 = 기본충성 * 민심 - 원한 - 굶주림*생존본능
  const grudge = (cl.grudge[f.id]||0);
  let obedience = cl.t.loyalty*0.7 + f.morale*0.4 - grudge*0.5 - survival*0.8 + cl.e.joy*0.2 - cl.e.anger*0.4;
  obedience = clamp(obedience, 0, 1);
  // 굶주림 임계: 생존본능 발동
  if(hunger>0.78 && cl.food<1.2){
    // 항명/배신 가능성
    if(rnd() > obedience*0.6){
      return survivalAct(i,c,f,cl,hunger);
    }
  }
  // 명령 해석 (성격 필터)
  const dir=f.directive;
  // 항명 확률: 명령이 자기 이해와 충돌하면
  let defy=0;
  if(dir==='SHARE' && cl.t.greed>0.65) defy=cl.t.greed*0.7*(1-cl.t.altruism);
  if(dir==='HOARD' && hunger>0.5) defy=hunger*0.6;
  if(dir==='RAID' && cl.t.aggr<0.3 && cl.t.altruism>0.5) defy=0.4;
  if(dir==='MIGRATE' && cl.t.greed>0.6 && cl.food>5) defy=0.5; // 가진 자는 안 떠남
  defy = clamp(defy - cl.t.loyalty*0.4 - f.morale*0.2, 0, 0.9);
  if(rnd()<defy){
    // 항명 → 자기 판단대로
    remember(cl,`"${DIRECTIVES[dir].label}"에 따르지 않았다`);
    feel(cl,'anger',0.15);
    return autonomousAct(i,c,f,cl,hunger);
  }
  // 순응 → 명령 수행
  return executeDirective(dir,i,c,f,cl,hunger);
}

// 명령 수행
function executeDirective(dir,i,c,f,cl,hunger){
  switch(dir){
    case 'HOARD':
      { const give=Math.min(cl.food*0.18, cl.food); cl.food-=give; f.treasury+=give; }
      tryGrowOrExpand(i,c,f,cl,0.5); break;
    case 'SHARE':
      // 굶는 형제에게 — 중앙창고 통해 분배는 tick에서. 여기선 발전 약하게
      tryGrowOrExpand(i,c,f,cl,0.7);
      feel(cl,'pleasure',0.04); break;
    case 'EXPAND':
      tryGrowOrExpand(i,c,f,cl,1.3); break;
    case 'RAID':
      tryRaid(i,c,f,cl,hunger,1.0) || tryGrowOrExpand(i,c,f,cl,0.4); break;
    case 'MIGRATE':
      tryMigrate(i,c,f,cl,hunger) || tryGrowOrExpand(i,c,f,cl,0.3); break;
    case 'FORTIFY':
      tryUpgrade(i,c,f,cl,1.6); break;
  }
  return true;
}

// 항명 시 자율 행동: 자기 이익 추구
function autonomousAct(i,c,f,cl,hunger){
  if(hunger>0.5 && cl.t.aggr>0.45) return tryRaid(i,c,f,cl,hunger,1.2)||tryGrowOrExpand(i,c,f,cl,0.6);
  if(cl.t.greed>0.6) { tryUpgrade(i,c,f,cl,1.0); return true; }
  return tryGrowOrExpand(i,c,f,cl,0.9);
}

// 생존본능 발동 — 기근의 핵심. 굶주린 씨족의 극단 행동
function survivalAct(i,c,f,cl,hunger){
  const roll=rnd();
  // 1) 배신: 더 식량 많은 이웃 세력으로 망명
  if(roll<0.32){
    const tgt=richestNeighborFac(i,f.id);
    if(tgt){
      const old=f.name;
      cl.fac=tgt.id; cl.grudge[f.id]=(cl.grudge[f.id]||0)+0.6;
      feel(cl,'anger',0.4); feel(cl,'sorrow',0.2);
      remember(cl,`굶주림에 ${old}을 버리고 ${tgt.name}에 투항했다`);
      flash(i,'revolt'); dirty.add(i);
      logEvent(`${cl.name}이(가) 굶주림에 ${old}을 배신하고 ${tgt.name}에 투항했다.`,
        `=DEFECT("${cl.name}", "${old}"→"${tgt.name}")`,'betray');
      return true;
    }
  }
  // 2) 약탈: 이웃 곡창 습격 (같은 세력이라도!)
  if(roll<0.68){
    if(tryRaid(i,c,f,cl,hunger,1.6, true)) return true;
  }
  // 3) 인육/공멸: 절망. 인구 격감, 레벨 하락
  if(cl.food<0.4 && rnd()<0.5){
    cl.pop*=0.6; cl.food+=1.2; cl.level=Math.max(1,cl.level-1);
    feel(cl,'sorrow',0.6); feel(cl,'pleasure',-0.4);
    remember(cl,'굶주림 끝에 차마 못할 일을 했다');
    f.morale=clamp(f.morale-0.06,0,1);
    if(rnd()<0.25) logEvent(`${ref(i)}의 ${cl.name}에 차마 말 못할 비극이 닥쳤다.`,
      `=DESPAIR(${ref(i)})`,'cannibal');
    dirty.add(i); return true;
  }
  // 4) 봉기: 민심 폭발
  if(rnd()<0.4){
    f.morale=clamp(f.morale-0.05,0,1);
    feel(cl,'anger',0.5);
    cl.grudge[f.id]=(cl.grudge[f.id]||0)+0.3;
    remember(cl,'창고 곡식을 요구하며 봉기했다');
    flash(i,'revolt');
    if(f.treasury>2){ const g=Math.min(f.treasury*0.3,4); f.treasury-=g; cl.food+=g; feel(cl,'joy',0.2);
      if(rnd()<0.3) logEvent(`${cl.name}의 봉기에 ${f.leader}이(가) 창고를 열었다.`,`=UPRISING(${ref(i)})`,'revolt'); }
    return true;
  }
  return tryGrowOrExpand(i,c,f,cl,0.4);
}

// ---- 기본 행동 프리미티브 ----
function tryGrowOrExpand(i,c,f,cl,boost){
  // 식량 여유시 확장, 아니면 발전
  if(cl.food>4 && rnd()<0.20*boost){
    const nb=nbrs(i), tgt=pick(nb), tc=cells[tgt];
    if(tc.st==='water'||tc.st==='mtn'||tc.st==='ruin') { tryUpgrade(i,c,f,cl,boost); return true; }
    if(!tc.clan){
      if(tc.st==='forest' && rnd()<0.4){ tc.st='land'; tc.hist.push('개간'); }
      if(tc.st==='land'){
        cl.food-=2; cl.pop*=0.6;
        const nc=newClan(f.id, tc.fert);
        nc.food=2; nc.pop=cl.pop*0.7; cl.pop*=0.6;
        nc.t.loyalty=clamp(cl.t.loyalty+(rnd()-.5)*0.2,0,1); // 자식은 부모 닮음(약간 변이)
        settle(tgt, f.id, nc);
        feel(cl,'joy',0.1); remember(cl,`${ref(tgt)}로 갈라져 나갔다`);
        return true;
      }
    }
  }
  tryUpgrade(i,c,f,cl,boost);
  return true;
}
function tryUpgrade(i,c,f,cl,boost){
  if(cl.level<4 && cl.food>3.5 && cl.pop>cl.level*9 && rnd()<0.07*boost*(f.golden?2.2:1)){
    cl.level++; cl.food-=2;
    c.hist.push(LV_LABEL[cl.level]); if(c.hist.length>8)c.hist.shift();
    feel(cl,'pleasure',0.2); feel(cl,'joy',0.15);
    remember(cl,`${LV_LABEL[cl.level]}(으)로 성장했다`);
    dirty.add(i);
    if(cl.level===4 && rnd()<0.6){
      logEvent(`${f.name}의 ${ref(i)}에 성읍 ${cl.name}이(가) 우뚝 섰다.`,`=CITY("${f.name}", ${ref(i)})`,'city');
    }
  }
  return true;
}
function tryRaid(i,c,f,cl,hunger,boost,allowSameFac){
  const nb=nbrs(i);
  // 곡창 많은 이웃 우선
  let best=-1,bf=-1;
  for(const t of nb){
    const tc=cells[t];
    if(!tc.clan) continue;
    if(!allowSameFac && tc.clan.fac===f.id) continue;
    const v=tc.clan.food + tc.clan.level*0.5;
    if(v>bf){bf=v;best=t;}
  }
  if(best<0) return false;
  const tc=cells[best], tcl=tc.clan, tf=facById(tcl.fac);
  const att = 1 + cl.t.aggr*2 + cl.level*0.5 + hunger*1.5 + (f.golden?1:0) + rnd()*2;
  const def = 1 + tcl.level*1.2 + tcl.t.aggr + rnd()*2.5;
  flash(best,'war');
  const sameFac = tcl.fac===f.id;
  if(att>def){
    // 약탈 성공: 식량 강탈
    const loot=Math.min(tcl.food*0.6+1, tcl.food+1);
    tcl.food=Math.max(0,tcl.food-loot); cl.food+=loot*0.8;
    feel(cl,'pleasure',0.3); feel(cl,'joy',0.1);
    feel(tcl,'anger',0.5); feel(tcl,'sorrow',0.3);
    tcl.grudge[f.id]=(tcl.grudge[f.id]||0)+0.5;
    remember(cl,`${tcl.name}의 곡창을 털었다`);
    remember(tcl,`${cl.name}에게 곡식을 빼앗겼다`);
    // 큰 약탈/동족약탈은 기록
    if(sameFac){
      f.morale=clamp(f.morale-0.05,0,1);
      if(kinRaidCD<=0 && rnd()<0.5){ kinRaidCD=12;
        logEvent(`기근 속 ${cl.name}이(가) 같은 ${f.name}의 ${tcl.name}을 약탈했다.`,
          `=KINRAID(${ref(i)}→${ref(best)})`,'betray'); }
    } else if(rnd()<0.35 && tf){
      logEvent(`${f.name}의 ${cl.name}이(가) ${tf.name} ${tcl.name}의 곡창을 약탈했다.`,
        `=RAID("${f.name}"→"${tf.name}", ${ref(best)})`,'war');
    }
    // 방어측 함락
    if(tcl.food<0.3 && tcl.level<=1 && rnd()<0.5){
      tc.clan=null; tc.st='ruin'; tc.ruinT=120; tc.hist.push('약탈로 폐허');
      dirty.add(best);
    }
    dirty.add(i); dirty.add(best);
    return true;
  } else {
    feel(cl,'anger',0.2); feel(cl,'sorrow',0.1);
    cl.pop*=0.92;
    if(rnd()<0.12 && tf && !sameFac) logEvent(`${tf.name} ${tcl.name}이(가) ${f.name}의 침공을 격퇴했다.`,
      `=DEFEND("${tf.name}", ${ref(best)})`,'war');
    return true;
  }
}
function tryMigrate(i,c,f,cl,hunger){
  // 더 비옥한 빈 들판으로 이주
  const nb=nbrs(i);
  let best=-1,bv=c.fert;
  for(const t of nb){const tc=cells[t]; if(!tc.clan && (tc.st==='land'||tc.st==='forest') && tc.fert>bv){bv=tc.fert;best=t;}}
  if(best<0) return false;
  const tc=cells[best];
  if(tc.st==='forest'){tc.st='land';tc.hist.push('개간');}
  tc.clan=cl; c.clan=null; c.hist.push('떠남');
  feel(cl,'joy',0.1); remember(cl,`${ref(best)}의 기름진 땅으로 이주했다`);
  dirty.add(i); dirty.add(best);
  return true;
}
function richestNeighborFac(i,exceptFac){
  const counts={};
  for(const t of nbrs(i)){
    const tc=cells[t];
    if(tc.clan && tc.clan.fac!==exceptFac){
      const f=facById(tc.clan.fac); if(!f)continue;
      counts[f.id]=(counts[f.id]||0)+tc.clan.food+1;
    }
  }
  let best=null,bv=0;
  for(const id in counts){ if(counts[id]>bv){bv=counts[id];best=facById(+id);} }
  return best;
}

// ============================================================
//  메인 틱
// ============================================================
let tickN=0;
let climate=1;   // 기후 인자: 1=평년, <1 흉년/대기근
let famineYears=0;
let kinRaidCD=0; // 동족약탈 로그 쿨다운 (연대기 다양성)
function tick(){
  tickN++; year++;
  if(kinRaidCD>0) kinRaidCD--;

  // ---- 기후/기근 사이클 — 흉년이 무작위로 닥침 ----
  // 완만한 사인 + 무작위 충격
  const seasonal = 0.78 + 0.30*Math.sin(year*0.06 + 1.3);
  if(climate < seasonal) climate += 0.04; else climate -= 0.04;
  climate = clamp(climate + (rnd()-0.5)*0.05, 0.30, 1.35);
  // 대기근 충격 이벤트
  if(rnd()<0.006 && climate>0.6){
    climate = 0.30 + rnd()*0.18;
    logEvent(`하늘이 닫혔다. 대기근이 온 세상을 덮쳤다.`,`=GREAT_FAMINE(${year}, yield=${climate.toFixed(2)})`,'famine');
  }
  const isFamine = climate < 0.62;
  if(isFamine) famineYears++; else famineYears=0;

  // ---- 집계 + 식량 생산/소비 ----
  for(const f of factions){ f.clans.length=0; f.size=0; f.pop=0; f.food=0; f._enemyBorder=0; f._starv=0; }
  let worldPop=0, worldFamineClans=0, totalClans=0;
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin'){ if(--c.ruinT<=0){c.st='land';dirty.add(i);} continue; }
    // 비옥도 회복 (휴경)
    if(!c.clan && c.fert<c.base) c.fert=Math.min(c.base, c.fert+0.010);
    if(!c.clan) continue;
    const cl=c.clan, f=facById(cl.fac);
    if(!f){ c.clan=null; dirty.add(i); continue; }
    // --- 식량 생산: 비옥도 * 기후 * 레벨 ---
    const harvest = c.fert * climate * (1.5 + cl.level*0.55) * (f.golden?1.3:1);
    cl.food += harvest;
    // 경작은 토지를 소모 (지력 고갈) → 미래 기근 압력
    c.fert = Math.max(0.06, c.fert - 0.0028*cl.level);
    // --- 소비: 인구가 먹는다 ---
    const eat = cl.pop * 0.072;
    cl.food -= eat;
    cl.food = Math.min(cl.food, 34);  // 저장 한계
    totalClans++;
    // --- 기근 판정 ---
    if(cl.food < 0){
      cl.food=0; cl.starveT++; worldFamineClans++; f._starv++;
      // 아사
      cl.pop *= (0.88 - 0.045*Math.min(cl.starveT,4));
      feel(cl,'sorrow',0.22); feel(cl,'joy',-0.15); feel(cl,'pleasure',-0.1);
      f.morale=clamp(f.morale-0.012,0,1);
      if(cl.starveT===1) remember(cl,'창고가 비고 굶주림이 시작됐다');
      // 소멸
      if(cl.pop < 2.2){
        f.deaths++;
        c.hist.push('아사로 소멸'); if(c.hist.length>8)c.hist.shift();
        c.clan=null; c.fert=Math.max(c.fert,c.base*0.7);
        dirty.add(i);
        continue;
      }
    } else {
      if(cl.starveT>0){ cl.starveT=0; feel(cl,'joy',0.15); remember(cl,'다시 추수의 계절이 왔다'); }
      // 인구 성장 (식량 여유시)
      if(cl.food>3) cl.pop += clamp(cl.pop*0.04*(cl.food/8),0,3);
      cl.pop=Math.min(cl.pop, cl.level*40+20);
      // 풍요 → 즐거움
      if(cl.food>10){ feel(cl,'pleasure',0.05); feel(cl,'joy',0.03); }
    }
    // 감정 자연 감쇠
    for(const k in cl.e) cl.e[k]*=0.96;
    // 원한 감쇠
    for(const g in cl.grudge){ cl.grudge[g]*=0.99; if(cl.grudge[g]<0.02) delete cl.grudge[g]; }
    f.clans.push(cl); f.size++; f.pop+=cl.pop; f.food+=cl.food; worldPop+=cl.pop;
    cl._cell=i;
  }
  // 접경 적 카운트 (한 번만 순회)
  for(let i=0;i<N;i++){
    const c=cells[i]; if(!c.clan) continue;
    const f=facById(c.clan.fac); if(!f) continue;
    for(const t of nbrs(i)){ const tc=cells[t]; if(tc.clan && tc.clan.fac!==f.id){ f._enemyBorder++; break; } }
  }

  // ---- 멸망 판정 ----
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    f.age++;
    if(f.size===0){
      obituaries.push({year, name:f.name, leader:f.leader, age:f.age,
        cause: famineYears>3?'대기근':f.deaths>3?'기근과 내란':'역사의 부침'});
      logEvent(`${f.name}이(가) ${f.age}년의 역사를 끝으로 사라졌다. (${f.leader})`,
        `=COLLAPSE("${f.name}", ${year})`,'collapse');
      factions.splice(k,1);
    }
  }

  // ---- 중앙 구휼 (SHARE 디렉티브 가진 세력) ----
  for(const f of factions){
    if(f.size===0) continue;
    if(f.directive==='SHARE' && f.treasury>0){
      const needy=f.clans.filter(c=>c.food<2).sort((a,b)=>a.food-b.food);
      let pool=f.treasury;
      for(const cl of needy){
        if(pool<=0.5) break;
        const give=Math.min(2, pool); cl.food+=give; pool-=give;
        feel(cl,'joy',0.25); feel(cl,'anger',-0.2);
        cl.grudge[f.id]=Math.max(0,(cl.grudge[f.id]||0)-0.2);
        remember(cl,`나라의 구휼미를 받았다`);
      }
      if(pool<f.treasury){ f.morale=clamp(f.morale+0.02,0,1); }
      f.treasury=pool;
    }
    // HOARD면 창고 그대로 (이미 모임). 창고 자연 소모(관리비)
    f.treasury=Math.max(0,f.treasury-0.05*f.size*0.1);
  }

  // ---- 지도자 사고 (가끔) + 씨족 행동 ----
  for(const f of factions){
    if(f.size===0) continue;
    if(f.golden>0) f.golden--;
    if(tickN%6===(f.id%6)) leaderThink(f);
    // 민심 회복 (식량 풍족시)
    const avgFood=f.food/f.size;
    if(avgFood>4) f.morale=clamp(f.morale+0.006,0,1);
    // 황금기: 안정+풍요
    if(!f.golden && f.morale>0.78 && avgFood>6 && f.size>4 && rnd()<0.02){
      f.golden=80; f.age;
      logEvent(`${f.name}에 풍년과 평화가 깃들어 황금기가 열렸다.`,`=GOLDEN_AGE("${f.name}")`,'golden');
    }
  }
  // 씨족 행동 — 셀 순회 (셔플 없이도 충분히 창발)
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(!c.clan) continue;
    const f=facById(c.clan.fac); if(!f) continue;
    if(rnd()<0.7) clanDecide(i,c,f);
  }

  // ---- 무작위 세계 사건 ----
  // 새 씨족 도래 (세력 적을 때)
  if(factions.length<3 && rnd()<0.02 && factions.length<F_NAMES.length){
    const f=spawnFaction(false);
    if(f) logEvent(`바다 건너에서 ${f.name}이(가) 새 땅을 찾아 도래했다.`,`=ARRIVE("${f.name}")`,'migrate');
  }
  // 동맹: 굶주린 두 세력이 손잡음
  if(factions.length>=2 && rnd()<0.004){
    const a=pick(factions), b=pick(factions.filter(x=>x!==a));
    if(a&&b&&a.directive!=='RAID'&&b.directive!=='RAID'){
      a.treasury+=b.treasury*0.2; b.treasury+=a.treasury*0.1;
      logEvent(`${a.name}과(와) ${b.name}이(가) 기근 앞에 동맹을 맺었다.`,`=ALLY("${a.name}","${b.name}")`,'alliance');
    }
  }
  // 풍년 잔치
  if(!isFamine && climate>1.15 && rnd()<0.01 && factions.length){
    const f=pick(factions);
    if(f.size){ for(const cl of f.clans){feel(cl,'pleasure',0.3);feel(cl,'joy',0.2);} f.morale=clamp(f.morale+0.05,0,1);
      logEvent(`${f.name}이(가) 대풍년을 맞아 추수 잔치를 벌였다.`,`=FEAST("${f.name}")`,'feast'); }
  }

  // ---- 그리기 ----
  for(const i of dirty) paint(i);
  dirty.clear();
  // 굶주린 셀은 매틱 다시 칠해 飢 표시 갱신
  if(tickN%2===0){ for(let i=0;i<N;i++){const c=cells[i];if(c.clan&&(c.clan.food<2.5||domEmo(c.clan)))paint(i);} }

  // ---- 상태바 ----
  const totFood = factions.reduce((s,f)=>s+f.food,0);
  const climLabel = climate<0.5?'대기근':climate<0.7?'흉년':climate>1.15?'대풍년':climate>0.95?'풍년':'평년';
  statusbar.innerHTML =
    `준비<span class="sep">|</span>서기 ${year}년`+
    `<span class="sep">|</span>기후 <b style="color:${climate<0.62?'#ffd2d2':'#d8ffe0'}">${climLabel}</b>(수확 ${(climate).toFixed(2)})`+
    `<span class="sep">|</span>인구 ${Math.round(worldPop).toLocaleString()}`+
    `<span class="sep">|</span>국가 ${factions.length}`+
    `<span class="sep">|</span>굶주린 씨족 ${worldFamineClans}/${totalClans}`+
    `<span class="sep">|</span><span id="ev">${lastEvent}</span>`;

  // ---- 범례/현황 ----
  if(tickN%5===0){
    document.title=`기근연대기.xlsx - Excel (서기 ${year}년)`;
    renderLegend();
    $('panel').style.display!=='none' && refreshPanel();
    document.querySelector('[data-sheet="dead"]').textContent=`멸망기록 (${obituaries.length})`;
    if(selClan>=0 && cells[selClan] && cells[selClan].clan) renderInspector(selClan);
  }
}

function renderLegend(){
  let h='<h4>세력 현황 — 서기 '+year+'년</h4>';
  const sorted=[...factions].sort((a,b)=>b.size-a.size);
  for(const f of sorted){
    const avg=f.size?f.food/f.size:0;
    const mood=avg<2?'<span style="color:#c00">飢</span>':avg>6?'<span style="color:#0a8a3a">豊</span>':'';
    h+=`<div><span class="sw" style="background:${f.color}"></span><b>${f.name}</b>${f.golden?' ✦':''} ${mood}`+
       `<div class="small" style="margin-left:14px">${f.leader} · ${DIRECTIVES[f.directive].label} · 영토 ${f.size} · 민심 ${(f.morale*100|0)}%</div></div>`;
  }
  if(!factions.length) h+='<div class="small">모든 문명이 기근에 스러졌다…</div>';
  if(obituaries.length){
    h+='<h4 style="margin-top:7px">멸망기록</h4>';
    for(const o of obituaries.slice(-3)) h+=`<div class="small dead">† ${o.name} (${o.year}년, ${o.cause})</div>`;
  }
  h+='<h4 style="margin-top:7px">감정 범례</h4><div class="small">'+
     '<span style="color:#e0a000">喜</span>기쁨 <span style="color:#c00">怒</span>분노 '+
     '<span style="color:#3a6ea5">哀</span>슬픔 <span style="color:#0a8a3a">樂</span>즐거움 · <span style="color:#8a6d3b">飢</span>기근</div>';
  legend.innerHTML=h;
}

// ============================================================
//  셀 클릭 — 그 땅 / 씨족 에이전트의 내면을 들여다봄
// ============================================================
sheet.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  if(selected>=0) cellEls[selected].classList.remove('sel');
  selected=+t.dataset.i; t.classList.add('sel');
  namebox.textContent=ref(selected);
  const c=cells[selected];
  if(c.clan){
    selClan=selected;
    renderInspector(selected);
    const cl=c.clan, f=facById(cl.fac);
    fmla.textContent=`=AGENT("${cl.name}", 세력="${f?f.name:'?'}", 식량=${cl.food.toFixed(1)}, 감정=${domEmo(cl)?EMO[domEmo(cl)]:'평온'})`;
  } else {
    inspector.style.display='none'; selClan=-1;
    fmla.textContent=`=LAND(${ref(selected)}, 지형="${terrLabel(c.st)}", 비옥도=${c.fert.toFixed(2)}, 역사=[${c.hist.slice(-4).join(' → ')}])`;
  }
});

function renderInspector(i){
  const c=cells[i], cl=c.clan; if(!cl){inspector.style.display='none';return;}
  const f=facById(cl.fac);
  const de=domEmo(cl);
  const emoTxt = de? `${EMO[de]} ${ {joy:'기쁨',anger:'분노',sorrow:'슬픔',pleasure:'즐거움'}[de] }` : '평온';
  const hunger = clamp(1-cl.food/6,0,1);
  const obedience = clamp(cl.t.loyalty*0.7+(f?f.morale:0)*0.4-(cl.grudge[cl.fac]||0)*0.5-hunger*0.8,0,1);
  function bar(v,col){return `<span class="barwrap"><span class="bar" style="width:${(v*100)|0}%;background:${col}"></span></span>`;}
  let h=`<span class="close" onclick="this.parentNode.style.display='none'">✕</span>`;
  h+=`<h4>${cl.name} <span style="font-weight:400;color:#888">(${ref(i)})</span></h4>`;
  h+=`<div class="row"><span><span class="pill" style="background:${f?f.color:'#999'}"></span>${f?f.name:'무소속'} · ${LV_LABEL[cl.level]}</span><span>${emoTxt}</span></div>`;
  h+=`<div class="row"><span>식량 ${cl.food.toFixed(1)} ${cl.food<2?'<b style="color:#c00">飢</b>':''}</span><span>인구 ${Math.round(cl.pop)}</span></div>`;
  h+=`<div style="margin-top:4px">충성심 ${bar(cl.t.loyalty,'#2563eb')} 탐욕 ${bar(cl.t.greed,'#d97706')}<br>`+
     `공격성 ${bar(cl.t.aggr,'#dc2626')} 이타심 ${bar(cl.t.altruism,'#059669')}</div>`;
  h+=`<div class="row" style="margin-top:4px"><span>현 명령: <b>${f?DIRECTIVES[f.directive].label:'-'}</b></span>`+
     `<span>복종도 ${bar(obedience, obedience>0.5?'#0a8a3a':'#c00')}</span></div>`;
  if(cl.mem.length){
    h+=`<div class="mem"><b>기억</b><br>`+cl.mem.slice(-4).map(m=>'· '+m).join('<br>')+`</div>`;
  }
  // 개입 버튼 — 사람이 직접 손을 댐
  h+=`<div class="acts">`+
     `<button data-act="feed">곡식 하사</button>`+
     `<button data-act="incite">선동</button>`+
     `<button data-act="bless">축복</button>`+
     `</div>`;
  inspector.innerHTML=h;
  inspector.style.display='block';
  inspector.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>intervene(i, b.dataset.act);
  });
}
// 사람의 개입 — 신의 손
function intervene(i, act){
  const c=cells[i], cl=c.clan; if(!cl) return;
  const f=facById(cl.fac);
  if(act==='feed'){
    cl.food+=6; cl.starveT=0; feel(cl,'joy',0.5); feel(cl,'pleasure',0.2);
    remember(cl,'하늘에서 곡식이 내렸다');
    logEvent(`알 수 없는 힘이 ${cl.name}에게 곡식을 내렸다.`,`=BLESS_FOOD(${ref(i)})`,'relief');
  } else if(act==='incite'){
    feel(cl,'anger',0.7); cl.grudge[cl.fac]=(cl.grudge[cl.fac]||0)+0.7;
    if(f) f.morale=clamp(f.morale-0.08,0,1);
    remember(cl,'마음 속에 반역의 불씨가 일었다');
    logEvent(`${cl.name}의 마음에 분노가 끓어올랐다.`,`=INCITE(${ref(i)})`,'revolt');
  } else if(act==='bless'){
    cl.level=Math.min(4,cl.level+1); cl.pop+=10; feel(cl,'pleasure',0.4);
    remember(cl,'기적처럼 번성했다');
    logEvent(`${cl.name}이(가) 기적처럼 번성했다.`,`=BLESS_GROW(${ref(i)})`,'golden');
  }
  paint(i); renderInspector(i);
}

// ============================================================
//  시트 탭 (엑셀 위장: 다른 시트 = 데이터 뷰)
// ============================================================
let curSheet='map';
document.querySelectorAll('#tabs div[data-sheet]').forEach(tb=>{
  tb.onclick=()=>{
    document.querySelectorAll('#tabs div[data-sheet]').forEach(x=>x.classList.remove('on'));
    tb.classList.add('on');
    curSheet=tb.dataset.sheet;
    if(curSheet==='map'){ sheetwrap.style.display='block'; legend.style.display='block'; panel.style.display='none'; }
    else { sheetwrap.style.display='none'; legend.style.display='none'; panel.style.display='block'; refreshPanel(); }
  };
});
function refreshPanel(){
  if(curSheet==='clans') renderClans();
  else if(curSheet==='orders') renderOrders();
  else if(curSheet==='chron') renderChron();
  else if(curSheet==='dead') renderDead();
}
function renderClans(){
  panelHead.textContent='씨족명부 — 살아있는 모든 에이전트 (성격·식량·감정·복종)';
  const rows=[];
  for(let i=0;i<N;i++){const c=cells[i];if(!c.clan)continue;rows.push({i,cl:c.clan});}
  rows.sort((a,b)=>b.cl.food-a.cl.food);
  let h='<table class="x"><thead><tr><th>셀</th><th>씨족</th><th>세력</th><th>등급</th><th>식량</th><th>인구</th><th>충성</th><th>탐욕</th><th>공격</th><th>감정</th><th>최근 기억</th></tr></thead><tbody>';
  for(const {i,cl} of rows.slice(0,120)){
    const f=facById(cl.fac); const de=domEmo(cl);
    h+=`<tr><td>${ref(i)}</td><td>${cl.name}</td>`+
       `<td><span class="pill" style="background:${f?f.color:'#999'}"></span>${f?f.name:'-'}</td>`+
       `<td>${LV_LABEL[cl.level]}</td><td>${cl.food<2?'<b style="color:#c00">'+cl.food.toFixed(1)+'</b>':cl.food.toFixed(1)}</td>`+
       `<td>${Math.round(cl.pop)}</td><td>${(cl.t.loyalty*100|0)}</td><td>${(cl.t.greed*100|0)}</td><td>${(cl.t.aggr*100|0)}</td>`+
       `<td>${de?EMO[de]:'·'}</td><td style="color:#666">${cl.mem.slice(-1)[0]||'-'}</td></tr>`;
  }
  if(!rows.length) h+='<tr><td colspan="11" style="text-align:center;color:#999">살아있는 씨족이 없다.</td></tr>';
  h+='</tbody></table>';
  panelBody.innerHTML=h;
}
function renderOrders(){
  panelHead.textContent='지휘체계 — 지도자의 국시(명령) 변천. 씨족은 이를 따르거나, 항명하거나, 배신한다';
  let h='<table class="x"><thead><tr><th>세력</th><th>지도자</th><th>현 국시</th><th>중앙곡창</th><th>민심</th><th>접경 적</th></tr></thead><tbody>';
  for(const f of factions){
    const mp=(f.morale*100)|0;
    h+=`<tr><td><span class="pill" style="background:${f.color}"></span>${f.name}</td><td>${f.leader}</td>`+
       `<td><b>${DIRECTIVES[f.directive].label}</b> <span style="color:#888">${DIRECTIVES[f.directive].desc}</span></td>`+
       `<td>${f.treasury.toFixed(1)}</td>`+
       `<td><span class="barwrap"><span class="bar" style="width:${mp}%;background:${mp<40?'#c00':'#0a8a3a'}"></span></span> ${mp}%</td>`+
       `<td>${f._enemyBorder||0}</td></tr>`;
  }
  h+='</tbody></table>';
  h+='<div style="padding:8px 12px;color:#555"><b>명령 변경 기록 (최근)</b></div>';
  h+='<table class="x"><thead><tr><th>연도</th><th>세력</th><th>새 국시</th><th>판단 근거</th></tr></thead><tbody>';
  for(const o of orderLog.slice(-40).reverse()){
    h+=`<tr><td>${o.year}</td><td><span class="pill" style="background:${o.color}"></span>${o.fac}</td><td>${o.dir}</td><td style="color:#666">${o.reason}</td></tr>`;
  }
  h+='</tbody></table>';
  panelBody.innerHTML=h;
}
function renderChron(){
  panelHead.textContent='연대기 — 이 세계에서 실제로 일어난 일 (대본 없음, 매 실행마다 다름)';
  let h='<table class="x"><thead><tr><th>연도</th><th></th><th>사건</th></tr></thead><tbody>';
  for(const e of chronicle.slice(-200).reverse()){
    h+=`<tr><td style="white-space:nowrap">서기 ${e.year}년</td><td style="text-align:center">${KIND_ICON[e.kind]||'·'}</td><td>${e.txt}</td></tr>`;
  }
  if(!chronicle.length) h+='<tr><td colspan="3" style="text-align:center;color:#999">아직 기록된 사건이 없다.</td></tr>';
  h+='</tbody></table>';
  panelBody.innerHTML=h;
}
function renderDead(){
  panelHead.textContent='멸망기록 — 기근과 전란에 스러진 문명들';
  let h='<table class="x"><thead><tr><th>멸망 연도</th><th>문명</th><th>마지막 지도자</th><th>존속</th><th>멸망 원인</th></tr></thead><tbody>';
  for(const o of [...obituaries].reverse()){
    h+=`<tr><td>서기 ${o.year}년</td><td class="dead">${o.name}</td><td>${o.leader}</td><td>${o.age}년</td><td>${o.cause}</td></tr>`;
  }
  if(!obituaries.length) h+='<tr><td colspan="5" style="text-align:center;color:#999">아직 멸망한 문명이 없다.</td></tr>';
  h+='</tbody></table>';
  panelBody.innerHTML=h;
}

// ============================================================
//  속도 컨트롤
// ============================================================
let speed=1, timer=null;
function setSpeed(s){
  speed=s;
  document.querySelectorAll('#speed button').forEach(b=>b.classList.toggle('on',+b.dataset.spd===s));
  if(timer) clearInterval(timer);
  if(s>0) timer=setInterval(tick, s===3?55:130);
}
document.querySelectorAll('#speed button').forEach(b=>{
  b.onclick=()=>setSpeed(+b.dataset.spd);
});

// ============================================================
//  시작 — 첫 페인트가 곧 동작하는 스프레드시트
// ============================================================
for(let i=0;i<N;i++) paint(i);
fmla.textContent=`=SIM.FAMINE($A$1:$${colName(COLS-1)}$${ROWS}, "굶주림 앞에서 충성은 시험받는다")`;
// 초기 문명 시딩
spawnFaction(true); spawnFaction(true); spawnFaction(true); spawnFaction(true);
renderLegend();
statusbar.innerHTML=`준비<span class="sep">|</span>서기 0년<span class="sep">|</span>${lastEvent}`;
setSpeed(1);
})();
</script>
</body>
</html>
