<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>문명.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
  *{box-sizing:border-box}
  #app{display:flex;flex-direction:column;height:100%}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar .ttl{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #titlebar .sp{flex:1}
  #titlebar .run{font-size:11px;color:#107c41;border:1px solid #bdd9c7;border-radius:3px;
    padding:2px 8px;cursor:pointer;background:#f0f7f2}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;flex:0 0 auto;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px;flex:0 0 auto}
  #namebox{width:78px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#107c41;font-weight:600;flex:0 0 auto}
  #fx{width:28px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif;flex:0 0 auto}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #main{flex:1 1 auto;display:flex;min-height:0}
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1 1 auto;min-width:0}
  #sheet{display:grid;background:#fff}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:10px}
  .cell{position:relative;border-right:1px solid #e8e8e8;border-bottom:1px solid #e8e8e8;
    display:flex;align-items:center;justify-content:center;font-size:11px;
    overflow:hidden;cursor:cell;line-height:1}
  .cell .cap{position:absolute;left:1px;top:0;font-size:7px;line-height:7px;opacity:.85;font-weight:700}
  .cell .gd{position:absolute;right:1px;bottom:0;font-size:7px;line-height:7px;opacity:.7}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:3}
  .cell.route{box-shadow:inset 0 0 0 1px rgba(16,124,65,.0)}
  @keyframes warf{0%,100%{background:#ff4d4d}50%{background:#ffd0d0}}
  .war{animation:warf .3s 3;color:#7a0000 !important;font-weight:800}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  .trade{animation:pulse .7s infinite}
  #legend{position:absolute;top:6px;right:8px;background:#fffce6;border:1px solid #d8c66a;
    box-shadow:2px 3px 8px rgba(0,0,0,.18);padding:7px 10px;font-size:10.5px;z-index:6;
    width:208px;line-height:1.55;max-height:calc(100% - 14px);overflow:auto}
  #legend .sw{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:1px;vertical-align:middle}
  #legend .dead{color:#999;font-size:10px}
  #legend h4{margin:5px 0 3px;font-size:10.5px;color:#7a6a1f;border-bottom:1px dotted #d8c66a;padding-bottom:1px}
  #legend .frow{display:flex;justify-content:space-between;gap:4px;align-items:baseline}
  #legend .mood{font-size:9.5px}
  #legend .bar{height:3px;border-radius:2px;margin-top:1px;background:#e8dca0}
  #side{width:262px;flex:0 0 auto;border-left:1px solid #d4d4d4;background:#fbfbf9;
    display:flex;flex-direction:column;font-size:11px;overflow:hidden}
  #side .sh{background:#107c41;color:#eaf6ee;padding:4px 9px;font-weight:600;font-size:11px;flex:0 0 auto}
  #side .body{flex:1 1 auto;overflow:auto;padding:0}
  #side .ev{padding:4px 9px;border-bottom:1px solid #eee;line-height:1.4}
  #side .ev .yr{color:#107c41;font-weight:600;font-family:Consolas,monospace;font-size:10px}
  #side .ev.war{background:#fff2f0}
  #side .ev.diplo{background:#eef5ff}
  #side .ev.econ{background:#f3faf0}
  #side .ev.doom{background:#f3eef7}
  #side .ev .fm{font-family:Consolas,monospace;font-size:9.5px;color:#888;display:block;margin-top:1px}
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 10px;font-size:11px;flex:0 0 auto;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 8px;opacity:.45}
  #statusbar .ev{flex:1;overflow:hidden;text-overflow:ellipsis}
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:14px;
    border-top:1px solid #d4d4d4;font-size:11px;flex:0 0 auto;overflow:hidden}
  #tabs div{padding:3px 11px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  /* 시트 오버레이 (연대기/멸망기록) */
  #overlay{position:absolute;inset:0;background:#fff;z-index:8;overflow:auto;display:none;padding:0}
  #overlay table{border-collapse:collapse;width:100%;font-size:11px}
  #overlay th{background:#f5f5f5;border:1px solid #d0d0d0;padding:4px 8px;text-align:left;
    position:sticky;top:0;color:#555;font-weight:600}
  #overlay td{border:1px solid #e3e3e3;padding:3px 8px;vertical-align:top}
  #overlay td.yr{font-family:Consolas,monospace;color:#107c41;width:64px}
  #overlay td.fm{font-family:Consolas,monospace;color:#999;font-size:10px}
  #overlay tr.war td{background:#fff6f5}
  #overlay tr.doom td{background:#f3eef7}
  #overlay tr.econ td{background:#f5faf2}
  #overlay tr.diplo td{background:#f1f6ff}
  .hint{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.92);border:1px solid #d4d4d4;
    padding:5px 9px;font-size:10px;color:#666;z-index:6;border-radius:3px;max-width:220px;line-height:1.5}
  @media (max-width:560px){
    #side{display:none}
    #menubar{gap:10px}
    #legend{width:140px;font-size:9px}
    #namebox{width:56px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <div class="ttl">문명.xlsx - Excel</div>
    <div class="sp"></div>
    <div class="run" id="runbtn">⏸ 일시정지</div>
  </div>
  <div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
  <div id="fbar">
    <div id="namebox">A1</div>
    <div id="fx">fx</div>
    <div id="formula"></div>
  </div>
  <div id="main">
    <div id="sheetwrap">
      <div id="sheet"></div>
      <div id="legend"></div>
      <div id="overlay"></div>
      <div class="hint" id="hint">셀 클릭 = 그 땅의 역사·자원·민심 / 셀에 명령 개입. 시트 탭에서 연대기·멸망기록 열람.</div>
    </div>
    <div id="side">
      <div class="sh">실시간 연대기 (창발 로그)</div>
      <div class="body" id="feed"></div>
    </div>
  </div>
  <div id="tabs">
    <div class="on" data-v="sheet">Sheet1</div>
    <div data-v="chron">연대기</div>
    <div data-v="dead" id="tab-dead">멸망기록 (0)</div>
    <div data-v="trade">교역장부</div>
  </div>
  <div id="statusbar"></div>
</div>

<script>
(() => {
"use strict";
/* =====================================================================
   문명.xlsx — 창발적 AI 문명 시뮬레이션 (경제·자원 수급 렌즈)
   레퍼런스의 규칙틱을 넘어: 자율 에이전트 / 다층 지휘체계 / 동적 감정 /
   자원이 물리적으로 흐르는 경제. 대본 없음. 매 실행마다 다른 역사가 창발.
   ===================================================================== */

/* ---------- 격자 크기 (1440·390 반응형) ---------- */
const elSheet = document.getElementById('sheet');
const elFmla  = document.getElementById('formula');
const elName  = document.getElementById('namebox');
const elStatus= document.getElementById('statusbar');
const elLegend= document.getElementById('legend');
const elFeed  = document.getElementById('feed');
const elOver  = document.getElementById('overlay');
const elHint  = document.getElementById('hint');

const narrow = innerWidth < 560;
const CW = narrow ? 26 : 32;
const CH = narrow ? 20 : 21;
const ROWHD = 30;
const sideW = (innerWidth >= 560) ? 262 : 0;
const COLS = Math.max(14, Math.min(46, Math.floor((innerWidth - sideW - ROWHD) / CW)));
const ROWS = Math.max(12, Math.min(34, Math.floor((innerHeight - 170) / CH)));
const N = COLS * ROWS;

elSheet.style.gridTemplateColumns = `${ROWHD}px repeat(${COLS}, ${CW}px)`;
elSheet.style.gridAutoRows = CH + 'px';

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(((i/COLS)|0)+1);}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(arr){return arr[Math.random()*arr.length|0];}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

/* ---------- 시트 DOM ---------- */
const cellEls = new Array(N);
{
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd';h.textContent=colName(c);frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd';h.textContent=r+1;frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      const cap=document.createElement('span');cap.className='cap';
      const gd=document.createElement('span');gd.className='gd';
      d.appendChild(cap);d.appendChild(gd);
      cellEls[r*COLS+c]=d;frag.appendChild(d);
    }
  }
  elSheet.appendChild(frag);
}

/* ---------- 지형 + 자원 부존 ----------
   resType: 0 없음, 1 곡물(food), 2 광물(ore), 3 목재(wood), 4 소금/사치(luxury)
   각 칸은 지형에 따라 부존 자원과 잠재 생산력을 가진다. */
const RES = ['-','곡물','광물','목재','소금'];        // 0..4
const RES_GLYPH=['','穀','鑛','木','塩'];
const GW=9, GH=6, gz=[];
for(let i=0;i<GW*GH;i++) gz[i]=Math.random();
function noise(x,y){
  const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=gz[y0*GW+x0], b=gz[y0*GW+Math.min(GW-1,x0+1)];
  const c=gz[Math.min(GH-1,y0+1)*GW+x0], d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}

const cells = new Array(N);
for(let i=0;i<N;i++){
  const x=i%COLS, y=i/COLS|0;
  const v=noise(x,y)+(Math.random()-.5)*.14;
  let st='land', resType=0, yield_=0, hist=['황무지'];
  if(v<.30){ st='water'; hist=['바다']; }
  else if(v>.66 && Math.random()<.65){ st='mountain'; hist=['산악']; resType=2; yield_=rnd(.7,1.5); } // 광물
  else if(v>.55 && Math.random()<.6){ st='forest'; hist=['숲']; resType=3; yield_=rnd(.6,1.3); }       // 목재
  else {
    st='land';
    const rr=Math.random();
    if(rr<.42){ resType=1; yield_=rnd(.8,1.8); hist=['비옥한 평야']; }  // 곡물
    else if(rr<.5){ resType=4; yield_=rnd(.5,1.0); hist=['소금 평원']; } // 사치
    else { hist=['황무지']; }
  }
  cells[i]={ st, resType, yield_, owner:null, level:0, hist,
    stock:[0,0,0,0,0], food:0, morale:.6, ruinT:0, gov:null, route:0 };
}

function nbrs(i){
  const x=i%COLS,y=i/COLS|0,out=[];
  if(x>0)out.push(i-1); if(x<COLS-1)out.push(i+1);
  if(y>0)out.push(i-COLS); if(y<ROWS-1)out.push(i+COLS);
  return out;
}
function dist(a,b){const ax=a%COLS,ay=a/COLS|0,bx=b%COLS,by=b/COLS|0;return Math.abs(ax-bx)+Math.abs(ay-by);}

/* =====================================================================
   AI 에이전트: 세력(국가) — 지도자/총독/노동층의 3층 위계
   각자 성격(personality)·목표(goal)·기억(memory)·감정(emotion)을 가진다.
   ===================================================================== */
const NAMES=['북부 왕국','붉은 제국','해안 연맹','유목 칸국','삼나무 공화국','잿빛 교단','동방 상단','검은 강 부족','여명 왕조','소금 사막 민족','청옥 군도','철문 동맹'];
const COLORS=['#2563eb','#dc2626','#059669','#7c3aed','#d97706','#0d9488','#be185d','#4d7c0f','#9333ea','#b45309','#0891b2','#475569'];
// 지도자 성격: 자원관(資)·호전성(戰)·신의(信)·탐욕(慾)
const TRAITS=[
  {k:'중상주의', 資:.9, 戰:.3, 信:.6, 慾:.6, desc:'교역으로 부를 쌓는다'},
  {k:'팽창주의', 資:.4, 戰:.9, 信:.3, 慾:.7, desc:'영토가 곧 힘이다'},
  {k:'고립주의', 資:.6, 戰:.2, 信:.5, 慾:.3, desc:'내실을 다진다'},
  {k:'약탈주의', 資:.3, 戰:.8, 信:.2, 慾:.9, desc:'빼앗는 것이 빠르다'},
  {k:'균형주의', 資:.6, 戰:.5, 信:.6, 慾:.5, desc:'무엇 하나에 치우치지 않는다'},
  {k:'신정주의', 資:.5, 戰:.6, 信:.8, 慾:.4, desc:'질서와 신앙으로 다스린다'},
];
const MOOD_GLYPH={기쁨:'😊',분노:'😠',슬픔:'😢',즐거움:'🎉',불안:'😨',평온:'😐',탐욕:'🤑'};

let nameIdx=0, factions=[], obituaries=[];
let year=1, lastEvent='천지가 창조되었습니다.', worldPop=0;
let plague=new Map(), fires=new Map(), dirty=new Set();
let selected=-1, running=true, tickN=0, warCD=0;
const chron=[];          // 연대기 (전체)
const tradeLog=[];       // 교역 장부
const activeRoutes=[];   // 진행 중 카라반 {from,to,res,amt,fid,prog,len}

function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

function makeFaction(){
  if(nameIdx>=NAMES.length) nameIdx=0;
  const t=pick(TRAITS);
  const f={
    id: factions.length?Math.max(...factions.map(x=>x.id))+1:0,
    name:NAMES[nameIdx], color:COLORS[nameIdx%COLORS.length], trait:t,
    arr:[], size:0, golden:0,
    treasury:8,                       // 국고(통화)
    // 감정: 동적으로 변함 (대본 없음)
    emotion:'평온', joy:.5, anger:.1, sorrow:.1, fear:.1, greed:t.慾,
    memory:[],                        // 누구에게 당했나/덕봤나
    relations:new Map(),              // fid -> -1..+1 (관계)
    governors:[],                     // 총독 에이전트 (2층)
    policy:'개척', policyAge:0,        // 지도자가 내린 현 명령
    lastFood:0, lastDeficit:0,
  };
  nameIdx++;
  return f;
}

function spawnFaction(announce, label){
  const f=makeFaction();
  for(let tries=0;tries<400;tries++){
    const i=Math.random()*N|0;
    if(cells[i].st==='land'&&cells[i].owner===null){
      setCell(i,f.id,1,'개척지');
      cells[i].stock[1]=4; cells[i].food=4;
      factions.push(f);
      if(announce) logEvent('econ',`${f.name}이(가) [${f.trait.k}] 기질로 역사에 등장했습니다.`,`=SPAWN("${f.name}";"${f.trait.k}";${ref(i)})`);
      return f;
    }
  }
  return null;
}
function facById(id){return factions.find(f=>f.id===id);}

function setCell(i,owner,level,histLabel){
  const c=cells[i];
  c.owner=owner; c.level=level; if(c.st!=='water') c.st='land';
  if(histLabel){c.hist.push(histLabel); if(c.hist.length>8)c.hist.shift();}
  dirty.add(i);
}

const LV_TXT=['','·','田','邑','城','都'];
const LV_LABEL=['','개척지','농지','읍','성','대도시'];

/* ---------- 칸 렌더 ---------- */
function paint(i){
  const c=cells[i], el=cellEls[i];
  let bg='', tx='', col='#222', w='';
  const cap=el.firstChild, gd=el.lastChild;
  cap.textContent=''; gd.textContent='';
  el.classList.remove('trade');
  if(plague.has(i)){bg='#ead5f5';tx='疫';col='#7030a0';w='700';}
  else if(fires.has(i)){bg='#ffd9b3';tx='火';col='#c00000';w='700';}
  else if(c.st==='water'){bg='#ddebf7';tx='≈';col='#9dc3e6';}
  else if(c.st==='ruin'){bg='#ececec';tx='墟';col='#999';}
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      bg=hexA(f.color,.12+c.level*.14);
      tx=LV_TXT[c.level]; col=f.color; w=c.level>=4?'700':'';
      // 자원 글리프 (우하단)
      if(c.resType) gd.textContent=RES_GLYPH[c.resType];
      // 굶주림 표시 (좌상단)
      if(c.food<0.6 && c.level>0){cap.textContent='!';cap.style.color='#c00000';}
      else if(c.gov!=null){cap.textContent='◆';cap.style.color=hexA(f.color,.9);} // 총독 거점
      else cap.textContent='';
      if(c.route>0){el.classList.add('trade');}
    }
  } else { // 미점유 자연 칸 — 자원만 옅게
    if(c.st==='mountain'){bg='#efeae3';tx='山';col='#9c8e7a';}
    else if(c.st==='forest'){bg='#e2efda';tx='木';col='#7aa45f';}
    else if(c.resType===1){bg='#fbfaf0';tx='';col='#cfcf9a';gd.textContent='穀';gd.style.color='#cfcf9a';}
    else if(c.resType===4){bg='#f7f3ee';tx='';gd.textContent='塩';gd.style.color='#cbb89a';}
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  // textContent를 set하면 자식이 날아가므로 직접 text node 관리
  // 첫 자식(cap)·끝 자식(gd) 유지하고 중앙 글자만 교체
  let mid=el.childNodes[1];
  if(!mid || mid.nodeType!==3){ mid=document.createTextNode(''); el.insertBefore(mid, gd); }
  mid.nodeValue=tx;
}

/* ---------- 로그 ---------- */
function logEvent(kind,msg,formula){
  lastEvent=`서기 ${year}년: ${msg}`;
  if(formula) elFmla.textContent=formula;
  const rec={year,kind,msg,formula:formula||''};
  chron.push(rec); if(chron.length>800) chron.shift();
  pushFeed(rec);
}
function pushFeed(rec){
  const d=document.createElement('div');
  d.className='ev '+rec.kind;
  d.innerHTML=`<span class="yr">서기 ${rec.year}년</span> ${rec.msg}`+
    (rec.formula?`<span class="fm">${escapeHtml(rec.formula)}</span>`:'');
  elFeed.insertBefore(d, elFeed.firstChild);
  while(elFeed.childNodes.length>60) elFeed.removeChild(elFeed.lastChild);
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function flashWar(i){const el=cellEls[i];el.classList.add('war');setTimeout(()=>el.classList.remove('war'),900);}

/* =====================================================================
   감정 엔진 — 사건에서 동적으로 생겨난다 (정해지지 않음)
   ===================================================================== */
function feel(f, kind, mag){
  mag = mag||.1;
  if(kind==='surplus'){ f.joy=clamp(f.joy+mag,0,1); f.sorrow=clamp(f.sorrow-mag*.5,0,1); }
  else if(kind==='famine'){ f.sorrow=clamp(f.sorrow+mag,0,1); f.anger=clamp(f.anger+mag*.7,0,1); f.joy=clamp(f.joy-mag,0,1); }
  else if(kind==='attacked'){ f.anger=clamp(f.anger+mag,0,1); f.fear=clamp(f.fear+mag*.6,0,1); }
  else if(kind==='victory'){ f.joy=clamp(f.joy+mag,0,1); f.anger=clamp(f.anger-mag*.4,0,1); f.fear=clamp(f.fear-mag*.4,0,1); }
  else if(kind==='betrayed'){ f.anger=clamp(f.anger+mag*1.3,0,1); f.sorrow=clamp(f.sorrow+mag*.5,0,1); }
  else if(kind==='trade'){ f.joy=clamp(f.joy+mag*.7,0,1); f.greed=clamp(f.greed+mag*.3,0,1); }
  else if(kind==='gold'){ f.joy=clamp(f.joy+mag,0,1); }
  else if(kind==='loss'){ f.sorrow=clamp(f.sorrow+mag,0,1); f.fear=clamp(f.fear+mag*.5,0,1); }
  // 감정 라벨 결정 (가장 강한 감정)
  const m={기쁨:f.joy*.9, 분노:f.anger, 슬픔:f.sorrow, 불안:f.fear, 탐욕:(f.greed-.5)*.8, 평온:.4, 즐거움:f.golden>0?.85:0};
  let best='평온', bv=-1; for(const k in m) if(m[k]>bv){bv=m[k];best=k;}
  f.emotion=best;
}
function decay(f){ f.joy=clamp(f.joy-.01,0,1); f.anger=clamp(f.anger*.97,0,1); f.sorrow=clamp(f.sorrow*.97,0,1); f.fear=clamp(f.fear*.96,0,1); }

function rel(f,gid){ if(!f.relations.has(gid)) f.relations.set(gid,0); return f.relations.get(gid); }
function setRel(f,gid,v){ f.relations.set(gid,clamp(v,-1,1)); }

/* =====================================================================
   경제 — 생산 / 소비 / 비축 / 교역(물리적 흐름) / 가격
   ===================================================================== */
function economy(f){
  // 1) 생산: 각 칸이 자원 생산. 곡물=식량, 나머지=재화.
  let prod=[0,0,0,0,0], need=0;
  for(const i of f.arr){
    const c=cells[i];
    if(plague.has(i)||fires.has(i)) continue;
    const out=c.yield_*(0.5+c.level*0.45)*(f.golden?1.5:1);
    if(c.resType){ prod[c.resType]+=out; c.stock[c.resType]=clamp(c.stock[c.resType]+out*.4,0,30); }
    need += c.level*0.9;   // 인구가 먹어야 할 식량
  }
  // 2) 식량 분배: 곡물 stock을 굶는 칸으로 (내부 물류). 적자면 기근.
  let foodSupply=prod[1]+f.governors.reduce((s,g)=>s+0,0);
  let granary=0; for(const i of f.arr) granary+=cells[i].stock[1];
  const balance=foodSupply+granary*.15-need;
  f.lastFood=foodSupply; f.lastDeficit=need-foodSupply-granary*.15;

  // 3) 각 칸 food 갱신 + 사기(morale) — 굶으면 떨어진다
  for(const i of f.arr){
    const c=cells[i];
    const share=(need>0)?(c.level*0.9/need):0;
    const got=(foodSupply+granary*.15)*share;
    c.food = clamp(c.food*0.5 + got/(c.level*0.9+0.1)*0.5, 0, 2);
    if(c.food<0.55){ c.morale=clamp(c.morale-0.06,0,1); }
    else { c.morale=clamp(c.morale+0.02,0,1); }
  }
  // granary 소진/축적
  if(balance>0){ for(const i of f.arr){const c=cells[i]; if(c.resType===1) c.stock[1]=clamp(c.stock[1]+balance*.05,0,30);} }
  else { for(const i of f.arr){const c=cells[i]; if(c.stock[1]>0) c.stock[1]=clamp(c.stock[1]+balance*.04,0,30);} }

  // 4) 재화 → 통화: 잉여 자원을 국고로 환산(중상주의일수록 효율↑)
  const merchFactor=0.4+f.trait.資*0.5;
  let coined=0;
  for(let r=2;r<=4;r++){ coined += prod[r]*merchFactor*0.3; }
  f.treasury = clamp(f.treasury + coined + (balance>0?balance*.2:0) - f.size*0.02, 0, 9999);

  // 5) 감정 반영
  if(balance < -1.5){ feel(f,'famine', Math.min(.25, -balance*.04)); }
  else if(balance > 2){ feel(f,'surplus', Math.min(.15, balance*.02)); }
  return balance;
}

/* ---------- 교역: 잉여 세력 → 부족 세력으로 물리적 카라반 ---------- */
function tradeBetween(seller, buyer){
  // seller가 식량 잉여, buyer가 식량 부족 → 식량 수출입 (관계·가격 형성)
  if(seller.id===buyer.id) return;
  if(rel(seller,buyer.id) < -0.3) return;     // 적대국과는 교역 안함
  const r=rel(seller,buyer.id);
  // 가격: 부족할수록 비싸다 (수급 기반). buyer의 결핍이 가격을 올림.
  const scarcity=clamp(buyer.lastDeficit*0.4, 0.3, 3);
  const price=scarcity*(1.0 - r*0.2);          // 우호국엔 할인
  const amt=Math.min(2.0, seller.lastFood-seller.size*0.0);
  if(amt<0.6 || buyer.treasury < price*0.8) return;
  // 물리적 경로: seller 거점 → buyer 거점
  const src=pick(seller.arr), dst=pick(buyer.arr);
  if(src===undefined||dst===undefined) return;
  const len=Math.max(2,dist(src,dst));
  activeRoutes.push({from:src,to:dst,res:1,amt,fid:seller.id,bid:buyer.id,prog:0,len,price});
  buyer.treasury=clamp(buyer.treasury-price,0,9999);
  seller.treasury=clamp(seller.treasury+price,0,9999);
  setRel(seller,buyer.id, rel(seller,buyer.id)+0.12);
  setRel(buyer,seller.id, rel(buyer,seller.id)+0.12);
  feel(seller,'trade',.12); feel(buyer,'trade',.08);
  tradeLog.push({year,from:seller.name,to:buyer.name,res:RES[1],amt:amt.toFixed(1),price:price.toFixed(1)});
  if(tradeLog.length>400) tradeLog.shift();
  if(warCD===0){
    logEvent('econ',`${seller.name}→${buyer.name} 곡물 교역로 개설 (값 ${price.toFixed(1)}냥).`,
      `=TRADE("${seller.name}"→"${buyer.name}";穀;${amt.toFixed(1)};${ref(dst)})`);
    warCD=18;
  }
}
function moveRoutes(){
  for(let i=0;i<N;i++) if(cells[i].route>0){cells[i].route--; if(cells[i].route<=0)dirty.add(i);}
  for(let k=activeRoutes.length-1;k>=0;k--){
    const rt=activeRoutes[k];
    rt.prog++;
    // 카라반 위치 표시 (단순 보간 칸)
    const t=rt.prog/rt.len;
    const fx=rt.from%COLS,fy=rt.from/COLS|0,tx=rt.to%COLS,ty=rt.to/COLS|0;
    const cx=Math.round(fx+(tx-fx)*t), cy=Math.round(fy+(ty-fy)*t);
    const ci=cy*COLS+cx;
    if(ci>=0&&ci<N){ cells[ci].route=2; dirty.add(ci); }
    if(rt.prog>=rt.len){
      const buyer=facById(rt.bid);
      if(buyer && buyer.arr.length){
        // 도착: 식량 비축, 사기 회복
        for(const i of buyer.arr.slice(0,6)){ cells[i].food=clamp(cells[i].food+rt.amt*0.2,0,2); cells[i].morale=clamp(cells[i].morale+0.08,0,1);}
        feel(buyer,'surplus',.1);
      }
      activeRoutes.splice(k,1);
    }
  }
}

/* =====================================================================
   지휘체계 — 지도자 결정 → 총독 해석(복종/태업/항명/배신) → 노동 실행
   ===================================================================== */
function leaderDecide(f, balance){
  // 지도자는 경제 상태 + 성격 + 감정을 읽고 '정책'을 정한다 (대본 아님)
  f.policyAge++;
  const t=f.trait;
  let score={개척:0, 발전:0, 교역:0, 전쟁:0, 긴축:0};
  // 식량 적자 → 개척(농지 확보) or 전쟁(약탈) 압력
  if(balance<-0.5){ score.개척+=2; score.전쟁+= t.戰*2 + f.anger*1.5; score.긴축+=1; }
  else { score.발전 += 1.5; }
  // 국고 풍부 + 중상 → 교역
  score.교역 += t.資*2 + (f.treasury>10?1.5:0) - f.fear;
  // 호전성·분노 → 전쟁
  score.전쟁 += t.戰*1.5 + f.anger*1.5 + f.greed - f.fear*1.2;
  // 불안·고립 → 긴축/발전
  score.긴축 += f.fear*2; score.발전 += (1-t.戰);
  // 작으면 개척 우선
  if(f.size<5) score.개척+=2;
  // 황금기엔 발전·교역
  if(f.golden){ score.발전+=2; score.교역+=1; }
  let best='개척',bv=-1e9; for(const k in score) if(score[k]>bv){bv=score[k];best=k;}
  if(best!==f.policy){
    f.policy=best; f.policyAge=0;
    if(warCD===0 && Math.random()<.5){
      logEvent('econ',`${f.name}의 지도자가 ‘${best}’ 정책을 선포했습니다. (민심 ${f.emotion})`,
        `=POLICY("${f.name}";"${best}";식량수지=${balance.toFixed(1)})`);
      warCD=14;
    }
  }
}

function governorAct(f, gi){
  // 총독: 자기 거점 영역을 자율 통치. 지도자 정책을 자기 충성도/이익으로 '해석'.
  const c=cells[gi]; if(!c||c.owner!==f.id) return;
  const g=c.gov; if(!g) return;
  g.loyalty=clamp(g.loyalty,-1,1);
  // 굶주린 영지의 총독은 충성이 떨어진다 (실재처럼)
  const localMorale = c.morale;
  if(localMorale<0.45){ g.loyalty=clamp(g.loyalty-0.03,-1,1); g.unrest=clamp(g.unrest+0.05,0,1); }
  else { g.loyalty=clamp(g.loyalty+0.01,-1,1); g.unrest=clamp(g.unrest-0.02,0,1); }
  // 부패한 총독은 국고를 횡령 (탐욕)
  if(g.corrupt>0.6 && Math.random()<0.04 && f.treasury>3){
    const steal=Math.min(2,f.treasury*0.1);
    f.treasury-=steal; g.pocket+=steal;
    if(warCD===0 && Math.random()<.4){
      logEvent('doom',`${f.name}의 총독 ${g.name}이(가) 국고 ${steal.toFixed(1)}냥을 횡령했습니다.`,
        `=EMBEZZLE("${g.name}";${steal.toFixed(1)};${ref(gi)})`); warCD=20;
    }
  }
  // 항명/배신: 충성 낮고 영지 불안 높으면 독립 선언
  if(g.loyalty<-0.5 && g.unrest>0.6 && Math.random()<0.05){
    secede(f, gi, g);
  }
}

function secede(f, gi, g){
  // 총독의 영역이 통째로 떨어져 나가 새 세력이 된다 (반란/분열)
  const region=[]; const seen=new Set([gi]); const q=[gi];
  while(q.length && region.length<14){
    const cur=q.shift(); if(cells[cur].owner!==f.id) continue;
    region.push(cur);
    for(const n of nbrs(cur)) if(!seen.has(n) && cells[n].owner===f.id && Math.random()<0.7){ seen.add(n); q.push(n); }
  }
  if(region.length<2) return;
  const nf=makeFaction();
  nf.name=g.name+' 분국'; nf.trait=pick(TRAITS);
  nf.emotion='분노'; nf.anger=.8;
  factions.push(nf);
  for(const i of region){ cells[i].owner=nf.id; cells[i].gov=null; cells[i].hist.push('독립'); if(cells[i].hist.length>8)cells[i].hist.shift(); dirty.add(i);}
  cells[gi].gov={name:nf.name+' 의회',loyalty:.6,unrest:0,corrupt:rnd(0,.5),pocket:0};
  setRel(f,nf.id,-0.8); setRel(nf,f.id,-0.6);
  feel(f,'betrayed',.3); feel(nf,'victory',.2);
  f.memory.push(`${g.name} 반란`);
  logEvent('doom',`${g.name} 총독이 ${f.name}에 반기를 들고 독립을 선언했습니다! (충성 붕괴)`,
    `=SECEDE("${g.name}";from="${f.name}";${region.length}칸)`);
}

function maybeAppointGov(f){
  // 영토가 커지면 지도자가 총독을 임명 (2층 위계 생성)
  if(f.size<6) return;
  const cap = 1 + (f.size/8|0);
  let cur=0; for(const i of f.arr) if(cells[i].gov) cur++;
  if(cur>=cap) return;
  // 멀고 발전된 칸에 총독 임명
  const cand=f.arr.filter(i=>!cells[i].gov && cells[i].level>=2);
  if(!cand.length) return;
  const gi=pick(cand);
  cells[gi].gov={
    name:pick(['아젠','카릴','보른','세이','두마','라힌','오릭','테무','한솔','비란'])+pick(['','경','공','후','백'] ),
    loyalty:rnd(.3,.9), unrest:rnd(0,.2), corrupt:f.trait.慾*rnd(.3,1), pocket:0
  };
  dirty.add(gi);
  if(warCD===0 && Math.random()<.4){
    logEvent('diplo',`${f.name}이(가) ${ref(gi)}에 총독 ${cells[gi].gov.name}을(를) 임명했습니다.`,
      `=APPOINT("${cells[gi].gov.name}";${ref(gi)})`); warCD=16;
  }
}

/* =====================================================================
   외교 — 관계에 따라 동맹/적대. 자원 보완성이 동맹을 낳는다.
   ===================================================================== */
function diplomacy(){
  for(const a of factions){
    for(const b of factions){
      if(a.id>=b.id) continue;
      const r=rel(a,b.id);
      // 한쪽 식량잉여+다른쪽 부족 → 우호 (보완)
      if((a.lastDeficit<-1 && b.lastDeficit>1)||(b.lastDeficit<-1 && a.lastDeficit>1)){
        setRel(a,b.id,r+0.01); setRel(b,a.id,rel(b,a.id)+0.01);
      }
      // 둘 다 굶주리고 인접 → 자원 경쟁 → 적대
      if(a.lastDeficit>1 && b.lastDeficit>1 && adjacent(a,b)){
        setRel(a,b.id,r-0.02); setRel(b,a.id,rel(b,a.id)-0.02);
      }
      // 동맹 선포
      if(rel(a,b.id)>0.75 && !a._allies?.has?.(b.id)){
        a._allies=a._allies||new Set(); b._allies=b._allies||new Set();
        if(!a._allies.has(b.id)){
          a._allies.add(b.id); b._allies.add(a.id);
          if(warCD===0){ logEvent('diplo',`${a.name}과(와) ${b.name}이(가) 교역 동맹을 맺었습니다.`,
            `=ALLY("${a.name}";"${b.name}")`); warCD=22; }
        }
      }
    }
  }
}
function adjacent(a,b){
  for(const i of a.arr){ for(const n of nbrs(i)) if(cells[n].owner===b.id) return true; }
  return false;
}

/* =====================================================================
   메인 틱 — 모든 에이전트가 상태를 읽고 스스로 결정. 결과는 매번 다르다.
   ===================================================================== */
function tick(){
  if(!running) return;
  tickN++; year++;
  if(warCD>0) warCD--;

  // 재집계
  for(const f of factions){ f.arr.length=0; f.size=0; }
  worldPop=0;
  const PW=[0,30,120,360,900,2000];
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin' && --c.ruinT<=0){ c.st='land'; dirty.add(i); }
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){ f.arr.push(i); f.size++; worldPop+=PW[c.level]*(0.5+c.morale*0.5); }
      else { c.owner=null; c.level=0; c.gov=null; dirty.add(i); }
    }
  }

  // 멸망 판정
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      obituaries.push({name:f.name,year,trait:f.trait.k,cause:f.lastCause||'영토 상실'});
      logEvent('doom',`${f.name}이(가) 역사에서 사라졌습니다. (${f.lastCause||'영토 상실'})`,`=COLLAPSE("${f.name}";${year})`);
      factions.splice(k,1);
    }
  }

  // 자연재해: 화재 / 역병
  for(const [i,t] of [...fires]){
    if(Math.random()<.12){ for(const n of nbrs(i)){ const c=cells[n]; if(c.owner!==null&&!fires.has(n)&&c.st==='land'){fires.set(n,5);dirty.add(n);} } }
    if(t<=1){ fires.delete(i); const c=cells[i]; const f=facById(c.owner); if(f){f.lastCause='대화재'; feel(f,'loss',.15);} c.owner=null;c.level=0;c.gov=null;c.st='ruin';c.ruinT=180; c.hist.push('잿더미'); if(c.hist.length>8)c.hist.shift(); dirty.add(i);}
    else fires.set(i,t-1);
  }
  if(plague.size){
    for(const [i,t] of [...plague]){
      if(Math.random()<.16){ for(const n of nbrs(i)){ if(cells[n].owner!==null&&!plague.has(n)){plague.set(n,11);dirty.add(n);} } }
      if(Math.random()<.22){ const c=cells[i]; c.level--; const f=facById(c.owner); if(f)feel(f,'loss',.06); if(c.level<=0){c.owner=null;c.level=0;c.gov=null;c.hist.push('역병으로 소멸');if(c.hist.length>8)c.hist.shift();} dirty.add(i);}
      if(t<=1){plague.delete(i);dirty.add(i);} else plague.set(i,t-1);
    }
    if(plague.size===0) logEvent('doom','역병이 물러갔습니다.','=PLAGUE.END()');
  }

  // ===== 세력별 에이전트 의사결정 =====
  for(const f of factions){
    if(f.golden>0) f.golden--;
    if(f.size===0) continue;
    decay(f);

    // 1) 경제 정산 (생산/소비/사기)
    const balance = economy(f);

    // 2) 지도자 결정
    leaderDecide(f, balance);

    // 3) 총독 임명·통치 (2층)
    maybeAppointGov(f);
    for(const i of f.arr) if(cells[i].gov) governorAct(f, i);

    // 4) 정책 실행 — 노동/병사 에이전트가 정책을 수행 (사기에 따라 강도 변동)
    const avgMorale = f.arr.reduce((s,i)=>s+cells[i].morale,0)/(f.size||1);
    const vigor = 0.4 + avgMorale*0.9 + (f.golden?0.5:0);   // 사기 높을수록 활발
    executePolicy(f, balance, vigor);

    // 5) 봉기: 사기 폭락하면 영지 이탈/반란
    if(avgMorale<0.32 && Math.random()<0.04){
      const lc=f.arr.filter(i=>cells[i].morale<0.3);
      if(lc.length){ const i=pick(lc); cells[i].owner=null; cells[i].level=0; cells[i].gov=null; cells[i].hist.push('민란'); dirty.add(i);
        feel(f,'famine',.15); f.lastCause='기근과 민란';
        if(warCD===0&&Math.random()<.5){ logEvent('doom',`${f.name}의 ${ref(i)}에서 굶주린 백성이 봉기했습니다.`,`=REVOLT("${f.name}";${ref(i)};사기=${cells[i].morale.toFixed(2)})`); warCD=18; }
      }
    }
  }

  // ===== 외교 & 교역 (세력 간 상호작용) =====
  diplomacy();
  // 교역: 잉여 세력 → 부족 세력
  const sellers=factions.filter(f=>f.lastDeficit<-1 && f.lastFood>1);
  const buyers =factions.filter(f=>f.lastDeficit>0.8);
  for(const b of buyers){
    // buyer는 가장 우호적이거나 가까운 seller를 선택 (자율 선택)
    let best=null,bs=-1e9;
    for(const s of sellers){ if(s.id===b.id)continue; const sc=rel(b,s.id)*2 + s.lastFood*0.3 - (s.trait.資<0.4?1:0); if(sc>bs){bs=sc;best=s;} }
    if(best && Math.random()<0.4) tradeBetween(best,b);
  }
  moveRoutes();

  // ===== 무작위 거대 사건 =====
  worldEvents();

  // 신규 세력 도래 (다양성 유지)
  if(factions.length<3 && Math.random()<.02 && factions.length<8){
    const f=spawnFaction(false);
    if(f) logEvent('econ',`바다 건너에서 ${f.name}이(가) 도래했습니다.`,`=MIGRATE("${f.name}")`);
  }

  // 렌더
  for(const i of dirty) paint(i);
  dirty.clear();
  renderStatus();
  if(tickN%6===0) renderLegend();
  if(activeOverlay) renderOverlay(activeOverlay);
}

function executePolicy(f, balance, vigor){
  const expandTries = Math.max(1, Math.round((1 + f.size*0.06) * vigor * (f.policy==='개척'?1.6:0.7)));
  const warBias = (f.policy==='전쟁') ? 0.55 : (f.policy==='긴축'?0.05:0.22);
  const devTries = Math.max(1, Math.round((1 + f.size*0.05) * vigor * (f.policy==='발전'?1.6:0.8)));

  // --- 확장/전쟁 ---
  for(let a=0;a<expandTries;a++){
    const src=pick(f.arr);
    if(src===undefined||cells[src].owner!==f.id) continue;
    const tgt=pick(nbrs(src)); const tc=cells[tgt];
    if(tc.st==='water'||fires.has(tgt)) continue;
    if(tc.owner===null){
      if(tc.st==='forest'){ if(Math.random()<.3){ tc.st='land'; tc.hist.push('개간'); setCell(tgt,f.id,1,'개척지'); } }
      else if(tc.st==='mountain'){ if(Math.random()<.18){ tc.st='land'; tc.hist.push('채굴 거점'); setCell(tgt,f.id,1,'광산'); } }
      else { setCell(tgt,f.id,1,'개척지'); cells[tgt].morale=0.6; }
    } else if(tc.owner!==f.id){
      const defF=facById(tc.owner);
      if(!defF) continue;
      // 동맹/우호국은 공격 안함 (정책이 전쟁이어도 신의 높으면 자제)
      if(rel(f,defF.id)>0.5 && Math.random()<f.trait.信) continue;
      if(Math.random()<warBias){
        // 전쟁: 공격력 = 사기+국고+황금기+분노 / 방어력 = 레벨+사기
        const att = 1 + Math.random()*2.5 + f.size*0.002 + (f.golden?1:0) + f.anger*1.5 + (f.treasury>15?0.8:0);
        const def = tc.level + 1 + Math.random()*2 + cells[tgt].morale*1.5;
        flashWar(tgt);
        if(att>def){
          if(Math.random()<.28){ fires.set(tgt,5); tc.hist.push('전화(戰火)'); if(tc.hist.length>8)tc.hist.shift(); dirty.add(tgt); }
          else { setCell(tgt,f.id,Math.max(1,tc.level-1),'점령됨'); cells[tgt].morale=0.45; cells[tgt].gov=null; }
          feel(f,'victory',.12); feel(defF,'attacked',.15); defF.lastCause=`${f.name}의 침공`;
          setRel(f,defF.id, rel(f,defF.id)-0.15); setRel(defF,f.id, rel(defF,f.id)-0.2);
          defF.memory.push(`${f.name}에게 ${ref(tgt)} 상실`);
          if((tc.level>=3||warCD===0)){
            logEvent('war',`${f.name}이(가) ${defF.name}의 ${LV_LABEL[Math.max(1,tc.level)]||'영토'}(${ref(tgt)})를 점령했습니다.`,
              `=WAR("${f.name}"→"${defF.name}";${ref(tgt)};공=${att.toFixed(1)}>방=${def.toFixed(1)})`); warCD=24;
          }
        } else {
          feel(f,'loss',.05); feel(defF,'victory',.08);
        }
      }
    }
  }

  // --- 발전 (자원·식량 충분할 때 더 잘 됨) ---
  for(let u=0;u<devTries;u++){
    const i=pick(f.arr);
    if(i===undefined||cells[i].owner!==f.id) continue;
    const c=cells[i];
    const wellFed = c.food>0.7;
    const upChance = 0.05 * (f.golden?3:1) * (wellFed?1.4:0.3) * (f.policy==='발전'?1.5:1) * (1+c.morale*0.5);
    if(c.level<5 && Math.random()<upChance){
      c.level++; c.hist.push(LV_LABEL[c.level]); if(c.hist.length>8)c.hist.shift(); dirty.add(i);
      if(c.level===5 && warCD===0){
        logEvent('econ',`${f.name}의 ${ref(i)}에 대도시가 융성했습니다. (식량 자급 ${(f.lastFood).toFixed(1)})`,`=METROPOLIS("${f.name}";${ref(i)})`);
        warCD=22; feel(f,'gold',.1);
      }
    }
  }
}

function worldEvents(){
  const r=Math.random();
  if(!plague.size && r<.004){
    const big=cells.map((c,i)=>({c,i})).filter(o=>o.c.owner!==null&&o.c.level>=3);
    if(big.length){ const o=pick(big); plague.set(o.i,11); dirty.add(o.i); const f=facById(o.c.owner); if(f)f.lastCause='역병';
      logEvent('doom',`${ref(o.i)}에서 역병이 창궐했습니다.`,`=PLAGUE(${ref(o.i)})`); }
  } else if(r>.995 && factions.length){
    const f=pick(factions); f.golden=80; feel(f,'gold',.3);
    logEvent('econ',`${f.name}의 황금기가 시작되었습니다! (민심 ${f.emotion})`,`=GOLDEN.AGE("${f.name}";80)`);
  } else if(r>.992 && r<=.995){
    const towns=cells.map((c,i)=>({c,i})).filter(o=>o.c.owner!==null&&o.c.level>=2);
    if(towns.length){ const o=pick(towns); fires.set(o.i,6); dirty.add(o.i);
      logEvent('doom',`${ref(o.i)}에 대화재가 발생했습니다.`,`=FIRE(${ref(o.i)})`); }
  } else if(r>.989 && r<=.992 && factions.length>1){
    // 자원 충격: 무역로 단절/풍년
    const f=pick(factions);
    if(Math.random()<0.5){ f.treasury=clamp(f.treasury+rnd(4,10),0,9999); feel(f,'gold',.2);
      logEvent('econ',`${f.name}에 대풍년이 들어 국고가 넘쳤습니다.`,`=HARVEST("${f.name}";+${rnd(4,10).toFixed(0)}냥)`); }
    else { f.treasury=clamp(f.treasury*0.5,0,9999); feel(f,'famine',.15); f.lastCause='경제 붕괴';
      logEvent('econ',`${f.name}에 흉년이 들어 통화가 폭락했습니다.`,`=DROUGHT("${f.name}")`); }
  }
}

/* =====================================================================
   사이드 패널 / 상태바 / 범례
   ===================================================================== */
function renderStatus(){
  const totT=factions.reduce((s,f)=>s+f.treasury,0);
  elStatus.innerHTML=
    `준비<span class="sep">|</span>서기 ${year}년`+
    `<span class="sep">|</span>인구 ${Math.round(worldPop).toLocaleString()}`+
    `<span class="sep">|</span>국가 ${factions.length}곳`+
    `<span class="sep">|</span>세계 국고 ${Math.round(totT)}냥`+
    `<span class="sep">|</span>교역로 ${activeRoutes.length}`+
    `<span class="sep">|</span><span class="ev">${escapeHtml(lastEvent)}</span>`;
}
function moodBar(label,v,col){return `<div class="mood">${label}<div class="bar" style="width:${Math.round(v*100)}%;background:${col}"></div></div>`;}
function renderLegend(){
  let h='<h4>세력 현황 · 민심</h4>';
  const sorted=[...factions].sort((a,b)=>b.size-a.size).slice(0,8);
  for(const f of sorted){
    const def=f.lastDeficit;
    const econ = def>1?'<span style="color:#c00">기근</span>':def<-1?'<span style="color:#107c41">잉여</span>':'안정';
    h+=`<div class="frow"><span><span class="sw" style="background:${f.color}"></span>${f.name}${f.golden?' ✦':''}</span>`+
       `<span>${MOOD_GLYPH[f.emotion]||''}</span></div>`+
       `<div style="font-size:9px;color:#7a6a1f;margin-bottom:2px">[${f.trait.k}] ${f.size}칸·국고${Math.round(f.treasury)}냥·식량 ${econ}·총독${f.arr.filter(i=>cells[i].gov).length}</div>`;
  }
  if(obituaries.length){
    h+='<h4>멸망기록</h4>';
    for(const o of obituaries.slice(-3)) h+=`<div class="dead">† ${o.name} (${o.year}년·${o.cause})</div>`;
  }
  elLegend.innerHTML=h;
  document.getElementById('tab-dead').textContent=`멸망기록 (${obituaries.length})`;
}

/* ---------- 시트 클릭 = 그 땅의 역사·자원·민심 + 개입 ---------- */
elSheet.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  if(selected>=0) cellEls[selected].classList.remove('sel');
  selected=+t.dataset.i; t.classList.add('sel');
  elName.textContent=ref(selected);
  const c=cells[selected];
  const f=c.owner!=null?facById(c.owner):null;
  let parts=[];
  parts.push(`지형=${c.st==='water'?'바다':c.st==='mountain'?'산악':c.st==='forest'?'숲':c.st==='ruin'?'폐허':'평지'}`);
  if(c.resType) parts.push(`자원=${RES[c.resType]}(${c.yield_.toFixed(1)})`);
  if(f){
    parts.push(`소유=${f.name}`); parts.push(`등급=${LV_LABEL[c.level]}`);
    parts.push(`식량=${c.food.toFixed(2)}`); parts.push(`사기=${(c.morale*100|0)}%`);
    if(c.gov) parts.push(`총독=${c.gov.name}(충성 ${(c.gov.loyalty*100|0)}%)`);
  }
  elFmla.textContent=`=INSPECT(${ref(selected)}; ${parts.join('; ')}) | 역사: ${c.hist.join('→')}`;
  // 개입 힌트
  if(f){
    elHint.innerHTML=`<b>${ref(selected)}</b> · ${f.name} (${f.emotion})<br>클릭 개입: <span style="cursor:pointer;color:#107c41;text-decoration:underline" id="iv-gift">식량 원조</span> · <span style="cursor:pointer;color:#c00;text-decoration:underline" id="iv-rebel">선동(반란)</span> · <span style="cursor:pointer;color:#7c3aed;text-decoration:underline" id="iv-bless">축복(발전)</span>`;
    document.getElementById('iv-gift').onclick=()=>{ for(const i of f.arr){cells[i].food=clamp(cells[i].food+0.6,0,2);cells[i].morale=clamp(cells[i].morale+0.15,0,1);} feel(f,'surplus',.3); logEvent('econ',`[개입] 신의 손이 ${f.name}에 식량을 내렸습니다.`,`=INTERVENE.AID("${f.name}")`); };
    document.getElementById('iv-rebel').onclick=()=>{ const gv=f.arr.filter(i=>cells[i].gov); if(gv.length){const gi=pick(gv); cells[gi].gov.loyalty=-0.9; cells[gi].gov.unrest=0.9;} for(const i of f.arr.slice(0,5))cells[i].morale=clamp(cells[i].morale-0.4,0,1); feel(f,'famine',.4); logEvent('doom',`[개입] ${f.name}에 불온한 기운이 번집니다…`,`=INTERVENE.UNREST("${f.name}")`); };
    document.getElementById('iv-bless').onclick=()=>{ f.golden=80; feel(f,'gold',.4); for(const i of f.arr)cells[i].morale=clamp(cells[i].morale+0.2,0,1); logEvent('econ',`[개입] ${f.name}에 황금기가 강림했습니다.`,`=INTERVENE.GOLDEN("${f.name}")`); };
  } else {
    elHint.innerHTML=`<b>${ref(selected)}</b> · 빈 땅<br>클릭 개입: <span style="cursor:pointer;color:#107c41;text-decoration:underline" id="iv-spawn">새 문명 발흥</span>`;
    const sp=document.getElementById('iv-spawn'); if(sp) sp.onclick=()=>{ if(c.st==='water'){elHint.innerHTML='바다에는 문명이 설 수 없습니다.';return;} const nf=makeFaction(); factions.push(nf); setCell(selected,nf.id,1,'개척지'); cells[selected].food=2; cells[selected].morale=0.7; logEvent('econ',`[개입] ${ref(selected)}에서 ${nf.name}이(가) 발흥했습니다.`,`=INTERVENE.SPAWN("${nf.name}";${ref(selected)})`); };
  }
});

/* ---------- 시트 탭 (Sheet1 / 연대기 / 멸망기록 / 교역장부) ---------- */
let activeOverlay=null;
document.getElementById('tabs').addEventListener('click', e=>{
  const t=e.target.closest('div[data-v]'); if(!t) return;
  document.querySelectorAll('#tabs div').forEach(d=>d.classList.remove('on'));
  t.classList.add('on');
  const v=t.dataset.v;
  if(v==='sheet'){ elOver.style.display='none'; activeOverlay=null; }
  else { activeOverlay=v; elOver.style.display='block'; renderOverlay(v); }
});
function renderOverlay(v){
  let html='';
  if(v==='chron'){
    html='<table><thead><tr><th>연도</th><th>사건</th><th>수식 로그</th></tr></thead><tbody>';
    for(const r of [...chron].reverse().slice(0,300))
      html+=`<tr class="${r.kind}"><td class="yr">서기 ${r.year}년</td><td>${escapeHtml(r.msg)}</td><td class="fm">${escapeHtml(r.formula)}</td></tr>`;
    html+='</tbody></table>';
  } else if(v==='dead'){
    html='<table><thead><tr><th>세력</th><th>기질</th><th>멸망 연도</th><th>사인</th></tr></thead><tbody>';
    if(!obituaries.length) html+='<tr><td colspan="4" style="color:#999">아직 멸망한 문명이 없습니다.</td></tr>';
    for(const o of [...obituaries].reverse())
      html+=`<tr class="doom"><td>${escapeHtml(o.name)}</td><td>${escapeHtml(o.trait)}</td><td class="yr">서기 ${o.year}년</td><td>${escapeHtml(o.cause)}</td></tr>`;
    html+='</tbody></table>';
  } else if(v==='trade'){
    html='<table><thead><tr><th>연도</th><th>판매국</th><th>구매국</th><th>품목</th><th>수량</th><th>가격(냥)</th></tr></thead><tbody>';
    if(!tradeLog.length) html+='<tr><td colspan="6" style="color:#999">아직 교역 기록이 없습니다. 식량 잉여국과 부족국이 생기면 교역로가 열립니다.</td></tr>';
    for(const r of [...tradeLog].reverse().slice(0,300))
      html+=`<tr class="econ"><td class="yr">서기 ${r.year}년</td><td>${escapeHtml(r.from)}</td><td>${escapeHtml(r.to)}</td><td>${r.res}</td><td>${r.amt}</td><td>${r.price}</td></tr>`;
    html+='</tbody></table>';
  }
  elOver.innerHTML=html;
}

/* ---------- 재생/일시정지 ---------- */
const runbtn=document.getElementById('runbtn');
runbtn.addEventListener('click',()=>{ running=!running; runbtn.textContent = running?'⏸ 일시정지':'▶ 재생'; });

/* ---------- 시작 ---------- */
for(let i=0;i<N;i++) paint(i);
elFmla.textContent=`=SIM.CIVILIZATION($A$1:$${colName(COLS-1)}$${ROWS}; agents=자율; economy=수급; emotion=창발)`;
spawnFaction(true); spawnFaction(true); spawnFaction(true);
if(N>500){ spawnFaction(true); }
renderStatus(); renderLegend();
setInterval(tick, 120);
})();
</script>
