<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문명.xlsx - Excel</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:none}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar .ttl{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #titlebar .spd{margin-left:auto;display:flex;gap:4px;align-items:center}
  #titlebar .spd button{font:inherit;font-size:11px;border:1px solid #cfcfcf;background:#fff;
    color:#444;border-radius:3px;padding:2px 8px;cursor:pointer}
  #titlebar .spd button.on{background:#107c41;color:#fff;border-color:#107c41}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;flex:none;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  #fbar{min-height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px;flex:none}
  #namebox{width:78px;min-width:78px;height:26px;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;font-weight:600}
  #fx{width:28px;min-width:28px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #body{flex:1;display:flex;min-height:0}
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1;min-width:0}
  #sheet{display:grid;background:#fff}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:10.5px}
  .cell{border-right:1px solid #e6e6e6;border-bottom:1px solid #e6e6e6;
    display:flex;align-items:center;justify-content:center;font-size:11px;
    overflow:hidden;cursor:cell;position:relative}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:3}
  .cell .cap{position:absolute;top:0;right:1px;font-size:8px;line-height:1}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #ff2d2d}50%{box-shadow:inset 0 0 0 2px #ffb3b3}}
  .war{animation:warf .3s 4}
  @keyframes revf{0%,100%{box-shadow:inset 0 0 0 2px #111}50%{box-shadow:inset 0 0 0 2px #f5c000}}
  .rev{animation:revf .28s 5}
  /* 오른쪽 패널 = 인스펙터 */
  #panel{width:262px;min-width:262px;background:#fbfbfb;border-left:1px solid #d4d4d4;
    display:flex;flex-direction:column;font-size:11px;overflow:hidden}
  #panel .ph{background:#107c41;color:#eaf6ee;padding:5px 9px;font-weight:600;font-size:11px;flex:none}
  #panel .pbody{flex:1;overflow-y:auto;padding:7px 9px;line-height:1.55}
  #panel h4{margin:9px 0 3px;font-size:10.5px;color:#107c41;border-bottom:1px solid #e0e0e0;padding-bottom:2px}
  #panel h4:first-child{margin-top:0}
  .agent{margin:5px 0;padding:5px 6px;border:1px solid #e3e3e3;border-radius:4px;background:#fff}
  .agent .nm{font-weight:600}
  .agent .rk{display:inline-block;font-size:9px;color:#fff;border-radius:2px;padding:0 4px;margin-right:4px;vertical-align:1px}
  .bar{height:6px;border-radius:3px;background:#eee;overflow:hidden;margin:2px 0}
  .bar i{display:block;height:100%}
  .mood{display:flex;gap:3px;margin:3px 0;flex-wrap:wrap}
  .mood span{font-size:9px;background:#f0f0f0;border-radius:2px;padding:0 3px}
  .traitrow{color:#666;font-size:9.5px}
  .sw{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:1px;vertical-align:0}
  .dead{color:#999;font-size:10px}
  .ev{font-size:10px;color:#333;border-left:2px solid #ccc;padding:2px 0 2px 6px;margin:3px 0}
  .ev.war{border-color:#dc2626}.ev.rev{border-color:#111}.ev.gold{border-color:#d9a300}
  .ev.col{border-color:#777}.ev.born{border-color:#059669}.ev.betray{border-color:#7c3aed}
  .ev .yr{color:#999}
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;flex:none;white-space:nowrap;overflow:hidden}
  #statusbar .sep{margin:0 9px;opacity:.5}
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:24px;
    border-top:1px solid #d4d4d4;font-size:11.5px;flex:none}
  #tabs div{padding:3px 13px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fbfbfb;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  /* 시트 오버레이(연대기/멸망/계급) */
  #overlay{position:absolute;inset:0;background:#fbfbfb;overflow:auto;display:none;padding:0}
  #overlay.show{display:block}
  table.gx{border-collapse:collapse;width:100%;font-size:11px}
  table.gx th{background:#f5f5f5;border:1px solid #d0d0d0;padding:3px 7px;color:#555;font-weight:600;
    position:sticky;top:0;text-align:left;font-size:10.5px}
  table.gx td{border:1px solid #e6e6e6;padding:3px 7px;vertical-align:top}
  table.gx td.idx{background:#f5f5f5;color:#888;text-align:center;width:34px}
  .pill{display:inline-block;border-radius:2px;padding:0 5px;color:#fff;font-size:10px}
  /* 모바일 인스펙터 드로어 */
  #mobpanel{position:absolute;left:0;right:0;bottom:0;max-height:62%;background:#fbfbfb;
    border-top:2px solid #107c41;box-shadow:0 -3px 12px rgba(0,0,0,.18);z-index:20;
    display:none;flex-direction:column}
  #mobpanel.show{display:flex}
  #mobpanel .mh{background:#107c41;color:#eaf6ee;padding:6px 10px;font-weight:600;font-size:11.5px;
    display:flex;align-items:center;justify-content:space-between;flex:none}
  #mobpanel .mh button{font:inherit;background:rgba(255,255,255,.2);color:#fff;border:none;
    border-radius:3px;padding:2px 9px;cursor:pointer;font-size:13px;line-height:1}
  #mobpanel .mbody{overflow-y:auto;padding:8px 10px;line-height:1.55}
  @media(max-width:640px){
    #panel{display:none}
    #menubar{gap:11px;font-size:11px}
    #titlebar .ttl{font-size:11px}
  }
  @media(min-width:641px){ #mobpanel{display:none !important} }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <div class="ttl" id="ttl">문명.xlsx - Excel</div>
    <div class="spd">
      <button data-spd="0">⏸</button>
      <button data-spd="1" class="on">▶</button>
      <button data-spd="3">▶▶</button>
    </div>
  </div>
  <div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
  <div id="fbar">
    <div id="namebox">A1</div>
    <div id="fx">fx</div>
    <div id="formula"></div>
  </div>
  <div id="body">
    <div id="sheetwrap">
      <div id="sheet"></div>
      <div id="overlay"></div>
      <div id="mobpanel">
        <div class="mh"><span id="mobHead">통치 인스펙터</span><button id="mobClose">✕</button></div>

      </div>

      <div class="ph" id="panelHead">통치 인스펙터</div>

  <div id="tabs">
    <div class="on" data-tab="map">Sheet1</div>
    <div data-tab="chron">연대기</div>
    <div data-tab="class">계급장부</div>
    <div data-tab="dead" id="tab-dead">멸망기록 (0)</div>
  </div>
  <div id="statusbar"></div>
</div>

<script>
"use strict";
(() => {
/* =====================================================================
   문명.xlsx — 창발적 AI 문명 시뮬레이션 (계급 갈등과 반란 렌즈)
   엑셀 위장: 셀=지도, 수식바=AI 의사결정, 시트=연대기/계급/멸망기록.
   각 세력은 군주-귀족-평민의 다층 위계. 에이전트는 성격/기억/감정을
   가지고 스스로 판단한다. 명령은 해석되고 때로 항명·배신당한다.
   감정(희노애락)은 사건에서 창발하여 결정을 바꾼다. 대본 없음.
   ===================================================================== */

/* ---------- 그리드 ---------- */
const CW = 30, CH = 21;
function calcGeom(){
  const w = innerWidth, h = innerHeight;
  const narrow = w <= 640;
  const sheetW = narrow ? w : w - 262;       // 패널 폭
  const COLS = Math.max(18, Math.min(46, Math.floor((sheetW - 46) / CW)));
  const ROWS = Math.max(16, Math.min(30, Math.floor((h - 168) / CH)));
  return { COLS, ROWS };
}
let { COLS, ROWS } = calcGeom();
let N = COLS * ROWS;

const sheet = document.getElementById('sheet');
const overlay = document.getElementById('overlay');
const fmla = document.getElementById('formula');
const namebox = document.getElementById('namebox');
const statusbar = document.getElementById('statusbar');
const panelHead = document.getElementById('panelHead');
const panelBody = document.getElementById('panelBody');
const ttl = document.getElementById('ttl');
const mobpanel = document.getElementById('mobpanel');
const mobHead = document.getElementById('mobHead');
const mobBody = document.getElementById('mobBody');
const isNarrow = () => matchMedia('(max-width:640px)').matches;
/* 패널 출력을 데스크탑 패널 + (모바일이면) 드로어 양쪽에 반영 */
function setPanel(head, html){
  panelHead.textContent = head; panelBody.innerHTML = html;
  mobHead.textContent = head; mobBody.innerHTML = html;
}

/* ---------- 유틸 ---------- */
const rnd = Math.random;
const ri = n => (rnd()*n)|0;
const pick = a => a[ri(a.length)];
const clamp = (v,a,b) => v<a?a:v>b?b:v;
function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(((i/COLS)|0)+1);}
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

/* ---------- 시트 DOM ---------- */
let cellEls = [];
function buildSheet(){
  sheet.style.gridTemplateColumns = `46px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows = CH + 'px';
  cellEls = new Array(N);
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd';h.textContent=colName(c);frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd';h.textContent=r+1;frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      const cap=document.createElement('div');cap.className='cap';d.appendChild(cap);
      cellEls[r*COLS+c]=d;frag.appendChild(d);
    }
  }
  sheet.innerHTML='';sheet.appendChild(frag);
}

/* ---------- 지형 (value noise) ---------- */
const GW=9, GH=6;
let gz=[];
function genTerrainSeed(){gz=[];for(let i=0;i<GW*GH;i++)gz[i]=rnd();}
function noise(x,y){
  const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=gz[y0*GW+x0],b=gz[y0*GW+Math.min(GW-1,x0+1)];
  const c=gz[Math.min(GH-1,y0+1)*GW+x0],d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}

/* ---------- 셀 모델 ----------
   cell = {st, owner(factionId), gov(governorId), level, grief(0~1 평민 불만),
           hist[], ruinT}
   level: 0개척 1농장 2마을 3성읍 4도성 / glyph
*/
let cells=[];
function genCells(){
  cells=new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS,y=(i/COLS)|0;
    const v=noise(x,y)+(rnd()-.5)*.14;
    let st='land',hist=['황무지'];
    if(v<.31){st='water';hist=['바다'];}
    else if(v>.63&&rnd()<.7){st='forest';hist=['숲'];}
    cells[i]={st,owner:null,gov:null,level:0,grief:0,hist,ruinT:0};
  }
}
function nbrs(i){
  const x=i%COLS,y=(i/COLS)|0,out=[];
  if(x>0)out.push(i-1);if(x<COLS-1)out.push(i+1);
  if(y>0)out.push(i-COLS);if(y<ROWS-1)out.push(i+COLS);
  return out;
}

/* ---------- 에이전트 (성격/감정/기억) ----------
   성격(고정): ambition 야심, cruelty 잔혹, loyalty 충성, caution 신중
   감정(창발): joy 기쁨, anger 분노, sorrow 슬픔, fear 두려움  (0~1, 감쇠)
   감정은 사건에서 +되고 매 사이클 0.94배로 감쇠. 결정에 가중.
*/
let agentSeq=1;
function newAgent(rank, name, opts={}){
  return {
    id:agentSeq++, rank, name,
    amb: opts.amb ?? +(rnd()).toFixed(2),
    cru: opts.cru ?? +(rnd()).toFixed(2),
    loy: opts.loy ?? +(.3+rnd()*.6).toFixed(2),
    cau: opts.cau ?? +(rnd()).toFixed(2),
    mood:{joy:.15,anger:.05,sorrow:.05,fear:.05},
    mem:[],            // 짧은 기억(최근 사건 라벨)
    born: 0,           // 등장 연도
    grievanceSeen:0,   // 통치하는 백성의 불만 누적 체감
  };
}
function moodBump(a,k,v){a.mood[k]=clamp(a.mood[k]+v,0,1);}
function moodDecay(a){for(const k in a.mood)a.mood[k]*=.93;}
function remember(a,label){a.mem.push(label);if(a.mem.length>6)a.mem.shift();}
function dominantMood(a){let bk='joy',bv=-1;for(const k in a.mood)if(a.mood[k]>bv){bv=a.mood[k];bk=k;}return bv<.18?'평온':bv,bk;}
function moodLabel(a){
  let bk='평온',bv=.18;
  const map={joy:'기쁨',anger:'분노',sorrow:'슬픔',fear:'두려움'};
  for(const k in a.mood)if(a.mood[k]>bv){bv=a.mood[k];bk=map[k];}
  return bk;
}

/* ---------- 세력(왕국) ----------
   각 세력 = 군주 1 + 귀족(총독) 여러 + 평민(셀 grief로 표현)
   taxRate 세율 (군주가 결정, 감정/야심 반영) → 평민 불만 증가
   stance 대외태세: 'expand' | 'war' | 'consolidate' | 'mourn'
*/
const NAMES=['북부 왕국','붉은 제국','해안 연맹','유목 칸국','삼나무 공화국','잿빛 교단','동방 상단','검은 강 부족','여명 왕조','소금 사막 민족','철혈 후국','은빛 도시국가'];
const COLORS=['#2563eb','#dc2626','#059669','#7c3aed','#d97706','#0d9488','#be185d','#4d7c0f','#9333ea','#b45309','#475569','#0891b2'];
const SURNAMES=['카를','베른','오를란','테오','미라','단테','류크','셀린','보르','이단','노아','발렌','케이','로엔','시그','아델'];
const GIVEN=['1세','2세','3세','대공','공작','후작','백작','경'];
function personName(){return pick(SURNAMES)+' '+pick(GIVEN);}

let nameIdx=0, factions=[], obituaries=[], chronicle=[];
let year=1, tickN=0, pop=0, lastEvent='천지가 창조되었습니다.';
let plague=new Map(), fires=new Map();
const dirty=new Set();
let selected=-1, selKind='cell';

function spawnFaction(announce, originIdx, rebelOf, leader){
  if(nameIdx>=NAMES.length)nameIdx=0;
  const idx=nameIdx++;
  const f={
    id: factions.length?Math.max(...factions.map(x=>x.id))+1:0,
    name: NAMES[idx], color: COLORS[idx%COLORS.length],
    monarch: leader || newAgent('monarch', personName(), {loy:1}),
    govs: [],            // 귀족/총독 에이전트
    taxRate: +(.2+rnd()*.2).toFixed(2),
    stance:'expand', golden:0, treasury: 30, warExhaust:0,
    size:0, arr:[], born:year, rebelOf: rebelOf??null,
    legitimacy: rebelOf!=null?.35:.7,  // 정통성 (반란정권은 낮음)
  };
  f.monarch.rank='monarch'; f.monarch.born=year;
  // 영토 배치
  let placed=false;
  if(originIdx!=null && cells[originIdx] && cells[originIdx].st==='land'){
    setCell(originIdx,f,1,'개척지'); placed=true;
  }
  if(!placed){
    for(let t=0;t<400;t++){
      const i=ri(N);
      if(cells[i].st==='land'&&cells[i].owner===null){setCell(i,f,1,'개척지');placed=true;break;}
    }
  }
  if(!placed)return null;
  // 초기 귀족 1
  addGovernor(f);
  factions.push(f);
  if(announce){
    const verb = rebelOf!=null?'봉기하여 새 나라를 세웠':'역사에 등장했';
    logEvent(`${f.name}(군주 ${f.monarch.name})이(가) ${verb}습니다.`,
      `=FOUND("${f.name}", 군주="${f.monarch.name}")`, rebelOf!=null?'born':'born', f.color);
  }
  return f;
}
function addGovernor(f){
  const g=newAgent('noble', personName());
  g.born=year;
  f.govs.push(g);
  return g;
}
function facById(id){return factions.find(f=>f.id===id);}
function govById(f,id){return f.govs.find(g=>g.id===id);}

/* ---------- 셀 쓰기 ---------- */
function setCell(i,f,level,label){
  const c=cells[i];
  c.owner=f?f.id:null; c.level=level; c.st='land';
  if(f && c.gov==null && f.govs.length) c.gov=pick(f.govs).id;
  if(label){c.hist.push(label);if(c.hist.length>8)c.hist.shift();}
  dirty.add(i);
}

const LV_TXT=['','·','田','邑','城','都'];   // 0..5(도성 강조)
const LV_LABEL=['','개척지','농장','마을','성읍','도성'];

/* ---------- 페인트 ---------- */
function paint(i){
  const c=cells[i], el=cellEls[i]; if(!el)return;
  let bg='',tx='',col='#222',w='',cap='';
  if(plague.has(i)){bg='#ead5f5';tx='疫';col='#7030a0';w='700';}
  else if(fires.has(i)){bg='#ffd9b3';tx='火';col='#c00000';w='700';}
  else if(c.st==='water'){bg='#ddebf7';tx='≈';col='#9dc3e6';}
  else if(c.st==='forest'){bg='#e2efda';tx='木';col='#548235';}
  else if(c.st==='ruin'){bg='#ededed';tx='墟';col='#999';}
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      bg=hexA(f.color,.12+Math.min(4,c.level)*.16);
      tx=LV_TXT[c.level]||'';
      col=f.color; w=c.level>=4?'700':'';
      // 불만 표식: grief 높으면 붉은 모서리 점
      if(c.grief>0.66) cap='✺';            // 봉기 임박
      else if(c.grief>0.4) cap='·';
    }
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  // 첫 자식(cap) 보존하고 텍스트만 갱신
  const capEl=el.firstChild;
  if(el.childNodes.length>1) el.childNodes[1].nodeValue=tx; else el.appendChild(document.createTextNode(tx));
  if(capEl){capEl.textContent=cap; capEl.style.color = cap==='✺'?'#b30000':'#c0392b';}
}

/* ---------- 로그 ---------- */
function logEvent(msg, formula, kind, color){
  lastEvent=`서기 ${year}년: ${msg}`;
  if(formula) fmla.textContent=formula;
  chronicle.push({year, msg, kind:kind||'', color:color||'#ccc'});
  if(chronicle.length>400) chronicle.shift();
}
function flash(i,cls){const el=cellEls[i];if(!el)return;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),1200);}

/* =====================================================================
   AI 의사결정
   ===================================================================== */

/* 군주의 정책 결정: 감정+성격+상황 → 세율/태세 (창발) */
function monarchDecide(f){
  const m=f.monarch;
  // 위협 인지: 이웃 적 영토 비율
  let enemyAdj=0, samples=0;
  for(let s=0;s<8 && f.arr.length;s++){
    const i=f.arr[ri(f.arr.length)];
    for(const n of nbrs(i)){const o=cells[n].owner; samples++; if(o!=null&&o!==f.id)enemyAdj++;}
  }
  const threat = samples? enemyAdj/samples : 0;
  moodBump(m,'fear', threat*0.05);

  // 세율: 야심·분노↑ + 전쟁중·금고부족 → 증세 / 두려움(민란)·슬픔 → 감세
  let dTax = (m.amb-.5)*.04 + m.mood.anger*.05 - m.mood.fear*.04
           + (f.treasury<10?.05:0) + (f.stance==='war'?.04:0) - (avgGrief(f)>.55?.06:0);
  f.taxRate = clamp(f.taxRate + dTax + (rnd()-.5)*.02, .05, .8);

  // 태세 결정 (감정 주도)
  const dm=moodLabel(m);
  let stance;
  if(m.mood.sorrow>.5 && m.mood.sorrow>m.mood.anger){stance='mourn';}
  else if((m.mood.anger>.45 || (m.amb>.6 && threat<.5)) && f.warExhaust<.6){stance='war';}
  else if(threat>.55 || avgGrief(f)>.6 || f.warExhaust>.6){stance='consolidate';}
  else stance='expand';
  const changed = stance!==f.stance;
  f.stance=stance;

  // 가끔 칙령을 수식바에 (감정 근거 명시)
  if(changed && warLogCD<=0){
    const verbs={expand:'개척하라',war:'정벌하라',consolidate:'안정을 도모하라',mourn:'애도하라'};
    logEvent(`${f.name}의 군주 ${m.name}이(가) ${dm}에 사로잡혀 "${verbs[stance]}" 칙령을 내렸습니다. (세율 ${(f.taxRate*100|0)}%)`,
      `=DECREE("${f.name}", 태세="${stance}", 감정="${dm}", 세율=${(f.taxRate*100|0)}%)`, 'gold', f.color);
    warLogCD=18;
  }
}

function avgGrief(f){
  if(!f.arr.length)return 0;
  let s=0;for(const i of f.arr)s+=cells[i].grief;
  return s/f.arr.length;
}

/* 귀족(총독)의 명령 해석: obey/skim/sabotage/betray (창발) */
function governorAct(f,g){
  // 이 총독이 관할하는 셀
  const mine=f.arr.filter(i=>cells[i].gov===g.id);
  if(!mine.length){return;}
  moodDecay(g);
  // 군주 명령에 대한 순응도 = 충성 - 야심 + 군주 정통성 - 본인 분노
  const compliance = clamp(g.loy*0.9 + f.legitimacy*0.4 - g.amb*0.6 - g.mood.anger*0.5 - (f.taxRate>.5?0.2:0), 0, 1);

  // 증세 명령 → 평민에게 부과. 잔혹할수록 더 짜냄 → 불만↑, 금고↑
  const squeeze = f.taxRate*(0.5+g.cru*0.8)*compliance;
  let collected=0;
  for(const i of mine){
    const c=cells[i];
    if(c.level<1)continue;
    c.grief = clamp(c.grief + squeeze*0.05 + (f.stance==='war'?0.012:0) - 0.006, 0, 1);
    collected += c.level*squeeze*0.5;
    if(c.grief>.4)dirty.add(i);
  }
  // 귀족이 세금 횡령 (야심/저순응 → 착복)
  const skim = collected*(g.amb*0.5)*(1-compliance);
  f.treasury += collected - skim;
  if(skim>2){ moodBump(g,'joy',0.04); g.grievanceSeen += 0; }

  // 백성 불만 체감 → 귀족 감정에 영향 (두려움/분노)
  const localGrief = mine.reduce((s,i)=>s+cells[i].grief,0)/mine.length;
  if(localGrief>.6){ moodBump(g,'fear',0.05); }

  // 항명/배신 판정: 야심 크고 충성 낮고 분노 높고 영토 충분 → 분리독립
  // (높은 세율·낮은 정통성·민심 이반이 귀족의 야심에 불을 붙인다)
  const betrayDrive = g.amb*0.7 + g.mood.anger*0.5 + (1-g.loy)*0.5
                    + (f.taxRate>.55?0.2:0) + (localGrief>.55?0.2:0)
                    - f.legitimacy*0.45 - g.cau*0.3;
  if(betrayDrive>0.62 && mine.length>=3 && factions.length<10 && rnd()<0.10){
    secede(f,g,mine);
    return;
  }
  // 사보타주: 중간 정도면 군주 칙령 무시 (확장/전쟁 안 함) — governorExpand에서 반영
  g._compliance=compliance;
}

/* 귀족의 분리독립(배신) → 새 반란/분파 세력 */
function secede(f,g,mine){
  const nf=spawnFaction(false, mine[0], f.id, g);
  if(!nf)return;
  // g가 새 군주가 됨, 관할 영토 이양
  for(const i of mine){ setCell(i, nf, cells[i].level, '독립 선포'); cells[i].grief*=0.4; }
  // 남은 귀족 일부도 데려갈 수 있음
  nf.govs=[]; addGovernor(nf);
  moodBump(f.monarch,'anger',0.5); moodBump(f.monarch,'sorrow',0.3);
  f.legitimacy=clamp(f.legitimacy-0.12,0.1,1);
  // f에서 g 제거
  f.govs=f.govs.filter(x=>x.id!==g.id);
  logEvent(`${f.name}의 귀족 ${g.name}이(가) 야심에 눈이 멀어 영토를 떼어 '${nf.name}'으로 독립했습니다.`,
    `=BETRAY("${g.name}", from="${f.name}", to="${nf.name}", 영토=${mine.length})`, 'betray', nf.color);
  for(const i of mine)flash(i,'rev');
}

/* ---------- 평민 봉기(계급 반란) ----------
   grief 높은 셀이 군집을 이루면 반란. 잔혹/고세율 군주일수록 잦음.
   결과: (a) 농민 자치 반란국 수립 (b) 군주/귀족 처형으로 정권 교체 */
function checkRebellion(f){
  const hot=f.arr.filter(i=>cells[i].grief>0.72);
  if(hot.length<3)return;
  // 봉기 확률: 불만 군집 크기 + 평균 불만 - 정통성
  const ag=avgGrief(f);
  const p = clamp((hot.length/Math.max(6,f.size))*0.5 + ag*0.4 - f.legitimacy*0.3, 0, 0.9);
  if(rnd()>p*0.18)return;

  // 봉기 셀 군집
  for(const i of hot)flash(i,'rev');
  const leadCell=hot[0];

  if(rnd()<0.5 && factions.length<9){
    // (a) 농민 자치 반란국 — 평민 출신 지도자(낮은 잔혹/높은 야심)
    const peasantLeader=newAgent('monarch', '의병장 '+pick(SURNAMES), {cru:+(rnd()*0.4).toFixed(2), amb:+(0.5+rnd()*0.4).toFixed(2), loy:0.2});
    const nf=spawnFaction(false, leadCell, f.id, peasantLeader);
    if(nf){
      nf.name='혁명 '+nf.name.replace(/^혁명\s*/,'');
      for(const i of hot){ setCell(i, nf, Math.max(1,cells[i].level-1), '봉기'); cells[i].grief=0.2; }
      nf.legitimacy=0.5; nf.taxRate=0.1;
      logEvent(`${f.name}의 가혹한 통치에 평민이 봉기하여 '${nf.name}'을(를) 세웠습니다!`,
        `=REVOLT(from="${f.name}", 지도자="${peasantLeader.name}", 점령=${hot.length})`, 'rev', nf.color);
      f.legitimacy=clamp(f.legitimacy-0.15,0.1,1);
      moodBump(f.monarch,'fear',0.6); moodBump(f.monarch,'anger',0.4);
    }
  } else {
    // (b) 정권 교체: 군주 처형, 새 군주(불만 진정). 정통성 회복 시도
    const old=f.monarch.name;
    f.monarch=newAgent('monarch', personName(), {cru:+(rnd()*0.5).toFixed(2)});
    f.monarch.born=year;
    f.taxRate=clamp(f.taxRate-0.2,0.05,0.8);
    f.legitimacy=clamp(f.legitimacy-0.05,0.1,1);
    for(const i of hot){cells[i].grief=0.3;dirty.add(i);}
    obituaries.push({name:`${old} (${f.name} 군주)`, year, cause:'민란으로 처형'});
    logEvent(`${f.name}에서 민란이 일어나 군주 ${old}이(가) 처형되고 ${f.monarch.name}이(가) 옹립되었습니다.`,
      `=COUP("${f.name}", 처형="${old}", 옹립="${f.monarch.name}")`, 'rev', f.color);
  }
}

/* ---------- 세력 행동 (확장/전쟁/발전) ---------- */
let warLogCD=0, cityLogCD=0;
function factionTurn(f){
  if(f.golden>0)f.golden--;
  if(f.warExhaust>0)f.warExhaust=Math.max(0,f.warExhaust-0.01);
  moodDecay(f.monarch);
  if(f.size===0)return;

  monarchDecide(f);

  // 귀족 행동 (해석/항명/배신) — 한 명이라도 없으면 보충
  if(f.govs.length===0 || (f.size>8 && f.govs.length< (f.size/10|0)+1 && rnd()<0.1)) addGovernor(f);
  for(const g of [...f.govs]) governorAct(f,g);
  if(!factions.includes(f))return;   // 배신으로 사라졌을 수도

  // 평민 봉기 점검
  checkRebellion(f);
  if(!factions.includes(f))return;

  const stance=f.stance;
  const aggressive = (stance==='war')?1.6 : (stance==='expand')?1 : (stance==='mourn')?0.3 : 0.6;

  // 확장/전쟁
  const attempts = Math.max(1, (1 + f.size*0.07)*aggressive | 0);
  for(let a=0;a<attempts;a++){
    if(!f.arr.length)break;
    const src=f.arr[ri(f.arr.length)];
    if(cells[src].owner!==f.id)continue;
    // 이 셀 총독의 순응도 낮으면 명령 사보타주(행동 안 함)
    const gid=cells[src].gov, g=gid!=null?govById(f,gid):null;
    if(g && g._compliance!=null && rnd()>g._compliance+0.25)continue;
    const nb=nbrs(src); if(!nb.length)continue;
    const tgt=nb[ri(nb.length)], tc=cells[tgt];
    if(tc.st==='water'||fires.has(tgt))continue;
    if(tc.owner===null){
      if(stance==='mourn')continue;
      if(tc.st==='forest'){ if(rnd()<.25){tc.st='land';tc.hist.push('개간');setCell(tgt,f,1,'개척지');} }
      else if(tc.st==='land') setCell(tgt,f,1,'개척지');
    } else if(tc.owner!==f.id){
      const wantWar = stance==='war'?0.55 : stance==='consolidate'?0.12 : 0.28;
      if(rnd()<wantWar){
        const defF=facById(tc.owner);
        const att=1+rnd()*3 + f.size*0.002 + (f.golden?1.2:0) + f.monarch.mood.anger*2 - f.warExhaust*2;
        const def=tc.level+1+rnd()*3 + (defF? defF.warExhaust*0.5:0);
        flash(tgt,'war');
        f.warExhaust=clamp(f.warExhaust+0.015,0,1);
        if(att>def){
          if(rnd()<.3){
            fires.set(tgt,5); tc.hist.push('전화(戰火)'); if(tc.hist.length>8)tc.hist.shift(); dirty.add(tgt);
          } else {
            setCell(tgt,f,Math.max(1,tc.level-1),'점령됨');
            cells[tgt].grief=clamp(cells[tgt].grief+0.25,0,1);  // 점령지 불만
          }
          moodBump(f.monarch,'joy',0.05);
          if(defF){ moodBump(defF.monarch,'anger',0.08); moodBump(defF.monarch,'sorrow',0.04);
                    defF.warExhaust=clamp(defF.warExhaust+0.02,0,1); }
          if((tc.level>=3||warLogCD<=0)&&defF){
            logEvent(`${f.name}이(가) ${defF.name}의 ${LV_LABEL[Math.max(1,tc.level)]||'영토'} ${ref(tgt)}를 함락시켰습니다.`,
              `=WAR("${f.name}"→"${defF.name}", ${ref(tgt)})`, 'war', f.color);
            warLogCD=22;
          }
        } else {
          moodBump(f.monarch,'sorrow',0.03); moodBump(f.monarch,'fear',0.02);
        }
      }
    }
  }

  // 발전 (황금기·낮은 불만일 때 빠름)
  const ups=Math.max(1,(1+f.size*0.05)|0);
  for(let u=0;u<ups;u++){
    if(!f.arr.length)break;
    const i=f.arr[ri(f.arr.length)];
    if(cells[i].owner!==f.id)continue;
    const c=cells[i];
    const griefBrake = c.grief>0.5?0.3:1;
    if(c.level<5 && rnd()<.05*(f.golden?3:1)*griefBrake*(f.stance==='mourn'?0.4:1)){
      c.level++;
      c.hist.push(LV_LABEL[c.level]||'발전'); if(c.hist.length>8)c.hist.shift(); dirty.add(i);
      f.treasury+=2;
      if(c.level===5 && cityLogCD<=0){
        logEvent(`${f.name}의 ${ref(i)}에 도성이 세워졌습니다.`, `=CAPITAL("${f.name}", ${ref(i)})`, 'gold', f.color);
        cityLogCD=30;
      }
    }
  }

  // 금고/번영이 좋으면 정통성 회복, 불만 자연 진정
  if(f.treasury>40 && avgGrief(f)<0.4){ f.legitimacy=clamp(f.legitimacy+0.01,0.1,1); moodBump(f.monarch,'joy',0.01); }
}

/* =====================================================================
   메인 틱
   ===================================================================== */
function tick(){
  tickN++; year++;
  if(warLogCD>0)warLogCD--; if(cityLogCD>0)cityLogCD--;

  // 재집계
  for(const f of factions){f.arr.length=0;f.size=0;}
  pop=0;
  const PW=[0,40,160,520,1400,3200];
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin'&&--c.ruinT<=0){c.st='land';dirty.add(i);}
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){f.arr.push(i);f.size++;pop+=PW[c.level]||0;
            // 불만 자연 감쇠(평시)
            if(f.stance!=='war')c.grief=clamp(c.grief-0.004,0,1);}
      else{c.owner=null;c.level=0;c.gov=null;dirty.add(i);}
    }
  }

  // 멸망 판정
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      obituaries.push({name:f.name, year, cause:'영토 소멸', monarch:f.monarch.name});
      logEvent(`${f.name}이(가) 역사에서 사라졌습니다. (마지막 군주 ${f.monarch.name})`,
        `=COLLAPSE("${f.name}", ${year})`, 'col', '#777');
      factions.splice(k,1);
      if(selKind==='faction'&&selected===f.id)selectNone();
    }
  }

  // 화재 전파
  for(const [i,t] of [...fires]){
    if(rnd()<.12){for(const n of nbrs(i)){const c=cells[n];if(c.owner!==null&&!fires.has(n)&&c.st==='land'){fires.set(n,5);dirty.add(n);}}}
    if(t<=1){
      fires.delete(i);const c=cells[i];
      c.owner=null;c.level=0;c.gov=null;c.st='ruin';c.ruinT=180;c.grief=0;
      c.hist.push('잿더미');if(c.hist.length>8)c.hist.shift();dirty.add(i);
    } else fires.set(i,t-1);
  }

  // 역병
  if(plague.size){
    for(const [i,t] of [...plague]){
      if(rnd()<.16){for(const n of nbrs(i))if(cells[n].owner!==null&&!plague.has(n)){plague.set(n,11);dirty.add(n);}}
      if(rnd()<.22){
        const c=cells[i];c.level--;
        if(c.level<=0){c.owner=null;c.level=0;c.gov=null;c.hist.push('역병으로 소멸');if(c.hist.length>8)c.hist.shift();}
        dirty.add(i);
        const f=c.owner!=null?facById(c.owner):null;
        if(f)moodBump(f.monarch,'sorrow',0.02);
      }
      if(t<=1){plague.delete(i);dirty.add(i);} else plague.set(i,t-1);
    }
    if(plague.size===0)logEvent('역병이 물러갔습니다.','=PLAGUE.END()','col','#777');
  }

  // 세력 행동
  for(const f of [...factions]) factionTurn(f);

  // 무작위 천재지변
  const r=rnd();
  if(!plague.size && r<.004){
    const big=[];for(let i=0;i<N;i++)if(cells[i].owner!==null&&cells[i].level>=3)big.push(i);
    if(big.length){const i=pick(big);plague.set(i,11);dirty.add(i);logEvent(`${ref(i)}에서 역병이 창궐했습니다.`,`=PLAGUE(${ref(i)})`,'col','#7030a0');}
  } else if(r>.9952){
    if(factions.length){const f=pick(factions);f.golden=90;moodBump(f.monarch,'joy',0.5);
      logEvent(`${f.name}의 황금기가 시작되었습니다.`,`=GOLDEN.AGE("${f.name}", 90)`,'gold',f.color);}
  } else if(r>.992&&r<=.9952){
    const towns=[];for(let i=0;i<N;i++)if(cells[i].owner!==null&&cells[i].level>=2)towns.push(i);
    if(towns.length){const i=pick(towns);fires.set(i,6);dirty.add(i);logEvent(`${ref(i)}에 대화재가 발생했습니다.`,`=FIRE(${ref(i)})`,'war','#c00000');}
  }
  // 신규 세력 도래 (적을 때)
  if(factions.length<3 && rnd()<.014){
    const f=spawnFaction(false);
    if(f)logEvent(`바다 건너에서 ${f.name}이(가) 도래했습니다.`,`=MIGRATE("${f.name}")`,'born',f.color);
  }

  // 그리기
  for(const i of dirty)paint(i);
  dirty.clear();

  // 상태바
  const topf=factions.slice().sort((a,b)=>b.size-a.size)[0];
  const grandGrief = factions.length? (factions.reduce((s,f)=>s+avgGrief(f),0)/factions.length):0;
  statusbar.innerHTML=`준비<span class="sep">|</span>서기 ${year}년`+
    `<span class="sep">|</span>인구 ${pop.toLocaleString()}명`+
    `<span class="sep">|</span>국가 ${factions.length}곳`+
    `<span class="sep">|</span>평균 불만 ${(grandGrief*100|0)}%`+
    `<span class="sep">|</span>${lastEvent}`;

  if(tickN%6===0){
    ttl.textContent=`문명.xlsx - Excel  (서기 ${year}년)`;
    document.getElementById('tab-dead').textContent=`멸망기록 (${obituaries.length})`;
    refreshActivePanel();
    if(curTab!=='map')renderOverlay();
  }
}

/* =====================================================================
   인스펙터 패널 + 오버레이 시트
   ===================================================================== */
function selectNone(){
  if(selected>=0&&selKind==='cell'&&cellEls[selected])cellEls[selected].classList.remove('sel');
  selected=-1;selKind='cell';
  setPanel('통치 인스펙터','<div style="color:#888">셀을 클릭하면 그 땅의 역사와 통치 에이전트의 마음을 봅니다. 세력 목록은 항상 아래에.</div>'+factionsBlock());
}
function moodBars(a){
  const map=[['joy','#2e9e4f','기쁨'],['anger','#dc2626','분노'],['sorrow','#3b6fb5','슬픔'],['fear','#8a59c9','두려움']];
  let h='<div class="mood">';
  for(const [k,c,lbl] of map) h+=`<span style="border-left:3px solid ${c}">${lbl} ${(a.mood[k]*100|0)}</span>`;
  return h+'</div>';
}
function agentCard(a,roleColor,roleLabel){
  const rkColor = a.rank==='monarch'?'#9a6b00':'#555';
  let h=`<div class="agent">`;
  h+=`<div><span class="rk" style="background:${rkColor}">${roleLabel}</span><span class="nm">${a.name}</span> <span style="color:#999">· ${moodLabel(a)}</span></div>`;
  h+=`<div class="traitrow">야심 ${(a.amb*100|0)} · 잔혹 ${(a.cru*100|0)} · 충성 ${(a.loy*100|0)} · 신중 ${(a.cau*100|0)}</div>`;
  h+=moodBars(a);
  if(a.mem.length)h+=`<div style="color:#777;font-size:9.5px;margin-top:2px">기억: ${a.mem.slice(-3).join(', ')}</div>`;
  return h+'</div>';
}
function factionsBlock(){
  if(!factions.length)return '';
  let h='<h4>세력 현황</h4>';
  for(const f of factions.slice().sort((a,b)=>b.size-a.size)){
    const ag=avgGrief(f);
    h+=`<div class="agent" style="cursor:pointer" data-fac="${f.id}">`;
    h+=`<div><span class="sw" style="background:${f.color}"></span><b>${f.name}</b>${f.golden?' ✦':''}${f.rebelOf!=null?' ⚑':''}</div>`;
    h+=`<div class="traitrow">군주 ${f.monarch.name} · 영토 ${f.size}칸 · 귀족 ${f.govs.length}`;
    h+=` · 세율 ${(f.taxRate*100|0)}% · 태세 ${({expand:'개척',war:'정벌',consolidate:'안정',mourn:'애도'})[f.stance]}</div>`;
    h+=`<div class="bar" title="평민 불만"><i style="width:${(ag*100)|0}%;background:${ag>.6?'#dc2626':ag>.4?'#d97706':'#2e9e4f'}"></i></div>`;
    h+=`<div class="traitrow">불만 ${(ag*100|0)}% · 정통성 ${(f.legitimacy*100|0)}% · 금고 ${f.treasury|0}</div>`;
    h+=`</div>`;
  }
  return h;
}
function selectFaction(id){
  const f=facById(id);if(!f)return;
  if(selected>=0&&selKind==='cell'&&cellEls[selected])cellEls[selected].classList.remove('sel');
  selKind='faction';selected=id;
  renderFaction(f);
}
function renderFaction(f){
  const head=`${f.name} — 지휘체계`;
  let h='';
  h+=`<div style="margin-bottom:4px"><span class="sw" style="background:${f.color}"></span><b>${f.name}</b>${f.rebelOf!=null?' <span style="color:#7c3aed">(반란정권)</span>':''}</div>`;
  h+=`<div class="traitrow">건국 서기 ${f.born}년 · 영토 ${f.size}칸 · 세율 ${(f.taxRate*100|0)}% · 금고 ${f.treasury|0} · 정통성 ${(f.legitimacy*100|0)}%</div>`;
  const ag=avgGrief(f);
  h+=`<div class="bar" style="margin-top:4px"><i style="width:${ag*100|0}%;background:${ag>.6?'#dc2626':ag>.4?'#d97706':'#2e9e4f'}"></i></div>`;
  h+=`<div class="traitrow">평민 불만 ${(ag*100|0)}% · 전쟁피로 ${(f.warExhaust*100|0)}%</div>`;
  h+='<h4>군주 (최상위)</h4>'+agentCard(f.monarch,f.color,'군주');
  h+=`<h4>귀족·총독 (중간계급) ${f.govs.length}</h4>`;
  if(!f.govs.length)h+='<div style="color:#999">귀족이 없습니다.</div>';
  for(const g of f.govs){
    const mine=f.arr.filter(i=>cells[i].gov===g.id).length;
    let card=agentCard(g,f.color,'귀족');
    card=card.replace('</div>',`<div class="traitrow">관할 ${mine}칸 · 순응 ${g._compliance!=null?(g._compliance*100|0)+'%':'—'}</div></div>`);
    h+=card;
  }
  h+='<h4>평민 (피지배계급)</h4>';
  h+=`<div style="color:#555">영토 ${f.size}칸의 평민이 세금과 징집을 견딘다. 불만 ${(ag*100|0)}%가 임계에 닿으면 봉기·민란이 창발한다.</div>`;
  h+=factionsBlock();
  setPanel(head,h);
}
function renderCell(i){
  const c=cells[i];
  const head=`셀 ${ref(i)} — 토지·통치`;
  let h='';
  const terr = c.st==='water'?'바다':c.st==='forest'?'숲':c.st==='ruin'?'폐허':'육지';
  h+=`<div><b>${ref(i)}</b> · ${terr}${c.level?` · ${LV_LABEL[c.level]}`:''}</div>`;
  if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      h+=`<div class="traitrow" style="margin-top:3px"><span class="sw" style="background:${f.color}"></span>${f.name} 영토</div>`;
      h+=`<div class="bar" title="이 땅 평민 불만"><i style="width:${c.grief*100|0}%;background:${c.grief>.6?'#dc2626':c.grief>.4?'#d97706':'#2e9e4f'}"></i></div>`;
      h+=`<div class="traitrow">이 땅 평민 불만 ${(c.grief*100|0)}%${c.grief>0.66?' — 봉기 임박!':''}</div>`;
      const g=c.gov!=null?govById(f,c.gov):null;
      h+='<h4>관할 군주</h4>'+agentCard(f.monarch,f.color,'군주');
      if(g)h+='<h4>관할 귀족</h4>'+agentCard(g,f.color,'귀족');
    }
  } else {
    h+=`<div style="color:#888;margin-top:4px">아직 어떤 세력도 다스리지 않는 땅.</div>`;
  }
  h+='<h4>이 땅의 역사</h4>';
  h+=`<div class="traitrow">${c.hist.map(x=>`${x}`).join(' → ')}</div>`;
  h+=factionsBlock();
  setPanel(head,h);
  fmla.textContent=`=HISTORY(${ref(i)}, ${c.hist.map(x=>`"${x}"`).join(' → ')})`;
}
function refreshActivePanel(){
  if(selKind==='cell'&&selected>=0)renderCell(selected);
  else if(selKind==='faction'&&selected>=0){const f=facById(selected);if(f)renderFaction(f);else selectNone();}
  else selectNone();
}

/* 패널 클릭 위임 (세력 카드 → 지휘체계) — 데스크탑 패널 + 모바일 드로어 */
function facDelegate(e){
  const fc=e.target.closest('[data-fac]');
  if(fc){selectFaction(+fc.dataset.fac); if(isNarrow())mobpanel.classList.add('show');}
}
panelBody.addEventListener('click',facDelegate);
mobBody.addEventListener('click',facDelegate);
document.getElementById('mobClose').addEventListener('click',()=>mobpanel.classList.remove('show'));

/* 셀 클릭 */
sheet.addEventListener('click',e=>{
  const t=e.target.closest('.cell');if(!t)return;
  if(selected>=0&&selKind==='cell'&&cellEls[selected])cellEls[selected].classList.remove('sel');
  selKind='cell';selected=+t.dataset.i;t.classList.add('sel');
  namebox.textContent=ref(selected);
  renderCell(selected);
  if(isNarrow())mobpanel.classList.add('show');
});

/* =====================================================================
   탭 / 오버레이 시트
   ===================================================================== */
let curTab='map';
function switchTab(tab){
  curTab=tab;
  document.querySelectorAll('#tabs div').forEach(d=>d.classList.toggle('on',d.dataset.tab===tab));
  if(tab==='map'){overlay.classList.remove('show');overlay.innerHTML='';}
  else{overlay.classList.add('show');renderOverlay();}
}
function moodTag(a){
  const colmap={기쁨:'#2e9e4f',분노:'#dc2626',슬픔:'#3b6fb5',두려움:'#8a59c9',평온:'#888'};
  const m=moodLabel(a);
  return `<span class="pill" style="background:${colmap[m]||'#888'}">${m}</span>`;
}
function renderOverlay(){
  if(curTab==='chron'){
    let h='<table class="gx"><tr><th style="width:60px">연도</th><th>사건 (수식 로그)</th></tr>';
    const rows=chronicle.slice(-160).reverse();
    for(const e of rows){
      const ic={war:'⚔',rev:'✺',gold:'✦',col:'†',born:'✚',betray:'⚑'}[e.kind]||'·';
      h+=`<tr><td class="idx">${e.year}</td><td><span style="color:${e.color}">${ic}</span> ${e.msg}</td></tr>`;
    }
    h+='</table>';
    overlay.innerHTML=h;
  } else if(curTab==='dead'){
    let h='<table class="gx"><tr><th style="width:34px">#</th><th>멸망/처형</th><th style="width:60px">연도</th><th>사인</th></tr>';
    if(!obituaries.length)h+='<tr><td class="idx">—</td><td colspan="3" style="color:#999">아직 사라진 것이 없습니다.</td></tr>';
    obituaries.slice().reverse().forEach((o,k)=>{
      h+=`<tr><td class="idx">${obituaries.length-k}</td><td>† ${o.name}</td><td>${o.year}</td><td style="color:#777">${o.cause}</td></tr>`;
    });
    h+='</table>';
    overlay.innerHTML=h;
  } else if(curTab==='class'){
    // 계급장부: 세력별 군주/귀족/평민 + 불만/정통성
    let h='<table class="gx"><tr><th>세력</th><th>군주(감정·세율)</th><th>귀족 (감정·충성·야심)</th><th>평민 불만</th><th>정통성</th></tr>';
    if(!factions.length)h+='<tr><td colspan="5" style="color:#999">세력이 없습니다.</td></tr>';
    for(const f of factions.slice().sort((a,b)=>b.size-a.size)){
      const ag=avgGrief(f);
      let govs=f.govs.map(g=>`${g.name} ${moodTag(g)} <span style="color:#888">충${g.loy*100|0}/야${g.amb*100|0}</span>`).join('<br>')||'<span style="color:#999">없음</span>';
      h+=`<tr>`;
      h+=`<td><span class="sw" style="background:${f.color}"></span><b>${f.name}</b>${f.rebelOf!=null?' ⚑':''}<br><span style="color:#888">영토 ${f.size}칸</span></td>`;
      h+=`<td>${f.monarch.name} ${moodTag(f.monarch)}<br><span style="color:#888">세율 ${(f.taxRate*100|0)}% · 태세 ${({expand:'개척',war:'정벌',consolidate:'안정',mourn:'애도'})[f.stance]}</span></td>`;
      h+=`<td style="font-size:10px">${govs}</td>`;
      h+=`<td style="min-width:90px"><div class="bar"><i style="width:${ag*100|0}%;background:${ag>.6?'#dc2626':ag>.4?'#d97706':'#2e9e4f'}"></i></div>${(ag*100|0)}%</td>`;
      h+=`<td>${(f.legitimacy*100|0)}%</td>`;
      h+=`</tr>`;
    }
    h+='</table>';
    overlay.innerHTML=h;
  }
}
document.getElementById('tabs').addEventListener('click',e=>{
  const d=e.target.closest('div[data-tab]');if(!d)return;switchTab(d.dataset.tab);
});

/* 속도 컨트롤 */
let speed=1, timer=null;
function setSpeed(s){
  speed=s;
  document.querySelectorAll('.spd button').forEach(b=>b.classList.toggle('on',+b.dataset.spd===s));
  if(timer)clearInterval(timer);timer=null;
  if(s>0)timer=setInterval(()=>{for(let k=0;k<s;k++)tick();},110);
}
document.querySelector('.spd').addEventListener('click',e=>{
  const b=e.target.closest('button[data-spd]');if(!b)return;setSpeed(+b.dataset.spd);
});

/* =====================================================================
   초기화
   ===================================================================== */
function init(){
  ({COLS,ROWS}=calcGeom());N=COLS*ROWS;
  genTerrainSeed();buildSheet();genCells();
  factions=[];obituaries=[];chronicle=[];nameIdx=0;agentSeq=1;
  plague=new Map();fires=new Map();dirty.clear();
  year=1;tickN=0;pop=0;selected=-1;selKind='cell';
  for(let i=0;i<N;i++)paint(i);
  fmla.textContent=`=SIM.CIVILIZATION($A$1:$${colName(COLS-1)}$${ROWS}, 렌즈="계급 갈등과 반란")`;
  spawnFaction(true);spawnFaction(true);spawnFaction(true);
  selectNone();
  switchTab('map');
  setSpeed(1);
}
init();

/* 리사이즈 → 그리드 재구성 (디바운스, 실행 유지) */
let rzT=null;
addEventListener('resize',()=>{
  clearInterval(timer);timer=null;
  clearTimeout(rzT);
  rzT=setTimeout(()=>{ init(); }, 250);
});
})();
</script>
