<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>문명.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  body{display:flex;flex-direction:column;height:100vh}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:18px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;flex:0 0 auto;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px;flex:0 0 auto}
  #namebox{width:64px;min-width:64px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;gap:4px}
  #namebox b{color:#107c41;font-size:11px}
  #fx{width:26px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif;flex:0 0 auto}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stage{flex:1 1 auto;display:flex;min-height:0;overflow:hidden}
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1 1 auto;min-width:0}
  #sheet{display:grid;background:#fff;position:absolute;top:0;left:0}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#666;font-size:10px}
  .cell{border-right:1px solid #e7e7e7;border-bottom:1px solid #e7e7e7;
    display:flex;align-items:center;justify-content:center;font-size:11px;position:relative;
    overflow:hidden;cursor:cell;line-height:1}
  .cell .em{position:absolute;top:0;right:1px;font-size:7px;line-height:1}
  .cell .cap{position:absolute;bottom:0;left:1px;font-size:7px;line-height:1;opacity:.85}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:3}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #ff3b3b}50%{box-shadow:inset 0 0 0 2px #ffcaca}}
  .war{animation:warf .3s 3}
  @keyframes betf{0%,100%{box-shadow:inset 0 0 0 2px #ff8a00}50%{box-shadow:inset 0 0 0 2px #2563eb}}
  .betray{animation:betf .35s 4}
  .mig{position:absolute;pointer-events:none;z-index:4;font-size:10px;
    text-shadow:0 0 3px #fff,0 0 3px #fff;transition:left .45s linear,top .45s linear;will-change:left,top}
  #side{width:236px;min-width:236px;flex:0 0 auto;background:#fbfbf9;border-left:1px solid #d4d4d4;
    display:flex;flex-direction:column;font-size:11px;overflow:hidden}
  #side h4{margin:0;padding:5px 9px;font-size:11px;color:#107c41;background:#eef6f0;
    border-bottom:1px solid #dfe9e1;font-weight:600;display:flex;justify-content:space-between}
  #fac{overflow-y:auto;flex:0 0 auto;max-height:46%;padding:2px 0}
  .frow{padding:3px 9px;border-bottom:1px solid #f0f0ec;line-height:1.45}
  .frow .nm{font-weight:600;display:flex;align-items:center;gap:5px}
  .sw{display:inline-block;width:9px;height:9px;border-radius:2px;flex:0 0 auto}
  .frow .meta{color:#777;font-size:10px}
  .moodbar{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:2px}
  .moodbar i{display:block}
  #log{flex:1 1 auto;overflow-y:auto;padding:2px 0}
  .lrow{padding:2px 9px;border-bottom:1px dotted #eee;line-height:1.35;font-size:10.5px;color:#333}
  .lrow b{font-weight:600}
  .lrow .yr{color:#999;font-family:Consolas,monospace;font-size:9.5px}
  #statusbar{height:22px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 10px;font-size:11px;flex:0 0 auto;white-space:nowrap;overflow:hidden}
  #statusbar .sep{margin:0 8px;opacity:.5}
  #statusbar #pause{margin-left:auto;background:rgba(255,255,255,.18);border-radius:3px;
    padding:1px 8px;cursor:pointer}
  #tabs{height:24px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:8px;
    border-top:1px solid #d4d4d4;font-size:11px;flex:0 0 auto;overflow-x:auto}
  #tabs div{padding:3px 11px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;white-space:nowrap;cursor:pointer}
  #tabs div.on{background:#fbfbf9;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  /* full-sheet overlays for 연대기 / 멸망기록 / 결정로그 */
  .docview{position:absolute;inset:0;background:#fff;overflow-y:auto;display:none;z-index:6}
  .docview.on{display:block}
  .docview table{border-collapse:collapse;width:100%;font-size:11px}
  .docview th{background:#f5f5f5;border:1px solid #e0e0e0;padding:3px 7px;text-align:left;
    position:sticky;top:0;color:#555;font-weight:600}
  .docview td{border:1px solid #eee;padding:3px 7px;vertical-align:top}
  .docview td.r{font-family:Consolas,monospace;color:#999;font-size:10px;white-space:nowrap}
  .docview .mono{font-family:Consolas,monospace;font-size:10.5px;color:#1a4}
  @media (max-width:760px){
    #side{display:none}
    #menubar{gap:11px;font-size:11px}
    #namebox{width:52px;min-width:52px}
  }
</style>
</head>
<body>
<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <span id="ttl">문명.xlsx - Excel</span>
</div>
<div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i></div>
<div id="fbar">
  <div id="namebox"><b id="nb">A1</b></div>
  <div id="fx">fx</div>
  <div id="formula"></div>
</div>
<div id="stage">
  <div id="sheetwrap">
    <div id="sheet"></div>
    <div id="doc-chron" class="docview"></div>
    <div id="doc-dead" class="docview"></div>
    <div id="doc-dec" class="docview"></div>
  </div>
  <div id="side">
    <h4>세력 현황 <span id="facn"></span></h4>
    <div id="fac"></div>
    <h4>사건 일지 <span style="font-weight:400;color:#9bbfa8" id="logn"></span></h4>
    <div id="log"></div>
  </div>
</div>
<div id="statusbar">
  <span id="sb-ready">준비</span>
  <span class="sep">|</span><span id="sb-year"></span>
  <span class="sep">|</span><span id="sb-pop"></span>
  <span class="sep">|</span><span id="sb-evt"></span>
  <span id="pause">❚❚ 일시정지</span>
</div>
<div id="tabs">
  <div class="on" data-tab="sheet">세계 지도</div>
  <div data-tab="chron">연대기</div>
  <div data-tab="dead" id="tab-dead">멸망기록 (0)</div>
  <div data-tab="dec">결정로그</div>
</div>

<script>
(() => {
'use strict';
// ============================================================
//  엑셀로 위장한 창발적 AI 문명 시뮬레이션
//  핵심: 각 정착지가 자율 에이전트(목표·성격·기억·감정).
//  규칙 틱이 아니라 효용을 스스로 평가해 행동을 "결정"한다.
//  지도자 명령 → 하위 에이전트의 해석/복종/항명/배신.
//  자원 고갈 → 감정 변화 → 대이주 결정 (이번 변주의 렌즈).
// ============================================================

const rand = Math.random;
const pick = a => a[rand()*a.length|0];
const clamp = (v,lo,hi)=>v<lo?lo:v>hi?hi:v;

// ---------- 그리드 ----------
const sheetwrap = document.getElementById('sheetwrap');
let CW, CH, COLS, ROWS, N;
function computeGrid(){
  const w = sheetwrap.clientWidth, h = sheetwrap.clientHeight;
  CW = w < 760 ? 26 : 30;
  CH = w < 760 ? 22 : 22;
  COLS = clamp(Math.floor((w - 30) / CW), 12, 48);
  ROWS = clamp(Math.floor((h - 22) / CH), 12, 40);
  N = COLS * ROWS;
}
computeGrid();

const sheet = document.getElementById('sheet');
const fmla = document.getElementById('formula');
const nb = document.getElementById('nb');

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(Math.floor(i/COLS)+1);}
function xy(i){return [i%COLS, i/COLS|0];}
function dist(a,b){const [ax,ay]=xy(a),[bx,by]=xy(b);return Math.abs(ax-bx)+Math.abs(ay-by);}

// ---------- 시트 DOM ----------
let cellEls;
function buildSheet(){
  sheet.style.gridTemplateColumns = `40px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows = CH + 'px';
  sheet.innerHTML = '';
  cellEls = new Array(N);
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const hd=document.createElement('div');hd.className='hd';hd.textContent=colName(c);frag.appendChild(hd);}
  for(let r=0;r<ROWS;r++){
    const hd=document.createElement('div');hd.className='hd';hd.textContent=r+1;frag.appendChild(hd);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      const em=document.createElement('span');em.className='em';
      const cap=document.createElement('span');cap.className='cap';
      d.appendChild(em);d.appendChild(cap);
      cellEls[r*COLS+c]=d;frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

// ---------- 지형 / 자원 ----------
// 각 칸: terrain + resource(0..1, 비옥도). 정착하면 resource가 소모되고 천천히 회복.
let cells;
const GW=8, GH=6;
function buildWorld(){
  const gz=[]; for(let i=0;i<GW*GH;i++) gz[i]=rand();
  const rz=[]; for(let i=0;i<GW*GH;i++) rz[i]=rand();
  function smp(grid,x,y){
    const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
    const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
    const a=grid[y0*GW+x0],b=grid[y0*GW+Math.min(GW-1,x0+1)];
    const c=grid[Math.min(GH-1,y0+1)*GW+x0],d=grid[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
    return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
  }
  cells=new Array(N);
  for(let i=0;i<N;i++){
    const [x,y]=xy(i);
    const v=smp(gz,x,y)+(rand()-.5)*.12;
    const res=clamp(smp(rz,x,y)+(rand()-.5)*.2,.05,1);
    let st='land';
    if(v<.30) st='water';
    else if(v>.66 && rand()<.6) st='forest';
    cells[i]={
      st, base:res,            // 잠재 비옥도
      res: st==='water'?0:res, // 현재 자원량
      owner:null, agent:null,  // 정착지 에이전트
      ruinT:0, hist:[st==='water'?'바다':st==='forest'?'태초의 숲':'태초의 황무지']
    };
  }
}
function nbrs(i){const [x,y]=xy(i),o=[];
  if(x>0)o.push(i-1);if(x<COLS-1)o.push(i+1);if(y>0)o.push(i-COLS);if(y<ROWS-1)o.push(i+COLS);return o;}

// ---------- 감정 ----------
// mood: {joy 희망/기쁨, anger 분노, sorrow 슬픔, plea 즐거움} 합 ≈ 1
const EMO_ICON={joy:'☺',anger:'✖',sorrow:'☂',plea:'♪'};
const EMO_COL ={joy:'#2e9e54',anger:'#d83b3b',sorrow:'#3b6fd8',plea:'#d98a1e'};
function newMood(){return {joy:.4,anger:.1,sorrow:.1,plea:.4};}
function nudge(m,k,amt){
  m[k]=clamp(m[k]+amt,0,1);
  const s=m.joy+m.anger+m.sorrow+m.plea;
  for(const x in m) m[x]/=s;
}
function dominant(m){let bk='joy',bv=-1;for(const k in m)if(m[k]>bv){bv=m[k];bk=k;}return bk;}

// ---------- 성격 ----------
// aggr 호전성, greed 탐욕, caut 신중함, demand 충성요구(지도자)
function jitter(v,d){return clamp(v+(rand()-.5)*d,0,1);}
function newPersona(base){
  if(!base) return {aggr:rand(),greed:rand(),caut:rand(),demand:rand()};
  // 하위 에이전트는 지도자 성격에서 표류
  return {aggr:jitter(base.aggr,.5),greed:jitter(base.greed,.5),
          caut:jitter(base.caut,.5),demand:jitter(base.demand,.4)};
}

// ---------- 세력(국가) ----------
const NAMES=['북부 왕국','붉은 제국','해안 연맹','유목 칸국','삼나무 공화국','잿빛 교단','동방 상단','검은 강 부족','여명 왕조','소금 사막 민족','회색 산악국','남방 군도','강철 부족','별빛 유랑단'];
const COLORS=['#2563eb','#dc2626','#059669','#7c3aed','#d97706','#0d9488','#be185d','#4d7c0f','#9333ea','#b45309','#475569','#0891b2','#854d0e','#7e22ce'];
const TITLES=['대왕','여제','족장','선지자','집정관','칸','대공','수호자','원로','순찰장'];
let nameIdx=0, factions=[], nextFid=0;
const obituaries=[], chronicle=[], decisions=[];

function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}

function freshName(){
  if(nameIdx<NAMES.length){const i=nameIdx++;return [NAMES[i],COLORS[i]];}
  return [NAMES[rand()*NAMES.length|0]+'의 후예', pick(COLORS)];
}

function spawnFaction(originIdx, parentPersona, announce){
  const [name,color]=freshName();
  const persona=newPersona(parentPersona);
  const f={id:nextFid++, name, color, persona,
    leaderMood:newMood(), leaderName:pick(TITLES),
    golden:0, order:'expand', orderTarget:-1, size:0, arr:[],
    founded: year, memory:[]};            // memory: 알려진 비옥지 idx들
  // 정착 위치
  let i=originIdx;
  if(i<0||cells[i].owner!==null||cells[i].st==='water'){
    for(let t=0;t<400;t++){const j=rand()*N|0;if(cells[j].st==='land'&&cells[j].owner===null&&cells[j].res>.4){i=j;break;}}
  }
  if(i<0||cells[i].owner!==null) return null;
  factions.push(f);
  settle(i,f,1,newPersona(persona),'개척');
  if(announce) logEvent(`${f.name}의 ${f.leaderName}이(가) 역사에 등장했다.`,`=FOUND("${f.name}", ${ref(i)})`,'birth',f.color);
  return f;
}
function facById(id){return factions.find(f=>f.id===id);}

// ---------- 정착지 에이전트 ----------
// 각 칸의 정착지는 자율 에이전트. 자기 목표·기분·충성·기억을 가짐.
function settle(i, f, level, persona, label){
  const c=cells[i];
  c.owner=f.id; c.st='land';
  c.agent={
    fid:f.id, level, persona:persona||newPersona(f.persona),
    mood:newMood(), loyalty:clamp(.55+rand()*.35,0,1),
    stock:c.res, age:0, goal:'성장', defy:0
  };
  if(label){c.hist.push(label); if(c.hist.length>8)c.hist.shift();}
  dirty.add(i);
}
function abandon(i, reason){
  const c=cells[i];
  c.owner=null; c.agent=null;
  c.hist.push(reason||'버려짐'); if(c.hist.length>8)c.hist.shift();
  dirty.add(i);
}

// ---------- 렌더 ----------
const LV_TXT=['','·','田','邑','城'];        // 개척/농장/마을/도시
const LV_LABEL=['','개척지','농장','마을','도시'];
let plague=new Map(), fires=new Map();
const dirty=new Set();

function paint(i){
  const c=cells[i], el=cellEls[i];
  let bg='', tx='', col='#222', w='', emo='', emoC='', cap='', capC='';
  if(plague.has(i)){bg='#ead5f5';tx='疫';col='#7030a0';w='700';}
  else if(fires.has(i)){bg='#ffd9b3';tx='火';col='#c00000';w='700';}
  else if(c.st==='water'){bg='#dceaf6';tx='≈';col='#9dc3e6';}
  else if(c.st==='ruin'){bg='#ededed';tx='墟';col='#aaa';}
  else if(c.owner!==null && c.agent){
    const f=facById(c.owner), a=c.agent;
    if(f){
      // 자원 고갈도에 따라 채도 변화: 고갈될수록 칙칙
      const vit=clamp(a.stock/Math.max(.15,c.base),0,1);
      bg=hexA(f.color,.12+a.level*.16*(0.5+0.5*vit));
      tx=LV_TXT[a.level]; col=f.color; w=a.level>=3?'700':'';
      const dm=dominant(a.mood);
      if(a.mood[dm]>.5){emo=EMO_ICON[dm];emoC=EMO_COL[dm];}
      if(a.stock<.18){cap='⚠';capC='#c0392b';}        // 자원 위기 표식
      else if(a.loyalty<.3){cap='!';capC='#e67e22';}   // 항명 위기
    }
  } else if(c.st==='forest'){bg='#e3efdb';tx='木';col='#548235';}
  else { // 황무지 — 비옥도 살짝 표시
    bg=c.res>.55?'#f6f8f0':'';
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  // 본문 텍스트 노드 관리 (em/cap span과 분리)
  setCellText(el,tx);
  const emEl=el.querySelector('.em'), capEl=el.querySelector('.cap');
  emEl.textContent=emo; emEl.style.color=emoC;
  capEl.textContent=cap; capEl.style.color=capC;
}
function setCellText(el,t){
  // em/cap span 사이에 본문 텍스트 노드 유지
  let tn=el.firstChild;
  if(!tn || tn.nodeType!==3){tn=document.createTextNode('');el.insertBefore(tn,el.firstChild);}
  tn.nodeValue=t;
}

// ---------- 로그 / 연대기 ----------
let year=1, lastEvent='천지가 창조되었다.';
const logBox=document.getElementById('log');
function logEvent(msg, formula, kind, color){
  lastEvent=`서기 ${year}년 · ${msg}`;
  if(formula) fmla.textContent=formula;
  chronicle.push({year,msg,formula:formula||'',kind:kind||''});
  if(chronicle.length>600) chronicle.shift();
  // 사이드 일지 (최근 위로)
  const row=document.createElement('div');row.className='lrow';
  row.innerHTML=`<span class="yr">${year}년</span> <b style="color:${color||'#333'}">${kindIcon(kind)}</b> ${esc(msg)}`;
  logBox.insertBefore(row, logBox.firstChild);
  while(logBox.childNodes.length>120) logBox.removeChild(logBox.lastChild);
  if(curTab==='chron') renderChron();
}
function kindIcon(k){return ({war:'⚔',betray:'☷',migrate:'➜',plague:'☣',fire:'🔥',golden:'✦',birth:'❋',death:'†',city:'城',revolt:'✊'})[k]||'·';}
function esc(s){return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function recordDecision(agentRef, fname, color, thought, formula){
  decisions.push({year, ref:agentRef, fname, color, thought, formula});
  if(decisions.length>500) decisions.shift();
  if(curTab==='dec') renderDec();
}

// ---------- 이주 비주얼 ----------
const caravans=[]; // {el, fromI, toI, fid, t}
function startCaravan(fromI, toI, fid, level, persona, mood){
  const f=facById(fid); if(!f) return;
  const el=document.createElement('div'); el.className='mig';
  el.textContent='⛺'; el.style.color=f.color;
  sheetwrap.appendChild(el);
  const cav={el, toI, fid, level, persona, mood};
  positionMig(el, fromI);
  // 다음 프레임에 목적지로 트랜지션
  requestAnimationFrame(()=>positionMig(el,toI));
  caravans.push(cav);
  setTimeout(()=>{
    el.remove();
    const idx=caravans.indexOf(cav); if(idx>=0)caravans.splice(idx,1);
    arriveCaravan(cav);
  }, 520);
}
function positionMig(el,i){
  const [x,y]=xy(i);
  el.style.left=(40 + x*CW + CW/2 - 6) + 'px';
  el.style.top=(y*CH + CH/2 - 7) + 'px';
}
function arriveCaravan(cav){
  const c=cells[cav.toI];
  const f=facById(cav.fid); if(!f){return;}
  if(c.st==='water'||c.st==='ruin'){return;}
  if(c.owner===null){
    settle(cav.toI, f, Math.max(1,cav.level-1), cav.persona, '이주 정착');
    if(cav.mood){c.agent.mood={...cav.mood}; nudge(c.agent.mood,'joy',.25); nudge(c.agent.mood,'sorrow',-.2);}
    c.agent.stock=c.res;
  } else if(c.owner!==cav.fid){
    // 빈 땅이 없으면 이주민이 기존 정착지와 충돌(소규모 분쟁)
    if(rand()<.4) flashWar(cav.toI);
  }
}

// ============================================================
//  핵심: 에이전트의 결정 (효용 평가)
// ============================================================
function emptyNbr(i,f){
  for(const n of shuffle(nbrs(i))){const c=cells[n];
    if(c.st!=='water'&&c.st!=='ruin'&&c.owner===null&&!fires.has(n)&&!plague.has(n)) return n;}
  return -1;
}
function enemyNbr(i,fid){
  for(const n of shuffle(nbrs(i))){const c=cells[n];
    if(c.owner!==null&&c.owner!==fid&&c.agent&&!fires.has(n)) return n;}
  return -1;
}
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=rand()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]];}return a;}

// 기억된/주변 비옥한 빈 땅 찾기 (대이주 목적지)
function findFertile(i, f){
  let best=-1, bestScore=-1;
  // 기억 우선
  for(const m of f.memory){
    if(cells[m].owner===null && cells[m].st==='land'){
      const s=cells[m].res*1.2 - dist(i,m)*0.03;
      if(s>bestScore){bestScore=s;best=m;}
    }
  }
  // 방사 탐색
  for(let t=0;t<26;t++){
    const j=rand()*N|0, c=cells[j];
    if(c.st!=='water'&&c.st!=='ruin'&&c.owner===null&&!fires.has(j)){
      const s=c.res - dist(i,j)*0.025;
      if(s>bestScore){bestScore=s;best=j;}
    }
  }
  return best;
}

function agentDecide(i){
  const c=cells[i], a=c.agent;
  const f=facById(a.fid); if(!f) return;
  a.age++;

  // --- 자원 동역학: 인구(레벨)가 자원을 갉아먹고, 비옥도로 회복 ---
  const drain=0.006*a.level*a.level;
  const regen=0.010*c.base;
  a.stock=clamp(a.stock - drain + regen, 0, c.base);
  c.res=a.stock;

  // --- 감정 자연 변화: 자원에 따라 ---
  if(a.stock<0.2){ nudge(a.mood,'sorrow',0.05); nudge(a.mood,'anger',0.03); nudge(a.mood,'joy',-0.04);}
  else if(a.stock>0.7){ nudge(a.mood,'joy',0.03); nudge(a.mood,'plea',0.02);}
  if(f.golden>0){ nudge(a.mood,'plea',0.04); nudge(a.mood,'joy',0.02);}
  // 감정 전염: 주변 같은 세력 평균으로 끌림
  if(rand()<.5){
    for(const n of nbrs(i)){const nc=cells[n];
      if(nc.agent&&nc.agent.fid===a.fid){
        for(const k in a.mood) a.mood[k]+=(nc.agent.mood[k]-a.mood[k])*0.06;
        const s=a.mood.joy+a.mood.anger+a.mood.sorrow+a.mood.plea;
        for(const k in a.mood)a.mood[k]/=s; break;
      }}
  }

  // --- 충성: 자원 풍족·황금기면 오르고, 고갈·지도자가 분노하면 내림 ---
  a.loyalty=clamp(a.loyalty
      + (a.stock>0.5?0.004:-0.012)
      + (f.golden>0?0.006:0)
      - (f.leaderMood.anger>0.5?0.006:0)
      - (a.mood.anger>0.55?0.008:0)
      - (a.persona.aggr>0.7?0.002:0), 0, 1);

  const dm=dominant(a.mood);

  // --- 후보 행동 효용 평가 (스스로 판단) ---
  const U={};
  // 자원 위기 → 이주 효용 급등
  const scarcity=clamp(1 - a.stock/Math.max(.12,c.base), 0, 1);
  U.migrate = scarcity*1.5 + a.mood.sorrow*0.9 + (1-a.persona.caut)*0.3
            + (f.order==='migrate'?0.8*a.loyalty:0) - 0.4;
  // 발전 효용: 자원 충분 + 즐거움/기쁨
  U.develop = (a.stock>0.35?0.6:0) + a.mood.plea*0.5 + a.mood.joy*0.4
            + a.persona.greed*0.3 - a.level*0.18 + (f.golden>0?0.4:0);
  // 확장 효용: 희망 + 탐욕 + 지도자 expand 명령
  U.expand  = a.mood.joy*0.6 + a.persona.greed*0.5
            + (f.order==='expand'?0.6*a.loyalty:0) + (emptyNbr(i,f)>=0?0.4:-0.6);
  // 공격 효용: 분노 + 호전성 + 지도자 war 명령 (+자원 부족 시 약탈 충동)
  U.attack  = a.mood.anger*0.9 + a.persona.aggr*0.8
            + (f.order==='war'?0.7*a.loyalty:0) + scarcity*0.4
            + (enemyNbr(i,a.fid)>=0?0.3:-1.2);
  // 항명/배신 효용: 충성 낮음 + 분노 + 자기 호전성. 명령과 어긋날수록.
  U.revolt  = (1-a.loyalty)*1.1 + a.mood.anger*0.7 + a.persona.aggr*0.4
            - f.persona.demand*0.3 - 0.55;
  // 유지
  U.stay = 0.25 + a.mood.plea*0.2 + a.persona.caut*0.3;

  // 약간의 자유의지(노이즈)
  for(const k in U) U[k]+=(rand()-.5)*0.25;

  let act='stay', bv=-1e9;
  for(const k in U) if(U[k]>bv){bv=U[k];act=k;}

  executeAction(i, act, U);
}

let warLogCD=0, decLogCD=0;
function executeAction(i, act, U){
  const c=cells[i], a=c.agent, f=facById(a.fid); if(!f) return;
  const dm=dominant(a.mood);

  if(act==='revolt'){
    // 항명: 명령 거부. 충성이 매우 낮고 규모 있으면 → 배신/독립
    a.defy++;
    if(a.loyalty<0.18 && a.persona.aggr>0.45 && rand()<0.5){
      // 배신: 이 정착지가 독립 세력 수립 (지도자 성격을 물려받되 표류)
      cellEls[i].classList.add('betray');
      setTimeout(()=>cellEls[i].classList.remove('betray'),1400);
      const nf=spawnFaction(i, f.persona, false);
      if(nf){
        nf.leaderMood=( {...a.mood} ); nudge(nf.leaderMood,'anger',.2);
        logEvent(`${f.name}의 ${ref(i)} ${LV_LABEL[a.level]||'정착지'}이(가) 배신하고 ${nf.name}으로 독립했다.`,
          `=BETRAY("${f.name}"→"${nf.name}", ${ref(i)})`,'betray',nf.color);
        recordDecision(ref(i), f.name, f.color,
          `충성 ${(a.loyalty*100|0)}%·분노 우세 → 명령(${orderKo(f.order)}) 거부, 독립 결행`,
          `=BETRAY(${ref(i)})`);
        // 주변 같은 세력 일부도 동조
        for(const n of nbrs(i)){const nc=cells[n];
          if(nc.agent&&nc.agent.fid===f.id&&nc.agent.loyalty<0.35&&rand()<0.5){
            nc.agent.fid=nf.id; nc.owner=nf.id; dirty.add(n);
          }}
      }
    } else {
      // 단순 항명: 명령 무시하고 자기 이익(자원되면 발전, 아니면 이주)
      if(decLogCD===0){
        recordDecision(ref(i), f.name, f.color,
          `명령 "${orderKo(f.order)}" 거부 (충성 ${(a.loyalty*100|0)}%, ${EMO_ICON[dm]}${moodKo(dm)})`,
          `=DEFY(${ref(i)}, "${orderKo(f.order)}")`);
        decLogCD=6;
      }
      // 항명 후 자기 판단으로 차선 행동
      if(c.res<0.25) doMigrate(i); else doDevelop(i);
    }
    return;
  }
  if(act==='migrate'){ doMigrate(i); return; }
  if(act==='develop'){ doDevelop(i); return; }
  if(act==='expand'){ doExpand(i); return; }
  if(act==='attack'){ doAttack(i); return; }
  // stay: 약간의 회복/기분 안정
  nudge(a.mood,'plea',0.01);
}

function doMigrate(i){
  const c=cells[i], a=c.agent, f=facById(a.fid); if(!f) return;
  const tgt=findFertile(i,f);
  if(tgt<0||tgt===i){ doDevelop(i); return; }
  // 떠나기로 결정. 정착지 비움, 캐러밴 출발.
  if(decLogCD===0){
    recordDecision(ref(i), f.name, f.color,
      `자원 고갈(${(c.res*100|0)}%) → ${ref(tgt)}(비옥 ${(cells[tgt].res*100|0)}%)로 대이주 결정`,
      `=MIGRATE(${ref(i)} → ${ref(tgt)})`);
    decLogCD=5;
  }
  startCaravan(i, tgt, f.id, a.level, newPersona(f.persona), a.mood);
  abandon(i, '이주로 비움');
  // 지도자가 도착지를 기억 (집단 기억)
  if(!f.memory.includes(tgt)) f.memory.push(tgt);
  if(f.memory.length>6) f.memory.shift();
  logEventThrottled(`${f.name}의 ${ref(i)} 주민이 자원을 찾아 ${ref(tgt)}로 떠났다.`,
    `=MIGRATE("${f.name}", ${ref(i)}→${ref(tgt)})`,'migrate',f.color, 18);
}
function doDevelop(i){
  const c=cells[i], a=c.agent, f=facById(a.fid); if(!f) return;
  if(a.level<4 && c.res>0.3 && rand()<0.5*(f.golden?2:1)){
    a.level++; a.stock=clamp(a.stock,0,c.base);
    c.hist.push(LV_LABEL[a.level]); if(c.hist.length>8)c.hist.shift();
    nudge(a.mood,'plea',0.06); nudge(a.mood,'joy',0.03);
    dirty.add(i);
    if(a.level===4 && warLogCD===0){
      logEvent(`${f.name}의 ${ref(i)}에 ${f.name==='해안 연맹'?'항구도시':'대도시'}가 세워졌다.`,
        `=CITY("${f.name}", ${ref(i)})`,'city',f.color);
      warLogCD=20;
    }
  } else nudge(a.mood,'plea',0.01);
}
function doExpand(i){
  const c=cells[i], a=c.agent, f=facById(a.fid); if(!f) return;
  const tgt=emptyNbr(i,f);
  if(tgt<0){ doDevelop(i); return; }
  if(c.res<0.18){ doMigrate(i); return; } // 너무 빈약하면 확장 대신 이주
  if(cells[tgt].st==='forest'){ if(rand()<0.5){cells[tgt].st='land'; cells[tgt].hist.push('개간');} else return; }
  settle(tgt, f, 1, newPersona(a.persona), '개척');
  nudge(a.mood,'joy',0.03);
}
function doAttack(i){
  const c=cells[i], a=c.agent, f=facById(a.fid); if(!f) return;
  const tgt=enemyNbr(i,a.fid);
  if(tgt<0){ doExpand(i); return; }
  const tc=cells[tgt], ta=tc.agent, df=facById(tc.owner);
  flashWar(tgt);
  const att=1 + a.level*0.5 + a.persona.aggr*2 + a.mood.anger*2 + (f.golden?1:0) + rand()*2;
  const def=1 + (ta?ta.level:1) + (ta?ta.persona.caut*1.5:0) + rand()*2.2;
  if(att>def){
    if(rand()<0.28){
      fires.set(tgt,5); tc.hist.push('전화(戰火)'); if(tc.hist.length>8)tc.hist.shift(); dirty.add(tgt);
    } else {
      // 점령: 정착지 에이전트가 새 주인에게 흡수 (분노·낮은 충성으로)
      const lvl=Math.max(1,(ta?ta.level:1)-1);
      settle(tgt, f, lvl, newPersona(f.persona),'점령됨');
      nudge(tc.agent.mood,'anger',0.4); nudge(tc.agent.mood,'sorrow',0.2);
      tc.agent.loyalty=clamp(0.2+rand()*0.2,0,1); // 정복지는 불충
    }
    nudge(a.mood,'plea',0.05); nudge(a.mood,'anger',-0.08);
    nudge(f.leaderMood,'plea',0.04);
    if(df && (warLogCD===0 || (ta&&ta.level>=3))){
      logEvent(`${f.name}이(가) ${df.name}의 ${ref(tgt)}를 공격했다.`,
        `=WAR("${f.name}"→"${df.name}", ${ref(tgt)})`,'war',f.color);
      warLogCD=22;
    }
  } else {
    // 패배 → 분노/슬픔
    nudge(a.mood,'anger',0.12); nudge(a.mood,'sorrow',0.06);
    if(df) nudge(df.leaderMood,'joy',0.03);
  }
}

function orderKo(o){return ({expand:'팽창',war:'정복',develop:'내치',migrate:'대이주'})[o]||o;}
function moodKo(k){return ({joy:'기쁨',anger:'분노',sorrow:'슬픔',plea:'즐거움'})[k]||k;}

let logThrCD={};
function logEventThrottled(msg,formula,kind,color,cd){
  const key=kind||'_';
  if((logThrCD[key]||0)>0) return;
  logEvent(msg,formula,kind,color); logThrCD[key]=cd;
}

// ============================================================
//  지도자 AI: 나라 상태를 보고 명령을 "결정"
// ============================================================
function leaderThink(f){
  if(f.size===0) return;
  // 나라 평균 자원·평균 감정 집계
  let res=0,loy=0; const lm={joy:0,anger:0,sorrow:0,plea:0};
  for(const i of f.arr){const a=cells[i].agent; res+=a.stock/Math.max(.12,cells[i].base); loy+=a.loyalty;
    for(const k in lm)lm[k]+=a.mood[k];}
  res/=f.size; loy/=f.size;
  for(const k in lm)lm[k]/=f.size;
  // 지도자 기분 = 백성 기분 + 자기 성격 보정
  for(const k in f.leaderMood) f.leaderMood[k]+=(lm[k]-f.leaderMood[k])*0.2;
  const s=Object.values(f.leaderMood).reduce((x,y)=>x+y,0);
  for(const k in f.leaderMood)f.leaderMood[k]/=s;

  // 명령 효용 평가
  const O={};
  O.migrate = (res<0.32?1.4:0) + lm.sorrow*1.0 - f.persona.caut*0.2; // 국가적 자원 위기
  O.war     = f.persona.aggr*0.9 + f.leaderMood.anger*0.8 + (f.size>5?0.2:0) - (res<0.25?0.4:0);
  O.expand  = f.persona.greed*0.7 + f.leaderMood.joy*0.6 + (res>0.45?0.5:0);
  O.develop = f.persona.caut*0.7 + f.leaderMood.plea*0.6 + (f.golden>0?0.6:0) + (res>0.55?0.4:0);
  for(const k in O)O[k]+=(rand()-.5)*0.2;
  let best='expand',bv=-1e9; for(const k in O)if(O[k]>bv){bv=O[k];best=k;}
  const changed = best!==f.order;
  f.order=best;
  // 충성 낮으면 지도자가 충성요구↑ → 항명 유발(긴장)
  if(loy<0.4 && f.persona.demand>0.5) nudge(f.leaderMood,'anger',0.05);

  if(changed && best==='migrate'){
    logEvent(`${f.name}의 ${f.leaderName}이(가) 자원 고갈을 선언하고 대이주를 명령했다.`,
      `=COMMAND("${f.name}", MIGRATE)  ' 평균자원 ${(res*100|0)}%`,'migrate',f.color);
    recordDecision('지도부', f.name, f.color,
      `평균 자원 ${(res*100|0)}%·슬픔 우세 → 전 국민 대이주 명령`,
      `=COMMAND.MIGRATE("${f.name}")`);
  } else if(changed && best==='war'){
    logEventThrottled(`${f.name}의 ${f.leaderName}이(가) 정복 전쟁을 선포했다.`,
      `=COMMAND("${f.name}", WAR)`,'war',f.color,30);
  }
}

// ---------- 무작위 사건 ----------
function worldEvents(){
  const r=rand();
  if(!plague.size && r<0.004){
    const big=[]; for(let i=0;i<N;i++)if(cells[i].agent&&cells[i].agent.level>=3)big.push(i);
    if(big.length){const i=pick(big);plague.set(i,11);dirty.add(i);
      logEvent(`${ref(i)}에서 역병이 창궐했다.`,`=PLAGUE(${ref(i)})`,'plague','#7030a0');}
  } else if(r>0.997 && factions.length){
    const f=pick(factions); f.golden=90; nudge(f.leaderMood,'plea',0.3); nudge(f.leaderMood,'joy',0.2);
    logEvent(`${f.name}의 황금기가 시작되었다.`,`=GOLDEN.AGE("${f.name}", 90)`,'golden',f.color);
  } else if(r>0.9945 && r<=0.997){
    const towns=[]; for(let i=0;i<N;i++)if(cells[i].agent&&cells[i].agent.level>=2)towns.push(i);
    if(towns.length){const i=pick(towns);fires.set(i,6);dirty.add(i);
      logEvent(`${ref(i)}에 대화재가 발생했다.`,`=FIRE(${ref(i)})`,'fire','#c00000');}
  } else if(r>0.992 && r<=0.9945){
    // 가뭄: 한 지역 자원 급감 → 이주 압력
    const owned=[]; for(let i=0;i<N;i++)if(cells[i].agent)owned.push(i);
    if(owned.length){const c0=pick(owned),[cx,cy]=xy(c0);
      let hit=0;
      for(let i=0;i<N;i++){const[x,y]=xy(i);if(Math.abs(x-cx)+Math.abs(y-cy)<=2){
        cells[i].base=clamp(cells[i].base*0.4,.05,1);
        if(cells[i].agent){cells[i].agent.stock*=0.4; nudge(cells[i].agent.mood,'sorrow',0.2);hit++;}
        cells[i].res=Math.min(cells[i].res,cells[i].base);dirty.add(i);}}
      if(hit) logEvent(`${ref(c0)} 일대에 대가뭄이 들었다.`,`=DROUGHT(${ref(c0)})`,'migrate','#b8860b');
    }
  }
  // 외래 세력 도래 (수가 적을 때)
  if(factions.length<3 && rand()<0.012){
    const f=spawnFaction(-1,null,false);
    if(f) logEvent(`바다 건너에서 ${f.name}이(가) 도래했다.`,`=ARRIVE("${f.name}")`,'birth',f.color);
  }
}

// ---------- 화재 / 역병 진행 ----------
function hazards(){
  for(const [i,t] of [...fires]){
    if(rand()<0.12) for(const n of nbrs(i)){const c=cells[n];
      if(c.agent&&!fires.has(n)&&c.st==='land'){fires.set(n,5);dirty.add(n);}}
    if(t<=1){fires.delete(i);const c=cells[i];
      c.owner=null;c.agent=null;c.st='ruin';c.ruinT=180;
      c.hist.push('잿더미');if(c.hist.length>8)c.hist.shift();dirty.add(i);}
    else fires.set(i,t-1);
  }
  if(plague.size){
    for(const [i,t] of [...plague]){
      if(rand()<0.16) for(const n of nbrs(i)){if(cells[n].agent&&!plague.has(n)){plague.set(n,11);dirty.add(n);}}
      if(rand()<0.22){const c=cells[i],a=c.agent;
        if(a){a.level--; nudge(a.mood,'sorrow',0.15);
          if(a.level<=0){c.owner=null;c.agent=null;c.hist.push('역병으로 소멸');if(c.hist.length>8)c.hist.shift();}}
        dirty.add(i);}
      if(t<=1){plague.delete(i);dirty.add(i);} else plague.set(i,t-1);
    }
    if(plague.size===0) logEvent('역병이 물러갔다.','=PLAGUE.END()','plague','#7030a0');
  }
}

function flashWar(i){const el=cellEls[i];el.classList.add('war');setTimeout(()=>el.classList.remove('war'),1000);}

// ============================================================
//  메인 틱
// ============================================================
let tickN=0;
function tick(){
  tickN++; year++;
  if(warLogCD>0)warLogCD--; if(decLogCD>0)decLogCD--;
  for(const k in logThrCD) if(logThrCD[k]>0) logThrCD[k]--;

  // 폐허 회복 + 소유 재집계 + 인구
  let pop=0; const PW=[0,40,160,520,1400];
  for(const f of factions){f.arr.length=0;f.size=0;}
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin'&&--c.ruinT<=0){c.st='land';c.res=c.base;dirty.add(i);}
    // 빈 황무지 자원 천천히 회복
    if(c.owner===null&&c.st==='land'&&c.res<c.base) c.res=clamp(c.res+0.004*c.base,0,c.base);
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f&&c.agent){f.arr.push(i);f.size++;pop+=PW[c.agent.level];}
      else {c.owner=null;c.agent=null;dirty.add(i);}
    }
  }

  // 멸망 판정
  for(let k=factions.length-1;k>=0;k--){const f=factions[k];
    if(f.size===0){
      obituaries.push({name:f.name,leader:f.leaderName,born:f.founded,died:year,
        cause:lastEvent.includes(f.name)?'정복·소멸':'쇠퇴'});
      logEvent(`${f.name}이(가) 역사에서 사라졌다.`,`=COLLAPSE("${f.name}", ${year})`,'death','#888');
      factions.splice(k,1);
      if(curTab==='dead') renderDead();
    }
  }

  // 지도자 사고 (가끔)
  if(tickN%6===0) for(const f of factions){ if(f.golden>0)f.golden--; leaderThink(f);}
  else for(const f of factions) if(f.golden>0)f.golden--;

  // 에이전트 결정 — 활동 정착지를 섞어 일부만 (성능 + 비동기성)
  const all=[]; for(const f of factions) for(const i of f.arr) all.push(i);
  shuffle(all);
  const budget=Math.min(all.length, 90);
  for(let k=0;k<budget;k++) if(cells[all[k]].agent) agentDecide(all[k]);

  hazards();
  worldEvents();

  // 인구 0 + 세력 0 이면 재시작 씨앗
  if(factions.length===0 && tickN>3){
    spawnFaction(-1,null,true); spawnFaction(-1,null,true);
    logEvent('잿더미 위에서 새로운 문명이 싹텄다.','=REBIRTH()','birth','#107c41');
  }

  // 그리기
  for(const i of dirty) paint(i);
  dirty.clear();
  // 이주 마커 위치 갱신(리사이즈 대비는 생략)

  // 상태바
  document.getElementById('sb-year').textContent=`서기 ${year}년`;
  document.getElementById('sb-pop').textContent=`세계 인구 ${pop.toLocaleString()}명`;
  document.getElementById('sb-evt').textContent=lastEvent;
  if(tickN%5===0){ renderSide(); document.getElementById('ttl').textContent=`문명.xlsx - Excel (서기 ${year}년)`;
    document.getElementById('tab-dead').textContent=`멸망기록 (${obituaries.length})`; }
}

// ---------- 사이드 패널 ----------
const facBox=document.getElementById('fac');
function renderSide(){
  document.getElementById('facn').textContent=`${factions.length}개국`;
  let h='';
  const sorted=[...factions].sort((a,b)=>b.size-a.size);
  for(const f of sorted){
    const lm=f.leaderMood, dm=dominant(lm);
    const mb=`<div class="moodbar">
      <i style="background:${EMO_COL.joy};width:${lm.joy*100}%"></i>
      <i style="background:${EMO_COL.plea};width:${lm.plea*100}%"></i>
      <i style="background:${EMO_COL.anger};width:${lm.anger*100}%"></i>
      <i style="background:${EMO_COL.sorrow};width:${lm.sorrow*100}%"></i></div>`;
    h+=`<div class="frow">
      <div class="nm"><span class="sw" style="background:${f.color}"></span>${esc(f.name)}${f.golden?' <span style="color:#d4a017">✦</span>':''}</div>
      <div class="meta">${esc(f.leaderName)} · 영토 ${f.size}칸 · 명령 <b style="color:${f.color}">${orderKo(f.order)}</b> · ${EMO_ICON[dm]}${moodKo(dm)}</div>
      ${mb}
    </div>`;
  }
  if(!factions.length) h='<div class="frow" style="color:#999">모든 문명이 소멸했다…</div>';
  facBox.innerHTML=h;
  document.getElementById('logn').textContent=`${chronicle.length}건`;
}

// ---------- 셀 클릭 = 에이전트의 마음 ----------
let selected=-1;
sheet.addEventListener('click',e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  if(selected>=0&&cellEls[selected]) cellEls[selected].classList.remove('sel');
  selected=+t.dataset.i; t.classList.add('sel');
  nb.textContent=ref(selected);
  const c=cells[selected];
  if(c.agent){
    const a=c.agent, f=facById(c.owner), dm=dominant(a.mood);
    fmla.textContent=`=MIND("${f?f.name:'?'}", ${ref(selected)}, 목표=성장, `+
      `감정=${moodKo(dm)}${(a.mood[dm]*100|0)}%, 충성=${(a.loyalty*100|0)}%, 자원=${(a.stock*100|0)}%, 명령="${f?orderKo(f.order):'-'}")`;
  } else if(c.st==='water') fmla.textContent=`=TERRAIN(${ref(selected)}, "바다")`;
  else if(c.st==='ruin') fmla.textContent=`=RUIN(${ref(selected)}, "${c.hist.slice(-1)[0]}")`;
  else fmla.textContent=`=HISTORY(${ref(selected)}: ${c.hist.map(x=>`"${x}"`).join(' → ')}, 비옥도=${(c.res*100|0)}%)`;
});

// ---------- 탭 / 문서 뷰 ----------
let curTab='sheet';
const docs={chron:document.getElementById('doc-chron'),dead:document.getElementById('doc-dead'),dec:document.getElementById('doc-dec')};
document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('div[data-tab]'); if(!t) return;
  curTab=t.dataset.tab;
  for(const d of document.querySelectorAll('#tabs div')) d.classList.toggle('on',d===t);
  for(const k in docs) docs[k].classList.remove('on');
  sheet.style.display = curTab==='sheet'?'grid':'none';
  if(curTab==='chron'){docs.chron.classList.add('on');renderChron();}
  if(curTab==='dead'){docs.dead.classList.add('on');renderDead();}
  if(curTab==='dec'){docs.dec.classList.add('on');renderDec();}
});
function renderChron(){
  let rows=''; const recent=chronicle.slice(-200).reverse();
  for(const e of recent) rows+=`<tr><td class="r">서기 ${e.year}년</td><td>${kindIcon(e.kind)} ${esc(e.msg)}</td><td class="mono">${esc(e.formula)}</td></tr>`;
  docs.chron.innerHTML=`<table><thead><tr><th style="width:90px">연도</th><th>사건</th><th style="width:34%">수식</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function renderDead(){
  let rows='';
  for(const o of [...obituaries].reverse())
    rows+=`<tr><td class="r">서기 ${o.died}년</td><td>† ${esc(o.name)}</td><td>${esc(o.leader)}</td><td class="r">${o.died-o.born}년 존속</td><td>${esc(o.cause)}</td></tr>`;
  if(!rows) rows='<tr><td colspan="5" style="color:#999;padding:14px">아직 멸망한 문명이 없다.</td></tr>';
  docs.dead.innerHTML=`<table><thead><tr><th style="width:90px">멸망 연도</th><th>문명</th><th>최후의 지도자</th><th>존속</th><th>사인</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function renderDec(){
  let rows=''; const recent=decisions.slice(-150).reverse();
  for(const d of recent) rows+=`<tr><td class="r">${d.year}년</td><td><span class="sw" style="background:${d.color};display:inline-block;vertical-align:middle"></span> ${esc(d.fname)}</td><td class="r">${esc(d.ref)}</td><td>${esc(d.thought)}</td><td class="mono">${esc(d.formula)}</td></tr>`;
  if(!rows) rows='<tr><td colspan="5" style="color:#999;padding:14px">에이전트들이 곧 스스로 판단하기 시작한다…</td></tr>';
  docs.dec.innerHTML=`<table><thead><tr><th style="width:60px">연도</th><th style="width:120px">세력</th><th style="width:48px">위치</th><th>에이전트의 판단</th><th style="width:24%">수식</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ---------- 일시정지 ----------
let timer=null, paused=false;
const pauseBtn=document.getElementById('pause');
pauseBtn.addEventListener('click',()=>{
  paused=!paused;
  pauseBtn.textContent=paused?'▶ 재생':'❚❚ 일시정지';
});

// ---------- 시작 ----------
function boot(){
  computeGrid(); buildSheet(); buildWorld();
  factions=[]; nextFid=0; nameIdx=0;
  for(let i=0;i<N;i++) paint(i);
  fmla.textContent=`=SIM.CIVILIZATION($A$1:$${colName(COLS-1)}$${ROWS}, 에이전트당 자율판단, "역사는 매번 새로 쓰인다")`;
  spawnFaction(-1,null,true); spawnFaction(-1,null,true); spawnFaction(-1,null,true);
  renderSide();
}
boot();

if(timer) clearInterval(timer);
timer=setInterval(()=>{ if(!paused) tick(); }, 120);

// 리사이즈: 재구성 (디바운스)
let rzT;
window.addEventListener('resize',()=>{clearInterval(timer);clearTimeout(rzT);rzT=setTimeout(()=>{
  obituaries.length=0; chronicle.length=0; decisions.length=0;
  for(const c of [...caravans]){c.el.remove();} caravans.length=0;
  plague=new Map(); fires=new Map(); dirty.clear(); year=1; tickN=0;
  boot();
  timer=setInterval(()=>{ if(!paused) tick(); }, 120);
},300);});
})();
</script>
