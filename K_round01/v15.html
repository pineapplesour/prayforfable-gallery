<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문명.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:14px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;
    flex:0 0 auto;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px;white-space:nowrap}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px;flex:0 0 auto}
  #namebox{width:74px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;flex:0 0 auto;font-size:11px}
  #fx{width:28px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif;flex:0 0 auto}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #body{flex:1 1 auto;display:flex;min-height:0;position:relative}
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1 1 auto;min-width:0}
  #sheet{display:grid;background:#fff}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:10px}
  .cell{border-right:1px solid #e6e6e6;border-bottom:1px solid #e6e6e6;
    display:flex;align-items:center;justify-content:center;font-size:11px;
    overflow:hidden;cursor:cell;position:relative}
  .cell.cap::after{content:'★';position:absolute;top:-1px;right:0px;font-size:8px;color:#000;opacity:.55}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:3}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #ff2d2d}50%{box-shadow:inset 0 0 0 2px #ffd2d2}}
  .war{animation:warf .28s 3}
  @keyframes rev{0%,100%{box-shadow:inset 0 0 0 2px #ff8c00}50%{box-shadow:inset 0 0 0 2px #ffe0b0}}
  .revolt{animation:rev .3s 4}
  /* 우측 패널 = "감찰" 시트 느낌 */
  #panel{width:262px;flex:0 0 262px;background:#fbfbfa;border-left:1px solid #d4d4d4;
    display:flex;flex-direction:column;font-size:11px;overflow:hidden}
  #panel.hidden{display:none}
  #panel h4{margin:0;padding:6px 9px;font-size:11px;color:#fff;background:#107c41;
    display:flex;justify-content:space-between;align-items:center}
  #panel .scroll{overflow-y:auto;flex:1 1 auto}
  .fac{padding:6px 9px;border-bottom:1px solid #ececec}
  .fac .ttl{display:flex;align-items:center;gap:5px;font-weight:700;font-size:11px}
  .fac .sw{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
  .fac .meta{color:#666;margin:2px 0 0;line-height:1.55}
  .bar{height:5px;border-radius:3px;background:#e3e3e3;overflow:hidden;margin-top:2px}
  .bar>i{display:block;height:100%}
  .mood{font-size:10px;color:#888}
  .tag{display:inline-block;padding:0 4px;border-radius:3px;font-size:9.5px;margin-left:3px;
    background:#eee;color:#555}
  /* 셀 선택 시 하단 인스펙터 */
  #inspect{position:absolute;left:8px;bottom:8px;width:330px;max-width:calc(100% - 280px);
    background:#fffdf3;border:1px solid #d8c66a;box-shadow:2px 4px 12px rgba(0,0,0,.22);
    padding:8px 11px;font-size:11px;z-index:6;line-height:1.65;display:none}
  #inspect.show{display:block}
  #inspect b{color:#7a5a00}
  #inspect .gv{font-weight:700}
  #inspect .row{display:flex;justify-content:space-between;gap:8px}
  #inspect .hl{color:#444}
  #inspect .close{position:absolute;top:3px;right:7px;cursor:pointer;color:#999}
  #inspect .act{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
  #inspect .act button{font-size:10px;padding:3px 7px;border:1px solid #c9b34d;background:#fff;
    border-radius:3px;cursor:pointer;color:#6a5300}
  #inspect .act button:hover{background:#fff3c4}
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11px;flex:0 0 auto;overflow:hidden}
  #statusbar .sep{margin:0 9px;opacity:.5}
  #statusbar .ev{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:18px;
    border-top:1px solid #d4d4d4;font-size:11.5px;flex:0 0 auto;overflow:hidden}
  #tabs div{padding:3px 12px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  /* 시트 오버레이(연대기/멸망기록/포고문) */
  #overlay{position:absolute;inset:0;background:#fff;z-index:8;display:none;flex-direction:column}
  #overlay.show{display:flex}
  #overlay .ohd{display:grid;background:#f5f5f5;border-bottom:1px solid #d0d0d0;font-size:11px;color:#555}
  #overlay .ohd>div{padding:4px 8px;border-right:1px solid #d0d0d0}
  #overlay .obody{overflow-y:auto;flex:1}
  #overlay .orow{display:grid;border-bottom:1px solid #eee;font-size:11px}
  #overlay .orow>div{padding:3px 8px;border-right:1px solid #f0f0f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #overlay .orow:nth-child(even){background:#fafafa}
  #overlay .yr{color:#999;font-variant-numeric:tabular-nums}
  #overlay .mono{font-family:Consolas,monospace;font-size:10.5px;color:#444}
  .em-anger{color:#c0392b}.em-joy{color:#16a085}.em-fear{color:#8e44ad}.em-sorrow{color:#2e6da4}
  @media (max-width:560px){
    #panel{position:absolute;right:0;top:0;bottom:0;z-index:7;box-shadow:-3px 0 10px rgba(0,0,0,.15)}
    #inspect{max-width:calc(100% - 16px);width:auto;right:8px}
    #menubar{gap:9px}
  }
</style>

<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <span id="ttl">문명.xlsx - Excel</span>
  </div>
  <div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
  <div id="fbar">
    <div id="namebox">A1</div>
    <div id="fx">fx</div>
    <div id="formula"></div>
  </div>
  <div id="body">
    <div id="sheetwrap">
      <div id="sheet"></div>
      <div id="inspect">
        <span class="close" id="insClose">✕</span>
        <div id="insBody"></div>
      </div>
      <div id="overlay">
        <div class="ohd" id="ovHd"></div>
        <div class="obody" id="ovBody"></div>
      </div>
    </div>
    <div id="panel">
      <h4><span>감찰부 — 세력 현황</span><span id="pYear"></span></h4>
      <div class="scroll" id="pScroll"></div>
    </div>
  </div>
  <div id="tabs">
    <div class="on" data-sheet="map">세계지도</div>
    <div data-sheet="chron">연대기</div>
    <div data-sheet="dead" id="tab-dead">멸망기록 (0)</div>
    <div data-sheet="decree">포고문</div>
  </div>
  <div id="statusbar">
    <span>준비</span><span class="sep">|</span>
    <span id="sbYear">서기 1년</span><span class="sep">|</span>
    <span id="sbPop">인구 0</span><span class="sep">|</span>
    <span id="sbFac">국가 0곳</span><span class="sep">|</span>
    <span class="ev" id="sbEv">천지가 창조되었습니다.</span>
  </div>
</div>

<script>
"use strict";
(() => {
/* ============================================================
   문명.xlsx — 창발적 AI 문명 시뮬레이션 (엑셀 위장)
   렌즈: 도시 자치(Governor 에이전트) vs 중앙집권(Monarch 에이전트)
   - 군주/총독 모두 성격·감정·기억을 가진 자율 에이전트
   - 명령은 하달되고, 해석되고, 수행/왜곡/항명/배신된다
   - 결과는 대본 없이 매 실행 다르게 창발한다
   ============================================================ */

/* ---------- 그리드/지형 ---------- */
const CW = 34, CH = 22;
const sheetEl = document.getElementById('sheet');
let COLS, ROWS, N;
function computeGrid(){
  COLS = Math.max(18, Math.min(40, Math.floor((document.getElementById('sheetwrap').clientWidth - 48) / CW)));
  ROWS = Math.max(13, Math.min(28, Math.floor((document.getElementById('body').clientHeight - 4) / CH)));
  N = COLS * ROWS;
}
function colName(n){ let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0; } return s; }
function ref(i){ return colName(i%COLS) + (Math.floor(i/COLS)+1); }

const cellEls = [];
let cells = [];

function buildSheet(){
  computeGrid();
  sheetEl.style.gridTemplateColumns = `40px repeat(${COLS}, ${CW}px)`;
  sheetEl.style.gridAutoRows = CH + 'px';
  sheetEl.textContent='';
  cellEls.length = 0;
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){ const h=document.createElement('div'); h.className='hd'; h.textContent=colName(c); frag.appendChild(h); }
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div'); h.className='hd'; h.textContent=r+1; frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div'); d.className='cell'; d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d; frag.appendChild(d);
    }
  }
  sheetEl.appendChild(frag);
}

/* ---------- 지형 노이즈 ---------- */
const GW=9, GH=6; let gz=[];
function genNoiseSeed(){ gz=[]; for(let i=0;i<GW*GH;i++) gz[i]=Math.random(); }
function noise(x,y){
  const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=gz[y0*GW+x0], b=gz[y0*GW+Math.min(GW-1,x0+1)];
  const c=gz[Math.min(GH-1,y0+1)*GW+x0], d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}
function nbrs(i){
  const x=i%COLS,y=i/COLS|0,out=[];
  if(x>0)out.push(i-1); if(x<COLS-1)out.push(i+1);
  if(y>0)out.push(i-COLS); if(y<ROWS-1)out.push(i+COLS);
  return out;
}

/* ---------- 도메인 모델 ----------
   cell: { st, owner(facId), prov(provId), level, hist[], ruinT }
   province(=도시 자치체): 자율 총독(Governor) 에이전트가 통치
   faction(=국가): 군주(Monarch) 에이전트가 통치
*/
function genTerrain(){
  cells = new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS, y=i/COLS|0;
    const v=noise(x,y)+(Math.random()-.5)*.14;
    let st='land', hist=['황무지'];
    if(v<.32){ st='water'; hist=['바다']; }
    else if(v>.63 && Math.random()<.68){ st='forest'; hist=['숲']; }
    cells[i]={ st, owner:null, prov:null, level:0, hist, ruinT:0 };
  }
}

/* ---------- 이름/색 ---------- */
const NAMES=['북부 왕국','붉은 제국','해안 연맹','유목 칸국','삼나무 공화국','잿빛 교단','동방 상단','검은 강 부족','여명 왕조','소금 사막 민족','서리 부족','황금 술탄국'];
const COLORS=['#2563eb','#dc2626','#059669','#7c3aed','#d97706','#0d9488','#be185d','#4d7c0f','#9333ea','#b45309','#0891b2','#ca8a04'];
const MONARCH_TITLE=['대왕','여제','족장','칸','집정관','대사제','상왕','대공','여왕','술탄','선제후','패왕'];
const GOV_SUR=['하란','베스','코르','일다','마르','센','투란','요엘','카심','리브','노른','테아','자룬','펜','우르','미아','갈','로엔'];
const GOV_GIV=['도','란','시','우','네','카','로','미','두','한','샤','펠','이르','온','베','크','단','유'];
function pick(a){ return a[Math.random()*a.length|0]; }
function govName(){ return pick(GOV_SUR)+'·'+pick(GOV_GIV)+pick(GOV_GIV); }

/* ---------- 전역 상태 ---------- */
let factions=[], provinces=[];
let provSeq=0;
const obituaries=[];   // {name,year,reason}
const chronicle=[];    // {year,scope,msg,formula,emo}
const decrees=[];      // {year,monarch,policy,reaction}
let year=1, lastEvent='천지가 창조되었습니다.', worldPop=0;
let nameIdx=0;
const dirty=new Set();
let selected=-1, selKind=null;  // 'cell'
let curSheet='map';

const fmla=document.getElementById('formula');
const namebox=document.getElementById('namebox');

function hexA(hex,a){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }
function clamp(v,a=0,b=1){ return v<a?a:v>b?b:v; }
function facById(id){ return factions.find(f=>f.id===id); }
function provById(id){ return provinces.find(p=>p.id===id); }

/* ============================================================
   에이전트: 군주(Monarch)
   성격 traits:
     centralism  중앙집권 성향 (높을수록 자치권 박탈/통제 선호)
     ambition    팽창/전쟁 욕구
     paranoia    의심 — 충성 낮은 총독을 숙청하려는 경향
     mercy       관대함 — 항명 용서/감세
   감정 mood: anger, content, fear  (사건에서 동적 변동)
   memory: betrayals(배신 누적), rebellions(반란 누적), lostProv
============================================================ */
function makeMonarch(name){
  return {
    title: pick(MONARCH_TITLE),
    name,
    centralism: clamp(.3+Math.random()*.6),
    ambition:   clamp(.2+Math.random()*.7),
    paranoia:   clamp(.1+Math.random()*.6),
    mercy:      clamp(.15+Math.random()*.6),
    anger:0, content:.4, fear:0,
    mem:{ betrayals:0, rebellions:0, lostProv:0, lastDecree:'즉위' }
  };
}

/* ============================================================
   에이전트: 총독(Governor) — province마다 1명. 자치의 화신.
   성격:
     loyalty    충성 (높으면 명령 잘 따름)
     ambition   야심 (높으면 독립/하극상 욕구)
     pride      자존심 (자치권 침해에 민감)
     competence 통치력 (도시 발전 속도)
   감정(창발): joy, anger, sorrow, fervor(즐거움/열의)
   memory: slights(모욕/무시 누적), favors(은혜), ordersIgnored
   autonomy: 현재 누리는 자치 수준(0 중앙통제 ~ 1 사실상 독립)
============================================================ */
function makeGovernor(facId, capital){
  return {
    id: provSeq++,
    facId,
    name: govName(),
    capital,                  // 도청 소재 셀
    cells: [],                // 소속 셀 목록(틱마다 재집계)
    loyalty:    clamp(.35+Math.random()*.5),
    ambition:   clamp(.1+Math.random()*.7),
    pride:      clamp(.2+Math.random()*.7),
    competence: clamp(.3+Math.random()*.6),
    joy:.2+Math.random()*.3, anger:Math.random()*.15, sorrow:Math.random()*.15, fervor:.1+Math.random()*.3,
    autonomy:   clamp(.3+Math.random()*.3),
    tax:.5,                   // 군주가 부과한 세율(총독이 실제 징수와 다를 수 있음)
    mem:{ slights:0, favors:0, ignored:0, lastOrder:'창건', stance:'순응' },
    age:0, independent:false
  };
}

/* ---------- 셀 조작 ---------- */
const LV_TXT=['', '·','田','村','都','城'];
const LV_LABEL=['','개척지','농장','마을','도시','대도성'];
function setCell(i, facId, provId, level, histLabel){
  const c=cells[i];
  c.owner=facId; c.prov=provId; c.level=level; c.st='land';
  if(histLabel){ c.hist.push(histLabel); if(c.hist.length>8)c.hist.shift(); }
  dirty.add(i);
}

function spawnFaction(announce){
  if(nameIdx>=NAMES.length) nameIdx=0;
  const idx=nameIdx++;
  for(let tries=0;tries<400;tries++){
    const i=Math.random()*N|0;
    if(cells[i].st==='land' && cells[i].owner===null){
      const f={ id: factions.length?Math.max(...factions.map(x=>x.id))+1:0,
        name:NAMES[idx], color:COLORS[idx%COLORS.length], golden:0, size:0, era:0,
        monarch: makeMonarch(NAMES[idx]) };
      const g=makeGovernor(f.id, i);
      g.mem.stance='수도';
      provinces.push(g);
      setCell(i, f.id, g.id, 2, '왕도(王都)');
      cells[i].capital=true;
      factions.push(f);
      if(announce) logEvent(`${f.name} — ${f.monarch.title} ${f.monarch.name} 즉위. ${ref(i)}에 왕도를 세우다.`,
        `=FOUND("${f.name}", ${ref(i)}, MONARCH("${f.monarch.title}"))`, f.color, 'joy');
      pushChron('국가', f.name, `${f.monarch.title} ${f.monarch.name}이(가) 건국을 선포하다.`, `=FOUND(${ref(i)})`);
      return f;
    }
  }
  nameIdx=idx; return null;
}

/* ---------- 이벤트/연대기 ---------- */
function logEvent(msg, formula, color, emo){
  lastEvent=`서기 ${year}년: ${msg}`;
  if(formula) fmla.textContent=formula;
}
function pushChron(scope, who, msg, formula, emo){
  chronicle.push({year, scope, who, msg, formula:formula||'', emo:emo||''});
  if(chronicle.length>400) chronicle.shift();
}
function flash(i, cls){
  const el=cellEls[i]; if(!el)return;
  el.classList.add(cls); setTimeout(()=>el.classList.remove(cls), 1000);
}

/* ---------- 페인트 ---------- */
const fires=new Map(), plague=new Map();
function paint(i){
  const c=cells[i], el=cellEls[i]; if(!el)return;
  let bg='',tx='',col='#222',w='';
  if(plague.has(i)){ bg='#ead5f5'; tx='疫'; col='#7030a0'; w='700'; }
  else if(fires.has(i)){ bg='#ffd9b3'; tx='火'; col='#c00000'; w='700'; }
  else if(c.st==='water'){ bg='#ddebf7'; tx='≈'; col='#9dc3e6'; }
  else if(c.st==='forest'){ bg='#e2efda'; tx='木'; col='#548235'; }
  else if(c.st==='ruin'){ bg='#ececec'; tx='墟'; col='#999'; }
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      const p=provById(c.prov);
      // 독립한(배신한) 도시는 색을 흐리게 + 테두리 느낌
      let a=.14+c.level*.16;
      if(p && p.independent){ a=Math.min(.5,a); }
      bg=hexA(f.color, a); tx=LV_TXT[c.level]||''; col=f.color; w=c.level>=4?'700':'';
      if(p && p.mem.stance==='반란'){ col='#ff6a00'; w='700'; }
    }
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  el.textContent=tx;
  el.classList.toggle('cap', !!c.capital);
}

/* ============================================================
   감정 동역학 — 사건이 감정을 만든다(대본 없음)
============================================================ */
function gvDecay(g){
  g.joy*=.985; g.anger*=.975; g.sorrow*=.97; g.fervor*=.98;
  g.joy=clamp(g.joy); g.anger=clamp(g.anger); g.sorrow=clamp(g.sorrow); g.fervor=clamp(g.fervor);
}
function moDecay(m){
  m.anger*=.97; m.content*=.99; m.fear*=.96;
  m.anger=clamp(m.anger); m.content=clamp(m.content); m.fear=clamp(m.fear);
}
function dominantMood(g){
  const arr=[['기쁨',g.joy,'joy'],['분노',g.anger,'anger'],['슬픔',g.sorrow,'sorrow'],['열의',g.fervor,'fervor']];
  arr.sort((a,b)=>b[1]-a[1]);
  if(arr[0][1]<.18) return ['평온',0,'calm'];
  return arr[0];
}

/* ============================================================
   군주의 정책 결정 (자율) — 국가 상태를 읽고 결정
   가능 정책:
     'centralize' 자치권 회수(중앙집권 강화)  → 총독 분노↑
     'devolve'    자치권 하사(분권)           → 총독 기쁨↑, 통제↓
     'tax_up'     증세                          → 총독 분노↑/재정↑
     'tax_cut'    감세                          → 총독 기쁨↑
     'conscript'  징병(팽창전쟁 준비)          → 총독 열의 or 분노
     'purge'      숙청(충성 낮은 총독 처단)    → 공포↑, 반발 위험
     'reward'     포상(공 세운 총독)           → 충성/기쁨↑
     'hold'       관망
============================================================ */
function monarchDecide(f){
  const m=f.monarch;
  const myProvs=provinces.filter(p=>p.facId===f.id && !p.independent);
  if(!myProvs.length) return;
  const avgLoyal=myProvs.reduce((s,p)=>s+p.loyalty,0)/myProvs.length;
  const avgAuton=myProvs.reduce((s,p)=>s+p.autonomy,0)/myProvs.length;
  const rebels=myProvs.filter(p=>p.mem.stance==='반란'||p.loyalty<.22);
  const ambitiousGov=myProvs.filter(p=>p.ambition>.6 && p.loyalty<.45);

  // 결정 점수
  const scores={};
  scores.centralize = m.centralism*(.4+avgAuton) + m.anger*.6 - m.mercy*.3;
  scores.devolve    = (1-m.centralism)*.5 + (avgLoyal<.4? .5:0) + m.fear*.5 + m.mercy*.3 - avgAuton*.4;
  scores.tax_up     = m.ambition*.4 + (f.golden?-.3:0) + (m.anger*.3);
  scores.tax_cut    = m.mercy*.4 + (avgLoyal<.45?.4:0);
  scores.conscript  = m.ambition*.7 + m.anger*.4 + (f.size>6?.3:-.2);
  scores.purge      = m.paranoia*.6 + (ambitiousGov.length?.5:0) + m.anger*.5 - m.mercy*.6;
  scores.reward     = m.mercy*.4 + (avgLoyal<.5?.3:0) + (f.golden?.3:0);
  scores.hold       = .25 + m.content*.3;
  // 반란 존재 시 강제 대응 분기
  if(rebels.length){ scores.centralize+=.6; scores.purge+=.7; scores.devolve+=.4; }

  let best='hold', bv=-1;
  for(const k in scores){ const v=scores[k]+(Math.random()-.5)*.35; if(v>bv){bv=v;best=k;} }
  applyPolicy(f, best, myProvs, rebels, ambitiousGov);
}

function applyPolicy(f, policy, myProvs, rebels, ambitiousGov){
  const m=f.monarch;
  m.mem.lastDecree=policy;
  let txt='', react='';
  switch(policy){
    case 'centralize':{
      let revoltCount=0;
      for(const p of myProvs){
        const before=p.autonomy;
        p.autonomy=clamp(p.autonomy-(.12+m.centralism*.12));
        const loss=before-p.autonomy;
        // 총독 반응: 자존심·야심 높으면 분노/항명
        p.anger=clamp(p.anger + loss*(1.5+p.pride*1.6));
        p.mem.slights += loss>.05?1:0;
        p.loyalty=clamp(p.loyalty - loss*(.4+p.ambition*.8));
        if(governorWillRebel(p,f)){ triggerRevolt(p,f,'자치권 박탈에 반발'); revoltCount++; }
      }
      txt=`자치권 회수령 — 모든 도시의 자치를 ${Math.round(m.centralism*100)}% 수준으로 통제한다.`;
      react = revoltCount? `${revoltCount}개 도시가 즉각 항명/봉기했다.` : '도시들이 분노 속에 굴복했다.';
      logEvent(`${f.name}: ${m.title} ${m.name}이(가) 자치권 회수령을 내렸다.`, `=DECREE("중앙집권", ${myProvs.length}도시)`, f.color, 'anger');
      break;
    }
    case 'devolve':{
      for(const p of myProvs){
        p.autonomy=clamp(p.autonomy+ .12);
        p.joy=clamp(p.joy+.18); p.loyalty=clamp(p.loyalty+.06); p.mem.favors++;
      }
      txt='자치 하사령 — 도시에 더 큰 자치를 허락한다.';
      react='총독들이 기뻐하나, 왕권의 통제력은 느슨해졌다.';
      logEvent(`${f.name}: ${m.title} ${m.name}이(가) 자치권을 하사했다.`, `=DECREE("분권", +자치)`, f.color, 'joy');
      break;
    }
    case 'tax_up':{
      for(const p of myProvs){
        p.tax=clamp(p.tax+.12); p.anger=clamp(p.anger+.1+p.pride*.1);
        p.loyalty=clamp(p.loyalty-.05); p.mem.slights+=Math.random()<.4?1:0;
        if(governorWillRebel(p,f)) triggerRevolt(p,f,'가혹한 세금에 반발');
      }
      txt='증세령 — 국고를 채우기 위해 세금을 올린다.';
      react='도성마다 원성이 자자하다.';
      logEvent(`${f.name}: 증세령이 반포되었다.`, `=TAX(+, ${myProvs.length}도시)`, f.color, 'anger');
      break;
    }
    case 'tax_cut':{
      for(const p of myProvs){ p.tax=clamp(p.tax-.1); p.joy=clamp(p.joy+.12); p.loyalty=clamp(p.loyalty+.05); }
      txt='감세령 — 백성의 부담을 덜어준다.';
      react='민심이 회복되고 총독들이 안도한다.';
      logEvent(`${f.name}: 감세령으로 민심을 달랜다.`, `=TAX(-)`, f.color, 'joy');
      break;
    }
    case 'conscript':{
      for(const p of myProvs){
        if(p.fervor>.4 || p.loyalty>.55){ p.fervor=clamp(p.fervor+.15); }
        else { p.anger=clamp(p.anger+.12); p.mem.slights+=Math.random()<.3?1:0; }
      }
      f._warDrive=12;  // 일정 기간 공격성↑
      txt='징병령 — 정복 전쟁을 위해 병력을 소집한다.';
      react='충성스런 도시는 열의를, 지친 도시는 분노를 보인다.';
      logEvent(`${f.name}: ${m.title} ${m.name}이(가) 징병령을 선포했다.`, `=CONSCRIPT("${f.name}")`, f.color, 'fervor');
      break;
    }
    case 'purge':{
      const target = rebels[0] || ambitiousGov.sort((a,b)=>(b.ambition-b.loyalty)-(a.ambition-a.loyalty))[0];
      if(target){
        // 숙청 시도 — 총독이 충분히 강하면 오히려 배신/독립
        const power = target.cells.length*(.5+target.autonomy) ;
        if(power>4 && Math.random()<.55+target.ambition*.3){
          triggerSecession(target, f, '숙청 명령에 맞서 거병');
          react=`${target.name}이(가) 숙청에 맞서 독립을 선포했다!`;
        } else {
          // 숙청 성공: 총독 교체
          const old=target.name;
          target.name=govName(); target.loyalty=clamp(.4+Math.random()*.4);
          target.anger=0; target.ambition=clamp(.1+Math.random()*.4); target.mem={slights:0,favors:0,ignored:0,lastOrder:'부임',stance:'순응'};
          react=`총독 ${old}이(가) 처형되고 새 총독 ${target.name}이(가) 부임했다.`;
          pushChron('숙청', f.name, `${m.title} ${m.name}이(가) 총독 ${old}을(를) 숙청했다.`, `=PURGE("${old}")`, 'fear');
        }
        // 다른 총독들 공포 전파
        for(const p of myProvs){ if(p!==target){ p.fear=clamp((p.fear||0)+.15); p.loyalty=clamp(p.loyalty+(p.loyalty<.5? .04: -.05)); } }
      }
      m.fear=clamp(m.fear+.1);
      txt='숙청령 — 불충한 총독을 처단한다.';
      logEvent(`${f.name}: ${m.title} ${m.name}이(가) 숙청을 명했다.`, `=PURGE()`, f.color, 'fear');
      break;
    }
    case 'reward':{
      const best=myProvs.slice().sort((a,b)=>b.cells.length-a.cells.length)[0];
      if(best){ best.loyalty=clamp(best.loyalty+.16); best.joy=clamp(best.joy+.2); best.mem.favors+=2;
        react=`최대 도시 ${best.name}이(가) 포상을 받고 충성을 다짐했다.`; }
      txt='포상령 — 공을 세운 총독에게 상을 내린다.';
      logEvent(`${f.name}: 포상령으로 충신을 격려한다.`, `=REWARD()`, f.color, 'joy');
      break;
    }
    default:
      txt='관망 — 군주는 정세를 지켜본다.';
      react='큰 변화 없이 시간이 흐른다.';
  }
  decrees.push({year, faction:f.name, color:f.color, monarch:`${m.title} ${m.name}`, policy:txt, reaction:react});
  if(decrees.length>200) decrees.shift();
  pushChron('포고', f.name, txt+' — '+react, '');
}

/* ---------- 총독 의사결정: 항명/반란/배신 ---------- */
function governorWillRebel(p, f){
  if(p.independent) return false;
  const m=f.monarch;
  // 반란 충동 = 분노 + 야심 + 누적 모욕 - 충성 - 공포(군주 paranoia)
  const drive = p.anger*1.15 + p.ambition*.7 + p.autonomy*.35 + Math.min(.6,p.mem.slights*.07)
              - p.loyalty*1.0 - (p.fear||0)*.55 - m.paranoia*.18*p.loyalty;
  return drive > .48 && p.cells.length>=2;
}
function triggerRevolt(p, f, reason){
  if(p.mem.stance==='반란'||p.independent) return;
  p.mem.stance='반란';
  p.anger=clamp(p.anger+.2);
  for(const i of p.cells){ flash(i,'revolt'); dirty.add(i); }
  f.monarch.anger=clamp(f.monarch.anger+.25);
  f.monarch.mem.rebellions++;
  logEvent(`${f.name}의 도시 ${p.name}이(가) 반란을 일으켰다! (${reason})`, `=REVOLT("${p.name}", "${reason}")`, '#ff6a00', 'anger');
  pushChron('반란', f.name, `총독 ${p.name}이(가) 봉기했다 — ${reason}.`, `=REVOLT(${ref(p.capital)})`, 'anger');
}
function triggerSecession(p, f, reason){
  // 분리독립: 새 국가 탄생
  if(p.independent) return;
  if(nameIdx>=NAMES.length){
    // 이름 풀 소진 시 모(母)국명 변형
    var newName = p.name+' 자유시';
    var newColor = '#'+Math.floor(0x444444+Math.random()*0x999999).toString(16).slice(0,6);
  } else {
    var idx=nameIdx++; var newName=NAMES[idx]; var newColor=COLORS[idx%COLORS.length];
    newName = p.cells.length>3 ? newName : (p.name+' 자유시');
  }
  const nf={ id: factions.length?Math.max(...factions.map(x=>x.id))+1:0,
    name:newName, color:newColor, golden:0, size:0, era:0,
    monarch: makeMonarch(newName) };
  // 새 군주는 이 총독의 성격을 물려받음(자치를 쟁취한 자)
  nf.monarch.centralism=clamp(p.ambition*.6+.2);
  nf.monarch.ambition=clamp(p.ambition+.1);
  nf.monarch.name=p.name;  // 총독이 군주가 됨
  factions.push(nf);
  p.facId=nf.id; p.independent=true; p.mem.stance='독립';
  p.loyalty=.85; p.anger=0; p.joy=.6; p.fervor=.5;
  p.autonomy=1;
  for(const i of p.cells){ cells[i].owner=nf.id; flash(i,'revolt'); dirty.add(i); }
  f.monarch.anger=clamp(f.monarch.anger+.4);
  f.monarch.fear=clamp(f.monarch.fear+.25);
  f.monarch.mem.betrayals++; f.monarch.mem.lostProv++;
  logEvent(`${p.name}이(가) ${f.name}으로부터 독립을 선포했다! (${reason})`, `=SECEDE("${p.name}" ← "${f.name}")`, newColor, 'fervor');
  pushChron('독립', newName, `${p.name}이(가) 독립 국가를 세웠다 — ${reason}.`, `=SECEDE(${ref(p.capital)})`, 'fervor');
}

/* ---------- 도시 분화: 거대 도시에서 새 총독이 갈라져 나온다 ---------- */
function splitProvince(p){
  if(p.cells.length<7) return;
  // 모도청에서 먼 셀들을 새 도시로
  const cap=p.capital, cx=cap%COLS, cy=cap/COLS|0;
  const sorted=p.cells.slice().sort((a,b)=>{
    const ad=Math.abs(a%COLS-cx)+Math.abs((a/COLS|0)-cy);
    const bd=Math.abs(b%COLS-cx)+Math.abs((b/COLS|0)-cy);
    return bd-ad;
  });
  const take=sorted.slice(0, Math.max(2, Math.floor(p.cells.length*.4)));
  if(take.length<2) return;
  const g=makeGovernor(p.facId, take[0]);
  // 갈라져 나온 총독은 더 야심차고 자존심 세다 — 분리독립의 씨앗
  g.ambition=clamp(p.ambition*.5 + .3 + Math.random()*.3);
  g.pride=clamp(p.pride*.5 + .3 + Math.random()*.3);
  g.loyalty=clamp(p.loyalty - .1 + Math.random()*.2);
  g.autonomy=clamp(p.autonomy);
  g.mem.lastOrder='신설';
  provinces.push(g);
  for(const i of take){ cells[i].prov=g.id; g.cells.push(i); dirty.add(i); }
  cells[g.capital].capital=true;
  p.cells=p.cells.filter(i=>!take.includes(i));
  const f=facById(p.facId);
  if(f && evCooldown===0){
    logEvent(`${f.name}에 새 도시 ${g.name}이(가) 분리·설립되었다.`, `=PROVINCE.SPLIT("${g.name}", ${ref(g.capital)})`, f.color,'joy');
    evCooldown=24;
    pushChron('분화', f.name, `${p.name}에서 ${g.name}이(가) 갈라져 새 도시가 되었다.`, `=SPLIT(${ref(g.capital)})`, 'fervor');
  }
}

/* ============================================================
   메인 틱
============================================================ */
let tickN=0, evCooldown=0;
const PW=[0,30,90,260,700,1600];

function tick(){
  tickN++; year++;
  if(evCooldown>0) evCooldown--;

  // 1) 소속 재집계
  for(const p of provinces){ p.cells.length=0; }
  worldPop=0;
  for(const f of factions){ f.size=0; }
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin' && --c.ruinT<=0){ c.st='land'; dirty.add(i); }
    if(c.owner!==null){
      const f=facById(c.owner);
      if(!f){ c.owner=null;c.prov=null;c.level=0;c.capital=false;dirty.add(i); continue; }
      f.size++;
      worldPop+=PW[c.level]||0;
      const p=provById(c.prov);
      if(p && p.facId===c.owner) p.cells.push(i);
      else {
        // province가 사라졌거나 소유 불일치 → 가장 가까운 같은 국가 province에 흡수, 없으면 새 province
        let host=provinces.find(q=>q.facId===c.owner && !q.independent && q.cells.length<6);
        if(host){ c.prov=host.id; host.cells.push(i); }
        else { const g=makeGovernor(c.owner,i); provinces.push(g); c.prov=g.id; g.cells.push(i); }
        dirty.add(i);
      }
    }
  }

  // 2) province/총독 정리 + 감정 감쇠 + 도청 이전
  for(let k=provinces.length-1;k>=0;k--){
    const p=provinces[k];
    if(p.cells.length===0){ provinces.splice(k,1); continue; }
    if(!p.cells.includes(p.capital)){
      // 수도 함락 → 새 도청 + 슬픔 창발
      const old=p.capital; if(cells[old]) cells[old].capital=false;
      p.capital=p.cells[0]; cells[p.capital].capital=true;
      p.sorrow=clamp(p.sorrow+.3); p.anger=clamp(p.anger+.15); dirty.add(p.capital); dirty.add(old);
    }
    gvDecay(p); p.age++;
    // 자치/세금이 충성에 천천히 작용
    p.loyalty=clamp(p.loyalty + (p.joy-p.anger)*.01 + (p.autonomy>.7? -.004:0) + (p.mem.favors-p.mem.slights)*.0008);
    // 야심 큰 총독은 자치를 야금야금 키운다(중앙 모르게)
    if(!p.independent && p.ambition>.5 && Math.random()<.05) p.autonomy=clamp(p.autonomy+.02);
    // 도시 분화: 너무 커진 도시는 외곽이 떨어져 새 총독을 세운다(자치 주체 증식)
    if(p.cells.length>=8 && Math.random()<.18) splitProvince(p);
  }

  // 3) 국가 멸망 판정
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      const m=f.monarch;
      obituaries.push({name:f.name, year, reason: m.mem.betrayals? '내부 분열·배신으로 와해':'정복당해 멸망'});
      logEvent(`${f.name}이(가) 역사에서 사라졌다.`, `=COLLAPSE("${f.name}", ${year})`, f.color, 'sorrow');
      pushChron('멸망', f.name, `${f.name}이(가) 멸망했다 (${m.mem.betrayals?'배신':'정복'}).`, `=COLLAPSE()`, 'sorrow');
      factions.splice(k,1);
    } else { moDecay(f.monarch); if(f.golden>0)f.golden--; if(f._warDrive)f._warDrive--; }
  }

  // 4) 화재
  for(const [i,t] of [...fires]){
    if(Math.random()<.12){ for(const n of nbrs(i)){ const c=cells[n]; if(c.owner!==null && !fires.has(n) && c.st==='land'){ fires.set(n,5); dirty.add(n);} } }
    if(t<=1){ fires.delete(i); const c=cells[i]; c.owner=null;c.prov=null;c.level=0;c.capital=false;c.st='ruin';c.ruinT=160; c.hist.push('잿더미'); if(c.hist.length>8)c.hist.shift(); dirty.add(i); }
    else fires.set(i,t-1);
  }
  // 5) 역병
  if(plague.size){
    for(const [i,t] of [...plague]){
      if(Math.random()<.16){ for(const n of nbrs(i)){ if(cells[n].owner!==null && !plague.has(n)){ plague.set(n,11); dirty.add(n);} } }
      if(Math.random()<.22){ const c=cells[i]; c.level--; if(c.level<=0){ c.owner=null;c.prov=null;c.level=0;c.capital=false; c.hist.push('역병으로 소멸'); } dirty.add(i); }
      if(t<=1){ plague.delete(i); dirty.add(i);} else plague.set(i,t-1);
    }
    if(plague.size===0) logEvent('역병이 물러갔다.', '=PLAGUE.END()', '#7030a0','');
  }

  // 6) 군주 정책 결정 (가끔)
  for(const f of factions){
    if(f.size===0) continue;
    const m=f.monarch;
    // 군주 감정: 영토 변화·반란이 만든다
    const myProvs=provinces.filter(p=>p.facId===f.id);
    const rebelN=myProvs.filter(p=>p.mem.stance==='반란').length;
    if(rebelN){ m.anger=clamp(m.anger+.02*rebelN); m.fear=clamp(m.fear+.01*rebelN); }
    else { m.content=clamp(m.content+.004); }
    // 결정 빈도: paranoia/ambition 높을수록 자주 개입
    const freq = .03 + m.paranoia*.03 + m.ambition*.025 + rebelN*.08;
    if(Math.random()<freq) monarchDecide(f);
  }

  // 7) 총독(도시) 자율 행동 — 명령 해석/수행/항명
  for(const p of provinces){
    if(p.cells.length===0) continue;
    const f=facById(p.facId); if(!f) continue;

    // 반란 도시: 군주와 화해 또는 독립으로 격화
    if(p.mem.stance==='반란'){
      if(p.anger<.3 && p.loyalty>.4 && Math.random()<.2){ p.mem.stance='순응'; pushChron('진압', f.name, `${p.name}의 반란이 가라앉았다.`, '', 'sorrow'); }
      else if(Math.random()<.06+p.ambition*.08){ triggerSecession(p,f,'반란이 독립으로 번짐'); continue; }
    }

    // 명령 수행 의지(effort): 자치가 높으면 군주 명령을 자기 식대로 — 발전은 자기 이익 위주
    const effort = clamp(p.loyalty*.6 + p.fervor*.5 + (f._warDrive? .2:0) - p.autonomy*.2);

    // (a) 확장 — 자치 높고 야심 큰 총독은 군주 허락 없이도 영토 확장(자기 세력화)
    const expandDrive = .5 + p.ambition*.5 + p.autonomy*.3 + (f._warDrive?.4:0);
    const attempts = 1 + (p.cells.length*.12*expandDrive | 0);
    for(let a=0;a<attempts;a++){
      const src=p.cells[Math.random()*p.cells.length|0];
      if(src===undefined||cells[src].owner!==f.id) continue;
      const nb=nbrs(src); const tgt=nb[Math.random()*nb.length|0];
      const tc=cells[tgt];
      if(tc.st==='water'||fires.has(tgt)||plague.has(tgt)) continue;
      if(tc.owner===null){
        if(tc.st==='forest'){ if(Math.random()<.22){ tc.st='land'; tc.hist.push('개간'); setCell(tgt,f.id,p.id,1,'개척지'); p.joy=clamp(p.joy+.02);} }
        else if(tc.st==='land') setCell(tgt,f.id,p.id,1,'개척지');
      } else if(tc.owner!==f.id){
        const dp=provById(tc.prov), df=facById(tc.owner);
        // 공격 의지: 군주 징병령(_warDrive) + 총독 야심/분노 - 동족 회피
        const aggr = .25 + p.ambition*.4 + p.anger*.3 + (f._warDrive?.5:0);
        if(Math.random()<aggr){
          const att=1+Math.random()*3 + p.cells.length*.04 + (f.golden?1:0) + p.fervor*1.2;
          const def=(tc.level+1)+Math.random()*3 + (dp?dp.cells.length*.03:0) + (dp?dp.fervor:0);
          flash(tgt,'war');
          if(att>def){
            if(Math.random()<.28){ fires.set(tgt,5); tc.hist.push('전화(戰火)'); if(tc.hist.length>8)tc.hist.shift(); dirty.add(tgt); }
            else { const lvl=Math.max(1,tc.level-1); setCell(tgt,f.id,p.id,lvl,'점령됨'); cells[tgt].capital=false; }
            p.fervor=clamp(p.fervor+.06); p.joy=clamp(p.joy+.05);
            if(dp){ dp.sorrow=clamp(dp.sorrow+.08); dp.anger=clamp(dp.anger+.05); }
            if((tc.level>=3 || evCooldown===0) && df){
              logEvent(`${p.name}(${f.name})이(가) ${df.name}의 ${ref(tgt)}을(를) 공격했다.`,
                `=WAR("${f.name}"→"${df.name}", ${ref(tgt)})`, f.color, 'fervor');
              evCooldown=30;
            }
          } else {
            // 방어 성공 → 공격 총독 분노/슬픔
            p.sorrow=clamp(p.sorrow+.04);
            if(dp) dp.fervor=clamp(dp.fervor+.05);
          }
        }
      }
    }

    // (b) 발전 — 총독 통치력 + (자치높으면 자기 도시에 더 투자) ; 세금 높으면 발전 둔화
    const buildRate = .05*effort*(1+p.competence) * (f.golden?2.4:1) * (1 + p.autonomy*.5) * (1 - p.tax*.3);
    const ups=1+(p.cells.length*.06|0);
    for(let u=0;u<ups;u++){
      const i=p.cells[Math.random()*p.cells.length|0];
      if(i===undefined||cells[i].owner!==f.id) continue;
      const c=cells[i];
      const maxLv = (i===p.capital)?5:4;
      if(c.level<maxLv && Math.random()<buildRate){
        c.level++; c.hist.push(LV_LABEL[c.level]||'성장'); if(c.hist.length>8)c.hist.shift(); dirty.add(i);
        p.joy=clamp(p.joy+.03);
        if(c.level>=4 && evCooldown===0){
          logEvent(`${p.name}의 ${ref(i)}에 ${LV_LABEL[c.level]}이(가) 세워졌다.`, `=CITY("${p.name}", ${ref(i)}, "${LV_LABEL[c.level]}")`, f.color, 'joy');
          evCooldown=22;
        }
      }
    }

    // (c) 항명/태업: effort 낮고 분노 높으면 명령 무시(발전 거부 + 자치 키움)
    if(p.mem.stance!=='반란' && !p.independent && p.anger>.5 && p.loyalty<.4 && Math.random()<.05){
      p.mem.ignored++; p.mem.stance='태업'; p.autonomy=clamp(p.autonomy+.05);
      if(evCooldown===0){ logEvent(`${p.name}이(가) 왕명을 거역하고 자치를 강화했다.`, `=DEFY("${p.name}")`, f.color, 'anger'); evCooldown=26; pushChron('항명', f.name, `${p.name}이(가) 중앙의 명을 거부했다.`, '', 'anger'); }
    } else if(p.mem.stance==='태업' && p.anger<.35){ p.mem.stance='순응'; }
  }

  // 8) 무작위 거대 사건
  const r=Math.random();
  if(!plague.size && r<.0035){
    const big=cells.map((c,i)=>({c,i})).filter(o=>o.c.owner!==null && o.c.level>=3);
    if(big.length){ const o=big[Math.random()*big.length|0]; plague.set(o.i,11); dirty.add(o.i);
      logEvent(`${ref(o.i)}에서 역병이 창궐했다.`, `=PLAGUE(${ref(o.i)})`, '#7030a0','sorrow'); }
  } else if(r>.9965 && factions.length){
    const f=factions[Math.random()*factions.length|0]; f.golden=80;
    f.monarch.content=clamp(f.monarch.content+.3);
    for(const p of provinces.filter(p=>p.facId===f.id)){ p.joy=clamp(p.joy+.15); p.fervor=clamp(p.fervor+.1); }
    logEvent(`${f.name}에 황금기가 도래했다.`, `=GOLDEN.AGE("${f.name}", 80)`, f.color, 'joy');
    pushChron('황금기', f.name, `${f.name}의 황금기가 시작되었다.`, `=GOLDEN.AGE()`, 'joy');
  } else if(r>.993 && r<=.9965){
    const towns=cells.map((c,i)=>({c,i})).filter(o=>o.c.owner!==null && o.c.level>=2);
    if(towns.length){ const o=towns[Math.random()*towns.length|0]; fires.set(o.i,6); dirty.add(o.i);
      logEvent(`${ref(o.i)}에 대화재가 일어났다.`, `=FIRE(${ref(o.i)})`, '#c00000','sorrow'); }
  }
  // 9) 신생 세력 도래(국가 적을 때)
  if(factions.length<3 && Math.random()<.012){
    const f=spawnFaction(false);
    if(f) logEvent(`바다 건너에서 ${f.name}이(가) 도래했다.`, `=MIGRATE("${f.name}")`, f.color, 'fervor');
  }

  // 10) 그리기 + UI
  for(const i of dirty) paint(i);
  dirty.clear();
  renderStatus();
  if(tickN%6===0) renderPanel();
  if(curSheet!=='map' && tickN%10===0) renderSheet(curSheet);
  if(selKind==='cell' && selected>=0 && tickN%4===0) renderInspector();
}

  document.getElementById('sbEv').textContent=lastEvent.replace(/^서기 \d+년: /,'');
  document.getElementById('tab-dead').textContent=`멸망기록 (${obituaries.length})`;

/* ---------- 우측 감찰 패널 ---------- */
function emoText(g){
  const [label,val,key]=dominantMood(g);
  return `<span class="em-${key==='fervor'?'joy':key}">${label}</span>`;
}
function renderPanel(){
  document.getElementById('pYear').textContent=`서기 ${year}년`;
  const sorted=factions.slice().sort((a,b)=>b.size-a.size);
  let h='';
  for(const f of sorted){
    const m=f.monarch;
    const ps=provinces.filter(p=>p.facId===f.id);
    const avgLoyal=ps.length?ps.reduce((s,p)=>s+p.loyalty,0)/ps.length:0;
    const avgAuton=ps.length?ps.reduce((s,p)=>s+p.autonomy,0)/ps.length:0;
    const rebels=ps.filter(p=>p.mem.stance==='반란'||p.mem.stance==='태업').length;
    // 중앙집권 vs 자치 막대: 왼=중앙 통제, 오=도시 자치
    const central=Math.round((1-avgAuton)*100);
    h+=`<div class="fac">
      <div class="ttl"><span class="sw" style="background:${f.color}"></span>${f.name}${f.golden?' ✦':''}</div>
      <div class="meta">${m.title} ${m.name} · 영토 ${f.size}칸 · 도시 ${ps.length}개</div>
      <div class="meta">최근 정책: <span class="tag">${policyKo(m.mem.lastDecree)}</span>${rebels?`<span class="tag" style="background:#ffe0c0;color:#a05000">불온 ${rebels}</span>`:''}</div>
      <div class="meta">중앙통제 ${central}% ↔ 도시자치 ${100-central}%
        <div class="bar"><i style="width:${central}%;background:${f.color}"></i></div></div>
      <div class="meta">평균 충성 ${Math.round(avgLoyal*100)}% · 군주 ${moodKo(m)}</div>
    </div>`;
  }
  if(!sorted.length) h='<div class="fac">생존 국가 없음.</div>';
  document.getElementById('pScroll').innerHTML=h;
}
function policyKo(p){ return ({centralize:'중앙집권',devolve:'분권',tax_up:'증세',tax_cut:'감세',conscript:'징병',purge:'숙청',reward:'포상',hold:'관망',즉위:'즉위'})[p]||p; }
function moodKo(m){
  if(m.anger>.4) return '<span class="em-anger">진노</span>';
  if(m.fear>.4) return '<span class="em-fear">불안</span>';
  if(m.content>.5) return '<span class="em-joy">만족</span>';
  return '평정';
}

/* ---------- 셀 인스펙터(=그 땅/도시의 깊은 상태) ---------- */
const inspectEl=document.getElementById('inspect');
function renderInspector(){
  if(selected<0) return;
  const c=cells[selected];
  const b=document.getElementById('insBody');
  let h=`<b>${ref(selected)}</b> `;
  if(c.st==='water'){ h+='— 바다<br><span class="hl">파도가 칠 뿐, 누구의 땅도 아니다.</span>'; }
  else if(c.st==='forest'){ h+='— 원시림<br><span class="hl">개척을 기다리는 숲.</span>'; }
  else if(c.st==='ruin'){ h+='— 폐허(墟)<br><span class="hl">한때 도시였던 잿더미. 서서히 자연으로 돌아간다.</span>'; }
  else if(c.owner===null){ h+='— 황무지<br><span class="hl">'+c.hist.slice(-3).join(' → ')+'</span>'; }
  else {
    const f=facById(c.owner), p=provById(c.prov);
    h+=`— ${f?f.name:'?'} 영토 (${LV_LABEL[c.level]||'땅'})`;
    if(c.capital) h+=' ★도청';
    if(p){
      const [ml,,mk]=dominantMood(p);
      h+=`<br><b>총독 ${p.name}</b> <span class="tag">${stanceKo(p.mem.stance)}</span>`;
      h+=`<div class="row"><span class="hl">충성</span><span class="gv">${Math.round(p.loyalty*100)}%</span></div>`;
      h+=`<div class="row"><span class="hl">야심 / 자존심</span><span class="gv">${Math.round(p.ambition*100)} / ${Math.round(p.pride*100)}</span></div>`;
      h+=`<div class="row"><span class="hl">자치 수준</span><span class="gv">${Math.round(p.autonomy*100)}%${p.independent?' (독립)':''}</span></div>`;
      h+=`<div class="row"><span class="hl">감정</span><span class="gv em-${mk==='fervor'?'joy':mk}">${ml}</span></div>`;
      h+=`<div class="row"><span class="hl">받은 모욕 / 은혜</span><span class="gv">${p.mem.slights} / ${p.mem.favors}</span></div>`;
    }
    h+=`<br><span class="hl">이력: ${c.hist.slice(-4).join(' → ')}</span>`;
    // 개입 버튼
    if(f && p && !p.independent){
      h+=`<div class="act">
        <button data-act="favor">자치권 하사</button>
        <button data-act="press">중앙 통제</button>
        <button data-act="incite">반란 선동</button>
      </div>`;
    }
  }
  b.innerHTML=h;
  fmla.textContent = c.owner!==null && provById(c.prov)
    ? `=GOVERNOR("${provById(c.prov).name}", 충성=${Math.round(provById(c.prov).loyalty*100)}%, 자치=${Math.round(provById(c.prov).autonomy*100)}%, 감정="${dominantMood(provById(c.prov))[0]}")`
    : `=HISTORY(${c.hist.slice(-4).map(x=>`"${x}"`).join(' → ')})`;
}
function stanceKo(s){ return ({순응:'순응',반란:'반란',태업:'태업',독립:'독립',수도:'왕도',수석:'수석'})[s]||s; }

/* ---------- 셀 클릭/개입 ---------- */
sheetEl.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t) return;

  selected=+t.dataset.i; selKind='cell';

});
document.getElementById('insClose').addEventListener('click', ()=>{
  inspectEl.classList.remove('show');
  if(selected>=0 && cellEls[selected]) cellEls[selected].classList.remove('sel');
  selected=-1; selKind=null;
});
inspectEl.addEventListener('click', e=>{
  const btn=e.target.closest('button'); if(!btn||selected<0) return;
  const c=cells[selected]; const p=provById(c.prov); const f=facById(c.owner);
  if(!p||!f) return;
  const act=btn.dataset.act;
  if(act==='favor'){ p.autonomy=clamp(p.autonomy+.2); p.joy=clamp(p.joy+.3); p.loyalty=clamp(p.loyalty+.1); p.mem.favors+=2;
    logEvent(`[개입] ${p.name}에 자치권을 하사했다.`, `=PLAYER.DEVOLVE("${p.name}")`, f.color,'joy'); }
  else if(act==='press'){ p.autonomy=clamp(p.autonomy-.2); p.anger=clamp(p.anger+.3); p.loyalty=clamp(p.loyalty-.1);
    logEvent(`[개입] ${p.name}에 중앙 통제를 강화했다.`, `=PLAYER.CENTRALIZE("${p.name}")`, f.color,'anger');
    if(governorWillRebel(p,f)) triggerRevolt(p,f,'외부 압력으로 통제 강화'); }
  else if(act==='incite'){ p.anger=clamp(p.anger+.5); p.loyalty=clamp(p.loyalty-.3); p.ambition=clamp(p.ambition+.2);
    logEvent(`[개입] ${p.name}에 반란을 선동했다.`, `=PLAYER.INCITE("${p.name}")`, '#ff6a00','anger');
    if(p.cells.length>=2) triggerRevolt(p,f,'선동에 호응'); }
  renderInspector();
});

/* ---------- 시트 탭(연대기/멸망기록/포고문) ---------- */
const ovEl=document.getElementById('overlay');
const ovHd=document.getElementById('ovHd'), ovBody=document.getElementById('ovBody');
document.getElementById('tabs').addEventListener('click', e=>{
  const t=e.target.closest('div[data-sheet]'); if(!t) return;
  curSheet=t.dataset.sheet;
  for(const d of document.querySelectorAll('#tabs div')) d.classList.toggle('on', d===t);

  else { ovEl.classList.add('show'); renderSheet(curSheet); }

function renderSheet(kind){
  if(kind==='chron'){
    ovHd.style.gridTemplateColumns='64px 78px 1fr 230px';
    ovHd.innerHTML='<div>서기</div><div>구분</div><div>연대기 기록</div><div>수식</div>';
    const rows=chronicle.slice(-220).reverse();
    ovBody.innerHTML = rows.map(r=>`<div class="orow" style="grid-template-columns:64px 78px 1fr 230px">
      <div class="yr">${r.year}</div><div>${r.scope}</div>
      <div class="${r.emo?'em-'+(r.emo==='fervor'?'joy':r.emo):''}">${esc(r.msg)}</div>
      <div class="mono">${esc(r.formula)}</div></div>`).join('') || empty('아직 기록된 역사가 없습니다.');
  } else if(kind==='dead'){
    ovHd.style.gridTemplateColumns='64px 1fr 1fr';
    ovHd.innerHTML='<div>멸망</div><div>사라진 국가</div><div>사인(死因)</div>';
    const rows=obituaries.slice().reverse();
    ovBody.innerHTML = rows.map(r=>`<div class="orow" style="grid-template-columns:64px 1fr 1fr">
      <div class="yr">${r.year}</div><div>† ${esc(r.name)}</div><div class="hl">${esc(r.reason)}</div></div>`).join('')
      || empty('아직 멸망한 국가가 없습니다. (세계 인구가 늘고 있습니다)');
  } else if(kind==='decree'){
    ovHd.style.gridTemplateColumns='64px 130px 1fr 1fr';
    ovHd.innerHTML='<div>서기</div><div>군주</div><div>포고</div><div>도시의 반응</div>';
    const rows=decrees.slice(-200).reverse();
    ovBody.innerHTML = rows.map(r=>`<div class="orow" style="grid-template-columns:64px 130px 1fr 1fr">
      <div class="yr">${r.year}</div>
      <div style="color:${r.color};font-weight:600">${esc(r.monarch)}</div>
      <div>${esc(r.policy)}</div><div class="hl">${esc(r.reaction)}</div></div>`).join('')
      || empty('아직 반포된 포고문이 없습니다.');
  }
}
function esc(s){ return String(s||'').replace(/[<>&]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[m])); }
function empty(t){ return `<div style="padding:14px;color:#999">${t}</div>`; }

/* ---------- 부팅 ---------- */
let timer=null;
function boot(){
  genNoiseSeed();
  buildSheet();
  genTerrain();
  factions=[]; provinces=[]; provSeq=0; nameIdx=0; year=1; tickN=0;
  obituaries.length=0; chronicle.length=0; decrees.length=0;
  fires.clear(); plague.clear(); dirty.clear();
  selected=-1; selKind=null; inspectEl.classList.remove('show');
  for(let i=0;i<N;i++) paint(i);
  fmla.textContent=`=SIM.CIVILIZATION($A$1:$${colName(COLS-1)}$${ROWS}, "자치와 통제, 역사는 그 줄다리기")`;
  // 초기 3국 — 각자 다른 군주 성격으로 출발
  spawnFaction(true); spawnFaction(true); spawnFaction(true);
  renderPanel(); renderStatus();
  if(timer) clearInterval(timer);
  timer=setInterval(tick, 95);
}

let rTO=null;
window.addEventListener('resize', ()=>{ clearTimeout(rTO); rTO=setTimeout(boot, 250); });
boot();

/* 디버그 훅(검증용) */
window.__sim={ get year(){return year;}, get factions(){return factions;}, get provinces(){return provinces;}, get chronicle(){return chronicle;}, tick };
})();
</script>
