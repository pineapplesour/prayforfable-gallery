<!DOCTYPE html>

<title>언어.xlsx - Excel</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:none}
  .dot{width:11px;height:11px;border-radius:50%;flex:none}
  #titlebar .ttl{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #titlebar .sp{flex:1}
  #titlebar .btn{font-size:10.5px;color:#555;background:#e6e6e6;border:1px solid #d2d2d2;border-radius:3px;

  #titlebar .btn:active{background:#d6d6d6}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:14px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;flex:none;
    overflow:hidden;white-space:nowrap}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;

  #namebox{width:88px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;flex:none;font-size:11px}
  #fx{width:28px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif;flex:none}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Sheet1 (map) */
  #sheetwrap{position:absolute;inset:0;overflow:auto;background:#fff}
  #sheet{display:grid;background:#fff;width:max-content}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:10px;position:sticky}
  .hd.col{top:0;z-index:3}
  .hd.row{left:0;z-index:3}
  .hd.corner{top:0;left:0;z-index:4}
  .cell{border-right:1px solid #e6e6e6;border-bottom:1px solid #e6e6e6;
    display:flex;align-items:center;justify-content:center;font-size:11px;
    overflow:hidden;cursor:cell;position:relative}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:2}
  .cap{position:absolute;top:0;right:1px;font-size:7px;line-height:7px;opacity:.85}
  .em{position:absolute;bottom:0;left:1px;font-size:7px;line-height:7px}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #ff2d2d}50%{box-shadow:inset 0 0 0 2px #ffb3b3}}
  .war{animation:warf .3s 4}
  @keyframes revf{0%,100%{box-shadow:inset 0 0 0 2px #b300ff}50%{box-shadow:inset 0 0 0 2px #e6b3ff}}
  .rev{animation:revf .3s 5}
  /* floating panel */
  #panel{position:absolute;top:8px;right:10px;background:#fffdf2;border:1px solid #d8c66a;
    box-shadow:2px 3px 10px rgba(0,0,0,.18);padding:8px 10px;font-size:10.5px;z-index:6;
    width:215px;line-height:1.55;max-height:calc(100% - 16px);overflow:auto}
  #panel h4{margin:7px 0 2px;font-size:10.5px;color:#7a6a1f;border-bottom:1px solid #e8dca0;padding-bottom:1px}
  #panel h4:first-child{margin-top:0}
  #panel .sw{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px;border-radius:2px}
  #panel .dead{color:#999;font-size:10px}
  #panel .row2{display:flex;justify-content:space-between;gap:4px}
  #panel .mini{color:#8a7a3a;font-size:9.5px}
  /* other sheets */
  .sheetview{position:absolute;inset:0;overflow:auto;background:#fff;display:none;padding:0}
  table.grid2{border-collapse:collapse;width:100%;font-size:11px}
  table.grid2 th{background:#f3f3f3;border:1px solid #e0e0e0;padding:4px 8px;color:#555;
    position:sticky;top:0;text-align:left;font-weight:600;z-index:1}
  table.grid2 td{border:1px solid #ededed;padding:3px 8px;white-space:nowrap}
  table.grid2 td.idx{background:#f7f7f7;color:#999;text-align:center;width:42px}
  table.grid2 tr:hover td{background:#f4fbf6}
  .yr{color:#107c41;font-variant-numeric:tabular-nums}
  #treeview{font-family:Consolas,Menlo,monospace;font-size:12px;line-height:1.7;padding:14px 18px;white-space:pre;color:#333}
  /* status + tabs */
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:8px;
    border-top:1px solid #d4d4d4;font-size:11px;flex:none;overflow-x:auto}
  #tabs div{padding:3px 11px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap;flex:none}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 10px;font-size:11px;flex:none;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 8px;opacity:.5}
  #statusbar .ev{overflow:hidden;text-overflow:ellipsis;flex:1}
  @media (max-width:520px){
    #panel{width:160px;font-size:9.5px}
    #menubar{gap:9px;font-size:11px}
    #namebox{width:64px}
  }
</style>

<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <div class="ttl">언어.xlsx - Excel</div>
    <div class="sp"></div>
    <div class="btn" id="btn-pause">일시정지</div>
    <div class="btn" id="btn-speed">속도 ×1</div>
  </div>
  <div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
  <div id="fbar">
    <div id="namebox">A1</div>
    <div id="fx">fx</div>
    <div id="formula"></div>
  </div>
  <div id="stage">
    <div id="sheetwrap"><div id="sheet"></div></div>
    <div class="sheetview" id="view-chron"><table class="grid2" id="tbl-chron"></table></div>
    <div class="sheetview" id="view-dead"><table class="grid2" id="tbl-dead"></table></div>
    <div class="sheetview" id="view-tree"><div id="treeview"></div></div>
    <div id="panel"></div>
  </div>
  <div id="tabs">
    <div class="on" data-v="map">Sheet1</div>
    <div data-v="chron">연대기</div>
    <div data-v="tree">어족 계통도</div>
    <div data-v="dead" id="tab-dead">멸망기록 (0)</div>
  </div>
  <div id="statusbar"></div>
</div>

<script>
(() => {
"use strict";
/* =========================================================================
   언어.xlsx — 창발적 문명/언어 분화 시뮬레이션 (엑셀 위장)
   각 정착지(deme)는 자율 에이전트: 어휘 유전자 + 성격 + 동적 감정 + 기억.
   지도자가 명령을 내리면 하위 에이전트가 자신의 감정/성격/언어거리로
   해석하여 복종/곡해/항명/배신한다. 결과는 대본 없이 매번 다르게 창발한다.
   ========================================================================= */

/* ---------- 격자 크기 (반응형) ---------- */
const CW = 30, CH = 24;
const stage = document.getElementById('stage');
function gridDims(){
  const w = stage.clientWidth || innerWidth;
  const h = stage.clientHeight || (innerHeight - 165);
  const cols = Math.max(16, Math.min(46, Math.floor((w - 46) / CW)));
  const rows = Math.max(12, Math.min(34, Math.floor((h - 4) / CH)));
  return {cols, rows};
}
let {cols:COLS, rows:ROWS} = gridDims();
let N = COLS * ROWS;

const sheet = document.getElementById('sheet');
const fmla = document.getElementById('formula');
const namebox = document.getElementById('namebox');
const statusbar = document.getElementById('statusbar');
const panel = document.getElementById('panel');

function colName(n){ let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0; } return s; }
function ref(i){ return colName(i%COLS) + (Math.floor(i/COLS)+1); }
const R = (a=1)=>Math.random()*a;
const RI = a=>Math.random()*a|0;
const pick = arr => arr[RI(arr.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- 언어 유전자 ----------
   한 언어는 핵심 어휘(고정 의미 슬롯)의 음운열 집합.
   분화 = 음운 변이(drift) + 차용(borrow). 상호 이해도 = 어휘 거리. */
const ONSET = ['k','t','p','s','m','n','r','l','h','d','g','b','z','v','x','q','j','f','w','y'];
const VOWEL = ['a','e','i','o','u','ae','ou','ei','a','i','o'];
const CODA  = ['n','k','t','r','s','','','','m','ng','l'];
const MEANINGS = ['물','불','해','달','산','강','피','집','왕','적','신','말','죽음','아이','별'];
function newWord(){
  let s = pick(ONSET) + pick(VOWEL);
  if (R()<.55) s += pick(CODA);
  if (R()<.35) s += pick(ONSET) + pick(VOWEL) + pick(CODA);
  return s;
}
function newLexicon(){ const lx={}; for(const m of MEANINGS) lx[m]=newWord(); return lx; }
function cloneLex(lx){ const o={}; for(const k in lx) o[k]=lx[k]; return o; }
// 음운 변이: 한 단어의 자모를 조금 바꾼다
function mutateWord(w){
  if(!w) return newWord();
  const a=w.split('');
  const op=RI(3);
  if(op===0 && a.length>1){ a.splice(RI(a.length),1); }                 // 탈락
  else if(op===1){ a.splice(RI(a.length+1),0,pick(VOWEL)); }            // 삽입
  else { a[RI(a.length)] = pick(R()<.5?ONSET:VOWEL); }                  // 치환
  return a.join('').slice(0,8) || newWord();
}
// 두 어휘의 거리 0(동일)~1(완전 다름)
function lexDist(a,b){
  let tot=0, dsum=0;
  for(const m of MEANINGS){ tot++; dsum += strDist(a[m]||'', b[m]||''); }
  return tot? dsum/tot : 1;
}
function strDist(a,b){ // 정규화 레벤슈타인
  if(a===b) return 0;
  const m=a.length,n=b.length; if(!m||!n) return 1;
  const dp=Array(n+1); for(let j=0;j<=n;j++) dp[j]=j;
  for(let i=1;i<=m;i++){ let prev=dp[0]; dp[0]=i;
    for(let j=1;j<=n;j++){ const t=dp[j];
      dp[j]=Math.min(dp[j]+1, dp[j-1]+1, prev+(a[i-1]===b[j-1]?0:1)); prev=t; } }
  return dp[n]/Math.max(m,n);
}

/* ---------- 색: 언어 계통을 HSL 색상환으로 ---------- */
function hsl(h,s,l){ return `hsl(${((h%360)+360)%360} ${s}% ${l}%)`; }

/* ---------- 지형 ---------- */
let cells, langs, leaders;
const GWf=10, GHf=7;
let gz=[];
function noise(x,y,w,h){
  const fx=x/COLS*(w-1), fy=y/ROWS*(h-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const g=(a,b)=>gz[Math.min(h-1,b)*w+Math.min(w-1,a)];
  return g(x0,y0)*(1-tx)*(1-ty)+g(x0+1,y0)*tx*(1-ty)+g(x0,y0+1)*(1-tx)*ty+g(x0+1,y0+1)*tx*ty;
}
function nbrs(i){
  const x=i%COLS,y=i/COLS|0,o=[];
  if(x>0)o.push(i-1); if(x<COLS-1)o.push(i+1);
  if(y>0)o.push(i-COLS); if(y<ROWS-1)o.push(i+COLS);
  return o;
}

/* ---------- 전역 상태 ---------- */
let cellEls=[];
let year=1, tickN=0, pop=0;
let lastEvent='태초에 말씀이 있었다.';
const chronicle=[];   // {year, msg, formula}
const obituaries=[];  // {name, year, cause, words}
const dirty=new Set();
let selected=-1;
let langSeq=0;
let cityLogCD=0, warLogCD=0;   // 로그 도배 방지 쿨다운

function logEvent(msg, formula, kind){
  lastEvent = `서기 ${year}년 · ${msg}`;
  if(formula) fmla.textContent = formula;
  chronicle.push({year, msg, formula:formula||'', kind:kind||''});
  if(chronicle.length>600) chronicle.shift();
}

/* ---------- 언어(=문화/정체성) ---------- */
// 한 lang은 하나의 "민족/문화권". 폴리티(국가)와 보통 1:1로 시작하나
// 반란/표류로 분화하면 새 lang이 태어나 부모를 갖는다(계통도).
function makeLang(parent, lex, baseHue){
  const id = langSeq++;
  const hue = baseHue!=null ? baseHue : RI(360);
  const lg = {
    id, parent: parent?parent.id:null, born: year,
    lex, hue,
    name: langName(lex),
    color: hsl(hue, 58, 48),
    children: [], alive:true
  };
  langs.push(lg);
  if(parent) parent.children.push(id);
  return lg;
}
const langById = id => langs.find(l=>l.id===id);
// 언어 이름: 자기 어휘에서 '집/왕/말' 단어 어근으로 자동 작명
function langName(lex){
  const root = (lex['말']||lex['집']||'?').replace(/[^a-z]/g,'');
  const r = root.charAt(0).toUpperCase()+root.slice(1);
  const suf = pick(['어','말','족어','부족어','문어']);
  return (r||'??') + suf;
}

/* ---------- 지도자 에이전트 ---------- */
// 폴리티(국가). 지도자는 성격을 갖고 매 시대 '국가 명령(doctrine)'을 정한다.
const POL_NAMES=['왕국','제국','연맹','칸국','공화국','교단','상단','부족','왕조','도시국가','동맹','한국','술탄국','대공국'];
const DOCTRINES=['확장','발전','순화','요새화','축제','정복'];
function makePolity(lang, capital){
  const lead = {
    아망: R(),        // ambition
    호전: R(),        // belligerence
    개방: R(),        // openness (차용/동화 선호)
    신망: .5+R(.3),   // legitimacy (낮으면 항명·반란 증가)
  };
  const p = {
    id: 'P'+(langSeq), polName: pick(POL_NAMES),
    langId: lang.id, leader: lead, capital,
    doctrine: '확장', doctrineAge: 0, golden:0,
    secedeCD: 0,            // 분리독립 쿨다운(연속 붕괴 방지)
    cells: [], size:0, mood:0, name:''
  };
  p.name = lang.name.replace(/(어|말|족어|부족어|문어)$/,'') + ' ' + p.polName;
  polities.push(p);
  return p;
}
let polities=[];
const polById = id => polities.find(p=>p.id===id);

/* ---------- 셀(데메) = 자율 에이전트 ----------
   각 정착 셀은: 어휘(자기 방언), 소속 폴리티, 발전도, 성격, 감정, 기억. */
function freshCell(st){
  return {
    st, polId:null, langId:null, level:0,
    lex:null,                 // 이 데메의 방언(언어에서 갈라져 표류)
    // 성격(데메 단위 — 지도자 명령 해석에 쓰임)
    per:{충성:.4+R(.4), 자긍:R(), 강성:R()},
    // 감정(동적 창발): 기쁨 분노 슬픔 즐거움
    emo:{joy:0,anger:0,sad:0,fun:0},
    mem:[],                   // 기억: 최근 사건 태그
    hist:['황무지'],
    ruinT:0
  };
}
function pushHist(c,t){ c.hist.push(t); if(c.hist.length>8) c.hist.shift(); }
function remember(c,tag){ c.mem.push({tag,year}); if(c.mem.length>6) c.mem.shift(); }

/* 감정 누적 + 자연 감쇠 */
function feel(c,k,v){ c.emo[k]=clamp(c.emo[k]+v,0,1); }
function decay(c){ for(const k in c.emo) c.emo[k]*=0.94; }
function dominantEmo(c){
  let best='',bv=0; for(const k in c.emo) if(c.emo[k]>bv){bv=c.emo[k];best=k;}
  return bv>0.18?best:'';
}
const EMO_GLYPH={joy:'☻',anger:'✖',sad:'☂',fun:'♪'};
const EMO_KO={joy:'기쁨',anger:'분노',sad:'슬픔',fun:'즐거움'};

/* ---------- 초기화 ---------- */
function buildGrid(){
  sheet.style.gridTemplateColumns = `40px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows = CH+'px';
  sheet.textContent='';
  cellEls = new Array(N);
  const frag=document.createDocumentFragment();
  const corner=document.createElement('div'); corner.className='hd corner'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){ const h=document.createElement('div'); h.className='hd col'; h.textContent=colName(c); frag.appendChild(h); }
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div'); h.className='hd row'; h.textContent=r+1; frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div'); d.className='cell'; d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d; frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

function initWorld(){
  langs=[]; polities=[]; langSeq=0; year=1; tickN=0; pop=0;
  chronicle.length=0; obituaries.length=0; dirty.clear(); selected=-1;
  lastEvent='태초에 말씀이 있었다.';
  // 지형 노이즈
  gz=[]; for(let i=0;i<GWf*GHf;i++) gz[i]=R();
  cells=new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS,y=i/COLS|0;
    const v=noise(x,y,GWf,GHf)+(R()-.5)*.14;
    let st='land', lab='황무지';
    if(v<.30){ st='water'; lab='바다'; }
    else if(v>.66 && R()<.6){ st='mtn'; lab='산'; }
    else if(v>.58 && R()<.5){ st='forest'; lab='숲'; }
    const c=freshCell(st); c.hist=[lab]; cells[i]=c;
  }
  // 시조 언어/폴리티 4개
  const baseHues=[10,120,210,300];
  for(let k=0;k<4;k++){
    seedCivilization(baseHues[k]+RI(30)-15);
  }
}

function seedCivilization(hue){
  // 빈 land 찾기
  let i=-1;
  for(let t=0;t<400;t++){ const j=RI(N); if(cells[j].st==='land' && cells[j].polId===null){ i=j; break; } }
  if(i<0) return null;
  const lex=newLexicon();
  const lg=makeLang(null, lex, hue);
  const p=makePolity(lg, i);
  occupy(i, p.id, lg.id, 1, '개척');
  cells[i].lex = cloneLex(lex);
  logEvent(`${p.name}이(가) ${langName(lex)}를 말하며 ${ref(i)}에 정착했다.`,
    `=GENESIS("${p.name}", lang="${lg.name}", ${ref(i)})`, 'genesis');
  return p;
}

function occupy(i, polId, langId, level, lab){
  const c=cells[i];
  c.st='land'; c.polId=polId; c.langId=langId; c.level=level;
  if(lab) pushHist(c,lab);
  dirty.add(i);
}

/* ---------- 그리기 ---------- */
const LV_TXT=['','·','田','邑','城'];
const LV_LABEL=['','개척지','농경지','읍','성도'];
function paint(i){
  const c=cells[i], el=cellEls[i];
  let bg='#fff', tx='', col='#333', w='', cap='', em='', emcol='';
  if(c.st==='water'){ bg='#dcebf8'; tx='≈'; col='#9dc3e6'; }
  else if(c.st==='mtn'){ bg='#efe9e2'; tx='▲'; col='#a89a86'; }
  else if(c.st==='forest'){ bg='#e3efda'; tx='木'; col='#6a8f44'; }
  else if(c.st==='ruin'){ bg='#ededed'; tx='墟'; col='#aaa'; }
  else if(c.polId!==null){
    const lg=langById(c.langId), p=polById(c.polId);
    if(lg){
      const lit = .14 + c.level*.16 + ((p&&p.golden)?.12:0);
      bg = hsl(lg.hue, 55, clamp(86 - lit*72, 26, 88));
      col = hsl(lg.hue, 70, 26);
      tx = LV_TXT[c.level]||'·';
      w = c.level>=3?'700':'';
      if(p && p.capital===i){ cap='★'; }
      const de=dominantEmo(c);
      if(de){ em=EMO_GLYPH[de]; emcol = de==='anger'?'#c0392b':de==='sad'?'#2e5fa3':de==='joy'?'#d68910':'#7d3c98'; }
    }
  } else { bg='#fff'; tx=''; }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  el.textContent=tx;
  // overlay caption(capital) + emotion
  if(cap||em){
    let html='';
    if(cap) html += `<span class="cap" style="color:#b8860b">${cap}</span>`;
    if(em)  html += `<span class="em" style="color:${emcol}">${em}</span>`;
    el.innerHTML = el.textContent ? `${tx}${html}` : html;
  }
}

/* ---------- 지도자: 시대마다 국가 명령(doctrine) 결정 ----------
   대본이 아니라 상태에서 창발: 위협받으면 요새화/정복, 풍요+개방이면 축제/순화. */
function leaderDecide(p){
  const L=p.leader;
  // 주변 위협 평가: 이웃 폴리티 중 언어거리 큰(=이해 안 되는) 적의 인접 칸 수
  let threat=0, friends=0, ownEmo={joy:0,anger:0,sad:0,fun:0}, cnt=0;
  for(const i of p.cells){
    const c=cells[i]; cnt++;
    for(const k in ownEmo) ownEmo[k]+=c.emo[k];
    for(const n of nbrs(i)){
      const nc=cells[n];
      if(nc.polId!==null && nc.polId!==p.id){
        const myl=langById(p.langId), ol=langById(nc.langId);
        const d = myl&&ol? lexDist(myl.lex, ol.lex):1;
        if(d>0.5) threat++; else friends++;
      }
    }
  }
  if(cnt){ for(const k in ownEmo) ownEmo[k]/=cnt; }
  p.mood = ownEmo.joy + ownEmo.fun - ownEmo.anger - ownEmo.sad;
  // 점수화
  const score={
    확장: L.아망*1.2 + (p.size<6?.6:0) + (threat<2?.4:0),
    발전: (1-L.호전)*0.9 + ownEmo.joy*0.6 + (p.golden?0.8:0),
    순화: L.개방*1.1 + friends*0.08 + ownEmo.fun*0.5,
    요새화: threat*0.18 + L.호전*0.4 + ownEmo.sad*0.7,
    축제: ownEmo.sad*0.9 + (p.mood<0?0.7:0) + L.신망*0.3,
    정복: L.호전*1.3 + L.아망*0.6 + ownEmo.anger*0.9 + (threat>=3?0.5:0)
  };
  let best='확장',bv=-1;
  for(const k in score){ const v=score[k]+R(.35); if(v>bv){bv=v;best=k;} }
  if(best!==p.doctrine){
    p.doctrine=best; p.doctrineAge=0;
    if(R()<.5){
      logEvent(`${p.name}의 지도자가 '${best}' 기조를 선포했다.`,
        `=DECREE("${p.name}", policy="${best}", legitimacy=${L.신망.toFixed(2)})`, 'decree');
    }
  } else p.doctrineAge++;
  // 신망 변동: 무드 좋으면 오르고 나쁘면 떨어짐
  L.신망 = clamp(L.신망 + p.mood*0.012 - 0.002, 0.05, 1);
}

/* ---------- 데메가 명령을 해석: 복종/곡해/항명/배신 ----------
   명령 수행 의지 = 충성*신망 - 분노 - 언어표류 + 무드. 낮으면 반란. */
function demeActOnOrder(i, p){
  const c=cells[i]; const L=p.leader;
  const lg=langById(p.langId);
  const drift = lg&&c.lex? lexDist(lg.lex, c.lex):0;  // 수도 표준어와의 거리
  const will = c.per.충성*L.신망 - c.emo.anger*0.9 - drift*0.8 + (p.mood*0.2) - c.emo.sad*0.4 + 0.15;

  // 항명/배신: 의지가 낮고(불충) 표준어와 멀어졌으며(표류) 불만이 쌓이면 → 분리독립.
  // 큰 나라일수록·분열 쿨다운이 끝났을 때만. 1칸 분열을 막아 어족이 의미를 갖게.
  if(p.secedeCD<=0 && will < -0.05 && (drift>0.35 || c.emo.anger>0.4) && p.size>=10 && R()<0.5){
    secede(i,p,drift); return;
  }
  // 곡해: 의지가 어중간하면 명령을 자기 감정대로 바꿔 수행
  let order=p.doctrine;
  if(will<0.15){
    if(c.emo.anger>0.4) order='정복';
    else if(c.emo.sad>0.4) order='요새화';
    else if(c.emo.fun>0.4) order='축제';
    // 그냥 게으름(아무것도 안 함)
    else if(R()<0.5) return;
  }
  carryOut(i, p, order, will);
}

function carryOut(i, p, order, will){
  const c=cells[i], L=p.leader;
  const my=langById(p.langId);
  const adj=nbrs(i);

  if(order==='발전' || order==='축제'){
    if(order==='축제'){ feel(c,'joy',0.25); feel(c,'fun',0.3); feel(c,'sad',-0.0); c.emo.sad*=0.6; remember(c,'축제'); }
    if(c.level<4 && R() < (0.05 + (p.golden?0.06:0) + c.emo.joy*0.05)){
      c.level++; pushHist(c,LV_LABEL[c.level]); dirty.add(i);
      feel(c,'joy',0.18);
      if(c.level===4 && cityLogCD<=0){ cityLogCD=30;
        logEvent(`${p.name}이(가) ${ref(i)}에 성도(城都)를 세웠다.`,
        `=CITY("${p.name}", ${ref(i)}, lang="${my.name}")`, 'city'); }
    }
    return;
  }
  if(order==='요새화'){
    // 발전 약간 + 주변 방어, 감정 안정
    if(c.level<3 && R()<0.04){ c.level++; pushHist(c,'성벽'); dirty.add(i); }
    c.emo.anger*=0.85;
    return;
  }
  // 확장/순화/정복 → 인접 칸으로
  if(R() > (0.35 + will*0.4)) return;  // 의지 낮으면 행동 빈도↓
  const t = pick(adj);
  if(t===undefined) return;
  const tc=cells[t];
  if(tc.st==='water'||tc.st==='ruin') return;

  if(tc.polId===null){
    // 빈 땅 개척 (산/숲은 어렵다)
    let p2=1;
    if(tc.st==='mtn') p2=0.18; else if(tc.st==='forest') p2=0.4;
    if(R()<p2){
      tc.st='land';
      occupy(t,p.id,p.langId,1,'개척');
      tc.lex = driftLex(c.lex||my.lex, 0.12);  // 변경지 방언은 살짝 표류
      feel(c,'joy',0.08);
    }
    return;
  }
  if(tc.polId===p.id) return; // 같은 나라
  // 다른 폴리티 칸 — 언어거리로 태도 결정
  const ol=langById(tc.langId);
  const d = my&&ol? lexDist(my.lex, ol.lex):1;

  if(order==='순화' && d<0.6){
    // 같은/가까운 어족 → 평화적 동화(차용·통혼). 가까울수록 흡수 확률↑ → 어족 재통합.
    if(R()<0.6){
      borrowWords(tc.lex||ol.lex, c.lex||my.lex, 2); // 이웃이 내 단어를 차용
      feel(tc,'fun',0.12); feel(c,'fun',0.1);
      const absorbP = (0.6-d)*0.5;   // 거리 0.1이면 ~25%, 0.5면 ~5%
      if(R()<absorbP && tc.polId!==p.id && cells[t].emo.anger<0.4){
        assimilateCell(t,p);
      }
    }
    return;
  }
  // 정복/확장(이질 언어) → 전쟁
  const def = tc.level + 1 + R(2.5) + (cells[t].per.강성*1.5) + (polById(tc.polId)?.golden?1:0);
  const att = 1 + R(2.5) + c.level*0.7 + L.호전*1.5 + (p.golden?1:0) + c.emo.anger*1.5;
  flash(t,'war');
  feel(c,'anger',0.05);
  if(att>def){
    const defP=polById(tc.polId);
    if(R()<0.28){
      // 초토화
      const dc=cells[t]; dc.polId=null; dc.langId=null; dc.level=0; dc.st='ruin'; dc.ruinT=160;
      pushHist(dc,'전화(戰火)'); dirty.add(t);
    } else {
      // 점령 — 피정복민은 분노/슬픔, 정복민은 기쁨
      const dc=cells[t];
      feelCell(dc,'anger',0.5); feelCell(dc,'sad',0.4);
      remember(dc,'정복당함');
      dc.per.충성 *= 0.7;
      occupy(t,p.id,p.langId,Math.max(1,dc.level-1),'점령');
      // 피정복지는 옛 언어 흔적 + 정복자 언어 = 크레올
      dc.lex = creole(ol?ol.lex:my.lex, my.lex);
      feel(c,'joy',0.2);
    }
    if(defP && warLogCD<=0){ warLogCD=12;
      logEvent(`${p.name}이(가) ${defP.name}의 ${ref(t)}을(를) 쳤다. (언어거리 ${(d*100|0)}%)`,
        `=WAR("${p.name}"→"${defP.name}", ${ref(t)}, intel=${(d*100|0)}%)`, 'war');
    }
  }
}

function feelCell(c,k,v){ c.emo[k]=clamp(c.emo[k]+v,0,1); }

/* ---------- 언어 연산 ---------- */
function driftLex(base, rate){
  const lx=cloneLex(base||newLexicon());
  for(const m of MEANINGS) if(R()<rate) lx[m]=mutateWord(lx[m]);
  return lx;
}
function borrowWords(fromLex, toLex, n){ // toLex가 fromLex 단어 n개 차용
  for(let k=0;k<n;k++){ const m=pick(MEANINGS); if(fromLex[m]) toLex[m]=fromLex[m]; }
}
function creole(a,b){ // 두 언어 혼합
  const lx={}; for(const m of MEANINGS) lx[m]= R()<0.5? (a[m]||b[m]) : (b[m]||a[m]);
  return lx;
}
function assimilateCell(i,p){
  const c=cells[i];
  feelCell(c,'sad',0.2);
  occupy(i,p.id,p.langId,c.level,'동화');
  c.lex = creole(c.lex||langById(c.langId)?.lex||{}, langById(p.langId).lex);
}

/* ---------- 분리독립(배신) → 새 언어 탄생 ---------- */
function secede(i,p,drift){
  const c=cells[i];
  // 인접 같은 폴리티 칸을 2단계까지 흡수(BFS) — 불만 큰 칸 우선. 의미 있는 영토 분리.
  const rebel=new Set([i]);
  let frontier=[i];
  for(let depth=0; depth<2 && rebel.size<14; depth++){
    const next=[];
    for(const f of frontier){
      for(const n of nbrs(f)){
        if(rebel.has(n)) continue;
        const nc=cells[n];
        if(nc.polId===p.id && (nc.emo.anger>0.25 || nc.per.충성<0.45 || R()<0.4)){
          rebel.add(n); next.push(n);
        }
      }
    }
    frontier=next;
  }
  // 너무 작으면 반란 실패(불씨만 남기고 분노 약간 해소)
  if(rebel.size<4){ c.emo.anger*=0.6; return; }
  const rebelArr=[...rebel];
  // 새 언어: 표준어에서 크게 표류 + 이름 새로 작명
  const parent=langById(p.langId);
  const newLex=driftLex(c.lex||parent.lex, 0.55);
  const nl=makeLang(parent, newLex, parent.hue + 40 + RI(60));
  const np=makePolity(nl, i);
  np.leader.신망 = 0.75; np.leader.호전 = clamp(p.leader.호전+0.2,0,1);
  np.secedeCD = 120;          // 갓 태어난 나라는 한동안 안정
  p.secedeCD = 90;            // 모국도 잠시 추가 분열 억제
  for(const ri of rebelArr){
    const rc=cells[ri];
    rc.polId=np.id; rc.langId=nl.id; rc.lex=driftLex(newLex,0.1);
    rc.emo.anger*=0.3; feelCell(rc,'joy',0.4); rc.per.충성=0.65+R(.3);
    pushHist(rc,'독립'); remember(rc,'독립'); dirty.add(ri);
  }
  np.capital=i;
  flash(i,'rev');
  logEvent(`${ref(i)}에서 ${p.name}으로부터 ${np.name}이(가) 독립! 새 언어 ${nl.name} 탄생.`,
    `=SECEDE(from="${p.name}", new="${np.name}", lang="${nl.name}", δlex=${(lexDist(parent.lex,nl.lex)*100|0)}%)`, 'secede');
}

/* ---------- 자연 표류 ----------
   변경(수도에서 먼 곳)일수록 통제가 약해 방언이 빨리 갈라지고 불만이 쌓인다.
   (역사적 분화 동력: 제국 변두리에서 새 언어가 태어난다 — 라틴어→로망스어.) */
function gridDist(a,b){ const ax=a%COLS,ay=a/COLS|0,bx=b%COLS,by=b/COLS|0; return Math.abs(ax-bx)+Math.abs(ay-by); }
function languageDrift(){
  for(const p of polities){
    if(!p.cells.length) continue;
    const maxd = COLS+ROWS;
    const k=Math.max(2, p.cells.length*0.10|0);   // 더 많은 데메가 표류
    for(let t=0;t<k;t++){
      const i=pick(p.cells); const c=cells[i];
      if(!c.lex) c.lex=cloneLex(langById(c.langId).lex);
      // 수도에서 먼 큰 나라 변경일수록 빨리 표류 + 통제 이탈로 불만↑
      const periph = p.capital!=null ? clamp(gridDist(i,p.capital)/maxd,0,1) : 0;
      const rate = 0.06 + periph*0.14 + (p.size>14?0.04:0);
      c.lex = driftLex(c.lex, rate);
      if(periph>0.4 && p.size>12){ feel(c,'anger',0.02*periph); }  // 변두리 소외감
    }
    // 표준어(수도 방언)도 천천히 변함 → 언어 자체가 진화
    if(R()<0.25){ const lg=langById(p.langId); lg.lex=driftLex(lg.lex,0.03); lg.name=langName(lg.lex); }
  }
}

/* ---------- 플래시 애니메이션 ---------- */
function flash(i,cls){ const el=cellEls[i]; if(!el)return; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls),1300); }

/* ---------- 메인 틱 ---------- */
function tick(){
  tickN++; year++;
  if(cityLogCD>0) cityLogCD--;
  if(warLogCD>0) warLogCD--;

  // 1) 재집계 + 폐허 회복 + 감정 감쇠
  for(const p of polities){ p.cells.length=0; p.size=0; }
  pop=0;
  const PW=[0,30,120,420,1200];
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin' && --c.ruinT<=0){ c.st='land'; c.hist.push('재생'); dirty.add(i); }
    if(c.polId!==null){
      const p=polById(c.polId);
      if(p){ p.cells.push(i); p.size++; pop+=PW[c.level]||0; }
      else { c.polId=null; c.langId=null; c.level=0; dirty.add(i); }
    }
    if(c.polId!==null) decay(c);
  }

  // 2) 멸망 판정 (언어도 사어가 됨)
  for(let k=polities.length-1;k>=0;k--){
    const p=polities[k];
    if(p.size===0){
      const lg=langById(p.langId);
      const sample = lg? Object.values(lg.lex).slice(0,4).join(', ') : '';
      obituaries.push({name:p.name, year, lang: lg?lg.name:'?', cause: pick(['전쟁','내분','역병','동화','기근']), words:sample});
      if(lg){ lg.alive=false; }
      logEvent(`${p.name} 멸망. ${lg?lg.name:'언어'}가 사어(死語)가 되었다. (어휘: ${sample})`,
        `=EXTINCT("${p.name}", lang="${lg?lg.name:''}", year=${year})`, 'extinct');
      polities.splice(k,1);
    }
  }

  // 3) 지도자 의사결정 (시대 기조)
  for(const p of polities){
    if(p.golden>0) p.golden--;
    if(p.secedeCD>0) p.secedeCD--;
    if(p.size===0) continue;
    if(tickN % 6 === 0 || p.doctrineAge>40) leaderDecide(p);
  }

  // 4) 데메 행동 (명령 해석 — 복종/곡해/항명/배신)
  for(const p of polities){
    if(p.size===0) continue;
    const acts = Math.max(1, p.size*0.6|0);
    for(let a=0;a<acts;a++){
      const i = pick(p.cells);
      if(i===undefined || cells[i].polId!==p.id) continue;
      demeActOnOrder(i,p);
    }
  }

  // 5) 언어 표류 + 접촉 차용(국경에서 크레올)
  languageDrift();
  if(tickN%3===0) borderContact();

  // 6) 무작위 역사 사건
  worldEvents();

  // 7) 신규 문명 도래(개체수 적을 때)
  if(polities.length<3 && R()<0.02){
    const p=seedCivilization(RI(360));
    if(p) logEvent(`바다 건너에서 ${p.name}이(가) 새 언어를 들여왔다.`,
      `=MIGRATE("${p.name}")`, 'migrate');
  }

  // 8) 렌더
  for(const i of dirty) paint(i);
  dirty.clear();
  renderStatus();
  if(tickN%8===0){ renderPanel(); if(curView==='chron') renderChron(); if(curView==='tree') renderTree(); if(curView==='dead') renderDead(); }
  if(curView==='chron' && tickN%4===0) renderChron();
}

/* 국경 접촉: 인접한 다른 언어끼리 단어 차용(평화적 수렴) */
function borderContact(){
  let tries = Math.min(40, N*0.05|0);
  for(let t=0;t<tries;t++){
    const i=RI(N), c=cells[i];
    if(c.polId===null) continue;
    for(const n of nbrs(i)){
      const nc=cells[n];
      if(nc.polId!==null && nc.langId!==c.langId){
        const a=langById(c.langId), b=langById(nc.langId);
        if(a&&b){
          const d=lexDist(a.lex,b.lex);
          if(d<0.6 && R()<0.3){ // 가까운 언어끼리만 차용
            if(!c.lex) c.lex=cloneLex(a.lex);
            borrowWords(b.lex, c.lex, 1);
          }
        }
        break;
      }
    }
  }
}

function worldEvents(){
  const r=R();
  if(r<0.004){
    // 역병
    const big=cells.map((c,i)=>({c,i})).filter(o=>o.c.polId!==null && o.c.level>=3);
    if(big.length){
      const o=pick(big);
      const p=polById(o.c.polId);
      // 역병: 인접 칸 인구 감소 + 슬픔↑
      for(const i of [o.i, ...nbrs(o.i)]){
        const c=cells[i];
        if(c.polId!==null){ c.level=Math.max(0,c.level-1); feelCell(c,'sad',0.5); remember(c,'역병');
          if(c.level<=0){ c.polId=null; c.langId=null; pushHist(c,'역병소멸'); } dirty.add(i); }
      }
      logEvent(`${ref(o.i)}에 역병이 창궐. ${p?p.name:''} 주민들이 슬픔에 잠겼다.`,
        `=PLAGUE(${ref(o.i)}, grief↑)`, 'plague');
    }
  } else if(r>0.986 && polities.length){
    // 황금기 — 큰 나라일수록 잘 일어남
    const big=polities.filter(x=>x.size>=4);
    const p=big.length? pick(big) : pick(polities);
    p.golden=70;
    for(const i of p.cells){ feelCell(cells[i],'joy',0.4); feelCell(cells[i],'fun',0.3); dirty.add(i); }
    logEvent(`${p.name}의 황금기. ${langById(p.langId)?.name} 문학이 꽃피었다.`,
      `=GOLDEN_AGE("${p.name}", joy↑, +70y)`, 'golden');
  } else if(r>0.989 && r<=0.994 && polities.length>=2){
    // 동맹: 언어 가까운 두 폴리티
    const a=pick(polities);
    let best=null,bd=1;
    for(const b of polities){ if(b.id===a.id) continue;
      const d=lexDist(langById(a.langId).lex, langById(b.langId).lex);
      if(d<bd){bd=d;best=b;} }
    if(best && bd<0.5){
      for(const i of a.cells) feelCell(cells[i],'fun',0.2);
      for(const i of best.cells) feelCell(cells[i],'fun',0.2);
      logEvent(`${a.name}와(과) ${best.name}이(가) 동맹을 맺었다. (상호이해 ${(100-bd*100)|0}%)`,
        `=ALLY("${a.name}","${best.name}", intelligibility=${(100-bd*100)|0}%)`, 'ally');
    }
  }
}

/* ---------- 상태바 / 패널 ---------- */
function renderStatus(){
  const langAlive=langs.filter(l=>l.alive).length;
  statusbar.innerHTML =
    `준비<span class="sep">|</span>서기 <b style="font-weight:400">${year}</b>년`+
    `<span class="sep">|</span>인구 ${pop.toLocaleString()}`+
    `<span class="sep">|</span>국가 ${polities.length}`+
    `<span class="sep">|</span>언어 ${langAlive}`+
    `<span class="sep">|</span><span class="ev">${escapeH(lastEvent)}</span>`;
}
function escapeH(s){ return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

function emoBar(c){
  const e=c.emo;
  function b(k,col){ return `<span style="display:inline-block;width:${Math.round(e[k]*34)}px;height:6px;background:${col};vertical-align:1px"></span>`; }
  return `<div class="mini">${EMO_KO.joy}${b('joy','#d68910')} ${EMO_KO.anger}${b('anger','#c0392b')}</div>`+
         `<div class="mini">${EMO_KO.sad}${b('sad','#2e5fa3')} ${EMO_KO.fun}${b('fun','#7d3c98')}</div>`;
}

function renderPanel(){
  let h='<h4>세력 현황 (언어=색)</h4>';
  const sorted=[...polities].sort((a,b)=>b.size-a.size).slice(0,7);
  for(const p of sorted){
    const lg=langById(p.langId);
    const mood = p.mood>0.15?'☻':p.mood<-0.15?'☂':'·';
    h+=`<div class="row2"><span><span class="sw" style="background:${lg?lg.color:'#999'}"></span>${escapeH(p.name)}${p.golden?' ✦':''}</span><span>${p.size}칸 ${mood}</span></div>`;
    h+=`<div class="mini">└ ${lg?escapeH(lg.name):''} · 기조:${p.doctrine} · 신망${(p.leader.신망*100|0)}</div>`;
  }
  // 선택 셀 상세
  if(selected>=0 && cells[selected] && cells[selected].polId!==null){
    const c=cells[selected]; const p=polById(c.polId); const lg=langById(c.langId);
    h+=`<h4>${ref(selected)} 데메 정보</h4>`;
    h+=`<div class="mini">소속: ${p?escapeH(p.name):'-'}</div>`;
    h+=`<div class="mini">언어: ${lg?escapeH(lg.name):'-'} (${LV_LABEL[c.level]||'?'})</div>`;
    const de=dominantEmo(c);
    h+=`<div class="mini">지배감정: ${de?EMO_KO[de]:'평온'} / 충성 ${(c.per.충성*100|0)}</div>`;
    h+=emoBar(c);
  }
  if(obituaries.length){
    h+='<h4>최근 멸망</h4>';
    for(const o of obituaries.slice(-3).reverse()) h+=`<div class="dead">† ${escapeH(o.name)} (${o.year}, ${o.cause})</div>`;
  }
  panel.innerHTML=h;
  document.getElementById('tab-dead').textContent=`멸망기록 (${obituaries.length})`;
}

/* ---------- 시트뷰: 연대기 / 계통도 / 멸망기록 ---------- */
const KIND_COLOR={genesis:'#107c41',war:'#c0392b',secede:'#8e44ad',extinct:'#7f8c8d',golden:'#d68910',
  city:'#2980b9',ally:'#16a085',plague:'#7d3c98',decree:'#555',migrate:'#117a8b'};
function renderChron(){
  const t=document.getElementById('tbl-chron');
  let h='<tr><th style="width:46px">행</th><th style="width:64px">연도</th><th style="width:130px">함수</th><th>사건</th></tr>';
  const rows=chronicle.slice(-200).reverse();
  rows.forEach((e,k)=>{
    const col=KIND_COLOR[e.kind]||'#333';
    h+=`<tr><td class="idx">${rows.length-k}</td><td class="yr">서기 ${e.year}</td>`+
       `<td style="font-family:Consolas,monospace;color:${col};font-size:10px">${escapeH(e.formula.slice(0,40))}</td>`+
       `<td>${escapeH(e.msg)}</td></tr>`;
  });
  t.innerHTML=h;
}
function renderDead(){
  const t=document.getElementById('tbl-dead');
  let h='<tr><th style="width:46px">No</th><th>멸망한 문명</th><th>사어(死語)</th><th style="width:70px">멸망연도</th><th style="width:60px">원인</th><th>유실 어휘</th></tr>';
  obituaries.slice().reverse().forEach((o,k)=>{
    h+=`<tr><td class="idx">${obituaries.length-k}</td><td>${escapeH(o.name)}</td>`+
       `<td style="color:#7f8c8d">${escapeH(o.lang)}</td><td class="yr">서기 ${o.year}</td>`+
       `<td>${escapeH(o.cause)}</td><td style="color:#999;font-family:Consolas,monospace;font-size:10px">${escapeH(o.words)}</td></tr>`;
  });
  if(!obituaries.length) h+='<tr><td class="idx">-</td><td colspan="5" style="color:#999">아직 멸망한 문명이 없습니다.</td></tr>';
  t.innerHTML=h;
}
function renderTree(){
  // 어족 계통도: 부모 없는 언어를 뿌리로 트리 출력
  const tv=document.getElementById('treeview');
  let out='어족 계통도  (=PHYLOGENY)  —  들여쓰기 = 분화\n';
  out+='────────────────────────────────────────────\n';
  const roots=langs.filter(l=>l.parent===null);
  function emit(lg, depth){
    const pad='  '.repeat(depth) + (depth?'└─ ':'');
    const status = lg.alive? '' : '  †사어';
    const sw = lg.alive?'●':'○';
    // 인구(현재 사용 칸 수)
    let users=0; for(const c of cells) if(c.langId===lg.id) users++;
    const sample = lg.lex['말']+'·'+lg.lex['집']+'·'+lg.lex['왕'];
    out += `${pad}${sw} ${lg.name}  [서기${lg.born}~]  화자 ${users}칸  «${sample}»${status}\n`;
    for(const cid of lg.children){ const ch=langById(cid); if(ch) emit(ch, depth+1); }
  }
  for(const r of roots) emit(r,0);
  if(!langs.length) out+='\n(아직 언어가 없습니다)';
  out+='\n\n● 살아있는 언어   ○ 사어   분화는 반란·정복·표류로 창발합니다.';
  tv.textContent=out;
}

/* ---------- 셀 클릭: 그 땅의 언어/역사 ---------- */
sheet.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  if(selected>=0 && cellEls[selected]) cellEls[selected].classList.remove('sel');
  selected=+t.dataset.i; t.classList.add('sel');
  namebox.textContent=ref(selected);
  const c=cells[selected];
  if(c.polId!==null){
    const lg=langById(c.langId);
    const lx = c.lex||lg.lex;
    const words = ['물','불','왕','적'].map(m=>`${m}="${lx[m]}"`).join(' ');
    fmla.textContent=`=DEME(${ref(selected)}, lang="${lg?lg.name:''}", ${words})`;
  } else {
    fmla.textContent=`=TERRAIN(${ref(selected)}, "${c.hist[c.hist.length-1]}")`;
  }
  renderPanel();
});
// 더블클릭(우클릭 대용): 개입 — 그 칸 주민을 선동(분노 주입)
sheet.addEventListener('dblclick', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  const i=+t.dataset.i, c=cells[i];
  if(c.polId!==null){
    feelCell(c,'anger',0.6); remember(c,'선동됨'); flash(i,'rev');
    logEvent(`당신이 ${ref(i)} 주민을 선동했다. 분노가 끓어오른다.`,
      `=INTERVENE(${ref(i)}, inject="anger")`, 'secede');
    paint(i);
  }
});

/* ---------- 시트 탭 전환 ---------- */
let curView='map';
const views={map:document.getElementById('sheetwrap'), chron:document.getElementById('view-chron'),
  tree:document.getElementById('view-tree'), dead:document.getElementById('view-dead')};
document.getElementById('tabs').addEventListener('click', e=>{
  const d=e.target.closest('[data-v]'); if(!d) return;
  curView=d.dataset.v;
  document.querySelectorAll('#tabs div').forEach(x=>x.classList.toggle('on', x===d));
  for(const k in views) views[k].style.display = (k===curView)?'block':'none';
  if(curView==='chron') renderChron();
  if(curView==='tree') renderTree();
  if(curView==='dead') renderDead();
});
views.map.style.display='block';

/* ---------- 일시정지 / 속도 ---------- */
let timer=null, baseMs=120, speedMul=1, paused=false;
function startTimer(){ if(timer) clearInterval(timer); timer=setInterval(tick, baseMs/speedMul); }
document.getElementById('btn-pause').addEventListener('click', function(){
  paused=!paused;
  if(paused){ clearInterval(timer); timer=null; this.textContent='재생'; }
  else { startTimer(); this.textContent='일시정지'; }
});
const speeds=[1,2,4,0.5];
let si=0;
document.getElementById('btn-speed').addEventListener('click', function(){
  si=(si+1)%speeds.length; speedMul=speeds[si]; this.textContent='속도 ×'+speedMul;
  if(!paused) startTimer();
});

/* ---------- 리사이즈 재구성 ---------- */
let rzT=null;
addEventListener('resize', ()=>{
  clearTimeout(rzT);
  rzT=setTimeout(()=>{
    const d=gridDims();
    if(d.cols===COLS && d.rows===ROWS) return;
    COLS=d.cols; ROWS=d.rows; N=COLS*ROWS;
    buildGrid(); initWorld();
    for(let i=0;i<N;i++) paint(i);
    fmla.textContent=`=SIM.LANGUAGE($A$1:$${colName(COLS-1)}$${ROWS}, "언어는 갈라진다")`;
    renderStatus(); renderPanel();
  },250);
});

/* ---------- 부팅 ---------- */
buildGrid();
initWorld();
for(let i=0;i<N;i++) paint(i);
fmla.textContent=`=SIM.LANGUAGE($A$1:$${colName(COLS-1)}$${ROWS}, "언어는 갈라진다")`;
renderStatus(); renderPanel();
startTimer();
})();
</script>
