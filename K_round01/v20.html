<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>군체정신.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  *{box-sizing:border-box}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:18px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;
    overflow:hidden;white-space:nowrap}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px}
  #namebox{min-width:64px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;padding:0 4px;font-size:11px}
  #fx{width:28px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #wrap{position:relative;display:flex;height:100%;flex-direction:column}
  #body{flex:1;display:flex;min-height:0;overflow:hidden}
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1;min-width:0}
  #sheet{display:grid;background:#fff}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:10px}
  .cell{border-right:1px solid #e8e8e8;border-bottom:1px solid #e8e8e8;
    display:flex;align-items:center;justify-content:center;font-size:11px;position:relative;
    overflow:hidden;cursor:cell;line-height:1}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:3}
  .cell .em{position:absolute;top:0;right:1px;font-size:7px;line-height:7px;opacity:.85}
  .cell .ld{position:absolute;bottom:-1px;left:1px;font-size:7px;line-height:7px}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 99px rgba(255,60,60,.0)}50%{box-shadow:inset 0 0 0 99px rgba(255,60,60,.55)}}
  .war{animation:warf .3s 3}
  @keyframes revf{0%,100%{box-shadow:inset 0 0 0 99px rgba(160,40,200,.0)}50%{box-shadow:inset 0 0 0 99px rgba(160,40,200,.5)}}
  .rev{animation:revf .35s 4}
  /* side panel = the "agents" sheet */
  #side{width:262px;flex:none;border-left:1px solid #d4d4d4;background:#fcfcfc;
    display:flex;flex-direction:column;font-size:11px;overflow:hidden}
  #side h4{margin:0;padding:5px 9px;background:#107c41;color:#eaf6ee;font-size:11px;font-weight:600;
    display:flex;justify-content:space-between}
  #side .scroll{overflow-y:auto;flex:1}
  .fac{border-bottom:1px solid #ececec;padding:6px 9px 7px}
  .fac .top{display:flex;align-items:center;gap:5px;font-weight:600}
  .fac .sw{width:10px;height:10px;border-radius:2px;flex:none}
  .fac .doc{font-size:10px;color:#666;margin:2px 0 3px;font-style:italic}
  .fac .bars{display:flex;flex-direction:column;gap:2px;margin-top:3px}
  .bar{display:flex;align-items:center;gap:4px;font-size:9.5px;color:#555}
  .bar .lab{width:22px;flex:none}
  .bar .track{flex:1;height:6px;background:#eee;border-radius:3px;overflow:hidden}
  .bar .fill{height:100%}
  .fac .stat{font-size:10px;color:#444;margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 8px}
  .fac .mood{font-size:10px;margin-top:2px}
  #legend{position:absolute;top:8px;right:8px;background:#fffce6;border:1px solid #d8c66a;
    box-shadow:2px 3px 8px rgba(0,0,0,.18);padding:7px 11px;font-size:10.5px;z-index:6;
    max-width:210px;line-height:1.65}
  #legend h4{margin:0 0 3px;font-size:10.5px;color:#7a6a1f}
  #legend .row{display:flex;align-items:center;gap:5px}
  #legend .sw{display:inline-block;width:9px;height:9px}
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 10px;font-size:11px;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 8px;opacity:.5}
  #statusbar b{font-weight:700;color:#fff}
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:18px;
    border-top:1px solid #d4d4d4;font-size:11px;overflow:hidden}
  #tabs div{padding:3px 12px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  /* sheet views */
  .sheetview{display:none;position:absolute;inset:0;background:#fff;overflow:auto;padding:0}
  .sheetview.on{display:block}
  table.grid{border-collapse:collapse;font-size:11px;width:100%}
  table.grid th{background:#f5f5f5;border:1px solid #d0d0d0;color:#555;font-weight:600;
    padding:3px 7px;text-align:left;position:sticky;top:0;z-index:1;font-size:10.5px}
  table.grid td{border:1px solid #e8e8e8;padding:3px 7px;white-space:nowrap}
  table.grid td.rh{background:#f5f5f5;color:#777;text-align:center;width:34px}
  table.grid tr:nth-child(even) td:not(.rh){background:#fafafa}
  #toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);
    background:rgba(20,20,20,.9);color:#fff;padding:7px 14px;border-radius:4px;font-size:11.5px;
    z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center}
  #toast.show{opacity:1}
  #hover{position:absolute;z-index:20;background:#fff;border:1px solid #b9b9b9;
    box-shadow:2px 3px 10px rgba(0,0,0,.22);padding:6px 9px;font-size:10.5px;line-height:1.55;
    pointer-events:none;display:none;max-width:230px;border-radius:3px}
  #hover b{color:#107c41}
  .hint{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.92);border:1px solid #d8c66a;
    padding:4px 8px;font-size:10px;color:#7a6a1f;z-index:6;border-radius:3px}
  @media (max-width:760px){
    #side{display:none}
    #legend{font-size:9.5px;max-width:150px;padding:5px 7px}
    #menubar{gap:11px}
  }
</style>
</head>
<body>
<div id="wrap">
<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <span id="ttl">군체정신.xlsx - Excel</span>
</div>
<div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
<div id="fbar">
  <div id="namebox">A1</div>
  <div id="fx">fx</div>
  <div id="formula"></div>
</div>
<div id="body">
  <!-- Sheet1 : the living map -->
  <div id="sheetwrap">
    <div class="sheetview on" id="view-map">
      <div id="sheet"></div>
    </div>
    <div class="sheetview" id="view-chron"></div>
    <div class="sheetview" id="view-dead"></div>
    <div class="sheetview" id="view-mind"></div>
    <div id="legend"></div>
    <div class="hint" id="hint">셀 클릭 = 그 땅의 역사 · 영토 클릭 = 봉기 선동(개입)</div>
  </div>
  <!-- agent roster -->
  <div id="side">
    <h4><span>세력 의회 · 자율 에이전트</span><span id="agcount"></span></h4>
    <div class="scroll" id="roster"></div>
  </div>
</div>
<div id="tabs">
  <div class="on" data-v="map">Sheet1</div>
  <div data-v="chron">연대기</div>
  <div data-v="mind" id="tab-mind">집단심리</div>
  <div data-v="dead" id="tab-dead">멸망기록 (0)</div>
</div>
<div id="statusbar"></div>
<div id="toast"></div>
<div id="hover"></div>
</div>

<script>
(() => {
"use strict";
// ============================================================
//  군체정신.xlsx  —  개체→집단지성 창발 시뮬레이션
//  엑셀로 위장. 각 칸 = 자율 에이전트(성격·감정·기억).
//  지도자→총독→정착민 다층 위계. 명령 해석·복종·항명·배신.
//  희노애락이 사건에서 동적으로 창발해 행동을 바꾼다.
//  대본 없음 — 매 실행마다 다른 역사가 상호작용에서 발생.
// ============================================================
const rnd = Math.random;
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const pick = a=>a[rnd()*a.length|0];

const CW=30, CH=20;
const COLS = clamp(Math.floor((Math.min(innerWidth,window.innerWidth) - (innerWidth>760?262:0) - 50)/CW), 16, 46);
const ROWS = clamp(Math.floor((innerHeight - 190)/CH), 14, 30);
const N = COLS*ROWS;

const sheet=document.getElementById('sheet');
const fmla=document.getElementById('formula');
const namebox=document.getElementById('namebox');
const statusbar=document.getElementById('statusbar');
const legend=document.getElementById('legend');
const roster=document.getElementById('roster');
const toastEl=document.getElementById('toast');
const hoverEl=document.getElementById('hover');
sheet.style.gridTemplateColumns=`40px repeat(${COLS}, ${CW}px)`;
sheet.style.gridAutoRows=CH+'px';

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(Math.floor(i/COLS)+1);}

// ---------- DOM grid ----------
const cellEls=new Array(N);
{
  const frag=document.createDocumentFragment();
  const corner=document.createElement('div');corner.className='hd';frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd';h.textContent=colName(c);frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd';h.textContent=r+1;frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d;frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

// ---------- terrain ----------
const GW=8,GH=6,gz=[];
for(let i=0;i<GW*GH;i++)gz[i]=rnd();
function noise(x,y){
  const fx=x/COLS*(GW-1),fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=gz[y0*GW+x0],b=gz[y0*GW+Math.min(GW-1,x0+1)];
  const c=gz[Math.min(GH-1,y0+1)*GW+x0],d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}
function nbrs(i){const x=i%COLS,y=i/COLS|0,o=[];if(x>0)o.push(i-1);if(x<COLS-1)o.push(i+1);if(y>0)o.push(i-COLS);if(y<ROWS-1)o.push(i+COLS);return o;}

// ---------- AGENT (each cell = an autonomous individual) ----------
// terrain: water / forest / land / ruin / fertile
// agent fields when owned:
//   per : {amb, loy, agg, pie}  personality (0..1) — fixed at birth
//   emo : {joy, ang, sor, fear} emotion (0..1) — emerges from events, decays
//   mem : recent grievances/events (strings, max 6)
//   rank: 1 settler, 2 farmer, 3 governor(city), 4 capital/leader-seat
//   grudge: Map(facId -> intensity)  remembered who hurt them
const cells=new Array(N);
for(let i=0;i<N;i++){
  const x=i%COLS,y=i/COLS|0;
  const v=noise(x,y)+(rnd()-.5)*.14;
  let st='land',hist=['황무지'];
  if(v<.30){st='water';hist=['바다'];}
  else if(v>.66&&rnd()<.7){st='forest';hist=['숲'];}
  else if(v>.50&&v<=.60&&rnd()<.45){st='fertile';hist=['옥토'];}
  cells[i]={st,owner:null,rank:0,hist,ruinT:0,
            per:null,emo:null,mem:null,grudge:null,role:null};
}

function newEmo(){return {joy:.3,ang:.05,sor:.05,fear:.1};}
function newPer(seed){
  // personality drawn around faction culture seed, but each individual varies
  const j=()=>clamp((seed?seed:.5)+(rnd()-.5)*.7,0,1);
  return {amb:rnd(),loy:clamp(.5+(rnd()-.5)*.9,0,1),agg:rnd(),pie:rnd()};
}

// ---------- FACTIONS (collective = emergent aggregate of its agents) ----------
const NAMES=['북부 왕국','붉은 제국','해안 연맹','유목 칸국','삼나무 공화국','잿빛 교단','동방 상단','검은 강 부족','여명 왕조','소금 사막 민족','은빛 산악국','자수정 도시국'];
const COLORS=['#2563eb','#dc2626','#059669','#7c3aed','#d97706','#0d9488','#be185d','#4d7c0f','#9333ea','#b45309','#0891b2','#a21caf'];
const LEADER_NAMES=['카이런','베르단','오르샤','테무진','리안','모르가','셴','아둘','하나','자미르','코른','엘리아','보단','수린','가렐','미라','토르','네샤'];
// doctrines a leader can hold — emerge/shift from the collective mood
const DOCTRINES={
  expand:{n:'팽창',fx:'EXPAND',desc:'국경을 넓혀라'},
  fortify:{n:'수성',fx:'FORTIFY',desc:'성벽을 쌓고 지켜라'},
  conquer:{n:'정복',fx:'CONQUER',desc:'적을 짓밟아라'},
  faith:{n:'신정',fx:'CONVERT',desc:'신앙으로 교화하라'},
  trade:{n:'교역',fx:'TRADE',desc:'길을 열고 번영하라'},
};
let nameIdx=0;
let factions=[];
const obituaries=[];   // {name, year, cause}
const chronicle=[];    // {year, msg, fx}
let year=1, lastEvent='태초의 정적.', pop=0;
const plague=new Map(), fires=new Map(), dirty=new Set();
let selected=-1, paused=false;

function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}

function freshFaction(cultureSeed){
  if(nameIdx>=NAMES.length)nameIdx=0;
  const f={
    id:factions.length?Math.max(...factions.map(x=>x.id))+1:0,
    name:NAMES[nameIdx], color:COLORS[nameIdx%COLORS.length],
    leader:pick(LEADER_NAMES),
    doctrine:'expand',
    culture:cultureSeed!=null?cultureSeed:rnd(),  // bias for personalities
    golden:0, size:0, arr:[],
    // collective mind = running aggregate of member emotions (THE emergent quantity)
    mood:{joy:.3,ang:.05,sor:.05,fear:.1},
    unrest:0,          // builds from anger+sorrow -> revolts
    legitimacy:.8,     // leader's hold; drops when orders defied
    wars:new Set(),    // factions currently at war with
    pacts:new Set(),   // alliances
    born:year, lastOrder:'팽창',
  };
  nameIdx++;
  return f;
}
function facById(id){for(const f of factions)if(f.id===id)return f;return null;}

function settle(i,f,rank,label,role){
  const c=cells[i];
  c.owner=f.id; c.rank=rank; c.st='land';
  if(!c.per)c.per=newPer(f.culture);
  if(!c.emo)c.emo=newEmo();
  if(!c.mem)c.mem=[];
  if(!c.grudge)c.grudge=new Map();
  c.role=role||c.role||'정착민';
  if(label){c.hist.push(label);if(c.hist.length>7)c.hist.shift();}
  dirty.add(i);
}

function spawnFaction(announce,cultureSeed){
  const f=freshFaction(cultureSeed);
  for(let t=0;t<400;t++){
    const i=rnd()*N|0;
    if((cells[i].st==='land'||cells[i].st==='fertile')&&cells[i].owner===null){
      f.born=year;
      settle(i,f,2,'태조의 도읍','지도자');
      cells[i].per=newPer(f.culture);
      // leader personality: strong amb, moderate-high loyalty-to-self
      cells[i].per.amb=clamp(.55+rnd()*.4,0,1);
      factions.push(f);
      if(announce)logEvent(`${f.name}, 지도자 ${f.leader}이(가) 역사에 등장.`,`=FOUND("${f.name}","${f.leader}",${ref(i)})`);
      return f;
    }
  }
  return null;
}

// ---------- painting ----------
const RANK_TXT=['','·','田','城','王'];      // settler farm city capital
const RANK_LABEL=['','정착지','농장','성읍','왕도'];
const EMO_GLYPH={joy:'☺',ang:'✦',sor:'•',fear:'!'};
function dominantEmo(e){
  let k='joy',v=-1;for(const n in e)if(e[n]>v){v=e[n];k=n;}
  return v>.45?k:null;
}
function paint(i){
  const c=cells[i],el=cellEls[i];
  let bg='',tx='',col='#222',w='',em='',ld='';
  if(plague.has(i)){bg='#ead5f5';tx='疫';col='#7030a0';w='700';}
  else if(fires.has(i)){bg='#ffd9b3';tx='火';col='#c00000';w='700';}
  else if(c.st==='water'){bg='#ddebf7';tx='≈';col='#9dc3e6';}
  else if(c.st==='forest'){bg='#e2efda';tx='木';col='#548235';}
  else if(c.st==='fertile'&&c.owner===null){bg='#fff2cc';tx='⌇';col='#bf9000';}
  else if(c.st==='ruin'){bg='#ececec';tx='墟';col='#999';}
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      bg=hexA(f.color,.12+c.rank*.16);
      tx=RANK_TXT[c.rank]; col=f.color; w=c.rank>=3?'700':'';
      // emotion micro-glyph in corner — the individual's inner state, visible
      const d=dominantEmo(c.emo);
      if(d){em=`<span class="em" style="color:${d==='joy'?'#0a8a3a':d==='ang'?'#c00000':d==='sor'?'#3a5fa0':'#b06a00'}">${EMO_GLYPH[d]}</span>`;}
      if(c.role==='반란수괴'){ld='<span class="ld" style="color:#9333ea">⚑</span>';}
    }
  }
  el.style.background=bg;el.style.color=col;el.style.fontWeight=w;
  el.innerHTML=tx+em+ld;
}

// ---------- logging ----------
function logEvent(msg,formula){
  lastEvent=`서기 ${year}년: ${msg}`;
  if(formula)fmla.textContent=formula;
  chronicle.push({year,msg,fx:formula||''});
  if(chronicle.length>400)chronicle.shift();
}
let toastT=null;
function toast(msg){
  toastEl.textContent=msg;toastEl.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),2600);
}
function flash(i,cls){const el=cellEls[i];el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),1100);}

// ---------- emotion dynamics ----------
// events bump emotion; emotion decays toward a personality-set baseline each tick
function feel(c,key,amt){ if(!c.emo)return; c.emo[key]=clamp(c.emo[key]+amt,0,1); }
function remember(c,txt){ if(!c.mem)c.mem=[]; c.mem.push(txt); if(c.mem.length>6)c.mem.shift(); }
function decayEmo(c){
  // slow decay toward a personality baseline — emotions PERSIST so grievances accumulate
  const e=c.emo,p=c.per;if(!e)return;
  e.joy +=((p.pie*.12+.20)-e.joy)*.018;
  e.ang +=((p.agg*.18+.04)-e.ang)*.020;   // hot-tempered agents stay angrier
  e.sor += (.05-e.sor)*.020;
  e.fear+= (.07-e.fear)*.025;
}

// ============================================================
//  TICK — no script. Each agent decides; factions are the sum.
// ============================================================
let tickN=0, warLogCD=0;
const PW=[0,30,120,420,1100];

function aggregateMood(f){
  // collective mind = mean of member emotions (weighted by rank).
  // THIS is the emergent collective intelligence signal.
  let j=0,a=0,s=0,fe=0,wsum=0;
  for(const i of f.arr){
    const c=cells[i];if(!c.emo)continue;
    const w=c.rank;
    j+=c.emo.joy*w;a+=c.emo.ang*w;s+=c.emo.sor*w;fe+=c.emo.fear*w;wsum+=w;
  }
  if(wsum){f.mood.joy=j/wsum;f.mood.ang=a/wsum;f.mood.sor=s/wsum;f.mood.fear=fe/wsum;}
  // big empires strain to hold together — sheer size breeds neglect at the edges
  const overstretch=clamp((f.size-10)*.012,0,.35);
  // unrest grows from collective anger+sorrow vs joy, amplified by low legitimacy & overstretch
  const pressure=(f.mood.ang*.9+f.mood.sor*.6-f.mood.joy*.5)+overstretch;
  f.unrest=clamp(f.unrest*.965+clamp(pressure,0,1)*.06,0,1);
  // sustained unrest itself corrodes the leader's hold (not just open revolt)
  f.legitimacy=clamp(f.legitimacy - f.unrest*.012 + f.mood.joy*.004, .08, 1);
}

function chooseDoctrine(f){
  // leader reads the collective mood and the strategic board, then *decides*.
  // not random: emergent from emotions + neighbors + size.
  const m=f.mood;
  const enemies=factions.filter(o=>o!==f && o.size>0);
  const strongest=enemies.length?Math.max(...enemies.map(o=>o.size)):0;
  const cap=cellEls; // unused guard
  let scores={
    expand: .5 + m.joy*.6 - m.fear*.5 + (f.size<8?.4:0),
    fortify:.2 + m.fear*1.1 + f.unrest*.3 - m.joy*.2,
    conquer:.1 + m.ang*1.2 + f.golden*.004 + (f.size>strongest?.3:-.2),
    faith:  .15 + f.culture*.4 + f.unrest*.5,   // when restless, lean on faith to pacify
    trade:  .25 + m.joy*.3 + (enemies.length>2?.3:0) - m.ang*.4,
  };
  // leader personality (capital agent) colors the choice
  const lead=f.arr.find(i=>cells[i].role==='지도자');
  if(lead!=null&&cells[lead].per){const lp=cells[lead].per;scores.conquer+=lp.agg*.5;scores.expand+=lp.amb*.3;scores.faith+=lp.pie*.4;}
  let best='expand',bv=-9;for(const k in scores)if(scores[k]>bv){bv=scores[k];best=k;}
  if(best!==f.doctrine){
    f.doctrine=best;
    if(warLogCD===0){
      logEvent(`${f.leader}, 군심을 읽고 국시를 「${DOCTRINES[best].n}」(으)로 전환.`,
        `=DOCTRINE("${f.name}","${DOCTRINES[best].n}", 군심=${(m.joy*100|0)}喜/${(m.ang*100|0)}怒)`);
      warLogCD=22;
    }
  }
  f.lastOrder=DOCTRINES[best].n;
}

// an agent INTERPRETS the leader's order through its own mind -> obey / slack / defy / betray
function obeyOrder(i,f){
  const c=cells[i];const p=c.per,e=c.emo;if(!p)return 'idle';
  // willingness = loyalty * legitimacy - anger - ambition*(if order conflicts)
  let will=p.loy*1.0*f.legitimacy + e.joy*.3 - e.ang*1.1 - e.fear*.3 - f.unrest*.5;
  // ambitious governors in big factions chafe under the chain of command
  if(c.rank>=3) will -= p.amb*.6;
  // grudge against own leader (e.g., taxed, ignored) erodes will
  if(c.mem&&c.mem.some(m=>m.includes('홀대')||m.includes('수탈')))will-=.45;
  if(will>.5)return 'obey';
  if(will>.18)return 'slack';
  // defiance: governor with a city + ambition + anger may SECEDE (the multi-layer betrayal)
  if(c.rank>=3 && p.amb>.45 && e.ang>.42 && rnd()<.6)return 'secede';
  if(e.ang>.5 && rnd()<.5)return 'revolt';
  return 'slack';
}

function secede(i,f){
  // a governor breaks away, taking nearby loyal-to-him cells -> new faction (collective fracture)
  const c=cells[i];
  const nf=freshFaction(f.culture);
  nf.leader=c.role==='지도자'?pick(LEADER_NAMES):(LEADER_NAMES.includes(c.role)?c.role:pick(LEADER_NAMES));
  nf.born=year; nf.doctrine='fortify'; nf.legitimacy=.6;
  factions.push(nf);
  // seed the rebel mood with the seceder's emotion (carries the grievance)
  nf.mood={joy:c.emo.joy,ang:c.emo.ang*.7,sor:c.emo.sor,fear:c.emo.fear};
  let took=0;
  const claim=[i,...nbrs(i),...nbrs(i).flatMap(nbrs)];
  for(const j of new Set(claim)){
    const cc=cells[j];
    if(cc.owner===f.id){
      // nearby agents join the rebel iff their own loyalty to old leader is weak OR they share the anger
      if(j===i || cc.per && (cc.per.loy*f.legitimacy<.45 || cc.emo.ang>.45) && rnd()<.7){
        cc.owner=nf.id; took++;
        feel(cc,'joy',.25);feel(cc,'fear',.2);feel(cc,'ang',-.3);
        remember(cc,`${nf.leader}를 따라 독립`);
        cc.role=(j===i)?'지도자':cc.role;
        dirty.add(j);
      }
    }
  }
  cells[i].role='지도자';cells[i].rank=Math.max(2,cells[i].rank);
  f.legitimacy=clamp(f.legitimacy-.25,.1,1);
  f.wars.add(nf.id);nf.wars.add(f.id);
  flash(i,'rev');
  logEvent(`총독 ${nf.leader}, ${took}개 영지를 이끌고 ${f.name}에서 분리독립! 「${nf.name}」 건국.`,
    `=SECEDE("${nf.leader}"→"${nf.name}", 이반=${took}, 정통성=${(f.legitimacy*100|0)}%)`);
  toast(`⚑ 배신: ${nf.leader} 총독이 ${f.name}을(를) 배반하고 ${nf.name}을(를) 세웠다`);
  warLogCD=10;
}

function tick(){
  if(paused)return;
  tickN++;year++;
  if(warLogCD>0)warLogCD--;

  // recount + emotion decay
  for(const f of factions){f.arr.length=0;f.size=0;}
  pop=0;
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin'&&--c.ruinT<=0){c.st='land';dirty.add(i);}
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){f.arr.push(i);f.size++;pop+=PW[c.rank];decayEmo(c);}
      else{c.owner=null;c.rank=0;c.role=null;dirty.add(i);}
    }
  }

  // collapse
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      obituaries.push({name:f.name,leader:f.leader,year,
        cause:f.unrest>.5?'내부 봉기와 분열':f.wars.size?'정복 전쟁':'쇠망',born:f.born});
      logEvent(`${f.name} 멸망. (지도자 ${f.leader})`,`=COLLAPSE("${f.name}", 서기${year}, 존속${year-f.born}년)`);
      for(const o of factions){o.wars.delete(f.id);o.pacts.delete(f.id);}
      factions.splice(k,1);
    }
  }

  // fires spread/burn
  for(const [i,t] of [...fires]){
    if(rnd()<.12)for(const n of nbrs(i)){const c=cells[n];if(c.owner!==null&&!fires.has(n)&&c.st==='land'){fires.set(n,5);feel(c,'fear',.4);feel(c,'sor',.2);dirty.add(n);}}
    if(t<=1){fires.delete(i);const c=cells[i];c.owner=null;c.rank=0;c.role=null;c.st='ruin';c.ruinT=180;c.hist.push('잿더미');if(c.hist.length>7)c.hist.shift();dirty.add(i);}
    else fires.set(i,t-1);
  }
  // plague
  if(plague.size){
    for(const [i,t] of [...plague]){
      if(rnd()<.16)for(const n of nbrs(i)){if(cells[n].owner!==null&&!plague.has(n)){plague.set(n,11);feel(cells[n],'fear',.5);feel(cells[n],'sor',.4);dirty.add(n);}}
      if(rnd()<.22){const c=cells[i];c.rank--;feel(c,'sor',.4);if(c.rank<=0){c.owner=null;c.rank=0;c.role=null;c.hist.push('역병으로 소멸');if(c.hist.length>7)c.hist.shift();}dirty.add(i);}
      if(t<=1){plague.delete(i);dirty.add(i);}else plague.set(i,t-1);
    }
    if(plague.size===0)logEvent('역병이 물러갔습니다.','=PLAGUE.END()');
  }

  // ---- per faction: leader decides doctrine from collective mood, agents act ----
  for(const f of factions){
    if(f.golden>0)f.golden--;
    if(f.size===0)continue;
    aggregateMood(f);
    if(tickN%5===0||rnd()<.05)chooseDoctrine(f);

    // distant edge-provinces feel neglected by the capital -> grievance seeds (drives later mutiny)
    if(f.size>7&&rnd()<.5){
      const i=f.arr[rnd()*f.arr.length|0];const c=cells[i];
      if(c&&c.owner===f.id&&c.role!=='지도자'){
        // ambitious governors taxed to fund the center grow resentful
        const neglect=c.per.amb*.6 + (c.rank>=3?.3:0) - f.mood.joy*.4 - f.legitimacy*.3;
        if(neglect>.2){feel(c,'ang',.10+neglect*.12);feel(c,'sor',.05);
          if(c.rank>=3&&!c.mem.some(m=>m.includes('홀대')))remember(c,'중앙의 홀대');}
      }
    }

    const doc=f.doctrine;
    const attempts=1+(f.size*.07|0);

    // each acting agent interprets the order through its own mind
    for(let a=0;a<attempts;a++){
      const src=f.arr[rnd()*f.arr.length|0];
      if(src===undefined||cells[src].owner!==f.id)continue;
      const c=cells[src];
      const stance=obeyOrder(src,f);

      if(stance==='secede'){secede(src,f);break;}
      if(stance==='revolt'){
        // local uprising: agent ravages own city, morale shock spreads
        c.rank=Math.max(1,c.rank-1);feel(c,'ang',-.3);feel(c,'joy',.1);
        remember(c,'폭동 가담');
        for(const n of nbrs(src)){if(cells[n].owner===f.id){feel(cells[n],'ang',.2);feel(cells[n],'fear',.2);dirty.add(n);}}
        f.legitimacy=clamp(f.legitimacy-.04,.1,1);
        flash(src,'rev');dirty.add(src);
        if(warLogCD===0){logEvent(`${f.name} ${ref(src)}에서 민란 발생 — 군심 이반.`,`=REVOLT("${f.name}",${ref(src)}, 怒=${(f.mood.ang*100|0)})`);warLogCD=18;}
        continue;
      }
      if(stance==='slack'&&rnd()<.5)continue;  // half-hearted compliance

      // --- carry out the order according to doctrine ---
      const nb=nbrs(src);
      const tgt=nb[rnd()*nb.length|0];
      const tc=cells[tgt];
      if(tc.st==='water'||fires.has(tgt))continue;

      const wantWar=(doc==='conquer')||(doc==='expand'&&c.per.agg>.5)||c.emo.ang>.55;
      const wantPeace=(doc==='trade')||(doc==='faith');

      if(tc.owner===null){
        // settle / improve frontier
        if(tc.st==='forest'){if(rnd()<(doc==='expand'?.32:.18)){tc.st='land';tc.hist.push('개간');settle(tgt,f,1,'정착지');feel(c,'joy',.06);}}
        else if(tc.st==='fertile'){settle(tgt,f,2,'옥토 정착',null);feel(c,'joy',.12);}
        else if(tc.st==='land'){settle(tgt,f,1,'정착지');feel(c,'joy',.05);}
      } else if(tc.owner!==f.id){
        const of=facById(tc.owner);
        if(!of)continue;
        if(f.pacts.has(of.id)){ // allies: peaceful exchange lifts joy
          if(rnd()<.3){feel(c,'joy',.05);feel(tc,'joy',.05);}
          continue;
        }
        if(wantPeace&&!f.wars.has(of.id)){
          // conversion / trade — may form a pact, raising joy on both sides
          if(doc==='faith'&&rnd()<.25&&tc.per&&tc.per.pie<c.per.pie){
            settle(tgt,f,1,'개종');remember(tc,`${f.name}으로 개종`);feel(tc,'joy',.1);
            if(warLogCD===0){logEvent(`${f.name}, ${of.name}의 ${ref(tgt)}를 신앙으로 교화.`,`=CONVERT("${f.name}","${of.name}",${ref(tgt)})`);warLogCD=20;}
          } else if(doc==='trade'&&rnd()<.10&&!f.pacts.has(of.id)){
            f.pacts.add(of.id);of.pacts.add(f.id);f.wars.delete(of.id);of.wars.delete(f.id);
            feel(c,'joy',.2);
            logEvent(`${f.name}과(와) ${of.name}, 교역 동맹 체결.`,`=ALLY("${f.name}","${of.name}")`);
          }
          continue;
        }
        // WAR — emergent: more likely when angry / conquer doctrine / grudge present
        const grudge=c.grudge&&c.grudge.get(of.id)||0;
        const willFight=(wantWar?.62:.30)+grudge*.45+f.mood.ang*.35;
        if(rnd()<willFight){
          if(!f.wars.has(of.id)){
            f.wars.add(of.id);of.wars.add(f.id);
            f.pacts.delete(of.id);of.pacts.delete(f.id);
            if(warLogCD===0){logEvent(`${f.name}, ${of.name}에 선전포고.`,`=DECLARE.WAR("${f.name}","${of.name}")`);warLogCD=16;}
          }
          const att=1+rnd()*2.5+f.size*.002+(f.golden?1.2:0)+c.per.agg+ (doc==='conquer'?.8:0);
          const def=tc.rank+1+rnd()*2.5+(of.golden?.8:0)+(of.doctrine==='fortify'?1.2:0);
          flash(tgt,'war');
          if(att>def){
            // remember the aggressor; loser feels anger+sorrow+fear
            feel(tc,'ang',.5);feel(tc,'sor',.35);feel(tc,'fear',.4);
            if(tc.grudge)tc.grudge.set(f.id,clamp((tc.grudge.get(f.id)||0)+.4,0,1));
            remember(tc,`${f.name}에게 침략당함`);
            if(rnd()<.3){fires.set(tgt,5);tc.hist.push('전화(戰火)');if(tc.hist.length>7)tc.hist.shift();dirty.add(tgt);}
            else{settle(tgt,f,Math.max(1,tc.rank-1),'점령됨');feel(c,'joy',.12);feel(c,'ang',-.1);}
            if((tc.rank>=3||warLogCD===0)){logEvent(`${f.name}, ${of.name}의 ${RANK_LABEL[Math.max(1,tc.rank)]||'영토'}(${ref(tgt)}) 점령.`,`=WAR("${f.name}"→"${of.name}",${ref(tgt)})`);warLogCD=24;}
          } else {
            // defender holds — attacker frustrated, defender elated (joy boosts the collective)
            feel(c,'ang',.25);feel(c,'sor',.15);
            feel(tc,'joy',.3);feel(tc,'fear',-.1);
          }
        }
      }
    }

    // development (growth) — joyful, low-fear agents build
    const ups=1+(f.size*.05|0);
    for(let u=0;u<ups;u++){
      const i=f.arr[rnd()*f.arr.length|0];
      if(i===undefined||cells[i].owner!==f.id)continue;
      const c=cells[i];
      const drive=.05*(f.golden?3:1)*(1+c.emo.joy-c.emo.fear*.7)*(doc==='trade'?1.4:1)*(doc==='fortify'?1.3:1);
      if(c.rank<4&&rnd()<drive){
        c.rank++;c.hist.push(RANK_LABEL[c.rank]);if(c.hist.length>7)c.hist.shift();
        feel(c,'joy',.15);dirty.add(i);
        if(c.rank===3){c.role=c.role==='지도자'?'지도자':'총독';}
        if(c.rank===4&&warLogCD===0){logEvent(`${f.name}, ${ref(i)}에 왕도(王都)를 건립.`,`=CAPITAL("${f.name}",${ref(i)})`);warLogCD=22;}
      }
    }

    // war fatigue: long wars breed sorrow & fear -> sue for peace
    if(f.wars.size&&rnd()<.05){
      const eid=[...f.wars][rnd()*f.wars.size|0];const of=facById(eid);
      if(of&&(f.mood.fear>.5||f.mood.sor>.5||rnd()<.3)){
        f.wars.delete(eid);of.wars.delete(f.id);
        for(const i of f.arr)feel(cells[i],'joy',.08),feel(cells[i],'fear',-.15);
        if(warLogCD===0){logEvent(`${f.name}과(와) ${of?of.name:'적'}, 종전 협정.`,`=PEACE("${f.name}","${of?of.name:'?'}")`);warLogCD=20;}
      }
    }
  }

  // ---- world events (rare, become history) ----
  const r=rnd();
  if(!plague.size&&r<.004){
    const big=[];for(let i=0;i<N;i++)if(cells[i].owner!==null&&cells[i].rank>=3)big.push(i);
    if(big.length){const i=pick(big);plague.set(i,11);feel(cells[i],'fear',.6);dirty.add(i);logEvent(`${ref(i)}에서 역병 창궐.`,`=PLAGUE(${ref(i)})`);}
  } else if(r>.997&&factions.length){
    const f=pick(factions);f.golden=90;for(const i of f.arr)feel(cells[i],'joy',.4),feel(cells[i],'ang',-.2);
    logEvent(`${f.name}, 황금기 도래 — 온 백성이 기뻐하다.`,`=GOLDEN.AGE("${f.name}",90)`);
  } else if(r>.994&&r<=.997){
    const towns=[];for(let i=0;i<N;i++)if(cells[i].owner!==null&&cells[i].rank>=2)towns.push(i);
    if(towns.length){const i=pick(towns);fires.set(i,6);dirty.add(i);logEvent(`${ref(i)}에 대화재.`,`=FIRE(${ref(i)})`);}
  } else if(r>.991&&r<=.994){
    // famine: a fertile-poor faction loses joy
    if(factions.length){const f=pick(factions);for(const i of f.arr){feel(cells[i],'sor',.25);feel(cells[i],'joy',-.2);}
      if(warLogCD===0){logEvent(`${f.name}에 기근 — 백성의 시름이 깊다.`,`=FAMINE("${f.name}")`);warLogCD=18;}}
  }
  // migration arrivals while world is sparse
  if(factions.length<3&&rnd()<.02&&factions.length<6){
    const f=spawnFaction(false);
    if(f)logEvent(`바다 건너에서 ${f.name}이(가) 도래.`,`=MIGRATE("${f.name}")`);
  }

  // ---- render ----
  for(const i of dirty)paint(i);
  dirty.clear();

  // status
  let big=factions.slice().sort((a,b)=>b.size-a.size)[0];
  statusbar.innerHTML=`준비<span class="sep">|</span>서기 <b>${year}</b>년<span class="sep">|</span>인구 ${pop.toLocaleString()}<span class="sep">|</span>국가 ${factions.length}<span class="sep">|</span>${big?`패권 <b style="color:#ffe">${big.name}</b>`:''}<span class="sep">|</span>${lastEvent}`;

  if(tickN%6===0)renderRoster();
  if(tickN%6===0){
    document.getElementById('ttl').textContent=`군체정신.xlsx - Excel (서기 ${year}년)`;
    document.getElementById('tab-dead').textContent=`멸망기록 (${obituaries.length})`;
    renderLegend();
    if(curView==='chron')renderChron();
    if(curView==='dead')renderDead();
    if(curView==='mind')renderMind();
  }
}

// ---------- side roster (the autonomous council) ----------
function moodWord(m){
  const d=dominantEmo(m);
  return d==='joy'?'<span style="color:#0a8a3a">희(喜) 번영</span>'
    :d==='ang'?'<span style="color:#c00000">노(怒) 격앙</span>'
    :d==='sor'?'<span style="color:#3a5fa0">애(哀) 침울</span>'
    :d==='fear'?'<span style="color:#b06a00">구(懼) 불안</span>'
    :'<span style="color:#666">평정</span>';
}
function bar(lab,v,col){return `<div class="bar"><span class="lab">${lab}</span><div class="track"><div class="fill" style="width:${(v*100)|0}%;background:${col}"></div></div></div>`;}
function renderRoster(){
  document.getElementById('agcount').textContent=`${factions.length}세력`;
  const sorted=factions.slice().sort((a,b)=>b.size-a.size);
  let h='';
  for(const f of sorted){
    const m=f.mood;
    h+=`<div class="fac" data-fid="${f.id}">
      <div class="top"><span class="sw" style="background:${f.color}"></span>${f.name}${f.golden?' ✦황금기':''}</div>
      <div class="doc">지도자 ${f.leader} · 국시「${DOCTRINES[f.doctrine].n}」 — ${DOCTRINES[f.doctrine].desc}</div>
      <div class="bars">
        ${bar('喜',m.joy,'#0a8a3a')}${bar('怒',m.ang,'#c00000')}${bar('哀',m.sor,'#3a5fa0')}${bar('懼',m.fear,'#b06a00')}
      </div>
      <div class="stat"><span>영토 ${f.size}</span><span>정통성 ${(f.legitimacy*100|0)}%</span><span>불온 ${(f.unrest*100|0)}%</span>${f.wars.size?`<span style="color:#c00">교전 ${f.wars.size}</span>`:''}${f.pacts.size?`<span style="color:#0a8a3a">동맹 ${f.pacts.size}</span>`:''}</div>
      <div class="mood">군심: ${moodWord(m)}${f.unrest>.5?' <span style="color:#9333ea">⚑반란위기</span>':''}</div>
    </div>`;
  }
  if(!sorted.length)h='<div class="fac" style="color:#999">모든 문명이 스러졌다.</div>';
  roster.innerHTML=h;
}

function renderLegend(){
  let h='<h4>범례</h4>';
  const rows=[['#9dc3e6','≈ 바다'],['#548235','木 숲'],['#bf9000','⌇ 옥토'],['#999','墟 폐허'],
    ['#222','· 정착 / 田 농장'],['#222','城 성읍 / 王 왕도'],['#c00000','火 화재'],['#7030a0','疫 역병']];
  for(const [c,t] of rows)h+=`<div class="row"><span class="sw" style="background:${c}"></span>${t}</div>`;
  h+='<h4 style="margin-top:5px">감정(우상단)</h4><div class="row" style="font-size:9.5px">☺기쁨 ✦분노 •슬픔 !불안</div>';
  legend.innerHTML=h;
}

// ---------- alternate sheets ----------
let curView='map';
function renderChron(){
  const v=document.getElementById('view-chron');
  let h='<table class="grid"><tr><th style="width:30px">#</th><th style="width:70px">서기</th><th>사건</th><th>수식</th></tr>';
  const list=chronicle.slice(-120).reverse();
  list.forEach((e,k)=>{h+=`<tr><td class="rh">${chronicle.length-k}</td><td>${e.year}년</td><td>${esc(e.msg)}</td><td style="font-family:Consolas,monospace;color:#0a6b35">${esc(e.fx)}</td></tr>`;});
  h+='</table>';v.innerHTML=h;
}
function renderDead(){
  const v=document.getElementById('view-dead');
  let h='<table class="grid"><tr><th style="width:30px">#</th><th>멸망 국가</th><th>최후 지도자</th><th>존속</th><th>멸망 서기</th><th>사인</th></tr>';
  obituaries.slice().reverse().forEach((o,k)=>{h+=`<tr><td class="rh">${obituaries.length-k}</td><td>† ${esc(o.name)}</td><td>${esc(o.leader)}</td><td>${o.year-o.born}년</td><td>${o.year}년</td><td>${esc(o.cause)}</td></tr>`;});
  if(!obituaries.length)h+='<tr><td class="rh"></td><td colspan="5" style="color:#999">아직 멸망한 문명이 없습니다.</td></tr>';
  h+='</table>';v.innerHTML=h;
}
function renderMind(){
  const v=document.getElementById('view-mind');
  let h='<table class="grid"><tr><th>국가</th><th>지도자</th><th>국시</th><th>군심(喜/怒/哀/懼)</th><th>정통성</th><th>불온</th><th>지배적 정서</th><th>관계</th></tr>';
  const sorted=factions.slice().sort((a,b)=>b.size-a.size);
  for(const f of sorted){const m=f.mood;
    h+=`<tr><td><span style="display:inline-block;width:9px;height:9px;background:${f.color};margin-right:4px;border-radius:2px"></span>${esc(f.name)}</td><td>${esc(f.leader)}</td><td>${DOCTRINES[f.doctrine].n}</td><td>${(m.joy*100|0)}/${(m.ang*100|0)}/${(m.sor*100|0)}/${(m.fear*100|0)}</td><td>${(f.legitimacy*100|0)}%</td><td>${(f.unrest*100|0)}%</td><td>${moodWord(m)}</td><td>${f.wars.size?'<span style="color:#c00">전쟁'+f.wars.size+'</span> ':''}${f.pacts.size?'<span style="color:#0a8a3a">동맹'+f.pacts.size+'</span>':''}</td></tr>`;
  }
  if(!sorted.length)h+='<tr><td colspan="8" style="color:#999">생존 문명 없음</td></tr>';
  h+='</table><div style="padding:8px 10px;color:#666;font-size:10.5px">※ 「군심」은 각 영지 개체들의 감정을 위계 가중 평균한 <b>창발 집단지성</b> 지표다. 지도자는 매 시대 이 값을 읽고 국시를 스스로 바꾼다. 어떤 값도 대본으로 정해지지 않는다.</div>';
  v.innerHTML=h;
}
function esc(s){return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// ---------- tab switching ----------
document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('[data-v]');if(!t)return;
  curView=t.dataset.v;
  document.querySelectorAll('#tabs div').forEach(d=>d.classList.toggle('on',d===t));
  document.querySelectorAll('.sheetview').forEach(s=>s.classList.remove('on'));
  document.getElementById('view-'+curView).classList.add('on');
  document.getElementById('hint').style.display=curView==='map'?'block':'none';
  if(curView==='chron')renderChron();
  if(curView==='dead')renderDead();
  if(curView==='mind')renderMind();
});

// ---------- click a cell: history, or incite revolt (intervention) ----------
sheet.addEventListener('click',e=>{
  const t=e.target.closest('.cell');if(!t)return;
  if(selected>=0)cellEls[selected].classList.remove('sel');
  selected=+t.dataset.i;t.classList.add('sel');
  namebox.textContent=ref(selected);
  const c=cells[selected];
  if(c.owner!==null){
    const f=facById(c.owner);
    // PLAYER INTERVENTION: clicking owned land stirs unrest there — emergent consequences
    feel(c,'ang',.45);feel(c,'joy',-.2);remember(c,'외세의 선동');
    for(const n of nbrs(selected)){if(cells[n].owner===c.owner){feel(cells[n],'ang',.2);dirty.add(n);}}
    if(f)f.legitimacy=clamp(f.legitimacy-.03,.1,1);
    dirty.add(selected);paint(selected);
    const role=c.role||'정착민';
    fmla.textContent=`=AGENT(${ref(selected)}, "${f?f.name:'?'}", 직책="${role}", 성격[야망${(c.per.amb*100|0)}/충성${(c.per.loy*100|0)}/호전${(c.per.agg*100|0)}], 감정[喜${(c.emo.joy*100|0)}/怒${(c.emo.ang*100|0)}])`;
    toast(`선동: ${ref(selected)} ${role}의 분노를 부추겼다 (怒 +) — 봉기로 번질지도`);
  } else {
    fmla.textContent=`=HISTORY(${c.hist.map(x=>`"${x}"`).join(' → ')})`;
  }
});

// hover tooltip = the agent's inner life
sheet.addEventListener('mousemove',e=>{
  const t=e.target.closest('.cell');if(!t){hoverEl.style.display='none';return;}
  const i=+t.dataset.i,c=cells[i];
  if(c.owner===null||!c.per){
    hoverEl.style.display='block';
    hoverEl.innerHTML=`<b>${ref(i)}</b> · ${c.st==='water'?'바다':c.st==='forest'?'숲':c.st==='fertile'?'옥토':c.st==='ruin'?'폐허':'황무지'}<br>역사: ${c.hist.slice(-3).join(' → ')}`;
  } else {
    const f=facById(c.owner);const d=dominantEmo(c.emo);
    hoverEl.style.display='block';
    hoverEl.innerHTML=`<b>${ref(i)} · ${f?f.name:''}</b> ${RANK_LABEL[c.rank]||''}<br>
      직책: ${c.role||'정착민'}<br>
      성격: 야망 ${(c.per.amb*100|0)} / 충성 ${(c.per.loy*100|0)} / 호전 ${(c.per.agg*100|0)} / 신심 ${(c.per.pie*100|0)}<br>
      감정: 喜${(c.emo.joy*100|0)} 怒${(c.emo.ang*100|0)} 哀${(c.emo.sor*100|0)} 懼${(c.emo.fear*100|0)} ${d?'('+({joy:'기쁨',ang:'분노',sor:'슬픔',fear:'불안'}[d])+')':''}<br>
      ${c.mem&&c.mem.length?'기억: '+c.mem.slice(-2).join(' · '):'기억 없음'}`;
  }
  const w=hoverEl.offsetWidth,h=hoverEl.offsetHeight;
  let x=e.clientX+14,y=e.clientY+14;
  if(x+w>innerWidth)x=e.clientX-w-12;if(y+h>innerHeight)y=e.clientY-h-12;
  hoverEl.style.left=x+'px';hoverEl.style.top=y+'px';
});
sheet.addEventListener('mouseleave',()=>hoverEl.style.display='none');

// pause on spacebar / click status
document.addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;toast(paused?'⏸ 일시정지':'▶ 재개');e.preventDefault();}});

// ---------- boot ----------
for(let i=0;i<N;i++)paint(i);
fmla.textContent=`=SIM.EMERGENT($A$1:$${colName(COLS-1)}$${ROWS}, "개체→집단지성", 대본=FALSE)`;
spawnFaction(true);spawnFaction(true);spawnFaction(true);spawnFaction(true);
renderRoster();renderLegend();
logEvent('태초의 정적. 자율 문명들이 깨어난다.','=GENESIS()');
setInterval(tick,120);
})();
</script>
