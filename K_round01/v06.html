<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>왕조.xlsx - Excel</title>
<style>
  :root{ --grn:#107c41; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent}
  #app{display:flex;flex-direction:column;height:100%}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:18px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;
    flex:0 0 auto;overflow:hidden}
  #menubar b{color:var(--grn);border-bottom:2.5px solid var(--grn);padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  #fbar{min-height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px;flex:0 0 auto}
  #namebox{width:76px;min-width:76px;height:26px;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;font-weight:600}
  #fx{width:30px;min-width:30px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toolrow{height:28px;background:#faf9f8;display:flex;align-items:center;gap:6px;
    padding:0 8px;border-bottom:1px solid #e1e1e1;flex:0 0 auto;overflow-x:auto;overflow-y:hidden}
  #toolrow button{font:inherit;font-size:11px;background:#fff;border:1px solid #cfcfcf;
    border-radius:3px;padding:3px 9px;color:#333;cursor:pointer;white-space:nowrap}
  #toolrow button:hover{background:#eef6f0;border-color:#9ccdb0}
  #toolrow button:active{background:#d7ecdf}
  #toolrow .gpill{font-size:11px;color:#666;margin-left:auto;white-space:nowrap;padding-right:4px}
  #mid{flex:1 1 auto;display:flex;min-height:0;overflow:hidden}
  #sheetwrap{position:relative;flex:1 1 auto;overflow:auto;background:#fff;min-width:0}
  #sheet{display:grid;background:#fff;width:max-content}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:11px;
    position:sticky;z-index:3}
  .hd.col{top:0}
  .hd.row{left:0;z-index:4}
  .hd.corner{top:0;left:0;z-index:6}
  .cell{border-right:1px solid #e3e3e3;border-bottom:1px solid #e3e3e3;
    display:flex;align-items:center;justify-content:center;font-size:11px;
    overflow:hidden;cursor:cell;position:relative;line-height:1}
  .cell.sel{outline:2px solid var(--grn);outline-offset:-2px;z-index:2}
  .cap{position:absolute;top:0;right:1px;font-size:7px;line-height:1;opacity:.9}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #ff4d4d}50%{box-shadow:inset 0 0 0 2px #ffd0d0}}
  .war{animation:warf .3s 4}
  @keyframes corof{0%{box-shadow:inset 0 0 0 0 #ffd700}40%{box-shadow:inset 0 0 0 3px #ffd700}100%{box-shadow:inset 0 0 0 0 #ffd700}}
  .coro{animation:corof 1.4s 1}
  #side{width:288px;min-width:288px;background:#fbfbfa;border-left:1px solid #d8d8d8;
    display:flex;flex-direction:column;overflow:hidden;flex:0 0 auto}
  #sidetabs{display:flex;border-bottom:1px solid #ddd;background:#f3f2f1;flex:0 0 auto}
  #sidetabs div{flex:1;text-align:center;padding:6px 0;font-size:11px;color:#666;cursor:pointer;border-right:1px solid #e3e3e3}
  #sidetabs div.on{background:#fff;color:var(--grn);font-weight:600;box-shadow:inset 0 -2px 0 var(--grn)}
  #sidebody{flex:1;overflow-y:auto;padding:8px 9px;font-size:11px;line-height:1.55}
  #sidebody h4{margin:9px 0 4px;font-size:11px;color:#7a6a1f;border-bottom:1px dotted #ccc;padding-bottom:2px}
  #sidebody h4:first-child{margin-top:0}
  .dyn{margin:0 0 7px;padding:6px 7px;border:1px solid #e3e3e3;border-radius:4px;background:#fff}
  .dyn .nm{font-weight:600;display:flex;align-items:center;gap:5px}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:0 0 auto}
  .king{font-size:10.5px;color:#333;margin-top:2px}
  .small{font-size:10px;color:#777}
  .mood{display:inline-block;font-size:9px;padding:0 4px;border-radius:7px;margin-left:3px;color:#fff}
  .bar{height:4px;background:#eee;border-radius:3px;overflow:hidden;margin-top:2px}
  .bar>i{display:block;height:100%}
  .dead{color:#999;font-size:10.5px;margin:1px 0}
  .ev{font-size:10.5px;margin:0 0 3px;padding-left:9px;text-indent:-9px;color:#3a3a3a}
  .ev b{color:#000;font-weight:600}
  .ev .yr{color:#999;font-family:Consolas,monospace}
  .ev.war{color:#7a0000}
  .ev.cor{color:#9a7400}
  .ev.die{color:#666}
  .ev.bet{color:#7a0066}
  #legend{position:absolute;top:6px;right:8px;background:#fffce6;border:1px solid #d8c66a;
    box-shadow:2px 3px 8px rgba(0,0,0,.18);padding:6px 9px;font-size:10px;z-index:5;
    line-height:1.7;pointer-events:none;max-width:150px}
  #legend h4{margin:0 0 2px;font-size:10px;color:#7a6a1f}
  #legend span.k{display:inline-block;width:14px;text-align:center}
  #statusbar{height:24px;background:var(--grn);color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;flex:0 0 auto;white-space:nowrap;overflow:hidden}
  #statusbar .sep{margin:0 9px;opacity:.5}
  #statusbar .ev{color:#eaf6ee;margin:0;text-indent:0;padding:0;overflow:hidden;text-overflow:ellipsis}
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:24px;
    border-top:1px solid #d4d4d4;font-size:11.5px;flex:0 0 auto;overflow:hidden}
  #tabs div{padding:3px 13px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fff;color:var(--grn);font-weight:600;border-top:2px solid var(--grn)}
  /* 인물 카드 팝업 */
  #card{position:absolute;display:none;z-index:20;width:230px;background:#fff;
    border:1px solid #b9a94e;box-shadow:0 6px 22px rgba(0,0,0,.28);border-radius:5px;font-size:11px}
  #card .ch{padding:6px 9px;font-weight:600;color:#fff;border-radius:4px 4px 0 0;display:flex;align-items:center;gap:6px}
  #card .cb{padding:8px 10px;line-height:1.6}
  #card .trow{display:flex;justify-content:space-between;margin:1px 0}
  #card .trow .bar{flex:1;margin:6px 0 0 8px}
  @media (max-width:640px){
    #side{display:none}
    #menubar{gap:11px;font-size:11px}
    #namebox{width:60px;min-width:60px}
    #statusbar{font-size:10.5px}
    #statusbar .sep{margin:0 5px}
    #toolrow{height:auto;flex-wrap:nowrap}
    #card{width:200px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <span id="title">왕조.xlsx - Excel</span>
  </div>
  <div id="menubar"><i>파일</i><b>왕실</b><i>삽입</i><i>계보</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
  <div id="fbar">
    <div id="namebox">A1</div>
    <div id="fx">fx</div>
    <div id="formula"></div>
  </div>
  <div id="toolrow">
    <button id="btnPause">⏸ 일시정지</button>
    <button id="btnSpeed">속도 ▸ 보통</button>
    <button id="btnEdict">📜 칙령 내리기</button>
    <button id="btnAssassin">🗡 암살 사주</button>
    <button id="btnHeir">👑 후계 지명</button>
    <span class="gpill" id="genpill">세대 —</span>
  </div>
  <div id="mid">
    <div id="sheetwrap">
      <div id="sheet"></div>
      <div id="legend"></div>
    </div>
    <div id="side">
      <div id="sidetabs">
        <div class="on" data-st="dyn">왕조</div>
        <div data-st="chr">연대기</div>
        <div data-st="dead">멸망기록</div>
      </div>
      <div id="sidebody"></div>
    </div>
  </div>
  <div id="tabs">
    <div class="on">지도</div>
    <div data-st="chr">연대기</div>
    <div data-st="dyn">왕조</div>
    <div data-st="dead" id="tab-dead">멸망기록 (0)</div>
  </div>
  <div id="statusbar"></div>
</div>
<div id="card"></div>

<script>
(() => {
"use strict";
// ============================================================
//  왕조.xlsx  —  엑셀로 위장한 창발적 왕조 시뮬레이션
//  렌즈: 세대교체 / 후계 다툼 / 명령 위계와 항명·배신
//  대본 없음 — 자율 에이전트의 성격·감정·기억·관계가 상호작용해
//  매 실행마다 다른 역사가 창발한다.
// ============================================================

// ---------- 그리드 치수 (반응형) ----------
const isPhone = innerWidth < 640;
const CW = isPhone ? 26 : 32, CH = isPhone ? 22 : 22;
const sw = document.getElementById('sheetwrap');
function calcDims(){
  const availW = (isPhone ? innerWidth : innerWidth - 288) - 46 - 4;
  const availH = innerHeight - 30 - 28 - 26 - 28 - 25 - 24 - 4;
  const cols = Math.max(18, Math.min(46, Math.floor(availW / CW)));
  const rows = Math.max(16, Math.min(34, Math.floor(availH / CH)));
  return {cols, rows};
}
let {cols:COLS, rows:ROWS} = calcDims();
let N = COLS * ROWS;

const sheet = document.getElementById('sheet');
const fmla = document.getElementById('formula');
const namebox = document.getElementById('namebox');
const statusbar = document.getElementById('statusbar');
const legend = document.getElementById('legend');
const sidebody = document.getElementById('sidebody');
const card = document.getElementById('card');

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(Math.floor(i/COLS)+1);}
const rnd = (a=1)=>Math.random()*a;
const ri = a=>Math.random()*a|0;
const pick = arr=>arr[ri(arr.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

// ============================================================
//  지형 생성 (값 노이즈)
// ============================================================
const GW=10, GH=7, gz=[];
for(let i=0;i<GW*GH;i++) gz[i]=Math.random();
function noise(x,y){
  const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=gz[y0*GW+x0], b=gz[y0*GW+Math.min(GW-1,x0+1)];
  const c=gz[Math.min(GH-1,y0+1)*GW+x0], d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}
// cells: 지형 + 소유. prov = 어느 영주(province lord)의 관할인가
let cells = [];
function buildTerrain(){
  cells = new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS, y=i/COLS|0;
    const v=noise(x,y)+(rnd()-.5)*.14;
    let st='land', hist=['황무지'];
    if(v<.30){st='water';hist=['바다'];}
    else if(v>.78){st='mountain';hist=['산맥'];}
    else if(v>.60 && rnd()<.62){st='forest';hist=['숲'];}
    cells[i]={st,owner:null,lord:null,level:0,hist,ruinT:0,unrest:0};
  }
}
function nbrs(i){
  const x=i%COLS,y=i/COLS|0,out=[];
  if(x>0)out.push(i-1); if(x<COLS-1)out.push(i+1);
  if(y>0)out.push(i-COLS); if(y<ROWS-1)out.push(i+COLS);
  return out;
}

// ============================================================
//  이름 생성 — 왕조·인물
// ============================================================
const HOUSE = ['벨라','카르','드라','오르','셀','모란','테른','발','이슈','콘라','하렌','자비','루메','코르'];
const HOUSE2= ['몽','가르드','시안','펠','로크','베인','타스','윈','달','크론','메르','보른'];
const GIVEN_M=['알','보','코르','단','에','가','하','이반','요','카엘','렌','마','네','오스','파','콰','로',
  '테오','우르','발','윈','자르','아드리안','베네딕','시릴'];
const GIVEN_F=['아','베라','체','다','엘','피아','그레','헬','이','요한','카타','리','미라','노바','옥타',
  '페트라','로사','셀레','테아','우나','베스파','릴리','이졸데','마틸드'];
const SUFFIX=['','우스','이안','베르','문드','릭','센','발','노르','윈'];
function houseName(){return pick(HOUSE)+pick(HOUSE2);}
function personName(sex){
  const g = sex==='f'?pick(GIVEN_F):pick(GIVEN_M);
  return g + pick(SUFFIX);
}

// 성격 형용사 (성향에서 파생)
function epithet(p){
  if(p.cruelty>.7) return '잔혹공';
  if(p.ambition>.78) return '대담공';
  if(p.piety>.72) return '경건공';
  if(p.cunning>.74) return '교활공';
  if(p.valor>.74) return '용맹공';
  if(p.ambition<.3 && p.cruelty<.3) return '온화공';
  return pick(['현명공','침묵공','방랑공','관후공','우유부단공','수전노','술꾼','대식가']);
}

// ============================================================
//  에이전트 (인물) — 성격·감정·기억·목표
// ============================================================
let PID = 1;
function newTraits(parent){
  // 자식은 부모 성향을 일부 물려받고 변이
  function inh(base){ return parent ? clamp(base + (rnd()-.5)*.45, .05, .95) : rnd(); }
  return {
    ambition: inh(parent?parent.t.ambition:0),
    cruelty:  inh(parent?parent.t.cruelty:0),
    cunning:  inh(parent?parent.t.cunning:0),
    valor:    inh(parent?parent.t.valor:0),
    piety:    inh(parent?parent.t.piety:0),
  };
}
function makePerson(dyn, role, parent, sex){
  sex = sex || (rnd()<.5?'m':'f');
  const t = newTraits(parent);
  const p = {
    id: PID++, dyn: dyn?dyn.id:-1, sex, role,         // role: monarch/heir/lord/pretender
    t,
    name: personName(sex),
    age: role==='heir'? ri(14)+1 : ri(22)+24,
    // 감정 — 사건으로 동적 변동 (대본 없음)
    emo: { joy:.4, anger:0, grief:0, content:.4 },
    loyalty: parent ? clamp(.55 + (rnd()-.4)*.5, .1, .98) : .7, // 영주/후계의 충성
    memory: [],          // {kind, who(dynId or pid), w}
    parent: parent?parent.id:null,
    alive:true, born:undefined, epithet:'',
    province: null,      // 영주가 다스리는 셀 idx
    claim: parent? .5 : .9,
    bribe: 0,
  };
  p.epithet = epithet(t);
  return p;
}
function emoLabel(e){
  const arr=[['기쁨',e.joy,'#2e9e5b'],['분노',e.anger,'#d23b3b'],['슬픔',e.grief,'#3b6fd2'],['만족',e.content,'#9a7d2e']];
  arr.sort((a,b)=>b[1]-a[1]);
  return arr[0];
}
// 사건이 인물 감정을 바꾼다 (창발의 핵심 통로)
function feel(p, dj, da, dg, dc){
  if(!p) return;
  p.emo.joy   = clamp(p.emo.joy + (dj||0), 0, 1);
  p.emo.anger = clamp(p.emo.anger + (da||0), 0, 1);
  p.emo.grief = clamp(p.emo.grief + (dg||0), 0, 1);
  p.emo.content=clamp(p.emo.content + (dc||0), 0, 1);
}
function remember(p, kind, who, w){
  if(!p) return;
  // 같은 대상 기억은 누적
  const ex = p.memory.find(m=>m.kind===kind && m.who===who);
  if(ex) ex.w = clamp(ex.w + w, -1, 1);
  else p.memory.push({kind, who, w});
  if(p.memory.length>14) p.memory.shift();
}
function grudge(p, dynId){
  if(!p) return 0;
  let g=0; for(const m of p.memory) if(m.who===dynId && m.w<0) g+=m.w;
  return g; // 음수
}

// ============================================================
//  왕조 (Dynasty)
// ============================================================
const NAMES_FALLBACK_COLORS=['#2563eb','#dc2626','#059669','#7c3aed','#d97706','#0d9488','#be185d','#4d7c0f','#9333ea','#b45309','#0369a1','#a16207'];
let colorIdx=0;
let dynasties=[];
let DID=0;
const allPeople = new Map(); // id -> person (생존자만 유지하되 죽은 군주는 연대기 참조용 약하게)

function makeDynasty(){
  const d = {
    id: DID++,
    house: houseName(),
    color: NAMES_FALLBACK_COLORS[colorIdx++ % NAMES_FALLBACK_COLORS.length],
    monarch: null,
    heirs: [],      // person[]
    lords: [],      // person[] (province governors)
    generation: 1,
    founded: 0,
    golden: 0,
    treasury: 30,
    legitimacy: .8,   // 정통성 (낮으면 반란↑)
    size: 0, arr: [], pop:0,
    capital: -1,
    rivalry: {},      // dynId -> 누적 적대 (창발 동맹/숙적)
  };
  const m = makePerson(d, 'monarch', null);
  m.age = 28 + ri(14);
  d.monarch = m; allPeople.set(m.id, m);
  // 초기 후계 1~3
  const nh = 1 + ri(3);
  for(let k=0;k<nh;k++){ const h=makePerson(d,'heir',m); h.age=ri(12); d.heirs.push(h); allPeople.set(h.id,h); }
  return d;
}
function dynById(id){ return dynasties.find(d=>d.id===id); }

// ============================================================
//  지도/셀 표현
// ============================================================
let cellEls = [];
function buildSheetDOM(){
  sheet.style.gridTemplateColumns = `46px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows = CH+'px';
  sheet.innerHTML='';
  cellEls = new Array(N);
  const frag=document.createDocumentFragment();
  const corner=document.createElement('div'); corner.className='hd corner'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd col';h.textContent=colName(c);frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd row';h.textContent=r+1;frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';const idx=r*COLS+c;d.dataset.i=idx;
      cellEls[idx]=d; frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

function setCell(i, dynId, level, lordId, label){
  const c=cells[i];
  c.owner=dynId; c.level=level; c.st='land';
  if(lordId!==undefined) c.lord=lordId;
  if(label){ c.hist.push(label); if(c.hist.length>8) c.hist.shift(); }
  dirty.add(i);
}

const LV_TXT=['','·','田','邑','城','京'];   // 개척지/농장/마을/읍성/대도시(京=수도급)
const LV_LABEL=['','개척지','농장','마을','읍성','왕도'];
const plague=new Map(), fires=new Map(), revolt=new Map(); // revolt: idx->{dynId 원 소유, t}
const dirty=new Set();

function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

function paint(i){
  const c=cells[i], el=cellEls[i];
  let bg='',tx='',col='#222',w='', cap='';
  if(plague.has(i)){bg='#ead5f5';tx='疫';col='#7030a0';w='700';}
  else if(fires.has(i)){bg='#ffd9b3';tx='火';col='#c00000';w='700';}
  else if(revolt.has(i)){bg='#ffe3b0';tx='叛';col='#b35900';w='700';}
  else if(c.st==='water'){bg='#ddebf7';tx='≈';col='#9dc3e6';}
  else if(c.st==='mountain'){bg='#efece6';tx='峰';col='#a89878';}
  else if(c.st==='forest'){bg='#e2efda';tx='木';col='#548235';}
  else if(c.st==='ruin'){bg='#ececec';tx='墟';col='#999';}
  else if(c.owner!==null){
    const d=dynById(c.owner);
    if(d){
      bg=hexA(d.color,.12+c.level*.16);
      tx=LV_TXT[c.level]||'·'; col=d.color; w=c.level>=4?'700':'';
      if(i===d.capital) cap='♛';
      else if(c.unrest>.6) cap='!';
    }
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  el.textContent=tx;
  if(cap){ el.insertAdjacentHTML('beforeend', `<span class="cap" style="color:${cap==='!'?'#c00':col}">${cap}</span>`); }
}

// ============================================================
//  연대기 (이벤트 로그) — 인물 중심 서사
// ============================================================
const chronicle=[];   // {year, text(html), cls}
const obituaries=[];  // {text}
let year=0, lastEventHTML='천지가 창조되었습니다.';
function logEvent(textHTML, formula, cls){
  lastEventHTML = textHTML;
  chronicle.push({year, text:textHTML, cls:cls||''});
  if(chronicle.length>260) chronicle.shift();
  if(formula) fmla.textContent = formula;
}

// ============================================================
//  국가 등장
// ============================================================
function spawnDynasty(announce){
  const d=makeDynasty();
  for(let tries=0;tries<400;tries++){
    const i=ri(N);
    if(cells[i].st==='land' && cells[i].owner===null){
      d.founded=year;
      d.capital=i;
      setCell(i, d.id, 3, null, '건국');
      dynasties.push(d);
      if(announce){
        logEvent(`<b>${d.house} 가문</b>의 <b>${d.monarch.name} ${d.monarch.epithet}</b>이(가) ${ref(i)}에서 왕조를 열었다.`,
          `=FOUND("${d.house}", 군주="${d.monarch.name}", ${ref(i)})`, 'cor');
      }
      return d;
    }
  }
  return null;
}

// ============================================================
//  명령 위계 — 군주가 영주에게 칙령을 내리고, 영주는 해석한다
//  directive: expand / fortify / tax / muster(징병→공세)
//  영주의 반응 = 충성 + 감정 + 야망 으로 창발 (복종/태업/횡령/항명/반란)
// ============================================================
function chooseDirective(d){
  const m=d.monarch; if(!m) return 'expand';
  // 군주 성격·감정·상황으로 칙령 결정
  if(d.legitimacy<.4 && m.t.cruelty>.5) return 'tax';        // 정통성 위기 → 압정
  if(m.emo.anger>.6 && m.t.valor>.45) return 'muster';
  if(m.t.ambition>.6 && d.golden>0) return 'expand';
  if(m.emo.grief>.55) return 'fortify';
  const opts=['expand','fortify','tax','muster'];
  // 성향 가중
  const wts=[1+m.t.ambition*2, 1+(1-m.t.valor)+m.emo.grief, 1+(1-m.t.piety)+m.t.cunning, 1+m.t.valor*2+m.emo.anger];
  let s=wts.reduce((a,b)=>a+b,0), x=rnd(s);
  for(let k=0;k<opts.length;k++){ x-=wts[k]; if(x<=0) return opts[k]; }
  return 'expand';
}

function lordObedience(lord, d, directive){
  // 영주가 칙령을 얼마나, 어떻게 따를지 — 창발
  const m=d.monarch;
  let comply = lord.loyalty;
  comply += (d.legitimacy-.5)*.4;
  comply -= lord.emo.anger*.5;
  comply += lord.emo.content*.2;
  comply -= lord.t.ambition*.25;
  if(directive==='tax') comply -= .25 + (1-lord.t.piety)*.2; // 압정엔 반발
  if(directive==='muster') comply -= lord.t.valor<.4? .2:0;
  comply = clamp(comply, 0, 1);
  if(comply>.62) return 'obey';
  if(comply>.40) return rnd()<.5?'embezzle':'slack';   // 횡령/태업
  if(comply>.18) return 'defy';                          // 항명
  return 'revolt';                                       // 반란
}

// ============================================================
//  영주 임명 — 큰 영토엔 자동으로 영주가 생긴다
// ============================================================
function ensureLords(d){
  // 영토 규모에 따라 목표 영주 수
  const target = clamp(Math.floor(d.size/9), 0, 6);
  // 죽은/영토없는 영주 정리
  d.lords = d.lords.filter(l=>l.alive);
  while(d.lords.length < target){
    // 영토 한 칸을 골라 영주 부임
    if(!d.arr.length) break;
    const seat = pick(d.arr);
    if(cells[seat].owner!==d.id) break;
    const l = makePerson(d, 'lord', d.monarch);
    l.age = 24 + ri(26);
    l.province = seat;
    cells[seat].lord = l.id;
    d.lords.push(l); allPeople.set(l.id, l);
    logEvent(`${d.house}의 군주가 <b>${l.name} ${l.epithet}</b>을(를) ${ref(seat)}의 영주로 봉했다.`,
      `=APPOINT_LORD("${l.name}", ${ref(seat)})`, '');
    break; // 한 틱에 하나씩
  }
  if(d.lords.length>target+2){
    // 너무 많으면 가장 충성 낮은 영주 자연 소멸(은퇴)
  }
}

// ============================================================
//  후계 구도 — 매 세대 다툼이 창발
// ============================================================
function eligibleHeirs(d){
  return d.heirs.filter(h=>h.alive && h.age>=12);
}
function claimStrength(d, h){
  // 정당성 점수: 나이(장자), 성향, 감정, 후원(영주 지지), 정통성
  let s = h.claim*40;
  s += clamp(h.age,0,40)*0.6;
  s += h.t.ambition*22 + h.t.cunning*16 + h.t.valor*10;
  s += h.bribe*0.8;
  s += h.emo.anger*8;            // 분노한 후계는 더 밀어붙인다
  // 영주 지지: 영주의 충성·기억으로 결정
  for(const l of d.lords){
    if(!l.alive) continue;
    let back = l.loyalty - .5;
    // 영주가 이 후계에 호감/원한 기억이 있나
    const fav = l.memory.find(mm=>mm.kind==='kin' && mm.who===h.id);
    if(fav) back += fav.w*.5;
    back += (l.t.cunning>.6 && h.t.cunning>.6)? .1 : 0; // 비슷한 모사가끼리
    s += back*14;
  }
  s += (rnd()-.5)*16; // 운
  return s;
}

function succession(d, cause){
  // 군주 사망 → 후계 다툼
  d.generation++;
  const elig = eligibleHeirs(d);
  if(elig.length===0){
    // 후계 없음 → 가장 강한 영주가 찬탈 시도, 없으면 왕조 붕괴 위기
    const lords=d.lords.filter(l=>l.alive);
    if(lords.length && rnd()<.7){
      lords.sort((a,b)=>(b.t.ambition+b.loyalty*0)-(a.t.ambition));
      const u=lords[0];
      u.role='monarch'; d.monarch=u; d.lords=d.lords.filter(l=>l!==u);
      d.legitimacy = clamp(d.legitimacy-.3,.1,1);
      // 새 후계 생성 (방계)
      seedNewHeirs(d, u);
      logEvent(`${d.house}에 후사가 끊겨, 영주 <b>${u.name} ${u.epithet}</b>이(가) 왕위를 찬탈했다.`,
        `=USURP("${u.name}", 정통성-30%)`, 'bet');
      return;
    } else {
      d.monarch=null;
      logEvent(`<b>${d.house} 가문</b>의 대가 끊겼다. 군주가 없다.`, `=DYNASTY_FAIL("${d.house}")`, 'die');
      return;
    }
  }
  // 각 후계 정당성 산출
  const scored = elig.map(h=>({h, s:claimStrength(d,h)})).sort((a,b)=>b.s-a.s);
  const top=scored[0], second=scored[1];
  const margin = second ? top.s - second.s : 999;
  const contested = second && margin < 18; // 박빙 → 분쟁

  if(!contested){
    crown(d, top.h, cause, false);
    // 진 후계들: 분노/슬픔, 일부 음모
    for(const o of scored.slice(1)){
      feel(o.h, -.1, .35+o.h.t.ambition*.3, .2, -.2);
      remember(o.h, 'rival', top.h.id, -.6);
      if(o.h.t.ambition>.65 && rnd()<.5){ o.h.role='pretender'; o.h.scheme=true; }
    }
  } else {
    // 후계 전쟁: 정통성 큰 폭 하락, 영토 분열 가능
    crown(d, top.h, cause, true);
    feel(second.h, -.3, .6, .3, -.4);
    remember(second.h, 'rival', top.h.id, -.9);
    d.legitimacy = clamp(d.legitimacy-.25, .08, 1);
    logEvent(`<b>${d.house}</b>에서 <b>${top.h.name}</b>와(과) <b>${second.h.name}</b>의 후계 전쟁이 터졌다! (왕위 다툼)`,
      `=WAR_OF_SUCCESSION("${top.h.name}" vs "${second.h.name}")`, 'war');
    // 패자가 강하면 분리 독립 (왕조 분열 → 새 왕조 창발)
    if(second.h.t.ambition>.5 && d.size>10 && rnd()<.6){
      splinter(d, second.h);
    } else {
      // 숙청 or 망명
      if(d.monarch && d.monarch.t.cruelty>.5 && rnd()<.6){
        second.h.alive=false;
        obituaries.push({text:`${second.h.name} (찬탈 실패·처형, 서기 ${year}년)`});
        logEvent(`즉위한 ${top.h.name}이(가) 경쟁자 <b>${second.h.name}</b>을(를) 처형했다.`,
          `=PURGE("${second.h.name}")`, 'die');
      }
    }
  }
}

function crown(d, h, cause, contested){
  // 후계 → 군주
  d.heirs = d.heirs.filter(x=>x!==h);
  h.role='monarch';
  const old=d.monarch;
  d.monarch=h;
  h.age = Math.max(h.age, 14);
  // 즉위 감정
  feel(h, .5, -.1, -.1, .4);
  d.legitimacy = clamp(d.legitimacy + (contested?-.05:.08), .05, 1);
  // 영주들의 반응: 충성 재평가 (새 군주를 알지 못하면 충성 흔들림)
  for(const l of d.lords){
    let dl = (rnd()-.45)*.3;
    if(h.t.cunning>.6) dl += .05;
    if(h.t.cruelty>.7) dl -= .12;        // 잔혹한 새 군주엔 불안
    if(contested) dl -= .15;
    l.loyalty = clamp(l.loyalty + dl, .05, .99);
    feel(l, 0, contested?.2:0, 0, contested?-.1:.05);
  }
  // 즉위 발표
  const capRef = d.capital>=0? ref(d.capital):'';
  cellEls[d.capital] && cellEls[d.capital].classList.add('coro');
  if(d.capital>=0) setTimeout(()=>cellEls[d.capital]&&cellEls[d.capital].classList.remove('coro'),1500);
  logEvent(`<b>${h.name} ${h.epithet}</b>이(가) ${d.house}의 새 군주로 즉위했다. (제 ${d.generation}대)`,
    `=CROWN("${h.name}", 세대=${d.generation}, ${capRef})`, 'cor');
  // 새 후계 확보
  seedNewHeirs(d, h);
}

function seedNewHeirs(d, m){
  // 군주가 자녀(후계)를 둠 — 시간이 지나며 늘어남. 여기선 즉위 시 초기 보장.
  const want = 1 + ri(2);
  while(d.heirs.filter(h=>h.alive).length < want){
    const ch = makePerson(d, 'heir', m);
    ch.age = ri(6);
    d.heirs.push(ch); allPeople.set(ch.id, ch);
  }
}

function splinter(d, rebelHeir){
  // 패배한 후계가 영토 일부를 들고 독립 → 새 왕조 창발
  const half = d.arr.filter(()=>rnd()<.42);
  if(half.length<3){ rebelHeir.alive=false; return; }
  const nd = makeDynasty();
  // 본가 이름만 따서 분파명 — 무한 누적 방지 (읽기 쉽게)
  const root = d.house.split('계')[0];
  nd.house = root + '계 ' + rebelHeir.name.slice(0,2) + '파';
  nd.color = NAMES_FALLBACK_COLORS[colorIdx++ % NAMES_FALLBACK_COLORS.length];
  nd.founded=year; nd.generation=1; nd.legitimacy=.55;
  // 후계를 새 군주로
  nd.monarch = rebelHeir; rebelHeir.role='monarch'; rebelHeir.dyn=nd.id;
  nd.heirs=[]; nd.lords=[];
  allPeople.set(rebelHeir.id, rebelHeir);
  seedNewHeirs(nd, rebelHeir);
  let cap=-1;
  for(const i of half){ setCell(i, nd.id, cells[i].level, null, '분리독립'); if(cap<0)cap=i; }
  nd.capital = cap;
  dynasties.push(nd);
  // 숙적 관계
  d.rivalry[nd.id]=(d.rivalry[nd.id]||0)+5;
  nd.rivalry[d.id]=(nd.rivalry[d.id]||0)+5;
  logEvent(`<b>${rebelHeir.name}</b>이(가) 영토 ${half.length}칸을 들고 <b>${nd.house}</b>로 분리 독립했다!`,
    `=SECEDE("${nd.house}", 영토=${half.length})`, 'bet');
}

// ============================================================
//  반란 — 영주가 군주에게 등을 돌린다
// ============================================================
function lordRebel(d, lord, reason){
  // 영주의 관할 영토를 들고 떨어져 나감
  const owned = d.arr.filter(i=>cells[i].lord===lord.id);
  const seats = owned.length? owned : (lord.province!=null?[lord.province]:[]);
  if(!seats.length){ return; }
  d.lords=d.lords.filter(l=>l!==lord);
  // 충분히 크면 새 왕조, 작으면 무정부(반란셀)
  if(seats.length>=4 && lord.t.ambition>.4){
    const nd=makeDynasty();
    nd.house = lord.name.slice(0,2)+'국';
    nd.color=NAMES_FALLBACK_COLORS[colorIdx++ % NAMES_FALLBACK_COLORS.length];
    nd.monarch=lord; lord.role='monarch'; lord.dyn=nd.id; lord.loyalty=.8;
    nd.heirs=[]; nd.lords=[]; nd.founded=year; nd.legitimacy=.5;
    allPeople.set(lord.id, lord);
    seedNewHeirs(nd, lord);
    let cap=-1; for(const i of seats){ setCell(i, nd.id, cells[i].level, null, '반란 독립'); if(cap<0)cap=i; }
    nd.capital=cap; dynasties.push(nd);
    d.rivalry[nd.id]=(d.rivalry[nd.id]||0)+4; nd.rivalry[d.id]=(nd.rivalry[d.id]||0)+4;
    d.legitimacy=clamp(d.legitimacy-.12,.05,1);
    logEvent(`영주 <b>${lord.name} ${lord.epithet}</b>이(가) ${reason} ${d.house}에 반기를 들고 <b>${nd.house}</b>를 세웠다!`,
      `=REVOLT_LORD("${lord.name}", 영토=${seats.length})`, 'bet');
  } else {
    for(const i of seats){ revolt.set(i, 14); cells[i].unrest=1; dirty.add(i); }
    d.legitimacy=clamp(d.legitimacy-.06,.05,1);
    // 작은 봉기는 조용히 처리, 의미있는 규모만 연대기에 남김
    if(seats.length>=2 || rnd()<.25){
      logEvent(`영주 <b>${lord.name}</b>이(가) ${reason} 봉기했다. (${seats.length}칸 반란)`,
        `=UPRISING("${lord.name}", ${ref(seats[0])})`, 'war');
    }
  }
}

// ============================================================
//  사망 처리
// ============================================================
function killMonarch(d, cause, killerDynId){
  const m=d.monarch; if(!m) return;
  m.alive=false;
  obituaries.push({text:`${m.name} ${m.epithet} (${d.house} 제${d.generation}대, ${cause}, 서기 ${year}년)`});
  // 후계·영주에게 감정 파동
  for(const h of d.heirs){ feel(h, -.2, killerDynId!=null?.4:.1, .5, -.3);
    if(killerDynId!=null) remember(h, 'vendetta', killerDynId, -.8); }
  for(const l of d.lords){ feel(l, -.05, .1, .2, -.1); }
  logEvent(`<b>${d.house}</b>의 군주 <b>${m.name} ${m.epithet}</b>이(가) ${cause}(으)로 붕어했다.`,
    `=DEATH("${m.name}", 원인="${cause}", 서기${year})`, 'die');
  succession(d, cause);
}

// ============================================================
//  플레이어 개입 (엑셀 셀 클릭 + 툴버튼)
// ============================================================
let selected=-1;
let pendingTool=null; // 'edict' / 'assassin' / 'heir'

function describeCell(i){
  const c=cells[i];
  if(c.owner!==null){
    const d=dynById(c.owner);
    if(d){
      const lord = c.lord!=null ? allPeople.get(c.lord) : null;
      const lordTxt = lord && lord.alive ? `, 영주 ${lord.name}` : '';
      const cap = i===d.capital ? ' [수도]' : '';
      return {
        formula:`=TERRITORY("${d.house}", ${LV_LABEL[c.level]||'영토'}${cap}${lordTxt})`,
        dyn:d, lord
      };
    }
  }
  const t = c.st==='water'?'바다':c.st==='forest'?'숲':c.st==='mountain'?'산맥':c.st==='ruin'?'폐허':'무주공산';
  return {formula:`=HISTORY(${c.hist.map(x=>`"${x}"`).join(' → ')})`, dyn:null, lord:null, terrain:t};
}

sheet.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  if(selected>=0 && cellEls[selected]) cellEls[selected].classList.remove('sel');
  selected=+t.dataset.i; t.classList.add('sel');
  namebox.textContent=ref(selected);
  const info=describeCell(selected);

  if(pendingTool){
    handleTool(selected, info);
    pendingTool=null;
    document.querySelectorAll('#toolrow button').forEach(b=>b.style.outline='');
    sw.style.cursor='';
    return;
  }
  fmla.textContent = info.formula;
  showCard(selected, info, e);
});

function handleTool(i, info){
  const d=info.dyn;
  if(pendingTool==='edict'){
    if(!d){ flashStatus('칙령은 한 왕조의 영토를 선택해야 합니다.'); return; }
    const dir = chooseDirective(d);
    // 강제 칙령: 군주 분노↑ 흥분, 영주들 즉시 반응 평가
    feel(d.monarch, 0,.1,0,0);
    let obeyed=0, defied=0;
    for(const l of d.lords){ const r=lordObedience(l,d,dir);
      if(r==='obey')obeyed++; else if(r==='defy'||r==='revolt'){defied++; feel(l,0,.15,0,-.1);} }
    logEvent(`[칙령] ${d.house} 군주가 <b>${({expand:'영토 확장',fortify:'성채 강화',tax:'증세',muster:'징병 총동원'})[dir]}</b>을 명했다. (복종 ${obeyed} · 항명 ${defied})`,
      `=EDICT("${d.house}", "${dir}")`, defied>obeyed?'war':'cor');
  } else if(pendingTool==='assassin'){
    if(!d || !d.monarch){ flashStatus('암살 대상 군주가 있는 영토를 선택하세요.'); return; }
    const m=d.monarch;
    const ok = rnd() < (.45 + m.t.cunning*-.2 + (1-d.legitimacy)*.3);
    if(ok){
      flashWar(d.capital>=0?d.capital:i);
      killMonarch(d, '암살', null);
    } else {
      d.legitimacy=clamp(d.legitimacy+.05,0,1);
      feel(m,0,.5,0,-.2);
      logEvent(`${d.house} 군주 <b>${m.name}</b> 암살이 실패했다. 궁정이 발칵 뒤집혔다.`,
        `=ASSASSINATE("${m.name}", 결과="실패")`, 'war');
    }
  } else if(pendingTool==='heir'){
    if(!d){ flashStatus('후계를 지명할 왕조 영토를 선택하세요.'); return; }
    const elig=eligibleHeirs(d);
    if(!elig.length){ flashStatus('지명 가능한 성년 후계가 없습니다.'); return; }
    // 가장 약한 후계의 claim을 올려 인위적 지명 → 다른 후계 분노 (분쟁 씨앗)
    const target=pick(elig);
    target.claim=clamp(target.claim+.4,0,1);
    target.bribe+=20;
    for(const h of elig){ if(h!==target){ feel(h,-.1,.4,.1,-.3); remember(h,'rival',target.id,-.5);} }
    logEvent(`[지명] ${d.house} 군주가 <b>${target.name}</b>을(를) 후계로 지명했다. 다른 후계들이 술렁인다.`,
      `=NAME_HEIR("${target.name}")`, 'cor');
  }
}

let statusTimer=null;
function flashStatus(msg){
  const old=lastEventHTML;
  statusbar.querySelector('.flashmsg') && statusbar.querySelector('.flashmsg').remove();
  const span=document.createElement('span'); span.className='ev flashmsg'; span.style.color='#fff7d0';
  span.textContent=' ⚠ '+msg;
  statusbar.appendChild(span);
  clearTimeout(statusTimer);
  statusTimer=setTimeout(()=>span.remove(),2600);
}

// 인물 카드 팝업
function showCard(i, info, ev){
  const d=info.dyn;
  if(!d || !d.monarch){ card.style.display='none'; return; }
  const m=d.monarch;
  const subj = info.lord && info.lord.alive ? info.lord : m;
  const [moodName,,moodCol]=emoLabel(subj.emo);
  const t=subj.t;
  function barRow(lbl,v,c){ return `<div class="trow"><span>${lbl}</span><span class="bar"><i style="width:${(v*100)|0}%;background:${c}"></i></span></div>`; }
  let heirsHtml='';
  if(subj===m){
    const elig=d.heirs.filter(h=>h.alive);
    if(elig.length){
      heirsHtml='<div style="margin-top:6px"><b>후계</b> '+
        elig.map(h=>`${h.name}(${h.age}세${h.role==='pretender'?'·야심':''})`).join(', ')+'</div>';
    } else heirsHtml='<div style="margin-top:6px;color:#b00"><b>후사 없음 ⚠</b></div>';
  }
  let memHtml='';
  const grud = subj.memory.filter(mm=>mm.w<0);
  if(grud.length){
    memHtml='<div style="margin-top:5px" class="small">원한: '+
      grud.slice(-3).map(mm=>{ const od=dynById(mm.who); const op=allPeople.get(mm.who);
        return od?od.house: op?op.name : '?'; }).join(', ')+'</div>';
  }
  card.innerHTML =
    `<div class="ch" style="background:${d.color}">
       <span>${subj===m?'♛ ':'🛡 '}${subj.name} ${subj.epithet}</span>
       <span class="mood" style="background:${moodCol};margin-left:auto">${moodName}</span>
     </div>
     <div class="cb">
       <div class="small">${d.house} · ${subj===m?`제${d.generation}대 군주`:'영주'} · ${subj.age}세 · ${subj.sex==='f'?'여':'남'}</div>
       ${subj!==m?`<div class="small">충성도 ${(subj.loyalty*100|0)}%</div>`:`<div class="small">정통성 ${(d.legitimacy*100|0)}% · 국고 ${d.treasury|0}</div>`}
       ${barRow('야망',t.ambition,'#d97706')}
       ${barRow('잔혹',t.cruelty,'#dc2626')}
       ${barRow('교활',t.cunning,'#7c3aed')}
       ${barRow('용맹',t.valor,'#2563eb')}
       ${barRow('신앙',t.piety,'#0d9488')}
       ${heirsHtml}${memHtml}
     </div>`;
  card.style.display='block';
  // 위치
  const wrapRect=document.getElementById('app').getBoundingClientRect();
  let x=ev.clientX+12, y=ev.clientY+8;
  if(x+232>innerWidth) x=ev.clientX-242;
  if(y+200>innerHeight) y=innerHeight-210;
  card.style.left=Math.max(4,x)+'px'; card.style.top=Math.max(34,y)+'px';
}

function flashWar(i){ const el=cellEls[i]; if(!el)return; el.classList.add('war'); setTimeout(()=>el.classList.remove('war'),1300); }

// ============================================================
//  메인 틱 — 모든 에이전트가 판단하고 행동
// ============================================================
let tickN=0, warCool=0, paused=false;
const speeds=[ ['느림',230], ['보통',120], ['빠름',55] ]; let speedIx=1;
const PW=[0,30,120,420,1100,2600];

function tick(){
  if(paused) return;
  tickN++; year++;
  if(warCool>0) warCool--;

  // ---- 소유 재집계 ----
  for(const d of dynasties){ d.arr.length=0; d.size=0; d.pop=0; }
  let totalPop=0;
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin' && --c.ruinT<=0){ c.st='land'; dirty.add(i); }
    if(c.unrest>0) c.unrest=clamp(c.unrest-.02,0,1);
    if(c.owner!==null){
      const d=dynById(c.owner);
      if(d){ d.arr.push(i); d.size++; const p=PW[c.level]||0; d.pop+=p; totalPop+=p; }
      else { c.owner=null; c.level=0; c.lord=null; dirty.add(i); }
    }
  }

  // ---- 왕조 생애주기 ----
  for(let k=dynasties.length-1;k>=0;k--){
    const d=dynasties[k];
    if(d.size===0){
      obituaries.push({text:`${d.house} (서기 ${year}년 멸망, ${d.generation}대로 단절)`});
      logEvent(`<b>${d.house} 가문</b>이 역사에서 사라졌다.`, `=COLLAPSE("${d.house}", 서기${year})`, 'die');
      dynasties.splice(k,1); continue;
    }
    if(d.capital>=0 && cells[d.capital].owner!==d.id){
      // 수도 함락 → 새 수도(가장 발전한 칸)
      let best=-1,bl=-1; for(const i of d.arr){ if(cells[i].level>bl){bl=cells[i].level;best=i;} }
      d.capital=best;
    }
    // 공위기(interregnum) 수습 — 땅은 있는데 군주가 없으면 누군가 옹립된다
    if(!d.monarch && d.size>0){
      const heir=d.heirs.find(h=>h.alive && h.age>=12);
      const lord=d.lords.filter(l=>l.alive).sort((a,b)=>b.t.ambition-a.t.ambition)[0];
      if(heir){ crown(d, heir, '공위기 수습', d.heirs.filter(h=>h.alive&&h.age>=12).length>1); }
      else if(lord && lord.t.ambition>.35){
        d.lords=d.lords.filter(l=>l!==lord); lord.role='monarch'; d.monarch=lord;
        d.legitimacy=clamp(d.legitimacy-.2,.05,1); seedNewHeirs(d, lord);
        logEvent(`공위기 끝에 영주 <b>${lord.name} ${lord.epithet}</b>이(가) ${d.house}의 왕좌를 차지했다.`,
          `=INTERREGNUM_END("${lord.name}")`, 'bet');
      } else {
        // 옹립할 자가 없다 — 평민 출신 자칭왕(창발)
        const usurp=makePerson(d,'monarch',null); usurp.age=26+ri(20);
        usurp.name='자칭 '+usurp.name; d.monarch=usurp; allPeople.set(usurp.id,usurp);
        d.legitimacy=clamp(d.legitimacy-.3,.05,1); seedNewHeirs(d, usurp);
        logEvent(`혼란 속에 <b>${usurp.name}</b>이(가) ${d.house}의 왕을 자처했다. (정통성 붕괴)`,
          `=PRETENDER_KING("${usurp.name}")`, 'bet');
      }
    }
  }

  // ---- 노화·자연사·인물 성장 ----
  if(tickN%2===0){
    for(const d of dynasties){
      const m=d.monarch;
      if(m){ m.age += 1;
        // 감정 자연 감쇠 (시간이 약)
        m.emo.anger*=.97; m.emo.grief*=.95; m.emo.joy=clamp(m.emo.joy*.99,.15,1);
        // 고령 자연사 위험
        const deathP = m.age>54 ? (m.age-54)*.016 : 0;
        if(rnd()<deathP){ killMonarch(d,'노환',null); continue; }
        // 후계 출산 (혈통 잇기)
        if(m.age<52 && rnd()<.06 && d.heirs.filter(h=>h.alive).length<5){
          const ch=makePerson(d,'heir',m); ch.age=0; d.heirs.push(ch); allPeople.set(ch.id,ch);
        }
      }
      for(const h of d.heirs){ if(h.alive){ h.age+=1; h.emo.anger*=.97; h.emo.grief*=.96; } }
      for(const l of d.lords){ if(l.alive){ l.age+=1; l.emo.anger*=.97;
        if(l.age>60 && rnd()<.02){ l.alive=false; } } }
      d.lords=d.lords.filter(l=>l.alive);
    }
  }

  // ---- 화재 ----
  for(const [i,t] of [...fires]){
    if(rnd()<.12){ for(const n of nbrs(i)){ const c=cells[n]; if(c.owner!==null&&!fires.has(n)&&c.st==='land'){fires.set(n,5);dirty.add(n);} } }
    if(t<=1){ fires.delete(i); const c=cells[i]; c.owner=null;c.level=0;c.lord=null;c.st='ruin';c.ruinT=180;
      c.hist.push('잿더미'); if(c.hist.length>8)c.hist.shift(); dirty.add(i);
    } else fires.set(i,t-1);
  }
  // ---- 역병 ----
  if(plague.size){
    for(const [i,t] of [...plague]){
      if(rnd()<.16){ for(const n of nbrs(i)){ if(cells[n].owner!==null&&!plague.has(n)){plague.set(n,11);dirty.add(n);} } }
      if(rnd()<.22){ const c=cells[i]; c.level--; if(c.level<=0){c.owner=null;c.level=0;c.lord=null;c.hist.push('역병으로 소멸');if(c.hist.length>8)c.hist.shift();} dirty.add(i); }
      if(t<=1){plague.delete(i);dirty.add(i);} else plague.set(i,t-1);
    }
    if(plague.size===0) logEvent('역병이 물러갔다.', '=PLAGUE.END()','');
  }
  // ---- 반란 셀 ----
  for(const [i,t] of [...revolt]){
    if(t<=1){ revolt.delete(i); const c=cells[i]; // 진압되거나 무주공산
      if(rnd()<.5){ c.owner=null;c.level=Math.max(0,c.level-1);c.lord=null; c.hist.push('진압'); }
      else { c.hist.push('해방구'); c.owner=null; c.level=Math.max(0,c.level-1); c.lord=null; }
      if(c.hist.length>8)c.hist.shift(); dirty.add(i);
    } else revolt.set(i,t-1);
  }

  // ---- 왕조 행동: 칙령 → 영주 해석 → 행동 (창발 위계) ----
  for(const d of dynasties){
    if(d.golden>0) d.golden--;
    if(d.size===0 || !d.monarch) continue;
    ensureLords(d);
    d.treasury += d.size*0.05;

    const directive = chooseDirective(d);
    const m=d.monarch;

    // 영주별 해석 → 항명/반란 평가 (드물게 트리거)
    if(tickN%3===0){
      for(const l of [...d.lords]){
        if(!l.alive) continue;
        const reaction=lordObedience(l, d, directive);
        if(reaction==='embezzle'){ d.treasury -= 2; feel(l,.05,0,0,.05); }
        else if(reaction==='defy'){ l.loyalty=clamp(l.loyalty-.02,.05,1); }
        else if(reaction==='revolt'){
          // 반란 발생 — 야망·분노·낮은 정통성이 합쳐질 때
          if(l.t.ambition*.5 + l.emo.anger*.4 + (1-d.legitimacy)*.4 > .55 && rnd()<.4){
            const reason = l.emo.anger>.5?'쌓인 분노로':'정통성이 흔들린 틈을 타';
            lordRebel(d, l, reason);
          }
        } else if(reaction==='obey'){ feel(l,.02,0,0,.03); l.loyalty=clamp(l.loyalty+.005,0,.99); }
      }
    }

    // 영토 행동량은 칙령에 따라 다름
    const baseA = 1 + (d.size*.06|0);
    let expandN=baseA, devN=1+(d.size*.05|0), fortify=0;
    if(directive==='fortify'){ devN+=2; expandN=Math.max(1,expandN-1); }
    if(directive==='muster'){ expandN+=2; }
    if(directive==='tax'){ d.treasury += d.size*0.15; // 증세 → 민심 악화
      for(const i of d.arr){ if(rnd()<.05){ cells[i].unrest=clamp(cells[i].unrest+.2,0,1); dirty.add(i);} } }

    // 확장 / 전쟁
    for(let a=0;a<expandN;a++){
      const src=pick(d.arr); if(src===undefined||cells[src].owner!==d.id) continue;
      const nb=nbrs(src); const tgt=pick(nb); const tc=cells[tgt];
      if(tc.st==='water'||tc.st==='mountain'||fires.has(tgt)||revolt.has(tgt)) continue;
      if(tc.owner===null){
        if(tc.st==='forest'){ if(rnd()<.25){ tc.st='land'; setCell(tgt,d.id,1,null,'개간'); } }
        else if(tc.st==='land') setCell(tgt,d.id,1,null,'개척지');
      } else if(tc.owner!==d.id){
        const od=dynById(tc.owner);
        // 전쟁 의지: 군주 용맹/분노 + 숙적관계 + 칙령
        let willing = m.t.valor*.5 + m.emo.anger*.4 + (d.rivalry[tc.owner]||0)*.03;
        // 군주가 상대 왕조에 원한(복수) 기억이 있나
        willing += -grudge(m, tc.owner)*.5;
        if(directive==='muster') willing+=.3;
        if(rnd()<clamp(willing,.05,.85)*.45){
          const att=1+rnd(3)+d.size*.002+(d.golden?1:0)+m.t.valor;
          const def=tc.level+1+rnd(3)+ (od?od.legitimacy:0);
          flashWar(tgt);
          if(att>def){
            if(rnd()<.28){ fires.set(tgt,5); tc.hist.push('전화(戰火)'); if(tc.hist.length>8)tc.hist.shift(); dirty.add(tgt); }
            else setCell(tgt,d.id,Math.max(1,tc.level-1),null,'점령됨');
            d.rivalry[tc.owner]=(d.rivalry[tc.owner]||0)+1;
            if(od) od.rivalry[d.id]=(od.rivalry[d.id]||0)+1;
            // 군주 감정: 정복의 기쁨
            feel(m,.08,-.05,0,.05);
            if(od && od.monarch) feel(od.monarch,-.04,.1,.05,-.05), remember(od.monarch,'vendetta',d.id,-.3);
            if((tc.level>=4||warCool===0)&&od){
              logEvent(`<b>${d.house}</b>이(가) <b>${od.house}</b>의 ${LV_LABEL[Math.max(1,tc.level)]||'영토'}(${ref(tgt)})를 공격했다.`,
                `=WAR("${d.house}"→"${od.house}", ${ref(tgt)})`, 'war');
              warCool=34;
            }
          } else {
            feel(m,-.03,.08,0,-.03); // 패전 분노
          }
        }
      }
    }

    // 발전 (성장 — 황금기/국고로 가속)
    const gmul = (d.golden?3:1) * (d.treasury>20?1.3:.8);
    for(let u=0;u<devN;u++){
      const i=pick(d.arr); if(i===undefined||cells[i].owner!==d.id) continue;
      const c=cells[i];
      if(c.level<5 && rnd()<.05*gmul){
        c.level++; d.treasury-=c.level*1.5;
        c.hist.push(LV_LABEL[c.level]); if(c.hist.length>8)c.hist.shift(); dirty.add(i);
        if(c.level===5 && i!==d.capital){ d.capital=i; }
        if(c.level>=4 && warCool===0){
          logEvent(`<b>${d.house}</b>의 ${ref(i)}에 ${LV_LABEL[c.level]}이(가) 세워졌다.`,
            `=CITY("${d.house}", "${LV_LABEL[c.level]}", ${ref(i)})`, 'cor');
          warCool=20;
        }
      }
    }

    // 정통성 자연 회복/침식
    d.legitimacy = clamp(d.legitimacy + (d.golden?.004:0) - (directive==='tax'?.002:0) + .0008, .05, 1);
  }

  // ---- 무작위 거대 사건 ----
  const r=rnd();
  if(!plague.size && r<.004){
    const big=cells.map((c,i)=>({c,i})).filter(o=>o.c.owner!==null&&o.c.level>=3);
    if(big.length){ const o=pick(big); plague.set(o.i,11); dirty.add(o.i);
      logEvent(`${ref(o.i)}에서 역병이 창궐했다.`, `=PLAGUE(${ref(o.i)})`, 'die'); }
  } else if(r>.997 && dynasties.length){
    const d=pick(dynasties);
    if(d.monarch){ d.golden=90; feel(d.monarch,.4,-.2,-.1,.4);
      logEvent(`<b>${d.house}</b>의 황금기가 시작됐다. (${d.monarch.name}의 치세)`,
        `=GOLDEN_AGE("${d.house}", 90)`, 'cor'); }
  } else if(r>.9945 && r<=.997){
    const towns=cells.map((c,i)=>({c,i})).filter(o=>o.c.owner!==null&&o.c.level>=2);
    if(towns.length){ const o=pick(towns); fires.set(o.i,6); dirty.add(o.i);
      logEvent(`${ref(o.i)}에 대화재가 발생했다.`, `=FIRE(${ref(o.i)})`, 'war'); }
  } else if(r>.991 && r<=.9945){
    // 궁정 음모 — pretender가 군주를 노린다
    const d=pick(dynasties);
    if(d){ const pre=d.heirs.find(h=>h.alive && (h.role==='pretender'||h.t.ambition>.7) && h.age>=14);
      if(pre && d.monarch){
        const ok = pre.t.cunning>rnd() && rnd()<.4;
        if(ok){ killMonarch(d,`${pre.name}의 음모`,null); }
        else { feel(d.monarch,0,.4,0,-.1); pre.claim=clamp(pre.claim-.2,0,1);
          if(d.monarch.t.cruelty>.5 && rnd()<.5){ pre.alive=false;
            obituaries.push({text:`${pre.name} (모반 실패·처형, 서기 ${year}년)`});
            logEvent(`${d.house} 군주가 모반한 후계 <b>${pre.name}</b>을(를) 처형했다.`,`=PURGE("${pre.name}")`,'die');
          } else logEvent(`${d.house}에서 ${pre.name}의 모반이 발각됐다.`,`=PLOT_FOILED("${pre.name}")`,'bet');
        }
      }
    }
  } else if(r>.989 && r<=.991){
    // 창발 동맹: 공동의 적을 둔 두 왕조
    if(dynasties.length>=3){
      const a=pick(dynasties), b=pick(dynasties);
      if(a!==b){ const commonFoe = Object.keys(a.rivalry).find(k=>b.rivalry[k]>2 && a.rivalry[k]>2);
        if(commonFoe){ a.rivalry[b.id]=Math.min(0,(a.rivalry[b.id]||0)-3); b.rivalry[a.id]=Math.min(0,(b.rivalry[a.id]||0)-3);
          const cf=dynById(+commonFoe);
          logEvent(`<b>${a.house}</b>와(과) <b>${b.house}</b>이(가) ${cf?cf.house:'공동의 적'}에 맞서 동맹을 맺었다.`,
            `=ALLY("${a.house}", "${b.house}")`, 'cor'); } }
    }
  }
  // 신생 왕조 도래 (세계가 비면)
  if(dynasties.length<3 && rnd()<.012 && dynasties.length<8){
    const d=spawnDynasty(false);
    if(d) logEvent(`바다 건너에서 <b>${d.house} 가문</b>이 도래했다.`, `=MIGRATE("${d.house}")`, '');
  }

  // ---- 그리기 ----
  for(const i of dirty) paint(i);
  dirty.clear();

  // ---- 상태바 ----
  statusbar.innerHTML =
    `준비<span class="sep">|</span>서기 ${year}년<span class="sep">|</span>`+
    `세계 인구 ${totalPop.toLocaleString()}명<span class="sep">|</span>`+
    `왕조 ${dynasties.length}<span class="sep">|</span>`+
    `<span class="ev ${chronicle.length?chronicle[chronicle.length-1].cls:''}">${lastEventHTML}</span>`;

  document.getElementById('genpill').textContent =
    '세대 '+ (dynasties.length? Math.max(...dynasties.map(d=>d.generation)) : '—');
  document.getElementById('tab-dead').textContent = `멸망기록 (${obituaries.length})`;

  if(tickN%7===0){ document.getElementById('title').textContent=`왕조.xlsx - Excel (서기 ${year}년)`; renderSide(); }
}

// ============================================================
//  사이드/시트 패널 렌더
// ============================================================
let sideTab='dyn';
function renderSide(){
  if(sideTab==='dyn'){
    let h='';
    const sorted=[...dynasties].sort((a,b)=>b.size-a.size);
    for(const d of sorted){
      const m=d.monarch;
      const [mn,,mc]= m? emoLabel(m.emo):['—',0,'#999'];
      const elig=d.heirs.filter(x=>x.alive);
      h+=`<div class="dyn" data-dyn="${d.id}">
        <div class="nm"><span class="sw" style="background:${d.color}"></span>${d.house}${d.golden?' ✦':''}</div>
        <div class="king">${m?`♛ ${m.name} ${m.epithet} <span class="mood" style="background:${mc}">${mn}</span>`:'<span style="color:#b00">군주 공석</span>'}</div>
        <div class="small">제${d.generation}대 · 영토 ${d.size}칸 · 영주 ${d.lords.filter(l=>l.alive).length} · 후계 ${elig.length}</div>
        <div class="small">정통성</div><div class="bar"><i style="width:${d.legitimacy*100|0}%;background:${d.legitimacy<.4?'#dc2626':'#107c41'}"></i></div>
      </div>`;
    }
    if(!sorted.length) h='<div class="small">생존 왕조 없음.</div>';
    sidebody.innerHTML=h;
  } else if(sideTab==='chr'){
    let h='';
    for(const e of chronicle.slice(-70).reverse())
      h+=`<div class="ev ${e.cls}"><span class="yr">[${e.year}]</span> ${e.text}</div>`;
    sidebody.innerHTML = h || '<div class="small">아직 기록이 없습니다.</div>';
  } else {
    let h=`<h4>멸망·붕어 기록 (${obituaries.length})</h4>`;
    for(const o of obituaries.slice(-60).reverse()) h+=`<div class="dead">† ${o.text}</div>`;
    if(!obituaries.length) h+='<div class="small">아직 사라진 자가 없습니다.</div>';
    sidebody.innerHTML=h;
  }
}
// 사이드 탭
document.getElementById('sidetabs').addEventListener('click',e=>{
  const t=e.target.closest('[data-st]'); if(!t)return;
  sideTab=t.dataset.st;
  document.querySelectorAll('#sidetabs div').forEach(x=>x.classList.toggle('on',x===t));
  renderSide();
});
// 사이드 왕조 클릭 → 수도로 스크롤 + 선택
sidebody.addEventListener('click',e=>{
  const t=e.target.closest('[data-dyn]'); if(!t)return;
  const d=dynById(+t.dataset.dyn); if(!d||d.capital<0)return;
  const el=cellEls[d.capital]; if(!el)return;
  if(selected>=0&&cellEls[selected])cellEls[selected].classList.remove('sel');
  selected=d.capital; el.classList.add('sel'); namebox.textContent=ref(selected);
  el.scrollIntoView({block:'center',inline:'center',behavior:'smooth'});
  fmla.textContent=describeCell(selected).formula;
});
// 하단 시트 탭 = 사이드 탭과 연동 (모바일 대응)
document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('[data-st]'); if(!t)return;
  document.querySelectorAll('#tabs div').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  sideTab=t.dataset.st;
  document.querySelectorAll('#sidetabs div').forEach(x=>x.classList.toggle('on',x.dataset.st===sideTab));
  // 모바일: 사이드가 숨겨져 있으면 임시로 띄움
  const side=document.getElementById('side');
  if(getComputedStyle(side).display==='none'){
    side.style.display='flex'; side.style.position='absolute'; side.style.right='0'; side.style.top='0';
    side.style.bottom='49px'; side.style.zIndex='30'; side.style.width='80%'; side.style.minWidth='0';
    side.style.boxShadow='-4px 0 18px rgba(0,0,0,.3)';
    side._mobileOpen=true;
  } else if(side._mobileOpen){
    side.style.display='none'; side._mobileOpen=false;
    document.querySelector('#tabs div').classList.add('on'); t.classList.remove('on');
  }
  renderSide();
});

// ============================================================
//  툴버튼
// ============================================================
document.getElementById('btnPause').addEventListener('click',function(){
  paused=!paused; this.textContent= paused?'▶ 재생':'⏸ 일시정지';
});
document.getElementById('btnSpeed').addEventListener('click',function(){
  speedIx=(speedIx+1)%speeds.length; this.textContent='속도 ▸ '+speeds[speedIx][0];
  restartTimer();
});
function armTool(name,btn){
  pendingTool=name;
  document.querySelectorAll('#toolrow button').forEach(b=>b.style.outline='');
  btn.style.outline='2px solid #107c41';
  sw.style.cursor='crosshair';
  flashStatus('지도에서 대상 왕조의 영토 셀을 클릭하세요.');
}
document.getElementById('btnEdict').addEventListener('click',function(){armTool('edict',this);});
document.getElementById('btnAssassin').addEventListener('click',function(){armTool('assassin',this);});
document.getElementById('btnHeir').addEventListener('click',function(){armTool('heir',this);});

// ============================================================
//  범례
// ============================================================
legend.innerHTML=
  `<h4>범례</h4>`+
  `<div><span class="k">♛</span>수도</div>`+
  `<div><span class="k" style="color:#548235">木</span>숲 <span class="k" style="color:#a89878">峰</span>산</div>`+
  `<div><span class="k" style="color:#9dc3e6">≈</span>바다 <span class="k" style="color:#999">墟</span>폐허</div>`+
  `<div><span class="k" style="color:#b35900">叛</span>반란 <span class="k" style="color:#c00">火</span>화재</div>`+
  `<div><span class="k" style="color:#7030a0">疫</span>역병</div>`+
  `<div class="small" style="margin-top:3px">셀 클릭=인물·역사</div>`;

// ============================================================
//  타이머
// ============================================================
let timer=null;
function restartTimer(){ clearInterval(timer); timer=setInterval(tick, speeds[speedIx][1]); }

// ============================================================
//  부팅
// ============================================================
function boot(){
  buildTerrain();
  buildSheetDOM();
  for(let i=0;i<N;i++) paint(i);
  fmla.textContent=`=SIM.DYNASTY($A$1:$${colName(COLS-1)}$${ROWS}, "왕조는 흥하고 망한다")`;
  spawnDynasty(true); spawnDynasty(true); spawnDynasty(true);
  renderSide();
  statusbar.innerHTML=`준비<span class="sep">|</span>서기 0년<span class="sep">|</span><span class="ev">천지가 창조되고, 첫 왕조들이 일어섰다.</span>`;
  restartTimer();
}
boot();

// 리사이즈 시 그리드만 재계산 (시뮬 상태 유지하지 않고 재부팅 — 단순/안정 우선)
let rzT=null;
addEventListener('resize',()=>{
  clearTimeout(rzT);
  rzT=setTimeout(()=>{
    const nd=calcDims();
    if(nd.cols!==COLS||nd.rows!==ROWS){
      COLS=nd.cols; ROWS=nd.rows; N=COLS*ROWS;
      clearInterval(timer);
      // 상태 리셋(재부팅) — 새 차원에서 새 역사
      dynasties=[]; DID=0; PID=1; colorIdx=0; allPeople.clear();
      chronicle.length=0; obituaries.length=0;
      plague.clear(); fires.clear(); revolt.clear(); dirty.clear();
      year=0; tickN=0; warCool=0; selected=-1; paused=false;
      document.getElementById('btnPause').textContent='⏸ 일시정지';
      boot();
    }
  },350);
});

// 디버그용 (자가검증에서 접근)
window.__SIM = { get year(){return year;}, get dynasties(){return dynasties;},
  get chronicle(){return chronicle;}, get obituaries(){return obituaries;}, tick };
})();
</script>
