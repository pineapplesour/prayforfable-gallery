<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>음모.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-text-size-adjust:100%;
    -webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;flex:0 0 auto;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px;white-space:nowrap}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px;flex:0 0 auto}
  #namebox{width:64px;min-width:64px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;font-size:11px}
  #fx{width:26px;min-width:26px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #main{flex:1 1 auto;display:flex;min-height:0;position:relative}
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1 1 auto;min-width:0}
  #sheet{display:grid;background:#fff;position:absolute;top:0;left:0}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:10px}
  .cell{border-right:1px solid #e8e8e8;border-bottom:1px solid #e8e8e8;
    display:flex;align-items:center;justify-content:center;font-size:11px;position:relative;
    overflow:hidden;cursor:cell}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:3}
  .cap{position:absolute;top:0;right:1px;font-size:8px;line-height:8px;color:#b8860b}
  .spy{position:absolute;bottom:0;left:1px;font-size:8px;line-height:8px}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #ff2d2d}50%{box-shadow:inset 0 0 0 2px #ffd0d0}}
  .war{animation:warf .3s 4}
  @keyframes coupf{0%,100%{box-shadow:inset 0 0 0 2px #7c3aed}50%{box-shadow:inset 0 0 0 2px #d9c2ff}}
  .coup{animation:coupf .28s 6}
  #sidebar{width:264px;min-width:264px;background:#fbfbfa;border-left:1px solid #ddd;
    display:flex;flex-direction:column;overflow:hidden;flex:0 0 auto}
  #sbhead{padding:6px 9px;font-size:11px;font-weight:700;color:#107c41;border-bottom:1px solid #e6e6e6;
    background:#f3f7f4;display:flex;justify-content:space-between;align-items:center}
  #sbhead .yr{color:#888;font-weight:400}
  #sbbody{flex:1;overflow-y:auto;padding:4px 0;font-size:11px;line-height:1.45}
  .fac{padding:5px 9px;border-bottom:1px solid #f0f0f0;cursor:pointer}
  .fac:hover{background:#f0f6f1}
  .fac .nm{font-weight:700;display:flex;align-items:center;gap:5px}
  .fac .sw{width:9px;height:9px;border-radius:2px;display:inline-block;flex:0 0 auto}
  .fac .ld{color:#555;font-size:10px;margin-top:1px}
  .fac .st{color:#888;font-size:10px;margin-top:1px;display:flex;flex-wrap:wrap;gap:0 7px}
  .fac .moodbar{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:3px;background:#eee}
  .fac .moodbar i{display:block;height:100%}
  .badge{font-size:9px;padding:0 4px;border-radius:3px;color:#fff;margin-left:3px;font-weight:600}
  #ticker{height:26px;background:#1b1b1b;color:#d9ffe9;display:flex;align-items:center;
    padding:0 12px;font-size:11px;flex:0 0 auto;overflow:hidden;white-space:nowrap;font-family:Consolas,monospace}
  #ticker b{color:#ffd866;font-weight:600}
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11px;flex:0 0 auto;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 8px;opacity:.5}
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:20px;
    border-top:1px solid #d4d4d4;font-size:11px;flex:0 0 auto;overflow-x:auto}
  #tabs div{padding:3px 11px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap;flex:0 0 auto}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  /* 시트 오버레이 (연대기/멸망/첩보/음모) */
  #docview{position:absolute;inset:0;background:#fff;z-index:6;display:none;flex-direction:column}
  #docview.show{display:flex}
  #dochead{padding:8px 14px;border-bottom:1px solid #e1e1e1;font-weight:700;color:#107c41;font-size:13px;
    display:flex;justify-content:space-between;align-items:center}
  #docclose{cursor:pointer;color:#888;font-weight:400;font-size:11px}
  #docbody{flex:1;overflow-y:auto;padding:6px 14px;font-size:11.5px;line-height:1.6}
  .drow{padding:3px 0;border-bottom:1px solid #f3f3f3;display:flex;gap:8px}
  .drow .yc{color:#107c41;font-family:Consolas,monospace;min-width:74px;flex:0 0 auto;font-size:10.5px}
  .drow .tx{flex:1}
  .drow .fm{color:#999;font-family:Consolas,monospace;font-size:10px;margin-top:1px}
  .tag{font-size:9px;padding:0 4px;border-radius:3px;color:#fff;margin-right:4px;font-weight:600;vertical-align:1px}
  .tip{position:absolute;background:#222;color:#eee;font-size:10.5px;padding:7px 9px;border-radius:5px;
    max-width:230px;line-height:1.5;z-index:20;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.35);display:none}
  /* 모바일 */
  @media (max-width:760px){
    #sidebar{position:absolute;right:0;top:0;bottom:0;z-index:8;width:84%;min-width:0;
      box-shadow:-3px 0 14px rgba(0,0,0,.25);transform:translateX(100%);transition:transform .2s}
    #sidebar.open{transform:translateX(0)}
    #menubar i:nth-child(n+5){display:none}
    #sbtoggle{display:flex !important}
  }
  #sbtoggle{display:none;position:absolute;right:8px;top:8px;z-index:9;background:#107c41;color:#fff;
    border:none;border-radius:5px;padding:5px 9px;font-size:11px;align-items:center;gap:4px}
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <span>음모.xlsx — Excel · 그림자 내각 시뮬레이션</span>
  </div>
  <div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
  <div id="fbar">
    <div id="namebox">A1</div>
    <div id="fx">fx</div>
    <div id="formula"></div>
  </div>
  <div id="main">
    <div id="sheetwrap">
      <div id="sheet"></div>
      <div id="docview">
        <div id="dochead"><span id="doctitle"></span><span id="docclose">✕ Sheet1로</span></div>
        <div id="docbody"></div>
      </div>
      <button id="sbtoggle">내각 ☰</button>
    </div>
    <div id="sidebar">
      <div id="sbhead"><span>그림자 내각 — 세력 현황</span><span class="yr" id="yrlab"></span></div>
      <div id="sbbody"></div>
    </div>
  </div>
  <div id="ticker"></div>
  <div id="statusbar"></div>
  <div id="tabs">
    <div class="on" data-tab="sheet">Sheet1</div>
    <div data-tab="chron">연대기</div>
    <div data-tab="spy">첩보망 (0)</div>
    <div data-tab="plot">음모 (0)</div>
    <div data-tab="dead">멸망기록 (0)</div>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
(() => {
"use strict";
// ============================================================
//  음모.xlsx — 엑셀로 위장한 창발적 AI 문명/첩보 시뮬레이션
//  핵심: 각 인물이 자율 에이전트(성격·감정·기억·목표).
//        지도자→하위 관료의 다층 지휘체계. 명령 해석·항명·배신.
//        희노애락이 사건에서 동적 창발. 스파이·음모·쿠데타가
//        규칙이 아니라 에이전트 상호작용에서 자연 발생.
// ============================================================
const rand = Math.random;
function ri(n){return rand()*n|0;}
function pick(a){return a[ri(a.length)];}
function clamp(v,lo,hi){return v<lo?lo:v>hi?hi:v;}
function chance(p){return rand()<p;}

// ---------- 그리드 치수 ----------
const sheetwrap=document.getElementById('sheetwrap');
function calcDims(){
  const w=sheetwrap.clientWidth, h=sheetwrap.clientHeight;
  const mobile=window.innerWidth<=760;
  const CW=mobile?26:30, CH=mobile?20:22;
  const COLS=clamp(Math.floor((w-50)/CW),12,40);
  const ROWS=clamp(Math.floor((h-4)/CH),12,30);
  return {CW,CH,COLS,ROWS};
}
let {CW,CH,COLS,ROWS}=calcDims();
let N=COLS*ROWS;

const sheet=document.getElementById('sheet');
const fmla=document.getElementById('formula');
const namebox=document.getElementById('namebox');
const statusbar=document.getElementById('statusbar');
const ticker=document.getElementById('ticker');
const sbbody=document.getElementById('sbbody');
const yrlab=document.getElementById('yrlab');
const tip=document.getElementById('tip');

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(Math.floor(i/COLS)+1);}

// ---------- 셀 DOM 빌드 ----------
let cellEls=[];
function buildGrid(){
  sheet.style.gridTemplateColumns=`44px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows=CH+'px';
  sheet.innerHTML='';
  cellEls=new Array(N);
  const frag=document.createDocumentFragment();
  const corner=document.createElement('div');corner.className='hd';frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const e=document.createElement('div');e.className='hd';e.textContent=colName(c);frag.appendChild(e);}
  for(let r=0;r<ROWS;r++){
    const rh=document.createElement('div');rh.className='hd';rh.textContent=r+1;frag.appendChild(rh);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d;frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

function nbrs(i){
  const x=i%COLS,y=i/COLS|0,out=[];
  if(x>0)out.push(i-1);
  if(x<COLS-1)out.push(i+1);
  if(y>0)out.push(i-COLS);
  if(y<ROWS-1)out.push(i+COLS);
  return out;
}

// ---------- 지형 (value noise) ----------
let cells=[];
function genTerrain(){
  const GW=8,GH=6,gz=[];
  for(let i=0;i<GW*GH;i++)gz[i]=rand();
  function noise(x,y){
    const fx=x/COLS*(GW-1),fy=y/ROWS*(GH-1);
    const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
    const a=gz[y0*GW+x0],b=gz[y0*GW+Math.min(GW-1,x0+1)];
    const c=gz[Math.min(GH-1,y0+1)*GW+x0],d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
    return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
  }
  cells=new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS,y=i/COLS|0;
    const v=noise(x,y)+(rand()-.5)*.14;
    let st='land';
    if(v<.30)st='water';
    else if(v>.64&&chance(.65))st='forest';
    else if(v>.80&&chance(.5))st='mountain';
    cells[i]={st,owner:null,level:0,hist:[st==='water'?'바다':st==='forest'?'숲':st==='mountain'?'산맥':'황무지'],
      ruinT:0,unrest:0,spy:null,capital:false};
  }
}

// ============================================================
//  에이전트 모델 — 자율 인물
// ============================================================
const SURNAMES=['카르','벨','드라','이즈','하룬','센','모르','발','테오','지안','오를','카심','류','네바','솔'];
const GIVEN=['단','리스','마르','텐','샤','케온','벨라','로엔','지','파엘','노아','시르','베크','루','한','미라','오시','칸','레프','유'];
function personName(){return pick(SURNAMES)+pick(GIVEN);}

const ROLES={LEADER:'지도자',MARSHAL:'대장군',SPYMASTER:'첩보장',TREASURER:'재상',GOVERNOR:'태수'};
const ROLE_FX={LEADER:'RULE',MARSHAL:'WAR',SPYMASTER:'ESPIONAGE',TREASURER:'TREASURY',GOVERNOR:'GOVERN'};

let agentSeq=0;
function makeAgent(role,facId){
  // 성격: 5축 — 야망/충성/편집증/탐욕/교활. 0~1
  const a={
    id:agentSeq++, name:personName(), role, facId, alive:true,
    ambition:clamp(rand()*.7+(role==='LEADER'?.15:0),0,1),
    loyalty:clamp(rand()*.6+.35,0,1),
    paranoia:rand()*.7,
    greed:rand(),
    cunning:rand(),
    // 감정(희노애락) — 사건에서 동적으로 변함
    joy:.25,anger:.1,sorrow:.1,fear:.1,
    mem:[],            // 기억: {who, what, weight, year}
    plotId:null,       // 가담 음모
    power:role==='LEADER'?1:rand()*.4, // 내부 권력기반
    suspectScore:0,    // 지도자가 의심하는 정도
    years:0
  };
  return a;
}
function emoLabel(a){
  const m=Math.max(a.joy,a.anger,a.sorrow,a.fear);
  if(m<.2)return '평온';
  if(m===a.anger)return '분노';
  if(m===a.fear)return '공포';
  if(m===a.sorrow)return '비탄';
  return '환희';
}
function emoColor(a){
  const m=Math.max(a.joy,a.anger,a.sorrow,a.fear);
  if(m<.2)return '#9aa';
  if(m===a.anger)return '#dc2626';
  if(m===a.fear)return '#7c3aed';
  if(m===a.sorrow)return '#2563eb';
  return '#d97706';
}
// 기억 기록 — 인물 간 감정 부채/원한
function remember(a,who,what,weight){
  a.mem.push({who,what,weight,year});
  if(a.mem.length>8)a.mem.shift();
}
function grudgeToward(a,whoId){
  let g=0;for(const m of a.mem)if(m.who===whoId)g+=m.weight;return g;
}
// 감정 감쇠
function decayEmotion(a){
  a.joy*=.97;a.anger*=.95;a.sorrow*=.96;a.fear*=.94;
}

// ============================================================
//  세력
// ============================================================
const FNAMES=['북부 왕국','붉은 제국','해안 연맹','유목 칸국','삼나무 공화국','잿빛 교단','동방 상단','검은 강 부족','여명 왕조','소금 사막 민족','은빛 산악국','심연 신정국'];
const FCOLORS=['#2563eb','#dc2626','#059669','#7c3aed','#d97706','#0d9488','#be185d','#4d7c0f','#9333ea','#b45309','#475569','#0e7490'];
let usedNames=new Set();
let factions=[];
let agents=[];          // 모든 살아있는 에이전트
const obituaries=[];    // 멸망기록
const chronicle=[];     // 연대기 {year,text,fm,tag}
const spyLog=[];        // 첩보망 로그
const plots=[];         // 활성 음모 {id,facId,leaderAgent,members[],strength,target,exposure,born}
let plotSeq=0;

let year=1, tickN=0, pop=0, lastMsg='태초의 혼돈에서 정치가 태동했다.';
const dirty=new Set();
let selected=-1, paused=false, speed=110;

const LV_TXT=['','·','田','邑','城','京'];
const LV_LABEL=['','개척지','농장','읍락','성읍','수도'];
const PW=[0,30,120,400,1000,2400];

function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function facById(id){return factions.find(f=>f.id===id);}
function agentById(id){return agents.find(a=>a.id===id);}
function facAgents(fid){return agents.filter(a=>a.facId===fid&&a.alive);}
function leaderOf(fid){return agents.find(a=>a.facId===fid&&a.role==='LEADER'&&a.alive);}

function spawnFaction(originLabel){
  let idx=-1;
  for(let t=0;t<FNAMES.length;t++){if(!usedNames.has(t)){idx=t;break;}}
  if(idx<0)idx=ri(FNAMES.length);
  usedNames.add(idx);
  const f={id:factions.length?Math.max(...factions.map(x=>x.id))+1:0,
    name:FNAMES[idx],color:FCOLORS[idx%FCOLORS.length],nameIdx:idx,
    size:0,arr:[],golden:0,treasury:50,stability:.7,capitalIdx:-1,
    purges:0,coups:0,wars:0,born:year};
  // 본거지
  let cap=-1;
  for(let t=0;t<400;t++){const i=ri(N);if(cells[i].st==='land'&&cells[i].owner===null){cap=i;break;}}
  if(cap<0)return null;
  setCell(cap,f.id,4,'개국'); cells[cap].capital=true; f.capitalIdx=cap;
  for(const n of nbrs(cap)){if(cells[n].st!=='water'&&cells[n].owner===null)setCell(n,f.id,1,'개척지');}
  factions.push(f);
  // 내각 구성 — 자율 에이전트
  agents.push(makeAgent('LEADER',f.id));
  agents.push(makeAgent('MARSHAL',f.id));
  agents.push(makeAgent('SPYMASTER',f.id));
  agents.push(makeAgent('TREASURER',f.id));
  agents.push(makeAgent('GOVERNOR',f.id));
  const ld=leaderOf(f.id);
  logChron(`${f.name} 건국. ${ld.name}이(가) 옥좌에 올랐다.`,`=FOUND("${f.name}", 지도자="${ld.name}", ${ref(cap)})`,'state');
  return f;
}

function setCell(i,owner,level,histLabel){
  const c=cells[i];
  c.owner=owner;c.level=level;c.st='land';
  if(histLabel){c.hist.push(histLabel);if(c.hist.length>7)c.hist.shift();}
  dirty.add(i);
}

// ============================================================
//  렌더링
// ============================================================
function paint(i){
  const c=cells[i],el=cellEls[i];if(!el)return;
  let bg='',tx='',col='#222',w='';
  if(c.st==='water'){bg='#dceaf7';tx='≈';col='#9dc3e6';}
  else if(c.st==='mountain'){bg='#efece6';tx='▲';col='#a89a86';}
  else if(c.st==='forest'){bg='#e6f1de';tx='木';col='#69934a';}
  else if(c.st==='ruin'){bg='#ededed';tx='墟';col='#aaa';}
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      bg=hexA(f.color,.12+c.level*.15);
      tx=LV_TXT[c.level];col=f.color;w=c.level>=4?'700':'';
      if(c.unrest>0.55){bg=hexA('#dc2626',.18+c.level*.08);}
    }
  }
  el.style.background=bg;el.style.color=col;el.style.fontWeight=w;
  // 본문 + 표식 (수도 ♔, 스파이 잠입)
  let extra='';
  if(c.capital&&c.owner!==null)extra+='<span class="cap">♔</span>';
  if(c.spy!==null){const sf=facById(c.spy);extra+=`<span class="spy" style="color:${sf?sf.color:'#000'}">◈</span>`;}
  el.innerHTML=tx+extra;
}
function flash(i,cls){
  const el=cellEls[i];if(!el)return;
  el.classList.add(cls);
  setTimeout(()=>el.classList.remove(cls),cls==='coup'?1700:1200);
}

function logChron(text,fm,tag){
  lastMsg=text;
  chronicle.push({year,text,fm:fm||'',tag:tag||'event'});
  if(chronicle.length>600)chronicle.shift();
  if(fm)fmla.textContent=fm;
}
function logSpy(text,fm){
  spyLog.push({year,text,fm:fm||''});
  if(spyLog.length>200)spyLog.shift();
  document.querySelector('#tabs [data-tab="spy"]').textContent=`첩보망 (${spyLog.length})`;
}

// ============================================================
//  ★ 에이전트 의사결정 — 자율 판단의 핵심
//  지도자가 명령을 내리고, 하위 관료가 자기 성격·감정·기억으로
//  해석하여 복종/태업/횡령/항명/배신을 스스로 선택한다.
// ============================================================

// 관료가 지도자 명령에 얼마나 협조할지 — 충성/감정/원한의 함수
function obedience(agent,leader){
  let o=agent.loyalty;
  o-=agent.anger*.5;
  o-=agent.ambition*.25;
  o-=agent.fear*.15;          // 공포는 양면적
  o+=agent.joy*.3;
  o-=grudgeToward(agent,leader.id)*.06;
  // 의심받는 관료는 더 멀어진다
  o-=agent.suspectScore*.15;
  return clamp(o,0,1);
}

// 지도자가 내각에 명령을 하달 — 명령 종류는 세력 상황에서 창발
function leaderIssueOrder(f){
  const ld=leaderOf(f.id);if(!ld)return;
  ld.years++;
  // 지도자 성격이 국정 기조를 결정
  let order;
  if(f.stability<.4||ld.paranoia>.6&&chance(.4))order='PURGE';      // 불안→숙청
  else if(f.treasury<15&&chance(.6))order='TAX';                     // 빈곤→증세
  else if(f.size>3&&ld.ambition>.5&&chance(.45))order='CONQUER';     // 야망→정복
  else if(chance(.35))order='ESPIONAGE';                             // 첩보
  else order='DEVELOP';                                              // 내치

  // 각 관료가 명령을 자기 식으로 해석
  for(const ag of facAgents(f.id)){
    if(ag.role==='LEADER')continue;
    const ob=obedience(ag,ld);
    handleOrder(f,ld,ag,order,ob);
  }
}

function handleOrder(f,ld,ag,order,ob){
  // 항명: 충성 낮고 분노 높으면 명령 무시 + 원한 누적
  if(ob<.25&&chance(.5-ob)){
    remember(ag,ld.id,'굴욕적 명령',.6);
    ag.anger=clamp(ag.anger+.12,0,1);
    if(chance(.35)){
      logChron(`${roleName(ag)} ${ag.name}이(가) ${ld.name}의 ${orderName(order)} 명령을 거부했다.`,
        `=DEFY("${ag.name}", 명령="${orderName(order)}", 복종도=${ob.toFixed(2)})`,'intrigue');
      ld.anger=clamp(ld.anger+.15,0,1);
      ag.suspectScore=clamp(ag.suspectScore+.3,0,1);
    }
    return;
  }
  // 정상 수행 (단, 탐욕 높은 관료는 횡령)
  switch(order){
    case 'TAX':
      f.treasury+=Math.round(8*ob);
      if(ag.role==='TREASURER'&&ag.greed>.55&&chance(ag.greed)){
        const skim=Math.round(6*ag.greed);
        f.treasury=Math.max(0,f.treasury-skim);ag.power=clamp(ag.power+.05,0,1);
        ag.joy=clamp(ag.joy+.08,0,1);
        remember(ag,ld.id,'국고 횡령 은닉',.3);
        if(chance(.3))logChron(`재상 ${ag.name}이(가) 세수를 빼돌렸다는 소문이 돈다.`,
          `=EMBEZZLE("${ag.name}", 금액=${skim})`,'intrigue');
      }
      break;
    case 'PURGE':
      // 숙청은 처형장에서 별도 처리(아래 doPurge), 여기선 공포 전파
      ag.fear=clamp(ag.fear+.18*(1-ob),0,1);
      break;
    case 'CONQUER':
      if(ag.role==='MARSHAL'){f._wantWar=2+(ob*4|0);}
      break;
    case 'ESPIONAGE':
      if(ag.role==='SPYMASTER'){f._wantSpy=1+(ob*ag.cunning*3|0);}
      break;
    case 'DEVELOP':
      f._wantDev=2+(ob*4|0);
      f.stability=clamp(f.stability+.01*ob,0,1);
      break;
  }
  // 명령을 잘 수행하면 약간의 만족·신뢰
  if(ob>.6){ag.joy=clamp(ag.joy+.02,0,1);ag.suspectScore=clamp(ag.suspectScore-.04,0,1);}
}
function roleName(a){return ROLES[a.role];}
function orderName(o){return {PURGE:'숙청',TAX:'증세',CONQUER:'정복',ESPIONAGE:'첩보',DEVELOP:'내치'}[o];}

// ---------- 숙청: 지도자의 편집증 × 의심 점수 ----------
function doPurge(f){
  const ld=leaderOf(f.id);if(!ld)return;
  // 가장 의심스러운 관료를 고름 (편집증이 높으면 무고한 자도)
  const pool=facAgents(f.id).filter(a=>a.role!=='LEADER');
  if(!pool.length)return;
  pool.sort((a,b)=>(b.suspectScore+b.ambition*ld.paranoia)-(a.suspectScore+a.ambition*ld.paranoia));
  const victim=pool[0];
  const guilty=victim.plotId!==null;               // 실제 음모 가담자인가
  const innocent=victim.suspectScore<.3&&!guilty;  // 무고한가
  killAgent(victim,`숙청 (${ld.name})`);
  f.purges++;
  f.treasury+=4;
  // 공포가 내각 전체에 퍼진다 → 충성 흔들림, 이탈 욕구
  for(const a of facAgents(f.id)){
    if(a.role==='LEADER')continue;
    a.fear=clamp(a.fear+.22,0,1);
    a.loyalty=clamp(a.loyalty-(innocent?.12:.04),0,1);
    if(innocent)remember(a,ld.id,'무고한 동료 처형',.5);
  }
  f.stability=clamp(f.stability+(guilty?.05:-.1),0,1);   // 무고한 숙청은 정권을 좀먹는다
  logChron(`${ld.name}이(가) ${roleName(victim)} ${victim.name}을(를) 숙청했다. `+
    (guilty?'(역모 가담자였다)':innocent?'(무고한 충신이었다)':'(의심받던 자였다)'),
    `=PURGE("${ld.name}"→"${victim.name}", 죄목=${guilty?'역모':'의심'})`,'intrigue');
}

function killAgent(a,cause){
  a.alive=false;
  // 음모에서 제거
  if(a.plotId!==null){
    const p=plots.find(p=>p.id===a.plotId);
    if(p){p.members=p.members.filter(m=>m!==a.id);if(p.leaderAgent===a.id)dissolvePlot(p,'주모자 사망');}
  }
  agents=agents.filter(x=>x!==a||x.alive);
}

// ============================================================
//  ★ 음모 — 야망/저충성/분노 관료가 자발적으로 모의
//  대본 없음: 감정·기억·권력기반이 임계점을 넘으면 창발.
// ============================================================
function conspiracyDrive(a,ld){
  // 음모 가담 욕구: 야망↑ 충성↓ 분노↑ 지도자에 대한 원한↑
  return clamp(a.ambition*.6 + a.anger*.5 + (1-a.loyalty)*.5
    + grudgeToward(a,ld?ld.id:-1)*.04 + a.cunning*.15 - a.fear*.3, 0, 2);
}
function maybeFormPlot(f){
  const ld=leaderOf(f.id);if(!ld)return;
  const officials=facAgents(f.id).filter(a=>a.role!=='LEADER'&&a.plotId===null);
  for(const a of officials){
    const drive=conspiracyDrive(a,ld);
    if(drive>.75&&chance(.10*(drive-.6))){
      // 새 음모 결성 — 주모자
      const p={id:plotSeq++,facId:f.id,leaderAgent:a.id,members:[a.id],
        strength:a.power+a.cunning*.3,target:ld.id,exposure:0,born:year,
        goal:a.ambition>.55?'COUP':'SECEDE'};   // 초기 성향(거사 시 권력비로 재결정)
      a.plotId=p.id;plots.push(p);
      a.joy=clamp(a.joy+.1,0,1);
      logChron(`${roleName(a)} ${a.name}이(가) 은밀히 ${ld.name}에 대한 음모를 꾸미기 시작했다.`,
        `=CONSPIRE("${a.name}", 목표=${p.goal==='COUP'?'쿠데타':'분리독립'}, 동기=${(drive).toFixed(2)})`,'plot');
      updatePlotTab();
      break;
    }
  }
}
function plotRecruit(p){
  const f=facById(p.facId);if(!f)return;
  const ld=leaderOf(p.facId);
  const leader=agentById(p.leaderAgent);if(!leader)return;
  const cand=facAgents(p.facId).filter(a=>a.role!=='LEADER'&&a.plotId===null&&a.id!==p.leaderAgent);
  for(const a of cand){
    const drive=conspiracyDrive(a,ld);
    // 같은 원한을 공유하면 포섭 확률↑. 단 충성파/공포에 질린 자는 밀고 위험.
    if(drive>.7&&chance(.16*(leader.cunning+.3)*drive)){
      a.plotId=p.id;p.members.push(a.id);p.strength+=a.power*.7+a.cunning*.2;
      a.joy=clamp(a.joy+.06,0,1);
      logSpy(`음모 #${p.id}: ${roleName(a)} ${a.name} 포섭됨 (세력 ${p.strength.toFixed(2)})`,
        `=RECRUIT(plot#${p.id}, "${a.name}")`);
      updatePlotTab();
    } else if(a.loyalty>.7&&a.fear<.4&&chance(.06)){
      // 충신이 음모를 눈치채고 지도자에게 밀고 → 발각도 상승
      p.exposure=clamp(p.exposure+.25,0,1);
      remember(ld,p.leaderAgent,'역모 첩보',.4);
      logSpy(`충신 ${a.name}이(가) 음모 #${p.id}의 낌새를 ${ld.name}에게 밀고했다.`,
        `=INFORM("${a.name}", plot#${p.id}, 발각=${p.exposure.toFixed(2)})`);
    }
  }
}
function dissolvePlot(p,reason){
  for(const id of p.members){const a=agentById(id);if(a){a.plotId=null;a.fear=clamp(a.fear+.2,0,1);}}
  const idx=plots.indexOf(p);if(idx>=0)plots.splice(idx,1);
  updatePlotTab();
}
function updatePlotTab(){
  document.querySelector('#tabs [data-tab="plot"]').textContent=`음모 (${plots.length})`;
}

// 음모 진행: 발각되면 숙청, 무르익으면 쿠데타 실행
function advancePlot(p){
  const f=facById(p.facId);if(!f){dissolvePlot(p,'세력 소멸');return;}
  const ld=leaderOf(p.facId);if(!ld){dissolvePlot(p,'표적 부재');return;}
  const leader=agentById(p.leaderAgent);
  if(!leader||!leader.alive){dissolvePlot(p,'주모자 제거');return;}
  // 시간이 갈수록 발각 위험 — 지도자 편집증 + 첩보장 충성도
  const sm=facAgents(p.facId).find(a=>a.role==='SPYMASTER'&&a.plotId===null);
  let exposeRate=.006+ld.paranoia*.014+(sm?sm.loyalty*.01:0)-leader.cunning*.012;
  p.exposure=clamp(p.exposure+Math.max(0,exposeRate),0,1);

  // 발각 → 지도자 반응 (숙청)
  if(p.exposure>.78&&chance(.22)){
    // 주모자와 핵심 가담자 체포·처형
    const caught=p.members.slice();
    let executed=0;
    for(const id of caught){
      const a=agentById(id);
      if(a&&chance(.7+ld.paranoia*.2)){killAgent(a,'역모죄 처형');executed++;}
      else if(a){a.plotId=null;a.fear=1;a.anger=clamp(a.anger+.2,0,1);remember(a,ld.id,'동료를 잃음',.6);}
    }
    f.purges++;f.stability=clamp(f.stability+.1,0,1);
    logChron(`${ld.name}이(가) 음모 #${p.id}를 적발, 가담자 ${executed}명을 처형했다.`,
      `=EXPOSE.PLOT("${ld.name}", plot#${p.id}, 처형=${executed})`,'intrigue');
    dissolvePlot(p,'발각');
    return;
  }
  // 무르익음 → 쿠데타/분리독립 결행
  // 세력이 충분하거나, 발각이 임박해 더 못 기다릴 때 결행 (단독 거사도 가능)
  const matured=p.members.length>=2 && p.strength>0.8+ld.power*.3 && year-p.born>10;
  const desperate=p.exposure>.55 && year-p.born>6;     // 발각 직전, 죽기 전에 던진다
  if((matured&&chance(.14)) || (desperate&&chance(.22))){
    executeCoup(f,p,ld,leader);
  }
}

// ---------- 쿠데타 결행 ----------
function executeCoup(f,p,ld,leader){
  f.coups++;
  // 충성 근위대 = 음모 비가담 + 충성 높은 관료
  const loyalists=facAgents(f.id).filter(a=>a.plotId===null&&a.role!=='LEADER');
  // 친위대: 충성×권력. 단 공포에 질린 자는 결정적 순간 등을 돌린다(방어력 감소).
  const loyalPow=ld.power*(1-ld.fear*.4)+loyalists.reduce((s,a)=>s+a.power*a.loyalty*(1-a.fear*.5),0)+f.stability*.6;
  // 반란군: 음모 세력 + 가담자 권력 + 기습 보너스(주모자 교활 → 허를 찌름)
  const surprise=1+leader.cunning*.6;
  const rebelPow=(p.strength+p.members.reduce((s,id)=>{const a=agentById(id);return s+(a?a.power:0);},0))*surprise;
  flash(f.capitalIdx>=0?f.capitalIdx:p.born,'coup');
  const win=rebelPow*( .7+rand()*.7) > loyalPow*(.6+rand()*.6);

  // ★거사 방식 재결정 — 권력비로 창발:
  //  강하면 옥좌 도전(쿠데타), 약하면 영토 들고 분리독립.
  //  단 야망이 극에 달한 주모자는 약해도 옥좌에 모든 걸 건다.
  const canSeize = rebelPow > loyalPow*0.75;
  const slotsFull = usedNames.size>=FNAMES.length;
  let goal = p.goal;
  if(canSeize || slotsFull || leader.ambition>0.78) goal='COUP';
  else if(rebelPow < loyalPow*0.45 || f.size<4) goal='SECEDE';
  p.goal=goal;

  if(goal==='COUP'&&win){
    // 지도자 시해, 주모자 즉위
    logChron(`★ 쿠데타 성공! ${leader.name}이(가) ${ld.name}을(를) 시해하고 ${f.name}의 새 지도자가 되었다.`,
      `=COUP.SUCCESS("${leader.name}"→"${ld.name}", 반란=${rebelPow.toFixed(2)} vs 친위=${loyalPow.toFixed(2)})`,'coup');
    killAgent(ld,'시해');
    leader.role='LEADER';leader.power=1;leader.joy=1;leader.ambition=clamp(leader.ambition-.2,0,1);
    leader.plotId=null;
    // 공범들 논공행상
    for(const id of p.members){const a=agentById(id);if(a&&a!==leader){a.plotId=null;a.power=clamp(a.power+.2,0,1);a.joy=clamp(a.joy+.3,0,1);a.loyalty=clamp(a.loyalty+.2,0,1);}}
    // 잔존 충신들은 공포 + 잠재적 반동
    for(const a of loyalists){a.fear=clamp(a.fear+.3,0,1);a.sorrow=clamp(a.sorrow+.2,0,1);remember(a,leader.id,'주군을 잃음',.7);}
    f.stability=clamp(.4+rand()*.2,0,1);
    dissolvePlot(p,'정권 장악');
  } else if(goal==='COUP'&&!win){
    // 실패 — 주모자 처형, 대숙청, 공포정치
    logChron(`☓ ${leader.name}의 쿠데타가 진압되었다. ${ld.name}이(가) 피의 숙청을 단행했다.`,
      `=COUP.FAIL("${leader.name}", 반란=${rebelPow.toFixed(2)} vs 친위=${loyalPow.toFixed(2)})`,'coup');
    for(const id of p.members){const a=agentById(id);if(a)killAgent(a,'반역 처형');}
    ld.paranoia=clamp(ld.paranoia+.3,0,1);ld.anger=clamp(ld.anger+.4,0,1);
    f.purges+=2;f.stability=clamp(f.stability-.28,0,1);   // 거사의 충격으로 정권이 흔들린다
    for(const a of facAgents(f.id)){if(a.role!=='LEADER'){a.fear=1;a.loyalty=clamp(a.loyalty-.1,0,1);}}
    dissolvePlot(p,'진압');
  } else {
    // 분리독립 — 영토 일부가 떨어져 나가 새 세력
    secede(f,p,leader);
  }
}

// ---------- 분리독립: 음모단이 영토를 들고 독립 ----------
function secede(f,p,leader){
  if(usedNames.size>=FNAMES.length){dissolvePlot(p,'독립 무산');return;}
  // 새 세력
  let idx=-1;for(let t=0;t<FNAMES.length;t++)if(!usedNames.has(t)){idx=t;break;}
  if(idx<0){dissolvePlot(p,'독립 무산');return;}
  usedNames.add(idx);
  const nf={id:Math.max(...factions.map(x=>x.id))+1,name:FNAMES[idx],color:FCOLORS[idx%FCOLORS.length],
    nameIdx:idx,size:0,arr:[],golden:0,treasury:20,stability:.6,capitalIdx:-1,purges:0,coups:0,wars:0,born:year};
  factions.push(nf);
  // f 영토의 변두리 절반을 가져온다
  const owned=cells.map((c,i)=>i).filter(i=>cells[i].owner===f.id);
  owned.sort(()=>rand()-.5);
  const take=owned.slice(0,Math.max(1,owned.length>>1));
  let capSet=false;
  for(const i of take){
    cells[i].owner=nf.id;cells[i].capital=false;
    cells[i].hist.push('분리독립');if(cells[i].hist.length>7)cells[i].hist.shift();
    if(!capSet&&cells[i].level>=3){cells[i].capital=true;nf.capitalIdx=i;capSet=true;}
    dirty.add(i);
  }
  if(!capSet&&take.length){cells[take[0]].capital=true;cells[take[0]].level=Math.max(3,cells[take[0]].level);nf.capitalIdx=take[0];}
  // 음모단이 새 내각이 됨
  leader.facId=nf.id;leader.role='LEADER';leader.power=1;leader.plotId=null;leader.joy=1;
  for(const id of p.members){const a=agentById(id);if(a&&a!==leader){a.facId=nf.id;a.plotId=null;a.joy=clamp(a.joy+.2,0,1);}}
  // 빈 역할 보충
  const have=new Set(facAgents(nf.id).map(a=>a.role));
  for(const r of ['MARSHAL','SPYMASTER','TREASURER','GOVERNOR'])if(!have.has(r))agents.push(makeAgent(r,nf.id));
  const have2=new Set(facAgents(f.id).map(a=>a.role));
  for(const r of ['LEADER','MARSHAL','SPYMASTER','TREASURER','GOVERNOR'])if(!have2.has(r))agents.push(makeAgent(r,f.id));
  f.stability=clamp(f.stability-.2,0,1);
  logChron(`★ ${leader.name}이(가) ${f.name}에서 영토를 들고 독립, ${nf.name}을(를) 세웠다.`,
    `=SECEDE("${leader.name}", 모국="${f.name}"→"${nf.name}", 영토=${take.length})`,'coup');
  dissolvePlot(p,'독립 달성');
}

// ============================================================
//  ★ 첩보전 — 첩보장이 적국에 스파이 침투
// ============================================================
function runEspionage(f){
  const sm=facAgents(f.id).find(a=>a.role==='SPYMASTER');
  if(!sm)return;
  const enemies=factions.filter(o=>o.id!==f.id&&o.size>0);
  if(!enemies.length)return;
  const target=pick(enemies);
  // 침투 지점: 적 영토(가능하면 수도)
  const tcells=cells.map((c,i)=>i).filter(i=>cells[i].owner===target.id&&cells[i].spy===null);
  if(!tcells.length)return;
  tcells.sort((a,b)=>cells[b].level-cells[a].level);
  const site=chance(.5)?tcells[0]:pick(tcells);
  cells[site].spy=f.id;dirty.add(site);
  const mission=pick(['STEAL','SOW','ASSASSIN','FRAME']);
  const ok=chance(.35+sm.cunning*.4);
  if(!ok){
    // 발각 — 첩보장 평판 손상, 외교 악화
    cells[site].spy=null;dirty.add(site);
    sm.fear=clamp(sm.fear+.1,0,1);
    logSpy(`${f.name}의 첩자가 ${target.name} ${ref(site)}에서 발각, 처형됨.`,
      `=SPY.CAUGHT("${f.name}"→"${target.name}", ${ref(site)})`);
    return;
  }
  switch(mission){
    case 'STEAL':
      f.treasury+=10;target.treasury=Math.max(0,target.treasury-8);
      logSpy(`${f.name} 첩자가 ${target.name}의 국고·기밀을 탈취했다. (${ref(site)})`,
        `=ESPIONAGE.STEAL("${f.name}"→"${target.name}", ${ref(site)})`);
      break;
    case 'SOW':{
      // 이간질: 적국 관료 1명의 충성을 떨어뜨리고 분노 주입 → 내부 음모 촉발
      const v=pick(facAgents(target.id).filter(a=>a.role!=='LEADER'));
      if(v){v.loyalty=clamp(v.loyalty-.18,0,1);v.anger=clamp(v.anger+.2,0,1);
        remember(v,leaderOf(target.id)?.id,'유포된 모함',.3);
        logSpy(`${f.name}이(가) ${target.name} 조정에 이간계를 심었다 — ${roleName(v)} ${v.name} 동요.`,
          `=ESPIONAGE.SOW("${f.name}"→"${target.name}", 표적="${v.name}")`);}
      break;}
    case 'ASSASSIN':{
      const v=pick(facAgents(target.id).filter(a=>a.role!=='LEADER'||chance(.3)));
      if(v){
        const wasLeader=v.role==='LEADER';
        killAgent(v,'암살');
        if(wasLeader)promoteSuccessor(target);
        target.stability=clamp(target.stability-.12,0,1);
        logSpy(`${f.name}의 자객이 ${target.name}의 ${roleName(v)} ${v.name}을(를) 암살했다.`+(wasLeader?' (지도자 공석!)':''),
          `=ASSASSINATE("${f.name}"→"${v.name}", 직위=${roleName(v)})`);
      }
      break;}
    case 'FRAME':{
      // 무고: 적국 충신을 역모로 모함 → 지도자가 숙청하게 유도
      const v=pick(facAgents(target.id).filter(a=>a.role!=='LEADER'&&a.loyalty>.5));
      if(v){v.suspectScore=clamp(v.suspectScore+.5,0,1);
        const ld=leaderOf(target.id);if(ld)remember(ld,v.id,'(거짓) 역모 정황',.5);
        logSpy(`${f.name}이(가) ${target.name}의 충신 ${v.name}을(를) 역모죄로 모함했다.`,
          `=FRAME("${f.name}"→"${v.name}", 무고)`);}
      break;}
  }
  // 임무 후 일정 확률로 철수(셀에서 제거)
  if(chance(.5)){cells[site].spy=null;dirty.add(site);}
}
function promoteSuccessor(f){
  const pool=facAgents(f.id).filter(a=>a.role!=='LEADER');
  if(!pool.length)return;
  // 권력·야망 높은 자가 계승 (계승 분쟁의 씨앗)
  pool.sort((a,b)=>(b.power+b.ambition)-(a.power+a.ambition));
  const s=pool[0];s.role='LEADER';s.power=1;s.joy=clamp(s.joy+.3,0,1);
  logChron(`${f.name}의 ${s.name}이(가) 공석이 된 옥좌를 차지했다.`,
    `=SUCCEED("${f.name}", 신임="${s.name}")`,'state');
}

// ============================================================
//  영토 시뮬 (전쟁·확장·발전) — 명령이 정한 의도로 구동
// ============================================================
let warCD=0;
function territoryStep(f){
  f.arr=cells.map((c,i)=>i).filter(i=>cells[i].owner===f.id);
  f.size=f.arr.length;
  if(!f.size)return;
  if(f.golden>0)f.golden--;

  // 발전 (내치 의도 + 황금기)
  const devWant=(f._wantDev||1)+(f.golden?3:0);
  for(let u=0;u<devWant;u++){
    const i=pick(f.arr);if(cells[i].owner!==f.id)continue;
    const c=cells[i];
    if(c.level<5&&chance(.05*(f.golden?2:1)*(f.stability+.3))){
      c.level++;c.hist.push(LV_LABEL[c.level]);if(c.hist.length>7)c.hist.shift();dirty.add(i);
      if(c.level>=4&&warCD<=0){logChron(`${f.name}의 ${ref(i)}에 ${LV_LABEL[c.level]}이(가) 번성했다.`,
        `=GROW("${f.name}", ${ref(i)}, ${LV_LABEL[c.level]})`,'event');warCD=30;}
    }
  }
  // 확장 + 전쟁 (정복 의도)
  const expWant=1+(f.size*.06|0)+(f._wantWar||0);
  for(let a=0;a<expWant;a++){
    const src=pick(f.arr);if(cells[src].owner!==f.id)continue;
    const tgt=pick(nbrs(src));const tc=cells[tgt];
    if(tc.st==='water')continue;
    if(tc.owner===null){
      if(tc.st==='mountain'){if(chance(.12)){tc.st='land';setCell(tgt,f.id,1,'개척');}}
      else if(tc.st==='forest'){if(chance(.25)){tc.st='land';setCell(tgt,f.id,1,'개간');}}
      else setCell(tgt,f.id,1,'개척지');
    } else if(tc.owner!==f.id&&(f._wantWar||chance(.18))){
      const dm=leaderOf(f.id);const em=leaderOf(tc.owner);
      const att=1+rand()*3+f.size*.002+(f.golden?1:0)+(dm?dm.anger:0);
      const def=tc.level+1+rand()*3+(em?em.fear:0)*.5;
      flash(tgt,'war');f.wars++;
      if(att>def){
        const defF=facById(tc.owner);
        if(chance(.25)){cells[tgt].owner=null;cells[tgt].level=0;cells[tgt].st='ruin';cells[tgt].ruinT=180;cells[tgt].capital=false;cells[tgt].hist.push('전화');dirty.add(tgt);}
        else setCell(tgt,f.id,Math.max(1,tc.level-1),'점령');
        if((tc.level>=3||warCD<=0)&&defF){
          logChron(`${f.name}이(가) ${defF.name}의 ${ref(tgt)}을(를) 함락했다.`,
            `=WAR("${f.name}"→"${defF.name}", ${ref(tgt)})`,'war');warCD=22;
        }
      }
    }
  }
  f._wantWar=0;f._wantSpy=0;f._wantDev=0;
}

// ============================================================
//  메인 틱
// ============================================================
function tick(){
  if(paused)return;
  tickN++;year++;
  if(warCD>0)warCD--;
  pop=0;

  // 폐허 복구 / 소유 정리
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin'&&--c.ruinT<=0){c.st='land';dirty.add(i);}
    if(c.owner!==null){const f=facById(c.owner);if(f)pop+=PW[c.level];else{c.owner=null;c.level=0;c.capital=false;c.spy=null;dirty.add(i);}}
    if(c.unrest>0)c.unrest=clamp(c.unrest-.01,0,1);
  }

  // 에이전트 감정 감쇠 + 나이
  for(const a of agents){decayEmotion(a);a.years++;}

  // 멸망 판정
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    f.arr=cells.map((c,i)=>i).filter(i=>cells[i].owner===f.id);
    f.size=f.arr.length;
    if(f.size===0){
      const ld=leaderOf(f.id);
      obituaries.push({name:f.name,year,born:f.born,coups:f.coups,purges:f.purges,
        cause:f.coups>1?'끝없는 내분':f.purges>4?'공포정치의 자멸':'외세의 정복'});
      logChron(`${f.name}이(가) 역사에서 소멸했다. (존속 ${year-f.born}년)`,
        `=COLLAPSE("${f.name}", 멸망=${year}, 쿠데타=${f.coups}, 숙청=${f.purges})`,'state');
      agents=agents.filter(a=>a.facId!==f.id);
      plots.filter(p=>p.facId===f.id).forEach(p=>dissolvePlot(p,'세력 소멸'));
      usedNames.delete(f.nameIdx);
      factions.splice(k,1);
    }
  }
  document.querySelector('#tabs [data-tab="dead"]').textContent=`멸망기록 (${obituaries.length})`;

  // 세력별: 지도자 통치 → 음모 → 첩보 → 영토
  for(const f of factions){
    if(f.size===0)continue;
    f.treasury=clamp(f.treasury-f.size*.04,0,9999);
    // 지도자 명령 하달 (가끔)
    if(chance(.5))leaderIssueOrder(f);
    // 숙청 명령이 떴으면 실행
    const ld=leaderOf(f.id);
    if(ld&&(f.stability<.35||ld.paranoia>.65)&&chance(.04+ld.paranoia*.05))doPurge(f);
    // 음모 결성/포섭/진행
    if(chance(.5))maybeFormPlot(f);
    // 첩보 임무
    if((f._wantSpy>0||chance(.05))&&chance(.5))runEspionage(f);
    // 영토
    territoryStep(f);
    // 안정도 자연 변동: 공포·음모·숙청 누적이 국가를 좀먹는다
    const fear=avgFear(f.id);
    const ld2=leaderOf(f.id);
    const tyranny=ld2?ld2.paranoia*.006:0;          // 폭정은 서서히 국가를 갉아먹음
    f.stability=clamp(f.stability+( .003 - fear*.02 - plotsIn(f.id)*.018 - tyranny ),0,1);
    if(f.stability<.25){
      // 민란: 안정도가 낮을수록 여러 영토가 동시에 불온해진다
      const cs=f.arr;
      const waves=1+Math.round((.25-f.stability)*12);
      for(let w=0;w<waves&&cs.length;w++){
        const i=pick(cs);cells[i].unrest=clamp(cells[i].unrest+.35,0,1);dirty.add(i);
        if(cells[i].unrest>.8&&chance(.4)){
          cells[i].owner=null;cells[i].level=0;cells[i].capital=false;cells[i].st='ruin';cells[i].ruinT=120;
          cells[i].hist.push('민란');dirty.add(i);
        }
      }
      // ★국가 붕괴: 극도의 불안 + 소규모 → 내전으로 와해 (멸망 경로)
      if(f.stability<.12&&f.size<=5&&chance(.10+(.12-f.stability))){
        for(const i of f.arr){
          cells[i].owner=null;cells[i].level=0;cells[i].capital=false;
          cells[i].st=chance(.6)?'ruin':'land';cells[i].ruinT=100;
          cells[i].hist.push('내전 와해');dirty.add(i);
        }
        logChron(`${f.name}이(가) 끝없는 내분 끝에 내전으로 와해되었다.`,
          `=CIVIL.WAR.COLLAPSE("${f.name}", 안정=${(f.stability*100|0)}%)`,'coup');
      }
    }
  }
  // 음모 진행은 세력 루프 밖에서 (안정적 순회)
  for(const p of plots.slice()){plotRecruit(p);advancePlot(p);}

  // 무작위 거시 사건
  const r=rand();
  if(r<.004&&factions.length){
    const f=pick(factions);f.golden=80;
    const ld=leaderOf(f.id);if(ld)ld.joy=1;
    for(const a of facAgents(f.id))a.joy=clamp(a.joy+.3,0,1),a.loyalty=clamp(a.loyalty+.05,0,1);
    logChron(`${f.name}에 황금기가 도래했다. 백성이 기뻐한다.`,`=GOLDEN.AGE("${f.name}")`,'event');
  } else if(r>.997&&factions.length>1){
    // 두 세력 동맹? — 잠깐의 평화 (전쟁 의지 감소는 생략, 사건 기록만)
    const [a,b]=[pick(factions),pick(factions)];
    if(a!==b)logChron(`${a.name}과(와) ${b.name}이(가) 밀약을 맺었다… 언제까지 갈까.`,
      `=PACT("${a.name}","${b.name}")`,'event');
  }
  // 새 세력 도래 (수 적을 때)
  if(factions.length<3&&chance(.01)){const f=spawnFaction('도래');if(f)logChron(`바다 건너 ${f.name}이(가) 도래했다.`,`=MIGRATE("${f.name}")`,'state');}

  // 그리기
  for(const i of dirty)paint(i);
  dirty.clear();

  renderStatus();
  if(tickN%6===0)renderSidebar();
  if(tickN%9===0){
    document.title=`음모.xlsx — Excel (서기 ${year}년)`;
    if(docTab&&docTab!=='sheet')renderDoc(docTab);  // 열린 시트 갱신
  }
}
function avgFear(fid){const a=facAgents(fid);return a.length?a.reduce((s,x)=>s+x.fear,0)/a.length:0;}
function plotsIn(fid){return plots.filter(p=>p.facId===fid).length;}

// ============================================================
//  UI 렌더
// ============================================================
function renderStatus(){
  statusbar.innerHTML=`준비<span class="sep">|</span>서기 ${year}년`+
    `<span class="sep">|</span>인구 ${pop.toLocaleString()}`+
    `<span class="sep">|</span>국가 ${factions.length}`+
    `<span class="sep">|</span>음모 ${plots.length}`+
    `<span class="sep">|</span>멸망 ${obituaries.length}`;
  ticker.innerHTML=`<b>서기 ${year}년 ▸</b>&nbsp;${lastMsg}`;
}
function renderSidebar(){
  yrlab.textContent=`서기 ${year}년`;
  if(!factions.length){sbbody.innerHTML='<div style="padding:14px;color:#999">모든 문명이 멸망했다.</div>';return;}
  let h='';
  const sorted=factions.slice().sort((a,b)=>b.size-a.size);
  for(const f of sorted){
    const ld=leaderOf(f.id);
    const np=plotsIn(f.id);
    const ag=facAgents(f.id);
    // 내각 평균 감정 막대
    let joy=0,ang=0,sor=0,fea=0;for(const a of ag){joy+=a.joy;ang+=a.anger;sor+=a.sorrow;fea+=a.fear;}
    const tot=(joy+ang+sor+fea)||1;
    let badges='';
    if(f.golden>0)badges+='<span class="badge" style="background:#d97706">황금기</span>';
    if(np>0)badges+=`<span class="badge" style="background:#7c3aed">음모${np}</span>`;
    if(f.stability<.3)badges+='<span class="badge" style="background:#dc2626">불안</span>';
    h+=`<div class="fac" data-fac="${f.id}">
      <div class="nm"><span class="sw" style="background:${f.color}"></span>${f.name}${badges}</div>
      <div class="ld">${ld?'👑 '+ld.name+' ('+emoLabel(ld)+')':'무정부'}</div>
      <div class="st"><span>영토 ${f.size}</span><span>국고 ${Math.round(f.treasury)}</span><span>안정 ${Math.round(f.stability*100)}%</span><span>관료 ${ag.length}</span></div>
      <div class="moodbar">
        <i style="width:${joy/tot*100}%;background:#d97706" title="기쁨"></i>
        <i style="width:${ang/tot*100}%;background:#dc2626" title="분노"></i>
        <i style="width:${sor/tot*100}%;background:#2563eb" title="슬픔"></i>
        <i style="width:${fea/tot*100}%;background:#7c3aed" title="공포"></i>
      </div>
    </div>`;
  }
  sbbody.innerHTML=h;
}

const TAGNAME={war:'전쟁',intrigue:'책략',plot:'음모',coup:'정변',state:'국체',event:'사건'};

      h+=`<div class="drow"><span class="yc">서기 ${e.year}년</span><span class="tx">${e.text}`+

        `<div class="fm">가담자: ${mem} · 세력 ${p.strength.toFixed(2)} · 발각도 ${Math.round(p.exposure*100)}% · 모의 ${year-p.born}년차</div>`+
        `</span></div>`;
    }
    docbody.innerHTML=h||'<div style="color:#999;padding:10px">현재 발각된 음모가 없다. (수면 아래에서 무언가 자라고 있을지도)</div>';

    let h='';for(const o of obituaries.slice().reverse()){
      h+=`<div class="drow"><span class="yc">서기 ${o.year}년</span><span class="tx">`+

    }
    docbody.innerHTML=h||'<div style="color:#999;padding:10px">아직 멸망한 문명이 없다.</div>';
  }
}

sheet.addEventListener('click',e=>{

  selected=+t.dataset.i;t.classList.add('sel');
  namebox.textContent=ref(selected);
  const c=cells[selected];
  if(c.owner!==null){
    const f=facById(c.owner);
    fmla.textContent=`=CELL(${ref(selected)}, 영주="${f?f.name:'?'}", ${LV_LABEL[c.level]||'영토'}, 역사=[${c.hist.join('→')}])`;
  } else {
    fmla.textContent=`=CELL(${ref(selected)}, 지형="${c.hist[0]}", 역사=[${c.hist.join('→')}])`;
  }
});

// ---------- 사이드바: 세력 클릭 → 내각 인물 툴팁(에이전트 내면) ----------
sbbody.addEventListener('click',e=>{
  const fd=e.target.closest('[data-fac]');if(!fd)return;
  const fid=+fd.dataset.fac;const f=facById(fid);if(!f)return;
  showAgentCard(fid,e.clientX,e.clientY);
});
function showAgentCard(fid,x,y){
  const f=facById(fid);if(!f)return;
  const ag=facAgents(fid).sort((a,b)=>(a.role==='LEADER'?-1:b.role==='LEADER'?1:b.power-a.power));
  let h=`<b style="color:${f.color}">${f.name} 내각</b><br>`;
  for(const a of ag){
    const inPlot=a.plotId!==null;
    h+=`<div style="margin-top:4px;color:${emoColor(a)}">`+
      `${a.role==='LEADER'?'👑':inPlot?'🗡':'•'} ${roleName(a)} <b>${a.name}</b> — ${emoLabel(a)}`+
      `<br><span style="color:#bbb;font-size:9px">야망${(a.ambition*10|0)} 충성${(a.loyalty*10|0)} 편집${(a.paranoia*10|0)} 탐욕${(a.greed*10|0)} 교활${(a.cunning*10|0)}${inPlot?' · 음모가담':''}</span></div>`;
  }
  tip.innerHTML=h;tip.style.display='block';
  const tw=tip.offsetWidth,th=tip.offsetHeight;
  tip.style.left=clamp(x-tw-12,8,window.innerWidth-tw-8)+'px';
  tip.style.top=clamp(y-th/2,8,window.innerHeight-th-8)+'px';
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#sbbody')&&!e.target.closest('#tip'))tip.style.display='none';
});

// 셀 호버 → 그 땅 통치 세력 미니 정보 (데스크톱)
sheet.addEventListener('mouseover',e=>{
  if(window.innerWidth<=760)return;
  const t=e.target.closest('.cell');if(!t)return;
  const c=cells[+t.dataset.i];if(c.owner===null&&c.spy===null)return;
  let h='';
  if(c.owner!==null){const f=facById(c.owner);if(f)h+=`<b style="color:${f.color}">${f.name}</b>의 ${LV_LABEL[c.level]||'영토'}`;}
  if(c.spy!==null){const sf=facById(c.spy);if(sf)h+=`<br>◈ ${sf?sf.name:''} 첩자 잠입 중`;}
  if(c.unrest>.5)h+='<br>⚠ 민심 불온';
  if(!h)return;
  tip.innerHTML=h;tip.style.display='block';
  tip.style.left=clamp(e.clientX+14,8,window.innerWidth-tip.offsetWidth-8)+'px';
  tip.style.top=clamp(e.clientY+14,8,window.innerHeight-tip.offsetHeight-8)+'px';
});
sheet.addEventListener('mouseout',e=>{if(!e.relatedTarget||!e.relatedTarget.closest('.cell'))tip.style.display='none';});

// ---------- 모바일 사이드바 토글 ----------
document.getElementById('sbtoggle').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.toggle('open');
});

// ---------- 일시정지(클릭 빈 영역?) — 키보드 스페이스 ----------
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();paused=!paused;
    statusbar.style.opacity=paused?.6:1;
    if(paused)logChron('[ 일시정지 — 스페이스로 재개 ]','=PAUSE()','event');}
});

// ============================================================
//  초기화 & 루프
// ============================================================
let timer=null;
function init(){
  ({CW,CH,COLS,ROWS}=calcDims());N=COLS*ROWS;
  buildGrid();genTerrain();
  factions=[];agents=[];agentSeq=0;usedNames=new Set();
  plots.length=0;obituaries.length=0;chronicle.length=0;spyLog.length=0;plotSeq=0;
  year=1;tickN=0;selected=-1;
  for(let i=0;i<N;i++)paint(i);
  fmla.textContent=`=SIM.INTRIGUE($A$1:$${colName(COLS-1)}$${ROWS}, "권력은 나누어지지 않는다")`;
  spawnFaction();spawnFaction();spawnFaction();
  renderSidebar();renderStatus();
  if(timer)clearInterval(timer);
  timer=setInterval(tick,speed);
}

// 첫 페인트 — 즉시 보이는 동작하는 스프레드시트
init();

// 리사이즈 시 재구성 (디바운스)
let rzt=null;
window.addEventListener('resize',()=>{clearInterval(timer);clearTimeout(rzt);rzt=setTimeout(init,250);});

// 디버그 훅 (자가검증용)
window.__sim={get year(){return year;},get factions(){return factions.length;},
  get plots(){return plots.length;},get agents(){return agents.length;},
  get chronicle(){return chronicle.length;},get spy(){return spyLog.length;},
  get dead(){return obituaries.length;},
  get fms(){return chronicle.map(e=>e.fm);}};   // 자가검증용 전체 수식 로그
})();
</script>
