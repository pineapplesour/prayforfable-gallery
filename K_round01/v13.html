<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문명.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}
  #titlebar{height:30px;flex:0 0 30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menubar{height:28px;flex:0 0 28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  #fbar{height:26px;flex:0 0 26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px}
  #namebox{width:64px;flex:0 0 64px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333}
  #fx{width:28px;flex:0 0 28px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #body{flex:1;display:flex;min-height:0;position:relative}
  #sheetwrap{position:relative;overflow:auto;background:#fff;flex:1;min-width:0}
  #sheet{display:grid;background:#fff}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:11px;position:sticky}
  .hd.cr{left:0;top:0;z-index:6}
  .hd.col{top:0;z-index:5}
  .hd.row{left:0;z-index:4}
  .cell{border-right:1px solid #e3e3e3;border-bottom:1px solid #e3e3e3;
    display:flex;align-items:center;justify-content:center;font-size:11px;position:relative;
    overflow:hidden;cursor:cell;line-height:1}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:2}
  .cell .rm{position:absolute;right:1px;top:0;font-size:8px;line-height:1;opacity:.85}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #ff2d2d}50%{box-shadow:inset 0 0 0 2px #ffd0d0}}
  .war{animation:warf .3s 3}
  @keyframes rebelf{0%,100%{box-shadow:inset 0 0 0 2px #000}50%{box-shadow:inset 0 0 0 2px #ffcf33}}
  .rebel{animation:rebelf .25s 4}
  /* side panel */
  #side{width:236px;flex:0 0 236px;border-left:1px solid #d4d4d4;background:#fafafa;
    display:flex;flex-direction:column;overflow:hidden}
  #side .ph{padding:5px 9px;background:#f0f0f0;border-bottom:1px solid #e0e0e0;color:#107c41;
    font-weight:600;font-size:11px;display:flex;justify-content:space-between;align-items:center}
  #side .pb{flex:1;overflow:auto;padding:4px 8px;font-size:11px;line-height:1.55}
  #side .pb2{height:38%;overflow:auto;padding:4px 8px;font-size:10.5px;line-height:1.5;
    border-top:1px solid #e0e0e0;background:#fffdf5}
  .frow{display:flex;align-items:center;gap:5px;padding:2px 0;cursor:pointer;border-radius:3px}
  .frow:hover{background:#eef6f0}
  .frow.dead{opacity:.45;text-decoration:line-through;cursor:default}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:0 0 10px}
  .fmeta{font-size:9.5px;color:#888;margin-left:1px}
  .mood{font-size:11px}
  .rg{color:#7030a0}
  .tr{color:#8a6d00}
  .fa{color:#b00}
  #legend{position:absolute;left:6px;top:6px;background:rgba(255,252,230,.96);border:1px solid #d8c66a;
    box-shadow:2px 3px 8px rgba(0,0,0,.16);padding:5px 9px;font-size:10px;z-index:5;line-height:1.7;border-radius:3px}
  #legend b{color:#7a6a1f}
  #statusbar{height:24px;flex:0 0 24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;white-space:nowrap;overflow:hidden}
  #statusbar .sep{margin:0 9px;opacity:.5}
  #statusbar b{font-weight:600}
  #tabs{height:25px;flex:0 0 25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:24px;
    border-top:1px solid #d4d4d4;font-size:11.5px}
  #tabs div{padding:3px 12px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  /* overlay sheets */
  #overlay{position:absolute;inset:0;background:#fff;z-index:20;overflow:auto;display:none;padding:0}
  #overlay table{border-collapse:collapse;width:100%;font-size:11.5px}
  #overlay th{background:#107c41;color:#fff;position:sticky;top:0;padding:5px 9px;text-align:left;font-weight:600;border:1px solid #0c5e31}
  #overlay td{border:1px solid #e3e3e3;padding:4px 9px;vertical-align:top}
  #overlay tr:nth-child(even) td{background:#f6faf7}
  #overlay .num{color:#888;text-align:right;width:54px;font-family:Consolas,monospace}
  #overlay .empty{padding:30px;color:#999;text-align:center}
  @media (max-width:560px){
    #side{display:none}
    #menubar{gap:9px;font-size:11px}
    #legend{font-size:9px;padding:3px 6px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <span id="ttl">문명.xlsx - Excel</span>
  </div>
  <div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
  <div id="fbar">
    <div id="namebox">A1</div>
    <div id="fx">fx</div>
    <div id="formula"></div>
  </div>
  <div id="body">
    <div id="sheetwrap">
      <div id="sheet"></div>
      <div id="legend"></div>
      <div id="overlay"></div>
    </div>
    <div id="side">
      <div class="ph"><span>세력 정보국</span><span id="yearbadge" style="color:#999;font-weight:400">서기 1년</span></div>
      <div class="pb" id="factionList"></div>
      <div class="pb2" id="feed"></div>
    </div>
  </div>
  <div id="tabs">
    <div class="on" data-sheet="map">세계지도</div>
    <div data-sheet="chron">연대기</div>
    <div data-sheet="rumor">소문장부</div>
    <div data-sheet="dead" id="tab-dead">멸망기록 (0)</div>
  </div>
  <div id="statusbar"></div>
</div>

<script>
"use strict";
(() => {
/* ============================================================
   문명.xlsx — "소문이 역사를 쓴다"
   엑셀로 위장한 창발적 AI 문명 시뮬레이션.
   렌즈: 소문/전염의 사회 전파.
   - 각 세력 = 자율 에이전트 (목표/성격/감정/기억).
   - 다층 지휘체계: 지도자 → 장군(영토 클러스터). 장군은 항명/반란 가능.
   - 희노애락이 사건에서 동적으로 창발하여 행동을 바꾼다.
   - 소문(진실/거짓)이 셀을 타고 전염처럼 퍼지며, 거짓 소문도 행동을 바꾼다.
   - 역병 = 소문과 같은 전파 기질 위의 쌍둥이 전염.
   대본 없음. 매 실행마다 다른 역사가 창발한다.
   ============================================================ */

const sheetEl = document.getElementById('sheet');
const fmla    = document.getElementById('formula');
const namebox = document.getElementById('namebox');
const statusbar = document.getElementById('statusbar');
const legend  = document.getElementById('legend');
const factionList = document.getElementById('factionList');
const feedEl  = document.getElementById('feed');
const overlay = document.getElementById('overlay');
const ttl     = document.getElementById('ttl');
const yearbadge = document.getElementById('yearbadge');

const isPhone = innerWidth < 560;
const CW = isPhone ? 26 : 30, CH = isPhone ? 20 : 21;
// grid sized to viewport; map = the cells themselves
const COLS = Math.max(16, Math.min(46, Math.floor(((isPhone?innerWidth:innerWidth-238) - 44) / CW)));
const ROWS = Math.max(14, Math.min(34, Math.floor((innerHeight - 165) / CH)));
const N = COLS * ROWS;

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(Math.floor(i/COLS)+1);}
const rnd=Math.random;
function pick(a){return a[rnd()*a.length|0];}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

/* ---------- 시트 DOM ---------- */
sheetEl.style.gridTemplateColumns = `42px repeat(${COLS}, ${CW}px)`;
sheetEl.style.gridAutoRows = CH+'px';
const cellEls = new Array(N);
{
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd cr'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd col';h.textContent=colName(c);frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd row';h.textContent=r+1;frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      const rm=document.createElement('span');rm.className='rm';d.appendChild(rm);
      cellEls[r*COLS+c]=d; frag.appendChild(d);
    }
  }
  sheetEl.appendChild(frag);
}

/* ---------- 지형 (value noise) ---------- */
const GW=8, GH=6, gz=[];
for(let i=0;i<GW*GH;i++) gz[i]=rnd();
function noise(x,y){
  const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=gz[y0*GW+x0],b=gz[y0*GW+Math.min(GW-1,x0+1)];
  const c=gz[Math.min(GH-1,y0+1)*GW+x0],d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}

/* ---------- 셀 상태 ----------
   각 셀은 땅이자 사회 매질이다. rumor/plague 가 여기를 타고 번진다.
   fertility 는 그 땅의 풍요(확장/발전 매력).                       */
const cells = new Array(N);
for(let i=0;i<N;i++){
  const x=i%COLS, y=i/COLS|0;
  const v = noise(x,y) + (rnd()-.5)*.13;
  let st='land', hist=['황무지'], fert=clamp(.4+v*.6,.15,1);
  if(v<.32){ st='water'; hist=['바다']; fert=0; }
  else if(v>.63 && rnd()<.66){ st='forest'; hist=['숲']; fert=clamp(.5+v*.5,.3,1); }
  cells[i]={ st, owner:null, gov:null, level:0, hist, ruinT:0, fert,
             rumor:null, rum:0, plg:0, panic:0, unrest:0 };
}
function nbrs(i){
  const x=i%COLS,y=i/COLS|0,out=[];
  if(x>0)out.push(i-1); if(x<COLS-1)out.push(i+1);
  if(y>0)out.push(i-COLS); if(y<ROWS-1)out.push(i+COLS);
  return out;
}

/* ---------- 세력 / 에이전트 ---------- */
const NAMES=['북부 왕국','붉은 제국','해안 연맹','유목 칸국','삼나무 공화국','잿빛 교단','동방 상단','검은 강 부족','여명 왕조','소금 사막 민족','서리 부족','황금 종단','거석 연합'];
const SURNAMES=['하란','베일','코르','네스','튜안','릭사','모르','갈','단','베르','솔','크하','이샤','루다','오린'];
const TITLES=['대왕','여제','족장','대공','집정관','대사제','칸','맹주','선지자','참주'];
const GTITLES=['장군','총독','대장','수호','선봉','집정','맹수','검은손'];
const COLORS=['#2563eb','#dc2626','#059669','#7c3aed','#d97706','#0d9488','#be185d','#4d7c0f','#9333ea','#b45309','#0891b2','#a16207','#7e22ce'];

let usedNames=[];
function freshName(){
  const avail=NAMES.filter(n=>!usedNames.includes(n));
  const n = avail.length?pick(avail):pick(NAMES)+' '+(usedNames.length);
  usedNames.push(n); return n;
}
function freshColor(){ return COLORS[(usedFC++)%COLORS.length]; }
let usedFC=0;
function person(){ return pick(SURNAMES)+'-'+(rnd()*900+100|0|0); }

let factions=[];
let nextFid=0;
const obituaries=[];   // {name,year,cause,leader}
const chronicle=[];    // {year,msg,formula,kind}
const rumorLog=[];     // {year,claim,truth,birth,reach,kind,faction}
let year=0, pop=0, lastEvent='천지가 창조되었습니다.';
let selected=-1, curSheet='map';
const dirty=new Set();

/* 성격 축: ambition(팽창) paranoia(소문에 휘둘림) zeal(광신/단결) cruelty(전쟁성) */
function makeFaction(seedIdx, originLabel){
  const name=freshName(), color=freshColor();
  const f={
    id:nextFid++, name, color,
    leader: person()+' '+pick(TITLES),
    trait:{
      ambition: .25+rnd()*.7,
      paranoia: .15+rnd()*.7,
      zeal:     .15+rnd()*.7,
      cruelty:  .1 +rnd()*.7
    },
    // 감정(창발): joy / anger / sorrow / fear. 0..1. 정해지지 않음.
    mood:{ joy:.3, anger:.1, sorrow:.05, fear:.1 },
    legitimacy: .55+rnd()*.25,   // 지도자 정통성 — 소문에 깎이고 승리에 오름
    golden:0, fallen:0,
    arr:[], size:0, generals:[], origin:originLabel||'토착',
    belief:{}   // 소문claim -> 신뢰도(거짓이어도 행동에 반영)
  };
  for(let t=0;t<300;t++){
    const i=rnd()*N|0;
    if(cells[i].st==='land'&&cells[i].owner===null){
      cells[i].owner=f.id; cells[i].level=1; cells[i].gov=null;
      cells[i].hist.push('개국'); dirty.add(i);
      factions.push(f);
      return f;
    }
  }
  nextFid--; usedNames.pop(); return null;
}
function facById(id){ for(const f of factions) if(f.id===id) return f; return null; }

function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ---------- 장군 / 다층 지휘체계 ----------
   세력 영토가 커지면 장군을 임명하여 클러스터(영토 조각)를 위임한다.
   장군은 loyalty(충성) ambition(야심) grievance(원한)을 갖고,
   소문/패배/감정에 따라 항명·독립·반란한다.                              */
function makeGeneral(f){
  return {
    name: person()+' '+pick(GTITLES),
    loyalty: .55+rnd()*.35,
    ambition: f.trait.ambition*.6 + rnd()*.5,
    grievance: 0,
    cells: []  // 이 장군이 다스리는 셀 (재계산됨)
  };
}

/* ---------- 그리기 ---------- */
const LV_TXT=['','·','田','村','都'];
const LV_LABEL=['','개척지','농장','마을','도시'];
function paint(i){
  const c=cells[i], el=cellEls[i], rm=el.firstChild;
  let bg='', tx='', col='#222', w='';
  if(c.plg>0){ bg='#ead5f5'; tx='疫'; col='#7030a0'; w='700'; }
  else if(c.st==='fire'){ bg='#ffd9b3'; tx='火'; col='#c00000'; w='700'; }
  else if(c.st==='water'){ bg='#ddebf7'; tx='≈'; col='#9dc3e6'; }
  else if(c.st==='forest'){ bg='#e2efda'; tx='木'; col='#548235'; }
  else if(c.st==='ruin'){ bg='#ececec'; tx='墟'; col='#999'; }
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      bg=hexA(f.color,.12+c.level*.16);
      tx=LV_TXT[c.level];
      col=f.color; w=c.level>=3?'700':'';
      if(c.unrest>0.55){ col='#000'; }      // 동요하는 영토는 글자가 검게
    }
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  // 텍스트 노드 (rm span 보존)
  el.childNodes[1] ? el.childNodes[1].nodeValue=tx : el.appendChild(document.createTextNode(tx));
  // 소문/공황 마커
  if(c.rum>0.45){ rm.textContent = c.rumor && c.rumor.truth ? '◔' : '✦'; rm.style.color = c.rumor && !c.rumor.truth ? '#b80' : '#7030a0'; }
  else if(c.panic>0.5){ rm.textContent='!'; rm.style.color='#c00'; }
  else rm.textContent='';
}

/* ---------- 사건 로그 / 연대기 ---------- */
function logEvent(msg, formula, kind){
  year>0 ? lastEvent = `서기 ${year}년: ${msg}` : lastEvent = msg;
  if(formula) fmla.textContent=formula;
  chronicle.push({ year, msg, formula:formula||'', kind:kind||'' });
  if(chronicle.length>600) chronicle.shift();
  pushFeed(msg, kind);
}
const feedItems=[];
function pushFeed(msg, kind){
  feedItems.push({year, msg, kind});
  if(feedItems.length>40) feedItems.shift();
}

/* ---------- 소문 시스템 (핵심) ----------
   소문 = {claim, truth, faction, effect, year}. claim 종류:
   - 'weak'   : "지도자가 약하다" → 충성/정통성↓, unrest↑ (반란 촉발)
   - 'plague' : "저쪽에 역병" → 공황(panic), 인접 회피/도주
   - 'wealth' : "동쪽에 풍요" → 확장 욕구↑ (golden 유사)
   - 'betray' : "장군이 배신한다" → 장군 grievance↑/loyalty↓ (자기실현)
   - 'enemy'  : "X가 쳐들어온다" → 공포(fear)↑, 선제공격 유발 (거짓이면 헛전쟁)
   - 'miracle': "기적이 일어났다" → 사기(joy)↑, 단결
   소문은 셀(rum 농도)을 타고 번지며, 퍼질수록 truth 가 변질될 수 있다.
   거짓 소문도 믿으면 행동이 바뀐다 → 집단 히스테리/헛전쟁/마녀사냥. */
const RUMOR_KINDS=['weak','plague','wealth','betray','enemy','miracle'];
function rumorClaimText(rk, f, extra){
  switch(rk){
    case 'weak':   return `${f?f.leader:'지도자'}는 무능하다`;
    case 'plague': return `${extra||'어딘가'}에 역병이 돈다`;
    case 'wealth': return `${extra||'동쪽'}에 황금의 땅이 있다`;
    case 'betray': return `${extra||'장군'}이 배신을 꾀한다`;
    case 'enemy':  return `${extra||'적'}이 쳐들어온다`;
    case 'miracle':return `하늘이 ${f?f.name:'우리'}에게 기적을 내렸다`;
  }
  return '알 수 없는 소문';
}
function seedRumor(i, rk, truth, f, extra){
  const claim = rumorClaimText(rk, f, extra);
  const r = { kind:rk, claim, truth, faction:f?f.id:null, year, reach:1 };
  cells[i].rumor=r; cells[i].rum=1;
  dirty.add(i);
  rumorLog.push({ year, claim, truth, kind:rk, faction:f?f.name:'—', birth:ref(i), reach:1 });
  if(rumorLog.length>400) rumorLog.shift();
  return r;
}

/* ---------- 멸망 ---------- */
function killFaction(k, cause){
  const f=factions[k];
  obituaries.push({ name:f.name, year, cause, leader:f.leader });
  logEvent(`${f.name}이(가) 역사에서 사라졌습니다. (${cause})`, `=COLLAPSE("${f.name}", ${year}, "${cause}")`, 'death');
  factions.splice(k,1);
  document.getElementById('tab-dead').textContent=`멸망기록 (${obituaries.length})`;
}

/* ============================================================
   메인 틱 — 한 해.
   ============================================================ */
let tickN=0, warCD=0, rumorCD=0;
function tick(){
  tickN++; year++;
  if(warCD>0)warCD--; if(rumorCD>0)rumorCD--;

  /* 1) 소유/거버넌스 재집계 + 감정 자연 감쇠 */
  for(const f of factions){ f.arr.length=0; f.size=0; for(const g of f.generals) g.cells.length=0; }
  pop=0;
  const PW=[0,45,170,540,1500];
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin'){ if(--c.ruinT<=0){ c.st='land'; dirty.add(i); } }
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){
        f.arr.push(i); f.size++; pop+=PW[c.level];
        if(c.gov!=null && f.generals[c.gov]) f.generals[c.gov].cells.push(i);
      } else { c.owner=null; c.gov=null; c.level=0; dirty.add(i); }
    }
  }

  /* 2) 감정 창발의 자연 감쇠 (사건이 다시 끌어올린다) */
  for(const f of factions){
    const m=f.mood;
    m.joy*=.985; m.anger*=.97; m.sorrow*=.985; m.fear*=.965;
    f.legitimacy = clamp(f.legitimacy + (0.5 - f.legitimacy)*0.01, .05, 1);
    if(f.golden>0) f.golden--;
  }

  /* 3) 멸망 판정 */
  for(let k=factions.length-1;k>=0;k--) if(factions[k].size===0) killFaction(k,'영토 소멸');

  /* 4) 화재 전파 */
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st!=='fire') continue;
    if(rnd()<.13) for(const n of nbrs(i)){ const d=cells[n]; if(d.owner!==null && d.st==='land'){ d.st='fire'; d.fireT=4; dirty.add(n); } }
    if((c.fireT=(c.fireT||4)-1)<=0){
      c.owner=null;c.gov=null;c.level=0;c.st='ruin';c.ruinT=180;
      c.hist.push('잿더미'); if(c.hist.length>8)c.hist.shift(); dirty.add(i);
    }
  }

  /* 5) 역병 전파 (소문과 같은 매질) */
  let plagueAlive=0;
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.plg<=0) continue;
    plagueAlive++;
    // 인접 전염 (밀집/발전도가 높을수록 잘 번짐)
    if(rnd()<.14+c.level*.03) for(const n of nbrs(i)){ const d=cells[n]; if(d.owner!==null && d.plg<=0){ d.plg=10; dirty.add(n); } }
    // 역병 -> 공포 소문 자연 발생 (전염이 정보를 낳는다)
    if(rnd()<.05 && c.owner!=null){ const f=facById(c.owner); if(f){ seedRumor(i,'plague',true,f,ref(i)); } }
    if(rnd()<.2){ c.level--; const f=facById(c.owner); if(f){ f.mood.sorrow=clamp(f.mood.sorrow+.04,0,1); f.mood.fear=clamp(f.mood.fear+.03,0,1);}
      if(c.level<=0){ c.owner=null;c.gov=null;c.level=0; c.hist.push('역병으로 소멸'); } dirty.add(i); }
    if(--c.plg<=0){ dirty.add(i); }
  }

  /* 6) 소문 전파 (핵심 전염) */
  let rumorAlive=0;
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.rum<=0 || !c.rumor) continue;
    rumorAlive++;
    const owner=c.owner!=null?facById(c.owner):null;
    // 전파: 인접 셀로 (사람이 사는 곳으로 더 잘). paranoia 높은 세력에서 빨리.
    const spread = .18 + (owner?owner.trait.paranoia*.25:0);
    if(rnd()<spread){
      for(const n of nbrs(i)){
        const d=cells[n];
        if(d.st==='water'||d.st==='ruin') continue;
        if(d.rum < c.rum*.7){
          let r=c.rumor;
          // 변질: 퍼질수록 진실이 거짓으로 (또는 반대로) 뒤틀린다
          if(rnd()<.12) r=Object.assign({},c.rumor,{truth: rnd()<.5 ? !c.rumor.truth : c.rumor.truth, reach:c.rumor.reach+1});
          d.rumor=r; d.rum=c.rum*(.82+rnd()*.12); dirty.add(n);
        }
      }
    }
    // 소문이 감정/사회에 작용 (믿으면 거짓이어도 효과)
    if(owner){
      const believe = clamp(owner.trait.paranoia*.6 + c.rum*.4, 0, 1);
      applyRumorEffect(c.rumor, owner, c, i, believe);
    }
    c.rum*=.93; if(c.rum<.08){ c.rum=0; c.rumor=null; c.panic*=.5; dirty.add(i); }
  }

  /* 7) 무작위 소문 발생 (사회는 늘 수군거린다) */
  if(rumorCD===0 && factions.length && rnd()<.16){
    const f=pick(factions);
    if(f.arr.length){
      const i=pick(f.arr);
      // 소문 종류는 세력의 상태/감정에서 창발적으로 선택
      const m=f.mood;
      let rk;
      if(f.legitimacy<.4) rk= rnd()<.6?'weak':'betray';
      else if(m.fear>.4)  rk= rnd()<.6?'enemy':'plague';
      else if(m.joy>.5)   rk= 'miracle';
      else if(f.generals.length && rnd()<.3) rk='betray';
      else rk=pick(RUMOR_KINDS);
      const truth = decideTruth(rk,f);
      let extra='';
      if(rk==='betray'&&f.generals.length){ extra=pick(f.generals).name; }
      else if(rk==='enemy'){ const other=factions.filter(x=>x.id!==f.id); extra=other.length?pick(other).name:'적'; }
      else if(rk==='wealth'){ extra=ref(pick(f.arr)); }
      seedRumor(i,rk,truth,f,extra);
      // 굵직한 소문만 로깅
      if(rk==='weak'||rk==='betray'||rk==='enemy'||rk==='miracle'){
        logEvent(`${f.name}에 소문이 돌기 시작했다 — "${rumorClaimText(rk,f,extra)}"${truth?'':' (거짓)'}`,
          `=RUMOR("${rk}", ${ref(i)}, truth=${truth})`, 'rumor');
        rumorCD=14;
      }
    }
  }

  /* 8) 세력별 자율 행동 (성격×감정×소문이 결정) */
  for(const f of factions){
    if(f.size===0) continue;
    governorAssign(f);     // 영토가 크면 장군 임명/재배치
    factionAct(f);         // 확장/전쟁/발전 — 감정과 소문 신뢰가 가중치
    generalsThink(f);      // 항명/반란 판정
  }

  /* 9) 세계 사건 */
  worldEvents();

  /* 10) 이주(새 세력 도래) — 소수일 때 */
  if(factions.length<3 && rnd()<.02 && factions.length<7){
    const f=makeFaction(0,'바다 건너');
    if(f){ f.mood.joy=.5; logEvent(`바다 건너에서 ${f.name}(${f.leader})이(가) 도래했습니다.`, `=MIGRATE("${f.name}")`, 'spawn'); }
  }

  /* 11) 렌더 */
  for(const i of dirty) paint(i);
  dirty.clear();
  renderStatus();
  if(tickN%6===0) renderSide();
  if(curSheet!=='map' && tickN%8===0) renderOverlay();
}

/* 진실/거짓 결정 — 일부 소문은 실제 상황을 반영, 일부는 순전한 거짓 */
function decideTruth(rk,f){
  if(rk==='weak')    return f.legitimacy<.45 ? rnd()<.7 : rnd()<.3;
  if(rk==='plague')  return rnd()<.5;
  if(rk==='betray'){ const g=f.generals.find(g=>g.loyalty<.4); return g?rnd()<.8:rnd()<.25; }
  if(rk==='enemy')   return rnd()<.4;     // 대개 헛소문 (헛전쟁의 씨앗)
  if(rk==='miracle') return rnd()<.35;
  if(rk==='wealth')  return rnd()<.5;
  return rnd()<.5;
}

/* 소문 효과 — 감정/사회 상태를 바꾼다 (믿음 강도 believe로 스케일) */
function applyRumorEffect(r, f, c, i, believe){
  const k=r.kind, e=believe*0.5;
  switch(k){
    case 'weak':
      f.legitimacy=clamp(f.legitimacy-0.004*believe,0,1);
      c.unrest=clamp(c.unrest+0.03*believe,0,1);
      f.mood.anger=clamp(f.mood.anger+0.006*believe,0,1);
      break;
    case 'plague':
      c.panic=clamp(c.panic+0.05*believe,0,1);
      f.mood.fear=clamp(f.mood.fear+0.004*believe,0,1);
      break;
    case 'wealth':
      f.mood.joy=clamp(f.mood.joy+0.004*believe,0,1);
      f.driveExpand=(f.driveExpand||0)+0.02*believe;
      break;
    case 'betray':
      // 자기실현적 예언: 배신 소문이 장군의 원한을 키운다
      if(f.generals.length){ const g=pick(f.generals); g.grievance=clamp(g.grievance+0.02*believe,0,1); g.loyalty=clamp(g.loyalty-0.01*believe,0,1); }
      f.legitimacy=clamp(f.legitimacy-0.002*believe,0,1);
      break;
    case 'enemy':
      f.mood.fear=clamp(f.mood.fear+0.006*believe,0,1);
      f.mood.anger=clamp(f.mood.anger+0.004*believe,0,1);
      f.warHunger=(f.warHunger||0)+0.03*believe;  // 공포가 선제공격을 부른다
      break;
    case 'miracle':
      f.mood.joy=clamp(f.mood.joy+0.008*believe,0,1);
      c.unrest=clamp(c.unrest-0.04*believe,0,1);
      f.legitimacy=clamp(f.legitimacy+0.003*believe,0,1);
      break;
  }
}

/* ---------- 장군 임명/배치 ---------- */
function governorAssign(f){
  // 영토가 6칸 넘으면 장군 1명당 ~약 6칸. 부족하면 새로 임명.
  const want = Math.min(4, Math.floor(f.size/6));
  while(f.generals.length<want){
    const g=makeGeneral(f);
    f.generals.push(g);
    logEvent(`${f.name}이(가) ${g.name}을(를) 임명했다.`, `=APPOINT("${f.name}", "${g.name}")`, 'appoint');
  }
  // 셀에 거버너 배정 (가까운 무배정/재배정). 간단히 라운드로빈 + 인접성.
  if(f.generals.length===0) return;
  for(const i of f.arr){
    const c=cells[i];
    if(c.gov==null || c.gov>=f.generals.length){
      // 인접 셀의 gov 따라가기 (클러스터 형성)
      let g=null;
      for(const n of nbrs(i)){ if(cells[n].owner===f.id && cells[n].gov!=null && cells[n].gov<f.generals.length){ g=cells[n].gov; break; } }
      c.gov = g!=null ? g : (i % f.generals.length);
    }
  }
}

/* ---------- 세력 자율 행동 ---------- */
function factionAct(f){
  const m=f.mood, t=f.trait;
  // 행동 성향이 감정에서 창발:
  //  joy -> 발전/단결, anger -> 전쟁, fear -> 수축/방어, sorrow -> 정체
  const expandDrive = clamp(t.ambition*.7 + m.joy*.5 + (f.driveExpand||0) - m.fear*.6 - m.sorrow*.4, 0, 2);
  const warDrive    = clamp(t.cruelty*.6 + m.anger*.8 + (f.warHunger||0) + (m.fear>.5?m.fear*.4:0), 0, 2);
  const buildDrive  = clamp(.4 + m.joy*.7 + (f.golden?1:0) - m.sorrow*.5, 0, 2.5);
  f.driveExpand=(f.driveExpand||0)*.85; f.warHunger=(f.warHunger||0)*.8;

  const attempts = 1 + (f.size*0.06*expandDrive | 0);
  for(let a=0;a<attempts;a++){
    const src=pick(f.arr);
    if(src===undefined||cells[src].owner!==f.id) continue;
    if(cells[src].panic>.6 && rnd()<.5) continue;        // 공황 영토는 행동 마비
    const tgt=pick(nbrs(src));
    const tc=cells[tgt];
    if(tc.st==='water'||tc.st==='fire') continue;
    if(tc.owner===null){
      if(tc.st==='forest'){ if(rnd()<.2+tc.fert*.2){ tc.st='land'; tc.hist.push('개간'); claimCell(tgt,f,1,'개척지',cells[src].gov); } }
      else if(tc.st==='land' && rnd()<.4+tc.fert*.4){ claimCell(tgt,f,1,'개척지',cells[src].gov); }
    } else if(tc.owner!==f.id){
      const willWar = rnd() < (.12 + warDrive*.22);
      if(!willWar) continue;
      const defF=facById(tc.owner);
      if(!defF) continue;
      // 전투력: 발전도+무작위+성격, 황금기/분노 보정
      const att = 1.2 + rnd()*3 + f.size*.0015 + (f.golden?1.2:0) + m.anger*1.5 + t.cruelty;
      const def = tc.level + 1.3 + rnd()*3 + (defF.golden?1:0) - tc.unrest*1.5 - tc.panic;
      flash(tgt,'war');
      if(att>def){
        if(rnd()<.25+t.cruelty*.2){
          tc.st='fire'; tc.fireT=4; tc.hist.push('전화(戰火)'); dirty.add(tgt);
        } else {
          claimCell(tgt,f,Math.max(1,tc.level-1),'점령됨',cells[src].gov);
        }
        f.mood.joy=clamp(f.mood.joy+.03,0,1); f.legitimacy=clamp(f.legitimacy+.004,0,1);
        defF.mood.anger=clamp(defF.mood.anger+.05,0,1); defF.mood.sorrow=clamp(defF.mood.sorrow+.03,0,1);
        defF.legitimacy=clamp(defF.legitimacy-.006,0,1);
        // 패배는 패자 영토에 'weak' 소문을 낳는다 (전염의 씨앗)
        if(rnd()<.4 && defF.arr.length) seedRumor(tgt,'weak',true,defF);
        if((tc.level>=3||warCD===0)){
          logEvent(`${f.name}이(가) ${defF.name}의 ${ref(tgt)}을(를) 공격했다.`, `=WAR("${f.name}"→"${defF.name}", ${ref(tgt)})`, 'war');
          warCD=22;
        }
      } else {
        f.mood.anger=clamp(f.mood.anger+.02,0,1); f.mood.sorrow=clamp(f.mood.sorrow+.02,0,1);
      }
    }
  }

  // 발전
  const ups=1 + (f.size*0.04*buildDrive | 0);
  for(let u=0;u<ups;u++){
    const i=pick(f.arr);
    if(i===undefined||cells[i].owner!==f.id) continue;
    const c=cells[i];
    if(c.plg>0||c.panic>.6) continue;
    if(c.level<4 && rnd()< (.05 + c.fert*.04)*(f.golden?3:1)*(1+m.joy*.6)){
      c.level++; c.hist.push(LV_LABEL[c.level]); if(c.hist.length>8)c.hist.shift(); dirty.add(i);
      f.mood.joy=clamp(f.mood.joy+.01,0,1);
      if(c.level===4 && warCD===0){
        logEvent(`${f.name}의 ${ref(i)}에 대도시가 세워졌다.`, `=CITY("${f.name}", ${ref(i)})`, 'build');
        seedRumor(i,'miracle',true,f); warCD=18;
      }
    }
    // 불안 진압 (정통성 높으면 잘 진정)
    if(c.unrest>0) c.unrest=clamp(c.unrest - .02*f.legitimacy,0,1);
  }
}
function claimCell(i,f,lvl,label,gov){
  const c=cells[i]; c.owner=f.id; c.level=lvl; c.st='land'; c.gov=gov!=null?gov:null;
  c.hist.push(label); if(c.hist.length>8)c.hist.shift(); c.unrest=0; dirty.add(i);
}

/* ---------- 장군의 사고: 항명/반란/배신 ---------- */
function generalsThink(f){
  for(let gi=f.generals.length-1;gi>=0;gi--){
    const g=f.generals[gi];
    if(!g.cells.length){ continue; }
    // 충성 동역학: 정통성↑ → 충성↑. 야심·원한·세력 분노 → 충성↓.
    g.loyalty = clamp(g.loyalty + (f.legitimacy-.5)*.012 - g.ambition*.004 - g.grievance*.01 - f.mood.anger*.003, 0, 1);
    // 큰 영지를 가진 야심가는 더 흔들린다
    const power = g.cells.length / Math.max(1,f.size);
    if(power>.35) g.loyalty=clamp(g.loyalty-.004,0,1);

    // 항명: 명령(전쟁 등) 거부 — 가끔 로그
    // 반란: 충성 임계 이하 + 영지 충분 → 독립 세력으로 분열
    const rebelChance = (g.loyalty<.3?(.02+g.ambition*.04+g.grievance*.05):0) * (power>.18?1:.3);
    if(rebelChance>0 && rnd()<rebelChance && g.cells.length>=3 && factions.length<9){
      defect(f, g, gi);
    } else if(g.loyalty<.4 && rnd()<.02){
      logEvent(`${f.name}의 ${g.name}이(가) 명령에 항명했다.`, `=INSUBORDINATE("${f.name}", "${g.name}")`, 'rebel');
      f.legitimacy=clamp(f.legitimacy-.01,0,1);
      // 항명 소문이 번진다
      if(g.cells.length) seedRumor(pick(g.cells),'betray',true,f,g.name);
    }
  }
}
function defect(f, g, gi){
  // 장군이 자기 영지를 들고 독립
  const nf={
    id:nextFid++, name:g.name.split(' ')[0]+'의 반란군',
    color:freshColor(),
    leader:g.name,
    trait:{ ambition:clamp(g.ambition,.2,1), paranoia:.3+rnd()*.5, zeal:.4+rnd()*.5, cruelty:.4+rnd()*.5 },
    mood:{ joy:.4, anger:.6, sorrow:.1, fear:.2 },
    legitimacy:.5, golden:0, fallen:0, arr:[], size:0, generals:[], origin:`${f.name}에서 분열`, belief:{}
  };
  usedNames.push(nf.name);
  for(const i of g.cells){ cells[i].owner=nf.id; cells[i].gov=null; cells[i].unrest=0; cells[i].hist.push('반란'); dirty.add(i); flash(i,'rebel'); }
  factions.push(nf);
  f.generals.splice(gi,1);
  f.mood.anger=clamp(f.mood.anger+.3,0,1); f.mood.sorrow=clamp(f.mood.sorrow+.2,0,1);
  f.legitimacy=clamp(f.legitimacy-.08,0,1);
  logEvent(`${g.name}이(가) ${f.name}을(를) 배신하고 독립을 선포했다!`, `=REBELLION("${g.name}", from="${f.name}")`, 'rebel');
  // 반란은 'weak' 소문을 광범위하게 퍼뜨린다
  if(f.arr.length) seedRumor(pick(f.arr),'weak',true,f);
}

/* ---------- 세계 사건 ---------- */
function worldEvents(){
  const r=rnd();
  if(r<.006){ // 역병 발발
    const big=[]; for(let i=0;i<N;i++) if(cells[i].owner!=null && cells[i].level>=2 && cells[i].plg<=0) big.push(i);
    if(big.length){ const i=pick(big); cells[i].plg=10; dirty.add(i);
      logEvent(`${ref(i)}에서 역병이 창궐했다.`, `=PLAGUE(${ref(i)})`, 'plague'); }
  } else if(r>.995 && factions.length){ // 황금기
    const f=pick(factions); f.golden=80; f.mood.joy=clamp(f.mood.joy+.4,0,1);
    logEvent(`${f.name}의 황금기가 시작되었다.`, `=GOLDEN_AGE("${f.name}", 80)`, 'golden');
    if(f.arr.length) seedRumor(pick(f.arr),'miracle',true,f);
  } else if(r>.992 && r<=.995){ // 대화재
    const t=[]; for(let i=0;i<N;i++) if(cells[i].owner!=null && cells[i].level>=2) t.push(i);
    if(t.length){ const i=pick(t); cells[i].st='fire'; cells[i].fireT=5; dirty.add(i);
      logEvent(`${ref(i)}에 대화재가 발생했다.`, `=FIRE(${ref(i)})`, 'fire'); }
  } else if(r>.988 && r<=.992 && factions.length>=2){ // 동맹 시도 → 깨지면 헛소문
    const a=pick(factions), b=pick(factions.filter(x=>x.id!==a.id));
    if(b && a.mood.fear>.3){
      logEvent(`${a.name}과(와) ${b.name}이(가) 사절을 교환했다.`, `=ENVOY("${a.name}","${b.name}")`, 'diplo');
      a.mood.fear*=.6;
    }
  }
}

/* ---------- 시각 효과 ---------- */
function flash(i, cls){ const el=cellEls[i]; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls), cls==='rebel'?1100:1000); }

/* ---------- 상태바 ---------- */
function renderStatus(){
  const top = factions.slice().sort((a,b)=>b.size-a.size)[0];
  statusbar.innerHTML =
    `준비<span class="sep">|</span>서기 <b>${year}</b>년`+
    `<span class="sep">|</span>인구 ${pop.toLocaleString()}명`+
    `<span class="sep">|</span>국가 ${factions.length}곳`+
    `<span class="sep">|</span>${lastEvent}`;
  ttl.textContent = `문명.xlsx - Excel (서기 ${year}년)`;
  yearbadge.textContent = `서기 ${year}년`;
}

/* ---------- 사이드 패널: 세력 카드 + 피드 ---------- */
const MOOD_FACE={ joy:'😀', anger:'😠', sorrow:'😢', fear:'😨' };
function dominantMood(m){
  let best='평온', v=.18, face='😐';
  for(const k of ['joy','anger','sorrow','fear']) if(m[k]>v){ v=m[k]; best=k; face=MOOD_FACE[k]; }
  return face;
}
function renderSide(){
  const fs=factions.slice().sort((a,b)=>b.size-a.size);
  let h='';
  for(const f of fs){
    const face=dominantMood(f.mood);
    const lg=Math.round(f.legitimacy*100);
    h+=`<div class="frow" data-fid="${f.id}">`+
       `<span class="sw" style="background:${f.color}"></span>`+
       `<span style="flex:1"><b>${f.name}</b>${f.golden?' ✦':''} <span class="mood">${face}</span>`+
       `<div class="fmeta">${f.leader} · 영토 ${f.size} · 장군 ${f.generals.length} · 정통성 ${lg}%</div></span></div>`;
  }
  if(obituaries.length){
    h+=`<div style="margin-top:5px;color:#999;font-size:10px;border-top:1px dashed #ddd;padding-top:3px">최근 멸망</div>`;
    for(const o of obituaries.slice(-3)) h+=`<div class="frow dead"><span style="font-size:10px">† ${o.name} (${o.year}년·${o.cause})</span></div>`;
  }
  factionList.innerHTML=h;

  // 피드 (최근 사건, 색상 분류)
  let fh='';
  for(const it of feedItems.slice(-22).reverse()){
    const cls = it.kind==='rumor'?'rg': it.kind==='rebel'?'fa': it.kind==='war'?'fa': it.kind==='golden'||it.kind==='miracle'||it.kind==='build'?'tr':'';
    fh+=`<div class="${cls}">·<span style="color:#aaa">[${it.year}]</span> ${it.msg}</div>`;
  }
  feedEl.innerHTML=fh;

  // legend
  legend.innerHTML=`<b>범례</b>  木숲 ≈바다 ·田村都=발전 疫역병 火화재 墟폐허<br>`+
    `<span style="color:#7030a0">✦◔ 소문(보라=거짓의심)</span> · <span style="color:#c00">! 공황</span> · 검은글자=동요`;
}

/* ---------- 셀 클릭 = 그 땅의 역사 ---------- */
sheetEl.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  if(selected>=0) cellEls[selected].classList.remove('sel');
  selected=+t.dataset.i; t.classList.add('sel');
  namebox.textContent=ref(selected);
  const c=cells[selected];
  const f=c.owner!=null?facById(c.owner):null;
  let s='';
  if(c.rumor && c.rum>.2) s += ` ◁소문:"${c.rumor.claim}"${c.rumor.truth?'':'(거짓)'}`;
  fmla.textContent=`=HISTORY(${ref(selected)}; ${c.hist.slice(-5).map(x=>`"${x}"`).join('→')}${f?'; "'+f.name+'"':''})${s}`;
});

/* ---------- 사이드 세력 클릭 = 강조 ---------- */
factionList.addEventListener('click', e=>{
  const row=e.target.closest('.frow'); if(!row||!row.dataset.fid) return;
  const fid=+row.dataset.fid; const f=facById(fid); if(!f) return;
  fmla.textContent=`=FACTION("${f.name}"; 지도자="${f.leader}"; 성향=[야심${(f.trait.ambition*10|0)} 의심${(f.trait.paranoia*10|0)} 광신${(f.trait.zeal*10|0)} 잔혹${(f.trait.cruelty*10|0)}]; 감정=[喜${(f.mood.joy*9|0)} 怒${(f.mood.anger*9|0)} 哀${(f.mood.sorrow*9|0)} 懼${(f.mood.fear*9|0)}])`;
});

/* ============================================================
   탭: 세계지도 / 연대기 / 소문장부 / 멸망기록
   ============================================================ */
const tabs=document.querySelectorAll('#tabs div');
tabs.forEach(td=>td.addEventListener('click',()=>{
  tabs.forEach(x=>x.classList.remove('on')); td.classList.add('on');
  curSheet=td.dataset.sheet;
  if(curSheet==='map'){ overlay.style.display='none'; }
  else { overlay.style.display='block'; renderOverlay(); }
}));
function renderOverlay(){
  if(curSheet==='map'){ overlay.style.display='none'; return; }
  let h='';
  if(curSheet==='chron'){
    h='<table><thead><tr><th class="num">서기</th><th>사건</th><th>수식</th></tr></thead><tbody>';
    const list=chronicle.slice(-200).reverse();
    if(!list.length) h+='<tr><td colspan=3 class="empty">아직 기록된 역사가 없다.</td></tr>';
    for(const c of list) h+=`<tr><td class="num">${c.year}</td><td>${esc(c.msg)}</td><td style="font-family:Consolas,monospace;color:#666">${esc(c.formula)}</td></tr>`;
    h+='</tbody></table>';
  } else if(curSheet==='rumor'){
    h='<table><thead><tr><th class="num">서기</th><th>발원</th><th>소문</th><th>진위</th><th>유형</th><th>세력</th></tr></thead><tbody>';
    const list=rumorLog.slice(-200).reverse();
    if(!list.length) h+='<tr><td colspan=6 class="empty">아직 떠도는 소문이 없다.</td></tr>';
    for(const r of list) h+=`<tr><td class="num">${r.year}</td><td style="font-family:Consolas,monospace">${r.birth}</td><td>${esc(r.claim)}</td><td style="color:${r.truth?'#107c41':'#c00'}">${r.truth?'사실':'거짓'}</td><td>${r.kind}</td><td>${esc(r.faction)}</td></tr>`;
    h+='</tbody></table>';
  } else if(curSheet==='dead'){
    h='<table><thead><tr><th class="num">서기</th><th>멸망한 세력</th><th>마지막 지도자</th><th>사인</th></tr></thead><tbody>';
    const list=obituaries.slice().reverse();
    if(!list.length) h+='<tr><td colspan=4 class="empty">아직 멸망한 세력이 없다.</td></tr>';
    for(const o of list) h+=`<tr><td class="num">${o.year}</td><td>${esc(o.name)}</td><td>${esc(o.leader)}</td><td>${esc(o.cause)}</td></tr>`;
    h+='</tbody></table>';
  }
  overlay.innerHTML=h;
}
function esc(s){ return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

/* ============================================================
   시작
   ============================================================ */
for(let i=0;i<N;i++) paint(i);
fmla.textContent=`=SIM.CIVILIZATION($A$1:$${colName(COLS-1)}$${ROWS}, lens="소문·전염의 사회전파", seed=${Date.now()%99999})`;
const seedN = 3 + (rnd()<.4?1:0);
for(let s=0;s<seedN;s++){ const f=makeFaction(s,'토착'); if(f) logEvent(`${f.name}(${f.leader})이(가) 역사에 등장했다.`, `=SPAWN("${f.name}")`, 'spawn'); }
renderSide(); renderStatus();
const TICK = isPhone? 150 : 120;
setInterval(tick, TICK);

// 자가검증용 훅
window.__SIM__ = { get year(){return year;}, get factions(){return factions.length;}, get rumors(){return rumorLog.length;}, get cells(){return N;}, get pop(){return pop;}, get obituaries(){return obituaries.length;}, get chronicle(){return chronicle.length;} };
})();
</script>
</body>
</html>
