<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>외교사.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:18px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px;white-space:nowrap}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px}
  #namebox{width:62px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;flex:none}
  #fx{width:28px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif;flex:none}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #main{display:flex;flex:1;overflow:hidden;min-height:0}
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1;min-width:0}
  #sheet{display:grid;background:#fff}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:10px}
  .cell{border-right:1px solid #e8e8e8;border-bottom:1px solid #e8e8e8;
    display:flex;align-items:center;justify-content:center;font-size:11px;
    overflow:hidden;cursor:cell;position:relative;line-height:1}
  .cell.cap::after{content:"★";position:absolute;top:-1px;right:0px;font-size:7px;color:#b8860b;line-height:1}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:3}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 99px rgba(255,40,40,.55)}50%{box-shadow:inset 0 0 0 99px rgba(255,180,180,.25)}}
  .war{animation:warf .3s 3;color:#7a0000 !important;font-weight:700}
  @keyframes betray{0%,100%{box-shadow:inset 0 0 0 99px rgba(120,0,160,.5)}50%{box-shadow:inset 0 0 0 99px rgba(200,120,255,.2)}}
  .betray{animation:betray .35s 4}
  /* right panel = a "sheet" with diplomacy ledger */
  #panel{width:320px;flex:none;border-left:1px solid #d4d4d4;background:#fbfbfb;
    display:flex;flex-direction:column;overflow:hidden}
  #panel.hidden{display:none}
  .ptab{padding:5px 0;font-size:11px;font-weight:600;color:#107c41;background:#f0f5f1;
    border-bottom:1px solid #d4d4d4;text-align:center;letter-spacing:.5px}
  #panelbody{flex:1;overflow-y:auto;padding:6px 8px;font-size:11px}
  .pwr{margin-bottom:8px;border:1px solid #e2e2e2;background:#fff;border-radius:2px}
  .pwr .hdr{display:flex;align-items:center;gap:5px;padding:4px 6px;border-bottom:1px solid #eee;cursor:pointer}
  .pwr .sw{width:11px;height:11px;border-radius:2px;flex:none}
  .pwr .nm{font-weight:700;font-size:11px}
  .pwr .mood{font-size:13px;margin-left:auto}
  .pwr .meta{padding:3px 8px;color:#555;font-size:10px;line-height:1.65}
  .pwr .bar{height:5px;background:#eee;border-radius:3px;overflow:hidden;margin:2px 0}
  .pwr .bar>i{display:block;height:100%}
  .rel{font-size:10px;padding:1px 5px;border-radius:8px;margin:1px 2px 1px 0;display:inline-block}
  .rel.ally{background:#dcf0e2;color:#1a7d42}
  .rel.war{background:#fadcdc;color:#b22}
  .rel.pact{background:#e6ecf7;color:#3a5fb0}
  .rel.cold{background:#eee;color:#777}
  #legend{position:absolute;top:8px;right:10px;background:#fffce6;border:1px solid #d8c66a;
    box-shadow:2px 3px 8px rgba(0,0,0,.18);padding:7px 11px;font-size:10.5px;z-index:5;
    min-width:150px;line-height:1.75;max-width:210px}
  #legend h4{margin:0 0 2px;font-size:10.5px;color:#7a6a1f}
  #legend .sw{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}
  #legend .row{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:8;
    pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px}
  .tmsg{background:rgba(20,20,30,.9);color:#fff;padding:5px 13px;border-radius:13px;font-size:11.5px;
    box-shadow:0 2px 7px rgba(0,0,0,.3);opacity:0;animation:tin 3.2s ease both;max-width:80vw;text-align:center}
  @keyframes tin{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;flex:none;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 9px;opacity:.5}
  #statusbar .liveev{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  #ctrl{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
  #ctrl button{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);
    border-radius:3px;font-size:10.5px;padding:1px 8px;cursor:pointer;font-family:inherit}
  #ctrl button:hover{background:rgba(255,255,255,.3)}
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:24px;
    border-top:1px solid #d4d4d4;font-size:11px;flex:none}
  #tabs div{padding:3px 12px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  /* alternate full-sheet views (연대기 / 멸망기록) */
  #docview{position:absolute;inset:0;background:#fff;overflow:auto;display:none;z-index:6;
    font-family:Consolas,"맑은 고딕",monospace;font-size:11.5px}
  #docview table{border-collapse:collapse;width:100%}
  #docview td,#docview th{border:1px solid #e3e3e3;padding:3px 8px;text-align:left;vertical-align:top}
  #docview th{background:#f5f5f5;color:#555;position:sticky;top:0;font-weight:600;font-size:10.5px}
  #docview td.yr{color:#107c41;font-weight:600;width:64px;white-space:nowrap}
  #docview td.dead{color:#999}
  #docview .ftag{font-weight:700}
  #help{position:absolute;left:8px;bottom:30px;background:rgba(255,255,255,.95);border:1px solid #ccc;
    padding:5px 9px;font-size:10px;color:#666;border-radius:3px;z-index:5;line-height:1.5;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  @media (max-width:760px){
    #panel{display:none}
    #legend{font-size:9.5px;min-width:118px;max-width:150px;padding:5px 7px}
    #menubar i:nth-child(n+5){display:none}
    #help{display:none}
  }
</style>

<body>
<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <span id="tbtitle">외교사.xlsx - Excel</span>
</div>
<div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
<div id="fbar">
  <div id="namebox">A1</div>
  <div id="fx">fx</div>
  <div id="formula"></div>
</div>
<div id="main">
  <div id="sheetwrap">
    <div id="sheet"></div>
    <div id="legend"></div>
    <div id="toast"></div>
    <div id="docview"></div>
    <div id="help">클릭: 영토→그 땅의 역사 / 지도자 셀(★)→칙령. 우측 패널의 세력을 눌러도 됩니다.</div>
  </div>

    <div class="ptab">외교 원장 (DIPLOMACY!A:F)</div>

  </div>
</div>
<div id="statusbar">
  <span id="stat-fixed"></span>
  <span class="liveev" id="stat-ev"></span>

    <button id="btn-speed">속도 ×1</button>
    <button id="btn-pause">⏸</button>
  </span>
</div>
<div id="tabs">
  <div class="on" data-view="map">세계지도</div>
  <div data-view="chron">연대기</div>

</div>

<script>
"use strict";
(() => {
/* =====================================================================
   외교사.xlsx — 창발적 AI 문명 시뮬레이션 (외교·동맹·배신의 정치)
   각 세력은 자율 에이전트(목표·성격·기억·감정). 지도자→영주 다층 지휘.
   영주는 충성/공포/야망에 따라 명령을 해석·항명·독립·배신.
   ===================================================================== */

// ---------- 레이아웃 / 그리드 ----------
const sheetEl = document.getElementById('sheet');
const fmla = document.getElementById('formula');
const namebox = document.getElementById('namebox');
const statFixed = document.getElementById('stat-fixed');
const statEv = document.getElementById('stat-ev');
const legendEl = document.getElementById('legend');
const panelBody = document.getElementById('panelbody');
const toastEl = document.getElementById('toast');
const docview = document.getElementById('docview');

let COLS, ROWS, N, CW, CH;
let cellEls = [];
let cells = [];

function layout(){
  const isNarrow = innerWidth < 760;
  CW = isNarrow ? 26 : 30;
  CH = isNarrow ? 22 : 21;
  const panelW = isNarrow ? 0 : 320;
  const avail = innerWidth - panelW - 46;
  COLS = Math.max(16, Math.min(46, Math.floor(avail / CW)));
  ROWS = Math.max(14, Math.min(32, Math.floor((innerHeight - 168) / CH)));
  N = COLS * ROWS;
}

function colName(n){ let s=''; n++; while(n>0){const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0;} return s; }
function ref(i){ return colName(i%COLS)+(Math.floor(i/COLS)+1); }
function nbrs(i){ const x=i%COLS,y=i/COLS|0,o=[]; if(x>0)o.push(i-1); if(x<COLS-1)o.push(i+1); if(y>0)o.push(i-COLS); if(y<ROWS-1)o.push(i+COLS); return o; }
function dist(a,b){ return Math.abs(a%COLS-b%COLS)+Math.abs((a/COLS|0)-(b/COLS|0)); }
const rnd = (a=1)=>Math.random()*a;
const pick = arr => arr[Math.random()*arr.length|0];
const clamp = (v,lo,hi)=>v<lo?lo:v>hi?hi:v;
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}

// ---------- 세계 상태 ----------
const dirty = new Set();
let factions = [];
let governors = [];               // 영주(하위 에이전트) 풀
let year = 1, tickN = 0, pop = 0;
let selected = -1, selFaction = null;
let paused = false, speedIdx = 1;
const SPEEDS = [240, 130, 70];
const SPEED_LBL = ['×0.5','×1','×2'];

// 기록 시트
const chronicle = [];   // {year, kind, faction, text, formula}
const obituaries = [];  // {year, name, cause, born, peakSize}
let warLogCooldown = 0;

// 위협: 역병/화재 (창발 압력원)
const plague = new Map();
const fires = new Map();

// ---------- 국가 정의 ----------
const NAMES = ['북부 왕국','붉은 제국','해안 연맹','유목 칸국','삼나무 공화국','잿빛 교단','동방 상단','검은 강 부족','여명 왕조','소금 사막 민족','은빛 도시국','남방 군도'];
const COLORS = ['#2563eb','#dc2626','#059669','#7c3aed','#d97706','#0d9488','#be185d','#4d7c0f','#9333ea','#b45309','#0891b2','#65a30d'];
let nameIdx = 0;

// 성격 축: 호전성, 충성요구(중앙집권), 야망, 신의(약속을 지키는 정도), 의심
function rollTraits(){
  return {
    aggr: rnd(),          // 호전성
    central: rnd(),       // 중앙집권 성향(영주 통제 강도)
    ambition: rnd(),      // 팽창 야망
    honor: 0.2+rnd(0.8),  // 신의(높으면 약속 잘 지킴)
    paranoia: rnd(),      // 의심(동맹도 못 믿음)
  };
}
// 감정: 동적으로 변하는 상태. 의사결정 효용에 가중.
function newMood(){ return {joy:0, anger:0, sorrow:0, fear:0, pride:0}; }
const MOOD_FACE = m => {
  const e = [['anger','😠'],['fear','😨'],['sorrow','😢'],['pride','😤'],['joy','😄']];
  let best='', bv=0.22;
  for(const [k,f] of e){ if(m[k]>bv){bv=m[k]; best=f;} }
  return best || '😐';
};
const MOOD_NAME = m => {
  const e = [['anger','분노'],['fear','공포'],['sorrow','비탄'],['pride','자긍'],['joy','환희']];
  let best='평정', bv=0.22;
  for(const [k,n] of e){ if(m[k]>bv){bv=m[k]; best=n;} }
  return best;
};

function decayMood(m){
  for(const k in m){ m[k]*=0.965; if(m[k]<0.004)m[k]=0; }
}
function feel(m, k, amt){ m[k]=clamp(m[k]+amt,0,1.4); }

function spawnFaction(announce, viaSea){
  if(nameIdx>=NAMES.length) nameIdx=0;
  const idx = nameIdx++;
  const f = {
    id: factions.length? Math.max(...factions.map(x=>x.id))+1 : 0,
    name: NAMES[idx], color: COLORS[idx%COLORS.length],
    traits: rollTraits(), mood: newMood(),
    golden: 0, size: 0, arr: [], capital: -1,
    born: year, peakSize: 0,
    rel: {},          // otherId -> relation object
    memory: [],       // 최근 외교 사건 기억(텍스트)
    treasury: 12,     // 외교 자원(동맹/뇌물 등)
    stance: 'neutral',// 현재 전략 기조
    grudge: {},       // otherId -> 누적 원한 점수
  };
  // 영토 한 칸 확보
  for(let t=0;t<400;t++){
    const i = Math.random()*N|0;
    const c = cells[i];
    if(c.st==='land' && c.owner===null){
      setCell(i, f.id, 1, '개척지');
      f.capital = i;
      cellEls[i].classList.add('cap');
      factions.push(f);
      // 초대 영주 한 명
      makeGovernor(f, i);
      if(announce){
        const verb = viaSea? '바다 건너에서 도래' : '역사에 등장';
        logEvent('birth', f, `${f.name}이(가) ${verb}했습니다. (기조: ${stanceWord(f)})`,
          `=SPAWN("${f.name}", ${ref(i)}, 성격:{호전 ${pct(f.traits.aggr)}, 야망 ${pct(f.traits.ambition)}})`);
      }
      return f;
    }
  }
  nameIdx--;
  return null;
}
const pct = v => Math.round(v*100);
function facById(id){ return factions.find(f=>f.id===id); }

function stanceWord(f){
  const t=f.traits;
  if(t.aggr>0.6 && t.ambition>0.5) return '정복';
  if(t.honor>0.7 && t.aggr<0.45) return '신의';
  if(t.paranoia>0.65) return '경계';
  if(t.ambition>0.65) return '팽창';
  return '존속';
}

// ---------- 영주(하위 에이전트) ----------
const GOV_NAMES = ['카일','메렌','토르','이샤','발록','세렌','오딘','마리','두칸','레프','아샤','노른','베인','퀼른','자라','모르','테온','윈드','갈','루카','네샤','보름','히엔','달','크론'];
let govNameI = 0;
function makeGovernor(f, seat){
  const g = {
    id: governors.length,
    name: GOV_NAMES[govNameI++ % GOV_NAMES.length],
    factionId: f.id,
    seat,                         // 본거지 셀
    loyalty: 0.45+rnd(0.5),       // 충성도
    ambition: rnd(),              // 영주 개인 야망(높으면 독립 위험)
    aggr: clamp(f.traits.aggr*0.6+rnd(0.6),0,1),
    grievance: 0,                 // 불만 누적
    mood: newMood(),
    order: null,                  // 지도자가 내린 현재 명령
    rebelled: false,
  };
  governors.push(g);
  return g;
}
function govsOf(fid){ return governors.filter(g=>g.factionId===fid && !g.rebelled); }

// ---------- 지형 / 셀 ----------
function setCell(i, owner, level, histLabel){
  const c = cells[i];
  c.owner=owner; c.level=level; c.st='land';
  if(histLabel){ c.hist.push(`서기 ${year}: ${histLabel}`); if(c.hist.length>8)c.hist.shift(); }
  dirty.add(i);
}
const LV_TXT = ['','·','田','邑','城'];
const LV_LABEL = ['','개척지','농장','읍','성도'];

function buildWorld(){
  layout();
  sheetEl.style.gridTemplateColumns = `40px repeat(${COLS}, ${CW}px)`;
  sheetEl.style.gridAutoRows = CH+'px';
  sheetEl.innerHTML='';
  cellEls = new Array(N); cells = new Array(N);
  // DOM
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const h=document.createElement('div'); h.className='hd'; h.textContent=colName(c); frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div'); h.className='hd'; h.textContent=r+1; frag.appendChild(h);
    for(let c=0;c<COLS;c++){const d=document.createElement('div'); d.className='cell'; d.dataset.i=r*COLS+c; cellEls[r*COLS+c]=d; frag.appendChild(d);}
  }
  sheetEl.appendChild(frag);
  // 지형 노이즈
  const GW=10, GH=7, gz=[];
  for(let i=0;i<GW*GH;i++) gz[i]=Math.random();
  const noise=(x,y)=>{
    const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
    const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
    const a=gz[y0*GW+x0], b=gz[y0*GW+Math.min(GW-1,x0+1)];
    const c=gz[Math.min(GH-1,y0+1)*GW+x0], d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
    return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
  };
  for(let i=0;i<N;i++){
    const x=i%COLS,y=i/COLS|0;
    const v=noise(x,y)+(Math.random()-.5)*.14;
    let st='land', hist=['황무지'];
    if(v<.32){st='water'; hist=['바다'];}
    else if(v>.63 && Math.random()<.7){st='forest'; hist=['숲'];}
    cells[i]={st, owner:null, level:0, hist, ruinT:0};
  }
  for(let i=0;i<N;i++) paint(i);
}

function paint(i){
  const c=cells[i], el=cellEls[i];
  let bg='',tx='',col='#222',w='';
  if(plague.has(i)){bg='#ead5f5';tx='疫';col='#7030a0';w='700';}
  else if(fires.has(i)){bg='#ffd9b3';tx='火';col='#c00000';w='700';}
  else if(c.st==='water'){bg='#ddebf7';tx='≈';col='#9dc3e6';}
  else if(c.st==='forest'){bg='#e9f2e1';tx='木';col='#6a9c4a';}
  else if(c.st==='ruin'){bg='#ececec';tx='墟';col='#999';}
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){ bg=hexA(f.color,.14+c.level*.18); tx=LV_TXT[c.level]; col=f.color; w=c.level>=3?'700':''; }
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w; el.textContent=tx;
  if(c.owner!==null && i===facById(c.owner)?.capital) el.classList.add('cap'); else el.classList.remove('cap');
}

// ---------- 로그 / 알림 ----------
function logEvent(kind, f, msg, formula, toastBig){
  const yr = `서기 ${year}년`;
  statEv.textContent = `${yr}: ${msg}`;
  if(formula) fmla.textContent = formula;
  chronicle.push({year, kind, faction:f?f.name:'', color:f?f.color:'#555', text:msg, formula:formula||''});
  if(chronicle.length>600) chronicle.shift();
  if(toastBig) toast(msg, f?f.color:'#888');
  if(currentView!=='map') renderDoc();
}
function toast(msg, color){
  const d=document.createElement('div'); d.className='tmsg'; d.textContent=msg;
  if(color) d.style.borderLeft=`4px solid ${color}`;
  toastEl.appendChild(d);
  setTimeout(()=>d.remove(), 3300);
  while(toastEl.children.length>3) toastEl.firstChild.remove();
}
function flashWar(i){const el=cellEls[i]; el.classList.add('war'); setTimeout(()=>el.classList.remove('war'),900);}
function flashBetray(i){const el=cellEls[i]; el.classList.add('betray'); setTimeout(()=>el.classList.remove('betray'),1300);}

// ---------- 외교 관계 모델 ----------
// relation: {opinion:-100..100, type:'cold'|'pact'|'ally'|'war', since, betrayed:bool}
function relOf(a, b){
  if(a.rel[b.id]) return a.rel[b.id];
  const r = {opinion: -10+rnd(20), type:'cold', since:year, betrayed:false, pactYears:0};
  a.rel[b.id]=r; return r;
}
function setMutual(a,b,patch){ Object.assign(relOf(a,b),patch); Object.assign(relOf(b,a),patch); }
function adjOpinion(a,b,d){ const r=relOf(a,b); r.opinion=clamp(r.opinion+d,-100,100); }

function remember(f, txt){ f.memory.push(`서기${year}: ${txt}`); if(f.memory.length>6) f.memory.shift(); }

// 두 세력이 국경을 맞대는가 (외교 결정의 핵심 입력)
function borders(a,b){
  for(const i of a.arr){ for(const n of nbrs(i)){ if(cells[n].owner===b.id) return true; } }
  return false;
}
function relWord(t){ return t==='ally'?'동맹':t==='pact'?'불가침':t==='war'?'전쟁':'중립'; }

// ---------- 지도자 의사결정(자율 에이전트) ----------
// 매 N틱마다 각 세력이 "현 상황을 보고" 외교/전략 결정을 스스로 내림.
function decideStrategy(f){
  const t=f.traits, m=f.mood;
  // 감정이 가중하는 효용
  const warDrive = t.aggr*0.5 + t.ambition*0.3 + m.anger*0.6 + m.pride*0.3 - m.fear*0.5 - m.sorrow*0.3;
  const allyDrive = (1-t.aggr)*0.3 + t.paranoia*0.2 + m.fear*0.7 + (1-t.honor)*-0.1;
  const others = factions.filter(o=>o.id!==f.id);

  // 1) 위협 평가 → 동맹 제안
  let strongest = null, myPow = power(f);
  for(const o of others) if(!strongest || power(o)>power(strongest)) strongest=o;
  if(strongest && power(strongest) > myPow*1.2 && allyDrive>0.15 && f.treasury>=3){
    // 강자를 견제할 동맹 상대 찾기: 강자와 사이 나쁘고, 나와 적대 아닌 자
    const cand = others.filter(o=>o.id!==strongest.id && relOf(o,strongest).type!=='ally'
      && relOf(f,o).type!=='war' && relOf(f,o).opinion>-30);
    if(cand.length){
      cand.sort((x,y)=>relOf(y,f).opinion-relOf(x,f).opinion);
      proposeAlliance(f, cand[0], `${strongest.name}의 패권 견제`);
      return;
    }
  }

  // 2) 분노/원한 → 전쟁 선포 또는 동맹 파기
  for(const o of others){
    const r = relOf(f,o);
    const grud = f.grudge[o.id]||0;
    if(r.type==='ally' && (grud>40 || (m.anger>0.7 && t.honor<0.4 && rnd()<0.4) || (t.paranoia>0.7 && power(o)>myPow*1.4 && rnd()<0.3))){
      // 동맹 배신!
      betrayAlliance(f, o);
      return;
    }
    if((r.type==='cold'||r.type==='pact') && borders(f,o)){
      const hostl = warDrive*0.6 + grud*0.012 + (r.opinion<-40?0.35:0) + (power(o)<myPow*0.7?0.3:0);
      if(hostl>0.85 && f.size>2 && rnd()<0.5){
        declareWar(f, o, grud>30?'묵은 원한':'영토 야욕');
        return;
      }
    }
  }

  // 3) 평화 모색: 지치고 약하면 종전 제안
  for(const o of others){
    const r=relOf(f,o);
    if(r.type==='war'){
      const warExhaust = m.fear>0.6 || power(f)<myPow*0.6 || f.size<=2 || (m.sorrow>0.6 && rnd()<0.5);
      if(warExhaust && rnd()<0.4){ sueForPeace(f,o); return; }
    }
  }

  // 3.5) 우호국과 정식 동맹 (위협 없이도 외교가 살아있게)
  for(const o of others){
    const r=relOf(f,o);
    if((r.type==='pact'||r.type==='cold') && r.opinion>28 && relOf(o,f).opinion>15
       && t.honor>0.4 && f.treasury>=3 && rnd()<0.4){
      proposeAlliance(f, o, '우호 증진');
      return;
    }
  }

  // 4) 불가침/우호 강화
  for(const o of others){
    const r=relOf(f,o);
    if(r.type==='cold' && r.opinion>20 && t.honor>0.5 && rnd()<0.3 && f.treasury>=2){
      setMutual(f,o,{type:'pact', since:year});
      f.treasury-=2; o.treasury+=1;
      remember(f,`${o.name}과 불가침 체결`); remember(o,`${f.name}과 불가침 체결`);
      logEvent('pact', f, `${f.name}과 ${o.name}이(가) 불가침 조약을 맺었습니다.`,
        `=PACT("${f.name}","${o.name}", ${year})`);
      feel(o.mood,'joy',0.2);
      return;
    }
  }
  f.treasury = clamp(f.treasury + 0.5 + f.size*0.03, 0, 40);
}

function power(f){
  if(!f._powCache || f._powTick!==tickN){
    let p=0; const PW=[0,1,3,7,14];
    for(const i of f.arr) p += PW[cells[i].level];
    p *= (1 + 0.25*allyCount(f)) * (f.golden?1.3:1);
    f._powCache=p; f._powTick=tickN;
  }
  return f._powCache;
}
function allyCount(f){ return factions.filter(o=>o.id!==f.id && relOf(f,o).type==='ally').length; }

// ---------- 외교 액션 ----------
function proposeAlliance(f, o, reason){
  if(relOf(f,o).type==='war') return;
  f.treasury -= 3;
  // o가 자율적으로 수락 여부 판단
  const ro = relOf(o,f);
  const grud = o.grudge[f.id]||0;
  const accept = ro.opinion + o.traits.honor*30 + o.mood.fear*40 - o.traits.paranoia*30 - grud*0.5
                 + (power(f)>power(o)?15:0);
  if(accept>15 && rnd()<0.85){
    setMutual(f,o,{type:'ally', since:year, betrayed:false});
    adjOpinion(f,o,25); adjOpinion(o,f,25);
    o.treasury+=2;
    feel(f.mood,'joy',0.3); feel(o.mood,'joy',0.3);
    remember(f,`${o.name}과 동맹 (${reason})`); remember(o,`${f.name}이 동맹 제안→수락`);
    logEvent('ally', f, `${f.name}과 ${o.name}이(가) 동맹을 맺었습니다. — ${reason}`,
      `=ALLY("${f.name}","${o.name}", "${reason}")`, true);
  } else {
    adjOpinion(f,o,-8);
    feel(f.mood,'sorrow',0.18);
    remember(f,`${o.name}이 동맹 거절`);
    logEvent('snub', f, `${o.name}이(가) ${f.name}의 동맹 제안을 거절했습니다.`,
      `=REJECT("${o.name}", "${f.name}")`);
  }
}
function betrayAlliance(f, o){
  setMutual(f,o,{type:'war', since:year, betrayed:true});
  adjOpinion(o,f,-80); adjOpinion(f,o,-20);
  o.grudge[f.id]=(o.grudge[f.id]||0)+80;       // 영구적 원한
  feel(o.mood,'anger',1.0); feel(o.mood,'sorrow',0.7); feel(o.mood,'fear',0.3);
  feel(f.mood,'pride',0.2);
  // 배신은 평판을 떨어뜨림 → 제3국들이 f를 불신
  for(const x of factions){ if(x.id!==f.id&&x.id!==o.id){ adjOpinion(x,f,-18); remember(x,`${f.name}이 ${o.name} 배신—신뢰 추락`);} }
  // 시각: 국경 셀 배신 플래시
  for(const i of f.arr){ for(const n of nbrs(i)){ if(cells[n].owner===o.id){ flashBetray(n); break; } } }
  remember(f,`${o.name} 동맹 배신`); remember(o,`${f.name}에게 배신당함!`);
  logEvent('betray', f, `⚡ ${f.name}이(가) 동맹국 ${o.name}을(를) 배신했습니다! 신의가 무너졌습니다.`,
    `=BETRAY("${f.name}"⇒"${o.name}", 평판 -18)`, true);
}
function declareWar(f, o, reason){
  if(relOf(f,o).type==='war') return;
  const wasAlly = relOf(f,o).type==='ally';
  setMutual(f,o,{type:'war', since:year, betrayed:wasAlly});
  adjOpinion(f,o,-30); adjOpinion(o,f,-40);
  feel(f.mood,'pride',0.25); feel(f.mood,'anger',0.2);
  feel(o.mood,'anger',0.5); feel(o.mood,'fear',0.3);
  o.grudge[f.id]=(o.grudge[f.id]||0)+25;
  remember(f,`${o.name}에 선전포고(${reason})`); remember(o,`${f.name}이 침략(${reason})`);
  logEvent('war', f, `⚔ ${f.name}이(가) ${o.name}에 선전포고했습니다. — ${reason}`,
    `=DECLARE.WAR("${f.name}"→"${o.name}", "${reason}")`, true);
  // 동맹 참전(연쇄 외교): f의 적의 동맹이 o편으로
  for(const ally of factions){
    if(ally.id!==f.id && ally.id!==o.id && relOf(ally,o).type==='ally' && relOf(ally,f).type!=='war'){
      if(ally.traits.honor>0.4 && rnd()<0.6){
        setMutual(ally,f,{type:'war', since:year});
        adjOpinion(ally,f,-25);
        logEvent('war', ally, `${ally.name}이(가) 동맹 ${o.name}을 위해 참전했습니다.`,
          `=CALL.TO.ARMS("${o.name}"←"${ally.name}")`);
      }
    }
  }
}
function sueForPeace(f, o){
  const ro=relOf(o,f);
  const accept = -ro.opinion*0.2 + o.mood.fear*40 + (power(o)<power(f)?20:0) + 15;
  if(accept>10 && rnd()<0.7){
    setMutual(f,o,{type:'cold', since:year});
    adjOpinion(f,o,15); adjOpinion(o,f,15);
    feel(f.mood,'joy',0.25); feel(o.mood,'joy',0.25);
    remember(f,`${o.name}과 종전`); remember(o,`${f.name}과 종전`);
    logEvent('peace', f, `🕊 ${f.name}과 ${o.name}이(가) 평화 협정을 맺었습니다.`,
      `=PEACE("${f.name}","${o.name}", ${year})`, true);
  } else {
    logEvent('peace', f, `${o.name}이(가) ${f.name}의 강화 제안을 거부했습니다.`,
      `=REJECT.PEACE("${o.name}")`);
    feel(f.mood,'sorrow',0.2);
  }
}

// ---------- 지도자→영주 명령 & 영주 자율 수행 ----------
function issueOrders(f){
  const govs = govsOf(f.id);
  if(!govs.length) return;
  // 지도자 전략 기조 → 명령 종류
  let order='develop';
  const enemies = factions.filter(o=>relOf(f,o).type==='war');
  if(enemies.length && (f.traits.aggr>0.4 || f.mood.anger>0.5)) order='attack';
  else if(f.traits.ambition>0.55 && f.mood.fear<0.5) order='expand';
  else if(f.mood.fear>0.6) order='fortify';
  for(const g of govs){
    g.order = order;
    // 중앙집권 강하면 명령 강제, 약하면 영주 재량
    const compliance = f.traits.central*0.5 + g.loyalty*0.5 - g.grievance*0.01 - g.ambition*0.15;
    g.willComply = compliance > 0.45 || rnd()<compliance;
  }
}

// 영주 행동: 명령을 따르거나, 불만/야망 따라 항명·독립
function actGovernor(g){
  const f = facById(g.factionId);
  if(!f || f.size===0) return;
  decayMood(g.mood);
  // 불만 누적 요인: 전쟁 피로, 충성 낮음, 야망 높음, 본국이 약해짐
  if(f.mood.fear>0.6) g.grievance += 0.4;
  if(power(f) < (f._peakPow||1)*0.5) g.grievance += 0.5;
  g.grievance = clamp(g.grievance - 0.15, 0, 100);

  // ★ 항명/독립 판정 (창발적 배신) — 본국이 충분히 클 때만 의미
  if(!g.rebelled && f.size>=4 && (g.grievance>26 || (g.ambition>0.7 && g.loyalty<0.45 && f.mood.fear>0.4))
     && rnd()<0.09){
    secede(g, f);
    return;
  }

  // 명령 수행 (또는 재량 행동)
  const myCells = f.arr.filter(i=>true); // 영주는 본국 영토에서 작전(간략화)
  if(!myCells.length) return;
  let mode = g.order || 'develop';
  if(!g.willComply){
    // 항명: 명령 무시하고 자기 성향대로
    mode = g.aggr>0.6 ? 'attack' : g.ambition>0.5 ? 'expand' : 'fortify';
    if(rnd()<0.02 && f.traits.central>0.6){
      g.loyalty=clamp(g.loyalty-0.05,0,1);
      logEvent('defy', f, `${f.name}의 영주 ${g.name}이(가) 칙령을 거역했습니다. (충성 ${pct(g.loyalty)})`,
        `=DEFY("${g.name}", "${f.name}", 충성 ${pct(g.loyalty)})`);
    }
  }
  carryOut(f, g, mode, myCells);
}

function secede(g, parent){
  g.rebelled = true;
  // 새 독립 세력 생성, 영주 주변 영토를 떼어감
  if(nameIdx>=NAMES.length) nameIdx=0;
  const seedCells = parent.arr.filter(i=>dist(i,g.seat)<=2).slice(0, Math.max(2, parent.size/3|0));
  if(seedCells.length<2){ g.grievance=0; return; }
  const nf = {
    id: factions.length? Math.max(...factions.map(x=>x.id))+1:0,
    name: `${g.name} 독립국`, color: COLORS[(nameIdx++)%COLORS.length],
    traits: {aggr:g.aggr, central:rnd(), ambition:g.ambition, honor:0.3+rnd(0.5), paranoia:0.4+rnd(0.5)},
    mood: newMood(), golden:0, size:0, arr:[], capital:g.seat, born:year, peakSize:0,
    rel:{}, memory:[], treasury:6, grudge:{}, stance:'neutral',
  };
  feel(nf.mood,'pride',0.6);
  for(const i of seedCells){ cells[i].owner=nf.id; cells[i].hist.push(`서기 ${year}: ${g.name} 반란 가담`); dirty.add(i); }
  factions.push(nf);
  // 모국과는 즉시 전쟁 + 깊은 원한
  setMutual(nf, parent, {type:'war', since:year, betrayed:true});
  adjOpinion(parent,nf,-70); parent.grudge[nf.id]=60; nf.grudge[parent.id]=40;
  feel(parent.mood,'anger',0.9); feel(parent.mood,'sorrow',0.6);
  remember(parent, `${g.name}의 반란—국토 분열`);
  for(const i of seedCells) flashBetray(i);
  makeGovernor(nf, g.seat);
  logEvent('secede', nf, `🔥 ${parent.name}의 영주 ${g.name}이(가) 독립을 선포했습니다! '${nf.name}' 건국.`,
    `=SECEDE("${g.name}"⇗"${nf.name}", from "${parent.name}")`, true);
}

function carryOut(f, g, mode, myCells){
  const attempts = 1 + (f.size*0.06|0);
  for(let a=0;a<attempts;a++){
    const src = pick(myCells);
    if(src===undefined || cells[src].owner!==f.id) continue;
    const nb = nbrs(src);
    const tgt = pick(nb);
    const tc = cells[tgt];
    if(tc===undefined || tc.st==='water' || fires.has(tgt)) continue;

    if(tc.owner===null){
      if(mode==='fortify' && rnd()<0.5) continue;
      if(tc.st==='forest'){ if(rnd()<0.25){ tc.st='land'; setCell(tgt,f.id,1,'개간'); } }
      else if(tc.st==='land') setCell(tgt,f.id,1,'개척지');
    } else if(tc.owner!==f.id){
      const o = facById(tc.owner);
      if(!o) continue;
      const r = relOf(f,o);
      // 동맹/불가침은 공격 안 함 (단, 명령이 attack이고 신의 낮으면 가끔 국지 도발)
      if(r.type==='ally') continue;
      if(r.type==='pact' && !(mode==='attack' && f.traits.honor<0.35 && rnd()<0.05)) continue;
      const wantAttack = (mode==='attack') || (mode==='expand' && r.type==='war') || (r.type==='war');
      if(!wantAttack) continue;
      if(r.type!=='war' && rnd()<0.5) continue;

      // 전투 (영주 호전성/감정 가중)
      const att = 1 + rnd(3) + f.size*0.002 + (f.golden?1.2:0) + g.aggr*1.5 + f.mood.anger*1.2 + allyCount(f)*0.4;
      const def = tc.level + 1 + rnd(3) + (o.golden?1:0) + o.mood.pride*0.8;
      flashWar(tgt);
      if(att>def){
        feel(f.mood,'pride',0.12); feel(f.mood,'joy',0.08);
        feel(o.mood,'anger',0.18); feel(o.mood,'sorrow',0.14); feel(o.mood,'fear',0.16);
        o.grudge[f.id]=(o.grudge[f.id]||0)+3;
        if(rnd()<0.28){
          fires.set(tgt,5); tc.hist.push(`서기 ${year}: 전화(戰火)`); dirty.add(tgt);
        } else {
          const wasCapital = tgt===o.capital;
          setCell(tgt, f.id, Math.max(1,tc.level-1), '점령됨');
          if(wasCapital){
            // 수도 함락 = 큰 사건
            const remain = o.arr.filter(x=>x!==tgt);
            o.capital = remain.length? remain[0] : -1;
            feel(o.mood,'sorrow',0.6); feel(o.mood,'fear',0.5); feel(f.mood,'pride',0.4);
            logEvent('war', f, `${f.name}이(가) ${o.name}의 수도 ${ref(tgt)}를 함락했습니다!`,
              `=SIEGE.CAPITAL("${f.name}"→"${o.name}", ${ref(tgt)})`, true);
            warLogCooldown=20;
          }
        }
        if((tc.level>=3 || warLogCooldown===0)){
          logEvent('war', f, `${f.name}이(가) ${o.name}의 ${LV_LABEL[Math.max(1,tc.level)]||'영토'}(${ref(tgt)})를 공격했습니다.`,
            `=ATTACK("${f.name}"→"${o.name}", ${ref(tgt)})`);
          warLogCooldown=35;
        }
      } else {
        // 방어 성공
        feel(o.mood,'pride',0.15); feel(f.mood,'sorrow',0.06);
      }
    }
  }
  // 발전
  if(mode!=='attack' || rnd()<0.5){
    const ups = 1 + (f.size*0.05|0);
    for(let u=0;u<ups;u++){
      const i = pick(myCells);
      if(i===undefined || cells[i].owner!==f.id) continue;
      const c=cells[i];
      if(c.level<4 && rnd()<0.06*(f.golden?2.5:1)*(mode==='develop'?1.5:1)){
        c.level++; c.hist.push(`서기 ${year}: ${LV_LABEL[c.level]}`); dirty.add(i);
        if(c.level===4){
          feel(f.mood,'pride',0.2);
          if(warLogCooldown===0){
            logEvent('build', f, `${f.name}의 ${ref(i)}에 성도(城都)가 완성되었습니다.`,
              `=CITY("${f.name}", ${ref(i)})`);
            warLogCooldown=22;
          }
        }
      }
    }
  }
}

// ---------- 메인 틱 ----------
function tick(){
  if(paused) return;
  tickN++; year++;
  if(warLogCooldown>0) warLogCooldown--;

  // 재집계
  for(const f of factions){ f.arr.length=0; f.size=0; }
  pop=0;
  const PW=[0,40,160,520,1400];
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin' && --c.ruinT<=0){ c.st='land'; dirty.add(i); }
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){ f.arr.push(i); f.size++; pop+=PW[c.level]; }
      else { c.owner=null; c.level=0; dirty.add(i); }
    }
  }
  for(const f of factions){
    f.peakSize=Math.max(f.peakSize,f.size);
    f._peakPow=Math.max(f._peakPow||0, power(f));
    if(f.capital>=0 && cells[f.capital].owner!==f.id){ // 수도 잃으면 재배치
      f.capital = f.arr.length? f.arr[0] : -1;
    }
  }

  // 멸망
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      // 사인 추정
      const killer = factions.reduce((best,o)=>{
        if(o.id===f.id) return best;
        const g=(o.grudge[f.id]||0)+(relOf(o,f).type==='war'?20:0);
        return (!best||g>best.g)?{o,g}:best;
      }, null);
      const cause = killer && killer.g>10 ? `${killer.o.name}에게 정복됨` : '쇠퇴하여 소멸';
      obituaries.push({year, name:f.name, cause, born:f.born, peakSize:f.peakSize});
      // 다른 세력 감정 반응
      for(const o of factions){
        if(o.id===f.id) continue;
        if(relOf(o,f).type==='ally'){ feel(o.mood,'sorrow',0.5); }
        else if(relOf(o,f).type==='war'){ feel(o.mood,'joy',0.3); feel(o.mood,'pride',0.2); }
      }
      logEvent('collapse', f, `† ${f.name}이(가) 역사에서 사라졌습니다. (${cause})`,
        `=COLLAPSE("${f.name}", ${year}, "${cause}")`, true);
      // 관계 정리
      for(const o of factions) delete o.rel[f.id];
      governors = governors.filter(g=>g.factionId!==f.id);
      factions.splice(k,1);
    }
  }

  // 위협 처리 (화재/역병)
  processFires(); processPlague();

  // 감정 자연 감쇠
  for(const f of factions) decayMood(f.mood);

  // 외교 결정 (각 세력 자율, 시차 두고)
  for(const f of factions){
    if(f.size===0) continue;
    if((tickN + f.id*5) % 8 === 0) decideStrategy(f);
    if((tickN + f.id*3) % 4 === 0) issueOrders(f);
  }
  // 영주 행동
  for(const g of governors) actGovernor(g);
  // 황금기 카운트다운
  for(const f of factions) if(f.golden>0) f.golden--;

  randomEvents();

  // 그리기
  for(const i of dirty) paint(i);
  dirty.clear();

  // 상태바 + 패널
  statFixed.innerHTML = `준비<span class="sep">|</span>서기 ${year}년<span class="sep">|</span>인구 ${pop.toLocaleString()}<span class="sep">|</span>국가 ${factions.length}<span class="sep">|</span>전쟁 ${countWars()}건<span class="sep">|</span>동맹 ${countAllies()}쌍<span class="sep">|</span>`;
  if(tickN%7===0){ renderPanel(); renderLegend(); document.title=`외교사.xlsx - Excel (서기 ${year}년)`;
    document.getElementById('tab-dead').textContent=`멸망기록 (${obituaries.length})`; }
}

function countWars(){ let s=new Set(); for(const a of factions)for(const b of factions)if(a.id<b.id&&relOf(a,b).type==='war')s.add(a.id+'-'+b.id); return s.size; }
function countAllies(){ let s=new Set(); for(const a of factions)for(const b of factions)if(a.id<b.id&&relOf(a,b).type==='ally')s.add(a.id+'-'+b.id); return s.size; }

function processFires(){
  for(const [i,t] of [...fires]){
    if(rnd()<.12){ for(const n of nbrs(i)){ const c=cells[n]; if(c.owner!==null&&!fires.has(n)&&c.st==='land'){fires.set(n,5);dirty.add(n);} } }
    if(t<=1){ fires.delete(i); const c=cells[i]; c.owner=null;c.level=0;c.st='ruin';c.ruinT=200; c.hist.push(`서기 ${year}: 잿더미`); dirty.add(i); }
    else fires.set(i,t-1);
  }
}
function processPlague(){
  if(!plague.size) return;
  for(const [i,t] of [...plague]){
    if(rnd()<.16){ for(const n of nbrs(i)){ if(cells[n].owner!==null&&!plague.has(n)){plague.set(n,11);dirty.add(n);} } }
    if(rnd()<.22){ const c=cells[i]; c.level--; if(c.level<=0){c.owner=null;c.level=0;c.hist.push(`서기 ${year}: 역병 소멸`);} dirty.add(i); }
    if(t<=1){ plague.delete(i); dirty.add(i); } else plague.set(i,t-1);
  }
  if(plague.size===0) logEvent('plague', null, '역병이 물러갔습니다.', '=PLAGUE.END()');
}

function randomEvents(){
  const r=Math.random();
  if(!plague.size && r<.004){
    const big=[]; for(let i=0;i<N;i++) if(cells[i].owner!==null&&cells[i].level>=3) big.push(i);
    if(big.length){ const i=pick(big); plague.set(i,11); dirty.add(i);
      const f=facById(cells[i].owner); if(f) feel(f.mood,'fear',0.5);
      logEvent('plague', f, `${ref(i)}에서 역병이 창궐했습니다.`, `=PLAGUE(${ref(i)})`, true); }
  } else if(r>.997 && factions.length){
    const f=pick(factions); f.golden=90; feel(f.mood,'joy',0.5); feel(f.mood,'pride',0.4);
    logEvent('golden', f, `✦ ${f.name}의 황금기가 시작되었습니다.`, `=GOLDEN.AGE("${f.name}", 90)`, true);
  } else if(r>.9945 && r<=.997){
    const tw=[]; for(let i=0;i<N;i++) if(cells[i].owner!==null&&cells[i].level>=2) tw.push(i);
    if(tw.length){ const i=pick(tw); fires.set(i,6); dirty.add(i);
      const f=facById(cells[i].owner); if(f) feel(f.mood,'sorrow',0.3);
      logEvent('fire', f, `${ref(i)}에 대화재가 발생했습니다.`, `=FIRE(${ref(i)})`); }
  }
  // 신생 세력 도래 (세계가 비면)
  if(factions.length<3 && rnd()<.02 && factions.length<7){
    spawnFaction(true, true);
  }
}

// ---------- 우측 패널: 외교 원장 ----------
function renderPanel(){
  if(innerWidth<760) return;
  let h='';
  const sorted=[...factions].sort((a,b)=>power(b)-power(a));
  for(const f of sorted){
    const m=f.mood;
    h+=`<div class="pwr" data-fid="${f.id}">`;
    h+=`<div class="hdr"><span class="sw" style="background:${f.color}"></span>`;
    h+=`<span class="nm" style="color:${f.color}">${f.name}${f.golden?' ✦':''}</span>`;
    h+=`<span class="mood" title="${MOOD_NAME(m)}">${MOOD_FACE(m)}</span></div>`;
    h+=`<div class="meta">영토 ${f.size}칸 · 국력 ${Math.round(power(f))} · 기조 ${stanceWord(f)} · 심정 <b>${MOOD_NAME(m)}</b>`;
    // 감정 막대
    const moods=[['anger','#dc2626'],['fear','#7c3aed'],['sorrow','#2563eb'],['pride','#d97706'],['joy','#059669']];
    h+='<div class="bar">';
    let acc=0; const tot=moods.reduce((s,[k])=>s+m[k],0)||1;
    for(const [k,c] of moods){ const w=m[k]/tot*100; if(w>0.5) h+=`<i style="width:${w}%;background:${c};float:left"></i>`; }
    h+='</div>';
    // 관계 태그
    let rels='';
    for(const o of factions){ if(o.id===f.id)continue; const r=relOf(f,o); if(r.type==='cold')continue;
      const cls=r.type; rels+=`<span class="rel ${cls}">${relWord(r.type)}: ${o.name}</span>`; }
    if(rels) h+=rels;
    // 영주
    const govs=govsOf(f.id);
    if(govs.length){ h+=`<div style="margin-top:3px;color:#888">영주: `+govs.map(g=>`${g.name}(충 ${pct(g.loyalty)}${g.grievance>20?' ⚠불만':''})`).join(', ')+`</div>`; }
    h+=`</div></div>`;
  }
  if(!factions.length) h='<div style="color:#999;padding:10px">모든 문명이 멸망했습니다. 새 세력이 도래하기를 기다립니다…</div>';
  panelBody.innerHTML=h;
}

function renderLegend(){
  let h='<h4>지형 / 범례</h4>';
  h+='<div class="row"><span class="sw" style="background:#ddebf7"></span>≈ 바다 &nbsp; <span class="sw" style="background:#e9f2e1"></span>木 숲</div>';
  h+='<div class="row">· 개척 田 농장 邑 읍 城 성도 ★수도</div>';
  h+='<div class="row"><span class="sw" style="background:#ead5f5"></span>疫 역병 <span class="sw" style="background:#ffd9b3"></span>火 화재 <span class="sw" style="background:#ececec"></span>墟 폐허</div>';
  legendEl.innerHTML=h;
}

// ---------- 시트 전환 (연대기 / 멸망기록) ----------
let currentView='map';
function setView(v){
  currentView=v;
  document.querySelectorAll('#tabs div').forEach(d=>d.classList.toggle('on', d.dataset.view===v));
  if(v==='map'){ docview.style.display='none'; }
  else { docview.style.display='block'; renderDoc(); }
}
function renderDoc(){
  if(currentView==='map') return;
  if(currentView==='chron'){
    let h='<table><thead><tr><th>연도</th><th>구분</th><th>사건</th><th>수식</th></tr></thead><tbody>';
    const kindLbl={birth:'건국',ally:'동맹',betray:'배신',war:'전쟁',pact:'불가침',peace:'강화',
      secede:'독립',collapse:'멸망',golden:'황금기',plague:'역병',fire:'재난',build:'건설',
      defy:'항명',snub:'거절'};
    for(const e of [...chronicle].reverse().slice(0,250)){
      h+=`<tr><td class="yr">서기 ${e.year}</td><td class="ftag" style="color:${e.color}">${kindLbl[e.kind]||e.kind}</td>`;
      h+=`<td>${esc(e.text)}</td><td style="color:#777;font-family:Consolas,monospace">${esc(e.formula)}</td></tr>`;
    }
    h+='</tbody></table>';
    docview.innerHTML=h;
  } else if(currentView==='dead'){
    let h=`<table><thead><tr><th>멸망 연도</th><th>국가</th><th>존속</th><th>최대 영토</th><th>사인</th></tr></thead><tbody>`;
    if(!obituaries.length) h+='<tr><td colspan="5" style="color:#999;text-align:center;padding:20px">아직 멸망한 문명이 없습니다.</td></tr>';
    for(const o of [...obituaries].reverse()){
      h+=`<tr><td class="yr">서기 ${o.year}</td><td class="dead">† ${esc(o.name)}</td>`;
      h+=`<td>${o.year-o.born}년</td><td>${o.peakSize}칸</td><td class="dead">${esc(o.cause)}</td></tr>`;
    }
    h+='</tbody></table>';
    docview.innerHTML=h;
  }
}
function esc(s){ return (s+'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- 상호작용: 셀 클릭 ----------
sheetEl.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  if(selected>=0 && cellEls[selected]) cellEls[selected].classList.remove('sel');
  selected=+t.dataset.i; t.classList.add('sel');
  namebox.textContent=ref(selected);
  const c=cells[selected];
  // 지도자(수도/★) 셀 클릭 → 칙령(플레이어 개입)
  const f = c.owner!==null? facById(c.owner) : null;
  if(f && selected===f.capital){
    showEdict(f);
  } else {
    fmla.textContent=`=HISTORY(${c.hist.slice(-5).map(x=>`"${x}"`).join(' → ')})`;
  }
});
// 패널 세력 클릭 → 그 세력 정보 + 수식바
panelBody.addEventListener('click', e=>{
  const w=e.target.closest('.pwr'); if(!w) return;
  const f=facById(+w.dataset.fid); if(!f) return;
  showEdict(f);
  if(f.capital>=0){
    if(selected>=0&&cellEls[selected]) cellEls[selected].classList.remove('sel');
    selected=f.capital; cellEls[selected].classList.add('sel'); namebox.textContent=ref(selected);
  }
});

// 플레이어 개입: 칙령 — 수식바에 그 세력 요약 + 토스트로 개입 가능 안내
function showEdict(f){
  const m=f.mood;
  const allies=factions.filter(o=>o.id!==f.id&&relOf(f,o).type==='ally').map(o=>o.name);
  const wars=factions.filter(o=>o.id!==f.id&&relOf(f,o).type==='war').map(o=>o.name);
  fmla.textContent=`=COUNCIL("${f.name}", 심정:${MOOD_NAME(m)}, 동맹:[${allies.join(',')||'없음'}], 적:[${wars.join(',')||'없음'}], 야망:${pct(f.traits.ambition)})`;
  // 개입 메뉴
  showEdictMenu(f);
}

// 간단한 개입 메뉴 (실재 동작): 사기진작 / 도발 / 화친 종용
let edictBox=null;
function showEdictMenu(f){
  if(edictBox) edictBox.remove();
  const box=document.createElement('div');
  box.style.cssText='position:absolute;z-index:9;background:#fff;border:1px solid #107c41;border-radius:4px;'+
    'box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:11px;min-width:180px;left:50%;top:46px;transform:translateX(-50%)';
  box.innerHTML=`<div style="background:#107c41;color:#fff;padding:4px 8px;font-weight:600">⚑ ${f.name} 어전회의</div>`+
    `<div style="padding:4px 0">`+
    `<div class="ed" data-a="rally" style="padding:5px 12px;cursor:pointer">📯 사기 진작 (분노·자긍 ↑)</div>`+
    `<div class="ed" data-a="provoke" style="padding:5px 12px;cursor:pointer">🔥 이웃 도발 (전쟁 위기)</div>`+
    `<div class="ed" data-a="court" style="padding:5px 12px;cursor:pointer">🕊 화친 종용 (전쟁 종식 시도)</div>`+
    `<div class="ed" data-a="purge" style="padding:5px 12px;cursor:pointer">⚔ 영주 숙청 (충성 ↑ 불만 ↑)</div>`+
    `</div>`;
  document.getElementById('sheetwrap').appendChild(box);
  edictBox=box;
  box.querySelectorAll('.ed').forEach(d=>{
    d.onmouseenter=()=>d.style.background='#eef7f1'; d.onmouseleave=()=>d.style.background='';
    d.onclick=ev=>{ ev.stopPropagation(); doEdict(f, d.dataset.a); box.remove(); edictBox=null; };
  });
  setTimeout(()=>{ document.addEventListener('click', closeEdict, {once:true}); },0);
}
function closeEdict(){ if(edictBox){edictBox.remove();edictBox=null;} }
function doEdict(f, a){
  if(!facById(f.id)) return;
  if(a==='rally'){
    feel(f.mood,'pride',0.5); feel(f.mood,'anger',0.3); feel(f.mood,'fear',-0.3);
    for(const g of govsOf(f.id)){ g.loyalty=clamp(g.loyalty+0.1,0,1); g.grievance=clamp(g.grievance-10,0,100); }
    logEvent('rally', f, `📯 [개입] ${f.name}이(가) 백성의 사기를 진작했습니다.`, `=RALLY("${f.name}")`, true);
  } else if(a==='provoke'){
    const targets=factions.filter(o=>o.id!==f.id && borders(f,o) && relOf(f,o).type!=='war');
    if(targets.length){ const o=pick(targets); feel(f.mood,'anger',0.6); declareWar(f,o,'군주의 도발'); }
    else toast('도발할 이웃이 없습니다.', f.color);
  } else if(a==='court'){
    const ws=factions.filter(o=>o.id!==f.id && relOf(f,o).type==='war');
    if(ws.length){ for(const o of ws) sueForPeace(f,o); }
    else toast('현재 전쟁 중이 아닙니다.', f.color);
  } else if(a==='purge'){
    const govs=govsOf(f.id);
    if(govs.length){
      const g=govs.reduce((a,b)=>(b.grievance>a.grievance?b:a));
      feel(f.mood,'fear',0.2);
      for(const gg of govsOf(f.id)){ gg.loyalty=clamp(gg.loyalty+0.15,0,1); gg.grievance=clamp(gg.grievance+8,0,100); }
      g.loyalty=clamp(g.loyalty-0.2,0,1);
      logEvent('purge', f, `⚔ [개입] ${f.name}이(가) 영주 ${g.name}을(를) 숙청했습니다. 공포가 충성을 샀습니다.`,
        `=PURGE("${f.name}","${g.name}")`, true);
    }
  }
}

// 탭 클릭
document.getElementById('tabs').addEventListener('click', e=>{
  const d=e.target.closest('div[data-view]'); if(d) setView(d.dataset.view);
});
// 속도/일시정지
document.getElementById('btn-speed').onclick=()=>{
  speedIdx=(speedIdx+1)%SPEEDS.length;
  document.getElementById('btn-speed').textContent='속도 '+SPEED_LBL[speedIdx];
  restartTimer();
};
document.getElementById('btn-pause').onclick=()=>{
  paused=!paused;
  document.getElementById('btn-pause').textContent=paused?'▶':'⏸';
};

let timer=null;
function restartTimer(){ if(timer)clearInterval(timer); timer=setInterval(tick, SPEEDS[speedIdx]); }

// ---------- 부팅 ----------
function boot(){
  buildWorld();
  renderLegend();
  fmla.textContent=`=SIM.DIPLOMACY($A$1:$${colName(COLS-1)}$${ROWS}, "동맹은 깨지기 위해 맺어진다")`;
  // 초기 세력
  spawnFaction(true); spawnFaction(true); spawnFaction(true); spawnFaction(true);
  renderPanel();
  restartTimer();
}
let rzTimer=null;
addEventListener('resize', ()=>{ clearTimeout(rzTimer); rzTimer=setTimeout(()=>{ /* 가벼운 재배치: 그리드만 */ }, 300); });
boot();
})();
</script>
