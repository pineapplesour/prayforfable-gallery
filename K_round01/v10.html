<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영웅전.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  *{box-sizing:border-box}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;overflow:hidden;white-space:nowrap}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px}
  #namebox{width:64px;min-width:64px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;font-size:11px}
  #fx{width:28px;min-width:28px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #main{display:flex;flex-direction:column;height:calc(100% - 30px - 28px - 26px)}
  #sheetstack{flex:1;position:relative;overflow:hidden;background:#fff}
  .pane{position:absolute;inset:0;overflow:auto;background:#fff;display:none}
  .pane.on{display:block}
  /* ---- Sheet1 : 지도 ---- */
  #sheet{display:grid;background:#fff;width:max-content}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:10px;position:sticky;z-index:3}
  .hd.cor{left:0;top:0;z-index:4}
  .hd.colh{top:0}
  .hd.rowh{left:0;z-index:3}
  .cell{border-right:1px solid #e8e8e8;border-bottom:1px solid #e8e8e8;
    display:flex;align-items:center;justify-content:center;font-size:11px;
    overflow:hidden;cursor:cell;position:relative;line-height:1}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:2}
  .cell.hero{font-weight:700}
  .cap{position:absolute;top:-1px;right:0px;font-size:7px;line-height:1;color:#b8860b}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #ff2d2d}50%{box-shadow:inset 0 0 0 2px #ffd0d0}}
  .war{animation:warf .3s 3}
  @keyframes coupf{0%,100%{box-shadow:inset 0 0 0 2px #7c2d12}50%{box-shadow:inset 0 0 0 2px #fbbf24}}
  .coup{animation:coupf .25s 4}
  /* ---- 패널 (legend) ---- */
  #legend{position:absolute;top:8px;right:10px;width:236px;max-height:calc(100% - 16px);
    overflow:auto;background:#fffdf4;border:1px solid #d8c66a;
    box-shadow:2px 3px 10px rgba(0,0,0,.18);padding:8px 10px;font-size:11px;z-index:5;line-height:1.55}
  #legend .sw{display:inline-block;width:9px;height:9px;margin-right:5px;border:1px solid rgba(0,0,0,.15);vertical-align:middle}
  #legend h4{margin:7px 0 3px;font-size:11px;color:#7a6a1f;border-bottom:1px solid #e3d9a8;padding-bottom:2px}
  #legend h4:first-child{margin-top:0}
  .frow{display:flex;justify-content:space-between;gap:4px;align-items:center;padding:1px 0}
  .frow b{font-weight:600}
  .mood{font-size:9px}
  .heroline{font-size:10.3px;padding:1px 0;color:#333}
  .heroline .ep{color:#92400e}
  .dead{color:#999;font-size:10px}
  .emo{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:2px;vertical-align:middle}
  /* ---- 연대기 / 영웅 / 멸망 시트 ---- */
  .logsheet{font-family:"맑은 고딕",sans-serif;font-size:11.5px;width:100%;border-collapse:collapse}
  .logsheet td,.logsheet th{border:1px solid #e3e3e3;padding:3px 8px;vertical-align:top}
  .logsheet th{background:#f5f5f5;color:#555;position:sticky;top:0;font-weight:600;z-index:2}
  .logsheet td.yr{width:74px;color:#107c41;font-family:Consolas,monospace;white-space:nowrap}
  .logsheet td.fm{font-family:Consolas,monospace;color:#444;width:240px;font-size:10.5px}
  .logsheet tr:nth-child(even){background:#fafafa}
  .tag{display:inline-block;font-size:9px;padding:0 4px;border-radius:2px;margin-right:4px;color:#fff;vertical-align:middle}
  .heroPane{padding:10px 14px}
  .hcard{border:1px solid #e0d7b0;background:#fffdf4;border-radius:3px;padding:8px 11px;margin-bottom:8px}
  .hcard .hn{font-size:13px;font-weight:700}
  .hcard .hep{color:#92400e;font-size:11px;margin-left:4px}
  .hcard .meta{color:#666;font-size:10.5px;margin:3px 0}
  .hcard .saga{font-size:11px;color:#333;line-height:1.5;margin-top:4px}
  .hcard .saga .ev{color:#555}
  .bar{height:5px;border-radius:3px;background:#eee;overflow:hidden;display:inline-block;width:54px;vertical-align:middle}
  .bar>i{display:block;height:100%}
  .traits{font-size:10px;color:#555;display:flex;flex-wrap:wrap;gap:7px;margin-top:3px}
  /* ---- 상태바 / 탭 ---- */
  #statusbar{height:24px;min-height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;white-space:nowrap;overflow:hidden}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .ev{overflow:hidden;text-overflow:ellipsis}
  #tabs{height:26px;min-height:26px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:24px;
    border-top:1px solid #d4d4d4;font-size:11.5px;overflow:hidden}
  #tabs div{padding:3px 12px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  #ctrls{margin-left:auto;display:flex;align-items:flex-end;gap:6px;padding:0 10px 2px 0}
  #ctrls button{font-size:10.5px;border:1px solid #cfcfcf;background:#fff;color:#444;border-radius:3px;
    padding:2px 7px;cursor:pointer}
  #ctrls button:hover{background:#f0f7f2;border-color:#107c41;color:#107c41}
  #ctrls .on{background:#107c41;color:#fff;border-color:#107c41}
  @media (max-width:520px){
    #legend{width:180px;font-size:10px;right:6px;top:6px}
    #menubar{gap:9px}
    #statusbar{font-size:10px}
  }
</style>
</head>
<body>
<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <span id="ttl">영웅전.xlsx - Excel</span>
</div>
<div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
<div id="fbar">
  <div id="namebox">A1</div>
  <div id="fx">fx</div>
  <div id="formula"></div>
</div>
<div id="main">
  <div id="sheetstack">
    <div class="pane on" id="pane-map">
      <div id="sheet"></div>
      <div id="legend"></div>
    </div>
    <div class="pane" id="pane-chr"><table class="logsheet" id="chr"><thead><tr><th class="yr">연도</th><th>사건</th><th class="fm">수식 로그</th></tr></thead><tbody></tbody></table></div>
    <div class="pane" id="pane-hero"><div class="heroPane" id="heroPane"></div></div>
    <div class="pane" id="pane-dead"><table class="logsheet" id="dead"><thead><tr><th class="yr">멸망 연도</th><th>대상</th><th>최후</th></tr></thead><tbody></tbody></table></div>
  </div>
</div>
<div id="tabs">
  <div class="on" data-p="map">Sheet1</div>
  <div data-p="chr">연대기</div>
  <div data-p="hero">영웅전</div>
  <div data-p="dead" id="tab-dead">멸망기록 (0)</div>
  <div id="ctrls">
    <button id="btn-pause">⏸ 일시정지</button>
    <button id="btn-speed">속도 1×</button>
  </div>
</div>
<div id="statusbar"></div>

<script>
"use strict";
(() => {
/* =========================================================================
   영웅전.xlsx — 엑셀로 위장한 창발적 AI 문명 시뮬레이션
   · 셀 = 지도.  각 개체 = 자율 AI 에이전트(목표·성격·기억·감정).
   · 다층 지휘체계: 지도자→장군→병사. 명령 해석·복종·항명·배신이 창발.
   · 희노애락이 사건에서 동적으로 생기고 행동을 바꾼다(대본 없음).
   · 초점: 개인 영웅 서사의 창발.
   결과는 매 실행마다 다르다.
   ========================================================================= */

const rnd = Math.random;
const pick = a => a[rnd() * a.length | 0];
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const cap = (s,a,b) => clamp(s,a,b);

/* ---------- 그리드 크기 (반응형) ---------- */
const CW = 30, CHh = 21;
const COLS = Math.max(16, Math.min(40, Math.floor((innerWidth - 70) / CW)));
const ROWS = Math.max(14, Math.min(30, Math.floor((innerHeight - 200) / CHh)));
const N = COLS * ROWS;

const sheet = document.getElementById('sheet');
const fmla = document.getElementById('formula');
const namebox = document.getElementById('namebox');
const statusbar = document.getElementById('statusbar');
const legend = document.getElementById('legend');

sheet.style.gridTemplateColumns = `40px repeat(${COLS}, ${CW}px)`;
sheet.style.gridAutoRows = CHh + 'px';

function colName(n){ let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0; } return s; }
function ref(i){ return colName(i%COLS)+(((i/COLS)|0)+1); }

/* ---------- 시트 DOM ---------- */
const cellEls = new Array(N);
{
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd cor'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){ const h=document.createElement('div'); h.className='hd colh'; h.textContent=colName(c); frag.appendChild(h); }
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div'); h.className='hd rowh'; h.textContent=r+1; frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div'); d.className='cell'; d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d; frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

/* ---------- 지형: value-noise 대륙 ---------- */
const GW=8, GH=6, gz=[];
for(let i=0;i<GW*GH;i++) gz[i]=rnd();
function noise(x,y){
  const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=gz[y0*GW+x0], b=gz[y0*GW+Math.min(GW-1,x0+1)];
  const c=gz[Math.min(GH-1,y0+1)*GW+x0], d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}
const cells = new Array(N);
for(let i=0;i<N;i++){
  const x=i%COLS, y=(i/COLS)|0;
  const v=noise(x,y)+(rnd()-.5)*.13;
  let st='land';
  if(v<.31) st='water';
  else if(v>.66 && rnd()<.62) st='forest';
  else if(v>.78 && rnd()<.4) st='mountain';
  cells[i]={ st, owner:null, level:0, agent:null, ruinT:0, hist:[ st==='water'?'바다':st==='forest'?'숲':st==='mountain'?'산':'황무지' ] };
}
function nbrs(i){
  const x=i%COLS, y=(i/COLS)|0, out=[];
  if(x>0) out.push(i-1);
  if(x<COLS-1) out.push(i+1);
  if(y>0) out.push(i-COLS);
  if(y<ROWS-1) out.push(i+COLS);
  return out;
}
function walkable(i){ const s=cells[i].st; return s!=='water'; }

/* =========================================================================
   감정 모델 — 희(joy)·노(anger)·애(sorrow)·락(pleasure)
   각 값 0..1. 사건이 동적으로 밀어올리고, 매 틱 평정으로 감쇠.
   행동(공격성·복종·확장·발전)은 감정과 성격의 함수로 매번 새로 계산.
   ========================================================================= */
const EMO_COLOR = { joy:'#f59e0b', anger:'#dc2626', sorrow:'#2563eb', pleasure:'#16a34a' };
function newEmotion(){ return { joy:.2, anger:.1, sorrow:.1, pleasure:.2 }; }
function feel(em, k, amt){ em[k]=clamp(em[k]+amt,0,1); }
function decayEmotion(em){ // 성격적 기질(temperament)로 다시 끌려감
  em.joy     += (.18 - em.joy)*.06;
  em.anger   += (.10 - em.anger)*.05;
  em.sorrow  += (.10 - em.sorrow)*.04;
  em.pleasure+= (.20 - em.pleasure)*.06;
}
function dominantEmotion(em){
  let bk='평정', bv=.28;
  for(const k of ['joy','anger','sorrow','pleasure']) if(em[k]>bv){ bv=em[k]; bk=k; }
  return ({joy:'희(喜)',anger:'노(怒)',sorrow:'애(哀)',pleasure:'락(樂)','평정':'평정'})[bk] || '평정';
}
function emoDotColor(em){
  let bk=null, bv=.3;
  for(const k of ['joy','anger','sorrow','pleasure']) if(em[k]>bv){ bv=em[k]; bk=k; }
  return bk?EMO_COLOR[bk]:'#bbb';
}

/* =========================================================================
   에이전트 — 모든 개체가 자율 AI.
   성격(불변 기질) + 감정(가변) + 기억(원한/은혜) + 야망/충성 + 계급.
   ranks: 0=지도자, 1=장군, 2=정착민/병사
   매 틱 decide(): 명령을 자기 성격·감정으로 *해석*해 행동을 고른다.
   ========================================================================= */
let AGID = 1;
function makeAgent(faction, rank, cellIdx){
  return {
    id: AGID++,
    name: personName(),
    faction,                       // faction id
    rank,                          // 0 leader / 1 general / 2 settler
    cell: cellIdx,
    // 불변 성격(0..1)
    ambition: rnd(),               // 야망 — 높으면 자립/반란 성향
    courage:  rnd(),               // 용기 — 전쟁 의지
    loyalty:  .35 + rnd()*.55,     // 충성 — 명령 복종
    cruelty:  rnd(),               // 잔혹 — 학살 vs 점령
    charisma: rnd(),               // 카리스마 — 추종자 흡인, 명령 권위
    wit:      rnd(),               // 지략 — 발전/외교
    // 가변 상태
    em: newEmotion(),
    fame: 0,                       // 명성(누적 업적) → 영웅화
    kills: 0, conquered: 0, founded: 0, battles: 0, betrayals: 0,
    grudge: new Map(),             // factionId -> 원한 강도
    bond:   new Map(),             // agentId -> 유대(상관/동료)
    superior: null,                // 직속 상관 agent id
    age: 0,
    isHero: false, epithet: null, title: null,
    saga: [],                      // 개인 서사 이벤트
    order: 'expand'                // 상관에게서 받은 현재 명령
  };
}

/* ---------- 이름 생성 ---------- */
const SUR = ['카를','베른','오딘','라엘','투란','센','모르','이르','발','한','시온','네르','카이','루','테오','가르','미라','솔','드란','베라','요른','아셀','크론','피온'];
const GIV = ['하드','윈','로크','마르','셀','단','비스','코르','엔','텔','리스','문','가','네','로','샤','테','운','발','즈','한','크','마','노'];
function personName(){ return pick(SUR)+pick(GIV); }

const FAC_NAMES = ['북부 왕국','붉은 제국','해안 연맹','유목 칸국','삼나무 공화국','잿빛 교단','동방 상단','검은강 부족','여명 왕조','소금사막 민족','은빛 군단','서리 부족','태양 신정','강철 동맹'];
const FAC_COLORS= ['#2563eb','#dc2626','#059669','#7c3aed','#d97706','#0d9488','#be185d','#4d7c0f','#9333ea','#b45309','#0891b2','#475569','#ca8a04','#374151'];
let facNameIdx = 0;

/* ---------- 칭호/별명 (성격·업적에서 창발) ---------- */
function deriveEpithet(a){
  if(a.betrayals>=2) return '배신자';
  if(a.kills>=14) return '학살자';
  if(a.conquered>=10) return '정복왕';
  if(a.founded>=1 && a.rank===0 && a.ambition>.7) return '건국자';
  if(a.cruelty>.75 && a.kills>=6) return '폭군';
  if(a.courage>.8 && a.battles>=8) return '불굴의 용장';
  if(a.charisma>.8) return '만인의 벗';
  if(a.wit>.78) return '현자';
  if(a.battles>=12) return '백전노장';
  if(a.age>180) return '불멸자';
  if(a.fame>=40) return '영걸';
  return '이름난 자';
}
function rankTitle(rank){ return rank===0?'지도자':rank===1?'장군':'백성'; }

/* =========================================================================
   세력(faction) — 에이전트들의 창발적 연합. 지도자 1, 그 아래 위계.
   ========================================================================= */
let factions = [];
const agents = new Map();          // id -> agent
const obituaries = [];             // {name, year, cause}
const heroDead = [];               // 죽은 영웅
let year = 0, pop = 0, lastEvent = '태초에 빈 땅이 있었다.';
let selected = -1;
const dirty = new Set();

function hexA(hex,a){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }
function facById(id){ return factions.find(f=>f.id===id); }

function spawnFaction(announce, atCell){
  if(facNameIdx>=FAC_NAMES.length) facNameIdx=0;
  let i = atCell;
  if(i==null){
    for(let t=0;t<400;t++){ const j=rnd()*N|0; if(cells[j].st==='land'&&cells[j].owner===null&&cells[j].agent===null){ i=j; break; } }
  }
  if(i==null) return null;
  const f = { id: factions.length?Math.max(...factions.map(x=>x.id))+1:0,
    name: FAC_NAMES[facNameIdx], color: FAC_COLORS[facNameIdx%FAC_COLORS.length],
    golden:0, size:0, members:[], leader:null, doctrine:'팽창', founded:year };
  facNameIdx++;
  factions.push(f);
  // 지도자 에이전트
  const leader = makeAgent(f.id, 0, i);
  leader.founded = 1; leader.fame += 12;
  agents.set(leader.id, leader);
  f.leader = leader.id;
  placeAgent(leader, i, 1, '개척지');
  sagaPush(leader, `${f.name}을(를) 세우다`, year);
  if(announce) logEvent(`${leader.name}이(가) ${f.name}을(를) 일으켰다.`, `=FOUND("${f.name}", "${leader.name}", ${ref(i)})`, 'found');
  return f;
}

function placeAgent(a, idx, level, label){
  const c = cells[idx];
  c.owner = a.faction; c.agent = a.id; c.level = level; c.st='land';
  if(label){ c.hist.push(label); if(c.hist.length>8) c.hist.shift(); }
  a.cell = idx;
  dirty.add(idx);
}

/* 새 백성/장군 충원: 지도자가 카리스마로 추종자를 끌어들임 */
function recruit(f, atIdx, rank){
  const a = makeAgent(f.id, rank, atIdx);
  agents.set(a.id, a);
  // 상관 연결: 장군은 지도자에게, 백성은 가까운 장군에게
  if(rank===1){ a.superior=f.leader; }
  else {
    const gens = f.members.map(id=>agents.get(id)).filter(g=>g&&g.rank===1);
    a.superior = gens.length? pick(gens).id : f.leader;
  }
  const sup = agents.get(a.superior);
  if(sup){ a.bond.set(sup.id, .4+rnd()*.3); }
  placeAgent(a, atIdx, 1, '개척지');
  return a;
}

/* =========================================================================
   기억/감정 사건 헬퍼
   ========================================================================= */
function addGrudge(a, facId, amt){ a.grudge.set(facId, clamp((a.grudge.get(facId)||0)+amt,0,3)); }
function sagaPush(a, text, yr){ a.saga.push({ y:yr, t:text }); if(a.saga.length>14) a.saga.shift(); }

function grantFame(a, amt, deedText){
  a.fame += amt;
  if(deedText) sagaPush(a, deedText, year);
  if(!a.isHero && a.fame>=22){
    a.isHero = true;
    a.epithet = deriveEpithet(a);
    a.title = rankTitle(a.rank);
    logEvent(`${a.name}이(가) '${a.epithet}'(으)로 이름을 떨치다.`, `=HERO.RISE("${a.name}", "${a.epithet}")`, 'hero');
    sagaPush(a, `'${a.epithet}'의 명성을 얻다`, year);
  } else if(a.isHero){
    const ep = deriveEpithet(a);
    if(ep!==a.epithet && a.fame>30){ a.epithet=ep; } // 별명이 행적 따라 진화
  }
}

const LV_TXT = ['', '·', '田', '城', '都'];
const LV_LABEL = ['', '개척지', '농장', '성읍', '대도시'];
function paint(i){

  else if(c.st==='water'){ bg='#dceaf7'; tx='≈'; col='#a8c8e8'; el.style.fontWeight=''; }
  else if(c.st==='mountain'){ bg='#efeae3'; tx='▲'; col='#9a8c78'; el.style.fontWeight=''; }
  else if(c.st==='forest'){ bg='#e2efda'; tx='木'; col='#6aa84f'; el.style.fontWeight=''; }
  else if(c.st==='ruin'){ bg='#ededed'; tx='墟'; col='#a0a0a0'; el.style.fontWeight=''; }

        el.classList.add('hero');

        const star=document.createElement('span'); star.className='cap'; star.textContent='★';
        el.appendChild(star);
        tx = ag.rank===0?'王':(ag.rank===1?'将':tx);
      } else if(ag && ag.rank===0){ tx='王'; col=f.color; el.style.fontWeight='700'; }

function flash(i, cls){ const el=cellEls[i]; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls),900); }

/* =========================================================================
   AI 의사결정 — 핵심.  각 에이전트가 명령을 자기 성격·감정으로 해석.
   반환: 행동 의도와 강도. (대본 없이 매 틱 계산)
   ========================================================================= */
function aggression(a){
  // 분노·용기·잔혹 ↑ → 공격성 ↑ ;  슬픔↑ → 위축 또는 복수(분노와 결합)
  let g = a.courage*.5 + a.em.anger*.7 + a.cruelty*.3 + a.em.joy*.15;
  if(a.em.sorrow>.5 && a.em.anger>.4) g += a.em.sorrow*.5; // 비탄 + 분노 = 복수
  return clamp(g - a.em.sorrow*.25, 0, 1.6);
}
function obedience(a){
  // 충성·상관과의 유대 ↑ 복종 ;  야망·분노 ↑ 항명
  const sup = a.superior!=null ? agents.get(a.superior) : null;
  const bond = sup ? (a.bond.get(sup.id)||0) : 0;
  let o = a.loyalty*.6 + bond*.4 + a.em.pleasure*.15 - a.ambition*.4 - a.em.anger*.5;
  return clamp(o, 0, 1);
}
/* 지도자가 doctrine(명령)을 정한다 — 세력 상황·지도자 감정 기반 */
function decideDoctrine(f){
  const L = agents.get(f.leader); if(!L) return;
  const enemies = factions.filter(x=>x.id!==f.id && x.size>0);
  const strongEnemyNear = enemies.some(e=>e.size>f.size*1.2);
  if(L.em.anger>.55 || (L.courage>.6 && f.size>4 && enemies.length)) f.doctrine='정복';
  else if(L.em.sorrow>.55 || (strongEnemyNear && L.wit>.5)) f.doctrine='수성';
  else if(L.wit>.6 && f.size>6) f.doctrine='번영';
  else f.doctrine='팽창';
}

/* =========================================================================
   메인 틱
   ========================================================================= */
let tickN=0, warCD=0, paused=false, speed=1;
function tick(){
  if(paused) return;
  tickN++; year++;
  if(warCD>0) warCD--;

  /* 1) 재집계 */
  for(const f of factions){ f.members.length=0; f.size=0; }
  pop=0;
  const PW=[0,30,140,500,1300];
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin' && --c.ruinT<=0){ c.st='land'; dirty.add(i); }
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){ f.members.push(c.agent); f.size++; pop+=PW[c.level]||30;
        if(c.agent!=null && !agents.has(c.agent)) c.agent=null; }
      else { c.owner=null; c.level=0; c.agent=null; dirty.add(i); }
    }
  }

  /* 2) 멸망 판정 */
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      const L=agents.get(f.leader);
      recordDeath(f.name, f.name, `서기 ${year}년, 마지막 영토를 잃고 역사에서 사라지다`);
      logEvent(`${f.name}이(가) 멸망했다.`, `=COLLAPSE("${f.name}", ${year})`, 'collapse');
      factions.splice(k,1);
    }
  }

  /* 3) 재난: 화재 전파 */
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.fire){
      if(rnd()<.13) for(const n of nbrs(i)){ const cn=cells[n]; if(cn.owner!==null&&!cn.fire&&cn.st==='land'){ cn.fire=4; dirty.add(n); } }
      if(--c.fire<=0){
        killAgentOnCell(i, '화재로 소실');
        c.owner=null; c.level=0; c.st='ruin'; c.ruinT=160; c.fire=0;
        c.hist.push('잿더미'); if(c.hist.length>8) c.hist.shift();
        dirty.add(i);
      }
    }
  }
  /* 역병 */
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.plague){
      if(rnd()<.15) for(const n of nbrs(i)){ if(cells[n].owner!==null&&!cells[n].plague){ cells[n].plague=10; dirty.add(n); } }
      if(rnd()<.2){ c.level--; if(c.level<=0){ killAgentOnCell(i,'역병으로 사망'); c.owner=null;c.level=0;c.agent=null; } dirty.add(i); }
      if(--c.plague<=0){ c.plague=0; dirty.add(i); }
    }
  }

  /* 4) 세력 의지 결정 + 충원 */
  for(const f of factions){
    if(f.golden>0) f.golden--;
    if(f.size===0) continue;
    decideDoctrine(f);
    const L=agents.get(f.leader);
    // 지도자 카리스마 + 황금기로 백성/장군 충원
    if(rnd() < .04 + (L?L.charisma*.04:0) + (f.golden?.05:0)){
      // 빈 인접칸 찾기
      const m = pick(f.members); const mc = agents.get(m);
      if(mc){ const op=nbrs(mc.cell).filter(n=>cells[n].owner===null&&cells[n].st==='land');
        if(op.length){ const wantGen = f.members.filter(id=>{const g=agents.get(id);return g&&g.rank===1;}).length < 1+(f.size/8|0);
          recruit(f, pick(op), wantGen&&rnd()<.4?1:2); } }
    }
  }

  /* 5) 에이전트 행동 — 자율 결정 */
  // 멤버를 셔플해서 결정 순서 편향 제거
  const actors=[];
  for(const f of factions) for(const id of f.members){ const a=agents.get(id); if(a) actors.push(a); }
  for(let i=actors.length-1;i>0;i--){ const j=rnd()*(i+1)|0; [actors[i],actors[j]]=[actors[j],actors[i]]; }

  for(const a of actors){
    if(!agents.has(a.id)) continue;
    if(cells[a.cell]==null || cells[a.cell].agent!==a.id){
      // 상실: 이 칸 더 이상 내 것이 아님 → 가장 가까운 자기 세력칸으로 재배치 시도
      const f=facById(a.faction);
      if(f&&f.size>0){ a.cell = pick(f.members)!=null ? (agents.get(pick(f.members))||a).cell : a.cell; }
    }
    a.age++;
    decayEmotion(a.em);

    const f=facById(a.faction); if(!f) continue;
    const L=agents.get(f.leader);
    // 상관 명령(doctrine) → 개인 해석
    const obey = obedience(a);
    let intent;
    if(a.rank===0){ intent = f.doctrine; } // 지도자는 자기 교리대로
    else {
      // 명령을 따를지? 항명/배신 검사
      if(obey < .22 && a.ambition>.55 && a.fame>8 && rnd()<.5){
        intent = a.em.anger>.5 ? '항명' : '자립';
      } else if(obey < .4 && rnd()<.7){
        // 부분 복종: 자기 성격대로 변형
        intent = a.courage>.55 ? '정복' : (a.wit>.55 ? '번영' : '팽창');
      } else intent = f.doctrine;
    }

    actAgent(a, f, intent);
  }

  /* 6) 드물게 외부 세력 도래 + 무작위 사건 */
  randomEvents();

  /* 7) 명성 진화 + 영웅 사망 정리 이미 처리 */

  /* 8) 그리기 */
  for(const i of dirty) paint(i);
  dirty.clear();

  /* 9) 상태바 / 패널 */
  renderStatus();
  if(tickN%5===0) renderLegend();
  if(tickN%11===0){
    document.title=`영웅전.xlsx - Excel (서기 ${year}년)`;
    document.getElementById('ttl').textContent=`영웅전.xlsx - Excel  ·  서기 ${year}년  ·  ${factions.length}개 세력`;
  }
  if(heroPaneVisible && tickN%6===0) renderHeroPane();
}

/* ---------- 칸 위 에이전트 사망 처리 ---------- */
function killAgentOnCell(i, cause){
  const c=cells[i]; if(c.agent==null) return;
  const a=agents.get(c.agent); if(!a) return;
  diePerson(a, cause);
  c.agent=null;
}
function diePerson(a, cause){
  if(!agents.has(a.id)) return;
  agents.delete(a.id);
  if(cells[a.cell] && cells[a.cell].agent===a.id) cells[a.cell].agent=null;
  if(a.isHero){
    heroDead.push(a);
    recordDeath(a.name, `${a.epithet} ${a.name}`, `서기 ${year}년, ${cause} (향년 ${a.age}살, 명성 ${a.fame|0})`);
    logEvent(`영웅 ${a.name}('${a.epithet}')이(가) ${cause}.`, `=HERO.FALL("${a.name}", ${year})`, 'death');
    sagaPush(a, `${cause} — 전설이 되다`, year);
  }
  // 상관 잃은 부하: 슬픔/분노, 유대에 따라 복수심
  for(const b of agents.values()){
    if(b.superior===a.id){
      const bd=b.bond.get(a.id)||0;
      feel(b.em,'sorrow', .25+bd*.4);
      if(bd>.5){ feel(b.em,'anger', .3); }
      b.superior = facById(b.faction)?.leader ?? null;
    }
  }
  // 지도자 사망 → 계승: 가장 명성·카리스마 높은 자
  const f=facById(a.faction);
  if(f && f.leader===a.id){
    const cands=[...agents.values()].filter(x=>x.faction===a.faction);
    if(cands.length){
      cands.sort((x,y)=>(y.fame+y.charisma*10+(y.rank===1?6:0))-(x.fame+x.charisma*10+(x.rank===1?6:0)));
      const heir=cands[0]; const old=heir.rank;
      heir.rank=0; f.leader=heir.id; heir.superior=null;
      grantFame(heir, 6, `${f.name}의 지도자가 되다`);
      // 야망 큰 2인자가 있으면 계승 분쟁 불씨
      if(cands[1] && cands[1].ambition>.7){ addGrudge(cands[1], -1, 0); feel(cands[1].em,'anger',.4); cands[1].bond.set(heir.id,(cands[1].bond.get(heir.id)||.3)-.3); }
      logEvent(`${heir.name}이(가) ${f.name}의 권좌를 잇다.`, `=SUCCEED("${f.name}", "${heir.name}")`, 'coup');
    }
  }
}

/* ---------- 한 에이전트의 실제 행동 ---------- */
function actAgent(a, f, intent){
  const here = a.cell;
  const opts = nbrs(here);
  const agg = aggression(a);

  // 자립/항명: 세력에서 떨어져 나가 새 세력 창건 or 적에 투항
  if(intent==='자립' || intent==='항명'){
    attemptDefection(a, f, intent);
    return;
  }

  // 목표 칸 고르기: 정복이면 적 인접, 번영이면 발전, 팽창이면 빈 땅
  let acted=false;
  // 발전 우선(번영 doctrine / 지략형)
  if((intent==='번영' || (intent!=='정복' && a.wit>.55)) && rnd()< .25 + a.wit*.2 + (f.golden?.25:0)){
    const c=cells[here];
    if(c.owner===a.faction && c.level<4){
      c.level++;
      c.hist.push(LV_LABEL[c.level]); if(c.hist.length>8) c.hist.shift();
      dirty.add(here); acted=true;
      grantFame(a, c.level>=3?3:1, c.level>=3?`${ref(here)}에 ${LV_LABEL[c.level]}을(를) 세우다`:null);
      feel(a.em,'pleasure',.12); feel(a.em,'joy',.06);
      if(c.level===4 && warCD<=0){ logEvent(`${a.name}이(가) ${ref(here)}에 대도시를 건설했다.`, `=CITY("${f.name}","${a.name}",${ref(here)})`, 'city'); warCD=20; }
    }
  }

  // 이동/확장/전쟁
  if(!acted || rnd()<.6){
    // 정복형은 적 인접칸을, 그 외엔 빈 땅/숲을 선호
    let target=null;
    const enemyN = opts.filter(n=>cells[n].owner!==null && cells[n].owner!==a.faction && !cells[n].fire);
    const emptyN = opts.filter(n=>cells[n].owner===null && cells[n].st!=='water' && !cells[n].fire);
    const wantWar = (intent==='정복') || (agg>.7 && enemyN.length) || (a.em.anger>.6 && enemyN.length);
    if(wantWar && enemyN.length){
      // 원한 있는 세력 우선
      enemyN.sort((x,y)=>((a.grudge.get(cells[y].owner)||0)-(a.grudge.get(cells[x].owner)||0)));
      target=enemyN[0]; doBattle(a,f,target);
    } else if(emptyN.length){
      target=pick(emptyN);
      const tc=cells[target];
      if(tc.st==='forest'){ if(rnd()<.3){ tc.st='land'; tc.hist.push('개간'); spreadSettler(a,f,target,'개척지'); } }
      else if(tc.st==='mountain'){ if(rnd()<.12){ spreadSettler(a,f,target,'요새'); } }
      else { spreadSettler(a,f,target,'개척지'); }
    } else if(enemyN.length && agg>.45){
      target=pick(enemyN); doBattle(a,f,target);
    }
  }
}

/* 정착민 확산: 새 백성 탄생(아주 가끔 장군) */
function spreadSettler(a,f,target,label){
  const tc=cells[target];
  if(tc.owner!==null) return;
  // 새 에이전트가 그 땅에 태어남(이 세력의 백성)
  const child=makeAgent(f.id, 2, target);
  child.superior = a.rank===0 ? f.leader : (a.rank===1?a.id:a.superior);
  const sup=agents.get(child.superior); if(sup) child.bond.set(sup.id,.35+rnd()*.3);
  agents.set(child.id, child);
  placeAgent(child, target, 1, label);
  feel(a.em,'joy',.05); feel(a.em,'pleasure',.04);
  grantFame(a, .3, null);
}

/* 전투: 공격자 vs 방어자(둘 다 에이전트) — 감정·성격이 결과·여파를 좌우 */
function doBattle(att, f, target){
  const tc=cells[target];
  const defId=tc.agent;
  const def = defId!=null?agents.get(defId):null;
  const defF = facById(tc.owner);
  att.battles++;
  flash(target,'war');
  const aStr = 1 + att.courage*2 + att.em.anger*1.5 + (f.golden?1:0) + att.fame*.02 + rnd()*2;
  const dStr = 1 + (tc.level)*1.1 + (def?def.courage*1.7 + def.em.anger*1.2 + def.fame*.02:.5) + (cells[target].st==='mountain'?1:0) + rnd()*2;

  if(aStr>dStr){
    // 승리. 잔혹하면 학살(화재), 아니면 점령
    att.conquered++;
    grantFame(att, tc.level>=2?3:1.2, tc.level>=2?`${defF?defF.name:'적'}의 ${LV_LABEL[Math.max(1,tc.level)]||'땅'}을(를) 함락하다`:null);
    feel(att.em,'joy',.22); feel(att.em,'pleasure',.16); feel(att.em,'anger',-.12);
    if(def){ addGrudge(att, def.faction, .4); }
    if(att.cruelty>.6 && rnd()<att.cruelty*.6){
      // 학살: 방어자 사망 + 화재
      if(def){ att.kills++; grantFame(att,.6,null); diePerson(def, `${att.name}에게 학살당함`); }
      tc.fire=4; tc.hist.push('전화(戰火)'); if(tc.hist.length>8) tc.hist.shift();
      dirty.add(target);
    } else {
      // 점령: 방어자 사망(or 도주), 공격자 백성이 그 땅 차지
      if(def){ if(rnd()<.5){ att.kills++; diePerson(def, `${att.name}와의 전투에서 전사`); } else { fleeAgent(def); } }
      // 공격자 본인이 이동하지 않고 새 점령 백성을 둠
      const occ=makeAgent(f.id,2,target);
      occ.superior = att.rank===0?f.leader:(att.rank===1?att.id:att.superior);
      agents.set(occ.id, occ);
      placeAgent(occ, target, Math.max(1,tc.level-1), '점령됨');
    }
    if((tc.level>=2 || warCD<=0) && defF){
      logEvent(`${att.isHero?att.epithet+' ':''}${att.name}(${f.name})이(가) ${defF.name}을(를) 쳐 ${ref(target)}을(를) 빼앗다.`,
        `=WAR("${f.name}"→"${defF.name}", ${ref(target)}, ${att.kills?'"학살"':'"점령"'})`, 'war');
      warCD=22;
    }
  } else {
    // 공격 실패 — 분노·슬픔 누적, 방어자 명성/기쁨
    feel(att.em,'anger',.2); feel(att.em,'sorrow',.08); feel(att.em,'joy',-.1);
    if(defF) addGrudge(att, defF.id, .5);
    if(def){ grantFame(def, tc.level>=2?2:1, null); feel(def.em,'joy',.18); feel(def.em,'pleasure',.1); def.battles++;
      if(rnd()<.25){ att.kills>0; diePerson(att, `${def.name}의 방어에 막혀 전사`); return; } }
    // 큰 패배는 가끔 공격자 본진에 화재(보복)
  }
}
function fleeAgent(a){
  // 도주: 인접 자기 세력 칸으로, 없으면 빈 칸으로
  const op=nbrs(a.cell).filter(n=>cells[n].owner===a.faction && cells[n].agent===null);
  const empty=nbrs(a.cell).filter(n=>cells[n].owner===null && cells[n].st!=='water');
  const dst = op.length?pick(op):(empty.length?pick(empty):null);
  if(dst!=null){ cells[a.cell].agent= (cells[a.cell].agent===a.id)?null:cells[a.cell].agent; placeAgent(a,dst,Math.max(1,cells[dst].level),'피난'); cells[dst].owner=a.faction; }
  feel(a.em,'sorrow',.2); feel(a.em,'anger',.1);
}

/* ---------- 항명/배신: 다층 위계의 핵심 창발 ---------- */
function attemptDefection(a, f, intent){
  a.betrayals++;
  feel(a.em,'anger',-.2);
  // 추종자 모으기: 부하/같은 세력 백성 중 그를 따르는 자
  const followers = [...agents.values()].filter(x=>x.faction===f.id && x.id!==a.id &&
    (x.superior===a.id || (x.bond.get(a.id)||0)>.4 || (a.charisma>.6 && x.ambition>.5 && rnd()<.3)));
  if(intent==='자립' || (a.charisma>.45 && followers.length>=1)){
    // 새 세력 창건 (쿠데타가 아니라 분리독립)
    if(factions.length<10){
      flash(a.cell,'coup');
      const nf = { id: factions.length?Math.max(...factions.map(x=>x.id))+1:0,
        name: secedeName(f), color: shiftColor(f.color), golden:0, size:0, members:[], leader:a.id, doctrine:'팽창', founded:year };
      factions.push(nf);
      a.faction=nf.id; a.rank=0; a.superior=null;
      cells[a.cell].owner=nf.id; dirty.add(a.cell);
      for(const fo of followers){ if(rnd()<.7){ fo.faction=nf.id; fo.superior=a.id; cells[fo.cell].owner=nf.id; dirty.add(fo.cell); feel(fo.em,'pleasure',.1); } }
      grantFame(a, 6, `${f.name}에서 갈라져 ${nf.name}을(를) 세우다`);
      a.founded++;
      addGrudge(a, f.id, 1.2);
      logEvent(`${a.name}이(가) ${f.name}에 반기를 들고 ${nf.name}으로 독립했다!`, `=SECEDE("${a.name}", "${f.name}"→"${nf.name}")`, 'betray');
      return;
    }
  }
  // 쿠데타: 지도자에 직접 도전
  if(intent==='항명' && a.rank===1 && a.fame>12){
    const L=agents.get(f.leader);
    if(L){
      flash(a.cell,'coup');
      const aP=a.fame+a.charisma*14+a.courage*8+rnd()*10;
      const lP=L.fame+L.charisma*14+L.courage*8+(f.golden?10:0)+rnd()*10;
      if(aP>lP){
        diePerson(L, `${a.name}의 정변으로 시해됨`);
        // diePerson이 후계 처리하지만, 도전자가 강하므로 직접 즉위 보정
        if(facById(f.id) && agents.has(a.id)){ a.rank=0; f.leader=a.id; a.superior=null; grantFame(a,7,`${f.name}의 권좌를 찬탈하다`); }
        logEvent(`${a.name}이(가) 정변을 일으켜 ${f.name}의 권좌를 빼앗다!`, `=COUP("${a.name}", "${f.name}")`, 'coup');
      } else {
        // 실패 → 처형/추방
        logEvent(`${a.name}의 반란이 진압되었다.`, `=COUP.FAIL("${a.name}")`, 'coup');
        diePerson(a, `반란 실패로 처형됨`);
      }
    }
    return;
  }
  // 적에게 투항: 가장 원한 적거나 가장 강한 적으로
  const others=factions.filter(x=>x.id!==f.id && x.size>0);
  if(others.length && a.loyalty<.4){
    others.sort((x,y)=>y.size-x.size);
    const tg=others[0];
    a.faction=tg.id; cells[a.cell].owner=tg.id; a.superior=tg.leader; dirty.add(a.cell);
    feel(a.em,'pleasure',.1);
    logEvent(`${a.name}이(가) ${f.name}을(를) 배신하고 ${tg.name}에 투항했다.`, `=BETRAY("${a.name}", "${f.name}"→"${tg.name}")`, 'betray');
    grantFame(a, 1, `${f.name}을(를) 배신하다`);
  }
}
const SECEDE_PRE=['신','자유','새벽','반(反)','분리','북','남','동','서','진(眞)'];
function secedeName(f){ return pick(SECEDE_PRE)+' '+f.name.replace(/^[가-힣]+ /,''); }
function shiftColor(hex){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const f=v=>Math.round(clamp(v+(rnd()*120-60),20,235)); return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join(''); }

/* ---------- 무작위 자연/역사 사건 ---------- */
function randomEvents(){
  const r=rnd();
  if(r<.0035){
    const big=[]; for(let i=0;i<N;i++) if(cells[i].owner!==null&&cells[i].level>=3) big.push(i);
    if(big.length){ const i=pick(big); cells[i].plague=10; dirty.add(i); logEvent(`${ref(i)}에서 역병이 창궐했다.`,`=PLAGUE(${ref(i)})`,'plague'); }
  } else if(r>.9965){
    if(factions.length){ const f=pick(factions); f.golden=80; const L=agents.get(f.leader);
      if(L){ feel(L.em,'joy',.4); feel(L.em,'pleasure',.4); }
      logEvent(`${f.name}에 황금기가 도래했다.`,`=GOLDEN.AGE("${f.name}",80)`,'golden'); }
  } else if(r>.993 && r<=.9965){
    const towns=[]; for(let i=0;i<N;i++) if(cells[i].owner!==null&&cells[i].level>=2) towns.push(i);
    if(towns.length){ const i=pick(towns); cells[i].fire=5; dirty.add(i); logEvent(`${ref(i)}에 대화재가 발생했다.`,`=FIRE(${ref(i)})`,'fire'); }
  }
  // 세력이 적으면 바다 건너 이주민 도래
  if(factions.length<3 && rnd()<.02 && factions.length<9){
    const f=spawnFaction(false);
    if(f){ const L=agents.get(f.leader); logEvent(`바다 건너에서 ${L.name}의 ${f.name}이(가) 도래했다.`,`=MIGRATE("${f.name}")`,'migrate'); }
  }
  // 노화로 인한 자연사(영웅도)
  if(rnd()<.06){
    const cands=[...agents.values()].filter(a=>a.age>140);
    if(cands.length){ const a=pick(cands); if(rnd()< (a.age-140)/400 ){ diePerson(a, '천수를 누리고 영면'); } }
  }
}

/* =========================================================================
   상태바 / 패널 렌더
   ========================================================================= */
function renderStatus(){
  const heroes=[...agents.values()].filter(a=>a.isHero).length;
  statusbar.innerHTML =
    `준비<span class="sep">|</span>서기 ${year}년<span class="sep">|</span>인구 ${pop.toLocaleString()}<span class="sep">|</span>`+
    `세력 ${factions.length}<span class="sep">|</span>영웅 ${heroes}<span class="sep">|</span><span class="ev">${lastEvent}</span>`;
}
function emoBadges(em){
  let h='';
  for(const k of ['joy','anger','sorrow','pleasure']) if(em[k]>.35) h+=`<span class="emo" style="background:${EMO_COLOR[k]}" title="${k}"></span>`;
  return h;
}
function renderLegend(){
  let h='<h4>세력 현황</h4>';
  const sorted=[...factions].sort((a,b)=>b.size-a.size);
  if(!sorted.length) h+='<div class="dead">— 모든 문명이 사라졌다 —</div>';
  for(const f of sorted){
    const L=agents.get(f.leader);
    h+=`<div class="frow"><span><span class="sw" style="background:${f.color}"></span>${f.name}${f.golden?' ✦':''}</span><b>${f.size}칸</b></div>`;
    if(L) h+=`<div class="mood" style="color:#777;margin:-1px 0 2px 14px">${L.isHero?'★':''}${L.name} · ${f.doctrine} · ${dominantEmotion(L.em)}${emoBadges(L.em)}</div>`;
  }
  // 영웅 톱
  const heroes=[...agents.values()].filter(a=>a.isHero).sort((a,b)=>b.fame-a.fame).slice(0,5);
  if(heroes.length){
    h+='<h4>당대의 영웅</h4>';
    for(const a of heroes){
      const f=facById(a.faction);
      h+=`<div class="heroline"><span class="emo" style="background:${emoDotColor(a.em)}"></span> `+
         `<span class="ep">${a.epithet}</span> ${a.name} `+
         `<span style="color:${f?f.color:'#888'}">(${f?f.name:'유랑'})</span> · 명성${a.fame|0}</div>`;
    }
  }
  if(heroDead.length){
    h+='<h4>스러진 전설</h4>';
    for(const a of heroDead.slice(-3).reverse()) h+=`<div class="dead">† ${a.epithet} ${a.name}</div>`;
  }
  h+='<h4 style="margin-top:7px;color:#999;border:0">셀을 클릭하면 그 땅·인물의 내력이 수식바에 나옵니다</h4>';
  legend.innerHTML=h;
}

/* 영웅전 시트 */
let heroPaneVisible=false;
const heroPane=document.getElementById('heroPane');
function bar(v,col){ return `<span class="bar"><i style="width:${(clamp(v,0,1)*100)|0}%;background:${col}"></i></span>`; }
function renderHeroPane(){
  const all=[...agents.values(),...heroDead].filter(a=>a.isHero).sort((a,b)=>b.fame-a.fame);
  if(!all.length){ heroPane.innerHTML='<div class="dead" style="padding:20px">아직 영웅이 나타나지 않았다. 역사가 흐르길 기다리라…</div>'; return; }
  let h=`<div style="color:#666;margin-bottom:8px">서기 ${year}년 · 명성 22 이상에 도달한 자가 영웅으로 기록된다. 별명은 그가 살아온 행적에서 저절로 붙는다.</div>`;
  for(const a of all.slice(0,16)){
    const f=facById(a.faction);
    const dead=!agents.has(a.id);
    h+=`<div class="hcard" style="${dead?'opacity:.62':''}">`;
    h+=`<div><span class="hn">${a.name}</span><span class="hep">「${a.epithet}」</span> `+
       `<span style="font-size:10.5px;color:${f?f.color:'#999'}">${dead?'† ':''}${f?f.name:'멸망한 가문'} ${rankTitle(a.rank)}</span></div>`;
    h+=`<div class="meta">명성 <b>${a.fame|0}</b> · 나이 ${a.age} · 전투 ${a.battles} · 처치 ${a.kills} · 정복 ${a.conquered} · 배신 ${a.betrayals} · 현재감정 <b>${dominantEmotion(a.em)}</b></div>`;
    h+=`<div class="traits">`+
       `<span>야망 ${bar(a.ambition,'#9333ea')}</span><span>용기 ${bar(a.courage,'#dc2626')}</span>`+
       `<span>충성 ${bar(a.loyalty,'#2563eb')}</span><span>잔혹 ${bar(a.cruelty,'#7c2d12')}</span>`+
       `<span>카리스마 ${bar(a.charisma,'#ca8a04')}</span><span>지략 ${bar(a.wit,'#0d9488')}</span></div>`;
    if(a.saga.length){
      h+=`<div class="saga"><b>열전(列傳)</b><br>`;
      h+=a.saga.slice(-8).map(s=>`<span class="ev">서기 ${s.y}년 — ${s.t}</span>`).join('<br>');
      h+=`</div>`;
    }
    h+=`</div>`;
  }
  heroPane.innerHTML=h;
}

/* =========================================================================
   상호작용 — 셀 클릭 → 땅·인물 내력, 탭 전환, 제어
   ========================================================================= */
sheet.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  if(selected>=0 && cellEls[selected]) cellEls[selected].classList.remove('sel');
  selected=+t.dataset.i; t.classList.add('sel');
  namebox.textContent=ref(selected);
  const c=cells[selected];
  const a=c.agent!=null?agents.get(c.agent):null;
  if(a){
    const f=facById(a.faction);
    fmla.textContent=`=PERSON("${a.name}"${a.isHero?',"'+a.epithet+'"':''}, ${f?'"'+f.name+'"':''}, ${rankTitle(a.rank)}, 감정="${dominantEmotion(a.em)}", 명성=${a.fame|0})`;
    // 클릭 개입: 그 인물에게 사기 진작(기쁨↑) — 사용자 개입
    feel(a.em,'joy',.15); feel(a.em,'pleasure',.1);
    if(a.isHero){ openHero(); }
  } else {
    fmla.textContent=`=LAND(${ref(selected)}, "${c.st}", 내력=[${c.hist.map(x=>'"'+x+'"').join(' → ')}])`;
  }
});

const panes={ map:'pane-map', chr:'pane-chr', hero:'pane-hero', dead:'pane-dead' };
function switchTab(p){
  for(const k in panes) document.getElementById(panes[k]).classList.toggle('on', k===p);
  for(const t of document.querySelectorAll('#tabs > div[data-p]')) t.classList.toggle('on', t.dataset.p===p);
  heroPaneVisible=(p==='hero');
  if(p==='hero') renderHeroPane();
}
function openHero(){ switchTab('hero'); }
for(const t of document.querySelectorAll('#tabs > div[data-p]')) t.addEventListener('click', ()=>switchTab(t.dataset.p));

document.getElementById('btn-pause').addEventListener('click', e=>{
  paused=!paused; e.target.textContent=paused?'▶ 재개':'⏸ 일시정지'; e.target.classList.toggle('on',paused);
});
const SPEEDS=[1,2,4,0.5];
document.getElementById('btn-speed').addEventListener('click', e=>{
  speed = SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];
  e.target.textContent='속도 '+speed+'×';
  restartTimer();
});

/* =========================================================================
   시작
   ========================================================================= */
for(let i=0;i<N;i++) paint(i);
fmla.textContent=`=SIM.HEROES($A$1:$${colName(COLS-1)}$${ROWS}, "영웅은 만들어지지 않는다, 창발한다")`;
renderStatus();
// 초기 문명 3개
spawnFaction(true); spawnFaction(true); spawnFaction(true);
renderLegend();

let timer=null;
function restartTimer(){ if(timer) clearInterval(timer); timer=setInterval(tick, Math.max(28, 120/speed)); }
restartTimer();

})();
</script>
