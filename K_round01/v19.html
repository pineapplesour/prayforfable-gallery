<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>창세기.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  *{box-sizing:border-box}
  /* ---- 엑셀 크롬 ---- */
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar .ttl{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #titlebar .clim{margin-left:auto;font-size:11px;color:#666;display:flex;align-items:center;gap:5px;white-space:nowrap}
  #titlebar .clim b{font-weight:700}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:14px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;flex:0 0 auto;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px;white-space:nowrap}
  #fbar{height:27px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px;flex:0 0 auto}
  #namebox{width:78px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;font-weight:600;flex:0 0 auto;cursor:default}
  #fx{width:30px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif;flex:0 0 auto}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* ---- 본문 ---- */
  #body{flex:1 1 auto;display:flex;min-height:0;position:relative}
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1 1 auto;min-width:0}
  #sheet{display:grid;background:#fff}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:10.5px}
  .cell{border-right:1px solid #e7e7e7;border-bottom:1px solid #e7e7e7;
    display:flex;align-items:center;justify-content:center;font-size:11px;
    overflow:hidden;cursor:cell;position:relative;transition:background .25s}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:3}
  .cell .cap{position:absolute;top:0;right:1px;font-size:7px;line-height:7px;opacity:.85}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #ff3b3b}50%{box-shadow:inset 0 0 0 2px #ffd2d2}}
  .war{animation:warf .3s 4}
  @keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.9);opacity:0}}
  .ping{position:absolute;inset:2px;border-radius:50%;pointer-events:none;animation:pulse .9s ease-out forwards}
  /* ---- 우측 패널(연대기/내면) ---- */
  #side{width:296px;flex:0 0 296px;background:#fbfbfa;border-left:1px solid #d4d4d4;
    display:flex;flex-direction:column;min-height:0}
  #side .stab{display:flex;border-bottom:1px solid #e0e0e0;flex:0 0 auto}
  #side .stab div{flex:1;text-align:center;padding:6px 0;cursor:pointer;color:#777;font-size:11px;border-bottom:2px solid transparent}
  #side .stab div.on{color:#107c41;font-weight:600;border-bottom:2px solid #107c41;background:#fff}
  #side .pane{flex:1 1 auto;overflow-y:auto;padding:8px 10px;display:none}
  #side .pane.on{display:block}
  /* 세력 카드 */
  .fc{border:1px solid #e3e3e3;border-radius:5px;padding:6px 8px;margin-bottom:7px;background:#fff;cursor:pointer}
  .fc:hover{background:#f4faf6}
  .fc.dead{opacity:.5;filter:grayscale(.7)}
  .fc .h{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12px}
  .fc .sw{width:11px;height:11px;border-radius:2px;flex:0 0 auto}
  .fc .sub{font-size:10px;color:#888;margin:2px 0 4px}
  .fc .moodbar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin:3px 0}
  .fc .moodbar i{display:block;height:100%}
  .fc .gov{font-size:10px;color:#555;margin-top:3px;line-height:1.5}
  .fc .gv{display:inline-block;margin-right:5px}
  .fc .tag{display:inline-block;font-size:9px;padding:0 4px;border-radius:7px;background:#eee;color:#555;margin-left:3px}
  /* 연대기 */
  #chron .ce{font-size:11px;padding:4px 2px 4px 8px;border-left:2px solid #ccc;margin-bottom:4px;line-height:1.45;color:#333}
  #chron .ce .yr{color:#107c41;font-weight:700;font-family:Consolas,monospace}
  #chron .ce .ico{margin-right:3px}
  /* 내면 패널 */
  #mind .empty{color:#999;font-size:11px;text-align:center;margin-top:40px;line-height:1.7}
  #mind .mh{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;margin-bottom:2px}
  #mind .mrole{font-size:10px;color:#888;margin-bottom:8px}
  #mind .row{display:flex;justify-content:space-between;font-size:10.5px;margin:3px 0}
  #mind .bar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin:2px 0 7px}
  #mind .bar i{display:block;height:100%}
  #mind h5{margin:9px 0 4px;font-size:11px;color:#7a6a1f;border-bottom:1px dashed #ddd;padding-bottom:2px}
  #mind .mem{font-size:10px;color:#555;line-height:1.55;margin:2px 0;padding-left:9px;text-indent:-9px}
  #mind .think{font-size:10.5px;color:#1a1a1a;background:#fffce6;border:1px solid #e6d98a;border-radius:4px;padding:6px 7px;line-height:1.5;margin:6px 0}
  /* 신의 개입 버튼 */
  #godrow{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 2px}
  #godrow button{flex:1;min-width:62px;font-size:10px;padding:5px 4px;border:1px solid #cfcfcf;border-radius:4px;background:#fff;cursor:pointer;color:#333}
  #godrow button:hover{background:#107c41;color:#fff;border-color:#107c41}
  /* ---- 상태바 ---- */
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;flex:0 0 auto;white-space:nowrap;overflow:hidden}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .ev{overflow:hidden;text-overflow:ellipsis}
  #ctl{margin-left:auto;display:flex;gap:8px;align-items:center;flex:0 0 auto}
  #ctl b{cursor:pointer;padding:0 6px;opacity:.9}
  #ctl b:hover{opacity:1;text-decoration:underline}
  /* ---- 탭 ---- */
  #tabs{height:26px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:14px;
    border-top:1px solid #d4d4d4;font-size:11.5px;flex:0 0 auto}
  #tabs div{padding:3px 13px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  /* ---- 토스트(격변 배너) ---- */
  #cata{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:20;
    background:rgba(20,20,20,.86);color:#fff;padding:8px 18px;border-radius:6px;font-size:13px;
    box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;transition:opacity .4s;pointer-events:none;text-align:center}
  #cata.show{opacity:1}
  #cata small{display:block;font-size:10px;opacity:.7;margin-top:2px;font-weight:400}
  /* ---- 모바일 ---- */
  @media (max-width:760px){
    #menubar{gap:9px}#menubar i:nth-child(n+6){display:none}
    #side{position:absolute;right:0;top:0;bottom:0;width:84%;max-width:320px;z-index:15;
      box-shadow:-4px 0 18px rgba(0,0,0,.22);transform:translateX(100%);transition:transform .25s}
    #side.open{transform:translateX(0)}
    #sidebtn{display:flex!important}
    #titlebar .clim .lbl{display:none}
  }
  #sidebtn{display:none;position:absolute;right:8px;bottom:34px;z-index:16;width:42px;height:42px;
    border-radius:50%;background:#107c41;color:#fff;align-items:center;justify-content:center;
    font-size:18px;box-shadow:0 3px 10px rgba(0,0,0,.3);cursor:pointer}
  body{display:flex;flex-direction:column;height:100%}
</style>

<body>
<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <div class="ttl">창세기.xlsx - Excel</div>
  <div class="clim"><span class="lbl">기후</span><span id="climico">☀</span><b id="climname">온난기</b></div>
</div>
<div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
<div id="fbar">
  <div id="namebox">A1</div>
  <div id="fx">fx</div>
  <div id="formula"></div>
</div>
<div id="body">
  <div id="sheetwrap">
    <div id="sheet"></div>
    <div id="cata"></div>
  </div>
  <div id="side">
    <div class="stab">
      <div class="on" data-p="powers">세력</div>
      <div data-p="mind">내면</div>
      <div data-p="chron">연대기</div>
    </div>
    <div class="pane on" id="powers"></div>
    <div class="pane" id="mind"><div class="empty">셀이나 세력을 클릭하면<br>그곳에 사는 에이전트의<br>성격·감정·기억·판단이<br>여기에 펼쳐집니다.</div></div>
    <div class="pane" id="chron"></div>
  </div>

</div>
<div id="statusbar">
  <span>준비</span><span class="sep">|</span>
  <span id="st-year">서기 1년</span><span class="sep">|</span>
  <span id="st-pop">인구 0</span><span class="sep">|</span>
  <span class="ev" id="st-ev">천지가 창조되었습니다.</span>

  <div class="on">세계지도</div><div>연대기</div><div id="tab-dead">멸망기록 (0)</div>
</div>

<script>
"use strict";
(()=>{
/*======================================================================
  창세기.xlsx — 환경 격변 적응 · 창발적 AI 문명 시뮬레이션
  · 셀 = 지도. 각 세력 = 군주 1 + 지방관 N 의 2층 자율 AI 위계.
  · 에이전트는 성격/감정/기억/목표를 갖고 환경을 읽어 스스로 판단.
  · 기후가 상태기계로 격변 → 식량/감정/결정을 흔들어 역사를 추동.
  · 대본 없음: 매 실행마다 흥망·전쟁·동맹·반란·황금기가 창발.
======================================================================*/

/* ---------- 격자 크기 (반응형) ---------- */
const sheetwrap = document.getElementById('sheet');
function calcGrid(){
  const w = document.getElementById('sheetwrap').clientWidth || innerWidth-296;
  const h = document.getElementById('sheetwrap').clientHeight || innerHeight-170;
  const cw = w<560?20:26, ch = w<560?20:24;
  const cols = Math.max(14, Math.min(46, Math.floor((w-30)/cw)));
  const rows = Math.max(12, Math.min(34, Math.floor((h-22)/ch)));
  return {cols,rows,cw,ch};
}
let G = calcGrid();
let COLS=G.cols, ROWS=G.rows, CW=G.cw, CH=G.ch, N=COLS*ROWS;

const sheet=document.getElementById('sheet');
const fmla=document.getElementById('formula');
const namebox=document.getElementById('namebox');

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(((i/COLS)|0)+1);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(arr){return arr[Math.random()*arr.length|0];}
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

/* ---------- 셀 DOM ---------- */
let cellEls=[];
function buildGrid(){
  G=calcGrid(); COLS=G.cols; ROWS=G.rows; CW=G.cw; CH=G.ch; N=COLS*ROWS;
  sheet.style.gridTemplateColumns=`30px repeat(${COLS},${CW}px)`;
  sheet.style.gridAutoRows=CH+'px';
  sheet.innerHTML='';
  cellEls=new Array(N);
  const frag=document.createDocumentFragment();
  const corner=document.createElement('div');corner.className='hd';frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const hh=document.createElement('div');hh.className='hd';hh.textContent=colName(c);frag.appendChild(hh);}
  for(let r=0;r<ROWS;r++){
    const hh=document.createElement('div');hh.className='hd';hh.textContent=r+1;frag.appendChild(hh);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d;frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

/* ---------- 지형: 비옥도 필드 ---------- */
const GW=10,GH=7;let gz=[];
function genTerrain(){
  gz=[];for(let i=0;i<GW*GH;i++)gz[i]=Math.random();
}
function noise(x,y){
  const fx=x/COLS*(GW-1),fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=gz[y0*GW+x0],b=gz[y0*GW+Math.min(GW-1,x0+1)];
  const c=gz[Math.min(GH-1,y0+1)*GW+x0],d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}

/* ---------- 셀 모델 ----------
   st: water|forest|land|ruin
   fert: 기본 비옥도(0..1) — 지형이 정함. 기후가 식량에 곱해짐.
   owner, level(0-4), gov(지방관 인덱스 or -1)
   hist: 그 땅의 역사 라벨 큐
   stress: 격변 누적 피해(0..1)
-------------------------------------------- */
let cells=[];
function nbrs(i){const x=i%COLS,y=i/COLS|0,o=[];if(x>0)o.push(i-1);if(x<COLS-1)o.push(i+1);if(y>0)o.push(i-COLS);if(y<ROWS-1)o.push(i+COLS);return o;}
function genCells(){
  cells=new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS,y=i/COLS|0;
    const v=clamp(noise(x,y)+(Math.random()-.5)*.12,0,1);
    let st='land',fert=v,hist=['황무지'];
    if(v<.30){st='water';fert=0;hist=['바다'];}
    else if(v>.66){st='forest';fert=.55+Math.random()*.3;hist=['원시림'];}
    else fert=.25+v*.6;
    cells[i]={st,fert,owner:null,level:0,gov:-1,hist,ruinT:0,stress:0};
  }
}

/* ====================================================================
   기후 상태기계 — 환경 격변(내 초점)
   각 기후는 식량배율(food), 비옥도드리프트(drift), 위험(disaster bias)을 가짐.
   상태마다 전이확률이 달라 빙하기↔간빙기처럼 흐른다.
==================================================================== */
const CLIMATES={
  fertile :{name:'대풍요기',ico:'🌾',food:1.55,drift:+.012,disaster:'bloom',  hue:'#3a7d23',sky:'#eef7e3'},
  warm    :{name:'온난기',  ico:'☀', food:1.05,drift:+.002,disaster:null,     hue:'#107c41',sky:'#ffffff'},
  drought :{name:'대한발',  ico:'🔥',food:0.55,drift:-.018,disaster:'fire',   hue:'#c46a10',sky:'#fbf1e2'},
  cold    :{name:'혹한기',  ico:'❄', food:0.62,drift:-.010,disaster:'famine', hue:'#3a6ea5',sky:'#eef3fb'},
  flood   :{name:'대홍수',  ico:'🌊',food:0.78,drift:+.004,disaster:'flood',  hue:'#1f6f8b',sky:'#e9f2f6'},
  ashen   :{name:'화산겨울',ico:'🌋',food:0.40,drift:-.022,disaster:'plague', hue:'#6b5b73',sky:'#efeaf1'},
};
const CLIM_FLOW={
  fertile:[['warm',.5],['drought',.18],['flood',.22],['fertile',.10]],
  warm   :[['warm',.42],['fertile',.16],['drought',.16],['cold',.14],['flood',.12]],
  drought:[['warm',.34],['drought',.30],['ashen',.12],['fertile',.10],['cold',.14]],
  cold   :[['warm',.34],['cold',.30],['ashen',.16],['flood',.12],['fertile',.08]],
  flood  :[['warm',.40],['fertile',.20],['flood',.22],['cold',.18]],
  ashen  :[['cold',.40],['ashen',.30],['warm',.16],['drought',.14]],
};
let clim='warm', climT=0;
function climStep(){
  if(--climT>0) return;
  const flow=CLIM_FLOW[clim]; let r=Math.random(),nx=clim;
  for(const [k,p] of flow){ if(r<p){nx=k;break;} r-=p; }
  const prev=clim; clim=nx; climT=Math.floor(rnd(70,150));
  const C=CLIMATES[clim];
  document.getElementById('climico').textContent=C.ico;
  document.getElementById('climname').textContent=C.name;
  if(prev!==clim){
    onClimateShift(prev,clim);
  }
}

/* ====================================================================
   에이전트 — 자율 AI (군주 + 지방관)
   trait: ambition 야망, caution 신중, loyalty 충성, greed 탐욕, empathy 공감
   mood : joy 기쁨, anger 분노, sorrow 슬픔, glee 즐거움  (0..1, 동적 창발)
   goal : 'expand'|'fortify'|'hoard'|'migrate'|'pray'  (스스로 갱신)
   mem  : 최근 사건 문자열 큐(에이전트 사적 기억 → 다음 판단에 영향)
   stock: 비축 식량
==================================================================== */
let agentSeq=0;
function newTrait(){
  return {
    ambition:rnd(.15,.95), caution:rnd(.15,.9),
    loyalty :rnd(.1,.95),  greed  :rnd(.1,.9), empathy:rnd(.1,.9)
  };
}
function newMood(){return {joy:.4,anger:.05,sorrow:.05,glee:.2};}
function archetype(t){
  // 성격에서 별칭 창발
  if(t.ambition>.7&&t.greed>.6) return '정복자';
  if(t.caution>.7&&t.empathy>.6) return '현인';
  if(t.loyalty<.3&&t.ambition>.55) return '야심가';
  if(t.empathy>.7) return '인자한 자';
  if(t.greed>.7) return '수탈자';
  if(t.caution>.7) return '신중한 자';
  if(t.ambition>.7) return '팽창주의자';
  return '평범한 자';
}

/* 군주/지방관 이름 풀 */
const SURNAME=['아르','벨','카','드란','에','펜','가','하','이','자','크라','루','모','네','오','파','루','사','타','발','유','즈','베','시','노'];
const GIVEN  =['군','다','라스','난','돈','릭','미르','노스','온','리스','산','텐','우르','벤','시아','크','달','윈','조르','한'];
function genName(){return pick(SURNAME)+pick(GIVEN);}

const NAMES=['북부 왕국','붉은 제국','해안 연맹','유목 칸국','삼나무 공화국','잿빛 교단','동방 상단','검은 강 부족','여명 왕조','소금 사막 민족','서리 부족','태양 신정'];

/* 시작 세력을 서로 가까운(맞닿을 수 있는) 비옥지에 배치 */
function clusterSeeds(k){
  // 가장 비옥한 land 셀 후보 모음
  const cand=[];
  for(let i=0;i<N;i++){const c=cells[i];if(c.st==='land'&&c.fert>.35)cand.push(i);}
  if(cand.length<k){for(let i=0;i<N;i++){const c=cells[i];if(c.st!=='water'&&!cand.includes(i))cand.push(i);}}
  if(!cand.length) return [];
  // 임의의 중심 잡고, 그 주변에서 적당히 떨어진(8~16칸) 셀 k개 선택 → 초기엔 분리, 곧 맞닿음
  const center=pick(cand);
  const cx=center%COLS, cy=center/COLS|0;
  const ranked=cand.map(i=>{const d=Math.abs(i%COLS-cx)+Math.abs((i/COLS|0)-cy);return {i,d};})
    .filter(o=>o.d>=4 && o.d<=Math.max(8,(COLS+ROWS)/3))
    .sort((a,b)=>a.d-b.d);
  const out=[center];
  for(const o of ranked){
    if(out.length>=k)break;
    // 이미 뽑힌 것과 너무 붙지 않게(>=4) 분산
    if(out.every(s=>Math.abs(s%COLS-o.i%COLS)+Math.abs((s/COLS|0)-(o.i/COLS|0))>=4)) out.push(o.i);
  }
  while(out.length<k && cand.length){const c=pick(cand);if(!out.includes(c))out.push(c);}
  return out.slice(0,k);
}

/* ---------- 세력 생성 ---------- */
function spawnFaction(announce, where){
  if(nameIdx>=NAMES.length) nameIdx=0;
  const idx=nameIdx++;
  let seed=where;
  if(seed===undefined){
    for(let t=0;t<400;t++){const i=Math.random()*N|0;if(cells[i].st==='land'&&cells[i].owner===null&&cells[i].fert>.3){seed=i;break;}}
    if(seed===undefined) for(let t=0;t<400;t++){const i=Math.random()*N|0;if(cells[i].st!=='water'&&cells[i].owner===null){seed=i;break;}}
  }
  if(seed===undefined) return null;
  const sovTrait=newTrait();
  const f={
    id:(factions.length?Math.max(...factions.map(x=>x.id)):-1)+1,
    name:NAMES[idx], color:COLORS[idx%COLORS.length],
    sov:{aid:agentSeq++, role:'군주', name:genName()+(Math.random()<.5?' 1세':''), trait:sovTrait,
         mood:newMood(), goal:'expand', mem:[], faith:rnd(0,.3)},
    govs:[],            // 지방관들
    cells:[], size:0, stock:40, golden:0, founded:year,
    edict:null, edictAge:0, religion:Math.random()<.25
  };
  cells[seed].st='land';
  setCell(seed, f.id, 1, '개척지');
  // 첫 지방관
  f.govs.push(makeGov(f, seed));
  cells[seed].gov=0;
  factions.push(f);
  if(announce){
    logEvent(`${f.name} 건국 — 군주 ${f.sov.name}(${archetype(sovTrait)})`, `=FOUND("${f.name}", ${ref(seed)}, 군주="${f.sov.name}")`, '🏳', f.color);
  }
  return f;
}
function makeGov(f, seatIdx){
  return {aid:agentSeq++, role:'지방관', name:genName(), trait:newTrait(), mood:newMood(),
          goal:'expand', mem:[], seat:seatIdx, dissent:0, lastThought:''};
}
function facById(id){return factions.find(f=>f.id===id);}

function setCell(i,owner,level,label){
  const c=cells[i];c.owner=owner;c.level=level;c.st='land';
  if(label){c.hist.push(label);if(c.hist.length>8)c.hist.shift();}
  dirty.add(i);
}

const LV_TXT=['','·','田','邑','城'];
const LV_LABEL=['','개척지','농경지','읍락','대도시'];

/* ---------- 그리기 ---------- */
function paint(i){
  const c=cells[i],el=cellEls[i];if(!el)return;
  let bg='',tx='',col='#333',w='',cap='';
  if(plague.has(i)){bg='#ead5f5';tx='疫';col='#7030a0';w='700';}
  else if(fires.has(i)){bg='#ffd9b3';tx='火';col='#c00000';w='700';}
  else if(c.st==='water'){bg='#dbeaf7';tx='≈';col='#9dc3e6';}
  else if(c.st==='ruin'){bg='#ededed';tx='墟';col='#aaa';}
  else if(c.st==='forest'){bg='#e3efda';tx='木';col='#548235';}
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      let a=.16+c.level*.18;
      bg=hexA(f.color,a);tx=LV_TXT[c.level];col=f.color;w=c.level>=3?'700':'';
      if(c.stress>.45) cap='⚠';
      // 군주 좌소엔 왕관
      if(f.govs.length&&f.govs[0]&&f.govs[0].seat===i&&c.level>=2) cap='♔';
    }
  } else {
    // 빈 땅: 비옥도 연하게 비침
    if(c.fert>.5){bg='#fafdf7';}
  }
  el.style.background=bg;el.style.color=col;el.style.fontWeight=w;
  el.textContent=tx;
  // cap
  let capEl=el.querySelector('.cap');
  if(cap){ if(!capEl){capEl=document.createElement('span');capEl.className='cap';el.appendChild(capEl);} capEl.textContent=cap; }
  else if(capEl) capEl.remove();
}
function ping(i,color){
  const el=cellEls[i];if(!el)return;
  const p=document.createElement('div');p.className='ping';p.style.background=hexA(color,.5);
  el.appendChild(p);setTimeout(()=>p.remove(),900);
}
function flashWar(i){const el=cellEls[i];if(!el)return;el.classList.add('war');setTimeout(()=>el.classList.remove('war'),1200);}

/* ====================================================================
   감정 동역학 — 사건이 mood를 움직인다(창발)
==================================================================== */
function feel(ag, key, amt){
  ag.mood[key]=clamp(ag.mood[key]+amt,0,1);
  // 상호 억제: 기쁨↔슬픔, 즐거움↔분노 약하게
  if(key==='joy') ag.mood.sorrow=clamp(ag.mood.sorrow-amt*.4,0,1);
  if(key==='sorrow') ag.mood.joy=clamp(ag.mood.joy-amt*.4,0,1);
  if(key==='glee') ag.mood.anger=clamp(ag.mood.anger-amt*.3,0,1);
}
function remember(ag, txt){ ag.mem.push(`서기 ${year}년 · ${txt}`); if(ag.mem.length>6) ag.mem.shift(); }
function moodDecay(ag){
  ag.mood.anger*=.985; ag.mood.glee*=.96; ag.mood.joy=ag.mood.joy*.98+.02*.35; ag.mood.sorrow*=.985;
}
function dominantMood(ag){
  const m=ag.mood, e=[['기쁨',m.joy,'😊'],['분노',m.anger,'😠'],['슬픔',m.sorrow,'😢'],['즐거움',m.glee,'😄']];
  e.sort((a,b)=>b[1]-a[1]); return e[0];
}

/* ====================================================================
   지방관의 자율 판단 — 군주 칙령을 자기 감정/이해로 해석
   반환 효용 기반으로 행동을 스스로 고른다(규칙 굴림 아님).
==================================================================== */
function govDecide(f, gov){
  // 이 지방관이 관할하는 영토(가까운 셀들) 식량/위협 추정
  const seat=gov.seat;
  const region=f.cells.filter(i=>{const dx=Math.abs(i%COLS-seat%COLS),dy=Math.abs((i/COLS|0)-(seat/COLS|0));return dx+dy<=Math.max(3,(f.cells.length/Math.max(1,f.govs.length))|0);});
  const myCells=region.length?region:f.cells;
  const C=CLIMATES[clim];
  let food=0, threat=0, stress=0, lv=0;
  for(const i of myCells){const c=cells[i];food+=(.35+c.fert*1.0)*C.food*(1+c.level*.55)*(1-c.stress*.6);stress+=c.stress;lv+=c.level;
    for(const n of nbrs(i)){const nc=cells[n];if(nc.owner!==null&&nc.owner!==f.id)threat++;}}
  const cnt=Math.max(1,myCells.length);
  const foodPC=food/cnt, stressPC=stress/cnt, threatN=threat;
  const surplus=foodPC - 0.85;  // 1인 소비 기준선

  // 감정 갱신: 환경에서 직접 창발
  if(surplus> .35) feel(gov,'joy',.05);
  if(surplus< -.05){ feel(gov,'sorrow',.06); feel(gov,'anger',.035); }
  if(stressPC>.4){ feel(gov,'sorrow',.05); feel(gov,'anger',.06); }
  if(threatN>2) feel(gov,'anger',.03);

  // 칙령 해석 — 충성/감정으로 순응 여부 결정
  const ed=f.edict;
  let comply=true, dissentTxt='';
  if(ed){
    // 군주에 대한 불만 = 분노 - 충성*공감 - 군주공감의 잔향
    const grievance = gov.mood.anger*1.1 + gov.mood.sorrow*.6 - gov.trait.loyalty*.9 - f.sov.mood.joy*.2;
    if(ed==='war' && gov.trait.caution>.6 && grievance>.1){comply=false;dissentTxt='무모한 전쟁을 거부';}
    else if(ed==='tax' && gov.trait.empathy>.55){comply=Math.random()>gov.trait.empathy*.7;if(!comply)dissentTxt='가혹한 징세에 항명';}
    else if(ed==='migrate' && gov.trait.loyalty>.6){comply=true;}
    else if(grievance>.45){comply=false;dissentTxt='군주의 명을 묵살';}
    if(!comply){ gov.dissent=clamp(gov.dissent+.18,0,1); feel(gov,'anger',.05); }
    else gov.dissent=clamp(gov.dissent-.04,0,1);
  }

  // 목표 효용 — 환경 적응 의사결정의 핵심
  const U={};
  U.expand  = gov.trait.ambition*.9 + surplus*.6 + gov.mood.glee*.5 - threatN*.12 - (clim==='ashen'||clim==='drought'?.5:0);
  U.fortify = threatN*.45 + gov.mood.anger*.5 + gov.trait.caution*.4;
  U.hoard   = (surplus<.1?.6:0) + gov.trait.caution*.5 + (C.food<.8?.7:0) + gov.mood.sorrow*.3 + gov.trait.greed*.3;
  U.migrate = (stressPC>.5?1.0:0) + (foodPC<.2?.8:0) + (clim==='flood'&&isCoastal(myCells)?.6:0) - gov.trait.loyalty*.3;
  U.pray    = (f.religion?.6:0) + gov.mood.sorrow*.7 + (stressPC>.4?.5:0);
  // 칙령이 목표를 끌어당긴다(순응 시)
  if(comply&&ed){
    if(ed==='war') U.expand+=.7;
    if(ed==='fortify') U.fortify+=.7;
    if(ed==='migrate') U.migrate+=.9;
    if(ed==='hoard'||ed==='tax') U.hoard+=.6;
    if(ed==='pray') U.pray+=.7;
  }
  let best='expand',bv=-1e9;for(const k in U){if(U[k]>bv){bv=U[k];best=k;}}
  gov.goal=best;

  // 사고 기록(내면 패널용)
  const dm=dominantMood(gov);
  gov.lastThought = thoughtText(gov, best, surplus, stressPC, threatN, comply, dissentTxt, ed);
  if(dissentTxt) remember(gov, dissentTxt);

  return {goal:best, region:myCells, surplus, stressPC, threatN, comply, dissentTxt};
}
function isCoastal(arr){for(const i of arr)for(const n of nbrs(i))if(cells[n].st==='water')return true;return false;}
function thoughtText(gov,goal,surplus,stress,threat,comply,dissent,ed){
  const G={expand:'백성을 이끌고 영토를 넓히려 한다',fortify:'성벽을 쌓고 방비를 굳힌다',
    hoard:'곳간을 채우며 겨울을 대비한다',migrate:'이 땅을 버리고 새 터를 찾으려 한다',pray:'하늘에 비를 빈다'};
  let s='';
  if(stress>.5) s+='땅이 메말라간다. ';
  else if(surplus<-.05) s+='식량이 부족하다. ';
  else if(surplus>.3) s+='곳간이 넉넉하다. ';
  if(threat>2) s+='이웃의 칼끝이 가깝다. ';
  if(ed&&!comply&&dissent) s+=`「${dissent}」 — `;
  else if(ed&&comply) s+='군주의 뜻을 받든다. ';
  s+=G[goal]+'.';
  return s;
}

/* ====================================================================
   군주의 자율 판단 — 세력 전체 상황 보고 칙령 결정
==================================================================== */
function sovDecide(f){
  const sov=f.sov;
  const C=CLIMATES[clim];
  let food=0,stress=0,threat=0,lv=0;
  for(const i of f.cells){const c=cells[i];food+=(.35+c.fert*1.0)*C.food*(1+c.level*.55)*(1-c.stress*.6);stress+=c.stress;lv+=c.level;
    for(const n of nbrs(i)){if(cells[n].owner!==null&&cells[n].owner!==f.id)threat++;}}
  const cnt=Math.max(1,f.cells.length);
  const foodPC=food/cnt, stressPC=stress/cnt;
  f.stock=clamp(f.stock + (food - cnt*0.78), 0, cnt*10+50);
  const starving = f.stock < cnt*0.5;

  // 군주 감정 창발
  if(f.golden>0) feel(sov,'glee',.04);
  if(starving){ feel(sov,'sorrow',.06); feel(sov,'anger',.03); }
  else feel(sov,'joy',.02);
  // 지방관 항명 평균 → 군주 분노/슬픔
  const dis=f.govs.reduce((a,g)=>a+g.dissent,0)/Math.max(1,f.govs.length);
  if(dis>.4){ feel(sov,'anger',.05); feel(sov,'sorrow',.02); }

  // 칙령 결정 (효용) — 인접 적이 있을수록 정복/수성이 강해진다
  const contact = threat>0;
  const U={};
  U.war     = sov.trait.ambition*1.1 + sov.mood.anger*.7 + (contact?.5+Math.min(threat,8)*.07:0) + sov.mood.glee*.4 + (C.food>1.1?.5:0) + (f.stock>cnt*2?.4:0) - (C.food<.7?.6:0) - sov.trait.caution*.45;
  U.fortify = (threat>1?.6:0) + sov.trait.caution*.6 + sov.mood.anger*.3;
  U.hoard   = (starving?1.0:0) + (C.food<.85?.7:0) + sov.trait.caution*.4 + sov.mood.sorrow*.4;
  U.tax     = sov.trait.greed*.9 - sov.trait.empathy*.5 + (f.stock<cnt*.5?.5:0);
  U.migrate = (stressPC>.55?1.0:0) + (foodPC<.18?.7:0) - sov.trait.loyalty*.2;
  U.pray    = (f.religion?.5:0) + sov.mood.sorrow*.6 + (stressPC>.45?.4:0);
  let best=null,bv=.35; // 임계치 — 어지간하면 무위(無爲)
  for(const k in U){if(U[k]>bv){bv=U[k];best=k;}}
  if(best && best!==f.edict){
    f.edict=best; f.edictAge=0;
    const dm=dominantMood(sov);
    const ET={war:'정복의 칙령',fortify:'수성의 칙령',hoard:'비축의 칙령',tax:'징세의 칙령',migrate:'대이주의 칙령',pray:'기원의 칙령'};
    remember(sov, `${ET[best]}을 내림`);
    if(['war','migrate','tax','pray'].includes(best))
      logEvent(`${f.name}의 ${sov.name}이(가) ${ET[best]}을 선포했습니다. (${dm[2]}${dm[0]})`,
        `=EDICT("${f.name}", "${best.toUpperCase()}", 군주기분="${dm[0]}")`, best==='war'?'⚔':best==='pray'?'🙏':best==='migrate'?'⛵':'🏛', f.color);
  } else f.edictAge++;
  // 군주 자기 goal
  sov.goal = best||'fortify';
}

/* ====================================================================
   반란 / 분열 / 배신 — 항명 누적이 임계 넘으면 창발
==================================================================== */
function checkRebellion(f){
  for(let gi=f.govs.length-1; gi>=0; gi--){
    const g=f.govs[gi];
    if(gi===0) continue; // 군주 직할
    const rebelDrive = g.dissent*1.2 + g.mood.anger*.9 - g.trait.loyalty*.6 - f.sov.mood.joy*.2;
    if(rebelDrive>1.1 && g.trait.ambition>.55 && f.govs.length>1 && Math.random()<.16){
      // 독립/분열 → 새 세력 (충분한 영토가 있을 때만 — 난립 방지)
      const myCells=f.cells.filter(i=>cells[i].gov===gi);
      if(myCells.length>=3){
        breakaway(f, g, gi, myCells);
        return;
      }
    } else if(rebelDrive>.75 && Math.random()<.12){
      // 태업: 영토 일부 황폐(세금 거부로 발전 정지·약화)
      const myCells=f.cells.filter(i=>cells[i].gov===gi);
      const t=pick(myCells); if(t!==undefined){const c=cells[t];if(c.level>1){c.level--;c.hist.push('태업');dirty.add(t);
        logEvent(`${f.name}의 지방관 ${g.name}이(가) 태업으로 ${ref(t)}이(가) 쇠락했습니다.`,`=DISSENT("${g.name}", ${ref(t)})`,'🔥',f.color);}}
      g.dissent*=.6;
    }
  }
}
function breakaway(f, g, gi, myCells){
  if(nameIdx>=NAMES.length) nameIdx=0;
  const idx=nameIdx++;
  const betray = g.trait.loyalty<.3;
  const nf={
    id:(Math.max(...factions.map(x=>x.id)))+1,
    name:('자유 '+NAMES[idx].split(' ')[0]), color:COLORS[idx%COLORS.length],
    sov:{aid:g.aid, role:'군주', name:g.name+(betray?' (반역자)':''), trait:g.trait, mood:g.mood, goal:'fortify', mem:g.mem.slice(), faith:0},
    govs:[], cells:[], size:0, stock:15, golden:0, founded:year, edict:'fortify', edictAge:0, religion:f.religion
  };
  nf.govs.push({aid:agentSeq++,role:'지방관',name:genName(),trait:newTrait(),mood:newMood(),goal:'fortify',mem:[],seat:myCells[0],dissent:0,lastThought:''});
  for(const i of myCells){ cells[i].owner=nf.id; cells[i].gov=0; cells[i].hist.push(betray?'배신·독립':'독립'); dirty.add(i); ping(i,nf.color); }
  factions.push(nf);
  f.govs.splice(gi,1);
  // 군주 분노/슬픔
  feel(f.sov,'anger',.4); feel(f.sov,'sorrow',.25);
  remember(f.sov, `${g.name}의 ${betray?'배신':'독립'}`);
  logEvent(`${g.name}이(가) ${f.name}에서 ${betray?'배신하고':'갈라져'} 「${nf.name}」을(를) 세웠습니다!`,
    `=SECEDE("${g.name}"→"${nf.name}", from="${f.name}")`, betray?'🗡':'🔥', nf.color);
}

/* ====================================================================
   기후 격변 즉시 효과
==================================================================== */
function onClimateShift(prev, now){
  const C=CLIMATES[now];
  document.documentElement.style.setProperty('--sky',C.sky);
  showCata(now);
  logEvent(`기후가 ${CLIMATES[prev].name}에서 ${C.name}(으)로 격변했습니다.`,
    `=CLIMATE.SHIFT("${CLIMATES[prev].name}", "${C.name}")`, '🌐', C.hue);
  // 모든 에이전트가 격변을 감지하고 감정 반응
  for(const f of factions){
    const agents=[f.sov,...f.govs];
    for(const ag of agents){
      if(C.food>1.2){ feel(ag,'joy',.3); feel(ag,'glee',.2); remember(ag,`${C.name} 도래 — 풍요의 조짐`); }
      else if(C.food<.6){ feel(ag,'sorrow',.3); feel(ag,'anger',.12); remember(ag,`${C.name} 도래 — 시련의 시작`); }
      else remember(ag,`${C.name}(으)로 계절이 바뀜`);
    }
  }
  // 격변 재해
  if(C.disaster==='fire') seedDisaster('fire',2);
  if(C.disaster==='plague') seedDisaster('plague',1);
  if(C.disaster==='flood') floodCoast();
  if(C.disaster==='bloom') bloomLand();
}
function seedDisaster(kind,nn){
  const tg=cells.map((c,i)=>({c,i})).filter(o=>o.c.owner!==null&&o.c.level>=2);
  for(let k=0;k<nn&&tg.length;k++){const o=pick(tg);
    if(kind==='fire'){fires.set(o.i,6);dirty.add(o.i);logEvent(`${ref(o.i)}에 대화재가 번졌습니다.`,`=FIRE(${ref(o.i)})`,'🔥','#c00');}
    else{plague.set(o.i,11);dirty.add(o.i);logEvent(`${ref(o.i)}에서 역병이 창궐했습니다.`,`=PLAGUE(${ref(o.i)})`,'☣','#7030a0');}
  }
}
function floodCoast(){
  let n=0;for(let i=0;i<N;i++){const c=cells[i];if(c.owner!==null&&c.level<=1){for(const nb of nbrs(i))if(cells[nb].st==='water'){if(Math.random()<.4){c.stress=clamp(c.stress+.5,0,1);c.hist.push('침수');dirty.add(i);n++;}break;}}}
  if(n) logEvent(`대홍수가 해안 ${n}곳을 덮쳤습니다.`,`=FLOOD(coast, ${n})`,'🌊','#1f6f8b');
}
function bloomLand(){
  for(let i=0;i<N;i++){const c=cells[i];if(c.st==='land'||c.owner!==null){c.fert=clamp(c.fert+.06,0,1);c.stress=clamp(c.stress-.2,0,1);}}
  logEvent(`대지가 깨어나 만물이 푸르러집니다.`,`=BLOOM(world)`,'🌱','#3a7d23');
}

/* ====================================================================
   메인 틱
==================================================================== */
let tickN=0, warCD=0;
function tick(){
  tickN++; year++; if(warCD>0)warCD--;
  climStep();
  const C=CLIMATES[clim];

  // --- 재집계 + 환경 비옥도 드리프트 + 폐허 회복 ---
  for(const f of factions){f.cells.length=0;f.size=0;}
  worldPop=0;
  const PW=[0,30,120,420,1200];
  for(let i=0;i<N;i++){
    const c=cells[i];
    // 기후가 비옥도를 천천히 끌어당김(격변 적응의 무대)
    c.fert=clamp(c.fert+C.drift*.4,0,1);
    if(c.stress>0) c.stress=clamp(c.stress-.01,0,1);
    if(c.st==='ruin'&&--c.ruinT<=0){c.st='land';c.fert=clamp(c.fert+.1,0,1);dirty.add(i);}
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){f.cells.push(i);f.size++;worldPop+=PW[c.level];}
      else{c.owner=null;c.level=0;c.gov=-1;dirty.add(i);}
    }
  }

  // --- 멸망 판정 ---
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      obituaries.push({name:f.name, year, sov:f.sov.name, lasted:year-f.founded});
      logEvent(`${f.name}이(가) 역사에서 사라졌습니다. (${year-f.founded}년 존속)`,`=COLLAPSE("${f.name}", 존속=${year-f.founded})`,'†','#999');
      factions.splice(k,1);
      if(selKind==='sov'&&selRef===f.id||selKind==='gov'&&selRef&&selRef.fid===f.id){selKind=null;renderMind();}
    }
  }

  // --- 화재 전파 ---
  for(const [i,t] of [...fires]){
    if(Math.random()<.13){for(const n of nbrs(i)){const c=cells[n];if(c.owner!==null&&!fires.has(n)&&c.st==='land'){fires.set(n,5);dirty.add(n);}}}
    if(t<=1){fires.delete(i);const c=cells[i];c.owner=null;c.level=0;c.gov=-1;c.st='ruin';c.ruinT=160;c.stress=clamp(c.stress+.6,0,1);c.hist.push('잿더미');dirty.add(i);}
    else fires.set(i,t-1);
  }
  // --- 역병 전파 ---
  if(plague.size){
    for(const [i,t] of [...plague]){
      if(Math.random()<.17){for(const n of nbrs(i))if(cells[n].owner!==null&&!plague.has(n)){plague.set(n,11);dirty.add(n);}}
      if(Math.random()<.23){const c=cells[i];c.level--;if(c.level<=0){c.owner=null;c.level=0;c.gov=-1;c.hist.push('역병으로 폐촌');}dirty.add(i);}
      if(t<=1){plague.delete(i);dirty.add(i);}else plague.set(i,t-1);
    }
    if(plague.size===0) logEvent('역병이 물러갔습니다.','=PLAGUE.END()','☣','#7030a0');
  }

  // --- 세력별 AI 행동 ---
  for(const f of factions){
    if(f.golden>0)f.golden--;
    if(f.size===0)continue;
    // 군주 칙령 결정(가끔)
    if(tickN% (3+ (f.id%3)) ===0) sovDecide(f);
    moodDecay(f.sov);

    // 지방관별 자율 행동
    let famineHit=false;
    for(let gi=0; gi<f.govs.length; gi++){
      const gov=f.govs[gi]; moodDecay(gov);
      const d=govDecide(f,gov);
      const myCells = f.cells.filter(i=>cells[i].gov===gi);
      if(myCells.length===0){ // 좌소 잃음 → 새 좌소
        if(f.cells.length){gov.seat=f.cells[0];cells[f.cells[0]].gov=gi;}continue;
      }
      // 기근 피해: 식량 적자 + 곳간 고갈일 때만 영토 약화(환경 격변이 진짜 기근으로)
      const realFamine = d.surplus < -0.05 && f.stock < f.cells.length*0.6;
      if(realFamine && Math.random()<.18){
        const t=pick(myCells);const c=cells[t];if(c.level>1){c.level--;c.hist.push('기근');dirty.add(t);famineHit=true;feel(gov,'sorrow',.12);feel(gov,'anger',.05);}
        else if(c.level===1 && f.cells.length>2 && Math.random()<.25){c.owner=null;c.level=0;c.gov=-1;c.hist.push('아사·폐촌');dirty.add(t);famineHit=true;}
      }
      // 목표별 행동
      executeGoal(f, gi, gov, d, myCells);
    }
    if(famineHit && warCD===0 && Math.random()<.3){
      logEvent(`${f.name}에 기근이 들어 백성이 굶주립니다.`,`=FAMINE("${f.name}", 기후="${C.name}")`,'😢',f.color);
      warCD=18;
    }

    // 지방관 증설(영토 크고 분산되면 새 지방관)
    if(f.cells.length > f.govs.length*5 + 4 && f.govs.length<6 && Math.random()<.25){
      const far=f.cells.filter(i=>cells[i].gov===-1 || true);
      const seat=pick(f.cells);
      f.govs.push(makeGov(f, seat));
      // 재할당: 가까운 셀을 새 지방관에게
      reassignGovs(f);
    }

    // 반란/배신 체크
    if(tickN%4===0) checkRebellion(f);

    // 황금기: 모든 지방관 평균 기쁨 높고 격변 적응 성공
    const avgJoy=f.govs.reduce((a,g)=>a+g.mood.joy,0)/Math.max(1,f.govs.length);
    if(f.golden===0 && avgJoy>.7 && f.stock>f.cells.length*2 && Math.random()<.02){
      f.golden=70; feel(f.sov,'glee',.4);
      logEvent(`${f.name}이(가) 풍요와 화합 속에 황금기를 맞았습니다!`,`=GOLDEN.AGE("${f.name}", 70)`,'✦',f.color);
    }
  }

  // --- 바다 건너 새 세력 도래(가뭄/혹한이면 이주민↑) ---
  const migBias = (clim==='drought'||clim==='cold'||clim==='ashen')?.018:.006;
  if(factions.length<3 && Math.random()<migBias){
    const f=spawnFaction(false);
    if(f) logEvent(`바다 건너에서 ${f.name}이(가) 도래했습니다.`,`=MIGRATE("${f.name}")`,'⛵',f.color);
  }

  // --- 그리기 & UI ---
  for(const i of dirty) paint(i);
  dirty.clear();
  document.getElementById('st-year').textContent=`서기 ${year}년`;
  document.getElementById('st-pop').textContent=`인구 ${worldPop.toLocaleString()}`;
  if(tickN%5===0){ renderPowers(); document.getElementById('tab-dead').textContent=`멸망기록 (${obituaries.length})`; document.title=`창세기.xlsx - Excel (서기 ${year}년)`; }
  // 내면 패널 라이브 갱신
  if((selKind==='gov'||selKind==='sov') && tickN%6===0) renderMind();
}

function reassignGovs(f){
  for(const i of f.cells){
    let bg=0,bd=1e9;
    for(let gi=0;gi<f.govs.length;gi++){const s=f.govs[gi].seat;const dist=Math.abs(i%COLS-s%COLS)+Math.abs((i/COLS|0)-(s/COLS|0));if(dist<bd){bd=dist;bg=gi;}}
    cells[i].gov=bg;
  }
}

/* ---------- 목표 실행 ---------- */
function executeGoal(f, gi, gov, d, myCells){
  const C=CLIMATES[clim];
  const acts=1+ (myCells.length*.10|0) + (f.golden?1:0);
  for(let a=0;a<acts;a++){
    const src=pick(myCells); if(src===undefined||cells[src].owner!==f.id)continue;
    const nb=nbrs(src);
    if(gov.goal==='expand'){
      const warEdict = f.edict==='war' && d.comply;
      // 호전적일 땐 인접 적 영토를 우선 노린다(전선 형성)
      let tgt;
      const enemies = nb.filter(n=>{const c=cells[n];return c.owner!==null&&c.owner!==f.id&&c.st!=='water';});
      if(enemies.length && (warEdict || Math.random()<.35+f.sov.trait.ambition*.3+gov.mood.anger*.3)){
        tgt=pick(enemies);
      } else tgt=pick(nb);
      const tc=cells[tgt];
      if(tc.st==='water'||fires.has(tgt)||plague.has(tgt))continue;
      if(tc.owner===null){
        if(tc.st==='forest'){if(Math.random()<.3){tc.st='land';tc.fert=clamp(tc.fert+.05,0,1);tc.hist.push('개간');setCell(tgt,f.id,1,'개척지');cells[tgt].gov=gi;}}
        else setCell(tgt,f.id,1,'개척지'),cells[tgt].gov=gi;
      } else if(tc.owner!==f.id && Math.random() < (warEdict?.85:.4+f.sov.trait.ambition*.2)){
        doWar(f,gov,tgt,tc);
      }
    } else if(gov.goal==='fortify'){
      // 발전(레벨↑)으로 방어
      if(cells[src].level<4 && Math.random()<.12*(f.golden?2:1)*(C.food>1?1.3:.8)){
        levelUp(f,src);
      }
    } else if(gov.goal==='hoard'){
      f.stock=clamp(f.stock+ cells[src].fert*C.food*1.4, 0, f.cells.length*8+30);
      if(Math.random()<.05 && cells[src].level<3) levelUp(f,src);
    } else if(gov.goal==='migrate'){
      // 가장 비옥하고 안 메마른 빈 땅으로 점프 이주
      tryMigrate(f,gi,gov,src);
    } else if(gov.goal==='pray'){
      f.sov.faith=clamp(f.sov.faith+.01,0,1);
      cells[src].stress=clamp(cells[src].stress-.04,0,1);dirty.add(src);
      if(Math.random()<.02 && C.food<.8){ // 기적: 신앙 깊으면 비옥도 회복
        cells[src].fert=clamp(cells[src].fert+.12,0,1);
        feel(gov,'joy',.1);
      }
    } else { // fortify default — develop
      if(cells[src].level<4&&Math.random()<.08) levelUp(f,src);
    }
  }
}
function levelUp(f,i){
  const c=cells[i];c.level++;c.hist.push(LV_LABEL[c.level]);dirty.add(i);
  if(c.level===4&&warCD===0){logEvent(`${f.name}의 ${ref(i)}에 대도시가 세워졌습니다.`,`=CITY("${f.name}", ${ref(i)})`,'🏛',f.color);warCD=22;}
}
function doWar(f,gov,tgt,tc){
  const defF=facById(tc.owner);if(!defF)return;
  const att=1+f.size*.012 + gov.mood.anger*2 + f.sov.trait.ambition*2 + (f.golden?1.5:0) + rnd(0,2);
  const def=tc.level*1.4+1 + defF.size*.008 + rnd(0,2);
  flashWar(tgt);
  if(att>def){
    if(Math.random()<.28){fires.set(tgt,5);tc.hist.push('전화(戰火)');dirty.add(tgt);}
    else{const gi=cells[tgt].gov;setCell(tgt,f.id,Math.max(1,tc.level-1),'점령됨');
      // 점령지 지방관 재할당
      let bg=0,bd=1e9;for(let k=0;k<f.govs.length;k++){const s=f.govs[k].seat;const dist=Math.abs(tgt%COLS-s%COLS)+Math.abs((tgt/COLS|0)-(s/COLS|0));if(dist<bd){bd=dist;bg=k;}}cells[tgt].gov=bg;}
    feel(gov,'glee',.18); feel(f.sov,'glee',.06);
    feel(defF.sov,'anger',.12); feel(defF.sov,'sorrow',.08);
    if((tc.level>=3||warCD===0)){
      logEvent(`${f.name}이(가) ${defF.name}의 ${LV_LABEL[Math.max(1,tc.level)]||'영토'}(${ref(tgt)})를 점령했습니다.`,
        `=WAR("${f.name}"→"${defF.name}", ${ref(tgt)}, 분노=${gov.mood.anger.toFixed(2)})`,'⚔',f.color);
      warCD=16;
    }
  } else {
    feel(gov,'anger',.1); feel(gov,'sorrow',.05);
    if(warCD===0&&Math.random()<.3){logEvent(`${f.name}의 ${defF.name} 침공이 격퇴되었습니다.`,`=WAR.REPEL("${defF.name}", ${ref(tgt)})`,'⚔',defF.color);warCD=26;}
  }
}
function tryMigrate(f,gi,gov,src){
  const C=CLIMATES[clim];
  // 주변에서 비옥하고 stress 낮은 빈 땅 탐색(스폰지처럼 한 칸 + 가끔 멀리 이주)
  let best=-1,bv=-1;
  for(const n of nbrs(src)){const c=cells[n];if(c.st==='water'||c.owner!==null||fires.has(n))continue;const v=c.fert*C.food-c.stress;if(v>bv){bv=v;best=n;}}
  if(best>=0 && bv>cells[src].fert*C.food-cells[src].stress){
    setCell(best,f.id,1,'이주 개척');cells[best].gov=gi;
    // 원래 좌소가 너무 황폐하면 버림
    if(cells[src].stress>.6&&cells[src].level<=1&&f.cells.length>3){cells[src].owner=null;cells[src].level=0;cells[src].gov=-1;cells[src].hist.push('유랑으로 비움');dirty.add(src);}
  }
}

/* ====================================================================
   UI 렌더 — 세력 / 내면 / 연대기
==================================================================== */
let sideTab='powers';
function moodBarHtml(m){
  const segs=[['#f5c542',m.joy],['#e5534b',m.anger],['#5b86c4',m.sorrow],['#62b56a',m.glee]];
  const tot=segs.reduce((a,s)=>a+s[1],0)||1;
  return '<div class="moodbar">'+segs.map(s=>`<i style="width:${s[1]/tot*100}%;background:${s[0]}"></i>`).join('')+'</div>';
}
function renderPowers(){
  const el=document.getElementById('powers');
  let h='';
  const live=[...factions].sort((a,b)=>b.size-a.size);
  for(const f of live){
    const dm=dominantMood(f.sov);
    h+=`<div class="fc" data-sov="${f.id}">
      <div class="h"><span class="sw" style="background:${f.color}"></span>${f.name}${f.golden?' <span class="tag" style="background:#fff3c4;color:#946c00">✦황금기</span>':''}</div>
      <div class="sub">군주 ${f.sov.name} · ${archetype(f.sov.trait)} ${dm[2]} · 영토 ${f.size}칸 · 곳간 ${f.stock|0}</div>
      ${moodBarHtml(f.sov.mood)}
      <div class="gov">지방관 ${f.govs.length}명: `;
    h+=f.govs.map((g,i)=>{const gd=dominantMood(g);const reb=g.dissent>.4?'<span class="tag" style="background:#ffe0e0;color:#a00">불온</span>':'';return `<span class="gv" data-gov="${f.id}:${i}">${g.name}${gd[2]}${reb}</span>`;}).join('');
    h+=`</div></div>`;
  }
  for(const o of obituaries.slice(-4).reverse()){
    h+=`<div class="fc dead"><div class="h">† ${o.name}</div><div class="sub">서기 ${o.year}년 멸망 · 군주 ${o.sov} · ${o.lasted}년 존속</div></div>`;
  }
  if(!live.length&&!obituaries.length) h='<div style="color:#999;text-align:center;margin-top:30px">태초의 정적…</div>';
  el.innerHTML=h;
}
function renderChron(){
  const el=document.getElementById('chron');
  let h='';
  for(const e of chronicle.slice(-90).reverse()){
    h+=`<div class="ce" style="border-left-color:${e.color}"><span class="yr">${e.year}년</span> <span class="ico">${e.ico}</span>${e.msg}</div>`;
  }
  if(!h) h='<div style="color:#999;text-align:center;margin-top:30px">아직 기록된 역사가 없습니다.</div>';
  el.innerHTML=h;
}
function traitRow(lbl,v,col){return `<div class="row"><span>${lbl}</span><span>${(v*100|0)}</span></div><div class="bar"><i style="width:${v*100}%;background:${col}"></i></div>`;}
function renderMind(){
  const el=document.getElementById('mind');
  let ag=null, f=null, role='';
  if(selKind==='sov'){ f=facById(selRef); if(f){ag=f.sov;role='군주';} }
  else if(selKind==='gov'&&selRef){ f=facById(selRef.fid); if(f&&f.govs[selRef.gi]){ag=f.govs[selRef.gi];role='지방관';} }
  if(!ag||!f){ el.innerHTML='<div class="empty">셀이나 세력을 클릭하면<br>그곳에 사는 에이전트의<br>성격·감정·기억·판단이<br>여기에 펼쳐집니다.</div>'; return; }
  const dm=dominantMood(ag);
  const GOAL={expand:'영토 확장',fortify:'방어·축성',hoard:'식량 비축',migrate:'대이주',pray:'기원',tax:'징세',war:'정복'};
  let h=`<div class="mh"><span style="width:11px;height:11px;border-radius:2px;background:${f.color};display:inline-block"></span>${ag.name} ${dm[2]}</div>
    <div class="mrole">${f.name} · ${role} · ${archetype(ag.trait)}</div>`;
  h+=`<div class="think">💭 ${ag.lastThought|| (role==='군주'?'세력의 안위를 가늠하는 중…':'영지를 살피는 중…')}</div>`;
  h+=`<h5>성격 (불변)</h5>`;
  h+=traitRow('야망',ag.trait.ambition,'#dc6a2d')+traitRow('신중',ag.trait.caution,'#2d72dc')
    +traitRow('충성',ag.trait.loyalty,'#2d9d5a')+traitRow('탐욕',ag.trait.greed,'#9d2d8a')+traitRow('공감',ag.trait.empathy,'#d4b022');
  h+=`<h5>감정 (창발 · 실시간)</h5>`;
  h+=traitRow('기쁨 😊',ag.mood.joy,'#f5c542')+traitRow('분노 😠',ag.mood.anger,'#e5534b')
    +traitRow('슬픔 😢',ag.mood.sorrow,'#5b86c4')+traitRow('즐거움 😄',ag.mood.glee,'#62b56a');
  h+=`<div class="row" style="margin-top:6px"><span>현재 목표</span><span><b>${GOAL[ag.goal]||ag.goal}</b></span></div>`;
  if(role==='군주'&&f.edict) h+=`<div class="row"><span>반포한 칙령</span><span><b>${({war:'정복',fortify:'수성',hoard:'비축',tax:'징세',migrate:'대이주',pray:'기원'})[f.edict]||f.edict}</b></span></div>`;
  if(role==='지방관'){h+=`<div class="row"><span>군주에 대한 불복</span><span>${(ag.dissent*100|0)}%</span></div><div class="bar"><i style="width:${ag.dissent*100}%;background:#b00"></i></div>`;}
  h+=`<h5>기억</h5>`;
  if(ag.mem.length) h+=ag.mem.slice().reverse().map(m=>`<div class="mem">· ${m}</div>`).join('');
  else h+=`<div class="mem" style="color:#aaa">아직 떠오르는 기억이 없다.</div>`;
  // 신의 개입
  h+=`<div id="godrow">
    <button data-god="bless">☀ 축복(풍요)</button>
    <button data-god="curse">🌋 저주(기근)</button>
    <button data-god="incite">😠 분노 부추김</button>
    <button data-god="calm">🕊 마음 진정</button>
  </div>`;
  el.innerHTML=h;
}

/* ====================================================================
   상호작용
==================================================================== */
// 셀 클릭
sheet.addEventListener('click',e=>{
  const t=e.target.closest('.cell');if(!t)return;
  if(selected>=0&&cellEls[selected])cellEls[selected].classList.remove('sel');
  selected=+t.dataset.i;t.classList.add('sel');
  const c=cells[selected];namebox.textContent=ref(selected);
  if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      const gi=c.gov>=0&&c.gov<f.govs.length?c.gov:0;
      selKind='gov';selRef={fid:f.id,gi};
      // 군주 좌소면 군주 보기
      if(f.govs[0]&&f.govs[0].seat===selected){selKind='sov';selRef=f.id;}
      switchSide('mind');renderMind();
      const ag = selKind==='sov'?f.sov:f.govs[gi];
      fmla.textContent=`=AGENT("${ag.name}", ${ref(selected)}, 목표="${ag.goal}", 분노=${ag.mood.anger.toFixed(2)})`;
      return;
    }
  }
  selKind='cell';selRef=selected;
  const land = c.st==='water'?'바다':c.st==='forest'?'원시림':c.st==='ruin'?'폐허':'빈 땅';
  fmla.textContent=`=LAND(${ref(selected)}, "${land}", 비옥도=${c.fert.toFixed(2)}, 피해=${c.stress.toFixed(2)})  ▸ 역사: ${c.hist.slice(-4).join(' → ')}`;
});
// 세력/지방관 패널 클릭
document.getElementById('side').addEventListener('click',e=>{
  const gov=e.target.closest('[data-gov]');
  if(gov){const [fid,gi]=gov.dataset.gov.split(':').map(Number);selKind='gov';selRef={fid,gi};switchSide('mind');renderMind();selectSeat(fid,gi);return;}
  const sov=e.target.closest('[data-sov]');
  if(sov){const fid=+sov.dataset.sov;selKind='sov';selRef=fid;switchSide('mind');renderMind();selectSeat(fid,0);return;}
  const god=e.target.closest('[data-god]');
  if(god){doGod(god.dataset.god);return;}
});
function selectSeat(fid,gi){
  const f=facById(fid);if(!f||!f.govs[gi])return;
  const s=f.govs[gi].seat;
  if(selected>=0&&cellEls[selected])cellEls[selected].classList.remove('sel');
  selected=s; if(cellEls[s]){cellEls[s].classList.add('sel');namebox.textContent=ref(s);}
}
// 신의 개입
function doGod(kind){
  let f=null,ag=null;
  if(selKind==='sov')f=facById(selRef),ag=f&&f.sov;
  else if(selKind==='gov'&&selRef)f=facById(selRef.fid),ag=f&&f.govs[selRef.gi];
  if(!f)return;
  const cellsToHit = selKind==='gov'?f.cells.filter(i=>cells[i].gov===selRef.gi):f.cells;
  if(kind==='bless'){for(const i of cellsToHit){cells[i].fert=clamp(cells[i].fert+.25,0,1);cells[i].stress=clamp(cells[i].stress-.4,0,1);ping(i,'#f5c542');dirty.add(i);}f.stock+=cellsToHit.length*2;if(ag){feel(ag,'joy',.5);feel(ag,'glee',.3);remember(ag,'하늘의 축복이 내림');}logEvent(`신의 손길이 ${f.name}에 풍요를 내렸습니다.`,`=GOD.BLESS("${f.name}")`,'☀','#f5c542');}
  if(kind==='curse'){for(const i of cellsToHit){cells[i].fert=clamp(cells[i].fert-.3,0,1);cells[i].stress=clamp(cells[i].stress+.5,0,1);ping(i,'#6b5b73');dirty.add(i);}if(ag){feel(ag,'sorrow',.5);feel(ag,'anger',.3);remember(ag,'하늘의 저주가 내림');}logEvent(`신의 진노가 ${f.name}에 기근을 내렸습니다.`,`=GOD.CURSE("${f.name}")`,'🌋','#6b5b73');}
  if(kind==='incite'){const ags=selKind==='sov'?[f.sov,...f.govs]:[ag];for(const a of ags)if(a){feel(a,'anger',.6);a.dissent=Math.min(1,(a.dissent||0)+.3);}remember(f.sov,'민심이 흉흉해짐');logEvent(`${f.name}에 분노의 불씨가 던져졌습니다.`,`=GOD.INCITE("${f.name}")`,'😠','#e5534b');}
  if(kind==='calm'){const ags=selKind==='sov'?[f.sov,...f.govs]:[ag];for(const a of ags)if(a){a.mood.anger*=.2;a.mood.sorrow*=.3;a.dissent=(a.dissent||0)*.2;feel(a,'joy',.2);}logEvent(`${f.name}의 마음에 평온이 깃들었습니다.`,`=GOD.CALM("${f.name}")`,'🕊','#62b56a');}
  renderMind();
}
// 사이드 탭
document.querySelectorAll('#side .stab div').forEach(d=>d.addEventListener('click',()=>switchSide(d.dataset.p)));
function switchSide(p){
  sideTab=p;
  document.querySelectorAll('#side .stab div').forEach(d=>d.classList.toggle('on',d.dataset.p===p));
  document.querySelectorAll('#side .pane').forEach(pn=>pn.classList.toggle('on',pn.id===p));
  if(p==='chron')renderChron();if(p==='powers')renderPowers();if(p==='mind')renderMind();
  document.getElementById('side').classList.add('open');
}
// 하단 탭 = 사이드 동기화
document.querySelectorAll('#tabs div').forEach((d,i)=>d.addEventListener('click',()=>{
  document.querySelectorAll('#tabs div').forEach(x=>x.classList.remove('on'));d.classList.add('on');
  if(i===1)switchSide('chron');else if(i===2)switchSide('powers');else switchSide('powers');
}));
// 모바일 사이드 토글
document.getElementById('sidebtn').addEventListener('click',()=>document.getElementById('side').classList.toggle('open'));

/* ---------- 격변 배너 ---------- */
function showCata(now){
  const C=CLIMATES[now];const el=document.getElementById('cata');
  const sub={fertile:'대지가 풍요로워진다',warm:'온화한 계절',drought:'강이 마르고 들이 탄다',cold:'서리가 대지를 덮는다',flood:'물이 차오른다',ashen:'하늘이 잿빛으로 닫힌다'}[now];
  el.innerHTML=`${C.ico} ${C.name}<small>${sub}</small>`;el.style.background=hexA(C.hue,.9);
  el.classList.add('show');clearTimeout(showCata._t);showCata._t=setTimeout(()=>el.classList.remove('show'),2600);
}

/* ---------- 속도/일시정지 ---------- */
let timer=null, period=120, paused=false;
function startTimer(){if(timer)clearInterval(timer);if(!paused)timer=setInterval(tick,period);}
document.getElementById('btn-pause').addEventListener('click',()=>{
  paused=!paused;document.getElementById('btn-pause').textContent=paused?'▶ 재생':'⏸ 일시정지';
  if(paused){clearInterval(timer);timer=null;}else startTimer();
});
document.getElementById('btn-speed').addEventListener('click',()=>{
  const order=[[200,'▶ 느림'],[120,'▶▶ 보통'],[55,'▶▶▶ 빠름']];
  let idx=order.findIndex(o=>o[0]===period);idx=(idx+1)%order.length;period=order[idx][0];
  document.getElementById('btn-speed').textContent=order[idx][1];if(!paused)startTimer();
});

/* ---------- 부팅 ---------- */
function boot(){
  genTerrain(); buildGrid(); genCells();
  for(let i=0;i<N;i++)paint(i);
  clim='warm';climT=Math.floor(rnd(60,110));
  document.getElementById('climico').textContent=CLIMATES.warm.ico;
  document.getElementById('climname').textContent=CLIMATES.warm.name;
  fmla.textContent=`=SIM.GENESIS($A$1:$${colName(COLS-1)}$${ROWS}, climate="온난기", "역사는 매번 새로 쓰인다")`;
  factions=[];obituaries.length=0;chronicle.length=0;nameIdx=0;year=1;
  // 시작 세력: 서로 가까운 비옥 지대에 클러스터로 — 일찍 국경이 맞닿아 전쟁/동맹이 창발
  const seeds=clusterSeeds(3);
  for(const s of seeds) spawnFaction(true, s);
  while(factions.length<3) spawnFaction(true); // 폴백
  renderPowers();
  startTimer();
}
// 리사이즈 → 격자만 다시(역사 유지 위해 부팅은 안 함; 첫 페인트 보장용 디바운스)
let rzT=null;
addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{
  const o=calcGrid();
  if(o.cols!==COLS||o.rows!==ROWS){ // 크게 바뀌면 재생성(세계 리셋) — 데스크↔모바일 전환 대비
    const wasPaused=paused; clearInterval(timer);timer=null;
    boot(); paused=wasPaused; if(!paused)startTimer(); else {document.getElementById('btn-pause').textContent='▶ 재생';}
  }
},250);});

boot();
})();
</script>
