<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문명.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:none}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:14px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;flex:none;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  #fbar{min-height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px;flex:none}
  #namebox{width:66px;flex:none;align-self:stretch;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;font-weight:600}
  #fx{width:28px;flex:none;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif}
  #formula{flex:1;padding:4px 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;line-height:1.35;overflow:hidden}
  #formula .fn{color:#107c41;font-weight:700}
  #formula .arg{color:#1a56db}
  #formula .em{color:#b45309}
  #main{flex:1;position:relative;overflow:hidden;background:#fff}
  /* ---- Sheet1 (지도) ---- */
  #sheetwrap{position:absolute;inset:0;overflow:auto;background:#fff}
  #sheet{display:grid;background:#fff;width:max-content}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:11px;position:sticky}
  .hd.ch{top:0;z-index:3}
  .hd.rh{left:0;z-index:2}
  .hd.corner{top:0;left:0;z-index:4}
  .cell{border-right:1px solid #e6e6e6;border-bottom:1px solid #e6e6e6;
    display:flex;align-items:center;justify-content:center;font-size:11px;
    overflow:hidden;cursor:cell;position:relative}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:2}
  .cap{position:absolute;right:1px;top:0;font-size:8px;line-height:8px;color:#000;opacity:.55}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 99px rgba(255,40,40,.0)}50%{box-shadow:inset 0 0 0 99px rgba(255,40,40,.5)}}
  .war{animation:warf .3s 3}
  @keyframes betf{0%,100%{box-shadow:inset 0 0 0 99px rgba(150,0,200,0)}50%{box-shadow:inset 0 0 0 99px rgba(150,0,200,.55)}}
  .bet{animation:betf .45s 4}
  /* ---- 연대기 / 멸망기록 sheets ---- */
  .docsheet{position:absolute;inset:0;overflow:auto;background:#fff;display:none;padding:0}
  table.doc{border-collapse:collapse;font-size:11.5px;width:100%}
  table.doc th{background:#107c41;color:#eaf6ee;font-weight:600;padding:4px 10px;text-align:left;
    position:sticky;top:0;border:1px solid #0c633a;white-space:nowrap}
  table.doc td{border:1px solid #e3e3e3;padding:3px 10px;vertical-align:top}
  table.doc tr:nth-child(even) td{background:#f7faf8}
  td.yr{color:#107c41;font-weight:600;width:78px;font-family:Consolas,monospace}
  td.fm{font-family:Consolas,monospace;color:#555;font-size:10.5px}
  .tag{display:inline-block;font-size:9.5px;padding:0 5px;border-radius:7px;margin-right:5px;color:#fff;vertical-align:1px}
  /* ---- legend / inspector ---- */
  #legend{position:absolute;top:8px;right:14px;background:#fffce6;border:1px solid #d8c66a;
    box-shadow:2px 3px 10px rgba(0,0,0,.18);padding:8px 11px;font-size:11px;z-index:6;
    width:212px;line-height:1.55;max-height:calc(100% - 20px);overflow:auto}
  #legend .sw{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:2px}
  #legend .dead{color:#999;font-size:10.5px}
  #legend h4{margin:6px 0 3px;font-size:11px;color:#7a6a1f;border-bottom:1px dashed #d8c66a;padding-bottom:2px}
  #legend h4:first-child{margin-top:0}
  .frow{display:flex;align-items:center;gap:4px}
  .frow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow .mood{font-size:10px}
  .bar{height:4px;border-radius:2px;background:#e6deb0;margin:1px 0 3px;overflow:hidden}
  .bar i{display:block;height:100%}
  #inspector{position:absolute;left:10px;bottom:10px;background:#fff;border:1px solid #b9b9b9;
    box-shadow:2px 3px 12px rgba(0,0,0,.22);padding:9px 12px;font-size:11px;z-index:7;
    width:268px;display:none;line-height:1.5}
  #inspector h3{margin:0 0 4px;font-size:12px;display:flex;align-items:center;gap:6px}
  #inspector .k{color:#888}
  #inspector .moodbig{font-size:14px}
  #inspector .close{position:absolute;right:7px;top:5px;cursor:pointer;color:#aaa;font-size:13px}
  .emo{display:inline-block;width:42px}
  /* ---- status / tabs ---- */
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:24px;
    border-top:1px solid #d4d4d4;font-size:11.5px;flex:none}
  #tabs div{padding:3px 12px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 10px;font-size:11px;flex:none;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 8px;opacity:.5}
  #statusbar .ev{overflow:hidden;text-overflow:ellipsis;flex:1}
  #ctrl{margin-left:auto;display:flex;gap:6px;align-items:center;padding-left:8px}
  #ctrl button{background:#0c633a;color:#eaf6ee;border:1px solid #0a5230;border-radius:3px;
    font-size:10.5px;padding:1px 8px;cursor:pointer}
  #ctrl button:hover{background:#0a5230}
  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;background:rgba(16,124,65,.92);
    color:#fff;padding:5px 12px;border-radius:14px;font-size:11px;z-index:8;opacity:0;transition:opacity .4s}
  @media (max-width:620px){
    #legend{width:160px;font-size:10px;top:4px;right:6px}
    #inspector{width:210px;font-size:10px}
    #menubar{gap:9px}
    #namebox{width:54px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <span>문명.xlsx · 학습하는 문명들 — Excel</span>
  </div>
  <div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
  <div id="fbar">
    <div id="namebox">A1</div>
    <div id="fx">fx</div>
    <div id="formula"></div>
  </div>
  <div id="main">
    <div id="sheetwrap"><div id="sheet"></div></div>
    <div id="doc-chron" class="docsheet"></div>
    <div id="doc-dead" class="docsheet"></div>
    <div id="legend"></div>
    <div id="inspector"><span class="close" onclick="document.getElementById('inspector').style.display='none'">✕</span><div id="insp-body"></div></div>
    <div id="hint"></div>
  </div>
  <div id="tabs">
    <div class="on" data-sheet="map">Sheet1</div>
    <div data-sheet="chron">연대기</div>
    <div data-sheet="dead" id="tab-dead">멸망기록 (0)</div>
  </div>
  <div id="statusbar">
    <span>준비</span>
    <span class="ev" id="ev">천지가 창조되었습니다.</span>
    <span id="ctrl">
      <button id="btn-speed">속도 ×1</button>
      <button id="btn-pause">일시정지</button>
    </span>
  </div>
</div>

<script>
"use strict";
(() => {
/* ============================================================
   문명.xlsx — 학습하는 AI 에이전트 문명 시뮬레이션
   엑셀 위장 / 셀=지도 / 수식바=에이전트 추론 로그
   ------------------------------------------------------------
   설계 핵심 (레퍼런스의 규칙-틱을 자율 에이전트로 대체):
   - 세력마다 Leader 에이전트(성격 5축) + Governor 하위 에이전트들.
   - 각 에이전트는 목표/성격/기억/감정을 갖고 효용을 '판단'해 행동 선택.
   - 감정(희노애락)은 사건 결과에서 동적으로 생겨 효용 가중치를 바꿈.
   - 경험으로 학습: 행동별 성공/실패를 기억해 정책 가중치를 강화/약화.
   - 지휘체계: Leader가 지령 → Governor가 충성/성격/감정으로 해석·복종·항명·배신(분립).
   - 결과는 정해져 있지 않다. 매 실행마다 다른 역사가 창발한다.
   ============================================================ */

const $ = id => document.getElementById(id);
const sheetEl = $('sheet'), fmla = $('formula'), namebox = $('namebox'),
      evEl = $('ev'), legend = $('legend'), insp = $('inspector'), inspBody = $('insp-body');

/* ---------- 그리드 규모 (반응형) ---------- */
const CW = 30, CH = 21;
const COLS = Math.max(16, Math.min(44, Math.floor((window.innerWidth  - 46) / CW)));
const ROWS = Math.max(12, Math.min(30, Math.floor((window.innerHeight - 172) / CH)));
const N = COLS * ROWS;

sheetEl.style.gridTemplateColumns = `40px repeat(${COLS}, ${CW}px)`;
sheetEl.style.gridAutoRows = CH + 'px';

const colName = n => { let s=''; n++; while(n>0){const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0;} return s; };
const ref = i => colName(i%COLS) + (Math.floor(i/COLS)+1);
const rnd = a => a[Math.random()*a.length|0];
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const cap = (v,a=0,b=1)=>clamp(v,a,b);

/* ---------- 시트 DOM ---------- */
const cellEls = new Array(N);
{
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd corner'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd ch';h.textContent=colName(c);frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd rh';h.textContent=r+1;frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d;frag.appendChild(d);
    }
  }
  sheetEl.appendChild(frag);
}

/* ---------- 지형 (값 노이즈) ---------- */
const GW=9, GH=6, gz=[];
for(let i=0;i<GW*GH;i++) gz[i]=Math.random();
function noise(x,y){
  const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1), x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=gz[y0*GW+x0], b=gz[y0*GW+Math.min(GW-1,x0+1)],
        c=gz[Math.min(GH-1,y0+1)*GW+x0], d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}
const nbrs = i => {
  const x=i%COLS, y=i/COLS|0, o=[];
  if(x>0)o.push(i-1); if(x<COLS-1)o.push(i+1);
  if(y>0)o.push(i-COLS); if(y<ROWS-1)o.push(i+COLS);
  return o;
};

/* cell: st(water/forest/land/ruin), owner(faction id), gov(governor id), level, fert(비옥도), hist[] */
const cells = new Array(N);
for(let i=0;i<N;i++){
  const x=i%COLS, y=i/COLS|0, v=noise(x,y)+(Math.random()-.5)*.14;
  let st='land', hist=['황무지'];
  if(v<.26){st='water';hist=['바다'];}
  else if(v>.68 && Math.random()<.55){st='forest';hist=['숲'];}
  cells[i]={st,owner:null,gov:null,level:0,fert:cap(.4+v*.6+Math.random()*.2),hist,ruinT:0};
}

/* ============================================================
   에이전트 모델
   - personality: 0..1 다섯 축
       aggr 호전성 / greed 탐욕 / caution 신중함 / ambition 야망 / innov 혁신성
   - mood: 희(joy) 노(anger) 애(sorrow) 락(pleasure), 각 -1..1 (락=만족/평온)
   - policy: 행동별 학습 가중치(경험으로 강화/약화) — '나의 변주'의 핵심
   - memory: 최근 사건 기록(추론·회고에 사용)
   ============================================================ */
const ACTIONS = ['expand','develop','attack','fortify','migrate','revolt'];
const ACT_KR = {expand:'개척',develop:'발전',attack:'정복',fortify:'수성',migrate:'이주',revolt:'반란'};

let mkMoodNeutral = () => ({joy:0,anger:0,sorrow:0,pleasure:.1});

function newPersona(){
  const p = {
    aggr: Math.random(), greed: Math.random(), caution: Math.random(),
    ambition: Math.random(), innov: Math.random()
  };
  return p;
}
// 성격 → 초기 정책 가중치 (학습의 출발점)
function seedPolicy(p){
  return {
    expand:  .6 + p.greed*.8 + p.innov*.3,
    develop: .6 + (1-p.aggr)*.6 + p.caution*.5,
    attack:  .3 + p.aggr*1.1 + p.ambition*.4,
    fortify: .3 + p.caution*1.0,
    migrate: .15 + p.innov*.5,
    revolt:  .05 + p.ambition*.6
  };
}

const PTRAITS = [['aggr','호전'],['greed','탐욕'],['caution','신중'],['ambition','야망'],['innov','혁신']];
function personaWord(p){
  let best=PTRAITS[0], bv=p[PTRAITS[0][0]];
  for(const t of PTRAITS) if(p[t[0]]>bv){bv=p[t[0]];best=t;}
  const lvl = bv>.72?'매우 ':bv>.5?'':'다소 ';
  return lvl+best[1]+'적';
}

/* 감정 → 한 글자/이모지 */
function moodEmoji(m){
  const arr=[['joy',m.joy,'😀'],['anger',m.anger,'😡'],['sorrow',m.sorrow,'😢'],['pleasure',m.pleasure,'😌']];
  arr.sort((a,b)=>b[1]-a[1]);
  if(arr[0][1]<.12) return '😐';
  return arr[0][2];
}
function moodWord(m){
  const arr=[['joy',m.joy,'기쁨'],['anger',m.anger,'분노'],['sorrow',m.sorrow,'슬픔'],['pleasure',m.pleasure,'즐거움']];
  arr.sort((a,b)=>b[1]-a[1]);
  if(arr[0][1]<.12) return '평정';
  const lvl = arr[0][1]>.6?'격렬한 ':arr[0][1]>.32?'':'옅은 ';
  return lvl+arr[0][2];
}
function nudge(m, k, amt){ m[k]=clamp(m[k]+amt,-1,1); }
function moodDecay(m){
  for(const k in m){ if(k==='pleasure') m[k]+= (.06-m[k])*.04; else m[k]*=.965; }
}

/* ============================================================
   세력 / 지휘체계
   - faction: leader persona/mood, governors[], territory
   - governor: persona, mood, loyalty(0..1), grievance(누적 불만), ownCells
   - 지령(directive): leader가 정함 → governor가 따를지 결정
   ============================================================ */
const NAMES = ['북부 왕국','붉은 제국','해안 연맹','유목 칸국','삼나무 공화국','잿빛 교단','동방 상단','검은 강 부족','여명 왕조','소금 사막 민족','서리늑대 부족','황금 술탄국','수정 도시국','심연 교단','초원 기마국'];
const SURN = ['카엘','모르','벨','타이','오르','센','드라','노바','하르','유엔','자카','린','퀘른','솔','베가'];
const TITLES = ['총독','대공','장군','태수','경','성주'];
const COLORS = ['#2563eb','#dc2626','#059669','#7c3aed','#d97706','#0d9488','#be185d','#4d7c0f','#9333ea','#b45309','#0891b2','#ca8a04','#7e22ce','#15803d','#b91c1c'];

let nameIdx=0, govSeq=0, facSeq=0;
let factions=[];
const obituaries=[];               // {name,year,cause}
const chronicle=[];                // {year, kind, html, formula}
let year=1, lastEvent='천지가 창조되었습니다.', pop=0;
const dirty=new Set();
let selected=-1;

const plague=new Map(), fires=new Map();

function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}
function facById(id){return factions.find(f=>f.id===id);}

function newGovernor(fac, persona){
  return {
    id:'g'+(govSeq++),
    name: rnd(SURN)+' '+rnd(TITLES),
    persona: persona||newPersona(),
    mood: mkMoodNeutral(),
    policy: null,            // seeded below
    loyalty: cap(.45+Math.random()*.5),
    grievance: 0,
    cells: [],
    wins:0, losses:0,
    lastAct:'대기',
    memory:[]
  };
}
function rememberG(g, txt){ g.memory.unshift('서기 '+year+'년: '+txt); if(g.memory.length>6)g.memory.pop(); }

function spawnFaction(announce, fromCells){
  if(nameIdx>=NAMES.length) nameIdx=0;
  const persona=newPersona();
  const f={
    id:facSeq++, name:NAMES[nameIdx], color:COLORS[nameIdx%COLORS.length],
    leader:{ name:rnd(SURN)+' 1세', persona, mood:mkMoodNeutral(), memory:[] },
    governors:[], directive:'개척', directiveAge:0, golden:0, size:0, born:year, allies:new Set()
  };
  nameIdx++;
  // 초대 총독
  const g0=newGovernor(f, newPersona()); g0.policy=seedPolicy(g0.persona); g0.loyalty=cap(.65+Math.random()*.3);
  f.governors.push(g0);

  if(fromCells){ // 분립(반란)으로 생성
    for(const i of fromCells){ cells[i].owner=f.id; cells[i].gov=g0.id; g0.cells.push(i); dirty.add(i); }
    factions.push(f);
    return f;
  }
  for(let t=0;t<400;t++){
    const i=Math.random()*N|0;
    if(cells[i].st==='land' && cells[i].owner===null){
      setCell(i,f.id,g0.id,1,'개척지'); g0.cells.push(i);
      factions.push(f);
      if(announce) log('birth', `${f.name}이(가) ${ref(i)}에서 발흥했다. 시조 ${f.leader.name} — ${personaWord(persona)} 기질.`,
        `SPAWN("${f.name}", ${ref(i)}, persona="${personaWord(persona)}")`);
      return f;
    }
  }
  return null;
}

function setCell(i, owner, gov, level, label){
  const c=cells[i]; c.owner=owner; c.gov=gov; c.level=level; c.st='land';
  if(label){c.hist.push(label); if(c.hist.length>8)c.hist.shift();}
  dirty.add(i);
}

const LV_TXT=['','·','田','村','都'], LV_LABEL=['','개척지','농장','마을','도시'];

function paint(i){
  const c=cells[i], el=cellEls[i];
  let bg='',tx='',col='#222',w='',capTx='';
  if(plague.has(i)){bg='#ead5f5';tx='疫';col='#7030a0';w='700';}
  else if(fires.has(i)){bg='#ffd9b3';tx='火';col='#c00000';w='700';}
  else if(c.st==='water'){bg='#ddebf7';tx='≈';col='#9dc3e6';}
  else if(c.st==='forest'){bg='#e2efda';tx='木';col='#6aa544';}
  else if(c.st==='ruin'){bg='#ededed';tx='墟';col='#999';}
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      bg=hexA(f.color,.14+c.level*.18); tx=LV_TXT[c.level]; col=f.color; w=c.level>=3?'700':'';
      // 수도(가장 높은 레벨의 한 칸) 표식은 생략, 대신 충성 낮은 총독 영지에 점 표시
      const g=f.governors.find(g=>g.id===c.gov);
      if(g && g.loyalty<.3) capTx='!';
    }
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  el.textContent=tx;
  if(capTx){ el.insertAdjacentHTML('beforeend', `<span class="cap">${capTx}</span>`); }
}

/* ---------- 수식바 / 로그 ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmlaHTML(fnLine){
  // 안전한 색칠: 먼저 escape → 토큰 단위로 span을 입힌다 (중첩 치환 금지)
  let s = esc(fnLine);
  // 1) 선두 함수명
  s = s.replace(/^([A-Z][A-Z0-9._]*)/, 'FN$1');
  // 2) 따옴표 문자열
  s = s.replace(/"([^"]*)"/g, '"AR$1"');
  // 3) key= 강조
  s = s.replace(/\b(persona|mood|loyalty|util|policy|grievance|att|def|order|target|against|new|from|cause|type|fert|model)=/g, 'EM$1=');
  s = s.replace(/FN/g,'<span class="fn">').replace(/AR/g,'<span class="arg">')
       .replace(/EM/g,'<span class="em">').replace(//g,'</span>');
  return '=' + s;
}
let evCooldownClass={};
function log(kind, msg, formula){
  lastEvent = `서기 ${year}년 · ${msg}`;
  evEl.textContent = lastEvent;
  if(formula) fmla.innerHTML = fmlaHTML(formula);
  chronicle.unshift({year, kind, html:msg, formula:formula||''});
  if(chronicle.length>400) chronicle.pop();
  if(activeSheet==='chron') renderChron();
}

function flash(i, cls){ const el=cellEls[i]; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls), cls==='war'?1000:1900); }

/* ============================================================
   에이전트 의사결정 (규칙이 아니라 효용 + 감정 + 학습)
   ============================================================ */
function globalStrongest(){
  let s=null; for(const f of factions) if(!s||f.size>s.size) s=f; return s;
}

// 리더가 세력 차원의 지령을 '판단'해서 정한다
const DIRECTIVES=['개척','정복','발전','수성','이주'];
function leaderDecide(f){
  const p=f.leader.persona, m=f.leader.mood;
  const strongest=globalStrongest();
  const threatened = strongest && strongest.id!==f.id && strongest.size > f.size*1.7;
  const sc={
    개척:  f.policyBias_expand=( .5 + p.greed*.7 + (f.size<6?.6:0) ),
    정복:  .2 + p.aggr*1.1 + m.anger*.6 + (f.golden?.4:0) - (threatened?.2:0),
    발전:  .4 + (1-p.aggr)*.6 + p.caution*.5 + m.pleasure*.3,
    수성:  .2 + p.caution*.9 + (threatened?.8:0) + m.sorrow*.5,
    이주:  .05 + p.innov*.5 + (f.size<3?.5:0)
  };
  // softmax 선택 (대본 없음)
  let best='발전', bv=-1e9;
  for(const k in sc){ const v=sc[k]+(Math.random()-.5)*.4; if(v>bv){bv=v;best=k;} }
  const changed = f.directive!==best;
  f.directive=best; f.directiveAge=0;
  if(changed && f.size>2 && Math.random()<.5){
    const tgt = best==='정복'&&strongest&&strongest.id!==f.id ? strongest.name : '';
    log('order', `${f.name}의 ${f.leader.name}이(가) 「${best}」 지령을 내렸다.${tgt?` 표적: ${tgt}.`:''}`,
      `DIRECTIVE("${f.name}", order="${best}", mood="${moodWord(m)}"${tgt?`, target="${tgt}"`:''})`);
  }
}

// 총독 영지의 변경(frontier) 구성 분석 → 결정의 핵심 입력
function frontierScan(f,g){
  let empty=0, enemy=0, water=0, total=0, underAttack=0;
  for(const src of g.cells){
    for(const n of nbrs(src)){
      const c=cells[n]; total++;
      if(c.st==='water') water++;
      else if(c.owner===null) empty++;
      else if(c.owner!==f.id && !f.allies.has(c.owner)) enemy++;
      if(fires.has(n)) underAttack++;
    }
  }
  total=total||1;
  return {emptyR:empty/total, enemyR:enemy/total, hasEmpty:empty>0, hasEnemy:enemy>0, underAttack};
}

// 총독이 지령을 자기 성격·감정·충성으로 '해석'한다 → 실제 행동 효용
function governorChooseAction(f, g){
  const p=g.persona, m=g.mood, pol=g.policy;
  const directive=f.directive;
  const fr=frontierScan(f,g);
  g._fr=fr;
  // 기본 효용 = 학습된 정책 가중치
  const u={};
  for(const a of ACTIONS) u[a]=pol[a];
  // === 지형/희소성이 행동을 강하게 끈다 (땅이 있으면 개척, 막히면 정복) ===
  u.expand  += fr.emptyR*2.2;                  // 빈 땅이 있으면 개척이 끌린다
  u.attack  += fr.enemyR*(1.4+p.aggr*1.6) + (!fr.hasEmpty && fr.hasEnemy ? 1.3 : 0);  // 막히면 정복
  u.fortify += fr.underAttack*1.4 + p.caution*.4;   // 실제 공격받을 때만 수성
  u.develop += (1-fr.emptyR-fr.enemyR)*0.8;    // 내륙은 발전
  // === 감정이 효용을 흔든다 (희노애락이 행동을 바꾼다) ===
  u.attack  += m.anger*1.5 + (f.golden?.6:0) - m.sorrow*.3;
  u.fortify += m.sorrow*.7;
  u.expand  += m.pleasure*.4 + m.joy*.3;
  u.develop += m.pleasure*.6 - m.anger*.4;
  u.migrate += (g.cells.length<=1?.9:0) + (!fr.hasEmpty && !fr.hasEnemy?.6:0) - m.joy*.3;
  // 충성에 따라 지령에 가중 (복종) — 충성 낮으면 무시
  const obey = g.loyalty;                          // 0..1
  const bias = {개척:'expand',정복:'attack',발전:'develop',수성:'fortify',이주:'migrate'}[directive];
  if(bias) u[bias] += obey*1.1;                    // 지령 따름 정도
  // 야망 큰 총독은 영지가 커질수록 독립 욕구가 자라난다 (승자도 배신한다 — 분봉의 역설)
  const ambitionPressure = p.ambition * cap(g.cells.length/10,0,1) * (1-obey);
  // 불만/야망이 높고 충성이 낮으면 '반란' 효용 급등
  u.revolt += g.grievance*1.4 + p.ambition*(1-obey)*1.3 + ambitionPressure*1.2 + m.anger*.5 - obey*1.1;
  if(g.cells.length<3) u.revolt = -2;              // 영지 너무 작으면 분립 불가
  if(f.governors.length<2) u.revolt -= .8;         // 유일 총독은 곧 자기 나라 — 분립 의미 약화

  // softmax-ish 선택
  let best='develop', bv=-1e9; const noise=.5;
  for(const a of ACTIONS){ const v=u[a]+(Math.random()-.5)*noise; if(v>bv){bv=v;best=a;} }
  g._lastUtil=u; g._chosen=best;
  return best;
}

/* 학습: 행동 결과로 정책 가중치를 강화/약화 + 감정 갱신 */
function learn(g, action, success, mag=1){
  const lr=.06;
  const target = success? 1 : -1;
  g.policy[action] = clamp(g.policy[action] + lr*target*mag, .03, 3);
  if(success){ g.wins++; nudge(g.mood,'joy',.28*mag); nudge(g.mood,'pleasure',.12*mag); nudge(g.mood,'anger',-.1); nudge(g.mood,'sorrow',-.12); }
  else { g.losses++; nudge(g.mood,'anger',.22*mag); nudge(g.mood,'sorrow',.18*mag); nudge(g.mood,'pleasure',-.16*mag); g.grievance=cap(g.grievance+.05*mag,0,1.5); }
}

/* ============================================================
   틱 — 매 프레임 각 에이전트가 스스로 판단·행동
   ============================================================ */
let tickN=0, logCooldown=0;

function recount(){
  for(const f of factions){ f.size=0; for(const g of f.governors) g.cells.length=0; }
  pop=0;
  const PW=[0,40,160,520,1400];
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin' && --c.ruinT<=0){ c.st='land'; dirty.add(i); }
    if(c.owner!==null){
      const f=facById(c.owner);
      if(!f){ c.owner=null;c.gov=null;c.level=0;dirty.add(i); continue; }
      f.size++; pop+=PW[c.level];
      let g=f.governors.find(g=>g.id===c.gov);
      if(!g){ g=f.governors[0]; c.gov=g?g.id:null; }
      if(g) g.cells.push(i);
    }
  }
}

function checkCollapse(){
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      let cause = f._lastCause || '내부 붕괴';
      obituaries.push({name:f.name,year,cause});
      log('death', `${f.name}이(가) 역사에서 사라졌다. (${cause})`, `COLLAPSE("${f.name}", year=${year}, cause="${cause}")`);
      // 동맹 정리
      for(const o of factions) o.allies.delete(f.id);
      factions.splice(k,1);
      $('tab-dead').textContent = `멸망기록 (${obituaries.length})`;
      if(activeSheet==='dead') renderDead();
    } else {
      // 빈 총독 정리
      f.governors = f.governors.filter(g=>g.cells.length>0 || f.governors.length===1);
    }
  }
}

function doFires(){
  for(const [i,t] of [...fires]){
    if(Math.random()<.12) for(const n of nbrs(i)){ const c=cells[n]; if(c.owner!==null && !fires.has(n) && c.st==='land'){ fires.set(n,5); dirty.add(n);} }
    if(t<=1){ fires.delete(i); const c=cells[i]; c.owner=null;c.gov=null;c.level=0;c.st='ruin';c.ruinT=180; c.hist.push('잿더미'); if(c.hist.length>8)c.hist.shift(); dirty.add(i); }
    else fires.set(i,t-1);
  }
}
function doPlague(){
  if(!plague.size) return;
  for(const [i,t] of [...plague]){
    if(Math.random()<.16) for(const n of nbrs(i)){ if(cells[n].owner!==null && !plague.has(n)){ plague.set(n,11); dirty.add(n);} }
    if(Math.random()<.22){ const c=cells[i]; c.level--; if(c.level<=0){ c.owner=null;c.gov=null;c.level=0; c.hist.push('역병으로 소멸'); if(c.hist.length>8)c.hist.shift(); } dirty.add(i); }
    if(t<=1){ plague.delete(i); dirty.add(i);} else plague.set(i,t-1);
  }
  if(plague.size===0) log('event','역병이 물러갔다.','PLAGUE.END()');
}

function neighborOwners(i, facId){
  const set=new Set();
  for(const n of nbrs(i)){ const c=cells[n]; if(c.owner!==null && c.owner!==facId) set.add(c.owner); }
  return set;
}

function agentTick(){
  tickN++; year++;
  if(logCooldown>0) logCooldown--;
  recount();
  checkCollapse();
  doFires(); doPlague();

  for(const f of factions){
    if(f.golden>0) f.golden--;
    if(f.size===0) continue;
    f.directiveAge++;
    // 리더 감정 = 총독 감정 가중평균 + 사건
    moodDecay(f.leader.mood);
    if(f.directiveAge>50 || Math.random()<.02) leaderDecide(f);

    const big = f.size>26;                  // 과대 제국 = 통치 부담
    for(const g of f.governors){
      if(g.cells.length===0) continue;
      moodDecay(g.mood);
      g.grievance=cap(g.grievance-.003,0,1.5);

      const action = governorChooseAction(f, g);
      g.lastAct = ACT_KR[action];

      // --- 충성/불만 동역학 (전쟁 없이도 정치가 흐르도록) ---
      // 1) 지령 마찰: 총독이 원하는 행동과 리더 지령이 어긋나면 불만이 쌓인다
      const wantBias={expand:'개척',attack:'정복',develop:'발전',fortify:'수성',migrate:'이주'}[action];
      if(wantBias && wantBias!==f.directive) g.grievance=cap(g.grievance + g.persona.ambition*.012, 0, 1.5);
      // 2) 분봉의 역설: 야망 큰 대(大)총독은 영지가 커질수록 독립을 꿈꾼다 (성공해도 배신)
      if(g.cells.length>=6) g.grievance=cap(g.grievance + g.persona.ambition*.010*cap(g.cells.length/12,0,1.4),0,1.5);
      // 3) 과대 제국 통치 부담: 변경 총독의 충성이 옅게 갉인다
      const strain = big ? .004*cap(g.cells.length/14,0,1) : 0;
      // 4) 황금기 끝물 — 풍요 뒤 야심가의 분열 욕구
      const goldenAmbition = (f.golden>0 && f.golden<25) ? g.persona.ambition*.006 : 0;
      g.grievance=cap(g.grievance+goldenAmbition,0,1.5);
      g.loyalty = cap(g.loyalty + (g.mood.joy*.008) - (g.mood.anger*.014) - g.persona.ambition*.0022 - g.grievance*.010 - strain, 0, 1);

      if(action==='revolt'){ tryRevolt(f,g); continue; }
      if(action==='migrate'){ doMigrate(f,g); continue; }

      // 행동 강도는 영지 크기에 비례 (개척은 더 빠르게 → 지도가 차고 충돌이 일어남)
      const repBase = action==='expand' ? .2 : .12;
      const reps = 1 + (g.cells.length*repBase|0);
      for(let a=0;a<reps;a++){
        if(g.cells.length===0) break;
        const src = rnd(g.cells);
        if(cells[src].owner!==f.id){ continue; }
        if(action==='expand') actExpand(f,g,src);
        else if(action==='attack') actAttack(f,g,src);
        else if(action==='develop') actDevelop(f,g,src);
        else if(action==='fortify') actFortify(f,g,src);
      }
    }
    // 동맹 결정 (약자끼리, 강자에 맞서)
    maybeAlly(f);
  }

  // 세계 사건
  worldEvents();

  // 그리기
  for(const i of dirty) paint(i);
  dirty.clear();
  renderStatus();
  if(tickN%6===0) renderLegend();
  // 형식 유지를 위해 가끔 추론 한 줄을 수식바에 흘려보낸다
  if(tickN%5===0 && !logCooldown){
    const f=rnd(factions); if(f){ const g=rnd(f.governors); if(g&&g._chosen){
      const u=g._lastUtil||{};
      fmla.innerHTML = fmlaHTML(`DECIDE("${g.name}", choose="${ACT_KR[g._chosen]||g._chosen}", util=${(u[g._chosen]||0).toFixed(2)}, mood="${moodWord(g.mood)}", loyalty=${g.loyalty.toFixed(2)})`);
    }}
  }
}

/* ---- 개별 행동 ---- */
function actExpand(f,g,src){
  const tgt=rnd(nbrs(src)); const tc=cells[tgt];
  if(tc.st==='water'||fires.has(tgt)||plague.has(tgt)) return;
  if(tc.owner===null){
    if(tc.st==='forest'){ if(Math.random()< .2+f.leader.persona.innov*.25){ tc.st='land'; tc.hist.push('개간'); setCell(tgt,f.id,g.id,1,'개척지'); g.cells.push(tgt); learn(g,'expand',true,.5);} }
    else if(tc.st==='land'){ setCell(tgt,f.id,g.id,1,'개척지'); g.cells.push(tgt); learn(g,'expand',true,.5); }
  } else if(tc.owner!==f.id){
    // 빈 땅이 없으면 호전성 따라 공격으로 전환
    if(Math.random()<f.leader.persona.aggr*.5) actAttack(f,g,src,tgt);
  }
}
function actDevelop(f,g,src){
  const c=cells[src];
  if(c.level<4){
    const pr = .07*(f.golden?2.4:1)*(c.fert*.6+.7)*(1+g.persona.innov*.4);
    if(Math.random()<pr){
      c.level++; c.hist.push(LV_LABEL[c.level]); if(c.hist.length>8)c.hist.shift(); dirty.add(src);
      learn(g,'develop',true,.4);
      if(c.level===4 && !logCooldown){
        log('build', `${f.name}의 ${g.name}이(가) ${ref(src)}에 대도시를 세웠다.`, `CITY("${f.name}", ${ref(src)}, gov="${g.name}")`);
        logCooldown=22;
      }
    }
  } else { learn(g,'fortify',true,.2); }
}
function actFortify(f,g,src){
  const c=cells[src];
  c.fort=(c.fort||0)+1;            // 추상적 방어 보너스 (전투에서 사용)
  if(c.fort>4)c.fort=4;
  learn(g,'fortify',true,.15);
}
// 총독 영지 전체에서 적 접경 칸을 찾는다
function findEnemyFront(f,g){
  const out=[];
  for(const src of g.cells){
    for(const n of nbrs(src)){
      const c=cells[n];
      if(c.owner!==null && c.owner!==f.id && c.st==='land' && !f.allies.has(c.owner)) out.push([src,n]);
    }
  }
  return out;
}
function actAttack(f,g,src,forcedTgt){
  let tgt=forcedTgt;
  if(tgt===undefined){
    const nb=nbrs(src).filter(n=>{const c=cells[n]; return c.owner!==null && c.owner!==f.id && c.st==='land' && !f.allies.has(c.owner);});
    if(nb.length) tgt=rnd(nb);
    else {
      // 인접 적이 없으면 영지 전체 접경에서 탐색; 그래도 없으면 적을 향해 개척(수렴)
      const front=findEnemyFront(f,g);
      if(front.length){ const pick=rnd(front); src=pick[0]; tgt=pick[1]; }
      else { actExpand(f,g,src); if(Math.random()<.4) g.grievance=cap(g.grievance+.02,0,1.5); return; }
    }
  }
  if(tgt===undefined) return;
  const tc=cells[tgt];
  if(tc.owner===null||tc.owner===f.id) return;
  const defF=facById(tc.owner);
  if(!defF) return;
  if(f.allies.has(defF.id)) return;        // 동맹은 안 친다
  flash(tgt,'war');
  const att = 1 + Math.random()*3 + f.size*.0025 + (f.golden?1.2:0) + g.mood.anger*1.0 + g.persona.aggr*.6;
  const def = tc.level + 1 + Math.random()*3 + (tc.fort||0)*.8;
  const defG = defF.governors.find(x=>x.id===tc.gov);
  if(att>def){
    if(Math.random()<.28){ fires.set(tgt,5); tc.hist.push('전화(戰火)'); if(tc.hist.length>8)tc.hist.shift(); dirty.add(tgt); }
    else { setCell(tgt,f.id,g.id,Math.max(1,tc.level-1),'점령됨'); g.cells.push(tgt); tc.fort=0; }
    learn(g,'attack',true,1);
    if(defG) learn(defG,'fortify',false,.8), defG._lastCause='침공';
    f._lastCause='정복 전쟁';
    if((tc.level>=3 || !logCooldown) && defF){
      log('war', `${f.name}이(가) ${defF.name}의 ${ref(tgt)}를 점령했다.`, `WAR("${f.name}"→"${defF.name}", ${ref(tgt)}, att=${att.toFixed(1)}, def=${def.toFixed(1)})`);
      logCooldown=18;
    }
  } else {
    learn(g,'attack',false,1);     // 패배 → 다음엔 정복을 덜 택하게 학습
    if(defG) learn(defG,'fortify',true,.4);
    rememberG(g, `${defF?defF.name:'적'}의 ${ref(tgt)} 공격 실패`);
  }
}
function doMigrate(f,g){
  // 영지 일부를 멀리 빈 땅으로 옮긴다 (개척 정신)
  const empties=[];
  for(let t=0;t<60;t++){ const i=Math.random()*N|0; if(cells[i].st==='land'&&cells[i].owner===null){empties.push(i);break;} }
  if(!empties.length){ learn(g,'migrate',false,.3); return; }
  const dst=empties[0];
  if(g.cells.length>1){ const give=g.cells.pop(); const c=cells[give]; c.owner=null;c.gov=null;c.level=0; c.hist.push('버려짐'); dirty.add(give); }
  setCell(dst,f.id,g.id,1,'이주 정착'); g.cells.push(dst); learn(g,'migrate',true,.5);
  if(!logCooldown){ log('event', `${f.name}의 ${g.name}이(가) ${ref(dst)}로 이주했다.`, `MIGRATE("${f.name}", to=${ref(dst)})`); logCooldown=20; }
}

/* ---- 반란 / 분립 (배신) ---- */
function tryRevolt(f,g){
  if(g.cells.length<2 || factions.length>11) { learn(g,'revolt',false,.3); return; }
  // 충성이 충분하면 항명에 그친다(지령 무시), 매우 낮으면 분립
  if(g.loyalty>.22 || Math.random()<.4){
    // 항명: 지령과 반대로 행동(여기선 발전으로) + 리더 분노
    nudge(f.leader.mood,'anger',.2);
    rememberG(g, `「${f.directive}」 지령에 항명`);
    if(!logCooldown){ log('order', `${f.name}의 ${g.name}이(가) 「${f.directive}」 지령에 항명했다.`, `DEFY("${g.name}", order="${f.directive}", loyalty=${g.loyalty.toFixed(2)})`); logCooldown=16; }
    g.grievance=cap(g.grievance-.2,0,1.5);
    return;
  }
  // 분립: 새 세력을 세운다
  const taken=[...g.cells];
  const nf=spawnFaction(false, taken);
  if(!nf) return;
  // 새 세력 리더 = 배신한 총독의 성격을 계승
  nf.leader.persona = {...g.persona};
  nf.leader.mood.joy=.5; nf.leader.mood.anger=.3;
  nf.name = '신(新) '+nf.name;
  // 원 세력에서 제거
  g.cells.length=0;
  f.governors = f.governors.filter(x=>x.id!==g.id);
  f._lastCause='반란·분열';
  nf._lastCause='—';
  for(const i of taken) flash(i,'bet');
  nudge(f.leader.mood,'anger',.7); nudge(f.leader.mood,'sorrow',.4);
  log('betray', `반역! ${f.name}의 ${g.name}이(가) ${taken.length}칸을 들고 분립해 「${nf.name}」을 세웠다.`,
    `BETRAY("${g.name}", from="${f.name}", new="${nf.name}", cells=${taken.length}, grievance=${g.grievance.toFixed(2)})`);
  logCooldown=10;
}

/* ---- 새 총독 임명 (영지가 커지면 위임) ---- */
function maybePromote(f){
  if(f.size>=8*f.governors.length && f.governors.length<5){
    // 가장 큰 총독의 영지 절반을 새 총독에게 위임
    let big=null; for(const g of f.governors) if(!big||g.cells.length>big.cells.length) big=g;
    if(big && big.cells.length>=4){
      const ng=newGovernor(f, newPersona()); ng.policy=seedPolicy(ng.persona);
      const half=big.cells.splice(0, big.cells.length>>1);
      for(const i of half){ cells[i].gov=ng.id; ng.cells.push(i); }
      f.governors.push(ng);
      if(!logCooldown){ log('order', `${f.name}이(가) ${ng.name}을(를) 새 총독으로 임명했다.`, `APPOINT("${f.name}", gov="${ng.name}", cells=${ng.cells.length})`); logCooldown=24; }
    }
  }
}

/* ---- 동맹 ---- */
function maybeAlly(f){
  if(Math.random()>.02) return;
  const strongest=globalStrongest();
  if(!strongest||strongest.id===f.id||strongest.size<f.size*1.5) return;
  // 강자가 아닌, 비슷한 약자와 동맹
  const cand=factions.filter(o=>o.id!==f.id && o.id!==strongest.id && !f.allies.has(o.id) && o.size<strongest.size);
  if(!cand.length) return;
  const o=rnd(cand);
  f.allies.add(o.id); o.allies.add(f.id);
  if(!logCooldown){ log('ally', `${f.name}과(와) ${o.name}이(가) ${strongest.name}에 맞서 동맹을 맺었다.`, `ALLY("${f.name}","${o.name}", against="${strongest.name}")`); logCooldown=20; }
}

/* ---- 세계 사건 ---- */
function worldEvents(){
  for(const f of factions) maybePromote(f);
  const r=Math.random();
  if(!plague.size && r<.004){
    const big=[]; for(let i=0;i<N;i++) if(cells[i].owner!==null && cells[i].level>=3) big.push(i);
    if(big.length){ const i=rnd(big); plague.set(i,11); dirty.add(i);
      const f=facById(cells[i].owner); if(f)f._lastCause='역병';
      log('event', `${ref(i)}에서 역병이 창궐했다.`, `PLAGUE(${ref(i)})`); }
  } else if(r>.996 && factions.length){
    const f=rnd(factions); f.golden=90; nudge(f.leader.mood,'joy',.6); nudge(f.leader.mood,'pleasure',.4);
    for(const g of f.governors){ nudge(g.mood,'joy',.4); nudge(g.mood,'pleasure',.3); }
    log('golden', `${f.name}의 황금기가 시작되었다.`, `GOLDEN_AGE("${f.name}", 90)`);
  } else if(r>.9935 && r<=.996){
    const towns=[]; for(let i=0;i<N;i++) if(cells[i].owner!==null && cells[i].level>=2) towns.push(i);
    if(towns.length){ const i=rnd(towns); fires.set(i,6); dirty.add(i);
      const f=facById(cells[i].owner); if(f)f._lastCause='대화재';
      log('event', `${ref(i)}에 대화재가 발생했다.`, `FIRE(${ref(i)})`); }
  }
  // 이민(외래 세력 도래)
  if(factions.length<3 && Math.random()<.012 && factions.length<7){
    const f=spawnFaction(false);
    if(f) log('birth', `바다 건너에서 ${f.name}이(가) 도래했다.`, `MIGRATE.IN("${f.name}")`);
  }
  if(factions.length===0 && Math.random()<.05){ spawnFaction(true); }
}

/* ============================================================
   렌더링 — 범례 / 상태바 / 시트 전환 / 인스펙터
   ============================================================ */
function renderStatus(){
  document.title = `문명.xlsx · 서기 ${year}년 — Excel`;
}
function moodBar(m){
  const e=['joy','anger','sorrow','pleasure'];
  const col={joy:'#16a34a',anger:'#dc2626',sorrow:'#2563eb',pleasure:'#d97706'};
  let h='<div class="bar" style="display:flex;background:#eee">';
  for(const k of e){ const w=Math.round(clamp(m[k],0,1)*25); h+=`<i style="width:${w}%;background:${col[k]}"></i>`; }
  return h+'</div>';
}
function renderLegend(){
  let h='<h4>세력 현황 — 학습하는 문명들</h4>';
  const sorted=[...factions].sort((a,b)=>b.size-a.size);
  if(!sorted.length) h+='<div class="dead">모든 문명이 소멸했다…</div>';
  for(const f of sorted){
    const lm=f.leader.mood;
    h+=`<div class="frow"><span class="sw" style="background:${f.color}"></span>`+
       `<span class="nm">${f.name}${f.golden?' ✦':''}${f.allies.size?' 🤝':''}</span>`+
       `<span class="mood">${moodEmoji(lm)}</span></div>`;
    h+=`<div style="font-size:10px;color:#7a6a1f;margin:0 0 1px 14px">영토 ${f.size} · 총독 ${f.governors.length} · 「${f.directive}」 · ${moodWord(lm)}</div>`;
  }
  if(obituaries.length){
    h+='<h4>멸망기록</h4>';
    for(const o of obituaries.slice(-4)) h+=`<div class="dead">† ${o.name} (서기 ${o.year}년, ${o.cause})</div>`;
  }
  h+='<h4>읽는 법</h4><div style="font-size:10px;color:#7a6a1f">셀=영토. 클릭하면 그 땅의 총독·감정·학습 정책·역사가 수식으로 표시됩니다. 「!」=충성 낮은 총독(반란 위험).</div>';
  legend.innerHTML=h;
}

/* 셀 클릭 → 인스펙터 + 수식바 */
sheetEl.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  if(selected>=0) cellEls[selected].classList.remove('sel');
  selected=+t.dataset.i; t.classList.add('sel');
  namebox.textContent=ref(selected);
  const c=cells[selected];
  inspectCell(selected, c);
});
function inspectCell(i,c){
  let h='';
  if(c.owner!==null){
    const f=facById(c.owner); const g=f&&f.governors.find(x=>x.id===c.gov);
    if(f){
      fmla.innerHTML = fmlaHTML(g
        ? `AGENT(${ref(i)}, faction="${f.name}", gov="${g.name}", persona="${personaWord(g.persona)}", mood="${moodWord(g.mood)}", loyalty=${g.loyalty.toFixed(2)})`
        : `TERRITORY(${ref(i)}, faction="${f.name}", level=${c.level})`);
      h+=`<h3><span class="sw" style="background:${f.color};display:inline-block;width:11px;height:11px;border-radius:2px"></span>${f.name} · ${ref(i)} <span class="moodbig">${g?moodEmoji(g.mood):''}</span></h3>`;
      h+=`<div><span class="k">셀:</span> ${LV_LABEL[c.level]||'영토'} (Lv ${c.level})${c.fort?` · 방어 ${c.fort}`:''} · 비옥도 ${(c.fert*100|0)}%</div>`;
      h+=`<div><span class="k">시조:</span> ${f.leader.name} · ${personaWord(f.leader.persona)} · 현 지령 「${f.directive}」</div>`;
      if(g){
        h+=`<div style="margin-top:4px"><b>${g.name}</b> <span class="k">— ${personaWord(g.persona)}</span></div>`;
        h+=`<div><span class="k">감정:</span> ${moodWord(g.mood)}</div>`+moodBar(g.mood);
        h+=`<div><span class="k">충성:</span> ${(g.loyalty*100|0)}% · <span class="k">불만:</span> ${(g.grievance*100|0)}% · <span class="k">최근:</span> ${g.lastAct}</div>`;
        h+=`<div><span class="k">전적:</span> ${g.wins}승 ${g.losses}패</div>`;
        // 학습된 정책 (강화된 행동)
        const pol=Object.entries(g.policy).sort((a,b)=>b[1]-a[1]);
        h+=`<div style="margin-top:3px"><span class="k">학습 정책:</span> `+pol.slice(0,3).map(([a,v])=>`${ACT_KR[a]} ${v.toFixed(1)}`).join(' · ')+`</div>`;
        if(g.memory.length) h+=`<div style="margin-top:3px;color:#888;font-size:10px">기억: ${g.memory[0]}</div>`;
      }
      h+=`<div style="margin-top:4px"><span class="k">이 땅의 역사:</span> ${c.hist.join(' → ')}</div>`;
    }
  } else {
    const what = c.st==='water'?'바다':c.st==='forest'?'숲':c.st==='ruin'?'폐허':'무주공산';
    fmla.innerHTML = fmlaHTML(`TERRAIN(${ref(i)}, type="${what}", fert=${(c.fert*100|0)}%)`);
    h+=`<h3>${ref(i)} · ${what}</h3>`;
    h+=`<div><span class="k">비옥도:</span> ${(c.fert*100|0)}%</div>`;
    h+=`<div style="margin-top:4px"><span class="k">역사:</span> ${c.hist.join(' → ')}</div>`;
    h+=`<div style="margin-top:3px;color:#888;font-size:10px">아직 어떤 문명도 이 땅에 깃들지 않았다.</div>`;
  }
  inspBody.innerHTML=h;
  insp.style.display='block';
}

/* ---- 시트 전환 ---- */
let activeSheet='map';
function setSheet(s){
  activeSheet=s;
  $('sheetwrap').style.display = s==='map'?'block':'none';
  $('doc-chron').style.display = s==='chron'?'block':'none';
  $('doc-dead').style.display = s==='dead'?'block':'none';
  legend.style.display = s==='map'?'block':'none';
  if(s!=='map') insp.style.display='none';
  for(const d of document.querySelectorAll('#tabs div')) d.classList.toggle('on', d.dataset.sheet===s);
  if(s==='chron') renderChron();
  if(s==='dead') renderDead();
}
for(const d of document.querySelectorAll('#tabs div')) d.addEventListener('click',()=>setSheet(d.dataset.sheet));

const KIND_TAG={birth:['발흥','#107c41'],war:['전쟁','#dc2626'],order:['지령','#7c3aed'],
  betray:['반역','#9333ea'],ally:['동맹','#0d9488'],golden:['황금기','#d97706'],
  build:['건설','#2563eb'],death:['멸망','#555'],event:['사건','#b45309'],
  migrate:['이주','#0891b2']};
function renderChron(){
  let h='<table class="doc"><tr><th>서기</th><th>연대기 — 창발한 역사</th><th>수식 로그</th></tr>';
  for(const c of chronicle.slice(0,300)){
    const t=KIND_TAG[c.kind]||['','#888'];
    h+=`<tr><td class="yr">${c.year}년</td><td><span class="tag" style="background:${t[1]}">${t[0]}</span>${c.html}</td><td class="fm">${c.formula?('='+c.formula):''}</td></tr>`;
  }
  h+='</table>';
  if(chronicle.length===0) h='<table class="doc"><tr><th>서기</th><th>연대기</th></tr><tr><td class="yr">1년</td><td>아직 기록된 역사가 없다.</td></tr></table>';
  $('doc-chron').innerHTML=h;
}
function renderDead(){
  let h='<table class="doc"><tr><th>#</th><th>멸망한 문명</th><th>서기</th><th>사인(死因)</th></tr>';
  if(!obituaries.length) h+='<tr><td>—</td><td>아직 멸망한 문명이 없다.</td><td>—</td><td>—</td></tr>';
  obituaries.forEach((o,k)=>{ h+=`<tr><td>${k+1}</td><td>† ${o.name}</td><td class="yr">${o.year}년</td><td>${o.cause}</td></tr>`; });
  h+='</table>';
  $('doc-dead').innerHTML=h;
}

/* ============================================================
   루프 제어
   ============================================================ */
let speed=1, paused=false, timer=null;
const SPEEDS=[1,2,4];
function schedule(){
  clearInterval(timer);
  if(paused) return;
  timer=setInterval(agentTick, 120/speed);
}
$('btn-speed').addEventListener('click',()=>{
  speed = SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];
  $('btn-speed').textContent='속도 ×'+speed; schedule();
});
$('btn-pause').addEventListener('click',()=>{
  paused=!paused; $('btn-pause').textContent=paused?'재개':'일시정지'; schedule();
  showHint(paused?'일시정지됨 — 셀을 클릭해 에이전트 내부를 살펴보세요':'재개');
});
let hintT;
function showHint(t){ const h=$('hint'); h.textContent=t; h.style.opacity='1'; clearTimeout(hintT); hintT=setTimeout(()=>h.style.opacity='0',2600); }

/* ============================================================
   시작 — 첫 페인트가 곧 동작하는 스프레드시트
   ============================================================ */
for(let i=0;i<N;i++) paint(i);
fmla.innerHTML = fmlaHTML(`SIM.CIVILIZATION($A$1:$${colName(COLS-1)}$${ROWS}, model="learning_agents", "역사는 매번 새로 쓰인다")`);
// 초기 3세력
// 지도 크기에 비례해 초기 세력 수 결정 → 충돌이 필연적으로 일어나도록
const initFac = clamp(Math.round(N/120), 3, 6);
for(let s=0;s<initFac;s++) spawnFaction(true);
renderLegend();
schedule();
setTimeout(()=>showHint('셀을 클릭하면 그 땅을 다스리는 AI 총독의 감정·충성·학습 정책이 보입니다'),900);

/* 디버그 훅(자가검증용) */
window.__sim = { get year(){return year;}, get factions(){return factions;},
  get pop(){return pop;}, get obituaries(){return obituaries;}, get chronicle(){return chronicle;},
  tickN:()=>tickN };
})();
</script>
