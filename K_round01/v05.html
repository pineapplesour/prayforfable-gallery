<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신앙.xlsx - Excel</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  body{display:flex;flex-direction:column}
  #titlebar,#menubar,#fbar,#tabs,#statusbar{flex:0 0 auto}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px}
  #namebox{width:78px;min-width:78px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;gap:6px;font-size:11px}
  #namebox .tri{color:#aaa;font-size:8px}
  #fx{width:30px;min-width:30px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #main{display:flex;height:0;flex:1;min-height:0}
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1;min-width:0}
  #sheet{display:grid;background:#fff}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:10px;overflow:hidden}
  .cell{border-right:1px solid #e9e9e9;border-bottom:1px solid #e9e9e9;position:relative;
    display:flex;align-items:center;justify-content:center;font-size:11px;
    overflow:hidden;cursor:cell;line-height:1}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:3}
  .cell .em{position:absolute;top:0;right:1px;font-size:7px;line-height:1;opacity:.9}
  .cell .hl{position:absolute;left:1px;bottom:0;font-size:7px;line-height:1;opacity:.85;font-weight:700}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #ff4d4d}50%{box-shadow:inset 0 0 0 2px #ffd2d2}}
  .war{animation:warf .3s 3}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
  .miracle{animation:pulse .5s 2}
  /* side panels */
  #side{width:288px;min-width:288px;background:#fbfbfa;border-left:1px solid #d4d4d4;
    display:flex;flex-direction:column;overflow:hidden}
  #sidehd{padding:6px 10px;background:#f3f2f1;border-bottom:1px solid #ddd;font-weight:600;color:#107c41;font-size:11.5px;display:flex;justify-content:space-between;align-items:center}
  #sidehd .yr{color:#888;font-weight:400;font-size:10.5px}
  #faiths{overflow-y:auto;flex:0 0 auto;max-height:46%;padding:4px 6px}
  .frow{border:1px solid #e2e2e2;border-radius:3px;margin:4px 2px;padding:5px 7px;background:#fff;cursor:pointer;font-size:10.5px;line-height:1.45}
  .frow:hover{background:#f6fff9}
  .frow.dead{opacity:.5;background:#f4f4f4}
  .frow .fn{font-weight:700;display:flex;align-items:center;gap:5px}
  .frow .sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:0 0 auto}
  .frow .stat{color:#666;font-size:9.5px;margin-top:2px}
  .frow .bar{height:5px;border-radius:3px;background:#eee;margin-top:3px;overflow:hidden;display:flex}
  .frow .bar i{height:100%;display:block}
  .frow .doc{color:#888;font-size:9px;margin-top:2px;font-style:italic}
  #logwrap{flex:1;min-height:0;border-top:1px solid #ddd;display:flex;flex-direction:column}
  #logtabs{display:flex;font-size:10px;background:#f0f0f0;border-bottom:1px solid #ddd}
  #logtabs div{padding:4px 8px;cursor:pointer;color:#666;border-right:1px solid #e0e0e0}
  #logtabs div.on{background:#fff;color:#107c41;font-weight:600}
  #log{flex:1;overflow-y:auto;padding:4px 8px;font-size:10px;line-height:1.55}
  .le{margin:2px 0;padding:2px 0;border-bottom:1px dotted #eee;display:flex;gap:5px}
  .le .y{color:#999;font-family:Consolas,monospace;flex:0 0 auto;font-size:9px}
  .le b{font-weight:700}
  #statusbar{height:24px;min-height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11px;gap:0;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .ev{overflow:hidden;text-overflow:ellipsis}
  #tabs{height:25px;min-height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:24px;
    border-top:1px solid #d4d4d4;font-size:11px}
  #tabs div{padding:3px 12px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  #ctrl{display:flex;align-items:center;gap:8px;margin-left:auto;padding-right:14px}
  #ctrl button{font:inherit;font-size:10px;border:1px solid #c8c8c8;background:#fff;color:#333;
    border-radius:3px;padding:2px 8px;cursor:pointer}
  #ctrl button:hover{background:#f0f0f0}
  #ctrl button.act{background:#107c41;color:#fff;border-color:#0c6435}
  /* overlay sheets (연대기/계보/멸망) */
  #overlay{position:absolute;inset:0;background:#fff;z-index:20;display:none;flex-direction:column;font-size:12px}
  #overlay.show{display:flex}
  #ovhd{padding:10px 16px;border-bottom:2px solid #107c41;font-weight:700;color:#107c41;font-size:13px;display:flex;justify-content:space-between}
  #ovbody{flex:1;overflow:auto;padding:6px 0}
  table.ot{border-collapse:collapse;width:100%;font-size:11px}
  table.ot th{background:#f5f5f5;border:1px solid #d8d8d8;padding:4px 8px;text-align:left;position:sticky;top:0;color:#555;font-weight:600}
  table.ot td{border:1px solid #ececec;padding:3px 8px;vertical-align:top}
  table.ot tr:nth-child(even){background:#fafafa}
  .pill{display:inline-block;padding:0 5px;border-radius:8px;color:#fff;font-size:9px;font-weight:700}
  #tip{position:absolute;z-index:40;background:#262626;color:#eee;font-size:10px;line-height:1.5;
    padding:7px 9px;border-radius:4px;max-width:240px;pointer-events:none;display:none;box-shadow:0 3px 12px rgba(0,0,0,.35)}
  #tip b{color:#ffd479}
  #tip .em{color:#9fd3ff}
  @media (max-width:760px){
    #side{display:none}
    #menubar i:nth-child(n+5){display:none}
  }
</style>
</head>
<body>
<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <span id="ttl">신앙.xlsx - Excel</span>
</div>
<div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
<div id="fbar">
  <div id="namebox"><span id="nb">A1</span><span class="tri">▼</span></div>
  <div id="fx">fx</div>
  <div id="formula"></div>
</div>
<div id="main">
  <div id="sheetwrap">
    <div id="sheet"></div>
    <div id="overlay">
      <div id="ovhd"><span id="ovttl"></span><span style="font-weight:400;color:#999">Sheet1 탭을 눌러 지도로 돌아갑니다</span></div>
      <div id="ovbody"></div>
    </div>
    <div id="tip"></div>
  </div>
  <div id="side">
    <div id="sidehd"><span>신앙 현황</span><span class="yr" id="sideYr"></span></div>
    <div id="faiths"></div>
    <div id="logwrap">
      <div id="logtabs"><div class="on" data-l="all">전체</div><div data-l="schism">분열·이단</div><div data-l="war">성전</div><div data-l="agent">인물</div></div>
      <div id="log"></div>
    </div>
  </div>
</div>
<div id="tabs">
  <div class="on" data-tab="sheet">Sheet1</div>
  <div data-tab="chron">연대기</div>
  <div data-tab="lineage">교리계보</div>
  <div data-tab="dead" id="tab-dead">멸망기록 (0)</div>
  <div id="ctrl">
    <button id="btnPause">⏸ 정지</button>
    <button id="btnSpeed">속도 1×</button>
    <button id="btnSeed">＋ 예언자 강림</button>
  </div>
</div>
<div id="statusbar"></div>

<script>
(() => {
"use strict";
// ============================================================================
//  신앙.xlsx — 창발적 종교·이념 문명 시뮬레이션
//  엑셀로 위장. 각 칸은 신도 공동체. 각 인물(예언자/성직자/지도자/광신도/이단자)은
//  목표·성격·기억·감정을 가진 자율 에이전트. 교리는 다축 신념 벡터.
//  분열·성전·개종·이단심문·개혁·황금기는 대본 없이 상호작용에서 창발한다.
// ============================================================================

const R = Math.random;
const pick = a => a[R()*a.length|0];
const clamp=(v,lo,hi)=>v<lo?lo:v>hi?hi:v;
const rnd=(a,b)=>a+R()*(b-a);
const chance=p=>R()<p;

// ---- DOM ----
const $ = s=>document.getElementById(s);
const sheet=$('sheet'), fmla=$('formula'), nb=$('nb'), statusbar=$('statusbar');
const faithsEl=$('faiths'), logEl=$('log'), sideYr=$('sideYr'), ttl=$('ttl');
const tip=$('tip'), overlay=$('overlay'), ovbody=$('ovbody'), ovttl=$('ovttl');

// ---- grid sizing (responsive) ----
const CW=30, CH=22;
let COLS = clamp(Math.floor((innerWidth - (innerWidth>760?288:0) - 50)/CW), 14, 46);
let ROWS = clamp(Math.floor((innerHeight-176)/CH), 12, 30);
let N = COLS*ROWS;
sheet.style.gridTemplateColumns = `40px repeat(${COLS}, ${CW}px)`;
sheet.style.gridAutoRows = CH+'px';

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(((i/COLS)|0)+1);}

// ---- build sheet DOM ----
const cellEls=new Array(N);
{
  const frag=document.createDocumentFragment();
  const corner=document.createElement('div');corner.className='hd';frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd';h.textContent=colName(c);frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd';h.textContent=r+1;frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d;frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

// ---- terrain (value-noise) ----
const GW=8,GH=6,gz=[];
for(let i=0;i<GW*GH;i++)gz[i]=R();
function noise(x,y){
  const fx=x/COLS*(GW-1),fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=gz[y0*GW+x0],b=gz[y0*GW+Math.min(GW-1,x0+1)];
  const c=gz[Math.min(GH-1,y0+1)*GW+x0],d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}

// ============================================================================
//  교리(Doctrine) — 다축 신념 벡터. 분열의 핵심.
//  축: 신성(theos), 권위(authority), 금욕(ascetic), 보편(universal), 신비(mystic)
//  두 교리의 거리 = 신학적 차이. 거리가 관용한계를 넘으면 이단·분열 발생.
// ============================================================================
const AXES=['신성','권위','금욕','보편','신비'];
function newDoctrine(base){
  if(!base) return AXES.map(()=>rnd(.2,.8));
  return base.map(v=>clamp(v+rnd(-.07,.07),0,1));
}
function docDist(a,b){let s=0;for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d;}return Math.sqrt(s);}
function docTenet(d){ // 교리에서 한 줄 신조 생성
  let mx=0,mi=0;d.forEach((v,i)=>{if(Math.abs(v-.5)>Math.abs(d[mx]-.5))mx=i;});
  d.forEach((v,i)=>{if(Math.abs(v-.5)<Math.abs(d[mi]-.5))mi=i;});
  const a=d[mx]>.5;
  const T={신성:['유일신은 절대적이다','신은 만물에 깃든다'],권위:['교단의 위계는 신성하다','모든 신도는 평등하다'],
    금욕:['육신을 부정하고 비워라','풍요는 신의 축복이다'],보편:['만민을 개종시켜라','선택받은 자만 구원받는다'],
    신비:['진리는 환상 속에 있다','진리는 율법에 적혀 있다']};
  return T[AXES[mx]][a?0:1];
}

// ============================================================================
//  에이전트 — 자율 인물. 성격·목표·기억·감정.
//  역할: prophet(예언자) / hierarch(대주교) / cleric(성직자) / zealot(광신도) / heretic(이단자)
// ============================================================================
const SURN=['요한','마르','이샤','케테','오론','셀라','바누','테오','미카','자라','노바','엘리','두암','시온','카르','베다'];
const TITLE={prophet:'예언자',hierarch:'대주교',cleric:'사제',zealot:'광신도',heretic:'이단자',rebel:'반역자'};
let agentSeq=1;
function newAgent(role,faith,doc){
  return {
    id:agentSeq++, name:pick(SURN)+pick(SURN.map(s=>s[0])), role, faith,
    // 성격 (불변에 가까운 기질)
    zeal:rnd(.2,1),        // 열정 — 확장/성전 의지
    ambition:rnd(0,1),     // 야망 — 분열/찬탈 동기
    doubt:rnd(0,.6),       // 회의 — 교리 재해석/이단화
    loyalty:rnd(.3,1),     // 충성 — 명령 복종
    cruelty:rnd(0,1),      // 잔혹 — 숙청/이단심문
    // 사적 교리 해석 (지도자 교리에서 표류)
    creed: doc?newDoctrine(doc):newDoctrine(),
    // 감정 (사건으로 동적 변화) joy/anger/sorrow/zealEmo
    joy:.3, anger:.1, sorrow:.1, fervor:.4,
    mem:[],               // 기억: {y, what, w}  (w=가중치, 원한/은혜)
    grievance:0,          // 누적 원한
    cell:-1, age:0, alive:true
  };
}
function emoState(ag){
  // 지배 감정 결정
  const e={기쁨:ag.joy,분노:ag.anger,슬픔:ag.sorrow,열망:ag.fervor};
  let k='평정',mx=.45;for(const[n,v]of Object.entries(e))if(v>mx){mx=v;k=n;}
  return k;
}
const EMO_ICON={기쁨:'☺',분노:'✦',슬픔:'☂',열망:'†',평정:''};
function remember(ag,what,w){ag.mem.push({y:year,what,w});if(ag.mem.length>6)ag.mem.shift();if(w<0)ag.grievance+=-w;}
function decay(ag){ag.joy*=.96;ag.anger*=.95;ag.sorrow*=.95;ag.fervor=.3+.7*ag.zeal*.5+ag.fervor*.5*.92;ag.grievance*=.985;}

// ============================================================================
//  신앙(Faith) — 교리 + 위계 + 인물들 + 영토
// ============================================================================
const PALETTE=['#2563eb','#dc2626','#059669','#7c3aed','#d97706','#0d9488','#be185d','#4d7c0f','#9333ea','#b45309','#0891b2','#65a30d','#db2777','#475569'];
const FAITH_PRE=['빛의','어둠의','강의','산정의','잿빛','일곱별','첫새벽','심해의','순환하는','불멸의','잃어버린','속삭이는','황금','마지막'];
const FAITH_POST=['언약','교단','신비','율법','순례단','형제회','은총','계시','동맹','성회','종단','광명회'];
let faithSeq=0, usedColor=0;
let faiths=[], deadFaiths=[], allAgents=[];
function faithName(){return pick(FAITH_PRE)+' '+pick(FAITH_POST);}
function newFaith(doc,parent){
  const f={
    id:faithSeq++, name:faithName(), color:PALETTE[usedColor++%PALETTE.length],
    doctrine:doc||newDoctrine(), parent: parent?parent.id:null,
    founded:year, agents:[], cells:[], size:0, devotion:0,
    golden:0, schismDebt:0, miracles:0, born:year, glyph:pick(['☧','☾','✶','卍','☯','✝','⚚','♁','☉','✺'])
  };
  faiths.push(f);
  return f;
}
function facById(id){return faiths.find(f=>f.id===id);}
function leaderOf(f){return f.agents.find(a=>a.role==='prophet')||f.agents.find(a=>a.role==='hierarch')||f.agents[0];}

// ============================================================================
//  세계 상태
// ============================================================================
const cells=new Array(N);
for(let i=0;i<N;i++){
  const x=i%COLS,y=i/COLS|0;
  const v=noise(x,y)+(R()-.5)*.14;
  let st='land';
  if(v<.30)st='water';
  else if(v>.66&&chance(.6))st='mount';
  cells[i]={st, faith:null, devout:0, shrine:0, agent:null, unrest:0, hist:[st==='water'?'바다':st==='mount'?'산':'미개척지'], holy:false};
}
function nbrs(i){const x=i%COLS,y=i/COLS|0,o=[];if(x>0)o.push(i-1);if(x<COLS-1)o.push(i+1);if(y>0)o.push(i-COLS);if(y<ROWS-1)o.push(i+COLS);return o;}
function nbrs8(i){const x=i%COLS,y=i/COLS|0,o=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS)o.push(ny*COLS+nx);}return o;}

let year=1, paused=false, speed=1, tickN=0;
let selected=-1, selFaith=-1, logFilter='all', curTab='sheet';
const dirty=new Set();
const chronicle=[]; // {y,kind,msg,formula}
const lineage=[];   // {y, child, parent, reason, doc}
const KIND_COLOR={birth:'#107c41',schism:'#7c3aed',war:'#dc2626',convert:'#0891b2',death:'#666',miracle:'#d97706',agent:'#0d6efd',reform:'#059669',betray:'#b00020'};

function log(kind,msg,formula){
  chronicle.push({y:year,kind,msg,formula});
  if(chronicle.length>400)chronicle.shift();
  lastEvent={kind,msg};
  if(formula)fmla.textContent=formula;
  renderLog();
}
let lastEvent={kind:'birth',msg:'태초에 침묵이 있었다.'};

function setCell(i,faith,devout,label,ag){
  const c=cells[i];
  c.faith=faith; c.devout=devout; c.st='land';
  if(ag!==undefined)c.agent=ag;
  if(label){c.hist.push(label);if(c.hist.length>8)c.hist.shift();}
  dirty.add(i);
}

// ============================================================================
//  렌더링
// ============================================================================
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}
const DEV_GLYPH=['','·','☖','⛪','✦']; // 신도 → 회당 → 사원 → 대성당

function paint(i){
  const c=cells[i],el=cellEls[i];
  let bg='',txt='',col='#222',w='',em='',hl='';
  if(c.st==='water'){bg='#dbeaf7';txt='≈';col='#9dc3e6';}
  else if(c.st==='mount'){bg='#efece6';txt='⛰';col='#b3a896';}
  else if(c.st==='ruin'){bg='#efefef';txt='墟';col='#aaa';}
  else if(c.faith!==null){
    const f=facById(c.faith);
    if(f){
      bg=hexA(f.color,.12+c.devout*.19);
      txt=DEV_GLYPH[c.devout]||'·'; col=f.color; w=c.devout>=3?'700':'';
      if(c.holy){txt=f.glyph;w='700';}
      if(c.agent){const ag=c.agent;const es=emoState(ag);if(EMO_ICON[es])em=EMO_ICON[es];
        hl=({prophet:'★',hierarch:'♛',cleric:'✚',zealot:'⚔',heretic:'¿',rebel:'⚑'})[ag.role]||'';}
      if(c.unrest>.6){bg=hexA(f.color,.1);}
    }
  }
  el.style.background=bg;el.style.color=col;el.style.fontWeight=w;
  el.innerHTML='';
  if(txt){el.appendChild(document.createTextNode(txt));}
  if(hl){const h=document.createElement('span');h.className='hl';h.style.color=col;h.textContent=hl;el.appendChild(h);}
  if(em){const e=document.createElement('span');e.className='em';e.style.color=
    em==='✦'?'#c0392b':em==='☂'?'#2980b9':em==='†'?'#8e44ad':'#16a085';e.textContent=em;el.appendChild(e);}
  if(i===selected)el.classList.add('sel');
}
function flashWar(i){const el=cellEls[i];el.classList.add('war');setTimeout(()=>el.classList.remove('war'),900);}
function flashMiracle(i){const el=cellEls[i];el.classList.add('miracle');setTimeout(()=>el.classList.remove('miracle'),1000);}

// ============================================================================
//  핵심 시뮬레이션 틱
// ============================================================================
let warCool=0;
function tick(){
  tickN++; year++;
  if(warCool>0)warCool--;

  // --- 재집계 ---
  for(const f of faiths){f.cells.length=0;f.size=0;f.devotion=0;}
  let worldPop=0;
  const DEVW=[0,12,60,200,650];
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin'){if(--c.shrine<=0){c.st='land';c.hist.push('폐허 재건');dirty.add(i);}continue;}
    if(c.faith!==null){
      const f=facById(c.faith);
      if(f){f.cells.push(i);f.size++;f.devotion+=c.devout;worldPop+=DEVW[c.devout];}
      else{c.faith=null;c.devout=0;c.agent=null;dirty.add(i);}
    }
    if(c.unrest>0)c.unrest=clamp(c.unrest-.02,0,1);
  }

  // --- 멸망 판정 ---
  for(let k=faiths.length-1;k>=0;k--){
    const f=faiths[k];
    if(f.size===0){
      const ld=leaderOf(f);
      deadFaiths.push({name:f.name,from:f.founded,to:year,peak:f.peak||0,color:f.color,
        cause: f.schismDebt>2?'교리 분열로 와해':'개종·정복으로 흡수'});
      log('death',`${f.name}이(가) 역사에서 사라졌습니다.`,`=COLLAPSE("${f.name}", 서기${year}년)`);
      // 추종자 절망/이산
      for(const a of f.agents){a.alive=false;}
      faiths.splice(k,1);
      $('tab-dead').textContent=`멸망기록 (${deadFaiths.length})`;
    } else { f.peak=Math.max(f.peak||0,f.size); }
  }

  // --- 인물(에이전트) 결정 단계 ---
  // 살아있는 에이전트만, 각자 자율 판단
  allAgents=[];
  for(const f of faiths)for(const a of f.agents)if(a.alive)allAgents.push(a);

  for(const f of faiths){
    if(f.golden>0)f.golden--;
    if(f.size===0)continue;
    const leader=leaderOf(f);

    // 지도자: 큰 그림 결정 (확장/정화/관용)
    decideLeader(f,leader);

    // 하위 에이전트: 명령 해석 + 자율 행동 + 항명/배신 가능
    for(const a of f.agents){
      if(!a.alive)continue;
      a.age++;
      decay(a);
      decideAgent(f,a,leader);
    }

    // 교리 표류: 지도자 교리는 사제들의 평균 해석으로 서서히 변함 (해석학적 표류)
    const clerics=f.agents.filter(a=>a.alive&&(a.role==='cleric'||a.role==='hierarch'));
    if(clerics.length){
      for(let ax=0;ax<f.doctrine.length;ax++){
        let s=0;for(const c of clerics)s+=c.creed[ax];
        const avg=s/clerics.length;
        // 본교 교리는 사제 평균을 아주 약하게만 따라간다 — 개인 해석과 간극이 벌어질 여지를 남긴다
        f.doctrine[ax]=clamp(f.doctrine[ax]*.994+avg*.006,0,1);
      }
    }

    // 분열 점검: 야망·회의 높고 교리 멀어진 인물이 따로 신앙을 세운다 (창발적 분파)
    checkSchism(f);

    // 자연 확장(공동체 차원 — 인물 없는 변경 신도들)
    communityGrowth(f);
  }

  // --- 신앙 없으면 새 예언자 가능성 ---
  if(faiths.length<2 && chance(.05)){
    spawnProphet(false,'침묵을 깨고 새 예언자가 일어섰습니다.');
  } else if(faiths.length<5 && chance(.006)){
    spawnProphet(false,'변방에서 이름 없는 예언자가 등장했습니다.');
  }

  // --- 세계 사건 (창발 보조 — 인물 감정에 입력으로 작용) ---
  worldEvents();

  // --- 그리기 ---
  for(const i of dirty)paint(i);
  dirty.clear();

  // --- 상태/패널 ---
  renderStatus(worldPop);
  if(tickN%6===0){renderFaiths();sideYr.textContent=`서기 ${year}년`;}
  if(tickN%14===0){ttl.textContent=`신앙.xlsx - Excel (서기 ${year}년 · 신앙 ${faiths.length})`;
    if(curTab!=='sheet')renderOverlay(curTab);}
}

// ---- 지도자 의사결정 ----
function decideLeader(f,ld){
  if(!ld)return;
  // 지도자의 감정·성격이 교단의 정책을 결정
  // 분노 높음 → 성전/정화 / 기쁨 높음 → 황금기 선포 / 야망 → 신권 강화
  ld.fervor=clamp(ld.fervor+f.golden*.0008,0,1);
  if(ld.anger>.55 && warCool===0 && chance(.25)){
    // 성전 선포 (정책) — 광신도 양성
    const z=f.agents.find(a=>a.alive&&a.role==='cleric'&&a.zeal>.6);
    if(z){z.role='zealot';log('agent',`${f.name}의 ${z.name}이(가) 성전을 외치는 광신도가 되었습니다.`,`=ORDAIN("${z.name}", 광신도)`);}
  }
  if(ld.joy>.6 && f.golden===0 && f.size>5 && chance(.04)){
    f.golden=110;
    log('miracle',`${f.name}이(가) 황금기에 들어섰습니다. (지도자 ${ld.name}의 환희)`,`=GOLDEN.AGE("${f.name}", 서기${year}년)`);
  }
  // 위계 보강: 영토 커지면 대주교 임명
  const hierarchs=f.agents.filter(a=>a.alive&&a.role==='hierarch').length;
  if(f.size>10 && hierarchs<Math.floor(f.size/12) && chance(.06)){
    const cand=f.agents.find(a=>a.alive&&a.role==='cleric');
    if(cand){cand.role='hierarch';
      log('agent',`${f.name}이(가) ${cand.name}을(를) 대주교로 서임했습니다.`,`=APPOINT("${cand.name}", 대주교)`);}
  }
  // 사제 부족하면 신도 중 임명
  const clerCnt=f.agents.filter(a=>a.alive&&(a.role==='cleric'||a.role==='hierarch')).length;
  if(f.size>3 && clerCnt<Math.ceil(f.size/8) && f.cells.length && chance(.12)){
    const i=pick(f.cells);
    if(!cells[i].agent){
      const a=newAgent('cleric',f.id,f.doctrine);a.cell=i;cells[i].agent=a;f.agents.push(a);dirty.add(i);
    }
  }
}

// ---- 하위 에이전트 의사결정 (항명·배신 포함) ----
function decideAgent(f,a,ld){
  // 명령 복종 여부: 충성 - 원한 - 야망*회의 가 음수면 항명
  const obedience = a.loyalty - a.grievance*.4 - a.ambition*a.doubt*.6 + (f.golden?.2:0);
  const defiant = obedience < .25;

  if(a.role==='prophet'){
    // 예언자: 가끔 기적 → 주변 회심·devotion↑·기쁨↑
    if(a.cell>=0 && chance(.05+a.fervor*.05)){
      doMiracle(f,a);
    }
    spreadFervor(f,a);
    return;
  }

  if(a.role==='zealot'){
    // 광신도: 인접 타신앙 칸을 성전(개종/정복)으로
    if(a.cell>=0){
      const targets=nbrs(a.cell).filter(n=>cells[n].faith!==null&&cells[n].faith!==f.id);
      if(targets.length && warCool>=0){
        const t=pick(targets);holyWar(f,a,t);
      } else {
        // 대상 없으면 자기 영토 신앙심 고취 또는 분노 축적
        spreadFervor(f,a);
      }
    }
    return;
  }

  if(a.role==='heretic'||a.role==='rebel'){
    // 이단/반역: 사적 교리를 주변에 퍼뜨림 → 분열의 씨앗
    if(a.cell>=0){
      a.creed=newDoctrine(a.creed); // 더 표류
      const nb=nbrs(a.cell).filter(n=>cells[n].faith===f.id&&!cells[n].agent);
      if(nb.length&&chance(.4)){
        cells[pick(nb)].unrest=clamp(cells[pick(nb)].unrest+.25,0,1);
        dirty.add(a.cell);
      }
    }
    return;
  }

  // 사제 / 대주교
  // 개인 교리는 회의(doubt)에 따라 표류 → 분열의 연료.
  // 본교 교리에서 '멀어지는 방향'으로 편향 표류시켜 해석학적 균열이 자라게 한다.
  if(a.doubt>.25 && chance(.25+a.doubt*.35)){
    for(let ax=0;ax<a.creed.length;ax++){
      const away=a.creed[ax]>=f.doctrine[ax]?1:-1; // 본교와 벌어지는 쪽으로 살짝 더
      a.creed[ax]=clamp(a.creed[ax]+rnd(-.05,.05)+away*a.doubt*.03,0,1);
    }
    const dist=docDist(a.creed,f.doctrine);
    if(dist>.40){a.anger=clamp(a.anger+.06,0,1);if(chance(.3))remember(a,'교리에 회의를 품다',-1);}
  }

  if(defiant && a.ambition>.55 && chance(.10)){
    // 항명 → 배신/반역 또는 이단화
    if(a.doubt>.4){
      a.role='heretic';a.sorrow=clamp(a.sorrow+.2,0,1);
      log('schism',`${f.name}의 사제 ${a.name}이(가) 교리에 반발해 이단으로 돌아섰습니다.`,`=HERESY("${a.name}" ⊥ "${f.name}")`);
    } else {
      a.role='rebel';a.anger=clamp(a.anger+.3,0,1);
      log('betray',`${f.name}의 ${a.name}이(가) 지도자 ${ld?ld.name:'?'}에게 반기를 들었습니다.`,`=REBEL("${a.name}" → 찬탈)`);
      // 찬탈 시도
      if(ld && a.ambition>.7 && chance(.4)){
        usurp(f,a,ld);
      }
    }
    return;
  }

  // 충실한 사제: 신앙심 고취(개종/발전) + 가끔 이단심문
  spreadFervor(f,a);
  if((ld&&ld.cruelty>.5||a.cruelty>.6) && chance(.05)){
    inquisition(f,a);
  }
}

// ---- 행동 구현 ----
function spreadFervor(f,a){
  if(a.cell<0)return;
  const reach=nbrs(a.cell);
  // 자기 신앙 칸 발전
  const own=reach.filter(n=>cells[n].faith===f.id&&cells[n].devout<4);
  if(own.length && chance(.18*(f.golden?2:1)*(1+a.fervor*.5))){
    const i=pick(own);const c=cells[i];c.devout++;
    c.hist.push(['','신도','회당','사원','대성당'][c.devout]);if(c.hist.length>8)c.hist.shift();
    dirty.add(i);
    if(c.devout===4 && warCool===0){c.holy=true;f.miracles++;
      log('miracle',`${f.name}의 ${ref(i)}에 대성당이 봉헌되었습니다.`,`=CATHEDRAL("${f.name}", ${ref(i)})`);warCool=18;}
    a.joy=clamp(a.joy+.04,0,1);
  }
  // 빈 땅/타신앙 개종
  const open=reach.filter(n=>{const c=cells[n];return c.st==='land'&&(c.faith===null||(c.faith!==f.id&&c.devout<=1));});
  if(open.length && chance(.22*(1+a.zeal*.6)*(f.golden?1.5:1))){
    const i=pick(open);const c=cells[i];
    if(c.faith===null){setCell(i,f.id,1,'개종');}
    else { // 평화적 개종
      setCell(i,f.id,1,'개종(타신앙)');
      if(warCool===0&&chance(.3)){const of=facById(c.faith);
        log('convert',`${f.name}이(가) ${of?of.name:'이교도'}의 ${ref(i)}을(를) 개종시켰습니다.`,`=CONVERT("${f.name}", ${ref(i)})`);warCool=22;}
    }
    a.joy=clamp(a.joy+.02,0,1);
  }
}

function holyWar(f,a,t){
  const c=cells[t],of=facById(c.faith);
  if(!of)return;
  flashWar(t);
  const att=a.zeal+a.fervor*.5+f.size*.004+(f.golden?.6:0)+rnd(0,.8);
  const def=c.devout*.35+(c.agent?c.agent.zeal*.6:0)+rnd(0,.8)+(c.holy?.6:0);
  if(att>def){
    if(chance(.35)){ // 약탈/파괴
      c.st='ruin';c.shrine=60;c.faith=null;c.devout=0;
      if(c.agent){c.agent.alive=false;c.agent=null;}
      c.hist.push('성전으로 파괴');dirty.add(t);
    } else { // 정복 개종
      const wasHoly=c.holy;c.holy=false;
      if(c.agent){c.agent.alive=false;c.agent=null;}
      setCell(t,f.id,1,'성전으로 점령',null);
      if(wasHoly)remember(a,'적의 성소를 정복',2),a.joy=clamp(a.joy+.15,0,1);
    }
    a.fervor=clamp(a.fervor+.05,0,1);
    // 패배측 분노 → 보복 정서
    const ol=leaderOf(of);if(ol){ol.anger=clamp(ol.anger+.2,0,1);remember(ol,`${f.name}의 침공`,-2);}
    if(warCool===0){
      log('war',`${f.name}의 ${TITLE[a.role]} ${a.name}이(가) ${of.name}의 ${ref(t)}을(를) 공격했습니다.`,
        `=HOLY_WAR("${f.name}"→"${of.name}", ${ref(t)})`);warCool=14;
    }
  } else {
    // 방어 성공 → 공격자 좌절
    a.anger=clamp(a.anger+.12,0,1);a.sorrow=clamp(a.sorrow+.05,0,1);
    remember(a,'성전에서 패퇴',-1);
  }
}

function inquisition(f,a){
  // 자기 영토에서 회의/불안 높은 칸을 정화 → 공포·devotion 변동, 이단심리 자극
  const sus=f.cells.filter(i=>cells[i].unrest>.3||(cells[i].agent&&cells[i].agent.role==='heretic'));
  if(!sus.length)return;
  const i=pick(sus);const c=cells[i];
  flashWar(i);
  if(c.agent&&c.agent.role==='heretic'){
    c.agent.alive=false;c.agent=null;c.unrest=0;
    log('schism',`${f.name}이(가) ${ref(i)}의 이단자를 화형에 처했습니다.`,`=INQUISITION("${f.name}", ${ref(i)})`);
    // 순교 → 주변 분노/원한 (탄압의 역설)
    for(const n of nbrs8(i)){if(cells[n].faith===f.id){cells[n].unrest=clamp(cells[n].unrest+.15,0,1);
      if(cells[n].agent){cells[n].agent.anger=clamp(cells[n].agent.anger+.12,0,1);remember(cells[n].agent,'동료의 순교',-1.5);}}}
  } else {
    c.unrest=clamp(c.unrest-.4,0,1);
    if(chance(.2)){c.devout=Math.max(1,c.devout-1);c.hist.push('숙청');dirty.add(i);}
  }
  a.cruelty=clamp(a.cruelty+.02,0,1);
}

function doMiracle(f,a){
  const i=a.cell;flashMiracle(i);
  f.miracles++;
  // 주변 회심·devotion 상승, 신도 기쁨
  for(const n of nbrs8(i)){const c=cells[n];
    if(c.st==='land'){
      if(c.faith===null){setCell(n,f.id,1,'기적으로 회심');}
      else if(c.faith===f.id&&c.devout<4){c.devout++;dirty.add(n);}
      else if(c.faith!==f.id&&chance(.4)){setCell(n,f.id,1,'기적으로 개종');}
    }
  }
  a.joy=clamp(a.joy+.2,0,1);a.fervor=clamp(a.fervor+.1,0,1);
  if(warCool===0){log('miracle',`예언자 ${a.name}이(가) ${ref(i)}에서 기적을 행했습니다.`,`=MIRACLE("${a.name}", ${ref(i)})`);warCool=16;}
}

function usurp(f,rebel,ld){
  // 반역자가 지도자 자리를 노림 — 충성/세력 대결
  const power=rebel.ambition+rebel.zeal*.5+rnd(0,1);
  const hold=ld.loyalty*.3+(ld.role==='prophet'?.8:.4)+f.devotion*.01+rnd(0,1);
  if(power>hold){
    ld.alive= ld.role==='prophet'? (chance(.5)?false:true) : false;
    if(!ld.alive&&ld.cell>=0){cells[ld.cell].agent=null;dirty.add(ld.cell);}
    rebel.role='prophet';rebel.joy=clamp(rebel.joy+.3,0,1);rebel.grievance=0;
    log('betray',`${rebel.name}이(가) ${f.name}의 권좌를 찬탈했습니다.`,`=COUP("${rebel.name}" ⇒ "${f.name}")`);
    // 교리 노선 변경
    f.doctrine=newDoctrine(rebel.creed);
  } else {
    rebel.alive=false;if(rebel.cell>=0){cells[rebel.cell].agent=null;dirty.add(rebel.cell);}
    log('agent',`${f.name}의 반역 ${rebel.name}이(가) 진압되었습니다.`,`=SUPPRESS("${rebel.name}")`);
    ld.anger=clamp(ld.anger+.1,0,1);
  }
}

// ---- 분열(Schism): 창발의 절정 ----
function checkSchism(f){
  if(f.size<5)return;
  // 분열 후보: 야망·회의 높고 사적 교리가 본교와 멀어진 인물
  for(const a of f.agents){
    if(!a.alive)continue;
    if(a.role!=='cleric'&&a.role!=='hierarch'&&a.role!=='heretic')continue;
    const dist=docDist(a.creed,f.doctrine);
    const drive=dist*1.6 + a.ambition*.55 + a.grievance*.35 + a.doubt*.45 - f.golden*.004;
    if(dist>.36 && drive>.95 && chance(.12+a.ambition*.15)){
      // 추종 영토 확보: 인접한 본교 칸 일부가 따라감
      const flock=[]; const seen=new Set();
      const seed=a.cell>=0?a.cell:pick(f.cells);
      const stack=[seed];
      while(stack.length&&flock.length<Math.max(2,(f.size*rnd(.18,.42))|0)){
        const i=stack.pop();if(seen.has(i))continue;seen.add(i);
        if(cells[i].faith===f.id){flock.push(i);for(const n of nbrs(i))if(!seen.has(n)&&cells[n].faith===f.id&&chance(.7))stack.push(n);}
      }
      if(flock.length<2)continue;
      // 새 분파 탄생
      const child=newFaith(newDoctrine(a.creed),f);
      child.glyph=f.glyph; // 같은 뿌리의 변형
      const reason= a.doubt>a.ambition?'교리 해석 차이':'권력 다툼';
      for(const i of flock){cells[i].faith=child.id;cells[i].devout=Math.max(1,cells[i].devout-1);
        cells[i].holy=false;cells[i].hist.push('분파 가담');cells[i].unrest=0;dirty.add(i);}
      a.role='prophet';a.faith=child.id;a.joy=clamp(a.joy+.2,0,1);a.grievance=0;
      a.cell=flock[0];cells[flock[0]].agent=a;
      // 인물 일부도 따라감
      const followers=f.agents.filter(x=>x.alive&&x!==a&&docDist(x.creed,a.creed)<.3&&chance(.5));
      child.agents.push(a);
      for(const fol of followers){fol.faith=child.id;child.agents.push(fol);}
      f.agents=f.agents.filter(x=>x.role!=='prophet'||x===leaderOf(f)).filter(x=>!child.agents.includes(x));
      f.schismDebt++;
      lineage.push({y:year,child:child.name,parent:f.name,reason,doc:child.doctrine.slice(),
        childColor:child.color,parentColor:f.color,tenet:docTenet(child.doctrine)});
      log('schism',`${f.name}에서 "${child.name}"이(가) 분열되어 나왔습니다. (${reason})`,
        `=SCHISM("${f.name}" ⊕ "${child.name}", "${docTenet(child.doctrine)}")`);
      // 모교 잔여 분노 → 향후 형제 전쟁의 씨앗
      const ld=leaderOf(f);if(ld){ld.anger=clamp(ld.anger+.25,0,1);remember(ld,'분열을 겪다',-2);}
      break; // 한 틱 한 번만
    }
  }
  // 개혁(Reform): 분열 직전 회의 누적을 교리 자체 수정으로 흡수
  if(f.schismDebt>=2 && chance(.01)){
    f.doctrine=newDoctrine(f.doctrine);f.schismDebt=Math.max(0,f.schismDebt-1);
    const ld=leaderOf(f);if(ld)ld.joy=clamp(ld.joy+.1,0,1);
    log('reform',`${f.name}이(가) 교리를 개혁해 내부 갈등을 봉합했습니다.`,`=REFORM("${f.name}", "${docTenet(f.doctrine)}")`);
  }
}

function communityGrowth(f){
  // 인물 없는 변경 신도들의 완만한 자생적 확장
  if(!f.cells.length)return;
  const tries=1+(f.size*.05|0);
  for(let t=0;t<tries;t++){
    const src=pick(f.cells);
    const tg=pick(nbrs(src));const c=cells[tg];
    if(c.st==='water'||c.st==='ruin')continue;
    if(c.faith===null&&chance(c.st==='mount'?.06:.2)){
      if(c.st==='mount')c.st='land';
      setCell(tg,f.id,1,'정착');
    }
  }
}

// ---- 세계 사건: 인물 감정의 외부 입력 ----
function worldEvents(){
  const r=R();
  if(r<.003){ // 기근/재앙 → 슬픔↑, 신앙 동요
    const f=pick(faiths);if(f&&f.cells.length){const i=pick(f.cells);cells[i].unrest=clamp(cells[i].unrest+.5,0,1);
      for(const a of f.agents)if(a.alive)a.sorrow=clamp(a.sorrow+.1,0,1);
      log('agent',`${f.name}의 땅 ${ref(i)}에 기근이 닥쳐 신앙이 흔들립니다.`,`=FAMINE("${f.name}", ${ref(i)})`);}
  } else if(r>.997){ // 계시 → 무작위 인물 열망 폭발
    if(allAgents.length){const a=pick(allAgents);a.fervor=clamp(a.fervor+.4,0,1);a.joy=clamp(a.joy+.2,0,1);
      remember(a,'계시를 받다',2);
      log('miracle',`${TITLE[a.role]} ${a.name}이(가) 천상의 계시를 받았다고 선포했습니다.`,`=REVELATION("${a.name}")`);}
  } else if(r>.994&&r<=.997){ // 형제 전쟁 촉발 — 같은 뿌리끼리 적개심
    const pair=faiths.filter(f=>f.parent!==null);
    if(pair.length){const f=pick(pair);const ld=leaderOf(f);if(ld)ld.anger=clamp(ld.anger+.3,0,1);}
  }
}

// ---- 예언자 강림(신앙 탄생) ----
function spawnProphet(announce,msg){
  // 빈 땅 찾기
  let cell=-1;
  for(let t=0;t<300;t++){const i=R()*N|0;if(cells[i].st==='land'&&cells[i].faith===null){cell=i;break;}}
  if(cell<0){for(let i=0;i<N;i++)if(cells[i].st==='land'&&cells[i].faith===null){cell=i;break;}}
  if(cell<0)return null;
  const f=newFaith(newDoctrine(),null);
  const p=newAgent('prophet',f.id,f.doctrine);
  p.zeal=rnd(.6,1);p.fervor=.7;p.cell=cell;
  f.agents.push(p);
  setCell(cell,f.id,2,'예언자 강림',p);
  cells[cell].holy=true;
  if(announce||msg){
    log('birth',msg||`${f.name}이(가) 창시되었습니다.`,`=PROPHET("${p.name}" ⇒ "${f.name}", ${ref(cell)})`);
  }
  return f;
}

// ============================================================================
//  UI 렌더링
// ============================================================================
function renderStatus(pop){
  const ec=KIND_COLOR[lastEvent.kind]||'#eaf6ee';
  statusbar.innerHTML=`<span>준비</span><span class="sep">|</span>서기 ${year}년<span class="sep">|</span>`+
    `세계 신도 ${pop.toLocaleString()}명<span class="sep">|</span>신앙 ${faiths.length}곳<span class="sep">|</span>`+
    `인물 ${allAgents.length}명<span class="sep">|</span><span class="ev">${lastEvent.msg}</span>`;
}

function renderFaiths(){
  const sorted=[...faiths].sort((a,b)=>b.size-a.size);
  let h='';
  for(const f of sorted){
    const ld=leaderOf(f);
    const roles={};for(const a of f.agents)if(a.alive)roles[a.role]=(roles[a.role]||0)+1;
    const rstr=Object.entries(roles).map(([r,n])=>`${TITLE[r]||r}${n}`).join(' ');
    const total=Math.max(1,faiths.reduce((s,x)=>s+x.size,0));
    h+=`<div class="frow${f.id===selFaith?' sel':''}" data-f="${f.id}">`+
      `<div class="fn"><span class="sw" style="background:${f.color}"></span>${f.glyph} ${f.name}${f.golden?' ✦황금기':''}${f.parent!==null?' <span style="color:#9333ea;font-size:8px">⑂분파</span>':''}</div>`+
      `<div class="stat">영토 ${f.size}칸 · 신앙도 ${f.devotion} · ${ld?TITLE[ld.role]+' '+ld.name:'지도자 공백'}</div>`+
      `<div class="bar"><i style="width:${Math.round(f.size/total*100)}%;background:${f.color}"></i></div>`+
      `<div class="doc">"${docTenet(f.doctrine)}" · ${rstr||'신도뿐'}</div>`+
      `</div>`;
  }
  if(deadFaiths.length){
    h+=`<div style="font-size:9px;color:#999;margin:6px 4px 2px;font-weight:600">사멸한 신앙</div>`;
    for(const d of deadFaiths.slice(-3))h+=`<div class="frow dead"><div class="fn">† ${d.name}</div><div class="stat">서기 ${d.from}–${d.to}년 · ${d.cause}</div></div>`;
  }
  faithsEl.innerHTML=h;
}

function renderLog(){
  const items=chronicle.filter(e=>{
    if(logFilter==='all')return true;
    if(logFilter==='schism')return e.kind==='schism'||e.kind==='reform'||e.kind==='betray';
    if(logFilter==='war')return e.kind==='war';
    if(logFilter==='agent')return e.kind==='agent'||e.kind==='birth'||e.kind==='miracle';
    return true;
  }).slice(-60).reverse();
  let h='';
  for(const e of items){
    h+=`<div class="le"><span class="y">${e.y}</span><span><b style="color:${KIND_COLOR[e.kind]||'#333'}">${e.msg}</b></span></div>`;
  }
  logEl.innerHTML=h;
}

// ============================================================================
//  오버레이 시트(연대기 / 교리계보 / 멸망기록)
// ============================================================================
function renderOverlay(tab){
  if(tab==='chron'){
    ovttl.textContent='📜 연대기 (Sheet: 연대기)';
    let h='<table class="ot"><thead><tr><th style="width:70px">서기</th><th style="width:90px">분류</th><th>사건</th><th style="width:230px">수식</th></tr></thead><tbody>';
    for(const e of [...chronicle].reverse().slice(0,200)){
      h+=`<tr><td>${e.y}년</td><td><span class="pill" style="background:${KIND_COLOR[e.kind]||'#888'}">${({birth:'창시',schism:'분열',war:'성전',convert:'개종',death:'멸망',miracle:'기적',agent:'인물',reform:'개혁',betray:'반역'})[e.kind]||e.kind}</span></td><td>${e.msg}</td><td style="font-family:Consolas,monospace;font-size:10px;color:#555">${(e.formula||'').replace(/</g,'&lt;')}</td></tr>`;
    }
    h+='</tbody></table>';ovbody.innerHTML=h;
  } else if(tab==='lineage'){
    ovttl.textContent='⑂ 교리계보 (Sheet: 교리계보) — 신앙의 분열 가계도';
    let h='<table class="ot"><thead><tr><th style="width:70px">서기</th><th>모교(母敎)</th><th>분파</th><th style="width:120px">분열 원인</th><th>새 신조</th><th>교리 벡터</th></tr></thead><tbody>';
    if(!lineage.length)h+='<tr><td colspan="6" style="color:#999;text-align:center;padding:14px">아직 분열이 일어나지 않았습니다. 교리가 표류하며 갈등이 무르익는 중입니다…</td></tr>';
    for(const l of [...lineage].reverse()){
      const vec=l.doc.map((v,i)=>`${AXES[i]}:${v.toFixed(2)}`).join('  ');
      h+=`<tr><td>${l.y}년</td><td><span class="pill" style="background:${l.parentColor}">&nbsp;</span> ${l.parent}</td>`+
        `<td><span class="pill" style="background:${l.childColor}">&nbsp;</span> ${l.child}</td><td>${l.reason}</td>`+
        `<td><i>"${l.tenet}"</i></td><td style="font-family:Consolas,monospace;font-size:9.5px;color:#666">${vec}</td></tr>`;
    }
    h+='</tbody></table>';
    // 현존 신앙 교리 비교표
    h+='<div style="padding:10px 16px 4px;font-weight:600;color:#107c41">현존 신앙 교리 좌표</div>';
    h+='<table class="ot"><thead><tr><th>신앙</th>'+AXES.map(a=>`<th>${a}</th>`).join('')+'<th>핵심 신조</th></tr></thead><tbody>';
    for(const f of faiths){h+=`<tr><td><span class="pill" style="background:${f.color}">${f.glyph}</span> ${f.name}</td>`+
      f.doctrine.map(v=>`<td style="background:rgba(16,124,65,${v*.4});font-family:monospace">${v.toFixed(2)}</td>`).join('')+
      `<td><i>"${docTenet(f.doctrine)}"</i></td></tr>`;}
    h+='</tbody></table>';
    ovbody.innerHTML=h;
  } else if(tab==='dead'){
    ovttl.textContent=`† 멸망기록 (Sheet: 멸망기록 ${deadFaiths.length}건)`;
    let h='<table class="ot"><thead><tr><th style="width:90px">존속</th><th>사멸한 신앙</th><th style="width:90px">최대 영토</th><th>사인(死因)</th></tr></thead><tbody>';
    if(!deadFaiths.length)h+='<tr><td colspan="4" style="color:#999;text-align:center;padding:14px">아직 사멸한 신앙이 없습니다.</td></tr>';
    for(const d of [...deadFaiths].reverse())h+=`<tr><td>${d.from}–${d.to}년</td><td><span class="pill" style="background:${d.color}">&nbsp;</span> ${d.name}</td><td>${d.peak}칸</td><td>${d.cause}</td></tr>`;
    h+='</tbody></table>';ovbody.innerHTML=h;
  }
}

// ============================================================================
//  상호작용
// ============================================================================
sheet.addEventListener('click',e=>{
  const t=e.target.closest('.cell');if(!t)return;
  if(selected>=0){cellEls[selected].classList.remove('sel');paint(selected);}
  selected=+t.dataset.i;t.classList.add('sel');
  const c=cells[selected];nb.textContent=ref(selected);
  // 클릭 = 개입: 빈 땅이면 그곳에 예언자 강림 가능 안내, 신앙 칸이면 역사
  if(c.agent){
    const a=c.agent;
    fmla.textContent=`=AGENT("${a.name}", ${TITLE[a.role]}, 감정:${emoState(a)})`;
  } else if(c.faith!==null){
    fmla.textContent=`=HISTORY(${ref(selected)}: ${c.hist.map(x=>`"${x}"`).join(' → ')})`;
  } else if(c.st==='land'){
    fmla.textContent=`=EMPTY(${ref(selected)}) — 클릭 유지 시 [＋ 예언자 강림]으로 이곳에 신앙을 세울 수 있습니다`;
  } else {
    fmla.textContent=`=TERRAIN(${ref(selected)}: ${c.st==='water'?'바다':c.st==='mount'?'산악':'폐허'})`;
  }
});

// 셀 hover → 인물/땅 정보 툴팁
sheet.addEventListener('mousemove',e=>{
  const t=e.target.closest('.cell');if(!t){tip.style.display='none';return;}
  const i=+t.dataset.i,c=cells[i];
  let h='';
  if(c.agent){
    const a=c.agent,f=facById(a.faith);
    h=`<b>${TITLE[a.role]} ${a.name}</b> <span style="color:#888">(${f?f.name:'?'})</span><br>`+
      `감정: <span class="em">${emoState(a)}</span> · 열정${(a.zeal*10|0)} 야망${(a.ambition*10|0)} 회의${(a.doubt*10|0)} 충성${(a.loyalty*10|0)}<br>`+
      `기쁨${(a.joy*10|0)} 분노${(a.anger*10|0)} 슬픔${(a.sorrow*10|0)} 원한${a.grievance.toFixed(1)}`+
      (a.mem.length?`<br><span style="color:#aaa">기억: ${a.mem.slice(-2).map(m=>m.what).join(', ')}</span>`:'');
  } else if(c.faith!==null){
    const f=facById(c.faith);
    h=`<b>${ref(i)}</b> — ${f?f.name:'?'}<br>신앙도 ${['','신도','회당','사원','대성당'][c.devout]}`+
      (c.unrest>.3?` · <span style="color:#ff8a8a">불안 ${(c.unrest*10|0)}</span>`:'')+
      `<br><span style="color:#aaa">${c.hist.slice(-3).join(' → ')}</span>`;
  } else if(c.st==='land'){h=`<b>${ref(i)}</b> — 미개척지`;}
  else { tip.style.display='none'; return; }
  tip.innerHTML=h;tip.style.display='block';
  const wrap=$('sheetwrap').getBoundingClientRect();
  let x=e.clientX-wrap.left+14,y=e.clientY-wrap.top+12;
  if(x+250>wrap.width)x=e.clientX-wrap.left-250;
  if(y+90>wrap.height)y=e.clientY-wrap.top-90;
  tip.style.left=x+'px';tip.style.top=y+'px';
});
sheet.addEventListener('mouseleave',()=>tip.style.display='none');

// 사이드 신앙 클릭 → 영토 강조
faithsEl.addEventListener('click',e=>{
  const r=e.target.closest('.frow[data-f]');if(!r)return;
  const id=+r.dataset.f;selFaith=selFaith===id?-1:id;renderFaiths();
  // 깜빡 강조
  const f=facById(id);if(f)for(const i of f.cells)flashMiracle(i);
});

// 로그 필터 탭
$('logtabs').addEventListener('click',e=>{
  const d=e.target.closest('div[data-l]');if(!d)return;
  [...$('logtabs').children].forEach(x=>x.classList.toggle('on',x===d));
  logFilter=d.dataset.l;renderLog();
});

// 시트 탭 전환
$('tabs').addEventListener('click',e=>{
  const d=e.target.closest('div[data-tab]');if(!d)return;
  curTab=d.dataset.tab;
  [...$('tabs').querySelectorAll('div[data-tab]')].forEach(x=>x.classList.toggle('on',x===d));
  if(curTab==='sheet'){overlay.classList.remove('show');}
  else{overlay.classList.add('show');renderOverlay(curTab);}
});

// 컨트롤
let timer=null;
function reschedule(){if(timer)clearInterval(timer);timer=setInterval(()=>{if(!paused)tick();},Math.round(120/speed));}
$('btnPause').addEventListener('click',()=>{paused=!paused;$('btnPause').textContent=paused?'▶ 재생':'⏸ 정지';$('btnPause').classList.toggle('act',paused);});
$('btnSpeed').addEventListener('click',()=>{speed=speed>=4?1:speed*2;$('btnSpeed').textContent=`속도 ${speed}×`;reschedule();});
$('btnSeed').addEventListener('click',()=>{
  // 선택된 빈 땅이 있으면 그곳에, 없으면 무작위
  let f;
  if(selected>=0&&cells[selected].st==='land'&&cells[selected].faith===null){
    const fa=newFaith(newDoctrine(),null);const p=newAgent('prophet',fa.id,fa.doctrine);
    p.zeal=rnd(.6,1);p.fervor=.7;p.cell=selected;fa.agents.push(p);
    setCell(selected,fa.id,2,'예언자 강림(개입)',p);cells[selected].holy=true;f=fa;
    log('birth',`당신의 부름으로 ${fa.name}이(가) ${ref(selected)}에 세워졌습니다.`,`=INVOKE.PROPHET("${p.name}", ${ref(selected)})`);
    paint(selected);
  } else {
    f=spawnProphet(true);
  }
  renderFaiths();
});

// ============================================================================
//  부트스트랩
// ============================================================================
for(let i=0;i<N;i++)paint(i);
fmla.textContent=`=SIM.FAITH($A$1:$${colName(COLS-1)}$${ROWS}, "믿음은 갈라지며 자란다")`;
// 초기 예언자 3명 (각자 다른 교리 → 자연 분화 시작)
spawnProphet(true);spawnProphet(true);spawnProphet(true);
renderFaiths();renderLog();renderStatus(0);
reschedule();

// 리사이즈 시 안내(재배치는 새로고침)
window.addEventListener('resize',()=>{},{passive:true});
})();
</script>
