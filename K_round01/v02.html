<!DOCTYPE html>
<html lang="ko">
<head>

<title>야전군.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:none}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:14px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;flex:none;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px;flex:none}
  #namebox{width:84px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;flex:none;font-size:11px}
  #fx{width:26px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif;flex:none}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #main{flex:1;position:relative;overflow:hidden;background:#fff}
  #sheetwrap{position:absolute;inset:0;overflow:hidden;background:#fff}
  .grid{display:grid;background:#fff;width:max-content}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:10px}
  .cell{border-right:1px solid #e6e6e6;border-bottom:1px solid #e6e6e6;
    display:flex;align-items:center;justify-content:center;font-size:12px;
    overflow:hidden;cursor:cell;position:relative;line-height:1}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:3}
  .cell .em{position:absolute;top:0;right:1px;font-size:7px;line-height:1;opacity:.95}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #ff4d4d}50%{box-shadow:inset 0 0 0 2px #ffd2d2}}
  .clash{animation:warf .3s 3}
  @keyframes muti{0%,100%{background:#000}50%{background:#ffec80}}
  .mutflash{animation:muti .25s 4}
  /* side panel */
  #panels{position:absolute;top:6px;right:8px;width:236px;z-index:6;display:flex;flex-direction:column;gap:6px}
  .pnl{background:#fffdf2;border:1px solid #d8c66a;box-shadow:2px 3px 9px rgba(0,0,0,.16);
    padding:7px 9px;font-size:10.5px;line-height:1.6}
  .pnl h4{margin:0 0 4px;font-size:10.5px;color:#7a6a1f;letter-spacing:.3px;display:flex;justify-content:space-between}
  .pnl .row{display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
  .sw{display:inline-block;width:9px;height:9px;border-radius:2px;flex:none}
  .bar{height:5px;background:#e7e2c8;border-radius:3px;flex:1;overflow:hidden;min-width:24px}
  .bar i{display:block;height:100%}
  .dead{color:#a33;font-size:10px}
  .muted{color:#998}
  /* inspector */
  #insp{display:none}
  #insp.show{display:block}
  #insp .k{color:#857640;display:inline-block;width:52px}
  #insp .mood{font-weight:700}
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:18px;
    border-top:1px solid #d4d4d4;font-size:11px;flex:none;gap:2px;overflow-x:auto}
  #tabs div{padding:3px 11px;border:1px solid #d4d4d4;border-bottom:none;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap;flex:none}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11px;flex:none;white-space:nowrap;overflow:hidden}
  #statusbar .sep{margin:0 9px;opacity:.5}
  #statusbar b{font-weight:700;color:#fff}
  /* alt views (chronicle / command tree / mutiny) */
  .sheetview{position:absolute;inset:0;background:#fff;overflow:auto;display:none;padding:0}
  .sheetview.on{display:block}
  table.x{border-collapse:collapse;font-size:11px;width:100%}
  table.x th{background:#f5f5f5;border:1px solid #d0d0d0;padding:3px 8px;color:#555;
    font-weight:600;position:sticky;top:0;text-align:left;font-size:10.5px}
  table.x td{border:1px solid #e6e6e6;padding:3px 8px;vertical-align:top}
  table.x .rn{background:#f5f5f5;text-align:center;color:#888;width:34px;font-size:10px}
  .tag{display:inline-block;padding:0 5px;border-radius:3px;font-size:10px;font-weight:700;color:#fff}
  #ctree{padding:10px 16px;font-family:Consolas,Menlo,monospace;font-size:11.5px;line-height:1.55;white-space:pre}
  .help{position:absolute;left:12px;bottom:8px;z-index:6;font-size:10px;color:#9a9a8a;
    background:rgba(255,255,255,.82);padding:3px 8px;border-radius:4px;border:1px solid #e4e0cf}
  @media (max-width:560px){
    #panels{width:152px}
    .pnl{font-size:9.5px;padding:5px 6px}
    #namebox{width:62px}
  }
</style>

<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <span id="titletext">야전군.xlsx - Excel</span>
  </div>
  <div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>지휘</i><i>수식</i><i>전황</i><i>검토</i><i>보기</i></div>
  <div id="fbar">
    <div id="namebox">A1</div>
    <div id="fx">fx</div>
    <div id="formula"></div>
  </div>
  <div id="main">
    <div id="sheetwrap"><div id="sheet" class="grid"></div></div>

    <div class="sheetview" id="view-chron">
      <table class="x" id="chrontbl"><thead><tr><th class="rn">#</th><th style="width:64px">시각</th><th>전황 기록 (=CHRONICLE)</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="sheetview" id="view-tree"><div id="ctree"></div></div>
    <div class="sheetview" id="view-muti">
      <table class="x" id="mutitbl"><thead><tr><th class="rn">#</th><th style="width:60px">시각</th><th style="width:130px">항명/하극상</th><th>전말 (=INSUBORDINATION)</th></tr></thead><tbody></tbody></table>
    </div>

    <div id="panels">
      <div class="pnl" id="pnl-force"><h4>군세 현황</h4><div id="forcebody"></div></div>
      <div class="pnl" id="insp"><h4><span>개체 정찰</span><span class="muted" id="insp-ref"></span></h4><div id="inspbody"></div></div>
    </div>
    <div class="help">셀 클릭 = 그 병사의 마음·기억 정찰 · 명령셀 클릭 = 친정(직접 명령 하달)</div>
  </div>

  <div id="tabs">
    <div class="on" data-v="sheet">전장</div>
    <div data-v="tree">지휘체계</div>
    <div data-v="chron">연대기</div>
    <div data-v="muti" id="tab-muti">항명기록 (0)</div>
  </div>
  <div id="statusbar"></div>
</div>

<script>
(() => {
"use strict";
/* =========================================================================
   야전군.xlsx — 창발적 군대 지휘 시뮬레이션
   엑셀 위장 + 셀=전장 + 수식바=명령/해석 + 시트=연대기/지휘체계/항명기록
   각 개체는 자율 에이전트: 성격·감정·기억·소속을 가지고 스스로 판단.
   명령은 위계를 타고 내려가며, 각 부하가 '해석'한다 → 복종/태업/항명/하극상.
   대본 없음. 매 실행 다른 역사.
   ========================================================================= */

const $ = s => document.querySelector(s);
const rnd = () => Math.random();
const ri = n => (Math.random()*n)|0;
const pick = a => a[ri(a.length)];
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- 그리드 크기 (반응형 1440 / 390) ---------- */
const W = innerWidth, H = innerHeight;
const CW = W < 560 ? 24 : 30, CH = W < 560 ? 22 : 22;
const COLS = clamp(Math.floor((W - 18) / CW), 14, 44);
const ROWS = clamp(Math.floor((H - 168) / CH), 12, 30);
const N = COLS * ROWS;

const sheet = $('#sheet');
const fmla = $('#formula');
const namebox = $('#namebox');
const statusbar = $('#statusbar');
sheet.style.gridTemplateColumns = `40px repeat(${COLS}, ${CW}px)`;
sheet.style.gridAutoRows = CH + 'px';

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(((i/COLS)|0)+1);}

/* ---------- DOM 셀 ---------- */
const cellEls = new Array(N);
{
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd';h.textContent=colName(c);frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd';h.textContent=r+1;frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';const i=r*COLS+c;d.dataset.i=i;
      const em=document.createElement('span');em.className='em';d.appendChild(em);
      cellEls[i]=d;frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}
function xy(i){return [i%COLS, (i/COLS)|0];}
function idx(x,y){return y*COLS+x;}
function inb(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS;}
function nbrs(i){const [x,y]=xy(i);const o=[];if(x>0)o.push(i-1);if(x<COLS-1)o.push(i+1);if(y>0)o.push(i-COLS);if(y<ROWS-1)o.push(i+COLS);return o;}
function dist(a,b){const[ax,ay]=xy(a),[bx,by]=xy(b);return Math.abs(ax-bx)+Math.abs(ay-by);}

/* ---------- 지형: 강·숲·고지 (해석/사기에 영향) ---------- */
const TERR = new Array(N);
{
  const GW=7,GH=5,gz=[];for(let i=0;i<GW*GH;i++)gz[i]=rnd();
  const noise=(x,y)=>{
    const fx=x/COLS*(GW-1),fy=y/ROWS*(GH-1);
    const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
    const a=gz[y0*GW+x0],b=gz[y0*GW+Math.min(GW-1,x0+1)];
    const c=gz[Math.min(GH-1,y0+1)*GW+x0],d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
    return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
  };
  for(let i=0;i<N;i++){
    const [x,y]=xy(i);const v=noise(x,y)+(rnd()-.5)*.12;
    let t='평지';
    if(v<.28) t='강';
    else if(v>.70 && rnd()<.65) t='숲';
    else if(v>.60 && rnd()<.45) t='고지';
    TERR[i]=t;
  }
}
const TERR_GLYPH={강:'≈',숲:'木',고지:'⛰'};
const TERR_COL={강:'#9dc3e6',숲:'#7aa45a',고지:'#b39b6e',평지:''};

/* ---------- 진영 ---------- */
const ARMIES = [
  {name:'백호군', col:'#2563eb', glyph:'白', motto:'질서'},
  {name:'주작군', col:'#dc2626', glyph:'朱', motto:'영광'},
  {name:'현무군', col:'#0d9488', glyph:'玄', motto:'생존'},
];
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}

/* ---------- 계급 ---------- */
// 0 총사령관, 1 장군, 2 대장, 3 병사
const RANK_NAME=['총사령관','장군','대장','병사'];
const RANK_GLYPH=['帥','将','隊','卒'];
const RANK_SIZE=[16,14,12.5,11.5];

/* ---------- 명령 어휘 ---------- */
const ORDERS = {
  HOLD:   {kw:'사수하라',  fx:'=HOLD',    aggr:-0.3, risk:-0.2},
  ADVANCE:{kw:'진격하라',  fx:'=ADVANCE', aggr:+0.6, risk:+0.4},
  CHARGE: {kw:'돌격하라',  fx:'=CHARGE',  aggr:+1.0, risk:+0.9},
  FLANK:  {kw:'우회하라',  fx:'=FLANK',   aggr:+0.4, risk:+0.2},
  RETREAT:{kw:'후퇴하라',  fx:'=RETREAT', aggr:-0.8, risk:-0.6},
  SCORCH: {kw:'초토화하라',fx:'=SCORCH',  aggr:+0.9, risk:+0.7}, // 잔혹 명령 — 반발 큼
  REGROUP:{kw:'재정비하라',fx:'=REGROUP', aggr:-0.1, risk:-0.3},
};
const ORDER_KEYS = Object.keys(ORDERS);

/* =========================================================================
   에이전트 (병사/장교) — 성격·감정·기억·소속
   ========================================================================= */
let UID = 0;
const AGENTS = new Map();   // uid -> agent
const OCC = new Array(N).fill(-1); // cell -> uid (-1 empty)

function newAgent(armyId, rank, cell){
  // 성격(0~1): 충성·야망·용맹·신중·잔혹
  const loyal  = clamp(0.45 + (rnd()-.5)*0.9, 0.02, 0.99);
  const ambit  = clamp(0.40 + (rnd()-.5)*0.9, 0.02, 0.99);
  const valor  = clamp(0.50 + (rnd()-.5)*0.9, 0.02, 0.99);
  const cautn  = clamp(0.50 + (rnd()-.5)*0.9, 0.02, 0.99);
  const cruel  = clamp(0.30 + (rnd()-.5)*0.8, 0.02, 0.99);
  const a = {
    uid: UID++, army: armyId, rank, cell,
    p:{loyal,ambit,valor,cautn,cruel},
    // 감정 (창발) — 사기·분노·공포·슬픔·즐거움
    e:{morale:0.55+(rnd()-.5)*0.15, anger:0.05, fear:0.10, grief:0.0, joy:0.10},
    superior: -1,        // 상관 uid
    order: 'HOLD',       // 현재 받은(해석한) 명령
    orderFrom: -1,       // 명령자 uid
    trust: new Map(),    // 상관 uid -> 신뢰(0~1)
    mem: [],             // 기억(최근 사건 문자열)
    grudge: new Map(),   // 적/상관 uid -> 원한
    kills:0, hp: 2 + (rank===3?0:1) + (valor>0.7?1:0),
    deserter:false, age:0, lastAct:'주둔',
    name: null,
  };
  AGENTS.set(a.uid, a);
  OCC[cell] = a.uid;
  return a;
}
function remember(a, txt){ a.mem.push(txt); if(a.mem.length>6) a.mem.shift(); }

/* 성격 한 줄 묘사 (정찰 패널용) */
function personaText(p){
  const t=[];
  t.push(p.loyal>0.66?'충직':p.loyal<0.34?'불충':'중도');
  t.push(p.ambit>0.66?'야심가':p.ambit<0.34?'무욕':'평범');
  t.push(p.valor>0.66?'용맹':p.valor<0.34?'겁많음':'침착');
  if(p.cruel>0.72) t.push('잔혹');
  return t.join('·');
}
/* 지배 감정 → 라벨/이모지 (창발 표시) */
function moodOf(a){
  const e=a.e;
  const m=[['분노',e.anger,'😠','#c0392b'],['공포',e.fear,'😨','#8e44ad'],
           ['슬픔',e.grief,'😢','#2c3e50'],['즐거움',e.joy,'😄','#27ae60'],
           ['평정',Math.max(0,0.42-e.anger-e.fear-e.grief),'😐','#777']];
  m.sort((x,y)=>y[1]-x[1]);
  return {label:m[0][0], emoji:m[0][2], col:m[0][3], val:m[0][1]};
}

/* =========================================================================
   진영 상태
   ========================================================================= */
const armies = [];
function initArmy(spec){
  return {...spec, id:armies.length, alive:true, commander:-1,
    units:new Set(), generals:[], casualties:0, mutinies:0,
    standingOrder:'HOLD', founded:1, sentiment:0.55};
}

/* 진영 배치: 한쪽 모서리 근처에 군집 */
function deployArmy(spec, originX, originY){
  const A = initArmy(spec);
  armies.push(A);
  const placed=[];
  // 후보 셀(강 제외, 비점유) 모으기 — origin 근처 우선
  const cands=[];
  for(let i=0;i<N;i++){ if(TERR[i]==='강'||OCC[i]>=0) continue; const[x,y]=xy(i); cands.push([i, Math.abs(x-originX)+Math.abs(y-originY)+rnd()*2]); }
  cands.sort((a,b)=>a[1]-b[1]);
  const target = Math.max(10, Math.floor(N*0.10));
  for(const [i] of cands){ if(placed.length>=target) break; placed.push(i); }
  if(!placed.length) return A;

  // 총사령관 1
  const cmdCell = placed[ri(Math.min(3,placed.length))];
  const cmd = newAgent(A.id, 0, cmdCell);
  cmd.name = '총사령관 '+pick(['묵','한','윤','적','강','벽']);
  cmd.e.morale=0.7; A.commander=cmd.uid; A.units.add(cmd.uid);
  // 장군 2~3
  const nGen = 2 + ri(2);
  const used=new Set([cmdCell]);
  for(let g=0; g<nGen; g++){
    const c = placed.find(c=>!used.has(c)); if(c===undefined) break; used.add(c);
    const gen = newAgent(A.id, 1, c);
    gen.name='장군 '+pick(['창','진','호','량','무','철','단','경'])+pick(['','우','명','석']);
    gen.superior=cmd.uid; gen.trust.set(cmd.uid, clamp(gen.p.loyal+0.15,0,1));
    A.generals.push(gen.uid); A.units.add(gen.uid);
  }
  // 나머지 병력 = 대장/병사, 각자 가장 가까운 장군 휘하
  const genCells = A.generals.map(u=>AGENTS.get(u).cell);
  let capCount=0;
  for(const c of placed){
    if(used.has(c)) continue; used.add(c);
    // 가까운 장군 찾기
    let bg=-1, bd=1e9;
    for(const gu of A.generals){ const d=dist(c, AGENTS.get(gu).cell); if(d<bd){bd=d;bg=gu;} }
    if(bg<0) bg=cmd.uid;
    // 약 1/4은 대장
    const rank = (capCount<Math.ceil(placed.length*0.22) && rnd()<0.6) ? 2 : 3;
    if(rank===2) capCount++;
    const u = newAgent(A.id, rank, c);
    u.superior=bg; u.trust.set(bg, clamp(u.p.loyal+(rnd()-.5)*0.3,0,1));
    A.units.add(u.uid);
  }
  // 대장 휘하로 병사 일부 재배속 (3계층 위계)
  const caps = [...A.units].map(u=>AGENTS.get(u)).filter(a=>a.rank===2);
  const sols = [...A.units].map(u=>AGENTS.get(u)).filter(a=>a.rank===3);
  for(const s of sols){
    let bc=-1,bd=1e9;
    for(const c of caps){ const d=dist(s.cell,c.cell); if(d<bd){bd=d;bc=c.uid;} }
    if(bc>=0 && bd<=6){ s.superior=bc; s.trust=new Map([[bc, clamp(s.p.loyal+(rnd()-.5)*0.3,0,1)]]); }
  }
  return A;
}

/* =========================================================================
   로그
   ========================================================================= */
let tick=0;
const chron=[], mutiny=[];
function timeStr(){ const h=Math.floor(tick/4); return `D${Math.floor(h/24)+1} ${String(h%24).padStart(2,'0')}시`; }
function pushChron(kind, msg, fx){
  chron.push({t:timeStr(), kind, msg});
  if(chron.length>240) chron.shift();
  lastEvent=msg;
  if(fx) fmla.textContent=fx;
  dirtyChron=true;
}
function pushMutiny(short, msg){
  mutiny.push({t:timeStr(), short, msg});
  if(mutiny.length>120) mutiny.shift();
  dirtyMuti=true;
}
let lastEvent='군대가 전장에 전개되었습니다.';

/* =========================================================================
   감정 동역학 (창발) — 사건이 감정을 바꾸고, 감정이 행동을 바꾼다
   ========================================================================= */
function emoTick(a){
  const e=a.e;
  // 자연 감쇠 → 평정 회귀
  e.anger=lerp(e.anger,0.04,0.045);
  e.fear =lerp(e.fear, 0.06,0.05);
  e.grief=lerp(e.grief,0.02,0.03);
  e.joy  =lerp(e.joy,  0.08,0.04);
  // 사기: 주변 아군 밀집·상관 생존이 안정시킴
  let allies=0, enemies=0;
  for(const n of nbrs(a.cell)){ const u=OCC[n]; if(u<0)continue; const o=AGENTS.get(u); if(o.army===a.army)allies++; else enemies++; }
  e.morale += allies*0.006 - enemies*0.012 - e.fear*0.02 + e.joy*0.015;
  if(a.superior>=0 && !AGENTS.has(a.superior)) { e.morale-=0.02; e.anger+=0.01; } // 지휘 공백
  e.morale=clamp(e.morale,0.02,0.99);
  for(const k in e) e[k]=clamp(e[k],0,1);
}

/* 적 인접칸 찾기 */
function enemyNbr(a){ const o=[]; for(const n of nbrs(a.cell)){ const u=OCC[n]; if(u>=0 && AGENTS.get(u).army!==a.army) o.push(n);} return o; }
function emptyNbr(a){ const o=[]; for(const n of nbrs(a.cell)){ if(OCC[n]<0 && TERR[n]!=='강') o.push(n);} return o; }

/* =========================================================================
   명령 해석 — 핵심 창발 엔진
   상관이 명령을 내리면, 부하가 자신의 성격+감정+기억+신뢰로 '해석'한다.
   결과: 복종 / 변형복종 / 태업 / 항명 / 하극상(상관 공격) / 탈영
   ========================================================================= */
function trustOf(a){ return a.superior>=0 ? (a.trust.get(a.superior) ?? 0.4) : 0.5; }

function interpretOrder(a, order, fromUid){
  const od = ORDERS[order];
  const p=a.p, e=a.e;
  const trust = a.superior===fromUid ? trustOf(a) : 0.45;
  const grudge = a.grudge.get(fromUid) || 0;

  // 명령 수용도(compliance): 충성·신뢰·사기↑, 분노·공포·원한·야망↓
  let comply = 0.5
    + p.loyal*0.55 + trust*0.35 + e.morale*0.2
    - e.anger*0.6 - grudge*0.7 - p.ambit*0.25 - e.fear*0.25;
  // 위험한 명령은 겁많고 신중한 자가 거부 / 용맹한 자가 선호
  comply += (p.valor-0.5)*od.risk*1.2 - (p.cautn-0.5)*od.risk*0.9;
  // 잔혹 명령(초토화)은 잔혹성 낮으면 도덕적 반발
  if(order==='SCORCH') comply += (p.cruel-0.55)*1.1 - 0.15;
  // 후퇴 명령은 공포 높을수록 잘 따름
  if(order==='RETREAT') comply += e.fear*0.5;
  comply = clamp(comply, 0, 1);

  // 야망+낮은 충성+높은 분노 → 하극상 위험
  const coupRisk = clamp(p.ambit*0.5 + e.anger*0.5 + grudge*0.6 - p.loyal*0.7 - trust*0.4, 0, 1);

  const roll = rnd();
  let reaction, newOrder=order, defect=false, coup=false;
  if(coupRisk>0.62 && roll>0.80 && a.rank<3){
    reaction='하극상'; coup=true;
  } else if(comply<0.22 && roll>0.55){
    // 명령 거부 → 분노/야망 크면 탈영, 아니면 태업
    if(p.ambit>0.6 || e.fear>0.6){ reaction='탈영'; defect=true; }
    else reaction='항명';
  } else if(comply<0.45){
    // 변형 복종: 위험 명령을 안전하게 깎아 수행
    reaction='소극적 수행';
    if(order==='CHARGE') newOrder='ADVANCE';
    else if(order==='ADVANCE') newOrder='HOLD';
    else if(order==='SCORCH') newOrder='ADVANCE';
  } else if(comply>0.82 && (order==='ADVANCE'||order==='CHARGE') && p.valor>0.7){
    reaction='과잉 충성'; // 명령 이상으로 돌격
    if(order==='ADVANCE') newOrder='CHARGE';
  } else {
    reaction='복종';
  }
  a.order=newOrder; a.orderFrom=fromUid;
  return {reaction, newOrder, defect, coup, comply, coupRisk};
}

/* 상관이 부하들에게 명령 하달 → 각자 해석 */
function issueOrder(commander, order, scope){
  const od=ORDERS[order];
  const subs=[...AGENTS.values()].filter(a=>a.superior===commander.uid && a.army===commander.army);
  let obeyed=0, refused=0, couped=false;
  for(const s of subs){
    const r = interpretOrder(s, order, commander.uid);
    if(r.coup){
      doCoup(s, commander); couped=true; continue;
    }
    if(r.defect){
      desert(s, `${RANK_NAME[commander.rank]}의 '${od.kw}' 명령 거부`); refused++; continue;
    }
    if(r.reaction==='항명'){
      refused++;
      // 신뢰 하락 + 약간의 원한
      s.trust.set(commander.uid, clamp(trustOf(s)-0.12,0,1));
      s.grudge.set(commander.uid,(s.grudge.get(commander.uid)||0)+0.08);
      remember(s, `${timeStr()} ‘${od.kw}’ 거부`);
      if(rnd()<0.5) pushMutiny('항명',
        `${army(s).name} ${RANK_NAME[s.rank]}(${ref(s.cell)})이(가) ${RANK_NAME[commander.rank]}의 ‘${od.kw}’ 명령을 거부함. (충성 ${(s.p.loyal*100|0)}, 분노 ${(s.e.anger*100|0)})`);
    } else {
      obeyed++;
      if(r.reaction==='과잉 충성') remember(s,`${timeStr()} ‘${od.kw}’ 과잉수행`);
      s.lastAct = ORDERS[r.newOrder].kw;
      // 명령 충실 이행시 신뢰 소폭 상승
      s.trust.set(commander.uid, clamp(trustOf(s)+0.02,0,1));
    }
  }
  return {obeyed, refused, couped, total:subs.length};
}
function army(a){return armies[a.army];}

/* 하극상: 부하가 상관을 공격 */
function doCoup(rebel, target){
  const A=army(rebel);
  A.mutinies++;
  flashCell(target.cell,'mutflash');
  const tgtName = target.name || RANK_NAME[target.rank];
  const success = (rebel.p.valor + rebel.e.anger) > (target.p.valor + 0.6 + target.e.morale*0.4) || rnd()<0.35;
  if(success && AGENTS.has(target.uid)){
    // 상관 제거, 반란자 승급
    killAgent(target, '하극상으로 피살', false);
    const oldRank=rebel.rank;
    rebel.rank = Math.max(0, target.rank); // 자리 찬탈
    rebel.e.joy=clamp(rebel.e.joy+0.4,0,1); rebel.e.anger*=0.4;
    rebel.name = (rebel.rank===0?'찬탈자 ':'하극상 ')+pick(['패','역','광','효','난']);
    // 휘하 재편: 죽은 상관의 부하들을 반란자 휘하로 (단, 그들도 반발 가능)
    if(target.rank===0) A.commander=rebel.uid;
    for(const u of AGENTS.values()){
      if(u.army===A.id && u.superior===target.uid){
        u.superior=rebel.uid;
        // 새 상관에 대한 신뢰는 낮게 시작 + 일부는 복수심
        u.trust.set(rebel.uid, clamp(0.3-(0.5-u.p.loyal),0,1));
        if(u.p.loyal>0.6){ u.grudge.set(rebel.uid,(u.grudge.get(rebel.uid)||0)+0.5); remember(u,`${timeStr()} 상관 시해를 목격`); u.e.anger=clamp(u.e.anger+0.4,0,1);}
      }
    }
    pushMutiny('하극상 성공',
      `${A.name} ${RANK_NAME[oldRank]}(${ref(rebel.cell)})이(가) ${tgtName}을(를) 시해하고 ${RANK_NAME[rebel.rank]} 자리를 찬탈! (야망 ${(rebel.p.ambit*100|0)})`);
    pushChron('coup', `${A.name}에 하극상 발생 — ${tgtName} 피살, 권력 찬탈`, `=COUP("${A.name}", ${ref(rebel.cell)})`);
  } else {
    // 실패 → 반란자 처형 또는 탈영
    pushMutiny('하극상 실패',
      `${A.name} ${RANK_NAME[rebel.rank]}(${ref(rebel.cell)})의 ${tgtName} 시해 시도가 진압됨.`);
    if(rnd()<0.7){ killAgent(rebel,'반란 진압',false); }
    else { desert(rebel,'반란 실패 후 도주'); }
    target.e.anger=clamp(target.e.anger+0.3,0,1);
  }
}

/* 탈영 */
function desert(a, why){
  a.deserter=true;
  remember(a,`${timeStr()} 탈영: ${why}`);
  army(a).casualties++; // 전력 손실로 집계
  pushChron('desert', `${army(a).name} ${RANK_NAME[a.rank]}(${ref(a.cell)}) 탈영 — ${why}`, `=DESERT(${ref(a.cell)})`);
  removeAgent(a, true); // 전장에서 이탈(사망 아님)
}

/* 사망 처리 */
function killAgent(a, why, byEnemy){
  if(!AGENTS.has(a.uid)) return;
  const A=army(a); A.casualties++;
  // 인접 아군에 슬픔/분노 전파 (창발: 동료의 죽음이 감정을 흔든다)
  for(const n of nbrs(a.cell)){
    const u=OCC[n]; if(u<0) continue; const o=AGENTS.get(u);
    if(o.army===a.army){
      o.e.grief=clamp(o.e.grief+0.3,0,1);
      if(byEnemy){ o.e.anger=clamp(o.e.anger+0.25,0,1); o.e.fear=clamp(o.e.fear+0.18,0,1); }
      else { o.e.fear=clamp(o.e.fear+0.3,0,1); o.e.morale=clamp(o.e.morale-0.12,0,1); } // 아군에게 당한 죽음 = 동요
      remember(o, `${timeStr()} 동료 ${ref(a.cell)} ${byEnemy?'전사':'피살'} 목격`);
    }
  }
  removeAgent(a, false);
  if(a.rank<=1) pushChron('death', `${A.name} ${a.name||RANK_NAME[a.rank]} ${why} (${ref(a.cell)})`, `=KIA("${A.name}", ${ref(a.cell)})`);
}
function removeAgent(a, isDesert){
  if(OCC[a.cell]===a.uid) OCC[a.cell]=-1;
  dirty.add(a.cell);
  AGENTS.delete(a.uid);
  army(a).units.delete(a.uid);
}

/* 이동 */
function moveAgent(a, to){
  if(OCC[to]>=0 || TERR[to]==='강') return false;
  const from=a.cell; OCC[from]=-1; a.cell=to; OCC[to]=a.uid;
  dirty.add(from); dirty.add(to);
  return true;
}

/* 전투: a가 적 b 공격 */
function fight(a, bCell){
  const bu=OCC[bCell]; if(bu<0) return;
  const b=AGENTS.get(bu); if(!b || b.army===a.army) return;
  flashCell(bCell,'clash');
  // 전투력: 용맹+사기+분노 보너스, 지형(고지 방어), 계급
  const atk = a.p.valor*2 + a.e.morale + a.e.anger*0.8 + (3-a.rank)*0.25 + rnd()*1.4;
  let def = b.p.valor*1.6 + b.e.morale + (3-b.rank)*0.25 + rnd()*1.4;
  if(TERR[bCell]==='고지') def+=0.8;
  if(TERR[bCell]==='숲') def+=0.4;
  if(atk>def){
    b.hp--;
    if(b.hp<=0){
      a.kills++; a.e.joy=clamp(a.e.joy+0.22,0,1); a.e.fear*=0.7;
      const wasRank=b.rank, wasArmy=army(b);
      killAgent(b,'전사',true);
      if(wasRank<=1) { a.e.joy=clamp(a.e.joy+0.2,0,1); remember(a,`${timeStr()} 적장 ${ref(bCell)} 참수`);
        pushChron('war', `${army(a).name}이(가) ${wasArmy.name} ${RANK_NAME[wasRank]}을(를) 전사시킴 (${ref(bCell)})`, `=WAR("${army(a).name}"→"${wasArmy.name}", ${ref(bCell)})`); }
      // 점령 이동
      if(OCC[bCell]<0 && rnd()<0.6) moveAgent(a,bCell);
    } else {
      b.e.fear=clamp(b.e.fear+0.2,0,1);
    }
  } else {
    a.hp--; a.e.fear=clamp(a.e.fear+0.15,0,1);
    if(a.hp<=0) killAgent(a,'전사',true);
    else b.e.joy=clamp(b.e.joy+0.1,0,1);
  }
}

/* =========================================================================
   에이전트 행동 — 받은 명령을 '자기 식으로' 수행 (감정이 변조)
   ========================================================================= */
function actAgent(a){
  if(!AGENTS.has(a.uid)) return;
  a.age++;
  emoTick(a);
  const e=a.e, p=a.p;
  const en = enemyNbr(a);

  // 공포 폭주: 사기 붕괴 + 공포 → 명령 무관 도주/탈영
  if(e.morale<0.16 && e.fear>0.62 && rnd()<0.25){
    if(rnd()<0.4){ desert(a,'사기 붕괴'); return; }
    const safe = emptyNbr(a).filter(n=>!enemyNbr({cell:n,army:a.army}).length);
    if(safe.length){ moveAgent(a, pick(safe)); a.lastAct='패주'; return; }
  }

  // 분노 폭주: 적 인접 시 명령 무시하고 무단 공격 (창발)
  if(e.anger>0.7 && en.length && rnd()<0.5){ fight(a, pick(en)); a.lastAct='격노한 돌격'; return; }

  const ord=a.order;
  // 명령별 수행 — 단, 감정/지형이 변조
  if(ord==='RETREAT'){
    // 후퇴: 적 반대 방향
    const opts=emptyNbr(a);
    if(opts.length){ const safe=opts.filter(n=>!enemyNbr({cell:n,army:a.army}).length); moveAgent(a, pick(safe.length?safe:opts)); }
    a.lastAct='후퇴';
  } else if(ord==='HOLD' || ord==='REGROUP'){
    // 사수: 인접 적만 응전. 사기 낮으면 가끔 동요
    if(en.length){ if(p.valor>0.4 || e.anger>0.4) fight(a, pick(en)); a.lastAct='응전'; }
    else if(ord==='REGROUP'){ // 상관 쪽으로 결집
      if(a.superior>=0 && AGENTS.has(a.superior)){
        const s=AGENTS.get(a.superior); const opts=emptyNbr(a);
        if(opts.length){ opts.sort((x,y)=>dist(x,s.cell)-dist(y,s.cell)); moveAgent(a,opts[0]); }
      }
      a.lastAct='재정비';
    } else a.lastAct='사수';
  } else if(ord==='ADVANCE'||ord==='CHARGE'||ord==='FLANK'||ord==='SCORCH'){
    if(en.length){ fight(a, pick(en)); a.lastAct=ORDERS[ord].kw; }
    else {
      // 적 방향으로 전진
      const opts=emptyNbr(a);
      if(opts.length){
        const tgt = nearestEnemyCell(a);
        if(tgt>=0){
          if(ord==='FLANK'){ // 측면: 거리 유지하며 우회
            opts.sort((x,y)=>Math.abs(dist(x,tgt)-2)-Math.abs(dist(y,tgt)-2));
          } else {
            opts.sort((x,y)=>dist(x,tgt)-dist(y,tgt));
          }
          // 신중한 자는 단독 전진 자제 (주변 아군 적으면 보류)
          const allyNear=nbrs(a.cell).filter(n=>OCC[n]>=0&&AGENTS.get(OCC[n]).army===a.army).length;
          if(p.cautn>0.7 && allyNear===0 && ord!=='CHARGE' && rnd()<0.6){ a.lastAct='관망'; }
          else { moveAgent(a, opts[0]); a.lastAct=ORDERS[ord].kw; }
        } else { a.lastAct='수색'; }
      }
    }
    // 초토화: 잔혹한 자는 점령지 방화 (감정·도덕 분기)
    if(ord==='SCORCH' && p.cruel>0.55 && rnd()<0.2){
      for(const n of nbrs(a.cell)){ if(OCC[n]<0 && TERR[n]==='숲'){ TERR[n]='평지'; dirty.add(n);} }
    }
  }
}
function nearestEnemyCell(a){
  let best=-1,bd=1e9;
  for(const o of AGENTS.values()){ if(o.army===a.army) continue; const d=dist(a.cell,o.cell); if(d<bd){bd=d;best=o.cell;} }
  return best;
}

/* =========================================================================
   지휘관 두뇌 — 전황을 '판단'해 명령을 발령 (자율)
   ========================================================================= */
function commandLoop(){
  for(const A of armies){
    if(!A.alive) continue;
    // 사령관 부재 → 장군 중 야망 큰 자가 자칭 사령관 (창발적 권력 공백)
    if(!AGENTS.has(A.commander)){
      const gens=[...AGENTS.values()].filter(a=>a.army===A.id && a.rank<=1);
      if(gens.length){
        gens.sort((x,y)=>(y.p.ambit+y.e.morale)-(x.p.ambit+x.e.morale));
        const heir=gens[0]; heir.rank=0; A.commander=heir.uid; heir.name='임시사령관 '+pick(['섭','계','후','승']);
        pushChron('coup', `${A.name} 지휘 공백 — ${ref(heir.cell)}의 장군이 사령권을 장악`, `=SUCCESSION("${A.name}", ${ref(heir.cell)})`);
      }
    }
    const cmd = AGENTS.get(A.commander);
    if(!cmd) continue;

    // 사령관이 전황을 읽고 표준명령 결정 (감정+성격 반영)
    if(tick % 6 === (A.id*2)%6){
      const myN=A.units.size;
      let avgMorale=0, contact=0;
      for(const u of A.units){ const a=AGENTS.get(u); if(!a)continue; avgMorale+=a.e.morale; if(enemyNbr(a).length)contact++; }
      avgMorale/= Math.max(1,myN);
      A.sentiment=avgMorale;
      let chosen;
      if(avgMorale<0.3) chosen = cmd.p.valor>0.7 ? 'REGROUP':'RETREAT';
      else if(contact > myN*0.25) chosen = cmd.e.anger>0.5||cmd.p.valor>0.7 ? 'CHARGE':'HOLD';
      else if(cmd.p.ambit>0.6 && avgMorale>0.5) chosen = cmd.p.cruel>0.7 && rnd()<0.3 ? 'SCORCH':'ADVANCE';
      else chosen = pick(['ADVANCE','HOLD','FLANK','REGROUP']);
      A.standingOrder=chosen;

      // 사령관 → 장군에게 하달 (장군이 해석)
      const od=ORDERS[chosen];
      fmla.textContent = `=ISSUE("${A.name}.${RANK_NAME[cmd.rank]}", "${od.kw}")  ${od.fx}(${ref(cmd.cell)})`;
      const res = issueOrder(cmd, chosen, 'standing');
      // 장군들은 받은 명령을 다시 휘하에 전파
      const gens=[...AGENTS.values()].filter(a=>a.army===A.id && a.rank===1);
      for(const g of gens){
        // 장군이 항명하지 않았다면(자기 order가 갱신됨) 휘하에 전파
        const sub=issueOrder(g, g.order, g.uid);
        // 대장들도 휘하 병사에게 전파
        const caps=[...AGENTS.values()].filter(a=>a.army===A.id && a.rank===2 && a.superior===g.uid);
        for(const cap of caps){ issueOrder(cap, cap.order, cap.uid); }
      }
      if(res.refused>0 && rnd()<0.7)
        pushChron('order', `${A.name} ${RANK_NAME[cmd.rank]}: ‘${od.kw}’ — 휘하 ${res.total}명 중 ${res.refused}명 항명`, `=ISSUE("${A.name}", "${od.kw}", 항명=${res.refused})`);
      else if(rnd()<0.4)
        pushChron('order', `${A.name} ${RANK_NAME[cmd.rank]}이(가) 전군에 ‘${od.kw}’ 명령 하달`, `=ISSUE("${A.name}", "${od.kw}")`);
    }
  }
}

/* =========================================================================
   메인 틱
   ========================================================================= */
const dirty = new Set();
let dirtyChron=false, dirtyMuti=false, dirtyForce=true;

function step(){
  tick++;
  commandLoop();
  // 행동 (셔플 순서 → 편향 방지)
  const order=[...AGENTS.values()];
  for(let i=order.length-1;i>0;i--){const j=ri(i+1);[order[i],order[j]]=[order[j],order[i]];}
  for(const a of order) actAgent(a);

  // 진영 생존 판정
  for(const A of armies){
    if(A.alive && A.units.size===0){
      A.alive=false;
      pushChron('death', `${A.name}이(가) 전멸했습니다.`, `=ANNIHILATED("${A.name}", ${timeStr()})`);
    }
  }
  // 승리 판정 → 살아남은 진영 사기 회복, 새 갈등 씨앗
  const live=armies.filter(A=>A.alive);
  if(live.length===1 && !window.__won){ window.__won=true;
    pushChron('order', `${live[0].name}이(가) 전장을 제패했습니다. 그러나 내부의 야망은 잠들지 않는다…`, `=VICTORY("${live[0].name}")`);
  }
  // 평화기 내분: 적이 거의 없으면 야망가들의 내부 긴장↑ (창발적 쿠데타)
  if(live.length<=1){
    for(const A of live){
      for(const a of AGENTS.values()){
        if(a.army===A.id && a.rank<3 && a.p.ambit>0.7 && rnd()<0.01){
          a.e.anger=clamp(a.e.anger+0.2,0,1);
        }
      }
    }
  }

  // 렌더
  for(const i of dirty) paint(i);
  dirty.clear();
  renderStatus();
  if(tick%4===0){ if(dirtyForce||true) renderForce(); }
  if(activeView==='chron' && dirtyChron){ renderChron(); dirtyChron=false; }
  if(activeView==='muti' && dirtyMuti){ renderMuti(); dirtyMuti=false; }
  if(activeView==='tree' && tick%5===0){ renderTree(); }
  document.getElementById('tab-muti').textContent=`항명기록 (${mutiny.length})`;
  if(inspUid>=0) renderInsp();
}

/* =========================================================================
   렌더
   ========================================================================= */
function paint(i){
  const el=cellEls[i];
  const emEl=el.firstChild;
  const u=OCC[i];
  if(u>=0){
    const a=AGENTS.get(u);
    if(a){
      const A=army(a);
      const m=moodOf(a);
      const sat=0.18 + a.e.morale*0.42;
      el.style.background = hexA(A.col, a.rank<=1 ? sat+0.18 : sat);
      el.style.color = A.col;
      el.style.fontWeight = a.rank<=1?'700':'500';
      el.style.fontSize = RANK_SIZE[a.rank]+'px';
      el.firstChild.nextSibling ? null : null;
      // glyph
      setGlyph(el, RANK_GLYPH[a.rank]);
      // 감정 이모지 (강한 감정일 때만)
      emEl.textContent = m.val>0.45 ? m.emoji : '';
      return;
    }
  }
  // 빈 칸 = 지형
  el.style.fontWeight=''; el.style.fontSize='11px';
  const t=TERR[i];
  if(t==='강'){ el.style.background='#ddebf7'; el.style.color=TERR_COL.강; setGlyph(el,'≈'); }
  else if(t==='숲'){ el.style.background='#e9f1e3'; el.style.color=TERR_COL.숲; setGlyph(el,'木'); }
  else if(t==='고지'){ el.style.background='#f0ece2'; el.style.color=TERR_COL.고지; setGlyph(el,'⌃'); }
  else { el.style.background=''; el.style.color=''; setGlyph(el,''); }
  emEl.textContent='';
}
function setGlyph(el,g){
  // el children: [textNode?][span.em]; keep span, set text before it
  const em=el.querySelector('.em');
  // remove existing text nodes
  for(const n of [...el.childNodes]){ if(n.nodeType===3) el.removeChild(n); }
  if(g) el.insertBefore(document.createTextNode(g), em);
}
function flashCell(i, cls){
  const el=cellEls[i]; if(!el) return;
  el.classList.add(cls);
  setTimeout(()=>el.classList.remove(cls), 950);
}

function renderStatus(){
  const live=armies.filter(A=>A.alive);
  let cas=0; for(const A of armies) cas+=A.casualties;
  let muts=0; for(const A of armies) muts+=A.mutinies;
  statusbar.innerHTML =
    `준비<span class="sep">|</span>${timeStr()}<span class="sep">|</span>`+
    `병력 <b>${AGENTS.size}</b><span class="sep">|</span>`+
    `사상·이탈 <b>${cas}</b><span class="sep">|</span>`+
    `항명/하극상 <b>${mutiny.length}</b><span class="sep">|</span>`+
    `${lastEvent}`;
}

function renderForce(){
  let h='';
  for(const A of armies){
    const units=[...A.units].map(u=>AGENTS.get(u)).filter(Boolean);
    if(!A.alive && !units.length){
      h+=`<div class="row dead"><span class="sw" style="background:${A.col};opacity:.4"></span>† ${A.name} 전멸</div>`; continue;
    }
    let mor=0; for(const a of units) mor+=a.e.morale; mor/=Math.max(1,units.length);
    const cmd=AGENTS.get(A.commander);
    const ordKw = ORDERS[A.standingOrder]?.kw||'-';
    h+=`<div class="row"><span class="sw" style="background:${A.col}"></span><b style="color:${A.col}">${A.name}</b>`+
       `<span class="muted" style="margin-left:auto">${units.length}명</span></div>`;
    h+=`<div class="row" style="padding-left:14px"><span class="muted" style="width:40px">사기</span><span class="bar"><i style="width:${(mor*100)|0}%;background:${mor>0.5?'#2e9e4f':mor>0.3?'#d9a23b':'#c0392b'}"></i></span></div>`;
    h+=`<div class="row" style="padding-left:14px;font-size:9.5px" class="muted"><span class="muted">명령 ‘${ordKw}’ · 항명 ${A.mutinies}</span></div>`;
  }
  $('#forcebody').innerHTML=h;
}

const KIND_COL={war:'#c0392b',coup:'#8e44ad',death:'#555',desert:'#b8860b',order:'#107c41'};
const KIND_LBL={war:'전투',coup:'정변',death:'전사',desert:'탈영',order:'명령'};
function renderChron(){
  const tb=$('#chrontbl tbody');
  let h='';
  const arr=chron.slice(-120).reverse();
  arr.forEach((c,k)=>{
    h+=`<tr><td class="rn">${chron.length-k}</td><td style="color:#888">${c.t}</td>`+
       `<td><span class="tag" style="background:${KIND_COL[c.kind]||'#777'}">${KIND_LBL[c.kind]||c.kind}</span> ${c.msg}</td></tr>`;
  });
  tb.innerHTML=h;
}
function renderMuti(){
  const tb=$('#mutitbl tbody');
  let h='';
  const arr=mutiny.slice(-100).reverse();
  arr.forEach((m,k)=>{
    const col = m.short.includes('하극상')?'#8e44ad':'#b8860b';
    h+=`<tr><td class="rn">${mutiny.length-k}</td><td style="color:#888">${m.t}</td>`+
       `<td><span class="tag" style="background:${col}">${m.short}</span></td><td>${m.msg}</td></tr>`;
  });
  if(!arr.length) h=`<tr><td class="rn">-</td><td></td><td colspan="2" class="muted">아직 항명·하극상 기록이 없습니다. 위계는 명령이 가혹할수록 흔들립니다.</td></tr>`;
  tb.innerHTML=h;
}
function renderTree(){
  let h='';
  for(const A of armies){
    if(!A.alive && A.units.size===0){ h+=`† ${A.name} (전멸)\n\n`; continue; }
    h+=`▣ ${A.name}  「${A.motto}」  병력 ${A.units.size}  명령 ‘${ORDERS[A.standingOrder]?.kw||'-'}’\n`;
    const cmd=AGENTS.get(A.commander);
    if(cmd){
      h+=line(cmd,1);
      const gens=[...AGENTS.values()].filter(a=>a.army===A.id&&a.rank===1&&a.superior===cmd.uid);
      for(const g of gens){
        h+=line(g,2);
        const caps=[...AGENTS.values()].filter(a=>a.army===A.id&&a.rank===2&&a.superior===g.uid);
        for(const c of caps){
          const sols=[...AGENTS.values()].filter(a=>a.army===A.id&&a.rank===3&&a.superior===c.uid);
          h+=line(c,3)+`  └ 병사 ${sols.length}명\n`;
        }
        const loose=[...AGENTS.values()].filter(a=>a.army===A.id&&a.rank===3&&a.superior===g.uid);
        if(loose.length) h+=`      └ 직속 병사 ${loose.length}명\n`;
      }
    } else h+='   (지휘 계통 붕괴 — 권력 공백)\n';
    h+='\n';
  }
  $('#ctree').textContent=h;
  function line(a,depth){
    const pad='   '.repeat(depth);
    const m=moodOf(a);
    const tr = a.superior>=0 ? `신뢰${(trustOf(a)*100|0)}` : '';
    return `${pad}${RANK_GLYPH[a.rank]} ${a.name||RANK_NAME[a.rank]} @${ref(a.cell)}  ${m.emoji}${m.label} 사기${(a.e.morale*100|0)} 야망${(a.p.ambit*100|0)} ${tr}\n`;
  }
}

/* =========================================================================
   정찰 패널 (셀 클릭) — 한 개체의 내면을 본다
   ========================================================================= */
let inspUid=-1, selCell=-1;
function renderInsp(){
  const a=AGENTS.get(inspUid);
  const box=$('#insp'), body=$('#inspbody');
  if(!a){ box.classList.remove('show'); inspUid=-1; return; }
  box.classList.add('show');
  $('#insp-ref').textContent=ref(a.cell);
  const A=army(a), m=moodOf(a);
  const bar=(v,c)=>`<span class="bar" style="width:64px"><i style="width:${(v*100)|0}%;background:${c}"></i></span>`;
  const sup = a.superior>=0 && AGENTS.has(a.superior) ? (AGENTS.get(a.superior).name||RANK_NAME[AGENTS.get(a.superior).rank]) : '없음';
  let h='';
  h+=`<div class="row"><span class="sw" style="background:${A.col}"></span><b style="color:${A.col}">${A.name}</b> · ${a.name||RANK_NAME[a.rank]}</div>`;
  h+=`<div><span class="k">기질</span>${personaText(a.p)}</div>`;
  h+=`<div><span class="k">지배감정</span><span class="mood" style="color:${m.col}">${m.emoji} ${m.label}</span></div>`;
  h+=`<div class="row"><span class="k">사기</span>${bar(a.e.morale,'#2e9e4f')}</div>`;
  h+=`<div class="row"><span class="k">분노</span>${bar(a.e.anger,'#c0392b')}</div>`;
  h+=`<div class="row"><span class="k">공포</span>${bar(a.e.fear,'#8e44ad')}</div>`;
  h+=`<div class="row"><span class="k">슬픔</span>${bar(a.e.grief,'#2c3e50')}</div>`;
  h+=`<div><span class="k">현 명령</span>‘${ORDERS[a.order]?.kw||'-'}’ → ${a.lastAct}</div>`;
  h+=`<div><span class="k">상관</span>${sup}${a.superior>=0?` (신뢰 ${(trustOf(a)*100|0)})`:''}</div>`;
  h+=`<div><span class="k">전공</span>참살 ${a.kills}</div>`;
  if(a.mem.length){
    h+=`<div style="margin-top:4px;color:#857640">기억</div>`;
    for(const mm of a.mem.slice(-4)) h+=`<div class="muted" style="font-size:9.5px">· ${mm}</div>`;
  }
  // 친정 버튼 (사령관일 때)
  if(a.rank===0){
    h+=`<div style="margin-top:5px;border-top:1px dashed #d8c66a;padding-top:4px;color:#857640">친정 — 직접 명령</div><div class="row" style="flex-wrap:wrap;gap:3px">`;
    for(const k of ['ADVANCE','CHARGE','HOLD','RETREAT','SCORCH']){
      h+=`<span data-cmd="${k}" data-uid="${a.uid}" style="cursor:pointer;border:1px solid ${A.col};color:${A.col};border-radius:3px;padding:0 4px;font-size:9.5px">${ORDERS[k].kw}</span>`;
    }
    h+=`</div>`;
  }
  body.innerHTML=h;
}

/* =========================================================================
   상호작용
   ========================================================================= */
sheet.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  if(selCell>=0) cellEls[selCell].classList.remove('sel');
  selCell=+t.dataset.i; t.classList.add('sel');
  namebox.textContent=ref(selCell);
  const u=OCC[selCell];
  if(u>=0){
    inspUid=u; renderInsp();
    const a=AGENTS.get(u);
    fmla.textContent=`=INSPECT(${ref(selCell)}) → ${army(a).name}.${a.name||RANK_NAME[a.rank]} [${personaText(a.p)}]`;
  } else {
    inspUid=-1; $('#insp').classList.remove('show');
    fmla.textContent=`=CELL(${ref(selCell)}) → 지형:${TERR[selCell]} (빈 진지)`;
  }
});
// 친정 명령 클릭
$('#inspbody').addEventListener('click', e=>{
  const b=e.target.closest('[data-cmd]'); if(!b) return;
  const a=AGENTS.get(+b.dataset.uid); if(!a) return;
  const k=b.dataset.cmd, od=ORDERS[k];
  army(a).standingOrder=k;
  const res=issueOrder(a,k,a.uid);
  // 장군→휘하 전파
  const gens=[...AGENTS.values()].filter(g=>g.army===a.army&&g.rank===1);
  for(const g of gens){ const sub=issueOrder(g,g.order,g.uid);
    const caps=[...AGENTS.values()].filter(c=>c.army===a.army&&c.rank===2&&c.superior===g.uid);
    for(const cap of caps) issueOrder(cap,cap.order,cap.uid);
  }
  pushChron('order', `[친정] ${army(a).name} ${RANK_NAME[a.rank]}이(가) ‘${od.kw}’ 친히 명령 — ${res.total}명 중 ${res.refused}명 항명`, `=COMMAND("${army(a).name}", "${od.kw}")`);
  flashCell(a.cell,'mutflash');
});

/* 탭 전환 */
const views={sheet:$('#sheetwrap'),chron:$('#view-chron'),tree:$('#view-tree'),muti:$('#view-muti')};
let activeView='sheet';
$('#tabs').addEventListener('click', e=>{
  const d=e.target.closest('[data-v]'); if(!d) return;
  activeView=d.dataset.v;
  [...$('#tabs').children].forEach(c=>c.classList.toggle('on', c===d));
  for(const k in views){ const on=k===activeView; views[k].classList.toggle('on', on);
    if(k==='sheet') views[k].style.display = on?'block':'none';
  }
  $('#panels').style.display = activeView==='sheet'?'flex':'none';
  $('.help').style.display = activeView==='sheet'?'block':'none';
  if(activeView==='chron'){ renderChron(); }
  if(activeView==='muti'){ renderMuti(); }
  if(activeView==='tree'){ renderTree(); }
});

/* =========================================================================
   부트 — 즉시 동작하는 첫 페인트
   ========================================================================= */
// 진영 배치 (서로 떨어진 모서리)
deployArmy(ARMIES[0], 1, 1);
deployArmy(ARMIES[1], COLS-2, ROWS-2);
deployArmy(ARMIES[2], COLS-2, 1);

// 첫 명령 부여 (사령관→전파) 후 첫 페인트
for(const A of armies){
  const cmd=AGENTS.get(A.commander);
  if(cmd){ issueOrder(cmd,'ADVANCE','init');
    const gens=[...AGENTS.values()].filter(a=>a.army===A.id&&a.rank===1);
    for(const g of gens){ issueOrder(g,g.order,g.uid);
      const caps=[...AGENTS.values()].filter(a=>a.army===A.id&&a.rank===2&&a.superior===g.uid);
      for(const cap of caps) issueOrder(cap,cap.order,cap.uid);
    }
  }
}
for(let i=0;i<N;i++) paint(i);
fmla.textContent=`=SIMULATE.ARMY($A$1:$${colName(COLS-1)}$${ROWS}, "명령은 내려가고, 마음은 따로 움직인다")`;
namebox.textContent='A1';
renderForce(); renderStatus();
pushChron('order','세 군대가 전장에 전개되었습니다. 명령 계통이 시험대에 오릅니다.','=DEPLOY(백호군, 주작군, 현무군)');

// 루프
setInterval(step, 130);
})();
</script>
