<!DOCTYPE html>

<head>

<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:18px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;overflow:hidden;white-space:nowrap}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px}
  #namebox{min-width:62px;padding:0 6px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;font-size:11px}
  #fx{width:28px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif;flex:none}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #main{position:relative;flex:1;min-height:0;display:flex;overflow:hidden}
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1;min-width:0}
  #sheet{display:grid;background:#fff}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:10px}
  .cell{border-right:1px solid #e6e6e6;border-bottom:1px solid #e6e6e6;
    display:flex;align-items:center;justify-content:center;font-size:11px;
    overflow:hidden;cursor:cell;position:relative}

  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #ff2d2d}50%{box-shadow:inset 0 0 0 2px #ffb3b3}}
  .war{animation:warf .3s 3}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .revolt{animation:pulse .5s infinite}
  /* 우측 패널: 정보/연대기 */
  #side{width:300px;flex:none;background:#fbfbf9;border-left:1px solid #d4d4d4;
    display:flex;flex-direction:column;overflow:hidden}
  #panel{flex:1;overflow-y:auto;padding:9px 11px;font-size:11px;line-height:1.55}
  #panel h3{margin:0 0 5px;font-size:11.5px;color:#107c41;border-bottom:1px solid #dfe7df;padding-bottom:3px}
  #panel .row{display:flex;justify-content:space-between;gap:6px}
  #panel .mut{color:#888}
  .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .emo{display:inline-block;font-size:9.5px;padding:0 3px;border-radius:3px;margin-right:3px}
  .bar{height:5px;border-radius:3px;background:#e6e6e6;overflow:hidden;margin:2px 0 5px}
  .bar>i{display:block;height:100%}
  #chron{height:172px;flex:none;border-top:1px solid #d4d4d4;background:#fff;overflow-y:auto;
    padding:6px 9px;font-family:Consolas,Menlo,monospace;font-size:10.5px;line-height:1.5;color:#333}
  #chron .y{color:#107c41;font-weight:600}
  #chron .em{color:#b06a00}
  #chron div{margin-bottom:1px;border-bottom:1px dotted #eee;padding-bottom:1px}
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11px;white-space:nowrap;overflow:hidden;gap:0}
  #statusbar .sep{margin:0 9px;opacity:.5}
  #statusbar b{font-weight:600}
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:24px;
    border-top:1px solid #d4d4d4;font-size:11px;flex:none}
  #tabs div{padding:3px 12px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  body{display:flex;flex-direction:column;height:100vh}
  #legend{position:absolute;top:7px;left:50px;background:#fffce6;border:1px solid #d8c66a;
    box-shadow:1px 2px 6px rgba(0,0,0,.15);padding:4px 9px;font-size:9.5px;z-index:6;color:#6a5a1a;line-height:1.7}
  #legend b{color:#7a6a1f}
  #ctrl{position:absolute;bottom:6px;left:50px;z-index:6;display:flex;gap:5px}
  #ctrl button{font:inherit;font-size:10px;padding:2px 8px;border:1px solid #bdbdbd;background:#fff;
    border-radius:3px;cursor:pointer;color:#444}
  #ctrl button:hover{background:#f0f0f0}
  #ctrl button.act{background:#107c41;color:#fff;border-color:#107c41}
  #hint{position:absolute;bottom:6px;right:8px;z-index:6;color:#aaa;font-size:9.5px}
  @media (max-width:760px){
    #side{display:none}
    #legend{font-size:9px;left:46px}
    #menubar{gap:11px}
  }
</style>
</head>
<body>
<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <span id="ttl">문명.xlsx - Excel</span>
</div>
<div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>심리</i></div>
<div id="fbar">
  <div id="namebox">A1</div>
  <div id="fx">fx</div>
  <div id="formula">=SIM.CIVILIZATION(...)</div>
</div>
<div id="main">
  <div id="sheetwrap">
    <div id="sheet"></div>
    <div id="legend"></div>
    <div id="ctrl">
      <button id="bPause">⏸ 일시정지</button>
      <button id="bSpeed">▶▶ 속도</button>
      <button id="bGod">✦ 개입: 없음</button>
    </div>
    <div id="hint">셀 클릭=그 땅의 역사 · 도시(■) 클릭=장군의 마음 · 개입 버튼=신의 손</div>
  </div>
  <div id="side">
    <div id="panel"></div>
    <div id="chron"></div>
  </div>
</div>
<div id="tabs">
  <div class="on" data-t="map">세계지도</div>
  <div data-t="dyn">세력</div>
  <div data-t="dead" id="tabDead">멸망기록 (0)</div>
</div>
<div id="statusbar"></div>

<script>
(() => {
"use strict";
// ============================================================
//  문명.xlsx — 창발적 AI 문명 시뮬레이션 (감정 렌즈)
//  단위: 자율 에이전트(지도자/장군/도시). 대본 없음.
//  희(joy) 노(anger) 애(sorrow) 락(pleasure)이 사건에서 동적으로
//  생겨 성격과 결합해 의사결정을 바꾼다. 다층 지휘체계에서
//  명령은 해석되고, 때로 항명·반란·배신이 창발한다.
// ============================================================

// ---------- 격자/레이아웃 ----------
const sheet = document.getElementById('sheet');
const fmla = document.getElementById('formula');
const namebox = document.getElementById('namebox');
const statusbar = document.getElementById('statusbar');
const legend = document.getElementById('legend');
const panel = document.getElementById('panel');
const chronEl = document.getElementById('chron');
const ttl = document.getElementById('ttl');

let COLS, ROWS, N, CW, CH;
function computeDims(){
  const w = window.innerWidth, h = window.innerHeight;
  const sideW = w > 760 ? 300 : 0;
  CW = w > 760 ? 30 : 26;
  CH = 22;
  COLS = Math.max(16, Math.min(46, Math.floor((w - sideW - 46) / CW)));
  ROWS = Math.max(14, Math.min(30, Math.floor((h - 165) / CH)));
  N = COLS * ROWS;
}
computeDims();

function colName(n){ let s=''; n++; while(n>0){const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0;} return s; }
function ref(i){ return colName(i%COLS)+(Math.floor(i/COLS)+1); }
const rnd = (a,b)=> a + Math.random()*(b-a);
const pick = arr => arr[Math.random()*arr.length|0];
const clamp = (v,a,b)=> v<a?a:v>b?b:v;

// ---------- 시트 DOM ----------
let cellEls;
function buildGrid(){
  sheet.innerHTML='';
  sheet.style.gridTemplateColumns = `38px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows = CH+'px';
  cellEls = new Array(N);
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const hh=document.createElement('div'); hh.className='hd'; hh.textContent=colName(c); frag.appendChild(hh);}
  for(let r=0;r<ROWS;r++){
    const hh=document.createElement('div'); hh.className='hd'; hh.textContent=r+1; frag.appendChild(hh);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div'); d.className='cell'; d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d; frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}
buildGrid();

// ---------- 지형 ----------
let cells;
function genTerrain(){
  const GW=9, GH=6, gz=[];
  for(let i=0;i<GW*GH;i++) gz[i]=Math.random();
  const noise=(x,y)=>{
    const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
    const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
    const a=gz[y0*GW+x0], b=gz[y0*GW+Math.min(GW-1,x0+1)];
    const c=gz[Math.min(GH-1,y0+1)*GW+x0], d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
    return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
  };
  cells = new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS, y=i/COLS|0;
    const v = noise(x,y) + (Math.random()-.5)*.14;
    let st='land', fert = clamp(0.4 + (v-0.5)*0.9 + rnd(-0.1,0.1), 0.15, 1);
    let hist=['황무지'];
    if(v<.31){ st='water'; hist=['바다']; fert=0; }
    else if(v>.63 && Math.random()<.65){ st='forest'; hist=['숲']; fert=clamp(fert+0.15,0,1); }
    cells[i] = { st, owner:null, gen:null, level:0, fert, hist, ruinT:0 };
  }
}
genTerrain();

function nbrs(i){
  const x=i%COLS, y=i/COLS|0, out=[];
  if(x>0)out.push(i-1); if(x<COLS-1)out.push(i+1);
  if(y>0)out.push(i-COLS); if(y<ROWS-1)out.push(i+COLS);
  return out;
}

// ============================================================
//  감정 모델 — 희(喜) 노(怒) 애(哀) 락(樂)
//  각 값 0..1. 사건이 더하고, 매 틱 평정심으로 감쇠.
// ============================================================
function newEmotion(){ return { joy:rnd(.2,.45), anger:rnd(.05,.2), sorrow:rnd(.05,.2), pleasure:rnd(.2,.4) }; }
const EMO_KO = {joy:'喜', anger:'怒', sorrow:'哀', pleasure:'樂'};
const EMO_COL = {joy:'#2e9e57', anger:'#d62828', sorrow:'#3060c0', pleasure:'#d99000'};
const EMO_NAME = {joy:'기쁨', anger:'분노', sorrow:'슬픔', pleasure:'즐거움'};

function decayEmotion(e, calm){
  // 평정 성향(calm)이 높을수록 빠르게 기저로 회귀.
  // 분노·슬픔은 끈질기게 남는다(원한은 쉬이 가시지 않는다).
  const base={joy:.26,anger:.08,sorrow:.08,pleasure:.26};
  const kFast=.05+calm*.06;          // 희/락은 빨리 식는다
  const kSlow=.025+calm*.03;         // 노/애는 천천히(그러나 결국) 가신다
  e.joy      += (base.joy-e.joy)*kFast;
  e.pleasure += (base.pleasure-e.pleasure)*kFast;
  e.anger    += (base.anger-e.anger)*kSlow;
  e.sorrow   += (base.sorrow-e.sorrow)*kSlow;
  for(const key in e) e[key]=clamp(e[key],0,1);
}
function feel(e, key, amt){ e[key]=clamp(e[key]+amt,0,1);
  // 감정 간 상호작용: 큰 분노/슬픔은 기쁨을 깎고, 큰 기쁨은 슬픔을 달랜다
  if(key==='anger'&&amt>0) e.joy=clamp(e.joy-amt*.4,0,1);
  if(key==='sorrow'&&amt>0){ e.joy=clamp(e.joy-amt*.5,0,1); e.pleasure=clamp(e.pleasure-amt*.3,0,1);}
  if(key==='joy'&&amt>0) e.sorrow=clamp(e.sorrow-amt*.4,0,1);
}
function dominant(e){
  let k='joy', v=-1; for(const key in e) if(e[key]>v){v=e[key];k=key;} return {key:k,val:v};
}
function mood(e){ // 종합 정서 점수 (양수=평온/번영, 음수=위기)
  return e.joy*1 + e.pleasure*.8 - e.anger*1 - e.sorrow*.9;
}

// ============================================================
//  성격(Personality) — 출생 시 무작위. 대본 없음.
//  ambition 야심 / loyalty 충성기질 / cruelty 잔혹 / empathy 공감
//  bravery 용맹 / calm 평정 / greed 탐욕
// ============================================================
function newPersona(){
  return {
    ambition: rnd(.1,1), loyalty: rnd(.1,1), cruelty: rnd(0,.9),
    empathy: rnd(.1,1), bravery: rnd(.1,1), calm: rnd(.1,.9), greed: rnd(.1,1)
  };
}
function personaWord(p){
  const tags=[];
  if(p.ambition>.7)tags.push('야심가'); else if(p.ambition<.3)tags.push('소박');
  if(p.cruelty>.65)tags.push('잔혹'); else if(p.empathy>.7)tags.push('자애');
  if(p.bravery>.7)tags.push('용맹'); else if(p.bravery<.3)tags.push('겁많음');
  if(p.greed>.7)tags.push('탐욕'); if(p.calm>.7)tags.push('침착');
  if(p.loyalty>.75)tags.push('충직'); else if(p.loyalty<.3)tags.push('변심');
  return tags.slice(0,3).join('·')||'평범';
}

// ============================================================
//  이름 풀
// ============================================================
const NATIONS = ['북부 왕국','붉은 제국','해안 연맹','유목 칸국','삼나무 공화국','잿빛 교단','동방 상단','검은강 부족','여명 왕조','소금사막 민족','청동 도시국','서리 산악국','금빛 평원국','심해 신정국'];
const COLORS  = ['#2563eb','#dc2626','#059669','#7c3aed','#d97706','#0d9488','#be185d','#4d7c0f','#9333ea','#b45309','#0891b2','#65a30d','#db2777','#475569'];
const GIVEN = ['카엘','로단','미라','센','투르','아샤','보른','릴','가렌','네샤','오딘','테아','쿠르','비안','요른','셀라','드락','이안','모르','피아','한','루','샤','텐','보로','아린','크롬','엘','자르','노바'];
const SUR = ['장군','대공','태수','맹주','사령','후작','족장','경','집정관','대장','수호자'];
let nationIdx=0;
function nationName(){ const n=NATIONS[nationIdx%NATIONS.length], c=COLORS[nationIdx%COLORS.length]; nationIdx++; return {n,c}; }
function personName(){ return pick(GIVEN); }

// ============================================================
//  세력(Faction): 지도자 + 장군들(지방 영주) 다층 위계
// ============================================================
let factions=[];
let nextFid=0, nextGid=0;
const obituaries=[];
let year=1, pop=0, lastEvent='태초에 격자가 있었다.', lastFmla='=GENESIS()';
const plague=new Map();
const fires=new Map();
const dirty=new Set();
let selected=-1;
const chronicle=[]; // {year,html}

function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

function makeGeneral(fac, anchorIdx){
  return {
    id: nextGid++,
    name: personName(),
    title: pick(SUR),
    persona: newPersona(),
    emo: newEmotion(),
    fid: fac.id,
    anchor: anchorIdx,      // 본거지 셀
    cells: [],              // 관할 셀
    grudge: new Map(),      // 다른 세력/장군에 대한 원한 (id -> 강도)
    standing: rnd(.4,.7),   // 지도자와의 관계(신임)
    order: 'develop',       // 현재 받은 명령
    obey: 1,                // 직전 복종도 (UI)
    alive: true, rebelCool: 0, // 반란/배신 후 불응 휴지기
    born: year, mem: []
  };
}

function spawnFaction(announce, originNote){
  const {n,c} = nationName();
  // 빈 땅 찾기
  let home=-1;
  for(let t=0;t<400;t++){ const i=Math.random()*N|0; if(cells[i].st==='land'&&cells[i].owner===null){home=i;break;} }
  if(home<0) return null;
  const fac = {
    id: nextFid++, name:n, color:c,
    leader: { name:personName(), persona:newPersona(), emo:newEmotion(), title:'왕', reign:year },
    generals: [],
    golden:0, size:0, treasury: rnd(20,50), legitimacy: rnd(.5,.8),
    born: year, capital: home, mem: []
  };
  const g = makeGeneral(fac, home);
  fac.generals.push(g);
  setCell(home, fac, g, 1, '개척지');
  factions.push(fac);
  if(announce) logEvent(`${n}이(가) ${ref(home)}에서 일어섰다. (왕 ${fac.leader.name}, ${personaWord(fac.leader.persona)})`,
    `=FOUND("${n}", ${ref(home)}, 왕="${fac.leader.name}")`);
  if(originNote) logEvent(originNote, `=MIGRATE("${n}")`);
  return fac;
}
function facById(id){ return factions.find(f=>f.id===id); }
function genById(fac,gid){ return fac.generals.find(g=>g.id===gid); }

function setCell(i, fac, gen, level, label){
  const c=cells[i];
  c.owner = fac?fac.id:null;
  c.gen = gen?gen.id:null;
  c.level=level; c.st='land';
  if(label){ c.hist.push(label); if(c.hist.length>8)c.hist.shift(); }
  dirty.add(i);
}

const LV_TXT=['','·','田','村','■','♜'];   // 개척/농장/마을/도시/대도시(궁성)
const LV_LABEL=['','개척지','농장','마을','도시','대도시'];

function paint(i){
  const c=cells[i], el=cellEls[i];
  let bg='', tx='', col='#222', w='', cap='';
  el.classList.remove('revolt');
  if(plague.has(i)){ bg='#ead5f5'; tx='疫'; col='#7030a0'; w='700'; }
  else if(fires.has(i)){ bg='#ffd9b3'; tx='火'; col='#c00000'; w='700'; }
  else if(c.st==='water'){ bg='#dceaf6'; tx='≈'; col='#9dc3e6'; }
  else if(c.st==='forest'){ bg='#e3efdb'; tx='木'; col='#5a8f3a'; }
  else if(c.st==='ruin'){ bg='#ededed'; tx='墟'; col='#9a9a9a'; }
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      const g=genById(f,c.gen);
      // 색은 세력, 명도는 발전도, 그리고 그 도시 장군의 지배 감정으로 약간 물든다
      bg=hexA(f.color, .12 + c.level*.16);
      tx=LV_TXT[c.level]; col=f.color; w=c.level>=4?'700':'';
      if(c.level>=3 && g){
        const d=dominant(g.emo);
        if(d.val>.6){ cap=EMO_KO[d.key]; }
      }
      if(g && g.revolting && c.level>=2) el.classList.add('revolt');
    }
  } else { bg=''; tx=''; }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  el.textContent=tx;
  if(cap){ const s=document.createElement('span'); s.className='cap'; s.textContent=cap;
    s.style.color=EMO_COL[Object.keys(EMO_KO).find(k=>EMO_KO[k]===cap)]||'#888'; el.appendChild(s); }
}

function logEvent(msg, formula){
  lastEvent = msg;
  if(formula) lastFmla = formula;
  chronicle.push({year, msg, formula});
  if(chronicle.length>400) chronicle.shift();
  pushChron(year, msg, formula);
}
let chronDirty=false;
function pushChron(y,msg,formula){
  const div=document.createElement('div');
  div.innerHTML = `<span class="y">${y}년</span> ${msg}` + (formula?` <span class="em">${formula}</span>`:'');
  chronEl.appendChild(div);
  while(chronEl.children.length>120) chronEl.removeChild(chronEl.firstChild);
  chronEl.scrollTop = chronEl.scrollHeight;
}

function flashWar(i){ const el=cellEls[i]; el.classList.add('war'); setTimeout(()=>el.classList.remove('war'),900); }

// ============================================================
//  의사결정 — 명령(지도자) → 해석/수행(장군). 감정이 좌우.
// ============================================================

// 지도자가 세력 전체에 내릴 '국시(國是)'를 감정+성격으로 결정
function leaderDoctrine(f){
  const L=f.leader, e=L.emo, p=L.persona;
  const d=dominant(e);
  // 기본 점수
  const score = {
    conquer: p.ambition*1.2 + e.anger*1.3 + e.pleasure*.4 - e.sorrow*.5,
    fortify: e.sorrow*1.1 + (1-p.bravery)*1.0 + e.anger*.2,
    prosper: p.empathy*.9 + e.joy*1.2 + e.pleasure*1.0 - e.anger*.4,
    festival: e.joy*1.0 + p.empathy*.6 + (f.golden>0?1:0),
    purge: p.cruelty*1.2 + e.anger*.9 - p.empathy*.7
  };
  // 국고가 비면 정복/축제 욕구가 꺾인다
  if(f.treasury<10){ score.conquer*=.5; score.festival*=.3; score.prosper+=.4; }
  let best='prosper', bv=-9; for(const k in score) if(score[k]>bv){bv=score[k];best=k;}
  return best;
}

// 장군이 명령을 '해석'한다 — 충성/감정/성격에 따라 복종/소극/항명/배신
function generalReact(f, g, doctrine){
  const e=g.emo, p=g.persona;
  // 신임(standing)은 지도자의 자애/잔혹에 영향받아 변동
  const L=f.leader;
  g.standing += (L.persona.empathy-.5)*.01 - (L.persona.cruelty-.4)*.012 - e.anger*.02 - e.sorrow*.008;
  g.standing += (f.golden>0?.01:0) + (mood(L.emo)>0?.004:-.006);
  g.standing = clamp(g.standing,0,1);

  // 명령을 잔혹하게(숙청) 받으면 공감 높은 장군은 분노
  if(doctrine==='purge' && p.empathy>.5) feel(e,'anger',.12+ (p.empathy-.5)*.2);
  if(doctrine==='festival') feel(e,'joy',.05);
  if(doctrine==='prosper' && p.greed<.6) feel(e,'pleasure',.03);

  // 복종 의지 = 충성기질 + 신임 + 평정 - (분노 + 야심)
  let obey = p.loyalty*1.0 + g.standing*0.9 + p.calm*.3
           - e.anger*1.1 - p.ambition*.6 - e.sorrow*.3 + .2;
  // 본인이 강대해졌고 야심이 크면 독립 욕구
  const power = g.cells.length;
  if(power>10 && p.ambition>.6) obey -= (power*.012 + (p.ambition-.6));
  g.obey = clamp(obey,0,2);

  // 결정
  if(g.obey > 0.85){ g.order = doctrine; return 'obey'; }
  if(g.obey > 0.5){ g.order = 'develop'; return 'slack'; } // 소극적 항명: 명령 무시하고 자기 영지만 챙김
  // 반란/배신 직후엔 휴지기 — 같은 자가 매년 봉기하는 병적 루프 차단
  if(g.rebelCool>0){ g.order='fortify'; return 'defy'; }
  // 적극적 항명: 깊은 분노 또는 큰 야심 + 무너진 신임 + 약한 충성기질 + 충분한 세력
  if(power>=5 && g.standing<.4 && p.loyalty<.55 && (e.anger>.55 || p.ambition>.8) && Math.random()<.4){
    return 'rebel';
  }
  // 배신: 충성기질 낮고 신임 무너지면 인접 적국으로 투항
  if(power>=3 && p.loyalty<.35 && g.standing<.35 && Math.random()<.35){
    return 'defect';
  }
  g.order='fortify'; return 'defy';
}

// 반란: 장군이 독립국 수립 (내전)
function generalRebels(f, g){
  const {c} = nationName();
  const newF = {
    id: nextFid++, name: `${g.name}의 ${pick(['반란군','자유국','신생 왕조','기치'])}`,
    color: c, leader: { name:g.name, persona:g.persona, emo:g.emo, title:'반왕', reign:year },
    generals: [], golden:0, size:0, treasury: f.treasury*.2, legitimacy: rnd(.2,.4),
    born:year, capital:g.anchor, mem:[]
  };
  g.fid = newF.id; g.standing = rnd(.6,.85); g.rebelCool = 40;
  newF.generals.push(g);
  for(const i of g.cells){ cells[i].owner=newF.id; dirty.add(i); }
  f.generals = f.generals.filter(x=>x!==g);
  factions.push(newF);
  feel(g.emo,'pleasure',.5); feel(g.emo,'anger',-.6); feel(g.emo,'joy',.3); feel(f.leader.emo,'anger',.4); feel(f.leader.emo,'sorrow',.25);
  logEvent(`${g.name} ${g.title}이(가) ${f.name}에 반기를 들고 「${newF.name}」을(를) 세웠다! (분노 ${(g.emo.anger*100|0)}, 야심 ${(g.persona.ambition*100|0)})`,
    `=REBEL("${g.name}"→"${f.name}")`);
}

// 배신: 인접한 적 세력으로 영지째 투항
function generalDefects(f, g){
  // 인접 적 세력 찾기
  const adj=new Map();
  for(const i of g.cells) for(const nb of nbrs(i)){
    const o=cells[nb].owner; if(o!==null&&o!==f.id) adj.set(o,(adj.get(o)||0)+1);
  }
  if(!adj.size){ // 인접 적이 없으면 그냥 반란
    if(g.cells.length>=4) generalRebels(f,g); else { g.order='fortify'; }
    return;
  }
  let to=-1,bv=-1; for(const [k,v] of adj) if(v>bv){bv=v;to=k;}
  const tf=facById(to); if(!tf) return;
  g.fid=tf.id;
  for(const i of g.cells){ cells[i].owner=tf.id; dirty.add(i); }
  f.generals = f.generals.filter(x=>x!==g);
  tf.generals.push(g);
  g.standing = rnd(.5,.7); g.rebelCool = 30;
  feel(g.emo,'pleasure',.2); feel(g.emo,'anger',-.4); feel(tf.leader.emo,'joy',.2); feel(f.leader.emo,'anger',.35); feel(f.leader.emo,'sorrow',.3);
  // 옛 동료에 대한 원한 형성
  g.grudge.set(f.id,(g.grudge.get(f.id)||0)+.6);
  logEvent(`${g.name} ${g.title}이(가) ${f.name}을(를) 버리고 ${tf.name}에 투항했다. (신임 붕괴)`,
    `=DEFECT("${g.name}": "${f.name}"→"${tf.name}")`);
}

// 백성의 반란: 슬픔/분노가 누적된 도시가 봉기 → 세력에서 이탈
function popularRevolt(f, g, i){
  const c=cells[i];
  c.owner=null; c.gen=null; c.level=Math.max(1,c.level-2);
  c.hist.push('민란'); if(c.hist.length>8)c.hist.shift();
  dirty.add(i);
  feel(g.emo,'sorrow',.15); feel(f.leader.emo,'sorrow',.1);
  f.legitimacy=clamp(f.legitimacy-.05,0,1);
}

// ============================================================
//  메인 틱
// ============================================================
let tickN=0, warCD=0, rebelCD=0, purgeCD=0;
const PW=[0,40,150,480,1300,3000];

function recount(){
  for(const f of factions){ f.size=0; for(const g of f.generals){ g.cells.length=0; } }
  pop=0;
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin' && --c.ruinT<=0){ c.st='land'; dirty.add(i); }
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){
        f.size++; pop+=PW[c.level];
        let g=genById(f,c.gen);
        if(!g){ // 장군이 죽었으면 가장 가까운 장군에게 귀속, 없으면 새 장군
          g = f.generals[0];
          if(!g){ g=makeGeneral(f,i); f.generals.push(g); }
          c.gen=g.id;
        }
        g.cells.push(i);
      } else { c.owner=null; c.gen=null; c.level=0; dirty.add(i); }
    }
  }
}

function tick(){
  tickN++; year++;
  if(warCD>0)warCD--; if(rebelCD>0)rebelCD--; if(purgeCD>0)purgeCD--;
  recount();

  // 죽은 장군(영지 0) 정리, 멸망 판정
  for(const f of factions){
    f.generals = f.generals.filter(g=>{
      if(g.cells.length===0 && g.id!==f.generals[0]?.id){
        if(g.alive){ g.alive=false; }
        return false;
      }
      return true;
    });
  }
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      obituaries.push({name:f.name, born:f.born, died:year, leader:f.leader.name, peak:f.peak||f.size});
      logEvent(`${f.name}이(가) 역사에서 사라졌다. (존속 ${year-f.born}년)`, `=COLLAPSE("${f.name}", ${f.born}~${year})`);
      factions.splice(k,1);
    } else { f.peak=Math.max(f.peak||0,f.size); }
  }

  // ---- 환경 재해 ----
  tickFires();
  tickPlague();

  // ---- 세력별 의사결정 ----
  for(const f of factions){
    if(f.golden>0)f.golden--;
    if(f.size===0)continue;
    // 지도자 감정 감쇠 + 상태 기반 갱신
    const L=f.leader;
    decayEmotion(L.emo, L.persona.calm);
    // 번영/쇠퇴가 지도자 감정에 피드백
    const growth = f.size - (f._lastSize||f.size); f._lastSize=f.size;
    if(growth>0) feel(L.emo,'joy',clamp(growth*.02,0,.1));
    if(growth<-1){ feel(L.emo,'sorrow',clamp(-growth*.02,0,.15)); feel(L.emo,'anger',clamp(-growth*.012,0,.1)); }
    f.treasury += f.size*0.25*(f.golden>0?2:1) - f.generals.length*0.3;
    f.treasury = clamp(f.treasury,-20,9999);
    if(f.treasury<-10){ feel(L.emo,'sorrow',.05); f.legitimacy=clamp(f.legitimacy-.01,0,1); }

    const doctrine = leaderDoctrine(f);
    f.doctrine = doctrine;

    // 축제/숙청은 세력 전체 효과
    if(doctrine==='festival' && f.treasury>15 && Math.random()<.3){
      f.treasury-=12;
      for(const g of f.generals){ feel(g.emo,'joy',.18); feel(g.emo,'pleasure',.14); feel(g.emo,'anger',-.1); g.standing=clamp(g.standing+.05,0,1);}
      feel(L.emo,'joy',.1);
      if(warCD<=0){ logEvent(`${f.name}이(가) 대축제를 열었다. 백성의 기쁨(喜)이 차오른다.`, `=FESTIVAL("${f.name}")`); warCD=18; }
    }
    if(doctrine==='purge' && Math.random()<.25){
      // 가장 충성도 낮은 장군을 숙청 — 공포로 단속하지만 분노/슬픔 확산
      let target=null,low=9; for(const g of f.generals){ if(g.obey<low&&f.generals.length>1){low=g.obey;target=g;} }
      if(target){
        for(const i of target.cells){ cells[i].gen=f.generals.find(x=>x!==target)?.id ?? null; dirty.add(i);}
        f.generals=f.generals.filter(g=>g!==target);
        for(const g of f.generals){ feel(g.emo,'sorrow',.1); feel(g.emo,'anger',.12+g.persona.empathy*.1); g.standing=clamp(g.standing-.08,0,1);}
        f.legitimacy=clamp(f.legitimacy-.04,0,1);
        if(purgeCD<=0){ logEvent(`${f.name}의 왕 ${L.name}이(가) ${target.name} ${target.title}을(를) 숙청했다. 두려움과 원한(怒)이 번진다.`,
          `=PURGE("${L.name}"⊣"${target.name}")`); purgeCD=10; }
      }
    }

    // ---- 장군 단위 행동 ----
    for(const g of [...f.generals]){
      decayEmotion(g.emo, g.persona.calm);
      if(g.rebelCool>0) g.rebelCool--;
      g.revolting=false;
      const reaction = generalReact(f, g, doctrine);

      // 반란/배신은 구조적 사건 — 한 틱에 한 건만 허용해 연쇄 붕괴를 막되, 버리지는 않는다.
      if(reaction==='rebel'){ if(rebelCD<=0){ generalRebels(f,g); rebelCD=4; continue; } else { g.order='fortify'; g.revolting=true; } }
      else if(reaction==='defect'){ if(rebelCD<=0){ generalDefects(f,g); rebelCD=3; continue; } else { g.order='fortify'; g.revolting=true; } }
      if(reaction==='defy'){ g.revolting = g.cells.length>=3 && g.emo.anger>.45; }

      generalAct(f, g, g.order);
    }

    // 정통성 낮고 분노 높은 장군이 많으면 민란 위험 상승
    f._tension = f.generals.reduce((s,g)=>s+g.emo.anger+g.emo.sorrow,0)/Math.max(1,f.generals.length);
  }

  // ---- 무작위/창발 사건 ----
  emergentEvents();

  // ---- 신규 세력 도래 ----
  if(factions.length<3 && Math.random()<.018){
    spawnFaction(false, null);
    const f=factions[factions.length-1];
    if(f) logEvent(`바다 건너에서 ${f.name}이(가) 도래했다.`, `=MIGRATE("${f.name}")`);
  }

  // ---- 그리기/HUD ----
  for(const i of dirty) paint(i);
  dirty.clear();
  renderHUD();
}

// 장군의 실제 행동 — order 에 따라, 하지만 감정이 강도를 좌우
function generalAct(f, g, order){
  if(g.cells.length===0) return;
  const e=g.emo, p=g.persona;
  // 국경 마찰 — 인접한 적 세력이 많을수록 영토 경쟁의 긴장이 분노로 쌓인다.
  // (접촉 자체가 적의를 낳는다: 평화로운 고립 → 정체를 깨는 창발적 동력)
  let borderRivals=0, nearestRival=-1;
  for(const i of g.cells){
    for(const nb of nbrs(i)){
      const o=cells[nb].owner;
      if(o!==null && o!==f.id){ borderRivals++; nearestRival=o; }
    }
  }
  if(borderRivals>0){
    // 국경 마찰: 적의 영토에 맞닿으면 긴장이 분노로 쌓인다. 단, 평정심이 완충하고
    // 분노가 이미 높으면(>0.5) 더 쌓이지 않는다 — 영구 격앙 상태를 막는다.
    if(e.anger<.5){
      const friction = clamp(borderRivals*.0025 + p.ambition*.003, 0, .01) * (1.2-p.calm);
      feel(e,'anger', friction);
    }
    if(nearestRival>=0 && Math.random()<.18){
      g.grudge.set(nearestRival, clamp((g.grudge.get(nearestRival)||0)+.015,0,1.5));
    }
  } else {
    // 적과 닿지 않으면 평온 — 분노가 빨리 가신다
    feel(e,'anger',-.01);
  }
  // 영지가 받는 정서적 압력 → 백성 반란 체크
  for(const i of g.cells){
    if(cells[i].level>=2 && (e.sorrow>.6||e.anger>.7) && f.legitimacy<.4 && Math.random()<.02){
      popularRevolt(f,g,i);
    }
  }

  const aggr = clamp(order==='conquer'?1.4: order==='fortify'?.3: .8, 0, 2)
             * (1 + e.anger*.8 - e.sorrow*.4) * (p.bravery*.6+.4) * (f.golden>0?1.3:1);
  const attempts = clamp(1 + (g.cells.length*.08|0) + (e.anger>.6?1:0), 1, 6);

  for(let a=0;a<attempts;a++){
    const src=pick(g.cells);
    if(src===undefined||cells[src].owner!==f.id)continue;
    const nb=nbrs(src), tgt=pick(nb), tc=cells[tgt];
    if(tc===undefined||tc.st==='water'||fires.has(tgt))continue;

    if(tc.owner===null){
      // 개척 — 발전 명령일수록, 락(즐거움) 높을수록 활발
      if(tc.st==='forest'){ if(Math.random()<.22){ tc.st='land'; setCell(tgt,f,g,1,'개간'); } }
      else if(tc.st==='land' && Math.random()< .5*(order==='conquer'?1.2:1)){
        setCell(tgt,f,g,1,'개척지'); feel(e,'pleasure',.01);
      }
    } else if(tc.owner!==f.id){
      // 전쟁 — 결정은 감정. 분노/원한/용맹이 공격을 부르고, 겁/슬픔은 주저하게 함
      const enemyF=facById(tc.owner);
      const grudge = enemyF ? (g.grudge.get(enemyF.id)||0) : 0;
      // 전쟁 욕구 = 공격성 + 분노 + 원한 + 야심/탐욕 - 슬픔/겁. 정복 명령이면 크게 가산.
      const wantWar = aggr*.5 + e.anger*.7 + grudge*.8
        + p.ambition*.45 + p.greed*.3
        + (order==='conquer'?.6:0)
        - e.sorrow*.3 - (1-p.bravery)*.35;
      if(order==='fortify' && grudge<.25 && e.anger<.4 && p.ambition<.6) continue;
      if(Math.random() < clamp(wantWar*.45,0,.8)){
        const def = tc.level + 1 + Math.random()*3 + (enemyF&&enemyF.golden>0?1:0);
        const att = 1 + Math.random()*3 + g.cells.length*.02 + e.anger*2 + p.bravery*1.5 + (f.golden>0?1:0) + grudge*1.5;
        flashWar(tgt);
        if(att>def){
          if(p.cruelty>.55 && Math.random()<.35){
            fires.set(tgt,5); tc.hist.push('전화(戰火)'); dirty.add(tgt);
            if(enemyF){ const eg=genById(enemyF,tc.gen); if(eg){ feel(eg.emo,'anger',.18); feel(eg.emo,'sorrow',.14);} feel(enemyF.leader.emo,'sorrow',.08); }
          } else {
            const wasLvl=tc.level;
            setCell(tgt,f,g,Math.max(1,tc.level-1),'점령됨');
            f.treasury += wasLvl*2;
          }
          feel(e,'pleasure',.12); feel(e,'joy',.06); feel(e,'anger',-.08);
          if(enemyF){
            // 피해자 측 감정·원한
            const eg=genById(enemyF,tc.gen);
            if(eg){ feel(eg.emo,'anger',.2); feel(eg.emo,'sorrow',.12); eg.grudge.set(f.id,(eg.grudge.get(f.id)||0)+.4); }
            feel(enemyF.leader.emo,'anger',.1); feel(enemyF.leader.emo,'sorrow',.08);
            g.grudge.set(enemyF.id,clamp((g.grudge.get(enemyF.id)||0)-.05,0,2)); // 분풀이로 원한 약간 해소
            if(warCD<=0 && (tc.level>=2 || grudge>.3 || Math.random()<.3)){
              const why = grudge>.4?'묵은 원한을 갚고자'
                : e.anger>.45?'끓어오르는 분노(怒)로'
                : (order==='conquer'?'왕명을 받들어':'영토를 탐내어');
              logEvent(`${g.name} ${g.title}이(가) ${why} ${enemyF.name}의 ${LV_LABEL[tc.level]||'땅'} ${ref(tgt)}을(를) 쳤다.`,
                `=WAR("${f.name}/${g.name}"→"${enemyF.name}", ${ref(tgt)})`);
              warCD=12;
            }
          }
        } else {
          // 패배 — 슬픔/분노 누적
          feel(e,'sorrow',.1); feel(e,'anger',.08);
          if(enemyF){ const eg=genById(enemyF,tc.gen); if(eg) feel(eg.emo,'joy',.08); }
        }
      }
    }
  }

  // 발전 — prosper/develop 명령, 락·희 높을수록, 평화로울수록
  const ups = clamp(1 + (g.cells.length*.06|0),1,5);
  const calmBonus = (e.joy*.6 + e.pleasure*.6 - e.anger*.4);
  for(let u=0;u<ups;u++){
    const i=pick(g.cells);
    if(i===undefined||cells[i].owner!==f.id)continue;
    const c=cells[i];
    const upChance = .05*(order==='prosper'||order==='develop'?1.5:.7)*(f.golden>0?2.5:1)*(1+calmBonus)*(0.5+c.fert);
    if(c.level<5 && Math.random()<upChance){
      c.level++; c.hist.push(LV_LABEL[c.level]); if(c.hist.length>8)c.hist.shift(); dirty.add(i);
      feel(e,'joy',.04); feel(e,'pleasure',.03); f.treasury+=c.level;
      if(c.level===5){
        feel(f.leader.emo,'joy',.2);
        if(warCD<=0 && Math.random()<.35){
          logEvent(`${f.name}의 ${ref(i)}에 대도시가 융성하다. ${g.name}의 치세에 기쁨(喜)이 가득하다.`,
            `=METROPOLIS("${f.name}", ${ref(i)})`); warCD=30;
        }
      }
    }
  }
}

function tickFires(){
  for(const [i,t] of [...fires]){
    if(Math.random()<.12){ for(const n of nbrs(i)){ const c=cells[n]; if(c.owner!==null&&!fires.has(n)&&c.st==='land'){ fires.set(n,5); dirty.add(n);
      const f=facById(c.owner); if(f){ const g=genById(f,c.gen); if(g) feel(g.emo,'sorrow',.05);} } } }
    if(t<=1){ fires.delete(i); const c=cells[i]; const f=facById(c.owner);
      c.owner=null;c.gen=null;c.level=0;c.st='ruin';c.ruinT=180; c.hist.push('잿더미'); if(c.hist.length>8)c.hist.shift(); dirty.add(i);
      if(f){ const g=genById(f,c.gen); if(g)feel(g.emo,'sorrow',.08);} }
    else fires.set(i,t-1);
  }
}
function tickPlague(){
  if(!plague.size)return;
  for(const [i,t] of [...plague]){
    if(Math.random()<.16){ for(const n of nbrs(i)){ if(cells[n].owner!==null&&!plague.has(n)){ plague.set(n,11); dirty.add(n);} } }
    if(Math.random()<.22){ const c=cells[i]; const f=facById(c.owner);
      c.level--;
      if(f){ const g=genById(f,c.gen); if(g)feel(g.emo,'sorrow',.04); feel(f.leader.emo,'sorrow',.01);}
      if(c.level<=0){ c.owner=null;c.gen=null;c.level=0; c.hist.push('역병으로 소멸'); if(c.hist.length>8)c.hist.shift();}
      dirty.add(i);
    }
    if(t<=1){ plague.delete(i); dirty.add(i);} else plague.set(i,t-1);
  }
  if(plague.size===0) logEvent('역병이 물러갔다. 살아남은 자들의 슬픔(哀)이 깊다.', '=PLAGUE.END()');
}

function emergentEvents(){
  const r=Math.random();
  // 역병
  if(!plague.size && r<.004){
    const big=[]; for(let i=0;i<N;i++) if(cells[i].owner!==null&&cells[i].level>=3) big.push(i);
    if(big.length){ const i=pick(big); plague.set(i,11); dirty.add(i);
      logEvent(`${ref(i)}에서 역병이 창궐했다.`, `=PLAGUE(${ref(i)})`); }
  }
  // 황금기 — 정서가 좋은(mood 높은) 세력에서 자연 발생
  if(r>.992 && factions.length){
    const cand=factions.filter(f=>mood(f.leader.emo)>.4 && f.size>4);
    const f = cand.length?pick(cand):pick(factions);
    if(f && f.golden<=0){
      f.golden=110; feel(f.leader.emo,'joy',.25); feel(f.leader.emo,'pleasure',.2);
      for(const g of f.generals) feel(g.emo,'joy',.1);
      logEvent(`${f.name}에 황금기가 열렸다. 온 나라에 기쁨과 즐거움(喜樂)이 넘친다.`, `=GOLDEN_AGE("${f.name}", 110)`);
    }
  }
  // 대화재
  if(r>.9885 && r<=.992){
    const towns=[]; for(let i=0;i<N;i++) if(cells[i].owner!==null&&cells[i].level>=2) towns.push(i);
    if(towns.length){ const i=pick(towns); fires.set(i,6); dirty.add(i);
      const f=facById(cells[i].owner); if(f){ feel(f.leader.emo,'sorrow',.12); const g=genById(f,cells[i].gen); if(g)feel(g.emo,'sorrow',.18);}
      logEvent(`${ref(i)}에 대화재가 발생했다. 슬픔(哀)이 도성을 덮는다.`, `=FIRE(${ref(i)})`); }
  }
  // 왕의 죽음 → 후계 (감정/성격 새로 추첨, 정통성 흔들림)
  if(r>.9968 && factions.length){
    const f=pick(factions);
    if(year - f.leader.reign > 40){
      const old=f.leader.name;
      const heir = f.generals.length && Math.random()<.5 ? pick(f.generals) : null;
      f.leader = { name: heir?heir.name:personName(), persona: heir?heir.persona:newPersona(),
        emo: heir?heir.emo:newEmotion(), title:'왕', reign:year };
      f.legitimacy=clamp(f.legitimacy-.1,0,1);
      for(const g of f.generals){ g.standing=clamp(g.standing-rnd(0,.15),0,1); feel(g.emo,'sorrow',.06); }
      logEvent(`${f.name}의 왕 ${old}이(가) 붕어하고 ${f.leader.name}이(가) 즉위했다. (${personaWord(f.leader.persona)})`,
        `=SUCCESSION("${f.name}": "${old}"→"${f.leader.name}")`);
    }
  }
  // 동맹/혼인 — 서로 mood 좋고 원한 없는 두 세력이 평화에 들면 잠시 비공격
  // (간단화: 명시적 동맹 객체 대신, 원한 0이면 자연히 안 싸움)
}

// ============================================================
//  신의 손(개입) — 사용자가 감정을 직접 주입
// ============================================================
let godMode='none'; // none|joy|anger|sorrow|pleasure|smite|bless
const GOD_CYCLE=[
  ['none','✦ 개입: 없음'],
  ['joy','喜 기쁨 주입'],
  ['anger','怒 분노 주입'],
  ['sorrow','哀 슬픔 주입'],
  ['pleasure','樂 즐거움 주입'],
  ['smite','⚡ 천벌(화재)'],
  ['bless','✚ 축복(번영)']
];
let godIdx=0;
document.getElementById('bGod').onclick=()=>{
  godIdx=(godIdx+1)%GOD_CYCLE.length; godMode=GOD_CYCLE[godIdx][0];
  const b=document.getElementById('bGod'); b.textContent=GOD_CYCLE[godIdx][1];
  b.classList.toggle('act', godMode!=='none');
};

function godTouch(i){
  const c=cells[i];
  if(godMode==='smite'){ if(c.owner!==null){ fires.set(i,6); dirty.add(i); logEvent(`신의 손이 ${ref(i)}에 불을 내렸다.`,`=SMITE(${ref(i)})`);} return true; }
  if(godMode==='bless'){ if(c.owner!==null){ c.level=Math.min(5,c.level+1); dirty.add(i); const f=facById(c.owner); if(f){feel(f.leader.emo,'joy',.1);} logEvent(`신의 손이 ${ref(i)}을(를) 축복했다.`,`=BLESS(${ref(i)})`);} return true; }
  if(['joy','anger','sorrow','pleasure'].includes(godMode)){
    if(c.owner!==null){ const f=facById(c.owner); const g=f&&genById(f,c.gen);
      if(g){ feel(g.emo,godMode,.5); feel(f.leader.emo,godMode,.3);
        logEvent(`신의 손이 ${g.name} ${g.title}의 마음에 ${EMO_NAME[godMode]}(${EMO_KO[godMode]})을(를) 부었다.`,
          `=INFUSE("${g.name}", ${EMO_KO[godMode]}+50)`); }
    }
    return true;
  }
  return false;
}

// ============================================================
//  HUD / 패널 / 상태바
// ============================================================
let view='map';
function renderHUD(){
  // 상태바
  const topF=[...factions].sort((a,b)=>b.size-a.size)[0];
  statusbar.innerHTML =
    `<b>준비</b><span class="sep">|</span>서기 ${year}년<span class="sep">|</span>`+
    `인구 ${pop.toLocaleString()}명<span class="sep">|</span>세력 ${factions.length}<span class="sep">|</span>`+
    (topF?`최강 ${topF.name}(${topF.size})<span class="sep">|</span>`:'')+
    `${lastEvent}`;
  if(tickN%6===0){ ttl.textContent=`문명.xlsx - Excel (서기 ${year}년)`; document.getElementById('tabDead').textContent=`멸망기록 (${obituaries.length})`; }
  // 수식바: 선택 없을 때 마지막 시뮬 수식
  if(selected<0) fmla.textContent=lastFmla;
  if(tickN%4===0) renderPanel();
}

function emoStrip(e){
  let s='';
  for(const k of ['joy','anger','sorrow','pleasure']){
    const v=e[k]; if(v<.18)continue;
    s+=`<span class="emo" style="background:${hexA(EMO_COL[k],.18)};color:${EMO_COL[k]}">${EMO_KO[k]}${(v*100|0)}</span>`;
  }
  return s||'<span class="mut">평정</span>';
}

function renderPanel(){
  if(view==='dead'){ renderDead(); return; }
  if(view==='map' && selected>=0){ renderCellDetail(); return; }
  // 세력 패널
  let h='<h3>세력 현황 — 자율 에이전트</h3>';
  const sorted=[...factions].sort((a,b)=>b.size-a.size);
  if(!sorted.length) h+='<div class="mut">아직 문명이 없다.</div>';
  for(const f of sorted){
    const L=f.leader, d=dominant(L.emo);
    h+=`<div style="margin-bottom:7px;border-bottom:1px solid #eee;padding-bottom:5px">`;
    h+=`<div class="row"><span><span class="sw" style="background:${f.color}"></span><b>${f.name}</b>${f.golden>0?' ✦':''}</span><span class="mut">${f.size}칸</span></div>`;
    h+=`<div style="margin:1px 0 1px 14px">왕 ${L.name} <span class="mut">(${personaWord(L.persona)})</span></div>`;
    h+=`<div style="margin-left:14px">${emoStrip(L.emo)} <span class="mut">국시:${doctName(f.doctrine)}</span></div>`;
    // 정통성/국고 바
    const legit=f.legitimacy*100|0;
    h+=`<div class="row mut" style="margin-left:14px"><span>정통성 ${legit}%</span><span>국고 ${f.treasury|0}</span><span>긴장 ${(f._tension*100|0)||0}</span></div>`;
    h+=`<div class="bar" style="margin-left:14px"><i style="width:${legit}%;background:${legit>50?'#2e9e57':legit>25?'#d99000':'#d62828'}"></i></div>`;
    // 장군들
    if(f.generals.length){
      h+=`<div class="mut" style="margin-left:14px">장군 ${f.generals.length}:</div>`;
      for(const g of [...f.generals].sort((a,b)=>b.cells.length-a.cells.length).slice(0,4)){
        const gd=dominant(g.emo);
        const obeyTxt = g.obey>.85?'복종':g.obey>.45?'태업':g.revolting?'항명':'불복';
        h+=`<div style="margin-left:18px;font-size:10px">${g.name} ${g.title} <span class="mut">${g.cells.length}칸·${obeyTxt}</span> <span style="color:${EMO_COL[gd.key]}">${EMO_KO[gd.key]}${(gd.val*100|0)}</span></div>`;
      }
    }
    h+=`</div>`;
  }
  panel.innerHTML=h;
}
function doctName(d){ return {conquer:'정복',fortify:'수성',prosper:'번영',festival:'축제',purge:'숙청',develop:'개척'}[d]||'—'; }

function renderCellDetail(){
  const c=cells[selected];
  let h=`<h3>${ref(selected)} — 땅의 기록</h3>`;
  const typ = c.st==='water'?'바다':c.st==='forest'?'숲':c.st==='ruin'?'폐허':c.owner!==null?LV_LABEL[c.level]:'무주지';
  h+=`<div class="row"><span>지형/상태</span><span>${typ}</span></div>`;
  h+=`<div class="row"><span>비옥도</span><span>${(c.fert*100|0)}%</span></div>`;
  if(c.owner!==null){
    const f=facById(c.owner), g=f&&genById(f,c.gen);
    if(f){
      h+=`<div class="row"><span>소속</span><span><span class="sw" style="background:${f.color}"></span>${f.name}</span></div>`;
      if(g){
        h+=`<div style="margin-top:6px"><b>관할 장군</b> ${g.name} ${g.title}</div>`;
        h+=`<div class="mut">${personaWord(g.persona)} · 즉위 ${g.born}년 · ${g.cells.length}칸</div>`;
        h+=`<div style="margin:4px 0">현재 마음: ${emoStrip(g.emo)}</div>`;
        h+=`<div class="row mut"><span>지도자 신임</span><span>${(g.standing*100|0)}%</span></div>`;
        h+=`<div class="row mut"><span>복종 의지</span><span>${(g.obey*50|0)}%</span></div>`;
        if(g.grudge.size){
          h+=`<div style="margin-top:3px">원한:</div>`;
          for(const [id,v] of g.grudge){ const ef=facById(id); if(ef&&v>.1) h+=`<div class="mut" style="margin-left:8px">↳ ${ef.name} (${(v*100|0)})</div>`; }
        }
      }
    }
  }
  h+=`<div style="margin-top:8px"><b>연혁</b></div>`;
  h+=`<div class="mut">${c.hist.join(' → ')}</div>`;
  fmla.textContent=`=HISTORY(${ref(selected)}; ${c.hist.map(x=>`"${x}"`).join('→')})`;
  panel.innerHTML=h;
}

function renderDead(){
  let h=`<h3>멸망기록 (${obituaries.length})</h3>`;
  if(!obituaries.length) h+='<div class="mut">아직 멸망한 문명이 없다.</div>';
  for(const o of [...obituaries].reverse()){
    h+=`<div style="margin-bottom:5px;color:#777"><b>† ${o.name}</b><br><span class="mut">왕 ${o.leader} · 서기 ${o.born}~${o.died}년 (${o.died-o.born}년) · 최전성 ${o.peak}칸</span></div>`;
  }
  panel.innerHTML=h;
}

// 범례
legend.innerHTML = `<b>희노애락 창발 문명</b> · ≈바다 木숲 墟폐허 ·田村■♜발전 · `+
  `<span style="color:#2e9e57">喜</span><span style="color:#d62828">怒</span><span style="color:#3060c0">哀</span><span style="color:#d99000">樂</span> = 도시 장군의 지배감정`;

// ============================================================
//  상호작용
// ============================================================
sheet.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t)return;
  const i=+t.dataset.i;
  if(godMode!=='none'){ if(godTouch(i)){ paint(i); return; } }
  if(selected>=0) cellEls[selected].classList.remove('sel');
  selected=i; t.classList.add('sel');
  namebox.textContent=ref(i);
  view='map';
  setTab('map');
  renderCellDetail();
});

// 탭
document.querySelectorAll('#tabs div').forEach(d=>{
  d.onclick=()=>{ const t=d.dataset.t; setTab(t);
    if(t!=='map'){ if(selected>=0){cellEls[selected].classList.remove('sel');} selected=-1; }
    renderPanel();
  };
});
function setTab(t){
  view=t;
  document.querySelectorAll('#tabs div').forEach(d=>d.classList.toggle('on',d.dataset.t===t));
}

// 컨트롤
let speed=110, paused=false, timer=null;
function restartTimer(){ if(timer)clearInterval(timer); if(!paused) timer=setInterval(tick,speed); }
document.getElementById('bPause').onclick=()=>{
  paused=!paused; document.getElementById('bPause').textContent=paused?'▶ 재생':'⏸ 일시정지';
  document.getElementById('bPause').classList.toggle('act',paused);
  restartTimer();
};
const SPEEDS=[110,55,28,220]; let spIdx=0;
document.getElementById('bSpeed').onclick=()=>{
  spIdx=(spIdx+1)%SPEEDS.length; speed=SPEEDS[spIdx];
  document.getElementById('bSpeed').textContent=`▶▶ ${['1x','2x','4x','½x'][spIdx]}`;
  restartTimer();
};

// 리사이즈 (디바운스 — 격자 재생성)
let rt=null;
window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{
  const oldCells=cells, oldCols=COLS, oldRows=ROWS;
  computeDims(); buildGrid();
  // 지형/상태는 좌표 비율로 재매핑 (간단: 새로 생성하지 않고 기존을 잘라/채움)
  remap(oldCells, oldCols, oldRows);
  for(let i=0;i<N;i++) paint(i);
  if(selected>=N) selected=-1;
},250); });
function remap(oldCells, oc, orr){
  const nc=new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS, y=i/COLS|0;
    const ox=Math.min(oc-1, Math.round(x/COLS*oc)), oy=Math.min(orr-1, Math.round(y/ROWS*orr));
    const src=oldCells[oy*oc+ox];
    nc[i]= src ? src : { st:'land', owner:null, gen:null, level:0, fert:.5, hist:['황무지'], ruinT:0 };
  }
  cells=nc;
}

// ============================================================
//  시작 — 태초
// ============================================================
for(let i=0;i<N;i++) paint(i);
fmla.textContent=`=SIM.CIVILIZATION($A$1:$${colName(COLS-1)}$${ROWS}, 감정=희노애락, 대본=없음)`;
logEvent('태초에 빈 격자가 있었다. 곧 마음을 가진 자들이 깨어난다.','=GENESIS()');
spawnFaction(true); spawnFaction(true); spawnFaction(true);
renderPanel(); renderHUD();
restartTimer();

// 외부 자가검증용 훅
window.__sim = { get year(){return year;}, get factions(){return factions;}, get pop(){return pop;}, tick, get chronLen(){return chronicle.length;} };
})();
