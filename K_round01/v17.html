<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>문명.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px}
  #titlebar .sp{flex:1}
  #titlebar .ctl{color:#555;font-size:11px;cursor:pointer;padding:2px 7px;border:1px solid #d4d4d4;
    border-radius:3px;background:#fff}
  #titlebar .ctl:hover{background:#eef7f0;border-color:#107c41}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;flex:0 0 auto;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  #fbar{min-height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px;flex:0 0 auto}
  #namebox{width:74px;flex:0 0 74px;align-self:stretch;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;font-weight:600}
  #fx{width:30px;flex:0 0 30px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif}
  #formula{flex:1;padding:3px 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.45}
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1 1 auto;min-height:0}
  #sheet{display:grid;background:#fff;position:absolute;top:0;left:0}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:10.5px}
  .cell{border-right:1px solid #e7e7e7;border-bottom:1px solid #e7e7e7;
    display:flex;align-items:center;justify-content:center;font-size:11px;position:relative;
    overflow:hidden;cursor:cell;transition:background .25s}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:3}
  .cell .em{position:absolute;top:0;right:1px;font-size:7px;line-height:7px;opacity:.85}
  @keyframes warf{0%,100%{background:#ff5b5b}50%{background:#ffd0d0}}
  .war{animation:warf .3s 3;color:#7a0000 !important;font-weight:700}
  @keyframes festf{0%{transform:scale(.5);opacity:0}40%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:1}}
  .fest{animation:festf .7s ease-out}
  @keyframes monu{0%{transform:scale(.2) rotate(-30deg);opacity:0}60%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  .monu{animation:monu .9s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pulseG{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,196,0,0)}50%{box-shadow:inset 0 0 6px 1px rgba(255,196,0,.6)}}
  .golden{animation:pulseG 1.6s infinite}
  #panel{position:absolute;top:8px;right:12px;width:236px;background:#fffdf3;border:1px solid #d8c66a;
    box-shadow:2px 3px 10px rgba(0,0,0,.18);padding:8px 11px;font-size:11px;z-index:6;
    line-height:1.7;max-height:calc(100% - 20px);overflow:auto}
  #panel h4{margin:7px 0 3px;font-size:11px;color:#7a6a1f;border-bottom:1px solid #e7dca0;padding-bottom:2px}
  #panel h4:first-child{margin-top:0}
  #panel .sw{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:middle;border-radius:2px}
  #panel .dead{color:#999;font-size:10px}
  #panel .bar{display:inline-block;height:5px;border-radius:3px;vertical-align:middle;margin-left:4px}
  #panel .moods{font-size:9.5px;color:#777;margin-left:14px}
  #panel .fac{cursor:pointer;padding:1px 2px;border-radius:3px}
  #panel .fac:hover{background:#fff6cf}
  #panel .fac.hi{background:#fff0b8}
  #panel small{color:#998}
  #sheetView,#chronView,#workView,#deadView{position:absolute;inset:0}
  .docView{position:absolute;inset:0;overflow:auto;background:#fff;display:none;padding:0}
  .docView table{border-collapse:collapse;width:100%;font-size:11.5px}
  .docView th,.docView td{border:1px solid #e3e3e3;padding:4px 9px;text-align:left;vertical-align:top}
  .docView th{background:#f5f5f5;color:#555;position:sticky;top:0;font-weight:600;z-index:2}
  .docView td.f{font-family:Consolas,monospace;color:#107c41;font-size:10.5px;white-space:nowrap}
  .docView td.yr{font-family:Consolas,monospace;color:#888;width:64px;white-space:nowrap}
  .docView .glyph{font-size:14px;text-align:center;width:30px}
  .docView tr:hover td{background:#f6fbf7}
  .docView .empty{padding:40px;color:#aaa;text-align:center;font-size:13px}
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;flex:0 0 auto;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 9px;opacity:.5}
  #statusbar .ev{overflow:hidden;text-overflow:ellipsis}
  #tabs{height:26px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:28px;
    border-top:1px solid #d4d4d4;font-size:11.5px;flex:0 0 auto;overflow:hidden}
  #tabs div{padding:3px 12px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  @media (max-width:520px){
    #menubar i:nth-child(n+5){display:none}
    #panel{width:150px;font-size:10px;padding:6px 7px}
    #namebox{width:54px;flex-basis:54px}
    #titlebar span{font-size:11px}
    #titlebar .ctl{padding:2px 5px}
  }
</style>
</head>
<body>
<div id="app">
<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <span>문명.xlsx - Excel</span>
  <div class="sp"></div>
  <div class="ctl" id="btnPause">⏸ 일시정지</div>
  <div class="ctl" id="btnSpeed">▶▶ 속도 ×1</div>
</div>
<div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
<div id="fbar">
  <div id="namebox">A1</div>
  <div id="fx">fx</div>
  <div id="formula"></div>
</div>
<div id="sheetwrap">
  <div id="sheetView">
    <div id="sheet"></div>
    <div id="panel"></div>
  </div>
  <div class="docView" id="chronView"></div>
  <div class="docView" id="workView"></div>
  <div class="docView" id="deadView"></div>
</div>
<div id="tabs">
  <div class="on" data-v="sheet">Sheet1</div>
  <div data-v="chron">연대기</div>
  <div data-v="work">걸작목록 (0)</div>
  <div data-v="dead">멸망기록 (0)</div>
</div>
<div id="statusbar"></div>
</div>

<script>
"use strict";
(() => {
/* ============================================================
   문명.xlsx — 藝術魂 (Soul of Art)
   엑셀로 위장한 창발적 AI 문명 시뮬레이션.
   각 세력은 지도자 + 하위 에이전트(목표/성격/기억/감정)로 구성된
   다층 위계. 명령은 해석되고, 때로 항명·배신당한다.
   예술·축제·기념비가 감정·역사·소프트파워의 엔진이다.
   ============================================================ */

const CW = 34, CH = 22;
const sheet = document.getElementById('sheet');
const sheetwrap = document.getElementById('sheetwrap');
const fmla = document.getElementById('formula');
const namebox = document.getElementById('namebox');
const statusbar = document.getElementById('statusbar');
const panel = document.getElementById('panel');
const chronView = document.getElementById('chronView');
const workView = document.getElementById('workView');
const deadView = document.getElementById('deadView');

let COLS, ROWS, N;
function computeDims(){
  const w = sheetwrap.clientWidth, h = sheetwrap.clientHeight;
  COLS = Math.max(16, Math.min(44, Math.floor((w - 48) / CW)));
  ROWS = Math.max(12, Math.min(30, Math.floor((h - 4) / CH)));
  N = COLS * ROWS;
}

function colName(n){ let s=''; n++; while(n>0){const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0;} return s; }
function ref(i){ return colName(i%COLS)+(Math.floor(i/COLS)+1); }
function rnd(a){ return Math.random()*a; }
function pick(arr){ return arr[Math.random()*arr.length|0]; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function hexA(hex,a){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }

/* ---------- 상태 ---------- */
let cells=[], cellEls=[];
let factions=[];
const obituaries=[];   // {name,year,color,monuments:[...glyph], peak, style}
const masterworks=[];  // {year,kind,glyph,fac,facColor,place,name,note,alive}
const chronicle=[];    // {year,msg,formula,glyph}
let year=1, pop=0, lastEvent='천지가 창조되었습니다.';
let selected=-1, tickN=0;
let nameIdx=0;
let paused=false;
const SPEEDS=[110,55,22]; let speedIdx=0;
let timer=null;

const dirty=new Set();
const plague=new Map();  // idx -> ticks
const fires=new Map();
const festivals=new Map(); // idx -> ticks (bloom)
const aurora=new Map();    // idx -> ticks (cultural radiance from a masterwork)

/* ---------- 이름·예술양식 ---------- */
const NAMES=['북부 왕국','붉은 제국','해안 연맹','유목 칸국','삼나무 공화국','잿빛 교단','동방 상단','검은 강 부족','여명 왕조','소금 사막 민족','자수정 도시국','은빛 수도회'];
const COLORS=['#2563eb','#dc2626','#059669','#7c3aed','#d97706','#0d9488','#be185d','#4d7c0f','#9333ea','#b45309','#0ea5e9','#c026d3'];
const STYLES=['벽화','조각','서사시','합창','직조','청동상','석탑','정원','가면극','채색필사'];
const MONU_GLYPH=['◆','▲','⬟','✦','♜','⛩','卍','☉','✸','❖'];
const FEST_NAMES=['수확제','광명제','풍요의 밤','조상 추모제','별빛 축제','승전 잔치','만개의 축제','강의 노래'];

/* 지도자/하위 에이전트 성격 텍스트 */
const TRAIT_HI={vision:'선견',piety:'경건',ambition:'야망',cruelty:'잔혹',art:'심미'};
const ROLE_NAME={general:'장군',artisan:'장인',priest:'사제',steward:'집정'};
const GIVEN=['하란','테무르','이실','카론','베르타','오딘','세라','묵','람세','유리','아샤','놀란','비라','켄','소라','다리','엔','마야','로한','질','타하','넨'];

/* ---------- 감정 모델 ----------
   각 에이전트/세력은 mood = {joy, anger, grief, awe} 를 가진다.
   사건이 mood 를 흔들고, mood 가 결정을 바꾼다 (대본 없음). */
function newMood(){ return {joy:.3+rnd(.2), anger:rnd(.1), grief:rnd(.1), awe:.1+rnd(.15)}; }
function moodNudge(m,d){ for(const k in d){ m[k]=clamp(m[k]+d[k],0,1); } }
function moodDecay(m){ m.joy=m.joy*.985+.005; m.anger*=.97; m.grief*=.975; m.awe*=.985; }
function dominantMood(m){
  let best='joy',bv=m.joy;
  for(const k of ['anger','grief','awe']) if(m[k]>bv){bv=m[k];best=k;}
  if(bv<.28) return 'calm';
  return best;
}
const MOOD_EMOJI={joy:'☻',anger:'✖',grief:'☂',awe:'✧',calm:''};
const MOOD_KO={joy:'기쁨',anger:'분노',grief:'슬픔',awe:'경외',calm:'평온'};

/* ============================================================
   세력(문명) = 지도자 에이전트 + 하위 에이전트들
   ============================================================ */
function newAgent(role, fac){
  return {
    role,
    name: pick(GIVEN),
    // 성격(0~1): 의사결정 가중치
    vision: rnd(1), piety: rnd(1), ambition: rnd(1), cruelty: rnd(1), art: rnd(1),
    loyalty: .55 + rnd(.4),
    mood: newMood(),
    facId: fac.id,
    // 개인 기억: 최근 자신이 겪은 사건
    memory: [],
  };
}
function agentRemember(a, ev){ a.memory.push(ev); if(a.memory.length>6) a.memory.shift(); }

function topTrait(a){
  let best='vision',bv=-1;
  for(const k of ['vision','piety','ambition','cruelty','art']) if(a[k]>bv){bv=a[k];best=k;}
  return best;
}

function spawnFaction(announce, label){
  if(nameIdx>=NAMES.length) nameIdx=0;
  const idx=nameIdx++;
  const f={
    id: factions.length? Math.max(...factions.map(x=>x.id))+1 : 0,
    name: NAMES[idx], color: COLORS[idx%COLORS.length],
    style: pick(STYLES), monuGlyph: pick(MONU_GLYPH),
    size:0, arr:[],
    golden:0, goldenKind:null,
    muse: 0,           // 축적된 문화 에너지
    treasury: 20,      // 자원
    mood: newMood(),   // 민심(국가 평균 정서)
    monuments: [],     // 세운 기념비 글리프
    peak: 0, born: year,
    leader: null, subs: [],
    grudge: new Map(), // facId -> 원한 수치
    decree: null,      // 현재 지도자 명령 {type, focus, age}
    lastDecreeT: 0,
  };
  f.leader = newAgent('leader', f);
  // 하위 위계: 장군/장인/사제/집정 각 1
  for(const role of ['general','artisan','priest','steward']) f.subs.push(newAgent(role, f));
  // 시작 영토
  for(let tries=0;tries<400;tries++){
    const i=Math.random()*N|0;
    if(cells[i].st==='land' && cells[i].owner===null){
      setCell(i,f.id,1,'개척지');
      factions.push(f);
      if(announce) logEvent(`${f.name}이(가) ${f.style} 문화와 함께 역사에 등장했습니다.`, `=FOUND("${f.name}", style="${f.style}", ${ref(i)})`, '✶');
      return f;
    }
  }
  return null;
}
function facById(id){ return factions.find(f=>f.id===id); }

/* ---------- 셀 ---------- */
function setCell(i,owner,level,histLabel){
  const c=cells[i];
  c.owner=owner; c.level=level; c.st='land';
  if(histLabel){ c.hist.push(`서기 ${year}년 ${histLabel}`); if(c.hist.length>8) c.hist.shift(); }
  dirty.add(i);
}
const LV_TXT=['','·','田','邑','都','京'];
const LV_LABEL=['','개척지','농장','마을','도시','대도시'];

/* ============================================================
   지형 생성 (값잡음)
   ============================================================ */
function genTerrain(){
  const GW=9,GH=6, gz=[];
  for(let i=0;i<GW*GH;i++) gz[i]=Math.random();
  const noise=(x,y)=>{
    const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
    const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
    const a=gz[y0*GW+x0], b=gz[y0*GW+Math.min(GW-1,x0+1)];
    const c=gz[Math.min(GH-1,y0+1)*GW+x0], d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
    return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
  };
  cells=new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS,y=i/COLS|0;
    const v=noise(x,y)+(Math.random()-.5)*.14;
    let st='land', label='황무지';
    if(v<.32){ st='water'; label='바다'; }
    else if(v>.63 && Math.random()<.68){ st='forest'; label='숲'; }
    cells[i]={st,owner:null,level:0,ruinT:0,monu:null,monuFac:null,hist:[`태초의 ${label}`]};
  }
}

function nbrs(i){
  const x=i%COLS,y=i/COLS|0,out=[];
  if(x>0) out.push(i-1);
  if(x<COLS-1) out.push(i+1);
  if(y>0) out.push(i-COLS);
  if(y<ROWS-1) out.push(i+COLS);
  return out;
}
function nbrs8(i){
  const x=i%COLS,y=i/COLS|0,out=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue;
    const nx=x+dx,ny=y+dy;
    if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS) out.push(ny*COLS+nx);
  }
  return out;
}

/* ============================================================
   DOM
   ============================================================ */
function buildSheet(){
  computeDims();
  sheet.style.gridTemplateColumns=`44px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows=CH+'px';
  sheet.textContent='';
  cellEls=new Array(N);
  const frag=document.createDocumentFragment();
  const corner=document.createElement('div'); corner.className='hd'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){ const h=document.createElement('div'); h.className='hd'; h.textContent=colName(c); frag.appendChild(h); }
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div'); h.className='hd'; h.textContent=r+1; frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div'); d.className='cell'; d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d; frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

function paint(i){
  const c=cells[i], el=cellEls[i];
  if(!el) return;
  let bg='', tx='', col='#222', w='', em='', cls='cell';
  if(c.monu){
    const f=c.monuFac!=null?facById(c.monuFac):null;
    const base=f?f.color:'#8a7a3a';
    bg=hexA(base,.22); tx=c.monu; col=base; w='700';
  } else if(plague.has(i)){ bg='#ead5f5'; tx='疫'; col='#7030a0'; w='700'; }
  else if(fires.has(i)){ bg='#ffd9b3'; tx='火'; col='#c00000'; w='700'; }
  else if(festivals.has(i)){
    const f=c.owner!=null?facById(c.owner):null;
    bg=f?hexA(f.color,.30):'#fff0c2'; tx='✿'; col=f?f.color:'#d99a00'; w='700';
  }
  else if(c.st==='water'){ bg='#ddebf7'; tx='≈'; col='#9dc3e6'; }
  else if(c.st==='forest'){ bg='#e2efda'; tx='木'; col='#548235'; }
  else if(c.st==='ruin'){ bg='#ececec'; tx='墟'; col='#999'; }
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      bg=hexA(f.color,.12+c.level*.16); tx=LV_TXT[c.level]||'·'; col=f.color; w=c.level>=3?'700':'';
      const dm=dominantMood(f.mood);
      if(dm!=='calm' && c.level>=2) em=MOOD_EMOJI[dm];
      if(f.golden) cls+=' golden';
    }
  }
  if(aurora.has(i) && !bg){ bg='#fff7d6'; }
  el.className=cls;
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  el.textContent=tx;
  if(em){ const s=document.createElement('span'); s.className='em'; s.textContent=em; el.appendChild(s); }
  if(i===selected) el.classList.add('sel');
}

function animate(i, kind){
  const el=cellEls[i]; if(!el)return;
  el.classList.remove(kind); void el.offsetWidth; el.classList.add(kind);
  setTimeout(()=>el.classList.remove(kind), 1100);
}

/* ============================================================
   로그 / 기록
   ============================================================ */
function logEvent(msg, formula, glyph){
  lastEvent=`서기 ${year}년: ${msg}`;
  if(formula) fmla.textContent=formula;
  chronicle.push({year, msg, formula:formula||'', glyph:glyph||'·'});
  if(chronicle.length>400) chronicle.shift();
}

function recordMasterwork(mw){
  masterworks.push(mw);
  if(masterworks.length>300) masterworks.shift();
}

/* ============================================================
   지도자의 의사결정 (대본 없는 판단)
   상황(자원/이웃/원한/민심)을 읽고 명령(decree)을 정한다.
   ============================================================ */
function leaderDecide(f){
  const L=f.leader;
  moodDecay(L.mood);
  // 명령은 일정 주기로 갱신
  if(f.decree && (year - f.lastDecreeT) < (14 + (10*L.vision|0))) return;

  // 이웃 정세 파악
  let enemyAdj=0, freeAdj=0, allySize=f.size;
  const seen=new Set();
  for(const i of f.arr){
    for(const n of nbrs(i)){
      const oc=cells[n];
      if(oc.st==='water'||oc.st==='ruin') continue;
      if(oc.owner===null){ freeAdj++; }
      else if(oc.owner!==f.id && !seen.has(oc.owner)){ seen.add(oc.owner); enemyAdj++; }
    }
  }
  const lm=L.mood;
  const festFatigue = clamp((year - (f.lastFestT||-99))<25 ? 1.2 : 0, 0, 1.2); // 최근 축제하면 식상
  // 의사결정 점수: 성격 + 감정 + 상황. (창발적: 같은 상황도 성격/감정에 따라 다른 선택)
  const score={
    WAR:    L.ambition*1.2 + L.cruelty*1.1 + lm.anger*1.8 + (enemyAdj?0.8:-1.2) + (f.size>4?0.5:-0.5) + (f.grudge.size?0.9:0),
    EXPAND: L.ambition*0.7 + L.vision*0.5 + (freeAdj?1.0:-1.6) + lm.joy*0.4,
    FESTIVAL: L.art*0.7 + lm.joy*0.9 + (f.muse>22?0.5:-0.7) + (f.size>3?0.2:0) - lm.anger*0.5 - festFatigue,
    MONUMENT: L.art*1.2 + L.piety*0.9 + lm.awe*1.6 + lm.grief*1.5 + (f.muse>26?1.2:-0.6),
    CULTURE: L.art*1.0 + L.vision*0.7 + (enemyAdj?0.9:-0.3) + lm.awe*0.8, // 소프트파워 전파
    CONSOLIDATE: L.vision*0.8 + lm.grief*0.6 - L.ambition*0.4 + (f.size<3?0.8:-0.2),
  };
  // 약간의 무작위(자유의지)
  for(const k in score) score[k]+= rnd(.7);
  let best='EXPAND',bv=-1e9;
  for(const k in score) if(score[k]>bv){bv=score[k];best=k;}

  let focus=null;
  if(best==='WAR'){
    // 가장 원한 깊은/약한 이웃 지목
    let target=null,tv=-1e9;
    for(const eid of seen){
      const ef=facById(eid); if(!ef)continue;
      const g=f.grudge.get(eid)||0;
      const v=g*1.5 + (f.size - ef.size)*0.3 + rnd(1);
      if(v>tv){tv=v;target=eid;}
    }
    focus=target;
  }
  f.decree={type:best, focus, age:0};
  f.lastDecreeT=year;

  const DEC_KO={WAR:'정복',EXPAND:'개척',FESTIVAL:'축제 개최',MONUMENT:'기념비 건립',CULTURE:'문화 전파',CONSOLIDATE:'내실 다지기'};
  const tname = focus!=null && facById(focus) ? `→${facById(focus).name}` : '';
  // 명령은 가끔만 연대기에 (스팸 방지) — 큰 명령 위주
  if(['WAR','MONUMENT','FESTIVAL','CULTURE'].includes(best) && Math.random()<.5){
    logEvent(`${f.name}의 지도자 ${L.name}(${TRAIT_HI[topTrait(L)]})이(가) "${DEC_KO[best]}"을(를) 명령했습니다.`,
      `=DECREE("${f.name}", leader="${L.name}", order="${DEC_KO[best]}"${tname?`, target="${facById(focus).name}"`:''})`, '⚑');
  }
}

/* ============================================================
   하위 에이전트의 해석·수행·항명·배신
   명령을 받되, 성격/충성/감정으로 다르게 행동한다.
   ============================================================ */
function subordinatesAct(f){
  if(!f.decree) return;
  const dec=f.decree; dec.age++;
  const order=dec.type;

  // 정변으로 멤버가 바뀔 수 있으므로 스냅샷 순회
  for(const a of [...f.subs]){
    if(!f.subs.includes(a)) continue; // 이미 독립/축출됨
    moodDecay(a.mood);
    // 충성도: 지도자 잔혹성·반복된 부적합 명령·민심 분노가 깎고, 황금기·축제가 올린다
    if(f.leader.cruelty>0.6) a.loyalty=clamp(a.loyalty-0.010*f.leader.cruelty,0,1);
    if(f.mood.anger>0.6) a.loyalty=clamp(a.loyalty-0.006,0,1);
    if(f.mood.grief>0.6) a.loyalty=clamp(a.loyalty-0.004,0,1);
    if(f.golden) a.loyalty=clamp(a.loyalty+0.006,0,1);
    // 야심 큰 장군은 큰 세력에서 점점 흑심을 품는다
    if(a.role==='general' && a.ambition>0.65 && f.size>5) a.loyalty=clamp(a.loyalty-0.004*a.ambition,0,1);

    // 이 명령이 이 에이전트의 성향과 맞는가? (해석)
    const fit=orderFit(order, a);
    // 자기 성향과 정반대 명령을 받으면 충성 추가 하락(불만 누적)
    if(fit<0.3) a.loyalty=clamp(a.loyalty-0.008,0,1);
    // 항명 확률: 낮은 충성 + 명령 부적합 + 분노
    const defyP = (1-a.loyalty)*0.6 + (1-fit)*0.3 + a.mood.anger*0.45 - 0.28;

    if(defyP>0.45 && Math.random()<defyP*0.6){
      // 항명: 명령을 무시하고 자기 성향대로 행동
      const ownAct = preferredAction(a);
      doAction(f, a, ownAct, true);
      agentRemember(a, '명령 거부');
      moodNudge(f.mood,{anger:.05});
      if(a.loyalty<0.25 && f.size>=3 && Math.random()<0.22){
        attemptBetrayal(f, a);
      }
    } else {
      // 순응(때로 적당히): 명령 수행
      doAction(f, a, order, false);
      a.loyalty=clamp(a.loyalty+0.002*fit,0,1);
    }
  }
}

function orderFit(order, a){
  switch(order){
    case 'WAR': return clamp(a.ambition*0.5+a.cruelty*0.5+a.mood.anger*0.4,0,1);
    case 'EXPAND': return clamp(a.ambition*0.4+a.vision*0.4+0.2,0,1);
    case 'FESTIVAL': return clamp(a.art*0.6+a.mood.joy*0.4,0,1);
    case 'MONUMENT': return clamp(a.art*0.5+a.piety*0.5,0,1);
    case 'CULTURE': return clamp(a.art*0.7+a.vision*0.3,0,1);
    case 'CONSOLIDATE': return clamp(a.vision*0.5+0.3,0,1);
  }
  return 0.4;
}
function preferredAction(a){
  // 그 에이전트가 진짜 하고 싶은 것
  if(a.role==='general' && a.ambition>0.5) return 'WAR';
  if(a.role==='artisan') return a.mood.grief>0.4?'MONUMENT':'FESTIVAL';
  if(a.role==='priest') return 'MONUMENT';
  if(a.role==='steward') return 'CONSOLIDATE';
  const t=topTrait(a);
  return {ambition:'WAR',cruelty:'WAR',art:'FESTIVAL',piety:'MONUMENT',vision:'EXPAND'}[t]||'EXPAND';
}

/* ---------- 실제 행동 실행 ---------- */
function doAction(f, agent, order, defied){
  switch(order){
    case 'WAR': actWar(f, agent, defied); break;
    case 'EXPAND': actExpand(f, agent); break;
    case 'FESTIVAL': actFestival(f, agent, defied); break;
    case 'MONUMENT': actMonument(f, agent, defied); break;
    case 'CULTURE': actCulture(f, agent); break;
    case 'CONSOLIDATE': actConsolidate(f, agent); break;
  }
  // 행동의 부산물로 무세(문화에너지) 천천히 누적
  f.muse += 0.18 + f.leader.art*0.18 + (f.golden&&f.goldenKind==='예술'?0.6:0);
}

function actExpand(f, agent){
  const tries=2+(f.size*0.06|0);
  for(let a=0;a<tries;a++){
    const src=pick(f.arr); if(src===undefined||cells[src].owner!==f.id) continue;
    const tgt=pick(nbrs(src)); const tc=cells[tgt];
    if(!tc||tc.st==='water'||fires.has(tgt)||tc.monu) continue;
    if(tc.owner===null){
      if(tc.st==='forest'){ if(Math.random()<.28){ tc.st='land'; setCell(tgt,f.id,1,'개간'); } }
      else if(tc.st==='land') setCell(tgt,f.id,1,'개척지');
    }
  }
  // 약간의 발전
  upgradeRandom(f);
}

function upgradeRandom(f){
  const ups=1+(f.size*0.05|0);
  for(let u=0;u<ups;u++){
    const i=pick(f.arr); if(i===undefined||cells[i].owner!==f.id) continue;
    const c=cells[i];
    if(c.level<5 && Math.random()< .055*(f.golden?2.6:1)*(c.level<4?1:0.5)){
      c.level++; setCell(i,f.id,c.level,LV_LABEL[c.level]);
      // 첫 수도만 기록 (스팸 방지)
      if(c.level===5 && !f.hadCapital){
        f.hadCapital=true;
        logEvent(`${f.name}의 ${ref(i)}이(가) 찬란한 수도(京)로 성장했습니다.`, `=CAPITAL("${f.name}", ${ref(i)})`, '京');
      }
    }
  }
}

function actWar(f, agent, defied){
  let target=f.decree?f.decree.focus:null;
  // 항명 장군은 자기 판단으로 표적 선택
  if(defied || target==null || !facById(target)){
    const seen=new Set();
    for(const i of f.arr) for(const n of nbrs(i)){ const oc=cells[n]; if(oc.owner!=null&&oc.owner!==f.id) seen.add(oc.owner); }
    target = seen.size? pick([...seen]) : null;
  }
  const tries=2+(f.size*0.05|0);
  let fought=false;
  for(let a=0;a<tries;a++){
    const src=pick(f.arr); if(src===undefined||cells[src].owner!==f.id) continue;
    const tgt=pick(nbrs(src)); const tc=cells[tgt];
    if(!tc||tc.st==='water'||tc.monu) continue;
    if(tc.owner!==null && tc.owner!==f.id && (target==null||tc.owner===target)){
      fought=true;
      const att=1 + rnd(3) + f.size*0.002 + (f.golden?1:0) + f.leader.cruelty + agent.mood.anger*1.5;
      const def=tc.level+1 + rnd(3);
      animate(tgt,'war');
      if(att>def){
        const defF=facById(tc.owner);
        if(defF){
          // 원한·민심
          defF.grudge.set(f.id, (defF.grudge.get(f.id)||0)+1);
          moodNudge(defF.mood,{anger:.2,grief:.15,joy:-.1});
          moodNudge(f.mood,{joy:.06,anger:-.05});
        }
        if(Math.random()<.28 && !tc.monu){
          fires.set(tgt,5); setCell(tgt,f.id,0,'전화(戰火)'); fires.set(tgt,5);
          cells[tgt].owner=null; cells[tgt].level=0; dirty.add(tgt);
        } else {
          // 적의 기념비를 약탈하면 경외+무세
          if(tc.monu){ /* 기념비는 점령 못함 위에서 걸렀음 */ }
          setCell(tgt,f.id,Math.max(1,tc.level-1),'점령됨');
        }
        if(defF && (tc.level>=3 || Math.random()<.25)){
          logEvent(`${f.name}의 장군 ${agent.name}이(가) ${defF.name}의 ${ref(tgt)}을(를) 함락했습니다.`,
            `=CONQUER("${f.name}"→"${defF.name}", ${ref(tgt)})`, '⚔');
        }
      } else {
        moodNudge(f.mood,{anger:.06,grief:.04});
      }
      break;
    }
  }
  if(!fought) actExpand(f, agent); // 적이 없으면 개척으로 전환(적응)
}

function actFestival(f, agent, defied){
  // 무세가 충분하고 최근에 열지 않았을 때만 (자기 제한 → 축제는 특별한 사건)
  if(f.muse<18 || (year-(f.lastFestT||-99))<14){ actConsolidate(f,agent); return; }
  const towns=f.arr.filter(i=>cells[i].level>=2);
  if(!towns.length){ actExpand(f,agent); return; }
  const i=pick(towns);
  f.muse-=18; f.lastFestT=year;
  festivals.set(i, 8+ (rnd(5)|0));
  for(const n of nbrs8(i)) if(cells[n].owner===f.id) festivals.set(n, 6+(rnd(4)|0)), dirty.add(n);
  dirty.add(i); animate(i,'fest');
  moodNudge(f.mood,{joy:.30, grief:-.14, anger:-.12, awe:.06});
  for(const s of f.subs) moodNudge(s.mood,{joy:.18, anger:-.08}), s.loyalty=clamp(s.loyalty+0.03,0,1);
  moodNudge(agent.mood,{joy:.25});
  const fn=pick(FEST_NAMES);
  logEvent(`${f.name}이(가) ${ref(i)}에서 「${fn}」을(를) 열어 온 백성이 기뻐했습니다.`,
    `=FESTIVAL("${f.name}", "${fn}", ${ref(i)}, joy+)`, '✿');
  recordMasterwork({year, kind:'축제', glyph:'✿', fac:f.name, facColor:f.color, place:ref(i), name:fn, note:`${f.style} 양식의 향연`, alive:true});
}

function actMonument(f, agent, defied){
  if(f.muse<24){ actFestival(f,agent,defied); return; }
  // 기념비는 도시급 셀(또는 큰 마을)에 영구히 선다. 슬픔/경외에서 더 잘 나옴.
  const cand=f.arr.filter(i=>cells[i].level>=3 && !cells[i].monu);
  let i;
  if(cand.length) i=pick(cand);
  else { const c2=f.arr.filter(i=>cells[i].level>=2 && !cells[i].monu); if(!c2.length){ actFestival(f,agent,defied); return; } i=pick(c2); }
  f.muse-=24;
  const c=cells[i];
  c.monu=f.monuGlyph; c.monuFac=f.id;
  c.hist.push(`서기 ${year}년 ${f.style} 기념비 건립`); if(c.hist.length>8) c.hist.shift();
  f.monuments.push(f.monuGlyph);
  aurora.set(i, 60);
  for(const n of nbrs8(i)){ aurora.set(n, 40); dirty.add(n); }
  dirty.add(i); animate(i,'monu');
  moodNudge(f.mood,{awe:.4, grief:-.2, joy:.12});
  for(const s of f.subs) moodNudge(s.mood,{awe:.25}), s.loyalty=clamp(s.loyalty+0.025,0,1);
  const reason = f.mood.grief>0.35 ? '전몰자를 추모하며' : f.leader.piety>0.6 ? '신께 바치는' : '영광을 기리는';
  const wn = `${f.style}의 ${pick(['대탑','성소','기념비','광장','전당','석상'])}`;
  logEvent(`${f.name}이(가) ${ref(i)}에 ${reason} 「${wn}」을(를) 세웠습니다.`,
    `=MONUMENT("${f.name}", "${wn}", ${ref(i)}, awe+)`, f.monuGlyph);
  recordMasterwork({year, kind:'기념비', glyph:f.monuGlyph, fac:f.name, facColor:f.color, place:ref(i), name:wn, note:reason, alive:true, cellIdx:i});
}

function actCulture(f, agent){
  // 소프트파워: 인접한 적/중립 셀을 무력 아닌 문화로 끌어들인다
  if(f.muse<6){ actConsolidate(f,agent); return; }
  let done=false;
  const order=[...f.arr].sort(()=>Math.random()-.5);
  for(const i of order){
    for(const n of nbrs(i)){
      const oc=cells[n];
      if(oc.monu) continue;
      if(oc.owner!==null && oc.owner!==f.id){
        const ef=facById(oc.owner);
        // 우리의 무세·예술 vs 그들의 민심. 그들이 불행할수록 잘 넘어온다.
        const pull = f.muse*0.01 + f.leader.art*0.6 + (ef? ef.mood.grief+ef.mood.anger : 0)*0.5;
        if(ef && pull>1.0 && Math.random()<0.12 && oc.level<=2){
          setCell(n, f.id, Math.max(1,oc.level), '문화 귀순');
          f.muse-=6;
          moodNudge(f.mood,{awe:.1,joy:.08});
          if(Math.random()<.55){
            logEvent(`${ef.name}의 ${ref(n)} 주민이 ${f.name}의 ${f.style} 문화에 매료되어 귀순했습니다.`,
              `=ASSIMILATE("${f.name}"←"${ef.name}", ${ref(n)}, culture)`, '☯');
          }
          done=true; break;
        }
      }
    }
    if(done) break;
  }
  if(!done) actExpand(f, agent);
}

function actConsolidate(f, agent){
  // 내실: 발전 + 민심 안정 + 무세 비축
  upgradeRandom(f);
  f.muse += 0.5 + (agent.role==='artisan'?0.4:0);
  moodNudge(f.mood,{anger:-.04, grief:-.03, joy:.02});
}

/* ============================================================
   배신 / 반란 / 분열
   ============================================================ */
function attemptBetrayal(f, traitor){
  // 충성이 바닥난 하위 에이전트가 영토를 떼어 독립하거나 지도자를 친다
  const mode = Math.random();
  if(mode<0.5 && f.subs.length){
    // 쿠데타: 지도자 교체 (성향이 바뀜 → 다른 역사)
    const old=f.leader;
    f.leader=traitor; f.leader.role='leader';
    f.subs=f.subs.filter(s=>s!==traitor);
    f.subs.push(newAgent(pick(['general','artisan','priest','steward']), f));
    for(const s of f.subs) s.loyalty=clamp(s.loyalty- .1 + rnd(.3),0,1);
    moodNudge(f.mood,{anger:.3, grief:.2, joy:-.15});
    f.decree=null;
    logEvent(`${f.name}에서 ${traitor.name}이(가) 정변을 일으켜 ${old.name}을(를) 끌어내렸습니다.`,
      `=COUP("${f.name}", "${traitor.name}"→leader)`, '☄');
  } else if(f.size>=4){
    // 분리독립: 영토 절반을 떼어 새 세력 결성
    if(nameIdx>=NAMES.length) return;
    const newF={
      id: factions.length? Math.max(...factions.map(x=>x.id))+1:0,
      name: NAMES[nameIdx]+'(분파)', color: COLORS[nameIdx%COLORS.length],
      style: f.style+'·이단', monuGlyph: pick(MONU_GLYPH),
      size:0, arr:[], golden:0, goldenKind:null, muse:f.muse*0.3, treasury:8,
      mood:newMood(), monuments:[], peak:0, born:year,
      leader:traitor, subs:[], grudge:new Map([[f.id,3]]), decree:null, lastDecreeT:0,
    };
    nameIdx++;
    traitor.role='leader'; traitor.facId=newF.id;
    for(const role of ['general','artisan']) newF.subs.push(newAgent(role,newF));
    f.subs=f.subs.filter(s=>s!==traitor);
    f.subs.push(newAgent('steward',f));
    // 영토 절반(지리적으로 한쪽)
    const sorted=[...f.arr].sort((a,b)=>a-b);
    const take=sorted.slice(0, Math.floor(sorted.length/2));
    for(const i of take){ if(cells[i].monu) continue; cells[i].owner=newF.id; setCell(i,newF.id,cells[i].level,'독립 가담'); }
    factions.push(newF);
    f.grudge.set(newF.id,2);
    moodNudge(f.mood,{anger:.35,grief:.25});
    logEvent(`${traitor.name}이(가) ${f.name}을(를) 배신하고 「${newF.name}」으로 독립을 선포했습니다.`,
      `=SECEDE("${newF.name}"⊂"${f.name}", led_by="${traitor.name}")`, '✂');
  }
}

/* ============================================================
   재난 / 환경 틱 (감정에 연결)
   ============================================================ */
function envTick(){
  // 화재 확산/소멸
  for(const [i,t] of [...fires]){
    if(Math.random()<.13){
      for(const n of nbrs(i)){ const c=cells[n]; if(c.owner!==null && !fires.has(n) && c.st==='land' && !c.monu){ fires.set(n,5); dirty.add(n); } }
    }
    if(t<=1){
      fires.delete(i); const c=cells[i];
      const f=c.owner!=null?facById(c.owner):null;
      if(f) moodNudge(f.mood,{grief:.12,joy:-.06});
      c.owner=null; c.level=0; c.st='ruin'; c.ruinT=200;
      c.hist.push(`서기 ${year}년 잿더미`); if(c.hist.length>8) c.hist.shift();
      dirty.add(i);
    } else fires.set(i,t-1);
  }
  // 역병
  if(plague.size){
    for(const [i,t] of [...plague]){
      if(Math.random()<.16) for(const n of nbrs(i)){ if(cells[n].owner!==null && !plague.has(n) && !cells[n].monu){ plague.set(n,11); dirty.add(n); } }
      if(Math.random()<.22){
        const c=cells[i]; c.level--;
        const f=c.owner!=null?facById(c.owner):null; if(f) moodNudge(f.mood,{grief:.08});
        if(c.level<=0){ c.owner=null; c.level=0; c.hist.push(`서기 ${year}년 역병으로 소멸`); if(c.hist.length>8)c.hist.shift(); }
        dirty.add(i);
      }
      if(t<=1){ plague.delete(i); dirty.add(i); } else plague.set(i,t-1);
    }
    if(plague.size===0) logEvent('역병이 물러갔습니다.', '=PLAGUE.END()', '✚');
  }
  // 축제/오로라 감쇠
  for(const [i,t] of [...festivals]){ if(t<=1){ festivals.delete(i); dirty.add(i);} else festivals.set(i,t-1); }
  for(const [i,t] of [...aurora]){ if(t<=1){ aurora.delete(i); dirty.add(i);} else aurora.set(i,t-1); }
}

/* ---------- 무작위 사건 ---------- */
function randomEvents(){
  const r=Math.random();
  if(!plague.size && r<.004){
    const big=cells.map((c,i)=>({c,i})).filter(o=>o.c.owner!==null && o.c.level>=3 && !o.c.monu);
    if(big.length){ const o=pick(big); plague.set(o.i,11); dirty.add(o.i);
      logEvent(`${ref(o.i)}에서 역병이 창궐했습니다.`, `=PLAGUE(${ref(o.i)})`, '疫'); }
  } else if(r>.9965 && factions.length){
    const f=pick(factions); f.golden=110; f.goldenKind = f.leader.art>0.55?'예술':'국력';
    moodNudge(f.mood,{joy:.3,awe:.2}); for(const s of f.subs) s.loyalty=clamp(s.loyalty+.08,0,1);
    logEvent(`${f.name}에 ${f.goldenKind}의 황금기가 도래했습니다.`, `=GOLDEN.AGE("${f.name}", "${f.goldenKind}", 110)`, '✦');
    if(f.goldenKind==='예술') f.muse+=20;
  } else if(r>.9935 && r<=.9965){
    const towns=cells.map((c,i)=>({c,i})).filter(o=>o.c.owner!==null && o.c.level>=2 && !o.c.monu);
    if(towns.length){ const o=pick(towns); fires.set(o.i,6); dirty.add(o.i);
      logEvent(`${ref(o.i)}에 대화재가 발생했습니다.`, `=FIRE(${ref(o.i)})`, '火'); }
  }
  // 이주(세력이 적으면 바다 건너 도래)
  if(factions.length<6 && factions.length<3+( (year/300)|0 ) && Math.random()<.01){
    const f=spawnFaction(false);
    if(f) logEvent(`바다 건너에서 ${f.name}이(가) ${f.style} 문화를 가지고 도래했습니다.`, `=MIGRATE("${f.name}", style="${f.style}")`, '⛵');
  }
}

/* ============================================================
   멸망 판정 — 기념비는 살아남아 역사에 남는다
   ============================================================ */
function checkCollapse(){
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      // 남은 기념비를 "폐허의 비석"으로 전환 → 영원히 기억됨
      let survivingMonu=[];
      for(let i=0;i<N;i++){
        if(cells[i].monu && cells[i].monuFac===f.id){
          survivingMonu.push(cells[i].monu);
          cells[i].monuFac=null; // 주인 없는 유적
          cells[i].hist.push(`서기 ${year}년 ${f.name} 멸망, 기념비만 남다`);
          dirty.add(i);
        }
      }
      for(const mw of masterworks){ if(mw.fac===f.name) mw.alive=false; }
      obituaries.push({name:f.name, year, color:f.color, monuments:survivingMonu.slice(), peak:f.peak, style:f.style});
      logEvent(`${f.name}이(가) 역사에서 사라졌습니다.${survivingMonu.length?` 그러나 ${survivingMonu.length}기의 기념비가 폐허로 남았습니다.`:''}`,
        `=COLLAPSE("${f.name}", ${year}, monuments_remain=${survivingMonu.length})`, '†');
      factions.splice(k,1);
    }
  }
}

/* ============================================================
   메인 틱
   ============================================================ */
function tick(){
  tickN++; year++;

  // 소유 재집계
  for(const f of factions){ f.arr.length=0; f.size=0; moodDecay(f.mood); }
  pop=0;
  const PW=[0,40,160,520,1400,3200];
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin' && --c.ruinT<=0){ c.st='land'; dirty.add(i); }
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){ f.arr.push(i); f.size++; pop+=PW[c.level]||0; }
      else { c.owner=null; c.level=0; dirty.add(i); }
    }
  }
  for(const f of factions){ if(f.size>f.peak) f.peak=f.size; }

  checkCollapse();
  envTick();

  // 에이전트 의사결정 + 위계 수행
  for(const f of factions){
    if(f.golden>0) f.golden--;
    if(f.size===0) continue;
    leaderDecide(f);
    subordinatesAct(f);
    // 민심이 너무 분노/슬픔에 차면 자발적 봉기(소규모)
    if((f.mood.anger>0.8 || f.mood.grief>0.85) && Math.random()<0.03){
      const tgt=pick(f.arr);
      if(tgt!==undefined && cells[tgt].level>=2 && !cells[tgt].monu){
        fires.set(tgt,4); dirty.add(tgt);
        logEvent(`${f.name}의 ${ref(tgt)}에서 성난 민중이 봉기를 일으켰습니다.`, `=REVOLT("${f.name}", ${ref(tgt)}, anger=high)`, '☄');
        moodNudge(f.mood,{anger:-.2});
      }
    }
  }

  randomEvents();

  // 그리기
  for(const i of dirty) paint(i);
  dirty.clear();

  renderStatus();
  if(tickN%8===0) renderPanel();
  if(curView==='chron' && tickN%6===0) renderChron();
  if(curView==='work' && tickN%6===0) renderWork();
  if(curView==='dead' && tickN%10===0) renderDead();
}

/* ============================================================
   렌더 — 상태바 / 패널
   ============================================================ */
function renderStatus(){
  const golden=factions.filter(f=>f.golden>0).length;
  statusbar.innerHTML=`준비<span class="sep">|</span>서기 ${year}년<span class="sep">|</span>세계 인구 ${pop.toLocaleString()}명`+
    `<span class="sep">|</span>문명 ${factions.length}<span class="sep">|</span>걸작 ${masterworks.length}`+
    `<span class="sep">|</span><span class="ev">${lastEvent}</span>`;
}

let hiFac=-1;
function renderPanel(){
  const sorted=[...factions].sort((a,b)=>b.size-a.size);
  let h='<h4>문명 현황 (영토·민심)</h4>';
  if(!sorted.length) h+='<div style="color:#aaa">— 모든 문명이 사라졌다 —</div>';
  for(const f of sorted){
    const dm=dominantMood(f.mood);
    const w=Math.max(6, Math.min(70, f.size*3));
    h+=`<div class="fac${f.id===hiFac?' hi':''}" data-f="${f.id}">`+
       `<span class="sw" style="background:${f.color}"></span>${f.name}${f.golden?(f.goldenKind==='예술'?' ✦':' ✧'):''}`+
       `<span class="bar" style="width:${w}px;background:${f.color}"></span></div>`;
    h+=`<div class="moods">${MOOD_EMOJI[dm]||'·'} ${MOOD_KO[dm]} · ${f.style} · 무세 ${f.muse|0} · 비${f.monuments.length}`;
    h+=` · 지도자 ${f.leader.name}(${TRAIT_HI[topTrait(f.leader)]})</div>`;
  }
  if(obituaries.length){
    h+='<h4>멸망기록</h4>';
    for(const o of obituaries.slice(-4)) h+=`<div class="dead">† ${o.name} <small>(${o.year}년)</small> ${o.monuments.join('')}</div>`;
  }
  h+='<h4>범례</h4><div style="font-size:9.5px;line-height:1.6;color:#777">'+
     '· 田邑都京=정착지 단계 · 木=숲 ≈=바다 墟=폐허<br>'+
     '✿=축제 火=화재 疫=역병 ◆▲=기념비<br>'+
     '☻기쁨 ✖분노 ☂슬픔 ✧경외 (셀 모서리)</div>';
  panel.innerHTML=h;
}

/* ============================================================
   시트 전환 (Sheet1 / 연대기 / 걸작목록 / 멸망기록)
   ============================================================ */
let curView='sheet';
function renderChron(){
  const rows=chronicle.slice(-160).reverse();
  let h='<table><thead><tr><th class="glyph"></th><th>연도</th><th>사건</th><th>수식</th></tr></thead><tbody>';
  if(!rows.length) h+='<tr><td colspan="4" class="empty">아직 기록된 역사가 없습니다.</td></tr>';
  for(const e of rows){
    h+=`<tr><td class="glyph">${e.glyph}</td><td class="yr">서기 ${e.year}년</td><td>${esc(e.msg)}</td><td class="f">${esc(e.formula)}</td></tr>`;
  }
  h+='</tbody></table>';
  chronView.innerHTML=h;
}
function renderWork(){
  const rows=[...masterworks].reverse();
  let h='<table><thead><tr><th class="glyph"></th><th>연도</th><th>종류</th><th>이름</th><th>문명</th><th>위치</th><th>상태</th></tr></thead><tbody>';
  if(!rows.length) h+='<tr><td colspan="7" class="empty">아직 만들어진 걸작이 없습니다. 문명이 무세를 쌓으면 축제와 기념비가 생깁니다.</td></tr>';
  for(const w of rows){
    h+=`<tr><td class="glyph" style="color:${w.facColor}">${w.glyph}</td><td class="yr">서기 ${w.year}년</td>`+
       `<td>${w.kind}</td><td>「${esc(w.name)}」<br><small style="color:#999">${esc(w.note||'')}</small></td>`+
       `<td><span style="color:${w.facColor};font-weight:600">${esc(w.fac)}</span></td><td class="yr">${w.place}</td>`+
       `<td style="color:${w.alive?'#107c41':'#bb5'}">${w.alive?'현존':'유실/유적'}</td></tr>`;
  }
  h+='</tbody></table>';
  workView.innerHTML=h;
}
function renderDead(){
  const rows=[...obituaries].reverse();
  let h='<table><thead><tr><th class="glyph">†</th><th>문명</th><th>멸망</th><th>최전성기</th><th>예술양식</th><th>남은 기념비</th></tr></thead><tbody>';
  if(!rows.length) h+='<tr><td colspan="6" class="empty">아직 멸망한 문명이 없습니다.</td></tr>';
  for(const o of rows){
    h+=`<tr><td class="glyph" style="color:${o.color}">†</td><td><span style="color:${o.color};font-weight:600">${esc(o.name)}</span></td>`+
       `<td class="yr">서기 ${o.year}년</td><td class="yr">영토 ${o.peak}칸</td><td>${esc(o.style)}</td>`+
       `<td style="font-size:14px">${o.monuments.join(' ')||'<small style="color:#bbb">— 흔적 없음 —</small>'}</td></tr>`;
  }
  h+='</tbody></table>';
  deadView.innerHTML=h;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function switchView(v){
  curView=v;
  document.querySelectorAll('#tabs div').forEach(d=>d.classList.toggle('on', d.dataset.v===v));
  document.getElementById('sheetView').style.display = v==='sheet'?'block':'none';
  chronView.style.display = v==='chron'?'block':'none';
  workView.style.display = v==='work'?'block':'none';
  deadView.style.display = v==='dead'?'block':'none';
  if(v==='chron') renderChron();
  if(v==='work') renderWork();
  if(v==='dead') renderDead();
}

/* ---------- 탭 라벨 갱신 ---------- */
function refreshTabLabels(){
  document.querySelector('#tabs div[data-v="work"]').textContent=`걸작목록 (${masterworks.length})`;
  document.querySelector('#tabs div[data-v="dead"]').textContent=`멸망기록 (${obituaries.length})`;
  document.title=`문명.xlsx - Excel (서기 ${year}년)`;
}

/* ============================================================
   상호작용
   ============================================================ */
sheet.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  if(selected>=0 && cellEls[selected]) cellEls[selected].classList.remove('sel');
  selected=+t.dataset.i; t.classList.add('sel');
  namebox.textContent=ref(selected);
  const c=cells[selected];
  // 셀 클릭 = 그 땅의 역사 + (소유주면) 지도자/감정/명령
  let parts=c.hist.map(x=>`"${x}"`);
  if(c.monu){
    const f=c.monuFac!=null?facById(c.monuFac):null;
    fmla.textContent=`=LANDMARK(${ref(selected)}, "${c.monu}"${f?`, owner="${f.name}"`:', "주인 잃은 유적"'}) :: HISTORY(${parts.join(' → ')})`;
  } else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      const dm=dominantMood(f.mood);
      fmla.textContent=`=CELL(${ref(selected)}, "${f.name}", "${LV_LABEL[c.level]||'땅'}", 민심="${MOOD_KO[dm]}", 명령="${f.decree?f.decree.type:'—'}") :: HISTORY(${parts.join(' → ')})`;
    } else fmla.textContent=`=HISTORY(${parts.join(' → ')})`;
  } else {
    fmla.textContent=`=HISTORY(${parts.join(' → ')})`;
  }
});

// 패널의 문명 클릭 = 그 문명 강조
panel.addEventListener('click', e=>{
  const f=e.target.closest('.fac'); if(!f)return;
  const id=+f.dataset.f;
  hiFac=(hiFac===id?-1:id);
  renderPanel();
  // 강조: 해당 문명 셀에 잠깐 축제 애니메이션
  if(hiFac>=0){ const fac=facById(hiFac); if(fac) for(const i of fac.arr.slice(0,40)) animate(i,'fest'); }
});

document.getElementById('tabs').addEventListener('click', e=>{
  const d=e.target.closest('div[data-v]'); if(!d)return; switchView(d.dataset.v);
});

const btnPause=document.getElementById('btnPause');
const btnSpeed=document.getElementById('btnSpeed');
btnPause.addEventListener('click', ()=>{
  paused=!paused;
  btnPause.textContent = paused?'▶ 재생':'⏸ 일시정지';
  restartTimer();
});
btnSpeed.addEventListener('click', ()=>{
  speedIdx=(speedIdx+1)%SPEEDS.length;
  btnSpeed.textContent=`▶▶ 속도 ×${[1,2,5][speedIdx]}`;
  restartTimer();
});
function restartTimer(){
  if(timer) clearInterval(timer);
  if(!paused) timer=setInterval(()=>{ tick(); refreshTabLabels(); }, SPEEDS[speedIdx]);
}

/* ---------- 리사이즈(반응형) ---------- */
let rzT=null;
window.addEventListener('resize', ()=>{
  clearTimeout(rzT);
  rzT=setTimeout(()=>{ /* 격자만 재계산 — 진행중 역사 보존 위해 셀 재생성은 안 함 */ }, 200);
});

/* ============================================================
   시작 (첫 페인트 = 즉시 동작하는 스프레드시트)
   ============================================================ */
function boot(){
  buildSheet();
  genTerrain();
  for(let i=0;i<N;i++) paint(i);
  fmla.textContent=`=SIM.CIVILIZATION($A$1:$${colName(COLS-1)}$${ROWS}, theme="예술·축제·기념비", "역사는 창발한다")`;
  namebox.textContent='A1';
  // 초기 문명 셋
  spawnFaction(true); spawnFaction(true); spawnFaction(true);
  renderStatus(); renderPanel(); refreshTabLabels();
  restartTimer();
}
boot();
})();
</script>
