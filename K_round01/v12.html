<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>문명.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  *{box-sizing:border-box}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:18px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px;white-space:nowrap}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px;flex-shrink:0}
  #namebox{width:74px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;flex-shrink:0}
  #fx{width:28px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif;flex-shrink:0}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #main{position:relative;flex:1;overflow:hidden;background:#fff;display:flex;flex-direction:column}
  #sheetwrap{position:relative;flex:1;overflow:auto;background:#fff}
  #sheet{display:grid;background:#fff;width:max-content}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:11px;position:sticky;z-index:3}
  .hd.col{top:0}
  .hd.row{left:0;z-index:4}
  .hd.corner{top:0;left:0;z-index:5}
  .cell{border-right:1px solid #e3e3e3;border-bottom:1px solid #e3e3e3;
    display:flex;align-items:center;justify-content:center;font-size:11px;
    overflow:hidden;cursor:cell;position:relative}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:2}
  .cell .cap{position:absolute;top:-1px;right:0px;font-size:8px;line-height:1;opacity:.85}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #ff4d4d}50%{box-shadow:inset 0 0 0 2px #ffd0d0}}

  /* sheets panel (tech / chronicle / dead) */
  #panel{position:absolute;inset:0;background:#fff;display:none;flex-direction:column;z-index:8;overflow:hidden}
  #panel.on{display:flex}
  #panel .ph{height:30px;background:#f5f5f5;border-bottom:1px solid #d0d0d0;display:flex;align-items:center;
    padding:0 14px;font-weight:600;color:#107c41;gap:10px}
  #panel .ph small{font-weight:400;color:#888}
  #panel .pbody{flex:1;overflow:auto;padding:0}
  table.x{border-collapse:collapse;width:100%;font-size:11.5px}
  table.x th{background:#f5f5f5;border:1px solid #d0d0d0;padding:3px 8px;color:#555;font-weight:600;
    position:sticky;top:0;text-align:left;white-space:nowrap}
  table.x td{border:1px solid #e3e3e3;padding:3px 8px;vertical-align:top;color:#222;line-height:1.45}
  table.x tr:nth-child(even) td{background:#fafafa}
  .ftag{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .techname{font-weight:600}
  .deadrow td{color:#999}
  /* legend overlay */
  #legend{position:absolute;top:8px;right:14px;background:#fffce6;border:1px solid #d8c66a;
    box-shadow:2px 3px 9px rgba(0,0,0,.18);padding:8px 11px;font-size:11px;z-index:6;
    width:240px;max-height:calc(100% - 20px);overflow:auto;line-height:1.55}
  #legend h4{margin:6px 0 3px;font-size:11px;color:#7a6a1f}
  #legend h4:first-child{margin-top:0}
  #legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  #legend .dead{color:#999;font-size:10.5px}
  #legend .mood{font-size:10px;color:#555}
  #legend .bar{display:inline-block;height:6px;border-radius:3px;vertical-align:1px}

  #legend .small{font-size:10px;color:#777}
  #legendToggle{position:absolute;top:8px;right:14px;z-index:7;background:#fffce6;border:1px solid #d8c66a;

  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;flex-shrink:0;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 9px;opacity:.5}
  #statusbar .ev{overflow:hidden;text-overflow:ellipsis}
  #statusbar .btn{margin-left:auto;background:rgba(255,255,255,.18);border:none;color:#fff;
    padding:2px 8px;border-radius:3px;cursor:pointer;font-size:11px;flex-shrink:0}
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:8px;
    border-top:1px solid #d4d4d4;font-size:11.5px;flex-shrink:0;overflow-x:auto}
  #tabs div{padding:3px 12px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  @media (max-width:560px){
    #legend{width:200px;display:none}
    #legend.show{display:block}
    #legendToggle{display:block}
    #menubar i:nth-child(n+5){display:none}
  }
</style>
</head>
<body>
<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <span id="titletext">문명.xlsx - Excel</span>
</div>
<div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
<div id="fbar">
  <div id="namebox">A1</div>
  <div id="fx">fx</div>
  <div id="formula"></div>
</div>
<div id="main">
  <div id="sheetwrap"><div id="sheet"></div></div>
  <button id="legendToggle">세력 ▾</button>

  <div id="panel">
    <div class="ph" id="panelHead"></div>
    <div class="pbody" id="panelBody"></div>
  </div>
</div>

<div id="tabs">
  <div class="on" data-sheet="map">Sheet1</div>
  <div data-sheet="tech">기술계보 (0)</div>
  <div data-sheet="chron">연대기</div>
  <div data-sheet="dead" id="tab-dead">멸망기록 (0)</div>
</div>

<script>
(() => {
"use strict";
/* =========================================================================
   문명.xlsx — 창발적 AI 문명 시뮬레이션 (기술 발명 트리 창발 렌즈)
   - 각 세력 = 자율 AI 에이전트(지도자): 성격·기억·동적 감정(희노애락).
   - 다층 지휘체계: 지도자 stance -> 총독(governor) 에이전트가 해석/수행/항명/반란.
   - 기술 트리는 고정되어 있지 않다. 원시 통찰(insight)들을 압력 속에서 "조합"하면
     매 실행마다 다른 이름·계보의 기술이 창발한다.  대본 없음.
   ========================================================================= */

/* ---------- 셀 격자 크기 ---------- */
const CW = 32, CH = 21;
const sheetEl = document.getElementById('sheet');
const fmla = document.getElementById('formula');
const namebox = document.getElementById('namebox');
const statusbar = document.getElementById('statusbar');
const legend = document.getElementById('legend');
const titletext = document.getElementById('titletext');

let COLS, ROWS, N;
function computeDims(){
  const w = document.getElementById('sheetwrap').clientWidth || innerWidth;
  const h = document.getElementById('sheetwrap').clientHeight || innerHeight;
  COLS = Math.max(14, Math.min(40, Math.floor((w - 50) / CW)));
  ROWS = Math.max(12, Math.min(34, Math.floor((h - 4) / CH)));
  N = COLS * ROWS;
}
computeDims();

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(Math.floor(i/COLS)+1);}
function rnd(a){return Math.random()*a;}
function pick(arr){return arr[arr.length*Math.random()|0];}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

/* ---------- 시트 DOM ---------- */
let cellEls;
function buildSheet(){
  sheetEl.innerHTML='';
  sheetEl.style.gridTemplateColumns=`44px repeat(${COLS},${CW}px)`;
  sheetEl.style.gridAutoRows=CH+'px';
  cellEls=new Array(N);
  const frag=document.createDocumentFragment();
  const corner=document.createElement('div');corner.className='hd corner';frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const hh=document.createElement('div');hh.className='hd col';hh.textContent=colName(c);frag.appendChild(hh);}
  for(let r=0;r<ROWS;r++){
    const rh=document.createElement('div');rh.className='hd row';rh.textContent=r+1;frag.appendChild(rh);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d;frag.appendChild(d);
    }
  }
  sheetEl.appendChild(frag);
}
buildSheet();

/* ---------- 지형 (value-noise) ---------- */
const GW=9,GH=6;let gz=[];
function genTerrain(){
  gz=[];for(let i=0;i<GW*GH;i++)gz[i]=Math.random();
}
function noise(x,y){
  const fx=x/COLS*(GW-1),fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=gz[y0*GW+x0],b=gz[y0*GW+Math.min(GW-1,x0+1)];
  const c=gz[Math.min(GH-1,y0+1)*GW+x0],d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}

/* cell state: st(water/forest/land/ruin/mountain), res(자원: grain/ore/wood/none), owner, level */
let cells;
function genCells(){
  cells=new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS,y=i/COLS|0;
    const v=noise(x,y)+(Math.random()-.5)*.14;
    let st='land',res='none',hist=['황무지'];
    if(v<.30){st='water';hist=['바다'];}
    else if(v>.78){st='mountain';res='ore';hist=['산맥'];}
    else if(v>.60&&Math.random()<.65){st='forest';res='wood';hist=['숲'];}
    else if(v>.40&&v<.55&&Math.random()<.5){res='grain';hist=['비옥한 평야'];}
    cells[i]={st,res,owner:null,level:0,hist,ruinT:0,gov:null};
  }
}

function nbrs(i){
  const x=i%COLS,y=i/COLS|0,out=[];
  if(x>0)out.push(i-1);if(x<COLS-1)out.push(i+1);
  if(y>0)out.push(i-COLS);if(y<ROWS-1)out.push(i+COLS);
  return out;
}

/* =========================================================================
   기술 창발 시스템
   원시 통찰(insight) — 자연에서 관찰/획득되는 개념 원자.
   기술은 [insight + insight] 또는 [tech + insight]의 조합으로 창발하며
   이름은 부모 개념에서 런타임 합성된다 -> 매 실행 다른 트리.
   ========================================================================= */
// 통찰: id, 한글 어근, 획득 트리거(지형/사건), 함의 태그
const INSIGHTS = [
  {id:'fire', root:'불', tag:'energy'},
  {id:'stone',root:'돌', tag:'matter'},
  {id:'wood', root:'나무',tag:'matter'},
  {id:'water',root:'물', tag:'flow'},
  {id:'grain',root:'곡식',tag:'life'},
  {id:'ore',  root:'쇠', tag:'matter'},
  {id:'beast',root:'짐승',tag:'life'},
  {id:'star', root:'별', tag:'mind'},
  {id:'word', root:'말', tag:'mind'},
  {id:'blood',root:'피', tag:'life'},
];
const INS_BY = Object.fromEntries(INSIGHTS.map(x=>[x.id,x]));

// 함의별 산출 접미어 (조합 결과의 성격 결정)
const COMBO_SUFFIX = {
  'energy+matter':['용광로','단조','화공','대장간'],
  'energy+life':['요리','정화','화전','증류'],
  'energy+mind':['봉화','신호','연단술'],
  'energy+flow':['증기','관개로','수증'],
  'matter+matter':['축성','석조','합금','기관'],
  'matter+life':['쟁기','수레','직조','가죽'],
  'matter+mind':['문자판','주판','정밀기계','나침'],
  'matter+flow':['수차','운하','수도교','부교'],
  'life+life':['목축','육종','발효','약초'],
  'life+mind':['역법','경전','의술','점성'],
  'life+flow':['관개','어로','치수','양식'],
  'mind+mind':['철학','수학','법전','대학'],
  'mind+flow':['항해','측량','천문','해도'],
  'flow+flow':['치수술','범선','용수로','제방'],
};
function comboKey(a,b){return [a,b].sort().join('+');}

// 기술이 부여하는 능력 보너스(창발 효과). 결과 태그조합에 따라 결정.
function techEffects(ta,tb){
  const set=new Set([ta,tb]);
  const e={expand:0,war:0,research:0,develop:0,defense:0,pop:0,plagueRes:0,fireRes:0};
  if(set.has('matter')&&set.has('matter')){e.defense+=.9;e.develop+=.4;}
  if(set.has('energy')&&set.has('matter')){e.war+=1.1;e.develop+=.5;}
  if(set.has('matter')&&set.has('life')){e.expand+=.8;e.pop+=.4;}
  if(set.has('life')&&set.has('life')){e.pop+=.9;e.plagueRes+=.5;}
  if(set.has('mind')&&set.has('mind')){e.research+=1.0;e.develop+=.4;}
  if(set.has('life')&&set.has('mind')){e.plagueRes+=.8;e.research+=.4;e.pop+=.3;}
  if(set.has('mind')&&set.has('flow')){e.expand+=1.0;e.research+=.4;}
  if(set.has('flow')&&set.has('flow')){e.expand+=.7;e.fireRes+=.3;}
  if(set.has('energy')&&set.has('life')){e.pop+=.5;e.fireRes-=.1;e.develop+=.3;}
  if(set.has('matter')&&set.has('flow')){e.develop+=.6;e.expand+=.4;}
  if(set.has('mind')&&set.has('matter')){e.research+=.7;e.develop+=.6;e.war+=.3;}
  if(set.has('energy')&&set.has('mind')){e.research+=.6;e.war+=.4;}
  if(set.has('energy')&&set.has('flow')){e.develop+=.7;e.expand+=.5;}
  if(set.has('life')&&set.has('flow')){e.pop+=.6;e.expand+=.5;}
  return e;
}

let techGenealogy=[]; // {name, parents:[label,label], factionName, factionColor, year, era}

/* ---------- 국가(AI 에이전트) ---------- */
const NAMES=['북부 왕국','붉은 제국','해안 연맹','유목 칸국','삼나무 공화국','잿빛 교단','동방 상단','검은 강 부족','여명 왕조','소금 사막 민족','청동 도시국','서리 부족','황혼 성좌','강철 종단'];
const COLORS=['#2563eb','#dc2626','#059669','#7c3aed','#d97706','#0d9488','#be185d','#4d7c0f','#9333ea','#b45309','#0891b2','#475569','#a21caf','#65a30d'];
const LEADER_TITLES=['대왕','황제','족장','칸','집정관','대제사장','상왕','군주','여제','술탄'];
const PERSONAS=[
  {k:'정복자', cur:.3, agg:.9, cau:.2, amb:.9, bias:{war:1,expand:.8}},
  {k:'현자',   cur:.95,agg:.2, cau:.6, amb:.4, bias:{research:1.2,develop:.6}},
  {k:'건설자', cur:.5, agg:.3, cau:.7, amb:.5, bias:{develop:1.1,expand:.5}},
  {k:'개척자', cur:.6, agg:.4, cau:.3, amb:.7, bias:{expand:1.2}},
  {k:'수호자', cur:.4, agg:.3, cau:.95,amb:.3, bias:{defense:1.1,develop:.5}},
  {k:'야심가', cur:.7, agg:.7, cau:.3, amb:.95,bias:{war:.7,research:.7,expand:.6}},
];

let factions=[];
const obituaries=[];
let nameIdx=0;
let year=1, lastEvent='천지가 창조되었습니다.', pop=0;
let plague=new Map(), fires=new Map();
const dirty=new Set();
let selected=-1;
const chronicle=[];

function newLeaderName(){return pick(['아', '에','오','우','이','하','세','라','테','노','미','카'])+pick(['르','만','난','단','칸','샤','드','론','벨','한','무','크'])+pick(['','왕','','대','','스']);}

function spawnFaction(announce, secedeFrom, seedCells){
  if(nameIdx>=NAMES.length){
    // 동적 합성 이름
    var nm=pick(['신','대','범','연','자유','신생','후','동맹'])+pick(['연방','동맹','왕국','공화국','제후국','연합']);
    var col=COLORS[(factions.length*5+3)%COLORS.length];
  }else{
    var nm=NAMES[nameIdx], col=COLORS[nameIdx%COLORS.length];
  }
  const persona=pick(PERSONAS);
  const f={
    id:factions.length?Math.max(...factions.map(x=>x.id))+1:0,
    name:nm, color:col, golden:0, size:0, arr:[],
    leader:newLeaderName()+' '+pick(LEADER_TITLES),
    persona:persona.k,
    cur:clamp(persona.cur+(Math.random()-.5)*.2,.05,1),
    agg:clamp(persona.agg+(Math.random()-.5)*.2,.05,1),
    cau:clamp(persona.cau+(Math.random()-.5)*.2,.05,1),
    amb:clamp(persona.amb+(Math.random()-.5)*.2,.05,1),
    bias:persona.bias,
    // 감정(희노애락) — 동적, 사건에서 생성
    mood:{joy:.3,anger:.2,sorrow:.1,zeal:.4},
    // 기억: 최근 사건, 원한 관계, 보유 통찰/기술
    memory:[], grudge:{}, insights:new Set(), techs:[],
    effects:{expand:0,war:0,research:0,develop:0,defense:0,pop:0,plagueRes:0,fireRes:0},
    stance:'EXPAND', stanceAge:0,
    research:0,  // 누적 연구 진척
    governors:[], // {idx, loyalty, mood, ambition}
    era:0,
  };
  nameIdx++;
  const seeds=seedCells||[];
  if(seeds.length){
    for(const i of seeds){ setCell(i,f.id,Math.max(1,cells[i].level),'독립 선포'); }
    factions.push(f);
    return f;
  }
  for(let tries=0;tries<400;tries++){
    const i=Math.random()*N|0;
    if(cells[i].st==='land'&&cells[i].owner===null){
      setCell(i,f.id,1,'개척지');
      // 시작 통찰: 주변 지형 + 무작위 시드 2개 -> 세력마다 다른 출발점으로 트리 분기
      gainInsightFromLand(f,i);
      f.insights.add('stone');
      f.insights.add(pick(INSIGHTS).id);
      f.insights.add(pick(INSIGHTS).id);
      factions.push(f);
      if(announce)logEvent(`${f.name}(${f.leader})이(가) 역사에 등장했습니다.`,`=SPAWN("${f.name}", "${f.persona}", ${ref(i)})`,'genesis');
      return f;
    }
  }
  return null;
}
function facById(id){for(const f of factions)if(f.id===id)return f;return null;}

function gainInsightFromLand(f,i){
  const r=cells[i].res;
  const map={grain:'grain',ore:'ore',wood:'wood'};
  if(map[r])f.insights.add(map[r]);
  if(cells[i].st==='forest')f.insights.add('wood');
  if(cells[i].st==='mountain')f.insights.add('stone');
  for(const n of nbrs(i)){ if(cells[n].st==='water')f.insights.add('water'); }
}

function setCell(i,owner,level,histLabel){
  const c=cells[i];
  c.owner=owner;c.level=level;c.st='land';
  if(histLabel){c.hist.push(histLabel);if(c.hist.length>8)c.hist.shift();}
  dirty.add(i);
}

const LV_TXT=['','·','田','邑','城','京'];
const LV_LABEL=['','개척지','농장','마을','성읍','수도'];

function paint(i){
  const c=cells[i],el=cellEls[i];
  let bg='',tx='',col='#222',w='',cap='';
  if(plague.has(i)){bg='#ead5f5';tx='疫';col='#7030a0';w='700';}
  else if(fires.has(i)){bg='#ffd9b3';tx='火';col='#c00000';w='700';}
  else if(c.st==='water'){bg='#ddebf7';tx='≈';col='#9dc3e6';}
  else if(c.st==='mountain'&&c.owner===null){bg='#efe9e0';tx='△';col='#8a7a5e';}
  else if(c.st==='forest'&&c.owner===null){bg='#e2efda';tx='木';col='#548235';}
  else if(c.st==='ruin'){bg='#ececec';tx='墟';col='#999';}
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){bg=hexA(f.color,.12+c.level*.16);tx=LV_TXT[c.level];col=f.color;w=c.level>=4?'700':'';
      // 수도/주요거점에 총독 표식
      const g=f.governors.find(g=>g.idx===i);
      if(g&&c.level>=3)cap='◆';
    }
  } else if(c.res==='grain'){bg='#f7f3d9';tx='';col='#9a8b3a';}
  el.style.background=bg;el.style.color=col;el.style.fontWeight=w;
  el.innerHTML=cap?`${tx}<span class="cap" style="color:${col}">${cap}</span>`:tx;
}

/* ---------- 사건 로그 / 감정 ---------- */
function logEvent(msg,formula,kind){
  lastEvent=`서기 ${year}년: ${msg}`;
  if(formula)fmla.textContent=formula;
  chronicle.push({year,msg,formula:formula||'',kind:kind||'event'});
  if(chronicle.length>400)chronicle.shift();
}
function feel(f,em,amt){ // 감정 변동
  f.mood[em]=clamp(f.mood[em]+amt,0,1);
  // 감정은 서로를 누른다
  if(em==='joy')f.mood.sorrow=clamp(f.mood.sorrow-amt*.4,0,1);
  if(em==='sorrow')f.mood.joy=clamp(f.mood.joy-amt*.4,0,1);
  if(em==='anger')f.mood.joy=clamp(f.mood.joy-amt*.2,0,1);
}
function remember(f,note){ f.memory.push(`서기 ${year}년: ${note}`); if(f.memory.length>10)f.memory.shift(); }

function flashWar(i){const el=cellEls[i];el.classList.add('war');setTimeout(()=>el.classList.remove('war'),1200);}
function flashInvent(i){const el=cellEls[i];el.classList.add('invent');setTimeout(()=>el.classList.remove('invent'),900);}

/* =========================================================================
   기술 창발: 한 세력이 연구 임계치를 넘으면 보유 통찰/기술을 조합해 발명을 시도.
   조합 가능성·결과는 감정/성격/압력에 의해 좌우 -> 매번 다른 계보.
   ========================================================================= */
const ERA_NAMES=['석기','청동','철기','고전','중세','대항해','계몽'];
function attemptInvention(f){
  const pool=[...f.insights].map(id=>({type:'insight',id,tag:INS_BY[id].tag,label:INS_BY[id].root}));
  for(const t of f.techs)pool.push({type:'tech',id:t.name,tag:t.tagA,tag2:t.tagB,label:t.name});
  if(pool.length<2)return false;
  // 압력 기반 선호: 전쟁중이면 energy/matter, 역병이면 life/mind, 확장기면 flow/life
  const wantWar=f.mood.anger>.5||f.stance==='CONQUER';
  const wantLife=Object.values(f.grudge).length>0&&f.mood.sorrow>.4;
  // 두 부모 선택 (성향 가중)
  function score(p){
    let s=1;
    if(wantWar&&(p.tag==='energy'||p.tag==='matter'))s+=1.4;
    if(f.cur>.6&&(p.tag==='mind'))s+=1.2*f.cur;
    if(f.stance==='EXPAND'&&(p.tag==='flow'||p.tag==='life'))s+=1.0;
    if(p.type==='tech')s+=.6; // 고차 조합 선호로 깊이 형성
    return s+Math.random()*0.8;
  }
  const sorted=pool.slice().sort((a,b)=>score(b)-score(a));
  const A=sorted[0];
  let B=sorted.find(x=>x!==A&&x.label!==A.label)||sorted[1];
  if(!B||B===A)return false;
  const tagA=A.tag, tagB=B.tag2||B.tag;
  const key=comboKey(tagA,tagB);
  const suffixes=COMBO_SUFFIX[key]||['장치','기법','술'];
  // 이름 합성: 부모 어근 + 결과 접미어 (중복 회피)
  const baseRootA=A.type==='insight'?A.label:A.label.slice(0,2);
  const suffix=pick(suffixes);
  let name=baseRootA+suffix;
  if(f.techs.some(t=>t.name===name)) name=baseRootA+'식 '+suffix;
  if(techGenealogy.some(t=>t.name===name&&t.factionName===f.name)) name=name+'·改';
  const eff=techEffects(tagA,tagB);
  const era=Math.min(ERA_NAMES.length-1, f.techs.length<2?0:f.techs.length<4?1:f.techs.length<7?2:f.techs.length<10?3:f.techs.length<13?4:5);
  f.era=era;
  const tech={name,tagA,tagB,parents:[A.label,B.label],eff,era};
  f.techs.push(tech);
  // 효과 누적
  for(const k in eff)f.effects[k]=(f.effects[k]||0)+eff[k];
  // 발견은 새 통찰을 부산물로 낳을 수 있다(트리 분기)
  if(Math.random()<.4){ const np=pick(INSIGHTS); if(!f.insights.has(np.id)){f.insights.add(np.id);} }
  techGenealogy.push({name,parents:[A.label,B.label],factionName:f.name,factionColor:f.color,year,era:ERA_NAMES[era]});
  if(techGenealogy.length>200)techGenealogy.shift();
  // 감정: 발견의 기쁨/열의
  feel(f,'zeal',.25);feel(f,'joy',.12);
  remember(f,`'${name}' 발명 (${A.label}+${B.label})`);
  // 시각: 무작위 영토 셀 번쩍
  if(f.arr.length){const ci=pick(f.arr);flashInvent(ci);
    logEvent(`${f.name}이(가) [${name}]을(를) 발명했습니다. (${A.label}+${B.label})`,
      `=INVENT("${name}", "${A.label}" + "${B.label}") → {${ERA_NAMES[era]}기}`,'invent');
  }
  updateTechTab();
  return true;
}

/* =========================================================================
   지도자 의사결정: 감정+성격+상황 -> stance 선택 (대본 없는 적응)
   ========================================================================= */
function decideStance(f){
  const enemiesNear=Object.keys(f.grudge).length;
  const score={
    EXPAND: (f.bias.expand||0)+.5+f.amb*.6+f.effects.expand*.15-f.mood.sorrow*.4,
    RESEARCH:(f.bias.research||0)+f.cur*.9+f.mood.zeal*.7+f.effects.research*.12-f.mood.anger*.3,
    CONQUER:(f.bias.war||0)+f.agg*.8+f.mood.anger*1.1+enemiesNear*.3+f.effects.war*.12-f.cau*.4,
    FORTIFY:(f.bias.defense||0)+f.cau*.9+f.mood.sorrow*.6+f.effects.defense*.12-f.amb*.3,
    DEVELOP:(f.bias.develop||0)+.4+f.mood.joy*.6+f.effects.develop*.12,
  };
  // 작으면 확장/연구, 위협받으면 방어/정복
  if(f.size<3){score.EXPAND+=1.2;score.CONQUER-=.5;}
  if(f.size>14){score.RESEARCH+=.6;score.DEVELOP+=.5;}
  let best='EXPAND',bv=-1e9;
  for(const k in score){const v=score[k]+Math.random()*.5;if(v>bv){bv=v;best=k;}}
  if(best!==f.stance){
    f.stance=best;f.stanceAge=0;
    if(f.size>=4&&Math.random()<.5){
      logEvent(`${f.name}의 ${f.leader}이(가) 국시를 [${STANCE_KO[best]}](으)로 선포했습니다.`,
        `=DECIDE("${f.name}", mood={喜${f.mood.joy.toFixed(1)} 怒${f.mood.anger.toFixed(1)} 哀${f.mood.sorrow.toFixed(1)} 樂${f.mood.zeal.toFixed(1)}}) → "${best}"`,'decide');
    }
  } else f.stanceAge++;
}
const STANCE_KO={EXPAND:'개척',RESEARCH:'연구',CONQUER:'정복',FORTIFY:'수성',DEVELOP:'건설'};

/* =========================================================================
   총독(governor) 에이전트: 지도자 명령을 해석/수행 — 또는 항명/배신.
   주요 거점(level>=3) 셀은 총독을 갖는다. 각 총독은 충성/야심/감정.
   ========================================================================= */
function syncGovernors(f){
  // 큰 거점에 총독 부여
  const big=f.arr.filter(i=>cells[i].level>=3);
  // 기존 유지, 사라진 곳 제거
  f.governors=f.governors.filter(g=>cells[g.idx].owner===f.id&&cells[g.idx].level>=3);
  const have=new Set(f.governors.map(g=>g.idx));
  for(const i of big){
    if(!have.has(i)&&f.governors.length<6){
      f.governors.push({idx:i, name:newLeaderName()+' 총독',
        loyalty:clamp(.7+(Math.random()-.5)*.4,.2,1),
        ambition:clamp(Math.random()*.9,.1,1),
        anger:0, hold:0});
    }
  }
}

/* ---------- 틱 ---------- */
let tickN=0,warLogCooldown=0,running=true,speed=110;
const PW=[0,40,160,520,1400,3200];
function tick(){
  if(!running)return;
  tickN++;year++;
  if(warLogCooldown>0)warLogCooldown--;

  // 재집계
  for(const f of factions){f.arr.length=0;f.size=0;}
  pop=0;
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin'&&--c.ruinT<=0){c.st='land';dirty.add(i);}
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){f.arr.push(i);f.size++;pop+=PW[c.level];}
      else{c.owner=null;c.level=0;dirty.add(i);}
    }
  }

  // 멸망
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      const topTech=f.techs.length?f.techs[f.techs.length-1].name:'—';
      obituaries.push({name:f.name,leader:f.leader,year,persona:f.persona,techs:f.techs.length,topTech,color:f.color});
      logEvent(`${f.name}이(가) 역사에서 사라졌습니다. (최후 기술: ${topTech})`,`=COLLAPSE("${f.name}", ${year}, 기술 ${f.techs.length})`,'collapse');
      // 다른 세력 감정: 적이면 기쁨, 무관하면 슬픔의 여운
      for(const o of factions){if(o.grudge[f.id]){feel(o,'joy',.2);delete o.grudge[f.id];}}
      factions.splice(k,1);
      updateTechTab();
    }
  }

  // 화재 확산
  for(const [i,t] of [...fires]){
    if(Math.random()<.12){
      for(const n of nbrs(i)){
        const c=cells[n];
        const f=c.owner!==null?facById(c.owner):null;
        const fireRes=f?clamp(f.effects.fireRes,0,.8):0;
        if(c.owner!==null&&!fires.has(n)&&c.st==='land'&&Math.random()>fireRes){fires.set(n,5);dirty.add(n);}
      }
    }
    if(t<=1){
      fires.delete(i);const c=cells[i];
      const f=c.owner!==null?facById(c.owner):null;
      if(f)feel(f,'sorrow',.08);
      c.owner=null;c.level=0;c.st='ruin';c.ruinT=180;
      c.hist.push('잿더미');if(c.hist.length>8)c.hist.shift();
      dirty.add(i);
    } else fires.set(i,t-1);
  }

  // 역병
  if(plague.size){
    for(const [i,t] of [...plague]){
      const c=cells[i];const f=c.owner!==null?facById(c.owner):null;
      const pres=f?clamp(f.effects.plagueRes,0,.85):0;
      if(Math.random()<.16){
        for(const n of nbrs(i)){
          if(cells[n].owner!==null&&!plague.has(n)){
            const fn=facById(cells[n].owner);const pr=fn?clamp(fn.effects.plagueRes,0,.85):0;
            if(Math.random()>pr){plague.set(n,11);dirty.add(n);}
          }
        }
      }
      if(Math.random()<.22*(1-pres)){
        c.level--;if(f)feel(f,'sorrow',.05);
        if(c.level<=0){c.owner=null;c.level=0;c.hist.push('역병으로 소멸');if(c.hist.length>8)c.hist.shift();}
        dirty.add(i);
      }
      if(t<=1){plague.delete(i);dirty.add(i);}else plague.set(i,t-1);
    }
    if(plague.size===0)logEvent('역병이 물러갔습니다.','=PLAGUE.END()','event');
  }

  // 세력별 AI 행동
  for(const f of factions){
    if(f.golden>0)f.golden--;
    if(f.size===0)continue;
    // 감정 자연 감쇠
    f.mood.anger=clamp(f.mood.anger-.004,0,1);
    f.mood.zeal=clamp(f.mood.zeal-.003,0,1);
    f.mood.joy=clamp(f.mood.joy-.002,0,1);
    f.mood.sorrow=clamp(f.mood.sorrow-.003,0,1);

    if(tickN%6===0)decideStance(f);
    syncGovernors(f);

    // 연구 진척: 연구 stance면 가속, 현자 성격/열의 보너스
    const researchRate=(0.5+f.cur*1.2+f.mood.zeal*.9)*(f.stance==='RESEARCH'?2.4:1)*(1+f.effects.research*.1)*(f.golden?1.6:1)*(0.6+f.size*0.05);
    f.research+=researchRate;
    const need=70+f.techs.length*42;
    if(f.research>=need){f.research-=need; attemptInvention(f);}
    // 호기심: 사색가 성향은 추상 개념(별·말·피)을 스스로 발견 -> 정신계 기술 분기
    if(Math.random()<0.006*f.cur*(f.stance==='RESEARCH'?2:1)){
      const abstract=pick([INS_BY.star,INS_BY.word,INS_BY.blood,INS_BY.beast]);
      if(!f.insights.has(abstract.id)){f.insights.add(abstract.id);feel(f,'zeal',.1);}
    }

    // 행동 강도: stance와 효과가 조정
    const baseAtt=1+(f.size*.07|0);
    let expandMul=1, warChance=.3, devMul=1;
    if(f.stance==='EXPAND'){expandMul=1.6;}
    else if(f.stance==='CONQUER'){warChance=.55;expandMul=.8;}
    else if(f.stance==='FORTIFY'){expandMul=.5;warChance=.12;}
    else if(f.stance==='DEVELOP'){devMul=2;expandMul=.7;}
    else if(f.stance==='RESEARCH'){devMul=1.4;expandMul=.8;}
    expandMul*=(1+f.effects.expand*.12);

    // 확장 + 전쟁 (총독이 명령을 수행/항명)
    const attempts=Math.max(1,Math.round(baseAtt*expandMul));
    for(let a=0;a<attempts;a++){
      const src=pick(f.arr);
      if(src===undefined||cells[src].owner!==f.id)continue;
      // 이 셀의 총독이 항명 중이면 명령 거부(확장 안 함)
      const gov=f.governors.find(g=>g.idx===src);
      if(gov&&gov.hold>0){continue;}
      const nb=nbrs(src);const tgt=pick(nb);const tc=cells[tgt];
      if(tc===undefined||tc.st==='water'||fires.has(tgt))continue;
      if(tc.owner===null){
        if(tc.st==='mountain'){ if(Math.random()<.12+f.effects.develop*.05){tc.st='land';gainInsightFromLand(f,tgt);setCell(tgt,f.id,1,'채광지');f.insights.add('ore');} }
        else if(tc.st==='forest'){ if(Math.random()<.25){tc.st='land';gainInsightFromLand(f,tgt);tc.hist.push('개간');setCell(tgt,f.id,1,'개척지');f.insights.add('wood');} }
        else if(tc.st==='land'){ gainInsightFromLand(f,tgt); setCell(tgt,f.id,1,'개척지'); }
      } else if(tc.owner!==f.id&&Math.random()<warChance){
        const defF=facById(tc.owner);if(!defF)continue;
        // 전쟁 -> 원한/감정
        const att=1+rnd(3)+f.size*.002+(f.golden?1:0)+f.effects.war*.7+f.mood.anger*1.2;
        const def=tc.level+1+rnd(3)+(defF.effects.defense*0.8)+(defF.stance==='FORTIFY'?1.2:0);
        flashWar(tgt);
        f.grudge[defF.id]=(f.grudge[defF.id]||0)+1;
        defF.grudge[f.id]=(defF.grudge[f.id]||0)+1;
        feel(defF,'anger',.06);
        if(att>def){
          feel(f,'joy',.05);feel(defF,'sorrow',.04);
          if(Math.random()<.28){fires.set(tgt,5);tc.hist.push('전화(戰火)');if(tc.hist.length>8)tc.hist.shift();dirty.add(tgt);}
          else{setCell(tgt,f.id,Math.max(1,tc.level-1),'점령됨');gainInsightFromLand(f,tgt);
            // 정복으로 적 기술 일부 약탈 가능
            if(defF.techs.length&&Math.random()<.18){const stolen=pick(defF.techs);if(!f.techs.some(t=>t.name===stolen.name)){f.techs.push(stolen);for(const kk in stolen.eff)f.effects[kk]=(f.effects[kk]||0)+stolen.eff[kk];remember(f,`'${stolen.name}' 노획`);}}
          }
          if((tc.level>=3||warLogCooldown===0)){
            logEvent(`${f.name}이(가) ${defF.name}의 ${LV_LABEL[Math.max(1,tc.level)]||'영토'}를 함락했습니다.`,
              `=WAR("${f.name}"→"${defF.name}", ${ref(tgt)}, atk=${att.toFixed(1)} vs def=${def.toFixed(1)})`,'war');
            warLogCooldown=34;
          }
        }
      }
    }

    // 발전
    const ups=Math.max(1,Math.round((1+(f.size*.05|0))*devMul));
    for(let u=0;u<ups;u++){
      const i=pick(f.arr);if(i===undefined||cells[i].owner!==f.id)continue;
      const c=cells[i];
      const devChance=.06*(f.golden?3:1)*(1+f.effects.develop*.2)*(f.stance==='DEVELOP'?1.8:1)*(c.res==='grain'?1.4:1);
      if(c.level<5&&Math.random()<devChance){
        c.level++;c.hist.push(LV_LABEL[c.level]);if(c.hist.length>8)c.hist.shift();dirty.add(i);
        if(c.level===5&&warLogCooldown===0){feel(f,'joy',.18);
          logEvent(`${f.name}의 ${ref(i)}에 수도 ${LV_LABEL[5]||''}이(가) 세워졌습니다.`,`=CAPITAL("${f.name}", ${ref(i)})`,'capital');warLogCooldown=22;}
      }
    }

    // 총독 항명/배신 판정
    for(const g of f.governors){
      if(g.hold>0)g.hold--;
      const c=cells[g.idx];if(!c||c.owner!==f.id)continue;
      // 불만 누적: 지도자 분노 높음 + 총독 야심 + 가혹한 stance
      const harsh=(f.stance==='CONQUER'?.5:0)+(f.stance==='FORTIFY'?.2:0);
      g.anger=clamp(g.anger + (g.ambition*.02 + f.mood.anger*.01 + harsh*.012 - g.loyalty*.015), 0, 2);
      // 명령 불복(일시): 분노 중간
      if(g.anger>.7&&g.hold<=0&&Math.random()<.04){
        g.hold=8;
        if(c.level>=4&&warLogCooldown===0){
          logEvent(`${g.name}이(가) ${f.name}의 명령에 항명했습니다.`,`=DISOBEY("${g.name}", ${ref(g.idx)})`,'disobey');warLogCooldown=18;
          remember(f,`${g.name} 항명`);feel(f,'anger',.1);
        }
      }
      // 반란/독립 선포: 분노 임계 + 주변 영토 확보
      if(g.anger>1.3&&Math.random()<.025){
        const cluster=[g.idx,...nbrs(g.idx).filter(n=>cells[n].owner===f.id)];
        if(cluster.length>=2){
          // 이 영토를 새 세력으로 분리
          for(const ci of cluster){cells[ci].owner=null;cells[ci].level=0;}
          const reb=spawnFaction(false, true, cluster);
          if(reb){
            reb.leader=g.name.replace('총독','왕');
            reb.name=pick(['자유','신생','반','독립'])+f.name.slice(0,2)+pick(['국','동맹','연합']);
            reb.grudge[f.id]=3; f.grudge[reb.id]=3;
            // 분리주의자는 모국 기술 절반 계승
            for(const tt of f.techs){if(Math.random()<.5){reb.techs.push(tt);for(const kk in tt.eff)reb.effects[kk]=(reb.effects[kk]||0)+tt.eff[kk];}}
            feel(f,'anger',.4);feel(f,'sorrow',.2);
            logEvent(`${g.name}이(가) 반란을 일으켜 ${reb.name}을(를) 세웠습니다!`,`=DEFECT("${g.name}", from="${f.name}") → SPAWN("${reb.name}")`,'rebellion');warLogCooldown=20;
          }
        }
        g.anger=0;
      }
    }
  }

  // 무작위 자연 사건 (압력원 — 기술 창발 방향에 영향)
  const r=Math.random();
  if(!plague.size&&r<.004){
    const big=[];for(let i=0;i<N;i++)if(cells[i].owner!==null&&cells[i].level>=3)big.push(i);
    if(big.length){const o=pick(big);plague.set(o,11);dirty.add(o);
      const f=facById(cells[o].owner);if(f){feel(f,'sorrow',.25);remember(f,'역병 창궐');}
      logEvent(`${ref(o)}에서 역병이 창궐했습니다.`,`=PLAGUE(${ref(o)})`,'event');}
  } else if(r>.996&&factions.length){
    const f=pick(factions);f.golden=90;feel(f,'joy',.4);feel(f,'zeal',.3);remember(f,'황금기 도래');
    logEvent(`${f.name}의 황금기가 시작되었습니다.`,`=GOLDEN.AGE("${f.name}", 90)`,'golden');
  } else if(r>.9935&&r<=.996){
    const towns=[];for(let i=0;i<N;i++)if(cells[i].owner!==null&&cells[i].level>=2)towns.push(i);
    if(towns.length){const o=pick(towns);fires.set(o,6);dirty.add(o);
      logEvent(`${ref(o)}에 대화재가 발생했습니다.`,`=FIRE(${ref(o)})`,'event');}
  }
  // 도래(이주)
  if(factions.length<3&&Math.random()<.012&&factions.length<7){
    const f=spawnFaction(false);
    if(f)logEvent(`바다 건너에서 ${f.name}이(가) 도래했습니다.`,`=MIGRATE("${f.name}", "${f.persona}")`,'genesis');
  }

  // 그리기
  for(const i of dirty)paint(i);dirty.clear();

  // 상태바
  const eraTop=factions.length?ERA_NAMES[Math.max(...factions.map(f=>f.era))]:'석기';
  statusbar.innerHTML=`<span>준비</span><span class="sep">|</span><span>서기 ${year}년</span><span class="sep">|</span><span>${eraTop}기</span><span class="sep">|</span><span>인구 ${pop.toLocaleString()}</span><span class="sep">|</span><span>국가 ${factions.length}</span><span class="sep">|</span><span>기술 ${techGenealogy.length}</span><span class="sep">|</span><span class="ev">${lastEvent}</span><button class="btn" id="pauseBtn">${running?'⏸ 일시정지':'▶ 재생'}</button>`;
  document.getElementById('pauseBtn').onclick=togglePause;

  if(tickN%9===0)updateLegend();
  if(currentSheet==='chron'&&tickN%6===0)updateChron();
  if(currentSheet==='dead'&&tickN%9===0)updateDead();
}

function updateLegend(){
  document.title=`문명.xlsx - Excel (서기 ${year}년)`;
  titletext.textContent=`문명.xlsx - Excel  ·  서기 ${year}년`;
  const sorted=factions.slice().sort((a,b)=>b.size-a.size);
  let h='<h4>세력 현황 (자율 에이전트)</h4>';
  for(const f of sorted){
    const m=f.mood;
    h+=`<div style="margin-bottom:5px">
      <span class="sw" style="background:${f.color}"></span><b>${f.name}</b>${f.golden?' ✦':''}
      <span class="small">· ${f.persona}</span><br>
      <span class="mood">${f.leader}</span> <span class="stance" style="color:${f.color}">[${STANCE_KO[f.stance]}]</span><br>
      <span class="mood">영토${f.size} 기술${f.techs.length} ${ERA_NAMES[f.era]}기${f.governors.length?' 총독'+f.governors.length:''}</span><br>
      <span class="mood">희<span class="bar" style="width:${(m.joy*26)|0}px;background:#f1c40f"></span> 노<span class="bar" style="width:${(m.anger*26)|0}px;background:#e74c3c"></span> 애<span class="bar" style="width:${(m.sorrow*26)|0}px;background:#5b8def"></span> 락<span class="bar" style="width:${(m.zeal*26)|0}px;background:#2ecc71"></span></span>
    </div>`;
  }
  if(obituaries.length){
    h+='<h4>멸망기록</h4>';
    for(const o of obituaries.slice(-3))h+=`<div class="dead">† ${o.name} (서기 ${o.year}년)</div>`;
  }
  h+=`<h4>범례</h4><div class="small">·田邑城京 = 개척→수도 · ◆총독 · 木숲 △산 ≈바다 火화재 疫역병 墟폐허</div>`;
  legend.innerHTML=h;
}

/* ---------- 시트(탭) ---------- */
let currentSheet='map';
const panel=document.getElementById('panel');
const panelHead=document.getElementById('panelHead');
const panelBody=document.getElementById('panelBody');
function setSheet(s){
  currentSheet=s;
  document.querySelectorAll('#tabs div').forEach(d=>d.classList.toggle('on',d.dataset.sheet===s));
  if(s==='map'){panel.classList.remove('on');return;}
  panel.classList.add('on');
  if(s==='tech')updateTechTab(true);
  else if(s==='chron')updateChron(true);
  else if(s==='dead')updateDead(true);
}
document.querySelectorAll('#tabs div').forEach(d=>d.onclick=()=>setSheet(d.dataset.sheet));

function updateTechTab(force){
  document.querySelector('[data-sheet="tech"]').textContent=`기술계보 (${techGenealogy.length})`;
  if(currentSheet!=='tech'&&!force)return;
  if(currentSheet!=='tech')return;
  panelHead.innerHTML=`기술계보 <small>— 발명은 통찰의 조합에서 창발한다. 매 실행 다른 트리.</small>`;
  let rows='';
  const recent=techGenealogy.slice().reverse();
  for(const t of recent){
    rows+=`<tr><td>${t.year}</td><td><span class="ftag" style="background:${t.factionColor}"></span>${t.factionName}</td>
      <td class="techname">${t.name}</td><td>${t.parents[0]} <span style="color:#aaa">+</span> ${t.parents[1]}</td><td>${t.era}기</td></tr>`;
  }
  if(!rows)rows='<tr><td colspan="5" style="color:#999;padding:14px">아직 발명된 기술이 없습니다. 세력이 연구를 누적하면 기술이 창발합니다…</td></tr>';
  panelBody.innerHTML=`<table class="x"><thead><tr><th style="width:60px">서기</th><th style="width:150px">세력</th><th style="width:130px">발명</th><th>조합 (부모 개념)</th><th style="width:70px">시대</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function updateChron(force){
  if(currentSheet!=='chron'&&!force)return;
  if(currentSheet!=='chron')return;
  panelHead.innerHTML=`연대기 <small>— 세계에 기록된 사건의 흐름</small>`;
  const KIND_COL={war:'#c0392b',invent:'#b8860b',rebellion:'#8e44ad',collapse:'#888',golden:'#27ae60',decide:'#2980b9',genesis:'#16a085',capital:'#d35400',disobey:'#c0392b',event:'#555'};
  let rows='';
  for(const e of chronicle.slice().reverse().slice(0,150)){
    rows+=`<tr><td style="white-space:nowrap">서기 ${e.year}년</td><td style="color:${KIND_COL[e.kind]||'#555'}">${e.msg}</td><td style="font-family:Consolas,monospace;font-size:10.5px;color:#666">${e.formula||''}</td></tr>`;
  }
  panelBody.innerHTML=`<table class="x"><thead><tr><th style="width:90px">연도</th><th>사건</th><th style="width:42%">수식</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function updateDead(force){
  document.getElementById('tab-dead').textContent=`멸망기록 (${obituaries.length})`;
  if(currentSheet!=='dead'&&!force)return;
  if(currentSheet!=='dead')return;
  panelHead.innerHTML=`멸망기록 <small>— 사라진 문명들의 부고</small>`;
  let rows='';
  for(const o of obituaries.slice().reverse()){
    rows+=`<tr class="deadrow"><td>${o.year}</td><td><span class="ftag" style="background:${o.color}"></span>† ${o.name}</td><td>${o.leader}</td><td>${o.persona}</td><td>${o.techs}개 (최후: ${o.topTech})</td></tr>`;
  }
  if(!rows)rows='<tr><td colspan="5" style="color:#999;padding:14px">아직 멸망한 문명이 없습니다.</td></tr>';
  panelBody.innerHTML=`<table class="x"><thead><tr><th style="width:60px">멸망</th><th style="width:160px">문명</th><th>최후 지도자</th><th style="width:70px">성격</th><th>기술</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---------- 셀 클릭 = 그 땅/세력의 깊은 상태 ---------- */
sheetEl.addEventListener('click',e=>{
  const t=e.target.closest('.cell');if(!t)return;
  if(selected>=0&&cellEls[selected])cellEls[selected].classList.remove('sel');
  selected=+t.dataset.i;t.classList.add('sel');
  namebox.textContent=ref(selected);
  const c=cells[selected];
  if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      const g=f.governors.find(g=>g.idx===selected);
      let s=`=CELL(${ref(selected)}) → ${f.name} · ${LV_LABEL[c.level]||'영토'}`;
      if(g)s+=` · 총독 ${g.name}(충성 ${(g.loyalty*100|0)}% 불만 ${(g.anger/2*100|0)}%)`;
      s+=` | 지도자 ${f.leader} mood{喜${f.mood.joy.toFixed(1)} 怒${f.mood.anger.toFixed(1)} 哀${f.mood.sorrow.toFixed(1)} 樂${f.mood.zeal.toFixed(1)}}`;
      fmla.textContent=s;
      return;
    }
  }
  fmla.textContent=`=HISTORY(${ref(selected)}) = {${c.hist.map(x=>`"${x}"`).join(' → ')}}`;
});

/* ---------- 조작: 클릭 개입 (Shift+클릭으로 개간/촉발) ---------- */
sheetEl.addEventListener('contextmenu',e=>{e.preventDefault();});
// 더블클릭: 그 셀에 새 통찰/사건 촉발 (사용자 개입)
sheetEl.addEventListener('dblclick',e=>{
  const t=e.target.closest('.cell');if(!t)return;
  const i=+t.dataset.i;const c=cells[i];
  if(c.owner!==null){
    const f=facById(c.owner);
    if(f){ // 그 세력에 무작위 새 통찰 부여 -> 연구 촉진(사용자 개입)
      const np=pick(INSIGHTS);f.insights.add(np.id);f.research+=60;feel(f,'zeal',.2);
      logEvent(`(개입) ${f.name}이(가) '${np.root}'의 통찰을 얻었습니다.`,`=GRANT("${f.name}", "${np.root}")`,'event');
      fmla.textContent=`=GRANT("${f.name}", insight="${np.root}")`;
    }
  } else if(c.st==='land'||c.res==='grain'){ // 빈 땅에 새 문명 점화
    if(factions.length<10){const f=spawnFaction(true,false,[i]);if(f){f.research+=20;}}
  }
});

/* ---------- 컨트롤 ---------- */
function togglePause(){running=!running;if(running)loop();updateStatusBtn();}
function updateStatusBtn(){const b=document.getElementById('pauseBtn');if(b)b.textContent=running?'⏸ 일시정지':'▶ 재생';}
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();togglePause();}
  else if(e.key==='1')setSheet('map');
  else if(e.key==='2')setSheet('tech');
  else if(e.key==='3')setSheet('chron');
  else if(e.key==='4')setSheet('dead');
});
document.getElementById('legendToggle').onclick=()=>{legend.classList.toggle('show');};

/* ---------- 시작 ---------- */
let loopTimer=null;
function loop(){clearInterval(loopTimer);loopTimer=setInterval(tick,speed);}
function start(){
  genTerrain();genCells();
  for(let i=0;i<N;i++)paint(i);
  fmla.textContent=`=SIM.CIVILIZATION($A$1:$${colName(COLS-1)}$${ROWS}, agents=AUTONOMOUS, tech="창발")`;
  factions=[];obituaries.length=0;techGenealogy=[];chronicle.length=0;nameIdx=0;year=1;tickN=0;plague.clear();fires.clear();
  spawnFaction(true);spawnFaction(true);spawnFaction(true);
  updateLegend();
  // 첫 페인트 직후 상태바
  statusbar.innerHTML=`<span>준비</span><span class="sep">|</span><span>서기 ${year}년</span><span class="sep">|</span><span>인구 ${pop}</span><span class="sep">|</span><span>국가 ${factions.length}</span><span class="sep">|</span><span class="ev">${lastEvent}</span><button class="btn" id="pauseBtn">⏸ 일시정지</button>`;
  document.getElementById('pauseBtn').onclick=togglePause;
  running=true;loop();
}

// 리사이즈 대응 (디바운스, 시뮬 재시작)
let rzT=null;
addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{
  const oc=COLS,or=ROWS;computeDims();
  if(oc!==COLS||or!==ROWS){buildSheet();start();}
},350);});

start();
})();
</script>
