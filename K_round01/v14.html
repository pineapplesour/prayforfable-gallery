<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문명.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}
  #titlebar{height:30px;flex:none;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menubar{height:28px;flex:none;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:14px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  #fbar{height:26px;flex:none;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px}
  #namebox{width:62px;flex:none;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;font-weight:600}
  #fx{width:26px;flex:none;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif}
  #formula{flex:1;min-width:0;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #ctrl{flex:none;display:flex;align-items:center;gap:4px;padding:0 6px;border-left:1px solid #e6e6e6}
  #ctrl button{font-size:11px;border:1px solid #cdcdcd;background:#fafafa;border-radius:3px;
    padding:2px 7px;cursor:pointer;color:#333;line-height:1.4}
  #ctrl button:hover{background:#eef6f0;border-color:#107c41;color:#107c41}
  #ctrl button.on{background:#107c41;color:#fff;border-color:#0c623a}
  #stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#fff}
  /* ----- 지도 시트 ----- */
  #gridwrap{position:absolute;inset:0;overflow:auto}
  #sheet{display:grid;background:#fff;width:max-content}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:11px;position:sticky;z-index:3}
  .hd.cn{top:0}.hd.rn{left:0;z-index:4}
  .hd.corner{top:0;left:0;z-index:5}
  .cell{border-right:1px solid #e8e8e8;border-bottom:1px solid #e8e8e8;
    display:flex;align-items:center;justify-content:center;font-size:11px;
    overflow:hidden;cursor:cell;position:relative}
  .cell .em{position:absolute;top:0;right:0;font-size:7px;line-height:1;opacity:.9}
  .cell .cap{position:absolute;bottom:-1px;left:1px;font-size:7px;line-height:1}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:2}
  @keyframes warf{0%,100%{background:#ff4d4d}50%{background:#ffc2c2}}
  .war{animation:warf .3s 3;color:#7a0000 !important;font-weight:700}
  @keyframes rebf{0%,100%{box-shadow:inset 0 0 0 2px #000}50%{box-shadow:inset 0 0 0 2px #ff8c00}}
  .rebel{animation:rebf .25s 4}
  /* ----- 패널(법전/연대기/멸망기록) ----- */
  .panel{position:absolute;inset:0;overflow:auto;background:#fff;padding:14px 18px;display:none;box-sizing:border-box}
  .panel h2{font-size:14px;color:#107c41;margin:0 0 4px}
  .panel .sub{color:#888;font-size:11px;margin:0 0 12px}
  table.x{border-collapse:collapse;width:100%;font-size:11.5px}
  table.x th{background:#f3f3f3;border:1px solid #d8d8d8;padding:4px 8px;text-align:left;color:#444;font-weight:600;position:sticky;top:0}
  table.x td{border:1px solid #e6e6e6;padding:4px 8px;vertical-align:top}
  table.x tr:nth-child(even) td{background:#fafafa}
  .tag{display:inline-block;padding:0 6px;border-radius:8px;font-size:10px;color:#fff;line-height:16px}
  .lawline{font-family:Consolas,monospace;font-size:11px}
  .bar{display:inline-block;height:8px;border-radius:4px;vertical-align:middle}
  .muted{color:#999}
  .repealed td{color:#aaa;text-decoration:line-through}
  /* ----- 우측 레전드 ----- */
  #legend{position:absolute;top:8px;right:14px;background:#fffce6;border:1px solid #d8c66a;
    box-shadow:2px 3px 8px rgba(0,0,0,.18);padding:9px 12px;font-size:11px;z-index:6;
    min-width:212px;max-width:250px;line-height:1.65;max-height:calc(100% - 24px);overflow:auto}
  #legend .sw{display:inline-block;width:9px;height:9px;margin-right:6px;border-radius:2px;vertical-align:middle}
  #legend .dead{color:#999;font-size:10.5px}
  #legend h4{margin:8px 0 3px;font-size:11px;color:#7a6a1f}
  #legend h4:first-child{margin-top:0}
  #legend .fac{cursor:pointer}
  #legend .fac:hover{text-decoration:underline}
  #legend .mood{font-size:10px;color:#7a6a1f}
  #legend .lw{font-size:10px;color:#555;margin-left:15px}
  /* ----- 카드(셀/세력 상세) ----- */
  #card{position:absolute;left:8px;top:8px;background:#fff;border:1px solid #107c41;
    box-shadow:2px 3px 12px rgba(0,0,0,.25);padding:0;font-size:11.5px;z-index:7;
    width:264px;max-height:calc(100% - 16px);overflow:auto;display:none;border-radius:3px}
  #card .ch{background:#107c41;color:#fff;padding:6px 10px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
  #card .ch .cls{cursor:pointer;opacity:.85}
  #card .cb{padding:9px 11px;line-height:1.6}
  #card .k{color:#888}
  #card .em4{display:flex;gap:3px;margin:4px 0 7px}
  #card .em4 div{flex:1;text-align:center;border:1px solid #eee;border-radius:3px;padding:2px 0;font-size:10px}
  #card .embar{height:5px;border-radius:3px;margin-top:2px}
  #card .mem{font-size:10.5px;color:#555;border-left:2px solid #ddd;padding-left:7px;margin:2px 0}
  #statusbar{height:24px;flex:none;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 9px;opacity:.5}
  #statusbar .ev{overflow:hidden;text-overflow:ellipsis}
  #tabs{height:25px;flex:none;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:24px;
    border-top:1px solid #d4d4d4;font-size:11.5px;overflow:hidden}
  #tabs div{padding:3px 13px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  @media (max-width:640px){
    #menubar{gap:9px}#legend{min-width:150px;max-width:170px;font-size:10px;padding:6px 8px}
    #card{width:210px}#ctrl button{padding:2px 5px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <span>문명.xlsx - Excel</span>
  </div>
  <div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
  <div id="fbar">
    <div id="namebox">A1</div>
    <div id="fx">fx</div>
    <div id="formula"></div>
    <div id="ctrl">
      <button id="b-pause" title="시뮬 일시정지/재개">⏸ 정지</button>
      <button id="b-speed" title="시뮬 속도">속도 1×</button>
      <button id="b-emo" class="on" title="셀에 감정 표시 토글">情</button>
    </div>
  </div>
  <div id="stage">
    <div id="gridwrap"><div id="sheet"></div></div>
    <div class="panel" id="p-law"></div>
    <div class="panel" id="p-chron"></div>
    <div class="panel" id="p-dead"></div>
    <div id="legend"></div>
    <div id="card"></div>
  </div>
  <div id="statusbar"></div>
  <div id="tabs">
    <div class="on" data-t="grid">Sheet1</div>
    <div data-t="law" id="tab-law">법전 (0)</div>
    <div data-t="chron">연대기</div>
    <div data-t="dead" id="tab-dead">멸망기록 (0)</div>
  </div>
</div>

<script>
"use strict";
(() => {
/* =====================================================================
   엑셀로 위장한 창발 AI 문명 시뮬레이션 — 렌즈: 법·규범의 자생적 형성
   - 각 정착지(셀)는 감정·기억을 가진 자율 에이전트
   - 세력에는 지도자(성격)와 다층 지휘체계, 명령→해석→항명/반란
   - 행동의 반복과 감정에서 "규범 압력"이 쌓이고, 임계점에서 성문법 창발
   - 법은 행동을 제약/허용하고, 위반·집행·반란으로 폐기되거나 동맹간 전파됨
   - 대본 없음. 매 실행마다 다른 역사가 상호작용에서 창발.
   ===================================================================== */

const CW = 36, CH = 24;
const stage = document.getElementById('stage');
function dims(){
  const w = stage.clientWidth, h = stage.clientHeight;
  const cols = Math.max(16, Math.min(42, Math.floor((w - 46) / CW)));
  const rows = Math.max(12, Math.min(30, Math.floor((h - 4) / CH)));
  return {cols, rows};
}
let {cols:COLS, rows:ROWS} = dims();
let N = COLS * ROWS;

const sheet = document.getElementById('sheet');
const fmla = document.getElementById('formula');
const namebox = document.getElementById('namebox');
const statusbar = document.getElementById('statusbar');
const legend = document.getElementById('legend');
const card = document.getElementById('card');

function colName(n){ let s=''; n++; while(n>0){const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0;} return s; }
function ref(i){ return colName(i%COLS) + (((i/COLS)|0)+1); }
function rnd(a){ return Math.random()*a; }
function pick(arr){ return arr[Math.random()*arr.length|0]; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }

/* ---------- 그리드 DOM ---------- */
let cellEls = [];
function buildGrid(){
  sheet.style.gridTemplateColumns = `46px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows = CH + 'px';
  sheet.textContent = '';
  cellEls = new Array(N);
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd corner'; frag.appendChild(corner);
  for (let c=0;c<COLS;c++){ const h=document.createElement('div'); h.className='hd cn'; h.textContent=colName(c); frag.appendChild(h); }
  for (let r=0;r<ROWS;r++){
    const h=document.createElement('div'); h.className='hd rn'; h.textContent=r+1; frag.appendChild(h);
    for (let c=0;c<COLS;c++){
      const d=document.createElement('div'); d.className='cell'; d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d; frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

/* ---------- 지형 (value noise) ---------- */
const GW=9, GH=7;
let gz=[];
function genTerrainBase(){ gz=[]; for(let i=0;i<GW*GH;i++) gz[i]=Math.random(); }
function noise(x,y){
  const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=gz[y0*GW+x0], b=gz[y0*GW+Math.min(GW-1,x0+1)];
  const c=gz[Math.min(GH-1,y0+1)*GW+x0], d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}

/* ---------- 셀 상태 ----------
   cells[i] = {
     st: 'land'|'water'|'forest'|'ruin',
     owner: factionId|null, level:0..4, ruinT,
     hist: [라벨...],            // 그 땅의 역사
     // --- 에이전트(정착지) 상태 ---
     mood: {joy, anger, sorrow, glee},  // 0..100 감정 4축
     loyalty,                    // 0..100 지도자에 대한 충성
     crimes,                     // 누적 위법 행위 수(이 정착지가 저지른)
     gov,                        // 'core'|'frontier'|'rebel-seed'  지휘 위계상 위치
   }
*/
let cells=[];
const LV_TXT=['','·','田','村','都'];
const LV_LABEL=['','개척지','농장','마을','도시'];

function makeMood(){ return {joy:rnd(20)+15, anger:rnd(15), sorrow:rnd(15), glee:rnd(20)+10}; }

function genCells(){
  cells=new Array(N);
  for (let i=0;i<N;i++){
    const x=i%COLS, y=i/COLS|0;
    const v=noise(x,y)+(Math.random()-.5)*.14;
    let st='land', hist=['황무지'];
    if (v<.32){ st='water'; hist=['바다']; }
    else if (v>.62 && Math.random()<.7){ st='forest'; hist=['숲']; }
    cells[i]={st, owner:null, level:0, ruinT:0, hist,
      mood:makeMood(), loyalty:70, crimes:0, gov:'frontier'};
  }
}

function nbrs(i){
  const x=i%COLS, y=i/COLS|0, out=[];
  if(x>0)out.push(i-1); if(x<COLS-1)out.push(i+1);
  if(y>0)out.push(i-COLS); if(y<ROWS-1)out.push(i+COLS);
  return out;
}

/* =====================================================================
   세력(Faction) + 지도자 성격 + 법전
   ===================================================================== */
const NAMES=['북부 왕국','붉은 제국','해안 연맹','유목 칸국','삼나무 공화국','잿빛 교단','동방 상단','검은 강 부족','여명 왕조','소금 사막 민족','은빛 산악 부족','늪지 군주국'];
const COLORS=['#2563eb','#dc2626','#059669','#7c3aed','#d97706','#0d9488','#be185d','#4d7c0f','#9333ea','#b45309','#0891b2','#65a30d'];
const TITLES=['왕','대공','연맹장','칸','집정관','대사제','상주','족장','여제','장로','산군','늪주'];

/* 가능한 법(규범)들. 각 법은 어떤 "행동 충동"을 제약하거나 허용한다.
   trigger: 어떤 사건이 이 법의 규범압력을 올리는가
   effect: 행동확률 가중치(시뮬에서 참조) */
const LAW_DEFS = {
  banPillage:   {name:'동족불가침법', glyph:'盟', desc:'같은 세력 정착지 약탈 금지', kind:'ban',   color:'#1d6fb8'},
  banClearcut:  {name:'산림보호법',   glyph:'林', desc:'숲 개간에 허가 필요(개간 억제)', kind:'ban', color:'#2e7d32'},
  banSlaughter: {name:'포로보호법',   glyph:'慈', desc:'정복지 약탈·방화 금지(점령으로 대체)', kind:'ban', color:'#8e44ad'},
  allowVendetta:{name:'복수허용법',   glyph:'仇', desc:'피해 입은 정착지의 보복 전쟁 허용·장려', kind:'allow', color:'#c0392b'},
  festival:     {name:'축제의무법',   glyph:'祝', desc:'정기적 축제로 사기 진작(주기적 기쁨)', kind:'allow', color:'#d68910'},
  tribute:      {name:'공납징수법',   glyph:'貢', desc:'변경에서 중심으로 자원 징수(발전 가속·변경 분노)', kind:'allow', color:'#7d6608'},
  exile:        {name:'추방형법',     glyph:'放', desc:'중범죄 정착지를 추방(독립 세력화 위험)', kind:'ban', color:'#566573'},
};
const LAW_KEYS = Object.keys(LAW_DEFS);

let factions=[];
let nameOrder=[];
let nextFid=0;
const obituaries=[];   // 멸망한 세력
const deadLaws=[];     // 폐기된 법 (세력명, 법명, 이유, 연도)
const chronicle=[];    // 연대기 전체 로그
let year=1, lastEvent='천지가 창조되었습니다.', pop=0;
let plague=new Map(), fires=new Map();
const dirty=new Set();
let selected=-1, selectedFac=-1;

function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function makeLeader(){
  // 성격 4축 0..1: 호전성/정의감/탐욕/자비. 합이 한쪽으로 치우치게.
  return {
    bellicose: rnd(1), justice: rnd(1), greed: rnd(1), mercy: rnd(1),
    mandate: pick(['확장','정복','번영','수호','정복','확장']), // 지도자의 당면 명령
  };
}

function spawnFaction(announce, reason){
  if (!nameOrder.length){ nameOrder=NAMES.map((_,k)=>k); for(let k=nameOrder.length-1;k>0;k--){const j=rnd(k+1)|0;[nameOrder[k],nameOrder[j]]=[nameOrder[j],nameOrder[k]];} }
  const used=new Set(factions.map(f=>f.nameIdx).concat(obituaries.map(o=>o.nameIdx)));
  let ni = nameOrder.find(k=>!used.has(k));
  if (ni===undefined) ni = pick(nameOrder);
  const f={
    id: nextFid++, nameIdx: ni, name: NAMES[ni], title: TITLES[ni%TITLES.length],
    color: COLORS[ni%COLORS.length], golden:0, size:0, arr:[],
    leader: makeLeader(),
    laws: {},            // lawKey -> {enacted:year, violations, enforcement}
    pressure: {},        // lawKey -> 규범압력 0..100
    dissent: 0,          // 세력 전체 항명 누적
    born: year, allies: new Set(),
    actLog: {},          // 행동 빈도(규범압력 누적용)
  };
  for (const k of LAW_KEYS){ f.pressure[k]=0; f.actLog[k]=0; }
  for (let tries=0;tries<400;tries++){
    const i=Math.random()*N|0;
    if (cells[i].st==='land' && cells[i].owner===null){
      setCell(i,f.id,1,'개척지'); cells[i].gov='core'; cells[i].loyalty=85;
      factions.push(f);
      if (announce) logEvent(`${f.name}이(가) 역사에 등장했습니다. ${f.title} 즉위, 천명: 「${f.leader.mandate}」`,
        `=SPAWN("${f.name}", ${ref(i)}, 천명="${f.leader.mandate}")`, 'birth');
      else if (reason) logEvent(reason.msg, reason.formula, 'birth');
      return f;
    }
  }
  return null;
}
function facById(id){ return factions.find(f=>f.id===id); }

function setCell(i,owner,level,histLabel){
  const c=cells[i];
  c.owner=owner; c.level=level; c.st='land';
  if (histLabel){ c.hist.push(histLabel); if(c.hist.length>8)c.hist.shift(); }
  dirty.add(i);
}

/* ---------- 감정 변화 헬퍼 ---------- */
function feel(i, key, amt){
  const m=cells[i].mood;
  m[key]=clamp(m[key]+amt, 0, 100);
  dirty.add(i);
}
function dominantMood(m){
  let best='joy', bv=-1;
  for (const k of ['joy','anger','sorrow','glee']) if (m[k]>bv){bv=m[k];best=k;}
  return bv<22 ? null : best;
}
const MOOD_GLYPH={joy:'喜', anger:'怒', sorrow:'哀', glee:'樂'};
const MOOD_COLOR={joy:'#27ae60', anger:'#e74c3c', sorrow:'#5d6d7e', glee:'#e67e22'};
const MOOD_KO={joy:'기쁨', anger:'분노', sorrow:'슬픔', glee:'즐거움'};

/* ---------- paint ---------- */
let showEmo=true;
function paint(i){
  const c=cells[i], el=cellEls[i];
  if(!el) return;
  let bg='', tx='', col='#222', w='', emo='', cap='';
  if (plague.has(i)){ bg='#ead5f5'; tx='疫'; col='#7030a0'; w='700'; }
  else if (fires.has(i)){ bg='#ffd9b3'; tx='火'; col='#c00000'; w='700'; }
  else if (c.st==='water'){ bg='#ddebf7'; tx='≈'; col='#9dc3e6'; }
  else if (c.st==='forest'){ bg='#e2efda'; tx='木'; col='#548235'; }
  else if (c.st==='ruin'){ bg='#ececec'; tx='墟'; col='#999'; }
  else if (c.owner!==null){
    const f=facById(c.owner);
    if (f){
      bg=hexA(f.color, .12+c.level*.16); tx=LV_TXT[c.level]; col=f.color; w=c.level>=3?'700':'';
      if (c.gov==='core') cap='★';
      if (showEmo){
        const dm=dominantMood(c.mood);
        if (dm){ emo=MOOD_GLYPH[dm]; }
      }
    }
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  // 본문 + 감정 마크 + 수도표시
  el.textContent='';
  if (tx){ el.appendChild(document.createTextNode(tx)); }
  if (emo){
    const dm=dominantMood(c.mood);
    const s=document.createElement('span'); s.className='em'; s.textContent=emo;
    s.style.color=MOOD_COLOR[dm]||'#888'; el.appendChild(s);
  }
  if (cap){ const s=document.createElement('span'); s.className='cap'; s.textContent=cap; s.style.color=col; el.appendChild(s); }
}

/* ---------- 로그 / 연대기 ---------- */
function logEvent(msg, formula, kind){
  lastEvent=`서기 ${year}년: ${msg}`;
  if (formula) fmla.textContent=formula;
  chronicle.push({year, msg, formula:formula||'', kind:kind||'event'});
  if (chronicle.length>600) chronicle.shift();
}
function flashCell(i, cls){
  const el=cellEls[i]; if(!el) return;
  el.classList.add(cls);
  setTimeout(()=>el.classList.remove(cls), cls==='war'?1000:1100);
}

/* =====================================================================
   법·규범의 자생적 형성 엔진
   규범압력(pressure)이 임계(LAW_THRESH)를 넘으면 법 제정.
   위반(violations)이 누적되면 법 폐기. 동맹은 법을 전파.
   ===================================================================== */
const LAW_THRESH=80, MAX_LAWS=4;

// 사건이 일어나면 관련 규범의 "압력"을 올린다 (지도자 성격이 가중)
function addPressure(f, key, amt){
  if (!f) return;
  if (f.laws[key]) return; // 이미 법이면 압력 누적 불필요
  const L=f.leader;
  let g=1;
  if (key==='banSlaughter') g = .6 + L.mercy*1.3;
  else if (key==='allowVendetta') g = .6 + L.bellicose*1.2;
  else if (key==='banPillage') g = .6 + L.justice*1.3;
  else if (key==='banClearcut') g = .7 + (1-L.greed)*1.0;
  else if (key==='tribute') g = .6 + L.greed*1.4;
  else if (key==='festival') g = .8 + L.mercy*.6;
  else if (key==='exile') g = .6 + L.justice*.8;
  f.pressure[key]=clamp((f.pressure[key]||0)+amt*g, 0, LAW_THRESH*1.4);
}

function lawCount(f){ return Object.keys(f.laws).length; }

function tryEnact(f){
  if (lawCount(f) >= MAX_LAWS) return;
  for (const key of LAW_KEYS){
    if (f.laws[key]) continue;
    if ((f.pressure[key]||0) >= LAW_THRESH){
      f.laws[key]={enacted:year, violations:0, obeyed:0, enforcement:.3+f.leader.justice*.5};
      f.pressure[key]=0;
      const d=LAW_DEFS[key];
      logEvent(`${f.name}이(가) 《${d.name}》을 성문법으로 제정했습니다. — ${d.desc}`,
        `=ENACT("${d.name}", "${f.name}", 근거=반복된_사건)`, 'law');
      // 핵심 정착지 사기 상승(질서)
      for (const i of f.arr) if (cells[i].gov==='core'){ feel(i,'joy',6); }
      updateLawTab();
      return; // 한 틱에 하나만
    }
  }
}

function repealLaw(f, key, reason){
  const d=LAW_DEFS[key];
  delete f.laws[key];
  deadLaws.push({fac:f.name, color:f.color, law:d.name, reason, year});
  logEvent(`${f.name}의 《${d.name}》이(가) ${reason} 폐지되었습니다.`,
    `=REPEAL("${d.name}", "${f.name}", 사유="${reason}")`, 'law');
  updateLawTab(); updateDeadTab();
}

// 동맹 사이 법 모방(전파)
function propagateLaws(f){
  if (!f.allies.size) return;
  for (const aid of f.allies){
    const a=facById(aid); if(!a) continue;
    for (const key of Object.keys(f.laws)){
      if (!a.laws[key] && lawCount(a)<MAX_LAWS && Math.random()<.02){
        addPressure(a, key, 24);
        if ((a.pressure[key]||0)>=LAW_THRESH*.85 && Math.random()<.4){
          a.pressure[key]=LAW_THRESH; // 곧 제정되도록
          logEvent(`${a.name}이(가) 동맹 ${f.name}의 《${LAW_DEFS[key].name}》을 본받기로 했습니다.`,
            `=ADOPT("${LAW_DEFS[key].name}", from="${f.name}", to="${a.name}")`, 'law');
        }
      }
    }
  }
}

/* =====================================================================
   시뮬레이션 틱
   ===================================================================== */
let tickN=0, evCooldown=0;
let warW=[0,40,160,520,1400];

function tick(){
  tickN++; year++;
  if (evCooldown>0) evCooldown--;

  /* --- 재집계 --- */
  for (const f of factions){ f.arr.length=0; f.size=0; }
  pop=0;
  for (let i=0;i<N;i++){
    const c=cells[i];
    if (c.st==='ruin' && --c.ruinT<=0){ c.st='land'; dirty.add(i); }
    if (c.owner!==null){
      const f=facById(c.owner);
      if (f){ f.arr.push(i); f.size++; pop+=warW[c.level]; }
      else { c.owner=null; c.level=0; dirty.add(i); }
    }
  }

  /* --- 멸망 판정 --- */
  for (let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if (f.size===0){
      // 남은 법은 사문화
      for (const key of Object.keys(f.laws)) deadLaws.push({fac:f.name, color:f.color, law:LAW_DEFS[key].name, reason:'세력 멸망으로', year});
      obituaries.push({name:f.name, year, nameIdx:f.nameIdx, born:f.born, color:f.color,
        laws:Object.keys(f.laws).map(k=>LAW_DEFS[k].name)});
      logEvent(`${f.name}이(가) 역사에서 사라졌습니다. (${f.born}~${year})`, `=COLLAPSE("${f.name}", ${year})`, 'death');
      for (const a of factions) a.allies.delete(f.id);
      factions.splice(k,1);
      updateDeadTab(); updateLawTab();
    }
  }

  /* --- 화재 확산 --- */
  for (const [i,t] of [...fires]){
    if (Math.random()<.12){
      for (const n of nbrs(i)){
        const c=cells[n];
        if (c.owner!==null && !fires.has(n) && c.st==='land'){ fires.set(n,5); feel(n,'sorrow',14); feel(n,'anger',8); dirty.add(n); }
      }
    }
    if (t<=1){
      fires.delete(i);
      const c=cells[i]; c.owner=null; c.level=0; c.st='ruin'; c.ruinT=55;
      c.hist.push('잿더미'); if(c.hist.length>8)c.hist.shift();
      dirty.add(i);
    } else fires.set(i,t-1);
  }

  /* --- 역병 --- */
  if (plague.size){
    for (const [i,t] of [...plague]){
      if (Math.random()<.16) for (const n of nbrs(i)) if (cells[n].owner!==null && !plague.has(n)){ plague.set(n,11); feel(n,'sorrow',10); dirty.add(n); }
      if (Math.random()<.22){
        const c=cells[i]; c.level--; feel(i,'sorrow',12);
        if (c.level<=0){ c.owner=null; c.level=0; c.hist.push('역병으로 소멸'); if(c.hist.length>8)c.hist.shift(); }
        dirty.add(i);
      }
      if (t<=1){ plague.delete(i); dirty.add(i); } else plague.set(i,t-1);
    }
    if (plague.size===0) logEvent('역병이 물러갔습니다.', '=PLAGUE.END()', 'event');
  }

  /* --- 세력별 자율 행동 --- */
  for (const f of factions){
    if (f.golden>0) f.golden--;
    if (f.size===0) continue;
    const L=f.leader;

    // 지도자 천명 재평가(감정/규모 기반) — 명령이 바뀜
    if (tickN%30===0){
      const avgAnger=avgMood(f,'anger'), avgJoy=avgMood(f,'joy');
      if (avgAnger>55 && L.bellicose>.4) L.mandate='정복';
      else if (f.size<4) L.mandate='확장';
      else if (avgJoy>55) L.mandate='번영';
      else if (avgAnger>45) L.mandate='수호';
    }

    /* 확장/전쟁 — 변경 정착지(에이전트)가 명령을 해석 */
    const attempts=1+(f.size*.07|0);
    for (let a=0;a<attempts;a++){
      const src=pick(f.arr);
      if (src===undefined || cells[src].owner!==f.id) continue;
      const sc=cells[src];
      const nb=nbrs(src); if(!nb.length) continue;
      // 호전적이거나 정복 천명이면 적 이웃을 우선 노린다(빈 땅보다 정복 선호)
      let tgt;
      const enemyNb=nb.filter(n=>{const e=cells[n]; return e.owner!==null && e.owner!==f.id && !fires.has(n);});
      const aggressive = L.mandate==='정복' || L.bellicose>.55 || sc.mood.anger>55;
      if (enemyNb.length && aggressive && Math.random()<.7){ tgt=pick(enemyNb); }
      else { tgt=pick(nb); }
      const tc=cells[tgt];
      if (tc.st==='water' || fires.has(tgt)) continue;

      // 빈 땅 / 숲 개척
      if (tc.owner===null){
        if (tc.st==='forest'){
          // 산림보호법이 있으면 개간 억제(단, 탐욕/분노 높으면 위반)
          let p=.25;
          if (f.laws.banClearcut){ p=.05; if (sc.mood.anger>50||L.greed>.7) p=.18; }
          if (Math.random()<p){
            if (f.laws.banClearcut && p>.1){ violate(f,'banClearcut',src,tgt,'산림'); }
            tc.st='land'; tc.hist.push('개간'); setCell(tgt,f.id,1,'개척지'); inheritMood(src,tgt);
            f.actLog.banClearcut++; if(!f.laws.banClearcut) addPressure(f,'banClearcut',5.5);
          }
        } else if (tc.st==='land'){ setCell(tgt,f.id,1,'개척지'); inheritMood(src,tgt); }
        continue;
      }

      // 같은 세력 — 동족 약탈 충동(분노/탐욕 높을 때)
      if (tc.owner===f.id){
        if (sc.mood.anger>62 && tc.level>sc.level && Math.random()<.10){
          // 동족 약탈 시도
          if (f.laws.banPillage){
            if (sc.mood.anger>78 && Math.random()<.5){ violate(f,'banPillage',src,tgt,'동족'); doPillage(f,src,tgt); }
            else { obey(f,'banPillage',src); }
          } else {
            doPillage(f,src,tgt);
            f.actLog.banPillage++; addPressure(f,'banPillage',6); // 동족 약탈이 반복되면 금지 규범 압력↑
          }
        }
        continue;
      }

      // 다른 세력 — 전쟁 (명령 해석 + 법 + 감정)
      const defF=facById(tc.owner);
      if (!defF) continue;
      const allied = f.allies.has(defF.id);
      // 전쟁 의지: 천명 + 호전성 + 분노 + 복수허용법 - 동맹/자비
      let willWar = .30;
      if (L.mandate==='정복') willWar+=.28; else if (L.mandate==='수호') willWar-=.04; else if(L.mandate==='번영') willWar-=.12;
      willWar += L.bellicose*.22 + sc.mood.anger*.004;
      if (f.laws.allowVendetta && sc.mood.anger>40) willWar+=.18;
      willWar -= L.mercy*.12;
      if (allied) willWar*=.12; // 동맹은 거의 안 침
      willWar=clamp(willWar,.05,.85);
      if (Math.random()>willWar) continue;

      const att=1+rnd(3)+f.size*.002+(f.golden?1:0)+sc.mood.anger*.012;
      // 약소 세력은 방어가 약하다(끝내 흡수·멸망의 동력). 마지막 칸일수록 더 취약.
      const weak = defF.size<=3 ? (4-defF.size)*1.1 : 0;
      const def=tc.level+1+rnd(3)+(defF.laws.allowVendetta?.6:0)-weak;
      flashCell(tgt,'war');
      if (att>def){
        // 약탈/방화 vs 점령 — 포로보호법 + 자비
        let brutal = (!f.laws.banSlaughter) && (L.bellicose>.5 || sc.mood.anger>60) && Math.random()<.4;
        if (f.laws.banSlaughter && brutalUrge(L,sc) && Math.random()<.35){ violate(f,'banSlaughter',src,tgt,'정복지'); brutal=true; }
        else if (f.laws.banSlaughter){ obey(f,'banSlaughter',src); }
        if (brutal){
          fires.set(tgt,5); tc.hist.push('전화(戰火)'); if(tc.hist.length>8)tc.hist.shift();
          feel(tgt,'sorrow',22); feel(tgt,'anger',26); dirty.add(tgt);
          f.actLog.banSlaughter++; if(!f.laws.banSlaughter) addPressure(f,'banSlaughter',11);
        } else {
          const old=defF;
          setCell(tgt,f.id,Math.max(1,tc.level-1),'점령됨');
          cells[tgt].mood.anger=clamp(cells[tgt].mood.anger+30,0,100);
          cells[tgt].mood.sorrow=clamp(cells[tgt].mood.sorrow+18,0,100);
          cells[tgt].loyalty=25; cells[tgt].gov='frontier';
          // 정복자측 즐거움, 정의감 높으면 복수당함 규범
          feel(src,'glee',10);
          if (old) addPressure(old,'allowVendetta',14); // 침략당한 쪽은 복수규범 압력↑
          // 잔혹하지 않게 점령했어도, 정의감 있는 정복자는 포로보호 규범을 키운다
          addPressure(f,'banSlaughter',3);
        }
        if (tc.level>=2 || evCooldown===0){
          logEvent(`${f.name}이(가) ${defF.name}의 ${LV_LABEL[Math.max(1,tc.level)]||'영토'}(${ref(tgt)})를 ${brutal?'약탈':'점령'}했습니다.`,
            `=WAR("${f.name}"→"${defF.name}", ${ref(tgt)}, ${brutal?'약탈':'점령'})`, 'war');
          evCooldown=22;
        }
        // 복수전(피침측 분노→다음 틱 전쟁의지)
      } else {
        feel(src,'anger',6); feel(src,'sorrow',4); // 패퇴
      }
    }

    /* 발전 */
    let ups=1+(f.size*.05|0);
    if (f.laws.tribute) ups+=1; // 공납법 = 발전 가속
    for (let u=0;u<ups;u++){
      const i=pick(f.arr); if (i===undefined||cells[i].owner!==f.id) continue;
      const c=cells[i];
      let p=.06*(f.golden?3:1)*(f.laws.festival?1.15:1);
      if (c.mood.anger>60) p*=.5; // 분노한 정착지는 발전 더딤
      if (c.level<4 && Math.random()<p){
        c.level++; c.hist.push(LV_LABEL[c.level]); if(c.hist.length>8)c.hist.shift();
        feel(i,'joy',8); dirty.add(i);
        if (c.level===4 && evCooldown===0){
          logEvent(`${f.name}의 ${ref(i)}에 대도시가 세워졌습니다.`, `=CITY("${f.name}", ${ref(i)})`, 'event');
          evCooldown=20;
        }
      }
    }

    /* 공납징수법 효과 — 변경 분노 누적 → 복수/추방 규범 압력, 압정이 길어지면 반란 씨앗 */
    if (f.laws.tribute && tickN%5===0){
      for (const i of f.arr) if (cells[i].gov==='frontier' && Math.random()<.4){ feel(i,'anger',9); cells[i].loyalty=clamp(cells[i].loyalty-3,0,100); }
    }

    /* 축제의무법 — 주기적 기쁨 */
    if (f.laws.festival && tickN%14===0){
      for (const i of f.arr) if (Math.random()<.5){ feel(i,'joy',7); feel(i,'glee',9); feel(i,'anger',-6); }
      if (Math.random()<.06 && evCooldown===0){ logEvent(`${f.name}에서 대축제가 열렸습니다.`, `=FESTIVAL("${f.name}")`, 'event'); evCooldown=24; }
    }

    /* 자연 감정 감쇠 + 충성도 갱신 */
    if (tickN%4===0){
      // 과확장: 거대 제국일수록 변경 통제가 약해져 충성이 침식된다(다층 지휘의 한계)
      const overreach = f.size>40 ? (f.size-40)*0.012 : 0;
      for (const i of f.arr){
        const m=cells[i].mood;
        m.anger=clamp(m.anger-0.8,0,100); m.sorrow=clamp(m.sorrow-1.0,0,100);
        m.glee=clamp(m.glee-1.5,0,100);
        // 충성: 분노↓ 기쁨↑이면 충성↑ (분노가 높으면 충성이 빠르게 침식)
        let dl=(m.joy-m.anger*1.4)*.04;
        if (cells[i].gov==='frontier'){ dl-=overreach; if(overreach>0 && m.anger<40) feel(i,'anger',overreach*1.5); }
        cells[i].loyalty=clamp(cells[i].loyalty + dl, 0, 100);
        dirty.add(i);
      }
    }

    /* 법 위반율 평가 → 폐기 / 집행 */
    evaluateLaws(f);

    /* 규범 → 법 제정 시도 */
    tryEnact(f);

    /* 동맹 법 전파 */
    if (tickN%7===0) propagateLaws(f);

    /* 항명·반란 판정 */
    checkRebellion(f);
  }

  /* --- 외교: 배신/파기 (호전·탐욕 지도자는 동맹을 깬다) --- */
  if (tickN%21===0 && factions.length>=2){
    for (const f of factions){
      if (!f.allies.size) continue;
      const L=f.leader;
      if ((L.bellicose>.6 || L.greed>.7) && Math.random()<.06){
        const tid=[...f.allies][rnd(f.allies.size)|0];
        const t=facById(tid);
        if (t){ f.allies.delete(tid); t.allies.delete(f.id);
          for (const i of t.arr) if (cells[i].gov==='frontier') feel(i,'anger',10);
          logEvent(`${f.name}이(가) ${t.name}과(와)의 동맹을 파기했습니다. (배신)`,
            `=BETRAY("${f.name}"✗"${t.name}")`, 'diplo');
          addPressure(t,'allowVendetta',12);
        }
        break;
      }
    }
  }

  /* --- 외교: 동맹 형성 (법을 공유하면 잘 맺어짐) --- */
  if (tickN%18===0 && factions.length>=2 && Math.random()<.5){
    const a=pick(factions), b=pick(factions);
    if (a&&b&&a!==b && !a.allies.has(b.id)){
      // 공유 법 수 + 둘 다 비호전적이면 동맹
      const shared=Object.keys(a.laws).filter(k=>b.laws[k]).length;
      const peaceful=(a.leader.bellicose+b.leader.bellicose)<1.0;
      if ((shared>=1 || peaceful) && Math.random()<.5){
        a.allies.add(b.id); b.allies.add(a.id);
        logEvent(`${a.name}과(와) ${b.name}이(가) 동맹을 맺었습니다.${shared?` (공유법 ${shared}건)`:''}`,
          `=ALLY("${a.name}","${b.name}", 공유법=${shared})`, 'diplo');
      }
    }
  }

  /* --- 무작위 사건 --- */
  const r=Math.random();
  if (!plague.size && r<.004){
    const big=cells.map((c,i)=>({c,i})).filter(o=>o.c.owner!==null && o.c.level>=3);
    if (big.length){ const o=pick(big); plague.set(o.i,11); feel(o.i,'sorrow',20); dirty.add(o.i);
      logEvent(`${ref(o.i)}에서 역병이 창궐했습니다.`, `=PLAGUE(${ref(o.i)})`, 'event'); }
  } else if (r>.996 && factions.length){
    const f=pick(factions); f.golden=90;
    for (const i of f.arr){ feel(i,'glee',16); feel(i,'joy',12); }
    logEvent(`${f.name}의 황금기가 시작되었습니다.`, `=GOLDEN.AGE("${f.name}", 90)`, 'event');
  } else if (r>.9935 && r<=.996){
    const towns=cells.map((c,i)=>({c,i})).filter(o=>o.c.owner!==null && o.c.level>=2);
    if (towns.length){ const o=pick(towns); fires.set(o.i,6); feel(o.i,'sorrow',16); dirty.add(o.i);
      logEvent(`${ref(o.i)}에 대화재가 발생했습니다.`, `=FIRE(${ref(o.i)})`, 'event'); }
  } else if (!plague.size && r>.990 && r<=.9935){
    // 기근 — 광역 슬픔/분노 → 공납/추방 규범 압력
    const f=factions.length?pick(factions):null;
    if (f && f.size){ for (const i of f.arr){ feel(i,'sorrow',14); feel(i,'anger',9); }
      addPressure(f,'tribute',18); addPressure(f,'festival',12);
      logEvent(`${f.name}에 기근이 들었습니다. 민심이 흉흉합니다.`, `=FAMINE("${f.name}")`, 'event'); }
  }

  // 신규 세력 도래
  if (factions.length<3 && Math.random()<.012 && factions.length<7){
    const f=spawnFaction(false,{msg:'', formula:''});
    if (f) logEvent(`바다 건너에서 ${f.name}이(가) 도래했습니다.`, `=MIGRATE("${f.name}")`, 'birth');
  }

  /* --- 그리기 --- */
  for (const i of dirty) paint(i);
  dirty.clear();

  /* --- 상태바 + 레전드 --- */
  const lawTotal=factions.reduce((s,f)=>s+lawCount(f),0);
  statusbar.innerHTML=`준비<span class="sep">|</span>서기 ${year}년<span class="sep">|</span>인구 ${pop.toLocaleString()}<span class="sep">|</span>국가 ${factions.length}<span class="sep">|</span>현행법 ${lawTotal}<span class="sep">|</span><span class="ev">${escapeHtml(lastEvent)}</span>`;
  if (tickN%9===0){ updateLegend(); document.title=`문명.xlsx - Excel (서기 ${year}년)`;
    document.getElementById('tab-dead').textContent=`멸망기록 (${obituaries.length})`;
    document.getElementById('tab-law').textContent=`법전 (${lawTotal})`;
  }
  if (tickN%24===0){ if (curTab==='chron') updateChronTab(); }
  // 선택된 셀/세력 카드 라이브 갱신
  if (card.style.display==='block'){ if (selectedFac>=0) renderFacCard(selectedFac); else if (selected>=0) renderCellCard(selected); }
}

/* ---------- 행동/법 보조 ---------- */
function avgMood(f,key){ if(!f.arr.length) return 0; let s=0; for(const i of f.arr)s+=cells[i].mood[key]; return s/f.arr.length; }
function inheritMood(src,tgt){ const a=cells[src].mood, b=cells[tgt].mood; b.joy=a.joy*.6+15; b.anger=a.anger*.5; b.sorrow=a.sorrow*.4; b.glee=a.glee*.5; }
function brutalUrge(L,sc){ return L.bellicose>.55 || sc.mood.anger>62 || L.mercy<.3; }

function doPillage(f,src,tgt){
  const tc=cells[tgt]; tc.level=Math.max(1,tc.level-1);
  tc.mood.anger=clamp(tc.mood.anger+28,0,100); tc.mood.sorrow=clamp(tc.mood.sorrow+16,0,100);
  tc.loyalty=clamp(tc.loyalty-25,0,100);
  cells[src].mood.glee=clamp(cells[src].mood.glee+12,0,100); cells[src].mood.anger=clamp(cells[src].mood.anger-12,0,100);
  tc.hist.push('동족에게 약탈'); if(tc.hist.length>8)tc.hist.shift();
  dirty.add(tgt); dirty.add(src);
  if (evCooldown===0){ logEvent(`${f.name} 내부에서 ${ref(src)}이(가) 동족 ${ref(tgt)}을(를) 약탈했습니다.`,
    `=PILLAGE.INTERNAL("${f.name}", ${ref(src)}→${ref(tgt)})`, 'crime'); evCooldown=18; }
}

function violate(f,key,src,tgt,what){
  const law=f.laws[key]; if(!law) return;
  law.violations++;
  cells[src].crimes++;
  cells[src].mood.glee=clamp(cells[src].mood.glee+6,0,100);
  // 집행(처벌) — 정의감/집행력에 따라
  if (Math.random()<law.enforcement){
    cells[src].mood.anger=clamp(cells[src].mood.anger+18,0,100); // 처벌받으면 분노
    cells[src].loyalty=clamp(cells[src].loyalty-15,0,100);
    f.dissent+=1.5;
    if (evCooldown===0){ logEvent(`${f.name}: ${ref(src)}이(가) 《${LAW_DEFS[key].name}》을 어겨 처벌받았습니다.`,
      `=PUNISH("${LAW_DEFS[key].name}", ${ref(src)})`, 'crime'); evCooldown=16; }
    if (key==='exile' || cells[src].crimes>=3){ /* 추방 가능성 — checkRebellion에서 처리 */ }
  } else {
    // 처벌 실패 = 법의 권위 약화
    f.dissent+=.6;
    if (evCooldown===0){ logEvent(`${f.name}: ${ref(src)}이(가) 《${LAW_DEFS[key].name}》을 어겼으나 처벌을 피했습니다.`,
      `=DEFY("${LAW_DEFS[key].name}", ${ref(src)})`, 'crime'); evCooldown=16; }
  }
}
function obey(f,key,src){ const law=f.laws[key]; if(!law)return; law.obeyed++; cells[src].mood.joy=clamp(cells[src].mood.joy+1.2,0,100); }

function evaluateLaws(f){
  for (const key of Object.keys(f.laws)){
    const law=f.laws[key];
    const total=law.violations+law.obeyed;
    if (total>=8){
      const vrate=law.violations/total;
      // 위반율 과반 + 충분히 오래 = 사문화 폐기
      if (vrate>.6 && (year-law.enacted)>30 && Math.random()<.04){
        repealLaw(f,key,'널리 무시되어'); continue;
      }
      // 집행력 조정(정의감 높으면 강화)
      if (vrate>.5) law.enforcement=clamp(law.enforcement+.01,0,.95);
    }
    // 지도자 성격과 정반대 법은 폐기 압박(예: 호전적 지도자의 포로보호법)
    if (key==='banSlaughter' && f.leader.bellicose>.8 && Math.random()<.006) repealLaw(f,key,'호전적 지도자에 의해');
    if (key==='banClearcut' && f.leader.greed>.85 && Math.random()<.006) repealLaw(f,key,'개발 압력으로');
  }
}

/* ---------- 항명·반란·분열(새 세력 창발) ---------- */
function checkRebellion(f){
  if (f.size<4) return;
  // 충성 붕괴 + 분노가 반란의 씨앗. 충성도 자체를 핵심 신호로 사용(지속 상태).
  const disloyal=f.arr.filter(i=>cells[i].loyalty<32 && cells[i].mood.anger>45);
  f.dissent=clamp(f.dissent-.25,0,200);
  if (disloyal.length>=Math.max(2, f.size*.14) && (f.dissent>5 || disloyal.length>=3) && Math.random()<.12){
    // 반란 → 새 세력 분열
    const seed=pick(disloyal);
    const rebel={
      id: nextFid++, nameIdx:-1, name:`${f.name} 반란군`, title:'반란 수괴',
      color: shiftColor(f.color), golden:0, size:0, arr:[],
      leader: {bellicose:clamp(f.leader.bellicose+.2,0,1), justice:rnd(1), greed:rnd(1), mercy:rnd(.5), mandate:'정복'},
      laws:{}, pressure:{}, dissent:0, born:year, allies:new Set(), actLog:{},
    };
    for (const k of LAW_KEYS){ rebel.pressure[k]=0; rebel.actLog[k]=0; }
    // 충성을 잃은 정착지들이 반란군에 합류
    let joined=0;
    for (const i of disloyal){ if (cells[i].owner===f.id && Math.random()<.75){
      setCell(i,rebel.id,Math.max(1,cells[i].level-1),'봉기');
      cells[i].mood.anger=clamp(cells[i].mood.anger-30,0,100);
      cells[i].mood.glee=clamp(cells[i].mood.glee+20,0,100);
      cells[i].loyalty=70; cells[i].gov='core';
      flashCell(i,'rebel'); joined++;
    }}
    if (joined>=2){
      factions.push(rebel);
      f.dissent=0;
      logEvent(`${f.name}에서 ${joined}개 정착지가 봉기하여 「${rebel.name}」이(가) 분열·독립했습니다.`,
        `=REBEL("${f.name}", 정착지=${joined}, 사유=압정·법위반)`, 'rebel');
      updateLawTab();
    } else { for(const i of disloyal) if(cells[i].owner===rebel.id) cells[i].owner=f.id; nextFid--; }
  }
}
function shiftColor(hex){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=clamp(r+ (r>128?-70:70),0,255); g=clamp(255-g,0,255); b=clamp(b+40,0,255);
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

/* =====================================================================
   UI: 레전드 / 카드 / 패널(법전·연대기·멸망기록) / 탭
   ===================================================================== */
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function moodSummary(f){
  if(!f.arr.length) return '';
  const m={joy:avgMood(f,'joy'),anger:avgMood(f,'anger'),sorrow:avgMood(f,'sorrow'),glee:avgMood(f,'glee')};
  let best='joy',bv=-1; for(const k in m) if(m[k]>bv){bv=m[k];best=k;}
  return `<span style="color:${MOOD_COLOR[best]}">${MOOD_GLYPH[best]} ${MOOD_KO[best]}</span>`;
}

function updateLegend(){
  let h='<h4>세력 현황 (클릭=상세)</h4>';
  const sorted=[...factions].sort((a,b)=>b.size-a.size);
  for (const f of sorted){
    const lc=lawCount(f);
    h+=`<div class="fac" data-fac="${f.id}"><span class="sw" style="background:${f.color}"></span>${escapeHtml(f.name)}${f.golden?' ✦':''} — ${f.size}칸 ${moodSummary(f)}</div>`;
    if (lc) h+=`<div class="lw">法 ${Object.keys(f.laws).map(k=>LAW_DEFS[k].glyph+LAW_DEFS[k].name).join(', ')}</div>`;
  }
  if (!factions.length) h+='<div class="muted">모든 문명이 멸망했습니다…</div>';
  if (obituaries.length){
    h+='<h4>멸망기록</h4>';
    for (const o of obituaries.slice(-3)) h+=`<div class="dead">† ${escapeHtml(o.name)} (${o.year}년)</div>`;
  }
  h+='<h4>범례</h4><div style="font-size:10px;line-height:1.5">木숲 ≈물 ·田村都 발전 墟폐허 火화재 疫역병<br>右上 喜怒哀樂=정착지 감정 · ★=수도</div>';
  legend.innerHTML=h;
}

function renderCellCard(i){
  selectedFac=-1;
  const c=cells[i];
  if (selected>=0 && cellEls[selected]) cellEls[selected].classList.remove('sel');
  selected=i; if(cellEls[i]) cellEls[i].classList.add('sel');
  namebox.textContent=ref(i);
  const f=c.owner!==null?facById(c.owner):null;
  let title = c.st==='water'?'바다':c.st==='forest'?'숲':c.st==='ruin'?'폐허':f?`${f.name}의 정착지`:'무주지(無主地)';
  let body='';
  body+=`<div><span class="k">위치</span> ${ref(i)} · <span class="k">지형</span> ${title}</div>`;
  if (f){
    body+=`<div><span class="k">소속</span> <span style="color:${f.color};font-weight:600">${escapeHtml(f.name)}</span> · ${LV_LABEL[c.level]||'-'} ${c.gov==='core'?'★수도':''}</div>`;
    body+=`<div><span class="k">충성도</span> ${c.loyalty|0} · <span class="k">전과</span> ${c.crimes}</div>`;
    body+='<div class="em4">';
    for (const k of ['joy','anger','sorrow','glee']){
      const v=c.mood[k]|0;
      body+=`<div>${MOOD_GLYPH[k]}<br>${MOOD_KO[k]}<div class="embar" style="background:${MOOD_COLOR[k]};opacity:${.25+v/130};width:${10+v*.9}%"></div>${v}</div>`;
    }
    body+='</div>';
    const dm=dominantMood(c.mood);
    body+=`<div style="margin:3px 0 6px">지금 이 땅은 <b style="color:${dm?MOOD_COLOR[dm]:'#888'}">${dm?MOOD_KO[dm]:'평온'}</b>합니다.</div>`;
  }
  body+=`<div class="k" style="margin-top:5px">이 땅의 역사</div>`;
  body+=`<div class="mem">${c.hist.map(escapeHtml).join(' → ')}</div>`;
  fmla.textContent=`=SOUL(${ref(i)}, ${f?`소속="${f.name}", 감정="${MOOD_KO[dominantMood(c.mood)]||'평온'}"`:'무주지'})`;
  card.innerHTML=`<div class="ch">${ref(i)} <span class="cls" data-cls="1">✕</span></div><div class="cb">${body}</div>`;
  card.style.display='block';
}

function renderFacCard(fid){
  const f=facById(fid);
  if (!f){ card.style.display='none'; selectedFac=-1; return; }
  const L=f.leader;
  function pbar(label,v,col){ return `<div><span class="k">${label}</span> <span class="bar" style="width:${6+v*64}px;background:${col}"></span> ${(v*100|0)}</div>`; }
  let body='';
  body+=`<div><span style="color:${f.color};font-weight:700">${escapeHtml(f.name)}</span> · ${f.title} (${f.born}~ 현재)</div>`;
  body+=`<div><span class="k">영토</span> ${f.size}칸 · <span class="k">천명</span> 「${L.mandate}」${f.golden?' · ✦황금기':''}</div>`;
  body+=`<div style="margin:5px 0"><b>지도자 성품</b></div>`;
  body+=pbar('호전성',L.bellicose,'#e74c3c')+pbar('정의감',L.justice,'#2980b9')+pbar('탐욕',L.greed,'#b9770e')+pbar('자비',L.mercy,'#27ae60');
  body+=`<div style="margin:6px 0 2px"><b>민심</b> ${moodSummary(f)} (항명지수 ${f.dissent|0})</div>`;
  body+=`<div style="margin:6px 0 2px"><b>법전 (法典)</b></div>`;
  const lk=Object.keys(f.laws);
  if (!lk.length) body+=`<div class="muted">아직 성문법이 없습니다. 규범이 형성 중…</div>`;
  for (const k of lk){
    const law=f.laws[k], d=LAW_DEFS[k], total=law.violations+law.obeyed;
    const vr=total?(law.violations/total*100|0):0;
    body+=`<div class="lawline"><span class="tag" style="background:${d.color}">${d.glyph}</span> ${d.name} <span class="k">(${law.enacted}년~)</span></div>`;
    body+=`<div class="mem">${d.desc}<br>위반 ${law.violations} / 준수 ${law.obeyed} · 위반율 ${vr}% · 집행력 ${(law.enforcement*100|0)}%</div>`;
  }
  // 형성 중인 규범(압력 상위)
  const pend=LAW_KEYS.filter(k=>!f.laws[k]).map(k=>({k,p:f.pressure[k]||0})).filter(o=>o.p>8).sort((a,b)=>b.p-a.p).slice(0,3);
  if (pend.length){
    body+=`<div style="margin:6px 0 2px"><b>형성 중인 규범</b></div>`;
    for (const o of pend){ const d=LAW_DEFS[o.k]; body+=`<div class="lawline">${d.glyph} ${d.name} <span class="bar" style="width:${o.p/LAW_THRESH*70|0}px;background:#999"></span> ${o.p/LAW_THRESH*100|0}%</div>`; }
  }
  if (f.allies.size){ body+=`<div style="margin-top:6px"><span class="k">동맹</span> ${[...f.allies].map(id=>{const a=facById(id);return a?escapeHtml(a.name):'';}).filter(Boolean).join(', ')||'-'}</div>`; }
  fmla.textContent=`=CODEX("${f.name}", 법=${lk.length}, 천명="${L.mandate}", 항명=${f.dissent|0})`;
  card.innerHTML=`<div class="ch">${escapeHtml(f.name)} <span class="cls" data-cls="1">✕</span></div><div class="cb">${body}</div>`;
  card.style.display='block';
}

  }
  h+='</table>';
  if (!any) h+='<p class="muted">아직 어떤 세력도 성문법을 갖지 못했습니다. 사건이 쌓이길 기다리는 중…</p>';
  // 형성 중 규범

  h+='<table class="x"><tr><th>세력</th><th>규범</th><th>압력</th></tr>';

         `<td>${o.p/LAW_THRESH*100|0}% <span class="bar" style="width:${o.p/LAW_THRESH*100|0}px;background:#888"></span></td></tr>`; }
  }
  h+='</table>'; if(!pendAny) h=h.replace(/<h2 style="margin-top:16px">형성 중인 규범[\s\S]*$/,'');
  panels.law.innerHTML=h;
}

function updateChronTab(){
  if (curTab!=='chron') return;
  const KIND={birth:['#107c41','탄생'],war:['#c0392b','전쟁'],crime:['#b9770e','범죄'],law:['#7c3aed','법'],rebel:['#000','반란'],death:['#555','멸망'],diplo:['#2980b9','외교'],event:['#888','사건']};
  let h='<h2>연대기 (年代記)</h2><p class="sub">매 실행마다 다르게 창발하는 역사. 최근 사건이 위에 옵니다.</p>';
  h+='<table class="x"><tr><th style="width:64px">서기</th><th style="width:60px">분류</th><th>사건</th><th>수식</th></tr>';
  for (const e of chronicle.slice(-160).reverse()){
    const ki=KIND[e.kind]||KIND.event;
    h+=`<tr><td>${e.year}년</td><td><span class="tag" style="background:${ki[0]}">${ki[1]}</span></td>`+
       `<td>${escapeHtml(e.msg)}</td><td class="lawline muted">${escapeHtml(e.formula)}</td></tr>`;
  }
  h+='</table>';
  panels.chron.innerHTML=h;
}

function updateDeadTab(){
  if (curTab!=='dead') return;
  let h='<h2>멸망기록 (亡記) — 사라진 문명과 잊혀진 법</h2><p class="sub">멸망한 세력과, 폐기되거나 사문화된 법들의 기록.</p>';
  h+='<h2 style="font-size:12px;margin-top:8px">멸망한 세력</h2>';
  h+='<table class="x"><tr><th>세력</th><th>존속</th><th>멸망</th><th>남긴 법</th></tr>';
  if (!obituaries.length) h+='<tr><td colspan="4" class="muted">아직 멸망한 세력이 없습니다.</td></tr>';
  for (const o of [...obituaries].reverse()){
    h+=`<tr><td><span class="tag" style="background:${o.color}">&nbsp;</span> ${escapeHtml(o.name)}</td><td>${o.born}~${o.year}년 (${o.year-o.born}년)</td><td>${o.year}년</td><td>${o.laws.length?o.laws.map(escapeHtml).join(', '):'<span class="muted">-</span>'}</td></tr>`;
  }
  h+='</table>';
  h+='<h2 style="font-size:12px;margin-top:14px">폐기된 법</h2>';
  h+='<table class="x"><tr><th>세력</th><th>법명</th><th>사유</th><th>연도</th></tr>';
  if (!deadLaws.length) h+='<tr><td colspan="4" class="muted">아직 폐기된 법이 없습니다.</td></tr>';
  for (const d of [...deadLaws].reverse().slice(0,80)){
    h+=`<tr class="repealed"><td><span class="tag" style="background:${d.color}">&nbsp;</span> ${escapeHtml(d.fac)}</td><td>${escapeHtml(d.law)}</td><td>${escapeHtml(d.reason)}</td><td>${d.year}년</td></tr>`;
  }
  h+='</table>';
  panels.dead.innerHTML=h;
}

/* ---------- 컨트롤 (정지/속도/감정토글) ---------- */
let timer=null, speed=1, paused=false;
const SPEEDS=[1,2,4], BASE=120;
function restartTimer(){ if(timer)clearInterval(timer); if(!paused) timer=setInterval(tick, BASE/speed); }
document.getElementById('b-pause').addEventListener('click', function(){
  paused=!paused; this.textContent=paused?'▶ 재개':'⏸ 정지'; this.classList.toggle('on',paused); restartTimer();
});
document.getElementById('b-speed').addEventListener('click', function(){
  const idx=(SPEEDS.indexOf(speed)+1)%SPEEDS.length; speed=SPEEDS[idx]; this.textContent='속도 '+speed+'×'; restartTimer();
});
document.getElementById('b-emo').addEventListener('click', function(){
  showEmo=!showEmo; this.classList.toggle('on',showEmo);
  for (let i=0;i<N;i++) paint(i);
});

/* ---------- 초기화 ---------- */
function init(){
  ({cols:COLS, rows:ROWS}=dims()); N=COLS*ROWS;
  buildGrid(); genTerrainBase(); genCells();
  factions=[]; nextFid=0; nameOrder=[]; obituaries.length=0; deadLaws.length=0; chronicle.length=0;
  plague=new Map(); fires=new Map(); dirty.clear(); year=1; tickN=0; selected=-1; selectedFac=-1;
  for (let i=0;i<N;i++) paint(i);
  fmla.textContent=`=SIM.CIVILIZATION($A$1:$${colName(COLS-1)}$${ROWS}, 법은_명령이_아니라_창발한다)`;
  // 맵 밀도에 비례한 초기 세력 수 — 충돌이 자주 일어나야 규범·법이 창발한다
  const landCount=cells.filter(c=>c.st!=='water').length;
  const initFac=clamp(Math.round(landCount/55), 3, 6);
  for (let k=0;k<initFac;k++) spawnFaction(true);
  updateLegend();
  restartTimer();
}
init();

// 리사이즈 시 그리드 재구성(시뮬은 새 역사로 재시작 — 셀 수가 바뀌므로)
let rt=null;
window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>{
  const d=dims(); if (d.cols!==COLS||d.rows!==ROWS){ init(); }
}, 350); });
})();
</script>
