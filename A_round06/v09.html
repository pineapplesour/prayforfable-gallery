<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MERCURY · liquid chrome</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#05060a; }
  body {
    font-family: "Helvetica Neue", Inter, system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    cursor: crosshair;
  }
  #gl { display:block; position:fixed; inset:0; width:100%; height:100%; }

  /* ---- overlay typography ---- */
  .ui { position:fixed; inset:0; pointer-events:none; z-index:5;
        mix-blend-mode: difference; color:#fff; }
  .corner { position:absolute; font-size:11px; letter-spacing:.32em;
            text-transform:uppercase; opacity:.85; }
  .tl { top:26px; left:30px; }
  .tr { top:26px; right:30px; text-align:right; }
  .bl { bottom:26px; left:30px; }
  .br { bottom:26px; right:30px; text-align:right; }
  .corner small { display:block; letter-spacing:.18em; opacity:.55;
                  font-size:9.5px; margin-top:5px; }

  .title { position:fixed; left:30px; bottom:64px; z-index:5;
           pointer-events:none; mix-blend-mode:difference; color:#fff; }
  .title h1 { font-size: clamp(40px, 11vw, 132px); line-height:.86;
              font-weight:800; letter-spacing:-.03em; }
  .title h1 span { display:block; }
  .title .ital { font-style:italic; font-weight:300; opacity:.9;
                 letter-spacing:0; }

  .hint { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
          z-index:5; pointer-events:none; mix-blend-mode:difference;
          color:#fff; font-size:10.5px; letter-spacing:.34em;
          text-transform:uppercase; opacity:.0; animation:fade 1.1s ease 1s forwards; }
  @keyframes fade { to { opacity:.7; } }

  /* film grain + vignette over canvas */
  .vig { position:fixed; inset:0; z-index:3; pointer-events:none;
         background: radial-gradient(120% 120% at 50% 40%,
                     transparent 52%, rgba(0,0,0,.55) 100%); }

  @media (max-width:480px){
    .tr,.bl { display:none; }
    .tl { top:18px; left:18px; }
    .br { bottom:18px; right:18px; }
    .title { left:18px; bottom:54px; }
    .corner { font-size:10px; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="vig"></div>

<div class="ui">
  <div class="corner tl">MERCURY<small>liquid&nbsp;chrome&nbsp;/&nbsp;raymarched</small></div>
  <div class="corner tr">∞ no.09<small>generative study</small></div>
  <div class="corner bl">drag · scroll · hold<small>tension &nbsp;/&nbsp; viscosity</small></div>
  <div class="corner br" id="fps">— fps<small>realtime sdf</small></div>
</div>

<div class="title">
  <h1><span>LIQUID</span><span class="ital">metal</span></h1>
</div>
<div class="hint">move to disturb the surface</div>

<script id="vert" type="x-shader">#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }
</script>

<script id="frag" type="x-shader">#version 300 es
precision highp float;
out vec4 O;

uniform vec2  uRes;
uniform float uT;
uniform vec2  uMouse;     // -aspect..aspect , -1..1   (smoothed)
uniform float uDown;      // 0..1 held
uniform float uViscose;   // scroll driven 0..1 (cohesion)
uniform float uHue;       // scroll driven tint phase
uniform float uEnergy;    // pointer speed energy 0..1
uniform float uAspect;    // width/height ; <1 = portrait

#define PI 3.14159265359
#define MAXBALLS 9

// ---------- hash / noise ----------
float h11(float n){ return fract(sin(n)*43758.5453123); }
vec3  h33(vec3 p){
  p = fract(p*vec3(.1031,.1030,.0973));
  p += dot(p, p.yxz+33.33);
  return fract((p.xxy+p.yxx)*p.zyx);
}

// smooth min (polynomial) keeps the metaball "melt"
float smin(float a, float b, float k){
  float h = clamp(.5+.5*(b-a)/k, 0., 1.);
  return mix(b,a,h) - k*h*(1.-h);
}

// per-ball animated centers
vec4 ball(int i){
  float fi = float(i);
  float s  = h11(fi*12.9898)*.5;          // base radius seed
  float sp = .25 + h11(fi*7.31)*.55;      // speed
  float ph = fi*1.7;
  float t  = uT*sp;
  // portrait fit: squeeze horizontal drift, stretch vertical so the
  // pool always fills a tall screen (no empty frames on mobile).
  float port = clamp(1.0/uAspect, 1.0, 2.2);
  float sx = mix(1.15, 0.62, clamp(port-1.0,0.,1.));
  float sy = mix(0.90, 1.35, clamp(port-1.0,0.,1.));
  // lazy drifting orbits in 3D
  vec3 c = vec3(
    (sin(t*.9 + ph)*1.15 + cos(t*.37+fi)*.45) * (sx/1.15),
    (cos(t*.8 + ph*1.3)*0.9 + sin(t*.5)*.3) * (sy/0.90),
    sin(t*.6 + ph*.7)*1.0
  );
  float r = .28 + s*.42;
  return vec4(c, r);
}

// scene SDF: melting metaballs + a heavy mouse-driven blob
// returns distance; sets material id-ish via out
float map(vec3 q){
  float k = mix(.30, .95, uViscose);      // viscosity -> blend softness
  float d = 1e9;

  // ambient drifting balls
  for(int i=0;i<MAXBALLS;i++){
    vec4 b = ball(i);
    float ds = length(q - b.xyz) - b.w;
    d = smin(d, ds, k);
  }

  // the cursor blob — bigger, reactive, "alive"
  vec3 mp = vec3(uMouse * 1.55, 0.0);
  float pulse = .42 + .12*sin(uT*2.2) + uDown*.30 + uEnergy*.18;
  float dm = length(q - mp) - pulse;
  d = smin(d, dm, k*1.25 + uDown*.4);

  // gentle floor wobble so the pool feels endless
  return d;
}

vec3 calcNorm(vec3 p){
  vec2 e = vec2(.0012, 0.);
  return normalize(vec3(
    map(p+e.xyy)-map(p-e.xyy),
    map(p+e.yxy)-map(p-e.yxy),
    map(p+e.yyx)-map(p-e.yyx)
  ));
}

// procedural studio environment that the chrome reflects.
// pure gradient + soft light cards => clean liquid-metal look.
vec3 envColor(vec3 rd){
  float y = rd.y;
  // base vertical gradient (cool studio)
  vec3 top = vec3(.62,.70,.86);
  vec3 hor = vec3(.10,.12,.18);
  vec3 bot = vec3(.02,.02,.04);
  vec3 col = (y>0.) ? mix(hor, top, pow(clamp(y,0.,1.),.7))
                    : mix(hor, bot, pow(clamp(-y,0.,1.),.6));

  // tint shift driven by scroll hue phase (chromatic mood)
  vec3 tintA = vec3(.9,.55,.35);   // warm copper
  vec3 tintB = vec3(.35,.55,.95);  // cobalt
  vec3 tint  = mix(tintA, tintB, .5+.5*sin(uHue));
  col = mix(col, col*tint*1.6, .35);

  // big soft key light
  float key = pow(max(dot(rd, normalize(vec3(.45,.75,.5))),0.), 18.);
  col += vec3(1.0) * key * 1.4;
  // rim fill
  float fill = pow(max(dot(rd, normalize(vec3(-.6,.2,-.5))),0.), 6.);
  col += vec3(.4,.5,.7) * fill * .6;
  // faint procedural "softbox" bands -> streaky chrome highlights
  float bands = smoothstep(.0,.04, abs(sin(rd.x*6.0+rd.z*2.0)) ) ;
  col += (1.-bands)*vec3(.9,.95,1.)*.12;
  return col;
}

void main(){
  vec2 uv = (gl_FragCoord.xy*2.0 - uRes.xy)/uRes.y;

  // camera — slow breathing dolly. pull back on tall screens.
  float port = clamp(1.0/uAspect, 1.0, 2.2);
  float dolly = 3.7 + (port-1.0)*1.3;
  float ct = uT*.05;
  vec3 ro = vec3(sin(ct)*.5, .25 + .1*sin(uT*.2), dolly + cos(ct)*.3);
  vec3 ta = vec3(0., 0., 0.);
  vec3 fw = normalize(ta-ro);
  vec3 rt = normalize(cross(vec3(0,1,0), fw));
  vec3 up = cross(fw, rt);
  vec3 rd = normalize(uv.x*rt + uv.y*up + 1.5*fw);

  // raymarch
  float t = 0.0;
  float dist = 1e9;
  bool hit=false;
  for(int i=0;i<90;i++){
    vec3 pos = ro + rd*t;
    dist = map(pos);
    if(dist < .0015){ hit=true; break; }
    if(t > 12.0) break;
    t += dist*.85;     // slight under-relax for stability
  }

  vec3 col;
  if(hit){
    vec3 pos = ro + rd*t;
    vec3 n   = calcNorm(pos);
    vec3 v   = -rd;

    // fresnel — metal edges glow
    float fres = pow(1.0 - max(dot(n,v),0.), 4.0);

    // reflection of environment
    vec3 refl = reflect(rd, n);
    vec3 rcol = envColor(refl);

    // a touch of refraction for that "liquid glass + metal" hybrid
    vec3 refr = refract(rd, n, .86);
    vec3 fcol = envColor(refr) * vec3(.7,.8,1.0);

    // chrome base: mostly reflection, fresnel-boosted, slight refract bleed
    vec3 chrome = mix(fcol, rcol, .82);
    chrome = mix(chrome, rcol*1.3, fres);

    // anisotropic-ish spec streak
    vec3 L = normalize(vec3(.45,.8,.5));
    float spec = pow(max(dot(refl,L),0.), 90.0);
    chrome += vec3(1.0)*spec*1.6;

    // subtle iridescent edge (thin-film vibe) tied to hue
    float iri = fres;
    vec3 irid = .5+.5*cos(vec3(0,2.1,4.2)+ iri*7.0 + uHue);
    chrome = mix(chrome, chrome*irid, fres*.45);

    // ambient occlusion fake from march steps proximity
    float ao = clamp(t*.18,0.,1.);
    chrome *= mix(.55,1.0,ao);

    // contact darkening near core
    chrome *= 1.0 - smoothstep(2.0,5.0,t)*.25;

    col = chrome;
  } else {
    // background = the same environment (so chrome dissolves into its world)
    col = envColor(rd) * .9;
    // deepen toward black for contrast
    col *= mix(.35,1.0, smoothstep(-.9,.6, rd.y));
  }

  // ---- post ----
  // energy bloom-ish lift
  col += col*col*uEnergy*.15;
  // gentle filmic tonemap
  col = (col*(2.51*col+.03))/(col*(2.43*col+.59)+.14);
  // vignette
  float vg = 1.0 - .35*dot(uv*0.62,uv*0.62);
  col *= vg;
  // grain
  vec3 g = h33(vec3(gl_FragCoord.xy, uT*60.0));
  col += (g.x-.5)*.025;
  // subtle saturation
  float lum = dot(col, vec3(.299,.587,.114));
  col = mix(vec3(lum), col, 1.12);

  O = vec4(clamp(col,0.,1.), 1.0);
}
</script>

<script>
(function(){
  const cv = document.getElementById('gl');
  const gl = cv.getContext('webgl2', {antialias:false, alpha:false,
              powerPreference:'high-performance', preserveDrawingBuffer:false});
  if(!gl){
    document.body.innerHTML =
      '<div style="color:#fff;font-family:sans-serif;padding:40px">WebGL2 not supported on this device.</div>';
    return;
  }

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src.trim());
    gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER,   document.getElementById('vert').textContent));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  // full-screen triangle
  const vb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

  const U = {
    res:    gl.getUniformLocation(prog,'uRes'),
    t:      gl.getUniformLocation(prog,'uT'),
    mouse:  gl.getUniformLocation(prog,'uMouse'),
    down:   gl.getUniformLocation(prog,'uDown'),
    visc:   gl.getUniformLocation(prog,'uViscose'),
    hue:    gl.getUniformLocation(prog,'uHue'),
    energy: gl.getUniformLocation(prog,'uEnergy'),
    aspect: gl.getUniformLocation(prog,'uAspect'),
  };

  // ---------- state ----------
  const isMobile = matchMedia('(max-width:480px)').matches;
  let DPR = Math.min(window.devicePixelRatio||1, isMobile?2:1.75);
  let W=0,H=0, aspect=1;

  // target & smoothed pointer
  let tx=0, ty=0;            // target in clip-ish space
  let mx=0, my=0;            // smoothed
  let pmx=0, pmy=0;
  let down=0, downT=0;
  let viscose=0.4, visTarget=0.4;
  let huePhase=0;
  let energy=0;

  function resize(){
    W = Math.floor(innerWidth*DPR);
    H = Math.floor(innerHeight*DPR);
    cv.width=W; cv.height=H;
    cv.style.width=innerWidth+'px';
    cv.style.height=innerHeight+'px';
    aspect = innerWidth/innerHeight;
    gl.viewport(0,0,W,H);
  }
  addEventListener('resize', resize);
  resize();

  function setPointer(cx, cy){
    // normalized -aspect..aspect (x), -1..1 (y, up positive)
    tx = (cx/innerWidth*2 - 1) * aspect;
    ty = -(cy/innerHeight*2 - 1);
  }
  addEventListener('pointermove', e=>{ setPointer(e.clientX, e.clientY); }, {passive:true});
  addEventListener('pointerdown', e=>{ down=1; setPointer(e.clientX,e.clientY); }, {passive:true});
  addEventListener('pointerup',   ()=>{ down=0; }, {passive:true});
  addEventListener('pointercancel',()=>{ down=0; }, {passive:true});

  // scroll / wheel -> viscosity + hue mood
  addEventListener('wheel', e=>{
    visTarget = Math.min(1, Math.max(0, visTarget + (e.deltaY>0? .07 : -.07)));
    huePhase += (e.deltaY>0? .18 : -.18);
  }, {passive:true});
  // touch vertical drag as a secondary scroll-feel for hue
  let lastTouchY=null;
  addEventListener('touchmove', e=>{
    if(e.touches.length){
      const y=e.touches[0].clientY;
      if(lastTouchY!==null){ huePhase += (y-lastTouchY)*.004; }
      lastTouchY=y;
    }
  }, {passive:true});
  addEventListener('touchend', ()=>{ lastTouchY=null; }, {passive:true});

  // fps readout
  const fpsEl = document.getElementById('fps');
  let fAcc=0, fCnt=0, fLast=performance.now();

  const t0 = performance.now();
  function frame(now){
    const dt = Math.min((now - (frame.last||now))/1000, .05);
    frame.last = now;
    const T = (now - t0)/1000;

    // smoothing — buttery follow
    const ease = 1 - Math.pow(0.0008, dt);  // frame-rate independent
    mx += (tx-mx)*ease;
    my += (ty-my)*ease;

    // pointer energy
    const dx=mx-pmx, dy=my-pmy;
    const sp = Math.sqrt(dx*dx+dy*dy)/Math.max(dt,1e-3);
    energy += (Math.min(sp*.20,1) - energy)*0.08;
    pmx=mx; pmy=my;

    // hold ramp
    downT += ((down?1:0) - downT)*0.12;

    // viscosity ease
    viscose += (visTarget-viscose)*0.06;
    huePhase += dt*0.05; // slow auto drift

    gl.uniform2f(U.res, W, H);
    gl.uniform1f(U.t, T);
    gl.uniform2f(U.mouse, mx, my);
    gl.uniform1f(U.down, downT);
    gl.uniform1f(U.visc, viscose);
    gl.uniform1f(U.hue, huePhase);
    gl.uniform1f(U.energy, energy);
    gl.uniform1f(U.aspect, innerWidth/innerHeight);

    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // fps
    fAcc += dt; fCnt++;
    if(now - fLast > 500){
      const fps = fCnt/ (fAcc||1);
      fpsEl.firstChild.nodeValue = Math.round(fps)+' fps';
      // adaptive DPR if struggling
      if(fps<32 && DPR>1.0){ DPR = Math.max(1.0, DPR-0.25); resize(); }
      fAcc=0; fCnt=0; fLast=now;
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
