<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CHROMA BLOOM — spectral organism</title>
<style>
  :root{ --ink:#e9ecf4; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:#04060c; overflow:hidden; }
  body{
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
    cursor: crosshair;
    touch-action: none;
  }
  #stage{ position:fixed; inset:0; display:block; }
  /* HUD ----------------------------------------------------------------- */
  .hud{ position:fixed; pointer-events:none; user-select:none; z-index:5;
    text-transform:uppercase; letter-spacing:.22em; }
  #title{ left:clamp(16px,3.2vw,40px); top:clamp(16px,3vh,34px);
    font-size:clamp(11px,1.15vw,15px); font-weight:600; line-height:1.7;
    text-shadow:0 0 18px rgba(120,180,255,.35); }
  #title b{ font-weight:700; letter-spacing:.34em; display:block;
    font-size:clamp(15px,1.7vw,22px); }
  #title span{ opacity:.5; letter-spacing:.3em; font-size:.78em; }
  #readout{ right:clamp(16px,3.2vw,40px); top:clamp(16px,3vh,34px);
    text-align:right; font-size:clamp(9px,.8vw,11px); line-height:1.85;
    opacity:.62; letter-spacing:.18em; }
  #readout em{ font-style:normal; color:#7fd6ff; }
  #hint{ left:50%; bottom:clamp(14px,3vh,30px); transform:translateX(-50%);
    text-align:center; font-size:clamp(9px,.85vw,11px); opacity:.0;
    letter-spacing:.26em; transition:opacity 1.1s ease;
    text-shadow:0 0 14px rgba(0,0,0,.8); white-space:nowrap; }
  #hint.show{ opacity:.55; }
  #hint kbd{ font:inherit; padding:1px 6px; border:1px solid rgba(255,255,255,.25);
    border-radius:5px; opacity:.9; }
  /* tap-to-mic pill (no entry gate — purely optional upgrade) */
  #mic{ pointer-events:auto; position:fixed; z-index:6; right:clamp(16px,3.2vw,40px);
    bottom:clamp(14px,3vh,30px); font:inherit; font-size:clamp(9px,.85vw,11px);
    letter-spacing:.2em; text-transform:uppercase; color:var(--ink);
    background:rgba(14,20,38,.4); border:1px solid rgba(140,180,255,.28);
    border-radius:999px; padding:9px 16px; cursor:pointer; backdrop-filter:blur(8px);
    transition:.35s ease; }
  #mic:hover{ border-color:rgba(140,180,255,.7); background:rgba(20,30,60,.6);
    box-shadow:0 0 26px rgba(80,140,255,.3); }
  #mic.live{ color:#0a0f1c; background:#7fe0c8; border-color:#7fe0c8;
    box-shadow:0 0 30px rgba(120,255,210,.5); }
  #mic .dot{ display:inline-block; width:7px; height:7px; border-radius:50%;
    background:#ff5d7a; margin-right:8px; vertical-align:middle;
    box-shadow:0 0 10px #ff5d7a; }
  #mic.live .dot{ background:#0a0f1c; box-shadow:none; animation:pulse 1.1s infinite; }
  @keyframes pulse{ 50%{ opacity:.25; } }
  .grain{ position:fixed; inset:0; pointer-events:none; z-index:4; opacity:.05;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
  #vign{ position:fixed; inset:0; pointer-events:none; z-index:3;
    background:radial-gradient(120% 120% at 50% 50%, transparent 52%, rgba(0,0,0,.78) 100%); }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="vign"></div>
  <div class="grain"></div>

  <div class="hud" id="title"><b>CHROMA&nbsp;BLOOM</b><span>spectral&nbsp;organism&nbsp;·&nbsp;fft&nbsp;reactive</span></div>
  <div class="hud" id="readout">
    band&nbsp;<em id="r-band">—</em><br>
    energy&nbsp;<em id="r-energy">—</em><br>
    beat&nbsp;<em id="r-beat">—</em><br>
    src&nbsp;<em id="r-src">synthetic</em>
  </div>
  <div class="hud" id="hint">move <kbd>mouse</kbd> to bend the field · <kbd>scroll</kbd> to shift octave · <kbd>click</kbd> to pulse</div>
  <button id="mic"><span class="dot"></span>tap&nbsp;for&nbsp;mic</button>

<script>
"use strict";
(()=>{
/* ====================================================================== *
 *  CHROMA BLOOM
 *  A spectral organism. From the very first frame it is alive: a small
 *  synthetic ambient engine (4 detuned oscillators + slow LFO swells)
 *  feeds a real WebAudio AnalyserNode, so the geometry below is GENUINELY
 *  FFT-driven — not faked. No entry gate, no loader. The optional mic
 *  button swaps the analyser source to live input on user gesture.
 * ====================================================================== */

  const cv = document.getElementById('stage');
  const ctx = cv.getContext('2d', { alpha:false });
  let W=0,H=0,CX=0,CY=0,DPR=1,MIN=0;

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    CX=W/2; CY=H/2; MIN=Math.min(W,H);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ------------------------------------------------------------------ *
   *  AUDIO ENGINE — always-on synthetic ambience -> AnalyserNode
   * ------------------------------------------------------------------ */
  const AC = window.AudioContext || window.webkitAudioContext;
  let actx=null, analyser=null, freq=null, time=null;
  let synthGain=null, micStream=null, micSrc=null, synthNodes=[];
  let srcMode='synthetic';
  let audioReady=false;

  function buildSynth(){
    // master -> analyser -> destination(silent-ish so it's ambient, not loud)
    synthGain = actx.createGain();
    synthGain.gain.value = 0.0; // we keep it ~inaudible; analyser still reads it
    const out = actx.createGain(); out.gain.value = 0.0001;
    synthGain.connect(analyser);
    synthGain.connect(out); out.connect(actx.destination);

    // a slow, drifting chord — gives rich, evolving spectra for the visuals
    const base = [55, 82.4, 110, 164.8, 220, 329.6];
    base.forEach((f,i)=>{
      const o = actx.createOscillator();
      o.type = i%2 ? 'sine' : 'triangle';
      o.frequency.value = f;
      const g = actx.createGain(); g.gain.value = 0.0;
      // independent slow LFO swelling each partial in/out
      const lfo = actx.createOscillator(); lfo.type='sine';
      lfo.frequency.value = 0.04 + i*0.017;
      const lg = actx.createGain(); lg.gain.value = 0.14;
      lfo.connect(lg); lg.connect(g.gain);
      // gentle detune wobble for shimmer
      const det = actx.createOscillator(); det.type='sine';
      det.frequency.value = 0.07 + i*0.03;
      const dg = actx.createGain(); dg.gain.value = 4+i;
      det.connect(dg); dg.connect(o.detune);
      o.connect(g); g.connect(synthGain);
      o.start(); lfo.start(); det.start();
      synthNodes.push(o,lfo,det);
    });
    // a soft noise breath for high-band texture
    const nb = actx.createBufferSource();
    const buf = actx.createBuffer(1, actx.sampleRate*2, actx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.5;
    nb.buffer=buf; nb.loop=true;
    const nf = actx.createBiquadFilter(); nf.type='bandpass';
    nf.frequency.value=3200; nf.Q.value=0.6;
    const ng = actx.createGain(); ng.gain.value=0.0;
    const nlfo = actx.createOscillator(); nlfo.frequency.value=0.05;
    const nlg = actx.createGain(); nlg.gain.value=0.12;
    nlfo.connect(nlg); nlg.connect(ng.gain);
    nb.connect(nf); nf.connect(ng); ng.connect(synthGain);
    nb.start(); nlfo.start();
    synthNodes.push(nb,nlfo);
    // bring synth audible to the *analyser* path
    synthGain.gain.linearRampToValueAtTime(1.0, actx.currentTime+1.2);
  }

  function ensureAudio(){
    if(actx) return;
    try{
      actx = new AC();
      analyser = actx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.78;
      analyser.minDecibels = -92; analyser.maxDecibels = -18;
      freq = new Uint8Array(analyser.frequencyBinCount);
      time = new Uint8Array(analyser.fftSize);
      buildSynth();
      audioReady=true;
    }catch(e){ /* fall back to procedural drive */ audioReady=false; }
  }

  // Some browsers allow AudioContext at load; if suspended we lazily resume
  // on the first interaction — but the *visuals never wait* for it.
  function tryResume(){ if(actx && actx.state==='suspended') actx.resume(); }

  async function toggleMic(){
    ensureAudio(); tryResume();
    const btn = document.getElementById('mic');
    if(srcMode==='mic'){
      if(micSrc) micSrc.disconnect();
      if(micStream) micStream.getTracks().forEach(t=>t.stop());
      micSrc=null; micStream=null;
      synthGain.connect(analyser);
      srcMode='synthetic';
      btn.classList.remove('live'); btn.querySelector('.dot').after();
      btn.childNodes[1].nodeValue=' tap for mic';
      document.getElementById('r-src').textContent='synthetic';
      return;
    }
    try{
      micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      micSrc = actx.createMediaStreamSource(micStream);
      try{ synthGain.disconnect(analyser);}catch(_){}
      micSrc.connect(analyser);
      srcMode='mic';
      btn.classList.add('live');
      btn.childNodes[1].nodeValue=' mic live';
      document.getElementById('r-src').textContent='microphone';
    }catch(e){
      btn.childNodes[1].nodeValue=' mic denied';
      setTimeout(()=>{btn.childNodes[1].nodeValue=' tap for mic';},1600);
    }
  }
  document.getElementById('mic').addEventListener('click', toggleMic);

  /* ------------------------------------------------------------------ *
   *  SPECTRUM SAMPLING (+ procedural fallback so it's NEVER static)
   * ------------------------------------------------------------------ */
  const NB = 96;                       // number of spectral wedges
  const bands = new Float32Array(NB);  // smoothed per-band magnitude 0..1
  const peak  = new Float32Array(NB);  // decaying peaks
  // SEED the spectrum so the *first painted frame* is already a full bloom
  // (no zero->grow ramp; first paint == finished artwork).
  for(let i=0;i<NB;i++){
    const p=i/NB;
    const v = 0.42 + 0.30*Math.abs(Math.sin(p*6.0)) + 0.18*Math.abs(Math.sin(p*17.0))*(1-p*0.5);
    bands[i]=Math.min(1,v); peak[i]=Math.min(1,v*1.05);
  }
  let energy=0, bass=0, treble=0, flux=0, prevEnergy=0;
  let beat=0, beatCool=0, beatEnv=0;

  function sampleSpectrum(t){
    let bins, raw=false;
    if(audioReady && analyser){
      analyser.getByteFrequencyData(freq);
      bins = freq; raw=true;
    }
    let e=0, b=0, tr=0;
    const n = NB;
    for(let i=0;i<n;i++){
      // log-ish mapping toward low end (more wedges to bass)
      const f0 = Math.pow(i/n, 1.7);
      const f1 = Math.pow((i+1)/n, 1.7);
      let v;
      if(raw){
        const lo = Math.floor(f0*(freq.length-1));
        const hi = Math.max(lo+1, Math.floor(f1*(freq.length-1)));
        let m=0; for(let k=lo;k<hi;k++) m=Math.max(m,bins[k]);
        v = m/255;
      }else{
        // procedural drive — layered sines so fallback still feels musical
        const p = i/n;
        v = 0.30
          + 0.30*Math.abs(Math.sin(t*0.0009 + p*7.0))*(1-p*0.6)
          + 0.20*Math.abs(Math.sin(t*0.0021 + p*15.0 + Math.cos(t*0.0006)))
          + 0.16*Math.abs(Math.sin(t*0.0040 + p*31.0))*p;
        v *= 0.7;
      }
      v = Math.min(1, v);
      // smoothing w/ asymmetric attack/release for snappy hits, soft fall
      const cur = bands[i];
      bands[i] = v>cur ? cur + (v-cur)*0.55 : cur + (v-cur)*0.12;
      // peaks
      peak[i] = Math.max(bands[i], peak[i]-0.010);
      e += bands[i];
      if(i < n*0.18) b += bands[i];
      if(i > n*0.55) tr += bands[i];
    }
    energy = e/n;
    bass   = b/(n*0.18);
    treble = tr/(n*0.45);
    flux   = Math.max(0, energy - prevEnergy);
    prevEnergy = prevEnergy + (energy-prevEnergy)*0.5;
    // beat detection on bass flux
    beatCool = Math.max(0, beatCool-1);
    const bassFlux = bass*1.0;
    if(beatCool===0 && bassFlux > 0.42 && flux > 0.006){
      beat=1; beatEnv=1; beatCool=11;
    } else beat=0;
    beatEnv *= 0.90;
  }

  /* ------------------------------------------------------------------ *
   *  COLOR — evolving palette in HSL, hue swept by treble & time
   * ------------------------------------------------------------------ */
  let hueBase = 210;
  function palette(t){
    hueBase = (hueBase + 0.12 + treble*0.9) % 360;
  }
  function wedgeColor(i, mag, t){
    const p = i/NB;
    // full-wheel spectral sweep -> reads as a living rainbow mandala
    const h = (hueBase + p*300 + mag*40 + Math.sin(t*0.0004+i*0.2)*22) % 360;
    const s = 78 + mag*22;
    const l = 16 + mag*56;
    return `hsl(${((h%360)+360)%360} ${s.toFixed(0)}% ${l.toFixed(0)}%)`;
  }

  /* ------------------------------------------------------------------ *
   *  POINTER / INTERACTION
   *   - mouse/touch position bends the field (a gravity well)
   *   - scroll shifts the "octave"/zoom of the spectral mandala
   *   - click / tap injects an expanding shock ring
   * ------------------------------------------------------------------ */
  const pointer = { x:CX, y:CY, tx:CX, ty:CY, down:false, active:false, str:0 };
  let octave = 1.0, octaveT = 1.0;
  let spin = 0, spinV = 0.0016;
  const rings = []; // shock rings {r,life,hue,str}

  function setPointer(x,y){ pointer.tx=x; pointer.ty=y; pointer.active=true; }
  cv.addEventListener('pointermove', e=>{ setPointer(e.clientX,e.clientY); }, {passive:true});
  cv.addEventListener('pointerdown', e=>{
    setPointer(e.clientX,e.clientY); pointer.down=true; tryResume();
    pushRing(e.clientX,e.clientY, 1.0);
  });
  window.addEventListener('pointerup', ()=>{ pointer.down=false; });
  cv.addEventListener('pointerleave', ()=>{ pointer.active=false; });
  window.addEventListener('wheel', e=>{
    octaveT = Math.min(2.6, Math.max(0.55, octaveT - e.deltaY*0.0011));
  }, {passive:true});
  // touch swipe -> octave shift (vertical), plus ripple per tap handled by pointerdown
  let lastTouchY=null;
  cv.addEventListener('touchmove', e=>{
    if(e.touches.length){
      const y=e.touches[0].clientY;
      if(lastTouchY!=null) octaveT = Math.min(2.6, Math.max(0.55, octaveT + (lastTouchY-y)*0.0016));
      lastTouchY=y;
    }
  }, {passive:true});
  cv.addEventListener('touchend', ()=>{ lastTouchY=null; }, {passive:true});

  function pushRing(x,y,str){
    rings.push({x,y,r:0,life:1,str,hue:hueBase});
    if(rings.length>14) rings.shift();
  }

  /* ------------------------------------------------------------------ *
   *  PARTICLE AURORA — particles ride the spectral field outward,
   *  hue from their angular band, speed from that band's energy.
   * ------------------------------------------------------------------ */
  const P = (typeof navigator!=='undefined' && /Mobi|Android/i.test(navigator.userAgent)) ? 220 : 420;
  const px=new Float32Array(P), py=new Float32Array(P),
        pa=new Float32Array(P), pr=new Float32Array(P),
        pv=new Float32Array(P), pl=new Float32Array(P);
  for(let i=0;i<P;i++){ respawn(i, Math.random()); }
  function respawn(i, life){
    pa[i]=Math.random()*Math.PI*2;
    pr[i]=Math.random()*0.10;
    pv[i]=0; pl[i]=life;
  }

  /* ------------------------------------------------------------------ *
   *  MAIN RENDER LOOP
   * ------------------------------------------------------------------ */
  let t0=performance.now(), frames=0, fpsT=t0, fps=60, slow=0;
  const rB=document.getElementById('r-band'), rE=document.getElementById('r-energy'),
        rBe=document.getElementById('r-beat');

  function frame(now){
    requestAnimationFrame(frame);
    const t = now;

    sampleSpectrum(t);
    palette(t);

    // ease pointer & octave
    pointer.x += (pointer.tx-pointer.x)*0.12;
    pointer.y += (pointer.ty-pointer.y)*0.12;
    pointer.str += ((pointer.active?1:0) - pointer.str)*0.06;
    octave += (octaveT-octave)*0.07;
    spinV = 0.0016 + bass*0.02 + (pointer.down?0.01:0);
    spin += spinV * (1 + beatEnv*1.4);

    // trail fade — additive feel by drawing translucent dark over previous
    ctx.globalCompositeOperation='source-over';
    const fade = 0.10 + beatEnv*0.05;
    ctx.fillStyle = `rgba(4,6,12,${fade})`;
    ctx.fillRect(0,0,W,H);

    // pointer gravity well params
    const pdx = pointer.x-CX, pdy=pointer.y-CY;
    const wellStr = pointer.str * (0.0009*MIN) * (1+beatEnv);

    const baseR = MIN*0.12*octave;
    const maxR  = MIN*0.56;

    ctx.globalCompositeOperation='lighter';

    /* ---- spectral wedges: gently-curved filament petals (2 mirrored
           passes per band -> bilateral symmetry, like a real bloom) ---- */
    ctx.lineCap='round';
    const curlBase = Math.sin(t*0.0003)*0.18 + bass*0.10;
    for(let i=0;i<NB;i++){
      const mag = bands[i];
      const pk  = peak[i];
      for(let s=0;s<2;s++){
        // band i drawn on both sides of the vertical axis for symmetry
        const frac = (i/NB)*Math.PI;            // 0..PI
        const ang  = spin + (s? -frac : frac);  // mirrored halves
        const inner = baseR + mag*MIN*0.015;
        const reach = pk*0.55 + mag*0.45;       // expansive, not spiky
        const outer = baseR + reach*(maxR-baseR) + mag*MIN*0.05;

        const ca=Math.cos(ang), sa=Math.sin(ang);
        const ix=CX+ca*inner, iy=CY+sa*inner;
        let ox=CX+ca*outer, oy=CY+sa*outer;
        // curved control point (perpendicular offset) gives a petal sweep
        const perp = ang + Math.PI/2;
        const curl = curlBase*(outer-inner)*(s?-1:1);
        let mx=CX+ca*(inner+outer)*0.5 + Math.cos(perp)*curl;
        let my=CY+sa*(inner+outer)*0.5 + Math.sin(perp)*curl;
        // pointer gravity-well bends the tip + midpoint
        if(wellStr>0){
          let ddx=pointer.x-ox, ddy=pointer.y-oy;
          let d2=ddx*ddx+ddy*ddy+1; let g=wellStr*MIN*MIN/d2;
          ox+=ddx*Math.min(0.45,g); oy+=ddy*Math.min(0.45,g);
          ddx=pointer.x-mx; ddy=pointer.y-my; d2=ddx*ddx+ddy*ddy+1; g=wellStr*MIN*MIN/d2;
          mx+=ddx*Math.min(0.3,g); my+=ddy*Math.min(0.3,g);
        }
        const col = wedgeColor(i, mag, t);
        ctx.strokeStyle = col;
        ctx.globalAlpha = 0.18 + mag*0.72;
        ctx.lineWidth = 1.1 + mag*8*Math.min(1.4,octave);
        ctx.beginPath(); ctx.moveTo(ix,iy); ctx.quadraticCurveTo(mx,my,ox,oy); ctx.stroke();
        // peak glow dot at tip
        if(pk>0.30){
          ctx.globalAlpha = (pk-0.30)*1.0;
          ctx.fillStyle = col;
          ctx.beginPath(); ctx.arc(ox,oy,1.2 + pk*4.5,0,6.283); ctx.fill();
        }
      }
    }

    /* ---- connective spectral web: smooth closed curve over the ring ---- */
    ctx.globalAlpha = 0.5 + energy*0.4;
    ctx.lineWidth = 1.1 + energy*2.0;
    ctx.strokeStyle = `hsl(${(hueBase+60)%360} 90% ${42+energy*30}%)`;
    ctx.beginPath();
    for(let i=0;i<=NB;i++){
      const ii=i%NB;
      const mag=bands[ii];
      const ang= spin + (ii/NB)*Math.PI*2;
      const r = baseR + mag*(maxR-baseR)*0.55 + Math.sin(t*0.001+ii*0.4)*MIN*0.004;
      let x=CX+Math.cos(ang)*r, y=CY+Math.sin(ang)*r;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.stroke();

    /* ---- core: pulsing nucleus reacting to bass ---- */
    const coreR = baseR*0.62 + bass*MIN*0.05 + beatEnv*MIN*0.04;
    const cg = ctx.createRadialGradient(CX,CY,0, CX,CY,coreR*2.6);
    cg.addColorStop(0, `hsla(${hueBase%360},95%,${62+bass*26}%,${0.42+bass*0.3})`);
    cg.addColorStop(0.35, `hsla(${(hueBase+50)%360},90%,55%,${0.16+bass*0.2})`);
    cg.addColorStop(0.7, `hsla(${(hueBase+120)%360},85%,50%,${0.06})`);
    cg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha=1; ctx.fillStyle=cg;
    ctx.beginPath(); ctx.arc(CX,CY,coreR*2.4,0,6.283); ctx.fill();
    // crisp inner disc — kept small so filament structure stays legible
    ctx.globalAlpha=0.85;
    ctx.fillStyle=`hsl(${hueBase%360} 100% ${74+bass*16}%)`;
    ctx.beginPath(); ctx.arc(CX,CY,coreR*0.20+beatEnv*7,0,6.283); ctx.fill();

    /* ---- particle aurora ---- */
    for(let i=0;i<P;i++){
      const bandIdx = ((pa[i]/(Math.PI*2))*NB | 0 + NB)%NB;
      const m = bands[(bandIdx%NB+NB)%NB];
      // accelerate outward by that band's energy + global flux
      pv[i] += (0.4 + m*2.6 + flux*40)*0.016;
      pr[i] += pv[i]*0.010*(0.6+octave*0.4);
      pv[i] *= 0.97;
      pa[i] += spinV*0.6 + (m-0.3)*0.004;
      pl[i] -= 0.006 + (1-m)*0.004;
      let rr = pr[i]*MIN;
      let x = CX+Math.cos(pa[i])*rr;
      let y = CY+Math.sin(pa[i])*rr;
      // pointer well also tugs particles
      if(wellStr>0){
        const ddx=pointer.x-x, ddy=pointer.y-y;
        const d2=ddx*ddx+ddy*ddy+40;
        const g=wellStr*MIN*MIN/d2;
        x+=ddx*Math.min(0.5,g); y+=ddy*Math.min(0.5,g);
      }
      if(pl[i]<=0 || rr>maxR*1.25){ respawn(i,1); continue; }
      const h=(hueBase + (pa[i]/(Math.PI*2))*180 + m*60)%360;
      ctx.globalAlpha = Math.min(0.9, pl[i]*(0.25+m*0.8));
      ctx.fillStyle=`hsl(${h} 95% ${55+m*25}%)`;
      const sz=0.6 + m*2.4 + beatEnv*1.5;
      ctx.beginPath(); ctx.arc(x,y,sz,0,6.283); ctx.fill();
    }

    /* ---- shock rings from clicks/taps ---- */
    for(let i=rings.length-1;i>=0;i--){
      const R=rings[i];
      R.r += (10 + R.str*6)*(1+energy);
      R.life -= 0.018;
      if(R.life<=0){ rings.splice(i,1); continue; }
      ctx.globalAlpha = R.life*0.5;
      ctx.lineWidth = 1.5 + R.life*3;
      ctx.strokeStyle = `hsl(${(R.hue+80)%360} 95% 65%)`;
      ctx.beginPath(); ctx.arc(R.x,R.y,R.r,0,6.283); ctx.stroke();
    }

    /* ---- pointer aura ---- */
    if(pointer.str>0.02){
      const pr2 = 30 + treble*120 + beatEnv*40;
      const pg = ctx.createRadialGradient(pointer.x,pointer.y,0, pointer.x,pointer.y,pr2);
      pg.addColorStop(0,`hsla(${(hueBase+120)%360},95%,70%,${0.30*pointer.str})`);
      pg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=1; ctx.fillStyle=pg;
      ctx.beginPath(); ctx.arc(pointer.x,pointer.y,pr2,0,6.283); ctx.fill();
    }

    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';

    /* ---- HUD readouts (throttled) ---- */
    if((frames & 7)===0){
      rB.textContent = (bass>treble?'BASS':'AIR') + ' ' + (Math.max(bass,treble)*100|0);
      rE.textContent = (energy*100|0).toString().padStart(2,'0');
      rBe.textContent = beatEnv>0.5 ? '●●●' : beatEnv>0.2 ? '●●' : '●';
    }

    /* ---- adaptive perf guard ---- */
    frames++;
    if(now-fpsT>1000){ fps=frames*1000/(now-fpsT); frames=0; fpsT=now; }
  }
  requestAnimationFrame(frame);

  /* hint fade-in then out */
  const hint=document.getElementById('hint');
  setTimeout(()=>hint.classList.add('show'), 900);
  setTimeout(()=>hint.classList.remove('show'), 7200);

  // Attempt audio immediately; if blocked, first pointer/key resumes it.
  ensureAudio();
  const kick=()=>{ ensureAudio(); tryResume(); };
  window.addEventListener('pointerdown', kick, {once:false});
  window.addEventListener('keydown', kick, {once:false});
  // also try right away in case the context starts running
  setTimeout(tryResume, 60);

  // expose minimal state for self-verification
  window.__bloom = {
    state(){ return {
      energy:+energy.toFixed(3), bass:+bass.toFixed(3), treble:+treble.toFixed(3),
      srcMode, audioReady, octave:+octave.toFixed(3),
      px:pointer.x|0, py:pointer.y|0, rings:rings.length,
      band0:+bands[0].toFixed(3), bandMid:+bands[NB>>1].toFixed(3)
    };},
    pulse(x,y){ pushRing(x??CX,y??CY,1); },
    setPointer
  };
})();
</script>
