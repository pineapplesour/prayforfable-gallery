<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>CHRONOPHAGE — 시간을 먹는 것</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #05060a;
    overflow: hidden;
    cursor: none;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  /* HUD */
  #hud {
    position: fixed; left: 0; top: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 22px 26px;
    pointer-events: none;
    mix-blend-mode: screen;
    z-index: 10;
  }
  .hud-l, .hud-r { font-size: 11px; letter-spacing: 0.32em; line-height: 1.9; }
  .hud-l { color: #9fd6ff; text-transform: uppercase; }
  .hud-r { color: #ffb8d4; text-align: right; text-transform: uppercase; opacity: .82; }
  .hud-title { font-size: 13px; letter-spacing: 0.55em; color: #fff; opacity: .9; }
  .dim { opacity: .42; }
  #foot {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: center; gap: 26px;
    padding: 18px; pointer-events: none; z-index: 10;
    mix-blend-mode: screen;
    font-size: 10px; letter-spacing: 0.3em; color: #7d8aa8; text-transform: uppercase;
  }
  #foot b { color: #cfe4ff; font-weight: 600; }
  #hint {
    position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.38em; color: #d7e6ff;
    text-transform: uppercase; pointer-events: none; z-index: 11;
    text-shadow: 0 0 16px rgba(140,190,255,.55);
    transition: opacity 1.2s ease; opacity: 1;
  }
  @media (max-width: 540px) {
    #hud { padding: 14px 16px; }
    .hud-l, .hud-r { font-size: 9px; letter-spacing: 0.22em; line-height: 1.8; }
    .hud-title { font-size: 11px; letter-spacing: 0.38em; }
    #foot { gap: 14px; font-size: 8px; letter-spacing: 0.18em; padding: 12px; flex-wrap: wrap; }
    #hint { font-size: 9px; letter-spacing: 0.26em; bottom: 78px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="field"></canvas>   <!-- temporal particle field -->
  <canvas id="core"></canvas>    <!-- the melting clock + glow -->
</div>

<div id="hud">
  <div class="hud-l">
    <div class="hud-title">CHRONOPHAGE</div>
    <div class="dim">시간을 먹는 것 · TEMPORAL FIELD STUDY</div>
  </div>
  <div class="hud-r">
    <div id="t-clock">--:--:--</div>
    <div class="dim" id="t-frac">.000</div>
    <div class="dim" id="t-eaten">DEVOURED · 0</div>
  </div>
</div>

<div id="hint">움직여라 — 시간이 휘어진다 · CLICK TO DEVOUR</div>

<div id="foot">
  <span>MOVE&nbsp;<b>distort</b></span>
  <span>CLICK&nbsp;<b>collapse</b></span>
  <span>HOLD&nbsp;<b>singularity</b></span>
  <span>SCROLL&nbsp;<b>warp time</b></span>
</div>

<script>
"use strict";
/* ============================================================
   CHRONOPHAGE — a surreal time installation
   Pure canvas 2D. No libs. Self-contained.
   Two layers:
     (1) #field  : flowing particle "time fabric" + curl-noise
     (2) #core   : a Dalí-melting clock with real time, plus
                   gravitational lens distortion at the cursor.
   ============================================================ */

const fieldCv = document.getElementById('field');
const coreCv  = document.getElementById('core');
const fx = fieldCv.getContext('2d', { alpha: false });
const cx = coreCv.getContext('2d',  { alpha: true });

let W = 0, H = 0, DPR = 1, CXp = 0, CYp = 0, RAD = 0;
let lowPower = false;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  for (const cv of [fieldCv, coreCv]) {
    cv.width  = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
  }
  fx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CXp = W * 0.5; CYp = H * 0.5;
  RAD = Math.min(W, H) * (W < 540 ? 0.30 : 0.235);
  spawnParticles();
}
window.addEventListener('resize', resize, { passive: true });

/* ----------------------- input state ----------------------- */
const pointer = {
  x: -9999, y: -9999, px: -9999, py: -9999,
  vx: 0, vy: 0, down: false, hold: 0, active: false
};
let timeWarp = 1.0;       // scroll alters subjective time flow
let timeWarpTarget = 1.0;
let devoured = 0;
let hintFade = 1;

function setPointer(x, y) {
  pointer.px = pointer.x; pointer.py = pointer.y;
  pointer.x = x; pointer.y = y;
  pointer.active = true;
  if (hintFade > 0) { hintFade = 0; document.getElementById('hint').style.opacity = '0'; }
}
window.addEventListener('mousemove', e => setPointer(e.clientX, e.clientY), { passive: true });
window.addEventListener('mousedown', () => { pointer.down = true; });
window.addEventListener('mouseup',   () => { pointer.down = false; pointer.hold = 0; });
window.addEventListener('mouseleave',() => { pointer.active = false; });

window.addEventListener('touchstart', e => {
  pointer.down = true;
  if (e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
window.addEventListener('touchmove', e => {
  if (e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
window.addEventListener('touchend', () => { pointer.down = false; pointer.hold = 0; });

window.addEventListener('wheel', e => {
  timeWarpTarget += (-e.deltaY) * 0.0012;
  timeWarpTarget = Math.max(-2.5, Math.min(4.0, timeWarpTarget));
}, { passive: true });

window.addEventListener('click', e => {
  // collapse: a ripple shock that devours particles near cursor
  shocks.push({ x: e.clientX, y: e.clientY, r: 0, life: 1 });
});
window.addEventListener('keydown', e => { if (e.code === 'Space') burst(); });

/* ----------------------- value noise (curl) ----------------------- */
// cheap, smooth pseudo-noise for the flow field
const PSZ = 256;
const perm = new Uint8Array(PSZ * 2);
const grad = new Float32Array(PSZ * 2);
(function seedNoise() {
  for (let i = 0; i < PSZ; i++) { perm[i] = i; grad[i] = Math.cos(i * 12.9898) * 0.5 + Math.sin(i * 78.233); }
  for (let i = PSZ - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  for (let i = 0; i < PSZ; i++) perm[i + PSZ] = perm[i];
})();
function fade(t){ return t*t*t*(t*(t*6-15)+10); }
function lerp(a,b,t){ return a+(b-a)*t; }
function vnoise(x, y) {
  const xi = Math.floor(x) & 255, yi = Math.floor(y) & 255;
  const xf = x - Math.floor(x), yf = y - Math.floor(y);
  const u = fade(xf), v = fade(yf);
  const aa = grad[perm[perm[xi] + yi]];
  const ba = grad[perm[perm[xi+1] + yi]];
  const ab = grad[perm[perm[xi] + yi+1]];
  const bb = grad[perm[perm[xi+1] + yi+1]];
  return lerp(lerp(aa, ba, u), lerp(ab, bb, u), v);
}
// curl of the scalar field => divergence-free flow (organic swirl)
function curl(x, y, t) {
  const e = 0.55;
  const n1 = vnoise(x, y + e + t), n2 = vnoise(x, y - e + t);
  const n3 = vnoise(x + e, y + t), n4 = vnoise(x - e, y + t);
  return { x: (n1 - n2) / (2 * e), y: -(n3 - n4) / (2 * e) };
}

/* ----------------------- particle field ----------------------- */
let particles = [];
let PCOUNT = 0;
const shocks = [];

const PALETTE = [
  [120, 200, 255], [150, 130, 255], [255, 150, 210],
  [120, 255, 220], [255, 200, 120], [200, 170, 255]
];

function spawnParticles() {
  const area = W * H;
  PCOUNT = Math.floor(area / (lowPower ? 5200 : 2400));
  PCOUNT = Math.max(280, Math.min(PCOUNT, lowPower ? 900 : 2200));
  particles = new Array(PCOUNT);
  for (let i = 0; i < PCOUNT; i++) particles[i] = mkP();
}
function mkP(spawnEdge) {
  let x, y;
  if (spawnEdge) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.max(W, H) * 0.62;
    x = CXp + Math.cos(a) * r; y = CYp + Math.sin(a) * r;
  } else { x = Math.random() * W; y = Math.random() * H; }
  const c = PALETTE[(Math.random() * PALETTE.length) | 0];
  return {
    x, y, ox: x, oy: y, vx: 0, vy: 0,
    life: 0.4 + Math.random() * 0.6,
    sz: 0.6 + Math.random() * 1.7,
    c, seed: Math.random() * 1000,
    spin: (Math.random() < 0.5 ? -1 : 1) * (0.4 + Math.random() * 0.8)
  };
}

/* ----------------------- the melting clock (core) ----------------------- */
// draws a surreal clock whose face sags toward the cursor & whose
// hands track real time, warped by timeWarp.
let subjective = 0; // accumulated subjective time (seconds), warped

function drawClock(t, dt) {
  const realNow = new Date();
  // hand angles from real time, but advanced/retarded by subjective drift
  const baseSec = realNow.getHours()*3600 + realNow.getMinutes()*60 + realNow.getSeconds() + realNow.getMilliseconds()/1000;
  const sec  = baseSec + subjective;
  const aHour = ((sec/3600) % 12) / 12 * Math.PI*2 - Math.PI/2;
  const aMin  = ((sec/60)   % 60) / 60 * Math.PI*2 - Math.PI/2;
  const aSec  = ( sec       % 60) / 60 * Math.PI*2 - Math.PI/2;

  // melt vector: face droops toward pointer when close
  let mvx = 0, mvy = 0, prox = 0;
  if (pointer.active) {
    const dx = pointer.x - CXp, dy = pointer.y - CYp;
    const d = Math.hypot(dx, dy) + 0.001;
    prox = Math.max(0, 1 - d / (RAD * 2.4));
    mvx = dx / d * prox; mvy = dy / d * prox;
  }
  const sing = pointer.hold; // singularity strength while holding

  cx.save();
  cx.translate(CXp, CYp);

  // breathing scale
  const breathe = 1 + Math.sin(t * 0.9) * 0.012;

  /* --- outer aura rings (additive) --- */
  cx.globalCompositeOperation = 'screen';
  const rings = lowPower ? 2 : 4;
  for (let i = 0; i < rings; i++) {
    const rr = RAD * (1.12 + i * 0.16) * breathe + Math.sin(t * (0.6 + i*0.2) + i) * 5;
    const g = cx.createRadialGradient(0,0, rr*0.6, 0,0, rr);
    const hue = (t*8 + i*40) % 360;
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.82, `hsla(${190 + i*22 + Math.sin(t*0.5)*20},90%,62%,${0.05 + 0.03*Math.sin(t+ i)})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    cx.beginPath(); cx.arc(0,0, rr, 0, Math.PI*2);
    cx.strokeStyle = g; cx.lineWidth = 2 + i; cx.stroke();
  }

  /* --- the melting dial: a deformed circle (radial blob) --- */
  cx.globalCompositeOperation = 'source-over';
  const STEPS = lowPower ? 64 : 120;
  cx.beginPath();
  for (let i = 0; i <= STEPS; i++) {
    const a = i / STEPS * Math.PI * 2;
    let r = RAD * breathe;
    // sag: pull the rim toward the melt vector (Dalí droop)
    const sag = (Math.cos(a) * mvx + Math.sin(a) * mvy);
    r += sag * RAD * 0.55 * prox;
    r += Math.sin(a * 3 + t * 1.3) * RAD * 0.02; // gentle wobble
    // singularity: collapse rim inward where holding
    r -= sing * RAD * 0.18 * Math.max(0, sag);
    const px = Math.cos(a) * r + mvx * RAD * 0.32 * prox;
    const py = Math.sin(a) * r + mvy * RAD * 0.32 * prox + prox * RAD * 0.18; // gravity droop
    if (i === 0) cx.moveTo(px, py); else cx.lineTo(px, py);
  }
  cx.closePath();
  const faceG = cx.createRadialGradient(-RAD*0.3, -RAD*0.3, RAD*0.1, 0, 0, RAD*1.3);
  faceG.addColorStop(0, 'rgba(22,30,55,0.92)');
  faceG.addColorStop(0.7, 'rgba(10,14,30,0.88)');
  faceG.addColorStop(1, 'rgba(4,6,14,0.82)');
  cx.fillStyle = faceG; cx.fill();
  cx.lineWidth = 1.5;
  cx.strokeStyle = `hsla(${200 + Math.sin(t*0.4)*30}, 90%, 70%, ${0.5 + prox*0.4})`;
  cx.shadowColor = 'rgba(120,190,255,0.7)'; cx.shadowBlur = 24; cx.stroke();
  cx.shadowBlur = 0;

  // inner glass sheen
  cx.globalCompositeOperation = 'screen';
  const sheen = cx.createRadialGradient(-RAD*0.35,-RAD*0.4, 0, -RAD*0.35,-RAD*0.4, RAD*1.1);
  sheen.addColorStop(0, 'rgba(180,220,255,0.16)');
  sheen.addColorStop(0.5,'rgba(140,180,255,0.03)');
  sheen.addColorStop(1, 'rgba(0,0,0,0)');
  cx.beginPath(); cx.arc(0,0, RAD, 0, Math.PI*2); cx.fillStyle = sheen; cx.fill();

  /* --- tick marks & roman-ish numerals (warped) --- */
  cx.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * Math.PI * 2 - Math.PI/2;
    const major = i % 5 === 0;
    const droop = (Math.cos(a)*mvx + Math.sin(a)*mvy) * prox;
    const r0 = RAD * (major ? 0.80 : 0.86) * (1 + droop*0.4);
    const r1 = RAD * 0.92 * (1 + droop*0.4);
    const dx = mvx*RAD*0.32*prox, dy = mvy*RAD*0.32*prox + prox*RAD*0.18;
    cx.beginPath();
    cx.moveTo(Math.cos(a)*r0 + dx, Math.sin(a)*r0 + dy + droop*RAD*0.3);
    cx.lineTo(Math.cos(a)*r1 + dx, Math.sin(a)*r1 + dy + droop*RAD*0.3);
    cx.strokeStyle = major
      ? `rgba(190,225,255,${0.85})`
      : `rgba(150,180,230,${0.35})`;
    cx.lineWidth = major ? 2.2 : 1;
    cx.stroke();
  }

  /* --- hands --- */
  const dropX = mvx*RAD*0.32*prox, dropY = mvy*RAD*0.32*prox + prox*RAD*0.18;
  function hand(angle, len, wid, col, glow) {
    // hands also sag a touch toward pointer
    const ex = Math.cos(angle)*len*RAD, ey = Math.sin(angle)*len*RAD;
    const sgx = ex + mvx*RAD*0.22*prox, sgy = ey + mvy*RAD*0.22*prox + prox*RAD*0.10;
    cx.beginPath();
    cx.moveTo(dropX*0.3, dropY*0.3);
    // a slight quadratic bend = molten hand
    cx.quadraticCurveTo(
      (sgx*0.5 + mvx*RAD*0.1*prox), (sgy*0.5 + mvy*RAD*0.1*prox + prox*RAD*0.12),
      sgx + dropX*0.6, sgy + dropY*0.6
    );
    cx.lineCap = 'round';
    cx.lineWidth = wid;
    cx.strokeStyle = col;
    cx.shadowColor = glow; cx.shadowBlur = 16;
    cx.stroke();
    cx.shadowBlur = 0;
  }
  hand(aHour, 0.50, 5.5, 'rgba(220,235,255,0.95)', 'rgba(120,180,255,0.9)');
  hand(aMin,  0.72, 3.5, 'rgba(190,220,255,0.95)', 'rgba(140,170,255,0.9)');
  hand(aSec,  0.84, 1.6, `hsla(${(t*40)%360},100%,72%,0.95)`, 'rgba(255,140,200,0.9)');

  // hub
  cx.beginPath(); cx.arc(dropX*0.3, dropY*0.3, 6, 0, Math.PI*2);
  cx.fillStyle = '#fff'; cx.shadowColor='rgba(160,200,255,1)'; cx.shadowBlur=18; cx.fill();
  cx.shadowBlur = 0;

  /* --- singularity well at hub when holding --- */
  if (sing > 0.02) {
    cx.globalCompositeOperation = 'multiply';
    const well = cx.createRadialGradient(0,0,0,0,0,RAD*1.2*sing);
    well.addColorStop(0,'rgba(0,0,0,1)');
    well.addColorStop(0.6,`rgba(10,0,20,${0.7})`);
    well.addColorStop(1,'rgba(0,0,0,0)');
    cx.beginPath(); cx.arc(0,0,RAD*1.2*sing,0,Math.PI*2);
    cx.fillStyle = well; cx.fill();
    cx.globalCompositeOperation = 'screen';
    cx.beginPath(); cx.arc(0,0,RAD*0.2*sing+6,0,Math.PI*2);
    cx.strokeStyle = `hsla(${(t*120)%360},100%,70%,${0.6})`; cx.lineWidth=2; cx.stroke();
  }

  cx.restore();
  return { aSec, prox };
}

/* ----------------------- main loop ----------------------- */
let last = performance.now();
let fpsAvg = 60, fpsCheck = 0, slowFrames = 0;

function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;       // clamp big gaps
  const t = now / 1000;

  // perf watchdog: drop to low power if sustained slow
  const inst = 1 / Math.max(dt, 1e-4);
  fpsAvg = fpsAvg * 0.93 + inst * 0.07;
  if (++fpsCheck > 90) {
    fpsCheck = 0;
    if (fpsAvg < 42 && !lowPower) { slowFrames++; if (slowFrames >= 2) { lowPower = true; spawnParticles(); } }
  }

  // ---- update subjective time / warp ----
  timeWarp += (timeWarpTarget - timeWarp) * Math.min(1, dt * 3);
  subjective += dt * (timeWarp - 1) * 6.0; // scrolling pushes time forward/back

  // pointer velocity
  pointer.vx = (pointer.x - pointer.px);
  pointer.vy = (pointer.y - pointer.py);
  pointer.px = pointer.x; pointer.py = pointer.y;
  if (pointer.down) pointer.hold = Math.min(1, pointer.hold + dt * 1.2);
  else pointer.hold = Math.max(0, pointer.hold - dt * 2.2);

  /* ============ FIELD LAYER ============ */
  // trailing fade (motion blur) instead of full clear
  fx.globalCompositeOperation = 'source-over';
  fx.fillStyle = lowPower ? 'rgba(5,6,10,0.30)' : 'rgba(5,6,10,0.16)';
  fx.fillRect(0, 0, W, H);

  fx.globalCompositeOperation = 'lighter';
  const flowT = t * 0.12 * (0.3 + Math.abs(timeWarp));
  const NS = 0.0023; // noise scale

  for (let i = 0; i < PCOUNT; i++) {
    const p = particles[i];

    // curl-noise flow
    const c = curl(p.x * NS, p.y * NS, flowT);
    let ax = c.x * 26 * timeWarpSign(), ay = c.y * 26 * timeWarpSign();

    // orbital pull toward the clock (the "chronophage" eats inward)
    const dxC = CXp - p.x, dyC = CYp - p.y;
    const dC = Math.hypot(dxC, dyC) + 0.001;
    const orbit = 9 / Math.max(0.18, dC / RAD);
    ax += (dxC / dC) * orbit + (-dyC / dC) * p.spin * 6;
    ay += (dyC / dC) * orbit + ( dxC / dC) * p.spin * 6;

    // pointer = gravitational lens (attract near, repel at very close = event horizon)
    if (pointer.active) {
      const dxp = pointer.x - p.x, dyp = pointer.y - p.y;
      const dp = Math.hypot(dxp, dyp) + 0.001;
      const reach = 230;
      if (dp < reach) {
        const f = (1 - dp / reach);
        const pull = pointer.down ? 1 : 0.42;
        const dir = dp < 46 ? -2.4 : 1; // event horizon kickback
        ax += (dxp / dp) * f * f * 480 * pull * dir;
        ay += (dyp / dp) * f * f * 480 * pull * dir;
        // swirl around pointer
        ax += (-dyp / dp) * f * 120 * pull;
        ay += ( dxp / dp) * f * 120 * pull;
      }
    }

    p.vx = (p.vx + ax * dt) * 0.92;
    p.vy = (p.vy + ay * dt) * 0.92;
    p.x += p.vx * dt * 60 * 0.06;
    p.y += p.vy * dt * 60 * 0.06;

    // shock interaction
    for (let s = 0; s < shocks.length; s++) {
      const sh = shocks[s];
      const dxs = p.x - sh.x, dys = p.y - sh.y;
      const ds = Math.hypot(dxs, dys);
      const band = Math.abs(ds - sh.r);
      if (band < 34) {
        const k = (1 - band/34) * sh.life;
        p.vx += dxs/(ds+1) * k * 30;
        p.vy += dys/(ds+1) * k * 30;
      }
    }

    // devour: particles sucked into the core get reborn at the edge
    if (dC < RAD * 0.42) {
      devoured++;
      Object.assign(p, mkP(true));
      continue;
    }
    // wrap-out respawn
    if (p.x < -60 || p.x > W+60 || p.y < -60 || p.y > H+60) {
      Object.assign(p, mkP(true));
      continue;
    }

    // draw as a short streak (velocity trail)
    const sp = Math.min(1, (Math.abs(p.vx)+Math.abs(p.vy)) * 0.12);
    const [r,g,b] = p.c;
    const alpha = 0.25 + sp * 0.55;
    const sizeBoost = dC < RAD*1.1 ? 1.5 : 1;  // brighten near the maw
    fx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
    fx.lineWidth = p.sz * sizeBoost;
    fx.beginPath();
    fx.moveTo(p.x, p.y);
    fx.lineTo(p.x - p.vx * 1.4, p.y - p.vy * 1.4);
    fx.stroke();
  }

  // advance & draw shocks
  cx.clearRect(0, 0, W, H);
  for (let s = shocks.length - 1; s >= 0; s--) {
    const sh = shocks[s];
    sh.r += dt * 620;
    sh.life -= dt * 0.85;
    if (sh.life <= 0) { shocks.splice(s, 1); continue; }
    cx.globalCompositeOperation = 'screen';
    cx.beginPath(); cx.arc(sh.x, sh.y, sh.r, 0, Math.PI*2);
    cx.strokeStyle = `hsla(${(t*60 + sh.r)%360},100%,70%,${sh.life*0.5})`;
    cx.lineWidth = 2 + sh.life*3; cx.stroke();
  }

  /* ============ CORE LAYER (clock) ============ */
  drawClock(t, dt);

  /* ============ CURSOR (custom) ============ */
  if (pointer.active && pointer.x > -1000) {
    cx.globalCompositeOperation = 'screen';
    const cr = 14 + pointer.hold * 26 + Math.sin(t*4)*2;
    const cg = cx.createRadialGradient(pointer.x,pointer.y,0,pointer.x,pointer.y,cr);
    cg.addColorStop(0,'rgba(255,255,255,0.9)');
    cg.addColorStop(0.3,'rgba(150,200,255,0.5)');
    cg.addColorStop(1,'rgba(150,200,255,0)');
    cx.beginPath(); cx.arc(pointer.x,pointer.y,cr,0,Math.PI*2); cx.fillStyle=cg; cx.fill();
    cx.beginPath(); cx.arc(pointer.x,pointer.y, 2.4,0,Math.PI*2);
    cx.fillStyle='#fff'; cx.fill();
  }

  // ---- HUD text ----
  if ((now|0) % 2 === 0) updateHUD();

  requestAnimationFrame(frame);
}
function timeWarpSign(){ return timeWarp < 0 ? -1 : 1; }

function burst() {
  shocks.push({ x: CXp, y: CYp, r: 0, life: 1 });
}

const elClock = document.getElementById('t-clock');
const elFrac  = document.getElementById('t-frac');
const elEaten = document.getElementById('t-eaten');
function updateHUD() {
  const d = new Date();
  const sec = d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds() + Math.floor(subjective);
  const hh = Math.floor((sec/3600)) % 24;
  const mm = Math.floor((sec/60)) % 60;
  const ss = ((sec % 60) + 60) % 60;
  elClock.textContent =
    String((hh%24+24)%24).padStart(2,'0') + ':' +
    String((mm%60+60)%60).padStart(2,'0') + ':' +
    String(ss).padStart(2,'0');
  elFrac.textContent = '×' + timeWarp.toFixed(2) + ' WARP';
  elEaten.textContent = 'DEVOURED · ' + devoured.toLocaleString();
}

/* ----------------------- boot ----------------------- */
resize();
// auto-fade hint after a while even without interaction
setTimeout(() => {
  if (hintFade > 0) { document.getElementById('hint').style.opacity = '0.0'; }
}, 9000);
requestAnimationFrame(frame);
</script>
