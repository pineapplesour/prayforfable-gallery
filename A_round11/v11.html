<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LISSAJOUS · PHOSPHOR BEAM</title>
<style>
  :root{
    --bg:#04070a;
    --grid:rgba(60,255,180,.10);
    --ink:rgba(140,255,210,.85);
    --dim:rgba(120,220,190,.45);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    -webkit-tap-highlight-color:transparent;touch-action:none;cursor:crosshair}
  #stage{position:fixed;inset:0;display:block}
  /* glow canvas sits beneath UI text */
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #phos{z-index:1}
  #ui{position:fixed;inset:0;z-index:3;pointer-events:none;
    mix-blend-mode:screen}
  /* CRT skin */
  #vignette{position:fixed;inset:0;z-index:4;pointer-events:none;
    background:
      radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
    box-shadow:inset 0 0 180px 30px rgba(0,0,0,.7);}
  #scan{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,.22) 3px, rgba(0,0,0,.22) 3px);
    mix-blend-mode:multiply;}
  /* readout HUD */
  .hud{position:fixed;z-index:6;color:var(--ink);
    text-shadow:0 0 8px rgba(60,255,180,.6);pointer-events:none;
    font-size:12px;letter-spacing:.12em;line-height:1.7;
    text-transform:uppercase}
  #hudTL{top:18px;left:20px}
  #hudTR{top:18px;right:20px;text-align:right;color:var(--dim)}
  #hudBL{bottom:16px;left:20px;color:var(--dim);font-size:11px}
  #hudBR{bottom:16px;right:20px;text-align:right;color:var(--dim);font-size:11px}
  .big{font-size:15px;color:#bafff0;text-shadow:0 0 12px rgba(80,255,200,.8)}
  .lbl{color:rgba(120,220,190,.55)}
  .bar{display:inline-block;vertical-align:middle;width:64px;height:5px;
    margin-left:8px;background:rgba(60,255,180,.15);position:relative;
    border:1px solid rgba(60,255,180,.25)}
  .bar > i{position:absolute;left:0;top:0;bottom:0;background:#5fffc8;
    box-shadow:0 0 8px #5fffc8;display:block}
  @media (max-width:560px){
    .hud{font-size:10px}
    .big{font-size:12px}
    #hudTR,#hudBR{display:none}
    .bar{width:44px}
  }
</style>
</head>
<body>
  <canvas id="phos"></canvas>
  <canvas id="ui"></canvas>
  <div id="vignette"></div>
  <div id="scan"></div>

  <div class="hud" id="hudTL">
    <div class="big">LISSAJOUS</div>
    <div><span class="lbl">RATIO</span> <span id="oRatio">3 : 2</span></div>
    <div><span class="lbl">PHASE</span> <span id="oPhase">0.00π</span></div>
  </div>
  <div class="hud" id="hudTR">
    <div>BEAM&nbsp;<span id="oBeam">12</span></div>
    <div>FPS&nbsp;<span id="oFps">60</span></div>
  </div>
  <div class="hud" id="hudBL">
    <div>PERSIST <span class="bar"><i id="oPersistB"></i></span></div>
    <div>TIMEBASE <span class="bar"><i id="oSpeedB"></i></span></div>
  </div>
  <div class="hud" id="hudBR">
    <div>MOVE · WARP&nbsp;FREQ</div>
    <div>SCROLL · AFTERGLOW</div>
    <div>CLICK · PHASE&nbsp;PING</div>
  </div>

<script>
(()=>{
"use strict";
const phos = document.getElementById('phos');
const ui   = document.getElementById('ui');
const pctx = phos.getContext('2d',{alpha:false});
const uctx = ui.getContext('2d');

let W=0,H=0,DPR=1,cx=0,cy=0,R=0;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2); // resolution cap for perf
  W = Math.floor(window.innerWidth);
  H = Math.floor(window.innerHeight);
  for(const c of [phos,ui]){
    c.width = Math.floor(W*DPR);
    c.height= Math.floor(H*DPR);
  }
  pctx.setTransform(DPR,0,0,DPR,0,0);
  uctx.setTransform(DPR,0,0,DPR,0,0);
  cx = W/2; cy = H/2;
  R = Math.min(W,H)*0.40;
  // prime phosphor with pure black so first paint is the artwork (no flash)
  pctx.fillStyle = '#04070a';
  pctx.fillRect(0,0,W,H);
  drawGraticule();
}
window.addEventListener('resize', resize);

/* ---------- state ---------- */
const S = {
  a: 3, b: 2,            // target integer-ish frequency ratio
  af: 3, bf: 2,          // smoothed (float) live ratio
  phase: 0,              // base phase offset (radians)
  phaseTarget: 0,
  drift: 0,              // slow auto phase drift
  persist: 0.055,        // fade-per-frame alpha (lower = longer glow)
  persistT: 0.055,
  speed: 1.0,            // time-base multiplier
  speedT: 1.0,
  beam: 12,              // energy / brightness, decays toward base
  beamBase: 11,
  t: 0,
  hue: 158,             // phosphor base hue (green-cyan)
  hueTarget: 158,
  mx: 0.5, my: 0.5,     // normalized pointer
  pmx: 0.5, pmy: 0.5,
  pings: [],            // phase ripples
};

/* ---------- graticule (faint glowing grid) ---------- */
function drawGraticule(){
  // drawn once into phosphor buffer faintly; it persists & gets refreshed lightly
  const g = pctx;
  g.save();
  g.strokeStyle = 'rgba(50,230,170,0.07)';
  g.lineWidth = 1;
  const span = R*1.18;
  const step = span/4;
  g.beginPath();
  for(let i=-4;i<=4;i++){
    g.moveTo(cx-span, cy+i*step); g.lineTo(cx+span, cy+i*step);
    g.moveTo(cx+i*step, cy-span); g.lineTo(cx+i*step, cy+span);
  }
  g.stroke();
  // center ticks
  g.strokeStyle = 'rgba(60,255,180,0.16)';
  for(let i=-4;i<=4;i++){
    g.beginPath();
    g.moveTo(cx+i*step, cy-5); g.lineTo(cx+i*step, cy+5);
    g.moveTo(cx-5, cy+i*step); g.lineTo(cx+5, cy+i*step);
    g.stroke();
  }
  g.restore();
}

/* ---------- interaction ---------- */
function setPointer(px,py){
  S.mx = Math.min(1,Math.max(0,px/W));
  S.my = Math.min(1,Math.max(0,py/H));
}
function pointerMove(px,py){
  const nx = Math.min(1,Math.max(0,px/W));
  const ny = Math.min(1,Math.max(0,py/H));
  const dv = Math.hypot(nx-S.mx, ny-S.my);
  S.mx=nx; S.my=ny;
  // inject beam energy proportional to motion
  S.beam = Math.min(34, S.beam + dv*120);
  // map X -> a (1..7), Y -> b (1..6) snapped softly to musical-ish ratios
  S.a = 1 + Math.round(S.mx*6 * 1.0);
  S.b = 1 + Math.round((1-S.my)*5 * 1.0);
  if(S.a<1)S.a=1; if(S.b<1)S.b=1;
  // X also pushes phase a touch for richness
  S.phaseTarget = (S.mx-0.5)*Math.PI*1.4;
  // hue drifts with ratio complexity
  const cplx = (S.a*S.b)%9;
  S.hueTarget = 150 + cplx*9;
}
phos.parentElement; // noop
window.addEventListener('mousemove', e=>pointerMove(e.clientX,e.clientY), {passive:true});
window.addEventListener('mousedown', e=>doPing(e.clientX,e.clientY));
window.addEventListener('touchstart', e=>{
  const t=e.touches[0]; S.mx=t.clientX/W; S.my=t.clientY/H;
  doPing(t.clientX,t.clientY); e.preventDefault();
}, {passive:false});
window.addEventListener('touchmove', e=>{
  const t=e.touches[0]; pointerMove(t.clientX,t.clientY); e.preventDefault();
}, {passive:false});
window.addEventListener('wheel', e=>{
  // scroll up -> longer afterglow + faster timebase
  const d = Math.sign(e.deltaY);
  S.persistT = Math.min(0.16, Math.max(0.012, S.persistT + d*0.006));
  S.speedT   = Math.min(2.6,  Math.max(0.25, S.speedT  - d*0.10));
  e.preventDefault();
}, {passive:false});

function doPing(px,py){
  S.beam = 34;
  S.pings.push({t:0, str:1});
  if(S.pings.length>6) S.pings.shift();
}

/* ---------- HUD ---------- */
const oRatio=document.getElementById('oRatio');
const oPhase=document.getElementById('oPhase');
const oBeam=document.getElementById('oBeam');
const oFps=document.getElementById('oFps');
const oPersistB=document.getElementById('oPersistB');
const oSpeedB=document.getElementById('oSpeedB');
let hudClock=0;
function updateHUD(fps){
  oRatio.textContent = `${S.a} : ${S.b}`;
  oPhase.textContent = (((S.phase/Math.PI)%2+2)%2).toFixed(2)+'π';
  oBeam.textContent  = Math.round(S.beam);
  oFps.textContent   = fps;
  // persist bar: invert (longer glow = fuller bar)
  const pf = (0.16 - S.persist)/(0.16-0.012);
  oPersistB.style.width = (pf*100).toFixed(0)+'%';
  oSpeedB.style.width = ((S.speed-0.25)/(2.6-0.25)*100).toFixed(0)+'%';
}

/* ---------- the beam render ---------- */
// We trace the curve as a dense polyline; each frame we redraw the WHOLE
// active arc with additive light, but the persistence comes from fading the
// buffer, so the moving "head" leaves a phosphor tail.
function frame(now){
  // ease state
  S.af += (S.a - S.af)*0.08;
  S.bf += (S.b - S.bf)*0.08;
  S.phase += (S.phaseTarget - S.phase)*0.06;
  S.persist += (S.persistT - S.persist)*0.1;
  S.speed += (S.speedT - S.speed)*0.1;
  S.beam += (S.beamBase - S.beam)*0.045;
  S.hue += (S.hueTarget - S.hue)*0.04;
  S.drift += 0.0016 * S.speed;
  S.t += (0.020 * S.speed);

  // 1) PHOSPHOR DECAY: paint translucent bg over everything
  pctx.globalCompositeOperation = 'source-over';
  pctx.fillStyle = `rgba(4,7,10,${S.persist})`;
  pctx.fillRect(0,0,W,H);

  // occasionally refresh graticule so it never fully vanishes
  if((S.t*10|0)%7===0) drawGraticule();

  // 2) draw the beam additively
  pctx.globalCompositeOperation = 'lighter';

  // process pings (transient phase wobble)
  let pingPhase=0, pingAmp=0;
  for(const p of S.pings){
    p.t += 0.04;
    const env = Math.exp(-p.t*2.2)*p.str;
    pingPhase += Math.sin(p.t*9)*env*0.8;
    pingAmp   += env*0.12;
  }
  S.pings = S.pings.filter(p=>p.t<3);

  const a = S.af, b = S.bf;
  const amp = R * (1 + pingAmp);
  const ph  = S.phase + pingPhase + S.drift*0.5;

  // beam brightness
  const energy = S.beam/12;          // ~1 at rest
  const hue = S.hue;

  // Sweep: we draw a moving window of the parametric curve.
  // theta runs a full 2π; the "head" is at S.t (mod 2π).
  const SEG = 520;                    // samples per frame (perf cap)
  const headTheta = (S.t*0.8) % (Math.PI*2);
  const window = Math.PI*2;           // draw whole curve, head brightest
  const baseLine = Math.max(1.1, R*0.0042);

  // --- soft outer bloom pass (thick, dim) ---
  pctx.lineCap='round'; pctx.lineJoin='round';
  function tracePass(lw, alpha, sat, light){
    pctx.lineWidth = lw;
    pctx.strokeStyle = `hsla(${hue},${sat}%,${light}%,${alpha})`;
    pctx.beginPath();
    for(let i=0;i<=SEG;i++){
      const th = headTheta - window + (window*i/SEG);
      const x = cx + Math.sin(a*th + ph) * amp;
      const y = cy + Math.sin(b*th) * amp;
      if(i===0) pctx.moveTo(x,y); else pctx.lineTo(x,y);
    }
    pctx.stroke();
  }
  // layered glow: wide+faint -> tight+bright (additive => bloom)
  tracePass(baseLine*9, 0.020*energy, 90, 42);
  tracePass(baseLine*5, 0.035*energy, 88, 52);
  tracePass(baseLine*2.4, 0.10*energy, 80, 66);
  tracePass(baseLine*1.2, 0.30*energy, 60, 86);

  // --- bright moving HEAD dot (the electron beam spot) ---
  {
    const th = headTheta;
    const hx = cx + Math.sin(a*th + ph)*amp;
    const hy = cy + Math.sin(b*th)*amp;
    const rr = baseLine*7*energy;
    const grd = pctx.createRadialGradient(hx,hy,0,hx,hy,rr);
    grd.addColorStop(0,  `hsla(${hue-10},100%,98%,0.95)`);
    grd.addColorStop(0.25,`hsla(${hue},95%,75%,0.6)`);
    grd.addColorStop(1,  `hsla(${hue},90%,50%,0)`);
    pctx.fillStyle = grd;
    pctx.beginPath(); pctx.arc(hx,hy,rr,0,Math.PI*2); pctx.fill();
    // second leading dot for richer trail (slightly ahead)
    const th2 = headTheta - 0.02;
    const hx2 = cx + Math.sin(a*th2 + ph)*amp;
    const hy2 = cy + Math.sin(b*th2)*amp;
    pctx.fillStyle = `hsla(${hue},100%,90%,0.5)`;
    pctx.beginPath(); pctx.arc(hx2,hy2,baseLine*2.2*energy,0,Math.PI*2); pctx.fill();
  }

  // 3) UI overlay (cursor reticle + crosshair)
  uctx.clearRect(0,0,W,H);
  const px = S.mx*W, py = S.my*H;
  uctx.strokeStyle = 'rgba(120,255,200,0.30)';
  uctx.lineWidth=1;
  uctx.beginPath();
  uctx.moveTo(px-14,py); uctx.lineTo(px-5,py);
  uctx.moveTo(px+5,py);  uctx.lineTo(px+14,py);
  uctx.moveTo(px,py-14); uctx.lineTo(px,py-5);
  uctx.moveTo(px,py+5);  uctx.lineTo(px,py+14);
  uctx.stroke();
  uctx.strokeStyle='rgba(120,255,200,0.18)';
  uctx.beginPath(); uctx.arc(px,py,18,0,Math.PI*2); uctx.stroke();

  // fps
  frames++;
  if(now-fpsClock>=500){
    curFps = Math.round(frames*1000/(now-fpsClock));
    frames=0; fpsClock=now;
  }
  if(now-hudClock>=120){ updateHUD(curFps); hudClock=now; }

  requestAnimationFrame(frame);
}

let frames=0, fpsClock=performance.now(), curFps=60;

resize();
// ensure first paint already shows a bit of the figure (no blank gate)
(function prime(){
  // draw a faint initial curve so the very first frame is "art"
  pctx.globalCompositeOperation='lighter';
  pctx.lineWidth=2; pctx.strokeStyle='hsla(158,80%,70%,0.5)';
  pctx.beginPath();
  for(let i=0;i<=600;i++){
    const th=Math.PI*2*i/600;
    const x=cx+Math.sin(3*th)*R, y=cy+Math.sin(2*th)*R;
    i?pctx.lineTo(x,y):pctx.moveTo(x,y);
  }
  pctx.stroke();
})();
updateHUD(60);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
