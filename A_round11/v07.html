<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IRIDESCE — soap foam</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060a; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
         touch-action:none; cursor:crosshair; }
  #stage { position:fixed; inset:0; display:block; }
  .hud { position:fixed; left:22px; bottom:20px; z-index:5; pointer-events:none;
         mix-blend-mode:screen; color:#eaf2ff; }
  .hud .t { font-weight:800; letter-spacing:.34em; font-size:13px;
            text-transform:uppercase; opacity:.92;
            text-shadow:0 0 18px rgba(150,200,255,.55); }
  .hud .s { margin-top:7px; font-size:10.5px; letter-spacing:.18em; opacity:.5;
            font-weight:500; max-width:300px; line-height:1.7; }
  .badge { position:fixed; right:20px; top:18px; z-index:5; pointer-events:none;
           mix-blend-mode:screen; font-size:9.5px; letter-spacing:.32em;
           color:#bcd4ff; opacity:.42; font-weight:700; }
  @media (max-width:520px){
    .hud { left:16px; bottom:16px; }
    .hud .t { font-size:11px; letter-spacing:.28em; }
    .hud .s { font-size:9.5px; max-width:230px; }
    .badge { right:14px; top:14px; font-size:8.5px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hud">
  <div class="t">Iridesce</div>
  <div class="s">move to breathe &middot; press to coax &middot; tap a bubble to pop</div>
</div>
<div class="badge">FOAM &middot; THIN-FILM</div>

<script>
"use strict";
(() => {
  const cv = document.getElementById('stage');
  const ctx = cv.getContext('2d', { alpha:false });

  let W=0,H=0,DPR=1,DIAG=1;
  const lo = (a,b)=>Math.min(a,b), hi=(a,b)=>Math.max(a,b);

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = Math.floor(innerWidth);
    H = Math.floor(innerHeight);
    cv.width = Math.floor(W*DPR);
    cv.height = Math.floor(H*DPR);
    cv.style.width = W+'px';
    cv.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    DIAG = Math.hypot(W,H);
  }
  resize();
  addEventListener('resize', ()=>{ resize(); rebuild(); if(typeof makeBloom==='function') makeBloom(); }, {passive:true});

  // ---------- pointer ----------
  const ptr = { x:W*0.5, y:H*0.42, px:W*0.5, py:H*0.42, vx:0, vy:0,
                down:false, active:false, speed:0 };
  function setPtr(x,y){ ptr.x=x; ptr.y=y; ptr.active=true; }
  cv.addEventListener('pointermove', e=>{ setPtr(e.clientX, e.clientY); }, {passive:true});
  cv.addEventListener('pointerdown', e=>{ ptr.down=true; setPtr(e.clientX,e.clientY); tryPop(e.clientX,e.clientY); }, {passive:true});
  addEventListener('pointerup', ()=>{ ptr.down=false; }, {passive:true});
  cv.addEventListener('pointerleave', ()=>{ ptr.active=false; ptr.down=false; }, {passive:true});

  // scroll / wheel -> "air tilt" gravity that drifts the foam
  let tilt = 0, tiltTarget = 0;
  addEventListener('wheel', e=>{ tiltTarget += Math.sign(e.deltaY)*0.12;
    tiltTarget = Math.max(-1.2, Math.min(1.2, tiltTarget)); }, {passive:true});

  // ---------- color: thin-film interference ----------
  // wavelength->RGB then modulated by film "thickness" phase. Soft & pearly.
  function filmColor(phase, sat, light){
    // phase in [0,1) walks the iridescent ring
    const a = phase*Math.PI*2;
    let r = 0.5 + 0.5*Math.sin(a + 0.0);
    let g = 0.5 + 0.5*Math.sin(a + 2.094);
    let b = 0.5 + 0.5*Math.sin(a + 4.188);
    // pearlescent: pull toward white, then apply sat
    r = (1-sat) + sat*r;
    g = (1-sat) + sat*g;
    b = (1-sat) + sat*b;
    r*=light; g*=light; b*=light;
    return [r,g,b];
  }
  const rgb = (r,g,b,a)=>`rgba(${(r*255)|0},${(g*255)|0},${(b*255)|0},${a})`;

  // ---------- bubbles ----------
  let bubbles = [];
  let MAXB = 0;
  let popFx = [];

  function targetCount(){
    const area = W*H;
    // density tuned per area, capped for perf
    let n = Math.round(area/11500);
    const cap = (W*H > 900*700) ? 160 : 130;
    return Math.max(52, Math.min(cap, n));
  }

  function makeBubble(x,y,r){
    return {
      x, y, px:x, py:y, vx:(Math.random()-.5)*0.2, vy:(Math.random()-.5)*0.2,
      r, r0:r, tr:r,                 // radius, base, target (for grow/merge)
      ph: Math.random(),            // film phase seed
      spin:(Math.random()-.5)*0.004,
      wob: Math.random()*Math.PI*2, // wobble phase
      wobr: 0.04+Math.random()*0.05,
      age:0, life: 1, popping:0,
      mass:0
    };
  }

  function rebuild(){
    MAXB = targetCount();
    bubbles.length = 0;
    popFx.length = 0;
    const rMin = DIAG*0.012, rMax = DIAG*0.052;
    let tries = 0;
    while(bubbles.length < MAXB && tries < MAXB*40){
      tries++;
      const r = rMin + Math.pow(Math.random(),1.7)*(rMax-rMin);
      const x = r + Math.random()*(W-2*r);
      const y = r + Math.random()*(H-2*r);
      let ok = true;
      for(let i=0;i<bubbles.length;i++){
        const b=bubbles[i], d=Math.hypot(b.x-x,b.y-y);
        if(d < (b.r+r)*0.62){ ok=false; break; }
      }
      if(ok){ const nb=makeBubble(x,y,r); nb.mass=r*r; bubbles.push(nb); }
    }
  }
  rebuild();

  // spatial hash for neighbor queries
  let cell=0, cols=0, rows=0, grid=null;
  function buildGrid(){
    cell = Math.max(28, DIAG*0.06);
    cols = Math.ceil(W/cell)+1;
    rows = Math.ceil(H/cell)+1;
    if(!grid || grid.length !== cols*rows) grid = new Array(cols*rows);
    for(let i=0;i<grid.length;i++) grid[i]=null;
    for(let i=0;i<bubbles.length;i++){
      const b=bubbles[i];
      const cx=(b.x/cell)|0, cy=(b.y/cell)|0;
      if(cx<0||cy<0||cx>=cols||cy>=rows) continue;
      const k=cy*cols+cx;
      b._n = grid[k]; grid[k]=i;
    }
  }

  // ---------- popping ----------
  function tryPop(x,y){
    let best=-1, bd=1e9;
    for(let i=0;i<bubbles.length;i++){
      const b=bubbles[i]; if(b.popping) continue;
      const d=Math.hypot(b.x-x,b.y-y);
      if(d<b.r && d<bd){ bd=d; best=i; }
    }
    if(best>=0) popBubble(best, true);
  }
  function popBubble(i, hard){
    const b=bubbles[i];
    if(b.popping) return;
    b.popping = 1;
    // spawn shimmer ring + droplets
    const n = hard ? 16 : 10;
    for(let k=0;k<n;k++){
      const a = (k/n)*Math.PI*2 + Math.random()*0.4;
      const sp = (hard?1:0.6)*(0.6+Math.random()*1.4)*(b.r*0.06+0.5);
      popFx.push({ x:b.x, y:b.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        r:b.r*(0.06+Math.random()*0.08), ph:(b.ph+Math.random()*0.2)%1,
        life:1, decay:0.018+Math.random()*0.02, kind:0 });
    }
    popFx.push({ x:b.x, y:b.y, vx:0, vy:0, r:b.r, ph:b.ph, life:1, decay:0.045, kind:1 });
  }

  // ---------- main step ----------
  let last=performance.now(), tSec=0, frames=0, fpsT=0, fps=60;
  function step(now){
    let dt=(now-last)/16.6667; last=now;
    if(dt>2.5) dt=2.5; if(dt<=0) dt=1;
    tSec += dt*0.016667;
    fpsT++; if(now-fps_last>500){ fps = fpsT*1000/(now-fps_last); fpsT=0; fps_last=now; }

    // pointer velocity
    ptr.vx = ptr.x-ptr.px; ptr.vy = ptr.y-ptr.py;
    ptr.px=ptr.x; ptr.py=ptr.y;
    ptr.speed = ptr.speed*0.8 + Math.hypot(ptr.vx,ptr.vy)*0.2;

    tilt += (tiltTarget - tilt)*0.06*dt;
    tiltTarget *= Math.pow(0.985, dt);

    buildGrid();
    const RAD = cell;
    const stiff = 0.6;            // separation stiffness
    const damp = Math.pow(0.86, dt);

    for(let i=0;i<bubbles.length;i++){
      const b=bubbles[i];
      // neighbor separation (soft-body packing) using 3x3 cells
      const cx=(b.x/cell)|0, cy=(b.y/cell)|0;
      for(let oy=-1;oy<=1;oy++) for(let ox=-1;ox<=1;ox++){
        const nx=cx+ox, ny=cy+oy;
        if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
        let j=grid[ny*cols+nx];
        while(j!=null){
          if(j>i){
            const o=bubbles[j];
            let dx=o.x-b.x, dy=o.y-b.y;
            let d=Math.hypot(dx,dy);
            const min=(b.r+o.r);
            if(d<min && d>0.0001){
              const inv=1/d;
              const nxv=dx*inv, nyv=dy*inv;
              const overlap=(min-d);
              // mass-weighted push
              const tm=b.mass+o.mass;
              const wb=o.mass/tm, wo=b.mass/tm;
              const push=overlap*stiff;
              b.vx-=nxv*push*wb; b.vy-=nyv*push*wb;
              o.vx+=nxv*push*wo; o.vy+=nyv*push*wo;
              // film tension: tiny color coupling at contact
              b.ph += (o.ph-b.ph)*0.0008;
            }
          }
          j=bubbles[j]._n;
        }
      }

      // gentle buoyant float + scroll air-tilt
      b.vy -= 0.006*dt;                         // bubbles rise softly
      b.vx += tilt*0.05*dt;
      b.vy += Math.sin(tSec*0.6 + b.x*0.004)*0.004*dt; // ambient current

      // pointer interaction: breeze when moving, gather when pressed
      if(ptr.active){
        const dx=b.x-ptr.x, dy=b.y-ptr.y;
        const d=Math.hypot(dx,dy);
        const R = ptr.down ? DIAG*0.32 : DIAG*0.20;
        if(d<R && d>0.001){
          const f=(1-d/R);
          const inv=1/d;
          if(ptr.down){
            // coax bubbles into a swirling gather around the finger
            const tx=-dy*inv, ty=dx*inv;          // tangent
            b.vx += (-dx*inv*f*0.55 + tx*f*0.9)*dt;
            b.vy += (-dy*inv*f*0.55 + ty*f*0.9)*dt;
          } else {
            // push away like a breath, scaled by pointer speed
            const force = f*f*(0.4 + ptr.speed*0.06);
            b.vx += dx*inv*force*dt;
            b.vy += dy*inv*force*dt;
          }
          b.ph += f*0.01*dt;                       // shimmer shifts under touch
        }
      }

      // integrate
      b.vx*=damp; b.vy*=damp;
      const sp=Math.hypot(b.vx,b.vy);
      const maxv=DIAG*0.012;
      if(sp>maxv){ b.vx*=maxv/sp; b.vy*=maxv/sp; }
      b.px=b.x; b.py=b.y;
      b.x+=b.vx*dt; b.y+=b.vy*dt;

      // walls (soft)
      const m=b.r;
      if(b.x<m){ b.x=m; b.vx=Math.abs(b.vx)*0.5; }
      if(b.x>W-m){ b.x=W-m; b.vx=-Math.abs(b.vx)*0.5; }
      if(b.y<m){ b.y=m; b.vy=Math.abs(b.vy)*0.5; }
      if(b.y>H-m){ b.y=H-m; b.vy=-Math.abs(b.vy)*0.5; }

      // wobble & phase drift
      b.wob += b.wobr*dt*0.6;
      b.ph += (b.spin + sp*0.0009)*dt;
      if(b.ph>1)b.ph-=1; if(b.ph<0)b.ph+=1;
      b.age += dt;

      // grow back toward base (after merges) — subtle
      b.r += (b.r0 - b.r)*0.01*dt;

      // popping animation -> respawn
      if(b.popping){
        b.popping += 0.06*dt;
        b.r *= Math.pow(0.86, dt);
        if(b.popping>2.2){
          // respawn somewhere fresh, off-edge, small -> grows
          respawn(b);
        }
      }
    }

    // occasional spontaneous merge (two touching small bubbles coalesce)
    if(Math.random()<0.04*dt && bubbles.length>40){
      const i=(Math.random()*bubbles.length)|0;
      const b=bubbles[i];
      if(!b.popping){
        const cx=(b.x/cell)|0, cy=(b.y/cell)|0;
        let found=-1;
        outer:
        for(let oy=-1;oy<=1;oy++) for(let ox=-1;ox<=1;ox++){
          const nx=cx+ox, ny=cy+oy;
          if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
          let j=grid[ny*cols+nx];
          while(j!=null){
            if(j!==i){ const o=bubbles[j];
              if(!o.popping && Math.hypot(o.x-b.x,o.y-b.y) < (b.r+o.r)*1.02
                 && (b.r+o.r) < DIAG*0.075){ found=j; break outer; }
            }
            j=bubbles[j]._n;
          }
        }
        if(found>=0){
          const o=bubbles[found];
          // conserve area -> new radius
          const nr=Math.sqrt(b.r*b.r + o.r*o.r);
          b.r0 = b.r = nr; b.tr=nr; b.mass=nr*nr;
          b.x=(b.x*b.mass+o.x*o.mass)/(b.mass+o.mass+0.001);
          // tiny shimmer at merge
          popFx.push({x:o.x,y:o.y,vx:0,vy:0,r:o.r*0.8,ph:o.ph,life:1,decay:0.07,kind:1});
          respawn(o);
        }
      }
    }

    render(dt);
    requestAnimationFrame(step);
  }
  let fps_last=performance.now();

  function respawn(b){
    const rMin=DIAG*0.012, rMax=DIAG*0.05;
    b.r0 = rMin + Math.pow(Math.random(),1.7)*(rMax-rMin);
    b.r = b.r0*0.2; b.tr=b.r0; b.mass=b.r0*b.r0;
    // come in from an edge based on tilt direction
    const edge=Math.random();
    if(tilt>0.2 && Math.random()<0.6){ b.x=-b.r0; b.y=Math.random()*H; }
    else if(tilt<-0.2 && Math.random()<0.6){ b.x=W+b.r0; b.y=Math.random()*H; }
    else { b.x=Math.random()*W; b.y=H+b.r0; }
    b.px=b.x; b.py=b.y;
    b.vx=(Math.random()-.5)*0.3; b.vy=-0.2-Math.random()*0.3;
    b.ph=Math.random(); b.popping=0; b.age=0;
  }

  // ---------- bloom buffer (offscreen, low-res) ----------
  let bloom=null, bctx=null, BW=0, BH=0, BScale=0.26;
  function makeBloom(){
    BW = Math.max(2, Math.floor(W*BScale));
    BH = Math.max(2, Math.floor(H*BScale));
    if(!bloom){ bloom=document.createElement('canvas'); bctx=bloom.getContext('2d'); }
    bloom.width=BW; bloom.height=BH;
  }
  makeBloom();

  // cached white radial glow sprite (tinted via globalAlpha+fill color at draw)
  // we keep a small set of hue sprites to avoid per-bubble gradient allocation.
  const GLOW_N=24, GLOW_SZ=64;
  const glowSprites=[];
  function buildGlow(){
    glowSprites.length=0;
    for(let i=0;i<GLOW_N;i++){
      const c=document.createElement('canvas'); c.width=c.height=GLOW_SZ;
      const g=c.getContext('2d');
      const col=filmColor(i/GLOW_N, 0.95, 1);
      const grd=g.createRadialGradient(GLOW_SZ/2,GLOW_SZ/2,GLOW_SZ*0.08, GLOW_SZ/2,GLOW_SZ/2,GLOW_SZ/2);
      grd.addColorStop(0, rgb(col[0],col[1],col[2],1));
      grd.addColorStop(0.4, rgb(col[0],col[1],col[2],0.4));
      grd.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=grd; g.fillRect(0,0,GLOW_SZ,GLOW_SZ);
      glowSprites.push(c);
    }
  }
  buildGlow();

  // cached specular highlight sprite (white glass dot, fixed shape)
  let specSprite=null;
  (function buildSpec(){
    const S=64; const c=document.createElement('canvas'); c.width=c.height=S;
    const g=c.getContext('2d');
    const grd=g.createRadialGradient(S/2,S/2,0, S/2,S/2,S/2);
    grd.addColorStop(0,'rgba(255,255,255,1)');
    grd.addColorStop(0.5,'rgba(228,240,255,0.30)');
    grd.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=grd; g.fillRect(0,0,S,S);
    specSprite=c;
  })();

  // cached inner-gel sprites per hue bucket (offset-lit two-tone disc)
  const GEL_N=24, GEL_SZ=80;
  const gelSprites=[];
  (function buildGel(){
    for(let i=0;i<GEL_N;i++){
      const c=document.createElement('canvas'); c.width=c.height=GEL_SZ;
      const g=c.getContext('2d');
      const cA=filmColor(i/GEL_N, 0.85, 1);
      const cB=filmColor((i/GEL_N+0.34)%1, 0.85, 1);
      const cx=GEL_SZ*0.36, cy=GEL_SZ*0.36, R=GEL_SZ*0.5;
      const grd=g.createRadialGradient(cx,cy,R*0.05, GEL_SZ/2,GEL_SZ/2,R);
      grd.addColorStop(0, rgb(cA[0],cA[1],cA[2], 1));
      grd.addColorStop(0.55, rgb(cB[0]*0.7,cB[1]*0.7,cB[2]*0.85, 0.68));
      grd.addColorStop(0.92, rgb(cB[0],cB[1],cB[2], 0.30));
      grd.addColorStop(1,'rgba(0,0,0,0)');
      // clip to circle so edges stay round
      g.save(); g.beginPath(); g.arc(GEL_SZ/2,GEL_SZ/2,R,0,6.2832); g.clip();
      g.fillStyle=grd; g.fillRect(0,0,GEL_SZ,GEL_SZ); g.restore();
      gelSprites.push(c);
    }
  })();

  // ---------- render ----------
  function render(dt){
    // backdrop: deep iridescent wash + slow aurora bands
    ctx.globalCompositeOperation='source-over';
    const bg=ctx.createLinearGradient(0,0,W*0.5,H);
    bg.addColorStop(0,'#060812');
    bg.addColorStop(0.55,'#0a0816');
    bg.addColorStop(1,'#04050b');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    // drifting aurora bands (so dark areas live + read as wet film)
    ctx.globalCompositeOperation='lighter';
    for(let k=0;k<3;k++){
      const ph=(tSec*0.03 + k*0.33)%1;
      const c=filmColor(ph,0.7,1);
      const cx=W*(0.5+0.4*Math.sin(tSec*0.07+k*2.1));
      const cy=H*(0.45+0.4*Math.cos(tSec*0.05+k*1.7));
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,DIAG*0.55);
      g.addColorStop(0, rgb(c[0],c[1],c[2],0.10));
      g.addColorStop(0.6, rgb(c[0]*0.5,c[1]*0.5,c[2]*0.7,0.04));
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    }

    // glow following pointer / center
    const gx = ptr.active? ptr.x : W*0.5 + Math.cos(tSec*0.3)*W*0.12;
    const gy = ptr.active? ptr.y : H*0.42 + Math.sin(tSec*0.24)*H*0.1;
    const ng=ctx.createRadialGradient(gx,gy,0,gx,gy,DIAG*0.5);
    ng.addColorStop(0,'rgba(70,95,160,0.16)');
    ng.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ng; ctx.fillRect(0,0,W,H);

    // prepare bloom buffer
    const BLOOM = window.__bloomOn;
    if(BLOOM){
      bctx.setTransform(1,0,0,1,0,0);
      bctx.globalCompositeOperation='source-over';
      bctx.clearRect(0,0,BW,BH);
      bctx.scale(BScale,BScale);
      bctx.globalCompositeOperation='lighter';
    }

    // ---- bubbles: additive iridescent shells ----
    ctx.globalCompositeOperation='lighter';

    for(let i=0;i<bubbles.length;i++){
      const b=bubbles[i];
      if(b.r<1.2) continue;
      const wob = 1 + Math.sin(b.wob)*b.wobr*0.4;
      const r = b.r*wob;
      const x=b.x, y=b.y;
      const fade = b.popping ? Math.max(0,1-(b.popping-1)/1.2) : Math.min(1,b.age*0.05+0.22);

      // colored gel interior — cached glowing film disc (dual-tone, offset-lit)
      const gli=((((b.ph)%1)*GEL_N)|0)%GEL_N;
      const gd=r*2;
      ctx.globalAlpha=0.34*fade;
      ctx.drawImage(gelSprites[gli], x-r, y-r, gd, gd);
      ctx.globalAlpha=1;

      // iridescent rim — signature thin-film bands (3 hue-shifted arcs)
      const rimW = Math.max(1.5, r*0.22);
      ctx.lineWidth = rimW;
      for(let k=0;k<3;k++){
        const rr = r - rimW*0.4 - k*rimW*0.5;
        if(rr<=0.5) break;
        const ph=(b.ph + k*0.18 + 0.02)%1;
        const c=filmColor(ph, 0.98, 1.14);
        ctx.strokeStyle = rgb(c[0],c[1],c[2], (0.34 - k*0.06)*fade);
        ctx.beginPath();
        ctx.arc(x,y, rr, 0, 6.2832);
        ctx.stroke();
      }

      // bright crest line at the very edge — the oil-slick highlight
      const ce=filmColor((b.ph+0.5)%1, 0.85, 1.25);
      ctx.lineWidth=Math.max(1, r*0.04);
      ctx.strokeStyle=rgb(ce[0],ce[1],ce[2], 0.55*fade);
      ctx.beginPath(); ctx.arc(x,y,r*0.985,0,6.2832); ctx.stroke();

      // specular highlight (cached glass dot)
      const hx=x - r*0.40, hy=y - r*0.40, hr=r*0.45;
      ctx.globalAlpha=0.62*fade;
      ctx.drawImage(specSprite, hx-hr, hy-hr, hr*2, hr*2);
      ctx.globalAlpha=1;

      // crisp sub-highlight for wet realism
      ctx.fillStyle=`rgba(255,255,255,${0.34*fade})`;
      ctx.beginPath(); ctx.arc(x - r*0.16, y - r*0.52, r*0.075, 0, 6.2832); ctx.fill();

      // --- deposit a glowing blob into the bloom buffer (cached hue sprite) ---
      if(BLOOM){
        const gi=((((b.ph+0.25)%1)*GLOW_N)|0)%GLOW_N;
        const bd=r*2.3;
        bctx.globalAlpha=0.5*fade;
        bctx.drawImage(glowSprites[gi], x-bd*0.5, y-bd*0.5, bd, bd);
      }
    }
    if(BLOOM) bctx.globalAlpha=1;

    // ---- pop fx ----
    for(let i=popFx.length-1;i>=0;i--){
      const p=popFx[i];
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      p.vy+=0.04*dt;          // droplets fall
      p.vx*=Math.pow(0.96,dt); p.vy*=Math.pow(0.96,dt);
      p.life-=p.decay*dt;
      if(p.life<=0){ popFx.splice(i,1); continue; }
      const c=filmColor(p.ph,0.98,1.15);
      if(p.kind===1){
        // expanding shimmer ring
        const rr=p.r*(1+(1-p.life)*2.0);
        ctx.lineWidth=Math.max(0.8, p.r*0.14*p.life);
        ctx.strokeStyle=rgb(c[0],c[1],c[2], 0.55*p.life);
        ctx.beginPath(); ctx.arc(p.x,p.y,rr,0,6.2832); ctx.stroke();
        // bloom contribution
        if(BLOOM){
          bctx.strokeStyle=rgb(c[0],c[1],c[2], 0.5*p.life);
          bctx.lineWidth=Math.max(0.6,p.r*0.12*p.life);
          bctx.beginPath(); bctx.arc(p.x,p.y,rr,0,6.2832); bctx.stroke();
        }
      } else {
        // droplet
        const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.2);
        g.addColorStop(0,rgb(c[0],c[1],c[2],0.85*p.life));
        g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=g;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r*2.2,0,6.2832); ctx.fill();
        if(BLOOM){ bctx.fillStyle=g;
          bctx.beginPath(); bctx.arc(p.x,p.y,p.r*2.2,0,6.2832); bctx.fill(); }
      }
    }

    // ---- composite bloom back (upscaled & blurred via smoothing) ----
    if(BLOOM){
      ctx.globalCompositeOperation='lighter';
      ctx.imageSmoothingEnabled=true;
      ctx.globalAlpha=0.95;
      ctx.drawImage(bloom, 0,0,BW,BH, 0,0,W,H);
      ctx.globalAlpha=1;
    }

    // pointer aura
    if(ptr.active){
      ctx.globalCompositeOperation='lighter';
      const ar = ptr.down? DIAG*0.08 : DIAG*0.05;
      const pa=ctx.createRadialGradient(ptr.x,ptr.y,0,ptr.x,ptr.y,ar);
      pa.addColorStop(0,'rgba(190,215,255,0.13)');
      pa.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=pa;
      ctx.beginPath(); ctx.arc(ptr.x,ptr.y,ar,0,6.2832); ctx.fill();
    }
  }

  // adaptive perf governor: thin bubbles + drop bloom when sustained-slow.
  let lowT=0;
  let FLOOR=Math.max(36, Math.floor(targetCount()*0.55));
  window.__bloomOn = true;
  setInterval(()=>{
    if(fps<48){
      lowT++;
      if(lowT>=2){
        if(window.__bloomOn && fps<30){ window.__bloomOn=false; }        // first sacrifice: bloom
        else if(bubbles.length>FLOOR){ bubbles.splice(bubbles.length-10); }
        lowT=0;
      }
    } else { lowT=0; }
  }, 1800);

  // first paint immediately, then loop
  render(1);
  requestAnimationFrame(step);

  // expose for verification
  window.__foam = { get count(){return bubbles.length;}, get fps(){return fps;}, pop:tryPop };
})();
</script>
</body>
</html>
