<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>FLOSS · 살아있는 자수 직조기</title>
<style>
  :root{ color-scheme: dark; }
  html,body{margin:0;height:100%;background:#0a0a0d;overflow:hidden;
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    -webkit-tap-highlight-color:transparent;touch-action:none;cursor:none;}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;}
  /* HUD */
  #hud{position:fixed;left:18px;top:16px;z-index:5;pointer-events:none;
    color:#efe7d6;mix-blend-mode:screen;user-select:none;}
  #hud h1{margin:0;font-size:13px;letter-spacing:.42em;font-weight:600;
    text-transform:uppercase;opacity:.92;}
  #hud .sub{margin-top:5px;font-size:10px;letter-spacing:.22em;opacity:.5;}
  #tip{position:fixed;left:18px;bottom:16px;z-index:5;pointer-events:none;
    color:#cdbfa5;font-size:10px;letter-spacing:.14em;opacity:.62;line-height:1.7;
    mix-blend-mode:screen;user-select:none;max-width:60vw;}
  #tip b{color:#ffd9a0;font-weight:600;}
  #pal{position:fixed;right:16px;top:16px;z-index:5;display:flex;gap:7px;}
  .sw{width:16px;height:16px;border-radius:50%;cursor:pointer;
    box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 2px 6px rgba(0,0,0,.5);
    transition:transform .25s cubic-bezier(.3,1.4,.5,1),box-shadow .25s;}
  .sw:hover{transform:scale(1.22);}
  .sw.on{transform:scale(1.32);box-shadow:0 0 0 2px #fff inset,0 0 14px rgba(255,255,255,.5);}
  #brand{position:fixed;right:16px;bottom:14px;z-index:5;pointer-events:none;
    color:#7a6f5c;font-size:9px;letter-spacing:.4em;opacity:.55;}
  @media (max-width:560px){
    #hud h1{font-size:11px;letter-spacing:.3em;}
    #tip{font-size:9px;max-width:75vw;}
    .sw{width:20px;height:20px;}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud">
  <h1>FLOSS</h1>
  <div class="sub">살아있는 자수 · 직조 제너러티브</div>
</div>
<div id="pal"></div>
<div id="tip">
  <b>끌어보세요</b> — 바늘이 천을 수놓습니다 &nbsp;·&nbsp; <b>스크롤</b> 실의 장력 &nbsp;·&nbsp; <b>탭/클릭</b> 매듭의 파동
</div>
<div id="brand">PRAY FOR FABLE</div>

<script>
"use strict";
(()=>{
const cv=document.getElementById('stage');
const g=cv.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1;
const QV=document.getElementById('pal');

/* ───────── 팔레트: 자수 실 색조합 ───────── */
const PALS=[
  {name:'단풍',  bg:'#100b0a', cloth:'#2a201b', threads:['#ff5d3c','#ffa24b','#ffd36b','#e8456b','#b5365e','#7d2150','#ffe9c4']},
  {name:'청옥',  bg:'#070d0e', cloth:'#15252a', threads:['#3df0c8','#27c4d6','#3a7bff','#6affc0','#aef7e6','#1d6f8c','#e9fff7']},
  {name:'자운',  bg:'#0c0815', cloth:'#221a33', threads:['#b673ff','#ff6fd8','#7d5bff','#ffadf0','#5a3bd6','#d9b4ff','#fff0ff']},
  {name:'들녘',  bg:'#0a0d07', cloth:'#1d2415', threads:['#c7e84a','#79c443','#f2d24b','#ff9d3c','#bff36a','#3f8a3a','#f4ffd9']},
];
let pi=0;
function P(){return PALS[pi];}

/* ───────── 격자 / 직물 모델 ───────── */
let CELL=22;          // 한 스티치 격자 크기(px, css)
let cols=0, rows=0;
let baseField=null;   // 패턴 결정용 flow field 캐시
let stitches=null;    // Float/Int 배열 평면화
// 각 셀: alive(0/1), color idx, phase, seedTime, strength
let sAlive, sCol, sPh, sBorn, sStr;
let totalCells=0;

function buildGrid(){
  cols=Math.ceil(W/DPR/CELL)+1;
  rows=Math.ceil(H/DPR/CELL)+1;
  totalCells=cols*rows;
  sAlive=new Uint8Array(totalCells);
  sCol  =new Uint8Array(totalCells);
  sPh   =new Float32Array(totalCells);
  sBorn =new Float32Array(totalCells);
  sStr  =new Float32Array(totalCells);
  seedPattern();
}

/* 도메인-워프 노이즈 비슷한 결정적 필드로 초기 자수 무늬 심기 */
function hash2(x,y){
  let h=Math.sin(x*127.1+y*311.7)*43758.5453;
  return h-Math.floor(h);
}
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y);
  const xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y){
  let s=0,a=.5,f=1;
  for(let i=0;i<4;i++){s+=a*vnoise(x*f,y*f);f*=2;a*=.5;}
  return s;
}

let patSeed=Math.random()*1000;
function seedPattern(){
  const cx=cols/2, cy=rows/2;
  const nT=P().threads.length;
  let count=0;
  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      const i=y*cols+x;
      // 도메인 워프로 유기적 자수 모티프
      const wx=fbm(x*0.12+patSeed, y*0.12)*2.2;
      const wy=fbm(x*0.12+5.2, y*0.12+patSeed)*2.2;
      const n=fbm(x*0.085+wx, y*0.085+wy);
      // 방사 대칭으로 만다라 같은 견고함 약간 가미
      const dx=(x-cx)/cols, dy=(y-cy)/rows;
      const ring=Math.sin(Math.sqrt(dx*dx+dy*dy)*16 - patSeed)*0.5+0.5;
      const v=n*0.72+ring*0.28;
      const alive=v>0.52?1:0;
      sAlive[i]=alive;
      if(alive){
        // 색은 값 밴드로 -> 색끼리 자연스러운 영역 형성
        let ci=Math.floor(((v-0.52)/0.48)*nT*1.3 + fbm(x*0.3,y*0.3)*1.5)%nT;
        if(ci<0)ci+=nT;
        sCol[i]=ci;
        sPh[i]=hash2(x*3.1,y*7.7)*Math.PI*2;
        sBorn[i]=-Math.random()*1.2; // 첫 페인트에 이미 다 핀 상태
        sStr[i]=0.75+hash2(x+9,y+3)*0.25;
        count++;
      }
    }
  }
  return count;
}

/* 새 팔레트로 색만 다시 매핑(무늬 유지) */
function recolor(){
  const nT=P().threads.length;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const i=y*cols+x;
    if(sAlive[i]){
      let ci=(sCol[i]+ (P().threads.length))%nT;
      sCol[i]=ci%nT;
    }
  }
}

/* ───────── 입력 ───────── */
const pointer={x:-999,y:-999,px:-999,py:-999,down:false,vx:0,vy:0,active:false};
let tension=1.0;          // 스크롤로 변하는 실 장력(스티치 크기/촘촘함)
let tensionTarget=1.0;
let globalTime=0;
const ripples=[];         // {x,y,t,strength}

function setPointer(x,y){
  pointer.px=pointer.x; pointer.py=pointer.y;
  pointer.x=x; pointer.y=y;
  pointer.vx=pointer.x-pointer.px;
  pointer.vy=pointer.y-pointer.py;
  pointer.active=true;
}
function embroiderAt(x,y){
  // 포인터 주변 셀을 새로 수놓거나 색을 바꿈
  const gx=Math.floor(x/CELL), gy=Math.floor(y/CELL);
  const rad=2;
  const nT=P().threads.length;
  for(let oy=-rad;oy<=rad;oy++)for(let ox=-rad;ox<=rad;ox++){
    const cxx=gx+ox, cyy=gy+oy;
    if(cxx<0||cyy<0||cxx>=cols||cyy>=rows)continue;
    const d=Math.hypot(ox,oy);
    if(d>rad+0.3)continue;
    const i=cyy*cols+cxx;
    if(Math.random()<(1-d/(rad+1))*0.85){
      if(!sAlive[i]){
        sAlive[i]=1;
        sCol[i]=(Math.floor(globalTime*2.2)+ox+oy*3)%nT;
        if(sCol[i]<0)sCol[i]+=nT;
        sPh[i]=Math.random()*Math.PI*2;
        sStr[i]=0.85+Math.random()*0.15;
      }
      // 새로 그려진 건 막 태어난 듯 팝
      sBorn[i]=globalTime;
    }
  }
}

window.addEventListener('pointermove',e=>{
  setPointer(e.clientX,e.clientY);
  if(pointer.down) embroiderAt(e.clientX,e.clientY);
},{passive:true});
window.addEventListener('pointerdown',e=>{
  pointer.down=true; setPointer(e.clientX,e.clientY);
  ripples.push({x:e.clientX,y:e.clientY,t:globalTime,strength:1});
  embroiderAt(e.clientX,e.clientY);
});
window.addEventListener('pointerup',()=>{pointer.down=false;});
window.addEventListener('pointerleave',()=>{pointer.active=false;pointer.down=false;});
window.addEventListener('wheel',e=>{
  tensionTarget=Math.max(0.6,Math.min(1.7,tensionTarget+ (e.deltaY>0?0.08:-0.08)));
},{passive:true});
// 터치: 두 손가락 핀치는 장력
let pinchBase=0;
window.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    pinchBase=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  }
},{passive:true});
window.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pinchBase>0){tensionTarget=Math.max(0.6,Math.min(1.7,tensionTarget*(1+ (d-pinchBase)/600)));}
    pinchBase=d;
  }
},{passive:true});

/* ───────── 직물(천) 베이스: 워프/웨프트 위빙 ───────── */
let clothCanvas=null, clothCtx=null;
function buildCloth(){
  clothCanvas=document.createElement('canvas');
  clothCanvas.width=cv.width; clothCanvas.height=cv.height;
  clothCtx=clothCanvas.getContext('2d');
  const c=clothCtx;
  c.setTransform(DPR,0,0,DPR,0,0);
  const w=W/DPR,h=H/DPR;
  // 바탕
  c.fillStyle=P().bg; c.fillRect(0,0,w,h);
  // 비네트 천
  const grd=c.createRadialGradient(w*0.5,h*0.42,Math.min(w,h)*0.1, w*0.5,h*0.5,Math.max(w,h)*0.78);
  grd.addColorStop(0,P().cloth);
  grd.addColorStop(1,P().bg);
  c.fillStyle=grd; c.fillRect(0,0,w,h);
  // 직조 결: 가로/세로 실의 over-under
  const step=CELL/2.0;
  c.lineWidth=1;
  for(let y=0;y<=h;y+=step){
    const shade=((Math.round(y/step))%2===0)?0.10:0.04;
    c.strokeStyle=`rgba(255,250,235,${shade})`;
    c.beginPath();c.moveTo(0,y+0.5);c.lineTo(w,y+0.5);c.stroke();
    c.strokeStyle=`rgba(0,0,0,${shade*1.3})`;
    c.beginPath();c.moveTo(0,y+step/2+0.5);c.lineTo(w,y+step/2+0.5);c.stroke();
  }
  for(let x=0;x<=w;x+=step){
    const shade=((Math.round(x/step))%2===0)?0.07:0.03;
    c.strokeStyle=`rgba(255,250,235,${shade})`;
    c.beginPath();c.moveTo(x+0.5,0);c.lineTo(x+0.5,h);c.stroke();
    c.strokeStyle=`rgba(0,0,0,${shade})`;
    c.beginPath();c.moveTo(x+step/2+0.5,0);c.lineTo(x+step/2+0.5,h);c.stroke();
  }
  // 천 미세 노이즈(살짝)
  c.globalAlpha=0.05;
  for(let k=0;k<2200;k++){
    const px=Math.random()*w, py=Math.random()*h;
    c.fillStyle=Math.random()<0.5?'#ffffff':'#000000';
    c.fillRect(px,py,1,1);
  }
  c.globalAlpha=1;
}

/* ───────── 색 유틸 ───────── */
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function shade(rgb,f){return`rgb(${Math.max(0,Math.min(255,rgb[0]*f|0))},${Math.max(0,Math.min(255,rgb[1]*f|0))},${Math.max(0,Math.min(255,rgb[2]*f|0))})`;}

/* ───────── 한 땀(크로스 스티치) 그리기 ───────── */
function drawStitch(cxp,cyp,size,rgb,glow,phase,sheen){
  const half=size*0.5;
  const tw=Math.max(1.4,size*0.22); // 실 두께
  // 그림자(천에 눌린 자국)
  g.lineCap='round';
  g.strokeStyle='rgba(0,0,0,0.42)';
  g.lineWidth=tw+1.4;
  g.beginPath();
  g.moveTo(cxp-half+1.0,cyp-half+1.6);g.lineTo(cxp+half+1.0,cyp+half+1.6);
  g.moveTo(cxp+half+1.0,cyp-half+1.6);g.lineTo(cxp-half+1.0,cyp+half+1.6);
  g.stroke();
  // 아래쪽 대각(\) 먼저
  g.strokeStyle=shade(rgb,0.72);
  g.lineWidth=tw;
  g.beginPath();
  g.moveTo(cxp-half,cyp-half);g.lineTo(cxp+half,cyp+half);
  g.stroke();
  // 위쪽 대각(/) — 위에 얹힘
  g.strokeStyle=shade(rgb,1.0);
  g.lineWidth=tw;
  g.beginPath();
  g.moveTo(cxp+half,cyp-half);g.lineTo(cxp-half,cyp+half);
  g.stroke();
  // 광택 하이라이트(실 사틴 느낌)
  if(sheen>0.01){
    g.strokeStyle=`rgba(255,255,255,${0.22*sheen})`;
    g.lineWidth=Math.max(0.7,tw*0.32);
    g.beginPath();
    g.moveTo(cxp+half*0.7,cyp-half*0.7);g.lineTo(cxp-half*0.7,cyp+half*0.7);
    g.stroke();
  }
  // 발광(상호작용 시) — shadowBlur 대신 가산 다중 스트로크(GPU/소프트웨어 모두 빠름)
  if(glow>0.01){
    g.globalCompositeOperation='lighter';
    // 넓고 흐린 후광 한 겹 + 밝은 코어 한 겹
    g.strokeStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${0.16*glow})`;
    g.lineWidth=tw*2.4;
    g.beginPath();
    g.moveTo(cxp-half,cyp-half);g.lineTo(cxp+half,cyp+half);
    g.moveTo(cxp+half,cyp-half);g.lineTo(cxp-half,cyp+half);
    g.stroke();
    g.strokeStyle=`rgba(255,250,235,${0.5*glow})`;
    g.lineWidth=tw*0.7;
    g.beginPath();
    g.moveTo(cxp-half,cyp-half);g.lineTo(cxp+half,cyp+half);
    g.moveTo(cxp+half,cyp-half);g.lineTo(cxp-half,cyp+half);
    g.stroke();
    g.globalCompositeOperation='source-over';
  }
}

/* ───────── 메인 렌더 ───────── */
let last=performance.now();
let fpsAcc=0,fpsCount=0,fps=60;

function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  globalTime+=dt;
  fpsAcc+=dt;fpsCount++;
  if(fpsAcc>0.5){fps=fpsCount/fpsAcc;fpsAcc=0;fpsCount=0;}

  tension+=(tensionTarget-tension)*Math.min(1,dt*4);

  const w=W/DPR,h=H/DPR;
  // 천 베이스
  g.setTransform(DPR,0,0,DPR,0,0);
  g.drawImage(clothCanvas,0,0,w,h);

  const threads=P().threads.map(hex2rgb);
  const nT=threads.length;

  const pgx=pointer.x, pgy=pointer.y;
  const breath=0.5+0.5*Math.sin(globalTime*0.7); // 천이 숨쉼

  // ripples 갱신
  for(let r=ripples.length-1;r>=0;r--){
    if(globalTime-ripples[r].t>2.2)ripples.splice(r,1);
  }

  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      const i=y*cols+x;
      if(!sAlive[i])continue;
      let bx=x*CELL+CELL*0.5;
      let by=y*CELL+CELL*0.5;

      // 태어남 애니메이션(팝인)
      const age=globalTime-sBorn[i];
      let birth=age<0?1:Math.min(1,age/0.5);
      const ease=birth<1?(1-Math.pow(1-birth,3)):1;

      // 잔물결(클릭) 영향 — ripples 있을 때만
      let rippleLift=0, glow=0;
      for(let r=0;r<ripples.length;r++){
        const rp=ripples[r];
        const dx2=bx-rp.x, dy2=by-rp.y;
        const dd=Math.sqrt(dx2*dx2+dy2*dy2);
        const t=globalTime-rp.t;
        const front=t*340; // 파면 속도
        const band=Math.abs(dd-front);
        if(band<46){
          const inten=(1-band/46)*Math.max(0,1-t/2.0)*rp.strength;
          rippleLift+=inten*7;
          if(inten*0.9>glow)glow=inten*0.9;
        }
      }

      // 포인터 근접: 부풀고 빛남
      let lift=0;
      if(pointer.active){
        const dx3=bx-pgx, dy3=by-pgy;
        const dd2=dx3*dx3+dy3*dy3;
        if(dd2<14400){ // 120^2
          const f=1-Math.sqrt(dd2)/120;
          const ng=f*f;
          lift=ng*5;
          if(ng*0.85>glow)glow=ng*0.85;
        }
      }

      // 미세한 직물 호흡으로 위치 흔들림
      const wob=fbm(x*0.2+globalTime*0.25, y*0.2);
      bx+=Math.sin(globalTime*0.9+sPh[i])*0.6 + (wob-0.5)*1.4;
      by+=Math.cos(globalTime*0.8+sPh[i]*1.3)*0.6 - rippleLift - lift;

      // 크기: 장력 + 호흡 + 태어남 + 강도
      const sizeBase=CELL*0.92;
      const pulse=1+0.06*Math.sin(globalTime*1.6+sPh[i]);
      const size=sizeBase*tension*pulse*sStr[i]*ease;
      if(size<2)continue;

      // sheen: 실 각도에 따른 광택(빛이 좌상단에서 온다고 가정)
      const sheen=0.4+0.6*Math.max(0,Math.sin(sPh[i]+globalTime*0.5));

      const rgb=threads[sCol[i]%nT];
      drawStitch(bx,by,size,rgb,glow,sPh[i],sheen);
    }
  }

  // 바늘(커서) — 실을 끌고 다니는 바느질 바늘
  if(pointer.active && pgx>-500){
    g.save();
    g.translate(pgx,pgy);
    // 실 꼬리
    g.globalCompositeOperation='lighter';
    const tcol=threads[Math.floor(globalTime*2)%nT];
    g.strokeStyle=`rgba(${tcol[0]},${tcol[1]},${tcol[2]},0.5)`;
    g.lineWidth=2;
    g.beginPath();
    g.moveTo(0,0);
    let lx=0,ly=0;
    for(let k=1;k<=10;k++){
      lx=-pointer.vx*k*0.55 + Math.sin(globalTime*6+k)*4;
      ly=-pointer.vy*k*0.55 + Math.cos(globalTime*6+k)*4 + k*1.2;
      g.lineTo(lx,ly);
    }
    g.stroke();
    g.globalCompositeOperation='source-over';
    // 바늘 본체
    g.rotate(-0.6);
    g.strokeStyle='rgba(235,235,245,0.95)';
    g.lineWidth=2.4;
    g.beginPath();g.moveTo(-2,-2);g.lineTo(14,-16);g.stroke();
    g.fillStyle='#fff';
    g.beginPath();g.arc(-2,-2,2.4,0,7);g.fill();
    // 바늘귀
    g.strokeStyle='rgba(255,255,255,0.7)';g.lineWidth=1;
    g.beginPath();g.ellipse(12,-13.5,1.6,2.4,-0.6,0,7);g.stroke();
    g.restore();
  }

  // HUD: 장력/fps 표시(아주 옅게, 텍스트는 hud에)
  requestAnimationFrame(frame);
}

/* ───────── 팔레트 UI ───────── */
function buildPal(){
  QV.innerHTML='';
  PALS.forEach((p,idx)=>{
    const s=document.createElement('div');
    s.className='sw'+(idx===pi?' on':'');
    s.style.background=`conic-gradient(${p.threads.slice(0,5).join(',')})`;
    s.title=p.name;
    s.addEventListener('click',()=>{ switchPal(idx); });
    s.addEventListener('pointerdown',e=>e.stopPropagation());
    QV.appendChild(s);
  });
}
function switchPal(idx){
  pi=idx;
  // 색 영역 유지하면서 새 팔레트 적용
  [...QV.children].forEach((el,k)=>el.classList.toggle('on',k===idx));
  buildCloth();
  // sCol 은 인덱스 기반이라 그대로 두면 새 팔레트 색으로 자동 매핑됨
  ripples.push({x:W/DPR/2,y:H/DPR/2,t:globalTime,strength:1.3});
}

/* ───────── 리사이즈 ───────── */
function resize(){
  DPR=Math.min(2, window.devicePixelRatio||1);
  W=Math.floor(window.innerWidth*DPR);
  H=Math.floor(window.innerHeight*DPR);
  cv.width=W; cv.height=H;
  cv.style.width=window.innerWidth+'px';
  cv.style.height=window.innerHeight+'px';
  // 화면 크기에 따라 셀 자동(성능 캡)
  const cssMin=Math.min(window.innerWidth,window.innerHeight);
  CELL = cssMin<560 ? 20 : (window.innerWidth>1700?24:22);
  buildGrid();
  buildCloth();
}
window.addEventListener('resize',()=>{ clearTimeout(window.__rt); window.__rt=setTimeout(resize,120); });

/* ───────── 시작 ───────── */
buildPal();
resize();
// 부드러운 자동 입장: 가운데서 작은 파동 하나(첫 페인트는 이미 완성된 자수)
ripples.push({x:0,y:0,t:0,strength:0.0});
requestAnimationFrame(frame);

// 테스트 훅
window.__floss={
  state:()=>({cols,rows,alive:sAlive.reduce((a,b)=>a+b,0),tension,pal:P().name,fps:Math.round(fps)}),
  pal:(n)=>switchPal(n%PALS.length),
  embroider:(x,y)=>{pointer.active=true;embroiderAt(x,y);},
  ripple:(x,y)=>ripples.push({x,y,t:globalTime,strength:1}),
  setTension:(t)=>{tensionTarget=t;},
};
})();
</script>
