<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EMBER — fractal flame</title>
<style>
  :root{ color-scheme: dark; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#05030a; }
  body{
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  #stage{ position:fixed; inset:0; display:block; }
  /* the visible canvas — composited */
  canvas#view{ position:fixed; inset:0; width:100%; height:100%; display:block;
    image-rendering:auto; cursor:crosshair; }
  /* vignette + grain overlay */
  #vig{ position:fixed; inset:0; pointer-events:none; mix-blend-mode:multiply;
    background:radial-gradient(120% 120% at 50% 42%, rgba(255,255,255,0) 40%, rgba(0,0,0,.18) 72%, rgba(0,0,0,.62) 100%);
  }
  #hud{ position:fixed; left:18px; bottom:14px; pointer-events:none; z-index:10;
    color:#ffcaa0; letter-spacing:.14em; font-size:11px; line-height:1.7;
    text-shadow:0 0 12px rgba(255,90,20,.55), 0 1px 2px #000; opacity:.92;
    transition:opacity 1.2s ease; }
  #hud b{ color:#fff2e6; font-weight:700; letter-spacing:.28em; }
  #hud .dim{ color:#c98a6a; opacity:.75; }
  #title{ position:fixed; right:20px; top:16px; pointer-events:none; z-index:10;
    text-align:right; transition:opacity 2.2s ease; }
  #title .big{ font-size:30px; font-weight:800; letter-spacing:.5em;
    color:#fff; text-shadow:0 0 26px rgba(255,120,30,.8), 0 0 60px rgba(255,40,0,.5);
    -webkit-text-stroke:0px; }
  #title .sub{ font-size:10px; letter-spacing:.5em; color:#ffb37a; margin-top:6px;
    text-shadow:0 0 10px rgba(255,80,10,.6); }
  #fps{ position:fixed; left:18px; top:14px; z-index:10; pointer-events:none;
    font-size:10px; letter-spacing:.18em; color:#7a5a4a; opacity:.7; }
  .fade{ opacity:0 !important; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="vig"></div>
<div id="fps">—</div>
<div id="title"><div class="big">EMBER</div><div class="sub">FRACTAL · FLAME · IFS</div></div>
<div id="hud">
  <b>EMBER</b><br>
  <span class="dim">move</span> bend the gravity &nbsp; <span class="dim">drag</span> twist the field<br>
  <span class="dim">scroll</span> breathe in/out &nbsp; <span class="dim">click</span> ignite &nbsp; <span class="dim">space</span> reseed
</div>

<script>
(() => {
"use strict";
const view = document.getElementById('view');
const ctx2d = view.getContext('2d', { alpha:false, desynchronized:true });
const fpsEl = document.getElementById('fps');
const hud = document.getElementById('hud');
const titleEl = document.getElementById('title');

// ---------- sizing : low-res density grid, upscaled to screen ----------
let DPR = 1;
let W=0, H=0;        // device pixels of visible canvas
let GW=0, GH=0;      // accumulation grid (low res for speed)
let grid;            // Float32 [GW*GH*3]  -> r,g,b weighted hits
let histMax;         // Float32 [GW*GH] running not used; we track scalar
let imgData, img32;  // ImageData for the grid-sized output
let gridCanvas, gridCtx;
let bloomA, bloomCtxA, bloomB, bloomCtxB;   // downscaled blur buffers for cheap bloom

// fixed render budget for the upscaled image (keeps perf bounded)
function computeSizes(){
  const cssW = window.innerWidth, cssH = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = Math.round(cssW * DPR);
  H = Math.round(cssH * DPR);
  view.width = W; view.height = H;
  view.style.width = cssW+'px'; view.style.height = cssH+'px';
  // grid: cap longest side ~ 720 px for the chaos buffer. Phones get less.
  const longest = Math.max(cssW, cssH);
  const cap = longest < 520 ? 420 : (longest < 900 ? 520 : 600);
  const s = cap / longest;
  GW = Math.max(150, Math.round(cssW * s));
  GH = Math.max(150, Math.round(cssH * s));
  grid = new Float32Array(GW*GH*3);
  gridCanvas = gridCanvas || document.createElement('canvas');
  gridCanvas.width = GW; gridCanvas.height = GH;
  gridCtx = gridCanvas.getContext('2d', { alpha:false });
  imgData = gridCtx.createImageData(GW, GH);
  img32 = new Uint32Array(imgData.data.buffer);
  // bloom buffers : half- and quarter-resolution of the grid
  const bw = Math.max(40, GW>>1), bh = Math.max(40, GH>>1);
  bloomA = bloomA || document.createElement('canvas'); bloomA.width=bw; bloomA.height=bh;
  bloomCtxA = bloomA.getContext('2d',{alpha:true}); bloomCtxA.imageSmoothingEnabled=true; bloomCtxA.imageSmoothingQuality='high';
  bloomB = bloomB || document.createElement('canvas'); bloomB.width=Math.max(20,bw>>1); bloomB.height=Math.max(20,bh>>1);
  bloomCtxB = bloomB.getContext('2d',{alpha:true}); bloomCtxB.imageSmoothingEnabled=true; bloomCtxB.imageSmoothingQuality='high';
  ctx2d.imageSmoothingEnabled = true;
  ctx2d.imageSmoothingQuality = 'high';
  // target ~0.9 samples per cell per frame so density fills evenly at any size
  iterMax = Math.round(GW*GH*0.95);
  iterPerFrame = Math.min(iterPerFrame, iterMax);
}

// ---------- interaction state ----------
const M = { x:0.5, y:0.5, tx:0.5, ty:0.5, down:false, vx:0, vy:0, lastX:0.5, lastY:0.5 };
let twist = 0, twistTarget = 0;     // rotation of the variation field (drag)
let zoom = 1.0, zoomTarget = 1.0;   // scroll
let pulse = 0;                       // click ignition energy 0..1
let timeT = 0;

// ---------- the flame system : a set of affine maps + variations ----------
// Each map: 6 affine coeffs (a..f), a color index, a weight, and variation mix.
const NMAPS = 6;
let maps = [];
let palette = new Uint8Array(256*3);

function rand(a,b){ return a + Math.random()*(b-a); }

function buildPalette(seedHue){
  // a warm fire ramp with a cool counter-note at the low end for depth
  const stops = [
    [0.00,  8,  2, 22],
    [0.12, 60,  8, 60],
    [0.30,150, 16, 40],
    [0.48,235, 52, 12],
    [0.66,255,128, 18],
    [0.82,255,205, 70],
    [0.94,255,243,200],
    [1.00,255,255,255],
  ];
  for(let i=0;i<256;i++){
    const t = i/255;
    let lo=stops[0], hi=stops[stops.length-1];
    for(let k=0;k<stops.length-1;k++){ if(t>=stops[k][0] && t<=stops[k+1][0]){ lo=stops[k]; hi=stops[k+1]; break; } }
    const span=(hi[0]-lo[0])||1, f=(t-lo[0])/span;
    // hue rotation of the whole ramp by seedHue (gentle)
    let r=lo[1]+(hi[1]-lo[1])*f, g=lo[2]+(hi[2]-lo[2])*f, b=lo[3]+(hi[3]-lo[3])*f;
    // small chromatic shift
    const sh=seedHue;
    const nr = r + sh*0.10*(g-r);
    const ng = g + sh*0.06*(b-g);
    const nb = b - sh*0.04*(b);
    palette[i*3]   = Math.max(0,Math.min(255,nr));
    palette[i*3+1] = Math.max(0,Math.min(255,ng));
    palette[i*3+2] = Math.max(0,Math.min(255,nb));
  }
}

let seedHue = 0;
function newFlame(){
  maps = [];
  seedHue = rand(-0.45,0.55);     // keep palette in the warm fire band
  buildPalette(seedHue);
  for(let i=0;i<NMAPS;i++){
    // affine — biased toward contraction so the attractor stays bounded
    const sc = rand(0.35,0.78);
    const ang = rand(0, Math.PI*2);
    const ca=Math.cos(ang)*sc, sa=Math.sin(ang)*sc;
    maps.push({
      a: ca,  b: -sa*rand(0.6,1.2),
      c: sa,  d:  ca*rand(0.6,1.2),
      e: rand(-0.9,0.9), f: rand(-0.9,0.9),
      col: rand(0,1),
      w: rand(0.4,1.3),
      // per-map variation weights
      v: {
        lin:  rand(0,0.5),
        sin:  rand(0,1.0),
        sph:  rand(0,1.0),
        swirl:rand(0,1.0),
        horse:rand(0,0.7),
        disc: rand(0,0.6),
        spiral:rand(0,0.8),
      }
    });
  }
  // normalise weights
  let s=0; for(const m of maps) s+=m.w;
  let acc=0; for(const m of maps){ m.w/=s; acc+=m.w; m.cum=acc; }
}

// pick a map by weight (linear scan, NMAPS small)
function pickMap(){
  const r = Math.random();
  for(const m of maps){ if(r<=m.cum) return m; }
  return maps[maps.length-1];
}

// ---------- the chaos game iteration ----------
// We keep a persistent point so trajectories are continuous across frames.
let px=0, py=0, pc=0;

function clearGrid(decay){
  // fade previous accumulation -> motion trails / breathing glow
  if(decay>=1){ grid.fill(0); return; }
  const g=grid;
  for(let i=0;i<g.length;i++) g[i]*=decay;
}

function iterate(count){
  const g = grid;
  const gw=GW, gh=GH;
  // view transform : center the unit-ish attractor, apply zoom + mouse bend
  const cx = (M.x - 0.5);        // -0.5..0.5
  const cy = (M.y - 0.5);
  const z = zoom;
  const half = 2.6 / z;          // world half-extent mapped to grid
  const sx = (gw*0.5);
  const sy = (gh*0.5);
  const ct = Math.cos(twist), st = Math.sin(twist);

  // mouse gravity strength + click pulse warp
  const gravX = cx*2.2, gravY = cy*2.2;
  const pw = pulse;             // pulse warps with a radial blast

  let x=px, y=py, c=pc;

  for(let n=0;n<count;n++){
    const m = pickMap();
    // affine
    let nx = m.a*x + m.b*y + m.e;
    let ny = m.c*x + m.d*y + m.f;
    // variations (blended) ---------------------------------
    const r2 = nx*nx + ny*ny + 1e-9;
    const r  = Math.sqrt(r2);
    const theta = Math.atan2(ny, nx);
    const v = m.v;
    let ox=0, oy=0;
    // linear
    ox += v.lin*nx; oy += v.lin*ny;
    // sinusoidal
    ox += v.sin*Math.sin(nx); oy += v.sin*Math.sin(ny);
    // spherical
    const inv=1/r2; ox += v.sph*nx*inv; oy += v.sph*ny*inv;
    // swirl
    const s2=Math.sin(r2), c2=Math.cos(r2);
    ox += v.swirl*(nx*s2 - ny*c2); oy += v.swirl*(nx*c2 + ny*s2);
    // horseshoe
    ox += v.horse*( (nx-ny)*(nx+ny) )/r; oy += v.horse*(2*nx*ny)/r;
    // disc
    const dscale = theta/Math.PI; const dr=Math.PI*r;
    ox += v.disc*dscale*Math.sin(dr); oy += v.disc*dscale*Math.cos(dr);
    // spiral
    ox += v.spiral*(Math.cos(theta)+Math.sin(r))/r; oy += v.spiral*(Math.sin(theta)-Math.cos(r))/r;

    x = ox; y = oy;
    // mouse gravity bend — pulls trajectories toward cursor in world space
    x += gravX * 0.06 * Math.sin(timeT*0.6 + r*1.3);
    y += gravY * 0.06 * Math.cos(timeT*0.6 + r*1.3);
    // click pulse : radial shockwave
    if(pw>0.001){
      const pr = Math.sqrt(x*x+y*y)+1e-6;
      const wv = Math.sin(pr*5.0 - timeT*9.0)*pw*0.20;
      x += (x/pr)*wv; y += (y/pr)*wv;
    }

    // colour : blend toward this map's colour index
    c = (c + m.col) * 0.5;

    // skip the first few to settle (only at fresh reseed handled elsewhere)
    // map world -> grid with twist rotation about center
    const wx = x - 0; const wy = y - 0;
    const rxw = wx*ct - wy*st;
    const ryw = wx*st + wy*ct;
    const gx = (rxw/half)*sx + sx;
    const gy = (ryw/half)*sy + sy;

    if(gx>=1 && gx<gw-1 && gy>=1 && gy<gh-1){
      // bilinear splat -> smoother filaments, far less speckle
      let ci = (c*255)|0; if(ci<0)ci=0; else if(ci>255)ci=255;
      const p3 = ci*3;
      const pr=palette[p3], pg=palette[p3+1], pb=palette[p3+2];
      const ix=gx|0, iy=gy|0;
      const fx=gx-ix, fy=gy-iy;
      const w00=(1-fx)*(1-fy), w10=fx*(1-fy), w01=(1-fx)*fy, w11=fx*fy;
      let idx=(iy*gw+ix)*3;
      g[idx]+=pr*w00; g[idx+1]+=pg*w00; g[idx+2]+=pb*w00;
      idx+=3;             g[idx]+=pr*w10; g[idx+1]+=pg*w10; g[idx+2]+=pb*w10;
      idx=((iy+1)*gw+ix)*3; g[idx]+=pr*w01; g[idx+1]+=pg*w01; g[idx+2]+=pb*w01;
      idx+=3;             g[idx]+=pr*w11; g[idx+1]+=pg*w11; g[idx+2]+=pb*w11;
    }
  }
  px=x; py=y; pc=c;
}

// ---------- tone-map the density grid -> pixels ----------
let runningMax = 1;
let expo = 1.15;              // auto-exposure multiplier (feedback controlled)
// precomputed tone curve LUT (rebuilt per frame, 1024 entries indexed by log-lum)
const LUTN = 1024;
const lutA = new Float32Array(LUTN);     // display alpha 0..1
function render(){
  const g=grid, n=GW*GH, n3=n*3;
  // robust max via strided scan
  let mx = 1;
  for(let i=0;i<n3;i+=21){
    const lum=g[i]+g[i+1]+g[i+2];
    if(lum>mx) mx=lum;
  }
  runningMax = runningMax*0.88 + mx*0.12;
  const gamma = 1/2.15;
  const floor = 0.085;
  const logMax = Math.log1p(runningMax);
  // build LUT indexed by linear lum ratio (lum/runningMax). bake log+gamma+S-curve in.
  // per-pixel cost becomes: ratio = lum*invMax ; li = ratio*(LUTN-1) ; lookup.
  // sqrt-spaced index gives fine low-end resolution where filaments live.
  // index = sqrt(lum/max)*(LUTN-1). LUT bakes the un-sqrt + log + gamma + S-curve.
  const invSqrtMax = 1/Math.sqrt(runningMax);
  for(let i=0;i<LUTN;i++){
    const ratio = i/(LUTN-1);
    const lum = ratio*ratio*runningMax;        // invert the sqrt spacing
    let a = Math.log1p(lum)/logMax * expo;
    if(a>1)a=1;
    a = (a-floor)/(1-floor);
    if(a<=0){ lutA[i]=0; continue; }
    a = Math.pow(a, gamma);
    a = a*0.45 + (a*a*(3-2*a))*0.55;
    lutA[i]=a;
  }
  const idxScale = (LUTN-1)*invSqrtMax;
  const out = img32;
  let hot=0, counted=0;
  for(let i=0,i3=0;i<n;i++,i3+=3){
    const r=g[i3], gg=g[i3+1], b=g[i3+2];
    const lum = r+gg+b;
    if(lum<=0){ out[i]=0xff000000; continue; }
    let li = (Math.sqrt(lum)*idxScale)|0;       // sqrt is hardware-fast
    if(li>=LUTN)li=LUTN-1;
    const a = lutA[li];
    if(a<=0){ out[i]=0xff000000; continue; }
    const k = a*255/lum;
    let R=r*k, G=gg*k, B=b*k;
    if(a>0.62){ const ex=(a-0.62)*230; R+=ex; G+=ex*0.78; B+=ex*0.45; }
    if(R>255)R=255; if(G>255)G=255; if(B>255)B=255;
    out[i] = (255<<24) | (B<<16) | (G<<8) | R;
    counted++; if(a>0.80) hot++;
  }
  // auto-exposure : keep ~6-14% of lit pixels in the hot band, seed/size agnostic.
  // proportional step so far-off seeds correct fast (esp. during warm-up).
  if(counted>0){
    const hotFrac = hot/counted;
    const target = 0.10;
    const err = hotFrac - target;
    expo *= (1 - err*1.6);          // overshoot-damped proportional control
    expo = Math.max(0.5, Math.min(1.8, expo));
  }
  gridCtx.putImageData(imgData, 0, 0);
  // build a downscaled bloom source ONCE (cheap blur on small buffers, not full res)
  if(bloomA){
    bloomCtxA.globalCompositeOperation='source-over'; bloomCtxA.filter='none';
    bloomCtxA.clearRect(0,0,bloomA.width,bloomA.height);
    bloomCtxA.drawImage(gridCanvas,0,0,GW,GH,0,0,bloomA.width,bloomA.height); // half res, smoothed
    bloomCtxB.clearRect(0,0,bloomB.width,bloomB.height);
    bloomCtxB.drawImage(bloomA,0,0,bloomA.width,bloomA.height,0,0,bloomB.width,bloomB.height); // quarter res
  }
  // base : sharp upscale
  ctx2d.globalCompositeOperation='source-over';
  ctx2d.filter='none';
  ctx2d.drawImage(gridCanvas, 0,0,GW,GH, 0,0,W,H);
  // bloom : additive upscales of the tiny blurred buffers — wide soft glow, cheap
  ctx2d.globalCompositeOperation='lighter';
  if(bloomA){
    ctx2d.globalAlpha=0.40; ctx2d.drawImage(bloomA,0,0,bloomA.width,bloomA.height,0,0,W,H);
    ctx2d.globalAlpha=0.26; ctx2d.drawImage(bloomB,0,0,bloomB.width,bloomB.height,0,0,W,H);
  }
  ctx2d.globalAlpha=1; ctx2d.filter='none'; ctx2d.globalCompositeOperation='source-over';
}

// ---------- main loop ----------
let last=performance.now(), fpsAcc=0, fpsN=0;
let iterPerFrame = 90000;   // adaptive
let iterMax = 200000;       // recomputed from grid area in computeSizes()
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last=now; timeT+=dt;

  // ease interaction values
  M.x += (M.tx-M.x)*0.10; M.y += (M.ty-M.y)*0.10;
  twist += (twistTarget-twist)*0.06;
  zoom  += (zoomTarget-zoom)*0.07;
  pulse *= 0.92; if(pulse<0.001) pulse=0;

  // gentle autonomous drift so it's alive even idle
  twistTarget += Math.sin(timeT*0.13)*0.0016;
  const autoZoom = 1 + Math.sin(timeT*0.21)*0.05;
  // breathing : fold autoZoom into zoom subtly when user hasn't scrolled recently
  zoom *= (1 + (autoZoom-1)*0.02);

  // decay the accumulation buffer for living trails.
  // higher persistence => points accumulate into smooth, dense filaments
  // (kills speckle) while motion still flows. lower it briefly on a pulse.
  const baseDecay = 0.93;
  const decay = baseDecay - pulse*0.30;
  clearGrid(Math.max(0.55, Math.min(0.96, decay)));

  // iterate
  iterate(iterPerFrame);
  render();

  // adaptive perf : target ~ 55-60fps
  const fdt = (performance.now()-now);
  if(fdt>20 && iterPerFrame>30000) iterPerFrame -= 6000;
  else if(fdt<14 && iterPerFrame<iterMax) iterPerFrame += 6000;

  // fps display
  fpsAcc+=dt; fpsN++;
  if(fpsAcc>0.5){ fpsEl.textContent = Math.round(fpsN/fpsAcc)+' fps · '+(iterPerFrame/1000|0)+'k/f · '+GW+'×'+GH; fpsAcc=0; fpsN=0; }

  requestAnimationFrame(frame);
}

// ---------- events ----------
function setMouse(clientX, clientY){
  M.tx = clientX/window.innerWidth;
  M.ty = clientY/window.innerHeight;
}
window.addEventListener('mousemove', e=>{
  setMouse(e.clientX, e.clientY);
  if(M.down){
    const dx = (e.clientX/window.innerWidth) - M.lastX;
    twistTarget += dx*2.4;
    M.lastX = e.clientX/window.innerWidth;
  }
});
window.addEventListener('mousedown', e=>{ M.down=true; M.lastX=e.clientX/window.innerWidth; });
window.addEventListener('mouseup',   ()=> M.down=false );
window.addEventListener('click', e=>{
  setMouse(e.clientX,e.clientY);
  pulse = 1.0;
});
window.addEventListener('wheel', e=>{
  e.preventDefault();
  zoomTarget *= (e.deltaY<0 ? 1.10 : 0.91);
  zoomTarget = Math.max(0.35, Math.min(4.5, zoomTarget));
},{passive:false});

// touch
let pinchD=0;
window.addEventListener('touchstart', e=>{
  if(e.touches.length===1){ M.down=true; const t=e.touches[0]; setMouse(t.clientX,t.clientY); M.lastX=t.clientX/window.innerWidth; pulse=Math.max(pulse,0.7); }
  if(e.touches.length===2){ pinchD=dist2(e.touches); }
},{passive:false});
window.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(e.touches.length===1){
    const t=e.touches[0]; setMouse(t.clientX,t.clientY);
    const cur=t.clientX/window.innerWidth; twistTarget += (cur-M.lastX)*2.4; M.lastX=cur;
  } else if(e.touches.length===2){
    const d=dist2(e.touches); if(pinchD>0){ zoomTarget *= d/pinchD; zoomTarget=Math.max(0.35,Math.min(4.5,zoomTarget)); }
    pinchD=d;
  }
},{passive:false});
window.addEventListener('touchend', e=>{ if(e.touches.length===0){ M.down=false; pinchD=0; } });
function dist2(ts){ const dx=ts[0].clientX-ts[1].clientX, dy=ts[0].clientY-ts[1].clientY; return Math.hypot(dx,dy); }

window.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); newFlame(); px=py=0; pc=0; grid.fill(0); pulse=1.0; }
});

let resizeTO=0;
window.addEventListener('resize', ()=>{ clearTimeout(resizeTO); resizeTO=setTimeout(()=>{ computeSizes(); }, 120); });

// dim chrome after idle so the art owns the screen
let idleTO=0;
function bumpIdle(){ hud.classList.remove('fade'); titleEl.classList.remove('fade'); clearTimeout(idleTO);
  idleTO=setTimeout(()=>{ hud.classList.add('fade'); titleEl.classList.add('fade'); }, 5200); }
['mousemove','mousedown','wheel','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,bumpIdle,{passive:true}));

// expose minimal hook for self-verification
window.__ember = {
  state(){ return { gw:GW, gh:GH, zoom:zoomTarget, twist:twistTarget, pulse, nmaps:maps.length,
                    mx:M.tx, my:M.ty, iter:iterPerFrame }; },
  reseed(){ newFlame(); grid.fill(0); },
  energy(){ // sum of grid as a liveness probe
    let s=0; const g=grid; for(let i=0;i<g.length;i+=97) s+=g[i]; return s; }
};

// ---------- boot ----------
computeSizes();
newFlame();
// warm-up : run enough so the very first painted frame is already a flame,
// but settle the brightness estimate so it isn't blown out.
px=py=0; pc=0;
const warm = Math.round(iterMax*0.8);
for(let k=0;k<3;k++) iterate(warm);
for(let k=0;k<14;k++) render();  // lets runningMax + auto-exposure fully converge before first paint
