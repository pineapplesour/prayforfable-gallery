<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TERRA · a living world</title>
<style>
  :root{ color-scheme: dark; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#01010a; }
  body{
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    touch-action:none;
    cursor:grab;
  }
  body.dragging{ cursor:grabbing; }
  #gl{ position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* ---- overlay UI ---- */
  .frame{ position:fixed; inset:0; pointer-events:none; z-index:5; }
  .corner{
    position:absolute; width:34px; height:34px;
    border:1px solid rgba(150,200,255,.28);
    mix-blend-mode:screen;
  }
  .corner.tl{ top:22px; left:22px; border-right:none; border-bottom:none; }
  .corner.tr{ top:22px; right:22px; border-left:none; border-bottom:none; }
  .corner.bl{ bottom:22px; left:22px; border-right:none; border-top:none; }
  .corner.br{ bottom:22px; right:22px; border-left:none; border-top:none; }

  .title{
    position:absolute; top:30px; left:42px;
    letter-spacing:.42em; font-size:13px; font-weight:600;
    color:rgba(225,238,255,.92);
    text-transform:uppercase;
    text-shadow:0 0 18px rgba(90,150,255,.55);
  }
  .title small{
    display:block; margin-top:7px; letter-spacing:.30em;
    font-size:9.5px; font-weight:400; color:rgba(150,185,235,.62);
  }
  .readout{
    position:absolute; top:30px; right:44px; text-align:right;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum";
    font-size:10px; letter-spacing:.14em; line-height:1.85;
    color:rgba(170,205,250,.70);
  }
  .readout b{ color:rgba(225,240,255,.95); font-weight:600; }
  .readout .k{ color:rgba(120,160,215,.55); margin-right:.6em; }

  .hint{
    position:absolute; bottom:30px; left:42px;
    font-size:10px; letter-spacing:.18em; line-height:1.9;
    color:rgba(150,190,240,.55);
  }
  .hint kbd{
    display:inline-block; padding:1px 7px; margin:0 2px;
    border:1px solid rgba(150,200,255,.30); border-radius:4px;
    font-size:9px; letter-spacing:.1em; color:rgba(200,225,255,.85);
    background:rgba(40,70,130,.20);
  }
  .biome{
    position:absolute; bottom:30px; right:44px; text-align:right;
    font-size:10px; letter-spacing:.16em; color:rgba(170,205,250,.62);
  }
  .biome b{ color:rgba(225,240,255,.95); font-weight:600; }

  @media (max-width:560px){
    .title{ top:26px; left:30px; font-size:11px; letter-spacing:.34em; }
    .title small{ font-size:8.5px; }
    .readout{ top:26px; right:30px; font-size:9px; }
    .hint{ bottom:24px; left:30px; font-size:9px; letter-spacing:.12em; }
    .biome{ bottom:24px; right:30px; font-size:9px; }
    .corner{ width:24px; height:24px; }
    .corner.tl,.corner.tr{ top:16px; } .corner.bl,.corner.br{ bottom:16px; }
    .corner.tl,.corner.bl{ left:16px; } .corner.tr,.corner.br{ right:16px; }
  }
  /* fade UI in subtly without gating first paint */
  .frame{ animation: ui 1.4s ease .25s both; }
  @keyframes ui{ from{opacity:0} to{opacity:1} }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="frame">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div class="title">TERRA<small>procedural world · raymarched</small></div>
  <div class="readout">
    <div><span class="k">LAT</span><b id="r-lat">+00.0°</b></div>
    <div><span class="k">SOL</span><b id="r-sol">06:00</b></div>
    <div><span class="k">ALT</span><b id="r-alt">2.6 R⊕</b></div>
    <div><span class="k">FPS</span><b id="r-fps">60</b></div>
  </div>
  <div class="hint">
    <kbd>DRAG</kbd> 자전 &nbsp; <kbd>SCROLL</kbd> 고도 &nbsp; <kbd>⇧+DRAG</kbd> 태양<br>
    <kbd>SPACE</kbd> 자동회전 &nbsp; <kbd>C</kbd> 구름 &nbsp; <kbd>R</kbd> 새 행성
  </div>
  <div class="biome"><span id="b-seed">SEED · A91F</span> &nbsp;·&nbsp; <b id="b-class">terran</b></div>
</div>

<script type="x-shader/x-fragment" id="frag">
precision highp float;

uniform vec2  iRes;
uniform float iTime;
uniform vec3  uCam;        // camera position
uniform mat3  uView;       // camera basis (right, up, forward)
uniform vec3  uSun;        // sun direction (world)
uniform float uSeed;       // planet seed
uniform float uCloud;      // cloud amount 0..1
uniform float uSpin;       // surface rotation angle (texture spin)
uniform float uTilt;       // axial tilt visual

#define PI 3.14159265359
#define R_PLANET 1.0
#define R_ATMO   1.085
#define R_CLOUD  1.012

// ---------- hash / noise ----------
float hash1(vec3 p){
  p = fract(p*0.3183099 + uSeed*0.1) ;
  p += dot(p, p.yzx + 19.19);
  return fract((p.x+p.y)*p.z);
}
float vnoise(vec3 x){
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f*f*(3.0-2.0*f);
  float n000=hash1(i+vec3(0,0,0)), n100=hash1(i+vec3(1,0,0));
  float n010=hash1(i+vec3(0,1,0)), n110=hash1(i+vec3(1,1,0));
  float n001=hash1(i+vec3(0,0,1)), n101=hash1(i+vec3(1,0,1));
  float n011=hash1(i+vec3(0,1,1)), n111=hash1(i+vec3(1,1,1));
  float nx00=mix(n000,n100,f.x), nx10=mix(n010,n110,f.x);
  float nx01=mix(n001,n101,f.x), nx11=mix(n011,n111,f.x);
  float nxy0=mix(nx00,nx10,f.y), nxy1=mix(nx01,nx11,f.y);
  return mix(nxy0,nxy1,f.z);
}
float fbm(vec3 p, int oct){
  float a=0.5, s=0.0, tot=0.0;
  mat3 m = mat3( 0.00, 0.80, 0.60,
               -0.80, 0.36,-0.48,
               -0.60,-0.48, 0.64);
  for(int i=0;i<8;i++){
    if(i>=oct) break;
    s += a*vnoise(p);
    tot += a;
    p = m*p*2.02;
    a *= 0.5;
  }
  return s/tot;
}
// ridged for mountains
float ridged(vec3 p, int oct){
  float a=0.5, s=0.0, tot=0.0;
  mat3 m = mat3( 0.00, 0.80, 0.60,
               -0.80, 0.36,-0.48,
               -0.60,-0.48, 0.64);
  for(int i=0;i<8;i++){
    if(i>=oct) break;
    float n = 1.0 - abs(vnoise(p)*2.0-1.0);
    s += a*n*n;
    tot += a;
    p = m*p*2.05;
    a *= 0.5;
  }
  return s/tot;
}

// rotate a point around Y by planet spin (for surface "rotation")
vec3 spin(vec3 p){
  float c=cos(uSpin), s=sin(uSpin);
  return vec3(c*p.x - s*p.z, p.y, s*p.x + c*p.z);
}

// ---------- continents / elevation field on the unit sphere ----------
// returns elevation in [-1,1]; >0 land, <0 sea
float elevation(vec3 n){
  vec3 q = n*1.8 + vec3(11.3, 4.7, 27.1);
  // warp domain for organic coastlines
  vec3 w = vec3(fbm(q+vec3(0,0,0),5), fbm(q+vec3(5.2,1.3,8.8),5), fbm(q+vec3(2.4,9.1,3.7),5));
  vec3 p = q + (w-0.5)*1.7;
  float base = fbm(p, 6);                 // 0..1
  float cont = base*1.65 - 0.78;          // shift sea level
  // mountain ridges only on high land
  float mtn = ridged(p*2.3 + 3.1, 5);
  float landMask = smoothstep(0.02, 0.28, cont);
  cont += mtn*0.42*landMask;
  // polar ice caps push elevation appearance
  return clamp(cont, -1.0, 1.0);
}

// surface color + roughness from elevation & latitude
// returns rgb in .xyz, ocean flag in .w (1=ocean)
vec4 surfaceAlbedo(vec3 n, float elev){
  float lat = abs(n.y);                  // 0 equator .. 1 pole
  if(elev < 0.0){
    // ocean: deep -> shallow gradient
    float d = clamp(-elev*2.2, 0.0, 1.0);
    vec3 deep    = vec3(0.012, 0.045, 0.115);
    vec3 shallow = vec3(0.05, 0.30, 0.42);
    vec3 col = mix(shallow, deep, d);
    // sea ice near poles
    float ice = smoothstep(0.80, 0.92, lat);
    col = mix(col, vec3(0.85,0.90,0.96), ice*0.8);
    return vec4(col, 1.0);
  }
  // land biomes by elevation + latitude + a biome noise
  float bn = fbm(n*3.3 + 50.0, 4);
  vec3 sand   = vec3(0.62, 0.54, 0.34);
  vec3 grass  = vec3(0.13, 0.32, 0.10);
  vec3 forest = vec3(0.06, 0.20, 0.07);
  vec3 desert = vec3(0.70, 0.55, 0.30);
  vec3 rock   = vec3(0.34, 0.30, 0.27);
  vec3 snow   = vec3(0.90, 0.93, 0.97);

  vec3 col = mix(sand, grass, smoothstep(0.0,0.10,elev));
  col = mix(col, forest, smoothstep(0.08,0.30,elev)*step(bn,0.55));
  col = mix(col, desert, smoothstep(0.30,0.55,bn)*smoothstep(0.0,0.25,elev)*(1.0-lat));
  col = mix(col, rock, smoothstep(0.42,0.66,elev));
  // snow caps: high elevation OR high latitude
  float snowLine = smoothstep(0.58,0.80,elev) + smoothstep(0.62,0.86,lat);
  col = mix(col, snow, clamp(snowLine,0.0,1.0));
  return vec4(col, 0.0);
}

// analytic ray-sphere
vec2 sphereI(vec3 ro, vec3 rd, float rad){
  float b = dot(ro, rd);
  float c = dot(ro,ro) - rad*rad;
  float h = b*b - c;
  if(h<0.0) return vec2(-1.0);
  h = sqrt(h);
  return vec2(-b-h, -b+h);
}

// gradient of elevation for normal mapping (bump)
vec3 bumpNormal(vec3 n, float elev){
  float e = 0.0025;
  vec3 t1 = normalize(cross(n, vec3(0.0,1.0,0.0)+0.001));
  vec3 t2 = normalize(cross(n, t1));
  float ex = elevation(normalize(n + t1*e)) - elev;
  float ey = elevation(normalize(n + t2*e)) - elev;
  float strength = (elev>0.0)? 1.6 : 0.25;
  vec3 grad = (t1*ex + t2*ey)/e * strength;
  return normalize(n - grad*0.018);
}

// cloud density at a point on the cloud sphere
float clouds(vec3 n){
  vec3 p = n*2.4;
  p.x += iTime*0.013;               // drift
  float c = fbm(p + vec3(0.0, iTime*0.004, 0.0), 6);
  c = smoothstep(0.46, 0.78, c);
  // swirl bands
  float band = fbm(vec3(n.y*4.0, n.x*2.0+iTime*0.02, n.z*2.0), 4);
  c *= 0.7 + 0.6*band;
  return clamp(c,0.0,1.0)*uCloud;
}

// atmospheric scattering approximation (cheap)
vec3 atmosphere(vec3 ro, vec3 rd, vec3 sun, float tMax){
  vec2 a = sphereI(ro, rd, R_ATMO);
  if(a.x<0.0 && a.y<0.0) return vec3(0.0);
  float t0 = max(a.x, 0.0);
  float t1 = (tMax>0.0)? min(a.y, tMax) : a.y;
  if(t1<=t0) return vec3(0.0);
  const int S=10;
  float seg=(t1-t0)/float(S);
  vec3 col=vec3(0.0);
  float accum=0.0;
  vec3 rayl = vec3(0.20, 0.45, 1.0);    // rayleigh tint (blue)
  for(int i=0;i<S;i++){
    float t = t0 + seg*(float(i)+0.5);
    vec3 p = ro + rd*t;
    float h = (length(p)-R_PLANET)/(R_ATMO-R_PLANET); // 0 surface .. 1 top
    float dens = exp(-h*3.0) * 0.5;
    float sunlit = clamp(dot(normalize(p), sun)*0.5+0.6, 0.0, 1.0);
    accum += dens*seg;
    col += rayl * dens * seg * sunlit;
  }
  float mu = dot(rd, sun);
  float phase = 0.75*(1.0+mu*mu);
  return col * phase * 5.5;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*iRes) / iRes.y;
  vec3 ro = uCam;
  vec3 rd = normalize(uView * vec3(uv, 1.45));
  vec3 sun = normalize(uSun);

  // ---- background: nebula + stars ----
  vec3 col;
  {
    vec3 dir = rd;
    float neb = fbm(dir*2.4 + 8.0, 5);
    float neb2 = fbm(dir*5.5 - 3.0, 4);
    vec3 nebCol = mix(vec3(0.03,0.02,0.09), vec3(0.10,0.04,0.18), neb);
    nebCol += vec3(0.02,0.05,0.12)*neb2;
    col = nebCol*0.6;
    // stars
    vec3 sp = dir*180.0;
    vec3 ip = floor(sp);
    float star = hash1(ip*1.3);
    if(star>0.985){
      vec3 fp = fract(sp)-0.5;
      float d = 1.0 - smoothstep(0.0, 0.10, length(fp));
      float tw = 0.6+0.4*sin(iTime*2.0 + star*40.0);
      vec3 sc = mix(vec3(1.0,0.9,0.8), vec3(0.8,0.9,1.0), hash1(ip*2.1));
      col += sc * d * (star-0.985)*60.0 * tw;
    }
    // distant sun bloom
    float sd = max(dot(rd, sun),0.0);
    col += vec3(1.0,0.85,0.6)*pow(sd, 350.0)*1.2;
    col += vec3(0.9,0.7,0.5)*pow(sd, 16.0)*0.05;
  }

  // ---- planet ----
  vec2 hit = sphereI(ro, rd, R_PLANET);
  float planetT = (hit.x>0.0)? hit.x : -1.0;

  if(planetT>0.0){
    vec3 pos = ro + rd*planetT;
    vec3 N = normalize(pos);
    vec3 sn = spin(N);                  // sample point in planet-fixed frame
    float elev = elevation(sn);
    vec4 alb = surfaceAlbedo(sn, elev);
    bool ocean = alb.w>0.5;

    vec3 nrm = bumpNormal(sn, elev);
    // rotate bumped normal back to world for lighting (spin is around Y, lighting in world)
    float c=cos(-uSpin), s=sin(-uSpin);
    vec3 Nw = vec3(c*nrm.x - s*nrm.z, nrm.y, s*nrm.x + c*nrm.z);
    Nw = normalize(mix(N, Nw, 0.85));

    float ndl = dot(Nw, sun);
    float day = clamp(ndl, 0.0, 1.0);
    // soft terminator
    float term = smoothstep(-0.12, 0.18, ndl);

    vec3 base = alb.rgb;
    // diffuse w/ subtle wrap
    vec3 lit = base * (day*1.25 + 0.05);

    // ocean specular sun-glint
    if(ocean){
      vec3 h = normalize(sun - rd);
      float spec = pow(max(dot(Nw,h),0.0), 90.0);
      lit += vec3(1.0,0.95,0.8)*spec*term*1.4;
      // fresnel sky reflection on water
      float fr = pow(1.0-max(dot(Nw,-rd),0.0), 4.0);
      lit += vec3(0.10,0.25,0.45)*fr*term*0.5;
    } else {
      // tiny land specular for wet/snow
      vec3 h = normalize(sun - rd);
      float spec = pow(max(dot(Nw,h),0.0), 30.0);
      lit += vec3(0.6,0.7,0.9)*spec*term*0.15*step(0.6,elev);
    }

    // night side: city lights on land near coasts/low elevation
    float night = smoothstep(0.10, -0.18, ndl);
    if(!ocean && elev>0.0){
      float cityN = fbm(sn*22.0 + 99.0, 4);
      float pop = smoothstep(0.0,0.22,elev)*(1.0-smoothstep(0.45,0.7,elev));
      float city = step(0.72, cityN) * pop;
      lit += vec3(1.0,0.82,0.45)*city*night*1.6;
    }
    // faint atmospheric ambient on night
    lit += base*0.02;

    // ---- clouds over surface ----
    // sample cloud sphere intersection in front of surface
    vec2 ch = sphereI(ro, rd, R_CLOUD);
    if(ch.x>0.0 && ch.x < planetT){
      vec3 cp = ro + rd*ch.x;
      vec3 cn = spin(normalize(cp));
      float cd = clouds(cn);
      float cloudLit = clamp(dot(normalize(cp), sun),0.0,1.0)*1.1 + 0.05;
      vec3 cloudCol = vec3(1.0,0.99,0.97)*cloudLit;
      // cloud shadow already implicit; blend over surface
      lit = mix(lit, cloudCol, cd*term*0.92 + cd*0.04);
    }

    // rim / atmosphere fresnel glow on planet edge
    float rim = pow(1.0 - max(dot(N,-rd),0.0), 3.0);
    vec3 atmoTint = mix(vec3(0.2,0.5,1.0), vec3(1.0,0.6,0.35), pow(max(dot(N,sun)*0.5+0.5,0.0),2.0));
    lit += atmoTint*rim*term*0.9;
    lit += vec3(0.25,0.5,1.0)*rim*0.06; // always-on faint blue edge

    col = lit;
  }

  // ---- atmosphere halo (scattering) layered over everything ----
  vec3 atmo = atmosphere(ro, rd, sun, planetT);
  col += atmo;

  // ---- subtle planetary ring (thin, optional flavor) ----
  {
    // ring plane = planet equator (xz plane), inner/outer radii
    if(abs(rd.y) > 1e-4){
      float tR = -ro.y/rd.y;
      if(tR>0.0){
        vec3 rp = ro + rd*tR;
        float rr = length(rp.xz);
        if(rr>1.35 && rr<1.95){
          // not occluded by planet front face
          if(planetT<0.0 || tR < planetT){
            float ringN = fbm(vec3(rr*40.0, 0.0, atan(rp.z,rp.x)*3.0), 3);
            float gap = smoothstep(1.35,1.40,rr)*(1.0-smoothstep(1.88,1.95,rr));
            float a = gap*(0.25+0.5*ringN);
            vec3 rc = mix(vec3(0.5,0.45,0.4), vec3(0.8,0.75,0.65), ringN);
            float rl = clamp(dot(normalize(vec3(rp.x,0.0,rp.z)), sun)*0.5+0.6,0.0,1.0);
            col += rc*a*rl*0.55;
          }
        }
      }
    }
  }

  // ---- tonemap + grade ----
  col *= 1.05;
  col = col/(col+vec3(0.85));            // reinhard-ish
  col = pow(col, vec3(0.4545));          // gamma
  // gentle cinematic tint + vignette
  vec2 vu = gl_FragCoord.xy/iRes;
  float vig = smoothstep(1.25, 0.25, length((vu-0.5)*vec2(1.15,1.0)));
  col *= 0.55 + 0.55*vig;
  col = mix(col, col*vec3(1.02,1.0,1.05), 0.5);
  // film grain
  float g = hash1(vec3(gl_FragCoord.xy, iTime))*0.035 - 0.017;
  col += g;

  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
(function(){
  "use strict";
  const cv = document.getElementById('gl');
  const gl = cv.getContext('webgl', {antialias:false, alpha:false, powerPreference:'high-performance'})
          || cv.getContext('experimental-webgl');
  if(!gl){
    document.body.innerHTML = '<div style="color:#9cf;font:14px sans-serif;padding:40px">WebGL이 필요합니다.</div>';
    return;
  }

  // ---- shaders ----
  const vsSrc = 'attribute vec2 p; void main(){ gl_Position = vec4(p,0.0,1.0); }';
  const fsSrc = document.getElementById('frag').textContent;

  function compile(type, src){
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
      console.error(gl.getShaderInfoLog(sh));
      throw new Error('shader compile failed');
    }
    return sh;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
    console.error(gl.getProgramInfoLog(prog));
    return;
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  ['iRes','iTime','uCam','uView','uSun','uSeed','uCloud','uSpin','uTilt'].forEach(n=>{
    U[n] = gl.getUniformLocation(prog, n);
  });

  // ---- state ----
  const state = {
    yaw: 0.55, pitch: 0.28,     // camera orbit
    dist: 2.45,                 // camera distance
    targetDist: 2.45,
    spin: 1.7, spinSpeed: 0.045, autoSpin: true,
    sunYaw: 2.05, sunPitch: 0.18,   // grazing light -> dramatic terminator on first paint
    cloud: 1.0, cloudTarget: 1.0,
    seed: 0.371,
    tilt: 0.32,
    velYaw: 0.0, velPitch: 0.0
  };

  // ---- DPR / resize (resolution cap for perf) ----
  let DPR = 1, W=0, H=0;
  function resize(){
    const maxDPR = (window.innerWidth*window.innerHeight > 1400*900) ? 1.25 : 1.6;
    DPR = Math.min(window.devicePixelRatio||1, maxDPR);
    W = Math.floor(window.innerWidth * DPR);
    H = Math.floor(window.innerHeight * DPR);
    // hard pixel budget cap (~2.6M px) -> scale down if huge
    const budget = 2600000;
    if(W*H > budget){
      const s = Math.sqrt(budget/(W*H));
      W = Math.floor(W*s); H = Math.floor(H*s);
    }
    cv.width = W; cv.height = H;
    cv.style.width = window.innerWidth+'px';
    cv.style.height = window.innerHeight+'px';
    gl.viewport(0,0,W,H);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- camera matrix from yaw/pitch/dist ----
  function buildCamera(){
    const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
    const cy = Math.cos(state.yaw),   sy = Math.sin(state.yaw);
    // position on sphere around origin
    const cam = [
      state.dist * cp * sy,
      state.dist * sp,
      state.dist * cp * cy
    ];
    // forward = look at origin
    const f = norm([-cam[0], -cam[1], -cam[2]]);
    let up = [0,1,0];
    const r = norm(cross(up, f));      // right
    up = cross(f, r);                  // true up
    // column-major mat3 for GLSL: columns are r, up, f
    const view = [ r[0],r[1],r[2],  up[0],up[1],up[2],  f[0],f[1],f[2] ];
    return {cam, view};
  }
  function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
  function norm(a){ const l=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; }

  function sunDir(){
    const cp=Math.cos(state.sunPitch), sp=Math.sin(state.sunPitch);
    const cy=Math.cos(state.sunYaw),   sy=Math.sin(state.sunYaw);
    return [cp*sy, sp, cp*cy];
  }

  // ---- interaction ----
  let dragging=false, shiftDrag=false, lastX=0, lastY=0;
  function pdown(x,y,shift){ dragging=true; shiftDrag=shift; lastX=x; lastY=y; document.body.classList.add('dragging'); }
  function pmove(x,y){
    if(!dragging) return;
    const dx=(x-lastX), dy=(y-lastY); lastX=x; lastY=y;
    if(shiftDrag){
      state.sunYaw  += dx*0.006;
      state.sunPitch = clamp(state.sunPitch - dy*0.006, -1.3, 1.3);
    } else {
      state.velYaw   = -dx*0.006;
      state.velPitch =  dy*0.006;
      state.yaw   += state.velYaw;
      state.pitch  = clamp(state.pitch + state.velPitch, -1.35, 1.35);
      state.autoSpin = false;       // user took over spin via orbit? keep planet spin but allow
    }
  }
  function pup(){ dragging=false; document.body.classList.remove('dragging'); }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  cv.addEventListener('mousedown', e=>{ pdown(e.clientX, e.clientY, e.shiftKey); });
  window.addEventListener('mousemove', e=>{ pmove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', pup);
  // hover parallax when not dragging (subtle)
  let hoverX=0, hoverY=0;
  window.addEventListener('mousemove', e=>{
    hoverX = (e.clientX/window.innerWidth - 0.5);
    hoverY = (e.clientY/window.innerHeight - 0.5);
  });

  cv.addEventListener('touchstart', e=>{
    if(e.touches.length===1){ pdown(e.touches[0].clientX, e.touches[0].clientY, false); }
    else if(e.touches.length===2){ pinchStart(e); }
    e.preventDefault();
  }, {passive:false});
  cv.addEventListener('touchmove', e=>{
    if(e.touches.length===1){ pmove(e.touches[0].clientX, e.touches[0].clientY); }
    else if(e.touches.length===2){ pinchMove(e); }
    e.preventDefault();
  }, {passive:false});
  cv.addEventListener('touchend', e=>{ if(e.touches.length===0) pup(); }, {passive:false});

  let pinchD0=0, dist0=0;
  function pinchStart(e){
    const a=e.touches[0], b=e.touches[1];
    pinchD0 = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    dist0 = state.targetDist;
  }
  function pinchMove(e){
    const a=e.touches[0], b=e.touches[1];
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    state.targetDist = clamp(dist0 * (pinchD0/Math.max(d,1)), 1.45, 6.0);
  }

  window.addEventListener('wheel', e=>{
    state.targetDist = clamp(state.targetDist * (1 + Math.sign(e.deltaY)*0.08), 1.45, 6.0);
    e.preventDefault();
  }, {passive:false});

  window.addEventListener('keydown', e=>{
    if(e.code==='Space'){ state.autoSpin = !state.autoSpin; e.preventDefault(); }
    else if(e.key==='c'||e.key==='C'){ state.cloudTarget = state.cloudTarget>0.5 ? 0.0 : 1.0; }
    else if(e.key==='r'||e.key==='R'){ newPlanet(); }
  });

  function newPlanet(){
    state.seed = Math.random()*0.9+0.05;
    state.tilt = (Math.random()-0.5)*0.7;
    state.sunYaw = Math.random()*Math.PI*2;
    state.sunPitch = (Math.random()-0.5)*0.9;
    const hex = Math.floor(state.seed*0xFFFF).toString(16).toUpperCase().padStart(4,'0');
    document.getElementById('b-seed').textContent = 'SEED · '+hex;
    const classes=['terran','oceanic','arid','tundra','verdant','primordial'];
    document.getElementById('b-class').textContent = classes[Math.floor(state.seed*classes.length)%classes.length];
  }
  newPlanet.call=null;
  // init labels once
  (function initSeed(){
    const hex = Math.floor(state.seed*0xFFFF).toString(16).toUpperCase().padStart(4,'0');
    document.getElementById('b-seed').textContent = 'SEED · '+hex;
  })();

  // ---- readout DOM ----
  const elLat=document.getElementById('r-lat'), elSol=document.getElementById('r-sol'),
        elAlt=document.getElementById('r-alt'), elFps=document.getElementById('r-fps');

  // ---- render loop ----
  let t0 = performance.now(), last = t0, frames=0, fpsAcc=0, fpsT=0, fps=60;
  function frame(now){
    const dt = Math.min((now-last)/1000, 0.05); last = now;
    const t = (now - t0)/1000;

    // smooth distance
    state.dist += (state.targetDist - state.dist)*Math.min(dt*8,1);
    state.cloud += (state.cloudTarget - state.cloud)*Math.min(dt*4,1);

    // inertia on orbit when not dragging
    if(!dragging){
      state.yaw   += state.velYaw;
      state.pitch  = clamp(state.pitch + state.velPitch, -1.35, 1.35);
      state.velYaw  *= 0.92;
      state.velPitch*= 0.92;
    }
    // planet self-rotation
    if(state.autoSpin){ state.spin += state.spinSpeed*dt; }

    // subtle hover parallax added to view (not when dragging)
    const hy = dragging?0:hoverX*0.06;
    const hp = dragging?0:-hoverY*0.04;

    const camYawSave = state.yaw, camPitchSave = state.pitch;
    state.yaw += hy; state.pitch = clamp(state.pitch+hp,-1.4,1.4);
    const {cam, view} = buildCamera();
    state.yaw = camYawSave; state.pitch = camPitchSave;

    const sun = sunDir();

    gl.uniform2f(U.iRes, W, H);
    gl.uniform1f(U.iTime, t);
    gl.uniform3f(U.uCam, cam[0], cam[1], cam[2]);
    gl.uniformMatrix3fv(U.uView, false, new Float32Array(view));
    gl.uniform3f(U.uSun, sun[0], sun[1], sun[2]);
    gl.uniform1f(U.uSeed, state.seed*10.0);
    gl.uniform1f(U.uCloud, state.cloud);
    gl.uniform1f(U.uSpin, state.spin);
    gl.uniform1f(U.uTilt, state.tilt);

    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // ---- readouts ----
    fpsAcc++; fpsT += dt;
    if(fpsT >= 0.5){ fps = Math.round(fpsAcc/fpsT); fpsAcc=0; fpsT=0;
      elFps.textContent = fps;
      // adaptive resolution if struggling
      if(fps < 42 && DPR > 0.85){ DPR = Math.max(0.8, DPR-0.15); softRescale(); }
    }
    const lat = (state.pitch*180/Math.PI);
    elLat.textContent = (lat>=0?'+':'') + lat.toFixed(1) + '°';
    // sun -> clock
    const solH = ((state.sunYaw % (Math.PI*2)) + Math.PI*2) % (Math.PI*2) / (Math.PI*2) * 24;
    const hh = Math.floor(solH), mm = Math.floor((solH-hh)*60);
    elSol.textContent = String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
    elAlt.textContent = state.dist.toFixed(1)+' R⊕';

    requestAnimationFrame(frame);
  }
  function softRescale(){
    W = Math.floor(window.innerWidth * DPR);
    H = Math.floor(window.innerHeight * DPR);
    cv.width=W; cv.height=H; gl.viewport(0,0,W,H);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
