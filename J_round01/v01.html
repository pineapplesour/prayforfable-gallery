<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>강유역문명.xlsx - Excel</title>
<style>
  :root{
    --grid:#d4d4d4; --gridlt:#e8e8e8; --green:#107c41; --green-d:#0b5c30;
    --ink:#1f1f1f; --panel:#f3f2f1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#cfcfcf;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:var(--ink);-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent}
  #app{display:flex;flex-direction:column;height:100%}

  /* ---- title bar ---- */
  #titlebar{height:30px;background:linear-gradient(#fbfbfb,#f1f0ee);display:flex;
    align-items:center;padding:0 10px;gap:7px;border-bottom:1px solid #e1e1e1;flex:none}
  .dot{width:11px;height:11px;border-radius:50%}
  #ttl{margin-left:10px;color:#3a3a3a;font-size:12px;font-weight:600;letter-spacing:.2px}
  #savestate{margin-left:auto;color:#9a9a9a;font-size:10.5px;font-style:italic}

  /* ---- menu (file/home/...) ---- */
  #menubar{height:26px;background:#fff;display:flex;align-items:flex-end;
    padding:0 8px;gap:2px;border-bottom:1px solid #efefef;font-size:12px;color:#555;flex:none;
    overflow-x:auto;scrollbar-width:none}
  #menubar::-webkit-scrollbar{display:none}
  #menubar div{padding:4px 9px 6px;white-space:nowrap;cursor:default;border-radius:3px 3px 0 0}
  #menubar div.on{color:var(--green);font-weight:700;
    box-shadow:inset 0 -2.5px 0 var(--green)}
  #menubar div:not(.on):hover{background:#f4f4f4}

  /* ---- ribbon ---- */
  #ribbon{height:74px;background:linear-gradient(#fcfcfc,#f6f6f6);border-bottom:1px solid #e2e2e2;
    display:flex;align-items:stretch;padding:5px 4px 0;gap:0;flex:none;overflow-x:auto;scrollbar-width:none}
  #ribbon::-webkit-scrollbar{display:none}
  .rgrp{display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:4px 9px 3px;border-right:1px solid #ececec;min-width:max-content}
  .rgrp .row{display:flex;gap:5px;align-items:flex-start}
  .rgrp .lbl{font-size:10px;color:#9a9a9a;margin-top:4px}
  .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 7px;
    border:1px solid transparent;border-radius:4px;cursor:pointer;min-width:48px;color:#3a3a3a}
  .btn:hover{background:#eaf3ee;border-color:#cfe6da}
  .btn:active{background:#d8eadf}
  .btn .ic{font-size:18px;line-height:1}
  .btn .t{font-size:10px;white-space:nowrap}
  .btn.warn .ic{color:#c0392b}
  .btn.cool .ic{color:#2563eb}
  .btn.gold .ic{color:#d4a017}
  .btn.run .ic{color:var(--green)}
  .btn.dim{opacity:.45;pointer-events:none}

  /* ---- formula bar ---- */
  #fbar{height:27px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid var(--grid);font-size:12px;flex:none}
  #namebox{width:88px;height:100%;border-right:1px solid var(--grid);display:flex;
    align-items:center;justify-content:space-between;padding:0 7px;color:#333;
    font-family:Consolas,Menlo,monospace;font-weight:600;flex:none}
  #namebox .car{color:#bbb;font-size:9px}
  #fxmark{width:34px;text-align:center;color:#9a9a9a;font-style:italic;
    font-family:Georgia,serif;border-right:1px solid #ededed;flex:none}
  #formula{flex:1;padding:0 10px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #formula .fn{color:#7a3e9d;font-weight:700}
  #formula .str{color:#107c41}
  #formula .num{color:#1f6feb}
  #formula .ref{color:#b8860b;font-weight:600}

  /* ---- sheet ---- */
  #sheetwrap{position:relative;flex:1;overflow:hidden;background:#fff;min-height:0}
  #sheet{display:grid;background:#fff;position:absolute;inset:0}
  .hd{background:linear-gradient(#fbfbfb,#f2f2f2);border-right:1px solid var(--grid);
    border-bottom:1px solid var(--grid);display:flex;align-items:center;justify-content:center;
    color:#666;font-size:10.5px;font-weight:600;position:relative}
  .hd.hot{background:#d6ebe0;color:var(--green-d)}
  .cell{border-right:1px solid var(--gridlt);border-bottom:1px solid var(--gridlt);
    display:flex;align-items:center;justify-content:center;font-size:11px;
    overflow:hidden;cursor:cell;position:relative;line-height:1}
  .cell.sel{outline:2px solid var(--green);outline-offset:-2px;z-index:3}
  .cell.cap{box-shadow:inset 0 0 0 2px rgba(212,160,23,.9)}
  .cell .crown{position:absolute;top:-1px;right:1px;font-size:8px;color:#d4a017;
    text-shadow:0 0 2px #fff}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #ff3b30}
    50%{box-shadow:inset 0 0 0 2px #ffd2cf;background:#ffe7e5}}
  .cell.war{animation:warf .3s 4}
  @keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1);opacity:0}}
  .ripple{position:absolute;inset:0;border-radius:50%;background:#107c41;
    animation:pulse .6s ease-out forwards;pointer-events:none;z-index:4}

  /* ---- floating panel (legend / scoreboard) ---- */
  #panel{position:absolute;top:9px;right:11px;width:206px;background:#fffdf2;
    border:1px solid #ddc97a;box-shadow:3px 4px 14px rgba(0,0,0,.16);
    z-index:6;font-size:11px;border-radius:3px;overflow:hidden}
  #panel .pt{background:linear-gradient(#fff6cf,#ffedaf);padding:5px 9px;font-weight:700;
    color:#7a611c;font-size:11px;display:flex;justify-content:space-between;align-items:center;
    cursor:pointer}
  #panel .pt small{font-weight:400;color:#a08a3c}
  #panel .pb{padding:7px 9px;line-height:1.65;max-height:260px;overflow:auto}
  #panel.min .pb{display:none}
  .frow{display:flex;align-items:center;gap:6px;margin:1px 0}
  .frow .sw{width:10px;height:10px;border-radius:2px;flex:none}
  .frow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow .sz{color:#888;font-variant-numeric:tabular-nums;font-size:10px}
  .frow.led .nm{font-weight:700}
  .gold{color:#d4a017}
  .dead{color:#a0a0a0;font-size:10px;font-style:italic}
  .legk{display:inline-flex;align-items:center;gap:3px;margin-right:7px;color:#6a6a6a}
  .legk b{font-size:12px}
  .seas{margin-top:5px;padding-top:5px;border-top:1px dashed #e3d59a;color:#6a6a6a}

  /* ---- toast / command echo ---- */
  #toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    background:rgba(20,40,28,.93);color:#eafaf0;padding:7px 16px;border-radius:18px;
    font-size:12px;z-index:9;opacity:0;transition:opacity .25s;pointer-events:none;
    max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-family:Consolas,Menlo,monospace;box-shadow:0 4px 16px rgba(0,0,0,.3)}
  #toast.show{opacity:1}

  /* ---- tabs + status ---- */
  #tabs{height:25px;background:var(--panel);display:flex;align-items:stretch;
    padding-left:8px;border-top:1px solid var(--grid);font-size:11.5px;flex:none;
    overflow-x:auto;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  #tabs .tb{display:flex;align-items:center;padding:0 13px;border-right:1px solid #dcdcdc;
    background:#e9e9e9;color:#5a5a5a;cursor:pointer;white-space:nowrap}
  #tabs .tb.on{background:#fff;color:var(--green);font-weight:700;
    box-shadow:inset 0 2.5px 0 var(--green)}
  #tabs .add{padding:0 10px;color:#999;display:flex;align-items:center;cursor:default}
  #statusbar{height:24px;background:var(--green);color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;flex:none;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .ev{flex:1;overflow:hidden;text-overflow:ellipsis}
  #statusbar .zoom{margin-left:9px;opacity:.85;font-variant-numeric:tabular-nums}

  /* ---- overlay sheets (chronicle / obituary) ---- */
  #overlay{position:absolute;inset:0;background:#fff;z-index:7;display:none;
    flex-direction:column;font-size:12px}
  #overlay.show{display:flex}
  #overlay .oh{display:grid;grid-template-columns:54px 1fr;border-bottom:2px solid var(--grid);
    background:#f5f7f5;font-weight:700;color:#555}
  #overlay .oh div{padding:5px 9px;border-right:1px solid var(--grid)}
  #overlay .ob{flex:1;overflow:auto}
  #overlay .orow{display:grid;grid-template-columns:54px 1fr;border-bottom:1px solid #eee}
  #overlay .orow:nth-child(odd){background:#fafbfa}
  #overlay .orow div{padding:4px 9px;border-right:1px solid #eee;
    font-family:Consolas,Menlo,monospace;font-size:11.5px;line-height:1.5}
  #overlay .orow .c0{color:#888;text-align:right;font-weight:600}
  #overlay .orow .c1 .fn{color:#7a3e9d}
  #overlay .orow .c1 .str{color:#107c41}
  #overlay .orow.dead .c1{color:#9a3b3b}
  #overlay .empty{padding:30px;color:#aaa;text-align:center}

  @media (max-width:560px){
    #ribbon{height:66px}
    .btn{min-width:42px;padding:3px 5px}
    .btn .ic{font-size:16px}
    #panel{width:170px;top:7px;right:7px}
    #namebox{width:70px}
    #statusbar{font-size:10.5px}
    #statusbar .sep{margin:0 5px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <span id="ttl">강유역문명.xlsx - Excel</span>
    <span id="savestate">자동 저장: 켜짐 · 역사 기록 중…</span>
  </div>

  <div id="menubar">
    <div>파일</div><div class="on">홈</div><div>삽입</div><div>수식</div>
    <div>데이터</div><div>검토</div><div>보기</div><div>도움말</div>
  </div>

  <div id="ribbon">
    <div class="rgrp">
      <div class="row">
        <div class="btn run" data-cmd="spawn"><div class="ic">＋</div><div class="t">왕조 건국</div></div>
        <div class="btn cool" data-cmd="flood"><div class="ic">≋</div><div class="t">대범람</div></div>
      </div>
      <div class="lbl">시뮬레이션 (셀 선택 후 적용)</div>
    </div>
    <div class="rgrp">
      <div class="row">
        <div class="btn warn" data-cmd="plague"><div class="ic">疫</div><div class="t">역병</div></div>
        <div class="btn warn" data-cmd="fire"><div class="ic">火</div><div class="t">화재</div></div>
        <div class="btn gold" data-cmd="golden"><div class="ic">✦</div><div class="t">황금기</div></div>
        <div class="btn warn" data-cmd="smite"><div class="ic">⚡</div><div class="t">천벌</div></div>
      </div>
      <div class="lbl">신의 개입 (=INTERVENE)</div>
    </div>
    <div class="rgrp">
      <div class="row">
        <div class="btn" data-cmd="speed"><div class="ic">⏩</div><div class="t" id="speedT">속도 ×1</div></div>
        <div class="btn" data-cmd="pause"><div class="ic" id="pauseIc">⏸</div><div class="t" id="pauseT">일시정지</div></div>
      </div>
      <div class="lbl">시간 (=YEAR)</div>
    </div>
  </div>

  <div id="fbar">
    <div id="namebox"><span id="nm">A1</span><span class="car">▾</span></div>
    <div id="fxmark">fx</div>
    <div id="formula"></div>
  </div>

  <div id="sheetwrap">
    <div id="sheet"></div>
    <div id="overlay">
      <div class="oh"><div>행</div><div id="ohlabel">수식</div></div>
      <div class="ob" id="obody"></div>
    </div>
    <div id="panel">
      <div class="pt" id="ptHead">세력 현황 <small id="ptYear">서기 1년</small></div>
      <div class="pb" id="pbody"></div>
    </div>
    <div id="toast"></div>
  </div>

  <div id="tabs">
    <div class="tb on" data-sheet="map">세계지도</div>
    <div class="tb" data-sheet="chron">연대기</div>
    <div class="tb" data-sheet="dead">멸망기록 <span id="deadCount">(0)</span></div>
    <div class="add">＋</div>
  </div>

  <div id="statusbar">
    <span class="ev" id="status">준비</span>
    <span class="zoom" id="zoom">강 유역 · 100%</span>
  </div>
</div>

<script>
(() => {
"use strict";
/* =========================================================================
   강유역문명.xlsx — 엑셀로 위장한 살아있는 고대 강 유역 문명 시뮬
   컨셉 변주: 시트 중앙을 가로지르는 강(江)이 핵심.
     · 강은 주기적으로 범람(seasonal flood)하여 양안에 비옥한 충적토(沖積土)를 깐다.
     · 도시는 비옥한 땅에서 빠르게 성장, 사막에선 정체. 강 = 문명의 동맥.
     · 셀=세계지도. 셀 클릭 후 리본 명령으로 신처럼 개입(=INTERVENE).
   ========================================================================= */

const sheet   = document.getElementById('sheet');
const fmla    = document.getElementById('formula');
const nmEl    = document.getElementById('nm');
const statusEl= document.getElementById('status');
const pbody   = document.getElementById('pbody');
const ptYear  = document.getElementById('ptYear');
const toast   = document.getElementById('toast');
const overlay = document.getElementById('overlay');
const obody   = document.getElementById('obody');
const ohlabel = document.getElementById('ohlabel');

/* ---- 그리드 크기: 뷰포트에 맞춤 (데스크톱1440 / 모바일390 반응형) ---- */
let COLS, ROWS, N, CW, CH;
function computeGrid(){
  const mobile = innerWidth < 560;
  CW = mobile ? 26 : 34;
  CH = mobile ? 22 : 24;
  const availW = sheetwrap_w();
  const availH = sheetwrap_h();
  COLS = Math.max(16, Math.min(46, Math.floor((availW - 48) / CW)));
  ROWS = Math.max(14, Math.min(40, Math.floor((availH - 1) / CH)));
  N = COLS * ROWS;
}
const sheetwrapEl = document.getElementById('sheetwrap');
function sheetwrap_w(){ return sheetwrapEl.clientWidth || innerWidth; }
function sheetwrap_h(){ return sheetwrapEl.clientHeight || (innerHeight-200); }

/* ---- 열 이름 A,B,…,Z,AA,AB,… ---- */
function colName(n){ let s=''; n++; while(n>0){const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0;} return s; }
function ref(i){ return colName(i%COLS)+(Math.floor(i/COLS)+1); }

/* ---- 상태 ---- */
let cells=[], cellEls=[], rowHd=[], colHd=[];
let factions=[], obituaries=[], chronicle=[];
let year=1, pop=0, lastEvent='태초에 강이 흘렀다.', selected=-1;
let plague=new Map(), fires=new Map();
let dirty=new Set();
let nameIdx=0, tickN=0, warCool=0, riverRow=0;
let speed=1, paused=false, timer=null;
let season='건기', floodTimer=18, floodActive=0;
let curSheet='map';

const SPEEDS=[1,2,4];
const NAMES=['수메르 도시국가','나일 왕조','인더스 연맹','바빌론 제국','아시리아 군단','히타이트 부족',
  '엘람 왕국','아카드 패권','갈대의 민족','검은땅 사제국','우르 신정','청동 상단'];
const COLORS=['#2563eb','#dc2626','#059669','#7c3aed','#d97706','#0d9488',
  '#be185d','#4d7c0f','#9333ea','#b45309','#0e7490','#a21caf'];

/* 지형 상태: water(강) / fertile(충적토) / land(평야) / desert(사막) / forest(숲) / ruin(폐허) */
const LV_TXT  =['','·','田','邑','城','都'];           // 0..5 정주 단계
const LV_LABEL=['','개척지','농경지','읍락','성읍','대도시'];

/* ---------- 빌드: 시트 DOM ---------- */
function buildSheet(){
  computeGrid();
  sheet.style.gridTemplateColumns = `48px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows = CH+'px';
  sheet.innerHTML='';
  cellEls=new Array(N); rowHd=[]; colHd=[];
  const frag=document.createDocumentFragment();
  const corner=document.createElement('div'); corner.className='hd'; corner.textContent='江';
  corner.style.color='#9dc3e6'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){ const h=document.createElement('div'); h.className='hd'; h.textContent=colName(c); colHd[c]=h; frag.appendChild(h); }
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div'); h.className='hd'; h.textContent=r+1; rowHd[r]=h; frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div'); d.className='cell'; d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d; frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

/* ---------- 지형 생성: 가로지르는 강 + 비옥한 양안 + 사막 ---------- */
function genTerrain(){
  cells=new Array(N);
  riverRow = Math.floor(ROWS*0.42) + (Math.random()*3-1|0);
  // 강 경로를 살짝 구불구불하게
  const riverAt=new Array(COLS);
  let rr=riverRow;
  for(let c=0;c<COLS;c++){
    riverAt[c]=rr;
    if(Math.random()<0.34) rr += (Math.random()<0.5?-1:1);
    rr=Math.max(1,Math.min(ROWS-2,rr));
  }
  for(let i=0;i<N;i++){
    const x=i%COLS, y=i/COLS|0;
    const dRiver=Math.abs(y - riverAt[x]);
    let st='land', hist=['미개척 평야'], fert=0;
    if(dRiver===0){ st='water'; hist=['강']; fert=0; }
    else if(dRiver<=1){ st='fertile'; hist=['충적토']; fert=3; }
    else if(dRiver<=2){ st='land'; hist=['하안 평야']; fert=2; }
    else if(dRiver>=Math.max(4,ROWS*0.30)){ // 강에서 멀면 사막/황무지
      if(Math.random()<0.62){ st='desert'; hist=['사막']; fert=0; }
      else { st='land'; hist=['건조 평야']; fert=1; }
    } else {
      if(Math.random()<0.16){ st='forest'; hist=['삼나무 숲']; fert=1; }
      else { st='land'; hist=['평야']; fert=1; }
    }
    cells[i]={st,owner:null,level:0,hist,fert,baseFert:fert,ruinT:0};
  }
  // 지류(支流) 몇 개: 강에서 위/아래로 뻗는 작은 물줄기
  for(let t=0;t<2+(COLS/16|0);t++){
    let c=2+Math.random()*(COLS-4)|0, y=riverAt[c];
    const dir=Math.random()<0.5?-1:1, len=2+Math.random()*4|0;
    for(let s=0;s<len;s++){
      y+=dir; if(y<1||y>=ROWS-1) break;
      const i=y*COLS+c;
      cells[i].st='water'; cells[i].hist=['지류']; cells[i].fert=0; cells[i].baseFert=0;
      // 지류 옆도 비옥
      const side=c+(Math.random()<0.5?-1:1);
      if(side>=0&&side<COLS){ const j=y*COLS+side; if(cells[j].st!=='water'){cells[j].st='fertile';cells[j].fert=3;cells[j].baseFert=3;cells[j].hist=['지류 충적토'];}}
      if(Math.random()<0.3) c+=(Math.random()<0.5?-1:1);
      c=Math.max(0,Math.min(COLS-1,c));
    }
  }
}

function nbrs(i){
  const x=i%COLS, y=i/COLS|0, out=[];
  if(x>0) out.push(i-1);
  if(x<COLS-1) out.push(i+1);
  if(y>0) out.push(i-COLS);
  if(y<ROWS-1) out.push(i+COLS);
  return out;
}
function facById(id){ return factions.find(f=>f.id===id); }
function hexA(hex,a){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }

/* ---------- 수식 표기(하이라이트) ----------
   단일 토크나이저: HTML을 escape한 뒤 토큰별로 한 번씩만 감싼다.
   (체이닝 replace는 삽입된 마크업을 다시 매칭해 깨지므로 금지) */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const FMLA_RE = /("[^"]*")|([A-Z][A-Z.]*(?=\())|(\$?[A-Z]{1,3}\$?\d+)\b|(\d+)/g;
function fmtFormula(s){
  let out='', last=0, m;
  FMLA_RE.lastIndex=0;
  while((m=FMLA_RE.exec(s))){
    out += esc(s.slice(last,m.index));
    if(m[1])      out += '<span class="str">'+esc(m[1])+'</span>';
    else if(m[2]) out += '<span class="fn">'+esc(m[2])+'</span>';
    else if(m[3]) out += '<span class="ref">'+esc(m[3])+'</span>';
    else if(m[4]) out += '<span class="num">'+esc(m[4])+'</span>';
    last = m.index + m[0].length;
  }
  out += esc(s.slice(last));
  return out;
}
function setFormula(s){ fmla.innerHTML=fmtFormula(s); }

/* ---------- 로그 ---------- */
function logEvent(msg, formula){
  lastEvent=`서기 ${year}년 — ${msg}`;
  if(formula){ setFormula(formula); chronicle.push({y:year, f:formula, dead:/COLLAPSE|FALL/.test(formula)}); if(chronicle.length>400) chronicle.shift(); }
  if(curSheet==='chron'||curSheet==='dead') renderOverlay();
}

/* ---------- 건국 ---------- */
function spawnFaction(announce, atIdx){
  if(nameIdx>=NAMES.length) nameIdx=0;
  const f={ id: factions.length?Math.max(...factions.map(x=>x.id))+1:0,
    name:NAMES[nameIdx], color:COLORS[nameIdx%COLORS.length], golden:0, size:0, arr:[], peak:0, capital:-1 };
  nameIdx++;
  let placed=-1;
  if(atIdx!=null && cells[atIdx] && cells[atIdx].st!=='water' && cells[atIdx].owner===null){
    placed=atIdx;
  } else {
    // 비옥한 강가 우선 배치
    for(let tries=0;tries<400;tries++){
      const i=Math.random()*N|0, c=cells[i];
      if(c.st==='water'||c.owner!==null) continue;
      if(tries<260 && c.fert<2) continue;       // 초반엔 비옥지만
      placed=i; break;
    }
  }
  if(placed<0) return null;
  setCell(placed, f.id, 1, '건국');
  f.capital=placed;
  factions.push(f);
  if(announce) logEvent(`${f.name}이(가) ${ref(placed)}의 강가에서 일어섰다.`, `=SPAWN("${f.name}", ${ref(placed)})`);
  return f;
}

function setCell(i, owner, level, histLabel){
  const c=cells[i];
  c.owner=owner; c.level=level; if(c.st==='ruin'||c.st==='desert') {} c.st = c.st==='water'?'water':(c.st);
  if(c.st==='water') return;
  if(histLabel){ c.hist.push(histLabel); if(c.hist.length>8) c.hist.shift(); }
  dirty.add(i);
}

/* ---------- 페인트 ---------- */
function paint(i){
  const c=cells[i], el=cellEls[i];
  if(!el) return;
  let bg='', tx='', col='#333', w='', crown='';
  if(plague.has(i)){ bg='#ead5f5'; tx='疫'; col='#7030a0'; w='700'; }
  else if(fires.has(i)){ bg='#ffd9b3'; tx='火'; col='#c0392b'; w='700'; }
  else if(c.st==='water'){ bg = floodActive? '#bcd6f0':'#dcebf9'; tx='≈'; col='#7fb0e0'; }
  else if(c.st==='ruin'){ bg='#ededed'; tx='墟'; col='#9a9a9a'; }
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      bg=hexA(f.color, .12 + c.level*.16);
      tx=LV_TXT[c.level]; col=f.color; w=c.level>=4?'700':'';
      if(i===f.capital){ crown='★'; }
    } else { c.owner=null; c.level=0; }
  }
  if(!tx && c.owner===null){
    if(c.st==='desert'){ bg='#fbf3e0'; tx='∴'; col='#d9b878'; }
    else if(c.st==='forest'){ bg='#e3efda'; tx='木'; col='#558b2f'; }
    else if(c.st==='fertile'){ bg='#f4f9ec'; tx=''; col='#7cb342'; }
    else { bg = c.fert>=2? '#fbfdf6':''; tx=''; }
  }
  // 충적토 강조 (소유 없을 때 옅은 초록 점)
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  el.textContent=tx;
  // 수도 왕관
  let cr=el.querySelector('.crown');
  if(crown){ if(!cr){cr=document.createElement('span');cr.className='crown';el.appendChild(cr);} cr.textContent=crown; }
  else if(cr){ cr.remove(); }
}
function paintAll(){ for(let i=0;i<N;i++) paint(i); }

/* ---------- 전쟁 플래시 ---------- */
function flashWar(i){ const el=cellEls[i]; if(!el)return; el.classList.add('war'); setTimeout(()=>el.classList.remove('war'),1200); }

/* ---------- 계절/범람 ---------- */
function updateSeason(){
  floodTimer--;
  if(floodTimer===4){ season='우기'; }
  if(floodTimer<=0){
    // 대범람: 강 주변에 충적토 회복/확장, 강가 저지대 일부 침수
    floodActive=6; floodTimer=20+(Math.random()*10|0); season='범람';
    let restored=0, flooded=0;
    for(let i=0;i<N;i++){
      const c=cells[i];
      if(c.st==='water'){
        for(const nb of nbrs(i)){
          const t=cells[nb];
          if(t.st==='desert'&&Math.random()<0.15){ t.st='land'; t.fert=2; t.baseFert=2; t.hist.push('범람 개간'); dirty.add(nb); }
          if((t.st==='land'||t.st==='fertile')&&t.fert<3){ t.fert=Math.min(3,t.fert+1); restored++; if(t.fert>=3){t.st='fertile';dirty.add(nb);} }
          // 강 바로 옆 낮은 정착지 침수 위험
          if(t.owner!==null && t.level<=1 && Math.random()<0.10){ t.owner=null; t.level=0; t.hist.push('범람 침수'); flooded++; dirty.add(nb); }
        }
      }
    }
    logEvent(`강이 범람하여 ${restored}칸의 충적토가 비옥해졌다.${flooded?` (${flooded}칸 침수)`:''}`, `=FLOOD(江, season="범람")`);
  } else if(floodActive>0){ floodActive--; if(floodActive===0){ season='건기'; } }
  else if(floodTimer>8 && season!=='건기'){ season='건기'; }
}

/* ---------- 틱 ---------- */
function tick(){
  tickN++; year++;
  if(warCool>0) warCool--;
  updateSeason();

  // 재집계
  for(const f of factions){ f.arr.length=0; f.size=0; }
  pop=0;
  const PW=[0,30,120,360,950,2400];
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin' && --c.ruinT<=0){ c.st='land'; c.fert=c.baseFert; dirty.add(i); }
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){ f.arr.push(i); f.size++; pop+=PW[c.level]; }
      else { c.owner=null; c.level=0; dirty.add(i); }
    }
  }

  // 멸망 판정
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      obituaries.push({name:f.name, year, peak:f.peak});
      logEvent(`${f.name}이(가) 역사 속으로 사라졌다. (최대 ${f.peak}칸)`, `=COLLAPSE("${f.name}", year=${year}, peak=${f.peak})`);
      factions.splice(k,1);
    }
  }

  // 화재 확산/소멸
  for(const [i,t] of [...fires]){
    if(Math.random()<0.13){
      for(const n of nbrs(i)){ const c=cells[n]; if(c.owner!==null&&!fires.has(n)&&c.st!=='water'){ fires.set(n,5); dirty.add(n);} }
    }
    if(t<=1){ fires.delete(i); const c=cells[i]; c.owner=null; c.level=0; c.st='ruin'; c.ruinT=160; c.hist.push('잿더미'); dirty.add(i); }
    else fires.set(i,t-1);
  }

  // 역병
  if(plague.size){
    for(const [i,t] of [...plague]){
      if(Math.random()<0.17){ for(const n of nbrs(i)){ if(cells[n].owner!==null&&!plague.has(n)){ plague.set(n,11); dirty.add(n);} } }
      if(Math.random()<0.23){ const c=cells[i]; c.level--; if(c.level<=0){ c.owner=null; c.level=0; c.hist.push('역병 폐촌'); } dirty.add(i); }
      if(t<=1){ plague.delete(i); dirty.add(i); } else plague.set(i,t-1);
    }
    if(plague.size===0) logEvent('역병이 잦아들었다.', '=PLAGUE.END()');
  }

  // 국가 행동
  for(const f of factions){
    if(f.golden>0) f.golden--;
    if(f.size===0) continue;
    if(f.size>f.peak) f.peak=f.size;

    // 확장: 비옥/물가 우선
    const attempts=1+(f.size*0.08|0);
    for(let a=0;a<attempts;a++){
      const src=f.arr[Math.random()*f.arr.length|0];
      if(src===undefined||cells[src].owner!==f.id) continue;
      const nb=nbrs(src);
      // 비옥한 칸을 선호하도록 가중 선택
      let tgt=nb[Math.random()*nb.length|0];
      for(const cand of nb){ if(cells[cand].owner===null && cells[cand].fert>cells[tgt].fert && cells[cand].st!=='water') tgt=cand; }
      const tc=cells[tgt];
      if(tc.st==='water'||fires.has(tgt)) continue;
      if(tc.owner===null){
        const settleP = tc.st==='forest'?0.3 : tc.st==='desert'?0.12 : 1;
        if(Math.random()<settleP){
          if(tc.st==='forest'){ tc.st='land'; tc.fert=Math.max(1,tc.fert); tc.hist.push('벌목 개간'); }
          setCell(tgt, f.id, 1, '개척지');
        }
      } else if(tc.owner!==f.id && Math.random()<0.3){
        // 전쟁
        const att=1+Math.random()*3 + f.size*0.002 + (f.golden?1.3:0);
        const def=tc.level+1+Math.random()*3 + cells[f.capital===tgt?tgt:tgt].fert*0.1;
        flashWar(tgt);
        if(att>def){
          const defF=facById(tc.owner);
          const wasCap = defF && defF.capital===tgt;
          if(Math.random()<0.28){ fires.set(tgt,5); tc.hist.push('전화(戰火)'); dirty.add(tgt); }
          else { setCell(tgt, f.id, Math.max(1,tc.level-1), wasCap?'수도 함락':'점령됨'); if(wasCap){ relocateCapital(defF); } }
          if((tc.level>=3||wasCap||warCool===0)&&defF){
            logEvent(`${f.name}이(가) ${defF.name}의 ${wasCap?'수도':(LV_LABEL[Math.max(1,tc.level)]||'영토')} ${ref(tgt)}을(를) 쳤다.`,
              `=WAR("${f.name}"→"${defF.name}", ${ref(tgt)}${wasCap?', capital':''})`);
            warCool=wasCap?6:34;
          }
        }
      }
    }

    // 발전: 비옥할수록 빠름
    const ups=1+(f.size*0.06|0);
    for(let u=0;u<ups;u++){
      const i=f.arr[Math.random()*f.arr.length|0];
      if(i===undefined||cells[i].owner!==f.id) continue;
      const c=cells[i];
      const growP = 0.05 * (1 + c.fert*0.6) * (f.golden?2.4:1);
      if(c.level<5 && Math.random()<growP){
        c.level++;
        c.hist.push(LV_LABEL[c.level]); if(c.hist.length>8) c.hist.shift();
        dirty.add(i);
        if(c.level===5 && warCool===0){ logEvent(`${f.name}의 ${ref(i)}이(가) 대도시로 융성했다.`, `=METROPOLIS("${f.name}", ${ref(i)})`); warCool=22; }
      }
    }
  }

  // 무작위 사건
  const r=Math.random();
  if(!plague.size && r<0.004){ randDisaster('plague'); }
  else if(r>0.9965){ // 황금기
    if(factions.length){ const f=factions[Math.random()*factions.length|0]; f.golden=90;
      logEvent(`${f.name}에 황금기가 도래했다.`, `=GOLDEN.AGE("${f.name}", 90)`); }
  } else if(r>0.993 && r<=0.9965){ randDisaster('fire'); }
  // 자연 도래 (해상/사막 이주민)
  if(factions.length<3 && Math.random()<0.02 && factions.length<8){
    const f=spawnFaction(false);
    if(f) logEvent(`${f.name}이(가) 강을 따라 이주해 왔다.`, `=MIGRATE("${f.name}", 江)`);
  }

  // 수도 재배치(잃었을 때)
  for(const f of factions){ if(f.capital<0 || cells[f.capital].owner!==f.id) relocateCapital(f); }

  flushPaint();
  renderStatus();
  if(tickN%6===0) renderPanel();
}

function relocateCapital(f){
  if(!f||!f.arr||!f.arr.length) { if(f) f.capital=-1; return; }
  let best=f.arr[0], bl=-1;
  for(const i of f.arr){ const sc=cells[i].level*2 + cells[i].fert; if(sc>bl){bl=sc; best=i;} }
  f.capital=best; dirty.add(best);
}

function randDisaster(kind){
  const pool=[];
  for(let i=0;i<N;i++){ const c=cells[i]; if(c.owner!==null && c.level>=(kind==='plague'?3:2)) pool.push(i); }
  if(!pool.length) return;
  const i=pool[Math.random()*pool.length|0];
  if(kind==='plague'){ plague.set(i,11); dirty.add(i); logEvent(`${ref(i)}에서 역병이 창궐했다.`, `=PLAGUE(${ref(i)})`); }
  else { fires.set(i,6); dirty.add(i); logEvent(`${ref(i)}에 대화재가 번졌다.`, `=FIRE(${ref(i)})`); }
}

function flushPaint(){ for(const i of dirty) paint(i); dirty.clear(); }

/* ---------- 상태바 / 패널 ---------- */
function renderStatus(){
  const seasonIc = season==='범람'?'≋ 범람기':season==='우기'?'☁ 우기':'☀ 건기';
  statusEl.innerHTML =
    `준비<span class="sep">|</span>서기 ${year}년<span class="sep">|</span>`+
    `${seasonIc}<span class="sep">|</span>`+
    `인구 ${pop.toLocaleString()}<span class="sep">|</span>`+
    `국가 ${factions.length}<span class="sep">|</span>`+
    `<span style="opacity:.92">${lastEvent}</span>`;
}
function renderPanel(){
  ptYear.textContent=`서기 ${year}년`;
  document.title = `강유역문명.xlsx - Excel (서기 ${year}년)`;
  document.getElementById('deadCount').textContent=`(${obituaries.length})`;
  const sorted=[...factions].sort((a,b)=>b.size-a.size);
  let h='';
  if(!sorted.length) h='<div class="dead">살아있는 문명이 없다…</div>';
  sorted.forEach((f,idx)=>{
    h+=`<div class="frow${idx===0?' led':''}"><span class="sw" style="background:${f.color}"></span>`+
       `<span class="nm">${f.name}${f.golden?' <span class="gold">✦</span>':''}</span>`+
       `<span class="sz">${f.size}칸</span></div>`;
  });
  // 범례
  h+=`<div class="seas">`+
     `<span class="legk"><b style="color:#7fb0e0">≈</b>강</span>`+
     `<span class="legk"><b style="color:#7cb342">▦</b>충적토</span>`+
     `<span class="legk"><b style="color:#d9b878">∴</b>사막</span>`+
     `<br><span class="legk">田읍城都=정주단계</span>`+
     `<span class="legk gold">★수도</span>`+
     `</div>`;
  if(obituaries.length){
    h+='<div class="seas"><b style="color:#9a3b3b">최근 멸망</b><br>';
    for(const o of obituaries.slice(-3)) h+=`<span class="dead">† ${o.name} (${o.year}년)</span><br>`;
    h+='</div>';
  }
  pbody.innerHTML=h;
}

/* ---------- 오버레이 시트(연대기/멸망기록) ---------- */
function renderOverlay(){
  if(curSheet==='map'){ overlay.classList.remove('show'); return; }
  overlay.classList.add('show');
  if(curSheet==='chron'){
    ohlabel.textContent='연대기 (=CHRONICLE)';
    const rows=chronicle.slice(-200).reverse();
    obody.innerHTML = rows.length
      ? rows.map(r=>`<div class="orow${r.dead?' dead':''}"><div class="c0">${r.y}</div><div class="c1">${fmtFormula(r.f)}</div></div>`).join('')
      : '<div class="empty">아직 기록된 사건이 없습니다.</div>';
  } else {
    ohlabel.textContent='멸망기록 (=OBITUARY)';
    const rows=[...obituaries].reverse();
    obody.innerHTML = rows.length
      ? rows.map(o=>`<div class="orow dead"><div class="c0">${o.year}</div><div class="c1"><span class="fn">FALL</span>("<span class="str">${o.name}</span>", 최대영토=${o.peak}칸)</div></div>`).join('')
      : '<div class="empty">멸망한 문명이 아직 없습니다.</div>';
  }
}

/* ---------- 셀 선택 ---------- */
function selectCell(i){
  if(selected>=0 && cellEls[selected]) cellEls[selected].classList.remove('sel');
  selected=i;
  const el=cellEls[i];
  if(el) el.classList.add('sel');
  nmEl.textContent=ref(i);
  // 헤더 하이라이트
  colHd.forEach((h,c)=>h.classList.toggle('hot', c===i%COLS));
  rowHd.forEach((h,r)=>h.classList.toggle('hot', r===(i/COLS|0)));
  const c=cells[i];
  let desc;
  const f=c.owner!==null?facById(c.owner):null;
  if(f){
    const isCap=f.capital===i;
    desc=`=CELL("${ref(i)}", "${f.name}"${isCap?', 수도':''}, "${LV_LABEL[c.level]||'영토'}", 비옥도=${c.fert})`;
  } else {
    desc=`=HISTORY(${ref(i)}: ${c.hist.slice(-4).map(x=>`"${x}"`).join('→')})`;
  }
  setFormula(desc);
}

/* ---------- 명령(개입) ---------- */
function showToast(msg){ toast.textContent=msg; toast.classList.add('show'); clearTimeout(showToast._t); showToast._t=setTimeout(()=>toast.classList.remove('show'),1900); }
function ripple(i){ const el=cellEls[i]; if(!el)return; const r=document.createElement('div'); r.className='ripple'; el.appendChild(r); setTimeout(()=>r.remove(),650); }

function runCommand(cmd){
  if(cmd==='speed'){ const k=(SPEEDS.indexOf(speed)+1)%SPEEDS.length; speed=SPEEDS[k]; document.getElementById('speedT').textContent=`속도 ×${speed}`; restartTimer(); showToast(`=SET.SPEED(×${speed})`); return; }
  if(cmd==='pause'){ paused=!paused; document.getElementById('pauseIc').textContent=paused?'▶':'⏸'; document.getElementById('pauseT').textContent=paused?'재개':'일시정지'; restartTimer(); showToast(paused?'=PAUSE() // 시간이 멈췄다':'=RESUME()'); return; }

  // 셀 대상 명령
  if(cmd==='spawn'){
    const at = (selected>=0 && cells[selected] && cells[selected].st!=='water' && cells[selected].owner===null)?selected:null;
    const f=spawnFaction(true, at);
    if(f){ ripple(f.capital); selectCell(f.capital); showToast(`=SPAWN("${f.name}", ${ref(f.capital)})`); }
    else showToast('빈 육지 칸을 먼저 선택하세요');
    flushPaint(); renderPanel(); return;
  }
  if(cmd==='flood'){
    floodTimer=1; showToast('=FLOOD(江) // 강이 범람한다'); return;
  }
  if(selected<0){ showToast('먼저 셀을 클릭해 대상을 고르세요'); return; }
  const i=selected, c=cells[i];
  if(cmd==='plague'){ if(c.owner!==null){ plague.set(i,11); dirty.add(i); ripple(i); logEvent(`신이 ${ref(i)}에 역병을 내렸다.`, `=INTERVENE.PLAGUE(${ref(i)})`); showToast(`=PLAGUE(${ref(i)})`);} else showToast('정착지를 선택하세요'); }
  else if(cmd==='fire'){ if(c.owner!==null){ fires.set(i,6); dirty.add(i); ripple(i); logEvent(`${ref(i)}에 불이 붙었다.`, `=INTERVENE.FIRE(${ref(i)})`); showToast(`=FIRE(${ref(i)})`);} else showToast('정착지를 선택하세요'); }
  else if(cmd==='golden'){ if(c.owner!==null){ const f=facById(c.owner); if(f){f.golden=120; ripple(i); logEvent(`${f.name}에 황금기를 하사했다.`, `=GOLDEN.AGE("${f.name}", 120)`); showToast(`=GOLDEN.AGE("${f.name}")`);} } else showToast('정착지를 선택하세요'); }
  else if(cmd==='smite'){ if(c.owner!==null){ const f=facById(c.owner); c.owner=null; c.level=0; c.st='ruin'; c.ruinT=160; c.hist.push('천벌'); dirty.add(i); ripple(i); logEvent(`신이 ${ref(i)}에 천벌을 내렸다.`, `=SMITE(${ref(i)})`); showToast(`=SMITE(${ref(i)})`);} else showToast('정착지를 선택하세요'); }
  flushPaint(); renderPanel();
}

/* ---------- 타이머 ---------- */
function restartTimer(){ if(timer) clearInterval(timer); if(!paused) timer=setInterval(tick, Math.round(120/speed)); }

/* ---------- 시트 탭 ---------- */
function switchSheet(s){
  curSheet=s;
  document.querySelectorAll('#tabs .tb').forEach(t=>t.classList.toggle('on', t.dataset.sheet===s));
  if(s==='map'){ overlay.classList.remove('show'); document.getElementById('zoom').textContent='강 유역 · 100%'; }
  else { renderOverlay(); document.getElementById('zoom').textContent = s==='chron'?'연대기':'멸망기록'; }
}

/* ---------- 이벤트 ---------- */
sheet.addEventListener('click', e=>{ const t=e.target.closest('.cell'); if(t) selectCell(+t.dataset.i); });
document.getElementById('ribbon').addEventListener('click', e=>{ const b=e.target.closest('.btn'); if(b&&!b.classList.contains('dim')) runCommand(b.dataset.cmd); });
document.getElementById('tabs').addEventListener('click', e=>{ const t=e.target.closest('.tb'); if(t) switchSheet(t.dataset.sheet); });
document.getElementById('ptHead').addEventListener('click', ()=>document.getElementById('panel').classList.toggle('min'));
document.getElementById('menubar').addEventListener('click', e=>{ const d=e.target.closest('div'); if(d){ document.querySelectorAll('#menubar div').forEach(x=>x.classList.remove('on')); d.classList.add('on'); } });

let resizeT;
addEventListener('resize', ()=>{ clearTimeout(resizeT); resizeT=setTimeout(()=>{ rebuild(); }, 250); });

function rebuild(){
  buildSheet(); genTerrain();
  // 새 지형에 기존 국가 재배치 (간단히 리셋이 자연스러우므로 보존하지 않음)
  factions=[]; obituaries=[]; chronicle=[]; plague.clear(); fires.clear(); dirty.clear();
  nameIdx=0; year=1; selected=-1;
  paintAll();
  setFormula(`=SIM.CIVILIZATION($A$1:$${colName(COLS-1)}$${ROWS}, river=row(${riverRow+1}), "강은 문명의 어머니다")`);
  spawnFaction(true); spawnFaction(true); spawnFaction(true);
  renderStatus(); renderPanel();
}

/* ---------- 시작 ---------- */
function start(){
  buildSheet(); genTerrain(); paintAll();
  setFormula(`=SIM.CIVILIZATION($A$1:$${colName(COLS-1)}$${ROWS}, river=row(${riverRow+1}), "강은 문명의 어머니다")`);
  spawnFaction(true); spawnFaction(true); spawnFaction(true);
  selectCell(factions.length?factions[0].capital:0);
  setFormula(`=SIM.CIVILIZATION($A$1:$${colName(COLS-1)}$${ROWS}, river=row(${riverRow+1}), "강은 문명의 어머니다")`);
  renderStatus(); renderPanel();
  restartTimer();
}
start();

})();
</script>
</body>
</html>
