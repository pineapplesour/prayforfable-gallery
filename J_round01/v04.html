<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>화산군도.xlsx - Excel</title>
<style>
  :root{
    --grid-line:#d4d9d3; --excel-green:#107c41; --ribbon:#f9f8f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#dfe1de;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;
    font-size:12px;color:#1d1d1d;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent}
  #app{display:flex;flex-direction:column;height:100%}

  /* ---- 타이틀바 ---- */
  #titlebar{height:30px;flex:0 0 30px;background:linear-gradient(#f6f5f4,#eceae8);
    display:flex;align-items:center;padding:0 11px;gap:8px;border-bottom:1px solid #d9d6d3}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  #titlebar .tt{margin-left:10px;color:#3a3a3a;font-size:12px;font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #titlebar .xicon{margin-left:auto;color:#fff;background:var(--excel-green);
    width:18px;height:18px;border-radius:3px;display:flex;align-items:center;
    justify-content:center;font-weight:700;font-size:11px;font-family:Georgia,serif}

  /* ---- 리본 메뉴 ---- */
  #menubar{height:30px;flex:0 0 30px;background:#fff;display:flex;align-items:flex-end;
    padding:0 4px;border-bottom:1px solid #e6e3e0;font-size:12.5px;color:#444;overflow-x:auto;
    scrollbar-width:none}
  #menubar::-webkit-scrollbar{display:none}
  #menubar div{padding:5px 11px;white-space:nowrap;border-radius:4px 4px 0 0;cursor:default}
  #menubar div.on{color:var(--excel-green);border-bottom:2.5px solid var(--excel-green);
    font-weight:600}
  #menubar div:hover:not(.on){background:#f1efed}

  /* ---- 리본 툴 (홈) ---- */
  #ribbon{flex:0 0 auto;background:var(--ribbon);border-bottom:1px solid #e0ddd9;
    display:flex;align-items:center;gap:6px;padding:5px 10px;overflow-x:auto;
    scrollbar-width:none}
  #ribbon::-webkit-scrollbar{display:none}
  .rbtn{display:flex;flex-direction:column;align-items:center;gap:2px;
    background:#fff;border:1px solid #dcd8d4;border-radius:5px;padding:4px 9px;
    cursor:pointer;min-width:54px;transition:.08s;white-space:nowrap}
  .rbtn:hover{background:#eef7f1;border-color:#9fd3b5}
  .rbtn:active{transform:translateY(1px)}
  .rbtn .ic{font-size:15px;line-height:1;font-weight:700}
  .rbtn .lb{font-size:10px;color:#555}
  .ic-erupt  .ic{color:#dc2626}
  .ic-quake  .ic{color:#0e7490}
  .ic-plague .ic{color:#7c3aed}
  .ic-colony .ic{color:#0891b2}
  .ic-bless  .ic{color:#ca8a04}
  .rbtn.armed{background:var(--excel-green);border-color:var(--excel-green)}
  .rbtn.armed .ic,.rbtn.armed .lb{color:#fff}
  .rsep{width:1px;height:30px;background:#dcd8d4;flex:0 0 auto;margin:0 3px}
  .rgroup-lbl{font-size:9px;color:#999;align-self:flex-end;margin:0 4px -2px;
    white-space:nowrap}

  /* ---- 수식바 ---- */
  #fbar{height:28px;flex:0 0 28px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4}
  #namebox{width:74px;flex:0 0 74px;height:100%;border-right:1px solid #ddd;display:flex;
    align-items:center;justify-content:center;color:#333;font-weight:600;gap:4px}
  #namebox .dd{color:#aaa;font-size:9px}
  #fxlabel{width:34px;flex:0 0 34px;text-align:center;color:#9a9a9a;font-style:italic;
    font-family:Georgia,serif;border-right:1px solid #eee}
  #formula{flex:1;min-width:0;padding:0 9px;font-family:Consolas,"D2Coding",Menlo,monospace;
    font-size:12px;color:#16320f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #formula .fn{color:#7c2d12;font-weight:600}
  #formula .str{color:#0a6b3a}
  #formula .num{color:#1d4ed8}

  /* ---- 시트 ---- */
  #sheetwrap{position:relative;flex:1 1 auto;overflow:hidden;background:#fff;min-height:0}
  #sheet{display:grid;background:#fff;position:absolute;inset:0}
  .hd{background:#f4f3f1;border-right:1px solid #d9d6d3;border-bottom:1px solid #d9d6d3;
    display:flex;align-items:center;justify-content:center;color:#5f5f5f;font-size:11px;
    font-weight:500}
  .hd.colhd.act{background:#cfe9da;color:#0a5e30;font-weight:700}
  .hd.rowhd.act{background:#cfe9da;color:#0a5e30;font-weight:700}
  .cell{border-right:1px solid #ecedeb;border-bottom:1px solid #ecedeb;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;cursor:cell;position:relative;font-variant-emoji:text}
  .cell.sel{outline:2px solid var(--excel-green);outline-offset:-2px;z-index:3}
  .cell .glyph{line-height:1;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif}

  @keyframes warpulse{0%,100%{box-shadow:inset 0 0 0 99px rgba(220,38,38,.0)}
    50%{box-shadow:inset 0 0 0 99px rgba(220,38,38,.45)}}
  .war{animation:warpulse .3s 3}
  @keyframes erupt{0%{box-shadow:inset 0 0 0 99px rgba(255,180,0,.9);transform:scale(1.35)}
    100%{box-shadow:inset 0 0 0 99px rgba(255,180,0,0);transform:scale(1)}}
  .erupt{animation:erupt .7s ease-out;z-index:4}
  @keyframes ripple{from{box-shadow:inset 0 0 0 0 rgba(16,124,65,.5)}
    to{box-shadow:inset 0 0 0 12px rgba(16,124,65,0)}}
  .ping{animation:ripple .5s ease-out}

  /* ---- 부유 패널 (범례) ---- */
  #legend{position:absolute;top:9px;right:11px;background:#fffdf0;border:1px solid #d9c873;
    box-shadow:0 4px 14px rgba(0,0,0,.16);padding:9px 12px 10px;font-size:11px;z-index:6;
    width:200px;line-height:1.55;border-radius:3px}
  #legend h4{margin:0 0 4px;font-size:11px;color:#7a6418;font-weight:700;
    display:flex;justify-content:space-between;align-items:center}
  #legend h4 .yr{color:#a08825;font-weight:600}
  #legend .row{display:flex;align-items:center;gap:6px;padding:1px 0}
  #legend .sw{width:11px;height:11px;border-radius:2px;flex:0 0 auto;
    display:inline-flex;align-items:center;justify-content:center;font-size:9px}
  #legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #legend .ct{color:#888;font-size:10px;font-variant-numeric:tabular-nums}
  #legend .dead{color:#a39a8a;font-size:10px;font-style:italic}
  #legend .gold{color:#b8860b}
  #legend hr{border:none;border-top:1px dashed #ddd1a0;margin:6px 0 4px}
  #legend .hint{color:#9a8d5f;font-size:9.5px;margin-top:5px;line-height:1.4}
  #legend.min{width:auto}
  #legend .togg{cursor:pointer;color:#b3a05a;font-size:13px;line-height:1;padding-left:6px}

  /* ---- 상태바 ---- */
  #statusbar{height:25px;flex:0 0 25px;background:var(--excel-green);color:#eafaf0;
    display:flex;align-items:center;padding:0 12px;font-size:11.5px;gap:0;overflow:hidden}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .ev{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #statusbar .play{margin-left:auto;cursor:pointer;opacity:.9;padding:0 4px}

  /* ---- 시트 탭 ---- */
  #tabs{height:27px;flex:0 0 27px;background:#f1efed;display:flex;align-items:stretch;
    padding-left:8px;border-top:1px solid #d4d4d4;font-size:11.5px;overflow:hidden}
  #tabs .scroller{display:flex;align-items:center;color:#9a9a9a;padding:0 6px;font-size:13px}
  #tabs .tab{padding:0 14px;display:flex;align-items:center;border-right:1px solid #dcd9d6;
    color:#5b5b5b;cursor:pointer;background:#e7e5e2;border-top:2px solid transparent}
  #tabs .tab.on{background:#fff;color:var(--excel-green);font-weight:600;
    border-top:2px solid var(--excel-green)}
  #tabs .tab:hover:not(.on){background:#efedea}
  #tabs .plus{padding:0 10px;color:#9a9a9a;display:flex;align-items:center;font-size:14px}

  /* ---- 로그 시트 (연대기/멸망기록) 오버레이 ---- */
  #logsheet{position:absolute;inset:0;background:#fff;z-index:7;display:none;
    flex-direction:column;overflow:hidden}
  #logsheet.show{display:flex}
  #logsheet .lhdr{display:grid;grid-template-columns:74px 90px 1fr;background:#f4f3f1;
    border-bottom:1px solid #d9d6d3;font-weight:600;color:#555}
  #logsheet .lhdr div{padding:5px 9px;border-right:1px solid #e3e1de}
  #logrows{flex:1;overflow-y:auto;font-family:Consolas,"D2Coding",monospace;font-size:11.5px}
  #logrows .lr{display:grid;grid-template-columns:74px 90px 1fr;border-bottom:1px solid #f0efed}
  #logrows .lr:nth-child(even){background:#fbfbfa}
  #logrows .lr div{padding:4px 9px;border-right:1px solid #f0efed;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  #logrows .lr .yr{color:#6b6b6b;text-align:right;font-variant-numeric:tabular-nums}
  #logrows .lr .ty{color:#7c2d12;font-weight:600}
  #logrows .lr .ms{color:#222;white-space:normal}
  #logrows .empty{padding:30px;text-align:center;color:#aaa;font-style:italic}

  @media (max-width:560px){
    #legend{width:150px;top:6px;right:6px;padding:7px 8px;font-size:10px}
    #legend .hint{display:none}
    .rgroup-lbl{display:none}
    #fxlabel{display:none}
    #namebox{width:58px;flex:0 0 58px}
    #statusbar .opt-hide{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <span class="tt" id="wintitle">화산군도.xlsx - Excel</span>
    <span class="xicon">X</span>
  </div>

  <div id="menubar">
    <div>파일</div><div class="on">홈</div><div>삽입</div><div>수식</div>
    <div>데이터</div><div>검토</div><div>보기</div><div>도움말</div>
  </div>

  <div id="ribbon">
    <div class="rbtn" data-tool="inspect"><span class="ic">◉</span><span class="lb">조사</span></div>
    <span class="rgroup-lbl">선택</span>
    <span class="rsep"></span>
    <div class="rbtn ic-erupt" data-tool="erupt"><span class="ic">▲</span><span class="lb">분화 발생</span></div>
    <div class="rbtn ic-quake" data-tool="quake"><span class="ic">≈</span><span class="lb">지진</span></div>
    <div class="rbtn ic-plague" data-tool="plague"><span class="ic">✚</span><span class="lb">역병</span></div>
    <span class="rgroup-lbl">개입(=DISASTER)</span>
    <span class="rsep"></span>
    <div class="rbtn ic-colony" data-tool="colony"><span class="ic">⚓</span><span class="lb">개척단</span></div>
    <div class="rbtn ic-bless" data-tool="bless"><span class="ic">✦</span><span class="lb">황금기</span></div>
    <span class="rgroup-lbl">번영(=BUFF)</span>
    <span class="rsep"></span>
    <div class="rbtn" id="speedbtn"><span class="ic">»</span><span class="lb" id="speedlb">속도 1x</span></div>
  </div>

  <div id="fbar">
    <div id="namebox"><span id="namecell">A1</span><span class="dd">▾</span></div>
    <div id="fxlabel">fx</div>

  </div>

  <div id="sheetwrap">
    <div id="sheet"></div>
    <div id="legend"></div>
    <div id="logsheet">
      <div class="lhdr"><div>A · 연도</div><div>B · 분류</div><div>C · 기록</div></div>
      <div id="logrows"></div>
    </div>
  </div>

  <div id="statusbar">
    <span class="ev" id="statusev">천지(天地)가 갈라지고 바다 위로 불이 솟았습니다.</span>
    <span class="sep opt-hide">|</span>

  <div id="tabs">
    <div class="tab on" data-sheet="map">군도</div>
    <div class="tab" data-sheet="chronicle">연대기</div>

    <span class="plus">＋</span>

</div>

<script>
(() => {
"use strict";
/* =========================================================================
   화산군도.xlsx  —  스프레드시트로 위장한 살아있는 화산 군도 문명 시뮬
   컨셉 변주: 격자(셀)는 망망대해. 화산이 분화하며 '새 땅을 만들어내고',
   용암류가 문명을 삼키고, 화산재가 내려앉으며, 항해 민족이 섬에서 섬으로
   건너가 식민한다. 지형이 정적이지 않고 끊임없이 재편된다.
   ========================================================================= */

const sheet      = document.getElementById('sheet');
const fmla       = document.getElementById('formula');
const namecell   = document.getElementById('namecell');
const statusev   = document.getElementById('statusev');
const statusmeta = document.getElementById('statusmeta');
const legend     = document.getElementById('legend');
const logsheet   = document.getElementById('logsheet');
const logrows    = document.getElementById('logrows');
const wintitle   = document.getElementById('wintitle');

/* ---------- 격자 크기 (반응형) ---------- */
let COLS, ROWS, N, cellEls, cells, terrainW, terrainH, tnoise;
const isMobile = () => innerWidth < 560;

function colName(n){ let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0; } return s; }
function ref(i){ return colName(i%COLS)+(Math.floor(i/COLS)+1); }
function nbrs(i){ const x=i%COLS,y=i/COLS|0,o=[];
  if(x>0)o.push(i-1); if(x<COLS-1)o.push(i+1);
  if(y>0)o.push(i-COLS); if(y<ROWS-1)o.push(i+COLS);
  return o; }
function nbrs8(i){ const x=i%COLS,y=i/COLS|0,o=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue; const nx=x+dx,ny=y+dy;
    if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS)o.push(ny*COLS+nx);
  } return o; }

/* ---------- 시뮬 상태 ---------- */
/* terrain per cell: 'sea' | 'shoal'(여울) | 'land' | 'lava'(용암) | 'volcano'(화산) | 'ash'(화산재) | 'ruin'(폐허) */
const SEA=0; // 표기 편의용으로 문자열 사용
let factions=[], obituaries=[], chronicle=[];
let year=1, lastEvent='천지(天地)가 갈라지고 바다 위로 불이 솟았습니다.', pop=0;
let tickN=0, warCD=0, selected=-1, paused=false;
let speedIdx=1; const SPEEDS=[180,110,55]; const SPEEDLB=['0.6x','1x','2x'];
let timer=null;
const dirty=new Set();
let armedTool=null;

const NAMES=['바람섬 부족','흑요석 연맹','산호초 왕국','잿빛 순례단','심해 상회','용비늘 칸국',
             '소금꽃 공화국','불의 사제단','북풍 선단','진주만 동맹'];
const COLORS=['#2563eb','#0f766e','#db2777','#6b7280','#7c3aed','#b91c1c',
              '#ca8a04','#ea580c','#0891b2','#9d174d'];
let nameIdx=0;

/* ---------- 지형 노이즈 (값 노이즈 보간) ---------- */
function genTerrainField(){
  terrainW=10; terrainH=7; tnoise=[];
  for(let i=0;i<terrainW*terrainH;i++) tnoise[i]=Math.random();
}
function noiseAt(x,y){
  const fx=x/COLS*(terrainW-1), fy=y/ROWS*(terrainH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const g=(gx,gy)=>tnoise[Math.min(terrainH-1,gy)*terrainW+Math.min(terrainW-1,gx)];
  const a=g(x0,y0),b=g(x0+1,y0),c=g(x0,y0+1),d=g(x0+1,y0+1);
  const sx=tx*tx*(3-2*tx), sy=ty*ty*(3-2*ty);
  return a*(1-sx)*(1-sy)+b*sx*(1-sy)+c*(1-sx)*sy+d*sx*sy;
}

function buildGrid(){
  const wrap=document.getElementById('sheetwrap');
  const W=wrap.clientWidth, H=wrap.clientHeight;
  const HEAD=44, ROWHD=46;
  const targetCW=isMobile()?30:34, targetCH=isMobile()?26:24;
  COLS=Math.max(14,Math.min(46,Math.floor((W-ROWHD)/targetCW)));
  ROWS=Math.max(12,Math.min(40,Math.floor((H-HEAD+HEAD)/targetCH)+ (HEAD/targetCH|0) -1 ));
  // 단순화: 가용 높이 기준 행수
  ROWS=Math.max(12,Math.min(40,Math.floor((H-22)/targetCH)));
  const CW=Math.floor((W-ROWHD)/COLS);
  const CH=Math.floor((H-22)/ROWS);
  N=COLS*ROWS;

  sheet.style.gridTemplateColumns=`${ROWHD}px repeat(${COLS},${CW}px)`;
  sheet.style.gridTemplateRows=`22px repeat(${ROWS},${CH}px)`;

  const frag=document.createDocumentFragment();
  const corner=document.createElement('div'); corner.className='hd'; corner.textContent='◢';
  corner.style.color='#c9c6c2'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){ const h=document.createElement('div'); h.className='hd colhd';
    h.dataset.col=c; h.textContent=colName(c); frag.appendChild(h); }
  cellEls=new Array(N);
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div'); h.className='hd rowhd'; h.dataset.row=r;
    h.textContent=r+1; frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div'); d.className='cell';
      const idx=r*COLS+c; d.dataset.i=idx;
      const g=document.createElement('span'); g.className='glyph';
      g.style.fontSize=Math.min(CW,CH)*0.62+'px'; d.appendChild(g);
      cellEls[idx]=d; frag.appendChild(d);
    }
  }
  sheet.innerHTML=''; sheet.appendChild(frag);
}

/* ---------- 셀 데이터 초기화 ---------- */
function seedWorld(){
  genTerrainField();
  cells=new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS,y=i/COLS|0;
    const v=noiseAt(x,y)+(Math.random()-.5)*.12;
    let st;
    if(v<.40) st='sea';
    else if(v<.48) st='shoal';
    else st='land';
    cells[i]={st,owner:null,level:0,hist:[terrLabel(st)],aux:0};
  }
  // 초기 화산 2~3개를 융기된 땅 중심부에 박는다
  const landIdx=[];
  for(let i=0;i<N;i++) if(cells[i].st==='land') landIdx.push(i);
  shuffle(landIdx);
  const vN=Math.min(3,Math.max(2,landIdx.length/40|0));
  for(let k=0;k<vN&&k<landIdx.length;k++){
    const i=landIdx[k];
    cells[i]={st:'volcano',owner:null,level:0,hist:['휴화산'],aux:Math.random()*60+30};
  }
}
function terrLabel(st){
  return {sea:'심해',shoal:'여울',land:'무인도',volcano:'화산',lava:'용암류',ash:'화산재',ruin:'폐허'}[st]||'미지';
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } }

/* ---------- 색/표기 ---------- */
const LV_GLYPH=['','·','▫','▣','都']; // 개척/오두막/마을/도시
const LV_LABEL=['','개척지','어촌','마을','항구도시'];
function hexA(hex,a){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`; }

function paint(i){
  const c=cells[i], el=cellEls[i], g=el.firstChild;
  let bg='',tx='',col='#222',w='400',sh='';
  switch(c.st){
    case 'sea':    bg='#dfeefb'; tx=(i*7+year)%23===0?'≈':''; col='#a9cdec'; break;
    case 'shoal':  bg='#cfe6f2'; tx='∴'; col='#6fa8c9'; break;
    case 'land':
      if(c.owner!==null){
        const f=facById(c.owner);
        if(f){ bg=hexA(f.color,.16+c.level*.18); tx=LV_GLYPH[c.level]; col=f.color;
               w=c.level>=3?'700':'500'; if(c.level>=4)sh='0 0 0 1px '+hexA(f.color,.5)+' inset'; }
      } else { bg='#eef2e6'; tx='⌃'; col='#9fae84'; } // 무인 화산섬 봉우리
      break;
    case 'volcano':bg='#3a2422'; tx='▲'; col='#ff7a1a'; w='700'; sh='inset 0 0 6px '+(c.aux>90?'rgba(255,120,0,.8)':'rgba(255,120,0,.25)'); break;
    case 'lava':   bg='#ff7a1a'; tx='≋'; col='#7a1500'; w='700'; break;
    case 'ash':    bg='#cdc7bf'; tx='▒'; col='#8a857d'; break;
    case 'ruin':   bg='#e6e3df'; tx='墟'; col='#9a948c'; break;
  }
  el.style.background=bg; el.style.boxShadow=sh||'';
  g.textContent=tx; g.style.color=col; g.style.fontWeight=w;
}

/* ---------- 국가 ---------- */
function facById(id){ for(const f of factions) if(f.id===id) return f; return null; }
let nextFid=0;
function spawnFaction(originLabel){
  if(nameIdx>=NAMES.length) nameIdx=0;
  const f={id:nextFid++, name:NAMES[nameIdx], color:COLORS[nameIdx%COLORS.length],
           golden:0, size:0, arr:[]};
  nameIdx++;
  // 빈 땅(무인도)에 상륙
  const open=[];
  for(let i=0;i<N;i++) if(cells[i].st==='land'&&cells[i].owner===null) open.push(i);
  if(!open.length) return null;
  const i=open[Math.random()*open.length|0];
  setCell(i,f.id,1,'개척지');
  factions.push(f);
  return f;
}
function setCell(i,owner,level,label){
  const c=cells[i];
  if(c.st!=='land') c.st='land';
  c.owner=owner; c.level=level;
  if(label){ c.hist.push(label); if(c.hist.length>8)c.hist.shift(); }
  dirty.add(i);
}

/* ---------- 로그 ---------- */
function logEvent(type,msg,formula){
  year; lastEvent=`서기 ${year}년 · ${msg}`;
  if(formula) setFormula(formula);
  chronicle.push({year,type,msg});
  if(chronicle.length>400) chronicle.shift();
  if(currentSheet==='chronicle') renderLogSheet();
}
function setFormula(raw){
  // 함수명/문자열/숫자 채색
  let h=raw
    .replace(/"([^"]*)"/g,'<span class="str">"$1"</span>')
    .replace(/\b(\d+)\b/g,'<span class="num">$1</span>')
    .replace(/^=([A-Z_.]+)/,'=<span class="fn">$1</span>');
  fmla.innerHTML=h;
}

/* ---------- 재난: 분화 ---------- */
function erupt(i,human){
  const c=cells[i];
  if(c.st!=='volcano'){
    // 화산이 아니면 가장 가까운 땅을 화산으로 승격
    if(c.st==='sea'||c.st==='shoal'){ c.st='volcano'; c.aux=0; }
    else { c.st='volcano'; c.aux=0; }
  }
  c.hist.push('분화'); if(c.hist.length>8)c.hist.shift();
  cellEls[i].classList.remove('erupt'); void cellEls[i].offsetWidth;
  cellEls[i].classList.add('erupt');
  dirty.add(i);
  // 용암류를 이웃으로 분출 (8방), 일부는 바다를 메워 새 땅을 만든다
  let createdLand=0, destroyed=0;
  for(const n of nbrs8(i)){
    const nc=cells[n];
    if(Math.random()<.62){
      if(nc.owner!==null){ destroyed++; }
      if(nc.st==='sea'||nc.st==='shoal'){
        // 용암이 바다로 흘러 굳어 새 땅이 됨 (시그니처 변주)
        nc.st='lava'; nc.aux=4; nc.owner=null; nc.level=0;
        nc.hist=['용암 분출']; createdLand++;
      }else{
        nc.st='lava'; nc.aux=3; nc.owner=null; nc.level=0;
        nc.hist.push('용암류'); if(nc.hist.length>8)nc.hist.shift();
      }
      dirty.add(n);
    } else if(Math.random()<.5){
      // 화산재 낙하
      if(nc.st!=='sea'&&nc.st!=='volcano'){ nc.st='ash'; nc.aux=6;
        if(nc.owner!==null){ destroyed++; nc.owner=null; nc.level=0; }
        nc.hist.push('화산재'); if(nc.hist.length>8)nc.hist.shift(); dirty.add(n); }
    }
  }
  const verb = createdLand>0 ? `용암이 바다를 메워 새 땅 ${createdLand}칸이 솟았습니다`
             : '용암류가 흘러내렸습니다';
  logEvent('분화',`${ref(i)} 화산이 분화 — ${verb}${destroyed?`, ${destroyed}칸이 매몰됨`:''}.`,
    `=ERUPT(${ref(i)}, radius:=${createdLand+destroyed})`);
}

/* ---------- 재난: 지진 ---------- */
function quake(center){
  let sunk=0, raised=0;
  for(const n of [center,...nbrs8(center)]){
    const nc=cells[n];
    if(Math.random()<.4){
      if(nc.st==='land'||nc.st==='ruin'||nc.st==='ash'){
        // 땅이 바다로 침강
        if(nc.owner!==null) nc.hist.push('해일로 수몰'); else nc.hist.push('침강');
        nc.st='sea'; nc.owner=null; nc.level=0; nc.aux=0; sunk++; dirty.add(n);
      } else if(nc.st==='sea'&&Math.random()<.45){
        nc.st='shoal'; raised++; dirty.add(n);
      }
    }
  }
  logEvent('지진',`${ref(center)} 일대 대지진 — ${sunk}칸 수몰, ${raised}칸 융기.`,
    `=QUAKE(${ref(center)}, sunk:=${sunk})`);
}

/* ---------- 재난: 역병 ---------- */
const plague=new Map();
function startPlague(i){
  plague.set(i,12); dirty.add(i);
  logEvent('역병',`${ref(i)}에서 역병이 창궐했습니다.`,`=PLAGUE(${ref(i)}, ttl:=12)`);
}

/* ---------- 개척단 (인간 개입) ---------- */
function colonyAt(i){
  const c=cells[i];
  if(c.st==='land'&&c.owner===null){
    // 가장 가까운 국가가 식민, 없으면 새 국가
    let near=null,bd=1e9;
    for(const f of factions){ for(const idx of f.arr){
      const d=Math.abs((idx%COLS)-(i%COLS))+Math.abs((idx/COLS|0)-(i/COLS|0));
      if(d<bd){bd=d;near=f;}
    }}
    if(near&&bd<=8){
      setCell(i,near.id,2,'개척단 상륙');
      logEvent('개척',`${near.name}의 개척단이 ${ref(i)}에 상륙했습니다.`,`=COLONIZE("${near.name}", ${ref(i)})`);
    }else{
      const f=spawnFaction(); if(f){ setCell(i,f.id,2,'개척단 상륙');
        logEvent('개척',`새 항해 민족 ${f.name}이(가) ${ref(i)}에 닻을 내렸습니다.`,`=SPAWN("${f.name}", ${ref(i)})`); }
    }
  } else {
    // 빈 바다면 새 화산섬을 띄움
    if(c.st==='sea'||c.st==='shoal'){
      c.st='land'; c.owner=null; c.level=0; c.hist=['융기한 섬']; dirty.add(i);
      const f=spawnFaction()||null;
      logEvent('개척',`${ref(i)}에 새 섬이 떠올랐습니다.`,`=ISLAND.RAISE(${ref(i)})`);
    }
  }
  cellEls[i].classList.remove('ping'); void cellEls[i].offsetWidth; cellEls[i].classList.add('ping');
}

/* ---------- 황금기 ---------- */
function blessAt(i){
  const c=cells[i];
  if(c.owner!==null){ const f=facById(c.owner); if(f){ f.golden=120;
    logEvent('번영',`${f.name}에 황금기가 도래했습니다.`,`=GOLDEN_AGE("${f.name}", 120)`);
    cellEls[i].classList.remove('ping'); void cellEls[i].offsetWidth; cellEls[i].classList.add('ping'); return; } }
  lastEvent=`서기 ${year}년 · 그 셀에는 다스릴 백성이 없습니다.`;
  setFormula(`=GOLDEN_AGE(${ref(i)}) → #N/A (소유 국가 없음)`);
}

/* ---------- 메인 틱 ---------- */
function tick(){
  if(paused) return;
  tickN++; year++;
  if(warCD>0) warCD--;

  // 재집계
  for(const f of factions){ f.arr.length=0; f.size=0; }
  pop=0;
  const PW=[0,30,120,420,1200];
  for(let i=0;i<N;i++){
    const c=cells[i];
    // 용암 굳기
    if(c.st==='lava'){ if(--c.aux<=0){ c.st='land'; c.owner=null; c.level=0;
      c.hist.push('현무암 대지'); if(c.hist.length>8)c.hist.shift(); dirty.add(i); } }
    // 화산재 비옥화 → 땅
    else if(c.st==='ash'){ if(--c.aux<=0){ c.st='land'; c.owner=null; c.level=0;
      c.hist.push('비옥한 화산토'); if(c.hist.length>8)c.hist.shift(); dirty.add(i); } }
    // 폐허 회복
    else if(c.st==='ruin'){ if(--c.aux<=0){ c.st='land'; dirty.add(i); } }
    // 휴화산 압력 축적
    else if(c.st==='volcano'){ c.aux+=Math.random()*1.5;
      if(c.aux>120&&Math.random()<.05){ c.aux=0; erupt(i,false); } }

    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){ f.arr.push(i); f.size++; pop+=PW[c.level]; }
      else { c.owner=null; c.level=0; dirty.add(i); }
    }
  }

  // 멸망 판정
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      const ob=`${f.name} — 서기 ${year}년 멸망`;
      obituaries.push({year,name:f.name,color:f.color});
      logEvent('멸망',`${f.name}이(가) 역사의 잿더미가 되었습니다.`,`=COLLAPSE("${f.name}", ${year})`);
      factions.splice(k,1);
      updateObTab();
    }
  }

  // 역병 진행
  if(plague.size){
    for(const [i,t] of [...plague]){
      if(Math.random()<.18) for(const n of nbrs(i))
        if(cells[n].owner!==null&&!plague.has(n)){ plague.set(n,11); dirty.add(n); }
      if(Math.random()<.24){
        const c=cells[i]; c.level--;
        if(c.level<=0){ c.owner=null; c.level=0; c.hist.push('역병으로 폐촌'); if(c.hist.length>8)c.hist.shift(); }
        dirty.add(i);
      }
      if(t<=1){ plague.delete(i); dirty.add(i); } else plague.set(i,t-1);
    }
    if(plague.size===0) logEvent('역병','역병이 마침내 물러갔습니다.','=PLAGUE.END()');
  }

  // 국가 행동
  for(const f of factions){
    if(f.golden>0) f.golden--;
    if(f.size===0) continue;

    // 확장 (해상 식민 포함)
    const tries=1+(f.size*.08|0)+(f.golden?1:0);
    for(let a=0;a<tries;a++){
      const src=f.arr[Math.random()*f.arr.length|0];
      if(src===undefined||cells[src].owner!==f.id) continue;
      // 인접 + 항해(8방 한 칸 너머 바다 건너기)
      let tgt;
      if(Math.random()<.78){
        const nb=nbrs(src); tgt=nb[Math.random()*nb.length|0];
      } else {
        // 해상 도약: 2칸 이내 무인도 탐색
        const cand=[];
        const sx=src%COLS, sy=src/COLS|0;
        for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
          const nx=sx+dx,ny=sy+dy; if(nx<0||nx>=COLS||ny<0||ny>=ROWS)continue;
          const ni=ny*COLS+nx; if(cells[ni].st==='land'&&cells[ni].owner===null) cand.push(ni);
        }
        tgt=cand.length?cand[Math.random()*cand.length|0]:undefined;
      }
      if(tgt===undefined) continue;
      const tc=cells[tgt];
      if(tc.st==='lava'||tc.st==='volcano') continue;
      if(tc.st==='sea'){ // 여울로 매립 시도 (드묾)
        if(Math.random()<.06){ tc.st='shoal'; tc.hist.push('방파제'); dirty.add(tgt); }
        continue;
      }
      if(tc.st==='shoal'){ if(Math.random()<.18){ setCell(tgt,f.id,1,'간척지'); } continue; }
      if(tc.st==='ash'||tc.st==='ruin') continue;
      if(tc.owner===null){ setCell(tgt,f.id,1,'개척지'); }
      else if(tc.owner!==f.id && Math.random()<.32){
        // 전쟁
        const att=1+Math.random()*3+f.size*.0025+(f.golden?1.2:0);
        const def=tc.level+1+Math.random()*3;
        cellEls[tgt].classList.remove('war'); void cellEls[tgt].offsetWidth; cellEls[tgt].classList.add('war');
        if(att>def){
          const defF=facById(tc.owner);
          if(Math.random()<.22){
            tc.st='ruin'; tc.aux=160; tc.owner=null; tc.level=0;
            tc.hist.push('전화로 폐허'); if(tc.hist.length>8)tc.hist.shift(); dirty.add(tgt);
          } else setCell(tgt,f.id,Math.max(1,tc.level-1),'점령');
          if((tc.level>=3||warCD===0)&&defF){
            logEvent('전쟁',`${f.name}이(가) ${defF.name}의 ${LV_LABEL[Math.max(1,tc.level)]||'영토'}(${ref(tgt)})를 공략했습니다.`,
              `=WAR("${f.name}" → "${defF.name}", ${ref(tgt)})`);
            warCD=35;
          }
        }
      }
    }

    // 발전
    const ups=1+(f.size*.05|0);
    for(let u=0;u<ups;u++){
      const i=f.arr[Math.random()*f.arr.length|0];
      if(i===undefined||cells[i].owner!==f.id) continue;
      const c=cells[i];
      if(c.level<4 && Math.random()<.06*(f.golden?3:1)){
        c.level++; c.hist.push(LV_LABEL[c.level]); if(c.hist.length>8)c.hist.shift(); dirty.add(i);
        if(c.level===4 && warCD===0){
          logEvent('성장',`${f.name}의 ${ref(i)}에 항구도시가 세워졌습니다.`,`=CITY("${f.name}", ${ref(i)})`);
          warCD=25;
        }
      }
    }
  }

  // 자연 발생 사건
  const r=Math.random();
  if(r<.010){ // 임의 화산 분화
    const vols=[]; for(let i=0;i<N;i++) if(cells[i].st==='volcano') vols.push(i);
    if(vols.length) erupt(vols[Math.random()*vols.length|0],false);
    else { // 새 화산섬 융기
      for(let t=0;t<40;t++){ const i=Math.random()*N|0;
        if(cells[i].st==='sea'){ cells[i].st='volcano'; cells[i].aux=0; cells[i].hist=['해저화산 융기'];
          dirty.add(i); cellEls[i].classList.add('erupt');
          logEvent('분화',`${ref(i)} 해저에서 새 화산섬이 솟구쳤습니다.`,`=SEAMOUNT.RISE(${ref(i)})`); break; } }
    }
  } else if(r<.014){ quake(Math.random()*N|0); }
  else if(r<.018 && !plague.size){
    const big=[]; for(let i=0;i<N;i++) if(cells[i].owner!==null&&cells[i].level>=3) big.push(i);
    if(big.length) startPlague(big[Math.random()*big.length|0]);
  } else if(r>.992 && factions.length){
    const f=factions[Math.random()*factions.length|0]; f.golden=110;
    logEvent('번영',`${f.name}의 황금기가 시작되었습니다.`,`=GOLDEN_AGE("${f.name}", 110)`);
  }
  // 인구 부족 시 신규 민족 도래
  if(factions.length<3 && Math.random()<.02){
    const f=spawnFaction();
    if(f) logEvent('등장',`수평선 너머에서 ${f.name}이(가) 도래했습니다.`,`=MIGRATE("${f.name}")`);
  }

  // 렌더
  for(const i of dirty) paint(i);
  dirty.clear();
  updateStatus();
  if(tickN%6===0) renderLegend();
}

/* ---------- 렌더: 상태바/범례/타이틀 ---------- */
function updateStatus(){
  statusev.textContent=lastEvent;
  statusmeta.innerHTML=`서기 ${year}년<span class="sep">|</span>인구 ${pop.toLocaleString()}명<span class="sep">|</span>국가 ${factions.length}곳`;
}
function updateObTab(){
  document.querySelector('[data-sheet="obituary"]').textContent=`멸망기록 (${obituaries.length})`;
}
let legendMin=false;
function renderLegend(){
  wintitle.textContent=`화산군도.xlsx - Excel · 서기 ${year}년`;
  if(legendMin){
    legend.classList.add('min');
    legend.innerHTML=`<h4><span style="color:#dc2626">▲</span> 서기 <span class="yr">${year}</span>년 <span class="togg" data-togg>＋</span></h4>`;
    return;
  }
  legend.classList.remove('min');
  let h=`<h4><span style="color:#dc2626">▲</span> 화산 군도 <span class="yr">서기 ${year}년 <span class="togg" data-togg>－</span></span></h4>`;
  const sorted=[...factions].sort((a,b)=>b.size-a.size);
  for(const f of sorted){
    h+=`<div class="row"><span class="sw" style="background:${hexA(f.color,.85)}"></span>`+
       `<span class="nm">${f.name}${f.golden?' <span class="gold">✦</span>':''}</span>`+
       `<span class="ct">${f.size}칸</span></div>`;
  }
  if(!factions.length) h+=`<div class="dead">— 군도에 문명이 없습니다 —</div>`;
  if(obituaries.length){
    h+='<hr>';
    for(const o of obituaries.slice(-3)) h+=`<div class="dead">† ${o.name} (${o.year}년)</div>`;
  }
  h+=`<div class="hint">리본의 🌋 분화 / 〰️ 지진 등을 누른 뒤 셀을 클릭해 개입하세요. 셀 클릭 = 그 땅의 역사.</div>`;
  legend.innerHTML=h;
}

/* ---------- 로그 시트 렌더 ---------- */
let currentSheet='map';
function renderLogSheet(){
  const data = currentSheet==='obituary'
    ? obituaries.map(o=>({year:o.year,type:'멸망',msg:`${o.name} 멸망`}))
    : chronicle.slice().reverse();
  if(!data.length){ logrows.innerHTML='<div class="empty">아직 기록된 사건이 없습니다.</div>'; return; }
  let h='';
  for(const e of data){
    h+=`<div class="lr"><div class="yr">${e.year}</div><div class="ty">${e.type}</div><div class="ms">${escapeHtml(e.msg)}</div></div>`;
  }
  logrows.innerHTML=h;
}
function escapeHtml(s){ return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

/* ---------- 시트 전환 ---------- */
function switchSheet(name){
  currentSheet=name;
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.sheet===name));
  if(name==='map'){ logsheet.classList.remove('show'); }
  else { logsheet.classList.add('show'); renderLogSheet(); }
}

/* ---------- 셀 선택 = 역사 ---------- */
function selectCell(i){
  if(selected>=0) cellEls[selected].classList.remove('sel');
  // 행/열 헤더 하이라이트
  document.querySelectorAll('.hd.act').forEach(h=>h.classList.remove('act'));
  selected=i;
  cellEls[i].classList.add('sel');
  const col=i%COLS, row=i/COLS|0;
  const ch=sheet.querySelector(`.colhd[data-col="${col}"]`); if(ch)ch.classList.add('act');
  const rh=sheet.querySelector(`.rowhd[data-row="${row}"]`); if(rh)rh.classList.add('act');
  namecell.textContent=ref(i);
  const c=cells[i];
  let owner='';
  if(c.owner!==null){ const f=facById(c.owner); if(f) owner=`, "${f.name}·${LV_LABEL[c.level]||'영토'}"`; }
  setFormula(`=HISTORY(${ref(i)}: ${c.hist.map(x=>`"${x}"`).join(' → ')}${owner})`);
}

/* ---------- 리본 도구 ---------- */
function armTool(tool){
  if(tool==='inspect'){ armedTool=null; updateArmed(); return; }
  armedTool = armedTool===tool ? null : tool;
  updateArmed();
}
function updateArmed(){
  document.querySelectorAll('.rbtn[data-tool]').forEach(b=>
    b.classList.toggle('armed', b.dataset.tool===armedTool));
  sheet.style.cursor = armedTool ? 'crosshair' : '';
}
function applyTool(i){
  switch(armedTool){
    case 'erupt':  erupt(i,true); break;
    case 'quake':  quake(i); break;
    case 'plague': startPlague(i); break;
    case 'colony': colonyAt(i); break;
    case 'bless':  blessAt(i); break;
  }
  // 즉시 반영
  for(const k of dirty) paint(k); dirty.clear();
  updateStatus();
  renderLegend();
}

/* ---------- 이벤트 바인딩 ---------- */
function bindEvents(){
  sheet.addEventListener('click',e=>{
    const t=e.target.closest('.cell'); if(!t) return;
    const i=+t.dataset.i;
    selectCell(i);
    if(armedTool) applyTool(i);
  });
  document.getElementById('ribbon').addEventListener('click',e=>{
    const b=e.target.closest('.rbtn'); if(!b) return;
    if(b.id==='speedbtn'){ speedIdx=(speedIdx+1)%SPEEDS.length;
      document.getElementById('speedlb').textContent='속도 '+SPEEDLB[speedIdx];
      restartTimer(); return; }
    if(b.dataset.tool) armTool(b.dataset.tool);
  });
  document.getElementById('tabs').addEventListener('click',e=>{
    const t=e.target.closest('.tab'); if(t) switchSheet(t.dataset.sheet);
  });
  document.getElementById('playbtn').addEventListener('click',e=>{
    paused=!paused; e.target.textContent=paused?'▶':'⏸';
    statusev.textContent = paused ? `서기 ${year}년 · ⏸ 시간이 멈췄습니다.` : lastEvent;
  });
  legend.addEventListener('click',e=>{
    if(e.target.dataset.togg!==undefined){ legendMin=!legendMin; renderLegend(); }
  });
  let rt;
  addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(fullRebuild,250); });
}
function restartTimer(){ if(timer)clearInterval(timer); timer=setInterval(tick,SPEEDS[speedIdx]); }

/* ---------- 리사이즈 시 월드 재생성 ---------- */
function fullRebuild(){
  const keepYear=year, keepChron=chronicle, keepOb=obituaries;
  buildGrid(); seedWorld();
  factions=[]; nameIdx=0; nextFid=0; selected=-1; plague.clear();
  // 역사 흐름 유지 위해 연도/연대기 보존
  year=keepYear; chronicle=keepChron; obituaries=keepOb;
  for(let i=0;i<N;i++) paint(i);
  spawnFaction(); spawnFaction(); spawnFaction();
  renderLegend(); updateStatus(); updateObTab();
  logEvent('지각변동','대륙이 재편되어 군도가 새로 그려졌습니다.','=TECTONIC.RESET()');
}

/* ---------- 부트 ---------- */
function boot(){
  buildGrid();
  seedWorld();
  for(let i=0;i<N;i++) paint(i);
  setFormula(`=SIM.ARCHIPELAGO($A$1:$${colName(COLS-1)}$${ROWS}, "불과 바다가 문명을 빚는다")`);
  spawnFaction(); spawnFaction(); spawnFaction();
  bindEvents();
  renderLegend(); updateStatus(); updateObTab();
  restartTimer();
}
boot();
})();
</script>
