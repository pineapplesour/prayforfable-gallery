<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>고산씨족.xlsx - Excel</title>
<style>
  :root{
    --green:#217346; --green-l:#1e9e5b; --grid:#d4d4d4; --grid-l:#e6e6e6;
    --rib:#f3f2f1; --hd:#f5f5f5; --txt:#222;
    --cw:30px; --ch:21px; --rowhd:42px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#dfe3e8;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:var(--txt);-webkit-font-smoothing:antialiased}
  #app{display:flex;flex-direction:column;height:100%}

  /* ── 타이틀바 ── */
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #e2e0de;flex-shrink:0}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar .ttl{flex:1;text-align:center;color:#3a3a3a;font-size:12px;
    letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #titlebar .winbtns{display:flex;gap:14px;color:#888;font-size:11px}

  /* ── 메뉴바 ── */
  #menubar{height:26px;background:#fff;display:flex;align-items:flex-end;
    padding:0 4px;border-bottom:1px solid #e8e8e8;flex-shrink:0;
    font-size:12px;color:#444;overflow:hidden;white-space:nowrap}
  #menubar div{padding:4px 9px;border-radius:3px 3px 0 0;cursor:default}
  #menubar div.on{color:var(--green);font-weight:600;
    border-bottom:2px solid var(--green);background:#fbfbfb}
  #menubar div:hover{background:#f1f1f1}

  /* ── 리본 ── */
  #ribbon{height:62px;background:#fbfbfb;display:flex;align-items:stretch;
    border-bottom:1px solid #d9d9d9;flex-shrink:0;overflow:hidden;padding:3px 0}
  .rgrp{display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:3px 8px;border-right:1px solid #e6e6e6;min-width:0}
  .rgrp .items{display:flex;gap:2px;flex:1;align-items:center}
  .rgrp .lbl{font-size:10px;color:#999;margin-top:1px}
  .rbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:38px;padding:2px 5px;border-radius:4px;cursor:pointer;color:#3a3a3a;
    border:1px solid transparent;transition:background .08s,border-color .08s}
  .rbtn:hover{background:#eef6f0;border-color:#cfe6d8}
  .rbtn:active{background:#dcefe3}
  .rbtn .ico{font-size:18px;line-height:1}
  .rbtn .ico.tri{font-size:14px;letter-spacing:-1px}
  .rbtn .t{font-size:10px;margin-top:2px;white-space:nowrap}
  .rbtn.act .ico{filter:grayscale(0)}
  .rbtn.dim{opacity:.42;pointer-events:none}
  .rbtn.run .ico{color:var(--green)}
  .rbtn.paused .ico{color:#c0392b}

  /* ── 수식바 ── */
  #fbar{height:24px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid var(--grid);flex-shrink:0;font-size:12px}
  #namebox{width:74px;height:100%;border-right:1px solid var(--grid);display:flex;
    align-items:center;justify-content:center;color:#333;gap:5px}
  #namebox .car{color:#9a9a9a;font-size:8px}
  #fx{width:30px;text-align:center;color:#9a9a9a;font-style:italic;
    font-family:Georgia,serif;border-right:1px solid var(--grid);height:100%;
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  #formwrap{flex:1;display:flex;align-items:center;min-width:0;position:relative}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border:none;outline:none;background:transparent;width:100%}
  #formula::placeholder{color:#b5b5b5}
  #formwrap.typing{background:#fffdf2;outline:1.5px solid var(--green);outline-offset:-1.5px}
  #cmdhint{position:absolute;right:10px;color:#bbb;font-size:10px;pointer-events:none}

  /* ── 시트 영역 ── */
  #sheetwrap{position:relative;flex:1;overflow:hidden;background:#fff;min-height:0}
  #sheet{display:grid;background:#fff;position:absolute;top:0;left:0}
  .hd{background:var(--hd);border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);
    display:flex;align-items:center;justify-content:center;color:#666;font-size:10.5px;
    position:relative}
  .hd.cor{background:#eee}
  .hd.cor::after{content:"";position:absolute;right:3px;bottom:3px;width:0;height:0;
    border-left:6px solid transparent;border-bottom:6px solid #b7b7b7}
  .hd.hot{background:#d8ead9;color:var(--green);font-weight:600}
  .cell{border-right:1px solid var(--grid-l);border-bottom:1px solid var(--grid-l);
    display:flex;align-items:center;justify-content:center;font-size:11px;
    overflow:hidden;cursor:cell;position:relative;line-height:1}
  .cell.sel{outline:2px solid var(--green);outline-offset:-2px;z-index:3}
  .cell .cap{position:absolute;font-size:7px;left:1px;top:0;opacity:.6;pointer-events:none}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #e74c3c}50%{box-shadow:inset 0 0 0 2px #ffb3a7}}
  .war{animation:warf .3s 3;z-index:2}
  @keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
  .pop{animation:pop .4s ease}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(33,115,70,.5)}100%{box-shadow:0 0 0 14px rgba(33,115,70,0)}}
  .ring{animation:ring .7s ease-out}

  /* 다른 시트 (텍스트 로그) */
  #logsheet{position:absolute;inset:0;background:#fff;overflow:auto;display:none;
    font-size:12px}
  #logsheet table{border-collapse:collapse;width:100%}
  #logsheet td,#logsheet th{border:1px solid var(--grid-l);padding:3px 8px;
    height:21px;vertical-align:middle;white-space:nowrap}
  #logsheet th{background:var(--hd);color:#666;font-weight:600;position:sticky;top:0;
    font-size:11px;text-align:left}
  #logsheet td.rh{background:var(--hd);color:#888;width:42px;text-align:center;
    font-size:10.5px;position:sticky;left:0}
  #logsheet td.yr{font-family:Consolas,monospace;color:#777;width:90px}
  #logsheet td.fx{font-family:Consolas,monospace;color:#0b6e3a;font-size:11px}
  #logsheet tr:hover td:not(.rh){background:#f3faf5}
  #logsheet .deadrow td{color:#999}
  #logsheet .deadrow td.fx{color:#a05}

  /* ── 범례 (떠있는 노트) ── */
  #legend{position:absolute;top:9px;right:13px;background:#fffceb;border:1px solid #e0cf72;
    box-shadow:2px 4px 12px rgba(0,0,0,.16);padding:8px 11px 9px;font-size:11px;z-index:6;
    width:188px;line-height:1.65;border-radius:2px}
  #legend::before{content:"";position:absolute;top:-1px;left:-1px;border-width:0 11px 11px 0;
    border-style:solid;border-color:#fff #e0cf72 #e0cf72 #fff;box-shadow:-1px 1px 2px rgba(0,0,0,.07)}
  #legend h4{margin:0 0 4px;font-size:11px;color:#8a7420;border-bottom:1px dotted #d6c46a;
    padding-bottom:3px;font-weight:700}
  #legend h4.t2{margin-top:7px}
  #legend .fac{display:flex;align-items:center;gap:0;white-space:nowrap;overflow:hidden}
  #legend .sw{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px;
    flex-shrink:0;border:1px solid rgba(0,0,0,.15)}
  #legend .fac .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
  #legend .fac .sz{color:#9a8a3a;font-size:10px;margin-left:5px}
  #legend .gold{color:#c8920a;font-weight:700}
  #legend .dead{color:#9a9a9a;font-size:10.5px}
  #legend .hint{margin-top:7px;color:#a99428;font-size:10px;border-top:1px dotted #d6c46a;
    padding-top:5px;line-height:1.5}
  #legend.min{width:auto}
  #legend .fold{position:absolute;top:5px;right:7px;cursor:pointer;color:#b3a14a;font-size:11px;
    user-select:none}
  #legend.min .body{display:none}

  /* ── 토스트 ── */
  #toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%) translateY(20px);
    background:rgba(33,49,40,.94);color:#eafff0;padding:8px 16px;border-radius:18px;
    font-size:12px;z-index:9;opacity:0;transition:opacity .25s,transform .25s;
    box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:none;max-width:80%;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ── 상태바 ── */
  #statusbar{height:23px;background:var(--green);color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11px;flex-shrink:0;overflow:hidden}
  #statusbar .ev{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #statusbar .stat{display:flex;align-items:center;flex-shrink:0}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .zoom{margin-left:10px;flex-shrink:0;opacity:.9}

  /* ── 시트탭 ── */
  #tabs{height:26px;background:#f3f2f1;display:flex;align-items:stretch;
    border-top:1px solid var(--grid);flex-shrink:0;font-size:11.5px;padding-left:6px}
  #tabs .nav{display:flex;align-items:center;color:#9a9a9a;padding:0 8px;
    border-right:1px solid #ddd;gap:7px}
  #tabs .nav span{cursor:default}
  #tabs .tab{padding:0 16px;display:flex;align-items:center;border-right:1px solid #d6d6d6;
    background:#e9e9e9;color:#666;cursor:pointer;position:relative;white-space:nowrap}
  #tabs .tab:hover{background:#efefef}
  #tabs .tab.on{background:#fff;color:var(--green);font-weight:600}
  #tabs .tab.on::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--green)}
  #tabs .plus{padding:0 12px;display:flex;align-items:center;color:#9a9a9a;cursor:default}

  @media (max-width:640px){
    :root{--cw:26px;--ch:20px}
    #ribbon{height:54px}
    .rbtn .ico{font-size:16px}
    .rbtn{min-width:32px}
    #legend{width:150px;font-size:10px;top:6px;right:8px}
    #menubar div{padding:4px 7px}
    #titlebar .ttl{font-size:11px}
    #statusbar .hideS{display:none}
    .rgrp.opt{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <div class="ttl" id="titletext">고산씨족.xlsx - Excel</div>
    <div class="winbtns"><span>—</span><span>▢</span><span>✕</span></div>
  </div>

  <div id="menubar">
    <div>파일</div><div class="on">홈</div><div>삽입</div><div>페이지 레이아웃</div>
    <div>수식</div><div>데이터</div><div>검토</div><div>보기</div><div>도움말</div>
  </div>

  <div id="ribbon">
    <div class="rgrp">
      <div class="items">
        <div class="rbtn run" id="btnPlay"><div class="ico tri">&#9654;</div><div class="t">진행</div></div>
        <div class="rbtn" id="btnStep"><div class="ico tri">&#9654;&#9614;</div><div class="t">한 해</div></div>
        <div class="rbtn" id="btnSpeed"><div class="ico tri">&#9654;&#9654;</div><div class="t" id="speedT">×1</div></div>
      </div>
      <div class="lbl">시간(時間)</div>
    </div>
    <div class="rgrp">
      <div class="items">
        <div class="rbtn" id="btnSpawn"><div class="ico" style="color:#217346">&#9650;</div><div class="t">씨족 강림</div></div>
        <div class="rbtn" id="btnReseed"><div class="ico" style="color:#8a6d3b">&#9651;</div><div class="t">대지 재생성</div></div>
      </div>
      <div class="lbl">창조(創造)</div>
    </div>
    <div class="rgrp opt">
      <div class="items">
        <div class="rbtn" id="btnAval"><div class="ico" style="color:#5b8fc7">&#10052;</div><div class="t">눈사태</div></div>
        <div class="rbtn" id="btnPlague"><div class="ico" style="color:#7030a0;font-weight:700;font-size:15px">疫</div><div class="t">역병</div></div>
        <div class="rbtn" id="btnGold"><div class="ico" style="color:#c8920a">&#10038;</div><div class="t">황금기</div></div>
      </div>
      <div class="lbl">천재지변(天災)</div>
    </div>
    <div class="rgrp opt">
      <div class="items">
        <div class="rbtn" id="btnZoomIn"><div class="ico">&#43;</div><div class="t">자세히</div></div>
        <div class="rbtn" id="btnZoomOut"><div class="ico">&#8722;</div><div class="t">전체</div></div>
      </div>
      <div class="lbl">보기(視)</div>
    </div>
  </div>

  <div id="fbar">
    <div id="namebox"><span id="nameref">A1</span><span class="car">▾</span></div>
    <div id="fx">fx</div>
    <div id="formwrap">
      <input id="formula" autocomplete="off" spellcheck="false"
        placeholder='=SPAWN("씨족 이름") · 셀을 클릭하면 그 땅의 역사가 보입니다'>
      <span id="cmdhint">명령 입력 가능 ⏎</span>
    </div>
  </div>

  <div id="sheetwrap">
    <div id="sheet"></div>
    <div id="logsheet"></div>
    <div id="legend">
      <div class="fold" id="legfold">▾</div>
      <div class="body" id="legbody"></div>
    </div>
    <div id="toast"></div>
  </div>

  <div id="statusbar">
    <div class="ev" id="ev">천지가 갈라지고 산이 솟았습니다.</div>
    <div class="stat" id="stat"></div>
    <div class="zoom" id="zoomlbl">100%</div>
  </div>

  <div id="tabs">
    <div class="nav"><span>◁</span><span>▷</span></div>
    <div class="tab on" data-sheet="map">고산지도</div>
    <div class="tab" data-sheet="chron">연대기</div>
    <div class="tab" data-sheet="roster">씨족명부</div>
    <div class="tab" data-sheet="dead" id="deadtab">멸망기록 (0)</div>
    <div class="plus">＋</div>
  </div>
</div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const sheet = $('#sheet'), sheetwrap = $('#sheetwrap');
const fmla = $('#formula'), formwrap = $('#formwrap');
const nameref = $('#nameref'), evEl = $('#ev'), statEl = $('#stat');
const legend = $('#legend'), legbody = $('#legbody'), toast = $('#toast');
const logsheet = $('#logsheet'), zoomlbl = $('#zoomlbl');

/* ─────────── 격자 크기 (반응형) ─────────── */
let CW, CH, COLS, ROWS, N, ROWHD = 42;
let zoom = 1; // 0:전체 1:기본 2:자세히
const ZOOM = [{cw:20,ch:15},{cw:30,ch:21},{cw:42,ch:30}];

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(((i/COLS)|0)+1);}
function parseRef(str){
  const m=/^\$?([A-Z]+)\$?(\d+)$/i.exec(str.trim());
  if(!m) return -1;
  let c=0; const L=m[1].toUpperCase();
  for(let k=0;k<L.length;k++) c=c*26+(L.charCodeAt(k)-64);
  c--; const r=parseInt(m[2],10)-1;
  if(c<0||c>=COLS||r<0||r>=ROWS) return -1;
  return r*COLS+c;
}

/* ─────────── 세계 상태 ─────────── */
/* terrain elevation tiers (mountain theme):
   sea/lake(水) < valley(land) < forest(松) < pass(choke) < highland < peak(▲) < glacier(❅) */
let cells=[], cellEls=[];
let factions=[], obituaries=[], chronicle=[];
let year, lastEvent, pop;
let plague=new Map(), avalanche=new Map();
const dirty=new Set();
let selected=-1, nameIdx=0;
let tickN=0, warCD=0, eventCD=0;

const NAMES=['설풍 씨족','적봉 씨족','돌이끼 부족','은어금 일족','검은바위 씨족','서리뿔 부족','매발톱 일족','잿빛소나무 씨족','얼음샘 부족','구름다리 씨족','외뿔늑대 일족','붉은매 씨족'];
const SIGILS=['❆','▲','✦','◈','❖','✴','✿','❂','✙','❉','✵','◆'];
const COLORS=['#2563eb','#dc2626','#0d9488','#d97706','#475569','#7c3aed','#b45309','#4d7c0f','#0891b2','#9333ea','#be123c','#1d4ed8'];

/* ─────────── 지형 노이즈 (elevation map) ─────────── */
function buildTerrain(){
  const GW=10, GH=7, gz=[];
  // ridge-biased: 산맥 느낌 — 두 축의 sin + noise 합성
  for(let i=0;i<GW*GH;i++) gz[i]=Math.random();
  const noise=(x,y)=>{
    const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
    const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
    const a=gz[y0*GW+x0],b=gz[y0*GW+Math.min(GW-1,x0+1)];
    const c=gz[Math.min(GH-1,y0+1)*GW+x0],d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
    return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
  };
  cells=new Array(N);
  // 산맥 능선: 가로로 흐르는 ridge
  const ridgePhase=Math.random()*6.28, ridgeAmp=ROWS*0.18+Math.random()*ROWS*0.12;
  const ridgeY=ROWS*(0.35+Math.random()*0.3);
  for(let i=0;i<N;i++){
    const x=i%COLS, y=(i/COLS)|0;
    const ridge=ridgeY+Math.sin(x/COLS*Math.PI*2+ridgePhase)*ridgeAmp*0.4
                       +Math.sin(x/COLS*Math.PI*4+ridgePhase*1.7)*ridgeAmp*0.18;
    const distRidge=Math.abs(y-ridge)/ROWS; // 0=능선, 1=먼 곳
    let elev=noise(x,y)*0.55 + (1-distRidge)*0.55 + (Math.random()-0.5)*0.12;
    let st,terr,gly,hist;
    if(elev<0.30){ st='water'; terr='호수'; gly='~'; hist=['고요한 호수']; }
    else if(elev<0.46){ st='valley'; terr='골짜기'; gly=''; hist=['비옥한 골짜기']; }
    else if(elev<0.60){
      if(Math.random()<0.55){ st='forest'; terr='침엽림'; gly='松'; hist=['소나무 숲']; }
      else { st='valley'; terr='산기슭'; gly=''; hist=['완만한 산기슭']; }
    }
    else if(elev<0.72){ st='pass'; terr='고갯길'; gly='〦'; hist=['바람 부는 고갯길']; }
    else if(elev<0.86){ st='highland'; terr='고원'; gly='⌃'; hist=['황량한 고원']; }
    else if(elev<0.95){ st='peak'; terr='험봉'; gly='▲'; hist=['눈 덮인 험봉']; }
    else { st='glacier'; terr='빙하'; gly='❅'; hist=['영원한 빙하']; }
    cells[i]={st,baseSt:st,terr,gly,owner:null,level:0,hist,elev,ruinT:0};
  }
}

function nbrs(i){
  const x=i%COLS,y=(i/COLS)|0,out=[];
  if(x>0)out.push(i-1); if(x<COLS-1)out.push(i+1);
  if(y>0)out.push(i-COLS); if(y<ROWS-1)out.push(i+COLS);
  return out;
}
function passable(c){ return c.st!=='water'&&c.st!=='glacier'; }

/* ─────────── DOM 빌드 ─────────── */
function computeDims(){
  const z=ZOOM[zoom]; CW=z.cw; CH=z.ch;
  const availW=sheetwrap.clientWidth, availH=sheetwrap.clientHeight;
  COLS=Math.max(16,Math.min(40,Math.floor((availW-ROWHD)/CW)));
  ROWS=Math.max(12,Math.min(40,Math.floor((availH-CH)/CH)));
  N=COLS*ROWS;
}
function buildGrid(){
  cellEls=new Array(N);
  sheet.style.gridTemplateColumns=`${ROWHD}px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows=CH+'px';
  const frag=document.createDocumentFragment();
  const cor=document.createElement('div'); cor.className='hd cor'; frag.appendChild(cor);
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd';h.dataset.col=c;h.textContent=colName(c);frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd';h.dataset.row=r;h.textContent=r+1;frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d;frag.appendChild(d);
    }
  }
  sheet.innerHTML=''; sheet.appendChild(frag);
}

/* ─────────── 그리기 ─────────── */
const LV_TXT=['','·','田','砦','城'];          // 개척 / 화전 / 산채(요새) / 산성
const LV_LABEL=['','개척지','산전(山田)','산채','산성'];
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

const TERR_BG={water:'#dbe9f6',valley:'#fbfaf4',forest:'#e4efdc',pass:'#f3ece0',
  highland:'#efece6',peak:'#f1f2f4',glacier:'#eef4f8',ruin:'#ececec'};
const TERR_COL={water:'#9dc3e6',forest:'#6a9a45',pass:'#b59a6a',highland:'#b9b2a6',
  peak:'#8a93a8',glacier:'#9fc6df',ruin:'#aaa'};

function paint(i){
  const c=cells[i], el=cellEls[i];
  let bg='',tx='',col='#222',w='',cap='';
  if(avalanche.has(i)){bg='#dbeaf5';tx='❄';col='#3a78b5';w='700';}
  else if(plague.has(i)){bg='#ead5f5';tx='疫';col='#7030a0';w='700';}
  else if(c.st==='ruin'){bg='#ededed';tx='墟';col='#a0a0a0';}
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      bg=hexA(f.color,0.14+c.level*0.18);
      tx=LV_TXT[c.level]; col=f.color; w=c.level>=3?'700':'';
      if(c.level===4){ tx=f.sigil; } // 산성 = 씨족 문장
      if(c.baseSt==='peak'&&c.level<2){ tx='▲'; col=f.color; } // 봉우리 점령
    }
  } else {
    bg=TERR_BG[c.st]||'#fff'; tx=c.gly; col=TERR_COL[c.st]||'#222';
    if(c.st==='peak'||c.st==='glacier')w='700';
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w; el.textContent=tx;
}
function repaintAll(){ for(let i=0;i<N;i++) paint(i); }

/* ─────────── 씨족 ─────────── */
function facById(id){ for(const f of factions) if(f.id===id) return f; return null; }
let facSeq=0;
function spawnFaction(announce, label){
  if(nameIdx>=NAMES.length) nameIdx=0;
  const f={id:facSeq++,name:label||NAMES[nameIdx],color:COLORS[nameIdx%COLORS.length],
    sigil:SIGILS[nameIdx%SIGILS.length],golden:0,size:0,peakYr:year,arr:[],born:year};
  nameIdx++;
  // 고지대(고원/고갯길/험봉) 선호 — 산악 씨족
  let best=-1, bestScore=-1;
  for(let tries=0;tries<260;tries++){
    const i=Math.random()*N|0, c=cells[i];
    if((c.st==='valley'||c.st==='pass'||c.st==='highland'||c.st==='forest')&&c.owner===null){
      const sc=c.elev+Math.random()*0.2;
      if(sc>bestScore){bestScore=sc;best=i;}
      if(tries>40&&best>=0)break;
    }
  }
  if(best<0){ // fallback 아무 빈 통과 가능 셀
    for(let i=0;i<N;i++) if(cells[i].owner===null&&passable(cells[i])){best=i;break;}
  }
  if(best<0) return null;
  cells[best].st='valley'; setCell(best,f.id,1,'개척지');
  cellEls[best].classList.remove('ring'); void cellEls[best].offsetWidth; cellEls[best].classList.add('ring');
  factions.push(f);
  if(announce) logEvent(`${f.name}이(가) ${ref(best)} 봉우리에 깃발을 세웠습니다.`,`=SPAWN("${f.name}", ${ref(best)})`,f);
  return f;
}

function setCell(i,owner,level,histLabel){
  const c=cells[i];
  if(c.st==='ruin')c.ruinT=0;
  c.owner=owner; c.level=level; if(c.st==='water'||c.st==='glacier')c.st='valley';
  if(histLabel){c.hist.push(histLabel); if(c.hist.length>8)c.hist.shift();}
  dirty.add(i);
}

function logEvent(msg,formula,fac){
  lastEvent=`서기 ${year}년 — ${msg}`;
  if(formula) fmla.value=formula;
  chronicle.push({year,msg,formula,color:fac?fac.color:'#777',dead:/사라|멸망|소멸/.test(msg)});
  if(chronicle.length>400) chronicle.shift();
  if(currentSheet==='chron'||currentSheet==='dead') renderLog(currentSheet);
}
function flashWar(i){const el=cellEls[i];el.classList.add('war');setTimeout(()=>el.classList.remove('war'),900);}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),2200);}

/* ─────────── 틱 (한 해) ─────────── */
const PW=[0,30,120,420,1200];
function tick(){
  tickN++; year++;
  if(warCD>0)warCD--; if(eventCD>0)eventCD--;

  for(const f of factions){f.arr.length=0;f.size=0;}
  pop=0;
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin'&&--c.ruinT<=0){c.st=c.baseSt; if(c.st==='water'||c.st==='glacier')c.gly=(c.baseSt==='water'?'~':'❅'); dirty.add(i);}
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){f.arr.push(i);f.size++;pop+=PW[c.level];}
      else{c.owner=null;c.level=0;dirty.add(i);}
    }
  }

  // 멸망
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      obituaries.push({name:f.name,sigil:f.sigil,color:f.color,born:f.born,died:year,peak:f.peakMax||1});
      logEvent(`${f.name}이(가) 역사 속으로 사라졌습니다. (${f.born}~${year})`,`=COLLAPSE("${f.name}", ${f.born}, ${year})`,f);
      factions.splice(k,1);
    } else { f.peakMax=Math.max(f.peakMax||0,f.size); }
  }

  // 눈사태 (mountain theme의 핵심 천재 — 인접 고지로 번지고 영토를 폐허로)
  for(const [i,t] of [...avalanche]){
    if(Math.random()<0.18){
      for(const n of nbrs(i)){
        const c=cells[n];
        if(!avalanche.has(n)&&(c.st==='peak'||c.st==='highland'||c.st==='pass'||(c.owner!==null&&c.elev>0.55))){
          if(Math.random()<0.6){avalanche.set(n,4);dirty.add(n);}
        }
      }
    }
    if(t<=1){
      avalanche.delete(i);
      const c=cells[i];
      if(c.owner!==null){c.owner=null;c.level=0;c.st='ruin';c.ruinT=140;c.hist.push('눈사태에 묻힘');if(c.hist.length>8)c.hist.shift();}
      dirty.add(i);
    } else avalanche.set(i,t-1);
  }

  // 역병
  if(plague.size){
    for(const [i,t] of [...plague]){
      if(Math.random()<0.15) for(const n of nbrs(i)) if(cells[n].owner!==null&&!plague.has(n)){plague.set(n,10);dirty.add(n);}
      if(Math.random()<0.22){
        const c=cells[i]; c.level--;
        if(c.level<=0){c.owner=null;c.level=0;c.hist.push('역병으로 폐촌');if(c.hist.length>8)c.hist.shift();}
        dirty.add(i);
      }
      if(t<=1){plague.delete(i);dirty.add(i);} else plague.set(i,t-1);
    }
    if(plague.size===0) logEvent('역병이 산을 넘어 물러갔습니다.','=PLAGUE.END()');
  }

  // 씨족 행동
  for(const f of factions){
    if(f.golden>0)f.golden--;
    if(f.size===0)continue;
    // 확장
    const attempts=1+(f.size*0.07|0);
    for(let a=0;a<attempts;a++){
      const src=f.arr[Math.random()*f.arr.length|0];
      if(src===undefined||cells[src].owner!==f.id)continue;
      const nb=nbrs(src), tgt=nb[Math.random()*nb.length|0];
      const tc=cells[tgt];
      if(!passable(tc)||avalanche.has(tgt))continue;
      if(tc.owner===null){
        if(tc.st==='forest'){ if(Math.random()<0.28){tc.st='valley';tc.hist.push('개간');setCell(tgt,f.id,1,'개척지');} }
        else if(tc.st==='peak'||tc.st==='highland'){ if(Math.random()<0.12){setCell(tgt,f.id,1,'고봉 정복');} }
        else setCell(tgt,f.id,1,'개척지');
      } else if(tc.owner!==f.id&&Math.random()<0.30){
        // 전쟁 — 고갯길(pass)은 방어 보너스 (choke point)
        const passBonus=tc.st==='pass'?2:0;
        const att=1+Math.random()*3+f.size*0.0025+(f.golden?1.2:0);
        const def=tc.level+1+Math.random()*3+passBonus+cells[tgt].elev*1.5;
        flashWar(tgt);
        if(att>def){
          const defF=facById(tc.owner);
          if(Math.random()<0.25){
            avalanche.has(tgt)||(()=>{})();
            const c=cells[tgt];c.owner=null;c.level=0;c.st='ruin';c.ruinT=110;
            c.hist.push('전화에 불탐');if(c.hist.length>8)c.hist.shift();dirty.add(tgt);
          } else setCell(tgt,f.id,Math.max(1,tc.level-1),'점령됨');
          if((tc.level>=3||warCD===0)&&defF){
            logEvent(`${f.name}이(가) ${defF.name}의 ${LV_LABEL[Math.max(1,tc.level)]||'영지'}(${ref(tgt)})를 쳤습니다.`,
              `=WAR("${f.name}"→"${defF.name}", ${ref(tgt)})`,f);
            warCD=34;
          }
        }
      }
    }
    // 발전
    const ups=1+(f.size*0.05|0);
    for(let u=0;u<ups;u++){
      const i=f.arr[Math.random()*f.arr.length|0];
      if(i===undefined||cells[i].owner!==f.id)continue;
      const c=cells[i];
      if(c.level<4&&Math.random()<0.06*(f.golden?2.6:1)){
        c.level++; c.hist.push(LV_LABEL[c.level]);if(c.hist.length>8)c.hist.shift();
        cellEls[i].classList.remove('pop');void cellEls[i].offsetWidth;cellEls[i].classList.add('pop');
        dirty.add(i);
        if(c.level===4&&warCD===0){
          logEvent(`${f.name}이(가) ${ref(i)}에 산성(山城)을 쌓았습니다.`,`=CITADEL("${f.name}", ${ref(i)})`,f);
          warCD=22;
        }
      }
    }
  }

  // 무작위 사건
  const r=Math.random();
  if(eventCD===0){
    if(!plague.size&&r<0.005){
      const big=[];for(let i=0;i<N;i++)if(cells[i].owner!==null&&cells[i].level>=3)big.push(i);
      if(big.length){const i=big[Math.random()*big.length|0];plague.set(i,10);dirty.add(i);
        logEvent(`${ref(i)} 산채에 역병이 돌기 시작했습니다.`,`=PLAGUE(${ref(i)})`);eventCD=60;}
    } else if(r>0.995&&!avalanche.size){
      const hi=[];for(let i=0;i<N;i++){const c=cells[i];if((c.st==='peak'||c.st==='highland'||c.elev>0.6)&&c.st!=='ruin')hi.push(i);}
      if(hi.length){const i=hi[Math.random()*hi.length|0];avalanche.set(i,5);dirty.add(i);
        logEvent(`${ref(i)} 험봉에서 눈사태가 시작되었습니다.`,`=AVALANCHE(${ref(i)})`);eventCD=55;}
    } else if(r>0.992&&r<=0.995&&factions.length){
      const f=factions[Math.random()*factions.length|0];f.golden=80;
      logEvent(`${f.name}의 황금기가 열렸습니다.`,`=GOLDEN.AGE("${f.name}", 80)`,f);eventCD=80;
    }
  }
  if(factions.length<3&&Math.random()<0.012){
    const f=spawnFaction(false);
    if(f) logEvent(`고개 너머에서 ${f.name}이(가) 넘어왔습니다.`,`=MIGRATE("${f.name}")`,f);
  }

  for(const i of dirty) paint(i);
  dirty.clear();
  updateStatus();
  if(tickN%6===0) updateLegend();
}

/* ─────────── HUD ─────────── */
function updateStatus(){
  evEl.textContent=lastEvent;
  statEl.innerHTML=
    `<span class="hideS">서기 <b>${year}</b>년<span class="sep">|</span></span>`+
    `인구 ${pop.toLocaleString()}<span class="sep">|</span>`+
    `씨족 ${factions.length}<span class="sep">|</span>`+
    `${running?'<span style="color:#bff0d0">▶ 진행중</span>':'<span style="color:#ffd9d2">⏸ 멈춤</span>'}`;
}
function updateLegend(){
  document.getElementById('titletext').textContent=`고산씨족.xlsx - Excel  ·  서기 ${year}년`;
  const sorted=[...factions].sort((a,b)=>b.size-a.size);
  let h='<h4>씨족 현황 (山岳氏族)</h4>';
  if(!sorted.length) h+='<div class="dead">— 살아있는 씨족 없음 —</div>';
  for(const f of sorted){
    h+=`<div class="fac"><span class="sw" style="background:${f.color}"></span>`+
       `<span class="nm">${f.sigil} ${f.name}${f.golden?' <span class="gold">✦</span>':''}</span>`+
       `<span class="sz">${f.size}칸</span></div>`;
  }
  if(obituaries.length){
    h+='<h4 class="t2">멸망기록 ('+obituaries.length+')</h4>';
    for(const o of obituaries.slice(-3)) h+=`<div class="dead">† ${o.name} (${o.died}년)</div>`;
  }
  h+='<div class="hint">셀 클릭=땅의 역사 · 빈 셀 클릭=개척<br>수식바에 <b>=SPAWN("이름")</b> 입력 가능</div>';
  legbody.innerHTML=h;
  document.getElementById('deadtab').textContent=`멸망기록 (${obituaries.length})`;
}

/* ─────────── 로그 시트 렌더 ─────────── */
function renderLog(which){
  let rows='', i=1;
  if(which==='chron'){
    logsheet.innerHTML='';
    let html='<table><thead><tr><th class="rh"></th><th class="yr">연도(年)</th><th>사건(史記)</th><th>수식(數式)</th></tr></thead><tbody>';
    const list=chronicle.slice().reverse();
    for(const c of list){
      html+=`<tr class="${c.dead?'deadrow':''}"><td class="rh">${i++}</td>`+
        `<td class="yr">서기 ${c.year}년</td>`+
        `<td><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${c.color};margin-right:6px"></span>${c.msg}</td>`+
        `<td class="fx">${(c.formula||'').replace(/</g,'&lt;')}</td></tr>`;
    }
    if(!list.length) html+='<tr><td class="rh">1</td><td class="yr">—</td><td>아직 기록된 사건이 없습니다.</td><td class="fx"></td></tr>';
    html+='</tbody></table>';
    logsheet.innerHTML=html;
  } else if(which==='dead'){
    let html='<table><thead><tr><th class="rh"></th><th>씨족(氏族)</th><th class="yr">존속(存續)</th><th class="yr">전성기 영토</th><th>비문(碑文)</th></tr></thead><tbody>';
    const list=obituaries.slice().reverse();
    for(const o of list){
      const span=o.died-o.born;
      html+=`<tr class="deadrow"><td class="rh">${i++}</td>`+
        `<td><span style="color:${o.color}">${o.sigil}</span> ${o.name}</td>`+
        `<td class="yr">${o.born}~${o.died} (${span}년)</td>`+
        `<td class="yr">${o.peak}칸</td>`+
        `<td class="fx">=EPITAPH("${span<60?'덧없이 스러지다':span<200?'한 시대를 풍미하다':'산처럼 오래 버티다'}")</td></tr>`;
    }
    if(!list.length) html+='<tr><td class="rh">1</td><td colspan="4" style="color:#999">아직 멸망한 씨족이 없습니다. 산은 고요합니다.</td></tr>';
    html+='</tbody></table>';
    logsheet.innerHTML=html;
  } else if(which==='roster'){
    let html='<table><thead><tr><th class="rh"></th><th>문장</th><th>씨족(氏族)</th><th class="yr">영토</th><th class="yr">건국</th><th>상태</th><th>수식</th></tr></thead><tbody>';
    const list=[...factions].sort((a,b)=>b.size-a.size);
    for(const f of list){
      const peakCnt=f.arr?f.arr.filter(x=>cells[x].level>=3).length:0;
      html+=`<tr><td class="rh">${i++}</td>`+
        `<td style="text-align:center;color:${f.color};font-size:14px">${f.sigil}</td>`+
        `<td><b style="color:${f.color}">${f.name}</b></td>`+
        `<td class="yr">${f.size}칸 (요새 ${peakCnt})</td>`+
        `<td class="yr">서기 ${f.born}년</td>`+
        `<td>${f.golden?'<span style="color:#c8920a;font-weight:700">✦ 황금기</span>':'평시'}</td>`+
        `<td class="fx">=CLAN("${f.name}", ${f.size})</td></tr>`;
    }
    if(!list.length) html+='<tr><td class="rh">1</td><td colspan="6" style="color:#999">살아있는 씨족이 없습니다.</td></tr>';
    html+='</tbody></table>';
    logsheet.innerHTML=html;
  }
}

/* ─────────── 시트 전환 ─────────── */
let currentSheet='map';
function switchSheet(s){
  currentSheet=s;
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.sheet===s));
  if(s==='map'){ sheet.style.display='grid'; logsheet.style.display='none'; legend.style.display='block'; }
  else { sheet.style.display='none'; logsheet.style.display='block'; legend.style.display='none'; renderLog(s); }
}
document.querySelectorAll('#tabs .tab').forEach(t=>t.addEventListener('click',()=>switchSheet(t.dataset.sheet)));

/* ─────────── 셀 상호작용 ─────────── */
sheet.addEventListener('click',e=>{
  const t=e.target.closest('.cell'); if(!t)return;
  if(selected>=0&&cellEls[selected])cellEls[selected].classList.remove('sel');
  selected=+t.dataset.i; t.classList.add('sel');
  nameref.textContent=ref(selected);
  const c=cells[selected];
  // 빈 통과가능 셀 클릭 = 개척(가장 가까운 씨족 확장) / 소유 셀 = 역사
  if(c.owner===null&&passable(c)&&factions.length){
    // 인접 씨족이 있으면 그쪽이 개척
    let claimed=false;
    for(const n of nbrs(selected)){
      if(cells[n].owner!==null){ setCell(selected,cells[n].owner,1,'개척(개입)'); paint(selected);
        const f=facById(cells[n].owner);
        logEvent(`개입: ${f?f.name:'씨족'}이(가) ${ref(selected)}로 진출했습니다.`,`=CLAIM(${ref(selected)})`,f);
        showToast(`${ref(selected)} 개척됨`); claimed=true; break; }
    }
    if(!claimed){ fmla.value=`=TERRAIN(${ref(selected)}, "${c.terr}")`; }
  } else {
    fmla.value=`=HISTORY(${ref(selected)}; ${c.hist.map(x=>`"${x}"`).join(' → ')})`;
  }
});

/* ─────────── 수식바 명령 ─────────── */
fmla.addEventListener('focus',()=>formwrap.classList.add('typing'));
fmla.addEventListener('blur',()=>formwrap.classList.remove('typing'));
fmla.addEventListener('keydown',e=>{
  if(e.key==='Enter'){ runCommand(fmla.value); fmla.blur(); }
  else if(e.key==='Escape'){ fmla.blur(); }
});
function runCommand(raw){
  const s=raw.trim();
  let m;
  if((m=/^=?\s*SPAWN\s*\(\s*"([^"]+)"\s*\)/i.exec(s))){
    const f=spawnFaction(true,m[1]); paint(selected>=0?selected:0);
    showToast(f?`${m[1]} 강림!`:'빈 땅이 없습니다'); updateLegend();
  } else if((m=/^=?\s*AVALANCHE\s*\(\s*([A-Z]+\d+)?\s*\)/i.exec(s))){
    triggerAval(m[1]?parseRef(m[1]):-1); showToast('눈사태 발생!');
  } else if((m=/^=?\s*PLAGUE\s*\(\s*([A-Z]+\d+)?\s*\)/i.exec(s))){
    triggerPlague(m[1]?parseRef(m[1]):-1); showToast('역병 발생!');
  } else if(/^=?\s*GOLDEN/i.test(s)){
    if(factions.length){const f=factions[Math.random()*factions.length|0];f.golden=80;
      logEvent(`${f.name}의 황금기가 열렸습니다.`,`=GOLDEN.AGE("${f.name}", 80)`,f);showToast(`${f.name} 황금기!`);}
  } else if((m=/^=?\s*GOTO\s*\(\s*([A-Z]+\d+)\s*\)/i.exec(s))){
    const i=parseRef(m[1]); if(i>=0){selectIdx(i);showToast(`${m[1]} 선택`);}
  } else if(s===''){ /* noop */ }
  else { showToast('명령: =SPAWN("이름"), =AVALANCHE(셀), =PLAGUE(셀), =GOLDEN()'); }
}
function selectIdx(i){
  if(selected>=0&&cellEls[selected])cellEls[selected].classList.remove('sel');
  selected=i; cellEls[i].classList.add('sel'); nameref.textContent=ref(i);
}

/* ─────────── 천재지변 트리거 ─────────── */
function triggerAval(i){
  if(i<0){ const hi=[];for(let k=0;k<N;k++){const c=cells[k];if((c.st==='peak'||c.st==='highland'||c.elev>0.6)&&c.st!=='ruin')hi.push(k);}
    if(hi.length)i=hi[Math.random()*hi.length|0]; }
  if(i<0)i=Math.random()*N|0;
  avalanche.set(i,5); dirty.add(i); paint(i);
  logEvent(`${ref(i)}에서 눈사태가 시작되었습니다.`,`=AVALANCHE(${ref(i)})`); eventCD=40;
}
function triggerPlague(i){
  if(i<0){ const big=[];for(let k=0;k<N;k++)if(cells[k].owner!==null)big.push(k);
    if(big.length)i=big[Math.random()*big.length|0]; }
  if(i<0)return;
  plague.set(i,10); dirty.add(i); paint(i);
  logEvent(`${ref(i)}에 역병이 돌기 시작했습니다.`,`=PLAGUE(${ref(i)})`); eventCD=40;
}

/* ─────────── 리본 버튼 ─────────── */
let running=true, speed=1, timer=null;
const SPEEDS=[1,2,4]; let speedIdx=0;
const baseInterval=130;
function restartTimer(){
  if(timer)clearInterval(timer);
  if(running) timer=setInterval(tick, baseInterval/SPEEDS[speedIdx]);
}
$('#btnPlay').addEventListener('click',()=>{
  running=!running;
  const b=$('#btnPlay');
  b.querySelector('.ico').innerHTML=running?'&#9654;':'&#10074;&#10074;';
  b.querySelector('.t').textContent=running?'진행':'멈춤';
  b.classList.toggle('run',running); b.classList.toggle('paused',!running);
  restartTimer(); updateStatus();
  showToast(running?'시간이 흐릅니다':'시간이 멈췄습니다');
});
$('#btnStep').addEventListener('click',()=>{ tick(); if(currentSheet!=='map')renderLog(currentSheet); });
$('#btnSpeed').addEventListener('click',()=>{
  speedIdx=(speedIdx+1)%SPEEDS.length; $('#speedT').textContent='×'+SPEEDS[speedIdx]; restartTimer();
  showToast('속도 ×'+SPEEDS[speedIdx]);
});
$('#btnSpawn').addEventListener('click',()=>{ const f=spawnFaction(true); updateLegend(); showToast(f?`${f.name} 강림!`:'빈 땅이 없습니다'); });
$('#btnReseed').addEventListener('click',()=>{ reseed(); showToast('대지가 다시 솟았습니다'); });
$('#btnAval').addEventListener('click',()=>{ triggerAval(selected); showToast('눈사태!'); });
$('#btnPlague').addEventListener('click',()=>{ triggerPlague(selected); showToast('역병!'); });
$('#btnGold').addEventListener('click',()=>{ runCommand('=GOLDEN()'); });
$('#btnZoomIn').addEventListener('click',()=>setZoom(Math.min(2,zoom+1)));
$('#btnZoomOut').addEventListener('click',()=>setZoom(Math.max(0,zoom-1)));
$('#legfold').addEventListener('click',()=>{legend.classList.toggle('min');$('#legfold').textContent=legend.classList.contains('min')?'▸':'▾';});

function setZoom(z){
  if(z===zoom)return; zoom=z;
  zoomlbl.textContent=({0:'70%',1:'100%',2:'140%'})[z];
  rebuild(true);
}

/* ─────────── 초기화 / 재생성 ─────────── */
function freshWorld(){
  factions=[];obituaries=[];chronicle=[];plague=new Map();avalanche=new Map();dirty.clear();
  facSeq=0;nameIdx=Math.random()*NAMES.length|0;selected=-1;tickN=0;warCD=0;eventCD=0;
  year=1;pop=0;lastEvent='천지가 갈라지고 산이 솟았습니다.';
  buildTerrain();
}
function reseed(){
  freshWorld(); repaintAll();
  fmla.value=`=SIM.MOUNTAIN($A$1:$${colName(COLS-1)}$${ROWS}, "산은 사람을 기억한다")`;
  const k=2+(Math.random()*2|0);
  for(let i=0;i<k;i++)spawnFaction(true);
  updateLegend(); updateStatus();
  if(currentSheet!=='map')renderLog(currentSheet);
}
function rebuild(keepState){
  // zoom/resize 시 격자 재계산 — 새 월드로 재생성(간결성 위해)
  computeDims(); buildGrid(); reseed();
}

function bootstrap(){
  computeDims(); buildGrid(); freshWorld(); repaintAll();
  fmla.value=`=SIM.MOUNTAIN($A$1:$${colName(COLS-1)}$${ROWS}, "산은 사람을 기억한다")`;
  spawnFaction(true); spawnFaction(true); spawnFaction(true);
  updateLegend(); updateStatus();
  restartTimer();
}

/* ─────────── resize (debounce) ─────────── */
let rtimer=null;
window.addEventListener('resize',()=>{
  clearTimeout(rtimer);
  rtimer=setTimeout(()=>{
    const oldC=COLS,oldR=ROWS; computeDims();
    if(COLS!==oldC||ROWS!==oldR){ buildGrid(); reseed(); }
  },220);
});

bootstrap();
})();
</script>
</body>
