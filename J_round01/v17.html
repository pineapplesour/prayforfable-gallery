<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>天空.xlsx - Excel</title>
<style>
  :root{
    --excel:#217346; --excelD:#185a37; --sky:#2f7fd6;
    --grid:#e4e9ef; --hdbg:#f4f6f9; --hdline:#cfd6df;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#dfe3e8;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",-apple-system,sans-serif;
    font-size:12px;color:#222;user-select:none;-webkit-tap-highlight-color:transparent}
  #app{display:flex;flex-direction:column;height:100%}

  /* title bar */
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #e1ddd9;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar .ic{width:17px;height:17px;border-radius:3px;background:var(--excel);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;
    font-weight:700;margin-left:6px}
  #titlebar .tt{flex:1;text-align:center;color:#3b3b3b;font-size:12px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #titlebar .wd{display:flex;gap:18px;color:#888;margin-right:4px}

  /* ribbon menu */
  #menubar{height:27px;background:#fff;display:flex;align-items:flex-end;
    padding:0 6px 0 10px;gap:2px;border-bottom:1px solid #eceaea;font-size:12px;color:#444;flex:0 0 auto}
  #menubar div{padding:5px 9px;border-radius:3px 3px 0 0;cursor:default;white-space:nowrap}
  #menubar div.on{color:var(--excel);font-weight:600;
    border-bottom:2.5px solid var(--excel);border-radius:0;padding-bottom:3px}
  #menubar div:hover:not(.on){background:#f3f3f3}

  /* ribbon (home actions) */
  #ribbon{height:58px;background:#f7f7f7;display:flex;align-items:stretch;
    padding:4px 10px 0;gap:0;border-bottom:1px solid #e3e3e3;flex:0 0 auto;overflow:hidden}
  .rgrp{display:flex;flex-direction:column;align-items:center;height:100%;
    justify-content:space-between;padding:2px 12px 3px;border-right:1px solid #e6e6e6}
  .rgrp .rrow{display:flex;gap:6px;flex:1;align-items:center}
  .rbtn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
    padding:2px 7px;border-radius:4px;color:#3c4250;min-width:46px}
  .rbtn:hover{background:#eaf3ec}
  .rbtn .gly{font-size:15px;line-height:1}
  .rbtn .lb{font-size:10px;color:#5a5f66}
  .rgrp .gl{font-size:10px;color:#9aa0a8;line-height:1.1;flex:0 0 auto;padding-top:1px}
  .rbtn.live .gly{color:var(--sky)}

  /* formula bar */
  #fbar{height:25px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d9dde2;font-size:12px;flex:0 0 auto}
  #namebox{width:88px;height:100%;border-right:1px solid #d9dde2;display:flex;
    align-items:center;justify-content:space-between;padding:0 8px;color:#333;flex:0 0 auto}
  #namebox .car{color:#9aa0a8;font-size:8px}
  #fx{width:34px;text-align:center;color:#9aa0a8;font-style:italic;
    font-family:Georgia,"Times New Roman",serif;flex:0 0 auto;border-right:1px solid #ededed}
  #formula{flex:1;padding:0 9px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #formula .fn{color:#0a7d34;font-weight:600}
  #formula .ar{color:#7a4ad8}
  #formula .st{color:#c0392b}

  /* sheet */
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1 1 auto;min-height:0}
  #sheet{display:grid;background:#fff;position:absolute;top:0;left:0}
  .hd{background:var(--hdbg);border-right:1px solid var(--hdline);
    border-bottom:1px solid var(--hdline);display:flex;align-items:center;
    justify-content:center;color:#62696f;font-size:10.5px;position:relative}
  .hd.cr{background:#eef1f4}
  .hd.cr::after{content:"";position:absolute;right:3px;bottom:3px;width:0;height:0;
    border-left:5px solid transparent;border-top:5px solid #c2c8cf}
  .cell{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;overflow:hidden;cursor:cell;position:relative;
    font-family:"Segoe UI Symbol","Noto Sans Symbols","맑은 고딕",sans-serif}
  .cell.sel{outline:2px solid var(--excel);outline-offset:-2px;z-index:3}
  .cell .sub{position:absolute;bottom:0;right:1px;font-size:7px;opacity:.7;line-height:1}

  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #ff3b3b}50%{box-shadow:inset 0 0 0 2px #ffcaca}}
  .war{animation:warf .3s 3;z-index:2}
  @keyframes blm{0%{box-shadow:inset 0 0 0 0 #ffe79a}40%{box-shadow:inset 0 0 0 3px #ffd24d}100%{box-shadow:inset 0 0 0 0 #ffe79a}}
  .bloom{animation:blm .7s 1;z-index:2}

  /* legend / HUD card */
  #legend{position:absolute;top:9px;right:13px;background:#fffdf2;
    border:1px solid #e3d68f;border-radius:3px;
    box-shadow:0 4px 14px rgba(0,0,0,.16);padding:9px 12px 10px;font-size:11px;z-index:6;
    width:212px;line-height:1.65}
  #legend h4{margin:0 0 4px;font-size:11px;color:#7a6a1f;
    border-bottom:1px dashed #e0d289;padding-bottom:3px}
  #legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;
    margin-right:6px;vertical-align:-1px}
  #legend .fr{display:flex;align-items:center;gap:1px;margin:1px 0}
  #legend .fr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #legend .fr .tr{color:#8a8f96;font-size:10px}
  #legend .bar{height:4px;border-radius:2px;margin-top:2px;opacity:.85}
  #legend .dead{color:#9a9a9a;font-size:10.5px}
  #legend .glx{color:#c79a16}
  #legend .hint{margin-top:7px;font-size:10px;color:#8a8f96;border-top:1px dashed #e0d289;padding-top:5px}

  /* status bar */
  #statusbar{height:23px;background:var(--excel);color:#eaf6ee;display:flex;
    align-items:center;padding:0 12px;font-size:11.5px;flex:0 0 auto;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .ev{flex:1;overflow:hidden;text-overflow:ellipsis;opacity:.95}
  #statusbar .rt{margin-left:9px;opacity:.85}

  /* sheet tabs */
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;
    padding-left:8px;border-top:1px solid #d9dde2;font-size:11.5px;flex:0 0 auto;overflow:hidden}
  #tabs .nav{display:flex;align-items:center;color:#9aa0a8;gap:9px;padding:0 8px 3px;font-size:11px}
  #tabs .tb{padding:3px 13px;border:1px solid #d9dde2;border-bottom:none;margin-right:2px;
    background:#eceaea;color:#5a5f66;cursor:pointer;border-radius:3px 3px 0 0}
  #tabs .tb.on{background:#fff;color:var(--excel);font-weight:600;border-top:2px solid var(--excel)}
  #tabs .plus{color:#9aa0a8;padding:3px 8px;cursor:default}

  /* log panel overlay (연대기/멸망기록 sheets) */
  #panel{position:absolute;inset:0;background:#fff;z-index:8;display:none;
    flex-direction:column;overflow:hidden}
  #panel.show{display:flex}
  #panel .ph{padding:9px 16px;font-size:13px;font-weight:600;color:#2d3138;
    border-bottom:1px solid #e7e7e7;background:#fafbfc;display:flex;align-items:center;gap:8px}
  #panel .ph .pi{width:16px;height:16px;border-radius:3px;background:var(--sky);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:10px}
  #plist{flex:1;overflow:auto;padding:0}
  #plist .lg{display:grid;grid-template-columns:64px 96px 1fr;gap:0;
    border-bottom:1px solid #f0f0f0;font-size:11.5px}
  #plist .lg>div{padding:5px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #plist .lg:nth-child(even){background:#fafcfe}
  #plist .lg .yr{color:#8a8f96;font-family:Consolas,monospace}
  #plist .lg .fm{font-family:Consolas,monospace;color:#0a7d34;border-right:1px solid #f0f0f0}
  #plist .lhd{position:sticky;top:0;background:var(--hdbg);font-weight:600;color:#62696f;z-index:1}
  #plist .lhd .fm{color:#62696f}
  #plist .dead .fm{color:#b03030}
  #plist .empty{padding:30px;text-align:center;color:#a8adb4}

  @media(max-width:520px){
    #ribbon{display:none}
    #titlebar .wd{display:none}
    #legend{width:166px;top:7px;right:8px;font-size:10px;padding:7px 9px}
    #namebox{width:64px}
    #statusbar{font-size:10.5px;padding:0 8px}
    #statusbar .hideS{display:none}
    #plist .lg{grid-template-columns:48px 80px 1fr}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <div class="ic">X</div>
    <div class="tt">天空.xlsx - Excel</div>
    <div class="wd"><span>—</span><span>▢</span><span>✕</span></div>
  </div>

  <div id="menubar">
    <div>파일</div><div class="on">홈</div><div>삽입</div><div>페이지 레이아웃</div>
    <div>수식</div><div>데이터</div><div>검토</div><div>보기</div><div>도움말</div>
  </div>

  <div id="ribbon">
    <div class="rgrp">
      <div class="rrow">
        <div class="rbtn live" id="b-pause"><span class="gly">⏸</span><span class="lb">일시정지</span></div>
        <div class="rbtn live" id="b-speed"><span class="gly">⏩</span><span class="lb">×1</span></div>
      </div>
      <div class="gl">시뮬레이션</div>
    </div>
    <div class="rgrp">
      <div class="rrow">
        <div class="rbtn live" id="b-bloom"><span class="gly">✦</span><span class="lb">개화 씨앗</span></div>
        <div class="rbtn live" id="b-storm"><span class="gly">🜨</span><span class="lb">폭풍 소환</span></div>

      <div class="rrow">
        <div class="rbtn"><span class="gly" style="color:#dbe3ee">B</span><span class="lb">맑은 고딕</span></div>
        <div class="rbtn"><span class="gly" style="color:#dbe3ee">⌗</span><span class="lb">조건부 서식</span></div>

  <div id="fbar">
    <div id="namebox"><span id="nb">A1</span><span class="car">▾</span></div>

  </div>

  <div id="sheetwrap">
    <div id="sheet"></div>
    <div id="legend"></div>

      <div class="ph"><span class="pi">≣</span><span id="ptitle">연대기</span></div>
      <div id="plist"></div>
    </div>
  </div>

  <div id="statusbar">
    <span>준비</span><span class="sep">|</span>
    <span id="s-year">서기 1년</span><span class="sep hideS">|</span>
    <span id="s-pop" class="hideS">하늘 인구 0명</span><span class="sep hideS">|</span>
    <span id="s-fac" class="hideS">부족 0</span><span class="sep">|</span>
    <span class="ev" id="s-ev">천공이 열렸습니다.</span>
    <span class="rt" id="s-tool">도구: 개화</span>
  </div>

  <div id="tabs">
    <div class="nav"><span>⏮</span><span>◀</span><span>▶</span><span>⏭</span></div>
    <div class="tb on" data-sheet="grid">하늘판</div>
    <div class="tb" data-sheet="chron">연대기</div>
    <div class="tb" data-sheet="dead" id="tab-dead">멸망기록 (0)</div>
    <div class="plus">＋</div>
  </div>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);

// ---------- layout sizing ----------
const sheetwrap = $('sheetwrap');
let COLS, ROWS, CW, CH, N;
function computeDims(){
  const w = sheetwrap.clientWidth, h = sheetwrap.clientHeight;
  const mobile = innerWidth < 520;
  CW = mobile ? 30 : 36;
  CH = mobile ? 24 : 22;
  const RH = mobile ? 30 : 42; // row header width
  COLS = Math.max(12, Math.min(46, Math.floor((w - RH) / CW)));
  ROWS = Math.max(12, Math.min(40, Math.floor((h) / CH)));
  N = COLS * ROWS;
  return RH;
}

const sheet = $('sheet');
const fmla = $('formula');
const nb = $('nb');
const legend = $('legend');
const cellEls = [];

function colName(n){ let s=''; n++; while(n>0){const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0;} return s; }
function ref(i){ return colName(i%COLS)+(Math.floor(i/COLS)+1); }

// ---------- build sheet DOM ----------
function buildSheet(){
  const RH = computeDims();
  sheet.style.gridTemplateColumns = `${RH}px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows = CH+'px';
  cellEls.length = 0;
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd cr'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){ const hh=document.createElement('div'); hh.className='hd'; hh.textContent=colName(c); frag.appendChild(hh); }
  for(let r=0;r<ROWS;r++){
    const rh=document.createElement('div'); rh.className='hd'; rh.textContent=r+1; frag.appendChild(rh);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div'); d.className='cell'; d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d; frag.appendChild(d);
    }
  }
  sheet.innerHTML=''; sheet.appendChild(frag);
}

// ---------- sky terrain ----------
// Vertical cross-section of the sky. Row band = altitude stratum.
// strata: 0 천계(stratosphere/ether) .. high rows = thin bright ether
//         middle = open sky where islands float
//         bottom = 운해(cloud sea) then 심연(abyss) — cannot be settled
// Cell base types: ether(風), island(buildable land), cloudsea(≈ uninhabitable), abyss(void)
let cells = [];
let gz = [], GW=10, GH=7;
function noise(x,y){
  const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=gz[y0*GW+x0], b=gz[y0*GW+Math.min(GW-1,x0+1)];
  const c=gz[Math.min(GH-1,y0+1)*GW+x0], d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}
function genTerrain(){
  gz=[]; for(let i=0;i<GW*GH;i++) gz[i]=Math.random();
  cells=new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS, y=(i/COLS|0);
    const rowFrac = y/(ROWS-1);          // 0 top sky .. 1 bottom abyss
    const n = noise(x,y) + (Math.random()-.5)*.12;
    let st, hist;
    if(rowFrac > 0.86){ st='abyss'; hist=['심연']; }
    else if(rowFrac > 0.70 && n < 0.55){ st='cloudsea'; hist=['운해']; }
    else if(rowFrac < 0.12){ st='ether'; hist=['천계 기류']; }     // thin upper ether band
    else if(n > 0.60 && Math.random()<0.62){ st='island'; hist=['무인 부유석']; } // floating bare rock isle
    else { st='ether'; hist=['빈 하늘']; }
    cells[i]={st, owner:null, level:0, hist, ruinT:0, base:st};
  }
}

function nbrs(i){
  const x=i%COLS, y=i/COLS|0, out=[];
  if(x>0) out.push(i-1);
  if(x<COLS-1) out.push(i+1);
  if(y>0) out.push(i-COLS);
  if(y<ROWS-1) out.push(i+COLS);
  return out;
}
// is this cell settle-able? islands and empty sky (not cloudsea/abyss)
function buildable(c){ return c.st==='island' || c.st==='ether'; }

// ---------- factions (sky tribes) ----------
const NAMES=['새벽 부유국','뇌운 칸국','수정 첨탑령','바람갈래 연맹','잿빛 비행선단','금사슬 상회','별바다 교단','심연 망명자','구름고래 부족','여명 천궁'];
const COLORS=['#2f7fd6','#7c3aed','#0d9488','#d97706','#64748b','#ca8a04','#db2777','#475569','#0891b2','#e11d48'];
const SUFFIX=['','의 부유석','의 정착지','의 첨탑','의 천궁'];
let nameIdx=0, factions=[], obituaries=[], chron=[];
let year=1, lastEvent='천공이 열렸습니다.', pop=0;
let plague=new Map();   // 蝕 rust corrosion: idx->ticks
let storms=new Map();   // 嵐 storm: idx->ticks
const dirty=new Set();
let selected=-1;

function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function spawnFaction(announce){
  if(nameIdx>=NAMES.length) nameIdx=0;
  const f={ id: factions.length?Math.max(...factions.map(x=>x.id))+1:0,
    name:NAMES[nameIdx], color:COLORS[nameIdx%COLORS.length],
    golden:0, size:0, peak:0, arr:[] };
  nameIdx++;
  for(let t=0;t<400;t++){
    const i=Math.random()*N|0, c=cells[i];
    if(c.owner===null && c.st==='island'){   // tribes are born on bare floating isles
      setCell(i, f.id, 1, '개척');
      factions.push(f);
      if(announce){ logEvent(`${f.name}이(가) 하늘에 떠올랐습니다.`, fSPAWN(f.name, ref(i))); }
      return f;
    }
  }
  // fallback: any buildable empty
  for(let t=0;t<400;t++){
    const i=Math.random()*N|0, c=cells[i];
    if(c.owner===null && buildable(c)){ setCell(i,f.id,1,'개척'); factions.push(f);
      if(announce) logEvent(`${f.name}이(가) 하늘에 떠올랐습니다.`, fSPAWN(f.name,ref(i))); return f; }
  }
  return null;
}
function facById(id){ return factions.find(f=>f.id===id); }

function setCell(i,owner,level,histLabel){
  const c=cells[i];
  c.owner=owner; c.level=level; c.st='island'; // settled cells render as floating structures
  if(histLabel){ c.hist.push(histLabel); if(c.hist.length>8) c.hist.shift(); }
  dirty.add(i);
}

// structure glyphs by level: foundation→spire→skyhall→celestial capital
const LV_TXT=['','礎','塔','宮','天'];
const LV_LABEL=['','부유 기반','첨탑','천공 궁','천도(天都)'];

function paint(i){
  const c=cells[i], el=cellEls[i];
  let bg='', tx='', col='#222', w='', sub='';
  const y=i/COLS|0, rowFrac=y/(ROWS-1);
  if(plague.has(i)){ bg='#efe0f7'; tx='蝕'; col='#7e22ce'; w='700'; }
  else if(storms.has(i)){ bg='#cdd6e0'; tx='嵐'; col='#33415c'; w='700'; }
  else if(c.st==='abyss'){ bg='#1f2937'; tx='·'; col='#3d4757'; }
  else if(c.st==='cloudsea'){ bg='#eef3f9'; tx='≈'; col='#b6c7dc'; }
  else if(c.st==='ruin'){ bg='#e7eaee'; tx='墟'; col='#9aa0a8'; }
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      bg=hexA(f.color, .16 + c.level*.16);
      tx=LV_TXT[c.level]; col=f.color; w=c.level>=3?'700':'600';
      if(f.golden && c.level>=2) sub='✦';
    }
  } else if(c.st==='island'){ bg='#f4efe6'; tx='浮'; col='#b59b6e'; }   // unclaimed floating rock
  else { // empty ether sky — subtle altitude gradient so the world reads as a sky
    const top = rowFrac<0.5;
    const a = 0.05 + (top? (0.5-rowFrac)*0.10 : (rowFrac-0.5)*0.05);
    bg = top ? `rgba(149,193,231,${a})` : `rgba(120,150,190,${a})`;
    tx='';
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  el.textContent=tx;
  if(sub){ const s=document.createElement('span'); s.className='sub'; s.textContent=sub; el.appendChild(s); }
}

// ---------- formula rendering helpers (colored fake formulas) ----------
function fmt(parts){ // parts: array of {t:'fn'|'ar'|'st'|'',v}
  return parts.map(p=>p.t? `<span class="${p.t}">${p.v}</span>`:p.v).join('');
}
function fSPAWN(name,r){ return fmt([{t:'fn',v:'=SPAWN'},{v:'('},{t:'st',v:`"${name}"`},{v:', '},{t:'ar',v:r},{v:')'}]); }
function fWAR(a,b,r){ return fmt([{t:'fn',v:'=SIEGE'},{v:'('},{t:'st',v:`"${a}"`},{v:'→'},{t:'st',v:`"${b}"`},{v:', '},{t:'ar',v:r},{v:')'}]); }
function fGROW(name,r,lbl){ return fmt([{t:'fn',v:'=ASCEND'},{v:'('},{t:'st',v:`"${name}"`},{v:', '},{t:'ar',v:r},{v:', '},{t:'st',v:`"${lbl}"`},{v:')'}]); }
function fSTORM(r){ return fmt([{t:'fn',v:'=STORM'},{v:'('},{t:'ar',v:r},{v:', '},{t:'st',v:'"嵐"'},{v:')'}]); }
function fPLAGUE(r){ return fmt([{t:'fn',v:'=RUST'},{v:'('},{t:'ar',v:r},{v:', '},{t:'st',v:'"부식"'},{v:')'}]); }
function fGOLD(name){ return fmt([{t:'fn',v:'=GOLDEN.AGE'},{v:'('},{t:'st',v:`"${name}"`},{v:', '},{t:'ar',v:'120'},{v:')'}]); }
function fCOLLAPSE(name){ return fmt([{t:'fn',v:'=COLLAPSE'},{v:'('},{t:'st',v:`"${name}"`},{v:', '},{t:'ar',v:String(year)},{v:')'}]); }
function fBLOOM(r){ return fmt([{t:'fn',v:'=BLOOM'},{v:'('},{t:'ar',v:r},{v:', '},{t:'st',v:'"개화"'},{v:')'}]); }
function fHISTORY(arr){ return fmt([{t:'fn',v:'=HISTORY'},{v:'('}].concat(
  arr.flatMap((h,k)=> k? [{v:' → '},{t:'st',v:`"${h}"`}] : [{t:'st',v:`"${h}"`}])
).concat([{v:')'}])); }
function fMIGRATE(name){ return fmt([{t:'fn',v:'=MIGRATE'},{v:'('},{t:'st',v:`"${name}"`},{v:', '},{t:'st',v:'"구름 너머"'},{v:')'}]); }

function logEvent(msg, formulaHTML, dead){
  lastEvent = `서기 ${year}년 · ${msg}`;
  if(formulaHTML){ fmla.innerHTML=formulaHTML; }
  chron.push({year, msg, html:formulaHTML||'', dead:!!dead});
  if(chron.length>400) chron.shift();
  if(currentSheet==='chron'||currentSheet==='dead') renderPanel();
}

function flashCls(i,cls,ms){ const el=cellEls[i]; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls),ms); }

// ---------- simulation tick ----------
let tickN=0, warCd=0;
const PW=[0,30,140,560,1800];
function tick(){
  tickN++; year++;
  if(warCd>0) warCd--;

  for(const f of factions){ f.arr.length=0; f.size=0; }
  pop=0;
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin' && --c.ruinT<=0){ c.st = (c.base==='island')?'island':'ether'; if(c.st==='island'){c.hist.push('재부상');} dirty.add(i); }
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){ f.arr.push(i); f.size++; pop+=PW[c.level]; }
      else { c.owner=null; c.level=0; dirty.add(i); }
    }
  }
  for(const f of factions){ if(f.size>f.peak) f.peak=f.size; }

  // collapse
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      obituaries.push({name:f.name, year, peak:f.peak, color:f.color});
      logEvent(`${f.name}이(가) 구름 아래로 추락했습니다.`, fCOLLAPSE(f.name), true);
      factions.splice(k,1);
      $('tab-dead').textContent=`멸망기록 (${obituaries.length})`;
    }
  }

  // storms (嵐) — spread & destroy
  for(const [i,t] of [...storms]){
    if(Math.random()<.13){
      for(const n of nbrs(i)){
        const c=cells[n];
        if(c.owner!==null && !storms.has(n) && c.st==='island'){ storms.set(n,5); dirty.add(n); }
      }
    }
    if(t<=1){
      storms.delete(i);
      const c=cells[i];
      c.owner=null; c.level=0; c.st='ruin'; c.ruinT=180;
      c.hist.push('폭풍에 부서짐'); if(c.hist.length>8)c.hist.shift();
      dirty.add(i);
    } else storms.set(i,t-1);
  }

  // rust plague (蝕)
  if(plague.size){
    for(const [i,t] of [...plague]){
      if(Math.random()<.16){
        for(const n of nbrs(i)){
          if(cells[n].owner!==null && !plague.has(n)){ plague.set(n,11); dirty.add(n); }
        }
      }
      if(Math.random()<.22){
        const c=cells[i]; c.level--;
        if(c.level<=0){ c.owner=null; c.level=0; c.hist.push('부식으로 소멸'); if(c.hist.length>8)c.hist.shift(); }
        dirty.add(i);
      }
      if(t<=1){ plague.delete(i); dirty.add(i); } else plague.set(i,t-1);
    }
    if(plague.size===0) logEvent('녹빛 부식이 물러갔습니다.', fmt([{t:'fn',v:'=RUST.END'},{v:'()'}]));
  }

  // faction behaviour
  for(const f of factions){
    if(f.golden>0) f.golden--;
    if(f.size===0) continue;

    const attempts = 1 + (f.size*.07|0);
    for(let a=0;a<attempts;a++){
      const src=f.arr[Math.random()*f.arr.length|0];
      if(src===undefined || cells[src].owner!==f.id) continue;
      const nbA=nbrs(src);
      const tgt=nbA[Math.random()*nbA.length|0];
      const tc=cells[tgt];
      if(tc.st==='cloudsea'||tc.st==='abyss'||storms.has(tgt)) continue; // can't bridge cloud sea / void directly
      if(tc.owner===null){
        if(tc.st==='island') setCell(tgt,f.id,1,'개척');
        else if(tc.st==='ether'){ if(Math.random()<.34) setCell(tgt,f.id,1,'부유 기반 건설'); } // build new floating platform in open sky
      } else if(tc.owner!==f.id && Math.random()<.3){
        // siege
        const att=1+Math.random()*3 + f.size*.002 + (f.golden?1:0);
        const def=tc.level+1+Math.random()*3;
        flashCls(tgt,'war',900);
        if(att>def){
          const defF=facById(tc.owner);
          if(Math.random()<.3){
            storms.set(tgt,5); tc.hist.push('전화(戰火)'); if(tc.hist.length>8)tc.hist.shift(); dirty.add(tgt);
          } else setCell(tgt,f.id,Math.max(1,tc.level-1),'함락');
          if((tc.level>=3||warCd===0) && defF){
            logEvent(`${f.name}이(가) ${defF.name}의 ${LV_LABEL[Math.max(1,tc.level)]||'영토'}를 공성했습니다.`, fWAR(f.name,defF.name,ref(tgt)));
            warCd=42;
          }
        }
      }
    }

    // ascend (develop)
    const ups=1 + (f.size*.05|0);
    for(let u=0;u<ups;u++){
      const i=f.arr[Math.random()*f.arr.length|0];
      if(i===undefined || cells[i].owner!==f.id) continue;
      const c=cells[i];
      if(c.level<4 && Math.random()<.06*(f.golden?3:1)){
        c.level++;
        c.hist.push(LV_LABEL[c.level]); if(c.hist.length>8)c.hist.shift();
        dirty.add(i);
        if(c.level===4 && warCd===0){
          logEvent(`${f.name}이(가) ${ref(i)}에 천도(天都)를 세웠습니다.`, fGROW(f.name,ref(i),'천도'));
          warCd=28;
        }
      }
    }
  }

  // random events
  const r=Math.random();
  if(!plague.size && r<.004){
    const big=[]; for(let i=0;i<N;i++) if(cells[i].owner!==null && cells[i].level>=3) big.push(i);
    if(big.length){ const i=big[Math.random()*big.length|0]; plague.set(i,11); dirty.add(i);
      logEvent(`${ref(i)}에서 녹빛 부식이 번지기 시작했습니다.`, fPLAGUE(ref(i))); }
  } else if(r>.996 && factions.length){
    const f=factions[Math.random()*factions.length|0]; f.golden=120;
    logEvent(`${f.name}의 황금기가 도래했습니다.`, fGOLD(f.name));
  } else if(r>.9935 && r<=.996){
    const t=[]; for(let i=0;i<N;i++) if(cells[i].owner!==null && cells[i].level>=2) t.push(i);
    if(t.length){ const i=t[Math.random()*t.length|0]; storms.set(i,6); dirty.add(i);
      logEvent(`${ref(i)}에 거대 폭풍이 몰아쳤습니다.`, fSTORM(ref(i))); }
  }
  if(factions.length<3 && Math.random()<.012 && factions.length<6){
    const f=spawnFaction(false);
    if(f) logEvent(`구름 너머에서 ${f.name}이(가) 도래했습니다.`, fMIGRATE(f.name));
  }

  for(const i of dirty) paint(i);
  dirty.clear();
  renderStatus();
  if(tickN%9===0) renderLegend();
}

function renderStatus(){
  $('s-year').textContent=`서기 ${year}년`;
  $('s-pop').textContent=`하늘 인구 ${pop.toLocaleString()}명`;
  $('s-fac').textContent=`부족 ${factions.length}`;
  $('s-ev').textContent=lastEvent;
  $('s-tool').textContent=`도구: ${TOOL_LABEL[tool]}`;
}
function renderLegend(){
  document.title=`天空.xlsx - Excel (서기 ${year}년)`;
  const sorted=[...factions].sort((a,b)=>b.size-a.size);
  const maxS=Math.max(1,...factions.map(f=>f.size));
  let h='<h4>천상 세력 현황</h4>';
  if(!sorted.length) h+='<div class="dead">하늘이 비어 있습니다…</div>';
  for(const f of sorted){
    const trend = f.size>=f.peak? '▲' : (f.size < f.peak*0.6? '▼':'·');
    h+=`<div class="fr"><span class="sw" style="background:${f.color}"></span>`+
       `<span class="nm">${f.name}${f.golden?' <span class="glx">✦</span>':''}</span>`+
       `<span class="tr">${f.size}칸 ${trend}</span></div>`+
       `<div class="bar" style="width:${Math.max(6,f.size/maxS*100)}%;background:${f.color}"></div>`;
  }
  if(obituaries.length){
    h+='<h4 style="margin-top:7px">멸망기록</h4>';
    for(const o of obituaries.slice(-3)) h+=`<div class="dead">† ${o.name} (서기 ${o.year}년)</div>`;
  }
  h+='<div class="hint">셀 클릭 → 그 땅의 역사. 리본의 도구를 켜고 셀 클릭 → 개입.</div>';
  legend.innerHTML=h;
}

// ---------- log panel (연대기 / 멸망기록) ----------
let currentSheet='grid';
function renderPanel(){
  const list=$('plist');
  if(currentSheet==='chron'){
    $('ptitle').textContent='연대기 — 천공의 역사';
    let h='<div class="lg lhd"><div class="yr">연도</div><div class="fm">수식</div><div>사건</div></div>';
    const rows=chron.slice(-160).reverse();
    if(!rows.length) h+='<div class="empty">아직 기록된 역사가 없습니다.</div>';
    for(const e of rows){
      h+=`<div class="lg${e.dead?' dead':''}"><div class="yr">${e.year}</div>`+
         `<div class="fm">${stripFm(e.html)}</div><div>${e.msg}</div></div>`;
    }
    list.innerHTML=h;
  } else if(currentSheet==='dead'){
    $('ptitle').textContent='멸망기록 — 추락한 부족들';
    let h='<div class="lg lhd"><div class="yr">멸망</div><div class="fm">최전성기</div><div>부족</div></div>';
    if(!obituaries.length) h+='<div class="empty">아직 추락한 부족이 없습니다. 하늘은 평화롭습니다.</div>';
    for(const o of [...obituaries].reverse()){
      h+=`<div class="lg dead"><div class="yr">서기 ${o.year}년</div>`+
         `<div class="fm">${o.peak}칸</div><div><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${o.color};margin-right:6px;vertical-align:-1px"></span>† ${o.name}</div></div>`;
    }
    list.innerHTML=h;
  }
}
function stripFm(html){ return html; } // formulas already safe HTML

function switchSheet(s){
  currentSheet=s;
  document.querySelectorAll('#tabs .tb').forEach(t=>t.classList.toggle('on', t.dataset.sheet===s));
  const panel=$('panel');
  if(s==='grid'){ panel.classList.remove('show'); legend.style.display=''; }
  else { panel.classList.add('show'); legend.style.display='none'; renderPanel(); }
}
document.querySelectorAll('#tabs .tb').forEach(t=>{
  t.addEventListener('click',()=>switchSheet(t.dataset.sheet));
});

// ---------- intervention tools ----------
let tool='inspect'; // inspect | bloom | storm | newcity
const TOOL_LABEL={inspect:'관찰', bloom:'개화 씨앗', storm:'폭풍', newcity:'새 부족'};
function setTool(t){
  tool = (tool===t)? 'inspect' : t;
  document.querySelectorAll('#ribbon .rbtn.live').forEach(b=>b.style.background='');
  if(tool!=='inspect'){
    const map={bloom:'b-bloom',storm:'b-storm',newcity:'b-newcity'};
    const el=$(map[tool]); if(el) el.style.background='#d7ebdb';
  }
  renderStatus();
}
$('b-bloom').addEventListener('click',()=>setTool('bloom'));
$('b-storm').addEventListener('click',()=>setTool('storm'));
$('b-newcity').addEventListener('click',()=>{
  // immediate: spawn near center-ish
  const f=spawnFaction(true);
  if(!f) logEvent('새 부족이 깃들 부유석을 찾지 못했습니다.', fmt([{t:'fn',v:'=SPAWN'},{v:'('},{t:'st',v:'"실패"'},{v:')'}]));
  renderLegend();
});

// speed & pause
let speed=1, paused=false, timer=null;
const SPEEDS=[1,2,4]; let spIdx=0;
function restartTimer(){
  if(timer) clearInterval(timer);
  if(!paused) timer=setInterval(tick, 110/speed);
}
$('b-pause').addEventListener('click',()=>{
  paused=!paused;
  $('b-pause').querySelector('.gly').textContent = paused?'▶':'⏸';
  $('b-pause').querySelector('.lb').textContent = paused?'재생':'일시정지';
  restartTimer();
});
$('b-speed').addEventListener('click',()=>{
  spIdx=(spIdx+1)%SPEEDS.length; speed=SPEEDS[spIdx];
  $('b-speed').querySelector('.lb').textContent='×'+speed;
  restartTimer();
});

// ---------- cell click ----------
sheet.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  const i=+t.dataset.i; const c=cells[i];
  // selection always
  if(selected>=0 && cellEls[selected]) cellEls[selected].classList.remove('sel');
  selected=i; t.classList.add('sel'); nb.textContent=ref(i);

  if(tool==='bloom'){
    if(buildable(c) || c.owner!==null){
      // seed growth: claim/boost the nearest faction's reach, or upgrade if owned
      if(c.owner!==null){ if(c.level<4){ c.level++; c.hist.push('개화 ('+LV_LABEL[c.level]+')'); } }
      else {
        // find a neighbour owner to extend, else create fertile bare isle
        const own=nbrs(i).map(n=>cells[n].owner).find(o=>o!==null);
        if(own!==undefined && own!==null){ setCell(i,own,1,'개화 정착'); }
        else { c.st='island'; c.hist.push('개화한 부유석'); }
      }
      flashCls(i,'bloom',700); dirty.add(i); paint(i);
      logEvent(`${ref(i)}에 개화의 씨앗을 뿌렸습니다.`, fBLOOM(ref(i)));
      renderLegend();
    }
  } else if(tool==='storm'){
    if(c.st!=='abyss' && c.st!=='cloudsea'){
      storms.set(i,6); dirty.add(i); paint(i); flashCls(i,'war',600);
      logEvent(`${ref(i)}에 폭풍을 소환했습니다.`, fSTORM(ref(i)));
    }
  } else {
    // inspect: show land history
    fmla.innerHTML=fHISTORY(c.hist);
  }
});

// ---------- boot ----------
function boot(){
  buildSheet();
  genTerrain();
  for(let i=0;i<N;i++) paint(i);
  fmla.innerHTML=fmt([{t:'fn',v:'=SIM.SKYREALM'},{v:'($A$1:$'+colName(COLS-1)+'$'+ROWS+', '},{t:'st',v:'"하늘은 무너지지 않는다"'},{v:')'}]);
  factions=[]; obituaries=[]; chron=[]; nameIdx=0; year=1; pop=0; plague.clear(); storms.clear();
  $('tab-dead').textContent='멸망기록 (0)';
  spawnFaction(true); spawnFaction(true); spawnFaction(true);
  renderLegend(); renderStatus();
}
boot();
restartTimer();

// responsive rebuild on resize (debounced) — preserves running sim by regenerating world
let rzT=null;
addEventListener('resize', ()=>{
  clearTimeout(rzT);
  rzT=setTimeout(()=>{
    const oldC=COLS, oldR=ROWS;
    computeDims();
    if(COLS!==oldC || ROWS!==oldR){ boot(); }
  },220);
});
})();
</script>
