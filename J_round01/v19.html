<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>태엽도시.xlsx - Excel</title>
<style>
  :root{
    --green:#107c41; --greenL:#21a366; --line:#e3e1de; --hline:#d0cdc9;
    --hd:#f6f5f4; --brass:#b08d57;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#dfdedc;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}

  /* ---------- title bar ---------- */
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #e0ddda}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar .tt{margin-left:8px;color:#444;display:flex;align-items:center;gap:7px}
  #springicon{font-size:13px;display:inline-block;transform-origin:50% 50%}
  #qa{margin-left:auto;display:flex;gap:13px;color:#9a9794;font-size:12px}

  /* ---------- ribbon ---------- */
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #edebe9;font-size:12.5px;color:#444}
  #menubar b{color:var(--green);border-bottom:2.5px solid var(--green);padding:4px 3px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 3px;cursor:default}
  #menubar i:hover{background:#f2f1f0;border-radius:3px}

  #ribbon{height:74px;background:#fbfbfa;border-bottom:1px solid #e6e4e2;
    display:flex;align-items:stretch;padding:5px 4px 0;gap:0;overflow:hidden}
  .rgrp{display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:3px 11px 3px;border-right:1px solid #ececea;min-width:64px;height:62px}
  .rgrp .rg-body{display:flex;gap:4px;align-items:center;flex:1}
  .rgrp .rg-lab{font-size:10.5px;color:#888;margin-top:2px}
  .rbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;border:1px solid transparent;border-radius:4px;padding:3px 7px;cursor:pointer;
    color:#3a3a3a;min-width:46px}
  .rbtn:hover{background:#eef5f0;border-color:#cfe6da}
  .rbtn:active{background:#d8ecdf}
  .rbtn .ic{font-size:17px;line-height:1}
  .rbtn .lb{font-size:10.5px}
  .rbtn.hot .ic{color:var(--green)}
  .rbtn.armed{background:#fff3cf;border-color:#e6c860}

  /* mainspring tension gauge in ribbon */
  #gauge-wrap{display:flex;flex-direction:column;justify-content:center;gap:3px;width:150px}
  #gauge{height:13px;border:1px solid #c9b27d;border-radius:7px;overflow:hidden;background:#f0ece2;position:relative}
  #gauge-fill{height:100%;width:60%;background:linear-gradient(90deg,#d4a256,#e8c98a);transition:width .25s,background .4s}
  #gauge-fill.low{background:linear-gradient(90deg,#c0392b,#e07b6c)}
  #gauge-txt{font-size:10px;color:#7a6a3f;display:flex;justify-content:space-between}
  #gauge-txt b{color:#92702f;font-weight:600}

  /* ---------- formula bar ---------- */
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4}
  #namebox{width:74px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;font-size:11.5px}
  #fxwrap{width:46px;display:flex;align-items:center;justify-content:center;gap:6px;
    border-right:1px solid #e7e7e7;color:#9a9a9a}
  #fx{font-style:italic;font-family:Georgia,serif;font-size:13px}
  #formula{flex:1;padding:0 9px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- sheet ---------- */
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1}
  #sheet{display:grid;background:#fff}
  .hd{background:var(--hd);border-right:1px solid var(--hline);border-bottom:1px solid var(--hline);
    display:flex;align-items:center;justify-content:center;color:#5a5a5a;font-size:11px}
  .hd.cn{font-weight:600}
  .cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:13px;
    overflow:hidden;cursor:cell;position:relative;line-height:1;transition:background .18s}
  .cell.sel{outline:2px solid var(--green);outline-offset:-2px;z-index:3}
  .gear{display:inline-block;transform-origin:50% 50%}

  @keyframes jamf{0%,100%{background:#ffb46b}50%{background:#ffe0bf}}
  .jamflash{animation:jamf .3s 3}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,124,65,.5)}100%{box-shadow:0 0 0 7px rgba(16,124,65,0)}}
  .pulse{animation:pulse .55s 1}

  /* legend / HUD card */
  #legend{position:absolute;top:9px;right:13px;background:#fffdf3;border:1px solid #ddca8c;
    box-shadow:2px 4px 12px rgba(0,0,0,.16);padding:9px 13px;font-size:11px;z-index:6;
    min-width:194px;line-height:1.72;border-radius:3px}
  #legend h4{margin:0 0 4px;font-size:11px;color:#7a6a1f;letter-spacing:.3px}
  #legend .sw{display:inline-block;width:9px;height:9px;margin-right:6px;border-radius:2px;vertical-align:middle}
  #legend .row{display:flex;justify-content:space-between;gap:8px}
  #legend .dead{color:#9a9a9a;font-size:10.5px}
  #legend .crown{color:#b8860b}
  #legend .hint{margin-top:6px;font-size:10px;color:#b0a06a;border-top:1px dashed #e3d59c;padding-top:5px}

  /* chronicle / obituary sheets overlay */
  #docpanel{position:absolute;inset:0;background:#fff;z-index:8;display:none;overflow:auto;padding:24px 30px}
  #docpanel h2{font-size:16px;color:var(--green);margin:0 0 4px;font-weight:700}
  #docpanel .sub{color:#888;font-size:11.5px;margin-bottom:14px}
  #docpanel table{border-collapse:collapse;width:100%;max-width:880px;font-size:12px}
  #docpanel th{background:var(--hd);border:1px solid var(--hline);padding:5px 9px;text-align:left;color:#555;position:sticky;top:0}
  #docpanel td{border:1px solid var(--line);padding:5px 9px;vertical-align:top}
  #docpanel td.fx{font-family:Consolas,monospace;font-size:11px;color:#107c41}
  #docpanel tr:nth-child(even) td{background:#fbfbfa}
  #docpanel .yr{color:#a07b2f;font-variant-numeric:tabular-nums;white-space:nowrap}
  #docpanel .ob{color:#a33}

  /* status bar */
  #statusbar{height:24px;background:var(--green);color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;white-space:nowrap;overflow:hidden}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .ev{flex:1;overflow:hidden;text-overflow:ellipsis}
  #tick{font-variant-numeric:tabular-nums;opacity:.85}

  /* tabs */
  #tabs{height:26px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:24px;
    border-top:1px solid #d4d4d4;font-size:11.5px;gap:1px}
  #tabs .tab{padding:3px 14px;border:1px solid #d4d4d4;border-bottom:none;
    background:#e8e8e8;color:#555;cursor:pointer;border-radius:3px 3px 0 0}
  #tabs .tab.on{background:#fff;color:var(--green);font-weight:600;border-top:2px solid var(--green)}
  #tabs .add{padding:3px 9px;color:#9a9a9a;cursor:default}

  @media (max-width:560px){
    #ribbon{height:62px}
    .rgrp{min-width:54px;padding:3px 6px}
    #gauge-wrap{width:110px}
    #qa{display:none}
    #legend{min-width:150px;font-size:10px;padding:7px 9px;top:6px;right:7px}
    .rgrp.opt{display:none}
  }
</style>
</head>
<body>
<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <div class="tt"><span id="springicon">⚙</span><span id="ttl">태엽도시.xlsx - Excel</span></div>
  <div id="qa"><span>자동 저장 ●</span><span>공유</span><span>○ 댓글</span></div>
</div>

<div id="menubar">
  <i>파일</i><b>홈</b><i>삽입</i><i>그리기</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>태엽</i>
</div>

<div id="ribbon">
  <div class="rgrp">
    <div class="rg-body">
      <div class="rbtn hot" id="btn-wind" title="대태엽을 감아 세계에 동력을 공급합니다">
        <span class="ic" style="font-size:19px">⟳</span><span class="lb">태엽 감기</span>
      </div>
    </div>
    <div class="rg-lab">동력</div>
  </div>

  <div class="rgrp">
    <div class="rg-body" id="gauge-wrap">
      <div id="gauge"><div id="gauge-fill"></div></div>
      <div id="gauge-txt"><span>대태엽 장력</span><b id="gauge-pct">60%</b></div>
    </div>
    <div class="rg-lab">메인스프링</div>
  </div>

  <div class="rgrp opt">
    <div class="rg-body">
      <div class="rbtn" id="btn-found" title="빈 황동판에 새 길드 공방을 설립합니다">
        <span class="ic" style="font-size:18px">＋</span><span class="lb">공방 설립</span>
      </div>
      <div class="rbtn" id="btn-jam" title="셀을 골라 고장(故)을 일으킵니다">
        <span class="ic" style="font-size:18px;color:#c0392b">⚡</span><span class="lb">고장 유발</span>
      </div>
    </div>
    <div class="rg-lab">개입</div>
  </div>

  <div class="rgrp opt">
    <div class="rg-body">
      <div class="rbtn" id="btn-pace" title="시간 흐름 속도">
        <span class="ic" id="pace-ic" style="font-size:15px">▶</span><span class="lb" id="pace-lb">표준 속도</span>
      </div>
    </div>
    <div class="rg-lab">시계태엽</div>
  </div>
</div>

<div id="fbar">
  <div id="namebox">A1</div>
  <div id="fxwrap"><span id="fx">fx</span></div>
  <div id="formula"></div>
</div>

<div id="sheetwrap">
  <div id="sheet"></div>
  <div id="legend"></div>
  <div id="docpanel"></div>
</div>

<div id="statusbar">
  <span id="tick">똑</span>
  <span class="sep">|</span><span>서기 <b id="st-year">1</b>태엽기</span>
  <span class="sep">|</span><span>가동 부품 <b id="st-pop">0</b></span>
  <span class="sep">|</span><span>길드 <b id="st-fac">0</b></span>
  <span class="sep">|</span><span class="ev" id="status-ev">대태엽이 처음으로 감겼습니다.</span>
</div>

<div id="tabs">
  <div class="tab on" data-doc="sheet">기관도(機關圖)</div>
  <div class="tab" data-doc="chron">연대기</div>
  <div class="tab" data-doc="dead" id="tab-dead">정지기록 (0)</div>
  <div class="add">＋</div>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const sheetEl = $('sheet'), fmla = $('formula'), namebox = $('namebox');

/* ---------- grid sizing (responsive) ---------- */
const isMobile = innerWidth < 560;
const CW = isMobile ? 26 : 34, CH = isMobile ? 22 : 22;
const chrome = isMobile ? 250 : 258; // px above sheet (title+menu+ribbon+fbar+status+tabs)
const COLS = Math.max(14, Math.min(42, Math.floor((innerWidth - 50) / CW)));
const ROWS = Math.max(12, Math.min(30, Math.floor((innerHeight - chrome) / CH)));
const N = COLS * ROWS;

sheetEl.style.gridTemplateColumns = `48px repeat(${COLS}, ${CW}px)`;
sheetEl.style.gridAutoRows = CH + 'px';

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(((i/COLS)|0)+1);}

/* ---------- build DOM ---------- */
const cellEls = new Array(N);
{
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd'; corner.textContent='◳'; corner.style.color='#bbb'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd cn';h.textContent=colName(c);frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd';h.textContent=r+1;frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';const idx=r*COLS+c;d.dataset.i=idx;
      cellEls[idx]=d;frag.appendChild(d);
    }
  }
  sheetEl.appendChild(frag);
}

/* ---------- terrain (value-noise) ---------- */
const GW=9,GH=6,gz=[];
for(let i=0;i<GW*GH;i++)gz[i]=Math.random();
function noise(x,y){
  const fx=x/COLS*(GW-1),fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=gz[y0*GW+x0],b=gz[y0*GW+Math.min(GW-1,x0+1)];
  const c=gz[Math.min(GH-1,y0+1)*GW+x0],d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}

/* cell.st: oil(기름 못) | cog(자생 톱니숲) | plate(빈 황동판) | rust(녹슨 잔해) | owned */
const cells=new Array(N);
for(let i=0;i<N;i++){
  const x=i%COLS,y=(i/COLS)|0;
  const v=noise(x,y)+(Math.random()-.5)*.14;
  let st='plate',hist=['빈 황동판'];
  if(v<.30){st='oil';hist=['기름 저수지'];}
  else if(v>.63 && Math.random()<.7){st='cog';hist=['자생 톱니숲'];}
  cells[i]={st,owner:null,level:0,hist,rustT:0};
}

function nbrs(i){
  const x=i%COLS,y=(i/COLS)|0,out=[];
  if(x>0)out.push(i-1); if(x<COLS-1)out.push(i+1);
  if(y>0)out.push(i-COLS); if(y<ROWS-1)out.push(i+COLS);
  return out;
}

/* ---------- guilds ---------- */
const NAMES=['황동 길드','진자 교단','발조 상회','톱니 부족','수은 왕조','자정(子正) 결사','용수철 연맹','시계탑 공국','금분 공방','심야 칸국'];
const COLORS=['#b08d57','#2563eb','#059669','#7c3aed','#0d9488','#475569','#dc2626','#be7100','#9333ea','#b45309'];
let nameIdx=0, factions=[];
const obituaries=[];          // {name, year}
const chronicle=[];           // {year, msg, fx}
let year=1, pop=0, selected=-1;
let mainspring=60;            // 0..100 global tension
const jams=new Map();         // idx -> ticks left (고장)
const rusts=new Map();        // idx -> ticks left (녹/銹)
const dirty=new Set();

function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}

function pushHist(c,label){c.hist.push(label);if(c.hist.length>7)c.hist.shift();}

function spawnFaction(announce, originLabel){
  if(nameIdx>=NAMES.length)nameIdx=0;
  const f={id:factions.length?Math.max(...factions.map(x=>x.id))+1:0,
    name:NAMES[nameIdx],color:COLORS[nameIdx%COLORS.length],golden:0,size:0,arr:[]};
  nameIdx++;
  for(let t=0;t<400;t++){
    const i=Math.random()*N|0;
    if(cells[i].st==='plate' && cells[i].owner===null){
      setCell(i,f.id,1,'공방 설립');
      factions.push(f);
      if(announce) logEvent(`${f.name}이(가) 첫 톱니를 맞물렸습니다.`, `=MESH("${f.name}", ${ref(i)})`);
      else if(originLabel) logEvent(`${originLabel} ${f.name}이(가) 톱니를 들여왔습니다.`, `=IMPORT("${f.name}")`);
      cellEls[i].classList.add('pulse'); setTimeout(()=>cellEls[i].classList.remove('pulse'),600);
      return f;
    }
  }
  return null;
}
function facById(id){return factions.find(f=>f.id===id);}

function setCell(i,owner,level,label){
  const c=cells[i];
  c.owner=owner; c.level=level; c.st='owned';
  if(label) pushHist(c,label);
  dirty.add(i);
}

/* level: 1 cog(齒) 2 spring(簧) 3 works(廠) 4 clocktower(塔) */
const LV_TXT=['','⚙','簧','廠','塔'];
const LV_LABEL=['','맞물린 톱니','용수철 가옥','태엽 공장','시계탑'];
const LV_SPEED=[0,3,6,10,18];      // rotation speed (s per turn) — bigger level spins faster look

function paint(i){
  const c=cells[i],el=cellEls[i];
  let bg='',html='',col='#222',w='';
  if(rusts.has(i)){bg='#e7ddd0';html='銹';col='#8a6a3a';w='700';}
  else if(jams.has(i)){bg='#ffd9b3';html='故';col='#c0392b';w='700';}
  else if(c.st==='oil'){bg='#e7f0f7';html='油';col='#7fa8cf';}
  else if(c.st==='cog'){bg='#eef0e6';html='<span class="gear" style="animation:spin 7s linear infinite">齒</span>';col='#7d8a4f';}
  else if(c.st==='rust'){bg='#ededec';html='墟';col='#a8a8a8';}
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      bg=hexA(f.color,.12+c.level*.16);
      const sp=LV_SPEED[c.level]||10;
      // spin speed also scales with mainspring tension (slow world = slow gears)
      const eff=sp*(0.5+mainspring/100);
      html=`<span class="gear" style="animation:spin ${(60/Math.max(2,eff)).toFixed(1)}s linear infinite">${LV_TXT[c.level]}</span>`;
      col=f.color; w=c.level>=3?'700':'';
    }
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  el.innerHTML=html;
}

function logEvent(msg,fx){
  const ev=`서기 ${year}태엽기: ${msg}`;
  $('status-ev').textContent=ev;
  if(fx) fmla.textContent=fx;
  chronicle.push({year,msg,fx:fx||''});
  if(chronicle.length>500) chronicle.shift();
}

function flashJam(i){const el=cellEls[i];el.classList.add('jamflash');setTimeout(()=>el.classList.remove('jamflash'),920);}

/* ---------- spin keyframes (injected) ---------- */
const kf=document.createElement('style');
kf.textContent='@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}';
document.head.appendChild(kf);

/* ---------- gauge ---------- */
function renderGauge(){
  const fill=$('gauge-fill');
  fill.style.width=mainspring+'%';
  fill.classList.toggle('low',mainspring<28);
  $('gauge-pct').textContent=Math.round(mainspring)+'%';
}

/* ---------- the tick ---------- */
let tickN=0, warCooldown=0;
const PACES=[{lb:'느린 박자',ic:'❙❙',ms:240},{lb:'표준 속도',ic:'▶',ms:120},{lb:'급태엽',ic:'▶▶',ms:55}];
let paceIdx=1;

function tick(){
  tickN++; year++;
  if(warCooldown>0) warCooldown--;

  /* mainspring unwinds; faster when world is busy. golden ages bleed extra. */
  mainspring -= 0.45 + factions.length*0.06;
  if(mainspring<0) mainspring=0;
  const slow = mainspring<22;   // low tension => decay, sluggish

  /* recount ownership */
  for(const f of factions){f.arr.length=0;f.size=0;}
  pop=0;
  const PW=[0,1,4,11,28];
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='rust' && --c.rustT<=0){c.st='plate';pushHist(c,'잔해 수거됨');dirty.add(i);}
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){f.arr.push(i);f.size++;pop+=PW[c.level];}
      else{c.owner=null;c.level=0;c.st='plate';dirty.add(i);}
    }
  }

  /* collapse */
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      obituaries.push({name:f.name,year});
      logEvent(`${f.name}의 마지막 태엽이 멈췄습니다.`, `=HALT("${f.name}", ${year})`);
      factions.splice(k,1);
    }
  }

  /* jams (故) — spreads like fire, ends in rusted ruin */
  for(const [i,t] of [...jams]){
    if(Math.random()<.13){
      for(const n of nbrs(i)){
        const c=cells[n];
        if(c.owner!==null && !jams.has(n) && c.st==='owned'){jams.set(n,5);dirty.add(n);}
      }
    }
    if(t<=1){
      jams.delete(i);
      const c=cells[i];
      c.owner=null;c.level=0;c.st='rust';c.rustT=160;
      pushHist(c,'고장으로 정지');dirty.add(i);
    } else jams.set(i,t-1);
  }

  /* rust/corrosion (銹) — the "plague": demotes & spreads, thrives on low tension */
  if(rusts.size){
    for(const [i,t] of [...rusts]){
      const spread = .14 + (slow?.10:0);
      if(Math.random()<spread){
        for(const n of nbrs(i)){
          if(cells[n].owner!==null && !rusts.has(n)){rusts.set(n,11);dirty.add(n);}
        }
      }
      if(Math.random()<.22){
        const c=cells[i];c.level--;
        if(c.level<=0){c.owner=null;c.level=0;c.st='plate';pushHist(c,'녹슬어 멈춤');}
        dirty.add(i);
      }
      if(t<=1){rusts.delete(i);dirty.add(i);} else rusts.set(i,t-1);
    }
    if(rusts.size===0) logEvent('녹이 닦여 나갔습니다.', '=DERUST()');
  }

  /* guild behavior */
  for(const f of factions){
    if(f.golden>0)f.golden--;
    if(f.size===0)continue;
    const tensionFactor = 0.35 + mainspring/100;  // everything slower when unwound

    /* expand (mesh new gears) */
    const attempts = Math.max(1, Math.round((1 + f.size*.07) * tensionFactor));
    for(let a=0;a<attempts;a++){
      const src=f.arr[Math.random()*f.arr.length|0];
      if(src===undefined||cells[src].owner!==f.id)continue;
      const nb=nbrs(src), tgt=nb[Math.random()*nb.length|0];
      const tc=cells[tgt];
      if(tc.st==='oil'||jams.has(tgt))continue;
      if(tc.owner===null){
        if(tc.st==='cog'){ if(Math.random()<.28){tc.st='plate';pushHist(tc,'톱니숲 개간');setCell(tgt,f.id,1,'맞물린 톱니');} }
        else if(tc.st==='plate') setCell(tgt,f.id,1,'맞물린 톱니');
      } else if(tc.owner!==f.id && Math.random()<.3){
        /* mesh-clash (war): grinding gears */
        const att=1+Math.random()*3+f.size*.002+(f.golden?1:0);
        const def=tc.level+1+Math.random()*3;
        flashJam(tgt);
        if(att>def){
          const defF=facById(tc.owner);
          if(Math.random()<.3){
            jams.set(tgt,5);pushHist(tc,'맞물림 파손(故)');dirty.add(tgt);
          } else {
            setCell(tgt,f.id,Math.max(1,tc.level-1),'강제 재배치');
          }
          if((tc.level>=3||warCooldown===0)&&defF){
            logEvent(`${f.name}이(가) ${defF.name}의 ${LV_LABEL[Math.max(1,tc.level)]||'영역'}을 갈아 멈췄습니다.`,
              `=CLASH("${f.name}"→"${defF.name}", ${ref(tgt)})`);
            warCooldown=38;
          }
        }
      }
    }

    /* develop (wind up to higher tier) — needs tension */
    const ups=Math.max(1,Math.round((1+f.size*.05)*tensionFactor));
    for(let u=0;u<ups;u++){
      const i=f.arr[Math.random()*f.arr.length|0];
      if(i===undefined||cells[i].owner!==f.id)continue;
      const c=cells[i];
      const rate=.06*(f.golden?3:1)*(0.4+mainspring/100);
      if(c.level<4 && Math.random()<rate){
        c.level++; pushHist(c,LV_LABEL[c.level]); dirty.add(i);
        if(c.level===4 && warCooldown===0){
          logEvent(`${f.name}의 ${ref(i)}에 시계탑이 세워졌습니다.`, `=TOWER("${f.name}", ${ref(i)})`);
          warCooldown=22;
        }
      }
      /* low tension: high-tier works can wind DOWN */
      if(slow && c.level>1 && Math.random()<.05){
        c.level--; pushHist(c,'동력 부족 감속'); dirty.add(i);
      }
    }
  }

  /* random events */
  const r=Math.random();
  if(!rusts.size && r<(slow?.012:.004)){
    const big=[];for(let i=0;i<N;i++)if(cells[i].owner!==null&&cells[i].level>=2)big.push(i);
    if(big.length){const i=big[Math.random()*big.length|0];rusts.set(i,11);dirty.add(i);
      logEvent(`${ref(i)}에서 녹이 번지기 시작했습니다.`, `=RUST(${ref(i)})`);}
  } else if(r>.996 && factions.length){
    const f=factions[Math.random()*factions.length|0]; f.golden=90;
    mainspring=Math.min(100,mainspring+12);
    logEvent(`${f.name}이(가) 황금 태엽기에 들어섰습니다.`, `=OVERWIND("${f.name}", 90)`);
  } else if(r>.9935 && r<=.996){
    const tw=[];for(let i=0;i<N;i++)if(cells[i].owner!==null&&cells[i].level>=2)tw.push(i);
    if(tw.length){const i=tw[Math.random()*tw.length|0];jams.set(i,6);dirty.add(i);
      logEvent(`${ref(i)}의 핵심 톱니가 부러졌습니다.`, `=JAM(${ref(i)})`);}
  } else if(r>.985 && r<=.9935){
    /* an escapement tremor rewinds a little, world-wide */
    mainspring=Math.min(100,mainspring+6);
    logEvent('지하 발조기가 잠시 세계를 되감았습니다.', '=AUTOWIND(+6)');
  }

  /* gentle ambient self-wind so the world never silently stalls */
  if(mainspring<18) mainspring=Math.min(100,mainspring+1.4);

  /* ambient heartbeat: keep the chronicle & status breathing in quiet stretches */
  if(tickN%24===0){
    const lead=[...factions].sort((a,b)=>b.size-a.size)[0];
    if(lead){
      const blurbs=[
        [`${lead.name}이(가) 가장 많은 톱니를 돌리고 있습니다.`, `=LEAD("${lead.name}", ${lead.size})`],
        [`세계의 모든 진자가 ${(tickN%2)?'똑':'딱'} 소리를 냈습니다.`, '=PENDULUM.SYNC()'],
        [`기관실 검침: 대태엽 장력 ${Math.round(mainspring)}%.`, `=AUDIT(SPRING) → ${Math.round(mainspring)}%`],
      ];
      const pick=blurbs[(tickN/24|0)%blurbs.length];
      logEvent(pick[0], pick[1]);
    }
  }

  if(factions.length<3 && Math.random()<.012 && factions.length<6){
    spawnFaction(false,'바다 건너에서');
  }

  /* draw */
  for(const i of dirty) paint(i);
  dirty.clear();

  /* HUD */
  $('st-year').textContent=year;
  $('st-pop').textContent=pop.toLocaleString();
  $('st-fac').textContent=factions.length;
  $('tick').textContent = (tickN%2)?'딱':'똑';
  renderGauge();

  // re-tint gears occasionally so spin-speed reflects current tension
  if(tickN%14===0){ for(let i=0;i<N;i++) if(cells[i].owner!==null) paint(i); }

  if(tickN%6===0){
    let h='<h4>길드 현황</h4>';
    const sorted=[...factions].sort((a,b)=>b.size-a.size);
    if(!sorted.length) h+='<div class="dead">— 모든 태엽이 멈췄습니다 —</div>';
    for(const f of sorted)
      h+=`<div class="row"><span><span class="sw" style="background:${f.color}"></span>${f.name}${f.golden?' <span class="crown">✦</span>':''}</span><span>${f.size}칸</span></div>`;
    if(obituaries.length){
      h+='<h4 style="margin-top:7px">정지기록</h4>';
      for(const o of obituaries.slice(-3)) h+=`<div class="dead">† ${o.name} (${o.year}기)</div>`;
    }
    h+='<div class="hint">셀 클릭 = 그 부품의 이력 · ⟳ 태엽 감기로 세계를 되감으세요</div>';
    $('legend').innerHTML=h;
    $('tab-dead').textContent=`정지기록 (${obituaries.length})`;
    $('ttl').textContent=`태엽도시.xlsx - Excel (서기 ${year}태엽기)`;
  }

  /* mainspring icon swing speed tracks tension */
  $('springicon').style.animation=`spin ${(6 - mainspring/22).toFixed(1)}s linear infinite`;
}

/* ---------- interaction ---------- */
let armed=null; // 'jam' | 'found'

sheetEl.addEventListener('click',e=>{
  const t=e.target.closest('.cell'); if(!t)return;
  const i=+t.dataset.i;

  if(armed==='jam'){
    if(cells[i].owner!==null){jams.set(i,6);dirty.add(i);paint(i);
      logEvent(`사용자가 ${ref(i)}에 고장을 주입했습니다.`, `=JAM(${ref(i)}; MANUAL)`);}
    disarm(); return;
  }
  if(armed==='found'){
    if(cells[i].st==='plate'&&cells[i].owner===null){
      if(nameIdx>=NAMES.length)nameIdx=0;
      const f={id:factions.length?Math.max(...factions.map(x=>x.id))+1:0,name:NAMES[nameIdx],color:COLORS[nameIdx%COLORS.length],golden:0,size:0,arr:[]};
      nameIdx++; setCell(i,f.id,1,'사용자 설립'); factions.push(f); paint(i);
      cellEls[i].classList.add('pulse');setTimeout(()=>cellEls[i].classList.remove('pulse'),600);
      logEvent(`사용자가 ${ref(i)}에 ${f.name}을(를) 세웠습니다.`, `=MESH("${f.name}", ${ref(i)}; MANUAL)`);
    }
    disarm(); return;
  }

  /* default: select & show history */
  if(selected>=0) cellEls[selected].classList.remove('sel');
  selected=i; t.classList.add('sel');
  namebox.textContent=ref(i);
  const c=cells[i];
  let owner='';
  if(c.owner!==null){const f=facById(c.owner);if(f)owner=` :: ${f.name}/${LV_LABEL[c.level]||''}`;}
  fmla.textContent=`=ESCAPEMENT(${c.hist.map(x=>`"${x}"`).join(' → ')})${owner}`;
});

function disarm(){armed=null;$('btn-jam').classList.remove('armed');$('btn-found').classList.remove('armed');}

/* WIND button — the core intervention */
function wind(){
  mainspring=Math.min(100,mainspring+16);
  renderGauge();
  $('springicon').classList.add('pulse');setTimeout(()=>$('springicon').classList.remove('pulse'),600);
  logEvent('사용자가 대태엽을 감았습니다. 세계가 다시 빨라집니다.', `=WIND($A$1; +16) → ${Math.round(mainspring)}%`);
  // visible jolt: redraw all gears at new speed
  for(let i=0;i<N;i++) if(cells[i].owner!==null||cells[i].st==='cog') paint(i);
}
$('btn-wind').addEventListener('click',wind);

$('btn-jam').addEventListener('click',()=>{ if(armed==='jam'){disarm();return;} disarm();armed='jam';$('btn-jam').classList.add('armed');
  $('status-ev').textContent='고장을 주입할 가동 셀을 선택하세요…';});
$('btn-found').addEventListener('click',()=>{ if(armed==='found'){disarm();return;} disarm();armed='found';$('btn-found').classList.add('armed');
  $('status-ev').textContent='새 공방을 세울 빈 황동판을 선택하세요…';});

/* pace toggle */
let timer=null;
function applyPace(){const p=PACES[paceIdx];$('pace-ic').textContent=p.ic;$('pace-lb').textContent=p.lb;
  if(timer)clearInterval(timer);timer=setInterval(tick,p.ms);}
$('btn-pace').addEventListener('click',()=>{paceIdx=(paceIdx+1)%PACES.length;applyPace();});

/* ---------- tabs / doc panels ---------- */
const tabs=document.querySelectorAll('#tabs .tab'), docpanel=$('docpanel');
function showDoc(which){
  tabs.forEach(t=>t.classList.toggle('on',t.dataset.doc===which));
  if(which==='sheet'){docpanel.style.display='none';return;}
  docpanel.style.display='block';
  if(which==='chron'){
    let h='<h2>연대기 (機關 연대표)</h2><div class="sub">대태엽이 처음 감긴 이래의 사건 기록 — 최신순</div>';
    h+='<table><tr><th style="width:90px">연도</th><th>사건</th><th style="width:280px">수식</th></tr>';
    for(const e of chronicle.slice(-120).reverse())
      h+=`<tr><td class="yr">서기 ${e.year}기</td><td>${e.msg}</td><td class="fx">${e.fx||''}</td></tr>`;
    h+='</table>'; docpanel.innerHTML=h;
  } else {
    let h='<h2>정지기록 (停止記錄)</h2><div class="sub">멈춰버린 길드들의 묘비 — 마지막 톱니가 풀린 순간</div>';
    if(!obituaries.length) h+='<p style="color:#999">아직 멈춘 길드가 없습니다. 모든 태엽이 돌고 있습니다.</p>';
    else{ h+='<table><tr><th style="width:120px">정지 연도</th><th>길드</th><th>비문</th></tr>';
      for(const o of [...obituaries].reverse())
        h+=`<tr><td class="yr">서기 ${o.year}기</td><td class="ob">${o.name}</td><td>마지막 발조가 풀려 영원히 정지하다.</td></tr>`;
      h+='</table>'; }
    docpanel.innerHTML=h;
  }
}
tabs.forEach(t=>t.addEventListener('click',()=>showDoc(t.dataset.doc)));

/* ---------- boot ---------- */
fmla.textContent=`=SIM.CLOCKWORK($A$1:$${colName(COLS-1)}$${ROWS}, "시간은 태엽으로 흐른다")`;
for(let i=0;i<N;i++) paint(i);
renderGauge();
spawnFaction(true); spawnFaction(true); spawnFaction(true);
$('springicon').style.animation='spin 4s linear infinite';
applyPace();
})();
</script>
</body>
</html>
