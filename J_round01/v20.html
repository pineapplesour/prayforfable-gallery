<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>蟻群.xlsx - Excel</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#dadce0;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}

  /* ---- 타이틀바 ---- */
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar .tt{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  #titlebar .save{margin-left:auto;color:#888;font-size:11px}

  /* ---- 리본 메뉴 ---- */
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#555;
    flex:0 0 auto;overflow:hidden;white-space:nowrap}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px;cursor:default}
  #menubar i:hover{background:#eef3ef}

  /* ---- 리본 도구 ---- */
  #ribbon{background:#f8f8f7;border-bottom:1px solid #dcdcdc;display:flex;align-items:center;
    padding:4px 8px;gap:4px;flex:0 0 auto;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:thin}
  .grp{display:flex;flex-direction:column;align-items:center;padding:0 7px;
    border-right:1px solid #e3e3e3;height:42px;justify-content:space-between}
  .grp .row{display:flex;gap:3px}
  .grp .lbl{font-size:9.5px;color:#999;margin-top:2px}
  .rbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:42px;height:34px;border:1px solid transparent;border-radius:3px;cursor:pointer;
    font-size:10px;color:#333;background:transparent;padding:2px 5px;gap:1px;white-space:nowrap}
  .rbtn .ic{font-size:15px;line-height:1}
  .rbtn:hover{background:#e7f0ea;border-color:#cfe3d6}
  .rbtn.act{background:#d4e8da;border-color:#107c41;color:#0b5e31;font-weight:600}
  .rbtn.tool.on{background:#ffe9b8;border-color:#e0a93f;color:#7a5300;font-weight:600}

  /* ---- 수식바 ---- */
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px;flex:0 0 auto}
  #namebox{width:74px;min-width:74px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;gap:4px}
  #namebox .car{color:#aaa;font-size:9px}
  #fx{width:30px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif;
    border-right:1px solid #eee;flex:0 0 auto}
  #formula{flex:1;padding:0 10px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---- 시트 ---- */
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1 1 auto;min-height:0}
  #sheet{display:grid;background:#fff;position:absolute;top:0;left:0}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#666;font-size:10.5px;
    font-weight:500;position:sticky}
  .hd.cn{top:0;z-index:3}
  .hd.rn{left:0;z-index:3}
  .hd.corner{top:0;left:0;z-index:4}
  .cell{position:relative;border-right:1px solid #ededed;border-bottom:1px solid #ededed;
    display:flex;align-items:center;justify-content:center;font-size:11px;
    overflow:hidden;cursor:cell;line-height:1}
  .cell .ph{position:absolute;inset:0;pointer-events:none}
  .cell .gl{position:relative;z-index:1}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:2}
  .cell.lure::after{content:"";position:absolute;inset:2px;border:1.5px dashed #e0a93f;
    border-radius:50%;z-index:2;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
  @keyframes raidf{0%,100%{box-shadow:inset 0 0 0 2px #ff3b3b}50%{box-shadow:inset 0 0 0 2px #ffd0d0}}
  .cell.raid{animation:raidf .3s 3;z-index:2}

  /* ---- 범례 ---- */
  #legend{position:absolute;top:8px;right:14px;background:#fffdf3;border:1px solid #d8c66a;
    box-shadow:2px 4px 12px rgba(0,0,0,.16);padding:9px 13px;font-size:11px;z-index:6;
    min-width:196px;line-height:1.85;border-radius:3px;max-width:62vw}
  #legend .sw{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px;
    vertical-align:middle}
  #legend .bar{display:inline-block;height:5px;border-radius:2px;vertical-align:middle;
    margin-left:5px;background:currentColor;opacity:.7}
  #legend .dead{color:#999;font-size:10.5px}
  #legend h4{margin:8px 0 2px;font-size:10.5px;color:#7a6a1f;letter-spacing:.3px}
  #legend h4:first-child{margin-top:0}
  #legend .gold{color:#b8860b;font-weight:700}
  #legtoggle{display:none}

  /* ---- 키 안내 ---- */
  #help{position:absolute;left:10px;bottom:8px;background:rgba(255,255,255,.92);
    border:1px solid #d9d9d9;border-radius:4px;padding:5px 9px;font-size:10.5px;color:#555;
    z-index:6;line-height:1.6;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  #help b{color:#107c41}
  #help .tg{color:#e0a93f;font-weight:600}

  /* ---- 상태바 ---- */
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;flex:0 0 auto;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .ev{overflow:hidden;text-overflow:ellipsis;flex:1}

  /* ---- 시트탭 ---- */
  #tabs{height:26px;background:#f3f2f1;display:flex;align-items:stretch;padding-left:26px;
    border-top:1px solid #d4d4d4;font-size:11.5px;flex:0 0 auto}
  #tabs div{padding:4px 14px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    margin-top:2px;background:#e8e8e8;color:#555;cursor:pointer;display:flex;align-items:center;
    border-radius:3px 3px 0 0}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41;margin-top:0}
  #tabs .plus{color:#999}

  /* ---- 패널(연대기/멸망기록) ---- */
  #panel{position:absolute;inset:0;background:#fff;z-index:8;display:none;flex-direction:column;
    overflow:auto;padding:0}
  #panel.show{display:flex}
  #panel .ph{position:sticky;top:0;background:#f5f7f5;border-bottom:1px solid #e0e0e0;
    padding:9px 16px;font-weight:600;color:#107c41;font-size:13px;display:flex;
    justify-content:space-between;align-items:center}
  #panel .ph .x{cursor:pointer;color:#999;font-weight:400}
  #panel table{border-collapse:collapse;width:100%;font-size:12px}
  #panel td,#panel th{border:1px solid #ededed;padding:4px 10px;text-align:left}
  #panel th{background:#f5f5f5;color:#555;position:sticky;top:39px;font-weight:600}
  #panel td.yr{color:#888;width:84px;font-family:Consolas,monospace}
  #panel td.fm{font-family:Consolas,monospace;color:#0b5e31;width:30%}
  #panel tr.dead td.fm{color:#a33}
  #panel .empty{padding:20px;color:#999}

  @media (max-width:560px){
    #menubar{gap:11px;font-size:11px;padding:0 8px}
    #legend{font-size:10px;min-width:0;max-width:none;left:8px;right:8px;top:6px;
      display:none}
    #legend.open{display:block}
    #legtoggle{display:flex;position:absolute;top:6px;right:8px;z-index:7;
      background:#fffdf3;border:1px solid #d8c66a;border-radius:3px;padding:3px 8px;
      font-size:11px;color:#7a6a1f;cursor:pointer;align-items:center;gap:4px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
    #help{font-size:9.5px;padding:4px 7px;max-width:60vw}
    #ribbon{padding:4px 4px}
    .grp{padding:0 5px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <div class="tt" id="title">蟻群.xlsx - Excel</div>
    <div class="save">자동 저장 ●</div>
  </div>

  <div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>

  <div id="ribbon">
    <div class="grp">
      <div class="row">
        <div class="rbtn" id="btn-play"><div class="ic">⏯</div><div>일시정지</div></div>
        <div class="rbtn" id="btn-step"><div class="ic">⏭</div><div>한 틱</div></div>
      </div>
      <div class="lbl">시뮬레이션</div>
    </div>
    <div class="grp">
      <div class="row">
        <div class="rbtn" data-spd="220"><div class="ic">🐢</div><div>느림</div></div>
        <div class="rbtn act" data-spd="110"><div class="ic">▶</div><div>보통</div></div>
        <div class="rbtn" data-spd="45"><div class="ic">⚡</div><div>빠름</div></div>
      </div>
      <div class="lbl">계산 속도</div>
    </div>
    <div class="grp">
      <div class="row">
        <div class="rbtn tool on" data-tool="food"><div class="ic">✦</div><div>먹이</div></div>
        <div class="rbtn tool" data-tool="lure"><div class="ic">◎</div><div>유인</div></div>
        <div class="rbtn tool" data-tool="rain"><div class="ic">☔</div><div>비</div></div>
        <div class="rbtn tool" data-tool="hist"><div class="ic">🔍</div><div>이력</div></div>
      </div>
      <div class="lbl">개입 도구 (셀 클릭)</div>
    </div>
    <div class="grp">
      <div class="row">
        <div class="rbtn" id="btn-queen"><div class="ic">♛</div><div>여왕 투입</div></div>
        <div class="rbtn" id="btn-reset"><div class="ic">↺</div><div>새 세계</div></div>
      </div>
      <div class="lbl">군체</div>
    </div>
  </div>

  <div id="fbar">
    <div id="namebox"><span id="nb">A1</span><span class="car">▾</span></div>
    <div id="fx">fx</div>
    <div id="formula"></div>
  </div>

  <div id="sheetwrap">
    <div id="sheet"></div>
    <div id="legtoggle">범례 ▾</div>
    <div id="legend"></div>
    <div id="help"></div>
    <div id="panel"></div>
  </div>

  <div id="tabs">
    <div class="on" data-view="sheet">군체.지도</div>
    <div data-view="chron">연대기</div>
    <div data-view="dead" id="tab-dead">멸망기록 (0)</div>
    <div class="plus">＋</div>
  </div>

  <div id="statusbar"></div>
</div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);

const sheet=$('#sheet'), fmla=$('#formula'), nb=$('#nb'),
      statusbar=$('#statusbar'), legend=$('#legend'), helpBox=$('#help'),
      panel=$('#panel'), titleEl=$('#title');

let CW, CH, COLS, ROWS, N;
let cellEls=[], cells=[], colonies=[], obituaries=[], chron=[];
let nameIdx=0, year=0, lastEvent='', pop=0, foodTotal=0;
let tickN=0, selected=-1, raidLogCD=0, eventLogCD=0;
let running=true, speed=110, timer=null;
let tool='food', curView='sheet';

/* ---------- 그리드 치수 ---------- */
function calcDims(){
  const w=$('#sheetwrap').clientWidth, h=$('#sheetwrap').clientHeight;
  const mobile=window.innerWidth<560;
  CW = mobile?26:30; CH = mobile?22:24;
  COLS = Math.max(14, Math.min(42, Math.floor((w-50)/CW)));
  ROWS = Math.max(12, Math.min(40, Math.floor((h-2)/CH)));
  N = COLS*ROWS;
}

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(Math.floor(i/COLS)+1);}
function nbrs(i){const x=i%COLS,y=i/COLS|0,o=[];if(x>0)o.push(i-1);if(x<COLS-1)o.push(i+1);if(y>0)o.push(i-COLS);if(y<ROWS-1)o.push(i+COLS);return o;}
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

/* ---------- DOM 그리드 ---------- */
function buildGrid(){
  sheet.style.gridTemplateColumns=`48px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows=CH+'px';
  cellEls=new Array(N);
  const frag=document.createDocumentFragment();
  const corner=document.createElement('div');corner.className='hd corner';frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const hd=document.createElement('div');hd.className='hd cn';hd.textContent=colName(c);frag.appendChild(hd);}
  for(let r=0;r<ROWS;r++){
    const rh=document.createElement('div');rh.className='hd rn';rh.textContent=r+1;frag.appendChild(rh);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      const ph=document.createElement('div');ph.className='ph';
      const gl=document.createElement('span');gl.className='gl';
      d.appendChild(ph);d.appendChild(gl);
      cellEls[r*COLS+c]=d;frag.appendChild(d);
    }
  }
  sheet.innerHTML='';sheet.appendChild(frag);
}

/* ---------- 지형(밸류 노이즈) ---------- */
const GW=10,GH=7;
function genWorld(){
  const gz=[];for(let i=0;i<GW*GH;i++)gz[i]=Math.random();
  const noise=(x,y)=>{
    const fx=x/COLS*(GW-1),fy=y/ROWS*(GH-1);
    const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
    const a=gz[y0*GW+x0],b=gz[y0*GW+Math.min(GW-1,x0+1)];
    const c=gz[Math.min(GH-1,y0+1)*GW+x0],d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
    return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
  };
  cells=new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS,y=i/COLS|0;
    const v=noise(x,y)+(Math.random()-.5)*.14;
    let st='soil',hist=['황무지'];
    if(v<.30){st='water';hist=['웅덩이'];}
    else if(v>.66&&Math.random()<.65){st='plant';hist=['풀숲'];}
    cells[i]={st,owner:null,level:0,food:0,pher:0,hist,ruinT:0,fung:0};
    // 자연 먹이 산포 (식물 근처에 씨앗·진딧물)
    if(st==='plant'&&Math.random()<.5){cells[i].food=1+Math.random()*2|0;cells[i].hist.push('먹이밭');}
    else if(st==='soil'&&Math.random()<.05){cells[i].food=1+Math.random()*3|0;cells[i].hist.push('먹이');}
  }
}

/* ---------- 군체 ---------- */
const NAMES=['적단개미','흑야 군단','황금 수확단','잎꾼 부족','불개미 제국','회색 약탈단','이끼 동맹','사막 유랑단','진홍 여왕국','목수개미 길드'];
const COLORS=['#c0392b','#34495e','#d4940a','#27ae60','#e74c3c','#7f8c8d','#16a085','#cd853f','#9b1b5e','#8e6e3a'];

function spawnColony(announce){
  if(nameIdx>=NAMES.length)nameIdx=0;
  const id=colonies.length?Math.max(...colonies.map(c=>c.id))+1:0;
  const col={id,name:NAMES[nameIdx],color:COLORS[nameIdx%COLORS.length],
    bloom:0,size:0,arr:[],stock:5,queen:-1};
  nameIdx++;
  for(let t=0;t<400;t++){
    const i=Math.random()*N|0;
    if(cells[i].st==='soil'&&cells[i].owner===null){
      setCell(i,col.id,3,'여왕방');   // 여왕방으로 시작
      col.queen=i;cells[i].pher=1;
      colonies.push(col);
      if(announce)logEvent(`${col.name}의 여왕이 첫 둥지를 텄습니다.`,`=NEST.FOUND("${col.name}", ${ref(i)})`);
      return col;
    }
  }
  return null;
}
function colById(id){return colonies.find(c=>c.id===id);}

function setCell(i,owner,level,label){
  const c=cells[i];c.owner=owner;c.level=level;c.st='nest';
  if(label){c.hist.push(label);if(c.hist.length>8)c.hist.shift();}
  dirty.add(i);
}

/* level: 1 일개미통로 · 2 굴방 · 3 여왕방 · 4 거대둥지(메가콜로니) */
const LV_TXT=['','蟻','⬡','♛','城'];
const LV_LABEL=['','통로','굴방','여왕방','거대둥지'];

const dirty=new Set();

function paint(i){
  const c=cells[i],el=cellEls[i],ph=el.firstChild,gl=el.lastChild;
  let bg='',phBg='',tx='',cl='#333',w='';
  // 기본 지형/소유
  if(c.fung>0){bg='#e7d9ef';tx='菌';cl='#7030a0';w='700';}
  else if(c.st==='water'){bg='#dcebf7';tx='~';cl='#8fb8dd';}
  else if(c.st==='plant'){bg='#e6f0db';tx='木';cl='#6a9a3e';}
  else if(c.st==='ruin'){bg='#efefef';tx='墟';cl='#aaa';}
  else if(c.owner!==null){
    const f=colById(c.owner);
    if(f){bg=hexA(f.color,.12+c.level*.16);tx=LV_TXT[c.level];cl=f.color;w=c.level>=3?'700':'';}
  }else if(c.food>0){bg='#fff6d6';}
  // 먹이 글리프(비둥지 셀)
  if(c.owner===null&&c.fung===0&&c.st!=='water'){
    if(c.food>=3){tx='✦';cl='#c79100';w='700';}
    else if(c.food>0){tx='·';cl='#d6b53a';w='700';}
  }
  // 페로몬: 글리프 셀 위에 깔리는 향기 농도 틴트
  if(c.pher>0.02&&c.owner!==null){
    const f=colById(c.owner);
    if(f)phBg=hexA(f.color,Math.min(.5,c.pher*.45));
  }else if(c.pher>0.02){
    phBg=`rgba(150,90,40,${Math.min(.4,c.pher*.4)})`;
  }
  el.style.background=bg;
  ph.style.background=phBg;
  gl.style.color=cl;gl.style.fontWeight=w;gl.textContent=tx;
}

/* ---------- 로그 ---------- */
function logEvent(msg,formula){
  lastEvent=`${year}T: ${msg}`;
  if(formula){fmla.textContent=formula;chron.push({y:year,msg,fm:formula});if(chron.length>400)chron.shift();}
}
function flashRaid(i){const el=cellEls[i];el.classList.add('raid');setTimeout(()=>el.classList.remove('raid'),900);}

/* ---------- 틱 ---------- */
function tick(){
  tickN++;year++;
  if(raidLogCD>0)raidLogCD--;
  if(eventLogCD>0)eventLogCD--;

  // 재집계
  for(const f of colonies){f.arr.length=0;f.size=0;}
  pop=0;foodTotal=0;
  const PW=[0,12,55,180,600];
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin'&&--c.ruinT<=0){c.st='soil';dirty.add(i);}
    // 페로몬 증발
    if(c.pher>0){c.pher*=0.90;if(c.pher<0.02){c.pher=0;}dirty.add(i);}
    if(c.food>0)foodTotal+=c.food;
    if(c.owner!==null){
      const f=colById(c.owner);
      if(f){f.arr.push(i);f.size++;pop+=PW[c.level];}
      else{c.owner=null;c.level=0;dirty.add(i);}
    }
  }

  // 멸망 판정
  for(let k=colonies.length-1;k>=0;k--){
    const f=colonies[k];
    if(f.size===0){
      obituaries.push({name:f.name,y:year});
      logEvent(`${f.name}의 마지막 일개미가 스러졌습니다.`,`=COLLAPSE("${f.name}", ${year})`);
      colonies.splice(k,1);
    }
  }

  // 곰팡이(역병) 확산
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.fung>0){
      if(Math.random()<.18)for(const n of nbrs(i)){const d=cells[n];if(d.owner!==null&&d.fung===0){d.fung=10;dirty.add(n);}}
      if(Math.random()<.24){
        c.level--;
        if(c.level<=0){c.owner=null;c.level=0;c.hist.push('곰팡이로 폐사');if(c.hist.length>8)c.hist.shift();}
        dirty.add(i);
      }
      if(--c.fung<=0){c.fung=0;dirty.add(i);}
    }
  }

  // 군체 행동
  for(const f of colonies){
    if(f.bloom>0)f.bloom--;
    if(f.size===0)continue;

    // 채집(forage): 페로몬 따라 먹이 셀로 이동·수확
    const scouts=2+(f.size*.22|0);
    for(let s=0;s<scouts;s++){
      const src=f.arr[Math.random()*f.arr.length|0];
      if(src===undefined||cells[src].owner!==f.id)continue;
      const nb=nbrs(src);
      // 페로몬 강한 인접 셀 선호
      let tgt=nb[Math.random()*nb.length|0];
      if(Math.random()<.6){let best=-1,bp=-1;for(const n of nb){const sc=cells[n].pher+(cells[n].food>0?.3:0);if(sc>bp){bp=sc;best=n;}}if(best>=0)tgt=best;}
      const tc=cells[tgt];
      if(tc.st==='water'||tc.fung>0)continue;
      cells[src].pher=Math.min(1,cells[src].pher+0.25);dirty.add(src);
      if(tc.food>0&&tc.owner===null){
        // 먹이 수확 → 향기길 + 비축
        tc.food--;f.stock+=2;tc.pher=Math.min(1,tc.pher+0.5);
        tc.hist.push('채집');if(tc.hist.length>8)tc.hist.shift();
        if(tc.food<=0){setCell(tgt,f.id,1,'개척 통로');tc.pher=1;}
        dirty.add(tgt);
      }else if(tc.owner===null){
        if(tc.st==='plant'){if(Math.random()<.4){tc.st='soil';setCell(tgt,f.id,1,'잎 채벌');tc.pher=.7;}}
        else if(tc.st==='soil'){setCell(tgt,f.id,1,'개척 통로');tc.pher=.6;}
      }else if(tc.owner!==f.id&&Math.random()<.34){
        // 약탈전(raid)
        const att=1+Math.random()*3+f.size*.0025+(f.bloom?1:0)+f.stock*.01;
        const def=tc.level+1+Math.random()*3;
        flashRaid(tgt);
        if(att>def){
          const defF=colById(tc.owner);
          if(Math.random()<.25){
            cells[tgt].owner=null;cells[tgt].level=0;cells[tgt].st='ruin';cells[tgt].ruinT=160;
            cells[tgt].hist.push('약탈로 붕괴');if(cells[tgt].hist.length>8)cells[tgt].hist.shift();
            dirty.add(tgt);
          }else{
            setCell(tgt,f.id,Math.max(1,tc.level-1),'약탈 점령');tc.pher=.5;f.stock+=3;
          }
          if((tc.level>=3||raidLogCD===0)&&defF){
            logEvent(`${f.name}이(가) ${defF.name}의 ${LV_LABEL[Math.max(1,tc.level)]||'영역'}을 습격했습니다.`,
              `=RAID("${f.name}"→"${defF.name}", ${ref(tgt)})`);
            raidLogCD=22;
          }
        }
      }
    }

    // 둥지 심화(비축 먹이 소모) — 통로→굴방→여왕방→거대둥지
    const builds=1+(f.size*.08|0);
    for(let b=0;b<builds;b++){
      const i=f.arr[Math.random()*f.arr.length|0];
      if(i===undefined||cells[i].owner!==f.id)continue;
      const c=cells[i];
      const cost=[0,2,6,16];
      if(c.level<4&&f.stock>=cost[c.level]&&Math.random()<.16*(f.bloom?2.4:1)){
        f.stock-=cost[c.level];c.level++;c.pher=Math.min(1,c.pher+.3);
        c.hist.push(LV_LABEL[c.level]);if(c.hist.length>8)c.hist.shift();
        dirty.add(i);
        if(c.level===4&&eventLogCD===0){
          logEvent(`${f.name}의 ${ref(i)}에 거대둥지가 완성되었습니다.`,`=MEGACOLONY("${f.name}", ${ref(i)})`);
          eventLogCD=14;
        }
      }
    }
    // 굶주림: 비축 부족 + 큰 군체면 외곽 통로 일부 아사
    if(f.stock<=0&&f.size>4&&Math.random()<.5){
      const i=f.arr[Math.random()*f.arr.length|0];
      if(i!==undefined&&cells[i].owner===f.id&&cells[i].level===1){
        cells[i].owner=null;cells[i].level=0;cells[i].hist.push('아사');if(cells[i].hist.length>8)cells[i].hist.shift();dirty.add(i);
      }
    }
    if(f.stock<0)f.stock=0;
    f.stock=Math.max(0,f.stock-Math.ceil(f.size*0.04)); // 유지비
  }

  // 자연 먹이 재생 (식물 주변)
  if(Math.random()<.4){
    const i=Math.random()*N|0,c=cells[i];
    if(c.owner===null&&c.st==='soil'&&c.fung===0){
      const nearPlant=nbrs(i).some(n=>cells[n].st==='plant');
      if((nearPlant&&Math.random()<.5)||Math.random()<.06){c.food=Math.min(4,c.food+1);if(c.food===1)c.hist.push('먹이 출현');dirty.add(i);}
    }
  }

  // 무작위 사건
  const r=Math.random();
  if(r<.0035){ // 곰팡이 창궐
    const big=[];for(let i=0;i<N;i++)if(cells[i].owner!==null&&cells[i].level>=3&&cells[i].fung===0)big.push(i);
    if(big.length){const i=big[Math.random()*big.length|0];cells[i].fung=10;dirty.add(i);
      logEvent(`${ref(i)}의 둥지에 곰팡이가 번졌습니다.`,`=FUNGUS(${ref(i)})`);}
  }else if(r>.9965&&colonies.length){ // 풍년(황금기)
    const f=colonies[Math.random()*colonies.length|0];f.bloom=85;f.stock+=20;
    logEvent(`${f.name}에 진딧물 풍년이 찾아왔습니다.`,`=APHID.BLOOM("${f.name}", 85)`);
  }else if(r>.9930&&r<=.9965){ // 비(자연)
    naturalRain();
  }
  // 분봉(migrate): 군체가 적으면 새 여왕 비상
  if(colonies.length<3&&Math.random()<.012&&colonies.length<6){
    const f=spawnColony(false);
    if(f)logEvent(`날개 달린 새 여왕이 분봉하여 ${f.name}을(를) 세웠습니다.`,`=SWARM("${f.name}")`);
  }

  for(const i of dirty)paint(i);dirty.clear();
  renderStatus();
  if(tickN%9===0)renderLegend();
}

function naturalRain(){
  // 무작위 영역에 비 → 페로몬 씻김 + 일부 침수
  const cx=Math.random()*COLS|0,cy=Math.random()*ROWS|0,rad=2+Math.random()*2|0;
  for(let i=0;i<N;i++){
    const x=i%COLS,y=i/COLS|0;
    if(Math.abs(x-cx)+Math.abs(y-cy)<=rad){
      cells[i].pher*=.2;
      if(cells[i].st==='soil'&&cells[i].owner===null&&Math.random()<.15){cells[i].food=Math.min(4,cells[i].food+1);}
      dirty.add(i);
    }
  }
  logEvent(`${colName(cx)}${cy+1} 일대에 비가 내려 향기길이 씻겼습니다.`,`=RAIN(${colName(cx)}${cy+1}, r=${rad})`);
}

/* ---------- 상태바/범례/탭 ---------- */
function renderStatus(){
  statusbar.innerHTML=`준비<span class="sep">|</span>${year}T<span class="sep">|</span>`+
    `개체수 ≈${pop.toLocaleString()}<span class="sep">|</span>군체 ${colonies.length}<span class="sep">|</span>`+
    `먹이 ${foodTotal}<span class="sep">|</span><span class="ev">${lastEvent}</span>`;
}
function renderLegend(){
  titleEl.textContent=`蟻群.xlsx - Excel  (${year}T)`;
  let h='<h4>군체 현황</h4>';
  if(!colonies.length)h+='<div style="color:#999">— 모든 군체 소멸 —</div>';
  const sorted=[...colonies].sort((a,b)=>b.size-a.size);
  for(const f of sorted){
    const bw=Math.max(4,Math.min(70,f.size*1.5));
    h+=`<div><span class="sw" style="background:${f.color}"></span>${f.name}`+
       `${f.bloom?' <span class="gold">✦풍년</span>':''} <span style="color:#999">${f.size}칸·먹이${f.stock|0}</span>`+
       `<br><span class="bar" style="width:${bw}px;color:${f.color}"></span></div>`;
  }
  if(obituaries.length){
    h+='<h4>멸망기록</h4>';
    for(const o of obituaries.slice(-3))h+=`<div class="dead">† ${o.name} (${o.y}T)</div>`;
  }
  legend.innerHTML=h;
  $('#tab-dead').textContent=`멸망기록 (${obituaries.length})`;
}

/* ---------- 패널(연대기/멸망기록) ---------- */
function showPanel(view){
  curView=view;
  if(view==='sheet'){panel.classList.remove('show');return;}
  let body='';
  if(view==='chron'){
    if(!chron.length)body='<div class="empty">아직 기록된 사건이 없습니다.</div>';
    else{
      body='<table><thead><tr><th>연도</th><th>사건</th><th>수식</th></tr></thead><tbody>';
      for(const e of [...chron].reverse())body+=`<tr><td class="yr">${e.y}T</td><td>${e.msg}</td><td class="fm">${esc(e.fm)}</td></tr>`;
      body+='</tbody></table>';
    }
    panel.innerHTML=`<div class="ph">연대기 — 蟻群의 역사 <span class="x" data-close>✕ 닫기</span></div>`+body;
  }else{
    if(!obituaries.length)body='<div class="empty">아직 멸망한 군체가 없습니다.</div>';
    else{
      body='<table><thead><tr><th>군체</th><th>멸망 연도</th><th>비문</th></tr></thead><tbody>';
      for(const o of [...obituaries].reverse())body+=`<tr class="dead"><td>${o.name}</td><td class="yr">${o.y}T</td><td class="fm">=R.I.P("${o.name}")</td></tr>`;
      body+='</tbody></table>';
    }
    panel.innerHTML=`<div class="ph">멸망기록 — 사라진 군체들 <span class="x" data-close>✕ 닫기</span></div>`+body;
  }
  panel.classList.add('show');
}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

/* ---------- 셀 클릭 = 개입/이력 ---------- */
sheet.addEventListener('click',e=>{
  const t=e.target.closest('.cell');if(!t)return;
  const i=+t.dataset.i,c=cells[i];
  if(selected>=0&&cellEls[selected])cellEls[selected].classList.remove('sel');
  selected=i;t.classList.add('sel');nb.textContent=ref(i);

  if(tool==='food'){
    if(c.st!=='water'&&c.owner===null&&c.fung===0){
      c.food=Math.min(5,c.food+2);c.hist.push('인위 먹이 투하');if(c.hist.length>8)c.hist.shift();
      fmla.textContent=`=DROP.FOOD(${ref(i)}, +2)`;
    }else fmla.textContent=`=DROP.FOOD(${ref(i)}) // 불가능: 빈 흙에만`;
    paint(i);
  }else if(tool==='lure'){
    // 유인 페로몬: 강한 향기길을 직접 칠해서 일개미를 끌어들임
    c.pher=1;t.classList.add('lure');setTimeout(()=>t.classList.remove('lure'),3000);
    for(const n of nbrs(i)){cells[n].pher=Math.min(1,cells[n].pher+.5);paint(n);}
    fmla.textContent=`=PHEROMONE.LURE(${ref(i)}, 강도=MAX)`;paint(i);
  }else if(tool==='rain'){
    const cx=i%COLS,cy=i/COLS|0,rad=2;
    for(let k=0;k<N;k++){const x=k%COLS,y=k/COLS|0;
      if(Math.abs(x-cx)+Math.abs(y-cy)<=rad){cells[k].pher*=.15;cells[k].fung=0;
        if(cells[k].st==='soil'&&cells[k].owner===null&&Math.random()<.3)cells[k].food=Math.min(4,cells[k].food+1);
        paint(k);}}
    fmla.textContent=`=RAIN(${ref(i)}, r=2) // 향기·곰팡이 정화`;
  }else{ // hist
    fmla.textContent=`=HISTORY(${ref(i)}: ${c.hist.map(x=>`"${x}"`).join(' → ')})`;
  }
});

/* ---------- 리본 동작 ---------- */
function setRunning(on){
  running=on;
  $('#btn-play').querySelector('div:last-child').textContent=on?'일시정지':'재생';
  $('#btn-play').querySelector('.ic').textContent=on?'⏸':'▶';
}
function restartTimer(){if(timer)clearInterval(timer);timer=setInterval(()=>{if(running&&curView==='sheet')tick();},speed);}

$('#btn-play').onclick=()=>setRunning(!running);
$('#btn-step').onclick=()=>{if(curView==='sheet')tick();};
$('#btn-queen').onclick=()=>{const f=spawnColony(true);if(!f)logEvent('빈 흙이 없어 여왕이 자리를 잡지 못했습니다.','=NEST.FOUND() // FAIL');renderLegend();};
$('#btn-reset').onclick=()=>boot();

document.querySelectorAll('.rbtn[data-spd]').forEach(b=>{
  b.onclick=()=>{document.querySelectorAll('.rbtn[data-spd]').forEach(x=>x.classList.remove('act'));
    b.classList.add('act');speed=+b.dataset.spd;restartTimer();};
});
document.querySelectorAll('.rbtn.tool').forEach(b=>{
  b.onclick=()=>{document.querySelectorAll('.rbtn.tool').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');tool=b.dataset.tool;updateHelp();};
});

/* 시트탭 */
document.querySelectorAll('#tabs div[data-view]').forEach(d=>{
  d.onclick=()=>{document.querySelectorAll('#tabs div').forEach(x=>x.classList.remove('on'));
    d.classList.add('on');showPanel(d.dataset.view);};
});
panel.addEventListener('click',e=>{if(e.target.hasAttribute('data-close')){
  document.querySelectorAll('#tabs div').forEach(x=>x.classList.remove('on'));
  document.querySelector('#tabs div[data-view="sheet"]').classList.add('on');showPanel('sheet');}});

/* 모바일 범례 토글 */
$('#legtoggle').onclick=()=>legend.classList.toggle('open');

/* 키보드 단축키 */
window.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();setRunning(!running);}
  else if(e.key==='1')clickTool('food');else if(e.key==='2')clickTool('lure');
  else if(e.key==='3')clickTool('rain');else if(e.key==='4')clickTool('hist');
});
function clickTool(t){const b=document.querySelector(`.rbtn.tool[data-tool="${t}"]`);if(b)b.click();}

function updateHelp(){
  const names={food:'먹이 투하',lure:'유인 페로몬',rain:'비',hist:'이력 조회'};
  helpBox.innerHTML=`현재 도구: <span class="tg">${names[tool]}</span> · 셀을 클릭하세요<br>`+
    `<b>Space</b> 정지/재생 · <b>1~4</b> 도구 전환 · 리본에서 속도/여왕 조절`;
}

/* ---------- 부팅 ---------- */
function boot(){
  calcDims();buildGrid();genWorld();
  colonies=[];obituaries=[];chron=[];nameIdx=0;year=0;tickN=0;
  pop=0;foodTotal=0;selected=-1;raidLogCD=0;eventLogCD=0;
  for(let i=0;i<N;i++)paint(i);
  fmla.textContent=`=SIM.ANT.COLONY($A$1:$${colName(COLS-1)}$${ROWS}, "냄새가 곧 기억이다")`;
  nb.textContent='A1';
  spawnColony(true);spawnColony(true);spawnColony(true);
  setRunning(true);renderStatus();renderLegend();updateHelp();
  showPanel('sheet');document.querySelectorAll('#tabs div').forEach(x=>x.classList.remove('on'));
  document.querySelector('#tabs div[data-view="sheet"]').classList.add('on');
  restartTimer();
}

let rzT=null;
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(boot,250);});

boot();
})();
</script>
