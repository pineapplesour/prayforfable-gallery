<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>황금세기.xlsx - Excel</title>
<style>
  :root{
    --gold:#b8860b; --gold2:#d4af37; --ink:#3a2f1c; --line:#e7ddc6;
    --excel:#1f7a4d; --parch:#fbf7ec; --parch2:#f4ecd8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#e7e0cf;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:var(--ink);user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;flex-direction:column}

  /* ---- 타이틀바 ---- */
  #titlebar{height:30px;flex:none;background:linear-gradient(#fdfaf0,#f1e9d4);display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #e0d6bd;position:relative}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar .ttl{position:absolute;left:0;right:0;text-align:center;color:#5b4d2c;font-size:12px;
    letter-spacing:.2px;pointer-events:none}
  #titlebar .ttl b{color:var(--gold);font-weight:700}

  /* ---- 리본 메뉴 ---- */
  #menubar{height:28px;flex:none;background:#fffdf6;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #ece2c9;font-size:12px;color:#6a5c38;overflow-x:auto;scrollbar-width:none}
  #menubar::-webkit-scrollbar{display:none}
  #menubar b{color:var(--gold);border-bottom:2.5px solid var(--gold);padding:4px 2px;font-weight:700;white-space:nowrap}
  #menubar i{font-style:normal;padding:4px 2px;white-space:nowrap;cursor:default}
  #menubar i:hover{color:var(--gold)}

  /* ---- 리본 툴 영역(개입 버튼) ---- */
  #ribbon{min-height:46px;flex:none;background:linear-gradient(#fbf6e8,#f5edd6);border-bottom:1px solid #e6dcc2;
    display:flex;align-items:center;gap:6px;padding:5px 10px;overflow-x:auto;scrollbar-width:none}
  #ribbon::-webkit-scrollbar{display:none}
  .grp{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 8px;
    border-right:1px solid #e6dcc2;height:36px;justify-content:center}
  .grp:last-child{border-right:none}
  .grp .lbl{font-size:9.5px;color:#9a8a5e}
  .btn{display:inline-flex;align-items:center;gap:5px;background:#fffdf6;border:1px solid #e0d3ad;
    border-radius:4px;padding:5px 9px;font-size:11px;color:#5b4d2c;cursor:pointer;white-space:nowrap;
    transition:.12s}
  .btn:hover{background:#fff7df;border-color:var(--gold2);color:var(--gold)}
  .btn:active{transform:translateY(1px)}
  .btn .ic{font-size:13px}
  .btn.play{font-weight:700}

  /* ---- 수식바 ---- */
  #fbar{height:27px;flex:none;background:#fffdf6;display:flex;align-items:center;
    border-bottom:1px solid #ddd0aa;font-size:12px}
  #namebox{width:74px;height:100%;border-right:1px solid #e0d3ad;display:flex;
    align-items:center;justify-content:center;color:#5b4d2c;font-weight:600;flex:none}
  #fx{width:30px;text-align:center;color:#b6a268;font-style:italic;font-family:Georgia,serif;flex:none}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#2b2410;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #formula .fn{color:var(--gold);font-weight:700}
  #formula .st{color:#0b6b3a}

  /* ---- 시트 ---- */
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1;min-height:0}
  #sheet{display:grid;background:#fff}
  .hd{background:#f3ecd9;border-right:1px solid #e2d6ba;border-bottom:1px solid #e2d6ba;
    display:flex;align-items:center;justify-content:center;color:#8a7a4e;font-size:11px}
  .hd.cn{position:relative}
  .cell{border-right:1px solid #efe7d2;border-bottom:1px solid #efe7d2;
    display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;
    overflow:hidden;cursor:cell;position:relative;transition:background .25s}
  .cell.sel{outline:2px solid var(--gold);outline-offset:-2px;z-index:3}
  .cell.master::after{content:"";position:absolute;inset:0;
    box-shadow:inset 0 0 6px 1px rgba(212,175,55,.55);pointer-events:none}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #c0392b}50%{box-shadow:inset 0 0 0 2px #f3b0a6}}
  .war{animation:warf .3s 3}
  @keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
  .born{animation:pop .5s}

  /* ---- 범례/패널 ---- */
  #legend{position:absolute;top:8px;right:10px;background:linear-gradient(#fffef8,#fdf7e6);
    border:1px solid var(--gold2);border-radius:4px;
    box-shadow:0 4px 14px rgba(80,60,10,.22);padding:9px 12px;font-size:11px;z-index:5;
    min-width:198px;max-width:240px;line-height:1.7}
  #legend h4{margin:0 0 4px;font-size:11px;color:var(--gold);letter-spacing:.3px;
    border-bottom:1px solid #eadfbf;padding-bottom:3px}
  #legend h4:not(:first-child){margin-top:8px}
  #legend .sw{display:inline-block;width:9px;height:9px;margin-right:6px;border-radius:2px;vertical-align:middle}
  #legend .row{display:flex;justify-content:space-between;gap:8px}
  #legend .row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #legend .row .pr{color:#9a8a5e;flex:none;font-variant-numeric:tabular-nums}
  #legend .gld{color:var(--gold);font-weight:700}
  #legend .dead{color:#a99}
  #legend .key{color:#7a6a3f;font-size:10px}
  #legend .key i{font-style:normal;display:inline-block;width:14px;text-align:center;margin-right:2px}

  /* ---- 상태바 ---- */
  #statusbar{height:24px;background:linear-gradient(90deg,var(--gold),#9c6f0a);color:#fff8e1;
    display:flex;align-items:center;padding:0 12px;font-size:11.5px;overflow:hidden;flex:none}
  #statusbar .seg{white-space:nowrap}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .ev{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

  /* ---- 시트탭 ---- */
  #tabs{height:25px;background:#f1e9d4;display:flex;align-items:flex-end;padding-left:14px;gap:2px;
    border-top:1px solid #ddd0aa;font-size:11.5px;flex:none;overflow-x:auto;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  #tabs div{padding:3px 13px;border:1px solid #ddd0aa;border-bottom:none;
    background:#e8dfc6;color:#7a6a3f;white-space:nowrap;cursor:pointer;border-radius:3px 3px 0 0}
  #tabs div.on{background:#fff;color:var(--gold);font-weight:700;border-top:2px solid var(--gold)}

  /* ---- 오버레이(연대기/대장/소실) ---- */
  #overlay{position:absolute;inset:0;background:rgba(255,253,245,.97);z-index:9;display:none;
    flex-direction:column;padding:14px 16px 8px}
  #overlay.show{display:flex}
  #overlay h2{margin:0 0 2px;font-size:15px;color:var(--gold)}
  #overlay .sub{color:#9a8a5e;font-size:11px;margin-bottom:8px}
  #ovlist{flex:1;overflow:auto;font-family:Consolas,Menlo,monospace;font-size:11.5px;line-height:1.75;
    border:1px solid #ece2c9;border-radius:4px;background:#fffdf6;padding:8px 10px}
  #ovlist .ln{padding:1px 0;border-bottom:1px dotted #eee3c8}
  #ovlist .yr{color:var(--gold);font-weight:700;margin-right:7px}
  #ovlist .fn{color:#0b6b3a}
  #ovlist .lost{color:#b06a6a}
  #ovlist .empty{color:#b0a37a;font-style:italic}
  #ovclose{align-self:flex-end;margin-top:6px}

  @media (max-width:560px){
    #ribbon .grp .lbl{display:none}
    #ribbon .grp{height:30px;padding:0 5px}
    .btn{padding:6px 8px}
    #legend{font-size:10px;min-width:150px;max-width:175px;padding:7px 9px;top:6px;right:6px}
    #namebox{width:58px}
    #menubar{gap:12px}
  }
</style>
</head>
<body>
<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <span class="ttl"><b>황금세기</b>.xlsx - Excel</span>
</div>

<div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>

<div id="ribbon">
  <div class="grp">
    <div style="display:flex;gap:6px">
      <button class="btn play" id="b-play"><span class="ic">⏸</span><span id="play-t">일시정지</span></button>
      <button class="btn" id="b-speed"><span class="ic">⏩</span><span id="speed-t">x1</span></button>
    </div>
    <div class="lbl">시뮬레이션</div>
  </div>
  <div class="grp">
    <div style="display:flex;gap:6px">
      <button class="btn" id="b-spawn"><span class="ic">⚜</span>가문 창건</button>
      <button class="btn" id="b-patron"><span class="ic">✦</span>황금기 후원</button>
    </div>
    <div class="lbl">메디치 위원회</div>
  </div>
  <div class="grp">
    <div style="display:flex;gap:6px">
      <button class="btn" id="b-comm"><span class="ic">★</span>걸작 의뢰</button>
      <button class="btn" id="b-plague"><span class="ic">疫</span>흑사병</button>
    </div>
    <div class="lbl">역사의 손길</div>
  </div>
</div>

<div id="fbar">
  <div id="namebox">A1</div>
  <div id="fx">fx</div>
  <div id="formula"></div>
</div>

<div id="sheetwrap">
  <div id="sheet"></div>
  <div id="legend"></div>
  <div id="overlay">
    <h2 id="ov-title">연대기</h2>
    <div class="sub" id="ov-sub"></div>
    <div id="ovlist"></div>
    <button class="btn" id="ovclose">시트로 돌아가기 ✕</button>
  </div>
</div>

<div id="tabs">
  <div class="on" data-sheet="map">세계</div>
  <div data-sheet="chron">연대기</div>
  <div data-sheet="works">작품대장</div>
  <div data-sheet="lost" id="tab-lost">소실기록 (0)</div>
</div>

<div id="statusbar"></div>

<script>
(() => {
const CW = 36, CH = 24;
function dims(){
  const COLS = Math.max(16, Math.min(42, Math.floor((innerWidth - 50) / CW)));
  // 실제 배치된 sheetwrap 높이를 측정 (flex 레이아웃) — 없으면 추정치
  const sw = document.getElementById('sheetwrap');
  let avail = sw ? sw.clientHeight : 0;
  if (!avail) {
    const ribH = document.getElementById('ribbon').offsetHeight || 46;
    avail = innerHeight - (30 + 28 + ribH + 27 + 24 + 25);
  }
  // 열 헤더(CH) 한 줄을 빼고 데이터 행 계산
  const ROWS = Math.max(12, Math.min(30, Math.floor((avail - CH - 2) / CH)));
  return {COLS, ROWS};
}
let {COLS, ROWS} = dims();
let N = COLS * ROWS;

const sheet = document.getElementById('sheet');
const fmla = document.getElementById('formula');
const namebox = document.getElementById('namebox');
const statusbar = document.getElementById('statusbar');
const legend = document.getElementById('legend');

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(Math.floor(i/COLS)+1);}

// ---------- 시트 DOM ----------
let cellEls = [];
function buildGrid(){
  sheet.style.gridTemplateColumns = `46px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows = CH + 'px';
  sheet.innerHTML = '';
  cellEls = new Array(N);
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd'; frag.appendChild(corner);
  for (let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd cn';h.textContent=colName(c);frag.appendChild(h);}
  for (let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd';h.textContent=r+1;frag.appendChild(h);
    for (let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d;frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

// ---------- 지형 (value-noise 대륙) ----------
const GW=9, GH=6;
let gz=[];
function genNoiseGrid(){gz=[];for(let i=0;i<GW*GH;i++)gz[i]=Math.random();}
function noise(x,y){
  const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=gz[y0*GW+x0], b=gz[y0*GW+Math.min(GW-1,x0+1)];
  const c=gz[Math.min(GH-1,y0+1)*GW+x0], d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}

let cells=[];
function genWorld(){
  cells=new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS, y=i/COLS|0;
    const v=noise(x,y)+(Math.random()-.5)*.14;
    let st='land', hist=['황무지'];
    if(v<.31){st='water';hist=['지중해'];}
    else if(v>.66 && Math.random()<.6){st='hill';hist=['언덕'];}
    else if(v>.5 && Math.random()<.45){st='olive';hist=['올리브 숲'];}
    cells[i]={st,owner:null,level:0,master:false,hist,ruinT:0};
  }
}

function nbrs(i){
  const x=i%COLS,y=i/COLS|0,out=[];
  if(x>0)out.push(i-1);
  if(x<COLS-1)out.push(i+1);
  if(y>0)out.push(i-COLS);
  if(y<ROWS-1)out.push(i+COLS);
  return out;
}

// ---------- 가문(국가) ----------
const HOUSES=[
  ['메디치 가문','#9a6b2f'],['스포르차 공국','#3b6fb0'],['곤차가 후작가','#7d3a8c'],
  ['에스테 가문','#0e8a5f'],['보르자 교황령','#b03030'],['몬테펠트로 공작가','#0d7d86'],
  ['베네치아 공화국','#c08a17'],['아라곤 왕가','#b1456f'],['비스콘티 가문','#5a7d1f'],
  ['파르네세 가문','#6a4ec0']
];
let nameIdx=0, factions=[], obituaries=[], works=[], chronicle=[];
let year=1390, lastEvent='르네상스의 여명이 밝았습니다.', pop=0, masterCount=0;
let plague=new Map(), fires=new Map(), dirty=new Set(), selected=-1;

function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

function spawnFaction(announce){
  if(nameIdx>=HOUSES.length)nameIdx=0;
  const f={id:factions.length?Math.max(...factions.map(x=>x.id))+1:0,
    name:HOUSES[nameIdx][0],color:HOUSES[nameIdx][1],golden:0,size:0,prestige:0,arr:[]};
  nameIdx++;
  for(let t=0;t<300;t++){
    const i=Math.random()*N|0;
    if(cells[i].st==='land'&&cells[i].owner===null){
      setCell(i,f.id,1,'개척지'); cellEls[i].classList.add('born');
      setTimeout(()=>cellEls[i]&&cellEls[i].classList.remove('born'),520);
      factions.push(f);
      if(announce)logEvent(`${f.name}이(가) 도시국가를 세웠습니다.`,[['PATRON',`"${f.name}"`,ref(i)]]);
      return f;
    }
  }
  return null;
}
function facById(id){return factions.find(f=>f.id===id);}

function setCell(i,owner,level,histLabel){
  const c=cells[i];
  c.owner=owner;c.level=level;c.st='land';
  if(histLabel){c.hist.push(histLabel);if(c.hist.length>8)c.hist.shift();}
  dirty.add(i);
}

// level: 0 빈 / 1 개척 / 2 공방 / 3 광장 / 4 대성당
const LV_TXT=['','·','⌂','▦','⛪'];
const LV_LABEL=['','개척지','공방','광장','대성당'];

function paint(i){
  const c=cells[i], el=cellEls[i];
  let bg='', tx='', col='#3a2f1c', w='', master=false;
  if(plague.has(i)){bg='#ead2f0';tx='疫';col='#7a2f9e';w='700';}
  else if(fires.has(i)){bg='#ffd9b0';tx='火';col='#c0392b';w='700';}
  else if(c.st==='water'){bg='#dcebf5';tx='≈';col='#8fb6d8';}
  else if(c.st==='olive'){bg='#e8efd8';tx='♣';col='#7a8c3a';}
  else if(c.st==='hill'){bg='#efe9d6';tx='⌃';col='#a08a55';}
  else if(c.st==='ruin'){bg='#ededed';tx='墟';col='#999';}
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      bg=hexA(f.color,.12+c.level*.16);
      tx=c.master?'★':LV_TXT[c.level];
      col=f.color; w=(c.level>=3||c.master)?'700':''; master=c.master;
    }
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  el.textContent=tx;
  el.classList.toggle('master',master);
}

// ---------- 수식바 렌더 (=FN(args) 색칠) ----------
function setFormula(parts){
  // parts: [ [FN, arg, arg...], ... ]  또는 string
  if(typeof parts==='string'){fmla.textContent=parts;return;}
  fmla.innerHTML = parts.map(p=>{
    const fn=p[0], args=p.slice(1);
    return `<span class="fn">=${fn}</span>(${args.join(', ')})`;
  }).join('  ');
}

function logEvent(msg,formulaParts){
  lastEvent=`서기 ${year}년 · ${msg}`;
  chronicle.push({year,msg});
  if(chronicle.length>400)chronicle.shift();
  if(formulaParts)setFormula(formulaParts);
}

function flashWar(i){const el=cellEls[i];el.classList.add('war');setTimeout(()=>el.classList.remove('war'),1000);}

// 걸작 의뢰: owned 셀(레벨>=2)을 명작으로 승격
function commission(f, forced){
  const cand=f.arr.filter(i=>cells[i].owner===f.id && cells[i].level>=2 && !cells[i].master);
  if(!cand.length){
    if(forced){ // 강제: 아무 영토나 광장으로 끌어올림
      const any=f.arr.filter(i=>cells[i].owner===f.id);
      if(!any.length)return false;
      const i=any[Math.random()*any.length|0];
      cells[i].level=Math.max(3,cells[i].level); dirty.add(i);
      return commissionAt(f,i);
    }
    return false;
  }
  return commissionAt(f, cand[Math.random()*cand.length|0]);
}
const ART=['「봄의 알레고리」','「최후의 만찬」','「다비드」','「비너스의 탄생」','「천지창조」',
  '「수태고지」','「피에타」','「아테네 학당」','「모나리자」','「성 삼위일체」','「유디트」','대성당의 돔'];
function commissionAt(f,i){
  cells[i].master=true; masterCount++;
  f.prestige+=50;
  const c=cells[i];
  c.hist.push('걸작 봉헌'); if(c.hist.length>8)c.hist.shift();
  const art=ART[Math.random()*ART.length|0];
  works.push({year, house:f.name, art, ref:ref(i), color:f.color});
  dirty.add(i);
  logEvent(`${f.name}이(가) ${ref(i)}에서 ${art}을(를) 완성했습니다.`,
    [['MASTERWORK',`"${f.name}"`,`"${art}"`,ref(i)]]);
  return true;
}

// ---------- 틱 ----------
let tickN=0, warLog=0;
function tick(){
  tickN++; year++;
  if(warLog>0)warLog--;

  for(const f of factions){f.arr.length=0;f.size=0;}
  pop=0;
  const PW=[0,30,140,420,1100];
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin'&&--c.ruinT<=0){c.st='land';dirty.add(i);}
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){f.arr.push(i);f.size++;pop+=PW[c.level];}
      else{c.owner=null;c.level=0;c.master=false;dirty.add(i);}
    }
  }

  // 멸망
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      obituaries.push({name:f.name,year,prestige:f.prestige});
      logEvent(`${f.name}의 명맥이 끊겼습니다.`,[['COLLAPSE',`"${f.name}"`,year]]);
      factions.splice(k,1);
    }
  }

  // 화재
  for(const [i,t] of [...fires]){
    if(Math.random()<.12){
      for(const n of nbrs(i)){const c=cells[n];
        if(c.owner!==null&&!fires.has(n)&&c.st==='land'){fires.set(n,5);dirty.add(n);}}
    }
    if(t<=1){
      fires.delete(i);const c=cells[i];
      if(c.master){c.master=false;
        works.push({year,house:'—',art:'(화재로 소실)',ref:ref(i),color:'#aaa',lost:true});}
      c.owner=null;c.level=0;c.st='ruin';c.ruinT=180;c.master=false;
      c.hist.push('잿더미');if(c.hist.length>8)c.hist.shift();
      dirty.add(i);
    }else fires.set(i,t-1);
  }

  // 역병
  if(plague.size){
    for(const [i,t] of [...plague]){
      if(Math.random()<.16){for(const n of nbrs(i)){
        if(cells[n].owner!==null&&!plague.has(n)){plague.set(n,11);dirty.add(n);}}}
      if(Math.random()<.22){const c=cells[i];c.level--;
        if(c.level<=0){
          if(c.master){c.master=false;
            works.push({year,house:'—',art:'(역병으로 유실)',ref:ref(i),color:'#aaa',lost:true});}
          c.owner=null;c.level=0;c.master=false;
          c.hist.push('역병으로 폐촌');if(c.hist.length>8)c.hist.shift();
        }
        dirty.add(i);}
      if(t<=1){plague.delete(i);dirty.add(i);}else plague.set(i,t-1);
    }
    if(plague.size===0)logEvent('흑사병이 물러갔습니다.',[['PLAGUE','"END"']]);
  }

  // 가문 행동
  for(const f of factions){
    if(f.golden>0)f.golden--;
    if(f.size===0)continue;

    // 확장 / 후원 경쟁(전쟁)
    const attempts=1+(f.size*.07|0);
    for(let a=0;a<attempts;a++){
      const src=f.arr[Math.random()*f.arr.length|0];
      if(src===undefined||cells[src].owner!==f.id)continue;
      const nb=nbrs(src);
      const tgt=nb[Math.random()*nb.length|0];
      const tc=cells[tgt];
      if(tc.st==='water'||fires.has(tgt))continue;
      if(tc.owner===null){
        if(tc.st==='olive'){if(Math.random()<.3){tc.st='land';tc.hist.push('개간');setCell(tgt,f.id,1,'개척지');}}
        else if(tc.st==='hill'){if(Math.random()<.18){tc.st='land';tc.hist.push('채석');setCell(tgt,f.id,1,'개척지');}}
        else if(tc.st==='land')setCell(tgt,f.id,1,'개척지');
      } else if(tc.owner!==f.id && Math.random()<.28){
        const att=1+Math.random()*3+f.size*.002+(f.golden?1:0);
        const def=tc.level+1+Math.random()*3+(tc.master?2:0);
        flashWar(tgt);
        if(att>def){
          const defF=facById(tc.owner);
          if(Math.random()<.28){
            fires.set(tgt,5);tc.hist.push('병화(兵火)');if(tc.hist.length>8)tc.hist.shift();dirty.add(tgt);
          }else{
            if(tc.master&&defF){f.prestige+=20;defF.prestige=Math.max(0,defF.prestige-20);
              tc.hist.push('약탈됨');}
            setCell(tgt,f.id,Math.max(1,tc.level-1),'병합됨');
          }
          if((tc.level>=3||warLog===0)&&defF){
            logEvent(`${f.name}이(가) ${defF.name}의 ${LV_LABEL[Math.max(1,tc.level)]||'영지'}를 병합했습니다.`,
              [['RIVALRY',`"${f.name}"→"${defF.name}"`,ref(tgt)]]);
            warLog=38;
          }
        }
      }
    }

    // 발전 (황금기엔 3배 + 걸작 확률↑)
    const ups=1+(f.size*.05|0);
    for(let u=0;u<ups;u++){
      const i=f.arr[Math.random()*f.arr.length|0];
      if(i===undefined||cells[i].owner!==f.id)continue;
      const c=cells[i];
      if(c.level<4&&Math.random()<.06*(f.golden?3:1)){
        c.level++; f.prestige+=c.level;
        c.hist.push(LV_LABEL[c.level]);if(c.hist.length>8)c.hist.shift();dirty.add(i);
        if(c.level===4&&warLog===0){
          logEvent(`${f.name}이(가) ${ref(i)}에 대성당을 헌당했습니다.`,[['CATHEDRAL',`"${f.name}"`,ref(i)]]);
          warLog=22;
        }
      }
      // 걸작 의뢰: 황금기 + 레벨3+
      if(c.level>=3&&!c.master&&Math.random()<(f.golden?.04:.006)){
        commissionAt(f,i);
      }
    }
  }

  // 무작위 사건
  const r=Math.random();
  if(!plague.size&&r<.0038){
    const big=cells.map((c,i)=>({c,i})).filter(o=>o.c.owner!==null&&o.c.level>=3);
    if(big.length){const o=big[Math.random()*big.length|0];plague.set(o.i,11);dirty.add(o.i);
      logEvent(`${ref(o.i)}에서 흑사병이 창궐했습니다.`,[['PLAGUE',ref(o.i)]]);}
  }else if(r>.9962&&factions.length){
    const f=factions[Math.random()*factions.length|0];f.golden=95;
    logEvent(`${f.name}의 황금기가 도래했습니다.`,[['GOLDEN.AGE',`"${f.name}"`,95]]);
  }else if(r>.993&&r<=.9962){
    const towns=cells.map((c,i)=>({c,i})).filter(o=>o.c.owner!==null&&o.c.level>=2);
    if(towns.length){const o=towns[Math.random()*towns.length|0];fires.set(o.i,6);dirty.add(o.i);
      logEvent(`${ref(o.i)}에 대화재가 번졌습니다.`,[['FIRE',ref(o.i)]]);}
  }
  if(factions.length<3&&Math.random()<.012&&factions.length<6){
    const f=spawnFaction(false);
    if(f)logEvent(`망명 거장들이 ${f.name}을(를) 일으켰습니다.`,[['MIGRATE',`"${f.name}"`]]);
  }

  for(const i of dirty)paint(i);
  dirty.clear();
  renderStatus();
  if(tickN%9===0)renderPanels();
}

function renderStatus(){
  document.title=`황금세기.xlsx - Excel (서기 ${year}년)`;
  statusbar.innerHTML=
    `<span class="seg">준비</span><span class="sep">|</span>`+
    `<span class="seg">서기 ${year}년</span><span class="sep">|</span>`+
    `<span class="seg">인구 ${pop.toLocaleString()}</span><span class="sep">|</span>`+
    `<span class="seg">가문 ${factions.length}</span><span class="sep">|</span>`+
    `<span class="seg">걸작 ★${masterCount}</span><span class="sep">|</span>`+
    `<span class="ev">${lastEvent}</span>`;
}

function renderPanels(){
  const sorted=[...factions].sort((a,b)=>b.prestige-a.prestige);
  let h='<h4>가문 명성</h4>';
  if(!sorted.length)h+='<div class="dead">— 모든 가문이 스러졌습니다 —</div>';
  for(const f of sorted){
    h+=`<div class="row"><span class="nm ${f.golden?'gld':''}"><span class="sw" style="background:${f.color}"></span>${f.name}${f.golden?' ✦':''}</span>`+
       `<span class="pr">${f.prestige}p · ${f.size}칸</span></div>`;
  }
  h+='<h4>지형 범례</h4>'+
     '<div class="key"><i>≈</i>지중해 <i>♣</i>올리브 <i>⌃</i>언덕</div>'+
     '<div class="key"><i>·</i>개척 <i>⌂</i>공방 <i>▦</i>광장</div>'+
     '<div class="key"><i>⛪</i>대성당 <i style="color:var(--gold)">★</i>걸작 <i>疫</i>역병 <i>火</i>화재</div>';
  if(obituaries.length){
    h+='<h4>최근 소멸</h4>';
    for(const o of obituaries.slice(-3))h+=`<div class="dead">† ${o.name} (${o.year})</div>`;
  }
  legend.innerHTML=h;
  document.getElementById('tab-lost').textContent=`소실기록 (${works.filter(w=>w.lost).length})`;
}

// ---------- 셀 클릭 = 그 땅의 역사 ----------
sheet.addEventListener('click',e=>{
  const t=e.target.closest('.cell'); if(!t)return;
  if(selected>=0&&cellEls[selected])cellEls[selected].classList.remove('sel');
  selected=+t.dataset.i; t.classList.add('sel');
  namebox.textContent=ref(selected);
  const c=cells[selected];
  const owner=c.owner!==null?facById(c.owner):null;
  const args=c.hist.map(x=>`"${x}"`);
  if(owner)args.unshift(`"${owner.name}"`);
  if(c.master)args.push('"★걸작 소장"');
  setFormula([['CHRONICLE',...args]]);
});

// ---------- 시트 탭 / 오버레이 ----------
const overlay=document.getElementById('overlay');
const ovList=document.getElementById('ovlist');
const ovTitle=document.getElementById('ov-title');
const ovSub=document.getElementById('ov-sub');
function openSheet(which){
  document.querySelectorAll('#tabs div').forEach(d=>d.classList.toggle('on',d.dataset.sheet===which));
  if(which==='map'){overlay.classList.remove('show');return;}
  overlay.classList.add('show');
  if(which==='chron'){
    ovTitle.textContent='연대기'; ovSub.textContent='=TIMELINE(서기 1390년 → 현재) · 최근 사건 순';
    const items=[...chronicle].slice(-220).reverse();
    ovList.innerHTML=items.length?items.map(e=>`<div class="ln"><span class="yr">${e.year}</span>${esc(e.msg)}</div>`).join('')
      :'<div class="empty">아직 기록된 사건이 없습니다.</div>';
  }else if(which==='works'){
    ovTitle.textContent='작품대장'; ovSub.textContent='=LEDGER(걸작) · 봉헌 순';
    const w=works.filter(x=>!x.lost).slice().reverse();
    ovList.innerHTML=w.length?w.map(x=>`<div class="ln"><span class="yr">${x.year}</span>`+
      `<span style="color:${x.color};font-weight:700">★ ${esc(x.art)}</span> — ${esc(x.house)} <span class="fn">@${x.ref}</span></div>`).join('')
      :'<div class="empty">아직 봉헌된 걸작이 없습니다. ‘걸작 의뢰’로 후원해 보세요.</div>';
  }else if(which==='lost'){
    ovTitle.textContent='소실기록'; ovSub.textContent='=NECROLOGY(소실 걸작 · 멸망 가문)';
    const lost=works.filter(x=>x.lost).slice().reverse();
    let html=lost.map(x=>`<div class="ln lost"><span class="yr">${x.year}</span>† ${esc(x.art)} <span class="fn">@${x.ref}</span></div>`).join('');
    html+=obituaries.slice().reverse().map(o=>`<div class="ln lost"><span class="yr">${o.year}</span>† ${esc(o.name)} 멸망 (최종 명성 ${o.prestige}p)</div>`).join('');
    ovList.innerHTML=html||'<div class="empty">아직 소실된 것이 없습니다.</div>';
  }
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
document.querySelectorAll('#tabs div').forEach(d=>d.addEventListener('click',()=>openSheet(d.dataset.sheet)));
document.getElementById('ovclose').addEventListener('click',()=>openSheet('map'));

// ---------- 리본 개입 버튼 ----------
let running=true, speed=1, timer=null;
const DELAYS={1:120,2:60,4:28};
function startTimer(){if(timer)clearInterval(timer);timer=setInterval(tick,DELAYS[speed]);}
document.getElementById('b-play').addEventListener('click',()=>{
  running=!running;
  document.getElementById('play-t').textContent=running?'일시정지':'재생';
  document.querySelector('#b-play .ic').textContent=running?'⏸':'▶';
  if(running)startTimer();else if(timer){clearInterval(timer);timer=null;}
});
document.getElementById('b-speed').addEventListener('click',()=>{
  speed=speed===1?2:speed===2?4:1;
  document.getElementById('speed-t').textContent='x'+speed;
  if(running)startTimer();
});
document.getElementById('b-spawn').addEventListener('click',()=>{
  if(factions.length>=8){logEvent('더 이상 들어설 자리가 없습니다.',[['SPAWN','"FULL"']]);renderStatus();return;}
  spawnFaction(true); renderStatus(); renderPanels();
});
document.getElementById('b-patron').addEventListener('click',()=>{
  if(!factions.length)return;
  // 명성 낮은 가문을 후원(밸런스 개입)
  const f=[...factions].sort((a,b)=>a.prestige-b.prestige)[0];
  f.golden=120;
  logEvent(`메디치 위원회가 ${f.name}의 황금기를 후원했습니다.`,[['GOLDEN.AGE',`"${f.name}"`,120]]);
  renderStatus(); renderPanels();
});
document.getElementById('b-comm').addEventListener('click',()=>{
  if(!factions.length)return;
  const f=factions[Math.random()*factions.length|0];
  if(!commission(f,true))logEvent('걸작을 봉헌할 영지가 부족합니다.',[['COMMISSION','"NO_SITE"']]);
  renderStatus(); renderPanels();
});
document.getElementById('b-plague').addEventListener('click',()=>{
  const big=cells.map((c,i)=>({c,i})).filter(o=>o.c.owner!==null&&o.c.level>=2);
  if(!big.length)return;
  const o=big[Math.random()*big.length|0];
  plague.set(o.i,11); dirty.add(o.i); paint(o.i);
  logEvent(`흑사병이 ${ref(o.i)}을(를) 덮쳤습니다.`,[['PLAGUE',ref(o.i)]]);
  renderStatus();
});

// ---------- 시작 ----------
function init(){
  ({COLS,ROWS}=dims()); N=COLS*ROWS;
  buildGrid(); genNoiseGrid(); genWorld();
  factions=[];obituaries=[];works=[];chronicle=[];plague=new Map();fires=new Map();dirty.clear();
  nameIdx=0;year=1390;masterCount=0;selected=-1;
  for(let i=0;i<N;i++)paint(i);
  setFormula([['SIM.RENAISSANCE',`$A$1:$${colName(COLS-1)}$${ROWS}`,'"피렌체, 1390년"']]);
  spawnFaction(true);spawnFaction(true);spawnFaction(true);
  renderStatus(); renderPanels();
  startTimer();
}
init();

// 리사이즈: 그리드 재구성(시뮬 재시작)
let rzT=null;
addEventListener('resize',()=>{
  clearTimeout(rzT);
  rzT=setTimeout(()=>{
    const d=dims();
    if(d.COLS!==COLS||d.ROWS!==ROWS){
      if(timer){clearInterval(timer);timer=null;}
      init();
      if(!running){running=true;document.getElementById('play-t').textContent='일시정지';document.querySelector('#b-play .ic').textContent='⏸';}
    }
  },260);
});
})();
</script>
