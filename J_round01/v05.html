<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>사막교역로.xlsx - Excel</title>
<style>
  :root{
    --green:#107c41; --grid:#d8d8d2; --gridlt:#ececea;
    --sand:#f7eccb; --sand2:#f1e0b0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#d6d6cf;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;
    font-size:12px;color:#222;user-select:none;-webkit-tap-highlight-color:transparent}

  /* ---------- Excel chrome ---------- */
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  #title{margin-left:8px;color:#3b3b3b;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qa{margin-left:auto;color:#888;font-size:11px;letter-spacing:1px}

  #ribbon{background:#fff;border-bottom:1px solid #e1e1e1}
  #menubar{height:28px;display:flex;align-items:flex-end;padding:0 12px;gap:16px;
    font-size:12px;color:#444;overflow:hidden}
  #menubar b{color:var(--green);border-bottom:2.5px solid var(--green);padding:5px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:5px 2px;cursor:default}
  #ribrow{height:62px;display:flex;align-items:center;gap:0;padding:0 8px;background:#fbfbfb;
    border-top:1px solid #f0f0f0;overflow:hidden}
  .rgrp{display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    height:54px;padding:4px 10px;border-right:1px solid #ededed;min-width:60px}
  .rgrp .btns{display:flex;gap:8px;align-items:flex-end;flex:1}
  .rbtn{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:#3b3b3b;
    padding:3px 5px;border-radius:4px;transition:background .12s;min-width:42px}
  .rbtn:hover{background:#e8f2eb}
  .rbtn.act{background:#d6ebdd;outline:1px solid #9ccfb0}
  .rbtn .ic{font-size:18px;line-height:1}
  .rbtn .lb{font-size:10px;color:#555;white-space:nowrap}
  .rgrp .glab{font-size:9.5px;color:#999;margin-top:2px}

  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px;flex:0 0 auto}
  #namebox{width:74px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;gap:5px}
  #namebox .car{font-size:9px;color:#aaa}
  #fxwrap{width:54px;height:100%;display:flex;align-items:center;justify-content:center;gap:6px;
    border-right:1px solid #eee}
  #fxwrap .x{color:#c33;cursor:pointer}.fxchk{color:#5a5;}
  #fx{color:#888;font-style:italic;font-family:Georgia,serif}
  #formula{flex:1;padding:0 10px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #main{position:relative;flex:1;overflow:hidden;background:#fff;display:flex}

  /* ---------- sheet ---------- */
  #sheetwrap{flex:1;position:relative;overflow:hidden;background:#fff}
  #sheet{display:grid;background:#fff}
  .hd{background:#f5f5f3;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);
    display:flex;align-items:center;justify-content:center;color:#5a5a5a;font-size:10.5px;
    font-variant-numeric:tabular-nums}
  .hd.hi{background:#cfe7d8;color:#0b5d31;font-weight:600}
  .cell{border-right:1px solid var(--gridlt);border-bottom:1px solid var(--gridlt);
    position:relative;display:flex;align-items:center;justify-content:center;
    font-size:12px;overflow:hidden;cursor:cell;line-height:1}
  .cell .gly{line-height:1;display:block}
  .cell.sel{outline:2px solid var(--green);outline-offset:-2px;z-index:4}
  .cell .sub{position:absolute;right:1px;bottom:0;font-size:7px;color:rgba(0,0,0,.4);font-weight:700;line-height:1}
  @keyframes raidf{0%,100%{box-shadow:inset 0 0 0 2px #b91c1c}50%{box-shadow:inset 0 0 0 2px #fca5a5}}
  .raid{animation:raidf .3s 3}
  @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .4s ease-out}

  /* HUD panel docked right */
  #hud{width:212px;flex:0 0 212px;border-left:1px solid #e4e4e0;background:#fcfbf7;
    display:flex;flex-direction:column;font-size:11px;overflow:hidden}
  #hud .hh{background:#107c41;color:#eafff2;padding:5px 10px;font-weight:600;font-size:11px;
    display:flex;justify-content:space-between;align-items:center}
  #hud .body{padding:8px 10px;overflow-y:auto;line-height:1.55;flex:1}
  #hud h4{margin:9px 0 3px;font-size:10.5px;color:#7a6a1f;border-bottom:1px dashed #ddd2a8;padding-bottom:2px}
  #hud h4:first-child{margin-top:0}
  .frow{display:flex;align-items:center;gap:6px;padding:1px 0}
  .frow .sw{width:10px;height:10px;border-radius:2px;flex:0 0 auto;border:1px solid rgba(0,0,0,.15)}
  .frow .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .frow .val{color:#555;font-variant-numeric:tabular-nums;font-size:10px}
  .frow.gold .nm{color:#b8860b;font-weight:600}
  .dead{color:#a08b4a;font-size:10px}
  .price{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;padding:1px 0;font-size:10.5px}
  .price b{font-weight:600}
  .up{color:#107c41}.down{color:#c0392b}
  .legend-mini{display:flex;flex-wrap:wrap;gap:3px 9px;font-size:10px;color:#555;margin-top:2px}
  .legend-mini span b{font-size:12px}

  /* status + tabs */
  #tabsbar{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:8px;
    border-top:1px solid #d4d4d4;font-size:11.5px;gap:2px;flex:0 0 auto}
  #tabsbar .nav{color:#999;padding:0 6px;align-self:center}
  .tab{padding:3px 13px;border:1px solid #d4d4d4;border-bottom:none;background:#e8e8e6;color:#555;
    cursor:pointer;white-space:nowrap}
  .tab.on{background:#fff;color:var(--green);font-weight:600;border-top:2px solid var(--green);padding-top:2px}
  #statusbar{height:24px;background:var(--green);color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;flex:0 0 auto;overflow:hidden}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .scroll{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #statusbar .zoom{margin-left:auto;opacity:.85;white-space:nowrap}

  /* alternate sheets (ledger / chronicle / ruins) */
  #docview{flex:1;overflow:auto;background:#fff;display:none}
  #docview table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
  #docview th,#docview td{border:1px solid var(--gridlt);padding:3px 8px;text-align:left;white-space:nowrap}
  #docview thead th{background:#f5f5f3;color:#444;position:sticky;top:0;border-bottom:1px solid var(--grid);z-index:2}
  #docview td.r{text-align:right}
  #docview tr:nth-child(even) td{background:#fcfcfa}
  #docview .cap{padding:8px 12px;color:#777;font-style:italic;border-bottom:1px solid #eee;background:#fafaf7}

  .toast{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:30;
    background:rgba(40,30,10,.92);color:#ffe9b0;padding:6px 14px;border-radius:4px;font-size:11.5px;
    box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
  .toast.show{opacity:1}

  /* mobile */
  @media (max-width:560px){
    #ribrow{display:none}
    #hud{position:absolute;right:0;top:0;bottom:0;z-index:20;width:74vw;max-width:280px;
      box-shadow:-4px 0 18px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .2s}
    #hud.open{transform:translateX(0)}
    #menubar{gap:11px;font-size:11px}
    #namebox{width:62px}
    #statusbar .zoom{display:none}
    #hudtoggle{display:flex !important}
  }
  #hudtoggle{display:none;position:absolute;right:8px;bottom:34px;z-index:25;width:40px;height:40px;
    border-radius:50%;background:var(--green);color:#fff;align-items:center;justify-content:center;
    font-size:18px;box-shadow:0 3px 10px rgba(0,0,0,.3);cursor:pointer}
</style>

<body>
<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <div id="title">사막교역로.xlsx - Excel</div>
  <div class="qa">자동 저장 ●  ↶ ↷</div>
</div>

<div id="ribbon">
  <div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>오아시스</i></div>
  <div id="ribrow">
    <div class="rgrp">
      <div class="btns">
        <div class="rbtn" data-tool="inspect"><div class="ic">⌕</div><div class="lb">조사</div></div>
        <div class="rbtn" data-tool="pause"><div class="ic">‖</div><div class="lb">정지</div></div>

        <div class="rbtn" data-tool="storm"><div class="ic" style="color:#6b4f1d">風</div><div class="lb">모래폭풍</div></div>

        리본 도구를 고르고 <b style="color:#107c41">셀을 클릭</b>해 사막에 개입하세요.<br>

<div id="fbar">
  <div id="namebox"><span id="nb">A1</span><span class="car">▾</span></div>
  <div id="fxwrap"><span class="x">✕</span><span class="fxchk">✓</span><span id="fx">fx</span></div>

</div>

<div id="main">
  <div id="sheetwrap">
    <div id="sheet"></div>
    <div id="docview"></div>
    <div class="toast" id="toast"></div>
  </div>
  <div id="hud">
    <div class="hh"><span>사막 통제실</span><span id="hud-clock">계절 1</span></div>

</div>

<div id="tabsbar">
  <span class="nav">◀ ▶</span>
  <div class="tab on" data-sheet="map">사막지도</div>

<div id="statusbar">
  <span class="scroll" id="status">준비</span>
  <span class="zoom" id="zoom">합계: — &nbsp;&nbsp; ⊟ ━━●━━ ＋ 100%</span>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const sheet=$('#sheet'), fmla=$('#formula'), nb=$('#nb'), status=$('#status'),
      hudBody=$('#hud-body'), hudClock=$('#hud-clock'), docview=$('#docview'),
      toastEl=$('#toast'), zoomEl=$('#zoom');

/* ----- geometry: fit grid to viewport ----- */
const CW = 30, CH = 22, ROWHEAD = 40;
function dims(){
  const sw=$('#sheetwrap').clientWidth, sh=$('#sheetwrap').clientHeight;
  const cols=Math.max(16,Math.min(48,Math.floor((sw-ROWHEAD)/CW)));
  const rows=Math.max(12,Math.min(40,Math.floor((sh-22)/CH)));
  return {cols,rows};
}
let COLS, ROWS, N;

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+((i/COLS|0)+1);}
const RND=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];

/* ----- terrain types -----
   sand   = 빈 사막 (low base)
   dune   = 모래언덕 (impassable-ish, blocks)
   rock   = 암반 고원
   well   = 우물 (small water)
   oasis  = 오아시스 (water + growth anchor)
*/
let cells=[], cellEls=[];

function buildGrid(){
  const d=dims(); COLS=d.cols; ROWS=d.rows; N=COLS*ROWS;
  sheet.style.gridTemplateColumns=`${ROWHEAD}px repeat(${COLS},${CW}px)`;
  sheet.style.gridAutoRows=CH+'px';
  sheet.innerHTML='';
  cellEls=new Array(N);
  const frag=document.createDocumentFragment();
  const corner=document.createElement('div');corner.className='hd';corner.textContent='◢';frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd';h.textContent=colName(c);h.dataset.col=c;frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd';h.textContent=r+1;h.dataset.row=r;frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d2=document.createElement('div');d2.className='cell';const idx=r*COLS+c;d2.dataset.i=idx;
      const gly=document.createElement('span');gly.className='gly';d2.appendChild(gly);
      const sub=document.createElement('span');sub.className='sub';d2.appendChild(sub);
      cellEls[idx]=d2;frag.appendChild(d2);
    }
  }
  sheet.appendChild(frag);
}

/* value noise for terrain */
function genTerrain(){
  const GW=8,GH=6,gz=[];for(let i=0;i<GW*GH;i++)gz[i]=Math.random();
  const noise=(x,y)=>{
    const fx=x/COLS*(GW-1),fy=y/ROWS*(GH-1);
    const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
    const a=gz[y0*GW+x0],b=gz[y0*GW+Math.min(GW-1,x0+1)],
          c=gz[Math.min(GH-1,y0+1)*GW+x0],d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
    return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
  };
  cells=new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS,y=i/COLS|0;
    const v=noise(x,y)+(Math.random()-.5)*.12;
    let t='sand',hist=['모래뿐인 황야'];
    if(v>.70){t='dune';hist=['끝없는 모래언덕'];}
    else if(v<.24){t='rock';hist=['메마른 암반 고원'];}
    cells[i]={t,owner:null,lvl:0,water:0,hist,ruinT:0,prod:0};
  }
  // sprinkle natural oases & wells in sandy regions
  let oasisCount=0;
  for(let tries=0;tries<N&&oasisCount< Math.max(3,N*0.012);tries++){
    const i=Math.random()*N|0;
    if(cells[i].t==='sand'){
      cells[i].t='oasis';cells[i].water=3;cells[i].hist=['태고의 오아시스'];
      oasisCount++;
      for(const k of nbrs(i)) if(cells[k].t==='sand'&&Math.random()<.4){cells[k].t='well';cells[k].water=1;cells[k].hist=['샘이 솟는 땅'];}
    }
  }
}

function nbrs(i){const x=i%COLS,y=i/COLS|0,o=[];
  if(x>0)o.push(i-1);if(x<COLS-1)o.push(i+1);if(y>0)o.push(i-COLS);if(y<ROWS-1)o.push(i+COLS);return o;}
function diag(i){const x=i%COLS,y=i/COLS|0,o=[...nbrs(i)];
  if(x>0&&y>0)o.push(i-COLS-1);if(x<COLS-1&&y>0)o.push(i-COLS+1);
  if(x>0&&y<ROWS-1)o.push(i+COLS-1);if(x<COLS-1&&y<ROWS-1)o.push(i+COLS+1);return o;}

/* ----- city-states (desert polities) ----- */
const NAMES=['카르타고 상회','사프란 칸국','금빛 모래길','청옥 오아시스','대상의 맹약',
  '소금 군주국','붉은 사구 부족','달빛 카라반','천 개의 우물','향료의 길','검은 천막 연맹','진주 항로'];
const COLORS=['#c2410c','#1d4ed8','#b45309','#0d9488','#7c3aed','#0e7490',
  '#be123c','#4338ca','#15803d','#a16207','#52525b','#9d174d'];
const SUFFIX=['','읍','진','관','보','성'];
let nameOrder=[];
let factions=[], obituaries=[], ledger=[], caravans=[];
let season=1, tickN=0, pop=0, lastEvent='사막에 첫 바람이 불었습니다.';
let storms=new Map();   // idx -> remaining ticks
let selected=-1, paused=false, tool='inspect';
const dirty=new Set();

/* goods market */
const GOODS=[
  {k:'소금',  price:8,  base:8,  trend:0},
  {k:'향료',  price:26, base:26, trend:0},
  {k:'비단',  price:40, base:40, trend:0},
  {k:'대추야자',price:5, base:5,  trend:0},
];

function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}
function facById(id){return factions.find(f=>f.id===id);}

let idSeq=0;
function foundCity(at,announce){
  // choose seed: prefer near oasis/well/sand, never dune/rock heavy
  let i=at;
  if(i==null){
    for(let t=0;t<400;t++){
      const j=Math.random()*N|0,c=cells[j];
      if((c.t==='oasis'||c.t==='well'||c.t==='sand')&&c.owner===null){i=j;break;}
    }
  }
  if(i==null)return null;
  if(cells[i].owner!==null)return null;
  if(!nameOrder.length)nameOrder=NAMES.map((_,k)=>k).sort(()=>Math.random()-.5);
  const ni=nameOrder.pop();
  const f={id:idSeq++,name:NAMES[ni%NAMES.length],color:COLORS[ni%COLORS.length],
    capital:i,gold:RND(40,90)|0,golden:0,size:0,arr:[],routes:0,founded:season};
  cells[i].t=cells[i].t==='dune'||cells[i].t==='rock'?'sand':cells[i].t;
  setCell(i,f.id,3,'대상들이 천막을 세웠다 (수도)');
  cells[i].capital=true;
  factions.push(f);
  if(announce){
    logEvent(`${f.name}이(가) ${ref(i)}에 깃발을 세웠습니다.`,`=FOUND("${f.name}", ${ref(i)})`);
    cellEls[i].classList.add('pop');setTimeout(()=>cellEls[i].classList.remove('pop'),420);
  }
  return f;
}

function setCell(i,owner,lvl,hist){
  const c=cells[i];
  c.owner=owner;c.lvl=lvl;
  if(c.t==='dune'||c.t==='rock')c.t='sand';
  if(hist){c.hist.push(hist);if(c.hist.length>8)c.hist.shift();}
  dirty.add(i);
}

/* level glyphs: 1 천막, 2 시장, 3 성채, 4 대도시(왕성) */
const LV_GLYPH=['','屯','市','城','都'];
const LV_LABEL=['','천막촌','시장 거점','성채 도시','대상의 왕도'];

function paint(i){
  const c=cells[i],el=cellEls[i];
  const gly=el.children[0], sub=el.children[1];
  let bg='',tx='',col='#222',w='',shadow='';
  if(storms.has(i)){bg='#cdbb95';tx='風';col='#6b4f1d';w='700';}
  else switch(c.t){
    case 'dune': bg='#f1dca0'; tx='︵'; col='#caa84a'; break;
    case 'rock': bg='#e7ded0'; tx='△'; col='#9a8c6c'; break;
    case 'oasis':bg='#cdeccf'; tx='泉'; col='#1f7a3a'; break;
    case 'well': bg='#dff0f4'; tx='≈'; col='#3e9ab0'; break;
    case 'ruin': bg='#e4e0d8'; tx='墟'; col='#9a8f7a'; break;
    default: bg='#f9f0d6'; // sand
  }
  let showSub='';
  if(c.owner!==null && c.t!=='ruin' && !storms.has(i)){
    const f=facById(c.owner);
    if(f){
      bg=hexA(f.color,.16+c.lvl*.18);
      tx=LV_GLYPH[c.lvl]||'⛺'; col=f.color; w=c.lvl>=3?'700':'600';
      if(c.water>0) shadow='inset 0 0 0 1.5px '+hexA('#2aa9c4',.55);
      if(c.lvl>=1) showSub=c.lvl;
    }
  }
  gly.textContent=tx;
  sub.textContent=showSub;
  el.style.background=bg;el.style.color=col;el.style.fontWeight=w;el.style.boxShadow=shadow;
}

/* ----- caravans: little glyphs that travel oasis->oasis carrying goods ----- */
function spawnCaravan(from,faction,good){
  // find a target settlement of any faction (trade) — prefer markets/cities
  const targets=[];
  for(let i=0;i<N;i++){if(cells[i].owner!==null&&cells[i].lvl>=2&&i!==from&&cells[i].t!=='ruin')targets.push(i);}
  if(!targets.length)return;
  const to=pick(targets);
  caravans.push({pos:from,to,from,faction:faction?faction.id:null,good,steps:0,el:null});
}
function caravanGlyph(){const d=document.createElement('div');return d;}

/* overlay layer for caravans (use absolutely positioned glyph on grid) */
const carLayer=document.createElement('div');
carLayer.style.cssText='position:absolute;left:0;top:0;pointer-events:none;z-index:5';
$('#sheetwrap').appendChild(carLayer);
function cellRect(i){
  const x=i%COLS,y=i/COLS|0;
  return {left:ROWHEAD+x*CW, top:y*CH, w:CW, h:CH};
}
function moveCaravans(){
  for(let k=caravans.length-1;k>=0;k--){
    const cv=caravans[k];
    cv.steps++;
    // step toward target avoiding water-block? caravans can cross sand/owned, slowed by dunes
    const cx=cv.pos%COLS,cy=cv.pos/COLS|0,tx=cv.to%COLS,ty=cv.to/COLS|0;
    let nx=cx,ny=cy;
    if(Math.abs(tx-cx)>=Math.abs(ty-cy)) nx+=Math.sign(tx-cx); else ny+=Math.sign(ty-cy);
    if(Math.random()<.25){ if(ny!==ty)ny+=Math.sign(ty-cy); else if(nx!==tx)nx+=Math.sign(tx-cx);}
    const ni=ny*COLS+nx;
    // storm kills caravan
    if(storms.has(ni)){
      destroyCaravan(cv,k,'모래폭풍에 삼켜진 대상');
      continue;
    }
    cv.pos=ni;
    if(cv.pos===cv.to || cv.steps>COLS+ROWS){
      // arrived: trade -> revenue, route count, market move
      const ff=facById(cv.faction); const dest=cells[cv.to];
      if(ff){
        const g=GOODS.find(x=>x.k===cv.good)||GOODS[0];
        const profit=(g.price*RND(.6,1.4))|0;
        ff.gold+=profit; ff.routes++;
        g.price=Math.max(2, g.price + RND(-1,3)); g.trend=g.price-g.base;
        const destF=dest.owner!==null?facById(dest.owner):null;
        if(destF&&destF.id!==ff.id) destF.gold+=(profit*.3)|0;
        ledger.unshift({s:season,from:ff.name,to:destF?destF.name:'사라진 시장',
          good:cv.good,qty:(profit/Math.max(2,g.price)*4|0)+1,gold:profit,ref:ref(cv.to)});
        if(ledger.length>140)ledger.pop();
        if(cv.steps>2 && Math.random()<.5)
          logEvent(`${ff.name}의 대상이 ${ref(cv.to)}에 ${cv.good}을(를) 팔아 ${profit}금을 벌었습니다.`,
            `=TRADE("${cv.good}", ${ref(cv.from)}→${ref(cv.to)}, +${profit}금)`);
      }
      removeCaravanEl(cv); caravans.splice(k,1);
    }
  }
  renderCaravans();
}
function destroyCaravan(cv,k,msg){
  const ff=facById(cv.faction);
  if(ff&&Math.random()<.6) ff.gold=Math.max(0,ff.gold-12);
  if(Math.random()<.5) logEvent(`${ff?ff.name+'의 ':''}대상이 길 위에서 사라졌습니다.`,`=LOST(${ref(cv.pos)}, "${msg}")`);
  removeCaravanEl(cv); caravans.splice(k,1);
}
function removeCaravanEl(cv){if(cv.el&&cv.el.parentNode)cv.el.parentNode.removeChild(cv.el);}
function renderCaravans(){
  for(const cv of caravans){
    if(!cv.el){cv.el=document.createElement('div');
      cv.el.style.cssText='position:absolute;width:14px;height:14px;border-radius:50%;'+
        'transition:left .12s linear,top .12s linear;display:flex;align-items:center;justify-content:center;'+
        'font-size:10px;font-weight:700;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);z-index:6';
      const f=facById(cv.faction);
      cv.el.style.background=f?f.color:'#8a6d3b';
      cv.el.textContent='駝'; cv.el.title='대상';
      carLayer.appendChild(cv.el);}
    const r=cellRect(cv.pos);
    cv.el.style.left=(r.left+r.w/2-7)+'px';
    cv.el.style.top=(r.top+r.h/2-7)+'px';
  }
}

function logEvent(msg,formula){
  lastEvent=`계절 ${season}: ${msg}`;
  if(formula)fmla.textContent=formula;
}
function flashRaid(i){const el=cellEls[i];el.classList.add('raid');setTimeout(()=>el.classList.remove('raid'),900);}

let toastT=null;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),1600);}

/* ----- the tick ----- */
let raidCooldown=0;
function tick(){
  if(paused)return;
  tickN++; season++;
  if(raidCooldown>0)raidCooldown--;

  // recount
  for(const f of factions){f.arr.length=0;f.size=0;}
  pop=0;const PW=[0,30,110,360,900];
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.t==='ruin'&&--c.ruinT<=0){c.t='sand';c.hist.push('모래가 다시 덮었다');dirty.add(i);}
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){f.arr.push(i);f.size++;pop+=PW[c.lvl];}
      else{c.owner=null;c.lvl=0;c.capital=false;dirty.add(i);}
    }
  }

  // collapse
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      obituaries.unshift({name:f.name,season,routes:f.routes,gold:f.gold|0,
        cause:f.gold<=0?'재정 파탄':'영토 상실'});
      logEvent(`${f.name}이(가) 모래 속으로 사라졌습니다.`,`=COLLAPSE("${f.name}", 계절${season})`);
      factions.splice(k,1);
    }
  }

  // storms spread & decay; bury settlements
  for(const [i,t] of [...storms]){
    if(Math.random()<.18){
      for(const n of diag(i)) if(!storms.has(n)&&cells[n].t!=='ruin'&&Math.random()<.5){storms.set(n,RND(4,8)|0);dirty.add(n);}
    }
    if(t<=1){
      storms.delete(i);
      const c=cells[i];
      if(c.owner!==null){
        // settlement damaged/buried
        if(c.lvl<=1||Math.random()<.4){
          c.owner=null;c.lvl=0;c.capital=false;c.t='ruin';c.ruinT=RND(90,180)|0;
          c.hist.push('모래폭풍에 묻혔다');
        }else{c.lvl=Math.max(1,c.lvl-1);c.hist.push('폭풍에 시장이 무너졌다');}
        if(c.hist.length>8)c.hist.shift();
      } else if(c.t!=='oasis'&&c.t!=='well'&&Math.random()<.3){c.t='dune';c.hist.push('새 모래언덕이 생겼다');}
      dirty.add(i);
    }else storms.set(i,t-1);
  }

  // faction behaviour
  for(const f of factions){
    if(f.golden>0)f.golden--;
    if(f.size===0)continue;
    f.gold+=Math.max(1,(f.size*0.4)|0)+(f.golden?4:0);   // upkeep income from territory

    // EXPAND along oases & sand (caravan reach)
    const reach=1+(f.size*.08|0)+(f.golden?2:0);
    for(let a=0;a<reach;a++){
      const src=pick(f.arr); if(src===undefined||cells[src].owner!==f.id)continue;
      const opts=nbrs(src);const tgt=pick(opts);const tc=cells[tgt];
      if(storms.has(tgt))continue;
      if(tc.t==='dune'){ if(Math.random()<.10&&f.gold>15){f.gold-=8;tc.t='sand';tc.hist.push('상단이 길을 텄다');setCell(tgt,f.id,1,'천막촌');} continue; }
      if(tc.owner===null){
        if(tc.t==='oasis'){ if(f.gold>10){f.gold-=6;setCell(tgt,f.id,2,'오아시스를 차지하다');tc.capital=false; logEventMaybe(f,`${f.name}이(가) ${ref(tgt)} 오아시스를 차지했습니다.`,`=CLAIM("${f.name}", ${ref(tgt)}, 오아시스)`,.4);} }
        else if(tc.t==='well'){ setCell(tgt,f.id,1,'우물가 정착'); }
        else if(tc.t==='rock'){ if(Math.random()<.12)setCell(tgt,f.id,1,'고원 초소'); }
        else setCell(tgt,f.id,1,'천막촌'); // sand
      } else if(tc.owner!==f.id && Math.random()<.26){
        // raid / conquest
        const att=RND(1,3)+f.size*.004+(f.golden?1.2:0)+ (f.gold>50?.6:0);
        const def=tc.lvl+RND(1,3)+(cells[tgt].capital?2:0);
        flashRaid(tgt);
        if(att>def){
          const defF=facById(tc.owner);
          f.gold+=8;
          if(Math.random()<.35){
            cells[tgt].owner=null;cells[tgt].lvl=0;cells[tgt].capital=false;cells[tgt].t='ruin';cells[tgt].ruinT=RND(70,150)|0;
            cells[tgt].hist.push('약탈로 폐허가 되다');dirty.add(tgt);
          }else setCell(tgt,f.id,Math.max(1,tc.lvl-1),'점령된 시장');
          if((tc.lvl>=3||raidCooldown===0)&&defF){
            logEvent(`${f.name}이(가) ${defF.name}의 ${LV_LABEL[Math.max(1,tc.lvl)]||'영토'}(${ref(tgt)})를 약탈했습니다.`,
              `=RAID("${f.name}"→"${defF.name}", ${ref(tgt)})`);
            raidCooldown=30;
          }
        }
      }
    }

    // DEVELOP (needs gold; near water grows faster)
    const ups=1+(f.size*.05|0);
    for(let u=0;u<ups;u++){
      const i=pick(f.arr); if(i===undefined||cells[i].owner!==f.id)continue;
      const c=cells[i]; if(c.lvl>=4)continue;
      let waterBoost=0; for(const n of nbrs(i)) if(cells[n].t==='oasis'||cells[n].t==='well'||cells[n].water>0)waterBoost+=.5;
      const cost=[0,6,14,30,0][c.lvl+1];
      if(f.gold>=cost && Math.random()<(.05+waterBoost*.04)*(f.golden?2.2:1)){
        f.gold-=cost; c.lvl++;
        c.hist.push('번영해 '+LV_LABEL[c.lvl]+'(으)로 성장');if(c.hist.length>8)c.hist.shift();dirty.add(i);
        if(c.lvl===4&&raidCooldown===0){
          logEvent(`${f.name}의 ${ref(i)}이(가) 대상의 왕도로 번영했습니다.`,`=METROPOLIS("${f.name}", ${ref(i)})`);
          cellEls[i].classList.add('pop');setTimeout(()=>cellEls[i].classList.remove('pop'),420);
          raidCooldown=20;
        }
      }
    }

    // DISPATCH caravans from markets+
    if(f.gold>20 && Math.random()<.10+ (f.golden?.1:0)){
      const markets=f.arr.filter(i=>cells[i].lvl>=2);
      if(markets.length){f.gold-=6;spawnCaravan(pick(markets),f,pick(GOODS).k);}
    }
  }

  // market drift back to base
  for(const g of GOODS){g.price+= (g.base-g.price)*0.04 + RND(-.6,.6); g.price=Math.max(2,g.price); g.trend=g.price-g.base;}

  // random events
  const rr=Math.random();
  if(rr<.018){ // sandstorm onset
    const j=Math.random()*N|0;
    if(cells[j].t!=='ruin'&&!storms.has(j)){storms.set(j,RND(6,12)|0);dirty.add(j);
      logEvent(`${ref(j)} 부근에서 모래폭풍이 일었습니다.`,`=SANDSTORM(${ref(j)})`);}
  } else if(rr>.992){ // a well dries up
    const wells=[];for(let i=0;i<N;i++)if(cells[i].t==='well')wells.push(i);
    if(wells.length){const i=pick(wells);cells[i].t='sand';cells[i].water=0;cells[i].hist.push('우물이 말랐다');dirty.add(i);
      logEvent(`${ref(i)}의 우물이 말라붙었습니다.`,`=DRY(${ref(i)})`);}
  } else if(rr>.986&&rr<=.992&&factions.length){ // golden age
    const f=pick(factions);f.golden=70;f.gold+=40;
    logEvent(`${f.name}에 교역의 황금기가 찾아왔습니다.`,`=GOLDEN_AGE("${f.name}", 70계절)`);
  } else if(rr>.980&&rr<=.986){ // new oasis blooms after rain
    const sands=[];for(let i=0;i<N;i++)if(cells[i].t==='sand'&&cells[i].owner===null)sands.push(i);
    if(sands.length){const i=pick(sands);cells[i].t='oasis';cells[i].water=3;cells[i].hist.push('비가 내려 오아시스가 피었다');dirty.add(i);
      logEvent(`${ref(i)}에 오아시스가 새로 솟아났습니다.`,`=BLOOM(${ref(i)})`);}
  }
  // migration: keep world alive
  if(factions.length<3 && Math.random()<.05){
    const f=foundCity(null,false);
    if(f)logEvent(`사막 너머에서 ${f.name}이(가) 이주해 왔습니다.`,`=MIGRATE("${f.name}")`);
  }

  moveCaravans();

  // draw
  for(const i of dirty)paint(i);
  dirty.clear();

  // status + hud
  renderStatus();
  if(tickN%6===0)renderHud();
  if(tickN%14===0 && activeSheet!=='map') renderSheet(activeSheet);
}
function logEventMaybe(f,msg,formula,p){if(Math.random()<p)logEvent(msg,formula);}

  status.innerHTML=`준비<span class="sep">|</span>계절 ${season}<span class="sep">|</span>`+
    `사막 인구 ${pop.toLocaleString()}<span class="sep">|</span>도시국가 ${factions.length}곳<span class="sep">|</span>`+
    `대상 ${caravans.length}대<span class="sep">|</span>${lastEvent}`;
  zoomEl.innerHTML=`총 교역량: ${ledger.length}건 &nbsp;&nbsp; ⊟ ━━●━━ ＋ 100%`;

}

     '<span><b>城</b> 성채</span><span><b>都</b> 왕도</span>'+
     '<span><b style="color:#fff;background:#8a6d3b;border-radius:50%;padding:0 3px">駝</b> 대상</span>'+
     '<span><b style="color:#6b4f1d">風</b> 폭풍</span>'+

  if(obituaries.length){
    h+='<h4>폐허기록 (최근)</h4>';

/* chronicle feed mirrors logEvent */
let chronicle=[];
const _logEvent=logEvent;

/* ----- interaction: ribbon tools + cell click ----- */
function setTool(t){
  tool=t;
  document.querySelectorAll('.rbtn').forEach(b=>b.classList.toggle('act',b.dataset.tool===t));
  if(t==='pause'){paused=!paused;toast(paused?'시뮬레이션 정지':'시뮬레이션 재개');tool='inspect';
    document.querySelectorAll('.rbtn').forEach(b=>b.classList.remove('act'));renderStatus();return;}
  const m={inspect:'조사 모드 — 셀을 클릭해 역사를 보세요',well:'우물 파기 — 사막 셀 클릭',
    oasis:'오아시스 — 사막 셀 클릭',caravan:'대상 파견 — 시장/도시 클릭',
    storm:'모래폭풍 소환 — 아무 셀 클릭',found:'건국 — 빈 사막/오아시스 클릭',raid:'약탈 명령 — 적 영토 클릭'};
  toast(m[t]||'');
}
document.querySelectorAll('.rbtn').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));

function applyTool(i){
  const c=cells[i];
  switch(tool){
    case 'well':
      if(c.owner===null && (c.t==='sand'||c.t==='dune'||c.t==='rock')){c.t='well';c.water=1;c.hist.push('당신이 우물을 팠다');dirty.add(i);
        logEvent(`${ref(i)}에 우물을 팠습니다.`,`=DIG.WELL(${ref(i)})`);toast('우물을 팠습니다');}
      else toast('여기엔 우물을 팔 수 없습니다');break;
    case 'oasis':
      if(c.owner===null && c.t!=='ruin'){c.t='oasis';c.water=3;c.hist.push('당신이 오아시스를 피웠다');dirty.add(i);
        for(const n of nbrs(i))if(cells[n].t==='sand'&&Math.random()<.4){cells[n].t='well';cells[n].water=1;dirty.add(n);}
        logEvent(`${ref(i)}에 오아시스를 만들었습니다.`,`=BLOOM.OASIS(${ref(i)})`);toast('오아시스가 피었습니다');}
      else toast('여기엔 오아시스를 만들 수 없습니다');break;
    case 'storm':
      storms.set(i,RND(7,13)|0);dirty.add(i);
      logEvent(`당신이 ${ref(i)}에 모래폭풍을 불러왔습니다.`,`=SUMMON.STORM(${ref(i)})`);toast('모래폭풍을 소환했습니다');break;
    case 'found':
      if(c.owner===null && c.t!=='ruin' && c.t!=='dune'){
        const f=foundCity(i,true); toast(f?f.name+' 건국!':'여기엔 건국할 수 없습니다');}
      else toast('여기엔 건국할 수 없습니다');break;
    case 'caravan':
      if(c.owner!==null && c.lvl>=2){const f=facById(c.owner);spawnCaravan(i,f,pick(GOODS).k);
        logEvent(`당신이 ${ref(i)}에서 대상을 파견했습니다.`,`=DISPATCH(${ref(i)}, "${pick(GOODS).k}")`);toast('대상을 파견했습니다');}
      else toast('시장 이상의 도시에서만 파견됩니다');break;
    case 'raid':
      if(c.owner!==null){const f=facById(c.owner);flashRaid(i);
        if(c.lvl<=1||Math.random()<.5){cells[i].owner=null;cells[i].lvl=0;cells[i].capital=false;cells[i].t='ruin';cells[i].ruinT=RND(80,160)|0;cells[i].hist.push('당신의 명령으로 약탈당했다');}
        else{cells[i].lvl--;cells[i].hist.push('약탈로 쇠퇴했다');}
        dirty.add(i);logEvent(`당신이 ${ref(i)}(${f?f.name:''})를 약탈했습니다.`,`=DECREE.RAID(${ref(i)})`);toast('약탈을 명령했습니다');}
      else toast('영토를 가진 셀을 골라주세요');break;
    default: // inspect handled in click
      break;
  }
  if(tool!=='inspect'&&tool!=='storm') paint(i);
}

function selectCell(i){
  if(selected>=0&&cellEls[selected])cellEls[selected].classList.remove('sel');
  selected=i;cellEls[i].classList.add('sel');nb.textContent=ref(i);
  const c=cells[i];
  const owner=c.owner!==null?facById(c.owner):null;
  const place=owner?`${owner.name}의 ${LV_LABEL[c.lvl]||'영토'}`:({oasis:'오아시스',well:'우물',dune:'모래언덕',rock:'암반 고원',ruin:'폐허'}[c.t]||'빈 사막');
  fmla.textContent=`=HISTORY(${ref(i)}: ${place} ‹ ${c.hist.slice(-4).join(' → ')})`;
}

sheet.addEventListener('click',e=>{
  const t=e.target.closest('.cell');if(!t)return;
  const i=+t.dataset.i;
  selectCell(i);
  if(tool!=='inspect')applyTool(i);
});

/* header highlight on selection move; row/col header click selects all (cosmetic) */

/* hud toggle (mobile) */
$('#hudtoggle').addEventListener('click',()=>$('#hud').classList.toggle('open'));

/* tabs */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showSheet(t.dataset.sheet)));

/* ----- boot ----- */
let timer=null;
function boot(){
  buildGrid();genTerrain();
  for(let i=0;i<N;i++)paint(i);
  fmla.textContent=`=SIM.DESERT($A$1:$${colName(COLS-1)}$${ROWS}, "사막은 끝없이 길을 삼킨다")`;
  selected=-1;selectCell(0);
  foundCity(null,true);foundCity(null,true);foundCity(null,true);
  // seed a couple caravans
  setTimeout(()=>{for(const f of factions){const m=f.arr.filter(i=>cells[i].lvl>=2);if(m.length)spawnCaravan(m[0],f,pick(GOODS).k);}},300);
  renderHud();renderStatus();
  setTool('inspect');
  if(timer)clearInterval(timer);
  timer=setInterval(tick,140);
}
let rt=null;
window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
  // rebuild grid but keep sim running (cheap: full regen on big change)
  const d=dims();
  if(d.cols!==COLS||d.rows!==ROWS){
    // preserve nothing fancy — desert reshapes; keep it simple & robust
    storms.clear();caravans.forEach(removeCaravanEl);caravans=[];
    factions=[];obituaries=[];ledger=[];chronicle=[];season=1;tickN=0;
    boot();
  }
},250);});

boot();
})();
</script>
