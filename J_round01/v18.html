<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>균사망(菌絲網).xlsx - Excel</title>
<style>
  :root{
    --grn:#217346; --grn2:#107c41; --ribbon:#f3f2f1; --line:#d4d4d4;
    --hd:#f5f5f5; --hdsel:#cfe6d8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#e6e6e6;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}

  /* ---- title bar ---- */
  #titlebar{height:30px;background:linear-gradient(#fbfbfb,#f3f2f1);display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #e3e1df;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar .ttl{flex:1;text-align:center;color:#3b3a39;font-size:12px;font-weight:600;
    letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #titlebar .acct{width:46px;text-align:right;color:#888;font-size:11px}

  /* ---- menu tabs ---- */
  #menubar{height:26px;background:var(--grn);display:flex;align-items:stretch;
    padding:0 6px;font-size:12px;color:#dff0e6;flex:0 0 auto}
  #menubar .m{padding:0 11px;display:flex;align-items:center;cursor:default}
  #menubar .m.act{background:#fff;color:var(--grn2);font-weight:600;border-radius:3px 3px 0 0;margin-top:3px}
  #menubar .qf{margin-left:auto;display:flex;align-items:center;color:#cfe6d8;font-size:11px;padding-right:6px}

  /* ---- ribbon ---- */
  #ribbon{height:74px;background:#fbfbfb;border-bottom:1px solid var(--line);display:flex;
    align-items:stretch;padding:4px 2px 0;gap:0;flex:0 0 auto;overflow:hidden}
  .grp{display:flex;flex-direction:column;align-items:center;border-right:1px solid #ececec;padding:2px 8px}
  .grp .body{flex:1;display:flex;align-items:center;gap:5px}
  .grp .lbl{font-size:10px;color:#888;text-align:center;padding-bottom:2px}
  .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    min-width:44px;padding:4px 5px;border-radius:4px;cursor:pointer;color:#3b3a39}
  .btn:hover{background:#e7f3ec;outline:1px solid #bcdcc8}
  .btn .ic{font-size:18px;line-height:1}
  .btn .t{font-size:10px;white-space:nowrap}
  .btn.big .ic{font-size:22px}
  .swatchrow{display:flex;flex-wrap:wrap;gap:3px;width:96px}
  .swatchrow i{width:13px;height:13px;border-radius:2px;display:block;border:1px solid rgba(0,0,0,.12)}
  .pausebtn .ic{color:var(--grn2)}

  /* ---- formula bar ---- */
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid var(--line);font-size:12px;flex:0 0 auto}
  #namebox{width:84px;height:100%;border-right:1px solid var(--line);display:flex;
    align-items:center;justify-content:center;color:#333;gap:6px}
  #namebox b{font-weight:600}
  #namebox .car{color:#aaa;font-size:9px}
  #fxgrp{width:64px;display:flex;align-items:center;justify-content:space-around;
    border-right:1px solid var(--line);height:100%;color:#bbb;font-size:13px}
  #fxgrp span{cursor:default}
  #fx{font-style:italic;font-family:Georgia,serif;color:#999}
  #formula{flex:1;padding:0 10px;font-family:Consolas,Menlo,monospace;font-size:12px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #formula .kw{color:var(--grn2);font-weight:700}
  #formula .str{color:#a31515}
  #formula .num{color:#0b7285}

  /* ---- sheet area ---- */
  #stage{flex:1;position:relative;overflow:hidden;background:#fff;min-height:0}
  #sheetwrap{position:absolute;inset:0;overflow:hidden;background:#fff}
  #sheet{display:grid;background:#fff;position:absolute;top:0;left:0}
  .hd{background:var(--hd);border-right:1px solid #c8c8c8;border-bottom:1px solid #c8c8c8;
    display:flex;align-items:center;justify-content:center;color:#666;font-size:11px;font-weight:500}
  .hd.hot{background:var(--hdsel);color:var(--grn2);font-weight:700}
  .corner{background:linear-gradient(135deg,#f7f7f7 60%,#e4e4e4);position:relative}
  .corner::after{content:"";position:absolute;right:3px;bottom:3px;border-left:6px solid transparent;
    border-bottom:6px solid #b7b7b7}
  .cell{border-right:1px solid #e6e6e6;border-bottom:1px solid #e6e6e6;
    display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;
    overflow:hidden;cursor:cell;position:relative;transition:background .25s ease}
  .cell.sel{outline:2px solid var(--grn2);outline-offset:-2px;z-index:3}
  .cell .lnk{position:absolute;left:1px;bottom:0;font-size:7px;color:#159957;opacity:.55;pointer-events:none}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #d33}50%{box-shadow:inset 0 0 0 2px #fbb}}
  .war{animation:warf .3s 3 ease}
  @keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1);opacity:1}}
  .pop{animation:pulse .4s ease}

  /* ---- chronicle / obituary panels (other "sheets") ---- */
  .panel{position:absolute;inset:0;overflow:auto;background:#fff;display:none;padding:0}
  .panel.on{display:block}
  .panel .ph{position:sticky;top:0;background:var(--hd);border-bottom:1px solid #c8c8c8;
    display:grid;font-size:11px;font-weight:600;color:#555}
  .panel .row{display:grid;border-bottom:1px solid #eee;font-size:12px}
  .panel .row:nth-child(even){background:#fafbfa}
  .panel .row > div{padding:3px 10px;border-right:1px solid #eee;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .panel .ph > div{padding:4px 10px;border-right:1px solid #ddd}
  #chronicle .ph,#chronicle .row{grid-template-columns:70px 130px 1fr}
  #obit .ph,#obit .row{grid-template-columns:70px 1fr 120px 110px}
  .mono{font-family:Consolas,Menlo,monospace;font-size:11px}
  .tag{display:inline-block;padding:0 5px;border-radius:8px;font-size:10px;color:#fff;font-weight:600}
  .empty{padding:30px;text-align:center;color:#aaa;font-size:13px}

  /* ---- legend card ---- */
  #legend{position:absolute;top:10px;right:14px;width:212px;background:#fffdf3;
    border:1px solid #d8c66a;border-radius:3px;
    box-shadow:0 4px 14px rgba(0,0,0,.18);padding:9px 11px;font-size:11px;z-index:6;line-height:1.65}
  #legend h4{margin:0 0 4px;font-size:11px;color:#7a6a1f;display:flex;justify-content:space-between}
  #legend h4 .yr{font-weight:400;color:#a99a4f}
  #legend .fac{display:flex;align-items:center;gap:6px;margin:1px 0}
  #legend .fac .sw{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
  #legend .fac .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #legend .fac .sz{color:#888;font-size:10px;font-variant-numeric:tabular-nums}
  #legend .bar{height:3px;border-radius:2px;margin:1px 0 3px}
  #legend .key{margin-top:7px;border-top:1px dashed #e1d59a;padding-top:5px;color:#7a6a1f}
  #legend .key span{display:inline-block;margin-right:9px;white-space:nowrap}
  #legend .key b{font-size:13px;vertical-align:-1px;margin-right:1px}
  #legend.hide{display:none}
  #legtoggle{position:absolute;top:10px;right:14px;z-index:7;background:#fffdf3;border:1px solid #d8c66a;
    border-radius:3px;font-size:11px;color:#7a6a1f;padding:3px 8px;cursor:pointer;display:none}

  /* ---- intervention toast ---- */
  #toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%) translateY(20px);
    background:#2b2b2b;color:#fff;font-size:12px;padding:8px 16px;border-radius:18px;
    opacity:0;transition:.3s;z-index:9;pointer-events:none;box-shadow:0 3px 12px rgba(0,0,0,.3)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast b{color:#8ce0a8}

  /* ---- status bar ---- */
  #statusbar{height:24px;background:var(--grn);color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;flex:0 0 auto;gap:0;white-space:nowrap}
  #statusbar .sep{margin:0 9px;opacity:.4}
  #statusbar .ev{flex:1;overflow:hidden;text-overflow:ellipsis;opacity:.95}
  #statusbar .zoom{margin-left:auto;display:flex;align-items:center;gap:8px;opacity:.85}
  #statusbar .zoom i{font-style:normal;letter-spacing:1px}

  /* ---- tabs ---- */
  #tabs{height:26px;background:var(--ribbon);display:flex;align-items:flex-end;padding-left:8px;
    border-top:1px solid var(--line);font-size:11.5px;flex:0 0 auto}
  #tabs .nav{display:flex;align-items:center;color:#999;padding:0 6px 2px}
  #tabs .tab{padding:3px 14px;border:1px solid var(--line);border-bottom:none;margin-right:1px;
    background:#e9e9e9;color:#555;cursor:pointer;border-radius:3px 3px 0 0}
  #tabs .tab.on{background:#fff;color:var(--grn2);font-weight:600;border-top:2px solid var(--grn2);margin-bottom:-1px}
  #tabs .plus{padding:3px 9px;color:#999;cursor:default}

  @media (max-width:560px){
    #ribbon{height:64px}
    .grp{padding:2px 5px}
    .btn{min-width:38px;padding:3px}
    .btn .t{font-size:9px}
    #namebox{width:64px}
    #fxgrp{width:44px}
    #legend{width:170px;top:6px;right:8px;font-size:10px}
    #statusbar .hidem{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <div class="ttl" id="titletext">균사망(菌絲網).xlsx - Excel</div>
    <div class="acct">균학자</div>
  </div>

  <div id="menubar">
    <div class="m">파일</div>
    <div class="m act">홈</div>
    <div class="m">삽입</div>
    <div class="m">수식</div>
    <div class="m">데이터</div>
    <div class="m">검토</div>
    <div class="m">보기</div>
    <div class="qf">균사 자동계산: 켜짐 ●</div>
  </div>

  <div id="ribbon">
    <div class="grp">
      <div class="body">
        <div class="btn big pausebtn" id="btnPause" title="시뮬레이션 일시정지/재개">
          <div class="ic" id="pauseIc">❚❚</div><div class="t" id="pauseT">일시정지</div>
        </div>
      </div>
      <div class="lbl">시뮬레이션</div>
    </div>
    <div class="grp">
      <div class="body">
        <div class="btn" id="btnSlow" title="시간 느리게"><div class="ic">◀◀</div><div class="t">느리게</div></div>
        <div class="btn" id="btnFast" title="시간 빠르게"><div class="ic">▶▶</div><div class="t">빠르게</div></div>

    <div class="grp">

        <div class="btn" id="btnBurst" title="선택 군락에서 포자 분출 (광역 확산)"><div class="ic" style="color:#0d9488">❋</div><div class="t">포자분출</div></div>
        <div class="btn" id="btnSmite" title="선택 셀에 마름병 강타"><div class="ic" style="color:#8338ec">☠</div><div class="t">마름병</div></div>
      </div>
      <div class="lbl">개입(=함수)</div>

    <div class="grp" style="flex:0 0 auto">
      <div class="body">
        <div class="swatchrow" id="legendSwatch"></div>
      </div>
      <div class="lbl">조건부 서식</div>
    </div>
    <div class="grp" style="margin-left:auto;border-right:none">
      <div class="body">
        <div class="btn" id="btnLegend" title="현황 카드 표시/숨김"><div class="ic" style="color:#217346">▤</div><div class="t">현황</div></div>
      </div>
      <div class="lbl">보기</div>
    </div>
  </div>

  <div id="fbar">
    <div id="namebox"><b id="nbref">A1</b><span class="car">▾</span></div>
    <div id="fxgrp"><span title="취소">✕</span><span title="입력">✓</span><span id="fx">fx</span></div>
    <div id="formula"></div>
  </div>

  <div id="stage">
    <div id="sheetwrap"><div id="sheet"></div></div>
    <div class="panel" id="chronicle">
      <div class="ph"><div>서기</div><div>유형</div><div>기록</div></div>
      <div id="chronicleBody"></div>
    </div>
    <div class="panel" id="obit">
      <div class="ph"><div>서기</div><div>군락명</div><div>최대영토</div><div>사인</div></div>
      <div id="obitBody"></div>

  <div id="statusbar">
    <span id="stMode">준비</span>
    <span class="sep">|</span><span id="stYear">서기 1년</span>
    <span class="sep hidem">|</span><span id="stPop" class="hidem">균사 0gh</span>
    <span class="sep hidem">|</span><span id="stFac" class="hidem">군락 0</span>
    <span class="sep">|</span><span class="ev" id="stEv">균사망이 깨어났습니다.</span>
    <span class="zoom"><i>—</i> 100% <i>+</i></span>
  </div>

  <div id="tabs">
    <div class="nav">◀ ▶</div>
    <div class="tab on" data-view="sheet">균사망</div>
    <div class="tab" data-view="chronicle">연대기</div>
    <div class="tab" data-view="obit" id="obitTab">멸망기록 (0)</div>
    <div class="plus">＋</div>
  </div>
</div>

<script>
(() => {
/* ============================================================
   균사망.xlsx — 엑셀로 위장한 버섯숲 문명 시뮬
   '문명 = 지하 균사망(mycelium)'. 군락은 포자로 확장하고,
   친화 군락끼리 공생(합병)하며, 적대 군락과 포자전쟁을 벌인다.
   ============================================================ */
const CW = 36, CH = 24;
const stage = document.getElementById('stage');
function dims(){
  const w = stage.clientWidth, h = stage.clientHeight;
  const COLS = Math.max(16, Math.min(46, Math.floor((w - 50) / CW)));
  const ROWS = Math.max(12, Math.min(34, Math.floor((h - 4) / CH)));
  return {COLS, ROWS};
}
let {COLS, ROWS} = dims();
let N = COLS * ROWS;

const sheet = document.getElementById('sheet');
const fmla = document.getElementById('formula');
const nbref = document.getElementById('nbref');
const legend = document.getElementById('legend');
const legtoggle = document.getElementById('legtoggle');
const toastEl = document.getElementById('toast');

/* ---- column / cell ref helpers ---- */
function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(Math.floor(i/COLS)+1);}

/* ============================================================
   그리드 DOM
   ============================================================ */
let cellEls = [];
let colHd = [], rowHd = [];
function buildGrid(){
  sheet.innerHTML='';
  sheet.style.gridTemplateColumns = `48px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows = CH + 'px';
  cellEls = new Array(N); colHd = []; rowHd = [];
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd corner'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd';h.textContent=colName(c);colHd[c]=h;frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd';h.textContent=r+1;rowHd[r]=h;frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d;frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

/* ============================================================
   지형 — 값 노이즈로 숲/습지/마른땅/바위 생성
   ============================================================ */
const GW=10, GH=7; let gz=[];
function genNoiseField(){gz=[];for(let i=0;i<GW*GH;i++)gz[i]=Math.random();}
function noise(x,y){
  const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const g=(yy,xx)=>gz[Math.min(GH-1,yy)*GW+Math.min(GW-1,xx)];
  const a=g(y0,x0),b=g(y0,x0+1),c=g(y0+1,x0),d=g(y0+1,x0+1);
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}
/* st: water(습지) / forest(숙주나무) / rock(바위) / land(부엽토) / ruin(폐사지) */
let cells=[];
function genTerrain(){
  cells=new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS,y=i/COLS|0;
    const v=noise(x,y)+(Math.random()-.5)*.14;
    let st='land', hist=['부엽토'];
    if(v<.30){st='water';hist=['습지'];}
    else if(v>.74){st='rock';hist=['바위'];}
    else if(v>.55&&Math.random()<.62){st='forest';hist=['숙주나무'];}
    cells[i]={st,owner:null,level:0,hist,ruinT:0,blight:0,vigor:0};
  }
}
function nbrs(i){
  const x=i%COLS,y=i/COLS|0,out=[];
  if(x>0)out.push(i-1);if(x<COLS-1)out.push(i+1);
  if(y>0)out.push(i-COLS);if(y<ROWS-1)out.push(i+COLS);
  return out;
}

/* ============================================================
   군락(faction) — 버섯 종족
   ============================================================ */
const SPECIES=[
  {nm:'붉은광대버섯 군체', col:'#d62828', g:'♣'},
  {nm:'푸른젖버섯 균락',   col:'#2a7de1', g:'♠'},
  {nm:'황금꾀꼬리 군체',   col:'#e0a800', g:'❀'},
  {nm:'보라끈적 균사단',   col:'#7b2cbf', g:'✦'},
  {nm:'검은먹물 부족',     col:'#3a3a3a', g:'❂'},
  {nm:'청록빛 점균체',     col:'#0d9488', g:'❋'},
  {nm:'분홍산호 군락',     col:'#e5567f', g:'✿'},
  {nm:'잿빛깔때기 교단',   col:'#6c757d', g:'✜'},
  {nm:'주황등불 균계',     col:'#f4731c', g:'☘'},
  {nm:'은백색 실군체',     col:'#5b8c5a', g:'✣'}
];
let speciesIdx=0;
let factions=[];
const obituaries=[];
let year=1, lastEvent='포자 한 점에서 균사망이 깨어났습니다.', pop=0;
let blightMap=new Map();   // idx -> 남은 틱 (마름병)
const dirty=new Set();
let selected=-1;
let chronicle=[];          // {year, type, msg}
let chronViewDirty=true;

function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function facById(id){return factions.find(f=>f.id===id);}

let idSeq=0;
function spawnFaction(at, announce){
  const sp=SPECIES[speciesIdx%SPECIES.length]; speciesIdx++;
  const f={id:idSeq++, name:sp.nm, color:sp.col, glyph:sp.g,
    golden:0, size:0, peak:0, arr:[], affinity:(Math.random()*4|0)};
  let i=at;
  if(i==null||cells[i].st!=='land'||cells[i].owner!==null){
    i=-1;
    for(let t=0;t<400;t++){const j=Math.random()*N|0;if(cells[j].st==='land'&&cells[j].owner===null){i=j;break;}}
  }
  if(i<0)return null;
  setCell(i,f.id,1,'포자 정착');
  cells[i].vigor=6;
  factions.push(f);
  if(announce) logEvent('spawn',`${f.name}이(가) 포자에서 깨어났습니다.`,`=SPAWN("${f.name}", ${ref(i)})`);
  return f;
}

const LV_TXT=['','·','⁂','✸','❖'];           // 정착 / 균사 / 자실체 / 거대균환
const LV_LABEL=['','포자 정착','균사 매트','자실체','거대 균환'];

function setCell(i,owner,level,histLabel){
  const c=cells[i];
  c.owner=owner;c.level=level;c.st='land';c.blight=0;
  if(histLabel){c.hist.push(histLabel);if(c.hist.length>8)c.hist.shift();}
  dirty.add(i);
}

/* ============================================================
   렌더
   ============================================================ */
function paint(i){
  const c=cells[i],el=cellEls[i];
  let bg='',tx='',col='#333',w='',lnk='';
  if(blightMap.has(i)){bg='#e7d3f0';tx='☠';col='#8338ec';w='700';}
  else if(c.st==='water'){bg='#dcebf7';tx='≈';col='#9dc3e6';}
  else if(c.st==='rock'){bg='#eceae6';tx='▲';col='#b0a99a';}
  else if(c.st==='forest'){bg='#e6f0da';tx='♣';col='#6a9c3a';}
  else if(c.st==='ruin'){bg='#efefef';tx='✟';col='#b5b5b5';}
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      bg=hexA(f.color,.14+c.level*.18);
      tx=c.level>=2?f.glyph:LV_TXT[c.level];
      col=f.color; w=c.level>=3?'700':(c.level>=2?'600':'');
      if(c.level>=4) lnk='◎';
    }
  } else {
    bg='';tx='';
  }
  if(el.style.background!==bg) {el.style.background=bg;}
  el.style.color=col; el.style.fontWeight=w; el.textContent=tx;
  if(lnk){
    let s=el.querySelector('.lnk'); if(!s){s=document.createElement('span');s.className='lnk';el.appendChild(s);} s.textContent=lnk;
  } else { const s=el.querySelector('.lnk'); if(s)s.remove(); }
}

function logEvent(type,msg,formula){
  lastEvent=`서기 ${year}년 · ${msg}`;
  chronicle.push({year,type,msg});
  if(chronicle.length>400)chronicle.shift();
  chronViewDirty=true;
  if(formula) setFormula(formula);
}

function setFormula(s){
  // 가벼운 구문 강조
  let h=s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  h=h.replace(/"([^"]*)"/g,'<span class="str">"$1"</span>');
  h=h.replace(/\b(\d+)\b/g,'<span class="num">$1</span>');
  h=h.replace(/=([A-Z_.]+)/g,'=<span class="kw">$1</span>');
  fmla.innerHTML=h;
}

function flashWar(i){const el=cellEls[i];el.classList.add('war');setTimeout(()=>el.classList.remove('war'),900);}
function popIn(i){const el=cellEls[i];el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}

/* ============================================================
   시뮬레이션 틱
   ============================================================ */
let tickN=0, warLogCooldown=0, eventCooldown=0;
const PW=[0,18,70,240,820];   // 레벨별 균사량(gh)
function tick(){
  tickN++; year++;
  if(warLogCooldown>0)warLogCooldown--;
  if(eventCooldown>0)eventCooldown--;

  // 소유 재집계
  for(const f of factions){f.arr.length=0;f.size=0;}
  pop=0;
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin'&&--c.ruinT<=0){c.st=(Math.random()<.4?'forest':'land');c.hist.push('재생');if(c.hist.length>8)c.hist.shift();dirty.add(i);}
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){f.arr.push(i);f.size++;pop+=PW[c.level];}
      else{c.owner=null;c.level=0;dirty.add(i);}
    }
  }
  for(const f of factions) if(f.size>f.peak)f.peak=f.size;

  // 멸망 판정
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      obituaries.push({name:f.name,color:f.color,glyph:f.glyph,year,peak:f.peak,cause:f._cause||'포자 고갈'});
      logEvent('death',`${f.name}이(가) 균사망에서 끊어졌습니다.`,`=COLLAPSE("${f.name}", ${year})`);
      factions.splice(k,1);
      document.getElementById('obitTab').textContent=`멸망기록 (${obituaries.length})`;
    }
  }

  // 마름병 확산/소멸
  if(blightMap.size){
    for(const [i,t] of [...blightMap]){
      if(Math.random()<.17){
        for(const n of nbrs(i)){
          const c=cells[n];
          if(c.owner!==null&&!blightMap.has(n)){blightMap.set(n,10);dirty.add(n);}
        }
      }
      if(Math.random()<.24){
        const c=cells[i];c.level--;
        if(c.level<=0){
          const f=facById(c.owner); if(f)f._cause='마름병';
          c.owner=null;c.level=0;c.hist.push('마름병 폐사');if(c.hist.length>8)c.hist.shift();
        }
        dirty.add(i);
      }
      if(t<=1){blightMap.delete(i);dirty.add(i);}else blightMap.set(i,t-1);
    }
    if(blightMap.size===0)logEvent('event','마름병이 잦아들었습니다.','=BLIGHT.CLEAR()');
  }

  // 군락 행동
  for(const f of factions){
    if(f.golden>0)f.golden--;
    if(f.size===0)continue;
    f._cause=null;

    // 확장 (포자 살포)
    const attempts=1+(f.size*.08|0);
    for(let a=0;a<attempts;a++){
      const src=f.arr[Math.random()*f.arr.length|0];
      if(src===undefined||cells[src].owner!==f.id)continue;
      const nb=nbrs(src);
      const tgt=nb[Math.random()*nb.length|0];
      const tc=cells[tgt];
      if(tc.st==='water'||blightMap.has(tgt))continue;
      if(tc.st==='rock'){ if(Math.random()<.05){tc.st='land';tc.hist.push('바위 균열');setCell(tgt,f.id,1,'포자 정착');} continue; }
      if(tc.owner===null){
        if(tc.st==='forest'){ if(Math.random()<.4){tc.st='land';tc.hist.push('나무 분해');setCell(tgt,f.id,1,'포자 정착');popIn(tgt);} }
        else setCell(tgt,f.id,1,'포자 정착');
      } else if(tc.owner!==f.id){
        const other=facById(tc.owner);
        // 공생: 친화도 같으면 합병 시도
        if(other&&other.affinity===f.affinity&&Math.random()<.10){
          // 작은 쪽이 큰 쪽에 흡수
          const big=f.size>=other.size?f:other, small=big===f?other:f;
          setCell(tgt,big.id,Math.max(1,tc.level),'공생 합병');
          if(eventCooldown===0){
            logEvent('symb',`${big.name}과(와) ${small.name}이(가) 공생망을 이뤘습니다.`,`=SYMBIOSIS("${big.name}"+"${small.name}", ${ref(tgt)})`);
            eventCooldown=30;
          }
        } else if(Math.random()<.32){
          // 포자전쟁
          const att=1+Math.random()*3+f.size*.0025+(f.golden?1.2:0);
          const def=tc.level+1+Math.random()*3;
          flashWar(tgt);
          if(att>def){
            if(Math.random()<.26){
              tc.owner=null;tc.level=0;tc.st='ruin';tc.ruinT=160;
              tc.hist.push('포자 초토화');if(tc.hist.length>8)tc.hist.shift();dirty.add(tgt);
            } else {
              setCell(tgt,f.id,Math.max(1,tc.level-1),'잠식됨');
            }
            if((tc.level>=2||warLogCooldown===0)&&other){
              logEvent('war',`${f.name}이(가) ${other.name}의 ${ref(tgt)} 균사를 잠식했습니다.`,`=SPORE_WAR("${f.name}"→"${other.name}", ${ref(tgt)})`);
              warLogCooldown=34;
            }
          }
        }
      }
    }

    // 발전 (자실체 성장)
    const ups=1+(f.size*.05|0);
    for(let u=0;u<ups;u++){
      const i=f.arr[Math.random()*f.arr.length|0];
      if(i===undefined||cells[i].owner!==f.id)continue;
      const c=cells[i];
      if(c.level<4&&Math.random()<.065*(f.golden?3:1)){
        c.level++;
        c.hist.push(LV_LABEL[c.level]);if(c.hist.length>8)c.hist.shift();
        dirty.add(i);popIn(i);
        if(c.level===4&&warLogCooldown===0){
          logEvent('city',`${f.name}이(가) ${ref(i)}에 거대 균환을 피웠습니다.`,`=GREAT_RING("${f.name}", ${ref(i)})`);
          warLogCooldown=26;
        }
      }
    }
  }

  // 무작위 사건
  const r=Math.random();
  if(!blightMap.size&&r<.0045){
    const big=[];for(let i=0;i<N;i++)if(cells[i].owner!==null&&cells[i].level>=3)big.push(i);
    if(big.length){const i=big[Math.random()*big.length|0];blightMap.set(i,10);dirty.add(i);
      logEvent('blight',`${ref(i)}에 마름병이 번졌습니다.`,`=BLIGHT(${ref(i)})`);}
  } else if(r>.9955&&factions.length){
    const f=factions[Math.random()*factions.length|0];f.golden=80;
    logEvent('golden',`${f.name}에 풍요의 우기(雨期)가 찾아왔습니다.`,`=RAIN_SEASON("${f.name}", 80)`);
  } else if(r>.992&&r<=.9955){
    const towns=[];for(let i=0;i<N;i++)if(cells[i].owner!==null&&cells[i].level>=2)towns.push(i);
    if(towns.length){const i=towns[Math.random()*towns.length|0];
      const c=cells[i];const f=facById(c.owner);if(f)f._cause='가뭄';
      c.owner=null;c.level=0;c.st='ruin';c.ruinT=120;c.hist.push('가뭄 고사');if(c.hist.length>8)c.hist.shift();dirty.add(i);
      logEvent('event',`${ref(i)} 일대가 가뭄으로 말랐습니다.`,`=DROUGHT(${ref(i)})`);}
  }
  // 새 종 도래
  if(factions.length<3&&Math.random()<.014&&factions.length<SPECIES.length){
    const f=spawnFaction(null,false);
    if(f)logEvent('spawn',`바람을 타고 ${f.name}의 포자가 날아들었습니다.`,`=AIRBORNE_SPORE("${f.name}")`);
  }

  for(const i of dirty)paint(i);
  dirty.clear();

  // 상태바/현황카드
  document.getElementById('stYear').textContent=`서기 ${year}년`;
  document.getElementById('stPop').textContent=`균사 ${pop.toLocaleString()}gh`;
  document.getElementById('stFac').textContent=`군락 ${factions.length}`;
  document.getElementById('stEv').textContent=lastEvent;
  if(tickN%8===0){renderLegend();document.getElementById('titletext').textContent=`균사망(菌絲網).xlsx - Excel  ·  서기 ${year}년`;}
  if(chronViewDirty&&currentView==='chronicle')renderChronicle();
}

/* ============================================================
   현황 카드 / 연대기 / 멸망기록 렌더
   ============================================================ */
function renderLegend(){
  if(legend.classList.contains('hide'))return;
  const sorted=[...factions].sort((a,b)=>b.size-a.size);
  const maxSz=sorted.length?Math.max(1,sorted[0].size):1;
  let h=`<h4>군락 현황 <span class="yr">서기 ${year}년</span></h4>`;
  if(!sorted.length)h+=`<div style="color:#a99a4f">생존 군락 없음</div>`;
  for(const f of sorted){
    h+=`<div class="fac"><span class="sw" style="background:${f.color}"></span>`
      +`<span class="nm">${f.glyph} ${f.name}${f.golden?' ☂':''}</span>`
      +`<span class="sz">${f.size}칸</span></div>`
      +`<div class="bar" style="width:${Math.max(6,f.size/maxSz*186)}px;background:${hexA(f.color,.5)}"></div>`;
  }
  h+=`<div class="key">`
    +`<span><b style="color:#6a9c3a">♣</b>숙주나무</span>`
    +`<span><b style="color:#9dc3e6">≈</b>습지</span>`
    +`<span><b style="color:#b0a99a">▲</b>바위</span>`
    +`<span><b style="color:#8338ec">☠</b>마름병</span>`
    +`<span><b style="color:#b5b5b5">✟</b>폐사지</span>`
    +`<br><span style="font-size:10px;color:#a99a4f">·→⁂→자실체→거대균환(◎)</span></div>`;
  legend.innerHTML=h;
}

function renderChronicle(){
  chronViewDirty=false;
  const body=document.getElementById('chronicleBody');
  const COLOR={spawn:'#6a9c3a',war:'#d62828',symb:'#0d9488',city:'#e0a800',golden:'#f4731c',
    blight:'#8338ec',death:'#3a3a3a',event:'#6c757d'};
  const LABEL={spawn:'탄생',war:'포자전쟁',symb:'공생',city:'거대균환',golden:'우기',
    blight:'마름병',death:'멸망',event:'사건'};
  const list=chronicle.slice(-200).reverse();
  if(!list.length){body.innerHTML='<div class="empty">아직 기록된 역사가 없습니다.</div>';return;}
  let h='';
  for(const e of list){
    const col=COLOR[e.type]||'#888';
    h+=`<div class="row"><div class="mono">${e.year}</div>`
      +`<div><span class="tag" style="background:${col}">${LABEL[e.type]||'·'}</span></div>`
      +`<div>${e.msg}</div></div>`;
  }
  body.innerHTML=h;
}

function renderObit(){
  const body=document.getElementById('obitBody');
  if(!obituaries.length){body.innerHTML='<div class="empty">아직 멸종한 군락이 없습니다. 균사망은 번성 중입니다.</div>';return;}
  let h='';
  for(const o of [...obituaries].reverse()){
    h+=`<div class="row"><div class="mono">${o.year}</div>`
      +`<div><span style="color:${o.color};font-weight:700">${o.glyph}</span> ${o.name}</div>`
      +`<div class="mono">${o.peak}칸</div><div>${o.cause}</div></div>`;
  }
  body.innerHTML=h;
}

/* ============================================================
   탭 전환 (실제로 동작)
   ============================================================ */
let currentView='sheet';
function showView(v){
  currentView=v;
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.view===v));
  document.getElementById('chronicle').classList.toggle('on',v==='chronicle');
  document.getElementById('obit').classList.toggle('on',v==='obit');
  document.getElementById('sheetwrap').style.visibility=(v==='sheet')?'visible':'hidden';
  legend.style.display=(v==='sheet'&&!legend.classList.contains('hide'))?'block':'none';
  legtoggle.style.display=(v==='sheet'&&legend.classList.contains('hide'))?'block':'none';
  if(v==='chronicle'){chronViewDirty=true;renderChronicle();document.getElementById('nbref').textContent='연대기';}
  if(v==='obit'){renderObit();document.getElementById('nbref').textContent='멸망기록';}
  if(v==='sheet'&&selected>=0)nbref.textContent=ref(selected);
  document.getElementById('stMode').textContent = v==='sheet'?'준비':'보기';
}
document.querySelectorAll('#tabs .tab').forEach(t=>t.addEventListener('click',()=>showView(t.dataset.view)));

/* ============================================================
   셀 클릭 = 그 땅의 역사 + 헤더 하이라이트
   ============================================================ */
function selectCell(i){
  if(selected>=0&&cellEls[selected])cellEls[selected].classList.remove('sel');
  colHd.forEach(h=>h.classList.remove('hot'));rowHd.forEach(h=>h.classList.remove('hot'));
  selected=i;
  cellEls[i].classList.add('sel');
  const x=i%COLS,y=i/COLS|0;
  if(colHd[x])colHd[x].classList.add('hot');
  if(rowHd[y])rowHd[y].classList.add('hot');
  nbref.textContent=ref(i);
  const c=cells[i];
  if(c.owner!==null){
    const f=facById(c.owner);
    const owner=f?`${f.glyph} ${f.name}`:'무주공산';
    setFormula(`=HISTORY(${ref(i)}, "${owner}", ${c.hist.map(x=>`"${x}"`).join(', ')})`);
  } else {
    setFormula(`=TERRAIN(${ref(i)}, ${c.hist.map(x=>`"${x}"`).join(' → ')})`);
  }
}
sheet.addEventListener('click',e=>{
  const t=e.target.closest('.cell');if(!t)return;
  selectCell(+t.dataset.i);
});

   토스트
   ============================================================ */
let toastTm=null;
function toast(html){
  toastEl.innerHTML=html;toastEl.classList.add('show');
  clearTimeout(toastTm);toastTm=setTimeout(()=>toastEl.classList.remove('show'),1900);
}

/* ============================================================
   개입(=함수) 버튼
   ============================================================ */
document.getElementById('btnSpawn').addEventListener('click',()=>{
  if(currentView!=='sheet')showView('sheet');
  let target=selected;
  if(target<0||cells[target].st!=='land'||cells[target].owner!==null){
    // 빈 땅 아무거나
    target=-1;for(let t=0;t<400;t++){const j=Math.random()*N|0;if(cells[j].st==='land'&&cells[j].owner===null){target=j;break;}}
  }
  if(target<0){toast('파종할 빈 부엽토가 없습니다.');return;}
  if(speciesIdx>=SPECIES.length){toast('새 균종이 더 없습니다. (10종 한계)');return;}
  const f=spawnFaction(target,true);
  if(f){selectCell(target);toast(`<b>=SPAWN("${f.name}")</b> 파종 완료`);}
});
document.getElementById('btnBurst').addEventListener('click',()=>{
  if(currentView!=='sheet')showView('sheet');
  if(selected<0||cells[selected].owner===null){toast('먼저 군락 셀을 선택하세요.');return;}
  const f=facById(cells[selected].owner);if(!f){toast('소유 군락 없음');return;}
  let placed=0;
  const ring=new Set([selected]);
  // 2-환 이웃에 강제 포자 살포
  let frontier=[selected];
  for(let d=0;d<2;d++){
    const next=[];
    for(const i of frontier)for(const n of nbrs(i))if(!ring.has(n)){ring.add(n);next.push(n);}
    frontier=next;
  }
  for(const i of ring){
    const c=cells[i];
    if(i===selected)continue;
    if(c.st==='land'&&c.owner===null){setCell(i,f.id,1,'포자분출 정착');popIn(i);placed++;}
    else if(c.st==='forest'&&Math.random()<.7){c.st='land';setCell(i,f.id,1,'포자분출 정착');popIn(i);placed++;}
  }
  for(const i of dirty)paint(i);dirty.clear();
  logEvent('event',`${f.name}이(가) ${ref(selected)}에서 포자를 분출했습니다.`,`=SPORE_BURST("${f.name}", ${ref(selected)}, ${placed})`);
  toast(`<b>❋ 포자분출</b> — ${placed}칸 확산`);
});
document.getElementById('btnSmite').addEventListener('click',()=>{
  if(currentView!=='sheet')showView('sheet');
  let i=selected;
  if(i<0||cells[i].owner===null){
    // 가장 큰 군락의 자실체를 노림
    const big=[];for(let k=0;k<N;k++)if(cells[k].owner!==null&&cells[k].level>=2)big.push(k);
    if(!big.length){toast('마름병을 풀 자실체가 없습니다.');return;}
    i=big[Math.random()*big.length|0];selectCell(i);
  }
  blightMap.set(i,12);paint(i);
  logEvent('blight',`${ref(i)}에 마름병을 강타했습니다.`,`=BLIGHT(${ref(i)}, "강제")`);
  toast(`<b>☠ 마름병</b> ${ref(i)} 발병`);
});

let speeds=[220,110,55,28], spIdx=1, paused=false, timer=null;
function restartTimer(){
  clearInterval(timer);
  if(!paused)timer=setInterval(tick,speeds[spIdx]);
}
function updSpeedLbl(){
  const mult=[0.5,1,2,4][spIdx];
  document.getElementById('speedLbl').textContent=`속도 ×${mult}`;
}
document.getElementById('btnSlow').addEventListener('click',()=>{spIdx=Math.max(0,spIdx-1);updSpeedLbl();restartTimer();toast(`속도 ×${[0.5,1,2,4][spIdx]}`);});
document.getElementById('btnFast').addEventListener('click',()=>{spIdx=Math.min(3,spIdx+1);updSpeedLbl();restartTimer();toast(`속도 ×${[0.5,1,2,4][spIdx]}`);});
document.getElementById('btnPause').addEventListener('click',()=>{
  paused=!paused;
  document.getElementById('pauseIc').textContent=paused?'▶':'❚❚';
  document.getElementById('pauseT').textContent=paused?'재개':'일시정지';
  document.getElementById('stMode').textContent=paused?'일시정지':'준비';
  restartTimer();
});

/* ============================================================
   현황 카드 토글
   ============================================================ */
function toggleLegend(show){
  if(show==null)show=legend.classList.contains('hide');
  legend.classList.toggle('hide',!show);
  legend.style.display=(currentView==='sheet'&&show)?'block':'none';
  legtoggle.style.display=(currentView==='sheet'&&!show)?'block':'none';
  if(show)renderLegend();
}
document.getElementById('btnLegend').addEventListener('click',()=>toggleLegend());
legtoggle.addEventListener('click',()=>toggleLegend(true));

/* ============================================================
   조건부 서식 스와치 (장식)
   ============================================================ */
function buildSwatch(){
  const sw=document.getElementById('legendSwatch');
  const cols=['#e6f0da','#dcebf7','#eceae6','#d62828','#2a7de1','#e0a800','#7b2cbf','#0d9488','#e5567f','#f4731c','#e7d3f0','#efefef'];
  sw.innerHTML=cols.map(c=>`<i style="background:${c}"></i>`).join('');
}

/* ============================================================
   리사이즈 (반응형) — 그리드 재생성, 시뮬 상태 리셋
   ============================================================ */
let resizeTm=null;
function rebuildWorld(){
  const d=dims();
  COLS=d.COLS;ROWS=d.ROWS;N=COLS*ROWS;
  buildGrid();
  genNoiseField();genTerrain();
  factions=[];obituaries.length=0;chronicle=[];blightMap=new Map();
  speciesIdx=0;idSeq=0;year=1;tickN=0;selected=-1;pop=0;
  for(let i=0;i<N;i++)paint(i);
  setFormula(`=SIM.MYCELIUM($A$1:$${colName(COLS-1)}$${ROWS}, "숲은 죽어 다시 숲이 된다")`);
  spawnFaction(null,true);spawnFaction(null,true);spawnFaction(null,true);
  document.getElementById('obitTab').textContent='멸망기록 (0)';
  renderLegend();
}
window.addEventListener('resize',()=>{
  clearTimeout(resizeTm);
  resizeTm=setTimeout(()=>{
    const d=dims();
    if(d.COLS!==COLS||d.ROWS!==ROWS){rebuildWorld();}
  },220);
});

/* ============================================================
   부팅
   ============================================================ */
buildGrid();
genNoiseField();
genTerrain();
buildSwatch();
updSpeedLbl();
for(let i=0;i<N;i++)paint(i);
setFormula(`=SIM.MYCELIUM($A$1:$${colName(COLS-1)}$${ROWS}, "숲은 죽어 다시 숲이 된다")`);
spawnFaction(null,true);spawnFaction(null,true);spawnFaction(null,true);
renderLegend();
restartTimer();
})();
</script>
</body>
</html>
