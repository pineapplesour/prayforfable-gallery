<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>성간식민장부.xlsx - Excel</title>
<style>
  :root{
    --green:#107c41; --green-d:#0b5a2f; --grid:#dadce0; --grid-l:#eef0f2;
    --hd:#f6f7f9; --ink:#202124; --void:#070912;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#e6e8ea;
    font-family:"맑은 고딕","Malgun Gothic","Segoe UI","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:var(--ink);-webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}

  /* ---- title bar ---- */
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #e2e2e2;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%}
  #title{margin-left:6px;color:#3c4043;font-size:12px;font-weight:600;flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #title small{font-weight:400;color:#8a8d91}
  #acct{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}

  /* ---- ribbon tabs ---- */
  #ribtabs{height:27px;background:#fff;display:flex;align-items:flex-end;
    padding:0 8px;gap:2px;border-bottom:1px solid #e7e7e7;flex:0 0 auto;font-size:12px}
  #ribtabs i{font-style:normal;padding:5px 11px;color:#444;border-radius:4px 4px 0 0;cursor:default}
  #ribtabs b{font-style:normal;font-weight:600;padding:5px 11px;color:var(--green);
    border:1px solid #e7e7e7;border-bottom:2.5px solid var(--green);background:#fff;
    border-radius:4px 4px 0 0;margin-bottom:-1px}

  /* ---- ribbon ---- */
  #ribbon{height:74px;background:#fafafa;border-bottom:1px solid #e0e0e0;flex:0 0 auto;
    display:flex;align-items:stretch;padding:5px 4px 0;gap:0;overflow:hidden}
  .grp{display:flex;flex-direction:column;align-items:center;
    padding:0 10px;border-right:1px solid #e6e6e6;min-width:0}
  .grp .row{display:flex;gap:5px;flex:1;align-items:center}
  .grp .lbl{font-size:10px;color:#909398;padding:2px 0 3px;height:15px}
  .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:46px;height:50px;border:1px solid transparent;border-radius:5px;cursor:pointer;
    color:#3c4043;gap:3px;padding:0 6px;background:transparent;font-family:inherit}
  .btn:hover{background:#eef6f0;border-color:#cfe6d8}
  .btn:active{background:#d7ecdf}
  .btn .ic{font-size:17px;line-height:1;font-family:"Segoe UI Symbol","Apple Symbols",sans-serif}
  .btn .t{font-size:10.5px;white-space:nowrap}
  .btn[disabled]{opacity:.4;cursor:default}
  .btn[disabled]:hover{background:transparent;border-color:transparent}
  .btn.sm{min-width:0;height:23px;flex-direction:row;gap:5px;padding:0 9px}
  .btn.sm .ic{font-size:13px}
  .btn.on{background:#d7ecdf;border-color:#9fcfb1}
  .speedwrap{display:flex;flex-direction:column;gap:3px;justify-content:center}

  /* ---- formula bar ---- */
  #fbar{height:25px;background:#fff;display:flex;align-items:stretch;
    border-bottom:1px solid #d4d4d4;flex:0 0 auto}
  #namebox{width:88px;border-right:1px solid #d4d4d4;display:flex;align-items:center;
    padding:0 8px;color:#222;font-size:12px;font-weight:600;flex:0 0 auto;gap:5px}
  #namebox .car{color:#aaa;font-size:9px}
  #fxlabel{width:46px;display:flex;align-items:center;justify-content:center;
    color:#9aa0a6;font-style:italic;font-family:Georgia,serif;font-size:13px;
    border-right:1px solid #eaeaea;flex:0 0 auto}
  #formula{flex:1;border:none;outline:none;padding:0 8px;background:#fff;
    font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:11.5px;color:#1a1a1a;
    width:100%;letter-spacing:.1px}
  #formula::placeholder{color:#bdc1c6}
  #formula.cmd{color:#0b5a2f;font-weight:600}

  /* ---- main area ---- */
  #main{flex:1;position:relative;overflow:hidden;background:var(--void)}
  #stars{position:absolute;inset:0;z-index:0;pointer-events:none}
  .view{position:absolute;inset:0;display:none;flex-direction:column}
  .view.on{display:flex}

  /* sheet (star map) */
  #sheetwrap{position:relative;flex:1;overflow:auto;background:transparent}
  #sheet{display:grid;position:relative;width:max-content}
  .hd{background:rgba(246,247,249,.94);border-right:1px solid #c9ccd1;border-bottom:1px solid #c9ccd1;
    display:flex;align-items:center;justify-content:center;color:#5f6368;font-size:10.5px;
    position:sticky;z-index:3;font-weight:500}
  .hd.colh{top:0}
  .hd.rowh{left:0;z-index:4}
  .hd.corner{top:0;left:0;z-index:6}
  .cell{border-right:1px solid rgba(120,130,150,.16);border-bottom:1px solid rgba(120,130,150,.16);
    display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;
    position:relative;cursor:cell;color:#cfd6e2;background:rgba(10,14,26,.55)}
  .cell .glyph{position:relative;z-index:1;text-shadow:0 0 4px rgba(0,0,0,.6)}
  .cell.sel{outline:2px solid #18c06a;outline-offset:-2px;z-index:5;
    box-shadow:0 0 10px rgba(24,192,106,.55)}
  .cell.cap::after{content:"★";position:absolute;top:0px;right:1px;font-size:8px;
    color:#ffe27a;z-index:2;text-shadow:0 0 4px #000}
  @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.9)}}
  .cell.cap .glyph{animation:pulse 1.6s ease-in-out infinite}
  @keyframes battle{0%,100%{box-shadow:inset 0 0 0 2px #ff3b3b}50%{box-shadow:inset 0 0 14px 3px #ff8a3b}}
  .cell.war{animation:battle .3s linear 4;z-index:6}
  @keyframes nova{0%{box-shadow:inset 0 0 30px 12px #fff}100%{box-shadow:inset 0 0 0 0 #fff0}}
  .cell.nova{animation:nova .9s ease-out 1;z-index:6}

  /* chronicle / extinction views */
  .logview{flex:1;overflow:auto;padding:14px 18px;color:#dfe4ee;
    font-family:Consolas,Menlo,monospace;font-size:12px;background:#0a0e1a}
  .logview h3{color:#7ee0a8;font-size:13px;margin:0 0 12px;font-weight:600;
    border-bottom:1px solid #1d2740;padding-bottom:7px;font-family:"맑은 고딕",sans-serif}
  .logrow{display:flex;gap:10px;padding:3px 0;border-bottom:1px dotted #18203a;align-items:baseline}
  .logrow .yr{color:#6f86b8;flex:0 0 86px}
  .logrow .fx{color:#8de0b0;flex:0 0 auto}
  .logrow .ms{color:#cdd6e6;font-family:"맑은 고딕",sans-serif}
  .obit{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid #1d2740;align-items:center;
    font-family:"맑은 고딕",sans-serif}
  .obit .cross{color:#7a8499;font-size:14px}
  .obit .nm{font-weight:600}
  .obit .det{color:#8893a8;font-size:11px}
  .empty{color:#566; padding:20px 4px;font-family:"맑은 고딕",sans-serif}

  /* docked HUD panel on star map */
  #hud{position:absolute;top:10px;right:14px;width:218px;z-index:7;
    background:rgba(12,18,32,.86);border:1px solid #2a3a5a;border-radius:7px;
    box-shadow:0 6px 22px rgba(0,0,0,.45);backdrop-filter:blur(3px);
    font-size:11px;color:#dfe6f2;overflow:hidden}
  #hud h4{margin:0;padding:7px 11px;font-size:11px;color:#8fe4b4;
    background:rgba(16,124,65,.18);border-bottom:1px solid #25395a;letter-spacing:.3px}
  #hudbody{padding:8px 11px;line-height:1.85;max-height:230px;overflow:auto}
  .frow{display:flex;align-items:center;gap:7px}
  .frow .sw{width:9px;height:9px;border-radius:2px;flex:0 0 auto;box-shadow:0 0 6px}
  .frow .fn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .frow .sz{color:#9fb0cc;font-variant-numeric:tabular-nums}
  .gold{color:#ffd75e}
  #chart{display:block;margin:7px 0 2px;width:100%;height:38px;background:rgba(0,0,0,.25);border-radius:3px}
  #hud .sub{color:#7e8aa3;font-size:10px;margin-top:6px;border-top:1px solid #233355;padding-top:5px}

  /* hover readout */
  #cellinfo{position:absolute;left:12px;bottom:10px;z-index:7;
    background:rgba(12,18,32,.9);border:1px solid #2a3a5a;border-radius:6px;
    padding:7px 11px;font-size:11px;color:#cdd6e6;max-width:300px;
    font-family:Consolas,Menlo,monospace;display:none;line-height:1.5}
  #cellinfo b{color:#8fe4b4}

  /* ---- tabs ---- */
  #tabs{height:26px;background:#f3f2f1;display:flex;align-items:stretch;padding-left:6px;
    border-top:1px solid #d4d4d4;flex:0 0 auto;font-size:11.5px;gap:0;overflow:hidden}
  #tabs .ctl{display:flex;align-items:center;color:#888;padding:0 4px;font-size:11px}
  #tabs .tab{padding:4px 16px;display:flex;align-items:center;color:#5f6368;cursor:pointer;
    border-right:1px solid #e0e0e0;white-space:nowrap}
  #tabs .tab.on{background:#fff;color:var(--green);font-weight:600;
    border-top:2px solid var(--green);margin-top:-1px}
  #tabs .tab:hover:not(.on){background:#ececec}
  #tabs .plus{padding:4px 12px;color:#999}

  /* ---- status bar ---- */
  #statusbar{height:24px;background:var(--green);color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;flex:0 0 auto;gap:0;white-space:nowrap;overflow:hidden}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .ev{flex:1;overflow:hidden;text-overflow:ellipsis;opacity:.95}
  #statusbar .zoom{margin-left:8px;opacity:.85}

  /* toast */
  #toast{position:absolute;left:50%;top:14px;transform:translateX(-50%) translateY(-60px);
    z-index:30;background:rgba(16,124,65,.96);color:#fff;padding:8px 18px;border-radius:20px;
    font-size:12px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;
    transition:transform .35s,opacity .35s;pointer-events:none;max-width:80%}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  /* responsive */
  @media (max-width:560px){
    #ribbon{height:66px}
    .grp{padding:0 5px}
    .btn{min-width:40px;padding:0 3px}
    .btn .t{font-size:9.5px}
    #hud{width:158px;top:6px;right:8px}
    #hudbody{max-height:150px}
    #namebox{width:66px}
    .grp.hideMob{display:none}
    #title{font-size:11px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <div id="title">성간식민장부.xlsx <small>- Excel</small></div>
    <div id="acct">은</div>
  </div>

  <div id="ribtabs">
    <i>파일</i><b>홈</b><i>삽입</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i>
  </div>

  <div id="ribbon">
    <div class="grp">
      <div class="row">
        <button class="btn" id="b-play"><span class="ic" id="b-play-ic" style="color:#107c41;font-size:15px">❚❚</span><span class="t" id="b-play-t">일시정지</span></button>
        <div class="speedwrap">
          <button class="btn sm" id="b-slow"><span class="ic">◂◂</span><span class="t">감속</span></button>
          <button class="btn sm" id="b-fast"><span class="ic">▸▸</span><span class="t">가속</span></button>

    <div class="grp">
      <div class="row">
        <button class="btn" id="b-colonize"><span class="ic" style="color:#3b82f6">◉</span><span class="t">식민</span></button>
        <button class="btn" id="b-terra"><span class="ic" style="color:#34d399">✿</span><span class="t">테라포밍</span></button>
        <button class="btn" id="b-bomb"><span class="ic" style="color:#ef4444">✸</span><span class="t">궤도폭격</span></button>
      </div>
      <div class="lbl">개입 명령 (셀 선택 후)</div>
    </div>

    <div class="grp hideMob">
      <div class="row">
        <button class="btn" id="b-nova"><span class="ic" style="color:#facc15">✶</span><span class="t">초신성</span></button>
        <button class="btn" id="b-blight"><span class="ic" style="color:#a78bfa">⚠</span><span class="t">나노역병</span></button>
        <button class="btn" id="b-spawn"><span class="ic" style="color:#22d3ee">⚑</span><span class="t">신문명</span></button>
      </div>
      <div class="lbl">우주적 사건</div>
    </div>

    <div class="grp hideMob">
      <div class="row">
        <button class="btn" id="b-fit"><span class="ic" style="font-size:15px">▣</span><span class="t">화면맞춤</span></button>
      </div>
      <div class="lbl">보기</div>
    </div>
  </div>

  <div id="fbar">
    <div id="namebox"><span id="nb">A1</span><span class="car">▾</span></div>
    <div id="fxlabel">fx</div>
    <input id="formula" spellcheck="false" autocomplete="off"
      placeholder='셀 선택 후 =COLONIZE() / =TERRAFORM() / =BOMB() 입력 후 Enter…'>
  </div>

  <div id="main">
    <canvas id="stars"></canvas>

    <!-- STAR MAP -->
    <div class="view on" id="view-map">
      <div id="sheetwrap"><div id="sheet"></div></div>
      <div id="hud">
        <h4>은하 식민 현황</h4>
        <div id="hudbody"></div>
      </div>
      <div id="cellinfo"></div>
    </div>

    <!-- CHRONICLE -->
    <div class="view" id="view-log">
      <div class="logview" id="logbody">
        <h3>※ 연대기 — 은하 표준력 기록</h3>
        <div id="logrows"></div>
      </div>
    </div>

    <!-- EXTINCTION -->
    <div class="view" id="view-dead">
      <div class="logview" id="deadbody">
        <h3>† 멸망기록 — 사라진 문명들의 명부</h3>
        <div id="deadrows"><div class="empty">아직 멸망한 문명이 없습니다. 별들은 아직 젊습니다.</div></div>
      </div>

  </div>

  <div id="tabs">
    <span class="ctl">◀ ▶</span>
    <div class="tab on" data-v="map">성도(星圖)</div>
    <div class="tab" data-v="log">연대기</div>
    <div class="tab" data-v="dead" id="tab-dead">멸망기록 (0)</div>
    <span class="plus">＋</span>
  </div>

  <div id="statusbar">
    <span id="st-ready">준비</span>
    <span class="sep">|</span><span id="st-year">표준력 0년</span>
    <span class="sep">|</span><span id="st-pop">총 인구 0</span>
    <span class="sep">|</span><span id="st-civ">문명 0</span>
    <span class="sep">|</span><span class="ev" id="st-event">은하가 깨어나고 있습니다…</span>
    <span class="zoom" id="st-zoom">100%</span>
  </div>

<script>
(() => {
"use strict";
// ===================================================================
//  성간식민장부.xlsx  —  엑셀로 위장한 살아있는 은하 식민 시뮬
// ===================================================================

// ---------- layout sizing ----------
const main = document.getElementById('main');
function calcGrid(){
  const w = main.clientWidth, h = main.clientHeight;
  const mobile = w < 560;
  const CW = mobile ? 26 : 30, CH = mobile ? 24 : 26;
  const cols = Math.max(14, Math.min(46, Math.floor((w - 50) / CW)));
  const rows = Math.max(12, Math.min(34, Math.floor((h - 8) / CH)));
  return {CW, CH, cols, rows, mobile};
}
let G = calcGrid();
let COLS = G.cols, ROWS = G.rows, CW = G.CW, CH = G.CH;
let N = COLS * ROWS;

const sheet = document.getElementById('sheet');
const fmla = document.getElementById('formula');
const nb = document.getElementById('nb');
const hudbody = document.getElementById('hudbody');
const cellinfo = document.getElementById('cellinfo');

// ---------- A1 ref helpers ----------
function colName(n){ let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0; } return s; }
function ref(i){ return colName(i%COLS)+(Math.floor(i/COLS)+1); }

// ---------- terrain / cell types ----------
// space-themed: void(빈우주) / star(항성) / nebula(성운) / belt(소행성대) / colony(owned)
const cells = new Array(N);
const cellEls = new Array(N);

// value-noise field for clustered nebulae & stars
function buildField(){
  const GW=9, GH=6, gz=[];
  for(let i=0;i<GW*GH;i++) gz[i]=Math.random();
  const nz=(x,y)=>{
    const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
    const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
    const a=gz[y0*GW+x0], b=gz[y0*GW+Math.min(GW-1,x0+1)];
    const c=gz[Math.min(GH-1,y0+1)*GW+x0], d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
    return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
  };
  for(let i=0;i<N;i++){
    const x=i%COLS, y=i/COLS|0;
    const v = nz(x,y)+(Math.random()-.5)*.16;
    let st='void', hist=['공허'];
    if(v>.66 && Math.random()<.7){ st='nebula'; hist=['성운']; }       // expensive to settle
    else if(v<.30 && Math.random()<.5){ st='belt'; hist=['소행성대']; } // blocks expansion
    else if(Math.random()<.05){ st='star'; hist=['거주가능 항성계']; }  // prized seeds
    cells[i]={ st, owner:null, level:0, hist, ruinT:0 };
  }
}
buildField();

function nbrs(i){
  const x=i%COLS, y=i/COLS|0, out=[];
  if(x>0)out.push(i-1); if(x<COLS-1)out.push(i+1);
  if(y>0)out.push(i-COLS); if(y<ROWS-1)out.push(i+COLS);
  return out;
}

// ---------- civilizations ----------
const NAMES=['테라 공화국','케플러 연방','오리온 패권','보이드 유랑단','시리우스 교단',
  '안드로메다 상회','적색왜성 군벌','수정 동맹','네뷸라 유목민','심연의 자손'];
const COLORS=['#3b82f6','#22d3ee','#f97316','#a78bfa','#facc15',
  '#34d399','#ef4444','#e879f9','#60a5fa','#10b981'];
let nameIdx=0, civs=[], obituaries=[], chronicle=[];
let year=0, lastEvent='은하가 깨어나고 있습니다…', pop=0;
const blight=new Map();   // idx -> ticks left (nanite plague)
const flare=new Map();    // idx -> ticks left (stellar flare / fire analog)
const dirty=new Set();
let selected=-1;
let running=true, speed=1;
const popHistory=[];

function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

const LV_TXT=['','·','◉','⬢','✦'];                 // outpost / colony / orbital city / megastructure
const LV_LABEL=['','전초기지','식민지','궤도도시','다이슨 거점'];

function spawnCiv(announce, atIndex){
  if(nameIdx>=NAMES.length) nameIdx=0;
  const used=new Set(civs.map(c=>c.name));
  while(used.has(NAMES[nameIdx]) && used.size<NAMES.length){ nameIdx=(nameIdx+1)%NAMES.length; }
  const c={ id:civs.length?Math.max(...civs.map(x=>x.id))+1:0,
    name:NAMES[nameIdx], color:COLORS[nameIdx%COLORS.length],
    golden:0, size:0, arr:[], born:year, capital:-1 };
  nameIdx++;
  const place=(i)=>{ setCell(i,c.id,1,'전초기지'); c.capital=i; cellEls[i].classList.add('cap'); civs.push(c);
    if(announce) logEvent(`${c.name}이(가) 항성간 도약에 성공했습니다.`, `=COLONIZE("${c.name}", ${ref(i)})`); return c; };
  if(atIndex!=null && cells[atIndex].st!=='void' || (atIndex!=null && cells[atIndex].owner===null)){
    if(cells[atIndex].owner===null && cells[atIndex].st!=='belt'){ cells[atIndex].st='colony'; return place(atIndex); }
  }
  // prefer habitable stars
  const stars=[]; for(let i=0;i<N;i++) if(cells[i].st==='star' && cells[i].owner===null) stars.push(i);
  if(stars.length){ const i=stars[Math.random()*stars.length|0]; return place(i); }
  for(let t=0;t<400;t++){ const i=Math.random()*N|0;
    if(cells[i].owner===null && cells[i].st!=='belt' && cells[i].st!=='nebula'){ return place(i); } }
  return null;
}
function civById(id){ return civs.find(c=>c.id===id); }

function setCell(i,owner,level,label){
  const c=cells[i];
  c.owner=owner; c.level=level; if(c.st!=='colony') c.st='colony';
  if(label){ c.hist.push(label); if(c.hist.length>8) c.hist.shift(); }
  dirty.add(i);
}

function paint(i){
  const c=cells[i], el=cellEls[i];
  let bg='', tx='', col='#cfd6e2', shadow='';
  el.classList.toggle('cap', c.owner!==null && i===((civById(c.owner)||{}).capital));
  if(blight.has(i)){ bg='rgba(124,58,237,.5)'; tx='☣'; col='#e9d5ff'; }
  else if(flare.has(i)){ bg='rgba(249,115,22,.55)'; tx='✷'; col='#fff1d6'; }
  else if(c.st==='void'){ bg='rgba(10,14,26,.55)'; tx=''; }
  else if(c.st==='star'){ bg='rgba(250,204,21,.10)'; tx='✦'; col='#fde68a'; }
  else if(c.st==='nebula'){ bg='rgba(139,92,246,.16)'; tx='≋'; col='#c4b5fd'; }
  else if(c.st==='belt'){ bg='rgba(120,113,108,.18)'; tx='∴'; col='#a8a29e'; }
  else if(c.st==='ruin'){ bg='rgba(60,60,70,.4)'; tx='☓'; col='#7c8499'; }
  else if(c.owner!==null){
    const f=civById(c.owner);
    if(f){ bg=hexA(f.color,.16+c.level*.18); tx=LV_TXT[c.level]; col=f.color; shadow=`0 0 6px ${hexA(f.color,.5)}`; }
  }
  el.style.background=bg;
  el.firstChild.textContent=tx;
  el.firstChild.style.color=col;
  el.firstChild.style.textShadow=shadow||'0 0 4px rgba(0,0,0,.6)';
}

function logEvent(msg,formula){
  year>0 && (lastEvent=`표준력 ${year}년: ${msg}`);
  if(year===0) lastEvent=msg;
  if(formula && !fmla.matches(':focus')){ fmla.value=formula; fmla.classList.remove('cmd'); }
  chronicle.push({year, msg, formula:formula||''});
  if(chronicle.length>400) chronicle.shift();
  logDirty=true;
}
let logDirty=false;

function flashWar(i){ const el=cellEls[i]; el.classList.add('war'); setTimeout(()=>el.classList.remove('war'),1300); }
function flashNova(i){ const el=cellEls[i]; el.classList.add('nova'); setTimeout(()=>el.classList.remove('nova'),950); }

// ===================================================================
//  TICK — the living simulation
// ===================================================================
let tickN=0, warCd=0;
const PW=[0,12,55,260,1200];   // population weights per level

function tick(){
  tickN++; year++;
  if(warCd>0) warCd--;

  // recount
  for(const f of civs){ f.arr.length=0; f.size=0; }
  pop=0;
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin' && --c.ruinT<=0){ c.st='void'; c.hist.push('공허로 회귀'); dirty.add(i); }
    if(c.owner!==null){
      const f=civById(c.owner);
      if(f){ f.arr.push(i); f.size++; pop+=PW[c.level]; }
      else { c.owner=null; c.level=0; c.st='void'; dirty.add(i); }
    }
  }

  // extinction
  for(let k=civs.length-1;k>=0;k--){
    const f=civs[k];
    if(f.size===0){
      obituaries.push({name:f.name, color:f.color, born:f.born, died:year, span:year-f.born});
      logEvent(`${f.name}이(가) 은하에서 영원히 사라졌습니다.`, `=EXTINCT("${f.name}", 표준력${year}년)`);
      deadDirty=true;
      civs.splice(k,1);
    }
  }

  // stellar flares spread & burn out
  for(const [i,t] of [...flare]){
    if(Math.random()<.13){
      for(const n of nbrs(i)){ const c=cells[n];
        if(c.owner!==null && !flare.has(n) && c.st==='colony'){ flare.set(n,5); dirty.add(n); } }
    }
    if(t<=1){ flare.delete(i); const c=cells[i];
      c.owner=null; c.level=0; c.st='ruin'; c.ruinT=160;
      c.hist.push('플레어로 소실'); if(c.hist.length>8)c.hist.shift(); dirty.add(i);
    } else { flare.set(i,t-1); }
  }

  // nanite blight
  if(blight.size){
    for(const [i,t] of [...blight]){
      if(Math.random()<.17){ for(const n of nbrs(i)){
        if(cells[n].owner!==null && !blight.has(n)){ blight.set(n,11); dirty.add(n); } } }
      if(Math.random()<.23){ const c=cells[i]; c.level--;
        if(c.level<=0){ c.owner=null; c.level=0; c.st='void'; c.hist.push('나노역병 소멸'); }
        if(c.hist.length>8)c.hist.shift(); dirty.add(i);
      }
      if(t<=1){ blight.delete(i); dirty.add(i); } else { blight.set(i,t-1); }
    }
    if(blight.size===0) logEvent('나노역병이 자가소멸했습니다.', '=BLIGHT.PURGE()');
  }

  // civ behaviour
  for(const f of civs){
    if(f.golden>0) f.golden--;
    if(f.size===0) continue;

    // expansion / war
    const attempts=1+(f.size*.08|0);
    for(let a=0;a<attempts;a++){
      const src=f.arr[Math.random()*f.arr.length|0];
      if(src===undefined||cells[src].owner!==f.id) continue;
      const nb2=nbrs(src); const tgt=nb2[Math.random()*nb2.length|0];
      const tc=cells[tgt];
      if(flare.has(tgt)) continue;
      if(tc.owner===null){
        if(tc.st==='belt'){ continue; }                              // belts block until terraformed
        if(tc.st==='nebula'){ if(Math.random()<.18){ tc.st='colony'; tc.hist.push('성운 정착'); setCell(tgt,f.id,1,'전초기지'); } }
        else if(tc.st==='star'){ if(Math.random()<.6){ tc.st='colony'; tc.hist.push('항성계 점유'); setCell(tgt,f.id,1,'전초기지'); } }
        else if(tc.st==='void'){ setCell(tgt,f.id,1,'전초기지'); }
      } else if(tc.owner!==f.id && Math.random()<.32){
        const att=1+Math.random()*3+f.size*.0022+(f.golden?1:0);
        const def=tc.level+1+Math.random()*3;
        flashWar(tgt);
        if(att>def){
          const defF=civById(tc.owner);
          if(Math.random()<.28){ flare.set(tgt,5); tc.hist.push('전화에 소실');
            if(tc.hist.length>8)tc.hist.shift(); dirty.add(tgt);
          } else { setCell(tgt,f.id,Math.max(1,tc.level-1),'정복됨'); }
          if((tc.level>=3||warCd===0)&&defF){
            logEvent(`${f.name}이(가) ${defF.name}의 ${LV_LABEL[Math.max(1,tc.level)]||'영역'}을 공격했습니다.`,
              `=WAR("${f.name}"→"${defF.name}", ${ref(tgt)})`);
            warCd=38;
          }
        }
      }
    }

    // development
    const ups=1+(f.size*.05|0);
    for(let u=0;u<ups;u++){
      const i=f.arr[Math.random()*f.arr.length|0];
      if(i===undefined||cells[i].owner!==f.id) continue;
      const c=cells[i];
      if(c.level<4 && Math.random()<.06*(f.golden?3:1)){
        c.level++; c.hist.push(LV_LABEL[c.level]); if(c.hist.length>8)c.hist.shift(); dirty.add(i);
        if(c.level===4 && warCd===0){
          logEvent(`${f.name}이(가) ${ref(i)}에 다이슨 거점을 완성했습니다.`, `=DYSON("${f.name}", ${ref(i)})`);
          warCd=22;
        }
      }
    }
  }

  // random cosmic events
  const r=Math.random();
  if(!blight.size && r<.004){
    const big=[]; for(let i=0;i<N;i++) if(cells[i].owner!==null && cells[i].level>=3) big.push(i);
    if(big.length){ const i=big[Math.random()*big.length|0]; blight.set(i,11); dirty.add(i);
      logEvent(`${ref(i)}에서 나노역병이 창궐했습니다.`, `=BLIGHT(${ref(i)})`); }
  } else if(r>.9965){
    if(civs.length){ const f=civs[Math.random()*civs.length|0]; f.golden=90;
      logEvent(`${f.name}이(가) 기술 특이점에 도달했습니다.`, `=SINGULARITY("${f.name}", 90)`); }
  } else if(r>.9935 && r<=.9965){
    const tw=[]; for(let i=0;i<N;i++) if(cells[i].owner!==null && cells[i].level>=2) tw.push(i);
    if(tw.length){ const i=tw[Math.random()*tw.length|0]; flare.set(i,6); flashNova(i); dirty.add(i);
      logEvent(`${ref(i)} 인근 항성이 플레어를 분출했습니다.`, `=FLARE(${ref(i)})`); }
  } else if(r<.0009){
    // a star goes supernova — wipe a small area to void
    const i=Math.random()*N|0; flashNova(i);
    for(const j of [i,...nbrs(i)]){ const c=cells[j];
      if(c.owner!==null){ c.owner=null; c.level=0; }
      c.st='void'; c.hist=c.hist.concat('초신성 충격파').slice(-8); dirty.add(j); }
    logEvent(`${ref(i)}의 항성이 초신성으로 폭발했습니다.`, `=SUPERNOVA(${ref(i)})`);
  }

  if(civs.length<3 && Math.random()<.012 && civs.length<6){
    const f=spawnCiv(false);
    if(f) logEvent(`은하 외곽에서 ${f.name}이(가) 도래했습니다.`, `=MIGRATE("${f.name}")`);
  }

  // render
  for(const i of dirty) paint(i);
  dirty.clear();

  popHistory.push(pop); if(popHistory.length>120) popHistory.shift();

  updateStatus();
  if(tickN%8===0){ updateHud(); if(logDirty){ renderLog(); logDirty=false; } }
  if(deadDirty){ renderDead(); deadDirty=false; }
}
let deadDirty=false;

// ===================================================================
//  RENDERING: status / hud / chronicle / extinction
// ===================================================================
const stYear=document.getElementById('st-year'), stPop=document.getElementById('st-pop'),
      stCiv=document.getElementById('st-civ'), stEvent=document.getElementById('st-event'),
      stReady=document.getElementById('st-ready');
function fmtPop(p){ if(p>=1e8) return (p/1e8).toFixed(2)+'억'; if(p>=1e4) return (p/1e4).toFixed(1)+'만'; return p.toLocaleString(); }
function updateStatus(){
  stYear.textContent=`표준력 ${year}년`;
  stPop.textContent=`총 인구 ${fmtPop(pop)}`;
  stCiv.textContent=`문명 ${civs.length}`;
  stEvent.textContent=lastEvent;
  stReady.textContent= running ? '계산 중' : '일시정지';
  document.getElementById('tab-dead').textContent=`멸망기록 (${obituaries.length})`;
}

function updateHud(){
  const sorted=[...civs].sort((a,b)=>b.size-a.size);
  let h='';
  if(!sorted.length) h='<div style="color:#7e8aa3">활동 중인 문명이 없습니다.</div>';
  for(const f of sorted){
    h+=`<div class="frow"><span class="sw" style="background:${f.color};box-shadow:0 0 6px ${f.color}"></span>`
      +`<span class="fn">${f.name}${f.golden?' <span class="gold">✦</span>':''}</span>`
      +`<span class="sz">${f.size}</span></div>`;
  }
  h+='<canvas id="chart" width="196" height="38"></canvas>';
  h+=`<div class="sub">은하 인구 추이 · 표준력 ${year}년</div>`;
  hudbody.innerHTML=h;
  drawChart();
  if(G.mobile){} // chart still drawn small
  document.title=`성간식민장부.xlsx - Excel (표준력 ${year}년)`;
}
function drawChart(){
  const cv=document.getElementById('chart'); if(!cv) return;
  const ctx=cv.getContext('2d'), W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);
  if(popHistory.length<2) return;
  const mx=Math.max(...popHistory,1);
  ctx.beginPath();
  popHistory.forEach((v,i)=>{ const x=i/(popHistory.length-1)*W, y=H-2-(v/mx)*(H-5);
    i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.strokeStyle='#34d399'; ctx.lineWidth=1.4; ctx.stroke();
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath();
  ctx.fillStyle='rgba(52,211,153,.16)'; ctx.fill();
}

const logrows=document.getElementById('logrows'), deadrows=document.getElementById('deadrows');
function renderLog(){
  const rows=chronicle.slice(-160).reverse();
  logrows.innerHTML=rows.map(e=>
    `<div class="logrow"><span class="yr">표준력 ${e.year}년</span>`
    +`<span class="ms">${e.msg}</span></div>`
    +(e.formula?`<div class="logrow"><span class="yr"></span><span class="fx">${esc(e.formula)}</span></div>`:'')
  ).join('');
}
function renderDead(){
  if(!obituaries.length){ deadrows.innerHTML='<div class="empty">아직 멸망한 문명이 없습니다. 별들은 아직 젊습니다.</div>'; return; }
  deadrows.innerHTML=[...obituaries].reverse().map(o=>
    `<div class="obit"><span class="cross" style="color:${o.color}">†</span>`
    +`<span class="nm" style="color:${o.color}">${o.name}</span>`
    +`<span class="det">표준력 ${o.born}년 ~ ${o.died}년 · ${o.span}년간 존속</span></div>`
  ).join('');
}
function esc(s){ return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

// ===================================================================
//  GRID DOM (re)build
// ===================================================================
function buildGrid(){
  sheet.style.gridTemplateColumns=`44px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows=CH+'px';
  const frag=document.createDocumentFragment();
  const corner=document.createElement('div'); corner.className='hd corner'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){ const hh=document.createElement('div'); hh.className='hd colh'; hh.textContent=colName(c); frag.appendChild(hh); }
  for(let r=0;r<ROWS;r++){
    const hh=document.createElement('div'); hh.className='hd rowh'; hh.textContent=r+1; frag.appendChild(hh);
    for(let c=0;c<COLS;c++){
      const i=r*COLS+c;
      const d=document.createElement('div'); d.className='cell'; d.dataset.i=i;
      const g=document.createElement('span'); g.className='glyph'; d.appendChild(g);
      cellEls[i]=d; frag.appendChild(d);
    }
  }
  sheet.innerHTML=''; sheet.appendChild(frag);
  for(let i=0;i<N;i++) paint(i);
}
buildGrid();

// ===================================================================
//  INTERACTION
// ===================================================================
function selectCell(i){
  if(selected>=0 && cellEls[selected]) cellEls[selected].classList.remove('sel');
  selected=i;
  if(i<0){ nb.textContent='A1'; return; }
  cellEls[i].classList.add('sel');
  nb.textContent=ref(i);
  const c=cells[i];
  if(!fmla.matches(':focus')){
    fmla.value=`=HISTORY(${c.hist.map(x=>`"${x}"`).join(' → ')})`;
    fmla.classList.remove('cmd');
  }
}

sheet.addEventListener('click',e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  selectCell(+t.dataset.i);
});

sheet.addEventListener('mousemove',e=>{
  const t=e.target.closest('.cell');
  if(!t){ cellinfo.style.display='none'; return; }
  const i=+t.dataset.i, c=cells[i];
  let owner='—';
  if(c.owner!==null){ const f=civById(c.owner); if(f) owner=f.name; }
  const stmap={void:'공허',star:'항성계',nebula:'성운',belt:'소행성대',colony:LV_LABEL[c.level]||'식민지',ruin:'폐허'};
  cellinfo.style.display='block';
  cellinfo.innerHTML=`<b>${ref(i)}</b> · ${stmap[c.st]||c.st} · 소유: ${owner}<br>`
    +`<span style="color:#8de0b0">=HISTORY(</span>${c.hist.slice(-4).join(' → ')}<span style="color:#8de0b0">)</span>`;
});
sheet.addEventListener('mouseleave',()=>{ cellinfo.style.display='none'; });

// formula bar: typed commands
fmla.addEventListener('focus',()=>{ fmla.classList.add('cmd'); });
fmla.addEventListener('blur',()=>{ if(selected>=0) selectCell(selected); });
fmla.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  runCommand(fmla.value.trim());
  fmla.blur();
});

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1900);
}

function runCommand(raw){
  const cmd=raw.toUpperCase().replace(/[\s()=]/g,'');
  const target = selected>=0 ? selected : (Math.random()*N|0);
  if(cmd.startsWith('COLONIZE')||cmd.startsWith('SPAWN')){ cmdColonize(target); }
  else if(cmd.startsWith('TERRAFORM')){ cmdTerraform(target); }
  else if(cmd.startsWith('BOMB')||cmd.startsWith('NUKE')){ cmdBomb(target); }
  else if(cmd.startsWith('SUPERNOVA')||cmd.startsWith('NOVA')){ cmdNova(target); }
  else if(cmd.startsWith('BLIGHT')||cmd.startsWith('PLAGUE')){ cmdBlight(target); }
  else if(cmd.startsWith('SINGULARITY')||cmd.startsWith('GOLDEN')){ cmdSingularity(); }
  else { toast('알 수 없는 수식입니다'); }
}

function cmdColonize(i){
  const c=cells[i];
  if(c.owner!==null){ // reinforce
    if(c.level<4){ c.level++; c.hist.push(LV_LABEL[c.level]); paint(i); toast(ref(i)+' 식민지 강화'); }
    else toast('이미 최대 발전 단계입니다');
    logEvent(`${ref(i)} 식민지가 강화되었습니다.`, `=COLONIZE(${ref(i)})`);
    return;
  }
  if(c.st==='belt'){ toast('소행성대는 먼저 테라포밍이 필요합니다'); return; }
  const f=spawnCiv(true,i);
  if(f){ toast(`${f.name} 건국 — ${ref(i)}`); paint(i); updateHud(); }
}
function cmdTerraform(i){
  const c=cells[i];
  if(c.st==='belt'||c.st==='nebula'||c.st==='void'||c.st==='ruin'){
    c.st='star'; c.hist.push('테라포밍'); if(c.hist.length>8)c.hist.shift();
    paint(i); toast(ref(i)+' 거주가능 항성계로 변환');
    logEvent(`${ref(i)}이(가) 테라포밍으로 거주가능해졌습니다.`, `=TERRAFORM(${ref(i)})`);
  } else if(c.owner!==null){
    if(c.level<4){ c.level++; c.hist.push(LV_LABEL[c.level]); paint(i); toast(ref(i)+' 발전 +1'); }
    else toast('이미 다이슨 거점입니다');
  } else toast('항성계로 이미 변환되었습니다');
}
function cmdBomb(i){
  const c=cells[i];
  flashWar(i);
  if(c.owner!==null){
    const f=civById(c.owner);
    flare.set(i,4); c.hist.push('궤도폭격'); if(c.hist.length>8)c.hist.shift(); dirty.add(i);
    logEvent(`${f?f.name:'미지의'} 영역 ${ref(i)}이(가) 궤도폭격당했습니다.`, `=BOMB(${ref(i)})`);
    toast(ref(i)+' 궤도폭격 — 화염 확산');
  } else { c.st='ruin'; c.ruinT=120; c.hist.push('폭격'); paint(i); toast(ref(i)+' 폭격 — 폐허화'); }
}
function cmdNova(i){
  flashNova(i);
  for(const j of [i,...nbrs(i)]){ const c=cells[j];
    if(c.owner!==null){ c.owner=null; c.level=0; } c.st='void'; c.hist=c.hist.concat('초신성').slice(-8); dirty.add(j); }
  for(const j of dirty) paint(j); dirty.clear();
  logEvent(`${ref(i)}에서 초신성을 인위적으로 점화했습니다.`, `=SUPERNOVA(${ref(i)})`);
  toast(ref(i)+' 초신성 폭발!');
}
function cmdBlight(i){
  if(cells[i].owner===null){ toast('점령된 셀에만 역병을 풀 수 있습니다'); return; }
  blight.set(i,11); dirty.add(i); paint(i);
  logEvent(`${ref(i)}에 나노역병을 살포했습니다.`, `=BLIGHT(${ref(i)})`);
  toast(ref(i)+' 나노역병 살포');
}
function cmdSingularity(){
  if(!civs.length){ toast('문명이 없습니다'); return; }
  const f= (selected>=0 && cells[selected].owner!==null) ? civById(cells[selected].owner)
          : civs[Math.random()*civs.length|0];
  f.golden=90;
  logEvent(`${f.name}이(가) 기술 특이점에 도달했습니다.`, `=SINGULARITY("${f.name}", 90)`);
  toast(f.name+' 특이점 돌입 ✦');
}

// ribbon buttons
const need=()=>{ if(selected<0){ toast('먼저 셀을 선택하세요'); return false; } return true; };
document.getElementById('b-colonize').onclick=()=>{ if(need()) cmdColonize(selected); };
document.getElementById('b-terra').onclick   =()=>{ if(need()) cmdTerraform(selected); };
document.getElementById('b-bomb').onclick    =()=>{ if(need()) cmdBomb(selected); };
document.getElementById('b-nova').onclick     =()=>{ cmdNova(selected>=0?selected:(Math.random()*N|0)); };
document.getElementById('b-blight').onclick   =()=>{ const t=(selected>=0&&cells[selected].owner!==null)?selected:pickOwned(); if(t>=0)cmdBlight(t); else toast('점령된 셀이 없습니다'); };
document.getElementById('b-spawn').onclick     =()=>{ const f=spawnCiv(true,selected>=0?selected:null); if(f){toast(f.name+' 등장');updateHud();} else toast('정착 가능한 곳이 없습니다'); };
function pickOwned(){ const o=[]; for(let i=0;i<N;i++) if(cells[i].owner!==null) o.push(i); return o.length?o[Math.random()*o.length|0]:-1; }

// play / speed
const bPlay=document.getElementById('b-play'), bPlayT=document.getElementById('b-play-t');
let timer=null;
function schedule(){ if(timer) clearInterval(timer); timer=setInterval(()=>{ if(running) tick(); }, 120/speed); }
const bPlayIc=document.getElementById('b-play-ic');
bPlay.onclick=()=>{
  running=!running;
  bPlayIc.textContent= running?'❚❚':'▶';
  bPlayT.textContent= running?'일시정지':'재생';
  bPlay.classList.toggle('on',!running);
  updateStatus();
};
document.getElementById('b-fast').onclick=()=>{ speed=Math.min(8,speed*2); schedule(); toast('속도 ×'+speed); };
document.getElementById('b-slow').onclick=()=>{ speed=Math.max(.25,speed/2); schedule(); toast('속도 ×'+speed); };
schedule();

// tabs
document.querySelectorAll('#tabs .tab').forEach(tb=>{
  tb.onclick=()=>{
    document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
    tb.classList.add('on');
    const v=tb.dataset.v;
    document.getElementById('view-'+v).classList.add('on');
    if(v==='log') renderLog();
    if(v==='dead') renderDead();
  };
});

// view: fit (just a flourish — re-fit grid)
document.getElementById('b-fit').onclick=()=>{ rebuild(); toast('화면에 맞춤'); };

// ===================================================================
//  STARFIELD backdrop
// ===================================================================
const starCv=document.getElementById('stars'), sctx=starCv.getContext('2d');
let starList=[];
function initStars(){
  const w=starCv.width=main.clientWidth, h=starCv.height=main.clientHeight;
  starList=[]; const n=Math.min(180,(w*h)/9000|0);
  for(let i=0;i<n;i++) starList.push({x:Math.random()*w,y:Math.random()*h,
    r:Math.random()*1.3+.2, a:Math.random(), sp:Math.random()*.02+.004});
}
function drawStars(){
  const w=starCv.width,h=starCv.height; sctx.clearRect(0,0,w,h);
  for(const s of starList){ s.a+=s.sp; const al=.25+Math.abs(Math.sin(s.a))*.55;
    sctx.beginPath(); sctx.arc(s.x,s.y,s.r,0,7); sctx.fillStyle=`rgba(200,215,255,${al})`; sctx.fill(); }
  requestAnimationFrame(drawStars);
}
initStars(); drawStars();

// ===================================================================
//  RESIZE / REBUILD
// ===================================================================
function rebuild(){
  G=calcGrid();
  const newN=G.cols*G.rows;
  // keep sim alive: rebuild field only if dimensions changed materially
  if(G.cols!==COLS||G.rows!==ROWS){
    COLS=G.cols; ROWS=G.rows; CW=G.CW; CH=G.CH; N=newN;
    cells.length=0; cellEls.length=0;
    buildField();
    // reseed civs proportionally
    const keep=Math.max(2,civs.length);
    civs=[]; nameIdx=0; obituaries.length=0; chronicle.length=0; popHistory.length=0;
    blight.clear(); flare.clear(); dirty.clear(); selected=-1; year=0;
    buildGrid();
    for(let k=0;k<keep;k++) spawnCiv(true);
  } else { CW=G.CW; CH=G.CH;
    sheet.style.gridTemplateColumns=`44px repeat(${COLS}, ${CW}px)`;
    sheet.style.gridAutoRows=CH+'px';
  }
  initStars();
}
let rzTimer=null;
window.addEventListener('resize',()=>{ clearTimeout(rzTimer); rzTimer=setTimeout(rebuild,260); });

// ===================================================================
//  BOOT
// ===================================================================
fmla.value=`=SIM.GALAXY($A$1:$${colName(COLS-1)}$${ROWS}, "별의 운명은 표에 적힌다")`;
spawnCiv(true); spawnCiv(true); spawnCiv(true);
updateHud(); updateStatus(); renderLog(); renderDead();
})();
</script>
