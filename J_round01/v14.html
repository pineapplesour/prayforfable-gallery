<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>대이주.xlsx - Excel</title>
<style>
  :root{
    --green:#107c41; --grid:#e3e3e3; --grid-d:#d0d0d0;
    --chrome:#f3f2f1; --hd:#f5f5f5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",-apple-system,sans-serif;
    font-size:12px;color:#222;-webkit-tap-highlight-color:transparent}
  #app{display:flex;flex-direction:column;height:100%;user-select:none}

  /* ---- titlebar ---- */
  #titlebar{height:30px;background:var(--chrome);display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:none}
  .dot{width:11px;height:11px;border-radius:50%;flex:none}
  #titlebar .ttl{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  #titlebar .qa{margin-left:auto;color:#9a9a9a;font-size:11px;display:flex;gap:10px}
  #titlebar .qa b{font-weight:400}

  /* ---- menubar ---- */
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;
    overflow:hidden;flex:none}
  #menubar i{font-style:normal;padding:4px 2px;white-space:nowrap}
  #menubar b{color:var(--green);border-bottom:2.5px solid var(--green);padding:4px 2px;font-weight:600}

  /* ---- formula bar ---- */
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px;flex:none}
  #namebox{width:68px;min-width:68px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;gap:4px}
  #namebox .car{color:#bbb;font-size:9px}
  #fx{width:30px;min-width:30px;text-align:center;color:#9a8d2e;font-style:italic;font-family:Georgia,serif;
    border-right:1px solid #ededed}
  #formula{flex:1;padding:0 10px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---- sheet ---- */
  #stage{position:relative;flex:1;overflow:hidden;background:#fff;min-height:0}
  #sheet{position:absolute;inset:0;display:grid}
  .hd{background:var(--hd);border-right:1px solid var(--grid-d);border-bottom:1px solid var(--grid-d);
    display:flex;align-items:center;justify-content:center;color:#666;font-size:10.5px;font-weight:500}
  .hd.csel{background:#d8e8dd;color:var(--green);font-weight:700}
  .cell{position:relative;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);
    display:flex;align-items:center;justify-content:center;font-size:11px;
    overflow:hidden;cursor:cell;transition:background .25s linear}
  .cell .g{position:relative;z-index:2;line-height:1}
  .cell.sel{outline:2px solid var(--green);outline-offset:-2px;z-index:5}
  /* trail dot drawn as ::before so it never displaces the glyph */
  .cell.trail::before{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;
    border-radius:50%;transform:translate(-50%,-50%);background:var(--tc,#c9b48a);
    opacity:var(--ta,.5);z-index:1}
  @keyframes pulse{0%,100%{box-shadow:inset 0 0 0 0 transparent}
    50%{box-shadow:inset 0 0 0 2px var(--pc,#dc2626)}}
  .cell.clash{animation:pulse .3s 3}
  @keyframes born{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
  .cell .g.pop{animation:born .4s ease-out}

  /* ---- overlay legend / climate ---- */
  #panel{position:absolute;top:8px;right:12px;width:212px;background:#fffdf2;
    border:1px solid #d8c66a;box-shadow:2px 4px 12px rgba(0,0,0,.16);
    font-size:11px;z-index:20;line-height:1.65;border-radius:2px}
  #panel h4{margin:0;padding:6px 11px 4px;font-size:11px;color:#7a6a1f;
    border-bottom:1px solid #ece0a8;font-weight:700;letter-spacing:.2px}
  #panel .body{padding:6px 11px 8px;max-height:46vh;overflow:hidden}
  #panel .row{display:flex;align-items:center;gap:6px;white-space:nowrap}
  #panel .sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
  #panel .nm{overflow:hidden;text-overflow:ellipsis}
  #panel .ct{margin-left:auto;color:#998;font-size:10px}
  #panel .dead{color:#a59; font-size:10px;color:#9a8aa0}
  #panel .sub{margin:7px 0 2px;font-size:10px;color:#9a8a3a;font-weight:700;
    border-top:1px dashed #e3d59a;padding-top:5px}
  #climate{position:absolute;left:12px;bottom:12px;width:186px;background:#f2f7fb;
    border:1px solid #b8d2e6;box-shadow:2px 4px 10px rgba(0,0,0,.12);z-index:20;border-radius:2px}
  #climate h4{margin:0;padding:5px 10px 3px;font-size:10.5px;color:#2b6ca3;font-weight:700;
    border-bottom:1px solid #d4e6f2}
  #climate .body{padding:5px 10px 7px;font-size:10.5px;line-height:1.6;color:#33526b}
  #climate .bar{height:7px;border-radius:4px;margin:3px 0 5px;
    background:linear-gradient(90deg,#7fb3e0,#bfe0a8,#f3d27a,#e08a5a)}
  #climate .marker{position:relative;height:0}
  #climate .marker i{position:absolute;top:-13px;width:1px;height:9px;background:#2b6ca3}

  /* ---- statusbar ---- */
  #statusbar{height:24px;background:var(--green);color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;flex:none;overflow:hidden}
  #statusbar .seg{white-space:nowrap;display:flex;align-items:center}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .ev{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  #statusbar .zoom{margin-left:10px;opacity:.7;font-size:11px}

  /* ---- tabs ---- */
  #tabs{height:26px;background:var(--chrome);display:flex;align-items:flex-end;
    padding-left:26px;border-top:1px solid #d4d4d4;font-size:11.5px;flex:none;gap:2px;
    overflow-x:auto}
  #tabs .tab{padding:3px 13px;border:1px solid #d4d4d4;border-bottom:none;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap;border-radius:3px 3px 0 0}
  #tabs .tab.on{background:#fff;color:var(--green);font-weight:600;border-top:2px solid var(--green)}
  #tabs .plus{padding:3px 9px;color:#999;cursor:default}

  /* ---- overlay sheets (연대기 / 멸망기록) ---- */
  #docsheet{position:absolute;inset:0;background:#fff;z-index:30;overflow:auto;display:none;
    padding:14px 22px 30px}
  #docsheet h2{font-size:15px;color:var(--green);margin:4px 0 2px;font-weight:700}
  #docsheet .meta{color:#888;font-size:11px;margin-bottom:12px}
  #docsheet table{border-collapse:collapse;width:100%;max-width:880px;font-size:11.5px}
  #docsheet th{background:var(--hd);border:1px solid var(--grid-d);padding:4px 9px;
    text-align:left;color:#555;font-weight:600;position:sticky;top:-14px}
  #docsheet td{border:1px solid var(--grid);padding:4px 9px;vertical-align:top}
  #docsheet td.y{color:#888;width:74px;font-family:Consolas,monospace;white-space:nowrap}
  #docsheet td.f{font-family:Consolas,monospace;color:#3a5a8a;font-size:10.5px;width:230px}
  #docsheet tr:nth-child(even) td{background:#fafafa}
  #docsheet .empty{color:#aaa;padding:20px 4px}

  @media (max-width:560px){
    #menubar{gap:9px;font-size:11px;padding:0 8px}
    #panel{width:150px;font-size:10px;top:6px;right:6px}
    #panel .body{max-height:30vh}
    #climate{width:138px;left:6px;bottom:8px}
    #namebox{width:54px;min-width:54px}
    #titlebar .qa{display:none}
    #statusbar{font-size:10.5px;padding:0 7px}
    #statusbar .hideM{display:none}
    #docsheet td.f{display:none}
    #docsheet{padding:10px 12px 30px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <div class="ttl">대이주.xlsx - Excel</div>
    <div class="qa"><b>자동 저장 ●</b><b>↺</b><b>↻</b></div>
  </div>
  <div id="menubar">
    <i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i>
  </div>
  <div id="fbar">
    <div id="namebox"><span id="nameref">A1</span><span class="car">▾</span></div>
    <div id="fx">fx</div>
    <div id="formula"></div>
  </div>
  <div id="stage">
    <div id="sheet"></div>
    <div id="panel">
      <h4>대이주 시대 — 민족 현황</h4>
      <div class="body" id="panelBody"></div>
    </div>
    <div id="climate">
      <h4>기후 (=CLIMATE)</h4>
      <div class="body" id="climateBody"></div>
    </div>
    <div id="docsheet"></div>
  </div>
  <div id="tabs">
    <div class="tab on" data-sheet="map">이주도</div>
    <div class="tab" data-sheet="chron">연대기</div>
    <div class="tab" data-sheet="dead">멸망기록 (0)</div>
    <div class="plus">+</div>
  </div>
  <div id="statusbar">
    <div class="seg"><span id="sbReady">준비</span></div>
    <span class="sep">|</span>
    <div class="seg" id="sbYear">서기 1년</div>
    <span class="sep hideM">|</span>
    <div class="seg hideM" id="sbPop">유랑민 0</div>
    <span class="sep hideM">|</span>
    <div class="seg hideM" id="sbFac">민족 0</div>
    <span class="sep">|</span>
    <div class="ev" id="sbEvent">천지가 갈라지고, 사람들이 길 위에 섰습니다.</div>
    <span class="zoom">합계 0 &nbsp; — &nbsp; ⊞ ▦ &nbsp; 100%</span>
  </div>
</div>

<script>
(() => {
"use strict";
// =========================================================================
//  대이주.xlsx  —  스프레드시트로 위장한 "대이주 시대" 문명 시뮬
//  핵심 변주: 영토 정복이 아니라 "이주(migration)"가 엔진.
//  기후 띠가 남하/건조화하며 사람들을 길 위로 내몬다. 카라반이 셀을
//  가로질러 이동하고(빛바랜 자취를 남김), 살 만한 땅에 정착(帳→邑→城),
//  땅이 죽으면 다시 길을 떠난다. 카라반이 만나면 합류 또는 충돌.
// =========================================================================

const stage   = document.getElementById('stage');
const sheetEl = document.getElementById('sheet');
const fmla    = document.getElementById('formula');
const nameref = document.getElementById('nameref');
const panelB  = document.getElementById('panelBody');
const climB   = document.getElementById('climateBody');
const docsheet= document.getElementById('docsheet');
const sbYear=document.getElementById('sbYear'), sbPop=document.getElementById('sbPop'),
      sbFac=document.getElementById('sbFac'), sbEvent=document.getElementById('sbEvent'),
      sbReady=document.getElementById('sbReady');

// ---- grid geometry (responsive) ----
let COLS, ROWS, N, CW, CH;
function computeGeom(){
  const w = stage.clientWidth, h = stage.clientHeight;
  CW = w < 560 ? 26 : 33;
  CH = w < 560 ? 22 : 22;
  COLS = Math.max(14, Math.min(46, Math.floor((w - 44) / CW)));
  ROWS = Math.max(12, Math.min(40, Math.floor((h - 2)  / CH)));
  N = COLS * ROWS;
}

function colName(n){ let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0;} return s; }
const xy = i => [i%COLS, i/COLS|0];
const ref = i => colName(i%COLS) + (Math.floor(i/COLS)+1);
const idx = (x,y) => y*COLS+x;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a=1)=>Math.random()*a;
const pick=arr=>arr[Math.random()*arr.length|0];

// ---- world state ----
let cells=[];          // per-cell: terrain/settlement/history
let cellEls=[];        // DOM
let peoples=[];        // 민족 (each owns caravans + settlements)
let caravans=[];       // moving groups
const obituaries=[];   // 멸망기록
const chronicle=[];    // 연대기 {year,msg,formula}
let year=0, tickN=0, selected=-1, paused=false;
const dirty=new Set();

// climate: a habitability gradient that DRIFTS. "한대선"(cold line) creeps
// south, "건조전선"(drought front) sweeps across. North & a moving band
// become unlivable, pushing peoples toward the warm/wet south.
let coldLine = 0;        // rows above this are freezing (0..ROWS), grows
let droughtX = -3;       // moving drought column
let climPhase = 0;

// terrain glyphs
const T = { water:'≈', forest:'木', mountain:'▲', steppe:'∴', land:'', ruin:'墟', oasis:'❋', frost:'❄' };

// ---- terrain generation (value noise) ----
let GW=10, GH=7, gz=[];
function noise(x,y){
  const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const g=(c,r)=>gz[clamp(r,0,GH-1)*GW+clamp(c,0,GW-1)];
  const a=g(x0,y0),b=g(x0+1,y0),c=g(x0,y0+1),d=g(x0+1,y0+1);
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}

function genWorld(){
  cells=new Array(N); gz=[];
  for(let i=0;i<GW*GH;i++) gz[i]=Math.random();
  for(let i=0;i<N;i++){
    const [x,y]=xy(i);
    const v=noise(x,y)+(rnd()-.5)*.12;
    let st='land', label='황무지';
    if(v<.30){ st='water'; label='바다'; }
    else if(v>.74){ st='mountain'; label='산맥'; }
    else if(v>.60 && rnd()<.62){ st='forest'; label='숲'; }
    else if(v>.44 && v<.55 && rnd()<.4){ st='steppe'; label='초원'; }
    // base habitability: prefer mid-elevation, warm south
    cells[i]={
      st, owner:null, level:0, ruinT:0,
      hist:[label],
      fertility:0,          // recomputed each tick from climate
      caravanHere:null,
      trail:0, trailColor:'#c9b48a'
    };
  }
  // sprinkle oases in the dry south as migration magnets
  for(let k=0;k<Math.max(2,N*0.012|0);k++){
    const i=Math.random()*N|0;
    if(cells[i].st==='land'||cells[i].st==='steppe'){ cells[i].st='oasis'; cells[i].hist=['오아시스']; }
  }
}

function nbrs(i){
  const [x,y]=xy(i), out=[];
  if(x>0)out.push(i-1); if(x<COLS-1)out.push(i+1);
  if(y>0)out.push(i-COLS); if(y<ROWS-1)out.push(i+COLS);
  return out;
}
function nbrs8(i){
  const [x,y]=xy(i), out=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue; const nx=x+dx,ny=y+dy;
    if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS)out.push(idx(nx,ny));
  }
  return out;
}

// ---- climate -> habitability ----
function habitability(i){
  const [x,y]=xy(i), c=cells[i];
  if(c.st==='water'||c.st==='mountain') return -1;
  let h=1;
  if(y < coldLine) h -= (coldLine - y)*0.5 + 0.4;          // frozen north
  const dd = Math.abs(x - droughtX);
  if(dd < 2.2) h -= (2.2 - dd)*0.6;                         // drought front
  if(c.st==='oasis') h += 1.2;                              // oasis = haven
  if(c.st==='forest') h += 0.25;
  if(c.st==='steppe') h += 0.1;
  // warm south slightly more livable
  h += (y/ROWS)*0.15;
  return h;
}

// =========================================================================
//  민족 / 카라반
// =========================================================================
const NAMES=['바람의 일족','잿빛 유랑단','소금길 사람들','북풍 난민','여명 부족','강을 잃은 자들',
  '모래의 후예','삼나무 순례단','검은 천막 칸','별을 좇는 무리','마지막 농경민','얼음 너머 종족'];
const COLORS=['#2563eb','#6b7280','#0d9488','#7c3aed','#d97706','#0ea5e9',
  '#b45309','#059669','#be185d','#9333ea','#4d7c0f','#0891b2'];
let nameIdx=0;

function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}

function newPeople(){
  const i = nameIdx % NAMES.length;
  const p={ id:peoples.length?Math.max(...peoples.map(x=>x.id))+1:0,
    name:NAMES[i], color:COLORS[i%COLORS.length], settle:0, moving:0,
    founded:year, prosperity:0 };
  nameIdx++; peoples.push(p); return p;
}
const pById=id=>peoples.find(p=>p.id===id);

// spawn a caravan at a (preferably northern / harsh) edge — they come from
// the dying lands, heading inward.
function spawnCaravan(p, originLabel){
  let start=-1;
  for(let t=0;t<300;t++){
    const edge=Math.floor(rnd(4));
    let x,yy;
    if(edge===0){x=Math.random()*COLS|0; yy=0;}
    else if(edge===1){x=Math.random()*COLS|0; yy=ROWS-1;}
    else if(edge===2){x=0; yy=Math.random()*ROWS|0;}
    else {x=COLS-1; yy=Math.random()*ROWS|0;}
    const i=idx(x,yy);
    if(cells[i].st!=='water'&&cells[i].st!=='mountain'){ start=i; break; }
  }
  if(start<0){ for(let i=0;i<N;i++) if(cells[i].st==='land'){start=i;break;} }
  if(start<0) return null;
  const car={ id:Math.random(), pid:p.id, pos:start, size:6+Math.floor(rnd(10)),
    patience:14+Math.floor(rnd(18)), color:p.color, history:[start] };
  caravans.push(car);
  cells[start].caravanHere=car;
  dirty.add(start);
  return car;
}

// =========================================================================
//  설정: 정착 / 자취 / 도시 글리프
// =========================================================================
const SETTLE_TXT=['','帳','邑','城','京'];     // tent, town, fortified, capital
const SETTLE_LABEL=['','야영지','정착촌','성읍','수도'];

function setSettlement(i, pid, level, label){
  const c=cells[i];
  c.owner=pid; c.level=level;
  if(c.st!=='oasis') c.st='land';
  if(label){ c.hist.push(label); if(c.hist.length>8)c.hist.shift(); }
  dirty.add(i);
}

function paint(i){
  const c=cells[i], el=cellEls[i]; if(!el) return;
  let bg='', tx='', col='#333', w='', popAnim=false;
  // trail layer via CSS var
  if(c.trail>0){ el.classList.add('trail'); el.style.setProperty('--ta', (0.18+c.trail*0.13).toFixed(2));
    el.style.setProperty('--tc', c.trailColor); }
  else el.classList.remove('trail');

  if(c.caravanHere){
    const p=pById(c.caravanHere.pid);
    bg=hexA(p?p.color:'#888',.22); tx='⛺'; col=p?p.color:'#888'; w='700';
  } else if(c.st==='water'){ bg='#dbeaf7'; tx=T.water; col='#9dc3e6'; }
  else if(c.st==='mountain'){ bg='#eceae6'; tx=T.mountain; col='#a0978a'; }
  else if(c.st==='oasis' && c.owner===null){ bg='#e6f6ec'; tx=T.oasis; col='#2e9e5b'; }
  else if(c.st==='forest'){ bg='#e6f0dc'; tx=T.forest; col='#5a8a3a'; }
  else if(c.st==='steppe'){ bg='#f2f0e2'; tx=T.steppe; col='#b0a060'; }
  else if(c.st==='ruin'){ bg='#ededed'; tx=T.ruin; col='#a0a0a0'; }
  else if(c.owner!==null){
    const p=pById(c.owner);
    if(p){ bg=hexA(p.color,.14+c.level*.16); tx=SETTLE_TXT[c.level]; col=p.color; w=c.level>=3?'700':''; }
  }
  // frozen overlay tint for the cold north (only on empty land)
  if(!c.caravanHere && c.owner===null && (c.st==='land'||c.st==='steppe') ){
    const [,y]=xy(i);
    if(y < coldLine){ bg='#eef3f8'; if(!tx){ tx=T.frost; col='#aac4dd'; } }
  }
  el.style.background=bg;
  el.firstChild.style.color=col;
  el.firstChild.style.fontWeight=w;
  el.firstChild.textContent=tx;
  if(popAnim) el.firstChild.classList.add('pop');
}

// =========================================================================
//  로그 / 연대기
// =========================================================================
function logEvent(msg, formula, toChron=true){
  sbEvent.textContent=`서기 ${year}년 — ${msg}`;
  if(formula) fmla.textContent=formula;
  if(toChron && formula){
    chronicle.push({year, msg, formula});
    if(chronicle.length>400) chronicle.shift();
  }
}

// =========================================================================
//  TICK — 한 해(年)
// =========================================================================
function tick(){
  if(paused) return;
  tickN++; year++;

  // --- climate drift ---
  climPhase += 0.012;
  // cold line creeps south slowly, oscillating (ice ages)
  coldLine = clamp(1.2 + (Math.sin(climPhase*0.7)*0.5+0.5)*(ROWS*0.42) + tickN*0.0015, 0, ROWS*0.6);
  // drought front sweeps; wraps around for a fresh sweep
  droughtX += 0.06;
  if(droughtX > COLS+3){ droughtX=-3; }

  // recompute fertility cache + repaint climate-affected empty cells occasionally
  if(tickN%4===0){
    for(let i=0;i<N;i++){ if(cells[i].owner===null && !cells[i].caravanHere) dirty.add(i); }
  }

  // --- recount peoples ---
  for(const p of peoples){ p.settle=0; p.moving=0; p.prosperity=0; }
  let totalMoving=0;
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.trail>0){ c.trail-=0.06; if(c.trail<=0){c.trail=0; dirty.add(i);} }
    if(c.st==='ruin'){ if(--c.ruinT<=0){ c.st='land'; c.hist.push('땅이 되살아남'); if(c.hist.length>8)c.hist.shift(); dirty.add(i);} }
    if(c.owner!==null){
      const p=pById(c.owner);
      if(p){ p.settle++; p.prosperity += [0,1,4,12,30][c.level]; }
      else { c.owner=null; c.level=0; dirty.add(i); }
    }
  }
  for(const car of caravans){ const p=pById(car.pid); if(p){ p.moving++; totalMoving+=car.size; } }

  // --- settlement decay when land turns hostile ---
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.owner===null) continue;
    const h=habitability(i);
    if(h < -0.2){
      // land died -> abandon, sometimes ruin; survivors flee as a caravan
      const p=pById(c.owner);
      if(rnd()<0.5 || c.level<=1){
        if(p && rnd()<0.55){
          // spawn fleeing caravan from this cell
          const car={id:Math.random(),pid:p.id,pos:i,size:2+Math.floor(rnd(6)),
            patience:10+Math.floor(rnd(14)),color:p.color,history:[i]};
          caravans.push(car);
          c.caravanHere=car;
        }
        c.owner=null; c.level=0;
        const cold = xy(i)[1] < coldLine;
        c.hist.push(cold?'혹한에 버려짐':'가뭄에 버려짐'); if(c.hist.length>8)c.hist.shift();
        dirty.add(i);
        if(rnd()<0.25){
          logEvent(`${p?p.name:'어느 민족'}이(가) ${ref(i)}의 ${cold?'얼어붙은':'메마른'} 땅을 버리고 떠납니다.`,
            `=ABANDON(${ref(i)}, ${cold?'"한대"':'"가뭄"'})`);
        }
      } else {
        c.level--; dirty.add(i);
        c.hist.push('쇠퇴'); if(c.hist.length>8)c.hist.shift();
      }
    } else if(h>0.4 && c.level<4 && rnd()<0.035*(1+habitability(i)*0.3)){
      // prosper / grow
      c.level++;
      c.hist.push(SETTLE_LABEL[c.level]); if(c.hist.length>8)c.hist.shift();
      dirty.add(i);
      if(c.level===4){
        const p=pById(c.owner);
        logEvent(`${p?p.name:''}이(가) ${ref(i)}에 수도를 세웠습니다.`, `=CAPITAL("${p?p.name:''}", ${ref(i)})`);
      } else if(c.level===3 && rnd()<0.4){
        const p=pById(c.owner);
        logEvent(`${p?p.name:''}의 ${ref(i)}이(가) 성읍으로 자랍니다.`, `=GROW(${ref(i)}, "${SETTLE_LABEL[c.level]}")`);
      }
    }
  }

  // --- caravan movement = the heart of the sim ---
  for(let k=caravans.length-1;k>=0;k--){
    const car=caravans[k];
    const p=pById(car.pid); if(!p){ caravans.splice(k,1); continue; }
    // leave trail
    cells[car.pos].caravanHere=null;
    cells[car.pos].trail=Math.min(1, cells[car.pos].trail+0.7);
    cells[car.pos].trailColor=p.color;
    dirty.add(car.pos);

    car.patience--;

    // evaluate current cell for settling
    const here=cells[car.pos];
    const hHere=habitability(car.pos);
    const canSettleHere = (here.owner===null && here.st!=='water' && here.st!=='mountain'
      && here.st!=='ruin' && hHere>0.55);

    // decide: settle if good land & ran low on patience, else keep moving toward best neighbour
    if(canSettleHere && (car.patience<=0 || hHere>1.0 || here.st==='oasis')){
      setSettlement(car.pos, p.id, 1, here.st==='oasis'?'오아시스 정착':'야영지');
      here.caravanHere=null;
      caravans.splice(k,1);
      if(rnd()<0.5 || here.st==='oasis'){
        logEvent(`${p.name}이(가) ${ref(car.pos)}${here.st==='oasis'?' 오아시스':''}에 정착했습니다.`,
          `=SETTLE("${p.name}", ${ref(car.pos)})`);
      }
      continue;
    }

    // choose next cell: greedily toward higher habitability, avoid backtrack
    const cand=nbrs8(car.pos).filter(n=>{
      const cc=cells[n];
      return cc.st!=='water'&&cc.st!=='mountain'&&cc.st!=='ruin';
    });
    if(cand.length===0){
      // trapped — disperse
      caravans.splice(k,1);
      continue;
    }
    // scoring: habitability + small downhill-south/away-from-cold bias + noise
    let best=cand[0], bestScore=-1e9;
    const prev=car.history[car.history.length-2];
    for(const n of cand){
      let sc=habitability(n)*2 + rnd(1.0);
      const [,ny]=xy(n);
      if(ny<coldLine) sc-=3;           // never walk into ice
      if(n===prev) sc-=1.5;            // discourage backtracking
      if(cells[n].caravanHere) sc-=2;  // avoid collisions a bit
      if(cells[n].owner!==null) sc+=0.4; // gravitate to existing settlements (join/raid)
      if(sc>bestScore){bestScore=sc;best=n;}
    }
    const dest=best, dc=cells[dest];

    // interaction at destination
    if(dc.caravanHere){
      const other=dc.caravanHere, op=pById(other.pid);
      if(op && op.id===p.id){
        // merge same-people caravans
        other.size+=car.size; other.patience=Math.max(other.patience,car.patience);
        caravans.splice(k,1);
        continue;
      } else if(op){
        // clash or merge between peoples
        flashClash(dest, p.color);
        if(rnd()<0.45){
          // absorb weaker into stronger
          if(car.size>=other.size){ car.size+=Math.ceil(other.size*0.5);
            cells[other.pos]&&(cells[other.pos].caravanHere===other);
            const oi=caravans.indexOf(other); if(oi>=0)caravans.splice(oi,1);
            dc.caravanHere=null;
            if(rnd()<0.6) logEvent(`${p.name}이(가) ${op.name}을(를) 흡수했습니다.`, `=MERGE("${p.name}"←"${op.name}")`);
          } else {
            other.size+=Math.ceil(car.size*0.5);
            caravans.splice(k,1);
            continue;
          }
        } else {
          logEvent(`${p.name}와(과) ${op.name}이(가) ${ref(dest)}에서 충돌했습니다.`,
            `=CLASH("${p.name}"×"${op.name}", ${ref(dest)})`);
          car.size=Math.max(1,car.size-2);
          continue; // stay put this turn
        }
      }
    }
    if(dc.owner!==null && dc.owner!==p.id){
      // arriving at a foreign settlement: raid or assimilate
      const op=pById(dc.owner);
      flashClash(dest, p.color);
      if(rnd()<0.4 && car.size>dc.level*3){
        // conquer / take over the settlement
        setSettlement(dest, p.id, Math.max(1,dc.level-1), '점령됨');
        if(rnd()<0.5 && op) logEvent(`${p.name}이(가) ${op.name}의 ${ref(dest)}을(를) 차지했습니다.`,
          `=SEIZE("${p.name}", ${ref(dest)})`);
        caravans.splice(k,1);
        cells[car.pos].caravanHere=null;
        continue;
      } else {
        // can't take it, settle adjacent empty if any, else move on
        car.patience-=2;
        // fall through to move (but to dest? it's occupied) -> pick empty nbr
        const empties=nbrs8(car.pos).filter(n=>cells[n].owner===null && cells[n].caravanHere===null
          && cells[n].st!=='water'&&cells[n].st!=='mountain'&&cells[n].st!=='ruin');
        if(empties.length){ moveCar(car,pick(empties)); }
        else { cells[car.pos].caravanHere=car; } // stuck, stay
        continue;
      }
    }

    moveCar(car, dest);
  }

  // --- random / climate-driven events ---
  // new migration wave when cold/drought is biting and few peoples remain
  const pressure = (coldLine/ROWS) ;
  if(peoples.length<6 && rnd() < 0.02 + pressure*0.05){
    // either revive a new people or send a fresh caravan of an existing one
    if(peoples.length<3 || rnd()<0.5){
      const p=newPeople(); spawnCaravan(p,'edge');
      logEvent(`새로운 민족, ${p.name}이(가) 지평선 너머에서 나타났습니다.`, `=ARRIVE("${p.name}")`);
    } else {
      const p=pick(peoples); spawnCaravan(p,'edge');
      if(rnd()<0.5) logEvent(`${p.name}의 새 행렬이 길에 올랐습니다.`, `=CARAVAN("${p.name}")`);
    }
  }
  // famine forces a settled people back onto the road
  if(rnd()<0.01 && peoples.length){
    const big=[];
    for(let i=0;i<N;i++) if(cells[i].owner!==null && cells[i].level>=2) big.push(i);
    if(big.length){
      const i=pick(big), p=pById(cells[i].owner);
      const car={id:Math.random(),pid:cells[i].owner,pos:i,size:4+Math.floor(rnd(8)),
        patience:12+Math.floor(rnd(12)),color:cells[i].caravanHere?cells[i].caravanHere.color:(p?p.color:'#888'),history:[i]};
      caravans.push(car); cells[i].caravanHere=car;
      cells[i].owner=null; cells[i].level=0;
      cells[i].hist.push('기근으로 떠남'); if(cells[i].hist.length>8)cells[i].hist.shift();
      dirty.add(i);
      logEvent(`${p?p.name:''}을(를) 기근이 덮쳐 ${ref(i)}을(를) 떠납니다.`, `=FAMINE(${ref(i)})`);
    }
  }

  // --- extinction check ---
  for(let k=peoples.length-1;k>=0;k--){
    const p=peoples[k];
    if(p.settle===0 && p.moving===0){
      obituaries.push({name:p.name, born:p.founded, died:year, color:p.color});
      logEvent(`${p.name}이(가) 역사에서 사라졌습니다. (서기 ${p.founded}–${year})`,
        `=EXTINCT("${p.name}", ${year})`);
      peoples.splice(k,1);
    }
  }

  // --- draw ---
  for(const i of dirty) paint(i);
  dirty.clear();

  // --- HUD ---
  sbYear.textContent=`서기 ${year}년`;
  sbPop.textContent=`유랑민 ${totalMoving.toLocaleString()}`;
  sbFac.textContent=`민족 ${peoples.length}`;

  if(tickN%8===0){
    document.title=`대이주.xlsx - Excel (서기 ${year}년)`;
    renderPanel();
    renderClimate();
    document.querySelector('[data-sheet="dead"]').textContent=`멸망기록 (${obituaries.length})`;
    if(curSheet==='chron') renderChron();
    if(curSheet==='dead') renderDead();
  }
}

function moveCar(car, dest){
  cells[car.pos].caravanHere=null;
  dirty.add(car.pos);
  car.pos=dest;
  cells[dest].caravanHere=car;
  car.history.push(dest); if(car.history.length>6)car.history.shift();
  dirty.add(dest);
}

function flashClash(i, color){
  const el=cellEls[i]; if(!el)return;
  el.style.setProperty('--pc', color);
  el.classList.add('clash');
  setTimeout(()=>el.classList.remove('clash'), 900);
}

// =========================================================================
//  패널 / 기후 렌더
// =========================================================================
function renderPanel(){
  let h='';
  const sorted=[...peoples].sort((a,b)=>(b.settle+b.moving*0.3+b.prosperity*0.1)-(a.settle+a.moving*0.3+a.prosperity*0.1));
  for(const p of sorted){
    h+=`<div class="row"><span class="sw" style="background:${p.color}"></span>`+
       `<span class="nm">${p.name}</span>`+
       `<span class="ct">정착${p.settle}·행렬${p.moving}</span></div>`;
  }
  if(!peoples.length) h='<div class="dead">길 위에 아무도 남지 않았습니다…</div>';
  if(obituaries.length){
    h+='<div class="sub">최근 멸망</div>';
    for(const o of obituaries.slice(-3).reverse())
      h+=`<div class="dead">† ${o.name} (${o.died}년)</div>`;
  }
  panelB.innerHTML=h;
}
function renderClimate(){
  const coldPct=Math.round(coldLine/ROWS*100);
  const drPct=Math.round(clamp((droughtX/COLS)*100,0,100));
  let band;
  if(coldPct>40) band='소빙하기 — 북녘이 얼어붙습니다';
  else if(coldPct>22) band='한랭화 진행 중';
  else band='온난 — 잠시의 평온';
  climB.innerHTML=
    `<div>${band}</div>`+
    `<div class="bar"></div>`+
    `<div class="marker"><i style="left:${drPct}%"></i></div>`+
    `<div>한대선 남하 ${coldPct}% · 건조전선 ${drPct}%</div>`;
}

// =========================================================================
//  시트 전환 (이주도 / 연대기 / 멸망기록)
// =========================================================================
let curSheet='map';
document.querySelectorAll('#tabs .tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    curSheet=t.dataset.sheet;
    if(curSheet==='map'){ docsheet.style.display='none'; }
    else { docsheet.style.display='block';
      if(curSheet==='chron') renderChron(); else renderDead(); }
  });
});
function renderChron(){
  let rows=chronicle.slice(-200).reverse().map(e=>
    `<tr><td class="y">서기 ${e.year}년</td><td>${e.msg}</td><td class="f">${escapeHtml(e.formula)}</td></tr>`).join('');
  if(!rows) rows=`<tr><td colspan="3" class="empty">아직 기록된 사건이 없습니다.</td></tr>`;
  docsheet.innerHTML=`<h2>연대기</h2><div class="meta">대이주 시대의 사건 일지 · 최신 200건</div>`+
    `<table><thead><tr><th>연도</th><th>사건</th><th>수식 로그</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function renderDead(){
  let rows=[...obituaries].reverse().map(o=>
    `<tr><td><span class="sw" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${o.color};margin-right:6px"></span>${o.name}</td>`+
    `<td class="y">서기 ${o.born}년</td><td class="y">서기 ${o.died}년</td><td>${o.died-o.born}년</td></tr>`).join('');
  if(!rows) rows=`<tr><td colspan="4" class="empty">아직 멸망한 민족이 없습니다.</td></tr>`;
  docsheet.innerHTML=`<h2>멸망기록</h2><div class="meta">길 위에서 끝난 민족들 · 총 ${obituaries.length}곳</div>`+
    `<table><thead><tr><th>민족</th><th>등장</th><th>소멸</th><th>존속</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// =========================================================================
//  셀 선택 = 그 땅의 역사 / 사용자 개입
// =========================================================================
let selCol=-1, selRow=-1;
function clearHdSel(){ document.querySelectorAll('.hd.csel').forEach(e=>e.classList.remove('csel')); }
sheetEl.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  if(selected>=0 && cellEls[selected]) cellEls[selected].classList.remove('sel');
  selected=+t.dataset.i;
  t.classList.add('sel');
  const [cx,cy]=xy(selected);
  selCol=cx; selRow=cy;
  clearHdSel();
  const colHd=document.querySelector(`.hd[data-col="${cx}"]`); if(colHd)colHd.classList.add('csel');
  const rowHd=document.querySelector(`.hd[data-row="${cy}"]`); if(rowHd)rowHd.classList.add('csel');
  nameref.textContent=ref(selected);
  const c=cells[selected];
  const histStr=c.hist.map(x=>`"${x}"`).join(' → ');
  fmla.textContent=`=HISTORY(${ref(selected)}: ${histStr})`;
  sbReady.textContent=c.caravanHere? '행렬 선택됨'
    : c.owner!==null ? `${(pById(c.owner)||{}).name||''} 영토`
    : '준비';
});

// double-click empty habitable cell = "=SUMMON" a new caravan there (개입)
sheetEl.addEventListener('dblclick', e=>{
  const t=e.target.closest('.cell'); if(!t)return;
  const i=+t.dataset.i, c=cells[i];
  if(c.st==='water'||c.st==='mountain') return;
  let p = peoples.length<6 ? newPeople() : pick(peoples);
  const car={id:Math.random(),pid:p.id,pos:i,size:8+Math.floor(rnd(8)),
    patience:16+Math.floor(rnd(16)),color:p.color,history:[i]};
  if(c.caravanHere){ const oi=caravans.indexOf(c.caravanHere); if(oi>=0)caravans.splice(oi,1); }
  c.caravanHere=car; c.owner=null; c.level=0;
  caravans.push(car); dirty.add(i);
  logEvent(`당신의 부름으로 ${p.name}의 행렬이 ${ref(i)}에서 일어났습니다.`, `=SUMMON("${p.name}", ${ref(i)})`);
  for(const k of dirty)paint(k); dirty.clear();
});

// =========================================================================
//  빌드 / 부트
// =========================================================================
function buildDOM(){
  sheetEl.innerHTML='';
  sheetEl.style.gridTemplateColumns=`44px repeat(${COLS}, ${CW}px)`;
  sheetEl.style.gridTemplateRows=`20px repeat(${ROWS}, ${CH}px)`;
  cellEls=new Array(N);
  const frag=document.createDocumentFragment();
  const corner=document.createElement('div'); corner.className='hd'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){ const h=document.createElement('div'); h.className='hd'; h.dataset.col=c; h.textContent=colName(c); frag.appendChild(h); }
  for(let r=0;r<ROWS;r++){
    const rh=document.createElement('div'); rh.className='hd'; rh.dataset.row=r; rh.textContent=r+1; frag.appendChild(rh);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div'); d.className='cell'; const i=r*COLS+c; d.dataset.i=i;
      const g=document.createElement('span'); g.className='g'; d.appendChild(g);
      cellEls[i]=d; frag.appendChild(d);
    }
  }
  sheetEl.appendChild(frag);
}

let timer=null;
function boot(){
  computeGeom();
  buildDOM();
  genWorld();
  peoples=[]; caravans=[]; nameIdx=0; year=0; tickN=0; selected=-1;
  obituaries.length=0; chronicle.length=0;
  coldLine=0; droughtX=-3; climPhase=0;
  for(let i=0;i<N;i++) paint(i);
  // initial chronicle line shown in formula bar
  fmla.textContent=`=SIM.MIGRATION($A$1:$${colName(COLS-1)}$${ROWS}, "역사는 길 위에서 쓰인다")`;
  // initial peoples + caravans on the move
  for(let k=0;k<4;k++){ const p=newPeople(); spawnCaravan(p,'edge'); }
  logEvent('천지가 갈라지고, 사람들이 길 위에 섰습니다.', `=SIM.MIGRATION("대이주 시대 始")`, true);
  for(const i of dirty)paint(i); dirty.clear();
  if(timer) clearInterval(timer);
  timer=setInterval(tick, 130);
}

// pause when tab hidden (perf), resume when visible
document.addEventListener('visibilitychange',()=>{ paused=document.hidden; });

// rebuild on significant resize (debounced) — preserves "responsive"
let rt=null, lastW=0, lastH=0;
function onResize(){
  clearTimeout(rt);
  rt=setTimeout(()=>{
    const w=stage.clientWidth,h=stage.clientHeight;
    if(Math.abs(w-lastW)>30 || Math.abs(h-lastH)>30){ lastW=w; lastH=h; boot(); }
  },220);
}
window.addEventListener('resize', onResize);

// kick off
lastW=stage.clientWidth; lastH=stage.clientHeight;
boot();
})();
</script>
