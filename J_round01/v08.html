<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>열도교역.xlsx - Excel</title>
<style>
  :root{
    --green:#107c41; --green-d:#0b5b2f; --ink:#1d2b24;
    --line:#d9dcd6; --line2:#e8eae5; --hd:#f3f5f1; --sea:#dfeaf3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#dfe1dd;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:var(--ink);user-select:none;-webkit-tap-highlight-color:transparent}
  #app{display:flex;flex-direction:column;height:100%}

  /* ---- 타이틀바 ---- */
  #titlebar{height:30px;background:#f7f6f4;display:flex;align-items:center;
    padding:0 12px;gap:7px;border-bottom:1px solid #e2e2e0;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar .ttl{margin-left:9px;color:#3b4742;font-size:12px;font-weight:600;
    display:flex;align-items:center;gap:6px}
  #titlebar .xlsi{width:15px;height:15px;background:var(--green);border-radius:2px;color:#fff;
    font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}
  #titlebar .spacer{flex:1}
  #titlebar .winbtn{color:#9aa39d;font-size:12px;padding:0 6px}

  /* ---- 리본 ---- */
  #menubar{height:27px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #ededeb;font-size:12px;color:#5a655e;flex:0 0 auto;
    overflow:hidden;white-space:nowrap}
  #menubar b{color:var(--green);border-bottom:2.5px solid var(--green);padding:5px 3px;font-weight:700}
  #menubar i{font-style:normal;padding:5px 3px;cursor:default}
  #menubar i:hover{background:#f1f3ef}
  #ribbon{height:40px;background:#f7f8f6;border-bottom:1px solid #e1e3df;display:flex;
    align-items:center;padding:0 8px;gap:3px;flex:0 0 auto;overflow:hidden;white-space:nowrap}
  .rb{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:46px;height:34px;border:1px solid transparent;border-radius:3px;cursor:pointer;
    color:#46514b;font-size:10px;gap:2px;padding:0 5px}
  .rb:hover{background:#eef1ec;border-color:#dfe3dd}
  .rb.on{background:#e4efe6;border-color:#bcd9c4;color:var(--green-d)}
  .rb .ic{font-size:15px;line-height:1}
  .rb.play .ic{color:var(--green)}
  .rsep{width:1px;height:26px;background:#e1e3df;margin:0 4px}
  .rb.run{background:linear-gradient(#16924d,#0e7138);color:#fff;border-color:#0c6232;min-width:60px}
  .rb.run:hover{background:linear-gradient(#18a456,#0e7138)}

  /* ---- 수식바 ---- */
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d6d8d3;font-size:12px;flex:0 0 auto}
  #namebox{width:88px;height:100%;border-right:1px solid #d6d8d3;display:flex;
    align-items:center;justify-content:center;color:#33403a;font-weight:600;font-size:11px}
  #fxchip{width:30px;text-align:center;color:#9aa39d;font-style:italic;font-family:Georgia,serif}
  #formula{flex:1;padding:0 10px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#15281e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #formula .fn{color:var(--green-d);font-weight:700}
  #formula .str{color:#9a5b00}
  #formula .num{color:#1b56b8}

  /* ---- 본문 ---- */
  #mid{flex:1;display:flex;min-height:0}
  #sheetwrap{position:relative;flex:1;overflow:hidden;background:#fff;min-width:0}
  #sheet{display:grid;background:#fff;width:max-content}
  .hd{background:var(--hd);border-right:1px solid #cfd2cc;border-bottom:1px solid #cfd2cc;
    display:flex;align-items:center;justify-content:center;color:#6b746d;font-size:10.5px;
    position:sticky}
  .hd.colh{top:0;z-index:6}
  .hd.rowh{left:0;z-index:6}
  .hd.corner{top:0;left:0;z-index:7}
  .cell{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);
    display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;
    overflow:hidden;cursor:cell;position:relative;transition:background .25s linear}
  .cell.sel{outline:2px solid var(--green);outline-offset:-2px;z-index:4}
  .cell .lane{position:absolute;inset:0;pointer-events:none;z-index:1}
  .cell .glyph{position:relative;z-index:2}
  .cell .tag{position:absolute;left:1px;top:0;font-size:7.5px;color:#7a847d;z-index:2;
    font-family:Consolas,monospace;opacity:.8}
  @keyframes pulse{0%{box-shadow:inset 0 0 0 0 rgba(220,38,38,.0)}
    50%{box-shadow:inset 0 0 0 99px rgba(220,38,38,.35)}100%{box-shadow:inset 0 0 0 0 rgba(220,38,38,0)}}
  .cell.boom{animation:pulse .7s ease-out 2}
  @keyframes glow{0%{box-shadow:inset 0 0 0 0 rgba(245,184,0,0)}
    50%{box-shadow:inset 0 0 0 99px rgba(245,184,0,.4)}100%{box-shadow:inset 0 0 0 0 rgba(245,184,0,0)}}
  .cell.gold{animation:glow .8s ease-out 2}

  /* 항해 중 배 점 */
  .ship{position:absolute;width:7px;height:7px;border-radius:50%;z-index:9;pointer-events:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.7);transition:left .25s linear,top .25s linear}

  /* ---- 우측 패널 (이름상자/리그) ---- */
  #side{width:262px;flex:0 0 auto;background:#fbfcfa;border-left:1px solid #e1e3df;
    display:flex;flex-direction:column;overflow:hidden}
  #side h4{margin:0;padding:7px 11px;font-size:11px;color:#5a655e;background:#f1f3ef;
    border-bottom:1px solid #e6e8e4;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  #side h4 .mini{font-weight:500;color:#94a09a;font-size:10px}
  .league{padding:6px 11px;overflow-y:auto;flex:0 0 auto;max-height:46%}
  .lrow{display:flex;align-items:center;gap:7px;padding:4px 2px;font-size:11px;border-bottom:1px dotted #e8eae5;cursor:pointer}
  .lrow:hover{background:#eef4ee}
  .lrow .sw{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
  .lrow .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lrow .nm b{font-weight:600}
  .lrow .nm small{color:#9aa39d}
  .lrow .gold{flex:0 0 auto;font-family:Consolas,monospace;font-weight:700;color:#0b5b2f}
  .lrow.lead .nm b{color:#b8860b}
  /* 시세판 */
  #market{padding:6px 11px;border-top:1px solid #e6e8e4;flex:1;overflow-y:auto}
  .mkt{display:grid;grid-template-columns:1fr auto auto;gap:2px 8px;font-size:11px;align-items:center}
  .mkt .g{display:flex;align-items:center;gap:5px;padding:3px 0}
  .mkt .g .gi{width:15px;text-align:center}
  .mkt .px{font-family:Consolas,monospace;text-align:right}
  .mkt .dl{font-family:Consolas,monospace;text-align:right;font-size:10px;width:46px}
  .up{color:#107c41}.down{color:#c0392b}.flat{color:#9aa39d}
  /* 선택 셀 인스펙터 */
  #inspect{border-top:1px solid #e6e8e4;background:#fffdf3;padding:8px 11px;font-size:11px;
    flex:0 0 auto;max-height:34%;overflow-y:auto;line-height:1.55}
  #inspect .ttl{font-weight:700;color:#33403a;display:flex;align-items:center;gap:6px;margin-bottom:3px}
  #inspect .led{font-family:Consolas,monospace;font-size:10.5px;color:#4a554e}
  #inspect .hint{color:#9aa39d;font-size:10px}
  #inspect b{color:#0b5b2f}

  /* ---- 시트탭 ---- */
  #tabs{height:26px;background:#f3f5f1;display:flex;align-items:flex-end;padding-left:8px;
    border-top:1px solid #d6d8d3;font-size:11.5px;flex:0 0 auto;overflow:hidden}
  #tabs .nav{color:#9aa39d;padding:0 7px;align-self:center;font-size:11px}
  #tabs .tab{padding:4px 13px;border:1px solid #d6d8d3;border-bottom:none;margin-right:2px;
    background:#e9ebe6;color:#5f6a63;cursor:pointer;border-radius:3px 3px 0 0;white-space:nowrap}
  #tabs .tab.on{background:#fff;color:var(--green);font-weight:700;border-top:2px solid var(--green)}
  #tabs .plus{color:#9aa39d;padding:0 8px;align-self:center}

  /* ---- 상태바 ---- */
  #statusbar{height:23px;background:var(--green);color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;flex:0 0 auto;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .ev{flex:1;overflow:hidden;text-overflow:ellipsis}
  #statusbar .zoom{font-family:Consolas,monospace;opacity:.85}

  /* ---- 로그 시트(연대기/난파록) 오버레이 ---- */
  #logsheet{position:absolute;inset:0;background:#fff;z-index:20;display:none;flex-direction:column}
  #logsheet.show{display:flex}
  #logsheet .lh{display:grid;grid-template-columns:54px 86px 1fr 230px;background:var(--hd);
    border-bottom:1px solid #cfd2cc;font-size:10.5px;color:#6b746d}
  #logsheet .lh div{padding:4px 8px;border-right:1px solid #cfd2cc;display:flex;align-items:center}
  #logsheet .lbody{flex:1;overflow-y:auto}
  #logsheet .lr{display:grid;grid-template-columns:54px 86px 1fr 230px;border-bottom:1px solid var(--line2);font-size:11px}
  #logsheet .lr:nth-child(even){background:#fafbf9}
  #logsheet .lr div{padding:3px 8px;border-right:1px solid var(--line2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #logsheet .lr .yr{color:#8a938c;font-family:Consolas,monospace}
  #logsheet .lr .ty{font-weight:600}
  #logsheet .lr .fx{font-family:Consolas,monospace;color:#0b5b2f;font-size:10px}
  #logsheet .empty{padding:30px;color:#9aa39d;text-align:center}

  @media (max-width:760px){
    #side{display:none}
    #ribbon{gap:1px;padding:0 4px}
    .rb{min-width:40px}
    #menubar{gap:11px}
    #namebox{width:64px}
    #statusbar{font-size:10.5px}
    #statusbar .hidem{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <div class="ttl"><span class="xlsi">X</span><span id="docttl">열도교역.xlsx - Excel</span></div>
    <div class="spacer"></div>
    <div class="winbtn">—</div><div class="winbtn">▢</div><div class="winbtn">✕</div>
  </div>

  <div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>그리기</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>

  <div id="ribbon">
    <div class="rb play on" id="btnPlay"><span class="ic">⏸</span><span>일시정지</span></div>
    <div class="rb" id="btnSpeed"><span class="ic">⏩</span><span id="spdLbl">x1</span></div>
    <div class="rsep"></div>
    <div class="rb run" id="btnFound"><span class="ic">⚓</span><span>商家 창단</span></div>
    <div class="rb" id="btnRoute"><span class="ic">〰</span><span>항로 개설</span></div>
    <div class="rb" id="btnGrant"><span class="ic">✦</span><span>특허장</span></div>
    <div class="rsep"></div>
    <div class="rb" id="btnStorm"><span class="ic">🌀</span><span>폭풍</span></div>
    <div class="rb" id="btnReset"><span class="ic">↺</span><span>새 세계</span></div>
  </div>

  <div id="fbar">
    <div id="namebox">A1</div>
    <div id="fxchip">fx</div>
    <div id="formula"></div>
  </div>

  <div id="mid">
    <div id="sheetwrap">
      <div id="sheet"></div>
      <div id="ships"></div>
      <div id="logsheet">
        <div class="lh"><div>연도</div><div>분류</div><div>기록</div><div>수식</div></div>
        <div class="lbody" id="logbody"><div class="empty">기록 없음</div></div>
      </div>
    </div>

    <div id="side">
      <h4>상가 리그 <span class="mini" id="sideYr">서기 1년</span></h4>
      <div class="league" id="league"></div>
      <h4>거래소 시세 <span class="mini">단위: 銀</span></h4>
      <div id="market"><div class="mkt" id="mkt"></div></div>
      <div id="inspect">
        <div class="ttl">셀을 클릭해 장부 열람</div>
        <div class="hint">바다·섬·항구·항로의 내력을 볼 수 있습니다.</div>
      </div>
    </div>
  </div>

  <div id="tabs">
    <span class="nav">◀ ▶</span>
    <div class="tab on" data-sheet="map">교역도</div>
    <div class="tab" data-sheet="chron">연대기</div>
    <div class="tab" data-sheet="wreck" id="tabWreck">난파록 (0)</div>
    <span class="plus">＋</span>
  </div>

  <div id="statusbar">
    <span>준비</span><span class="sep">|</span>
    <span id="stYear">서기 1년</span><span class="sep hidem">|</span>
    <span id="stWealth" class="hidem">동맹 자본 0 銀</span><span class="sep">|</span>
    <span id="stHouses">상가 0</span><span class="sep">|</span>
    <span class="ev" id="stEvent">열도에 안개가 걷혔습니다.</span>
    <span class="zoom">100%</span>
  </div>
</div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const sheet=$('#sheet'), shipsLayer=$('#ships'), fmla=$('#formula'),
      namebox=$('#namebox'), leagueEl=$('#league'), mktEl=$('#mkt'),
      inspectEl=$('#inspect'), logBody=$('#logbody'), logSheet=$('#logsheet');

/* ====================== 격자 크기 ====================== */
let CW, CH, COLS, ROWS, N;
function computeDims(){
  const wrap=$('#sheetwrap').getBoundingClientRect();
  const mobile=innerWidth<=760;
  CW = mobile?30:34; CH = mobile?24:24;
  COLS=Math.max(14,Math.min(46,Math.floor((wrap.width-50)/CW)));
  ROWS=Math.max(12,Math.min(34,Math.floor((wrap.height-2)/CH)));
  N=COLS*ROWS;
}

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(Math.floor(i/COLS)+1);}
function xyOf(i){return [i%COLS, i/COLS|0];}

/* ====================== 상품 / 시세 ====================== */
// 열도 상인 동맹다운 교역 상품
const GOODS=[
  {k:'香',  nm:'향료',  base:42},
  {k:'絹',  nm:'비단',  base:55},
  {k:'瓷',  nm:'도자기', base:30},
  {k:'茶',  nm:'차',    base:24},
  {k:'鹽',  nm:'소금',  base:14},
  {k:'珠',  nm:'진주',  base:80},
];
let price=[], priceHist=[];
function resetMarket(){
  price=GOODS.map(g=>g.base*(0.85+Math.random()*0.3));
  priceHist=price.map(p=>p);
}

/* ====================== 지형 (열도) ====================== */
// 0=깊은바다 1=얕은바다 2=섬(빈땅) 3=항구(상가소유) 4=폐항
let cells=[];
const GW=10, GH=7;
let gz=[];
function noise(x,y){
  const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=gz[y0*GW+x0], b=gz[y0*GW+Math.min(GW-1,x0+1)];
  const c=gz[Math.min(GH-1,y0+1)*GW+x0], d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}
function genTerrain(){
  gz=[];for(let i=0;i<GW*GH;i++)gz[i]=Math.random();
  cells=new Array(N);
  for(let i=0;i<N;i++){
    const [x,y]=xyOf(i);
    // 가장자리는 바다 쪽으로 끌어 열도 느낌
    const edge=Math.min(x,COLS-1-x,y,ROWS-1-y);
    const v=noise(x,y)+ (Math.random()-.5)*.12 - (edge<2?0.18:0);
    let terr=0, glyph='', label='깊은 바다';
    if(v>0.60){ terr=2; glyph='▲'; label='무인도'; }      // 섬(육지)
    else if(v>0.42){ terr=1; glyph='~'; label='얕은 여울'; }
    else { terr=0; glyph='≈'; label='깊은 바다'; }
    cells[i]={terr,glyph,owner:null,grade:0,good:-1,stock:0,
      hist:[label], ruinT:0, blockaded:0};
  }
}
function nbrs(i){
  const [x,y]=xyOf(i); const out=[];
  if(x>0)out.push(i-1); if(x<COLS-1)out.push(i+1);
  if(y>0)out.push(i-COLS); if(y<ROWS-1)out.push(i+COLS);
  return out;
}
function nbrs8(i){
  const [x,y]=xyOf(i); const out=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;
    if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS)out.push(ny*COLS+nx);
  }
  return out;
}

/* ====================== 상가(House) ====================== */
const HNAMES=['청파 상회','금성 무역','동백 선단','백로 조합','홍옥 상관','남풍 행상','은하 교역','적호 상단','진주 길드','녹조 행회'];
const HCOLORS=['#1f7ae0','#d4a017','#0d8f5b','#7b4fd6','#c0392b','#2aa6b8','#c2418c','#5c8a1f','#9b59b6','#16a085'];
let houses=[], nameIdx=0;
let routes=[];          // {a,b,owner,cells:[...path], age, ships:[...]}  a,b = port idx
let wrecks=[], chron=[];
let year=1, tick=0, lastEvent='열도에 안개가 걷혔습니다.', allianceCap=0;
let selected=-1, paused=false, speed=1, mode='inspect'; // inspect|route(pick port)
let routePick=-1;

function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

function emptyIsland(){
  // 섬(빈 육지) 우선, 없으면 항구 만들 만한 여울
  const cand=[];
  for(let i=0;i<N;i++)if(cells[i].owner===null&&(cells[i].terr===2)) cand.push(i);
  if(!cand.length)for(let i=0;i<N;i++)if(cells[i].owner===null&&cells[i].terr===1)cand.push(i);
  return cand.length?cand[Math.random()*cand.length|0]:-1;
}
function foundHouse(announce){
  if(nameIdx>=HNAMES.length)nameIdx=0;
  const i=emptyIsland(); if(i<0)return null;
  const h={id:houses.length?Math.max(...houses.map(x=>x.id))+1:0,
    name:HNAMES[nameIdx], color:HCOLORS[nameIdx%HCOLORS.length],
    cap:120+Math.random()*60|0, ports:[], charter:0};
  nameIdx++;
  makePort(i,h.id,1,'개항');
  houses.push(h);
  if(announce){
    addChron(year,'창단',`${h.name}이(가) ${ref(i)}에 본점을 열었습니다.`,`=FOUND("${h.name}", ${ref(i)})`);
    setEvent(`${h.name}이(가) 열도 교역에 뛰어들었습니다.`);
  }
  return h;
}
function houseById(id){return houses.find(h=>h.id===id);}

const G_TXT=['','◎','◇','◆','★'];          // 항구 등급 글리프
const G_LABEL=['','어촌','포구','상항','大항구','자유항'];
function makePort(i,owner,grade,label){
  const c=cells[i];
  c.terr=3; c.owner=owner; c.grade=grade;
  if(c.good<0)c.good=Math.random()*GOODS.length|0;
  if(label){c.hist.push(label);if(c.hist.length>8)c.hist.shift();}
  dirty.add(i);
}

/* ====================== 렌더 ====================== */
const cellEls=new Array(0);
let cellArr=[];
function buildSheet(){
  sheet.style.gridTemplateColumns=`46px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows=CH+'px';
  sheet.innerHTML='';
  cellArr=new Array(N);
  const frag=document.createDocumentFragment();
  const corner=document.createElement('div');corner.className='hd corner';frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd colh';h.textContent=colName(c);frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd rowh';h.textContent=r+1;frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const idx=r*COLS+c;
      const d=document.createElement('div');d.className='cell';d.dataset.i=idx;
      const lane=document.createElement('div');lane.className='lane';
      const g=document.createElement('span');g.className='glyph';
      d.appendChild(lane);d.appendChild(g);
      cellArr[idx]=d;frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}
const dirty=new Set();
const SEA_BG=['#cfe0ef','#dfeaf3']; // 깊은/얕은
function paint(i){
  const c=cells[i], el=cellArr[i]; if(!el)return;
  const g=el.querySelector('.glyph'), lane=el.querySelector('.lane');
  let bg='',glyph=c.glyph,col='#7fa8cf',w='400',fs='12px';
  lane.style.background='transparent';
  // 기존 태그 제거
  const oldtag=el.querySelector('.tag'); if(oldtag)oldtag.remove();

  if(c.terr===0){bg=SEA_BG[0];glyph='≈';col='#a7c4df';}
  else if(c.terr===1){bg=SEA_BG[1];glyph='~';col='#bcd3e8';}
  else if(c.terr===2){bg='#efe7d6';glyph='▲';col='#b09a6a';}    // 무인도
  else if(c.terr===4){bg='#e6e6e2';glyph='墟';col='#a7a7a0';}    // 폐항
  else if(c.terr===3 && c.owner!==null){
    const h=houseById(c.owner);
    if(h){ bg=hexA(h.color,.14+c.grade*.16); glyph=G_TXT[c.grade]; col=h.color;
      w=c.grade>=3?'700':'600'; if(c.grade>=4){fs='13px';}
      // 항구 상품 태그
      const tag=document.createElement('span');tag.className='tag';
      tag.textContent=GOODS[c.good].k; el.appendChild(tag);
    } else { c.owner=null; c.terr=2; glyph='▲'; bg='#efe7d6'; col='#b09a6a'; }
  }
  if(c.blockaded>0 && c.terr===3){ lane.style.background='repeating-linear-gradient(45deg,rgba(192,57,43,.18) 0 4px,transparent 4px 8px)'; }
  el.style.background=bg; g.textContent=glyph; g.style.color=col; g.style.fontWeight=w; g.style.fontSize=fs;
}

// 항로(선) 그리기: 경로 셀 배경에 옅은 색띠
function paintRoutes(){
  // 먼저 모든 lane 클리어는 paint에서 처리됨. 여기선 경로 셀에 라인 덧칠.
  for(const rt of routes){
    const h=houseById(rt.owner); if(!h)continue;
    for(const ci of rt.cells){
      const c=cells[ci];
      if(c.terr===0||c.terr===1){
        const el=cellArr[ci]; if(!el)continue;
        const lane=el.querySelector('.lane');
        lane.style.background=`linear-gradient(${hexA(h.color,.0)}, ${hexA(h.color,.0)})`;
        // 점선 항로
        lane.style.backgroundImage=`radial-gradient(${hexA(h.color,.55)} 1.4px, transparent 1.5px)`;
        lane.style.backgroundSize='6px 6px';
      }
    }
  }
}

/* ---- 항로 경로(맨해튼 + 약간) ---- */
function pathBetween(a,b){
  const [ax,ay]=xyOf(a),[bx,by]=xyOf(b);
  const path=[]; let x=ax,y=ay;
  let guard=0;
  while((x!==bx||y!==by)&&guard++<200){
    if(x!==bx && (y===by || Math.random()<.5)) x+=x<bx?1:-1;
    else if(y!==by) y+=y<by?1:-1;
    else x+=x<bx?1:-1;
    path.push(y*COLS+x);
  }
  return path;
}
function openRoute(a,b,owner){
  if(a===b)return false;
  if(routes.some(r=>(r.a===a&&r.b===b)||(r.a===b&&r.b===a)))return false;
  const cellsPath=pathBetween(a,b);
  const rt={a,b,owner,cells:cellsPath,age:0,ships:[]};
  routes.push(rt);
  spawnShip(rt,a);
  return rt;
}
function spawnShip(rt,from){
  const dot=document.createElement('div');dot.className='ship';
  const h=houseById(rt.owner);dot.style.background=h?h.color:'#333';
  shipsLayer.appendChild(dot);
  const path = from===rt.a ? [rt.a,...rt.cells] : [rt.b,...rt.cells.slice().reverse()];
  rt.ships.push({el:dot,path,pos:0,from});
}

function placeShip(s){
  const ci=s.path[s.pos]|0;
  const el=cellArr[ci]; if(!el){s.el.style.display='none';return;}
  const wrap=$('#sheetwrap').getBoundingClientRect();
  const r=el.getBoundingClientRect();
  s.el.style.display='block';
  s.el.style.left=(r.left-wrap.left+r.width/2-3.5)+'px';
  s.el.style.top=(r.top-wrap.top+r.height/2-3.5)+'px';
}

/* ====================== 로그 ====================== */
function setEvent(m){ lastEvent=`서기 ${year}년: ${m}`; }
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(formula){
  // 따옴표 문자열을 먼저 분리해 토큰별로 처리 → 생성된 태그를 다시 건드리지 않음
  const parts=formula.split(/("[^"]*")/);
  return parts.map(p=>{
    if(p.startsWith('"')&&p.endsWith('"')) return `<span class="str">${esc(p)}</span>`;
    return esc(p)
      .replace(/([A-Z_]+)(?=\()/g,'<span class="fn">$1</span>')
      .replace(/(?<![A-Za-z0-9_])(\d+(?:\.\d+)?)/g,'<span class="num">$1</span>');
  }).join('');
}
function addChron(yr,type,msg,formula){
  chron.push({yr,type,msg,formula});
  if(chron.length>400)chron.shift();
  if(formula) fmla.innerHTML=fmt(formula);
  if(curSheet==='chron'||curSheet==='wreck') renderLogSheet();
}
function addWreck(text,formula){
  wrecks.push({yr:year,text,formula});
  $('#tabWreck').textContent=`난파록 (${wrecks.length})`;
}

/* ====================== 시뮬 틱 ====================== */
let warCD=0;
const GRADE_OUT=[0,2,5,11,20]; // 등급별 생산량
function step(){
  tick++; year++;
  if(warCD>0)warCD--;

  // 항구 재집계
  for(const h of houses){h.ports.length=0;}
  allianceCap=0;
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.terr===4 && --c.ruinT<=0){ c.terr=2; c.glyph='▲'; c.owner=null; c.hist.push('재개간'); dirty.add(i); }
    if(c.blockaded>0){ if(--c.blockaded<=0)dirty.add(i); }
    if(c.terr===3 && c.owner!==null){
      const h=houseById(c.owner);
      if(h){ h.ports.push(i); }
      else { c.owner=null; c.terr=2; c.glyph='▲'; dirty.add(i); }
    }
  }

  // 시세 변동 (난수 + 공급압)
  const supply=new Array(GOODS.length).fill(0);
  for(let i=0;i<N;i++){const c=cells[i];if(c.terr===3&&c.owner!==null&&c.blockaded<=0)supply[c.good]+=GRADE_OUT[c.grade];}
  for(let k=0;k<GOODS.length;k++){
    priceHist[k]=price[k];
    const drift=(Math.random()-.5)*GOODS[k].base*0.06;
    const glut = supply[k]>0 ? -Math.log(1+supply[k])*0.55 : +0.4;
    price[k]=Math.max(GOODS[k].base*0.25, Math.min(GOODS[k].base*2.4, price[k]+drift+glut));
  }

  // 멸망(상가 도산) 판정
  for(let k=houses.length-1;k>=0;k--){
    const h=houses[k];
    if(h.ports.length===0){
      addChron(year,'도산',`${h.name}이(가) 모든 항구를 잃고 파산했습니다.`,`=BANKRUPT("${h.name}", ${year})`);
      addWreck(`${h.name} — 서기 ${year}년 파산`,`=BANKRUPT("${h.name}")`);
      setEvent(`${h.name}이(가) 역사에서 사라졌습니다.`);
      // 그 상가 항로 제거
      routes=routes.filter(r=>{if(r.owner===h.id){r.ships.forEach(s=>s.el.remove());return false;}return true;});
      houses.splice(k,1);
    }
  }

  // 상가 행동
  for(const h of houses){
    if(h.charter>0)h.charter--;
    if(h.ports.length===0)continue;

    // 수입 = 보유 항구의 (생산량 x 해당 상품 시세)
    let income=0;
    for(const pi of h.ports){
      const c=cells[pi];
      if(c.blockaded>0)continue;
      income += GRADE_OUT[c.grade]*price[c.good]*0.06*(h.charter?1.8:1);
    }
    h.cap += income - h.ports.length*1.2; // 유지비
    allianceCap += h.cap;

    // 확장: 새 섬에 개항 (자본 소모)
    const expAttempts=1+(h.ports.length*0.05|0);
    for(let a=0;a<expAttempts;a++){
      if(h.cap<90)break;
      const src=h.ports[Math.random()*h.ports.length|0];
      if(src===undefined)continue;
      // 주변 섬/여울 탐색
      const opts=nbrs8(src).filter(n=>{const t=cells[n].terr;return (t===2||t===1)&&cells[n].owner===null;});
      if(opts.length && Math.random()<0.5){
        const tgt=opts[Math.random()*opts.length|0];
        h.cap-=80;
        makePort(tgt,h.id,1,'개항');
        // 새 항로 자동 개설 (가끔)
        if(Math.random()<0.5){ const rt=openRoute(src,tgt,h.id); if(rt) {} }
        continue;
      }
      // 경쟁 항구 인수/충돌 (드물게, 평화로운 인수 위주)
      const rivals=nbrs8(src).filter(n=>cells[n].terr===3&&cells[n].owner!==null&&cells[n].owner!==h.id);
      if(rivals.length && Math.random()<0.22 && h.cap>140){
        const tgt=rivals[Math.random()*rivals.length|0];
        const tc=cells[tgt]; const rivalH=houseById(tc.owner);
        const atk=h.cap*0.4 + (h.charter?200:0) + Math.random()*200;
        const def=(rivalH?rivalH.cap*0.5:0)+tc.grade*120+Math.random()*200;
        boom(tgt);
        if(atk>def){
          h.cap-=120;
          if(Math.random()<0.25){
            // 항구 봉쇄/파괴 → 폐항
            tc.terr=4;tc.owner=null;tc.ruinT=120;tc.hist.push('상권 붕괴');
            if(tc.hist.length>8)tc.hist.shift();dirty.add(tgt);
            if(rivalH&&(tc.grade>=3||warCD===0)){
              addChron(year,'상전',`${h.name}이(가) ${rivalH.name}의 ${ref(tgt)} 상권을 무너뜨렸습니다.`,`=PRICEWAR("${h.name}"→"${rivalH.name}", ${ref(tgt)})`);
              setEvent(`${h.name}과(와) ${rivalH.name}의 상권 전쟁!`);warCD=30;
            }
          } else {
            const og=tc.grade;
            makePort(tgt,h.id,Math.max(1,tc.grade-1),'합병됨');
            if(rivalH&&(og>=3||warCD===0)){
              addChron(year,'합병',`${h.name}이(가) ${rivalH.name}의 ${ref(tgt)} 항을 인수했습니다.`,`=ACQUIRE("${h.name}", ${ref(tgt)})`);
              warCD=24;
            }
          }
        }
      }
    }

    // 항구 승급 (자본 투자)
    const upN=1+(h.ports.length*0.04|0);
    for(let u=0;u<upN;u++){
      const i=h.ports[Math.random()*h.ports.length|0];
      if(i===undefined)continue; const c=cells[i];
      if(c.grade<4 && h.cap>110 && Math.random()<0.07*(h.charter?2.4:1)){
        c.grade++; h.cap-=70;
        c.hist.push(G_LABEL[c.grade]); if(c.hist.length>8)c.hist.shift(); dirty.add(i);
        if(c.grade===4 && warCD===0){
          addChron(year,'번영',`${h.name}의 ${ref(i)}이(가) 자유항으로 승격했습니다.`,`=FREEPORT("${h.name}", ${ref(i)})`);
          setEvent(`${ref(i)}에 자유항이 열렸습니다.`);warCD=20;
          gold(i);
        }
      }
    }

    // 항로 자동 개설 (멀리 떨어진 자기 항구 둘 연결)
    if(h.ports.length>=2 && Math.random()<0.03 && routes.filter(r=>r.owner===h.id).length<h.ports.length){
      const a=h.ports[Math.random()*h.ports.length|0];
      const b=h.ports[Math.random()*h.ports.length|0];
      if(a!==b){ const rt=openRoute(a,b,h.id);
        if(rt){ addChron(year,'항로',`${h.name}이(가) ${ref(a)}–${ref(b)} 정기 항로를 열었습니다.`,`=ROUTE("${h.name}", ${ref(a)}, ${ref(b)})`); } }
    }
  }

  // 배 이동
  for(const rt of routes){
    rt.age++;
    for(let si=rt.ships.length-1;si>=0;si--){
      const s=rt.ships[si];
      s.pos++;
      if(s.pos>=s.path.length){
        // 도착 → 무역 성사, 시세 약간 안정
        const h=houseById(rt.owner);
        if(h){ h.cap+=14; }
        s.el.remove(); rt.ships.splice(si,1);
        // 반대로 다시 출항
        if(houseById(rt.owner)) spawnShip(rt, s.from===rt.a?rt.b:rt.a);
      } else placeShip(s);
    }
  }

  /* ---- 무작위 사건 ---- */
  const rr=Math.random();
  if(rr<0.006){ // 폭풍: 항로 위 배 침몰 + 인근 항구 봉쇄
    triggerStorm();
  } else if(rr>0.994 && houses.length){ // 황금기(특허장 자생)
    const h=houses[Math.random()*houses.length|0]; h.charter=80;
    setEvent(`${h.name}이(가) 동맹 특허장을 따냈습니다.`);
    addChron(year,'특허',`${h.name}, 향료 전매 특허 획득.`,`=CHARTER("${h.name}", 80)`);
    if(h.ports.length)gold(h.ports[0]);
  } else if(rr>0.989 && rr<=0.994){ // 시장 폭락
    const k=Math.random()*GOODS.length|0;
    price[k]=Math.max(GOODS[k].base*0.25, price[k]*0.55);
    setEvent(`${GOODS[k].nm} 시세가 폭락했습니다.`);
    addChron(year,'폭락',`${GOODS[k].nm} 거품 붕괴 — 시세 ${(price[k]).toFixed(0)}銀.`,`=CRASH("${GOODS[k].nm}", ${price[k].toFixed(0)})`);
  } else if(rr>0.985 && rr<=0.989){ // 해적
    triggerPirate();
  }
  // 신규 상가 도래
  if(houses.length<3 && Math.random()<0.014 && houses.length<7){
    const h=foundHouse(false);
    if(h){addChron(year,'도래',`바다 건너 ${h.name}이(가) 열도에 들어왔습니다.`,`=ARRIVE("${h.name}")`);
      setEvent(`${h.name}이(가) 열도에 도래했습니다.`);}
  }

  // 그리기
  for(const i of dirty)paint(i);
  dirty.clear();
  paintRoutes();
  for(const rt of routes)for(const s of rt.ships)placeShip(s);

  updateStatus();
  if(tick%6===0)renderSide();
  if(selected>=0) renderInspect(selected);
}

function triggerStorm(){
  // 무작위 바다 영역에 폭풍 → 그 위 배 침몰, 인접 항구 봉쇄
  const center=Math.random()*N|0;
  let sunk=0;
  for(const rt of routes){
    for(let si=rt.ships.length-1;si>=0;si--){
      const s=rt.ships[si]; const ci=s.path[s.pos]|0;
      const [cx,cy]=xyOf(ci),[ox,oy]=xyOf(center);
      if(Math.abs(cx-ox)<=1&&Math.abs(cy-oy)<=1){
        s.el.remove();rt.ships.splice(si,1);sunk++;
        const h=houseById(rt.owner); if(h)h.cap-=40;
      }
    }
  }
  // 인접 항구 봉쇄
  for(const n of nbrs8(center)){ if(cells[n].terr===3){cells[n].blockaded=14;dirty.add(n);} }
  boom(center);
  if(sunk>0){
    addWreck(`${ref(center)} 해역 폭풍 — 상선 ${sunk}척 침몰`,`=STORM(${ref(center)}, ${sunk})`);
    addChron(year,'난파',`${ref(center)} 인근 폭풍으로 상선 ${sunk}척이 침몰했습니다.`,`=STORM(${ref(center)}, ${sunk})`);
    setEvent(`${ref(center)} 해역에 폭풍! 상선 ${sunk}척 침몰.`);
  } else {
    setEvent(`${ref(center)} 해역에 폭풍이 몰아쳤습니다.`);
  }
}
function triggerPirate(){
  const ports=[];for(let i=0;i<N;i++)if(cells[i].terr===3&&cells[i].grade>=2)ports.push(i);
  if(!ports.length)return;
  const i=ports[Math.random()*ports.length|0];
  cells[i].blockaded=20; dirty.add(i); boom(i);
  const h=houseById(cells[i].owner); if(h)h.cap-=60;
  addWreck(`${ref(i)} 해적 출몰 — 항구 봉쇄`,`=PIRATE(${ref(i)})`);
  addChron(year,'해적',`해적이 ${ref(i)} 항을 봉쇄했습니다.`,`=PIRATE(${ref(i)})`);
  setEvent(`해적이 ${ref(i)}을(를) 봉쇄했습니다.`);
}

function boom(i){const el=cellArr[i];if(!el)return;el.classList.add('boom');setTimeout(()=>el.classList.remove('boom'),1500);}
function gold(i){const el=cellArr[i];if(!el)return;el.classList.add('gold');setTimeout(()=>el.classList.remove('gold'),1700);}

/* ====================== 사이드/상태 렌더 ====================== */
function updateStatus(){
  $('#stYear').textContent=`서기 ${year}년`;
  $('#stWealth').textContent=`동맹 자본 ${Math.round(allianceCap).toLocaleString()} 銀`;
  $('#stHouses').textContent=`상가 ${houses.length}`;
  $('#stEvent').textContent=lastEvent;
  $('#sideYr').textContent=`서기 ${year}년`;
  if(tick%10===0) $('#docttl').textContent=`열도교역.xlsx - Excel (서기 ${year}년)`;
}
function renderSide(){
  const sorted=houses.slice().sort((a,b)=>b.cap-a.cap);
  let h='';
  sorted.forEach((f,idx)=>{
    h+=`<div class="lrow${idx===0?' lead':''}" data-house="${f.id}">
      <span class="sw" style="background:${f.color}"></span>
      <span class="nm"><b>${f.name}</b>${f.charter?' ✦':''} <small>· 항구 ${f.ports.length}</small></span>
      <span class="gold">${Math.round(f.cap).toLocaleString()}</span></div>`;
  });
  if(!sorted.length)h='<div class="hint" style="padding:8px 2px;color:#9aa39d">상가 없음 — 리본의 "商家 창단"으로 시작하세요.</div>';
  leagueEl.innerHTML=h;
  // 시세판
  let m='';
  for(let k=0;k<GOODS.length;k++){
    const p=price[k], pv=priceHist[k], d=p-pv;
    const cls=d>0.05?'up':d<-0.05?'down':'flat';
    const arrow=d>0.05?'▲':d<-0.05?'▼':'■';
    m+=`<div class="g"><span class="gi">${GOODS[k].k}</span>${GOODS[k].nm}</div>
        <div class="px">${p.toFixed(1)}</div>
        <div class="dl ${cls}">${arrow}${Math.abs(d).toFixed(1)}</div>`;
  }
  mktEl.innerHTML=m;
}
function renderInspect(i){
  const c=cells[i];
  let title='', body='', icon='';
  if(c.terr===3 && c.owner!==null){
    const h=houseById(c.owner);
    icon=`<span style="color:${h?h.color:'#333'}">${G_TXT[c.grade]}</span>`;
    title=`${ref(i)} · ${h?h.name:'?'} ${G_LABEL[c.grade]}`;
    const out=GRADE_OUT[c.grade];
    body=`<div class="led">주력 상품: <b>${GOODS[c.good].nm}(${GOODS[c.good].k})</b> · 시세 ${price[c.good].toFixed(1)}銀</div>
      <div class="led">생산량: ${out} · 추정수익 ${(out*price[c.good]*0.06).toFixed(1)}銀/년${c.blockaded>0?' · <span style="color:#c0392b">봉쇄중('+c.blockaded+')</span>':''}</div>
      <div class="led" style="margin-top:3px">내력: ${c.hist.join(' → ')}</div>`;
  } else if(c.terr===4){
    title=`${ref(i)} · 폐항`; icon='墟';
    body=`<div class="led">버려진 상권. ${c.ruinT}년 뒤 무인도로 환원.</div><div class="led">내력: ${c.hist.join(' → ')}</div>`;
  } else if(c.terr===2){
    title=`${ref(i)} · 무인도`; icon='▲';
    body=`<div class="led">아직 개항되지 않은 섬.</div><div class="hint">상가가 가까우면 개항될 수 있습니다.</div>`;
  } else {
    title=`${ref(i)} · ${c.terr===0?'깊은 바다':'얕은 여울'}`; icon=c.terr===0?'≈':'~';
    const onRoute=routes.filter(r=>r.cells.includes(i));
    body= onRoute.length
      ? `<div class="led">통과 항로 ${onRoute.length}개</div>`+onRoute.slice(0,3).map(r=>{const hh=houseById(r.owner);return `<div class="led">· ${hh?hh.name:'?'} ${ref(r.a)}–${ref(r.b)}</div>`;}).join('')
      : `<div class="hint">선박이 지나는 항로가 없습니다.</div>`;
  }
  inspectEl.innerHTML=`<div class="ttl">${icon} ${title}</div>${body}`;
}

/* ====================== 시트 전환 ====================== */
let curSheet='map';
function renderLogSheet(){
  const data = curSheet==='wreck'
    ? wrecks.slice().reverse().map(w=>({yr:w.yr,type:'난파',msg:w.text,formula:w.formula}))
    : chron.slice().reverse();
  if(!data.length){ logBody.innerHTML='<div class="empty">기록 없음</div>'; return; }
  const typeColor={창단:'#0d8f5b',도래:'#0d8f5b',항로:'#1f7ae0',번영:'#b8860b',특허:'#b8860b',
    합병:'#7b4fd6',상전:'#c0392b',폭락:'#c0392b',난파:'#c0392b',해적:'#c0392b',도산:'#777'};
  logBody.innerHTML=data.map(r=>`<div class="lr">
      <div class="yr">${r.yr}</div>
      <div class="ty" style="color:${typeColor[r.type]||'#444'}">${r.type}</div>
      <div>${r.msg}</div>
      <div class="fx">${r.formula||''}</div></div>`).join('');
}
function switchSheet(s){
  curSheet=s;
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.sheet===s));
  if(s==='map'){ logSheet.classList.remove('show'); }
  else { logSheet.classList.add('show'); renderLogSheet(); }
}
document.querySelectorAll('#tabs .tab').forEach(t=>t.addEventListener('click',()=>switchSheet(t.dataset.sheet)));

/* ====================== 상호작용 ====================== */
sheet.addEventListener('click',e=>{
  const t=e.target.closest('.cell'); if(!t)return;
  const i=+t.dataset.i;
  if(mode==='route'){
    // 항로 개설 모드: 항구 두 개 선택
    if(cells[i].terr!==3||cells[i].owner===null){ setEvent('항로는 항구(◎◇◆★)에서만 시작합니다.'); updateStatus(); return; }
    if(routePick<0){ routePick=i; if(selected>=0)cellArr[selected].classList.remove('sel');
      selected=i;t.classList.add('sel'); namebox.textContent=ref(i);
      setEvent(`출발항 ${ref(i)} 선택 — 도착항을 클릭하세요.`); updateStatus(); return; }
    else {
      if(i===routePick){ setEvent('다른 항구를 선택하세요.'); updateStatus(); return; }
      const owner=cells[routePick].owner;
      const rt=openRoute(routePick,i,owner);
      const h=houseById(owner);
      if(rt){ addChron(year,'항로',`${h?h.name:'상가'}이(가) ${ref(routePick)}–${ref(i)} 항로를 개설했습니다.`,`=ROUTE("${h?h.name:''}", ${ref(routePick)}, ${ref(i)})`);
        setEvent(`${ref(routePick)}–${ref(i)} 항로 개통!`); }
      else setEvent('이미 존재하는 항로입니다.');
      paintRoutes(); routePick=-1; mode='inspect'; document.body.style.cursor='';
      $('#btnRoute').classList.remove('on'); updateStatus(); return;
    }
  }
  // 일반: 셀 선택 + 장부 열람
  if(selected>=0)cellArr[selected].classList.remove('sel');
  selected=i; t.classList.add('sel');
  namebox.textContent=ref(i);
  const c=cells[i];
  fmla.innerHTML=fmt(`=LEDGER(${ref(i)}, ${c.hist.map(x=>`"${x}"`).join(', ')})`);
  renderInspect(i);
});

/* ---- 리본 버튼 ---- */
$('#btnPlay').addEventListener('click',()=>{
  paused=!paused;
  $('#btnPlay').querySelector('.ic').textContent=paused?'▶':'⏸';
  $('#btnPlay').querySelector('span:last-child').textContent=paused?'재생':'일시정지';
  $('#btnPlay').classList.toggle('on',!paused);
  resetTimer();
});
const SPEEDS=[1,2,4,8];
$('#btnSpeed').addEventListener('click',()=>{
  let idx=SPEEDS.indexOf(speed); idx=(idx+1)%SPEEDS.length; speed=SPEEDS[idx];
  $('#spdLbl').textContent='x'+speed; resetTimer();
});
$('#btnFound').addEventListener('click',()=>{ const h=foundHouse(true); if(!h)setEvent('개항할 섬이 없습니다.'); renderSide(); updateStatus(); });
$('#btnRoute').addEventListener('click',()=>{
  if(mode==='route'){ mode='inspect';routePick=-1;document.body.style.cursor='';$('#btnRoute').classList.remove('on'); setEvent('항로 개설 취소'); }
  else { if(!houses.length){setEvent('먼저 상가를 창단하세요.');updateStatus();return;}
    mode='route';routePick=-1;document.body.style.cursor='crosshair';$('#btnRoute').classList.add('on');
    setEvent('출발 항구를 클릭하세요.'); }
  updateStatus();
});
$('#btnGrant').addEventListener('click',()=>{
  // 선택 항구의 상가에 특허장 부여 (없으면 1위에게)
  let h=null;
  if(selected>=0 && cells[selected].terr===3 && cells[selected].owner!==null) h=houseById(cells[selected].owner);
  if(!h && houses.length) h=houses.slice().sort((a,b)=>b.cap-a.cap)[0];
  if(!h){setEvent('특허장을 줄 상가가 없습니다.');updateStatus();return;}
  h.charter=100; if(h.ports.length)gold(h.ports[0]);
  addChron(year,'특허',`${h.name}에 동맹 특허장 수여 (전매 100년).`,`=GRANT.CHARTER("${h.name}", 100)`);
  setEvent(`${h.name}에 특허장을 수여했습니다.`); renderSide(); updateStatus();
});
$('#btnStorm').addEventListener('click',()=>{ triggerStorm();
  for(const i of dirty)paint(i);dirty.clear(); paintRoutes(); updateStatus(); });
$('#btnReset').addEventListener('click',()=>{ init(); });

/* ====================== 루프 타이머 ====================== */
let timer=null;
function resetTimer(){
  if(timer)clearInterval(timer);
  if(paused)return;
  timer=setInterval(()=>{ for(let s=0;s<speed;s++)step(); }, 140);
}

/* ====================== 초기화 ====================== */
function init(){
  if(timer)clearInterval(timer);
  shipsLayer.innerHTML='';
  houses=[];routes=[];wrecks=[];chron=[];nameIdx=0;year=1;tick=0;selected=-1;
  routePick=-1;mode='inspect';paused=false;warCD=0;
  $('#btnRoute').classList.remove('on');document.body.style.cursor='';
  $('#btnPlay').querySelector('.ic').textContent='⏸';
  $('#btnPlay').querySelector('span:last-child').textContent='일시정지';
  $('#btnPlay').classList.add('on');
  $('#tabWreck').textContent='난파록 (0)';
  computeDims();
  resetMarket();
  genTerrain();
  buildSheet();
  for(let i=0;i<N;i++)paint(i);
  paintRoutes();
  lastEvent='열도에 안개가 걷혔습니다. 상선이 항해를 시작합니다.';
  fmla.innerHTML=fmt(`=SIM.ARCHIPELAGO($A$1:$${colName(COLS-1)}$${ROWS}, "바다는 모두에게 길을 연다")`);
  foundHouse(true);foundHouse(true);foundHouse(true);
  switchSheet('map');
  renderSide();updateStatus();
  resetTimer();
}

let rTO=null;
addEventListener('resize',()=>{ clearTimeout(rTO); rTO=setTimeout(()=>{
  // 격자 재구성 (월드 보존이 복잡하므로 새 세계로)
  const wasPaused=paused; init(); if(wasPaused){paused=true;resetTimer();}
},350); });

init();
})();
</script>
