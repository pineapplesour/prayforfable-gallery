<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>역병연대기.xlsx - Excel</title>
<style>
  :root{
    --green:#107c41; --green-d:#0b5c30; --grid:#e3e3e3; --hd:#f5f5f5;
    --ink:#1f1f1f; --muted:#666;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#d6dadf;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:var(--ink);user-select:none;-webkit-tap-highlight-color:transparent}

  /* ---- title bar ---- */
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar .ttl{margin-left:8px;color:#3a3a3a;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #titlebar .spacer{flex:1}
  #titlebar .ctrl{color:#888;font-size:13px;letter-spacing:6px;font-family:Consolas,monospace}

  /* ---- ribbon ---- */
  #menubar{height:26px;background:#fff;display:flex;align-items:flex-end;
    padding:0 10px;gap:14px;border-bottom:1px solid #e6e6e6;font-size:12px;color:#555;overflow:hidden}
  #menubar b{color:var(--green);border-bottom:2.5px solid var(--green);padding:3px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:3px 2px;cursor:default}
  #menubar i:hover{background:#f1f1f1;border-radius:3px}
  #ribbon{height:42px;background:#fafafa;border-bottom:1px solid #e0e0e0;display:flex;
    align-items:center;gap:4px;padding:0 8px;overflow:hidden}
  .rbtn{height:34px;min-width:48px;border:1px solid transparent;border-radius:4px;background:transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    font-size:10.5px;color:#3a3a3a;cursor:pointer;padding:0 7px;line-height:1.1}
  .rbtn .ic{font-size:15px;line-height:1}
  .rbtn:hover{background:#eef6f0;border-color:#cfe6d8}
  .rbtn:active{background:#d9eee1}
  .rbtn.on{background:#e1f1e7;border-color:#9fcdb2}
  .rbtn.danger:hover{background:#fdecec;border-color:#f1c4c4}
  .rsep{width:1px;height:28px;background:#e0e0e0;margin:0 3px}
  .rgrp{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:38px;gap:1px}
  .rgrp .lbl{font-size:9px;color:#999}
  .rgrp .row{display:flex;gap:2px}

  /* ---- formula bar ---- */
  #fbar{height:24px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px}
  #namebox{width:78px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;font-weight:600}
  #fxbox{width:54px;display:flex;align-items:center;justify-content:center;gap:6px;border-right:1px solid #eee;height:100%}
  #fxbox .a{color:#bbb;cursor:default}
  #fx{color:#888;font-style:italic;font-family:Georgia,serif}
  #formula{flex:1;padding:0 10px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#16410f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #formula b{color:#7030a0;font-weight:700}

  /* ---- main split ---- */
  #main{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column}
  #stage{flex:1;display:flex;min-height:0;position:relative}

  /* ---- grid ---- */
  #sheetwrap{flex:1;position:relative;overflow:hidden;background:#fff;min-width:0}
  #sheet{display:grid;background:#fff}
  .hd{background:var(--hd);border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#666;font-size:10.5px;font-weight:500}
  .hd.corner{background:#eee}
  .hd.activeh{background:#cfe6d8;color:#0b5c30;font-weight:700}
  .cell{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);
    display:flex;align-items:center;justify-content:center;font-size:12px;
    overflow:hidden;cursor:cell;position:relative;transition:background .12s linear}
  .cell.sel{outline:2px solid var(--green);outline-offset:-2px;z-index:3}
  .cell .badge{position:absolute;top:0;right:1px;font-size:7px;color:#fff;line-height:1}
  @keyframes pulseInf{0%,100%{box-shadow:inset 0 0 0 0 rgba(124,30,160,0)}50%{box-shadow:inset 0 0 0 2px rgba(124,30,160,.55)}}
  .cell.newinf{animation:pulseInf .9s 2}
  @keyframes flashDie{0%{background:#000}100%{}}
  .cell.dying{animation:flashDie .5s ease-out}

  /* ---- side panel ---- */
  #side{width:268px;background:#fbfbfb;border-left:1px solid #d8d8d8;display:flex;flex-direction:column;overflow:hidden}
  #side .ph{background:var(--green);color:#eafbf0;padding:7px 11px;font-weight:700;font-size:12px;letter-spacing:.3px;
    display:flex;justify-content:space-between;align-items:center}
  #side .ph small{font-weight:400;opacity:.85;font-size:10px}
  #side .body{flex:1;overflow-y:auto;padding:9px 11px}
  .card{background:#fff;border:1px solid #e6e6e6;border-radius:6px;padding:9px 10px;margin-bottom:9px}
  .card h5{margin:0 0 7px;font-size:11px;color:#0b5c30;letter-spacing:.3px;text-transform:none;display:flex;justify-content:space-between}
  .stat{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin:3px 0;color:#333}
  .stat .v{font-family:Consolas,monospace;font-weight:600}
  .swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
  .bar{height:7px;border-radius:4px;background:#eee;overflow:hidden;margin-top:3px;display:flex}
  .bar>i{display:block;height:100%}
  .strain-row{display:flex;align-items:center;font-size:10.5px;margin:4px 0;gap:5px}
  .strain-row .nm{flex:1;color:#333}
  .strain-row .badge2{font-family:Consolas,monospace;color:#7030a0;font-weight:700}
  .chron{font-size:10.5px;line-height:1.5;color:#444;border-left:2px solid #d8c6ec;padding:1px 0 1px 7px;margin:3px 0}
  .chron .yr{color:#7030a0;font-weight:700;font-family:Consolas,monospace}
  .chron.dead{border-left-color:#bbb;color:#888}
  .chron.cure{border-left-color:#107c41}
  .chron.cure .yr{color:#107c41}

  /* ---- status bar ---- */
  #statusbar{height:23px;background:var(--green);color:#eafbf0;display:flex;align-items:center;
    padding:0 12px;font-size:11px;gap:0;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .ev{flex:1;overflow:hidden;text-overflow:ellipsis;color:#fff}
  #statusbar .zoom{margin-left:8px;opacity:.85}

  /* ---- sheet tabs ---- */
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:8px;
    border-top:1px solid #d4d4d4;font-size:11.5px;gap:1px}
  #tabs .arrows{color:#aaa;align-self:center;margin:0 6px;letter-spacing:2px;font-size:10px}
  #tabs .tab{padding:3px 13px;border:1px solid #d4d4d4;border-bottom:none;border-radius:4px 4px 0 0;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs .tab.on{background:#fff;color:var(--green);font-weight:700;border-top:2px solid var(--green);padding-top:2px}
  #tabs .plus{padding:3px 9px;color:#aaa;cursor:default}

  /* ---- sheet overlays (연대기 / 멸망기록 / 통계) ---- */
  .sheetview{position:absolute;inset:0;background:#fff;overflow:auto;display:none;z-index:6}
  .sheetview.show{display:block}
  .sv-tbl{border-collapse:collapse;width:100%;font-size:11.5px}
  .sv-tbl th,.sv-tbl td{border:1px solid var(--grid);padding:4px 9px;text-align:left;white-space:nowrap}
  .sv-tbl th{background:var(--hd);color:#555;font-weight:600;position:sticky;top:0;z-index:2}
  .sv-tbl td.r{text-align:right;font-family:Consolas,monospace}
  .sv-tbl tr:nth-child(even) td{background:#fafafa}
  .sv-tbl .mono{font-family:Consolas,monospace;color:#7030a0}
  .sv-empty{padding:24px;color:#999;text-align:center}

  /* toast for interventions */
  #toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);
    background:rgba(16,124,65,.95);color:#fff;padding:7px 16px;border-radius:6px;font-size:12px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:30;opacity:0;transition:opacity .25s,top .25s;pointer-events:none}
  #toast.show{opacity:1;top:20px}
  #toast.warn{background:rgba(192,0,0,.95)}

  /* legend chip in grid corner */
  #legend{position:absolute;left:54px;bottom:8px;background:rgba(255,255,255,.94);border:1px solid #e0d4ef;
    box-shadow:0 2px 8px rgba(0,0,0,.12);border-radius:6px;padding:6px 9px;font-size:10px;z-index:4;line-height:1.7;color:#444}
  #legend b{color:#7030a0}
  #legend .lc{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle;border:1px solid rgba(0,0,0,.08)}

  /* mobile */
  @media (max-width:760px){
    #side{display:none}
    #ribbon{height:40px}
    .rbtn{min-width:42px;font-size:10px;padding:0 5px}
    #legend{font-size:9px}
    #menubar{gap:9px}
  }
</style>
</head>
<body>
<div id="main">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <div class="ttl" id="title">역병연대기.xlsx - Excel</div>
    <div class="spacer"></div>
    <div class="ctrl">— ▢ ✕</div>
  </div>

  <div id="menubar">
    <i>파일</i><b>홈</b><i>삽입</i><i>그리기</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>역학</i>
  </div>

  <div id="ribbon">
    <div class="rgrp">
      <div class="row">
        <button class="rbtn" id="btnPlay"><span class="ic">⏸</span><span>일시정지</span></button>
        <button class="rbtn" id="btnSpeed"><span class="ic">⏩</span><span id="spdlbl">속도 ×1</span></button>
      </div>
      <div class="lbl">시뮬레이션</div>
    </div>
    <div class="rsep"></div>
    <div class="rgrp">
      <div class="row">
        <button class="rbtn on" id="btnQuar"><span class="ic">🚧</span><span>봉쇄</span></button>
        <button class="rbtn" id="btnCure"><span class="ic">💉</span><span>치료</span></button>
        <button class="rbtn danger" id="btnSeed"><span class="ic">☣</span><span>전파</span></button>
      </div>
      <div class="lbl">개입 (셀 클릭)</div>

    <div class="rsep"></div>
    <div class="rgrp">
      <div class="row">
        <button class="rbtn" id="btnVax"><span class="ic">🧪</span><span>백신 배포</span></button>
        <button class="rbtn danger" id="btnReset"><span class="ic">↻</span><span>새 역병</span></button>
      </div>
      <div class="lbl">정책</div>
    </div>
    <div class="rsep"></div>
    <div class="rgrp">
      <div class="row">
        <div class="rbtn" style="cursor:default" id="r0pill"><span class="ic" style="color:#7030a0">R₀</span><span id="r0val">—</span></div>
      </div>
      <div class="lbl">기초감염재생산수</div>
    </div>
  </div>

  <div id="fbar">
    <div id="namebox">A1</div>
    <div id="fxbox"><span class="a">▼</span><span id="fx">fx</span></div>
    <div id="formula"></div>
  </div>

  <div id="stage">
    <div id="sheetwrap">
      <div id="sheet"></div>
      <div id="legend"></div>
      <!-- overlay sheets -->
      <div class="sheetview" id="sv-chron"></div>
      <div class="sheetview" id="sv-dead"></div>
      <div class="sheetview" id="sv-stat"></div>
      <div id="toast"></div>
    </div>
    <div id="side">
      <div class="ph">세계 보건 현황 <small id="side-year">서기 1년</small></div>
      <div class="body" id="sidebody"></div>
    </div>
  </div>

  <div id="statusbar">
    <span id="st-mode">준비</span><span class="sep">|</span>
    <span class="ev" id="st-event">역병연대기 워크시트를 불러왔습니다.</span>
    <span class="zoom">100%</span>
  </div>

  <div id="tabs">
    <span class="arrows">◀ ▶</span>
    <div class="tab on" data-sheet="map">세계지도</div>
    <div class="tab" data-sheet="chron">연대기</div>
    <div class="tab" data-sheet="dead" id="tab-dead">멸망기록 (0)</div>
    <div class="tab" data-sheet="stat">통계</div>
    <span class="plus">＋</span>
  </div>
</div>

<script>
(() => {
"use strict";
/* ============================================================
   역병의 시대 — 엑셀로 위장한 살아있는 전염병 시뮬
   셀 그리드 = 세계지도. 각 셀 = 한 정착지(또는 지형).
   상태: water / land(황무지) / 도시(인구 보유) / 폐허
   질병: 건강 → 감염(疫) → 사망(✝, 일부) → 면역(免) 회복
   변이 균주(strain)별 전염력/치명률 상이. 사용자가 봉쇄/치료/전파 개입.
   ============================================================ */

  const $ = id => document.getElementById(id);
  const sheet = $('sheet'), fmla = $('formula'), namebox = $('namebox');

  /* ---------- 그리드 치수: 화면에 맞춰 산정 ---------- */
  function dims(){
    const mobile = innerWidth <= 760;
    const CW = mobile ? 30 : 40, CH = mobile ? 24 : 26;
    const sideW = mobile ? 0 : 268;
    const availW = innerWidth - sideW - 50;            // 50 = 행번호 헤더폭 여유
    const availH = innerHeight - (30+26+42+24+23+25) - 6; // chrome 높이 합
    const COLS = Math.max(14, Math.min(mobile?20:46, Math.floor(availW / CW)));
    const ROWS = Math.max(12, Math.min(mobile?34:30, Math.floor(availH / CH)));
    return {CW,CH,COLS,ROWS};
  }
  let {CW,CH,COLS,ROWS} = dims();
  let N = COLS*ROWS;
  const HDW = 50;

  function colName(n){ let s=''; n++; while(n>0){const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0;} return s; }
  function ref(i){ return colName(i%COLS)+(Math.floor(i/COLS)+1); }

  /* ---------- 균주 정의 ---------- */
  // 변이마다 색조(보라계열)·전염력·치명률 차이. 그리스 문자명.
  const STRAINS = [];
  const STRAIN_NAMES = ['알파','베타','감마','델타','입실론','제타','에타','세타','오메가'];
  function makeStrain(parent){
    const idx = STRAINS.length;
    const base = parent || {trans:0.20, lethal:0.10, hue:282};
    const s = {
      id: idx,
      name: STRAIN_NAMES[idx % STRAIN_NAMES.length] + '형',
      trans: Math.min(0.42, Math.max(0.10, base.trans*(1+(Math.random()*0.5-0.18)))),
      lethal: Math.min(0.42, Math.max(0.03, base.lethal*(1+(Math.random()*0.6-0.3)))),
      hue: (base.hue + (parent? (Math.random()*60-30):0) + 360) % 360,
      cases: 0, deaths: 0, born: 1
    };
    STRAINS.push(s);
    return s;
  }

  /* ---------- 셀 상태 ---------- */
  // st: 'water' | 'land' | 'city' | 'ruin'
  // health: 'ok' | 'inf' | 'imm'
  const cells = new Array(N);
  const cellEls = new Array(N);

  /* 값잡음(지형 생성) */
  let gz, GW=9, GH=6;
  function genTerrain(){
    gz = new Array(GW*GH); for(let i=0;i<GW*GH;i++) gz[i]=Math.random();
  }
  function noise(x,y){
    const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
    const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
    const a=gz[y0*GW+x0], b=gz[y0*GW+Math.min(GW-1,x0+1)];
    const c=gz[Math.min(GH-1,y0+1)*GW+x0], d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
    return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
  }

  const CITY_GLYPH = ['','·','村','邑','都'];          // 인구 등급 글리프
  const CITY_LABEL = ['','마을','읍','도시','대도시'];
  const CITY_NAMES = ['라벤느','코르다','미르','솔레','하란','베스크','다온','이르','노바','퀼른','테른','자흐','오딘','셰일','루미','가르','펜','아브','모르','시온','크렐','윈터','벨라','오크'];
  let cityNameIdx = 0;

  function buildWorld(){
    genTerrain();
    cityNameIdx = 0;
    for(let i=0;i<N;i++){
      const x=i%COLS, y=i/COLS|0;
      const v = noise(x,y) + (Math.random()-0.5)*0.14;
      let c = {st:'land', health:'ok', strain:-1, infT:0, pop:0, lvl:0, name:null,
               hist:['황무지'], deadCount:0, ruinT:0};
      if(v < 0.30){ c.st='water'; c.hist=['바다']; }
      else if(v > 0.66 && Math.random()<0.5){ c.st='land'; c.hist=['삼림']; c.forest=true; }
      cells[i]=c;
    }
    // 도시 배치: 육지 중 일부를 정착지로
    let placed=0;
    const order=[...Array(N).keys()].sort(()=>Math.random()-0.5);
    for(const i of order){
      const c=cells[i];
      if(c.st==='land' && !c.forest && Math.random()<0.34){
        const lvl = 1 + (Math.random()<0.45?1:0) + (Math.random()<0.18?1:0);
        c.st='city'; c.lvl=lvl;
        c.pop = [0,800,3500,18000,90000][lvl] + (Math.random()*0.5)*[0,800,3500,18000,90000][lvl]|0;
        c.name = CITY_NAMES[cityNameIdx++ % CITY_NAMES.length];
        c.hist=['건국'];
        placed++;
      }
    }
    // 너무 적으면 보충
    if(placed<8){
      for(const i of order){
        if(placed>=10) break;
        const c=cells[i];
        if(c.st==='land'){ c.st='city'; c.lvl=1; c.pop=600+Math.random()*900|0; c.name=CITY_NAMES[cityNameIdx++%CITY_NAMES.length]; c.hist=['건국']; placed++; }
      }
    }
  }

  function nbrs(i){
    const x=i%COLS, y=i/COLS|0, out=[];
    if(x>0)out.push(i-1); if(x<COLS-1)out.push(i+1);
    if(y>0)out.push(i-COLS); if(y<ROWS-1)out.push(i+COLS);
    return out;
  }

  /* ---------- DOM 구성 ---------- */
  function buildGrid(){
    sheet.style.gridTemplateColumns = `${HDW}px repeat(${COLS}, ${CW}px)`;
    sheet.style.gridAutoRows = CH+'px';
    sheet.innerHTML='';
    const frag=document.createDocumentFragment();
    const corner=document.createElement('div'); corner.className='hd corner'; frag.appendChild(corner);
    colHeads=[];
    for(let c=0;c<COLS;c++){ const h=document.createElement('div'); h.className='hd'; h.textContent=colName(c); frag.appendChild(h); colHeads.push(h); }
    rowHeads=[];
    for(let r=0;r<ROWS;r++){
      const h=document.createElement('div'); h.className='hd'; h.textContent=r+1; frag.appendChild(h); rowHeads.push(h);
      for(let c=0;c<COLS;c++){
        const d=document.createElement('div'); d.className='cell'; d.dataset.i=r*COLS+c;
        cellEls[r*COLS+c]=d; frag.appendChild(d);
      }
    }
    sheet.appendChild(frag);
  }
  let colHeads=[], rowHeads=[];

  /* ---------- 색/그리기 ---------- */
  function strainColor(sid, infT){
    const s = STRAINS[sid] || STRAINS[0];
    // 감염 잔여 틱(infT 0..감염기간) 따라 진하게
    const intensity = 0.35 + 0.5*Math.min(1, infT/8);
    return `hsla(${s.hue}, 62%, 52%, ${intensity})`;
  }

  function paint(i){
    const c=cells[i], el=cellEls[i];
    if(!el) return;
    let bg='', tx='', col='#333', w='', title='', badge='';
    if(c.st==='water'){ bg='#dcebf7'; tx='≈'; col='#9db8e0'; }
    else if(c.st==='ruin'){ bg='#e9e9e9'; tx='墟'; col='#9a9a9a'; }
    else if(c.forest){ bg='#e7efe1'; tx='木'; col='#6a9a52'; }
    else if(c.st==='land'){ bg=''; tx=''; }
    else if(c.st==='city'){
      if(c.health==='inf'){
        bg = strainColor(c.strain, c.infT);
        tx = '疫'; col = '#fff'; w='700';
        title = `${c.name||'정착지'} · ${STRAINS[c.strain]?STRAINS[c.strain].name:'역병'} 감염중`;
      } else if(c.health==='imm'){
        bg = '#dff0e6'; tx='免'; col='#2c8a55'; w='600';
        title = `${c.name||'정착지'} · 집단면역`;
      } else {
        // 건강 — 인구 등급 글리프, 옅은 청록
        const t=[0,0.12,0.2,0.32,0.46][c.lvl];
        bg = `rgba(20,124,65,${t})`;
        tx = CITY_GLYPH[c.lvl]; col = c.lvl>=3?'#0b5c30':'#2f7d52'; w = c.lvl>=4?'700':'';
        title = `${c.name||'정착지'} · 인구 ${c.pop.toLocaleString()}`;
      }
      if(c.deadCount>0 && c.health!=='inf'){ badge='✝'; }
    }
    el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
    el.textContent=tx;
    el.title=title;
    if(badge){
      if(!el._b){ const b=document.createElement('span'); b.className='badge'; el.appendChild(b); el._b=b; }
      el._b.textContent=badge; el._b.style.display='';
    } else if(el._b){ el._b.style.display='none'; }
  }

  /* ---------- 통계 / 로그 ---------- */
  let year=1, tick=0;
  let totalDead=0, peakInfected=0;
  const chron=[];      // {yr,msg,cls}
  const obituaries=[]; // {name,yr,strain}
  let lastEventMsg='역병연대기 워크시트를 불러왔습니다.';

  function logEvent(msg, formula, cls){
    lastEventMsg = msg;
    chron.unshift({yr:year, msg, cls:cls||''});
    if(chron.length>120) chron.pop();
    if(formula) fmla.innerHTML = formula;
    $('st-event').textContent = `서기 ${year}년: ${msg}`;
    if(curSheet==='chron') renderChron();
  }

  function curStats(){
    let ok=0,inf=0,imm=0,cities=0,popAlive=0,strainCount=new Map();
    for(let i=0;i<N;i++){
      const c=cells[i];
      if(c.st!=='city'){ if(c.st==='ruin' && c.wasCity) cities+=0; continue; }
      cities++; popAlive+=c.pop;
      if(c.health==='inf'){ inf++; strainCount.set(c.strain,(strainCount.get(c.strain)||0)+1); }
      else if(c.health==='imm') imm++;
      else ok++;
    }
    return {ok,inf,imm,cities,popAlive,strainCount};
  }

  /* ---------- 시뮬 틱 ---------- */
  let speeds=[1,2,4], speedIdx=0, paused=false, timer=null;
  let activeStrains=0;

  function spawnPlague(at, parentStrain){
    let i = at;
    if(i==null){
      // 무작위 도시 하나
      const candidates=[];
      for(let k=0;k<N;k++) if(cells[k].st==='city' && cells[k].health==='ok') candidates.push(k);
      if(!candidates.length) return null;
      i = candidates[Math.random()*candidates.length|0];
    }
    const c=cells[i];
    if(c.st!=='city') return null;
    const s = parentStrain!=null ? STRAINS[parentStrain] : makeStrain(null);
    c.health='inf'; c.strain=s.id; c.infT=10;
    c.hist.push('역병 창궐'); if(c.hist.length>8)c.hist.shift();
    s.cases++;
    const el=cellEls[i]; if(el){ el.classList.add('newinf'); setTimeout(()=>el.classList.remove('newinf'),900); }
    paint(i);
    return {i,s};
  }

  function step(){
    tick++; year++;
    let newDead=0;
    const toPaint=new Set();

    // --- 폐허 회복 ---
    for(let i=0;i<N;i++){
      const c=cells[i];
      if(c.st==='ruin'){ if(--c.ruinT<=0){ c.st='land'; c.wasCity=false; toPaint.add(i);} }
    }

    // --- 감염 진행 ---
    const infectedIdx=[];
    for(let i=0;i<N;i++) if(cells[i].st==='city' && cells[i].health==='inf') infectedIdx.push(i);

    let liveInf = infectedIdx.length;
    if(liveInf>peakInfected) peakInfected=liveInf;

    for(const i of infectedIdx){
      const c=cells[i];
      const s=STRAINS[c.strain]||STRAINS[0];
      // 전파 (봉쇄된 셀은 전파 차단)
      if(!c.quarantine){
        let spread = s.trans;
        for(const n of nbrs(i)){
          const nc=cells[n];
          if(nc.st!=='city') continue;
          if(nc.health==='ok' && !nc.quarantine){
            // 인구 많을수록 잘 퍼짐, 면역 인접은 방벽
            const p = spread * (0.8 + nc.lvl*0.16);
            if(Math.random()<p){
              nc.health='inf'; nc.strain=c.strain; nc.infT=10;
              nc.hist.push('감염'); if(nc.hist.length>8)nc.hist.shift();
              s.cases++;
              toPaint.add(n);
              const el=cellEls[n]; if(el){ el.classList.add('newinf'); const ee=el; setTimeout(()=>ee.classList.remove('newinf'),900); }
            }
          }
        }
      }
      // 결과: 사망 or 회복
      c.infT--;
      // 매 틱 치명률 적용 (인구 손실 → 등급 하락 → 멸망. 풍토병 하한선이 있어 세계는 계속 산다)
      if(Math.random() < s.lethal*0.45){
        // 사망: 인구 손실, 도시 등급 하락, 폐허화 가능
        const loss = Math.ceil(c.pop * (0.18 + Math.random()*0.25));
        c.pop -= loss; c.deadCount += loss; totalDead += loss; s.deaths += loss; newDead += loss;
        if(c.pop < 300){
          // 마을 소멸 → 폐허
          c.st='ruin'; c.wasCity=true; c.ruinT=160+Math.random()*120|0; c.health='ok';
          c.hist.push('역병으로 멸망'); if(c.hist.length>8)c.hist.shift();
          obituaries.unshift({name:c.name||ref(i), yr:year, strain:s.name});
          if(obituaries.length>200)obituaries.pop();
          const el=cellEls[i]; if(el){ el.classList.add('dying'); const ee=el; setTimeout(()=>ee.classList.remove('dying'),500); }
          if(obituaries.length<=6 || Math.random()<0.25)
            logEvent(`${c.name||ref(i)}이(가) ${s.name} 역병으로 멸망했습니다.`, `=COLLAPSE(<b>"${c.name||ref(i)}"</b>, ${year})`, 'dead');
        } else {
          c.lvl=Math.max(1,c.lvl-1);
          c.hist.push('대량 사망'); if(c.hist.length>8)c.hist.shift();
        }
        toPaint.add(i);
      } else if(c.infT<=0){
        // 회복 → 면역
        c.health='imm'; c.immT = 35+Math.random()*45|0;
        c.hist.push('회복(면역)'); if(c.hist.length>8)c.hist.shift();
        toPaint.add(i);
      } else {
        toPaint.add(i); // 색 갱신(농도 변화)
      }
    }

    // --- 면역 감퇴 (시간 지나면 다시 감염 가능) ---
    for(let i=0;i<N;i++){
      const c=cells[i];
      if(c.st==='city' && c.health==='imm'){
        if(--c.immT<=0 && Math.random()<0.8){ c.health='ok'; c.hist.push('면역 소실'); if(c.hist.length>8)c.hist.shift(); toPaint.add(i); }
      }
    }

    // --- 평시 도시 성장 (역병 없을 때 회복/성장) ---
    if(Math.random()<0.5){
      for(let q=0;q<3;q++){
        const i=Math.random()*N|0; const c=cells[i];
        if(c.st==='city' && c.health==='ok'){
          c.pop += Math.ceil(c.pop*0.012)+5;
          if(c.lvl<4 && c.pop > [0,800,3500,18000,90000][c.lvl+1]*0.7 && Math.random()<0.04){
            c.lvl++; c.hist.push(CITY_LABEL[c.lvl]+' 승격'); if(c.hist.length>8)c.hist.shift();
            toPaint.add(i);
            if(c.lvl===4 && Math.random()<0.5) logEvent(`${c.name||ref(i)}이(가) 대도시로 번성했습니다.`, `=PROSPER(<b>"${c.name||ref(i)}"</b>, ${ref(i)})`, 'cure');
          }
        }
      }
    }

    // --- 변이 ---
    activeStrains = new Set(infectedIdx.map(i=>cells[i].strain)).size;
    if(liveInf>5 && Math.random()<0.012){
      const src = infectedIdx[Math.random()*infectedIdx.length|0];
      if(src!=null){
        const parent = cells[src].strain;
        const mut = makeStrain(STRAINS[parent]);
        // 변이는 인접 도시에서 발생
        const nb = nbrs(src).filter(n=>cells[n].st==='city');
        const target = nb.length? nb[Math.random()*nb.length|0] : src;
        const tc=cells[target];
        tc.health='inf'; tc.strain=mut.id; tc.infT=10; mut.cases++;
        toPaint.add(target);
        logEvent(`${mut.name} 변이가 ${ref(target)}에서 출현했습니다 (전염력 ${(mut.trans*100|0)}%, 치명률 ${(mut.lethal*100|0)}%).`,
          `=MUTATE(<b>"${mut.name}"</b>, R₀≈${(mut.trans*5.2).toFixed(1)})`);
      }
    }

    // --- 풍토병 유지: 역병이 항상 세계에 살아있도록 최소 감염 수를 유지 ---
    // 건강 도시 수에 비례한 동적 하한선(ENDEMIC FLOOR). 너무 적으면 잠복균이 깨어남.
    let healthyCities=0; for(let k=0;k<N;k++) if(cells[k].st==='city'&&cells[k].health==='ok') healthyCities++;
    const floor = Math.max(2, Math.round(healthyCities*0.05));
    if(liveInf < floor){
      // 부족분의 일부를 보충 (한 번에 1~2곳, 가끔 새 변이로)
      const want = Math.min(2, floor - liveInf);
      for(let q=0;q<want;q++){
        const newStrainChance = (liveInf===0 && Math.random()<0.35);
        const reuse = (!newStrainChance && STRAINS.length) ? STRAINS[Math.random()*STRAINS.length|0].id : null;
        const r=spawnPlague(null, reuse);
        if(r && liveInf===0 && q===0)
          logEvent(`잠복하던 ${r.s.name} 역병이 ${ref(r.i)}에서 다시 깨어났습니다.`, `=OUTBREAK(<b>${ref(r.i)}</b>, "${r.s.name}")`);
        if(r) liveInf++;
      }
    }
    // 새 정착지 개척 (빈 육지)
    if(Math.random()<0.06){
      const lands=[]; for(let k=0;k<N;k++) if(cells[k].st==='land'&&!cells[k].forest) lands.push(k);
      if(lands.length){
        const i=lands[Math.random()*lands.length|0]; const c=cells[i];
        // 인접 도시가 있을 때만 (이주)
        if(nbrs(i).some(n=>cells[n].st==='city'&&cells[n].health==='ok')){
          c.st='city'; c.lvl=1; c.pop=500+Math.random()*700|0; c.name=CITY_NAMES[cityNameIdx++%CITY_NAMES.length]; c.hist=['개척'];
          toPaint.add(i);
        }
      }
    }

    // 봉쇄 만료
    for(let i=0;i<N;i++){ const c=cells[i]; if(c.quarantine){ if(--c.quarT<=0){ c.quarantine=false; toPaint.add(i); } } }

    // --- 그리기 ---
    for(const i of toPaint) paint(i);

    // --- R0 추정: 현재 활성 균주들의 평균 전염력 * 접촉계수 ---
    let r0=0, cnt=0;
    const sset=new Set(infectedIdx.map(i=>cells[i].strain));
    for(const sid of sset){ r0+=STRAINS[sid].trans*5.2; cnt++; }
    r0 = cnt? (r0/cnt) : 0;
    $('r0val').textContent = liveInf? r0.toFixed(2) : '0.00';

    updateHUD(liveInf);
    if(tick%6===0) updateSide();
    if(curSheet==='stat') renderStat();
    if(curSheet==='dead') {} // 멸망기록은 이벤트 시 갱신 비용 큼 — 탭 전환 시만
  }

  /* ---------- HUD / 상태바 / 제목 ---------- */
  function updateHUD(liveInf){
    const s=curStats();
    $('st-mode').textContent = paused? '일시정지' : '계산 중';
    $('side-year').textContent = `서기 ${year}년`;
    document.title = `역병연대기.xlsx - Excel (서기 ${year}년 · 감염 ${liveInf})`;
    $('title').textContent = `역병연대기.xlsx - Excel`;
    $('tab-dead').textContent = `멸망기록 (${obituaries.length})`;
  }

  function bar(parts){ // parts: [{c,n}]
    const tot=parts.reduce((a,b)=>a+b.n,0)||1;
    return '<div class="bar">'+parts.map(p=>`<i style="width:${p.n/tot*100}%;background:${p.c}"></i>`).join('')+'</div>';
  }

  function updateSide(){
    if(innerWidth<=760) return;
    const s=curStats();
    const liveStrains=[...s.strainCount.entries()].sort((a,b)=>b[1]-a[1]);
    let h='';
    // 인구/감염 카드
    h+=`<div class="card"><h5>인구 동태 <span style="color:#999;font-weight:400">서기 ${year}년</span></h5>`;
    h+=`<div class="stat"><span><span class="swatch" style="background:rgba(20,124,65,.5)"></span>건강 도시</span><span class="v">${s.ok}</span></div>`;
    h+=`<div class="stat"><span><span class="swatch" style="background:hsla(282,62%,52%,.8)"></span>감염 도시</span><span class="v" style="color:#7030a0">${s.inf}</span></div>`;
    h+=`<div class="stat"><span><span class="swatch" style="background:#9ed3b4"></span>면역 도시</span><span class="v" style="color:#2c8a55">${s.imm}</span></div>`;
    h+=bar([{c:'rgba(20,124,65,.55)',n:s.ok},{c:'hsla(282,62%,52%,.85)',n:s.inf},{c:'#9ed3b4',n:s.imm}]);
    h+=`<div class="stat" style="margin-top:7px"><span>생존 인구</span><span class="v">${s.popAlive.toLocaleString()}</span></div>`;
    h+=`<div class="stat"><span>누적 사망</span><span class="v" style="color:#c00">${totalDead.toLocaleString()}</span></div>`;
    h+=`<div class="stat"><span>최대 동시 감염</span><span class="v">${peakInfected}개 도시</span></div>`;
    h+=`</div>`;
    // 균주 카드
    h+=`<div class="card"><h5>변이 균주 <span style="color:#999;font-weight:400">${STRAINS.length}계통</span></h5>`;
    if(!liveStrains.length) h+=`<div style="font-size:10.5px;color:#999">활성 균주 없음 — 세계가 잠시 숨을 돌립니다.</div>`;
    for(const [sid,n] of liveStrains.slice(0,5)){
      const st=STRAINS[sid];
      h+=`<div class="strain-row"><span class="swatch" style="background:hsla(${st.hue},62%,52%,.85)"></span>`+
         `<span class="nm">${st.name}</span>`+
         `<span class="badge2" title="전염력">T${(st.trans*100|0)}</span>`+
         `<span class="badge2" style="color:#c00" title="치명률">L${(st.lethal*100|0)}</span>`+
         `<span class="badge2" style="color:#444">${n}곳</span></div>`;
    }
    h+=`</div>`;
    // 개입 안내 카드
    h+=`<div class="card"><h5>개입 도구</h5>`+
       `<div style="font-size:10.5px;line-height:1.7;color:#555">`+
       `리본에서 도구를 고른 뒤 <b style="color:#0b5c30">셀(도시)을 클릭</b>하세요.<br>`+
       `<span style="color:#b8860b">🚧 봉쇄</span> 전파 차단 · `+
       `<span style="color:#107c41">💉 치료</span> 즉시 회복·면역<br>`+
       `<span style="color:#c00">☣ 전파</span> 새 역병 투입 · 셀 클릭 없이 <span style="color:#107c41">🧪 백신</span>은 전역 즉시.`+
       `</div></div>`;
    // 최근 연대기 미니
    h+=`<div class="card"><h5>최근 연대기</h5>`;
    for(const e of chron.slice(0,5)){
      h+=`<div class="chron ${e.cls}"><span class="yr">${e.yr}년</span> ${e.msg}</div>`;
    }
    h+=`</div>`;
    $('sidebody').innerHTML=h;
  }

  /* ---------- 시트(탭) 전환 ---------- */
  let curSheet='map';
  function showSheet(name){
    curSheet=name;
    document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('on', t.dataset.sheet===name));
    $('sv-chron').classList.toggle('show', name==='chron');
    $('sv-dead').classList.toggle('show', name==='dead');
    $('sv-stat').classList.toggle('show', name==='stat');
    $('legend').style.display = name==='map'?'':'none';
    if(name==='chron') renderChron();
    if(name==='dead') renderDead();
    if(name==='stat') renderStat();
    if(name==='map') fmla.innerHTML = mapFormula;
  }
  function renderChron(){
    let h='<table class="sv-tbl"><thead><tr><th style="width:80px">A · 연도</th><th style="width:130px">B · 함수</th><th>C · 사건 기록</th></tr></thead><tbody>';
    if(!chron.length) h+='<tr><td colspan="3" class="sv-empty">아직 기록이 없습니다.</td></tr>';
    for(const e of chron){
      const fn = e.cls==='dead'?'=COLLAPSE()':e.cls==='cure'?'=PROSPER()':'=EVENT()';
      h+=`<tr><td class="r">${e.yr}</td><td class="mono">${fn}</td><td>${e.msg.replace(/<[^>]+>/g,'')}</td></tr>`;
    }
    h+='</tbody></table>';
    $('sv-chron').innerHTML=h;
  }
  function renderDead(){
    let h='<table class="sv-tbl"><thead><tr><th style="width:60px">A · #</th><th>B · 멸망한 정착지</th><th style="width:120px">C · 사인(균주)</th><th style="width:90px">D · 멸망연도</th></tr></thead><tbody>';
    if(!obituaries.length) h+='<tr><td colspan="4" class="sv-empty">멸망한 정착지가 없습니다. 아직은.</td></tr>';
    obituaries.forEach((o,k)=>{
      h+=`<tr><td class="r">${k+1}</td><td>✝ ${o.name}</td><td class="mono">${o.strain}</td><td class="r">서기 ${o.yr}년</td></tr>`;
    });
    h+='</tbody></table>';
    $('sv-dead').innerHTML=h;
  }
  function renderStat(){
    const s=curStats();
    let h='<table class="sv-tbl"><thead><tr><th style="width:200px">A · 지표</th><th style="width:160px">B · 값</th><th>C · 수식</th></tr></thead><tbody>';
    const rows=[
      ['현재 연도', `서기 ${year}년`, '=NOW.YEAR()'],
      ['생존 인구', s.popAlive.toLocaleString()+'명', '=SUM(인구!살아있는)'],
      ['누적 사망자', totalDead.toLocaleString()+'명', '=SUM(멸망기록!사망)'],
      ['건강 도시', s.ok+'곳', '=COUNTIF(상태,"건강")'],
      ['감염 도시', s.inf+'곳', '=COUNTIF(상태,"감염")'],
      ['면역 도시', s.imm+'곳', '=COUNTIF(상태,"면역")'],
      ['멸망 정착지', obituaries.length+'곳', '=COUNTA(멸망기록!B:B)'],
      ['변이 계통 수', STRAINS.length+'계통', '=COUNTA(균주!A:A)'],
      ['최대 동시 감염', peakInfected+'곳', '=MAX(감염이력)'],
    ];
    for(const r of rows) h+=`<tr><td>${r[0]}</td><td class="r">${r[1]}</td><td class="mono">${r[2]}</td></tr>`;
    h+='</tbody><thead><tr><th>균주명</th><th>감염/사망</th><th>전염력 · 치명률</th></tr></thead><tbody>';
    STRAINS.forEach(st=>{
      h+=`<tr><td><span class="swatch" style="background:hsla(${st.hue},62%,52%,.85)"></span>${st.name}</td>`+
         `<td class="r">${st.cases.toLocaleString()} / <span style="color:#c00">${st.deaths.toLocaleString()}</span></td>`+
         `<td class="mono">T${(st.trans*100|0)}% · L${(st.lethal*100|0)}%</td></tr>`;
    });
    h+='</tbody></table>';
    $('sv-stat').innerHTML=h;
  }

  /* ---------- 셀 선택 & 개입 ---------- */
  let selected=-1, tool='quar'; // quar | cure | seed
  function selectCell(i){
    if(selected>=0 && cellEls[selected]) cellEls[selected].classList.remove('sel');
    selected=i;
    const el=cellEls[i]; if(el) el.classList.add('sel');
    namebox.textContent=ref(i);
    // 헤더 하이라이트
    colHeads.forEach((h,c)=>h.classList.toggle('activeh', c===i%COLS));
    rowHeads.forEach((h,r)=>h.classList.toggle('activeh', r===(i/COLS|0)));
    showCellFormula(i);
  }
  function showCellFormula(i){
    const c=cells[i];
    let f;
    if(c.st==='water') f=`=TERRAIN("바다")`;
    else if(c.st==='ruin') f=`=RUIN("${c.wasCity?'역병으로 멸망한 정착지':'폐허'}", 복구중)`;
    else if(c.forest) f=`=TERRAIN("삼림")`;
    else if(c.st==='city'){
      const status = c.health==='inf'?`<b>감염(${STRAINS[c.strain].name})</b>`: c.health==='imm'?'면역':'건강';
      f=`=CITY("${c.name||ref(i)}", 인구=${c.pop.toLocaleString()}, 상태=${status}, 등급="${CITY_LABEL[c.lvl]}")`;
    } else f=`=LAND("황무지")`;
    fmla.innerHTML=f;
  }

  function toast(msg, warn){
    const t=$('toast'); t.textContent=msg; t.className='show'+(warn?' warn':'');
    clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1500);
  }

  function applyTool(i){
    const c=cells[i];
    if(tool==='seed'){
      if(c.st!=='city'){ toast('도시(정착지) 셀에만 역병을 투입할 수 있습니다.', true); return; }
      const r=spawnPlague(i, null);
      if(r){ toast(`${c.name||ref(i)}에 ${r.s.name} 역병 투입`, true);
        logEvent(`인위적으로 ${c.name||ref(i)}에 ${r.s.name} 역병을 투입했습니다.`, `=SEED(<b>${ref(i)}</b>, "${r.s.name}")`); }
    } else if(tool==='cure'){
      if(c.st!=='city'){ toast('치료할 도시를 선택하세요.', true); return; }
      c.health='imm'; c.immT=120; c.infT=0;
      c.hist.push('치료(면역)'); if(c.hist.length>8)c.hist.shift();
      paint(i);
      toast(`${c.name||ref(i)} 치료 완료 — 집단면역 확보`);
      logEvent(`${c.name||ref(i)}에 치료제를 투여해 회복시켰습니다.`, `=CURE(<b>${ref(i)}</b>)`, 'cure');
    } else if(tool==='quar'){
      if(c.st!=='city'){ toast('도시를 봉쇄할 수 있습니다.', true); return; }
      c.quarantine=true; c.quarT=45;
      c.hist.push('봉쇄령'); if(c.hist.length>8)c.hist.shift();
      // 봉쇄 표시: 굵은 테두리
      const el=cellEls[i]; if(el){ el.style.boxShadow='inset 0 0 0 2px #b8860b'; setTimeout(()=>{ if(!c.quarantine&&el) el.style.boxShadow=''; },200); }
      paint(i);
      toast(`${c.name||ref(i)} 봉쇄 — 45년간 전파 차단`);
      logEvent(`${c.name||ref(i)}에 봉쇄령을 내렸습니다.`, `=QUARANTINE(<b>${ref(i)}</b>, 45)`);
    }
    if(curSheet!=='map'){} else { updateSide(); }
  }

  sheet.addEventListener('click', e=>{
    const t=e.target.closest('.cell'); if(!t) return;
    const i=+t.dataset.i;
    selectCell(i);
    applyTool(i);
  });

  /* ---------- 리본 버튼 ---------- */
  function setTool(name){
    tool=name;
    $('btnQuar').classList.toggle('on', name==='quar');
    $('btnCure').classList.toggle('on', name==='cure');
    $('btnSeed').classList.toggle('on', name==='seed');
    const label={quar:'봉쇄 도구 선택 — 도시 셀을 클릭하세요',cure:'치료 도구 선택 — 감염 도시를 클릭하세요',seed:'전파 도구 선택 — 도시에 역병을 투입합니다'};
    $('st-event').textContent=label[name];
  }
  $('btnQuar').onclick=()=>setTool('quar');
  $('btnCure').onclick=()=>setTool('cure');
  $('btnSeed').onclick=()=>setTool('seed');

  $('btnPlay').onclick=()=>{
    paused=!paused;
    $('btnPlay').querySelector('.ic').textContent = paused?'▶':'⏸';
    $('btnPlay').querySelector('span:last-child').textContent = paused?'재생':'일시정지';
    $('st-mode').textContent = paused?'일시정지':'계산 중';
    restartTimer();
  };
  $('btnSpeed').onclick=()=>{
    speedIdx=(speedIdx+1)%speeds.length;
    $('spdlbl').textContent='속도 ×'+speeds[speedIdx];
    restartTimer();
  };
  $('btnVax').onclick=()=>{
    // 전역 백신: 감염되지 않은 도시 절반 즉시 면역화
    let n=0;
    for(let i=0;i<N;i++){ const c=cells[i];
      if(c.st==='city' && c.health==='ok' && Math.random()<0.5){ c.health='imm'; c.immT=140; paint(i); n++; }
    }
    toast(`백신 배포 — ${n}개 도시 즉시 면역화`);
    logEvent(`전 세계 백신 접종으로 ${n}개 도시가 면역을 얻었습니다.`, `=VACCINATE(전역, ${n}곳)`, 'cure');
    updateSide();
  };
  $('btnReset').onclick=()=>{
    fullReset();
    toast('새 세계 — 새로운 역병의 시대가 시작됩니다.', true);
  };

  /* ---------- 타이머 ---------- */
  function restartTimer(){
    if(timer) clearInterval(timer);
    if(paused) return;
    const interval = 130 / speeds[speedIdx];
    timer=setInterval(step, interval);
  }

  /* ---------- 탭 클릭 ---------- */
  document.querySelectorAll('#tabs .tab').forEach(t=>{
    t.onclick=()=>showSheet(t.dataset.sheet);
  });

  /* ---------- 전체 리셋 ---------- */
  let mapFormula='';
  function fullReset(){
    STRAINS.length=0;
    chron.length=0; obituaries.length=0;
    year=1; tick=0; totalDead=0; peakInfected=0;
    selected=-1;
    buildWorld();
    for(let i=0;i<N;i++) paint(i);
    // 초기 역병 2~3곳
    const seeds = 2 + (Math.random()<0.5?1:0);
    for(let k=0;k<seeds;k++) spawnPlague(null,null);
    mapFormula = `=SIM.PLAGUE($A$1:$${colName(COLS-1)}$${ROWS}, "역병의 시대", 시작균주=${STRAINS.length})`;
    fmla.innerHTML=mapFormula;
    namebox.textContent='A1';
    lastEventMsg=`서기 1년: ${STRAINS.length}개의 역병이 세계에 풀려났습니다.`;
    $('st-event').textContent=lastEventMsg;
    chron.unshift({yr:1, msg:`${STRAINS.length}개의 역병 균주가 세계에 출현했습니다.`, cls:''});
    updateSide();
    document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('on', t.dataset.sheet==='map'));
    showSheet('map');
    updateHUD([...Array(N).keys()].filter(i=>cells[i].st==='city'&&cells[i].health==='inf').length);
  }

  /* ---------- 초기화 ---------- */
  function init(){
    buildGrid();
    fullReset();
    setTool('quar');
    restartTimer();
    // 범례
    $('legend').innerHTML =
      `<b>범례</b> &nbsp;`+
      `<span class="lc" style="background:rgba(20,124,65,.4)"></span>건강 `+
      `<span class="lc" style="background:hsla(282,62%,52%,.85)"></span><b>疫</b>감염 `+
      `<span class="lc" style="background:#dff0e6"></span>免면역 `+
      `<span class="lc" style="background:#e9e9e9"></span>墟폐허 `+
      `<span class="lc" style="background:#dcebf7"></span>≈바다`;
  }

  /* 리사이즈: 그리드 재구성 (상태는 새 세계로 — 단순함 우선) */
  let rzT;
  addEventListener('resize', ()=>{
    clearTimeout(rzT);
    rzT=setTimeout(()=>{
      const d=dims();
      if(d.COLS!==COLS || d.ROWS!==ROWS){
        ({CW,CH,COLS,ROWS}=d); N=COLS*ROWS;
        cells.length=0; cellEls.length=0;
        buildGrid(); fullReset();
      }
    }, 250);
  });

  init();
})();
</script>
</body>
</html>
