<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>삼각주_연대기.xlsx - Excel</title>
<style>
  :root{
    --grid-line:#d7dbd9; --hd-bg:#f3f5f4; --excel-green:#107c41; --excel-green-d:#0b5d31;
    --water:#cfe3f2; --water-deep:#a9cbe8; --silt:#f3ead4; --reed:#dce8d2; --sea:#bcd6ec;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#dfe1e0;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;
    font-size:12px;color:#222;user-select:none;-webkit-tap-highlight-color:transparent}
  #app{display:flex;flex-direction:column;height:100%}

  /* ===== 타이틀바 ===== */
  #titlebar{height:30px;background:linear-gradient(#fbfbfb,#f0f1f0);display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #d9dcdb;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%}
  #title-name{margin-left:10px;color:#3d3d3d;font-size:12px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #title-name b{color:var(--excel-green-d);font-weight:600}
  #autosave{margin-left:auto;display:flex;align-items:center;gap:6px;color:#6a6a6a;font-size:11px}
  #autosave .toggle{width:26px;height:13px;border-radius:8px;background:var(--excel-green);position:relative}
  #autosave .toggle::after{content:"";position:absolute;right:1px;top:1px;width:11px;height:11px;border-radius:50%;background:#fff}

  /* ===== 리본 메뉴 ===== */
  #menubar{height:27px;background:#fff;display:flex;align-items:flex-end;
    padding:0 6px;border-bottom:1px solid #e7e9e8;font-size:12px;color:#444;flex:0 0 auto;overflow:hidden}
  #menubar span{padding:5px 9px;border-radius:3px 3px 0 0;white-space:nowrap;cursor:default}
  #menubar span.on{color:var(--excel-green);border-bottom:2.5px solid var(--excel-green);font-weight:600}
  #menubar span:hover{background:#f3f3f3}

  /* ===== 리본 툴바 ===== */
  #ribbon{height:62px;background:#f9faf9;border-bottom:1px solid #e1e3e2;display:flex;align-items:stretch;
    padding:5px 4px;gap:0;flex:0 0 auto;overflow:hidden}
  .rgroup{display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:2px 8px;border-right:1px solid #e6e8e7;min-width:54px}
  .rgroup .rtitle{font-size:10px;color:#8a8d8b;margin-top:2px}
  .rgroup .rrow{display:flex;gap:3px;align-items:flex-start}
  .rbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 6px;border-radius:4px;
    cursor:pointer;color:#3a3a3a;min-width:42px}
  .rbtn:hover{background:#e8efe9;outline:1px solid #cfe0d4}
  .rbtn:active{background:#d9e8de}
  .rbtn .ic{font-size:17px;line-height:1}
  .rbtn .lb{font-size:10px;line-height:1.1;text-align:center}
  .rbtn.armed{background:#dff0e6;outline:1.5px solid var(--excel-green);color:var(--excel-green-d)}
  .rbtn.disabled{opacity:.38;pointer-events:none}
  .rbig .ic{font-size:21px}

  /* ===== 수식바 ===== */
  #fbar{height:25px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d6d5;font-size:12px;flex:0 0 auto}
  #namebox{width:78px;height:100%;border-right:1px solid #d4d6d5;display:flex;
    align-items:center;justify-content:center;color:#333;font-weight:600;letter-spacing:.3px}
  #fx{width:34px;text-align:center;color:#9a9a9a;font-style:italic;font-family:"Cambria",Georgia,serif;
    border-right:1px solid #ececec}
  #formula{flex:1;padding:0 10px;font-family:"Cascadia Code",Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #formula .fn{color:#7b1fa2;font-weight:600}
  #formula .str{color:#0b7d3c}
  #formula .ref{color:#1565c0}
  #formula .num{color:#b35900}

  /* ===== 시트 ===== */
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1 1 auto;min-height:0}
  #sheet{display:grid;background:#fff;position:absolute;inset:0;align-content:start}
  .hd{background:var(--hd-bg);border-right:1px solid var(--grid-line);border-bottom:1px solid #c9cecc;
    display:flex;align-items:center;justify-content:center;color:#5a5f5d;font-size:11px;font-weight:500}
  .hd.corner{border-right:1px solid #c9cecc}
  .cell{border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);
    display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;
    overflow:hidden;cursor:cell;position:relative;transition:background .18s linear}
  .cell.sel{outline:2px solid var(--excel-green);outline-offset:-2px;z-index:3}
  .cell.targetable{cursor:crosshair}
  .cell.targetable:hover{outline:2px dashed var(--excel-green);outline-offset:-2px;z-index:4}
  .cell .glyph{position:relative;z-index:2;line-height:1;display:flex;align-items:center;justify-content:center;height:1em}
  /* 강 흐름 점 */
  .cell.flow::after{content:"";position:absolute;width:3px;height:3px;border-radius:50%;
    background:rgba(40,110,170,.55);animation:drift 2.2s linear infinite;z-index:1}
  @keyframes drift{0%{transform:translate(-9px,-6px);opacity:0}
    15%{opacity:.9}85%{opacity:.9}100%{transform:translate(9px,6px);opacity:0}}
  @keyframes warf{0%,100%{background:#ff5a5a}50%{background:#ffd0d0}}
  .cell.war{animation:warf .3s 3;color:#7a0000 !important;font-weight:800}
  @keyframes floodf{0%,100%{box-shadow:inset 0 0 0 0 rgba(30,120,200,.6)}
    50%{box-shadow:inset 0 0 0 9px rgba(30,120,200,.55)}}
  .cell.flooding{animation:floodf .5s 4}
  @keyframes bloom{0%{transform:scale(.2);opacity:0}60%{opacity:1}100%{transform:scale(1);opacity:1}}
  .cell.fresh .glyph{animation:bloom .5s ease-out}

  /* ===== 범례 카드 ===== */
  #legend{position:absolute;top:8px;right:10px;width:206px;background:#fffdf2;border:1px solid #ddca7e;
    box-shadow:0 4px 14px rgba(0,0,0,.18);padding:9px 11px;font-size:11px;z-index:6;line-height:1.65;
    border-radius:3px}
  #legend h4{margin:7px 0 3px;font-size:11px;color:#8a6d1f;border-bottom:1px dashed #e0d29a;padding-bottom:2px}
  #legend h4:first-child{margin-top:0}
  #legend .sw{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px;vertical-align:-1px}
  #legend .frow{display:flex;align-items:center;justify-content:space-between}
  #legend .frow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #legend .frow .terr{color:#777;font-size:10px;margin-left:6px;flex:0 0 auto}
  #legend .dead{color:#9a9a9a;font-size:10.5px}
  #legend .gold{color:#b8860b;font-weight:700}
  #legend .gloss{color:#9a8a55;font-size:10px;margin-top:1px}

  /* ===== 토스트(개입 안내) ===== */
  #toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(16,124,65,.96);
    color:#fff;padding:6px 14px;border-radius:14px;font-size:11.5px;z-index:9;box-shadow:0 3px 10px rgba(0,0,0,.25);
    opacity:0;transition:opacity .25s;pointer-events:none;max-width:84vw;text-align:center}
  #toast.show{opacity:1}

  /* ===== 상태바 ===== */
  #statusbar{height:24px;background:var(--excel-green);color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;flex:0 0 auto;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .ev{overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
  #statusbar .right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto;padding-left:10px}
  #statusbar .zoom{opacity:.9}
  #playbtn{cursor:pointer;background:rgba(255,255,255,.18);border-radius:3px;padding:1px 8px}
  #playbtn:hover{background:rgba(255,255,255,.3)}

  /* ===== 시트 탭 ===== */
  #tabs{height:26px;background:#eef0ef;display:flex;align-items:stretch;padding-left:8px;
    border-top:1px solid #d4d6d5;font-size:11.5px;flex:0 0 auto;overflow:hidden}
  #tabs .nav{display:flex;align-items:center;color:#9a9a9a;padding:0 6px;gap:3px}
  #tabs .tab{padding:0 14px;display:flex;align-items:center;border-right:1px solid #d9dbda;
    background:#e3e6e4;color:#5a5f5d;cursor:pointer;white-space:nowrap}
  #tabs .tab.on{background:#fff;color:var(--excel-green);font-weight:600;border-top:2px solid var(--excel-green);
    margin-top:-1px;height:calc(100% + 1px)}
  #tabs .tab:hover:not(.on){background:#ebeeec}
  #tabs .plus{padding:0 10px;display:flex;align-items:center;color:#9a9a9a}

  /* ===== 패널(연대기/멸망기록) — 시트 위 오버레이 ===== */
  .panel{position:absolute;inset:0;background:#fff;z-index:7;overflow:auto;display:none;padding:0}
  .panel.show{display:block}
  .panel table{border-collapse:collapse;width:100%;font-size:12px}
  .panel th,.panel td{border:1px solid var(--grid-line);padding:4px 9px;text-align:left;vertical-align:top}
  .panel th{background:var(--hd-bg);color:#5a5f5d;position:sticky;top:0;font-weight:600;z-index:1}
  .panel td.rownum{background:var(--hd-bg);color:#888;text-align:center;width:42px;font-size:11px}
  .panel td.yr{width:90px;color:#1565c0;font-family:Consolas,monospace}
  .panel td.fx{font-family:Consolas,monospace;color:#7b1fa2;width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .panel tr:hover td:not(.rownum){background:#f4f9f5}
  .panel .empty{padding:30px;color:#999;text-align:center}
  .panel .sheettitle{padding:8px 12px;font-weight:600;color:var(--excel-green-d);font-size:13px;
    border-bottom:1px solid #e7e9e8;background:#fafbfa;position:sticky;top:0;z-index:2}

  @media (max-width:520px){
    .rgroup{min-width:auto;padding:2px 5px}
    .rbtn{min-width:36px;padding:3px 4px}
    .rbtn .lb{font-size:9px}
    #ribbon{height:58px}
    #namebox{width:58px}
    #legend{width:150px;font-size:10px;top:6px;right:6px;padding:7px 8px}
    #legend .sw{width:8px;height:8px}
    #autosave{display:none}
    #statusbar{font-size:10.5px;padding:0 8px}
    #statusbar .sep{margin:0 5px}
    .panel td.fx{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <span id="title-name"><b>삼각주_연대기.xlsx</b> &nbsp;- Excel</span>
    <div id="autosave"><div class="toggle"></div>자동 저장</div>
  </div>

  <div id="menubar">
    <span>파일</span><span class="on">홈</span><span>삽입</span><span>페이지 레이아웃</span>
    <span>수식</span><span>데이터</span><span>검토</span><span>보기</span><span>도움말</span>
  </div>

  <div id="ribbon">
    <div class="rgroup">
      <div class="rrow">
        <div class="rbtn rbig" id="tool-play"><div class="ic">⏯</div><div class="lb">재생/<br>정지</div></div>
      </div>
      <div class="rtitle">시뮬레이션</div>
    </div>
    <div class="rgroup">
      <div class="rrow">
        <div class="rbtn" data-tool="found"><div class="ic" style="color:#0b7d3c">⊕</div><div class="lb">도시국<br>건설</div></div>
        <div class="rbtn" data-tool="levee"><div class="ic" style="color:#1565c0">堤</div><div class="lb">제방<br>축조</div></div>
        <div class="rbtn" data-tool="boon"><div class="ic" style="color:#b8860b">✦</div><div class="lb">풍요<br>축복</div></div>
        <div class="rbtn" data-tool="smite"><div class="ic" style="color:#7030a0">疫</div><div class="lb">역병<br>내림</div></div>
      </div>
      <div class="rtitle">신의 개입  (셀을 클릭해 적용)</div>
    </div>
    <div class="rgroup" style="border-right:none">
      <div class="rrow">
        <div class="rbtn" id="tool-seed"><div class="ic" style="color:#dc2626">⟳</div><div class="lb">새 세계<br>SEED()</div></div>
        <div class="rbtn" id="tool-speed"><div class="ic">»</div><div class="lb" id="speed-lb">속도<br>×1</div></div>
      </div>
      <div class="rtitle">파일</div>
    </div>
  </div>

  <div id="fbar">
    <div id="namebox">A1</div>
    <div id="fx">fx</div>

  <div id="sheetwrap">
    <div id="sheet"></div>
    <div id="legend"></div>
    <div id="toast"></div>
    <div class="panel" id="panel-chronicle"></div>
    <div class="panel" id="panel-obit"></div>

  <div id="tabs">
    <div class="nav">◀ ▶</div>
    <div class="tab on" data-tab="map">삼각주맵</div>

  <div id="statusbar">
    <span class="ev" id="status-ev">준비</span>
    <span class="right">
      <span id="playbtn">▶ 일시정지</span>
      <span class="sep">|</span>
      <span class="zoom">100%</span>
    </span>

<script>
(() => {
"use strict";

// ===================== 레이아웃 측정 =====================
const sheet   = document.getElementById('sheet');
const fmla    = document.getElementById('formula');
const namebox = document.getElementById('namebox');
const statusEv= document.getElementById('status-ev');
const legend  = document.getElementById('legend');
const toastEl = document.getElementById('toast');
const playBtn = document.getElementById('playbtn');

const ROWHD = 46; // 행번호 열 너비
let COLS, ROWS, N, CW, CH;

function measure(){
  const isMobile = innerWidth < 520;
  CW = isMobile ? 24 : 30;
  CH = isMobile ? 22 : 22;
  const wrap = document.getElementById('sheetwrap');
  const availW = (wrap.clientWidth  || innerWidth) - ROWHD;
  const availH = (wrap.clientHeight || 400);
  COLS = Math.max(14, Math.min(46, Math.floor(availW / CW)));
  ROWS = Math.max(14, Math.min(34, Math.floor(availH / CH)));
  N = COLS * ROWS;
}

// ===================== 좌표 / 셀 이름 =====================
function colName(n){ let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0; } return s; }
function ref(i){ return colName(i%COLS) + (Math.floor(i/COLS)+1); }
function nbrs(i){ const x=i%COLS,y=i/COLS|0,o=[]; if(x>0)o.push(i-1); if(x<COLS-1)o.push(i+1); if(y>0)o.push(i-COLS); if(y<ROWS-1)o.push(i+COLS); return o; }
function diag(i){ const x=i%COLS,y=i/COLS|0,o=[]; for(const[dx,dy]of[[1,1],[1,-1],[-1,1],[-1,-1]]){const nx=x+dx,ny=y+dy; if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS)o.push(ny*COLS+nx);} return o; }

// ===================== 수식바 문법강조 =====================
function setFormula(raw){
  let h = raw
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"([^"]*)"/g,'<span class="str">"$1"</span>')
    .replace(/\b([A-Z]{1,2}\d+)\b/g,'<span class="ref">$1</span>')
    .replace(/\b(\d+)\b/g,'<span class="num">$1</span>')
    .replace(/(=?)([A-Z][A-Z0-9_]*\.?[A-Z0-9_]*)(?=\()/g,'$1<span class="fn">$2</span>');
  fmla.innerHTML = h;
}

// ===================== 시트 DOM =====================
let cellEls = [];
function buildGrid(){
  sheet.style.gridTemplateColumns = ROWHD+'px repeat('+COLS+','+CW+'px)';
  sheet.style.gridAutoRows = CH+'px';
  sheet.innerHTML = '';
  cellEls = new Array(N);
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd corner'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){ const h=document.createElement('div'); h.className='hd'; h.textContent=colName(c); frag.appendChild(h); }
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div'); h.className='hd'; h.textContent=r+1; frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div'); d.className='cell'; const i=r*COLS+c; d.dataset.i=i;
      const g=document.createElement('span'); g.className='glyph'; d.appendChild(g);
      cellEls[i]=d; frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

// ===================== 지형: 진짜 삼각주 모양 =====================
// 강이 상단 한 점에서 발원 → 하류로 내려오며 여러 지류로 갈라져 하구(바다)로.
let cells = [];
function rand(){ return Math.random(); }

function genWorld(){
  cells = new Array(N);
  // 1) 충적/고도 노이즈 베이스
  const GW=8, GH=6, gz=[];
  for(let i=0;i<GW*GH;i++) gz[i]=rand();
  const noise=(x,y)=>{
    const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
    const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
    const a=gz[y0*GW+x0], b=gz[y0*GW+Math.min(GW-1,x0+1)];
    const c=gz[Math.min(GH-1,y0+1)*GW+x0], d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
    return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
  };
  for(let i=0;i<N;i++){
    const x=i%COLS, y=i/COLS|0;
    const v=noise(x,y);
    cells[i]={ st:'land', owner:null, level:0, levee:false, river:false,
               fertile:0, hist:[], ruinT:0, _v:v };
  }
  // 하단(남쪽)은 바다 — 하구
  const seaRows = Math.max(2, Math.round(ROWS*0.12));
  for(let i=0;i<N;i++){
    const y=i/COLS|0;
    const edge = (y >= ROWS-seaRows);
    if(edge || cells[i]._v < 0.20){ cells[i].st='water'; cells[i].sea = edge; }
  }
  // 강 줄기: 상단의 한 발원점 → 아래로 흐르며 좌우로 흔들리고, 중하류에서 분기
  carveRiver();
  // 비옥도: 강/물 주변일수록 높게 (충적토)
  for(let i=0;i<N;i++){
    if(cells[i].st==='water'){ continue; }
    let f=0.10 + (1-cells[i]._v)*0.25;
    for(const n of nbrs(i)) if(cells[n].river||cells[n].st==='water') f+=0.34;
    for(const n of diag(i)) if(cells[n].river||cells[n].st==='water') f+=0.12;
    cells[i].fertile = Math.min(1, f);
    // 강에서 먼 마른 땅 / 갈대 습지 구분
    if(cells[i].fertile > 0.55 && rand()<0.45){ cells[i].reed=true; }
    cells[i].hist=[ cells[i].sea?'바다': cells[i].st==='water'?'강물': cells[i].reed?'갈대 습지': cells[i].fertile>0.45?'기름진 충적토':'마른 땅' ];
  }
}

function carveRiver(){
  // 메인 줄기
  let x = Math.floor(COLS*(0.30+rand()*0.4));
  let y = 0;
  const branchSeeds=[];
  const flowAt=(x,y)=>{ if(x<0||x>=COLS||y<0||y>=ROWS) return; const i=y*COLS+x; const c=cells[i];
    c.st='water'; c.river=true; c.sea=false; };
  const splitY = Math.floor(ROWS*(0.5+rand()*0.15));
  while(y < ROWS){
    flowAt(x,y);
    if(rand()<0.55) flowAt(x+ (rand()<0.5?1:-1), y); // 폭 1~2
    // 분기 지점들 기록 (삼각주)
    if(y>=splitY && rand()<0.5) branchSeeds.push({x,y});
    // 다음 행으로: 좌우 흔들림, 하류로 갈수록 약간 더 흔들림
    x += (rand()<0.5?-1:1) * (rand()<0.45?1:0);
    x = Math.max(1, Math.min(COLS-2, x));
    y++;
  }
  // 지류(삼각주 갈래): 분기점에서 비스듬히 하구로
  const nbr = Math.min(branchSeeds.length, 2 + (rand()*2|0));
  for(let b=0;b<nbr;b++){
    const s = branchSeeds[(rand()*branchSeeds.length)|0]; if(!s) continue;
    let bx=s.x, by=s.y;
    const dir = (b%2===0?1:-1);
    while(by<ROWS){
      flowAt(bx,by);
      bx += (rand()<0.7?dir:0) + (rand()<0.25? (rand()<0.5?1:-1):0);
      bx = Math.max(0, Math.min(COLS-1, bx));
      by += (rand()<0.85?1:0);
      if(by===s.by) by++;
    }
  }
}

// ===================== 국가(도시국) =====================
const NAMES = ['청람 도시국','갈대 동맹','황금 하구','범람의 일족','백로 왕조','진흙벽 연합','소금배 상단','동틀녘 부족','일곱 운하국','검은 펄 씨족','구리종 교단','버드나무 회'];
const COLORS= ['#2563eb','#059669','#d97706','#dc2626','#0891b2','#7c3aed','#be185d','#ca8a04','#0d9488','#475569','#b45309','#65a30d'];
let nameIdx=0;
let factions=[];
const obituaries=[];     // {name,year,fx}
const chronicle=[];      // {year,text,fx}
let year=0;
let lastEvent='강이 흐르기 시작했습니다.';
let pop=0;
const dirty=new Set();
let selected=-1;
const plague=new Map();  // idx -> 남은 틱
const flood=new Map();   // idx -> 남은 틱

function hexA(hex,a){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return 'rgba('+r+','+g+','+b+','+a+')'; }

// 한글 받침에 따른 조사 자동 선택
function hasJong(word){ const ch=word.charCodeAt(word.length-1); if(ch<0xAC00||ch>0xD7A3) return false; return (ch-0xAC00)%28!==0; }
function josa(word, withJ, noJ){ return word + (hasJong(word)?withJ:noJ); } // 예: josa(n,'은','는')

function spawnFaction(announce, atIdx){
  if(nameIdx>=NAMES.length) nameIdx=0;
  const f={ id: factions.length?Math.max(...factions.map(x=>x.id))+1:0,
            name:NAMES[nameIdx], color:COLORS[nameIdx%COLORS.length], golden:0, size:0, arr:[], born:year };
  nameIdx++;
  const tryFound=(i)=>{ if(cells[i] && cells[i].st==='land' && cells[i].owner===null){ setCell(i,f.id,1,'개척'); factions.push(f); return true; } return false; };
  if(atIdx!=null && tryFound(atIdx)){
    if(announce) logEvent(josa(f.name,'이','가')+' '+ref(atIdx)+'에 정착했습니다.', '=FOUND("'+f.name+'", '+ref(atIdx)+')');
    return f;
  }
  // 비옥한 땅(강가) 우선으로 정착
  let best=-1, bestScore=-1;
  for(let t=0;t<400;t++){
    const i=rand()*N|0; const c=cells[i];
    if(c.st==='land' && c.owner===null){
      const score=c.fertile + rand()*0.3;
      if(score>bestScore){ bestScore=score; best=i; }
      if(bestScore>0.7) break;
    }
  }
  if(best>=0 && tryFound(best)){
    if(announce) logEvent(josa(f.name,'이','가')+' '+ref(best)+' 강가에 정착했습니다.', '=FOUND("'+f.name+'", '+ref(best)+')');
    return f;
  }
  return null;
}
function facById(id){ return factions.find(f=>f.id===id); }

function setCell(i, owner, level, label){
  const c=cells[i]; c.owner=owner; c.level=level; c.st='land'; c.reed=false;
  if(label){ c.hist.push(label); if(c.hist.length>8) c.hist.shift(); }
  dirty.add(i);
}

// 단계: 0 빈, 1 개척지, 2 논(田), 3 마을(邑), 4 도시(都), 5 대도시(京)
const LV_TXT  = ['', '·', '田', '邑', '都', '京'];
const LV_NAME = ['', '개척지', '논', '마을', '도시', '대도시'];

function paint(i, fresh){
  const c=cells[i], el=cellEls[i], g=el.firstChild;
  let bg='', tx='', col='#333', w='400';
  el.classList.remove('flow');
  if(plague.has(i)){ bg='#ead5f5'; tx='疫'; col='#7030a0'; w='700'; }
  else if(flood.has(i)){ bg='#9ec9ec'; tx='汎'; col='#0b3d6b'; w='700'; }
  else if(c.st==='water'){
    if(c.sea){ bg='var(--sea)'; tx='≈'; col='#6ea3cf'; }
    else { bg= c.river? 'var(--water-deep)':'var(--water)'; tx='~'; col='#4d8cc0'; if(c.river) el.classList.add('flow'); }
  }
  else if(c.st==='ruin'){ bg='#e8e8e8'; tx='墟'; col='#9a9a9a'; }
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){ bg=hexA(f.color, 0.14 + c.level*0.15); tx=LV_TXT[c.level]||'·'; col=f.color; w= c.level>=4?'800': c.level>=3?'600':'400'; }
    else { c.owner=null; c.level=0; }
  }
  if(!bg && c.st==='land'){
    if(c.reed){ bg='var(--reed)'; tx='葦'; col='#6f8f4a'; }
    else if(c.fertile>0.45){ bg='var(--silt)'; tx=''; }
    else { bg='#fbfbf8'; tx=''; }
  }
  if(c.levee && c.st!=='water'){ el.style.boxShadow='inset 0 0 0 1.5px rgba(21,101,192,.55)'; }
  else el.style.boxShadow='';
  el.style.background = bg; g.style.color=col; g.style.fontWeight=w; g.textContent=tx;
  if(fresh){ el.classList.remove('fresh'); void el.offsetWidth; el.classList.add('fresh'); }
}
function paintAll(){ for(let i=0;i<N;i++) paint(i); }

// ===================== 로그 =====================
function logEvent(msg, formula){
  lastEvent = '서기 '+year+'년 — '+msg;
  if(formula){ setFormula(formula); chronicle.push({year, text:msg, fx:formula}); if(chronicle.length>400) chronicle.shift(); }
}

function flashWar(i){ const el=cellEls[i]; el.classList.add('war'); setTimeout(()=>el.classList.remove('war'),900); }
function flashFlood(i){ const el=cellEls[i]; el.classList.add('flooding'); setTimeout(()=>el.classList.remove('flooding'),2000); }

// ===================== 시뮬 틱 =====================
let tickN=0, warCooldown=0;
const PW=[0,30,120,360,900,2200]; // 단계별 인구가중

function tick(){
  tickN++; year++;
  if(warCooldown>0) warCooldown--;

  // 집계 + 폐허 회복
  for(const f of factions){ f.arr.length=0; f.size=0; }
  pop=0;
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin' && --c.ruinT<=0){ c.st='land'; c.hist.push('재정착 가능'); dirty.add(i); }
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){ f.arr.push(i); f.size++; pop+=PW[c.level]||0; }
      else { c.owner=null; c.level=0; dirty.add(i); }
    }
  }

  // 멸망 판정
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      const fx='=COLLAPSE("'+f.name+'", '+year+')';
      obituaries.push({name:f.name, year, fx, lifespan: year-f.born});
      logEvent(josa(f.name,'이','가')+' 역사에서 사라졌습니다.', fx);
      factions.splice(k,1);
      refreshObit();
    }
  }

  // 범람: 강/바다 인접 미보호 셀이 가끔 잠김
  for(const [i,t] of [...flood]){
    if(rand()<0.18){
      for(const n of nbrs(i)){
        const c=cells[n];
        if(c.st==='land' && !c.levee && !flood.has(n) && rand()<0.5){ flood.set(n,4); dirty.add(n); }
      }
    }
    if(t<=1){
      flood.delete(i);
      const c=cells[i];
      if(c.owner!==null){
        // 침수 피해
        c.level=Math.max(0,c.level-2);
        if(c.level<=0){ c.owner=null; c.level=0; c.hist.push('범람에 휩쓸림'); }
        else c.hist.push('수해 복구');
      }
      c.fertile=Math.min(1,c.fertile+0.25); // 범람 뒤 비옥해짐(역설)
      dirty.add(i);
    } else flood.set(i,t-1);
  }

  // 역병
  if(plague.size){
    for(const [i,t] of [...plague]){
      if(rand()<0.15) for(const n of nbrs(i)) if(cells[n].owner!==null && !plague.has(n)){ plague.set(n,10); dirty.add(n); }
      if(rand()<0.22){
        const c=cells[i]; c.level--;
        if(c.level<=0){ c.owner=null; c.level=0; c.hist.push('역병으로 폐촌'); }
        dirty.add(i);
      }
      if(t<=1){ plague.delete(i); dirty.add(i); } else plague.set(i,t-1);
    }
    if(plague.size===0) logEvent('역병이 물러갔습니다.', '=PLAGUE.END()');
  }

  // 국가 행동
  for(const f of factions){
    if(f.golden>0) f.golden--;
    if(f.size===0) continue;

    // 확장 — 강가/비옥지 선호
    const attempts = 1 + (f.size*0.07|0);
    for(let a=0;a<attempts;a++){
      const src=f.arr[rand()*f.arr.length|0];
      if(src===undefined || cells[src].owner!==f.id) continue;
      const nb=nbrs(src);
      // 비옥/강가로 가중치
      let tgt=-1, bw=-1;
      for(const n of nb){ const tc=cells[n]; if(tc.st==='water'||flood.has(n)) continue; const wgt=(tc.fertile||0)+rand()*0.4 - (tc.owner!=null?0.3:0); if(wgt>bw){bw=wgt;tgt=n;} }
      if(tgt<0) continue;
      const tc=cells[tgt];
      if(tc.st==='ruin') continue;
      if(tc.owner===null){
        if(tc.reed){ if(rand()<0.4){ tc.reed=false; tc.hist.push('습지 개간'); setCell(tgt,f.id,1,'개척'); } }
        else setCell(tgt,f.id,1,'개척');
      } else if(tc.owner!==f.id && rand()<0.28){
        // 전쟁
        const att=1+rand()*3 + f.size*0.0018 + (f.golden?1.2:0);
        const def=tc.level+1 + rand()*3 + (tc.levee?0.8:0);
        flashWar(tgt);
        if(att>def){
          const defF=facById(tc.owner);
          if(rand()<0.25){
            cells[tgt].owner=null; cells[tgt].level=0; cells[tgt].st='ruin'; cells[tgt].ruinT=160;
            cells[tgt].hist.push('전화(戰火)로 폐허'); dirty.add(tgt);
          } else {
            setCell(tgt,f.id,Math.max(1,tc.level-1),'점령됨');
          }
          if((tc.level>=3 || warCooldown===0) && defF){
            logEvent(josa(f.name,'이','가')+' '+defF.name+'의 '+josa(LV_NAME[Math.max(1,tc.level)]||'영토','을','를')+' 함락했습니다.',
              '=WAR("'+f.name+'"→"'+defF.name+'", '+ref(tgt)+')');
            warCooldown=36;
          }
        }
      }
    }

    // 발전 — 비옥/강가일수록 빠르게
    const ups=1+(f.size*0.05|0);
    for(let u=0;u<ups;u++){
      const i=f.arr[rand()*f.arr.length|0];
      if(i===undefined || cells[i].owner!==f.id) continue;
      const c=cells[i];
      const growP = 0.05 * (f.golden?2.6:1) * (1 + (c.fertile||0));
      if(c.level<5 && rand()<growP){
        c.level++; c.hist.push(LV_NAME[c.level]); if(c.hist.length>8)c.hist.shift(); dirty.add(i);
        if(c.level===5 && warCooldown===0){
          logEvent(f.name+'이(가) '+ref(i)+'에 대도시 '+ref(i)+'京을 세웠습니다.', '=CAPITAL("'+f.name+'", '+ref(i)+')');
          warCooldown=24;
        }
      }
    }
  }

  // 무작위 사건
  const r=rand();
  if(r<0.010){ // 범람 시작 (강/바다 인접 보유지)
    const cand=[];
    for(let i=0;i<N;i++){ const c=cells[i]; if(c.st==='land' && !c.levee && c.owner!==null){ for(const n of nbrs(i)) if(cells[n].st==='water'){ cand.push(i); break; } } }
    if(cand.length){
      const i=cand[rand()*cand.length|0]; flood.set(i,4); dirty.add(i); flashFlood(i);
      logEvent('강이 범람하여 '+ref(i)+' 일대가 잠겼습니다.', '=FLOOD('+ref(i)+', "우기")');
    }
  } else if(r<0.014 && !plague.size){
    const big=[]; for(let i=0;i<N;i++) if(cells[i].owner!==null && cells[i].level>=3) big.push(i);
    if(big.length){ const i=big[rand()*big.length|0]; plague.set(i,10); dirty.add(i); logEvent(ref(i)+'에서 역병이 창궐했습니다.', '=PLAGUE('+ref(i)+')'); }
  } else if(r<0.019 && factions.length){
    const f=factions[rand()*factions.length|0]; f.golden=80;
    logEvent(f.name+'에 교역의 황금기가 찾아왔습니다.', '=GOLDEN_AGE("'+f.name+'", 80)');
  } else if(r<0.027){ // 삼각주 성장: 하구에 토사 퇴적 → 새 땅
    const cand=[]; for(let i=0;i<N;i++){ const c=cells[i]; if(c.st==='water'&&!c.sea){ for(const n of nbrs(i)) if(cells[n].st==='land'){ cand.push(i); break; } } }
    if(cand.length && rand()<0.5){
      const i=cand[rand()*cand.length|0]; const c=cells[i];
      c.st='land'; c.river=false; c.fertile=0.85; c.hist.push('토사 퇴적으로 융기'); dirty.add(i);
    }
  }

  // 새 세력 도래 (소수일 때)
  if(factions.length<3 && rand()<0.02 && factions.length<7){
    const f=spawnFaction(false);
    if(f) logEvent('바다 건너에서 '+josa(f.name,'이','가')+' 도래했습니다.', '=MIGRATE("'+f.name+'", "교역선")');
  }

  // 그리기
  for(const i of dirty) paint(i, true);
  dirty.clear();

  renderStatus();
  if(tickN%8===0) renderLegend();
  if(tickN%8===0 && curTab!=='map') renderPanel();
}

// ===================== 렌더: 상태/범례/패널 =====================
function renderStatus(){
  statusEv.innerHTML = '준비 <span class="sep">|</span> 서기 <b>'+year+'</b>년 <span class="sep">|</span> 인구 '
    + pop.toLocaleString() + '명 <span class="sep">|</span> 도시국 '+factions.length+'곳 <span class="sep">|</span> '+lastEvent;
  document.title = '삼각주_연대기.xlsx - Excel (서기 '+year+'년)';
}
function renderLegend(){
  const sorted=[...factions].sort((a,b)=>b.size-a.size);
  let h='<h4>세력 현황</h4>';
  if(!sorted.length) h+='<div class="dead">아직 정착한 도시국이 없습니다.</div>';
  for(const f of sorted)
    h+='<div class="frow"><span class="nm"><span class="sw" style="background:'+f.color+'"></span>'+f.name
      +(f.golden?' <span class="gold">✦</span>':'')+'</span><span class="terr">'+f.size+'칸</span></div>';
  h+='<h4>지형 기호</h4>'
    +'<div><span class="sw" style="background:var(--water-deep)"></span>~ 강 &nbsp; <span class="sw" style="background:var(--sea)"></span>≈ 바다</div>'
    +'<div><span class="sw" style="background:var(--silt)"></span>충적토 &nbsp; <span class="sw" style="background:var(--reed)"></span>葦 습지</div>'
    +'<div class="gloss">田논 · 邑마을 · 都도시 · 京대도시</div>';
  if(obituaries.length){
    h+='<h4>최근 멸망</h4>';
    for(const o of obituaries.slice(-3)) h+='<div class="dead">† '+o.name+' (서기 '+o.year+'년)</div>';
  }
  legend.innerHTML=h;
}

// ===================== 셀 클릭: 역사 보기 / 신의 개입 =====================
let armedTool=null; // null | 'found' | 'levee' | 'boon' | 'smite'
sheet.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  const i=+t.dataset.i;
  if(armedTool){ applyTool(armedTool, i); return; }
  // 선택 + 역사 표시
  if(selected>=0 && cellEls[selected]) cellEls[selected].classList.remove('sel');
  selected=i; t.classList.add('sel');
  namebox.textContent=ref(i);
  const c=cells[i];
  const f=c.owner!=null?facById(c.owner):null;
  const hist=c.hist.length?c.hist:['황무지'];
  if(f){
    setFormula('=HISTORY('+ref(i)+'): "'+f.name+'" '+(LV_NAME[c.level]||'영토')+' = {'+hist.map(x=>'"'+x+'"').join('→')+'}');
  } else {
    setFormula('=HISTORY('+ref(i)+') = {'+hist.map(x=>'"'+x+'"').join(' → ')+'}');
  }
});

function applyTool(tool, i){
  const c=cells[i]; let ok=false, msg='', fx='';
  if(tool==='found'){
    if(c.st==='land' && c.owner===null){
      const f=spawnFaction(false, i);
      if(f){ ok=true; msg=josa(f.name,'을','를')+' '+ref(i)+'에 건설했습니다.'; fx='=FOUND("'+f.name+'", '+ref(i)+')'; logEvent(msg,fx); }
    } else msg='도시국은 빈 땅(육지)에만 세울 수 있습니다.';
  } else if(tool==='levee'){
    if(c.st==='land' && !c.levee){ c.levee=true; c.hist.push('제방 축조'); dirty.add(i); ok=true; msg=ref(i)+'에 제방을 쌓아 범람을 막습니다.'; fx='=LEVEE('+ref(i)+', "축조")'; logEvent(msg,fx); }
    else if(c.levee) msg='이미 제방이 있습니다.';
    else msg='제방은 육지에만 쌓을 수 있습니다.';
  } else if(tool==='boon'){
    if(c.owner!==null){ const f=facById(c.owner); if(f){ f.golden=Math.max(f.golden,80); c.fertile=1; c.hist.push('풍요의 축복'); dirty.add(i); ok=true; msg=f.name+'에 풍요의 축복을 내렸습니다.'; fx='=BLESS("'+f.name+'", '+ref(i)+')'; logEvent(msg,fx); } }
    else msg='축복은 누군가의 영토에만 내릴 수 있습니다.';
  } else if(tool==='smite'){
    if(c.owner!==null && c.level>=1){ plague.set(i,10); dirty.add(i); ok=true; msg=ref(i)+'에 역병을 내렸습니다.'; fx='=SMITE('+ref(i)+', "역병")'; logEvent(msg,fx); }
    else msg='역병은 사람이 사는 셀에만 내릴 수 있습니다.';
  }
  if(ok){ paint(i,true); toast(msg); disarm(); }
  else { toast(msg||'여기엔 적용할 수 없습니다.'); }
}

// ===================== 툴바 동작 =====================
function disarm(){ armedTool=null; document.querySelectorAll('.rbtn[data-tool]').forEach(b=>b.classList.remove('armed')); sheet.querySelectorAll('.cell.targetable').forEach(c=>c.classList.remove('targetable')); }
function arm(tool, btn){
  if(armedTool===tool){ disarm(); return; }
  disarm(); armedTool=tool; btn.classList.add('armed');
  sheet.querySelectorAll('.cell').forEach(c=>c.classList.add('targetable'));
  const hint={found:'도시국 건설: 빈 땅 셀을 클릭하세요',levee:'제방 축조: 보호할 육지 셀을 클릭하세요',boon:'풍요 축복: 축복할 영토 셀을 클릭하세요',smite:'역병 내림: 대상 셀을 클릭하세요'};
  toast(hint[tool]||'');
}
document.querySelectorAll('.rbtn[data-tool]').forEach(b=>{ b.addEventListener('click',()=>arm(b.dataset.tool,b)); });

let timer=null, running=true, speed=1;
const SPEEDS=[1,2,4], BASE=130;
function startLoop(){ if(timer) clearInterval(timer); timer=setInterval(tick, BASE/speed); }
function setRunning(on){ running=on; if(on){ startLoop(); playBtn.textContent='▶ 일시정지'; } else { if(timer)clearInterval(timer); timer=null; playBtn.textContent='⏸ 재개'; } }
document.getElementById('tool-play').addEventListener('click',()=>setRunning(!running));
playBtn.addEventListener('click',()=>setRunning(!running));
document.getElementById('tool-speed').addEventListener('click',()=>{
  speed = SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];
  document.getElementById('speed-lb').innerHTML='속도<br>×'+speed;
  if(running) startLoop();
  toast('시뮬레이션 속도 ×'+speed);
});
document.getElementById('tool-seed').addEventListener('click',()=>{ if(confirm('새 삼각주를 생성합니다. 현재 문명은 사라집니다.')) reset(); });

let toastT=null;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); if(toastT)clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),2200); }

// ===================== 초기화 / 리셋 =====================
function reset(){
  measure(); buildGrid(); genWorld();
  factions=[]; obituaries.length=0; chronicle.length=0; nameIdx=0;
  year=1; lastEvent='태초의 강이 삼각주를 빚기 시작했습니다.'; pop=0; selected=-1;
  plague.clear(); flood.clear(); dirty.clear(); disarm();
  paintAll();
  setFormula('=SIM.DELTA($A$1:$'+colName(COLS-1)+'$'+ROWS+', "강은 도시를 낳고 또 삼킨다")');
  refreshObit();
  // 강가 명당에 3개 도시국 정착
  spawnFaction(true); spawnFaction(true); spawnFaction(true);
  renderStatus(); renderLegend(); renderPanel();
}

// 리사이즈: 세계 보존하며 그리드 폭만 재계산하면 좌표가 어긋나므로, 디바운스 후 재생성
let rzT=null;
addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{
  const oc=COLS, or=ROWS; measure();
  if(oc!==COLS||or!==ROWS){ // 그리드 크기 변화 시에만 새 세계
    reset();
  }
},250); });

reset();
setRunning(true);
})();
</script>
