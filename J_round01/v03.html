<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>대초원.xlsx - Excel</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#dfdfdf;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-tap-highlight-color:transparent}
  body{display:flex;flex-direction:column;user-select:none}

  /* ---- title bar ---- */
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%}
  #title{margin-left:8px;color:#3a3a3a;font-size:12px;font-weight:600;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  #titlebar .winbtn{margin-left:auto;display:flex;gap:18px;color:#888;font-size:13px}

  /* ---- ribbon ---- */
  #menubar{height:27px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #e6e6e6;font-size:12px;color:#555;
    flex:0 0 auto;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px;cursor:default}
  #ribbon{height:74px;background:#f7f6f5;border-bottom:1px solid #d9d7d4;
    display:flex;align-items:stretch;padding:4px 6px 0;gap:0;flex:0 0 auto;overflow:hidden}
  .rgrp{display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:2px 8px 1px;border-right:1px solid #e3e1de;min-width:0}
  .rgrp .rbtns{display:flex;gap:5px;align-items:flex-start;flex:1;padding-top:2px}
  .rgrp .rlbl{font-size:10px;color:#9a9690;padding-bottom:1px}
  .rbtn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
    padding:3px 5px;border-radius:3px;color:#3c3c3c;min-width:42px;transition:background .1s}
  .rbtn:hover{background:#e7eef0}
  .rbtn:active{background:#d6e6dd}
  .rbtn .ic{font-size:18px;line-height:1}
  .rbtn .tx{font-size:10px;white-space:nowrap}
  .rbtn.green .ic{color:#107c41}
  .rbtn.red .ic{color:#c0392b}
  .rbtn.blue .ic{color:#2563eb}
  .rbtn.amber .ic{color:#c77d12}
  .rbtn.dis{opacity:.35;pointer-events:none}
  #speedwrap{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
  .spbtn{font-size:10px;padding:1px 7px;border:1px solid #cfcdc9;border-radius:3px;
    background:#fff;cursor:pointer;color:#555}
  .spbtn.on{background:#107c41;color:#fff;border-color:#107c41}
  .sprow{display:flex;gap:3px}

  /* ---- formula bar ---- */
  #fbar{height:25px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;flex:0 0 auto}
  #namebox{width:74px;min-width:74px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;font-size:11.5px;gap:4px}
  #namebox .tri{color:#aaa;font-size:8px}
  #fxmark{width:30px;text-align:center;color:#9a9a9a;font-style:italic;font-family:Georgia,serif;
    border-right:1px solid #ececec}
  #formula{flex:1;padding:0 9px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#16321f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px}

  /* ---- sheet ---- */
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1 1 auto;min-height:0}
  #sheet{display:grid;background:#fff;position:absolute;top:0;left:0}
  .hd{background:#f5f5f5;border-right:1px solid #d8d8d8;border-bottom:1px solid #d8d8d8;
    display:flex;align-items:center;justify-content:center;color:#666;font-size:10.5px;
    font-variant-numeric:tabular-nums}
  .hd.corner{background:#f0f0f0}
  .hd.active{background:#cfe6da;color:#0c5c30;font-weight:600}
  .cell{border-right:1px solid #ededed;border-bottom:1px solid #ededed;
    display:flex;align-items:center;justify-content:center;font-size:12px;
    overflow:hidden;cursor:cell;line-height:1;position:relative;transition:background .25s linear}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:3}
  .cell .sub{position:absolute;right:1px;bottom:0;font-size:7px;line-height:1;color:rgba(0,0,0,.5)}

  @keyframes raidf{0%,100%{box-shadow:inset 0 0 0 2px #b30000}50%{box-shadow:inset 0 0 0 2px #ff9b9b}}
  .cell.raid{animation:raidf .3s 3;color:#7a0000 !important;font-weight:700;z-index:2}
  @keyframes pulseHerd{0%,100%{transform:none}50%{transform:translateY(-1px)}}

  /* ---- legend / panel ---- */
  #legend{position:absolute;top:8px;right:12px;background:#fffdf2;border:1px solid #d8c66a;
    box-shadow:2px 4px 12px rgba(0,0,0,.16);padding:9px 12px 10px;font-size:11px;z-index:6;
    width:210px;line-height:1.65;border-radius:2px}
  #legend h4{margin:0 0 4px;font-size:11px;color:#7a6a1f;letter-spacing:.3px;
    display:flex;justify-content:space-between;align-items:center}
  #legend h4 .season{font-size:10px;padding:0 6px;border-radius:8px;color:#fff;font-weight:600}
  #legend .frow{display:flex;align-items:center;gap:5px;white-space:nowrap}
  #legend .sw{display:inline-block;width:9px;height:9px;border-radius:1px;flex:0 0 auto}
  #legend .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
  #legend .ct{color:#888;font-variant-numeric:tabular-nums}
  #legend .bar{height:3px;border-radius:2px;margin:1px 0 3px;background:#eee;overflow:hidden}
  #legend .bar i{display:block;height:100%}
  #legend .dead{color:#9a948a;font-size:10px}
  #legend hr{border:none;border-top:1px dashed #e0d6a8;margin:6px 0 5px}
  #legend .leg{display:flex;flex-wrap:wrap;gap:2px 9px;font-size:10px;color:#7a7468;margin-top:5px}
  #legend .leg span b{font-style:normal}

  /* ---- tabs ---- */
  #tabs{height:25px;background:#f1efed;display:flex;align-items:flex-end;padding-left:24px;
    border-top:1px solid #d4d4d4;font-size:11.5px;flex:0 0 auto;gap:1px}
  #tabs .tab{padding:3px 14px;border:1px solid #d4d4d4;border-bottom:none;
    background:#e4e2df;color:#5a5a5a;cursor:pointer;border-radius:2px 2px 0 0}
  #tabs .tab.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41;
    padding-top:2px}
  #tabs .plus{padding:3px 9px;color:#999;cursor:default}

  /* ---- status bar ---- */
  #statusbar{height:23px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11px;flex:0 0 auto;gap:0;overflow:hidden}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #statusbar .zoom{margin-left:auto;padding-left:12px}

  /* ---- chronicle / obit sheets ---- */
  #docview{position:absolute;inset:0;background:#fff;overflow:auto;display:none;padding:0}
  #docview table{border-collapse:collapse;width:100%;font-size:12px}
  #docview td,#docview th{border:1px solid #e3e3e3;padding:3px 8px;text-align:left;
    vertical-align:top}
  #docview th{background:#f5f5f5;color:#555;position:sticky;top:0;font-weight:600;z-index:1}
  #docview td.yr{width:70px;color:#888;font-variant-numeric:tabular-nums;white-space:nowrap}
  #docview td.fx{font-family:Consolas,monospace;font-size:11px;color:#16321f;white-space:nowrap;
    width:1%}
  #docview tr:nth-child(even){background:#fafbfa}
  #docview .empty{padding:24px;color:#999;text-align:center}
  #docview .dt{color:#b00}

  /* tip */
  #tip{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
    background:rgba(20,40,28,.92);color:#dfeee6;padding:7px 16px;border-radius:14px;
    font-size:11.5px;z-index:9;pointer-events:none;opacity:0;transition:opacity .4s;
    box-shadow:0 3px 14px rgba(0,0,0,.25)}
  #tip.show{opacity:1}

  /* mobile */
  @media (max-width:560px){
    #ribbon{height:64px}
    .rbtn{min-width:36px;padding:2px 3px}
    .rbtn .ic{font-size:16px}
    #legend{width:150px;font-size:10px;top:6px;right:6px;padding:7px 8px}
    #legend .leg{display:none}
    .rgrp{padding:2px 5px}
    #menubar{gap:11px}
    #statusbar .hideM{display:none}
  }
</style>
</head>

<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>

  <div id="title">대초원.xlsx - Excel</div>
  <div class="winbtn"><span>—</span><span>▢</span><span>✕</span></div>
</div>

<div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>그리기</i><i>수식</i><i>데이터</i><i>유목</i><i>보기</i><i>도움말</i></div>

<div id="ribbon">
  <div class="rgrp">
    <div class="rbtns">
      <div class="rbtn green" id="btn-spawn"><div class="ic">⛺</div><div class="tx">부족 소환</div></div>
      <div class="rbtn blue" id="btn-rain"><div class="ic">☂</div><div class="tx">단비</div></div>
    </div>
    <div class="rlbl">개입</div>
  </div>
  <div class="rgrp">
    <div class="rbtns">
      <div class="rbtn red" id="btn-drought"><div class="ic">☀</div><div class="tx">가뭄</div></div>
      <div class="rbtn red" id="btn-blizzard"><div class="ic">❄</div><div class="tx">눈보라</div></div>
      <div class="rbtn amber" id="btn-khural"><div class="ic">♚</div><div class="tx">대쿠릴타이</div></div>
    </div>
    <div class="rlbl">천재지변 · 사건</div>
  </div>
  <div class="rgrp" style="flex:1;align-items:flex-start;border-right:none">
    <div class="rbtns">
      <div id="speedwrap">
        <div class="sprow">
          <div class="spbtn" data-sp="0">⏸ 정지</div>
          <div class="spbtn on" data-sp="1">▶ 보통</div>
          <div class="spbtn" data-sp="3">▶▶ 빠름</div>
        </div>

<div id="fbar">
  <div id="namebox"><span id="nb">A1</span><span class="tri">▾</span></div>

</div>

<div id="sheetwrap">
  <div id="sheet"></div>
  <div id="docview"></div>
  <div id="legend"></div>

</div>

<div id="tabs">
  <div class="tab on" data-view="grid">초원</div>
  <div class="tab" data-view="chron">연대기</div>
  <div class="tab" data-view="obit" id="tab-dead">멸망기록 (0)</div>
  <div class="plus">＋</div>
</div>

<div id="statusbar"></div>

<script>
(() => {
"use strict";
const CW0 = 30, CH0 = 26;

/* ---------- layout ---------- */
let COLS, ROWS, N, CW, CH;
const sheet   = document.getElementById('sheet');
const sheetwrap = document.getElementById('sheetwrap');
const docview = document.getElementById('docview');
const fmla    = document.getElementById('formula');
const nb      = document.getElementById('nb');
const statusbar = document.getElementById('statusbar');
const legend  = document.getElementById('legend');
const tipEl   = document.getElementById('tip');
const titleEl = document.getElementById('title');

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(Math.floor(i/COLS)+1);}

/* ---------- model ---------- */
// terrain grass level 0..5  (0 = dust/사막, 5 = lush). water & mountain fixed.
let cells=[];          // {st:'grass'|'water'|'mtn'|'dust', grass, owner, kind, level, hist, frozen}
let cellEls=[];
let factions=[];
const obituaries=[];   // {name, year, reason}
const chronicle=[];    // {year, msg, fx, cls}
let year=0, lastEvent='태초의 초원, 바람만이 분다.', popHerds=0;
let nameIdx=0, selected=-1, currentView='grid';
const dirty=new Set();
let speed=1, tickTimer=null;

// season cycle
const SEASONS=[
  {n:'봄', c:'#3fa34d', grow:0.85, msg:'풀이 돋아난다'},
  {n:'여름',c:'#2f9e44', grow:1.0,  msg:'초원이 무성하다'},
  {n:'가을',c:'#c77d12', grow:0.4,  msg:'풀이 마르기 시작한다'},
  {n:'겨울',c:'#5c7d8a', grow:0.05, msg:'혹한이 초원을 덮는다'}
];
let seasonIdx=0;
function season(){return SEASONS[seasonIdx];}

const NAMES=['푸른 늑대 부족','금빛 매 칸국','검은 말 씨족','흰 양 유목민','붉은 활 부족',
  '강철 등자 칸국','하늘 사슴 씨족','서리 매 부족','아홉 강 연맹','마른 풀 무리','구릉 호랑이 부족','북풍 칸국'];
const COLORS=['#2563eb','#d4a017','#3b3b3b','#0891b2','#c0392b',
  '#6d28d9','#0d9488','#7c8aa0','#15803d','#a16207','#b45309','#475569'];

function hexA(h,a){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}
function rnd(a){return Math.random()*a|0;}
function pick(a){return a[Math.random()*a.length|0];}

/* ---------- terrain gen (value noise) ---------- */
function genTerrain(){
  const GW=8,GH=6,gz=[],gm=[];
  for(let i=0;i<GW*GH;i++){gz[i]=Math.random();gm[i]=Math.random();}
  const samp=(arr,x,y)=>{
    const fx=x/COLS*(GW-1),fy=y/ROWS*(GH-1),x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
    const X1=Math.min(GW-1,x0+1),Y1=Math.min(GH-1,y0+1);
    const a=arr[y0*GW+x0],b=arr[y0*GW+X1],c=arr[Y1*GW+x0],d=arr[Y1*GW+X1];
    return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
  };
  cells=new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS,y=i/COLS|0;
    const e=samp(gz,x,y)+(Math.random()-.5)*.12;
    const m=samp(gm,x,y);
    let st,grass=0,hist;
    if(e<0.26){st='water';hist=['호수'];}
    else if(e>0.78 && m>0.5){st='mtn';hist=['산'];}
    else{st='grass';grass=1+Math.round(m*4);hist=['초원'];}
    cells[i]={st,grass,owner:null,kind:0,level:0,hist,frozen:0};
  }
}

function nbrs(i){const x=i%COLS,y=i/COLS|0,o=[];
  if(x>0)o.push(i-1);if(x<COLS-1)o.push(i+1);if(y>0)o.push(i-COLS);if(y<ROWS-1)o.push(i+COLS);return o;}

/* ---------- factions ---------- */
function spawnFaction(announce,fromEdge){
  const f={id:factions.length?Math.max(...factions.map(x=>x.id))+1:0,
    name:NAMES[nameIdx%NAMES.length], color:COLORS[nameIdx%COLORS.length],
    arr:[], size:0, herds:0, gold:0, khan:false};
  nameIdx++;
  for(let t=0;t<400;t++){
    let i;
    if(fromEdge){const edge=[];for(let k=0;k<N;k++){const x=k%COLS,y=k/COLS|0;if(x===0||y===0||x===COLS-1||y===ROWS-1)edge.push(k);}i=pick(edge);}
    else i=rnd(N);
    const c=cells[i];
    if(c.st==='grass'&&c.owner===null&&c.grass>=2){
      claim(i,f.id,1,1,'야영지');           // kind 1 = herd camp (包)
      factions.push(f);
      if(announce)logEvent(`${f.name}이(가) 초원에 나타났다.`,`=SPAWN("${f.name}", ${ref(i)})`,'spawn');
      return f;
    }
  }
  return null;
}
function facById(id){for(const f of factions)if(f.id===id)return f;return null;}

// kind: 1=유목 야영지(包/herd), 2=정착촌(邑), 3=오르도 본영(都)
const KIND_TX=['','','',''];                  // glyph chosen dynamically
function claim(i,owner,kind,level,label){
  const c=cells[i];
  c.owner=owner;c.kind=kind;c.level=level;c.st='grass';
  if(label){c.hist.push(label);if(c.hist.length>8)c.hist.shift();}
  dirty.add(i);
}

/* glyphs */
function glyph(c){
  if(c.frozen>0)return '❄';
  if(c.st==='water')return '≈';
  if(c.st==='mtn')return '⛰';
  if(c.owner===null){                  // empty grass — show grass density / dust
    if(c.st==='dust'||c.grass<=0)return '·';
    return c.grass>=4?'艸':c.grass>=2?'草':'•';
  }
  // owned
  if(c.kind>=3)return '⛯';             // orda capital
  if(c.kind===2)return '邑';           // settled town
  // herd camp — animal depends on grass
  return c.grass>=3?'馬':'羊';
}

function paint(i){
  const c=cells[i],el=cellEls[i];
  let bg='',col='#3a3a3a',w='',sub='';
  if(c.frozen>0){bg='#dfe9ee';col='#5c7d8a';}
  else if(c.st==='water'){bg='#dcebf8';col='#a7c7e7';}
  else if(c.st==='mtn'){bg='#efece6';col='#9a8f7e';}
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){bg=hexA(f.color,.12+c.level*.14);col=f.color;w=c.kind>=3?'700':c.kind===2?'600':'';
      if(c.grass<=1)sub='✸';}            // famine warning marker on owned starving tile
  }else{
    // unowned grass: green tint by density, brown when dust
    if(c.st==='dust'||c.grass<=0){bg='#efe8da';col='#c2b48f';}
    else{const g=c.grass; bg=hexA('#3fa34d',0.05+g*0.05); col='#6f8f5f';}
  }
  el.style.background=bg;el.style.color=col;el.style.fontWeight=w;
  el.firstChild.nodeValue=glyph(c);
  el.lastChild.textContent=sub;
}

/* ---------- logging ---------- */
function logEvent(msg,fx,cls){
  year=year; // noop keep
  lastEvent=`${seasonLabel()} · ${msg}`;
  if(fx)fmla.textContent=fx;
  chronicle.push({year:yearLabel(),msg,fx:fx||'',cls:cls||''});
  if(chronicle.length>500)chronicle.shift();
  if(currentView==='chron')renderDoc();
}
function flashRaid(i){const el=cellEls[i];el.classList.add('raid');setTimeout(()=>el.classList.remove('raid'),900);}

/* year display: each tick a season; 4 ticks-of-season = 1 year */
function yearLabel(){return `유목력 ${Math.floor(year/4)+1}년`;}
function seasonLabel(){return `${yearLabel()} ${season().n}`;}

/* ---------- the tick ---------- */
let tickN=0, raidCooldown=0;
function tick(){
  tickN++; year++;
  seasonIdx=(seasonIdx+1)%4;
  const S=season();
  if(raidCooldown>0)raidCooldown--;

  // grass regrowth / seasonal die-back (unowned + owned)
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.frozen>0){if(--c.frozen<=0){c.st='grass';dirty.add(i);} else continue;}
    if(c.st!=='grass'&&c.st!=='dust')continue;
    // regrow
    if(Math.random()<S.grow*0.5){
      if(c.st==='dust'&&c.grass<1){c.st='grass';c.grass=1;dirty.add(i);}
      else if(c.grass<5){c.grass++;dirty.add(i);}
    }
    // winter die-back on exposed grass
    if(seasonIdx===3&&c.grass>0&&Math.random()<0.18){c.grass--;if(c.grass<=0){c.st='dust';}dirty.add(i);}
  }

  // recount
  for(const f of factions){f.arr.length=0;f.size=0;f.herds=0;f.power=0;}
  popHerds=0;
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){f.arr.push(i);f.size++;f.power+=c.level*(c.kind>=2?3:1);
        const h=c.kind>=2?c.level*2:c.level; f.herds+=h; popHerds+=h;}
      else{c.owner=null;c.kind=0;c.level=0;dirty.add(i);}
    }
  }

  // collapse
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      const reason = f._lastCause||'풀과 물을 잃고 흩어졌다';
      obituaries.push({name:f.name,year:yearLabel(),reason});
      logEvent(`${f.name}이(가) 역사에서 사라졌다 — ${reason}.`,`=COLLAPSE("${f.name}", ${yearLabel()})`,'death');
      factions.splice(k,1);
      document.getElementById('tab-dead').textContent=`멸망기록 (${obituaries.length})`;
    }
  }

  // faction behaviour
  for(const f of factions){
    if(f.gold>0)f.gold--;
    if(f.size===0)continue;

    // ---- grazing depletes the tile; herds must move ----
    for(const i of f.arr){
      const c=cells[i];
      if(c.kind===1){                       // mobile herd camp grazes hard
        if(Math.random()<0.5&&c.grass>0){c.grass--;if(c.grass<=0)c.st='dust';dirty.add(i);}
      }else{                                // settled tiles graze gently
        if(Math.random()<0.12&&c.grass>1){c.grass--;dirty.add(i);}
      }
    }

    // ---- migration: herds on barren ground move to greener neighbour ----
    const movers=[];
    for(const i of f.arr){
      const c=cells[i];
      if(c.kind===1&&c.grass<=1)movers.push(i);
    }
    for(const i of movers){
      const c=cells[i];
      const opts=nbrs(i).filter(n=>{const t=cells[n];return t.st!=='water'&&t.st!=='mtn'&&t.frozen<=0&&t.grass>c.grass&&t.owner!==f.id;});
      if(opts.length){
        const tgt=opts.reduce((a,b)=>cells[b].grass>cells[a].grass?b:a);
        const tc=cells[tgt];
        if(tc.owner===null){
          claim(tgt,f.id,1,c.level,'이동');     // move herd
          c.owner=null;c.kind=0;c.level=0;c.hist.push('떠난 자리');if(c.hist.length>8)c.hist.shift();dirty.add(i);
        }
      }
      // if no greener empty tile & starving, the camp may perish
      else if(c.grass<=0&&Math.random()<0.4){
        c.owner=null;c.kind=0;c.level=0;c.hist.push('굶주려 흩어짐');if(c.hist.length>8)c.hist.shift();
        f._lastCause='가뭄과 기근';dirty.add(i);
      }
    }

    // ---- expansion (seek grass) ----
    const att=1+(f.size*0.08|0)+(f.gold?2:0);
    for(let a=0;a<att;a++){
      const src=pick(f.arr);
      if(src===undefined||cells[src].owner!==f.id)continue;
      const tgt=pick(nbrs(src));if(tgt===undefined)continue;
      const tc=cells[tgt];
      if(tc.st==='water'||tc.st==='mtn'||tc.frozen>0)continue;
      if(tc.owner===null){
        if(tc.grass>=1)claim(tgt,f.id,1,1,'새 목초지');
      }else if(tc.owner!==f.id&&Math.random()<0.34){
        // ---- raid ----
        const defF=facById(tc.owner);
        const attP=1+Math.random()*3+f.power*0.01+(f.gold?2:0)+(f.khan?1.5:0);
        const defP=tc.level+(tc.kind>=2?2:0)+1+Math.random()*3;
        flashRaid(tgt);
        if(attP>defP){
          if(tc.kind>=2&&Math.random()<0.45){
            // sack a town -> ashes -> dust
            tc.owner=null;tc.kind=0;tc.level=0;tc.st='dust';tc.grass=0;
            tc.hist.push('약탈·방화');if(tc.hist.length>8)tc.hist.shift();
            if(defF)defF._lastCause=`${f.name}의 약탈`;
            dirty.add(tgt);
          }else{
            claim(tgt,f.id,1,Math.max(1,tc.level-1),'점령됨');
          }
          if((tc.kind>=2||raidCooldown===0)&&defF){
            logEvent(`${f.name}이(가) ${defF.name}의 ${tc.kind>=3?'본영':tc.kind===2?'정착촌':'야영지'}을(를) 급습했다.`,
              `=RAID("${f.name}"→"${defF.name}", ${ref(tgt)})`,'war');
            raidCooldown=22;
          }
        }
      }
    }

    // ---- development: herd camps settle, towns grow ----
    const ups=1+(f.size*0.05|0);
    for(let u=0;u<ups;u++){
      const i=pick(f.arr);if(i===undefined||cells[i].owner!==f.id)continue;
      const c=cells[i];
      if(c.grass>=3&&Math.random()<0.035*(f.gold?3:1)){
        if(c.kind===1&&c.level>=2){c.kind=2;c.hist.push('정착(邑)');dirty.add(i);
          if(raidCooldown===0){logEvent(`${f.name}이(가) ${ref(i)}에 정착촌을 세웠다.`,`=SETTLE("${f.name}", ${ref(i)})`,'grow');raidCooldown=14;}}
        else if(c.level<4){c.level++;c.hist.push(['','','목영','부락','오르도'][c.level]||'성장');dirty.add(i);
          if(c.kind===2&&c.level>=4){c.kind=3;c.hist.push('본영(오르도)');
            if(raidCooldown===0){logEvent(`${f.name}의 본영이 ${ref(i)}에 들어섰다.`,`=ORDA("${f.name}", ${ref(i)})`,'capital');raidCooldown=14;}}
        }
        if(c.hist.length>8)c.hist.shift();
      }
    }
    if(f.khan&&Math.random()<0.02)f.khan=false; // khan title fades
  }

  // ---- random world events ----
  const r=Math.random();
  if(seasonIdx===3&&r<0.03){ blizzard(false); }            // winter blizzards
  else if(seasonIdx===2&&r<0.018){ drought(false); }       // autumn droughts
  else if(r>0.994&&factions.length){
    const f=pick(factions);f.gold=70;
    logEvent(`${f.name}에 풍요의 해가 찾아왔다.`,`=ABUNDANCE("${f.name}", 70)`,'gold');
  }
  // newcomers from the edge of the world
  if(factions.length<3&&Math.random()<0.02&&factions.length<7){
    const f=spawnFaction(false,true);
    if(f)logEvent(`지평선 너머에서 ${f.name}이(가) 이주해왔다.`,`=MIGRATE("${f.name}")`,'spawn');
  }

  // ---- render ----
  for(const i of dirty)paint(i);
  dirty.clear();

  renderStatus();
  if(tickN%4===0)renderLegend();
  if(tickN%4===0)titleEl.textContent=`대초원.xlsx - Excel  [${seasonLabel()}]`;
}

/* ---------- world events as functions (also wired to buttons) ---------- */
function drought(user){
  let hit=0;
  for(let i=0;i<N;i++){const c=cells[i];
    if((c.st==='grass'||c.dust)&&Math.random()<0.45){
      c.grass=Math.max(0,c.grass-2);if(c.grass<=0)c.st='dust';dirty.add(i);hit++;}}
  for(const i of dirty)paint(i);dirty.clear();
  logEvent(`대가뭄이 초원을 태웠다 (${hit}칸이 메말랐다).`,`=DROUGHT($A$1:$${colName(COLS-1)}$${ROWS})`,'death');
  if(user)toast('☀ 가뭄: 초원이 메마른다. 부족들이 물을 찾아 떠난다.');
}
function rain(){
  let hit=0;
  for(let i=0;i<N;i++){const c=cells[i];
    if((c.st==='grass'||c.st==='dust')&&Math.random()<0.6){
      if(c.st==='dust'){c.st='grass';c.grass=1;}else c.grass=Math.min(5,c.grass+2);dirty.add(i);hit++;}}
  for(const i of dirty)paint(i);dirty.clear();
  logEvent(`단비가 내려 초원이 되살아났다 (${hit}칸이 푸르러졌다).`,`=RAIN($A$1:$${colName(COLS-1)}$${ROWS})`,'gold');
  toast('☂ 단비: 풀이 다시 돋고 가축이 살찐다.');
}
function blizzard(user){
  let hit=0;
  // freeze a contiguous-ish band
  const cx=rnd(COLS),cy=rnd(ROWS);
  for(let i=0;i<N;i++){const x=i%COLS,y=i/COLS|0;
    if(Math.abs(x-cx)<=2&&Math.abs(y-cy)<=2&&cells[i].st!=='water'&&Math.random()<0.8){
      cells[i].frozen=4;dirty.add(i);hit++;
      if(cells[i].owner!==null){const c=cells[i];
        if(Math.random()<0.5){c.level=Math.max(0,c.level-1);
          if(c.level<=0&&c.kind<=1){const ff=facById(c.owner);if(ff)ff._lastCause='혹독한 겨울';c.owner=null;c.kind=0;}}}
    }}
  for(const i of dirty)paint(i);dirty.clear();
  logEvent(`눈보라가 초원을 덮쳤다 (${ref(cy*COLS+cx)} 일대 ${hit}칸 동결).`,`=BLIZZARD(${ref(cy*COLS+cx)})`,'death');
  if(user)toast('❄ 눈보라: 가축이 얼어 죽고 약한 부족이 무너진다.');
}
function khural(){
  if(factions.length<2){toast('대쿠릴타이를 열 부족이 부족하다.');return;}
  // strongest faction becomes Khan, may absorb a weak neighbour
  let strong=factions[0];for(const f of factions)if(f.power>strong.power)strong=f;
  strong.khan=true;strong.gold=Math.max(strong.gold,60);
  // absorb the weakest
  let weak=null;for(const f of factions)if(f!==strong&&(!weak||f.size<weak.size))weak=f;
  let absorbed=0;
  if(weak&&weak.size<=strong.size){
    for(let i=0;i<N;i++)if(cells[i].owner===weak.id){cells[i].owner=strong.id;dirty.add(i);absorbed++;}
    weak._lastCause=`${strong.name}에 복속`;
  }
  for(const i of dirty)paint(i);dirty.clear();
  logEvent(`대쿠릴타이가 열렸다 — ${strong.name}의 칸이 대칸으로 추대되었다${absorbed?` (${weak.name} 복속)`:''}.`,
    `=KHURAL("${strong.name}")`,'capital');
  toast('♚ 대쿠릴타이: 가장 강한 부족의 칸이 대칸이 되어 약소 부족을 복속한다.');
}

/* ---------- rendering: status & legend ---------- */
function renderStatus(){
  statusbar.innerHTML =
    `준비완료<span class="sep">|</span>`+
    `<span style="color:#bdf;font-weight:600">${seasonLabel()}</span>`+
    `<span class="sep">|</span><span class="hideM">가축 ${popHerds.toLocaleString()}<span class="sep">|</span></span>`+
    `부족 ${factions.length}<span class="sep">|</span>`+
    `<span class="grow">${lastEvent}</span>`+
    `<span class="zoom">SUM · 평균 · 합계 &nbsp; — &nbsp; 100%</span>`;
}
function renderLegend(){
  const S=season();
  let h=`<h4>세력 현황 <span class="season" style="background:${S.c}">${S.n}</span></h4>`;
  if(!factions.length)h+='<div class="dead">초원에 부족이 없다.</div>';
  const sorted=[...factions].sort((a,b)=>b.size-a.size);
  const maxS=Math.max(1,...factions.map(f=>f.size));
  for(const f of sorted){
    h+=`<div class="frow"><span class="sw" style="background:${f.color}"></span>`+
       `<span class="nm">${f.name}${f.khan?' ♚':''}${f.gold?' ✦':''}</span>`+
       `<span class="ct">${f.size}칸</span></div>`+
       `<div class="bar"><i style="width:${Math.round(f.size/maxS*100)}%;background:${f.color}"></i></div>`;
  }
  if(obituaries.length){
    h+='<hr><h4 style="font-size:10px;color:#9a948a">멸망기록</h4>';
    for(const o of obituaries.slice(-3))h+=`<div class="dead">† ${o.name} (${o.year})</div>`;
  }
  h+='<div class="leg">'+
     '<span><b style="color:#6f8f5f">草艸</b> 초원</span>'+
     '<span><b style="color:#a7c7e7">≈</b> 호수</span>'+
     '<span><b style="color:#c2b48f">·</b> 메마름</span>'+
     '<span><b>羊馬</b> 유목</span>'+
     '<span><b>邑</b> 정착</span>'+
     '<span><b>⛯</b> 본영</span></div>';
  legend.innerHTML=h;
}

/* ---------- doc views (연대기 / 멸망기록) ---------- */
function renderDoc(){
  if(currentView==='chron'){
    if(!chronicle.length){docview.innerHTML='<div class="empty">아직 기록된 사건이 없다.</div>';return;}
    let rows='';
    for(const e of chronicle.slice(-200).reverse()){
      const dt=e.cls==='death'?' class="dt"':'';
      rows+=`<tr><td class="yr">${e.year}</td><td${dt}>${e.msg}</td><td class="fx">${esc(e.fx)}</td></tr>`;
    }
    docview.innerHTML=`<table><thead><tr><th>연도</th><th>사건</th><th>수식</th></tr></thead><tbody>${rows}</tbody></table>`;
  }else if(currentView==='obit'){
    if(!obituaries.length){docview.innerHTML='<div class="empty">아직 멸망한 부족이 없다.</div>';return;}
    let rows='';
    for(const o of [...obituaries].reverse())
      rows+=`<tr><td class="yr">${o.year}</td><td class="dt">† ${o.name}</td><td>${o.reason}</td></tr>`;
    docview.innerHTML=`<table><thead><tr><th>멸망 연도</th><th>부족</th><th>사유</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---------- view switching ---------- */
function setView(v){
  currentView=v;
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.view===v));
  const grid=(v==='grid');
  sheet.style.display=grid?'grid':'none';
  legend.style.display=grid?'block':'none';
  docview.style.display=grid?'none':'block';
  if(!grid)renderDoc();
}

/* ---------- interaction ---------- */
function selectCell(i){
  if(selected>=0){cellEls[selected].classList.remove('sel');
    const o=selected;document.querySelectorAll('.hd.active').forEach(h=>h.classList.remove('active'));}
  selected=i;
  cellEls[i].classList.add('sel');
  nb.textContent=ref(i);
  // highlight headers
  const x=i%COLS,y=i/COLS|0;
  const colH=sheet.children[1+x]; const rowH=sheet.children[(1+COLS)+y*(COLS+1)];
  if(colH)colH.classList.add('active');if(rowH)rowH.classList.add('active');
  const c=cells[i];
  let fx;
  if(c.owner!==null){
    const f=facById(c.owner);
    fx=`=HISTORY("${(f?f.name:'?')}", ${c.hist.map(x=>`"${x}"`).join('→')})`;
  }else if(c.st==='water')fx=`=TERRAIN("호수", ${ref(i)})`;
  else if(c.st==='mtn')fx=`=TERRAIN("산맥", ${ref(i)})`;
  else fx=`=GRASS(${ref(i)}, 풀=${c.grass}/5)`;
  fmla.textContent=fx;
}

let tipTimer=null;
function toast(msg){
  tipEl.textContent=msg;tipEl.classList.add('show');
  clearTimeout(tipTimer);tipTimer=setTimeout(()=>tipEl.classList.remove('show'),2600);
}

/* ---------- build grid DOM ---------- */
function buildGrid(){
  CW=CW0;CH=CH0;
  const availW=sheetwrap.clientWidth||innerWidth;
  const availH=sheetwrap.clientHeight||(innerHeight-200);
  COLS=Math.max(14,Math.min(46,Math.floor((availW-44)/CW)));
  ROWS=Math.max(12,Math.min(40,Math.floor((availH-CH)/CH)));
  N=COLS*ROWS;
  sheet.style.gridTemplateColumns=`44px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridTemplateRows=`${CH}px repeat(${ROWS}, ${CH}px)`;
  sheet.innerHTML='';
  cellEls=new Array(N);
  const frag=document.createDocumentFragment();
  const corner=document.createElement('div');corner.className='hd corner';corner.textContent='◢';frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd';h.textContent=colName(c);frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const rh=document.createElement('div');rh.className='hd';rh.textContent=r+1;frag.appendChild(rh);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      d.appendChild(document.createTextNode(''));        // glyph node
      const sub=document.createElement('span');sub.className='sub';d.appendChild(sub);
      cellEls[r*COLS+c]=d;frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

/* ---------- start / restart ---------- */
function startWorld(){
  buildGrid();
  genTerrain();
  factions=[];obituaries.length=0;chronicle.length=0;nameIdx=0;year=0;seasonIdx=0;selected=-1;tickN=0;
  for(let i=0;i<N;i++)paint(i);
  fmla.textContent=`=SIM.CIVILIZATION($A$1:$${colName(COLS-1)}$${ROWS}, "초원은 바람을 따라 산다")`;
  spawnFaction(true,false);spawnFaction(true,false);spawnFaction(true,false);
  renderLegend();renderStatus();
  document.getElementById('tab-dead').textContent=`멸망기록 (${obituaries.length})`;
}

function setSpeed(s){
  speed=s;
  document.querySelectorAll('.spbtn').forEach(b=>b.classList.toggle('on',+b.dataset.sp===s));
  if(tickTimer){clearInterval(tickTimer);tickTimer=null;}
  if(s>0)tickTimer=setInterval(tick, s===3?60:170);
}

/* ---------- wire events ---------- */
sheet.addEventListener('click',e=>{const t=e.target.closest('.cell');if(t)selectCell(+t.dataset.i);});
document.getElementById('btn-spawn').addEventListener('click',()=>{const f=spawnFaction(false,true);
  if(f){logEvent(`${f.name}이(가) 부름을 받아 초원에 나타났다.`,`=SPAWN("${f.name}")`,'spawn');paint(0);renderLegend();toast('⛺ 새 유목 부족이 초원에 등장했다.');}else toast('빈 초원이 없다.');});
document.getElementById('btn-rain').addEventListener('click',rain);
document.getElementById('btn-drought').addEventListener('click',()=>drought(true));
document.getElementById('btn-blizzard').addEventListener('click',()=>blizzard(true));
document.getElementById('btn-khural').addEventListener('click',khural);
document.querySelectorAll('.spbtn').forEach(b=>b.addEventListener('click',()=>setSpeed(+b.dataset.sp)));
document.querySelectorAll('#tabs .tab').forEach(t=>t.addEventListener('click',()=>setView(t.dataset.view)));

let rt=null;
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
  if(currentView==='grid'){const wasSpeed=speed;startWorld();setSpeed(wasSpeed);}
},350);});

/* go */
startWorld();
setSpeed(1);
setTimeout(()=>toast('리본의 단추로 가뭄·눈보라·대쿠릴타이를 일으켜 초원의 운명에 개입하라. 셀을 누르면 그 땅의 역사가 보인다.'),700);
})();
</script>
