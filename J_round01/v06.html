<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>극북.xlsx - Excel</title>
<style>
  :root{
    --hdbg:#f7f9fb; --grid:#dce6ef; --ice0:#eef6fc; --ribbon:#fbfdff;
    --accent:#1f6fb2; --accentd:#155a92;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#dde7ef;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;
    font-size:12px;color:#22323e;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;}
  body{display:flex;flex-direction:column;height:100%}

  /* ---- 타이틀바 ---- */
  #titlebar{height:30px;background:linear-gradient(#fdfefe,#eef4f8);display:flex;align-items:center;
    padding:0 11px;gap:7px;border-bottom:1px solid #d4e0ea;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar .ttl{margin-left:10px;color:#3b525f;font-size:12px;font-weight:600;
    display:flex;align-items:center;gap:6px}
  #titlebar .ttl .xi{width:15px;height:15px;background:var(--accent);border-radius:2px;
    display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:9px;
    font-weight:700;font-family:Georgia,serif}
  #titlebar .spacer{flex:1}
  #titlebar .winb{color:#90a4b0;font-size:13px;letter-spacing:5px}

  /* ---- 리본 메뉴 ---- */
  #menubar{height:26px;background:#fff;display:flex;align-items:flex-end;
    padding:0 8px;gap:2px;border-bottom:1px solid #e6eef4;font-size:12px;color:#4a606d;flex:0 0 auto;
    overflow-x:auto;white-space:nowrap;scrollbar-width:none}
  #menubar::-webkit-scrollbar{display:none}
  #menubar .mi{padding:5px 9px;border-radius:4px 4px 0 0;cursor:default}
  #menubar .mi.on{color:var(--accentd);border-bottom:2.5px solid var(--accent);font-weight:700;
    background:#f2f8fc}
  #menubar .mi:not(.on):hover{background:#f3f7fa}

  /* ---- 리본 본체(아이콘 버튼들) ---- */
  #ribbon{height:46px;background:var(--ribbon);border-bottom:1px solid #dce6ef;display:flex;
    align-items:center;padding:0 6px;gap:4px;flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
  #ribbon::-webkit-scrollbar{display:none}
  .rgrp{display:flex;flex-direction:column;align-items:center;padding:0 6px;border-right:1px solid #e6eef4;
    height:38px;justify-content:center;gap:2px}
  .rgrp .lbl{font-size:9.5px;color:#8aa0ac}
  .rgrp .row{display:flex;gap:3px}
  .rbtn{display:inline-flex;flex-direction:column;align-items:center;gap:1px;border:1px solid transparent;
    border-radius:5px;padding:3px 7px;cursor:pointer;background:#fff;color:#33505f;min-width:34px;
    transition:.12s}
  .rbtn:hover{background:#eaf4fb;border-color:#cfe3f0}
  .rbtn:active{background:#d6ebf8}
  .rbtn .g{font-size:14px;line-height:1}
  .rbtn .t{font-size:9px;color:#5c7484}
  .rbtn.run.live{background:#fdecec;border-color:#f3c2c2;color:#b02a2a}

  /* ---- 수식바 ---- */
  #fbar{min-height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4e0ea;font-size:12px;flex:0 0 auto}
  #namebox{width:78px;min-width:78px;height:26px;border-right:1px solid #d4e0ea;display:flex;
    align-items:center;justify-content:center;color:#33505f;font-weight:600;gap:4px}
  #namebox .car{color:#9bb0bc;font-size:9px}
  #fxlbl{width:32px;min-width:32px;text-align:center;color:#9bb0bc;font-style:italic;
    font-family:Georgia,serif;border-right:1px solid #eef4f8}
  #formula{flex:1;padding:0 9px;font-family:"Consolas","Menlo",monospace;font-size:11.5px;
    color:#10202b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
  #formula .fn{color:var(--accentd);font-weight:700}
  #formula .str{color:#0a7a4f}
  #formula .num{color:#b4630a}

  /* ---- 시트 영역 ---- */
  #sheetwrap{position:relative;flex:1 1 auto;overflow:hidden;background:#fff;min-height:0}
  #sheet{display:grid;background:#fff;width:100%}
  .hd{background:var(--hdbg);border-right:1px solid #cfdce7;border-bottom:1px solid #cfdce7;
    display:flex;align-items:center;justify-content:center;color:#6d8593;font-size:10.5px;font-weight:600}
  .hd.hot{background:#dceefb;color:var(--accentd)}
  .cell{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);
    display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;
    overflow:hidden;cursor:cell;position:relative;transition:background .25s}
  .cell.sel{outline:2px solid var(--accent);outline-offset:-2px;z-index:3}
  .cell.gl{box-shadow:inset 0 0 0 1px #ffe08a}

  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #d6453a}50%{box-shadow:inset 0 0 0 2px #ffb3ad}}
  .cell.war{animation:warf .3s 3}
  @keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
  .ripple{position:absolute;inset:0;border:2px solid #fff;border-radius:50%;
    pointer-events:none;animation:pulse .6s ease-out forwards}

  /* ---- 패널 (범례/현황) ---- */
  #panel{position:absolute;top:9px;right:11px;width:206px;max-width:46vw;
    background:rgba(255,255,255,.94);backdrop-filter:blur(3px);
    border:1px solid #cfe0ec;border-radius:8px;
    box-shadow:0 6px 20px rgba(31,111,178,.16);padding:9px 11px;font-size:11px;z-index:6;
    line-height:1.65}
  #panel h4{margin:2px 0 4px;font-size:10.5px;color:var(--accentd);letter-spacing:.4px;
    text-transform:uppercase;font-weight:700}
  #panel .frow{display:flex;align-items:center;gap:6px;margin:1px 0}
  #panel .sw{width:10px;height:10px;border-radius:2px;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
  #panel .frow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #panel .frow .ct{color:#7d94a1;font-size:10px}
  #panel .gold{color:#c98a00}
  #panel .dead{color:#9aabb5;font-size:10px}
  #panel .seas{margin-bottom:5px;padding:4px 7px;border-radius:5px;font-weight:700;text-align:center;
    font-size:10.5px;letter-spacing:.5px}
  #panel .hint{margin-top:6px;color:#8aa0ac;font-size:9.5px;line-height:1.5;border-top:1px dashed #d8e4ec;
    padding-top:5px}
  #legbar{margin-top:5px;display:flex;flex-wrap:wrap;gap:2px 9px;font-size:10px;color:#5c7484;
    border-top:1px dashed #d8e4ec;padding-top:5px}
  #legbar span b{font-style:normal}

  /* ---- 상태바 ---- */
  #statusbar{height:24px;min-height:24px;background:var(--accent);color:#eaf4fb;display:flex;
    align-items:center;padding:0 12px;font-size:11px;flex:0 0 auto;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .ev{flex:1;overflow:hidden;text-overflow:ellipsis;opacity:.96}
  #statusbar .zoom{opacity:.8;margin-left:8px}

  /* ---- 시트탭 ---- */
  #tabs{height:26px;min-height:26px;background:#eef4f8;display:flex;align-items:stretch;
    padding-left:6px;border-top:1px solid #d4e0ea;font-size:11px;flex:0 0 auto;gap:1px}
  #tabs .tab{padding:0 13px;display:flex;align-items:center;border:1px solid #d4e0ea;border-bottom:none;
    background:#e2ecf2;color:#5c7484;cursor:pointer;border-radius:5px 5px 0 0;margin-top:2px}
  #tabs .tab.on{background:#fff;color:var(--accentd);font-weight:700;border-top:2px solid var(--accent);
    margin-top:0}
  #tabs .add{padding:0 9px;display:flex;align-items:center;color:#9bb0bc}

  /* ---- 로그 시트 (연대기/동사기록) ---- */
  #logsheet{position:absolute;inset:0;background:#fff;display:none;flex-direction:column;z-index:4}
  #logsheet.show{display:flex}
  #logsheet .lhdr{display:grid;background:var(--hdbg);border-bottom:1px solid #cfdce7;
    font-size:10.5px;color:#6d8593;font-weight:700}
  #logsheet .lhdr div{padding:5px 9px;border-right:1px solid #cfdce7}
  #logsheet .lbody{flex:1;overflow-y:auto}
  #logsheet .lrow{display:grid;border-bottom:1px solid #eef4f8;font-size:11.5px}
  #logsheet .lrow:nth-child(even){background:#f8fbfd}
  #logsheet .lrow div{padding:4px 9px;border-right:1px solid #eef4f8;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  #logsheet .lrow .yr{color:#7d94a1;font-variant-numeric:tabular-nums}
  #logsheet .lrow .fx{font-family:Consolas,monospace;font-size:11px;color:#155a92}
  #logsheet .empty{padding:24px;text-align:center;color:#9bb0bc}
  .chron{grid-template-columns:90px 1fr 230px}
  .obit{grid-template-columns:90px 1fr 1fr}

  @media (max-width:600px){
    .rgrp .lbl{display:none}
    .rbtn .t{display:none}
    .rbtn{min-width:30px;padding:5px}
    #namebox{width:60px;min-width:60px}
    #panel{width:160px;font-size:10.5px;padding:7px 8px;top:6px;right:6px}
    #statusbar{font-size:10px;padding:0 8px}
    #statusbar .sep{margin:0 6px}
    .chron{grid-template-columns:64px 1fr}
    .chron div:nth-child(3),.obit div:nth-child(3){display:none}
    .obit{grid-template-columns:70px 1fr}
  }
</style>
</head>
<body>

<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <div class="ttl"><span class="xi">X</span><span id="docname">극북.xlsx</span> - Excel</div>
  <div class="spacer"></div>
  <div class="winb">—  ▢  ✕</div>
</div>

<div id="menubar">
  <div class="mi">파일</div>
  <div class="mi on">홈</div>
  <div class="mi">삽입</div>
  <div class="mi">수식</div>
  <div class="mi">데이터</div>
  <div class="mi">검토</div>
  <div class="mi">보기</div>
  <div class="mi">도움말</div>
</div>

<div id="ribbon">
  <div class="rgrp">
    <div class="row">
      <button class="rbtn run live" id="btnRun" title="시뮬레이션 일시정지/재개"><span class="g" id="runIcon">❚❚</span><span class="t" id="runTxt">진행중</span></button>
      <button class="rbtn" id="btnStep" title="한 해 진행"><span class="g">▶▎</span><span class="t">한 해</span></button>

  </div>
  <div class="rgrp">
    <div class="row">
      <button class="rbtn" id="btnSpawn" title="새 부족을 빈 땅에 소환"><span class="g">∆</span><span class="t">부족</span></button>
      <button class="rbtn" id="btnBerg" title="빙산을 떨궈 길을 막는다"><span class="g">◆</span><span class="t">빙산</span></button>
      <button class="rbtn" id="btnThaw" title="해빙기를 부른다"><span class="g">◐</span><span class="t">해빙</span></button>
      <button class="rbtn" id="btnBliz" title="혹한기·눈보라를 부른다"><span class="g">❄</span><span class="t">눈보라</span></button>

  </div>
  <div class="rgrp">
    <div class="row">
      <button class="rbtn" id="btnSpeed" title="진행 속도 변경"><span class="g">»</span><span class="t" id="spdTxt">1배속</span></button>
      <button class="rbtn" id="btnReset" title="세계를 다시 빚는다"><span class="g">⟳</span><span class="t">새 세계</span></button>
    </div>
    <div class="lbl">세계</div>
  </div>
</div>

<div id="fbar">
  <div id="namebox"><span id="nbtxt">A1</span><span class="car">▾</span></div>
  <div id="fxlbl">fx</div>
  <div id="formula"></div>
</div>

<div id="sheetwrap">
  <div id="sheet"></div>
  <div id="logsheet">
    <div class="lhdr" id="loghdr"></div>
    <div class="lbody" id="logbody"></div>
  </div>
  <div id="panel"></div>
</div>

<div id="tabs">
  <div class="tab on" data-sheet="map">툰드라</div>
  <div class="tab" data-sheet="chron">연대기</div>
  <div class="tab" data-sheet="obit" id="tabObit">동사기록 (0)</div>
  <div class="add">＋</div>
</div>

<div id="statusbar">
  <span id="stReady">준비</span>
  <span class="sep">|</span>
  <span class="ev" id="stEvent"></span>
  <span class="zoom" id="stZoom"></span>
</div>

<script>
(() => {
"use strict";

// ============================ 격자 크기 산정 ============================
const sheetwrap = document.getElementById('sheetwrap');
let COLS, ROWS, N, CW, CH, RH = 46; // RH: 행번호 열 너비

function computeDims(){
  const w = sheetwrap.clientWidth || innerWidth;
  const h = sheetwrap.clientHeight || (innerHeight - 200);
  CH = w < 600 ? 26 : 23;
  CW = Math.max(26, Math.floor((w - RH) / Math.max(18, Math.min(46, Math.floor((w - RH)/30)))));
  COLS = Math.max(16, Math.min(48, Math.floor((w - RH) / 30)));
  CW = Math.floor((w - RH) / COLS);
  ROWS = Math.max(12, Math.min(40, Math.floor(h / CH)));
  N = COLS * ROWS;
}

const sheet = document.getElementById('sheet');
const fmla = document.getElementById('formula');
const nbtxt = document.getElementById('nbtxt');
const stEvent = document.getElementById('stEvent');
const stReady = document.getElementById('stReady');
const stZoom = document.getElementById('stZoom');
const panel = document.getElementById('panel');

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(Math.floor(i/COLS)+1);}

// 수식 신택스 하이라이트 — 단일 패스 토큰화(치환 충돌 방지)
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fxHTML(str){
  // 문자열 → 함수명( → 숫자 순으로 한 번에 매칭, 나머지는 그대로 escape
  return str.replace(/"[^"]*"|[A-Z][A-Z.]*(?=\()|\d+/g, (m)=>{
    if(m[0]==='"') return '<span class="str">'+esc(m)+'</span>';
    if(/^\d+$/.test(m)) return '<span class="num">'+m+'</span>';
    return '<span class="fn">'+m+'</span>';
  });
}
function setFx(str){ fmla.innerHTML = fxHTML(str); }

// ============================ 세계 상태 ============================
let cells = [];        // {st, owner, level, hist[], ruinT, snow}
let cellEls = [];
let factions = [];
const obituaries = []; // {name, year, cause}
const chronicle = [];  // {year, msg, fx}
let nameIdx = 0;
let year, lastEvent, pop;
let dirty = new Set();
let selected = -1;
let blizzard, plague, fires, bergs;
let season;            // 0 해빙기, 1 풍요기, 2 결빙기, 3 혹한기
const SEASON_LEN = 70; // 한 계절 길이(틱)
let tickN, warLogCooldown;

// 부족 이름/색 — 극북 빙하 테마
const NAMES = ['이누이트 씨족','순록 유목민','오로라 부족','빙벽 일족','고래뼈 부족',
  '얼음늑대 무리','서리수염 부족','북극성 신도','흑요석 사냥꾼','눈먼 곰 부족',
  '얼어붙은 손 부족','심해 어부단','만년설 은둔자','피요르드 약탈자'];
const COLORS = ['#2f7fc6','#c0432f','#3a9d6b','#7c5cd0','#c98a2a',
  '#0e8e95','#b03f78','#5d7d2b','#8a44c2','#a85a2a',
  '#2a6e9e','#cf6b3a','#4a8fb0','#9c5a44'];

const SEASONS = [
  {name:'해빙기',  bg:'#e6f3fb', accent:'#2f8fcf', emoji:'◐', desc:'얼음이 녹는다'},
  {name:'풍요기',  bg:'#eaf6ee', accent:'#3a9d6b', emoji:'❋', desc:'먹이가 흐른다'},
  {name:'결빙기',  bg:'#eaf2f8', accent:'#5d83a0', emoji:'✶', desc:'바다가 굳는다'},
  {name:'혹한기',  bg:'#e3eaf2', accent:'#41607a', emoji:'❄', desc:'추위가 베어문다'},
];

const LV_TXT   = ['', '·', '∆', '舍', '城'];   // 0발자국, 야영(텐트형), 정착(舍), 얼음성채(城)
const LV_GLYPH = ['', '·', '천막', '오두막', '얼음성채'];
const LV_LABEL = ['', '발자국', '야영지', '정착지', '얼음성채'];

// ============================ 지형 생성 (밸류노이즈) ============================
function noiseField(gw, gh){
  const gz = [];
  for(let i=0;i<gw*gh;i++) gz[i]=Math.random();
  return (x,y)=>{
    const fx=x/COLS*(gw-1), fy=y/ROWS*(gh-1);
    const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
    const a=gz[y0*gw+x0], b=gz[y0*gw+Math.min(gw-1,x0+1)];
    const c=gz[Math.min(gh-1,y0+1)*gw+x0], d=gz[Math.min(gh-1,y0+1)*gw+Math.min(gw-1,x0+1)];
    return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
  };
}

function genWorld(){
  const land = noiseField(8,6);
  const cold = noiseField(5,4);
  cells = new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS, y=i/COLS|0;
    const v = land(x,y) + (Math.random()-.5)*.13;
    // 위도 효과: 위쪽(북)일수록 빙하/만년설이 많다 (극북 테마)
    const lat = 1 - y/ROWS;            // 0(남,아래) ~ 1(북,위)
    const c = cold(x,y);
    let st, hist;
    if(v < .34){ st='water'; hist=['검은 바다']; }            // 바다 (결빙 가능)
    else if(v > .68 && (c + lat*.5) > .75){ st='glacier'; hist=['빙하']; } // 만년 빙하 (북쪽 多)
    else if(v > .58 && Math.random() < .5){ st='snow'; hist=['설원']; }    // 눈 덮인 땅 (개간 가능)
    else { st='tundra'; hist=['툰드라']; }                                 // 거주 가능 평지
    cells[i] = { st, owner:null, level:0, hist, ruinT:0, frozen:false };
  }
}

function nbrs(i){
  const x=i%COLS,y=i/COLS|0,o=[];
  if(x>0)o.push(i-1); if(x<COLS-1)o.push(i+1);
  if(y>0)o.push(i-COLS); if(y<ROWS-1)o.push(i+COLS);
  return o;
}

function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ============================ 시트 DOM ============================
function buildSheet(){
  sheet.style.gridTemplateColumns = `${RH}px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows = CH+'px';
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd'; corner.textContent='◤'; frag.appendChild(corner);
  const colHd = [];
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd';h.textContent=colName(c);colHd.push(h);frag.appendChild(h);}
  cellEls = new Array(N);
  const rowHd = [];
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd';h.textContent=r+1;rowHd.push(h);frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d;frag.appendChild(d);
    }
  }
  sheet.innerHTML=''; sheet.appendChild(frag);
  sheet._colHd = colHd; sheet._rowHd = rowHd;
}

// ============================ 그리기 ============================
function paint(i){
  const c = cells[i], el = cellEls[i];
  if(!el) return;
  let bg='', tx='', col='#22323e', w='', glow=false;
  el.classList.remove('gl');

  if(plague.has(i)){ bg='#ead5f5'; tx='✚'; col='#7030a0'; w='700'; }
  else if(fires.has(i)){ bg='#cfeaf6'; tx='❄'; col='#1573b0'; w='700'; } // 빙하기엔 "동결" 재앙 = 얼어붙음
  else if(c.st==='glacier'){ bg='#e1eef8'; tx='▲'; col='#86b3d6'; }
  else if(c.st==='snow'){ bg='#f3f8fc'; tx='❄'; col='#aac6dd'; }
  else if(c.st==='water'){ bg = c.frozen ? '#e7eef4' : '#dbe9f5'; tx = c.frozen ? '═' : '~'; col = c.frozen ? '#9fb6c8' : '#7aa9d4'; }
  else if(c.st==='ruin'){ bg='#edf0f3'; tx='✕'; col='#a7b6c0'; }
  else if(bergs.has(i)){ bg='#dde9f4'; tx='◆'; col='#5b8db8'; w='700'; }
  else if(c.owner!==null){
    const f = byId(c.owner);
    if(f){
      bg = hexA(f.color, .12 + c.level*.17);
      tx = LV_TXT[c.level] || '·';
      col = f.color;
      w = c.level>=3 ? '700' : '';
      if(f.golden>0){ glow=true; }
    }
  }
  // 눈 쌓임(혹한기 시각화): 거주 셀 위 옅은 흰 오버레이
  if(c.owner!==null && season===3){ bg = `linear-gradient(${hexA('#ffffff',.45)},${hexA('#ffffff',.45)}), ${bg||'#fff'}`; }

  el.style.background = bg;
  el.style.color = col;
  el.style.fontWeight = w;
  el.textContent = tx;
  if(glow) el.classList.add('gl');
}

function byId(id){ for(const f of factions) if(f.id===id) return f; return null; }

// ============================ 로그 ============================
function logEvent(msg, fx){
  lastEvent = `서기 ${year}년 · ${msg}`;
  chronicle.push({year, msg, fx: fx||''});
  if(chronicle.length>400) chronicle.shift();
  if(fx) setFx(fx);
  if(curSheet==='chron') renderLog();
}

// ============================ 부족 ============================
let factionSeq = 0;
function spawnFaction(announce){
  if(nameIdx>=NAMES.length) nameIdx=0;
  const f = { id:factionSeq++, name:NAMES[nameIdx], color:COLORS[nameIdx%COLORS.length],
    golden:0, size:0, arr:[], born:year, warmth:6 };
  nameIdx++;
  for(let t=0;t<400;t++){
    const i = Math.random()*N|0;
    const c = cells[i];
    if((c.st==='tundra') && c.owner===null && !bergs.has(i)){
      setCell(i, f.id, 1, '발자국');
      factions.push(f);
      if(announce) logEvent(`${f.name}이(가) 빙원에 첫 발자국을 남겼다.`, `=SPAWN("${f.name}", ${ref(i)})`);
      return f;
    }
  }
  return null;
}

function setCell(i, owner, level, label){
  const c = cells[i];
  c.owner=owner; c.level=level; c.st='tundra';
  if(label){ c.hist.push(label); if(c.hist.length>8) c.hist.shift(); }
  dirty.add(i);
}

function flashWar(i){
  const el=cellEls[i]; if(!el) return;
  el.classList.add('war');
  setTimeout(()=>el.classList.remove('war'),1000);
}

// ============================ 틱(시뮬 한 해) ============================
function tick(){
  tickN++; year++;
  if(warLogCooldown>0) warLogCooldown--;

  // ----- 계절 전환 -----
  const newSeason = Math.floor(tickN / SEASON_LEN) % 4;
  if(newSeason !== season){
    season = newSeason;
    applySeasonVisual();
    const s = SEASONS[season];
    const fxName = ['THAW','BLOOM','FREEZE','WINTER'][season];
    logEvent(`${s.name}이(가) 도래했다 — ${s.desc}.`, `=SEASON("${s.name}", ${year})`);
    // 결빙기: 바다 일부 결빙(이동 가능 다리)
    if(season>=2){
      for(let i=0;i<N;i++){ if(cells[i].st==='water' && Math.random()<.45){ cells[i].frozen=true; dirty.add(i);} }
    } else { // 해빙기/풍요기: 바다 녹음
      for(let i=0;i<N;i++){ if(cells[i].st==='water' && cells[i].frozen){ cells[i].frozen=false; dirty.add(i);} }
    }
  }

  // 계절 변수
  const isHarsh   = season===3;            // 혹한기
  const isThaw    = season===0;            // 해빙기
  const isPlenty  = season===1;            // 풍요기
  const expandMul = isThaw?1.4 : isPlenty?1.7 : season===2?.7 : .35; // 확장 의욕
  const growMul   = isPlenty?2.2 : isThaw?1.3 : season===2?.6 : .25; // 성장
  const coldBite  = isHarsh?1 : season===2?.35 : 0;                  // 동사 압력

  // ----- 재집계 -----
  for(const f of factions){ f.arr.length=0; f.size=0; }
  pop=0;
  const PW=[0,30,120,400,1200];
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin' && --c.ruinT<=0){ c.st='tundra'; dirty.add(i); }
    if(c.owner!==null){
      const f=byId(c.owner);
      if(f){ f.arr.push(i); f.size++; pop+=PW[c.level]; }
      else { c.owner=null; c.level=0; dirty.add(i); }
    }
  }

  // ----- 혹한기 동사(凍死): 부족의 변경 셀이 추위로 사라짐 -----
  if(coldBite>0){
    for(const f of factions){
      if(f.size===0) continue;
      // 황금기/따뜻함이 높으면 저항
      const warmth = f.golden>0 ? 3 : f.warmth;
      const exposure = coldBite * (1 - Math.min(.6, warmth*.07));
      // 가장 약한(레벨 낮은) 변경 셀부터 위험
      let attempts = Math.max(1, (f.size * .04 * exposure)|0);
      for(let a=0;a<attempts;a++){
        const i = f.arr[Math.random()*f.arr.length|0];
        if(i===undefined || cells[i].owner!==f.id) continue;
        const c = cells[i];
        // 외곽(빈 이웃 많음)일수록, 레벨 낮을수록 동사
        const open = nbrs(i).filter(n=>cells[n].owner===null||cells[n].st==='water'||cells[n].st==='glacier').length;
        const risk = (open*.06 + (4-c.level)*.05) * exposure;
        if(Math.random() < risk){
          c.level--;
          if(c.level<=0){
            c.owner=null; c.level=0; c.st='snow';
            c.hist.push('동사(凍死)'); if(c.hist.length>8) c.hist.shift();
          } else { c.hist.push('혹한 피해'); if(c.hist.length>8) c.hist.shift(); }
          dirty.add(i);
        }
      }
    }
  }

  // ----- 멸망 판정 (동사기록) -----
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      const cause = SEASONS[season].name==='혹한기' ? '혹한기 동사' :
                    season===2 ? '결빙기 기근' : '쇠락';
      obituaries.push({name:f.name, year, cause});
      logEvent(`${f.name}이(가) 영원한 겨울 속으로 사라졌다.`, `=COLLAPSE("${f.name}", ${year})`);
      factions.splice(k,1);
      if(curSheet==='obit') renderLog();
      document.getElementById('tabObit').textContent = `동사기록 (${obituaries.length})`;
    }
  }

  // ----- 동결(재앙: 화재 대응물) 확산 -----
  for(const [i,t] of [...fires]){
    if(Math.random()<.13){
      for(const n of nbrs(i)){
        const c=cells[n];
        if(c.owner!==null && !fires.has(n) && c.st==='tundra'){ fires.set(n,5); dirty.add(n); }
      }
    }
    if(t<=1){
      fires.delete(i);
      const c=cells[i];
      c.owner=null;c.level=0;c.st='glacier'; // 얼어붙어 빙하가 됨
      c.hist.push('완전 동결'); if(c.hist.length>8)c.hist.shift();
      dirty.add(i);
    } else fires.set(i,t-1);
  }

  // ----- 역병 -----
  if(plague.size){
    for(const [i,t] of [...plague]){
      if(Math.random()<.15){
        for(const n of nbrs(i)){ if(cells[n].owner!==null && !plague.has(n)){ plague.set(n,10); dirty.add(n);} }
      }
      if(Math.random()<.22){
        const c=cells[i]; c.level--;
        if(c.level<=0){ c.owner=null;c.level=0; c.hist.push('역병 소멸'); if(c.hist.length>8)c.hist.shift(); }
        dirty.add(i);
      }
      if(t<=1){ plague.delete(i); dirty.add(i); } else plague.set(i,t-1);
    }
    if(plague.size===0) logEvent('역병이 얼어붙어 물러났다.', '=PLAGUE.END()');
  }

  // ----- 부족 행동 -----
  for(const f of factions){
    if(f.golden>0) f.golden--;
    if(f.size===0) continue;

    // 확장
    const attempts = Math.max(1, (1 + f.size*.07) * expandMul | 0);
    for(let a=0;a<attempts;a++){
      const src=f.arr[Math.random()*f.arr.length|0];
      if(src===undefined||cells[src].owner!==f.id) continue;
      const nb=nbrs(src);
      const tgt=nb[Math.random()*nb.length|0];
      const tc=cells[tgt];
      if(bergs.has(tgt)) continue;
      // 얼어붙은 바다는 건널 수 있다(결빙기 다리)
      if(tc.st==='water'){
        if(tc.frozen && Math.random()<.18){ setCell(tgt,f.id,1,'빙판 도하'); tc.frozen=true; cells[tgt].st='tundra'; cells[tgt].hist.push('빙판 위 야영'); dirty.add(tgt); }
        continue;
      }
      if(tc.st==='glacier'){ if(Math.random()<.06){ tc.st='tundra'; tc.hist.push('빙하 개척'); setCell(tgt,f.id,1,'발자국'); } continue; }
      if(tc.owner===null){
        if(tc.st==='snow'){ if(Math.random()<.4){ tc.st='tundra'; tc.hist.push('눈 치우기'); setCell(tgt,f.id,1,'발자국'); } }
        else if(tc.st==='tundra') setCell(tgt,f.id,1,'발자국');
      } else if(tc.owner!==f.id && Math.random()<.28){
        // 전쟁(사냥터 다툼)
        const att=1+Math.random()*3 + f.size*.002 + (f.golden?1.2:0);
        const def=tc.level+1 + Math.random()*3;
        flashWar(tgt);
        if(att>def){
          const dF=byId(tc.owner);
          if(Math.random()<.28){ fires.set(tgt,5); tc.hist.push('전화로 동결'); if(tc.hist.length>8)tc.hist.shift(); dirty.add(tgt); }
          else setCell(tgt,f.id,Math.max(1,tc.level-1),'점령');
          if((tc.level>=3||warLogCooldown===0)&&dF){
            logEvent(`${f.name}이(가) ${dF.name}의 사냥터(${ref(tgt)})를 빼앗았다.`,
              `=RAID("${f.name}"→"${dF.name}", ${ref(tgt)})`);
            warLogCooldown=38;
          }
        }
      }
    }

    // 발전
    const ups = Math.max(1, (1+f.size*.05) * growMul | 0);
    for(let u=0;u<ups;u++){
      const i=f.arr[Math.random()*f.arr.length|0];
      if(i===undefined||cells[i].owner!==f.id) continue;
      const c=cells[i];
      if(c.level<4 && Math.random()< .055*(f.golden?3:1)*growMul){
        c.level++;
        c.hist.push(LV_LABEL[c.level]); if(c.hist.length>8)c.hist.shift();
        dirty.add(i);
        if(c.level===4 && warLogCooldown===0){
          logEvent(`${f.name}이(가) ${ref(i)}에 얼음성채를 올렸다.`, `=CITADEL("${f.name}", ${ref(i)})`);
          warLogCooldown=24;
        }
      }
    }
  }

  // ----- 무작위 사건 -----
  const rr=Math.random();
  if(!plague.size && rr<.004){
    const big=[]; for(let i=0;i<N;i++) if(cells[i].owner!==null && cells[i].level>=3) big.push(i);
    if(big.length){ const i=big[Math.random()*big.length|0]; plague.set(i,10); dirty.add(i);
      logEvent(`${ref(i)}에 괴혈병이 돌기 시작했다.`, `=PLAGUE(${ref(i)})`); }
  } else if(rr>.996 && factions.length){
    const f=factions[Math.random()*factions.length|0]; f.golden=85; f.warmth=Math.min(9,f.warmth+1);
    logEvent(`${f.name}이(가) 오로라의 축복(황금기)을 받았다.`, `=AURORA("${f.name}", 85)`);
  } else if(rr>.9935 && rr<=.996){
    const towns=[]; for(let i=0;i<N;i++) if(cells[i].owner!==null && cells[i].level>=2) towns.push(i);
    if(towns.length){ const i=towns[Math.random()*towns.length|0]; fires.set(i,6); dirty.add(i);
      logEvent(`${ref(i)}에 한파 동결 재해가 덮쳤다.`, `=BLIZZARD(${ref(i)})`); }
  }
  // 이주(도래)
  if(factions.length<3 && Math.random()<.013 && factions.length<7){
    const f=spawnFaction(false);
    if(f) logEvent(`얼어붙은 바다 너머에서 ${f.name}이(가) 도래했다.`, `=MIGRATE("${f.name}")`);
  }

  // ----- 그리기 -----
  for(const i of dirty) paint(i);
  dirty.clear();
  // 혹한기 진입/이탈 시 전체 거주 셀 눈 오버레이 갱신
  if(season===3 || (tickN%SEASON_LEN===0)){ for(let i=0;i<N;i++) if(cells[i].owner!==null) paint(i); }

  renderStatus();
  if(tickN%6===0) renderPanel();
}

// ============================ 상태바 / 패널 ============================
function renderStatus(){
  const s = SEASONS[season];
  stEvent.innerHTML =
    `${s.emoji} <b>${s.name}</b>` +
    `<span class="sep">|</span>서기 ${year}년` +
    `<span class="sep">|</span>생존 인구 ${pop.toLocaleString()}` +
    `<span class="sep">|</span>부족 ${factions.length}` +
    (obituaries.length?`<span class="sep">|</span>† ${obituaries.length}`:'') +
    `<span class="sep">|</span>${lastEvent}`;
  stReady.textContent = paused ? '일시정지' : '진행중';
  document.title = `극북.xlsx - Excel (서기 ${year}년 · ${s.name})`;
}

function renderPanel(){
  const s = SEASONS[season];
  const prog = Math.round((tickN % SEASON_LEN)/SEASON_LEN*100);
  let h = `<div class="seas" style="background:${s.bg};color:${s.accent};box-shadow:inset 0 0 0 1px ${hexA(s.accent,.3)}">`+
          `${s.emoji} ${s.name} <span style="opacity:.6;font-weight:400">${prog}%</span></div>`;
  h += '<h4>부족 현황</h4>';
  const sorted = [...factions].sort((a,b)=>b.size-a.size);
  if(!sorted.length) h += `<div class="dead" style="padding:2px 0">살아남은 부족이 없다…</div>`;
  for(const f of sorted){
    h += `<div class="frow"><span class="sw" style="background:${f.color}"></span>`+
         `<span class="nm">${f.name}${f.golden?'<span class="gold"> ✦</span>':''}</span>`+
         `<span class="ct">${f.size}칸</span></div>`;
  }
  if(obituaries.length){
    h += '<h4 style="margin-top:7px">동사기록</h4>';
    for(const o of obituaries.slice(-3)) h += `<div class="dead">† ${o.name} (서기 ${o.year}년)</div>`;
  }
  h += `<div id="legbar">`+
       `<span><b style="color:#86b3d6">▲</b> 빙하</span>`+
       `<span><b style="color:#aac6dd">❄</b> 설원</span>`+
       `<span><b style="color:#7aa9d4">~</b> 바다</span>`+
       `<span><b style="color:#5b8db8">◆</b> 빙산</span>`+
       `</div>`;
  h += `<div class="hint">셀 클릭 = 그 땅의 역사 보기 · 리본 버튼으로 개입</div>`;
  panel.innerHTML = h;
}

function applySeasonVisual(){
  const s = SEASONS[season];
  document.documentElement.style.setProperty('--accent', s.accent);
  sheet.style.background = s.bg;
}

// ============================ 로그 시트 렌더 ============================
let curSheet = 'map';
const logsheet = document.getElementById('logsheet');
const loghdr = document.getElementById('loghdr');
const logbody = document.getElementById('logbody');

function renderLog(){
  if(curSheet==='chron'){
    loghdr.className='lhdr chron';
    loghdr.innerHTML = `<div>서기</div><div>사건</div><div>수식</div>`;
    if(!chronicle.length){ logbody.innerHTML=`<div class="empty">아직 기록된 역사가 없다.</div>`; return; }
    let h='';
    for(const e of chronicle.slice(-200).reverse()){
      h += `<div class="lrow chron"><div class="yr">${e.year}년</div><div>${e.msg}</div><div class="fx">${e.fx}</div></div>`;
    }
    logbody.innerHTML=h;
  } else if(curSheet==='obit'){
    loghdr.className='lhdr obit';
    loghdr.innerHTML = `<div>멸망 연도</div><div>부족</div><div>사인</div>`;
    if(!obituaries.length){ logbody.innerHTML=`<div class="empty">아직 동사한 부족이 없다. 혹한기를 견뎌라.</div>`; return; }
    let h='';
    for(const o of [...obituaries].reverse()){
      h += `<div class="lrow obit"><div class="yr">서기 ${o.year}년</div><div>† ${o.name}</div><div>${o.cause}</div></div>`;
    }
    logbody.innerHTML=h;

}

// ============================ 시트 탭 전환 ============================
document.getElementById('tabs').addEventListener('click', e=>{
  const tab = e.target.closest('.tab');
  if(!tab) return;
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.remove('on'));
  tab.classList.add('on');
  curSheet = tab.dataset.sheet;
  if(curSheet==='map'){ logsheet.classList.remove('show'); panel.style.display=''; }
  else { logsheet.classList.add('show'); panel.style.display='none'; renderLog(); }
});

// ============================ 셀 클릭 = 역사 ============================
sheet.addEventListener('click', e=>{
  const t = e.target.closest('.cell');
  if(!t) return;
  if(selected>=0 && cellEls[selected]) cellEls[selected].classList.remove('sel');
  selected = +t.dataset.i;
  t.classList.add('sel');
  // ripple
  const rp=document.createElement('div'); rp.className='ripple'; t.appendChild(rp);
  setTimeout(()=>rp.remove(),600);
  nbtxt.textContent = ref(selected);
  // 헤더 하이라이트
  sheet._colHd.forEach((h,c)=>h.classList.toggle('hot', c===selected%COLS));
  sheet._rowHd.forEach((h,r)=>h.classList.toggle('hot', r===(selected/COLS|0)));
  const c = cells[selected];
  let owner = c.owner!==null ? byId(c.owner) : null;
  const land = c.st==='water'? (c.frozen?'얼어붙은 바다':'검은 바다')
    : c.st==='glacier'?'만년 빙하' : c.st==='snow'?'설원' : c.st==='ruin'?'폐허' : '툰드라';
  const hist = c.hist.map(x=>`"${x}"`).join(' → ');
  if(owner){
    setFx(`=HISTORY("${owner.name}", "${LV_GLYPH[c.level]||land}", ${hist})`);
  } else {
    setFx(`=HISTORY("${land}", ${hist})`);
  }
});

// ============================ 리본 버튼 동작 ============================
let paused=false, speed=1, timer=null;
const SPEEDS=[1,2,4]; let spdIdx=0;
const baseInterval=120;

function startTimer(){
  if(timer) clearInterval(timer);
  timer=setInterval(()=>{ if(!paused) tick(); }, baseInterval/SPEEDS[spdIdx]);
}

document.getElementById('btnRun').addEventListener('click', ()=>{
  paused=!paused;
  const b=document.getElementById('btnRun');
  b.classList.toggle('live', !paused);
  document.getElementById('runIcon').textContent = paused?'▶':'❚❚';
  document.getElementById('runTxt').textContent = paused?'멈춤':'진행중';
  renderStatus();
});
document.getElementById('btnStep').addEventListener('click', ()=>{ tick(); });
document.getElementById('btnSpawn').addEventListener('click', ()=>{
  const f=spawnFaction(true);
  if(!f) logEvent('빈 툰드라가 없어 부족이 자리잡지 못했다.', '=SPAWN.FAIL("no land")');
});
document.getElementById('btnSpeed').addEventListener('click', ()=>{
  spdIdx=(spdIdx+1)%SPEEDS.length;
  document.getElementById('spdTxt').textContent = SPEEDS[spdIdx]+'배속';
  startTimer();
});
document.getElementById('btnReset').addEventListener('click', ()=>init());
document.getElementById('btnThaw').addEventListener('click', ()=>{
  // 해빙기로 점프
  tickN = Math.floor(tickN/(SEASON_LEN*4))*(SEASON_LEN*4); season=-1;
  tick();
  logEvent('인간의 기도로 해빙기가 앞당겨졌다.', '=INVOKE.THAW()');
});
document.getElementById('btnBliz').addEventListener('click', ()=>{
  // 혹한기로 점프
  tickN = Math.floor(tickN/(SEASON_LEN*4))*(SEASON_LEN*4) + SEASON_LEN*3; season=-1;
  tick();
  logEvent('하늘이 노하여 혹한기가 들이닥쳤다.', '=INVOKE.WINTER()');
});
document.getElementById('btnBerg').addEventListener('click', ()=>{
  // 무작위 바다/설원 위치에 빙산
  for(let t=0;t<200;t++){
    const i=Math.random()*N|0;
    if((cells[i].st==='water'||cells[i].st==='snow') && !bergs.has(i) && cells[i].owner===null){
      bergs.set(i,1); dirty.add(i); paint(i);
      logEvent(`${ref(i)}에 거대한 빙산이 떨어져 길을 막았다.`, `=DROP.BERG(${ref(i)})`);
      return;
    }
  }
});

// ============================ 초기화 ============================
function init(){
  computeDims();
  buildSheet();
  year=1; lastEvent='태초에 빙하가 있었다.'; pop=0;
  tickN=0; warLogCooldown=0; season=2; selected=-1; nameIdx=0; factionSeq=0;
  factions=[]; obituaries.length=0; chronicle.length=0;
  blizzard=false; plague=new Map(); fires=new Map(); bergs=new Map(); dirty=new Set();
  genWorld();
  applySeasonVisual();
  for(let i=0;i<N;i++) paint(i);
  setFx(`=SIM.GLACIER($A$1:$${colName(COLS-1)}$${ROWS}, "혹한 속에서 누가 봄을 보는가")`);
  nbtxt.textContent='A1';
  document.getElementById('tabObit').textContent='동사기록 (0)';
  stZoom.textContent = `${COLS}×${ROWS}`;
  spawnFaction(true); spawnFaction(true); spawnFaction(true);
  renderStatus(); renderPanel();
  if(curSheet!=='map'){ logsheet.classList.add('show'); renderLog(); }
  startTimer();
}

// 리사이즈 대응(디바운스 → 세계 재생성 없이 격자만 재구축은 복잡 → 차원 변할 때만 리빌드)
let rsT=null;
addEventListener('resize', ()=>{
  clearTimeout(rsT);
  rsT=setTimeout(()=>{
    const oc=COLS, or=ROWS;
    computeDims();
    if(oc!==COLS || or!==ROWS){
      // 차원이 바뀌면 깔끔하게 재시작 (반응형 보장)
      init();
    }
  }, 250);
});

init();
})();
</script>
