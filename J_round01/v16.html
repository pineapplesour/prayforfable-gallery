<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>심해.xlsx - Excel</title>
<style>
  :root{
    --grid:#dfe3e6; --gridStrong:#c9ced3; --hd:#f3f5f7; --green:#0f6b3f;
    --ink:#1f2d33;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#e6ebef;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #app{display:flex;flex-direction:column;height:100%}

  /* ---- 타이틀바 ---- */
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #dadada;flex:none}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar .ttl{margin-left:8px;color:#3a3a3a;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #titlebar .spacer{flex:1}
  #titlebar .winbtn{color:#9aa0a4;font-size:13px;padding:0 6px}

  /* ---- 메뉴바 ---- */
  #menubar{height:27px;background:#fff;display:flex;align-items:flex-end;
    padding:0 10px;gap:14px;border-bottom:1px solid #e4e7e9;font-size:12px;color:#4a4a4a;flex:none;
    overflow-x:auto;scrollbar-width:none}
  #menubar::-webkit-scrollbar{display:none}
  #menubar b{color:var(--green);border-bottom:2.5px solid var(--green);padding:4px 2px;font-weight:600;white-space:nowrap}
  #menubar i{font-style:normal;padding:4px 2px;white-space:nowrap}

  /* ---- 리본(개입 버튼) ---- */
  #ribbon{background:#fbfcfd;border-bottom:1px solid #e0e4e7;display:flex;align-items:stretch;
    padding:5px 8px;gap:6px;flex:none;overflow-x:auto;scrollbar-width:none}
  #ribbon::-webkit-scrollbar{display:none}
  .rgrp{display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 9px;border-right:1px solid #eceef0;gap:3px}
  .rgrp:last-child{border-right:none}
  .rgrp .lbl{font-size:9.5px;color:#9098a0}
  .rbtn{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid #cfd6db;border-radius:3px;
    padding:4px 9px;font-size:11px;color:#2b3a42;cursor:pointer;white-space:nowrap;transition:.12s}
  .rbtn:hover{background:#eef6f1;border-color:#9ecdb4}
  .rbtn:active{transform:translateY(1px)}
  .rbtn .ic{font-size:13px;line-height:1}
  .rbtn.green .ic{color:var(--green)}
  .rbtn.blue .ic{color:#1f6fb0}
  .rbtn.red .ic{color:#b62a2a}
  .rbtn.purple .ic{color:#7a3aa0}
  .rrow{display:flex;gap:5px}

  /* ---- 수식바 ---- */
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d6dadd;font-size:12px;flex:none}
  #namebox{width:74px;min-width:74px;height:100%;border-right:1px solid #d6dadd;display:flex;
    align-items:center;justify-content:center;color:#333;gap:4px}
  #namebox .car{color:#9aa0a4;font-size:9px}
  #fx{width:34px;min-width:34px;text-align:center;color:#9098a0;font-style:italic;font-family:Georgia,serif;border-right:1px solid #eceef0}
  #formula{flex:1;padding:0 10px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#16323d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #formula .kw{color:var(--green);font-weight:600}
  #formula .str{color:#b06a00}
  #formula .ref{color:#1f6fb0}

  /* ---- 시트 ---- */
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1;min-height:0}
  #zones{position:absolute;inset:0;pointer-events:none;z-index:0}
  #zones .z{position:absolute;left:0;right:0;display:flex;align-items:flex-start;justify-content:flex-end;
    padding:3px 6px 0 0;font-size:9.5px;letter-spacing:1px}
  #sheet{position:relative;z-index:1;display:grid;background:transparent}
  .hd{background:rgba(243,245,247,.92);border-right:1px solid var(--gridStrong);border-bottom:1px solid var(--gridStrong);
    display:flex;align-items:center;justify-content:center;color:#6a7178;font-size:10.5px;font-weight:500}
  .hd.corner{background:rgba(243,245,247,.96)}
  .cell{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);
    display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;
    overflow:hidden;cursor:cell;position:relative}
  .cell.sel{outline:2px solid var(--green);outline-offset:-2px;z-index:3}
  .cell.hl{outline:2px solid #d9a300;outline-offset:-2px;z-index:3}
  @keyframes battle{0%,100%{box-shadow:inset 0 0 0 99px rgba(214,40,40,.55)}50%{box-shadow:inset 0 0 0 99px rgba(214,40,40,0)}}
  .cell.bt{animation:battle .34s 3}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.32)}}
  .cell.pulse span{display:inline-block;animation:pulse .5s 2}

  /* ---- 범례 카드 ---- */
  #legend{position:absolute;top:9px;right:13px;background:rgba(255,255,255,.96);border:1px solid #cdd5da;
    box-shadow:0 4px 14px rgba(20,50,70,.18);border-radius:5px;padding:9px 12px 10px;font-size:11px;z-index:5;
    width:212px;line-height:1.55;backdrop-filter:blur(2px)}
  #legend h4{margin:0 0 4px;font-size:10.5px;color:var(--green);letter-spacing:.3px;
    border-bottom:1px solid #e6ebef;padding-bottom:3px}
  #legend .frow{display:flex;align-items:center;gap:6px;margin:1px 0}
  #legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;flex:none}
  #legend .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #legend .fsz{color:#8a9097;font-size:10px;font-variant-numeric:tabular-nums}
  #legend .gold{color:#c9920a;font-weight:700}
  #legend .dead{color:#9aa0a4;font-size:10px}
  #legend .keys{margin-top:7px;font-size:9.5px;color:#7c848b;line-height:1.7}
  #legend .keys b{color:#4a525a;font-weight:600}
  #legtoggle{position:absolute;top:9px;right:13px;z-index:6;display:none;background:rgba(255,255,255,.95);
    border:1px solid #cdd5da;border-radius:5px;padding:5px 9px;font-size:11px;color:var(--green);box-shadow:0 3px 9px rgba(20,50,70,.18)}

  /* ---- 상태바 ---- */
  #statusbar{height:23px;background:var(--green);color:#e9f6ef;display:flex;align-items:center;
    padding:0 11px;font-size:11px;flex:none;gap:0;white-space:nowrap;overflow:hidden}
  #statusbar .seg{display:inline-flex;align-items:center}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .evt{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  #statusbar .rt{margin-left:auto;padding-left:12px;opacity:.85;font-variant-numeric:tabular-nums}

  /* ---- 시트탭 ---- */
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:8px;
    border-top:1px solid #d6dadd;font-size:11px;flex:none;overflow-x:auto;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  .tabnav{display:flex;align-items:center;color:#9aa0a4;padding:0 6px 3px;font-size:11px}
  #tabs .tab{padding:3px 13px;border:1px solid #d6dadd;border-bottom:none;margin-right:2px;
    background:#e8e9ea;color:#666;cursor:pointer;white-space:nowrap;border-radius:3px 3px 0 0}
  #tabs .tab.on{background:#fff;color:var(--green);font-weight:600;border-top:2px solid var(--green)}
  #tabs .addtab{color:#9aa0a4;padding:0 10px 3px;font-size:14px}

  /* ---- 로그 시트(연대기/멸망) 패널 ---- */
  #logpanel{position:absolute;inset:0;background:#fff;z-index:4;display:none;flex-direction:column}
  #logpanel .lp-head{padding:8px 14px;border-bottom:1px solid #e4e7e9;display:flex;align-items:center;gap:10px;flex:none}
  #logpanel .lp-head .ttl{font-size:13px;color:var(--green);font-weight:600}
  #logpanel .lp-head .sub{font-size:11px;color:#8a9097}
  #logtbl{flex:1;overflow:auto}
  #logtbl table{border-collapse:collapse;width:100%;font-size:11.5px}
  #logtbl th{position:sticky;top:0;background:var(--hd);border:1px solid var(--grid);padding:5px 9px;
    color:#5a6168;font-weight:600;text-align:left;z-index:1}
  #logtbl td{border:1px solid var(--grid);padding:4px 9px;vertical-align:top}
  #logtbl td.yr{color:#1f6fb0;font-variant-numeric:tabular-nums;white-space:nowrap;width:64px}
  #logtbl td.fm{font-family:Consolas,Menlo,monospace;font-size:10.5px;color:#15633c;white-space:nowrap;width:1%}
  #logtbl tr:nth-child(even) td{background:#fafbfc}
  #logtbl .empty{padding:40px;text-align:center;color:#aab0b6}

  @media (max-width:560px){
    #legend{display:none}
    #legtoggle{display:block}
    #legend.show{display:block}
    .rgrp .lbl{display:none}
    #statusbar .rt{display:none}
    .cell{font-size:10px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <span class="ttl" id="wtitle">심해.xlsx - Excel</span>
    <span class="spacer"></span>
    <span class="winbtn">—</span><span class="winbtn">▢</span><span class="winbtn">✕</span>
  </div>

  <div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>그리기</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>

  <div id="ribbon">
    <div class="rgrp">
      <div class="rrow">
        <button class="rbtn green" data-act="spawn"><span class="ic">＋</span>=SPAWN()</button>
        <button class="rbtn blue" data-act="current"><span class="ic">≋</span>=CURRENT()</button>
      </div>
      <div class="lbl">개입 · 새 문명 / 해류 전환</div>
    </div>
    <div class="rgrp">
      <div class="rrow">
        <button class="rbtn red" data-act="eruption"><span class="ic">▲</span>=ERUPT()</button>
        <button class="rbtn purple" data-act="redtide"><span class="ic">≈</span>=RED.TIDE()</button>
        <button class="rbtn" data-act="meteor"><span class="ic">✦</span>=IMPACT()</button>
      </div>
      <div class="lbl">재앙 · 해저 화산 / 적조 / 운석</div>
    </div>
    <div class="rgrp">
      <div class="rrow">
        <button class="rbtn" id="btnSpeed" data-act="speed"><span class="ic">⏩</span>속도 ×1</button>
        <button class="rbtn" id="btnPause" data-act="pause"><span class="ic">⏸</span>일시정지</button>
      </div>
      <div class="lbl">시간</div>
    </div>
  </div>

  <div id="fbar">
    <div id="namebox"><span id="nbref">A1</span><span class="car">▾</span></div>
    <div id="fx">fx</div>
    <div id="formula"></div>
  </div>

  <div id="sheetwrap">
    <div id="zones"></div>
    <div id="sheet"></div>
    <div id="legend"></div>
    <button id="legtoggle">현황 ▾</button>
    <div id="logpanel">
      <div class="lp-head"><span class="ttl" id="lp-title">연대기</span><span class="sub" id="lp-sub"></span></div>
      <div id="logtbl"></div>
    </div>
  </div>

  <div id="statusbar"></div>

  <div id="tabs">
    <span class="tabnav">◀ ▶</span>
    <div class="tab on" data-sheet="map">해저지도</div>
    <div class="tab" data-sheet="chron">연대기</div>
    <div class="tab" data-sheet="obit" id="tab-obit">멸망기록 (0)</div>
    <span class="addtab">＋</span>
  </div>
</div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const sheet = $('#sheet'), zones = $('#zones'), fmla = $('#formula'),
      nbref = $('#nbref'), statusbar = $('#statusbar'), legend = $('#legend'),
      wtitle = $('#wtitle'), logpanel = $('#logpanel'), logtbl = $('#logtbl');

/* ============ 격자 크기(반응형) ============ */
let CW, CH, COLS, ROWS, N, cellEls, cells, gridReady = false;

function colName(n){ let s=''; n++; while(n>0){const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0;} return s; }
function ref(i){ return colName(i%COLS)+(Math.floor(i/COLS)+1); }

/* ============ 깊이대(배경 띠) ============
   위에서 아래로: 표층(광합성대) → 박명대 → 심해대 → 해저열수대 */
function buildZones(){
  zones.innerHTML='';
  const bands=[
    {to:.18, c1:'#e8f4fb', c2:'#d4ebf6', label:'표층 · 光合成帶', tc:'#7fb4d4'},
    {to:.46, c1:'#cfe6f3', c2:'#aed3ea', label:'박명대 · 薄明帶', tc:'#6c9fc4'},
    {to:.78, c1:'#9fc4df', c2:'#6f9fc4', label:'심해대 · 深海帶', tc:'#c3dcee'},
    {to:1,   c1:'#5d86ab', c2:'#3f5f81', label:'열수대 · 熱水帶', tc:'#bcd2e6'},
  ];
  let prev=0;
  for(const b of bands){
    const z=document.createElement('div'); z.className='z';
    z.style.top=(prev*100)+'%'; z.style.height=((b.to-prev)*100)+'%';
    z.style.background=`linear-gradient(180deg,${b.c1},${b.c2})`;
    z.style.color=b.tc; z.textContent=b.label;
    zones.appendChild(z); prev=b.to;
  }
}

/* ============ 노이즈 지형 ============ */
let gz=[], GW=10, GH=7;
function noise(x,y){
  const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const X1=Math.min(GW-1,x0+1), Y1=Math.min(GH-1,y0+1);
  const a=gz[y0*GW+x0],b=gz[y0*GW+X1],c=gz[Y1*GW+x0],d=gz[Y1*GW+X1];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}

/* ============ 세포 상태 ============
   st: open(개수면)·reef(산호초)·kelp(다시마숲)·rock(암반)·vent(열수분출공)·ruin(폐허)
   owner / level / hist / ruinT */
function makeCells(){
  cells=new Array(N);
  for(let i=0;i<N;i++){
    const x=i%COLS, y=i/COLS|0;
    const depth=y/(ROWS-1);                       // 0 표층 ~ 1 심해
    const v=noise(x,y)+(Math.random()-.5)*.16;
    let st='open', hist;
    if(depth>.82 && Math.random()<.10){ st='vent'; hist=['열수분출공']; }   // 심해 열수공
    else if(depth<.4 && v>.6 && Math.random()<.62){ st='reef'; hist=['산호초']; }
    else if(depth<.55 && v>.5 && Math.random()<.5){ st='kelp'; hist=['다시마숲']; }
    else if(v<.3){ st='rock'; hist=['해저 암반']; }
    else { st='open'; hist=['열린 바다']; }
    cells[i]={st,owner:null,level:0,hist,ruinT:0};
  }
}

function nbrs(i){
  const x=i%COLS,y=i/COLS|0,out=[];
  if(x>0)out.push(i-1); if(x<COLS-1)out.push(i+1);
  if(y>0)out.push(i-COLS); if(y<ROWS-1)out.push(i+COLS);
  return out;
}

/* ============ 문명(세력) ============ */
const NAMES=['산호 도시국','심해 어인족','진주 상단','발광 군체','협곡 부족','해초 수도회','조개 왕조','열수 교단','해류 유랑민','거품 자치령','석호 연맹','진흙 왕국'];
const COLORS=['#e0567b','#1f8fb0','#caa23a','#33b08a','#7a5bd0','#3f8f3f','#c06a2e','#c0392b','#2d6fb8','#8a6cae','#1fa0a0','#9a7b3a'];
const GLYPH=['','·','珊','宮','都'];          // 레벨별 글리프: 군락→촌→도시→대도시
const LV_LABEL=['','군락','마을','도시','대도시'];

let nameIdx=0, factions=[], obituaries=[], chronicle=[];
let year=1, lastEvent='태초의 바다가 펼쳐졌습니다.', pop=0;
let redtide=new Map(), magma=new Map();      // idx -> 남은 틱
const dirty=new Set();
let selected=-1, highlight=-1;
let tickN=0, warCooldown=0;

function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function facById(id){ return factions.find(f=>f.id===id); }

function spawnFaction(announce, originLabel){
  if(nameIdx>=NAMES.length) nameIdx=0;
  const id=factions.length?Math.max(...factions.map(x=>x.id))+1:0;
  const f={id, name:NAMES[nameIdx], color:COLORS[nameIdx%COLORS.length], golden:0, size:0, arr:[]};
  nameIdx++;
  for(let t=0;t<400;t++){
    const i=Math.random()*N|0, c=cells[i];
    if(c.owner===null && c.st!=='rock' && c.st!=='ruin'){
      setCell(i,f.id,1,'태동');
      factions.push(f);
      if(announce) logEvent(`${f.name}이(가) 바다에서 태어났습니다.`,
        [['kw','=SPAWN'],['p','('],['str',`"${f.name}"`],['p',', '],['ref',ref(i)],['p',')']],'birth');
      else if(originLabel) logEvent(`${originLabel} ${f.name}이(가) 해류를 타고 도래했습니다.`,
        [['kw','=MIGRATE'],['p','('],['str',`"${f.name}"`],['p',')']],'birth');
      return f;
    }
  }
  return null;
}

function setCell(i,owner,level,histLabel){
  const c=cells[i];
  c.owner=owner; c.level=level;
  if(c.st!=='vent') c.st='colony'; else c.st='vent';   // 열수공 위 정착은 vent 유지(특수)
  if(histLabel){ c.hist.push(histLabel); if(c.hist.length>8)c.hist.shift(); }
  dirty.add(i);
}

function paint(i){
  const c=cells[i], el=cellEls[i];
  let bg='', tx='', col='#26343b', w='', shadow='';
  if(redtide.has(i)){ bg='#caa6c8'; tx='茶'; col='#6b2a66'; w='700'; }
  else if(magma.has(i)){ bg='#e8804a'; tx='噴'; col='#7a1f00'; w='700'; }
  else if(c.st==='vent' && c.owner===null){ bg='#3a2d40'; tx='噴'; col='#ff9a52'; w='700'; }
  else if(c.st==='reef'){ bg='rgba(255,150,170,.30)'; tx='✿'; col='#d96a86'; }
  else if(c.st==='kelp'){ bg='rgba(60,150,90,.22)'; tx='ψ'; col='#2f8f4d'; }
  else if(c.st==='rock'){ bg='rgba(70,90,110,.20)'; tx='▦'; col='#5a6e80'; }
  else if(c.st==='ruin'){ bg='rgba(120,120,120,.30)'; tx='墟'; col='#7a7a7a'; }
  else if(c.owner!==null){
    const f=facById(c.owner);
    if(f){
      bg=hexA(f.color,.22+c.level*.18);
      tx= c.st==='vent' && c.level>=2 ? '噴' : GLYPH[c.level];
      col= c.level>=2 ? '#fff' : f.color; w= c.level>=3?'700':'';
      if(c.level>=4) shadow='0 0 0 1px '+f.color+' inset';
      if(f.golden && c.level>=3){ col='#fff5cf'; }
    }
  } else {
    // 빈 바다: 깊이에 따라 색 약간(존 배경이 보이도록 거의 투명) + 가끔 거품
    tx = (i*37%53===0) ? '°' : '';
    col='rgba(120,160,190,.5)';
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w; el.style.boxShadow=shadow;
  el.firstChild.textContent=tx;
}

/* ============ 로그 ============ */
function fmt(parts){
  if(typeof parts==='string'){ fmla.textContent=parts; return parts; }
  let html='', plain='';
  for(const [k,t] of parts){
    plain+=t;
    if(k==='kw')html+=`<span class="kw">${t}</span>`;
    else if(k==='str')html+=`<span class="str">${t}</span>`;
    else if(k==='ref')html+=`<span class="ref">${t}</span>`;
    else html+=t;
  }
  fmla.innerHTML=html;
  return plain;
}
function logEvent(msg, formulaParts, type){
  lastEvent=`서기 ${year}년: ${msg}`;
  const plain= formulaParts? fmt(formulaParts) : '';
  if(type!=='quiet'){
    chronicle.push({year, msg, formula:plain, type:type||'event'});
    if(chronicle.length>400) chronicle.shift();
    if(activeSheet==='chron') renderChron();
  }
}

/* ============ 틱(한 해) ============ */
const PW=[0,30,120,480,1500];   // 레벨별 인구
function tick(){
  if(!gridReady) return;
  tickN++; year++;
  if(warCooldown>0) warCooldown--;

  for(const f of factions){ f.arr.length=0; f.size=0; }
  pop=0;
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin' && --c.ruinT<=0){ c.st='open'; c.hist.push('바다가 되찾음'); if(c.hist.length>8)c.hist.shift(); dirty.add(i); }
    if(c.owner!==null){
      const f=facById(c.owner);
      if(f){ f.arr.push(i); f.size++; pop+=PW[c.level]; }
      else { c.owner=null; c.level=0; if(c.st==='colony')c.st='open'; dirty.add(i); }
    }
  }

  // 멸망
  for(let k=factions.length-1;k>=0;k--){
    const f=factions[k];
    if(f.size===0){
      obituaries.push({name:f.name, year, color:f.color});
      logEvent(`${f.name}이(가) 심연으로 가라앉았습니다.`,
        [['kw','=COLLAPSE'],['p','('],['str',`"${f.name}"`],['p',', '],[ '', String(year)],['p',')']],'collapse');
      factions.splice(k,1);
    }
  }

  // 적조
  if(redtide.size){
    for(const [i,t] of [...redtide]){
      if(Math.random()<.17) for(const n of nbrs(i)){ const c=cells[n];
        if(c.owner!==null && !redtide.has(n) && !magma.has(n)){ redtide.set(n,10); dirty.add(n); } }
      if(Math.random()<.24){ const c=cells[i]; c.level--;
        if(c.level<=0){ c.owner=null; c.level=0; if(c.st==='colony')c.st='open'; c.hist.push('적조로 소멸'); if(c.hist.length>8)c.hist.shift(); } dirty.add(i); }
      if(t<=1){ redtide.delete(i); dirty.add(i); } else redtide.set(i,t-1);
    }
    if(redtide.size===0) logEvent('적조가 가셨습니다.', [['kw','=RED.TIDE.END'],['p','()']],'event');
  }

  // 해저 화산(마그마 → 폐허, 주변 전파)
  if(magma.size){
    for(const [i,t] of [...magma]){
      if(Math.random()<.14) for(const n of nbrs(i)){ const c=cells[n];
        if(!magma.has(n) && c.st!=='rock' && c.st!=='vent'){ magma.set(n,4); dirty.add(n); } }
      if(t<=1){ magma.delete(i); const c=cells[i];
        c.owner=null; c.level=0; c.st='ruin'; c.ruinT=190;
        c.hist.push('용암에 묻힘'); if(c.hist.length>8)c.hist.shift(); dirty.add(i);
      } else magma.set(i,t-1);
    }
  }

  // 문명 행동
  for(const f of factions){
    if(f.golden>0) f.golden--;
    if(f.size===0) continue;

    // 확장(해류 보너스 가능)
    const attempts=1+(f.size*.08|0);
    for(let a=0;a<attempts;a++){
      const src=f.arr[Math.random()*f.arr.length|0];
      if(src===undefined||cells[src].owner!==f.id) continue;
      const nb=nbrs(src);
      // 해류가 있으면 그 방향 우대
      let tgt;
      if(currentDir>=0 && Math.random()<.6){
        const x=src%COLS,y=src/COLS|0;
        const cand=[];
        if(currentDir===0&&x<COLS-1)cand.push(src+1);
        if(currentDir===1&&x>0)cand.push(src-1);
        if(currentDir===2&&y<ROWS-1)cand.push(src+COLS);
        if(currentDir===3&&y>0)cand.push(src-COLS);
        tgt=cand.length?cand[0]:nb[Math.random()*nb.length|0];
      } else tgt=nb[Math.random()*nb.length|0];
      const tc=cells[tgt];
      if(tc.st==='rock'||magma.has(tgt)) continue;
      if(tc.owner===null){
        if(tc.st==='reef'){ if(Math.random()<.4){ tc.hist.push('산호 정착'); setCell(tgt,f.id,1,'군락'); } }
        else if(tc.st==='kelp'){ if(Math.random()<.5){ tc.hist.push('다시마 개간'); setCell(tgt,f.id,1,'군락'); } }
        else if(tc.st==='vent'){ if(Math.random()<.22){ tc.hist.push('열수공 점거'); setCell(tgt,f.id,2,'열수 도시'); } }
        else if(tc.st==='open') setCell(tgt,f.id,1,'군락');
      } else if(tc.owner!==f.id && Math.random()<.32){
        // 전쟁
        const ventBonus = tc.st==='vent'?0:0;
        const att=1+Math.random()*3+f.size*.0025+(f.golden?1.2:0);
        const def=tc.level+1+Math.random()*3+(tc.st==='vent'?1:0);
        battleFlash(tgt);
        if(att>def){
          const defF=facById(tc.owner);
          if(Math.random()<.28){
            tc.owner=null; tc.level=0; if(tc.st==='colony')tc.st='open';
            tc.hist.push('전화로 폐허'); if(tc.hist.length>8)tc.hist.shift(); dirty.add(tgt);
          } else {
            setCell(tgt,f.id,Math.max(1,tc.level-1),'정복');
          }
          if(defF && (tc.level>=3||warCooldown===0)){
            logEvent(`${f.name}이(가) ${defF.name}의 ${LV_LABEL[Math.max(1,tc.level)]||'영토'}를 점령했습니다.`,
              [['kw','=WAR'],['p','('],['str',`"${f.name}"`],['p','→'],['str',`"${defF.name}"`],['p',', '],['ref',ref(tgt)],['p',')']],'war');
            warCooldown=34;
          }
        }
      }
    }

    // 발전
    const ups=1+(f.size*.05|0);
    for(let u=0;u<ups;u++){
      const i=f.arr[Math.random()*f.arr.length|0];
      if(i===undefined||cells[i].owner!==f.id) continue;
      const c=cells[i];
      if(c.level<4 && Math.random()< .055*(f.golden?3:1)){
        c.level++;
        c.hist.push(LV_LABEL[c.level]); if(c.hist.length>8)c.hist.shift(); dirty.add(i);
        if(c.level===4 && warCooldown===0){
          logEvent(`${f.name}의 ${ref(i)}에 해저 대도시가 건설되었습니다.`,
            [['kw','=METROPOLIS'],['p','('],['str',`"${f.name}"`],['p',', '],['ref',ref(i)],['p',')']],'city');
          warCooldown=22;
        }
      }
    }
  }

  // 해류 수명
  if(currentDir>=0){ if(--currentTTL<=0){ currentDir=-1;
    logEvent('해류가 잦아들었습니다.', [['kw','=CURRENT.END'],['p','()']],'event'); } }

  // 무작위 사건
  const r=Math.random();
  if(!redtide.size && r<.004){ triggerRedTide(true); }
  else if(r>.9965 && factions.length){
    const f=factions[Math.random()*factions.length|0]; f.golden=85;
    logEvent(`${f.name}에 풍요의 시대가 도래했습니다.`,
      [['kw','=GOLDEN.AGE'],['p','('],['str',`"${f.name}"`],['p',', 85)']],'gold');
  }
  else if(r>.993 && r<=.9965){ triggerEruption(true); }
  if(factions.length<3 && Math.random()<.013 && factions.length<7) spawnFaction(false,'먼 해구에서');

  // 그리기
  for(const i of dirty) paint(i);
  dirty.clear();
  renderStatus();
  if(tickN%8===0) renderLegend();
  if(tickN%5===0 && activeSheet==='obit') renderObit();
}

/* ============ 효과 ============ */
function battleFlash(i){ const el=cellEls[i]; el.classList.add('bt'); setTimeout(()=>el.classList.remove('bt'),1050); }
function pulseCell(i){ const el=cellEls[i]; if(!el)return; el.classList.add('pulse'); setTimeout(()=>el.classList.remove('pulse'),1000); }

function triggerRedTide(auto){
  const cand=cells.map((c,i)=>({c,i})).filter(o=>o.c.owner!==null && o.c.level>=2);
  if(!cand.length) return false;
  const o=cand[Math.random()*cand.length|0];
  redtide.set(o.i,11); dirty.add(o.i); pulseCell(o.i);
  logEvent(`${ref(o.i)} 일대에 적조가 창궐했습니다.`,
    [['kw','=RED.TIDE'],['p','('],['ref',ref(o.i)],['p',')']],'plague');
  return true;
}
function triggerEruption(auto){
  // 열수대(아래쪽) 우선
  let pool=cells.map((c,i)=>({c,i})).filter(o=>(o.i/COLS|0)>ROWS*.55 && o.c.st!=='ruin');
  if(!pool.length) pool=cells.map((c,i)=>({c,i})).filter(o=>o.c.st!=='ruin');
  if(!pool.length) return false;
  const o=pool[Math.random()*pool.length|0];
  magma.set(o.i,5); dirty.add(o.i); pulseCell(o.i);
  logEvent(`${ref(o.i)}에서 해저 화산이 분출했습니다.`,
    [['kw','=ERUPT'],['p','('],['ref',ref(o.i)],['p',')']],'fire');
  return true;
}
function triggerMeteor(){
  // 운석: 무작위 지점 + 주변 4칸 큰 충격
  const i=Math.random()*N|0;
  const hit=[i,...nbrs(i)];
  for(const h of hit){ const c=cells[h];
    if(c.st!=='rock'){ c.owner=null; c.level=0; c.st='ruin'; c.ruinT=220;
      c.hist.push('운석 충돌'); if(c.hist.length>8)c.hist.shift(); dirty.add(h); pulseCell(h); } }
  logEvent(`${ref(i)}에 운석이 떨어져 큰 분화구가 생겼습니다.`,
    [['kw','=IMPACT'],['p','('],['ref',ref(i)],['p',')']],'fire');
}
let currentDir=-1, currentTTL=0;
const DIRTXT=['동향(→)','서향(←)','하강(↓)','상승(↑)'];
function triggerCurrent(){
  currentDir=Math.random()*4|0; currentTTL=60+Math.random()*60|0;
  logEvent(`${DIRTXT[currentDir]} 거대 해류가 흐르기 시작했습니다.`,
    [['kw','=CURRENT'],['p','('],['str',`"${DIRTXT[currentDir]}"`],['p',', '],[ '', String(currentTTL)],['p',')']],'event');
}

/* ============ 상태바 / 범례 ============ */
const NOW=Date.now();
function renderStatus(){
  const cur = currentDir>=0 ? `<span class="sep">|</span><span class="seg">해류 ${DIRTXT[currentDir]}</span>` : '';
  statusbar.innerHTML=
    `<span class="seg">준비</span><span class="sep">|</span>`+
    `<span class="seg">서기 ${year}년</span><span class="sep">|</span>`+
    `<span class="seg">인구 ${pop.toLocaleString()}</span><span class="sep">|</span>`+
    `<span class="seg">문명 ${factions.length}</span>${cur}<span class="sep">|</span>`+
    `<span class="evt">${lastEvent}</span>`+
    `<span class="rt">평균 ⊞ ${Math.round((Date.now()-NOW)/1000)}s</span>`;
}
function renderLegend(){
  wtitle.textContent=`심해.xlsx - Excel · 서기 ${year}년`;
  document.title=`심해.xlsx (서기 ${year}년)`;
  let h='<h4>해저 문명 현황</h4>';
  const sorted=[...factions].sort((a,b)=>b.size-a.size);
  if(!sorted.length) h+='<div class="dead">모든 문명이 사라졌습니다…</div>';
  for(const f of sorted){
    h+=`<div class="frow"><span class="sw" style="background:${f.color}"></span>`+
       `<span class="fname">${f.name}${f.golden?' <span class="gold">✦</span>':''}</span>`+
       `<span class="fsz">${f.size}칸</span></div>`;
  }
  if(obituaries.length){
    h+='<h4 style="margin-top:7px">멸망기록</h4>';
    for(const o of obituaries.slice(-3)) h+=`<div class="dead">† ${o.name} (${o.year}년)</div>`;
  }
  h+='<div class="keys">✿ 산호초 · ψ 다시마 · ▦ 암반 · 噴 열수공 · 茶 적조 · 墟 폐허<br>'+
     '<b>셀 클릭</b>=지층 역사 · 리본 버튼=개입</div>';
  legend.innerHTML=h;
  $('#tab-obit').textContent=`멸망기록 (${obituaries.length})`;
}

/* ============ 시트 전환(해저지도 / 연대기 / 멸망기록) ============ */
let activeSheet='map';
function setSheet(name){
  activeSheet=name;
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.sheet===name));
  if(name==='map'){ logpanel.style.display='none'; }
  else { logpanel.style.display='flex';
    if(name==='chron') renderChron(); else renderObit(); }
}
function renderChron(){
  $('#lp-title').textContent='연대기';
  $('#lp-sub').textContent=`서기 ${year}년 · 총 ${chronicle.length}건의 기록`;
  if(!chronicle.length){ logtbl.innerHTML='<div class="empty">아직 기록된 사건이 없습니다.</div>'; return; }
  let rows='';
  for(const e of [...chronicle].reverse()){
    rows+=`<tr><td class="yr">서기 ${e.year}년</td><td>${e.msg}</td><td class="fm">${e.formula||''}</td></tr>`;
  }
  logtbl.innerHTML=`<table><thead><tr><th>연도</th><th>사건</th><th>수식</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function renderObit(){
  $('#lp-title').textContent='멸망기록';
  $('#lp-sub').textContent=`사라진 문명 ${obituaries.length}곳`;
  if(!obituaries.length){ logtbl.innerHTML='<div class="empty">아직 멸망한 문명이 없습니다. (현존 문명이 번성 중)</div>'; return; }
  let rows='';
  for(const o of [...obituaries].reverse()){
    rows+=`<tr><td class="yr">서기 ${o.year}년</td><td><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${o.color};margin-right:6px"></span>${o.name}</td><td class="fm">=COLLAPSE("${o.name}")</td></tr>`;
  }
  logtbl.innerHTML=`<table><thead><tr><th>멸망 연도</th><th>문명</th><th>최후 수식</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ============ 셀 클릭 = 지층(역사) ============ */
function attachSheetClick(){
  sheet.addEventListener('click', e=>{
    const t=e.target.closest('.cell'); if(!t) return;
    if(selected>=0 && cellEls[selected]) cellEls[selected].classList.remove('sel');
    selected=+t.dataset.i; t.classList.add('sel');
    nbref.textContent=ref(selected);
    const c=cells[selected];
    const owner = c.owner!==null ? facById(c.owner) : null;
    const parts=[['kw','=STRATA'],['p','(']];
    c.hist.forEach((x,k)=>{ if(k)parts.push(['p',' → ']); parts.push(['str',`"${x}"`]); });
    parts.push(['p',')']);
    fmt(parts);
    const who = owner? `${owner.name} · ${LV_LABEL[c.level]||'영토'}` :
                c.st==='reef'?'산호초':c.st==='kelp'?'다시마숲':c.st==='vent'?'열수분출공':
                c.st==='rock'?'해저 암반':c.st==='ruin'?'폐허':'열린 바다';
    lastEvent=`${ref(selected)} — ${who} · 지층 ${c.hist.length}겹`;
    renderStatus();
  });
}

/* ============ 리본 버튼 ============ */
let speed=1, paused=false, timer=null;
const SPEEDS=[1,2,4];
function setTimerByState(){
  if(timer) clearInterval(timer);
  if(paused){ timer=null; return; }
  const base=120; timer=setInterval(tick, Math.round(base/speed));
}
function attachRibbon(){
  document.querySelector('#ribbon').addEventListener('click', e=>{
    const b=e.target.closest('.rbtn'); if(!b) return;
    const act=b.dataset.act;
    if(act==='spawn'){ const f=spawnFaction(true); if(f){ const i=f.arr.length?f.arr[0]:-1; } }
    else if(act==='current'){ triggerCurrent(); }
    else if(act==='eruption'){ if(!triggerEruption(false)){} }
    else if(act==='redtide'){ if(!triggerRedTide(false)){
      logEvent('적조를 일으킬 만한 문명이 없습니다.', [['kw','=RED.TIDE'],['p','(#N/A)']],'event'); } }
    else if(act==='meteor'){ triggerMeteor(); }
    else if(act==='speed'){
      const idx=(SPEEDS.indexOf(speed)+1)%SPEEDS.length; speed=SPEEDS[idx];
      $('#btnSpeed').innerHTML=`<span class="ic">⏩</span>속도 ×${speed}`; if(!paused) setTimerByState();
    }
    else if(act==='pause'){
      paused=!paused; $('#btnPause').innerHTML=`<span class="ic">${paused?'▶':'⏸'}</span>${paused?'재생':'일시정지'}`;
      setTimerByState();
    }
    if(activeSheet!=='map') setSheet('map');
    // 즉시 반영
    for(const i of dirty) paint(i); dirty.clear(); renderStatus(); renderLegend();
  });
  document.querySelector('#tabs').addEventListener('click', e=>{
    const t=e.target.closest('.tab'); if(!t) return; setSheet(t.dataset.sheet);
  });
  $('#legtoggle').addEventListener('click',()=>legend.classList.toggle('show'));
}

/* ============ 빌드/리빌드(반응형) ============ */
function build(){
  const wrap=$('#sheetwrap');
  const W=wrap.clientWidth||innerWidth, H=wrap.clientHeight||(innerHeight-200);
  const mobile = innerWidth<560;
  CW = mobile?26:30; CH = mobile?22:24;
  const rowHdW = 42;
  COLS=Math.max(14, Math.min(46, Math.floor((W-rowHdW)/CW)));
  ROWS=Math.max(12, Math.min(34, Math.floor((H-CH)/CH)));
  N=COLS*ROWS;

  gz=[]; for(let i=0;i<GW*GH;i++) gz[i]=Math.random();

  buildZones();
  sheet.style.gridTemplateColumns=`${rowHdW}px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows=CH+'px';

  cellEls=new Array(N);
  const frag=document.createDocumentFragment();
  const corner=document.createElement('div'); corner.className='hd corner'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){ const h=document.createElement('div'); h.className='hd'; h.textContent=colName(c); frag.appendChild(h); }
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div'); h.className='hd'; h.textContent=r+1; frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div'); d.className='cell'; const i=r*COLS+c; d.dataset.i=i;
      const sp=document.createElement('span'); d.appendChild(sp);
      cellEls[i]=d; frag.appendChild(d);
    }
  }
  sheet.innerHTML=''; sheet.appendChild(frag);

  makeCells();
  for(let i=0;i<N;i++) paint(i);
  gridReady=true;
}

/* ============ 시작 ============ */
build();
attachSheetClick();
attachRibbon();
fmt([['kw','=SIM.OCEAN'],['p','($A$1:$'],['ref',`${colName(COLS-1)}$${ROWS}`],['p',', '],['str','"바다는 모든 것을 기억한다"'],['p',')']]);
spawnFaction(true); spawnFaction(true); spawnFaction(true);
renderStatus(); renderLegend();
setTimerByState();

// 리사이즈 시 재구성(디바운스)
let rT;
addEventListener('resize', ()=>{ clearTimeout(rT); rT=setTimeout(()=>{
  const ny=year, oc=obituaries, ch=chronicle;
  // 보존: 연대기/멸망기록/연도. 지도는 새로 시드(반응형 칸수 변경 대응).
  gridReady=false;
  build();
  year=ny; obituaries=oc; chronicle=ch;
  factions=[]; nameIdx=0; redtide=new Map(); magma=new Map(); selected=-1; currentDir=-1;
  spawnFaction(false,''); spawnFaction(false,''); spawnFaction(false,'');
  renderStatus(); renderLegend();
  if(activeSheet!=='map') setSheet(activeSheet);
},300); });
})();
</script>
