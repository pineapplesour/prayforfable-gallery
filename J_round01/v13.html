<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>三國演義.xlsx - Excel</title>
<style>
  :root{
    --grn:#107c41; --grn-d:#0b5c30; --hdr:#f5f6f5; --line:#e2e3e2; --line2:#cfd0cf;
    --wei:#2f6fd8; --shu:#16a34a; --wu:#dc2626;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#dfe1df;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}

  /* ── 타이틀 ── */
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar .t{margin-left:8px;color:#3b3b3b;font-size:12px;font-weight:600}
  #titlebar .qa{margin-left:auto;display:flex;gap:9px;color:#9a9a9a;font-size:12px}

  /* ── 리본 메뉴 ── */
  #menubar{height:27px;background:#fff;display:flex;align-items:flex-end;
    padding:0 10px;gap:3px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;flex:0 0 auto}
  #menubar .m{padding:5px 9px;cursor:pointer;border-radius:3px 3px 0 0}
  #menubar .m:hover{background:#f1f1f1}
  #menubar .m.on{color:var(--grn);font-weight:600;box-shadow:inset 0 -2.5px 0 var(--grn)}
  #ribbon{height:64px;background:#f7f7f7;border-bottom:1px solid #d4d4d4;display:flex;
    align-items:stretch;padding:4px 4px 0;gap:0;overflow:hidden;flex:0 0 auto}
  .grp{display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:3px 8px 2px;border-right:1px solid #e6e6e6}
  .grp .gbtns{display:flex;align-items:flex-start;gap:1px;flex:1}
  .grp .gl{font-size:9.5px;color:#9a9a9a;white-space:nowrap;padding-top:2px;border-top:1px solid #efefef;width:100%;text-align:center}
  .btn{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    min-width:46px;padding:3px 6px 4px;border-radius:4px;cursor:pointer;color:#3a3a3a;line-height:1.15}
  .btn:hover{background:#eaf3ec;box-shadow:inset 0 0 0 1px #cfe6d6}
  .btn:active{background:#d8ecdf}
  .btn .ic{font-size:17px;height:20px;display:flex;align-items:center}
  .btn .lb{font-size:10.5px;margin-top:1px;white-space:nowrap}
  .btn.dis{opacity:.4;pointer-events:none}
  .btn.acc .ic{color:var(--grn)}

  /* ── 수식바 ── */
  #fbar{height:25px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;flex:0 0 auto}
  #namebox{width:74px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;font-weight:600;gap:5px;flex:0 0 auto}
  #namebox .car{font-size:8px;color:#999}
  #fxlbl{width:34px;text-align:center;color:#9a9a9a;font-style:italic;font-family:Georgia,serif;
    border-right:1px solid #ececec;flex:0 0 auto}
  #formula{flex:1;padding:0 9px;font-family:Consolas,Menlo,monospace;font-size:12px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #formula .kw{color:#1565c0;font-weight:700}
  #formula .str{color:#0b7a3b}
  #formula .num{color:#a31515}

  /* ── 본문 ── */
  #body{flex:1;position:relative;overflow:hidden;background:#fff}
  .pane{position:absolute;inset:0;overflow:auto;background:#fff}
  .pane.hide{display:none}

  /* 지도 시트 */
  #sheet{display:grid;background:#fff;width:max-content}
  .hd{background:var(--hdr);border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);
    display:flex;align-items:center;justify-content:center;color:#666;font-size:11px;font-weight:500;
    position:sticky;z-index:3}
  .hd.col{top:0}.hd.row{left:0;z-index:4}
  .hd.corner{top:0;left:0;z-index:5}
  .cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:13px;
    overflow:hidden;cursor:cell;position:relative;transition:background .25s}
  .cell.sel{outline:2px solid var(--grn);outline-offset:-2px;z-index:2}
  .cell .cap{position:absolute;top:-1px;right:1px;font-size:7px;line-height:1}
  @keyframes warf{0%,100%{box-shadow:inset 0 0 0 2px #ff3b3b}50%{box-shadow:inset 0 0 0 2px #ffd2d2}}
  .cell.war{animation:warf .3s 4}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
  .cell.cap-anim{animation:pulse .9s ease-in-out infinite}

  /* 데이터 시트 (국력표 등) */
  .dtable{border-collapse:collapse;font-size:12px;margin:0}
  .dtable td,.dtable th{border:1px solid var(--line2);padding:3px 12px;text-align:center;
    background:#fff;min-width:60px;height:22px}
  .dtable th{background:var(--hdr);color:#555;font-weight:600}
  .dtable .rh{background:var(--hdr);color:#666;font-weight:600;min-width:30px}
  .dtable .nm{text-align:left;font-weight:700}
  .dtable .bar{position:relative;text-align:left;padding:0}
  .dtable .bar .fill{height:18px;display:flex;align-items:center;padding-left:6px;
    color:#fff;font-size:11px;border-radius:0 2px 2px 0;min-width:24px;white-space:nowrap}

  /* 로그 시트 (연대기 / 멸망) */
  .logsheet{font-family:Consolas,Menlo,monospace;font-size:12px}
  .logsheet .lr{display:flex;border-bottom:1px solid var(--line)}
  .logsheet .lr:nth-child(odd){background:#fafbfa}
  .logsheet .lr .a{width:50px;flex:0 0 auto;background:var(--hdr);border-right:1px solid var(--line2);
    color:#888;text-align:center;padding:3px 0}
  .logsheet .lr .b{padding:3px 12px;white-space:pre-wrap}
  .logsheet .yr{color:#a31515}.logsheet .fn{color:#1565c0;font-weight:700}.logsheet .q{color:#0b7a3b}

  /* 범례 / 패널 */
  #legend{position:absolute;top:10px;right:14px;background:#fffdf2;border:1px solid #d9c878;
    box-shadow:2px 4px 12px rgba(0,0,0,.16);padding:9px 12px;font-size:11px;z-index:6;
    min-width:200px;line-height:1.65;border-radius:3px}
  #legend h4{margin:0 0 4px;font-size:11.5px;color:#7a6a1f;letter-spacing:.3px}
  #legend .sw{display:inline-block;width:10px;height:10px;margin-right:7px;border-radius:2px;vertical-align:-1px}
  #legend .row{display:flex;justify-content:space-between;gap:10px}
  #legend .row b{font-weight:600}
  #legend .gold{color:#b8860b;font-weight:700}
  #legend .small{color:#9a9a9a;font-size:10px;margin-top:5px;border-top:1px dashed #e0d49a;padding-top:4px}
  #legend.min{min-width:0;cursor:pointer}

  /* 천하통일 오버레이 */
  #win{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(20,30,25,.55);z-index:20;backdrop-filter:blur(2px)}
  #win .card{background:#fff;border-top:5px solid var(--grn);padding:26px 40px;text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.4);border-radius:4px;max-width:80%}
  #win .card h1{margin:0 0 6px;font-size:34px;letter-spacing:6px}
  #win .card p{margin:4px 0;color:#555;font-size:13px}
  #win .card .fx{font-family:Consolas,monospace;color:#1565c0;margin-top:10px;font-size:12px}
  #win .card button{margin-top:16px;background:var(--grn);color:#fff;border:0;padding:8px 22px;
    border-radius:3px;font-size:13px;cursor:pointer;font-family:inherit}
  #win .card button:hover{background:var(--grn-d)}

  /* ── 시트탭 ── */
  #tabs{height:27px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:8px;
    border-top:1px solid #d4d4d4;font-size:11.5px;flex:0 0 auto;overflow-x:auto;overflow-y:hidden}
  #tabs::-webkit-scrollbar{height:0}
  #tabs .tb{padding:4px 14px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap;border-radius:3px 3px 0 0}
  #tabs .tb.on{background:#fff;color:var(--grn);font-weight:700;box-shadow:inset 0 2px 0 var(--grn)}
  #tabs .add{padding:4px 9px;color:#999;cursor:default}

  /* ── 상태바 ── */
  #statusbar{height:24px;background:var(--grn);color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;flex:0 0 auto;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 9px;opacity:.45}
  #statusbar .ev{flex:1;overflow:hidden;text-overflow:ellipsis}
  #statusbar .zoom{margin-left:8px;opacity:.85}

  /* 토스트(개입 안내) */
  #toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#323232;color:#fff;padding:8px 18px;border-radius:4px;font-size:12px;z-index:15;
    opacity:0;transition:.3s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.3)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast b{color:#ffd86b}

  @media (max-width:520px){
    #ribbon{height:54px}
    .btn{min-width:40px;padding:2px 4px 11px}.btn .lb{font-size:9.5px}
    #legend{font-size:10px;min-width:150px;padding:7px 9px;top:6px;right:8px}
    #namebox{width:60px}
    #menubar .m{padding:5px 6px}
    .qa{display:none !important}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <span class="t">三國演義.xlsx — Excel</span>
    <span class="qa">— □ ✕</span>
  </div>

  <div id="menubar">
    <div class="m">파일</div>
    <div class="m on" data-rb="home">홈</div>
    <div class="m" data-rb="insert">삽입</div>
    <div class="m" data-rb="layout">페이지 레이아웃</div>
    <div class="m" data-rb="formula">수식</div>
    <div class="m" data-rb="data">데이터</div>
    <div class="m" data-rb="view">보기</div>
    <div class="m" data-rb="help">도움말</div>
  </div>

  <div id="ribbon"><!-- JS가 채움 --></div>

  <div id="fbar">
    <div id="namebox"><span id="nbtxt">A1</span><span class="car">▾</span></div>
    <div id="fxlbl">fx</div>
    <div id="formula"></div>
  </div>

  <div id="body">
    <div class="pane" id="pane-map"><div id="sheet"></div></div>
    <div class="pane hide" id="pane-power"></div>
    <div class="pane hide" id="pane-chron"></div>
    <div class="pane hide" id="pane-dead"></div>
    <div id="legend"></div>
    <div id="toast"></div>
    <div id="win"><div class="card">
      <h1 id="win-t">天下統一</h1>
      <p id="win-s"></p>
      <p id="win-y"></p>
      <div class="fx" id="win-fx"></div>
      <button id="win-btn">=RESTART()  새 시대 열기</button>
    </div></div>
  </div>

  <div id="tabs">
    <div class="tb on" data-pane="map">전장도(戰場圖)</div>
    <div class="tb" data-pane="power">국력표</div>
    <div class="tb" data-pane="chron">연대기</div>
    <div class="tb" data-pane="dead" id="tab-dead">멸망기록 (0)</div>
    <div class="add">＋</div>
  </div>

  <div id="statusbar">
    <span id="sb-mode">준비</span>
    <span class="sep">|</span>
    <span class="ev" id="sb-event">천하가 어지러워지고 있다…</span>
    <span class="zoom" id="sb-zoom">합계: — &nbsp; ⊞ ▢ ▬ &nbsp; 100%</span>
  </div>
</div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);

/* ───────────────────── 그리드 치수 ───────────────────── */
const sheet = $('#sheet');
const isMobile = innerWidth < 560;
const CW = isMobile ? 25 : 32;
const CH = isMobile ? 24 : 22;
const RH = isMobile ? 24 : 30; // 행번호 칸 폭
// 잔여 폭에 정확히 맞춰 열 수 산정 (가로 스크롤 없게)
let COLS = Math.max(isMobile?12:16, Math.min(40, Math.floor((innerWidth - RH - 2) / CW)));
let ROWS;
function calcRows(){
  const used = 30+27+62+25+27+24; // 타이틀+메뉴+리본+수식바+탭+상태바
  ROWS = Math.max(14, Math.min(30, Math.floor((innerHeight - used - 22) / CH)));
}
calcRows();
let N = COLS*ROWS;
sheet.style.gridTemplateColumns = `${RH}px repeat(${COLS}, ${CW}px)`;
sheet.style.gridAutoRows = CH + 'px';

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(Math.floor(i/COLS)+1);}
function nbrs(i){const x=i%COLS,y=i/COLS|0,o=[];if(x>0)o.push(i-1);if(x<COLS-1)o.push(i+1);if(y>0)o.push(i-COLS);if(y<ROWS-1)o.push(i+COLS);return o;}
function dist(a,b){return Math.abs(a%COLS-b%COLS)+Math.abs((a/COLS|0)-(b/COLS|0));}

/* ───────────────────── 시트 DOM ───────────────────── */
const cellEls = new Array(N);
{
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd corner'; corner.style.left='0'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd col';h.textContent=colName(c);frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd row';h.textContent=r+1;frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d;frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

/* ───────────────────── 지형 노이즈 ───────────────────── */
const GW=9, GH=6, gz=[];
for(let i=0;i<GW*GH;i++) gz[i]=Math.random();
function noise(x,y){
  const fx=x/COLS*(GW-1), fy=y/ROWS*(GH-1);
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
  const a=gz[y0*GW+x0],b=gz[y0*GW+Math.min(GW-1,x0+1)];
  const c=gz[Math.min(GH-1,y0+1)*GW+x0],d=gz[Math.min(GH-1,y0+1)*GW+Math.min(GW-1,x0+1)];
  return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;
}

/* ───────────────────── 세계 상태 ─────────────────────
   삼국 = 고정 3국. 각 국은 도읍, 군주, 무장, 군세, 전선을 가진다.
   cell.st: water 江 / mountain 山 / forest 林 / land 野 / ruin 墟
   cell.owner: 0위 1촉 2오 / null 무주공산
   cell.kind: '' / 'capital' 도읍 / 'city' 성 / 'fort' 진 / 'farm' 둔전
   cell.morale 0..100 (전선 사기)
*/
const cells = new Array(N);
function genTerrain(){
  for(let i=0;i<N;i++){
    const x=i%COLS,y=i/COLS|0;
    const v=noise(x,y)+(Math.random()-.5)*.15;
    let st='land', hist=['황무지'];
    if(v<.30){st='water';hist=['강(江)'];}
    else if(v>.70&&Math.random()<.55){st='mountain';hist=['산(山)'];}
    else if(v>.58&&Math.random()<.55){st='forest';hist=['숲(林)'];}
    cells[i]={st,owner:null,kind:'',morale:0,hist,ruinT:0,siegeT:0};
  }
}

/* ── 삼국 정의 ── */
const KDEF = [
  {name:'위(魏)', full:'조위(曹魏)', color:'#2f6fd8', ruler:'조조', heirs:['조비','조예','조방','사마염'], side:'북', sym:'魏'},
  {name:'촉(蜀)', full:'촉한(蜀漢)', color:'#16a34a', ruler:'유비', heirs:['유선','강유','제갈첨'],            side:'서', sym:'蜀'},
  {name:'오(吳)', full:'동오(東吳)', color:'#dc2626', ruler:'손권', heirs:['손량','손휴','손호'],              side:'남', sym:'吳'}
];
const GENERALS = {
  0:['하후돈','장료','서황','허저','사마의','등애','종회','조인'],
  1:['관우','장비','조운','마초','황충','제갈량','위연','강유'],
  2:['주유','육손','감녕','태사자','노숙','여몽','정봉','육항']
};
let kingdoms = [];

function buildKingdoms(){
  kingdoms = KDEF.map((d,k)=>({
    id:k, ...d, alive:true,
    rulerName:d.ruler, dynasty:0, gens:[...GENERALS[k]], deadGens:[],
    arr:[], size:0, pop:0, golden:0, power:0, foundedY:1
  }));
  // 도읍 배치: 위=상단, 촉=좌하, 오=우하 영역에서 평지 탐색
  const want=[
    {cx:COLS*0.5, cy:ROWS*0.18},
    {cx:COLS*0.22, cy:ROWS*0.78},
    {cx:COLS*0.80, cy:ROWS*0.78}
  ];
  kingdoms.forEach((kg,k)=>{
    let best=-1,bd=1e9;
    for(let i=0;i<N;i++){
      if(cells[i].st!=='land'||cells[i].owner!==null) continue;
      const dx=i%COLS-want[k].cx, dy=(i/COLS|0)-want[k].cy;
      const d=dx*dx+dy*dy;
      if(d<bd){bd=d;best=i;}
    }
    if(best<0){for(let i=0;i<N;i++)if(cells[i].st==='land'&&cells[i].owner===null){best=i;break;}}
    setCell(best,k,'capital','도읍 창건');
    cells[best].morale=100;
    // 주변 3칸 초기 영토
    for(const nb of nbrs(best)){
      if(cells[nb].st==='land'&&cells[nb].owner===null){setCell(nb,k,'',(Math.random()<.5?'farm':''));cells[nb].morale=70;}
    }
    kg.capital=best;
  });
}

function setCell(i,owner,kind,histLabel){
  const c=cells[i];
  c.owner=owner; c.st='land';
  if(kind!==undefined) c.kind=kind;
  if(c.morale<40) c.morale=55;
  if(histLabel){c.hist.push(histLabel);if(c.hist.length>8)c.hist.shift();}
  dirty.add(i);
}

/* ───────────────────── 표시 ───────────────────── */
const dirty=new Set();
const fires=new Map();   // i -> 남은틱
const floods=new Map();  // i -> 남은틱 (수해)
let selected=-1;

function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}

const KIND_TXT = {capital:'',city:'城',fort:'砦',farm:'禾'};

function paint(i){
  const c=cells[i], el=cellEls[i];
  let bg='', tx='', col='#333', w='', cap='';
  el.classList.remove('cap-anim');
  if(fires.has(i)){bg='#ffd9b3';tx='火';col='#c00000';w='700';}
  else if(floods.has(i)){bg='#cfe2f3';tx='渦';col='#1d4e89';w='700';}
  else if(c.st==='water'){bg='#dbeaf7';tx='≈';col='#9dc3e6';}
  else if(c.st==='mountain'){bg='#efece4';tx='山';col='#9b8e6e';}
  else if(c.st==='forest'){bg='#e4efdb';tx='木';col='#6a9647';}
  else if(c.st==='ruin'){bg='#ededed';tx='墟';col='#a0a0a0';}
  else if(c.owner!==null){
    const kg=kingdoms[c.owner];
    if(c.kind==='capital'){bg=hexA(kg.color,.92);tx=kg.sym;col='#fff';w='800';el.classList.add('cap-anim');}
    else if(c.kind==='city'){bg=hexA(kg.color,.55);tx='城';col='#fff';w='700';}
    else if(c.kind==='fort'){bg=hexA(kg.color,.40);tx='砦';col=kg.color;w='700';}
    else if(c.kind==='farm'){bg=hexA(kg.color,.20);tx='禾';col=kg.color;}
    else {bg=hexA(kg.color,.15);tx='・';col=kg.color;}
    // 전선 표시: 적과 접한 영토
    if(c.morale<45 && c.kind!=='capital') cap='⚔';
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  el.textContent=tx;
  if(cap){const s=document.createElement('span');s.className='cap';s.textContent=cap;s.style.color='#c00';el.appendChild(s);}
}

/* 수식바 하이라이트 */
function fxHTML(s){
  return s
    .replace(/("[^"]*")/g,'<span class="str">$1</span>')
    .replace(/\b(\d{1,4})\b/g,'<span class="num">$1</span>')
    .replace(/=([A-Z_.]+)/g,'=<span class="kw">$1</span>');
}
function setFormula(s){ $('#formula').innerHTML = fxHTML(s); }

/* ───────────────────── 연대기 / 로그 ───────────────────── */
let year=184; // 황건적의 난(서기 184)
const chronicle=[];   // {y, msg, fx}
const obituaries=[];  // {who, y, fx}
let lastEvent='황건적의 난 — 천하가 분열되었다.';
let lastFx=`=THREE_KINGDOMS($A$1:$${colName(COLS-1)}$${ROWS}, "분열의 시대")`;

function logEvent(msg, fx, era){
  lastEvent = (era?'':`서기 ${year}년 — `)+msg;
  if(fx){ lastFx=fx; setFormula(fx); }
  chronicle.push({y:year,msg,fx:fx||''});
  if(chronicle.length>400) chronicle.shift();
  if(activePane==='chron') renderChron();
}

/* ───────────────────── 시뮬레이션 ───────────────────── */
let tickN=0, warCool=0, paused=false, speed=1, gameOver=false;
let unifyPressure=0, lastCollapseTick=0;  // 통일 압력(난세 수렴)
const contacts=new Set();   // 두 세력 첫 국경 접촉 1회 기록 (예 "0-1")
const firstCity=new Set();  // 각 국 첫 축성 기록
const PW={capital:5000,city:1600,fort:600,farm:260,'':90};

function tick(){
  if(paused||gameOver) return;
  tickN++; year++;
  if(warCool>0) warCool--;

  // 통일 압력: 개막 후 한참(약 150틱≈초반 균형) 지나면 점증, 멸망 없이 정체될수록 가속
  const aliveCount0 = kingdoms.filter(k=>k.alive&&k.size>0).length;
  const sinceCollapse = tickN - lastCollapseTick;
  unifyPressure = Math.max(0, (tickN-150)*0.025) + Math.max(0, (sinceCollapse-120)*0.06);
  if(aliveCount0<=2) unifyPressure += 6;   // 양강 구도면 결판을 재촉
  unifyPressure = Math.min(unifyPressure, 34);

  /* 집계 */
  for(const kg of kingdoms){kg.arr.length=0;kg.size=0;kg.pop=0;}
  for(let i=0;i<N;i++){
    const c=cells[i];
    if(c.st==='ruin'&&--c.ruinT<=0){c.st='land';c.hist.push('복구');dirty.add(i);}
    if(c.owner!==null){
      const kg=kingdoms[c.owner];
      if(kg&&kg.alive){kg.arr.push(i);kg.size++;kg.pop+=PW[c.kind]||90;}
      else{c.owner=null;c.kind='';dirty.add(i);}
    }
  }
  for(const kg of kingdoms){
    kg.power = Math.round(kg.pop/40 + kg.size*1.2 + (kg.golden?40:0) + kg.gens.length*8);
  }
  // 통일전쟁 모드: 압력이 임계 넘으면 최강국이 최약국을 흡수, 약자는 재기 불가
  const aliveSorted = kingdoms.filter(k=>k.alive&&k.size>0).sort((a,b)=>b.size-a.size);
  const leaderId = aliveSorted.length?aliveSorted[0].id:-1;
  const weakId = aliveSorted.length?aliveSorted[aliveSorted.length-1].id:-1;
  const endgame = unifyPressure>=16 && aliveSorted.length>=2;

  /* 멸망 판정 (도읍 함락 = 멸망) */
  for(const kg of kingdoms){
    if(!kg.alive) continue;
    const capLost = cells[kg.capital].owner!==kg.id;
    if(kg.size===0 || capLost){
      kg.alive=false;
      lastCollapseTick=tickN; unifyPressure=Math.max(8,unifyPressure-2);
      const fx=`=COLLAPSE("${kg.full}", ${year})`;
      obituaries.push({who:`${kg.full} — ${kg.rulerName} (서기 ${year}년 멸망)`, y:year, fx});
      logEvent(capLost?`${kg.full}이(가) 멸망했다. 도읍 ${ref(kg.capital)} 함락.`
                     :`${kg.full}이(가) 모든 영토를 잃고 멸망했다.`, fx);
      $('#tab-dead').textContent=`멸망기록 (${obituaries.length})`;
      if(activePane==='dead') renderDead();
    }
  }
  const live=kingdoms.filter(k=>k.alive);

  /* 천하통일 */
  if(live.length===1 && !gameOver){
    winner(live[0]); return;
  }
  if(live.length===0 && !gameOver){
    setStatus(); return;
  }

  /* 화재 번짐/소멸 */
  for(const [i,t] of [...fires]){
    if(Math.random()<.14){
      for(const n of nbrs(i)){const c=cells[n];if(c.owner!==null&&!fires.has(n)&&c.st==='land'&&c.kind!=='capital'){fires.set(n,5);dirty.add(n);}}
    }
    if(t<=1){
      fires.delete(i);const c=cells[i];
      c.owner=null;c.kind='';c.st='ruin';c.ruinT=120;c.morale=0;
      c.hist.push('잿더미');if(c.hist.length>8)c.hist.shift();dirty.add(i);
    } else fires.set(i,t-1);
  }
  /* 수해 */
  for(const [i,t] of [...floods]){
    if(t<=1){floods.delete(i);const c=cells[i];c.morale=Math.max(0,c.morale-20);dirty.add(i);}
    else floods.set(i,t-1);
    if(Math.random()<.10)for(const n of nbrs(i)){if(cells[n].st==='water'&&!floods.has(n)){}}
  }

  /* 각 국 행동 */
  for(const kg of kingdoms){
    if(!kg.alive){continue;}
    if(kg.golden>0) kg.golden--;
    if(kg.size===0) continue;

    /* 항복 — 통일전쟁 말기, 최약국은 매 틱 영토가 무너진다(결판 보장).
       잔존이 적거나 양강 구도면 가속 — 무한 교착을 방지한다. */
    if(endgame && kg.id===weakId){
      let crumble = 0;
      if(kg.size<=6) crumble = 1;
      else if(aliveCount0<=2) crumble = 1 + (kg.size>120?2:kg.size>40?1:0); // 양강 말기엔 점증
      for(let q=0;q<crumble;q++){
        const i = kg.arr[Math.random()*kg.arr.length|0];
        if(i===undefined || cells[i].owner!==kg.id) continue;
        const enemyN = nbrs(i).map(n=>cells[n]).find(c=>c.owner!==null&&c.owner!==kg.id);
        if(enemyN){ setCell(i, enemyN.owner, '', '항복 흡수'); cells[i].morale=50; }
        else { const c=cells[i]; c.owner=null; c.kind=''; c.st='ruin'; c.ruinT=80; c.hist.push('와해'); dirty.add(i); }
      }
    }

    /* 사기 회복 — 포위 중인 땅은 회복 불가(포위전이 결판나게) */
    for(const i of kg.arr){
      const c=cells[i];
      if(c.siegeT>0){ c.siegeT--; continue; }
      if(c.morale<100) c.morale=Math.min(100, c.morale + (c.kind==='capital'?3:1));
    }

    /* 확장 & 전쟁 */
    let attempts=1+(kg.size*.08|0)+(kg.golden?1:0);
    if(endgame){
      if(kg.id===leaderId) attempts += 3;            // 최강국 총공세
      if(kg.id===weakId)   attempts = Math.max(1, attempts-2); // 최약국 수세
    }
    // 통일전쟁 중 약자는 무주공산 개척 불가(재기 차단)
    const canClaimNeutral = !(endgame && kg.id===weakId);
    for(let a=0;a<attempts;a++){
      const src=kg.arr[Math.random()*kg.arr.length|0];
      if(src===undefined||cells[src].owner!==kg.id) continue;
      const nb=nbrs(src);
      const tgt=nb[Math.random()*nb.length|0];
      const tc=cells[tgt];
      if(tc.st==='water'||fires.has(tgt)) continue;
      if(tc.owner===null && canClaimNeutral){
        if(tc.st==='mountain'){ if(Math.random()<.10){tc.st='land';setCell(tgt,kg.id,'fort','산성 축조');tc.morale=60;} }
        else if(tc.st==='forest'){ if(Math.random()<.30){tc.st='land';setCell(tgt,kg.id,'','개간');tc.morale=60;} }
        else if(tc.st==='land') setCell(tgt,kg.id,'',55);
      } else if(tc.owner!==null && tc.owner!==kg.id){
        // 전선 접촉 → 사기 하락
        cells[src].morale=Math.max(30,cells[src].morale-2);
        tc.morale=Math.max(0,tc.morale-3);
        dirty.add(src);
        // 첫 국경 접촉 (1회, throttle 무시 — 난세 개막을 알린다)
        const defKg0=kingdoms[tc.owner];
        const pair=[kg.id,tc.owner].sort().join('-');
        if(!contacts.has(pair)){
          contacts.add(pair);
          logEvent(`${kg.name}과(와) ${defKg0.name}의 군대가 ${ref(tgt)} 국경에서 처음 맞붙었다.`,
            `=CONTACT("${kg.name}"↔"${defKg0.name}", ${ref(tgt)})`);
          warCool=Math.min(warCool,4);
        }
        if(Math.random() < .34 + unifyPressure*0.03){
          const defKg=kingdoms[tc.owner];
          // 공/수 산정: 공격국 군세·황금기, 수비 지형/도읍/사기
          let att=2+Math.random()*4 + kg.size*.0025 + (kg.golden?2:0);
          let def=Math.random()*3 + tc.morale*.03 +
                  (tc.kind==='capital'?9:tc.kind==='city'?4:tc.kind==='fort'?3:tc.kind==='farm'?1:0);
          // 무장 보너스
          if(kg.gens.length>defKg.gens.length) att+=1.2;
          // 국력 격차 가중 — 강성한 나라가 약소국을 압도(난세 수렴 유도)
          if(defKg.size>0){
            const ratio=kg.size/defKg.size;
            if(ratio>1.25) att += Math.min(8, (ratio-1)*3);
          }
          // 약소국 붕괴 가중 — 작아질수록 방어가 무너진다(death spiral)
          if(defKg.size<30) att += (30-defKg.size)*0.6;
          // 통일 압력 — 오랜 난세 끝엔 결판이 난다(서기 ~300년 이후 점증)
          att += unifyPressure;
          def = Math.max(0.5, def - unifyPressure*0.5);
          flashWar(tgt);
          if(att>def){
            if(Math.random()<.22 && tc.kind!=='capital'){
              fires.set(tgt,5);tc.hist.push('전화(戰火)');if(tc.hist.length>8)tc.hist.shift();dirty.add(tgt);
            } else if(tc.kind==='capital'){
              // 도읍 공방: 한 번에 안 떨어지고 사기로 깎음 + 포위로 회복 차단
              tc.morale-=26; tc.siegeT=6; dirty.add(tgt);
              if(tc.morale<=0){ setCell(tgt,kg.id,'city','도읍 함락'); }
              if(warCool===0){
                logEvent(`${kg.name}의 ${randGen(kg)} 군이 ${defKg.full}의 도읍 ${ref(tgt)}을 압박한다.`,
                  `=SIEGE("${kg.name}"→"${defKg.name}", ${ref(tgt)}, 사기:${Math.max(0,tc.morale|0)})`);
                warCool=7;
              }
            } else {
              const downKind = tc.kind==='city'?'fort':tc.kind==='fort'?'farm':'';
              setCell(tgt,kg.id,downKind,'점령');tc.morale=45;
              // 무장 전사/포로 가능성
              if(tc.kind==='city'&&defKg.gens.length>2&&Math.random()<.18){
                const g=defKg.gens.splice(Math.random()*defKg.gens.length|0,1)[0];
                defKg.deadGens.push(g);
                if(warCool===0){logEvent(`${defKg.name}의 명장 ${g}이(가) ${ref(tgt)} 전투에서 전사했다.`,
                  `=FALLEN("${defKg.name}", "${g}", ${ref(tgt)})`);warCool=6;}
              } else if((tc.kind==='city'||Math.random()<.15)&&warCool===0){
                logEvent(`${kg.name}이(가) ${defKg.name}의 ${ref(tgt)} ${tc.kind==='city'?'성':'땅'}을 점령했다.`,
                  `=CONQUER("${kg.name}"→"${defKg.name}", ${ref(tgt)})`);
                warCool=8;
              }
            }
          } else {
            // 수비 성공
            if(tc.kind==='capital'||tc.kind==='city'){
              if(warCool===0&&Math.random()<.5){
                logEvent(`${defKg.name}의 ${randGen(defKg)}이(가) ${ref(tgt)}에서 ${kg.name}군을 격퇴했다.`,
                  `=DEFEND("${defKg.name}", ${ref(tgt)}, "격퇴")`);
                warCool=9;
              }
            }
          }
        }
      }
    }

    /* 발전: 둔전→성→도읍방어 */
    const ups=1+(kg.size*.05|0);
    for(let u=0;u<ups;u++){
      const i=kg.arr[Math.random()*kg.arr.length|0];
      if(i===undefined||cells[i].owner!==kg.id)continue;
      const c=cells[i];
      const r=Math.random()*(kg.golden?2.4:1);
      if(c.kind===''&&r<.05){c.kind='farm';c.hist.push('둔전');dirty.add(i);}
      else if(c.kind==='farm'&&r<.035){c.kind='fort';c.hist.push('축성');dirty.add(i);}
      else if(c.kind==='fort'&&r<.025){
        c.kind='city';c.hist.push('성 승격');dirty.add(i);
        const fc=!firstCity.has(kg.id);
        if(fc) firstCity.add(kg.id);
        if(fc||warCool===0){logEvent(`${kg.name}이(가) ${ref(i)}에 ${fc?'첫 ':''}성을 쌓았다.`,`=BUILD("성", "${kg.name}", ${ref(i)})`);warCool=fc?Math.min(warCool,4):9;}
      }
    }
  }

  /* 무작위 사건 */
  randomEvent();

  /* 그리기 */
  for(const i of dirty) paint(i);
  dirty.clear();

  setStatus();
  if(tickN%6===0){ renderLegend(); if(activePane==='power') renderPower(); }
}

function randGen(kg){ return kg.gens.length? kg.gens[Math.random()*kg.gens.length|0] : kg.rulerName; }

function randomEvent(){
  const r=Math.random();
  const live=kingdoms.filter(k=>k.alive&&k.size>0);
  if(!live.length) return;
  if(r<.006){ // 대화재
    const t=cells.map((c,i)=>({c,i})).filter(o=>o.c.owner!==null&&(o.c.kind==='city'||o.c.kind==='fort'));
    if(t.length){const o=t[Math.random()*t.length|0];fires.set(o.i,6);dirty.add(o.i);
      logEvent(`${ref(o.i)}에 화공(火攻)으로 대화재가 일었다.`,`=FIRE(${ref(o.i)})`);}
  } else if(r<.012){ // 수해 (적벽 같은 강가)
    const w=[];for(let i=0;i<N;i++)if(cells[i].st==='land'&&cells[i].owner!==null&&nbrs(i).some(n=>cells[n].st==='water'))w.push(i);
    if(w.length){const i=w[Math.random()*w.length|0];floods.set(i,7);dirty.add(i);
      logEvent(`${ref(i)} 일대에 강물이 범람했다.`,`=FLOOD(${ref(i)})`);}
  } else if(r<.018 && live.length){ // 황금기
    const kg=live[Math.random()*live.length|0];kg.golden=110;
    logEvent(`${kg.full}에 명재상이 등용되어 국력이 융성하다.`,`=PROSPER("${kg.name}", 110)`);
  } else if(r<.024){ // 무장 등장
    const kg=live[Math.random()*live.length|0];
    if(kg.deadGens.length&&Math.random()<.4){
      // (재등용 안 함, 새 인물 풀에서)
    }
    const pool=['신예 장수','젊은 책사','떠돌이 협객','항장(降將)'];
    const g=pool[Math.random()*pool.length|0];
    kg.gens.push(g);
    if(warCool===0){logEvent(`${kg.full}에 ${g}이(가) 투신했다.`,`=RECRUIT("${kg.name}", "${g}")`);warCool=7;}
  } else if(r<.028){ // 군주 승하 → 후계
    const kg=live[Math.random()*live.length|0];
    if(kg.dynasty < kg.heirs.length){
      const old=kg.rulerName;
      kg.rulerName=kg.heirs[kg.dynasty];kg.dynasty++;
      logEvent(`${kg.name}의 군주 ${old} 승하 — ${kg.rulerName}이(가) 보위에 올랐다.`,
        `=SUCCESSION("${kg.name}", "${old}"→"${kg.rulerName}")`);
    }
  }
}

function flashWar(i){const el=cellEls[i];el.classList.add('war');setTimeout(()=>el.classList.remove('war'),1100);}

/* ───────────────────── 천하통일 ───────────────────── */
function winner(kg){
  gameOver=true;
  const fx=`=UNIFY("${kg.full}", "${kg.rulerName}", ${year})`;
  logEvent(`${kg.full}이(가) 천하를 통일했다! ${year-184}년의 난세가 끝났다.`, fx);
  setFormula(fx);
  $('#win-t').textContent='天下統一';
  $('#win-t').style.color=kg.color;
  $('#win-s').innerHTML=`<b style="color:${kg.color}">${kg.full}</b> — ${kg.rulerName}의 이름으로 난세가 평정되었다.`;
  $('#win-y').textContent=`서기 184년 ~ ${year}년 · ${year-184}년간의 삼국지`;
  $('#win-fx').innerHTML=fxHTML(fx);
  $('#win').style.display='flex';
  setStatus();
}

/* ───────────────────── 상태바 ───────────────────── */
function setStatus(){
  const live=kingdoms.filter(k=>k.alive);
  $('#sb-mode').textContent = paused?'⏸ 일시정지':(gameOver?'완료':'준비');
  const totalPop=kingdoms.reduce((s,k)=>s+(k.alive?k.pop:0),0);
  $('#sb-event').innerHTML = lastEvent;
  $('#sb-zoom').innerHTML = `세력 ${live.length}국 · 총인구 ${(totalPop).toLocaleString()} &nbsp; ⊞&nbsp;${speed}×`;
  document.title = `三國演義.xlsx — Excel (서기 ${year}년)`;
}

/* ───────────────────── 범례 ───────────────────── */
let legendMin=false;
function renderLegend(){
  const lg=$('#legend');
  if(legendMin){ lg.classList.add('min'); lg.innerHTML='<b>▣ 세력</b>'; return; }
  lg.classList.remove('min');
  const live=kingdoms.filter(k=>k.alive);
  const max=Math.max(1,...kingdoms.map(k=>k.power));
  let h='<h4>三 國 세 력 도</h4>';
  for(const kg of kingdoms){
    const dead=!kg.alive;
    h+=`<div class="row" style="${dead?'opacity:.4;text-decoration:line-through':''}">
      <span><span class="sw" style="background:${kg.color}"></span><b>${kg.name}</b> ${kg.rulerName}${kg.golden?' <span class="gold">✦</span>':''}</span>
      <span>${kg.size}칸</span></div>`;
  }
  h+='<div class="small">';
  h+='≈강 木숲 山산 城성 砦진 禾둔전 火전화 渦수해 ⚔전선<br>';
  h+='셀 클릭 = 그 땅의 역사 · 도읍셀 클릭 = 개입';
  h+='</div>';
  lg.innerHTML=h;
}
$('#legend').addEventListener('click',e=>{
  if(e.target.closest('.row')||e.target.closest('.small')) return;
  // 헤더 클릭으로 접기/펼치기
  if(e.target.tagName==='H4'||legendMin){ legendMin=!legendMin; renderLegend(); }
});

/* ───────────────────── 데이터 시트들 ───────────────────── */
let activePane='map';
function renderPower(){
  const p=$('#pane-power');
  const max=Math.max(1,...kingdoms.map(k=>k.power));
  let h=`<table class="dtable"><tr><th class="rh"></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th><th>G</th></tr>`;
  h+=`<tr><td class="rh">1</td><th class="nm">국가</th><th>군주</th><th>영토</th><th>인구</th><th>무장</th><th>국력지수</th><th>비고</th></tr>`;
  kingdoms.forEach((kg,k)=>{
    const w=Math.round(kg.power/max*100);
    h+=`<tr><td class="rh">${k+2}</td>
      <td class="nm" style="color:${kg.color}">${kg.full}</td>
      <td>${kg.alive?kg.rulerName:'—'}</td>
      <td>${kg.size}</td>
      <td>${kg.pop.toLocaleString()}</td>
      <td>${kg.alive?kg.gens.length:0}명</td>
      <td class="bar"><div class="fill" style="width:${kg.alive?Math.max(8,w):0}%;background:${kg.color}">${kg.alive?kg.power:''}</div></td>
      <td>${kg.alive?(kg.golden?'황금기 ✦':'교전중'):'멸망'}</td></tr>`;
  });
  const tp=kingdoms.reduce((s,k)=>s+(k.alive?k.pop:0),0);
  h+=`<tr><td class="rh">5</td><th class="nm">합계</th><td></td>
     <td>${kingdoms.reduce((s,k)=>s+(k.alive?k.size:0),0)}</td>
     <td>${tp.toLocaleString()}</td><td></td><td></td><td>서기 ${year}년</td></tr>`;
  h+='</table>';
  h+=`<div style="padding:14px 4px;color:#888;font-family:Consolas,monospace;font-size:11px">`+
     fxHTML(`=POWER.INDEX(전장도!$A$1:$${colName(COLS-1)}$${ROWS})  // 매 틱 자동 재계산`)+`</div>`;
  p.innerHTML=h;
}
function renderChron(){
  const p=$('#pane-chron');
  let h='<div class="logsheet">';
  const arr=chronicle.slice(-200).reverse();
  for(const e of arr){
    const fx=e.fx?` <span style="color:#9a9a9a">${fxHTML(e.fx)}</span>`:'';
    h+=`<div class="lr"><div class="a">${e.y}</div><div class="b"><span class="yr">서기 ${e.y}년</span> — ${e.msg}${fx}</div></div>`;
  }
  if(!arr.length) h+='<div class="lr"><div class="a">184</div><div class="b">아직 기록된 사건이 없다.</div></div>';
  h+='</div>';
  p.innerHTML=h;
  p.scrollTop=0;
}
function renderDead(){
  const p=$('#pane-dead');
  let h='<div class="logsheet">';
  if(!obituaries.length){
    h+='<div class="lr"><div class="a">—</div><div class="b" style="color:#888">아직 멸망한 나라가 없다. 삼국이 모두 건재하다.</div></div>';
  } else {
    obituaries.slice().reverse().forEach((o,i)=>{
      h+=`<div class="lr"><div class="a">†</div><div class="b">${o.who} &nbsp; <span style="color:#9a9a9a">${fxHTML(o.fx)}</span></div></div>`;
    });
  }
  h+='</div>';
  p.innerHTML=h;
}

/* ───────────────────── 탭 전환 ───────────────────── */
const panes={map:'#pane-map',power:'#pane-power',chron:'#pane-chron',dead:'#pane-dead'};
document.querySelectorAll('#tabs .tb').forEach(tb=>{
  tb.addEventListener('click',()=>{
    document.querySelectorAll('#tabs .tb').forEach(x=>x.classList.remove('on'));
    tb.classList.add('on');
    activePane=tb.dataset.pane;
    Object.values(panes).forEach(s=>$(s).classList.add('hide'));
    $(panes[activePane]).classList.remove('hide');
    $('#legend').style.display = activePane==='map'?'block':'none';
    if(activePane==='power')renderPower();
    if(activePane==='chron')renderChron();
    if(activePane==='dead')renderDead();
  });
});

/* ───────────────────── 셀 클릭 = 역사 / 도읍 = 개입 ───────────────────── */
let cmdMode=null; // 'deploy' | 'build'
sheet.addEventListener('click',e=>{
  const t=e.target.closest('.cell'); if(!t)return;
  if(selected>=0&&cellEls[selected]) cellEls[selected].classList.remove('sel');
  selected=+t.dataset.i; t.classList.add('sel');
  $('#nbtxt').textContent=ref(selected);
  const c=cells[selected];

  if(cmdMode){ applyCommand(selected); return; }

  // 도읍/성 클릭 시 개입 가능 안내, 그 외 역사
  if(c.owner!==null && (c.kind==='capital'||c.kind==='city')){
    const kg=kingdoms[c.owner];
    if(kg.alive){
      setFormula(`=INSPECT("${kg.full}", ${ref(selected)}, 사기:${c.morale|0}) // 리본의 [원군]/[축성]으로 개입`);
      toast(`<b>${kg.name}</b> ${c.kind==='capital'?'도읍':'성'} ${ref(selected)} 선택 — 리본의 <b>원군 파병</b>/<b>축성령</b>으로 개입하세요.`);
      return;
    }
  }
  setFormula(`=HISTORY(${ref(selected)}; ${c.hist.map(x=>`"${x}"`).join(' → ')})`);
});

function applyCommand(i){
  const c=cells[i];
  if(cmdMode==='deploy'){
    if(c.owner===null){ toast('아군 영토에만 원군을 보낼 수 있다.'); }
    else{
      const kg=kingdoms[c.owner];
      c.morale=Math.min(100,c.morale+45);
      for(const n of nbrs(i)){if(cells[n].owner===c.owner){cells[n].morale=Math.min(100,cells[n].morale+20);dirty.add(n);}}
      dirty.add(i); paint(i);
      logEvent(`${kg.name}의 ${ref(i)}에 원군이 당도해 사기가 올랐다. (군주의 명)`,`=DEPLOY("${kg.name}", ${ref(i)}, +사기)`);
      toast(`<b>원군 파병</b> → ${kg.name} ${ref(i)} 사기 회복!`);
    }
  } else if(cmdMode==='build'){
    if(c.owner===null||c.kind==='capital'){ toast('도읍이 아닌 아군 영토에 축성하세요.'); }
    else{
      const kg=kingdoms[c.owner];
      c.kind = c.kind==='city'?'city':c.kind==='fort'?'city':'fort';
      c.morale=Math.min(100,c.morale+15);
      dirty.add(i); paint(i);
      logEvent(`${kg.name}이(가) ${ref(i)}에 축성령을 내려 ${c.kind==='city'?'성':'진'}을 세웠다.`,`=BUILD("${c.kind==='city'?'성':'진'}", "${kg.name}", ${ref(i)})`);
      toast(`<b>축성령</b> → ${kg.name} ${ref(i)} 방어 강화!`);
    }
  }
  endCmd();
}
function startCmd(m){ cmdMode=m; document.body.style.cursor='crosshair';
  toast(m==='deploy'?'아군 <b>영토 셀</b>을 클릭해 원군을 보내세요. (ESC 취소)':'아군 <b>영토 셀</b>을 클릭해 성을 쌓으세요. (ESC 취소)');
  setFormula(m==='deploy'?'=DEPLOY( ▮ 대상 셀 선택 )':'=BUILD( ▮ 대상 셀 선택 )');
}
function endCmd(){ cmdMode=null; document.body.style.cursor=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){endCmd();toast('명령 취소');} });

/* ───────────────────── 토스트 ───────────────────── */
let toastT;
function toast(html){const el=$('#toast');el.innerHTML=html;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600);}

/* ───────────────────── 리본 ───────────────────── */
const RIBBONS={
  home:[
    {g:'난세 제어',btns:[
      {ic:'⏸',lb:'정지/재개',acc:1,fn:togglePause,id:'btn-pause'},
      {ic:'⏩',lb:'속도',fn:cycleSpeed,id:'btn-speed'},
    ]},
    {g:'군주의 명',btns:[
      {ic:'⚑',lb:'원군 파병',acc:1,fn:()=>startCmd('deploy')},
      {ic:'城',lb:'축성령',acc:1,fn:()=>startCmd('build')},
    ]},
    {g:'천하',btns:[
      {ic:'⟳',lb:'새 시대',fn:restart},
    ]},
  ],
  insert:[{g:'개입',btns:[
      {ic:'⚑',lb:'원군',acc:1,fn:()=>startCmd('deploy')},
      {ic:'城',lb:'성',acc:1,fn:()=>startCmd('build')},
      {ic:'⚔',lb:'전선보기',fn:()=>{toast('⚔ 표시 = 적과 접한 전선 영토');}},
  ]}],
  layout:[{g:'시트',btns:[
      {ic:'⊞',lb:'전장도',fn:()=>switchTab('map')},
      {ic:'∑',lb:'국력표',fn:()=>switchTab('power')},
  ]}],
  formula:[{g:'함수',btns:[
      {ic:'∑',lb:'국력지수',fn:()=>{switchTab('power');}},
      {ic:'fx',lb:'SIEGE',fn:()=>toast('=SIEGE() 도읍 공방 함수')},
      {ic:'fx',lb:'UNIFY',fn:()=>toast('=UNIFY() 천하통일 판정')},
  ]}],
  data:[{g:'기록',btns:[
      {ic:'≡',lb:'연대기',fn:()=>switchTab('chron')},
      {ic:'†',lb:'멸망기록',fn:()=>switchTab('dead')},
  ]}],
  view:[{g:'표시',btns:[
      {ic:'⏸',lb:'정지/재개',fn:togglePause},
      {ic:'▣',lb:'범례접기',fn:()=>{legendMin=!legendMin;renderLegend();}},
  ]}],
  help:[{g:'정보',btns:[
      {ic:'?',lb:'유래',fn:()=>toast('황건적의 난(184)에서 천하통일까지 — 위·촉·오 삼국지를 엑셀 셀 위에 시뮬레이션')},
  ]}],
};
function renderRibbon(name){
  const rb=$('#ribbon'); rb.innerHTML='';
  for(const grp of RIBBONS[name]||[]){
    const g=document.createElement('div'); g.className='grp';
    const row=document.createElement('div'); row.className='gbtns';
    for(const b of grp.btns){
      const el=document.createElement('div'); el.className='btn'+(b.acc?' acc':'');
      if(b.id) el.id=b.id;
      el.innerHTML=`<span class="ic">${b.ic}</span><span class="lb">${b.lb}</span>`;
      el.addEventListener('click',b.fn);
      row.appendChild(el);
    }
    g.appendChild(row);
    const gl=document.createElement('span'); gl.className='gl'; gl.textContent=grp.g; g.appendChild(gl);
    rb.appendChild(g);
  }
}
document.querySelectorAll('#menubar .m[data-rb]').forEach(m=>{
  m.addEventListener('click',()=>{
    document.querySelectorAll('#menubar .m').forEach(x=>x.classList.remove('on'));
    m.classList.add('on'); renderRibbon(m.dataset.rb);
  });
});
function switchTab(p){ document.querySelector(`#tabs .tb[data-pane="${p}"]`).click(); }

function togglePause(){ paused=!paused; const b=$('#btn-pause'); if(b)b.querySelector('.ic').textContent=paused?'▶':'⏸'; setStatus(); toast(paused?'⏸ 시간 정지':'▶ 시간 재개'); }
function cycleSpeed(){ speed = speed===1?2:speed===2?4:1; restartTimer(); toast(`속도 ${speed}×`); setStatus(); }

/* ───────────────────── 타이머 ───────────────────── */
let timer=null;
function restartTimer(){ if(timer)clearInterval(timer); timer=setInterval(tick, Math.round(150/speed)); }

/* ───────────────────── 시작 / 재시작 ───────────────────── */
function init(){
  gameOver=false; paused=false; speed=1; year=184; tickN=0; warCool=0;
  chronicle.length=0; obituaries.length=0; fires.clear(); floods.clear();
  contacts.clear(); firstCity.clear();
  unifyPressure=0; lastCollapseTick=0;
  selected=-1; cmdMode=null; document.body.style.cursor='';
  $('#win').style.display='none';
  $('#tab-dead').textContent='멸망기록 (0)';
  for(const k in gz) gz[k]=Math.random();
  genTerrain(); buildKingdoms();
  for(let i=0;i<N;i++) paint(i);
  lastEvent='황건적의 난(184) — 천하가 셋으로 갈라졌다.';
  setFormula(`=THREE_KINGDOMS($A$1:$${colName(COLS-1)}$${ROWS}, "위 · 촉 · 오")`);
  chronicle.push({y:184,msg:'황건적의 난 — 위·촉·오 삼국이 정립(鼎立)했다.',fx:'=THREE_KINGDOMS()'});
  renderLegend(); setStatus();
  if(activePane!=='map') renderPower(),renderChron(),renderDead();
  restartTimer();
}
function restart(){ init(); switchTab('map'); toast('새 난세가 시작되었다.'); }
$('#win-btn').addEventListener('click',restart);

renderRibbon('home');
init();
})();
</script>
</body>
</html>
