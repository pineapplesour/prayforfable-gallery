<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>성문수성.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #app{display:flex;flex-direction:column;height:100%}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:none}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;flex:none;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  /* 리본 (홈 탭의 컨트롤 묶음을 게임 도구로 위장) */
  #ribbon{height:46px;background:#f9f9f9;display:flex;align-items:center;
    border-bottom:1px solid #e1e1e1;padding:0 6px;gap:2px;flex:none;overflow-x:auto}
  .rgrp{display:flex;align-items:center;gap:3px;padding:0 8px;border-right:1px solid #e6e6e6;height:100%}
  .rbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;

  .rbtn.on{background:#d6ebdd;outline:1px solid #9ccfb0}
  .rbtn .ic{font-size:15px;line-height:16px}
  .rbtn .lb{font-size:10px;margin-top:2px;white-space:nowrap}
  .rlbl{font-size:9.5px;color:#9a9a9a;align-self:flex-end;padding:0 4px 1px}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px;flex:none}
  #namebox{width:64px;height:100%;border-right:1px solid #d4d4d4;display:flex;

  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;

  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1;min-height:0}
  #sheet{display:grid;background:#fff;position:absolute;top:0;left:0}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:10.5px}
  .cell{border-right:1px solid #ececec;border-bottom:1px solid #ececec;
    position:relative;display:flex;align-items:center;justify-content:center;font-size:12px;
    overflow:hidden;cursor:cell;line-height:1}
  .cell.path{background:#fde9d0}
  .cell.spawn{background:#fbd0a3}
  .cell.gate{background:#e7d9f5}
  .cell.buildable{cursor:pointer}
  .cell.ghost{outline:2px dashed #107c41;outline-offset:-2px;z-index:3}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:4}
  .glyph{position:relative;z-index:2;pointer-events:none}
  /* HP 막대 (셀 하단 미니바) */
  .hpbar{position:absolute;left:1px;right:1px;bottom:1px;height:2.5px;background:#e3b7b7;z-index:5;border-radius:1px;overflow:hidden}
  .hpbar > i{display:block;height:100%;background:#159b3a}
  .rng{position:absolute;border-radius:50%;border:1px solid rgba(16,124,65,.35);background:rgba(16,124,65,.05);pointer-events:none;z-index:1;display:none}
  @keyframes hit{0%{filter:brightness(2)}100%{filter:none}}
  .cell.gatehit{animation:hit .4s}
  #legend{position:absolute;top:8px;right:12px;background:#fffce6;border:1px solid #d8c66a;
    box-shadow:2px 3px 8px rgba(0,0,0,.18);padding:8px 11px;font-size:11px;z-index:8;
    min-width:172px;line-height:1.65}
  #legend h4{margin:0 0 3px;font-size:11px;color:#7a6a1f}
  #legend .sw{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:middle;border-radius:2px}
  #legend .bar{height:6px;border-radius:3px;background:#ddd;margin:1px 0 4px;overflow:hidden}
  #legend .bar > i{display:block;height:100%}
  #legend .mut{color:#9a8a4a;font-size:10px}
  #toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);
    background:rgba(16,124,65,.93);color:#fff;padding:5px 14px;border-radius:14px;font-size:11.5px;z-index:9;
    opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1}
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;flex:none;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 9px;opacity:.5}
  #statusbar b{color:#fff}
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:26px;
    border-top:1px solid #d4d4d4;font-size:11.5px;flex:none}
  #tabs div{padding:3px 13px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  /* 보조 시트(전황/격파기록) 패널 — 시트 위에 겹쳐 표시 */
  #panel{position:absolute;inset:0;background:#fff;z-index:7;overflow:auto;display:none;padding:10px 14px}
  #panel h3{margin:2px 0 8px;font-size:13px;color:#107c41}
  #panel table{border-collapse:collapse;font-size:11.5px;width:100%;max-width:760px}
  #panel th,#panel td{border:1px solid #e0e0e0;padding:3px 8px;text-align:left}
  #panel th{background:#f5f5f5;color:#555;font-weight:600}
  #panel td.f{font-family:Consolas,Menlo,monospace;color:#1a4a2a;font-size:11px}
  #panel tr.mon td.f{color:#7a1010}
  @media (max-width:560px){
    #menubar i:nth-child(n+5){display:none}
    .rlbl{display:none}
    #ribbon{height:42px}
    .rbtn{min-width:40px;height:38px}
  }
</style>

<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <span id="ttl">성문수성.xlsx - Excel</span>
  </div>
  <div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
  <div id="ribbon">
    <div class="rgrp">
      <div class="rbtn" id="btnPause"><div class="ic" style="letter-spacing:-1px">▮▮</div><div class="lb">일시정지</div></div>
      <div class="rbtn" id="btnSpeed"><div class="ic">▶</div><div class="lb">속도 ×1</div></div>
      <div class="rlbl">시뮬레이션</div>
    </div>
    <div class="rgrp">
      <div class="rbtn" id="btnWave"><div class="ic" style="color:#7a0000;font-weight:700">✦</div><div class="lb">웨이브 소환</div></div>
      <div class="rlbl">몬스터</div>
    </div>
    <div class="rgrp" id="towerGroup">
      <!-- 타워 버튼 동적 생성 -->
      <div class="rlbl">셀에 설치 (직접)</div>
    </div>
    <div class="rgrp">
      <div class="rbtn" id="btnAuto" class="on"><div class="ic" style="font-size:11px;font-weight:700">AI</div><div class="lb">디펜더 AI</div></div>
      <div class="rlbl">자동 수성</div>
    </div>
  </div>
  <div id="fbar">
    <div id="namebox">A1</div>
    <div id="fx">fx</div>
    <div id="formula"></div>
  </div>
  <div id="sheetwrap">
    <div id="sheet"></div>
    <div id="legend"></div>
    <div id="panel"></div>
    <div id="toast"></div>
  </div>
  <div id="tabs">
    <div class="on" data-sheet="field">전장</div>
    <div data-sheet="status">전황</div>
    <div data-sheet="kills">격파기록 (0)</div>
  </div>
  <div id="statusbar"></div>
</div>

<script>
"use strict";
(() => {
//==================================================================
// 성문수성.xlsx — 엑셀로 위장한 타워 디펜스 (관전 기본, 양측 AI, 절차생성 웨이브)
// 테마: 스프레드시트 왕국의 성문 수성
//==================================================================

const sheet   = document.getElementById('sheet');
const fmla    = document.getElementById('formula');
const namebox = document.getElementById('namebox');
const statusbar = document.getElementById('statusbar');
const legend  = document.getElementById('legend');
const panel   = document.getElementById('panel');
const toastEl = document.getElementById('toast');
const towerGroup = document.getElementById('towerGroup');

//----- 그리드 크기: 화면에 맞춰 반응형 -----
let CW, CH, COLS, ROWS, N;
function computeGrid() {
  const vw = sheet.parentElement.clientWidth;
  const vh = sheet.parentElement.clientHeight;
  // 셀 크기: 넓은 화면이면 크게, 좁으면 작게
  CW = vw > 900 ? 38 : 28;
  CH = vw > 900 ? 24 : 22;
  COLS = Math.max(14, Math.min(34, Math.floor((vw - 46) / CW)));
  ROWS = Math.max(11, Math.min(22, Math.floor((vh - 4) / CH)));
  N = COLS * ROWS;
}

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(Math.floor(i/COLS)+1);}
function xy(i){return [i%COLS, i/COLS|0];}
function idx(x,y){return y*COLS+x;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=arr=>arr[Math.random()*arr.length|0];

//==================================================================
// 절차적 경로 생성: 좌측 spawn → 우측 gate, S자 굽이
//==================================================================
let path=[];          // 경로 셀 인덱스 (순서대로)
let pathSet=new Set();
let spawnIdx=0, gateIdx=0;
let pathDir=[];       // 각 path 셀에서 다음 셀 방향 [dx,dy]

function genPath() {
  path=[]; pathSet=new Set(); pathDir=[];
  const startY = clamp((Math.random()*ROWS|0), 1, ROWS-2);
  let x=0, y=startY;
  spawnIdx=idx(x,y);
  const cells=[[x,y]];
  const used=new Set([idx(x,y)]);
  // 굽이치며 오른쪽으로 진행
  let guard=0;
  while(x<COLS-1 && guard++<2000){
    // 후보: 오른쪽 우선, 가끔 상/하
    const opts=[];
    if(x<COLS-1) opts.push([1,0],[1,0],[1,0]);          // 오른쪽 가중
    if(y>1)      opts.push([0,-1]);
    if(y<ROWS-2) opts.push([0,1]);
    let moved=false;
    // 셔플하여 자연스러운 굽이
    for(let t=0;t<opts.length;t++){
      const o=pick(opts);
      const nx=x+o[0], ny=y+o[1];
      if(nx<0||nx>=COLS||ny<1||ny>=ROWS-1) continue;
      const ni=idx(nx,ny);
      if(used.has(ni)) continue;
      // 인접 경로(자기 직전 제외)와 붙지 않게 — 통로 폭 유지
      let touch=0;
      for(const [ddx,ddy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const ax=nx+ddx, ay=ny+ddy;
        if(used.has(idx(ax,ay))) touch++;
      }
      if(touch>1 && o[0]===0) continue; // 수직 이동 시 자기겹침 방지
      x=nx; y=ny; used.add(ni); cells.push([x,y]); moved=true; break;
    }
    if(!moved){ x++; if(x>=COLS)break; const ni=idx(x,y); if(!used.has(ni)){used.add(ni);cells.push([x,y]);} }
  }
  // 우측 끝 보정
  if(x<COLS-1){ while(x<COLS-1){x++; const ni=idx(x,y); used.add(ni); cells.push([x,y]);} }
  gateIdx=idx(COLS-1,y);
  for(const [cx,cy] of cells){ const i=idx(cx,cy); path.push(i); pathSet.add(i); }
  for(let k=0;k<path.length;k++){
    const [cx,cy]=xy(path[k]);
    if(k<path.length-1){ const [nx,ny]=xy(path[k+1]); pathDir.push([Math.sign(nx-cx),Math.sign(ny-cy)]); }
    else pathDir.push([1,0]);
  }
}

//==================================================================
// 타워 / 몬스터 정의
//==================================================================
// 타워: 셀 기반. range는 셀 단위 유클리드 거리.
const TOWERS={
  arrow : {name:'화살탑',  glyph:'➹', col:'#107c41', cost:50,  dmg:9,  range:2.4, rate:0.55, slow:0, splash:0, desc:'기본 단일 공격'},
  cannon: {name:'대포',    glyph:'◎', col:'#b45309', cost:120, dmg:34, range:2.0, rate:1.35, slow:0, splash:1.3, desc:'범위 폭발'},
  frost : {name:'서리탑',  glyph:'❄', col:'#0d6efd', cost:90,  dmg:5,  range:2.2, rate:0.8,  slow:0.45,splash:0,  desc:'둔화'},
  arcane: {name:'비전탑',  glyph:'✦', col:'#7c3aed', cost:170, dmg:22, range:3.1, rate:0.7,  slow:0, splash:0, pierce:true, desc:'장거리 관통'},
};
const TOWER_KEYS=Object.keys(TOWERS);
// 업그레이드: 레벨당 dmg·range 강화, 비용 증가
function upCost(t){return Math.round(TOWERS[t.kind].cost*0.8*Math.pow(1.6,t.lvl));}

// 몬스터: hp/speed/bounty. 절차생성으로 조합.
const MOBS={
  grub : {name:'버그',     glyph:'●', col:'#5a5a5a', hp:26,  spd:1.7, bounty:7,  dmg:1},
  runner:{name:'런타임',   glyph:'»', col:'#c2410c', hp:18,  spd:3.1, bounty:9,  dmg:1},
  tank : {name:'널포인터', glyph:'■', col:'#1f2937', hp:120, spd:1.0, bounty:20, dmg:2},
  swarm: {name:'스택오버', glyph:'∴', col:'#9333ea', hp:12,  spd:2.2, bounty:4,  dmg:1},
  boss : {name:'커널패닉', glyph:'☠', col:'#7a0000', hp:600, spd:0.9, bounty:90, dmg:6},
};

//==================================================================
// 게임 상태
//==================================================================
let cells=[];     // 셀 메타: {tower:null|obj}
let towers=[];    // 설치된 타워 {kind,lvl,i,x,y,cd,...}
let mobs=[];      // 진군 중 몬스터 {kind,hp,maxhp,p(경로진행 0..len),slowT,...}
let projectiles=[]; // 시각 효과용

let defGold=180;   // 디펜더 자금
let monGold=60;    // 몬스터 자금
let gateHP=100, gateMax=100;
let wave=0;
let lives=gateHP;
let running=true, speed=1;
let selectedTower=null;  // 사람이 고른 타워 종류 (ghost 설치용)
let selectedCell=-1;
let autoDefend=true;     // 디펜더 AI on/off
let tickAcc=0;
let lastTime=0;
let result=null;  // 'win'|'lose'|null
let killCount=0;

// 로그 (전황 / 격파기록 시트)
const statusLog=[]; // {y, side:'def'|'mon', f, msg}
const killLog=[];   // {wave, kind, by}
let simTime=0;      // 초 단위 (게임 내)
let sheetView='field';

function logF(side, f, msg){
  statusLog.push({t:simTime.toFixed(1), side, f, msg});
  if(statusLog.length>400) statusLog.shift();
  fmla.textContent=f;
  if(sheetView==='status') renderStatusSheet();
}

//==================================================================
// DOM 빌드
//==================================================================
let cellEls=[];
function buildSheet(){
  computeGrid();
  sheet.innerHTML='';
  cellEls=new Array(N);
  sheet.style.gridTemplateColumns=`44px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows=CH+'px';
  const frag=document.createDocumentFragment();
  const corner=document.createElement('div'); corner.className='hd'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd';h.textContent=colName(c);frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd';h.textContent=r+1;frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d;frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

// 셀 클래스/내용 초기 칠
function paintTerrain(){
  for(let i=0;i<N;i++){
    const el=cellEls[i];
    el.className='cell';
    el.innerHTML='';
    if(i===spawnIdx) el.classList.add('spawn');
    else if(i===gateIdx) el.classList.add('gate');
    else if(pathSet.has(i)) el.classList.add('path');
    else el.classList.add('buildable');
  }
  // spawn / gate 글리프
  cellEls[spawnIdx].innerHTML='<span class="glyph" style="color:#9a3412;font-weight:700">⛏</span>';
  cellEls[gateIdx].innerHTML='<span class="glyph" id="gateGlyph" style="color:#6b21a8;font-weight:700">⌂</span>';
}

//==================================================================
// 좌표 변환 (경로 진행도 → 픽셀 셀 중심)
//==================================================================
function mobCellPos(m){
  // m.p: 경로 인덱스(실수). 정수부=현재 셀, 소수부=다음 셀로의 보간
  const i0=Math.floor(m.p);
  if(i0>=path.length-1) return xy(path[path.length-1]);
  const f=m.p-i0;
  const [x0,y0]=xy(path[i0]);
  const [x1,y1]=xy(path[i0+1]);
  return [x0+(x1-x0)*f, y0+(y1-y0)*f];
}

//==================================================================
// 디펜더 AI: 어디에 무엇을 지을지 스스로 판단
//==================================================================
function buildableCells(){
  const out=[];
  for(let i=0;i<N;i++){
    if(i===spawnIdx||i===gateIdx||pathSet.has(i)) continue;
    if(cells[i].tower) continue;
    out.push(i);
  }
  return out;
}
// 어떤 셀이 경로를 얼마나 커버하는지 (사정거리 내 경로 셀 수 + 굽이 가중)
function coverageScore(i, range){
  const [cx,cy]=xy(i);
  let cnt=0, near=0;
  for(let k=0;k<path.length;k++){
    const [px,py]=xy(path[k]);
    const d=Math.hypot(px-cx,py-cy);
    if(d<=range){ cnt++; if(d<range*0.6) near+=0.5;
      // 굽이(방향 전환) 지점 가중 — 몬스터 체류 시간 김
      if(k>0 && (pathDir[k][0]!==pathDir[k-1][0]||pathDir[k][1]!==pathDir[k-1][1])) cnt+=0.8;
    }
  }
  return cnt+near;
}
function defenderAI(){
  if(!autoDefend) return;
  // 예산 안에서 살 수 있는 최선 행동을 탐색: 신규 설치 vs 업그레이드
  let bestBuild=null, bestScore=0;
  const cands=buildableCells();
  // 후보 셀 표본 (성능)
  const sample=[];
  for(let s=0;s<Math.min(cands.length,90);s++) sample.push(pick(cands));
  for(const t of TOWER_KEYS){
    const spec=TOWERS[t];
    if(spec.cost>defGold) continue;
    for(const i of sample){
      let cov=coverageScore(i, spec.range);
      // 가성비: 커버×피해율 / 비용. frost는 둔화 가치 보정.
      let dps=spec.dmg/spec.rate;
      let val=cov*(dps*0.5 + (spec.splash?spec.dmg*0.6:0) + (spec.slow?14:0));
      // gate에 가까운 후방 보강 가중 (누수 대비)
      const [cx]=xy(i);
      val*= 1 + (cx/COLS)*0.25;
      // 이미 같은 종류 많으면 다양성 페널티
      const same=towers.filter(tw=>tw.kind===t).length;
      val*= 1/(1+same*0.12);
      val/= spec.cost;
      if(val>bestScore){bestScore=val; bestBuild={i,t};}
    }
  }
  // 업그레이드 후보: 가장 커버 좋은 타워를 강화
  let bestUp=null, bestUpScore=0;
  for(const tw of towers){
    if(tw.lvl>=4) continue;
    const c=upCost(tw);
    if(c>defGold) continue;
    const cov=coverageScore(tw.i, TOWERS[tw.kind].range*(1+tw.lvl*0.12));
    const val=cov*(tw.lvl+1)/c;
    if(val>bestUpScore){bestUpScore=val; bestUp=tw;}
  }
  // 게이트 위급 시 후방 우선 + 비전/대포 선호 이미 위에서 처리됨.
  // 의사결정: 새 타워가 거의 없으면 무조건 설치, 아니면 점수 비교
  const wantBuild = bestBuild && (towers.length<3 || bestScore*1.0 >= bestUpScore*0.9);
  if(wantBuild && bestBuild){
    placeTower(bestBuild.i, bestBuild.t, true);
  } else if(bestUp){
    upgradeTower(bestUp, true);
  }
}

//==================================================================
// 몬스터 AI: 절차적·적응형 웨이브 생성
//==================================================================
let waveActive=false, spawnQueue=[], spawnTimer=0;
function difficulty(){
  // 디펜더 전력 추정
  let power=0;
  for(const tw of towers) power+=TOWERS[tw.kind].dmg/TOWERS[tw.kind].rate*(tw.lvl+1);
  return power;
}
function monsterAI_planWave(forced){
  wave++;
  // 적응형: 디펜더 전력 + 게이트 체력 + 현재 웨이브로 예산 책정
  const power=difficulty();
  // 몬스터 누적 자금 + 웨이브 스케일링 예산
  let budget = monGold + 40 + wave*22 + power*0.9;
  // 게이트가 튼튼하면 더 공세, 게이트 위급하면 살짝 자제(엎치락 유지)
  if(gateHP > gateMax*0.7) budget*=1.18;
  if(gateHP < gateMax*0.3) budget*=0.82;
  monGold=0;
  // 조합 결정: 디펜더에 splash 많으면 swarm 줄이고 tank↑, slow 많으면 runner↑
  const splashN=towers.filter(t=>t.kind==='cannon').length;
  const slowN=towers.filter(t=>t.kind==='frost').length;
  const queue=[];
  const MCOST={grub:9, runner:13, tank:34, swarm:5, boss:130};
  // 보스: 5웨이브마다 + 예산 충분
  if(wave%5===0 && budget>MCOST.boss){ queue.push('boss'); budget-=MCOST.boss; }
  let guard=0;
  while(budget>MCOST.swarm && guard++<400){
    const roll=Math.random();
    let pickm;
    if(splashN>=2 && roll<0.34) pickm='tank';        // 광역 많으면 단단한 거
    else if(slowN>=2 && roll<0.34) pickm='runner';    // 둔화 많으면 빠른 거 폭주
    else if(roll<0.42) pickm='grub';
    else if(roll<0.66) pickm='swarm';
    else if(roll<0.85) pickm='runner';
    else pickm='tank';
    if(MCOST[pickm]>budget) pickm='swarm';
    if(MCOST[pickm]>budget) break;
    queue.push(pickm); budget-=MCOST[pickm];
  }
  // 셔플 (난수 고정 X — 매번 동적)
  for(let k=queue.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[queue[k],queue[j]]=[queue[j],queue[k]];}
  spawnQueue=queue; waveActive=true; spawnTimer=0;
  const comp={};
  for(const q of queue) comp[q]=(comp[q]||0)+1;
  const compStr=Object.entries(comp).map(([k,v])=>`${MOBS[k].name}×${v}`).join(', ');
  logF('mon', `=WAVE(${wave}, [${Object.entries(comp).map(([k,v])=>`"${MOBS[k].name}":${v}`).join(', ')}])`,
       `웨이브 ${wave} 편성: ${compStr}`);
  toast(`웨이브 ${wave} 진군 개시 — ${queue.length}기`);
}

//==================================================================
// 액션
//==================================================================
function placeTower(i, kind, byAI){
  const spec=TOWERS[kind];
  if(defGold<spec.cost) return false;
  if(i===spawnIdx||i===gateIdx||pathSet.has(i)||cells[i].tower) return false;
  defGold-=spec.cost;
  const [x,y]=xy(i);
  const t={kind,lvl:0,i,x,y,cd:0,kills:0};
  towers.push(t); cells[i].tower=t;
  paintTower(t);
  logF('def', `=BUILD("${spec.name}", ${ref(i)}, ${spec.cost}g)`,
       `${byAI?'AI ':''}수성: ${spec.name} 설치 @${ref(i)}`);
  return true;
}
function upgradeTower(t, byAI){
  const c=upCost(t);
  if(defGold<c||t.lvl>=4) return false;
  defGold-=c; t.lvl++;
  paintTower(t);
  logF('def', `=UPGRADE("${TOWERS[t.kind].name}", ${ref(t.i)}, Lv${t.lvl+1})`,
       `${byAI?'AI ':''}강화: ${TOWERS[t.kind].name} → Lv${t.lvl+1} @${ref(t.i)}`);
  return true;
}
function paintTower(t){
  const spec=TOWERS[t.kind];
  const el=cellEls[t.i];
  el.classList.remove('buildable');
  const sz=12+t.lvl*1.5;
  const star=t.lvl>0?`<span style="position:absolute;top:0;right:1px;font-size:8px;color:#b45309;z-index:3">${'•'.repeat(Math.min(t.lvl,4))}</span>`:'';
  el.innerHTML=`<span class="glyph" style="color:${spec.col};font-size:${sz}px;font-weight:${t.lvl>=2?700:500}">${spec.glyph}</span>${star}`;
}

//==================================================================
// 전투 시뮬레이션 (고정 timestep)
//==================================================================
function spawnMob(kind){
  const base=MOBS[kind];
  // 웨이브에 따른 hp 스케일 (절차적 강화)
  const hpScale=1+wave*0.14;
  mobs.push({
    kind, hp:base.hp*hpScale, maxhp:base.hp*hpScale,
    spd:base.spd, bounty:base.bounty, dmg:base.dmg,
    p:0, slowT:0, el:null
  });
}

function step(dt){
  if(result) return;
  simTime+=dt;
  // 디펜더 소득 (시간당) + AI 행동
  defGold+=dt*7.0;
  monGold+=dt*5.0;
  // 디펜더 AI: 주기적 의사결정
  cells.__defAiAcc=(cells.__defAiAcc||0)+dt;
  if(cells.__defAiAcc>0.9){ cells.__defAiAcc=0; defenderAI(); }

  // 웨이브 관리: 없으면 다음 웨이브 자동 편성 (관전 자동 진행)
  if(!waveActive && mobs.length===0){
    cells.__waveGap=(cells.__waveGap||0)+dt;
    if(cells.__waveGap>2.2){ cells.__waveGap=0; monsterAI_planWave(false); }
  }
  // 스폰
  if(waveActive){
    spawnTimer-=dt;
    if(spawnTimer<=0 && spawnQueue.length){
      spawnMob(spawnQueue.shift());
      spawnTimer=rnd(0.35,0.7);
    }
    if(spawnQueue.length===0) waveActive=false;
  }

  // 몬스터 이동
  for(const m of mobs){
    let sp=m.spd;
    if(m.slowT>0){ m.slowT-=dt; sp*=0.55; }
    m.p += sp*dt; // 경로 셀/초
    if(m.p>=path.length-1){
      // 게이트 도달 — 누수
      gateHP-=m.dmg* (1+wave*0.15);
      m.dead=true; m.leaked=true;
      cellEls[gateIdx].classList.add('gatehit');
      setTimeout(()=>cellEls[gateIdx].classList.remove('gatehit'),400);
    }
  }

  // 타워 공격
  for(const t of towers){
    t.cd-=dt;
    const spec=TOWERS[t.kind];
    const rng=spec.range*(1+t.lvl*0.12);
    const dmg=spec.dmg*(1+t.lvl*0.55);
    if(t.cd>0) continue;
    // 사정거리 내 가장 진행한(가까운 게이트) 몬스터 타깃
    let target=null, bestP=-1;
    for(const m of mobs){
      if(m.dead||m.hp<=0) continue;
      const [mx,my]=mobCellPos(m);
      const d=Math.hypot(mx-t.x,my-t.y);
      if(d<=rng && m.p>bestP){ bestP=m.p; target=m; }
    }
    if(target){
      const rate=spec.rate*(1-t.lvl*0.07);
      t.cd=Math.max(0.18,rate);
      fireProjectile(t, target);
      // 데미지 적용
      applyDamage(t, target, dmg, spec);
    }
  }

  // 몬스터 사망/누수 정리 + 보상
  for(let k=mobs.length-1;k>=0;k--){
    const m=mobs[k];
    if(m.dead){
      if(!m.leaked){ defGold+=m.bounty; killCount++;
        killLog.push({wave, kind:m.kind, t:simTime.toFixed(1)});
        if(killLog.length>500) killLog.shift();
      }
      mobs.splice(k,1);
    } else if(m.hp<=0){
      defGold+=m.bounty; killCount++;
      killLog.push({wave, kind:m.kind, t:simTime.toFixed(1)});
      if(killLog.length>500) killLog.shift();
      mobs.splice(k,1);
    }
  }

  // 게이트 자동 수복 (천천히) — 엎치락뒤치락 유지
  if(gateHP<gateMax && mobs.length===0 && !waveActive) gateHP=Math.min(gateMax, gateHP+dt*4);
  gateHP=clamp(gateHP, -1, gateMax);

  // 승패: 게이트 파괴 = 패배. 25웨이브 방어 = 승리.
  if(gateHP<=0){ result='lose'; logF('mon','=BREACH("성문 함락")','성문이 함락되었습니다. 왕국 멸망.'); }
  else if(wave>=25 && mobs.length===0 && !waveActive){ result='win'; logF('def','=HOLD(25, "수성 성공")','25웨이브를 막아냈습니다. 왕국 수호 성공!'); }
}

function applyDamage(t, target, dmg, spec){
  target.hp-=dmg;
  t.kills += target.hp<=0?1:0;
  if(spec.slow) target.slowT=1.2;
  if(spec.splash){
    const [tx,ty]=mobCellPos(target);
    for(const m of mobs){
      if(m===target||m.dead) continue;
      const [mx,my]=mobCellPos(m);
      if(Math.hypot(mx-tx,my-ty)<=spec.splash){ m.hp-=dmg*0.55; if(spec.slow)m.slowT=1.0; }
    }
  }
}

// 발사체 (순간 라인 — DOM 부담 적게, 짧게 표시)
function fireProjectile(t, target){
  const [mx,my]=mobCellPos(target);
  projectiles.push({x0:t.x,y0:t.y,x1:mx,y1:my,life:0.12,col:TOWERS[t.kind].col});
}

//==================================================================
// 렌더링 (몬스터/발사체는 셀 위 오버레이로)
//==================================================================
let overlay=null;
function ensureOverlay(){
  if(overlay) overlay.remove();
  overlay=document.createElement('canvas');
  overlay.style.position='absolute';
  overlay.style.left='44px';
  overlay.style.top='0';
  overlay.style.pointerEvents='none';
  overlay.style.zIndex='6';
  overlay.width=COLS*CW; overlay.height=ROWS*CH;
  sheet.appendChild(overlay);
}
function cellPix(cx,cy){ return [cx*CW+CW/2, cy*CH+CH/2]; }

function render(){
  if(!overlay) return;
  const ctx=overlay.getContext('2d');
  ctx.clearRect(0,0,overlay.width,overlay.height);
  // 발사체
  for(const p of projectiles){
    const [x0,y0]=cellPix(p.x0,p.y0);
    const [x1,y1]=cellPix(p.x1,p.y1);
    ctx.strokeStyle=p.col; ctx.lineWidth=2; ctx.globalAlpha=Math.max(0,p.life/0.12);
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    ctx.globalAlpha=1;
  }
  // 몬스터
  for(const m of mobs){
    const [cx,cy]=mobCellPos(m);
    const [px,py]=cellPix(cx,cy);
    const spec=MOBS[m.kind];
    const sz = m.kind==='boss'?15: m.kind==='tank'?13:11;
    // 글리프
    ctx.fillStyle=spec.col;
    ctx.font=`${m.kind==='boss'||m.kind==='tank'?700:500} ${sz}px "맑은 고딕",sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(m.slowT>0){ ctx.fillStyle='#3b82f6'; }
    ctx.fillText(spec.glyph, px, py-1);
    // HP 바
    const w=CW*0.7, h=2.5;
    const hpr=clamp(m.hp/m.maxhp,0,1);
    ctx.fillStyle='#e3b7b7'; ctx.fillRect(px-w/2, py+sz/2-1, w, h);
    ctx.fillStyle= hpr>0.5?'#159b3a':hpr>0.25?'#d97706':'#dc2626';
    ctx.fillRect(px-w/2, py+sz/2-1, w*hpr, h);
  }
}

let toastT=null;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),1800);
}

function renderLegend(){
  const gateR=clamp(gateHP/gateMax,0,1);
  let h='<h4>성문수성 — 전황판</h4>';
  h+=`<div><span class="sw" style="background:#6b21a8"></span>성문 HP ${Math.max(0,Math.round(gateHP))}/${gateMax}</div>`;
  h+=`<div class="bar"><i style="width:${gateR*100}%;background:${gateR>0.5?'#159b3a':gateR>0.25?'#d97706':'#dc2626'}"></i></div>`;
  h+=`<div><span class="sw" style="background:#107c41"></span>디펜더 자금 <b>${Math.round(defGold)}</b>g</div>`;
  h+=`<div><span class="sw" style="background:#7a0000"></span>몬스터 자금 <b>${Math.round(monGold)}</b>g</div>`;
  h+=`<div class="mut">웨이브 ${wave} · 타워 ${towers.length} · 진군 ${mobs.length}기</div>`;
  h+=`<div class="mut">격파 누계 ${killCount}</div>`;
  if(result==='win') h+='<div style="color:#107c41;font-weight:700;margin-top:4px">★ 수성 성공 (25웨이브)</div>';
  if(result==='lose') h+='<div style="color:#dc2626;font-weight:700;margin-top:4px">✖ 성문 함락</div>';
  legend.innerHTML=h;
}

function renderStatus(){
  const dps=Math.round(difficulty());
  const mode= autoDefend?'관전(양측 AI)':'관전(몬스터 AI)';
  statusbar.innerHTML=
    `준비<span class="sep">|</span>${mode}`+
    `<span class="sep">|</span>웨이브 <b>${wave}</b>`+
    `<span class="sep">|</span>성문 <b>${Math.max(0,Math.round(gateHP))}</b>/${gateMax}`+
    `<span class="sep">|</span>자금 <b>${Math.round(defGold)}</b>g`+
    `<span class="sep">|</span>방어력 ${dps}`+
    `<span class="sep">|</span>${result?(result==='win'?'수성 성공':'함락'):(running?'진행 중':'일시정지')}`;
}

function renderStatusSheet(){
  let h='<h3>전황.log — AI 의사결정 / 웨이브 기록</h3><table><tr><th>t(초)</th><th>측</th><th>수식</th><th>설명</th></tr>';
  for(const e of statusLog.slice(-120).reverse()){
    h+=`<tr class="${e.side==='mon'?'mon':''}"><td>${e.t}</td><td>${e.side==='mon'?'몬스터':'수성'}</td><td class="f">${e.f.replace(/</g,'&lt;')}</td><td>${e.msg}</td></tr>`;
  }

function renderKillSheet(){
  const comp={};
  for(const k of killLog) comp[k.kind]=(comp[k.kind]||0)+1;
  let h=`<h3>격파기록 — 누계 ${killCount}기 처치</h3>`;
  h+='<table><tr><th>몬스터</th><th>처치 수</th></tr>';
  for(const k of Object.keys(MOBS)) h+=`<tr><td>${MOBS[k].glyph} ${MOBS[k].name}</td><td>${comp[k]||0}</td></tr>`;
  h+='</table><br><table><tr><th>t(초)</th><th>웨이브</th><th>처치</th></tr>';
  for(const e of killLog.slice(-80).reverse()) h+=`<tr><td>${e.t}</td><td>${e.wave}</td><td>${MOBS[e.kind].glyph} ${MOBS[e.kind].name}</td></tr>`;
  h+='</table>';
  panel.innerHTML=h;
}

// 메인 루프
//==================================================================
function loop(ts){
  if(!lastTime) lastTime=ts;
  let dt=(ts-lastTime)/1000; lastTime=ts;
  dt=Math.min(dt,0.05); // 스파이크 방지
  if(running && !result){
    const steps=speed; // 속도배수만큼 시뮬 가속
    for(let s=0;s<speed;s++) step(dt);
  }
  // 발사체 수명
  for(let k=projectiles.length-1;k>=0;k--){ projectiles[k].life-=dt; if(projectiles[k].life<=0) projectiles.splice(k,1); }
  render();
  renderLegend();
  renderStatus();
  requestAnimationFrame(loop);
}

function buildTowerButtons(){
  // 기존 버튼 제거 (rlbl 보존)
  [...towerGroup.querySelectorAll('.rbtn')].forEach(b=>b.remove());
  const rlbl=towerGroup.querySelector('.rlbl');
  for(const k of TOWER_KEYS){
    const spec=TOWERS[k];
    const b=document.createElement('div');
    b.className='rbtn'; b.dataset.tower=k;
    b.innerHTML=`<div class="ic" style="color:${spec.col}">${spec.glyph}</div><div class="lb">${spec.name} ${spec.cost}g</div>`;
    b.title=`${spec.name} — ${spec.desc} (${spec.cost}g)`;
    b.addEventListener('click',()=>{
      if(selectedTower===k){ selectedTower=null; b.classList.remove('on'); }
      else{
        selectedTower=k;
        [...towerGroup.querySelectorAll('.rbtn')].forEach(x=>x.classList.remove('on'));
        b.classList.add('on');
        toast(`${spec.name} 선택 — 빈 셀을 클릭해 설치`);
      }
    });
    towerGroup.insertBefore(b, rlbl);
  }
}

function wireSheetClicks(){
  sheet.addEventListener('click',e=>{
    const t=e.target.closest('.cell'); if(!t) return;
    const i=+t.dataset.i;
    if(selectedCell>=0 && cellEls[selectedCell]) cellEls[selectedCell].classList.remove('sel');
    selectedCell=i; t.classList.add('sel'); namebox.textContent=ref(i);
    // 사람이 타워 종류를 골랐으면 설치 시도
    if(selectedTower && !pathSet.has(i) && i!==spawnIdx && i!==gateIdx && !cells[i].tower){
      if(placeTower(i, selectedTower, false)){
        toast(`${TOWERS[selectedTower].name} 설치 완료 @${ref(i)}`);
      } else {
        toast('자금 부족');
      }
      return;
    }
    // 정보 표시
    if(cells[i].tower){
      const tw=cells[i].tower, spec=TOWERS[tw.kind];
      fmla.textContent=`=TOWER("${spec.name}", Lv${tw.lvl+1}, 처치 ${tw.kills}, 강화비 ${upCost(tw)}g)`;
    } else if(pathSet.has(i)){
      fmla.textContent=`=PATH(${ref(i)}, "몬스터 진군로")`;
    } else if(i===gateIdx){
      fmla.textContent=`=GATE("성문", HP ${Math.round(gateHP)}/${gateMax})`;
    } else if(i===spawnIdx){
      fmla.textContent=`=SPAWN("몬스터 출현지")`;
    } else {
      fmla.textContent=`=CELL(${ref(i)}, "설치 가능 — 리본에서 타워 선택")`;
    }
  });
}

function wireRibbon(){
  document.getElementById('btnPause').addEventListener('click',function(){
    running=!running;
    this.querySelector('.ic').innerHTML=running?'<span style="letter-spacing:-1px">▮▮</span>':'▶';
    this.querySelector('.lb').textContent=running?'일시정지':'재개';
    toast(running?'재개':'일시정지');
  });
  document.getElementById('btnSpeed').addEventListener('click',function(){
    speed = speed===1?2: speed===2?4:1;
    this.querySelector('.lb').textContent=`속도 ×${speed}`;
    toast(`속도 ×${speed}`);
  });
  document.getElementById('btnWave').addEventListener('click',()=>{
    if(result) return;
    if(!waveActive && mobs.length<40){ monsterAI_planWave(true); }
    else toast('현재 웨이브 진행 중');
  });
  document.getElementById('btnAuto').addEventListener('click',function(){
    autoDefend=!autoDefend;
    this.classList.toggle('on',autoDefend);
    toast(autoDefend?'디펜더 AI 자동 수성 ON':'디펜더 AI OFF — 직접 수성');
  });
  document.getElementById('btnAuto').classList.add('on');
}

function wireTabs(){
  document.querySelectorAll('#tabs div').forEach(d=>{
    d.addEventListener('click',()=>{
      document.querySelectorAll('#tabs div').forEach(x=>x.classList.remove('on'));
      d.classList.add('on');
      sheetView=d.dataset.sheet;
      if(sheetView==='field'){ panel.style.display='none'; }
      else if(sheetView==='status'){ panel.style.display='block'; renderStatusSheet(); }
      else if(sheetView==='kills'){ panel.style.display='block'; renderKillSheet(); }
    });
  });
}

// 격파기록 탭 라벨 주기 갱신
setInterval(()=>{
  const t=document.querySelector('#tabs div[data-sheet="kills"]');
  if(t) t.textContent=`격파기록 (${killCount})`;
  document.getElementById('ttl').textContent=`성문수성.xlsx - Excel (웨이브 ${wave})`;
},900);

//==================================================================
// 초기화
//==================================================================
function init(){
  buildSheet();
  genPath();
  cells=new Array(N);
  for(let i=0;i<N;i++) cells[i]={tower:null};
  paintTerrain();
  ensureOverlay();
  towers=[]; mobs=[]; projectiles=[];
  defGold=180; monGold=60; gateHP=100; gateMax=100; wave=0; killCount=0;
  result=null; running=true; speed=1;
  fmla.textContent=`=DEFEND($A$1:$${colName(COLS-1)}$${ROWS}, "성문을 사수하라")`;
  logF('def','=INIT("성문수성", AI_vs_AI)','관전 모드 시작 — 디펜더 AI와 몬스터 AI가 자동 교전합니다.');
}

// 리사이즈 대응 (재생성)
let resizeT=null;
window.addEventListener('resize',()=>{
  clearTimeout(resizeT);
  resizeT=setTimeout(()=>{
    const wasWave=wave, wasGate=gateHP;
    init(); // 그리드 재생성 (경로 재생성). 관전 흐름 유지 위해 상태는 리셋되지만 첫 페인트 보장.
  },300);
});

// 디버그/검증 훅
window.__td={
  state:()=>({wave, gateHP, defGold, monGold, towers:towers.length, mobs:mobs.length, killCount, result, running, speed, COLS, ROWS, pathLen:path.length}),
  forceWave:()=>monsterAI_planWave(true),
  step:(n)=>{for(let i=0;i<(n||60);i++)step(0.05);},
  setSpeed:(s)=>{speed=s;},
};

buildTowerButtons();
wireSheetClicks();
wireRibbon();
wireTabs();
init();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
