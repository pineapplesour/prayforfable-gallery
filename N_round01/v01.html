<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>방역.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar .ttl{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;flex:0 0 auto;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px;flex:0 0 auto}
  #namebox{width:64px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#107c41;font-weight:600;flex:0 0 auto}
  #fx{width:28px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif;flex:0 0 auto}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* control ribbon */
  #toolbar{height:30px;background:#f8f8f8;display:flex;align-items:center;gap:6px;
    padding:0 8px;border-bottom:1px solid #e1e1e1;flex:0 0 auto;overflow-x:auto}
  .tb{font-size:11px;color:#333;background:#fff;border:1px solid #cfcfcf;border-radius:3px;
    padding:3px 8px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px}
  .tb:hover{background:#eef6f0;border-color:#107c41}
  .tb.on{background:#107c41;color:#fff;border-color:#107c41}
  .tb .k{font-family:Consolas,monospace;opacity:.7;font-size:10px}
  #toolbar .lbl{font-size:10.5px;color:#888;margin-left:4px}
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1 1 auto;min-height:0}
  #sheet{display:grid;background:#fff;position:absolute;top:0;left:0}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:10px;font-weight:600}
  .cell{border-right:1px solid #eaeaea;border-bottom:1px solid #eaeaea;
    position:relative;display:flex;align-items:center;justify-content:center;
    font-size:11px;overflow:hidden;cursor:cell;line-height:1}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:6}
  .cell.hov{outline:2px dashed #107c41;outline-offset:-2px;z-index:5}
  .cell .hp{position:absolute;left:0;bottom:0;height:2.5px;background:#dc2626}
  .cell .gl{position:relative;z-index:1}
  .cell .num{position:absolute;top:0;right:1px;font-size:7px;color:#666;font-family:Consolas,monospace;z-index:1}
  @keyframes shotf{0%{opacity:.9;transform:scale(1.4)}100%{opacity:0;transform:scale(.6)}}
  .shot{position:absolute;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    color:#0b5394;font-weight:700;font-size:13px;animation:shotf .22s linear;pointer-events:none;z-index:4}
  @keyframes hitf{0%{background:#ffd2d2}100%{background:transparent}}
  .hit{animation:hitf .3s linear}
  @keyframes leakf{0%,100%{background:#ff4d4d}50%{background:#ffd9d9}}
  .leak{animation:leakf .3s 2}
  /* legend overlay */
  #legend{position:absolute;top:8px;right:10px;background:#fffce6;border:1px solid #d8c66a;
    box-shadow:2px 3px 8px rgba(0,0,0,.18);padding:7px 11px;font-size:11px;z-index:8;
    min-width:172px;line-height:1.65;max-width:220px}
  #legend h4{margin:0 0 2px;font-size:11px;color:#7a6a1f}
  #legend .sw{display:inline-block;width:12px;text-align:center;margin-right:5px;font-weight:700;font-family:Consolas,monospace}
  #legend .bar{height:7px;border-radius:3px;margin:2px 0 5px;background:#eee;overflow:hidden;display:flex}
  #legend .row{display:flex;justify-content:space-between;font-size:10.5px}
  /* panel tabs (전황/격파기록) */
  #panel{position:absolute;inset:0;background:#fff;z-index:9;overflow:auto;padding:18px 26px;display:none}
  #panel h2{font-size:15px;color:#107c41;margin:0 0 10px;border-bottom:2px solid #107c41;padding-bottom:5px}
  #panel table{border-collapse:collapse;font-size:11.5px;margin-bottom:18px}
  #panel td,#panel th{border:1px solid #d4d4d4;padding:4px 10px;text-align:left}
  #panel th{background:#f0f7f2;color:#107c41;font-weight:600}
  #panel .fxlog{font-family:Consolas,monospace;font-size:11px;color:#1a1a1a;white-space:nowrap}
  #panel .kill{color:#7a0000;font-family:Consolas,monospace}
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;flex:0 0 auto;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 8px;opacity:.45}
  #statusbar b{color:#fff}
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:18px;
    border-top:1px solid #d4d4d4;font-size:11.5px;flex:0 0 auto;gap:2px}
  #tabs div{padding:3px 13px;border:1px solid #d4d4d4;border-bottom:none;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  @media (max-width:560px){
    #menubar i:nth-child(n+5){display:none}
    .tb .lbl,#toolbar .lbl{display:none}
    #legend{font-size:10px;min-width:140px;padding:5px 7px}
    #namebox{width:48px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <div class="ttl" id="ttl">방역.xlsx - Excel</div>
  </div>
  <div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
  <div id="fbar">
    <div id="namebox">A1</div>
    <div id="fx">fx</div>
    <div id="formula"></div>
  </div>
  <div id="toolbar">
    <div class="tb" id="btnPause"><span>⏸ 일시정지</span></div>
    <div class="tb" id="btnSpeed"><span>속도 ×1</span></div>
    <div class="tb" id="btnWave"><span>＋웨이브 강제소환</span></div>
    <div class="tb" id="btnBuild"><span>＋수동 타워설치</span></div>
    <div class="tb" id="btnAuto"><span>관전(자동) 모드</span></div>
    <span class="lbl" id="hint">관전 중 — 양측 AI가 자동 교전합니다. 셀 클릭=정보. 직접 설치하려면 위 버튼.</span>
  </div>
  <div id="sheetwrap">
    <div id="sheet"></div>
    <div id="legend"></div>
    <div id="panel"></div>
  </div>
  <div id="tabs">
    <div class="on" data-tab="grid">전장</div>
    <div data-tab="stat">전황</div>
    <div data-tab="kill" id="tab-kill">격파기록 (0)</div>
  </div>
  <div id="statusbar"></div>
</div>

<script>
(() => {
"use strict";
// ============================================================
// 방역.xlsx — 셀 침식 바이러스 vs 안티바이러스 타워 (관전형 자동 TD)
// 셀 그리드가 곧 전장. 양측 모두 AI. 절차생성 적응형 웨이브.
// ============================================================
const sheet   = document.getElementById('sheet');
const fmla    = document.getElementById('formula');
const namebox = document.getElementById('namebox');
const statusbar = document.getElementById('statusbar');
const legend  = document.getElementById('legend');
const panel   = document.getElementById('panel');
const ttl     = document.getElementById('ttl');

// ---- grid sizing (responsive) ----
let COLS, ROWS, CW, CH, N;
function computeDims(){
  const w = sheet.parentElement.clientWidth  || innerWidth;
  const h = sheet.parentElement.clientHeight || (innerHeight - 200);
  CW = w < 560 ? 26 : 30;
  CH = w < 560 ? 22 : 22;
  const HDW = 34;
  COLS = Math.max(14, Math.min(34, Math.floor((w - HDW) / CW)));
  ROWS = Math.max(12, Math.min(30, Math.floor((h - CH) / CH)));
  N = COLS * ROWS;
}
function colName(n){ let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0;} return s; }
function ref(i){ return colName(i%COLS)+(Math.floor(i/COLS)+1); }
const RC = i => [i%COLS, (i/COLS)|0];
const idx = (x,y) => y*COLS + x;
const inb = (x,y) => x>=0 && x<COLS && y>=0 && y<ROWS;

// ============================================================
// game state
// ============================================================
let cellEls = [];
let path = [];           // array of cell indices (virus route)
let pathSet = new Set();
let coreI = -1, spawnI = -1;
let onPath = [];         // for each cell, position on path (-1 if none)

let towers = [];         // {i, kind, lvl, cd, range, dmg, fr}
let towerAt = new Map(); // cell -> tower
let virus  = [];         // {id, hpos, x, y, hp, maxhp, kind, speed, prog, slow, frozen}
let virusId = 0;
let shots  = [];         // transient effects {el,t}

let core = { hp: 100, max: 100 };
let defGold = 140, virGold = 60;
let wave = 0, tick = 0, waveTimer = 0, betweenWave = true;
let kills = 0, leaks = 0;
let killLog = [];        // {wave, kind, ref, by}
let aiLog = [];          // formula log strings
let running = true, speedMul = 1, manualBuild = false, autoMode = true;
let selected = -1, hover = -1;
let lastFormula = '';
let gameOver = false, win = false;
let curTab = 'grid';

// virus archetypes (cell-erosion strains)
const STRAINS = {
  worm:   {gl:'§', name:'웜',     col:'#7c3aed', baseHp:11, speed:0.050, bounty:4,  evcost:8},
  trojan: {gl:'Þ', name:'트로이', col:'#be185d', baseHp:28, speed:0.032, bounty:7,  evcost:16},
  rootkit:{gl:'Ø', name:'루트킷', col:'#b45309', baseHp:70, speed:0.022, bounty:13, evcost:34},
  spam:   {gl:'¥', name:'스팸봇', col:'#0d9488', baseHp:6,  speed:0.066, bounty:2,  evcost:5},
  ransom: {gl:'₩', name:'랜섬',   col:'#dc2626', baseHp:160,speed:0.015, bounty:28, evcost:80},
};
// tower archetypes (antivirus formulas)
const TOWERS = {
  scan:  {gl:'ƒ', name:'스캐너 ƒ', col:'#0b5394', cost:55,  dmg:5,  range:1.9, fr:24, slow:0},
  fw:    {gl:'Σ', name:'방화벽 Σ', col:'#107c41', cost:90,  dmg:11, range:1.5, fr:30, slow:0},
  ids:   {gl:'√', name:'IDS √',    col:'#7030a0', cost:130, dmg:8,  range:2.7, fr:18, slow:0.4},
  purge: {gl:'∑', name:'퍼지 ∑',   col:'#c00000', cost:210, dmg:30, range:2.3, fr:46, slow:0},
};
const TOWER_ORDER = ['scan','fw','ids','purge'];

// ============================================================
// build grid DOM
// ============================================================
function buildGrid(){
  computeDims();
  sheet.style.gridTemplateColumns = `34px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows = CH + 'px';
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){ const h=document.createElement('div'); h.className='hd'; h.textContent=colName(c); frag.appendChild(h); }
  cellEls = new Array(N);
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div'); h.className='hd'; h.textContent=r+1; frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div'); d.className='cell'; const i=r*COLS+c; d.dataset.i=i;
      d.innerHTML = '<div class="hp"></div><span class="num"></span><span class="gl"></span>';
      cellEls[i]=d; frag.appendChild(d);
    }
  }
  sheet.innerHTML=''; sheet.appendChild(frag);
}

// ============================================================
// procedural path generation — winding route from left edge to a core
// ============================================================
function genPath(){
  path = []; pathSet = new Set();
  onPath = new Array(N).fill(-1);
  const sy = 1 + ((Math.random()*(ROWS-2))|0);
  let x=0, y=sy;
  spawnI = idx(x,y);
  path.push(spawnI); pathSet.add(spawnI);
  const targetX = COLS-2;
  let guard = 0, lastDir = 'R';
  while(x < targetX && guard++ < N*3){
    // bias rightward but wander vertically to make it long & balanced
    const r = Math.random();
    let nx=x, ny=y, dir='R';
    if(r < 0.60){ nx=x+1; dir='R'; }
    else if(r < 0.80 && y>1 && lastDir!=='D'){ ny=y-1; dir='U'; }
    else if(y<ROWS-2 && lastDir!=='U'){ ny=y+1; dir='D'; }
    else { nx=x+1; dir='R'; }
    if(!inb(nx,ny)){ nx=x+1; ny=y; dir='R'; }
    const ni = idx(nx,ny);
    if(pathSet.has(ni)){ nx=x+1; ny=y; if(!inb(nx,ny))break; if(pathSet.has(idx(nx,ny)))break; }
    x=nx; y=ny; lastDir=dir;
    const cur=idx(x,y);
    if(!pathSet.has(cur)){ path.push(cur); pathSet.add(cur); }
  }
  // ensure reach right side
  while(x<COLS-1){ x++; const cur=idx(x,y); if(!pathSet.has(cur)){path.push(cur);pathSet.add(cur);} }
  coreI = path[path.length-1];
  path.forEach((p,k)=> onPath[p]=k);
}

// is a tower-placeable cell? (not path, not occupied)
function placeable(i){ return !pathSet.has(i) && !towerAt.has(i) && i>=0 && i<N; }

// position helpers for virus along path
function pathXY(hpos){
  const a = Math.min(path.length-1, Math.floor(hpos));
  return path[a];
}

// ============================================================
// rendering
// ============================================================
function clearCell(el){ const gl=el.querySelector('.gl'); gl.textContent=''; el.style.background=''; el.querySelector('.hp').style.width='0'; el.querySelector('.num').textContent=''; }

function renderStatic(){
  for(let i=0;i<N;i++){
    const el=cellEls[i]; const gl=el.querySelector('.gl');
    el.style.background=''; gl.textContent=''; gl.style.color=''; gl.style.fontWeight='';
    el.querySelector('.num').textContent=''; el.querySelector('.hp').style.width='0';
    if(i===coreI){ el.style.background='#fde2e2'; gl.textContent='▣'; gl.style.color='#c00000'; gl.style.fontWeight='700'; }
    else if(i===spawnI){ el.style.background='#ede0f7'; gl.textContent='◤'; gl.style.color='#7030a0'; gl.style.fontWeight='700'; }
    else if(pathSet.has(i)){ el.style.background='#f3eefa'; gl.textContent='░'; gl.style.color='#cdb9e6'; }
  }
}

function renderTower(t){
  const el=cellEls[t.i]; const gl=el.querySelector('.gl'); const tw=TOWERS[t.kind];
  el.style.background = hexA(tw.col, 0.10 + t.lvl*0.10);
  gl.textContent = tw.gl; gl.style.color = tw.col; gl.style.fontWeight='700';
  el.querySelector('.num').textContent = t.lvl>1 ? 'L'+t.lvl : '';
}

function hexA(hex,a){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }

// dynamic layer: redraw path cells (clear residual virus), towers, then virus
let lastVirusCells = new Set();
function renderDynamic(){
  // clear last frame's virus-occupied path cells back to path look
  for(const i of lastVirusCells){
    if(i===coreI||i===spawnI) continue;
    const el=cellEls[i]; const gl=el.querySelector('.gl');
    if(pathSet.has(i)){ el.style.background='#f3eefa'; gl.textContent='░'; gl.style.color='#cdb9e6'; gl.style.fontWeight=''; el.querySelector('.hp').style.width='0'; el.querySelector('.num').textContent=''; }
  }
  lastVirusCells = new Set();
  // draw virus
  for(const v of virus){
    const ci = pathXY(v.hpos);
    if(ci===coreI) continue;
    const el=cellEls[ci]; if(!el) continue;
    const gl=el.querySelector('.gl'); const s=STRAINS[v.kind];
    el.style.background = v.frozen>0 ? '#cfe7ff' : hexA(s.col, 0.22);
    gl.textContent = s.gl; gl.style.color = s.col; gl.style.fontWeight='700';
    const hpw = Math.max(2, (v.hp/v.maxhp)*CW);
    el.querySelector('.hp').style.width = hpw+'px';
    lastVirusCells.add(ci);
  }
  // shot effects
  for(let k=shots.length-1;k>=0;k--){ const s=shots[k]; if(--s.t<=0){ s.el.remove(); shots.splice(k,1); } }
}

function spawnShot(ti, vi){
  const el=cellEls[ti];
  const d=document.createElement('div'); d.className='shot'; d.textContent='•';
  el.appendChild(d); shots.push({el:d,t:3});
  const ve=cellEls[pathXY(vi)]; if(ve){ ve.classList.remove('hit'); void ve.offsetWidth; ve.classList.add('hit'); }
}

// ============================================================
// AI: DEFENDER  — antivirus side
// scores empty cells by how much path they cover; buys & upgrades.
// ============================================================
function pathCoverScore(i, range){
  let c=0; const [cx,cy]=RC(i);
  for(const p of path){ const [px,py]=RC(p); const d=Math.hypot(px-cx,py-cy); if(d<=range+0.05) c++; }
  return c;
}
function bestTowerCell(range){
  let best=-1, bestScore=-1;
  // sample placeable cells near the path for efficiency
  const cand = new Set();
  for(const p of path){ const [px,py]=RC(p);
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){ const x=px+dx,y=py+dy; if(inb(x,y)){ const i=idx(x,y); if(placeable(i)) cand.add(i); } }
  }
  for(const i of cand){
    let sc = pathCoverScore(i, range);
    // prefer covering path near core (last 40%) — leaks hurt most there
    const [cx,cy]=RC(i);
    for(let k=(path.length*0.55)|0;k<path.length;k++){ const [px,py]=RC(path[k]); if(Math.hypot(px-cx,py-cy)<=range){ sc+=0.6; } }
    if(sc>bestScore){ bestScore=sc; best=i; }
  }
  return best;
}
function defenderAI(){
  if(gameOver) return;
  // choose what to afford. Pressure-aware: if core low, prefer purge/upgrades.
  const corePct = core.hp/core.max;
  // soft cap on tower count relative to path length — forces upgrade-over-sprawl,
  // so the defender can't just farm infinite towers and trivialize the siege.
  const towerCap = Math.max(4, Math.round(path.length*0.30));
  const atCap = towers.length >= towerCap;
  // 1) upgrade an existing high-coverage tower (preferred once a footprint exists)
  if(towers.length>2 && (atCap || Math.random()<0.6)){
    let cand=towers.filter(t=>t.lvl<4);
    if(cand.length){
      cand.sort((a,b)=> pathCoverScore(b.i,b.range)-pathCoverScore(a.i,a.range));
      const t=cand[0]; const cost = Math.round(TOWERS[t.kind].cost*0.9*t.lvl);
      if(defGold>=cost){ defGold-=cost; t.lvl++; t.dmg=Math.round(TOWERS[t.kind].dmg*(1+0.55*(t.lvl-1))); t.range=TOWERS[t.kind].range+(t.lvl-1)*0.25; renderTower(t);
        pushAI(`=UPGRADE("${TOWERS[t.kind].name}", ${ref(t.i)}, L${t.lvl})`); return; }
    }
    if(atCap) return; // capped and can't afford upgrade — save gold
  }
  // 2) build new tower — pick kind affordable & useful
  let order = [...TOWER_ORDER];
  if(corePct<0.45) order=['purge','ids','fw','scan']; // emergency: heavy/slow
  for(const k of order){
    const tw=TOWERS[k];
    if(defGold>=tw.cost){
      const cell=bestTowerCell(tw.range);
      if(cell<0) return;
      placeTower(cell, k, true);
      defGold-=tw.cost;
      return;
    }
  }
}
function placeTower(i, kind, ai){
  if(!placeable(i)) return false;
  const tw=TOWERS[kind];
  const t={i, kind, lvl:1, cd:0, range:tw.range, dmg:tw.dmg, fr:tw.fr, slow:tw.slow};
  towers.push(t); towerAt.set(i,t); renderTower(t);
  pushAI(`=BUILD("${tw.name}", ${ref(i)})`, !ai);
  return true;
}

// ============================================================
// AI: VIRUS — erosion side
// composes the next wave adaptively from economy + defender strength.
// ============================================================
function defenseStrength(){ let s=0; for(const t of towers) s += t.dmg*t.lvl*(60/t.fr); return s; }
function makeWave(){
  wave++;
  const ds = defenseStrength();
  // budget tracks defender strength closely so the siege stays competitive and
  // the virus can punch through a fat defense — but eased when core is low so a
  // losing defender isn't instantly wiped (adaptive, back-and-forth difficulty).
  let budget = 34 + wave*20 + Math.round(ds*0.48) + virGold*0.6;
  virGold = Math.max(0, virGold*0.5);
  // if core is healthy, push HARD; if core is low, ease (anti-snowball both ways)
  const corePct=core.hp/core.max;
  if(corePct<0.30) budget*=0.70;
  else if(corePct<0.55) budget*=0.90;
  else if(corePct>0.85) budget*=1.30;
  // choose composition by phase
  const comp=[];
  let pool=['spam','worm'];
  if(wave>=3) pool.push('trojan');
  if(wave>=6) pool.push('rootkit');
  if(wave>=9 || (wave>=5 && Math.random()<0.3)) pool.push('ransom');
  // mixed strain selection weighted to spend budget on counters to current defense
  const hasSlow = towers.some(t=>t.slow>0);
  let b=budget;
  while(b>4 && comp.length<90){
    let k = pool[(Math.random()*pool.length)|0];
    // counter logic: if many slow towers, prefer beefy single units (rootkit/ransom)
    if(hasSlow && Math.random()<0.4 && (pool.includes('rootkit'))) k='rootkit';
    const c=STRAINS[k].evcost;
    if(c>b) { // can't afford big; fall to cheap
      if(b>=STRAINS.spam.evcost) k='spam'; else break;
    }
    comp.push(k); b-=STRAINS[k].evcost;
  }
  if(comp.length===0) comp.push('spam','spam','worm');
  // boss wave every 5
  let boss = (wave%5===0);
  if(boss) comp.push('ransom');
  // schedule spawns — spacing tightens with wave so late waves arrive as BURSTS
  // that flood the path faster than towers can clear (creates real pressure/leaks).
  const spacing = Math.max(2, 20 - wave*1.4 - Math.round(defenseStrength()*0.01));
  pendingSpawns = comp.map((k,j)=>({kind:k, at: Math.round(j*spacing) + 4}));
  pendingSpawnBase = tick;
  const counts={}; comp.forEach(k=>counts[k]=(counts[k]||0)+1);
  const cs = Object.entries(counts).map(([k,n])=>`${STRAINS[k].name}×${n}`).join('+');
  pushAI(`=WAVE(${wave}, {${cs}})${boss?' ☣BOSS':''}`, true);
  betweenWave=false; waveTimer=0;
  // virus also earns income to seed next wave
  virGold += 20 + wave*3;
}
let pendingSpawns=[], pendingSpawnBase=0;

function hpScale(){ return 1 + wave*0.22; } // monsters scale with wave
function spawnVirus(kind){
  const s=STRAINS[kind];
  const hp = Math.round(s.baseHp * hpScale());
  virus.push({id:++virusId, hpos:0.001, hp, maxhp:hp, kind, speed:s.speed, slow:0, frozen:0});
  if(Math.random()<0.12) pushAI(`=SPAWN("${s.name}", ${ref(spawnI)}, HP${hp})`, false);
}

// ============================================================
// combat tick
// ============================================================
function stepVirus(dt){
  for(let k=virus.length-1;k>=0;k--){
    const v=virus[k];
    if(v.frozen>0){ v.frozen-=dt; continue; }
    let sp=v.speed*(v.slow>0?0.45:1);
    v.slow=Math.max(0,v.slow-dt);
    v.hpos += sp*dt*30;
    if(v.hpos >= path.length-1){
      // reached core — erode it (granular so the core see-saws instead of 1-shotting)
      const base = {spam:2, worm:3, trojan:5, rootkit:8, ransom:14}[v.kind] || 4;
      const dmg = Math.max(2, base);
      core.hp -= dmg; leaks++;
      cellEls[coreI].classList.remove('leak'); void cellEls[coreI].offsetWidth; cellEls[coreI].classList.add('leak');
      pushAI(`=BREACH("${STRAINS[v.kind].name}", ${ref(coreI)}, -${dmg}HP)`, false);
      virus.splice(k,1);
      if(core.hp<=0){ core.hp=0; endGame(false); }
    }
  }
}
function stepTowers(dt){
  for(const t of towers){
    t.cd -= dt*30;
    if(t.cd>0) continue;
    // find target on path within range — pick the furthest-progressed (closest to core)
    const [tx,ty]=RC(t.i);
    let target=null, bestProg=-1;
    for(const v of virus){
      const ci=pathXY(v.hpos); const [vx,vy]=RC(ci);
      if(Math.hypot(vx-tx,vy-ty)<=t.range+0.05){
        if(v.hpos>bestProg){ bestProg=v.hpos; target=v; }
      }
    }
    if(target){
      t.cd=t.fr;
      target.hp -= t.dmg;
      if(t.slow>0){ target.slow=18; if(t.kind==='ids'&&t.lvl>=3) target.frozen=Math.max(target.frozen, 4); }
      spawnShot(t.i, target.hpos);
      if(target.hp<=0){
        // killed
        const ix=virus.indexOf(target); if(ix>=0) virus.splice(ix,1);
        kills++; defGold += STRAINS[target.kind].bounty;
        killLog.push({wave, kind:target.kind, ref:ref(pathXY(target.hpos)), by:TOWERS[t.kind].name});
        if(killLog.length>400) killLog.shift();
        if(Math.random()<0.08) pushAI(`=KILL("${STRAINS[target.kind].name}", ${TOWERS[t.kind].name})`, false);
      }
    }
  }
}

// ============================================================
// AI log + formula bar
// ============================================================
function pushAI(s, quiet){
  aiLog.push({t:tick, s});
  if(aiLog.length>500) aiLog.shift();
  if(!quiet){ fmla.textContent=s; lastFormula=s; }
  else if(s.startsWith('=WAVE')||s.startsWith('=BUILD')||s.startsWith('=UPGRADE')){ fmla.textContent=s; lastFormula=s; }
}

// ============================================================
// main loop
// ============================================================
function gameTick(){
  if(!running || gameOver) return;
  for(let s=0;s<speedMul;s++){
    tick++;
    // virus spawns from pending wave schedule
    if(pendingSpawns.length){
      for(let j=pendingSpawns.length-1;j>=0;j--){
        if(tick - pendingSpawnBase >= pendingSpawns[j].at){
          spawnVirus(pendingSpawns[j].kind); pendingSpawns.splice(j,1);
        }
      }
    } else if(!betweenWave && virus.length===0){
      betweenWave=true; waveTimer=0;
      defGold += 18 + wave*2; // intermission income (lean — forces real choices)
      const rep = Math.min(core.max-core.hp, 6); // core self-repairs in lulls → see-saw
      if(rep>0){ core.hp+=rep; pushAI(`=REPAIR(${ref(coreI)}, +${rep}HP)`, true); }
      pushAI(`=WAVE.CLEAR(${wave}) → 정산 +${30+wave*4}G`, true);
    }
    if(betweenWave){
      waveTimer++;
      if(waveTimer> (wave===0?20:90)) makeWave();
    }
    stepVirus(1);
    stepTowers(1);
    // defender AI acts on income roughly every ~24 ticks (and when rich)
    if(autoMode && (tick%22===0 || defGold>420)){ defenderAI(); }
  }
  if(!gameOver && core.hp>=core.max && wave>=12 && virus.length===0 && pendingSpawns.length===0){
    // survival victory after 12 waves with core intact-ish handled below
  }
  renderDynamic();
  updateHUD();
}

// win condition: survive a long siege. defender "wins" by holding to wave milestone.
function checkWin(){
  if(!gameOver && wave>=20 && betweenWave && virus.length===0 && pendingSpawns.length===0 && core.hp>0){
    endGame(true);
  }
}

function endGame(defenderWon){
  gameOver=true; win=defenderWon;
  if(defenderWon) pushAI(`=DEFENSE.HOLD(wave ${wave}) → 방역 성공 ✓`);
  else pushAI(`=CORE.BREACHED(${ref(coreI)}) → 시스템 감염 ✗`);
}

// ============================================================
// HUD
// ============================================================
function updateHUD(){
  checkWin();
  const corePct=Math.max(0,core.hp/core.max);
  // status bar
  const phase = gameOver ? (win?'<b>방역 성공 ✓</b>':'<b>감염 — 시스템 다운 ✗</b>')
              : betweenWave ? `웨이브 ${wave} 정산중…` : `웨이브 ${wave} 교전중`;
  statusbar.innerHTML =
    `${running?'준비':'일시정지'}<span class="sep">|</span>`+
    `핵심셀 HP <b>${core.hp|0}</b>/${core.max}<span class="sep">|</span>`+
    `격파 <b>${kills}</b><span class="sep">|</span>유출 ${leaks}<span class="sep">|</span>`+
    `${phase}<span class="sep">|</span>`+
    `방역자금 <b>${defGold|0}G</b> · 바이러스자금 ${virGold|0}G`;
  ttl.textContent = `방역.xlsx - Excel  (웨이브 ${wave} · 핵심 ${corePct*100|0}%)`;
  document.getElementById('tab-kill').textContent = `격파기록 (${kills})`;
  // legend
  if(tick%4===0 || gameOver){
    const counts={}; virus.forEach(v=>counts[v.kind]=(counts[v.kind]||0)+1);
    let h=`<h4>전황판</h4>`;
    h+=`<div class="row"><span>핵심셀 ${ref(coreI)}</span><span>${core.hp|0}/${core.max}</span></div>`;
    h+=`<div class="bar"><div style="width:${corePct*100}%;background:${corePct<0.3?'#dc2626':corePct<0.6?'#d97706':'#107c41'}"></div></div>`;
    h+=`<div class="row"><span>활성 바이러스</span><span>${virus.length}</span></div>`;
    h+=`<div class="row"><span>설치된 타워</span><span>${towers.length}</span></div>`;
    h+=`<h4 style="margin-top:5px">감염주 (현재)</h4>`;
    if(Object.keys(counts).length===0) h+=`<div style="color:#999">— 소강 상태 —</div>`;
    for(const k of Object.keys(counts)) h+=`<div><span class="sw" style="color:${STRAINS[k].col}">${STRAINS[k].gl}</span>${STRAINS[k].name} ×${counts[k]}</div>`;
    h+=`<h4 style="margin-top:5px">안티바이러스</h4>`;
    const tc={}; towers.forEach(t=>tc[t.kind]=(tc[t.kind]||0)+1);
    if(Object.keys(tc).length===0) h+=`<div style="color:#999">— 미설치 —</div>`;
    for(const k of Object.keys(tc)) h+=`<div><span class="sw" style="color:${TOWERS[k].col}">${TOWERS[k].gl}</span>${TOWERS[k].name} ×${tc[k]}</div>`;
    legend.innerHTML=h;
  }
  if(curTab!=='grid') renderPanel();
}

// ============================================================
// panels (전황 / 격파기록 tabs)
// ============================================================
function renderPanel(){
  if(curTab==='stat'){
    let h=`<h2>전황 — 양측 AI 의사결정 로그</h2>`;
    h+=`<table><tr><th>핵심셀 HP</th><th>웨이브</th><th>격파</th><th>유출</th><th>방역자금</th><th>바이러스자금</th><th>방어강도</th></tr>`;
    h+=`<tr><td>${core.hp|0}/${core.max}</td><td>${wave}</td><td>${kills}</td><td>${leaks}</td><td>${defGold|0}G</td><td>${virGold|0}G</td><td>${defenseStrength()|0}</td></tr></table>`;
    h+=`<h2>=AI.LOG() — 최근 의사결정</h2><table><tr><th>tick</th><th>수식</th></tr>`;
    for(const e of aiLog.slice(-26).reverse()) h+=`<tr><td>${e.t}</td><td class="fxlog">${esc(e.s)}</td></tr>`;
    h+=`</table>`;
    panel.innerHTML=h;
  } else if(curTab==='kill'){
    let h=`<h2>격파기록 — 총 ${kills}건</h2><table><tr><th>#</th><th>웨이브</th><th>감염주</th><th>위치</th><th>처치 타워</th></tr>`;
    const last=killLog.slice(-40).reverse();
    let n=kills;
    for(const e of last){ h+=`<tr><td class="kill">${n--}</td><td>W${e.wave}</td><td>${STRAINS[e.kind].gl} ${STRAINS[e.kind].name}</td><td>${e.ref}</td><td>${e.by}</td></tr>`; }
    if(last.length===0) h+=`<tr><td colspan="5" style="color:#999">아직 격파 없음</td></tr>`;
    h+=`</table>`;
    panel.innerHTML=h;
  }
}
function esc(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ============================================================
// interaction
// ============================================================
function selectCell(i){
  if(selected>=0) cellEls[selected].classList.remove('sel');
  selected=i; cellEls[i].classList.add('sel');
  namebox.textContent=ref(i);
  // describe what's here
  if(i===coreI){ fmla.textContent=`=CORE(${ref(i)}, HP=${core.hp|0}/${core.max})  // 바이러스 도달 시 시스템 감염`; }
  else if(i===spawnI){ fmla.textContent=`=BREACH.POINT(${ref(i)})  // 바이러스 침투 시작점`; }
  else if(towerAt.has(i)){ const t=towerAt.get(i); fmla.textContent=`=TOWER("${TOWERS[t.kind].name}", ${ref(i)}, L${t.lvl}, dmg=${t.dmg}, range=${t.range.toFixed(1)})`; }
  else if(pathSet.has(i)){ fmla.textContent=`=PATH[${onPath[i]}/${path.length-1}](${ref(i)})  // 침식 경로`; }
  else { fmla.textContent=`=EMPTY(${ref(i)})  // 타워 설치 가능${manualBuild?' — 클릭하여 설치':''}`; }
}

sheet.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  const i=+t.dataset.i;
  if(manualBuild){
    if(placeable(i)){
      // build cheapest affordable, or scanner
      let kind='scan';
      for(const k of TOWER_ORDER){ if(defGold>=TOWERS[k].cost){ kind=k; } }
      // pick best affordable (highest cost the player can pay)
      let aff=TOWER_ORDER.filter(k=>defGold>=TOWERS[k].cost);
      kind = aff.length? aff[aff.length-1] : null;
      if(kind && placeTower(i,kind,false)) defGold-=TOWERS[kind].cost;
      else fmla.textContent=`=ERROR("자금 부족 또는 설치 불가", ${ref(i)})`;
    } else { fmla.textContent=`=ERROR("경로/점유 셀에는 설치 불가", ${ref(i)})`; }
  } else selectCell(i);
});
sheet.addEventListener('mousemove', e=>{
  const t=e.target.closest('.cell');
  if(hover>=0){ cellEls[hover].classList.remove('hov'); hover=-1; }
  if(t && manualBuild){ const i=+t.dataset.i; if(placeable(i)){ t.classList.add('hov'); hover=i; } }
});

// ============================================================
// toolbar controls
// ============================================================
const btnPause=document.getElementById('btnPause');
const btnSpeed=document.getElementById('btnSpeed');
const btnWave=document.getElementById('btnWave');
const btnBuild=document.getElementById('btnBuild');
const btnAuto=document.getElementById('btnAuto');
const hint=document.getElementById('hint');
btnPause.onclick=()=>{ running=!running; btnPause.querySelector('span').textContent= running?'⏸ 일시정지':'▶ 재생'; btnPause.classList.toggle('on',!running); };
const SPEEDS=[1,2,4]; let si=0;
btnSpeed.onclick=()=>{ si=(si+1)%SPEEDS.length; speedMul=SPEEDS[si]; btnSpeed.querySelector('span').textContent=`속도 ×${speedMul}`; };
btnWave.onclick=()=>{ if(gameOver)return; pendingSpawns=[]; betweenWave=true; waveTimer=99999; makeWave(); fmla.textContent=`=FORCE.WAVE(${wave})  // 사용자 개입: 즉시 소환`; };
btnBuild.onclick=()=>{ manualBuild=!manualBuild; btnBuild.classList.toggle('on',manualBuild);
  btnBuild.querySelector('span').textContent= manualBuild?'✓ 설치모드 (셀 클릭)':'＋수동 타워설치';
  hint.textContent = manualBuild? '설치모드: 빈 셀을 클릭하면 자금 내 최고급 타워가 놓입니다. 다시 누르면 해제.' : '관전 중 — 양측 AI가 자동 교전합니다. 셀 클릭=정보.'; };
btnAuto.onclick=()=>{ autoMode=!autoMode; btnAuto.classList.toggle('on',!autoMode);
  btnAuto.querySelector('span').textContent= autoMode?'관전(자동) 모드':'수동 개입 모드';
  hint.textContent = autoMode? '관전 중 — 방역 AI가 스스로 타워를 짓고 업그레이드합니다.' : '수동 개입: 방역 AI 정지. 직접 타워를 설치하세요(＋수동 타워설치).'; };

// keyboard: space=pause
addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); btnPause.click(); } });

// ============================================================
// tabs
// ============================================================
document.querySelectorAll('#tabs div').forEach(d=>{
  d.onclick=()=>{
    document.querySelectorAll('#tabs div').forEach(x=>x.classList.remove('on'));
    d.classList.add('on'); curTab=d.dataset.tab;
    if(curTab==='grid'){ panel.style.display='none'; legend.style.display='block'; }
    else { panel.style.display='block'; legend.style.display='none'; renderPanel(); }
  };
});

// ============================================================
// init
// ============================================================
function init(){
  buildGrid();
  genPath();
  renderStatic();
  selectCell(spawnI);
  fmla.textContent=`=DEFEND($A$1:$${colName(COLS-1)}$${ROWS}, "셀 침식 바이러스 격퇴")  // 양측 AI 자동 교전`;
  pushAI(`=INIT(grid ${COLS}×${ROWS}, path ${path.length}칸, core ${ref(coreI)})`, true);
  updateHUD();
}
init();

// seed a couple early towers so first paint already shows action-ready board,
// then let AI run. First wave starts shortly.
defGold=130;
defenderAI(); defenderAI();

let acc=0, lastT=performance.now();
function frame(now){
  acc += now-lastT; lastT=now;
  // run at ~14fps logic for readable spreadsheet feel
  while(acc>=70){ gameTick(); acc-=70; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// reflow on resize (rebuild grid + regen path, preserve score)
let rt;
addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>{
  const ph=core.hp, pm=core.max, k=kills, l=leaks, w=wave;
  buildGrid(); genPath(); towers=[]; towerAt.clear(); virus=[]; pendingSpawns=[]; lastVirusCells=new Set();
  renderStatic(); core.hp=ph; core.max=pm; kills=k; leaks=l; wave=Math.max(0,w-1); betweenWave=true; waveTimer=60;
  defGold+=120; selectCell(spawnI); defenderAI(); defenderAI(); updateHUD();
},250); });

// expose for self-test
window.__GAME__ = { get state(){ return {COLS,ROWS,pathLen:path.length,coreI,spawnI,towers:towers.length,virus:virus.length,wave,kills,coreHp:core.hp,gameOver}; },
  step(n){ for(let i=0;i<n;i++) gameTick(); } };
})();
</script>
