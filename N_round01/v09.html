<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;

  #titlebar span{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:14px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;
    overflow:hidden;white-space:nowrap}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px}
  #namebox{width:64px;min-width:64px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333}
  #fx{width:28px;min-width:28px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif}

  #sheetwrap{position:relative;overflow:hidden;background:#fff}
  #sheet{display:grid;background:#fff;position:relative;z-index:1}
  #fx-layer{position:absolute;inset:0;pointer-events:none;z-index:3}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;

  .cell{border-right:1px solid #e9e9e9;border-bottom:1px solid #e9e9e9;

  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:2}
  .hpbar{position:absolute;left:1px;right:1px;bottom:0;height:2px;background:#b91c1c;transform-origin:left;z-index:2}
  @keyframes hitf{0%{box-shadow:inset 0 0 0 2px #fff}100%{box-shadow:inset 0 0 0 0 transparent}}
  .hit{animation:hitf .25s 1}
  @keyframes boom{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
  .boom{animation:boom .4s 1}
  #legend{position:absolute;top:8px;right:12px;background:#fffce6;border:1px solid #d8c66a;
    box-shadow:2px 3px 8px rgba(0,0,0,.18);padding:7px 10px;font-size:11px;z-index:6;
    min-width:172px;max-width:200px;line-height:1.65}
  #legend .sw{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:middle}
  #legend h4{margin:0 0 2px;font-size:11px;color:#7a6a1f}
  #legend .bar{height:7px;background:#eee;border-radius:3px;overflow:hidden;margin:2px 0 4px}
  #legend .bar>i{display:block;height:100%}
  #ctrl{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.94);border:1px solid #cfcfcf;
    box-shadow:1px 2px 6px rgba(0,0,0,.14);padding:5px 6px;z-index:7;display:flex;gap:4px;
    align-items:center;flex-wrap:wrap;max-width:62vw}
  #ctrl button{font:inherit;font-size:11px;border:1px solid #b9b9b9;background:#f7f7f7;color:#333;
    padding:3px 7px;border-radius:3px;cursor:pointer}
  #ctrl button:hover{background:#ececec}
  #ctrl button.on{background:#107c41;color:#fff;border-color:#0c5e31}

  #hint{position:absolute;bottom:6px;left:8px;background:rgba(16,124,65,.92);color:#fff;
    padding:3px 8px;font-size:10.5px;border-radius:3px;z-index:7;opacity:0;transition:opacity .3s}
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 10px;gap:0;font-size:11.5px;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 8px;opacity:.5}
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:24px;
    border-top:1px solid #d4d4d4;font-size:11.5px}
  #tabs div{padding:3px 12px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  #panel{position:absolute;inset:0;background:#fff;z-index:4;overflow:auto;display:none;padding:0}
  #panel table{border-collapse:collapse;width:100%;font-size:11.5px}
  #panel td,#panel th{border:1px solid #e3e3e3;padding:3px 8px;text-align:left;white-space:nowrap}
  #panel th{background:#f5f5f5;color:#555;font-weight:600;position:sticky;top:0}
  #panel tr:nth-child(even) td{background:#fafafa}
  #panel .fx{font-family:Consolas,Menlo,monospace;font-size:11px;color:#1a4d2e}
  @media (max-width:480px){
    #menubar{gap:9px}
    #legend{min-width:120px;max-width:148px;font-size:10px;top:6px;right:6px;padding:5px 7px}
    #ctrl{max-width:60vw;padding:4px}
    #ctrl button{padding:2px 5px;font-size:10px}
  }
</style>

<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <span id="titletext">침공방어.xlsx - Excel</span>
</div>
<div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
<div id="fbar">
  <div id="namebox">A1</div>
  <div id="fx">fx</div>

</div>
<div id="sheetwrap">
  <div id="sheet"></div>
  <svg id="fx-layer"></svg>
  <div id="ctrl"></div>

</div>
<div id="tabs"><div class="on" data-tab="0">전장</div><div data-tab="1">전황</div><div data-tab="2" id="tab-dead">격파기록 (0)</div></div>
<div id="statusbar"></div>

<script>
(() => {
"use strict";
// ============================ 그리드 셋업 ============================
const isNarrow = innerWidth < 480;
const CW = isNarrow ? 30 : 34, CH = isNarrow ? 22 : 22;
const COLS = Math.max(14, Math.min(34, Math.floor((innerWidth - 50) / CW)));
const ROWS = Math.max(12, Math.min(24, Math.floor((innerHeight - 168) / CH)));
const N = COLS * ROWS;
const sheet = document.getElementById('sheet');
const fxLayer = document.getElementById('fx-layer');
const fmla = document.getElementById('formula');
const namebox = document.getElementById('namebox');
const statusbar = document.getElementById('statusbar');
const legend = document.getElementById('legend');
const ctrl = document.getElementById('ctrl');
const hintEl = document.getElementById('hint');
const panel = document.getElementById('panel');
const titletext = document.getElementById('titletext');
sheet.style.gridTemplateColumns = `40px repeat(${COLS}, ${CW}px)`;
sheet.style.gridAutoRows = CH + 'px';

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(c,r){return colName(c)+(r+1);}
function refI(i){return colName(i%COLS)+((i/COLS|0)+1);}

// ----- 시트 DOM -----
const cellEls = new Array(N);
const cornerL = 40;
{
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd'; frag.appendChild(corner);
  for (let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd';h.textContent=colName(c);frag.appendChild(h);}
  for (let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd';h.textContent=r+1;frag.appendChild(h);
    for (let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d;frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}
function cellCenter(i){
  const c=i%COLS, r=i/COLS|0;
  return { x: cornerL + c*CW + CW/2, y: r*CH + CH/2 + 22 /*header row*/ };
}

// ============================ 절차생성 경로 ============================
// 외계인은 우측(우주)에서 들어와 좌측의 지구 본부(BASE)로 진군한다.
// 여러 굴곡을 가진 셀 경로를 절차적으로 생성한다.
let path = [];      // [{c,r}] 진입(우)→본부(좌)
let pathSet = new Set();
let BASE = null;    // 본부 셀 idx (경로 끝)
let SPAWN = null;   // 진입 셀 idx (경로 시작)

function genPath(){
  // 우측 가장자리에서 시작, 좌측 가장자리(본부)로. 세그먼트형 미로.
  const startR = 1 + (Math.random()*(ROWS-2)|0);
  let r = startR, c = COLS-1;
  const pts = [{c,r}];
  const seen = new Set([r*COLS+c]);
  let guard = 0;
  while (c > 0 && guard++ < 600){
    // 좌측으로 일정 칸 전진
    const run = 1 + (Math.random()*3|0);
    for (let k=0;k<run && c>0;k++){
      c--; const id=r*COLS+c;
      if (seen.has(id)){c++;break;}
      pts.push({c,r}); seen.add(id);
    }
    if (c<=0) break;
    // 수직으로 굽힘
    const dir = Math.random()<.5?-1:1;
    const vrun = 1 + (Math.random()*Math.max(1,ROWS/3)|0);
    for (let k=0;k<vrun;k++){
      const nr = r+dir;
      if (nr<1 || nr>ROWS-2) break;
      const id=nr*COLS+c;
      if (seen.has(id)) break;
      r=nr; pts.push({c,r}); seen.add(id);
    }
  }
  // 본부는 좌측 가장자리
  if (c!==0){ c=0; const id=r*COLS+c; if(!seen.has(id)){pts.push({c,r});seen.add(id);} }
  path = pts;
  pathSet = new Set(path.map(p=>p.r*COLS+p.c));
  SPAWN = path[0].r*COLS+path[0].c;
  BASE = path[path.length-1].r*COLS+path[path.length-1].c;
}
genPath();

// 인접 빌드 가능 칸(경로 옆)을 미리 표시
function buildableCells(){
  const out=[];
  for (let i=0;i<N;i++){
    if (pathSet.has(i)) continue;
    if (towerAt.has(i)) continue;
    // 경로에 인접한 칸만 사거리 효율이 좋음 → 후보로
    out.push(i);
  }
  return out;
}

// ============================ 상태 ============================
const TOWERS = {
  L: {name:'레이저', glyph:'∟', icon:'L', cost:55, dmg:7,  rng:2.4, rate:26, color:'#0ea5e9', up:[ {dmg:12,rng:2.8,rate:22}, {dmg:20,rng:3.2,rate:18} ]},
  P: {name:'플라즈마', glyph:'φ', icon:'P', cost:90, dmg:18, rng:1.9, rate:42, color:'#a855f7', splash:1.4, up:[ {dmg:30,rng:2.2,rate:36,splash:1.6}, {dmg:48,rng:2.5,rate:30,splash:1.9} ]},
  R: {name:'레일건', glyph:'╪', icon:'R', cost:130,dmg:42, rng:4.2, rate:70, color:'#f59e0b', pierce:true, up:[ {dmg:70,rng:4.6,rate:60}, {dmg:110,rng:5.0,rate:52} ]},
  S: {name:'감속',   glyph:'≋', icon:'S', cost:60, dmg:2,  rng:2.2, rate:34, color:'#10b981', slow:.5, up:[ {dmg:4,rng:2.5,rate:30,slow:.42}, {dmg:6,rng:2.8,rate:26,slow:.34}]},
};
const towerAt = new Map();   // idx -> tower obj
let towers = [];
let aliens = [];
let beams = [];              // {x1,y1,x2,y2,color,t}
let booms = [];             // {i,t}
const dirty = new Set();

let money = 320;            // 디펜더 자금
let baseHP = 100, baseHPmax = 100;
let wave = 0, kills = 0, leaked = 0, scoreAlien = 0;
let alienBudget = 0;        // 외계 AI 자원
let tickN = 0, frame = 0;
let lastDef = '본부 가동 준비 완료.';
let lastAlien = '외계 함대 워프 대기 중.';
let lastFx = `=DEFEND($A$1:$${colName(COLS-1)}$${ROWS}, "지구 본부")`;
let selected = -1;
let paused = false, speedMul = 1;
let humanTool = null;       // 'L'/'P'/'R'/'S' 수동 설치 모드
const obituaries = [];      // 격파기록
const decisionLog = [];     // 전황(formula log)

const alienKinds = {
  grunt: {name:'정찰병', glyph:'ᗧ', color:'#22c55e', hp:18,  spd:.05, bounty:8,  budget:6},
  runner:{name:'침투기', glyph:'➤', color:'#84cc16', hp:12,  spd:.092,bounty:10, budget:8},
  tank:  {name:'모선',   glyph:'◈', color:'#ef4444', hp:90,  spd:.032,bounty:26, budget:24},
  swarm: {name:'군체',   glyph:'∴', color:'#f97316', hp:9,   spd:.07, bounty:5,  budget:4},
  shield:{name:'차폐기', glyph:'⬡', color:'#06b6d4', hp:40,  spd:.045,bounty:18, budget:18, shield:.4},
  boss:  {name:'여왕',   glyph:'♛', color:'#db2777', hp:520, spd:.026,bounty:120,budget:90},
};

function logFx(side, fx, human){
  lastFx = fx;
  fmla.textContent = fx;
  decisionLog.push({wave, side, fx, human:!!human});
  if (decisionLog.length>400) decisionLog.shift();
  if (panel.style.display==='block' && curTab===1) renderPanel();
}
function hint(t){ hintEl.textContent=t; hintEl.style.opacity=1; clearTimeout(hint._t); hint._t=setTimeout(()=>hintEl.style.opacity=0,1600); }

// ============================ 페인트 ============================
function paint(i){
  const el = cellEls[i];
  let bg='', tx='', col='#222', w='', title='';
  if (i===BASE){
    const hpf = Math.max(0,baseHP)/baseHPmax;
    bg = `rgba(16,124,65,${.18+.5*hpf})`; tx='⌂'; col='#0c5e31'; w='700';
  } else if (i===SPAWN){
    bg='#1f2937'; tx='⌖'; col='#fca5a5'; w='700';
  } else if (pathSet.has(i)){
    bg='#f1f3f5'; tx='·'; col='#adb5bd';
  } else if (towerAt.has(i)){
    const t=towerAt.get(i), def=TOWERS[t.kind];
    bg=hexA(def.color,.16+t.lvl*.16); tx=def.glyph; col=def.color; w='700';
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w; el.textContent=tx;
}
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}

// 외계인 + HP바 + 빔은 캔버스 대신 셀 오버레이 + SVG로
function repaintAll(){ for(let i=0;i<N;i++) paint(i); }

// ============================ 디펜더 AI ============================
// 예산 내에서: 누수 위험 높은 경로 구간 옆에 타워를 짓고, 이득 큰 타워를 업그레이드.
function pathCoverageScore(i){
  // 후보 칸 i가 커버하는 경로 칸 수 / 가중치 (경로 끝[본부 근처]일수록 가중)
  const cc = i%COLS, cr=i/COLS|0;
  let s=0;
  for (let p=0;p<path.length;p++){
    const dx=path[p].c-cc, dy=path[p].r-cr, d=Math.sqrt(dx*dx+dy*dy);
    if (d<=3.0){
      const lateWeight = 1 + (p/path.length); // 본부에 가까운 경로일수록 중요
      s += (3.0-d)*lateWeight;
    }
  }
  return s;
}
function chooseTowerKind(){
  // 적응: 현재 적 구성 + 자기 포탑 구성(편중 방지)을 함께 본다.
  const fast = aliens.filter(a=>a.spd>.06).length;
  const swarmy = aliens.filter(a=>a.kind==='swarm'||a.kind==='runner').length;
  const tanky = aliens.filter(a=>a.hp>60||a.shield).length;
  const cnt={L:0,P:0,R:0,S:0}; for(const t of towers)cnt[t.kind]++;
  const haveSlow = cnt.S>0;
  // 라이브 위협 카운터
  if (fast>=3 && !haveSlow && money>=TOWERS.S.cost) return 'S';
  if (tanky>=1 && money>=TOWERS.R.cost) return 'R';
  if (swarmy>=4 && money>=TOWERS.P.cost) return 'P';
  // 구성 다변화: 레이저가 절반 넘으면 다른 종류로
  if (cnt.L > towers.length*0.5 && towers.length>=3){
    if (!haveSlow && money>=TOWERS.S.cost) return 'S';
    if (money>=TOWERS.R.cost && Math.random()<.5) return 'R';
    if (money>=TOWERS.P.cost) return 'P';
  }
  // 자금 여유따라 강한 것
  if (money>=TOWERS.R.cost && Math.random()<.3) return 'R';
  if (money>=TOWERS.P.cost && Math.random()<.45) return 'P';
  return 'L';
}
// 시작 시 방어선 일부를 미리 깔아 즉사 방지 (관전 첫 페인트부터 교전감)
function seedDefense(n){
  for (let s=0;s<n;s++){
    let best=-1,bestS=-1;
    for (let k=0;k<120;k++){
      const i=Math.random()*N|0;
      if (pathSet.has(i)||towerAt.has(i)||i===BASE) continue;
      let sc=pathCoverageScore(i);
      for (const t of towers){const dx=(t.i%COLS)-(i%COLS),dy=(t.i/COLS|0)-(i/COLS|0);if(dx*dx+dy*dy<2)sc-=2;}
      if (sc>bestS){bestS=sc;best=i;}
    }
    if (best>=0 && money>=TOWERS.L.cost) placeTower(best,'L',false);
  }
}

let defCooldown = 0;
function defenderAI(){
  if (defCooldown>0){ defCooldown--; return; }
  // 1) 업그레이드 이득 평가: 적이 새는 중이거나 자금 풍부하면 업그레이드 우선
  const wantUpgrade = money>=120 && towers.length>=4 && Math.random()<.55;
  if (wantUpgrade){
    const cands = towers.filter(t=>t.lvl<2).sort((a,b)=>upgCost(b)-upgCost(a));
    // 가장 활약한(킬 많은) 타워를 우선 업글
    const best = towers.filter(t=>t.lvl<2).sort((a,b)=>b.kills-a.kills)[0];
    if (best && money>=upgCost(best)){
      money-=upgCost(best); best.lvl++;
      applyTower(best);
      dirty.add(best.i);
      const def=TOWERS[best.kind];
      logFx('def', `=UPGRADE("${def.name}", ${refI(best.i)}, Lv${best.lvl+1})  // 잔액 ${money}G`);
      defCooldown = 7;
      return;
    }
  }
  // 2) 신규 건설
  const kind = chooseTowerKind();
  const cost = TOWERS[kind].cost;
  if (money < cost) return;
  // 후보: 경로 비인접 + 빈칸 중 커버점수 최고
  let best=-1, bestS=-1;
  const tries = 64;
  for (let k=0;k<tries;k++){
    const i = Math.random()*N|0;
    if (pathSet.has(i)||towerAt.has(i)||i===BASE) continue;
    let s = pathCoverageScore(i);
    // 이미 타워 밀집한 곳은 감점(분산 배치)
    for (const t of towers){ const dx=(t.i%COLS)-(i%COLS),dy=(t.i/COLS|0)-(i/COLS|0); if(dx*dx+dy*dy<2) s-=2; }
    if (s>bestS){bestS=s;best=i;}
  }
  if (best<0 || bestS<=0.5) { defCooldown=2; return; }
  placeTower(best, kind, false);
  defCooldown = towers.length<5 ? 3 : 6;  // 초반은 빠르게 방어선 구축
}
function upgCost(t){ return Math.round(TOWERS[t.kind].cost * (0.8 + t.lvl*0.7)); }
function applyTower(t){
  const def=TOWERS[t.kind];
  const stats = t.lvl===0 ? def : def.up[t.lvl-1];
  t.dmg=stats.dmg; t.rng=stats.rng; t.rate=stats.rate;
  t.slow=stats.slow||def.slow; t.splash=stats.splash||def.splash; t.pierce=def.pierce;
  t.color=def.color;
}
function placeTower(i, kind, human){
  const def=TOWERS[kind];
  const t={i,kind,lvl:0,cd:0,kills:0};
  applyTower(t);
  towerAt.set(i,t); towers.push(t);
  money -= def.cost;
  dirty.add(i);
  logFx('def', `=BUILD("${def.name}", ${refI(i)}, ${def.cost}G)  // 잔액 ${money}G`, human);
  if (!human) lastDef = `${def.name} 포탑을 ${refI(i)}에 배치.`;
}

// ============================ 외계 AI (적응형 웨이브) ============================
let waveActive = false, spawnQueue = [], spawnTimer = 0, waveCooldown = 80;
let waveComp = '';
function planWave(){
  wave++;
  // 적응형: 방어가 강하면(타워 多/본부HP高) 더 강하고 단단한 적, 약하면 살살.
  const defStrength = towers.reduce((s,t)=>s+(t.dmg*(1+t.lvl)/(t.rate)),0) + towers.length*1.2;
  const baseHealthy = baseHP/baseHPmax;
  alienBudget = Math.round(18 + wave*7 + defStrength*1.1 + (baseHealthy>0.7?wave*3:0));
  // 초반 몇 파는 완만하게(즉사 방지, 엎치락뒤치락 워밍업)
  if (wave<=2) alienBudget = Math.round(alienBudget*0.55);
  else if (wave<=4) alienBudget = Math.round(alienBudget*0.8);
  // 본부가 위태로우면 외계도 자제(엎치락뒤치락 유지)
  if (baseHealthy < 0.35) alienBudget = Math.round(alienBudget*0.55);
  let bud = alienBudget;
  spawnQueue = [];
  const comp = {};
  // 보스 웨이브
  const isBoss = wave%6===0;
  if (isBoss){ spawnQueue.push('boss'); bud-=alienKinds.boss.budget; comp.boss=1; }
  // 구성 선택: 타워 종류 보고 카운터
  const haveSlow = towers.some(t=>t.kind==='S');
  const haveSplash = towers.some(t=>t.kind==='P');
  const haveRail = towers.some(t=>t.kind==='R');
  const pool=[];
  // 감속 많으면 떼거리(군체)로 압도, 스플래시 많으면 단단한 모선/차폐로 분산
  if (haveSplash) { pool.push('tank','shield'); }
  if (haveRail)   { pool.push('swarm','runner'); }  // 레일건은 단발 → 다수로
  if (haveSlow)   { pool.push('runner','tank'); }
  pool.push('grunt','runner','tank','swarm','shield');
  let guard=0;
  while (bud>4 && guard++<200){
    const k = pool[Math.random()*pool.length|0];
    const c = alienKinds[k];
    if (c.budget<=bud){ spawnQueue.push(k); bud-=c.budget; comp[k]=(comp[k]||0)+1; }
    else { spawnQueue.push('swarm'); bud-=alienKinds.swarm.budget; comp.swarm=(comp.swarm||0)+1; }
  }
  // 셔플
  for (let i=spawnQueue.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[spawnQueue[i],spawnQueue[j]]=[spawnQueue[j],spawnQueue[i]];}
  if (isBoss) spawnQueue.push('boss'), spawnQueue.unshift(...[]); // boss already added at front of comp
  waveComp = Object.entries(comp).map(([k,v])=>`${alienKinds[k].name}×${v}`).join('+');
  waveActive = true; spawnTimer = 0;
  lastAlien = `제${wave}파: ${waveComp} 진입.`;
  logFx('alien', `=WAVE(${wave}, "${waveComp}", 예산 ${alienBudget})${isBoss?'  // ⚠보스':''}`);
  titletext.textContent = `침공방어.xlsx - Excel (제${wave}파 진행 중)`;
}
function spawnAlien(kind){
  const c=alienKinds[kind];
  const a={kind, hp:c.hp, hpmax:c.hp, spd:c.spd, base:c.spd, bounty:c.bounty,
    color:c.color, glyph:c.glyph, shield:c.shield||0, t:0, /*경로 진행도 0..len-1*/ slowT:0};
  aliens.push(a);
}

// ============================ 전투 틱 ============================
function gameTick(){
  tickN++;
  // 웨이브 진행
  if (!waveActive && aliens.length===0){
    if (waveCooldown>0) waveCooldown--;
    else planWave();
  }
  if (waveActive){
    spawnTimer--;
    if (spawnTimer<=0 && spawnQueue.length){
      spawnAlien(spawnQueue.shift());
      // 보스는 간격 길게, 군체는 촘촘히
      spawnTimer = 6 + (Math.random()*8|0);
    }
    if (spawnQueue.length===0) { waveActive=false; waveCooldown = 60 + (Math.random()*40|0); }
  }

  // 외계인 이동
  for (let k=aliens.length-1;k>=0;k--){
    const a=aliens[k];
    let sp=a.spd;
    if (a.slowT>0){ a.slowT--; sp*=a.curSlow||1; }
    a.t += sp* (path.length-1);
    if (a.t >= path.length-1){
      // 본부 타격
      const dmg = a.kind==='boss'?20 : a.kind==='tank'?6 : a.kind==='shield'?4 : 2;
      baseHP -= dmg; leaked++;
      dirty.add(BASE);
      booms.push({x:cellCenter(BASE).x, y:cellCenter(BASE).y, t:8, color:a.color});
      aliens.splice(k,1);
      lastAlien = `${alienKinds[a.kind].name}이(가) 본부를 타격 (-${dmg}HP).`;
      if (tickN%2===0) logFx('alien', `=BREACH("${alienKinds[a.kind].name}", 본부, -${dmg}HP)  // HP ${Math.max(0,baseHP|0)}`);
      if (baseHP<=0) gameOver();
    }
  }

  // 타워 사격
  for (const t of towers){
    if (t.cd>0){ t.cd--; continue; }
    const tc=t.i%COLS, tr=t.i/COLS|0;
    // 사거리 내, 본부에 가장 가까운(진행도 큰) 적 우선
    let target=null, bestProg=-1;
    for (const a of aliens){
      const ap=alienPos(a);
      const dx=ap.c-tc, dy=ap.r-tr, d=Math.sqrt(dx*dx+dy*dy);
      if (d<=t.rng && a.t>bestProg){ bestProg=a.t; target=a; }
    }
    if (!target) continue;
    fireTower(t, target, tc, tr);
    t.cd = t.rate;
  }

  // 빔/폭발 감쇠
  for (let i=beams.length-1;i>=0;i--){ if(--beams[i].t<=0) beams.splice(i,1); }
  for (let i=booms.length-1;i>=0;i--){ if(--booms[i].t<=0) booms.splice(i,1); }

  // 본부 자가 수복: 교전 소강기에 천천히 회복(엎치락뒤치락·롱런 보장)
  if (!waveActive && aliens.length===0 && baseHP<baseHPmax && tickN%10===0){
    baseHP=Math.min(baseHPmax, baseHP+1); dirty.add(BASE);
  }
  // 디펜더 AI (자금 수입 = 소득 + 격파 바운티는 즉시)
  if (tickN%4===0) money += 1; // 패시브 소득
  defenderAI();

  // 그리기
  for (const i of dirty) paint(i);
  dirty.clear();
  renderEntities();
  updateStatus();
}

function alienPos(a){
  const seg = Math.min(path.length-1, a.t);
  const i0 = Math.floor(seg), i1=Math.min(path.length-1, i0+1), f=seg-i0;
  const p0=path[i0], p1=path[i1];
  return { c: p0.c+(p1.c-p0.c)*f, r: p0.r+(p1.r-p0.r)*f };
}
function fireTower(t, a, tc, tr){
  const def=TOWERS[t.kind];
  const ap=alienPos(a);
  const x1=cornerL+tc*CW+CW/2, y1=tr*CH+CH/2+22;
  const x2=cornerL+ap.c*CW+CW/2, y2=ap.r*CH+CH/2+22;
  beams.push({x1,y1,x2,y2,color:def.color,t:t.kind==='R'?6:4, w:t.kind==='R'?3:t.kind==='P'?3:1.6});
  // 감속
  if (t.slow){ a.slowT=24; a.curSlow=t.slow; }
  // 데미지(차폐 감쇠)
  let dmg=t.dmg * (a.shield?(1-a.shield):1);
  hitAlien(a, dmg, t);
  // 스플래시
  if (t.splash){
    for (const o of aliens){ if(o===a) continue; const op=alienPos(o); const dx=op.c-ap.c,dy=op.r-ap.r; if(Math.sqrt(dx*dx+dy*dy)<=t.splash){ hitAlien(o, dmg*.5, t);} }
  }
  // 관통(레일건): 직선상 추가타
  if (t.pierce){
    for (const o of aliens){ if(o===a) continue; const op=alienPos(o); const dx=op.c-tc,dy=op.r-tr,d=Math.sqrt(dx*dx+dy*dy); if(d<=t.rng && Math.random()<.5){ hitAlien(o, dmg*.6, t);} }
  }
}
function hitAlien(a, dmg, t){
  a.hp -= dmg;
  if (a.hp<=0 && !a._dead){
    a._dead=true;
    money += a.bounty; scoreAlien += a.bounty;
    kills++; t.kills++;
    const idx = aliens.indexOf(a);
    const ap=alienPos(a);
    booms.push({x:cornerL+ap.c*CW+CW/2, y:ap.r*CH+CH/2+22, t:8, color:a.color});
    if (idx>=0) aliens.splice(idx,1);
    obituaries.push({wave, name:alienKinds[a.kind].name, by:TOWERS[t.kind].name, cell:refI(t.i)});
    if (kills%5===0) logFx('def', `=KILL("${alienKinds[a.kind].name}" ← "${TOWERS[t.kind].name}" ${refI(t.i)})  // +${a.bounty}G`);
    document.getElementById('tab-dead').textContent = `격파기록 (${obituaries.length})`;
    if (panel.style.display==='block' && curTab===2) renderPanel();
  }
}

let over=false;
function gameOver(){
  if (over) return; over=true;
  logFx('alien', `=GAME.OVER("본부 함락", 제${wave}파, 격파 ${kills})`);
  titletext.textContent = `침공방어.xlsx - Excel (본부 함락 · 제${wave}파)`;
  hint(`본부 함락! 30개 파 중 제${wave}파까지 방어 · 격파 ${kills} — 5초 후 재침공`);
  setTimeout(()=>{ resetGame(); }, 5000);
}
function resetGame(){
  over=false;
  towerAt.clear(); towers=[]; aliens=[]; beams=[]; booms=[];
  money=320; baseHP=baseHPmax; wave=0; kills=0; leaked=0; scoreAlien=0;
  waveActive=false; spawnQueue=[]; waveCooldown=80; defCooldown=0;
  obituaries.length=0; decisionLog.length=0;
  genPath();
  repaintAll();
  seedDefense(3);
  logFx('def', `=RESTART("지구 본부 재건", $A$1:$${colName(COLS-1)}$${ROWS})`);
  document.getElementById('tab-dead').textContent = `격파기록 (0)`;
}

// ============================ SVG 엔티티 렌더 ============================
function renderEntities(){
  const W=sheet.clientWidth||sheet.offsetWidth, H=(sheet.clientHeight||sheet.offsetHeight);
  fxLayer.setAttribute('viewBox',`0 0 ${W} ${H}`);
  fxLayer.setAttribute('width',W); fxLayer.setAttribute('height',H);
  let s='';
  // 타워 사거리 미세 표시(선택된 타워만)
  if (selected>=0 && towerAt.has(selected)){
    const t=towerAt.get(selected); const cc=cellCenter(selected);
    s+=`<circle cx="${cc.x}" cy="${cc.y}" r="${t.rng*CW}" fill="${hexA(t.color,.07)}" stroke="${hexA(t.color,.4)}" stroke-dasharray="3 3"/>`;
  }
  // 빔
  for (const b of beams){
    s+=`<line x1="${b.x1}" y1="${b.y1}" x2="${b.x2}" y2="${b.y2}" stroke="${b.color}" stroke-width="${b.w}" stroke-linecap="round" opacity="${b.t/6}"/>`;
    s+=`<circle cx="${b.x2}" cy="${b.y2}" r="${b.w+1.5}" fill="${b.color}" opacity="${b.t/8}"/>`;
  }
  // 외계인
  for (const a of aliens){
    const ap=alienPos(a);
    const x=cornerL+ap.c*CW+CW/2, y=ap.r*CH+CH/2+22;
    const sc = a.kind==='boss'?16 : a.kind==='tank'?12 : a.kind==='shield'?11 : 9;
    s+=`<text x="${x}" y="${y+sc*0.36}" font-size="${sc}" text-anchor="middle" fill="${a.color}" font-weight="700" style="paint-order:stroke;stroke:#fff;stroke-width:2px">${a.glyph}</text>`;
    // HP바
    const f=Math.max(0,a.hp)/a.hpmax, bw=CW-8;
    s+=`<rect x="${x-bw/2}" y="${y-sc*0.7-3}" width="${bw}" height="2.5" fill="#e5e7eb"/>`;
    s+=`<rect x="${x-bw/2}" y="${y-sc*0.7-3}" width="${bw*f}" height="2.5" fill="${f>.5?'#22c55e':f>.25?'#f59e0b':'#ef4444'}"/>`;
    if (a.slowT>0) s+=`<circle cx="${x}" cy="${y}" r="${sc*0.7}" fill="none" stroke="#10b981" stroke-width="1" opacity=".6"/>`;
  }
  // 폭발
  for (const b of booms){
    const r=(8-b.t)*2+3;
    s+=`<circle cx="${b.x}" cy="${b.y}" r="${r}" fill="none" stroke="${b.color}" stroke-width="2" opacity="${b.t/8}"/>`;
  }
  fxLayer.innerHTML=s;
}

// ============================ 상태바/범례 ============================
function updateStatus(){
  const st = over?'본부 함락':waveActive?`제${wave}파 교전`:aliens.length?'교전 중':'재정비';
  statusbar.innerHTML =
    `${st}<span class="sep">|</span>본부 HP ${Math.max(0,baseHP|0)}/${baseHPmax}`+
    `<span class="sep">|</span>자금 ${money}G<span class="sep">|</span>제${wave}파`+
    `<span class="sep">|</span>격파 ${kills} · 누수 ${leaked}`+
    `<span class="sep">|</span>${over?lastAlien:(tickN%2?lastDef:lastAlien)}`;
  if (frame%6===0){
    const hpf=Math.max(0,baseHP)/baseHPmax;
    let h=`<h4>전황 (제${wave}파)</h4>`;
    h+=`<div>본부 HP ${Math.max(0,baseHP|0)}/${baseHPmax}</div><div class="bar"><i style="width:${hpf*100}%;background:${hpf>.4?'#22c55e':'#ef4444'}"></i></div>`;
    h+=`<div>자금 ${money}G · 적 ${aliens.length}기</div>`;
    h+=`<div>격파 ${kills} · 누수 ${leaked}</div>`;
    h+=`<h4 style="margin-top:5px">방어 포탑 ${towers.length}</h4>`;
    const cnt={};for(const t of towers){const n=TOWERS[t.kind].name;cnt[n]=(cnt[n]||0)+1;}
    for(const[k,v]of Object.entries(cnt)){const def=Object.values(TOWERS).find(d=>d.name===k);h+=`<div><span class="sw" style="background:${def.color}"></span>${k} ×${v}</div>`;}
    if(!towers.length)h+=`<div style="color:#999">설치 대기…</div>`;
    legend.innerHTML=h;
  }
  frame++;
}

// ============================ 컨트롤 (관전+개입) ============================
function buildCtrl(){
  ctrl.innerHTML='';
  const mk=(label,fn,id)=>{const b=document.createElement('button');b.textContent=label;b.onclick=fn;if(id)b.id=id;return b;};
  ctrl.appendChild(document.createElement('span')).className='tag';
  ctrl.lastChild.textContent='관전:';
  const pb=mk('▌▌일시정지',()=>{paused=!paused;pb.textContent=paused?'▶ 재생':'▌▌일시정지';pb.classList.toggle('on',paused);},'btn-pause');
  ctrl.appendChild(pb);
  const sb=mk('▶▶ '+speedMul+'x',()=>{speedMul=speedMul===1?2:speedMul===2?4:1;sb.textContent='▶▶ '+speedMul+'x';},'btn-speed');
  ctrl.appendChild(sb);
  ctrl.appendChild(mk('⚡웨이브 소환',()=>{ if(!waveActive&&!over){waveCooldown=0; hint('수동 웨이브 소환!');} }));
  const tag2=document.createElement('span');tag2.className='tag';tag2.textContent='개입설치:';ctrl.appendChild(tag2);
  for (const k of Object.keys(TOWERS)){
    const def=TOWERS[k];
    const b=mk(`${def.icon}·${def.cost}`,()=>{ humanTool=humanTool===k?null:k; updateToolBtns(); hint(humanTool?`${def.name} 설치 모드 — 빈 칸 클릭`:'설치 모드 해제');},'tool-'+k);
    b.title=def.name; b.style.color=def.color; ctrl.appendChild(b);
  }
}
function updateToolBtns(){ for(const k of Object.keys(TOWERS)){const b=document.getElementById('tool-'+k); if(b)b.classList.toggle('on',humanTool===k);} }

// ============================ 셀 클릭 ============================
sheet.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  const i=+t.dataset.i;
  // 수동 설치 모드
  if (humanTool){
    if (pathSet.has(i)||towerAt.has(i)||i===BASE){ hint('여기엔 설치 불가 (경로/본부/중복)'); return; }
    const def=TOWERS[humanTool];
    if (money<def.cost){ hint(`자금 부족 (${money}G/${def.cost}G)`); return; }
    placeTower(i, humanTool, true);
    hint(`${def.name} 설치 완료 ${refI(i)}`);
    return;
  }
  if (selected>=0) cellEls[selected].classList.remove('sel');
  selected=i; t.classList.add('sel');
  namebox.textContent=refI(i);
  // 셀 정보를 수식바에
  if (i===BASE) fmla.textContent=`=BASE("지구 본부", HP=${Math.max(0,baseHP|0)}/${baseHPmax})`;
  else if (i===SPAWN) fmla.textContent=`=WARP.GATE("외계 진입점", 제${wave}파)`;
  else if (towerAt.has(i)){const tw=towerAt.get(i),def=TOWERS[tw.kind];fmla.textContent=`=TOWER("${def.name}", Lv${tw.lvl+1}, DMG=${tw.dmg}, RNG=${tw.rng}, 격파=${tw.kills})`;}
  else if (pathSet.has(i)) fmla.textContent=`=PATH(${refI(i)}, 외계 진군로)`;
  else fmla.textContent=`=EMPTY(${refI(i)}, "타워 설치 가능")`;
});

function renderPanel(){
  if (curTab===1){
    // 전황: 의사결정 로그
    let h='<table><tr><th>파</th><th>주체</th><th>의사결정 (수식)</th></tr>';
    for (const d of decisionLog.slice(-120).reverse()){
      const who = d.side==='def'?'🛡 방어AI':'👾 외계AI';
      h+=`<tr><td>${d.wave}</td><td>${who}${d.human?' (사람)':''}</td><td class="fx">${escapeHtml(d.fx)}</td></tr>`;
    }
    h+='</table>'; panel.innerHTML=h;
  } else if (curTab===2){
    // 격파기록
    let h=`<table><tr><th>#</th><th>파</th><th>격파된 외계</th><th>처치 포탑</th><th>위치</th></tr>`;
    const list=obituaries.slice(-150).reverse();
    list.forEach((o,n)=>{ h+=`<tr><td>${obituaries.length-n}</td><td>${o.wave}</td><td>${o.name}</td><td>${o.by}</td><td>${o.cell}</td></tr>`; });

    h+='</table>'; panel.innerHTML=h;

}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
