<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정전.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;overflow:hidden;white-space:nowrap}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px}
  #namebox{min-width:64px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;padding:0 4px}
  #fx{width:28px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif;flex:none}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #sheetwrap{position:relative;overflow:hidden;background:#fff}
  #sheet{display:grid;background:#fff;position:relative}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:11px}
  .cell{position:relative;border-right:1px solid #e6e6e6;border-bottom:1px solid #e6e6e6;
    display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;
    overflow:hidden;cursor:cell}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:6}
  .cell .glyph{position:relative;z-index:2;pointer-events:none}
  .hpbar{position:absolute;left:1px;right:1px;bottom:1px;height:2px;background:#3a0a0a;z-index:3;pointer-events:none}
  .hpbar>i{display:block;height:100%;background:#ff5252}
  .rng{position:absolute;inset:0;z-index:1;pointer-events:none;background:rgba(16,124,65,.10);box-shadow:inset 0 0 0 1px rgba(16,124,65,.4)}
  @keyframes zap{0%{opacity:.95}100%{opacity:0}}
  .beam{position:absolute;z-index:5;height:2px;background:linear-gradient(90deg,#fff8c0,#ffd000);transform-origin:0 50%;
    animation:zap .18s linear forwards;pointer-events:none;box-shadow:0 0 4px #ffd000}
  @keyframes pop{0%{transform:scale(.4);opacity:0}30%{opacity:1}100%{transform:scale(1.5) translateY(-14px);opacity:0}}
  .float{position:absolute;z-index:7;font-size:11px;font-weight:700;pointer-events:none;animation:pop 1s ease-out forwards;white-space:nowrap;text-shadow:0 1px 2px #fff}
  #panel{position:absolute;top:8px;right:12px;background:#fffce6;border:1px solid #d8c66a;
    box-shadow:2px 3px 8px rgba(0,0,0,.18);padding:8px 11px;font-size:11px;z-index:8;
    min-width:188px;max-width:220px;line-height:1.65}
  #panel h4{margin:0 0 3px;font-size:11px;color:#7a6a1f}
  #panel .row{display:flex;justify-content:space-between;gap:8px}
  #panel .sw{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:baseline;border-radius:2px}
  #panel .bar{height:7px;background:#e7e2c0;border-radius:3px;overflow:hidden;margin:2px 0 5px}
  #panel .bar>i{display:block;height:100%}
  #panel .dead{color:#999;font-size:10.5px}
  #logbox{margin-top:6px;border-top:1px dashed #d8c66a;padding-top:4px;max-height:96px;overflow:hidden}
  #logbox div{font-size:10px;color:#6a5d22;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 10px;font-size:11.5px;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 8px;opacity:.5}
  #statusbar b{font-weight:700;color:#fff}
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:26px;
    border-top:1px solid #d4d4d4;font-size:11.5px}
  #tabs div{padding:3px 13px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  #ctl{position:absolute;bottom:30px;left:0;right:0;height:30px;background:rgba(243,242,241,.96);
    border-top:1px solid #e1e1e1;display:flex;align-items:center;gap:6px;padding:0 10px;z-index:9;font-size:11.5px}
  #ctl button{font-family:inherit;font-size:11px;border:1px solid #c9c9c9;background:#fff;color:#333;
    padding:3px 9px;border-radius:3px;cursor:pointer}
  #ctl button:hover{background:#eef6f0;border-color:#107c41}
  #ctl button.on{background:#107c41;color:#fff;border-color:#107c41}
  #ctl .hint{margin-left:auto;color:#777;font-size:10.5px}
  #buildmode{color:#107c41;font-weight:600}
  /* alt sheets */
  .altsheet{position:absolute;inset:0;background:#fff;overflow:auto;z-index:4;padding:0;display:none}
  .altsheet table{border-collapse:collapse;width:100%;font-size:12px}
  .altsheet th,.altsheet td{border:1px solid #e3e3e3;padding:3px 8px;text-align:left}
  .altsheet th{background:#f5f5f5;color:#555;font-weight:600;position:sticky;top:0}
  .altsheet td.r{text-align:right;font-family:Consolas,monospace}
  .altsheet .ttl{padding:7px 10px;font-weight:600;color:#107c41;background:#f0f7f2;border-bottom:1px solid #d4d4d4}
</style>
</head>
<body>
<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <span id="ttl">정전.xlsx - Excel</span>
</div>
<div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
<div id="fbar">
  <div id="namebox">A1</div>
  <div id="fx">fx</div>
  <div id="formula">=SIM.GRIDWAR($A$1:$AZ$99,"정전 유령 vs 전력 타워")</div>
</div>
<div id="sheetwrap">
  <div id="sheet"></div>
  <div id="sheet-board" class="altsheet"></div>
  <div id="sheet-log" class="altsheet"></div>
  <div id="panel"></div>
  <div id="ctl">
    <button id="bpause">⏸ 일시정지</button>
    <button id="bspd">▶ 1x</button>
    <button id="bbuild">＋ 직접 설치</button>
    <button id="bwave">⚡ 웨이브 소환</button>
    <span class="hint" id="hint">관전 모드 — 양측 AI가 자동 교전 중</span>
  </div>
</div>
<div id="tabs">
  <div class="on" data-sheet="grid">전장</div>
  <div data-sheet="board">전황</div>
  <div data-sheet="log">격파기록</div>
</div>
<div id="statusbar"></div>

<script>
(() => {
'use strict';
const W = window;
const small = innerWidth < 560;
const CW = small ? 26 : 34, CH = small ? 22 : 22;
const COLS = Math.max(13, Math.min(46, Math.floor((innerWidth - 50) / CW)));
const ROWS = Math.max(12, Math.min(34, Math.floor((innerHeight - 168) / CH)));
const N = COLS * ROWS;

const sheet = document.getElementById('sheet');
const fmla = document.getElementById('formula');
const namebox = document.getElementById('namebox');
const statusbar = document.getElementById('statusbar');
const panel = document.getElementById('panel');
sheet.style.gridTemplateColumns = `40px repeat(${COLS}, ${CW}px)`;
sheet.style.gridAutoRows = CH + 'px';

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(i){return colName(i%COLS)+(Math.floor(i/COLS)+1);}
function rc(r,c){return r*COLS+c;}
function rnd(a,b){return a+Math.random()*(b-a);}
function ri(a,b){return a+(Math.random()*(b-a+1)|0);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

// ---------- build sheet DOM ----------
const cellEls = new Array(N);
{
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd';h.textContent=colName(c);frag.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div');h.className='hd';h.textContent=r+1;frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.dataset.i=rc(r,c);
      const g=document.createElement('span');g.className='glyph';d.appendChild(g);
      cellEls[rc(r,c)]=d;frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}
const fxLayer = document.createElement('div');
fxLayer.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:7';
sheet.appendChild(fxLayer);

// ---------- terrain / path ----------
// cell.kind: 'open'(buildable land), 'path'(monster road), 'wall'(blocked), 'spawn', 'core'
const cells = new Array(N);
for(let i=0;i<N;i++) cells[i]={kind:'open',tower:null,hist:[],wallGlyph:''};

// Carve a long boustrophedon (serpentine) path that snakes through the whole grid:
// horizontal bands separated by gaps, joined by vertical jogs at alternating ends.
// Guarantees a long, central, winding road and lots of build cells beside it.
const path = [];
function carvePath(){
  // Aim for ~3-4 road bands: long enough to be a winding gauntlet, short enough that
  // monsters can actually punch through (keeps the contest a see-saw, not a walkover).
  const wantBands = ROWS >= 26 ? 4 : 3;
  const bandRows = [];
  const usable = ROWS - 3;                 // rows 1..ROWS-2
  const step = Math.max(3, Math.floor(usable / (wantBands-1)));
  for(let r = 1; r <= ROWS-2 && bandRows.length < wantBands; r += step) bandRows.push(r);
  if(bandRows.length < 2){ bandRows.length=0; bandRows.push(1, ROWS-2); }
  const cLo = 1, cHi = COLS-2;
  // spawn at left edge of first band
  let firstR = bandRows[0];
  const spawnIdx = rc(firstR, 0);
  path.push(spawnIdx);
  path.push(rc(firstR, cLo-1>=0?0:cLo)); // ensure entry
  let leftToRight = true;
  let coreIdx = spawnIdx;
  for(let bi=0; bi<bandRows.length; bi++){
    const r = bandRows[bi];
    // sweep this band horizontally
    if(leftToRight){ for(let c=cLo; c<=cHi; c++) path.push(rc(r,c)); }
    else { for(let c=cHi; c>=cLo; c--) path.push(rc(r,c)); }
    const endC = leftToRight ? cHi : cLo;
    // vertical jog down to next band (if any)
    if(bi < bandRows.length-1){
      const nr = bandRows[bi+1];
      for(let rr=r+1; rr<=nr; rr++) path.push(rc(rr, endC));
    } else {
      // final band: core is at the band's far end
      coreIdx = rc(r, endC);
    }
    leftToRight = !leftToRight;
  }
  // mark kinds
  for(const p of path){ if(p!==spawnIdx) cells[p].kind='path'; }
  cells[spawnIdx].kind='spawn';
  cells[coreIdx].kind='core';
  return {spawnIdx, coreIdx};
}
let SPAWN, CORE;
(function(){const x=carvePath();SPAWN=x.spawnIdx;CORE=x.coreIdx;})();
// dedupe path keep order, build waypoint list of unique-ish cells
const wpts = [];
{const seen=new Set();for(const p of path){if(!seen.has(p)){seen.add(p);wpts.push(p);}}}
// path index lookup for adjacency-to-path detection
const pathSet = new Set(wpts);

// scatter some walls (server racks / obstacles) on open cells away from path
for(let i=0;i<N;i++){
  if(cells[i].kind!=='open') continue;
  // keep cells adjacent to path open (build spots)
  let nearPath=false;
  const r=i/COLS|0,c=i%COLS;
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    const nr=r+dr,nc=c+dc;if(nr<0||nc<0||nr>=ROWS||nc>=COLS)continue;
    if(pathSet.has(rc(nr,nc)))nearPath=true;
  }
  if(!nearPath && Math.random()<.045){
    cells[i].kind='wall';
    cells[i].wallGlyph = Math.random()<.5?'▦':'▤';
  }
}

// center pixel of a cell within sheet (sheet has 40px header col + 22px header row)
function cellCenter(i){
  const r=i/COLS|0,c=i%COLS;
  return {x:40 + c*CW + CW/2, y:CH + r*CH + CH/2};
}

// ---------- economy / sides ----------
const DEF = {color:'#107c41', power:90, income:3, kills:0, leaked:0, towers:0, alarm:0};
const GHO = {color:'#7c3aed', energy:30, gen:8, sent:0, dead:0, wave:0, mood:'정찰'};
let coreHP = 100, coreMax = 100;
let tick = 0, year = 0; // year = wave counter for flavor
let waveActive = false, waveTimer = 360, intermission = 360;

// ---------- towers ----------
// types tuned so neither side instantly wins
const TOWERS = {
  arc:   {name:'아크등',  glyph:'⚡', cost:38, dmg:7,  rng:1.7, rate:26, slow:0,  splash:0, color:'#0d8f4f', up:[{cost:46,dmg:13,rng:2.0,rate:22},{cost:70,dmg:22,rng:2.3,rate:18}]},
  coil:  {name:'코일포',  glyph:'电', cost:60, dmg:16, rng:2.4, rate:46, slow:0,  splash:1.4, color:'#1f6fd0', up:[{cost:78,dmg:28,splash:1.6},{cost:120,dmg:46,splash:1.9}]},
  fros:  {name:'서리등',  glyph:'❄', cost:44, dmg:3,  rng:2.1, rate:30, slow:.45,splash:0, color:'#0e9aa7', up:[{cost:52,slow:.55,rng:2.4},{cost:80,slow:.65,dmg:6}]},
  surge: {name:'서지탑',  glyph:'塔', cost:95, dmg:34, rng:3.0, rate:62, slow:0,  splash:0, color:'#b06a00', up:[{cost:120,dmg:58,rng:3.3},{cost:180,dmg:95,rate:54}]},
};
function towerStat(t){
  const base = TOWERS[t.type];
  let s = {dmg:base.dmg,rng:base.rng,rate:base.rate,slow:base.slow,splash:base.splash};
  for(let k=0;k<t.lvl;k++){const u=base.up[k];if(u)for(const key in u){if(key!=='cost')s[key]=u[key];}}
  return s;
}

// ---------- monsters ----------
// ghost types
const GHOSTS = {
  flick: {name:'깜빡유령', glyph:'幽', hp:38,  spd:.140, bounty:4,  energy:6,  color:'#9b6dff'},
  surge: {name:'과전압령', glyph:'煞', hp:72,  spd:.100, bounty:7,  energy:11, color:'#c026d3'},
  black: {name:'블랙아웃', glyph:'鬼', hp:165, spd:.062, bounty:13, energy:22, color:'#6d28d9', armor:3},
  swarm: {name:'스파크떼', glyph:'灯', hp:20,  spd:.190, bounty:2,  energy:3,  color:'#a78bfa'},
  phase: {name:'위상령',   glyph:'霊', hp:58,  spd:.125, bounty:8,  energy:14, color:'#7c3aed', phase:true},
};
let monsters = []; // {type,hp,maxhp,t (0..wpts-1 progress as float),slowT,el?}
let mid = 0;

// ---------- logging ----------
const log = [];
function pushLog(formula, msg, who){
  log.push({wave:GHO.wave, tick, formula, msg, who});
  if(log.length>240) log.shift();
  fmla.textContent = formula;
}
function flagFormula(f){ fmla.textContent = f; }

// ---------- rendering ----------
const dirty = new Set();
function markDirty(i){ if(i>=0&&i<N) dirty.add(i); }
function glyphFor(i){
  const c = cells[i];
  if(c.kind==='spawn') return {g:'◈', col:'#6d28d9', bg:'#e4d7f7', w:'700'};
  if(c.kind==='core')  return {g:'⌂', col:'#0a6b38', bg:'#c9ecd6', w:'700'};
  if(c.kind==='wall')  return {g:c.wallGlyph, col:'#aaa', bg:'#efefef', w:''};
  if(c.kind==='path')  return {g:'·', col:'#c8a8e8', bg:'#ece0f7', w:''};
  return {g:'', col:'#222', bg:'', w:''};
}
function paintCell(i){
  const el = cellEls[i], c = cells[i];
  const gEl = el.firstChild;
  const base = glyphFor(i);
  let bg = base.bg, g = base.g, col = base.col, w = base.w;
  if(c.tower){
    const T = TOWERS[c.tower.type];
    g = T.glyph; col = T.color; w='700';
    bg = c.tower.lvl>=2 ? hexA(T.color,.30) : c.tower.lvl>=1 ? hexA(T.color,.20) : hexA(T.color,.12);
  }
  el.style.background = bg;
  gEl.style.color = col; gEl.style.fontWeight = w;
  gEl.textContent = g;
}
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

// initial paint
for(let i=0;i<N;i++) paintCell(i);

// monster + range overlays are drawn on a separate canvas-like absolute layer for perf
// We render monsters as floating spans on fxLayer each frame (small counts).
const monLayer = document.createElement('div');
monLayer.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:6';
sheet.appendChild(monLayer);

function lerpPos(t){
  // t in [0, wpts.length-1]
  const i = Math.floor(t);
  if(i>=wpts.length-1) return cellCenter(wpts[wpts.length-1]);
  const a = cellCenter(wpts[i]), b = cellCenter(wpts[i+1]);
  const f = t-i;
  return {x:a.x+(b.x-a.x)*f, y:a.y+(b.y-a.y)*f};
}

// ---------- floating text / beams ----------
function floatText(x,y,txt,color){
  const d=document.createElement('div');d.className='float';d.textContent=txt;
  d.style.left=x+'px';d.style.top=y+'px';d.style.color=color;
  fxLayer.appendChild(d);setTimeout(()=>d.remove(),1000);
}
function beam(x1,y1,x2,y2,color){
  const d=document.createElement('div');d.className='beam';
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;
  d.style.left=x1+'px';d.style.top=y1+'px';d.style.width=len+'px';
  d.style.transform=`rotate(${ang}deg)`;
  if(color)d.style.background=`linear-gradient(90deg,#fff,${color})`;
  fxLayer.appendChild(d);setTimeout(()=>d.remove(),180);
}

// ---------- DEFENDER AI ----------
// Strategy: maintain coverage of the path, prioritize choke (cells touching most path),
// adapt mix to ghost composition, upgrade when rich. Never overspend below safety floor.
function pathTouchCount(i){
  const r=i/COLS|0,c=i%COLS; let n=0;
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(!dr&&!dc)continue;const nr=r+dr,nc=c+dc;if(nr<0||nc<0||nr>=ROWS||nc>=COLS)continue;
    if(pathSet.has(rc(nr,nc)))n++;
  }
  return n;
}
const buildSpots = [];
for(let i=0;i<N;i++){ if(cells[i].kind==='open' && pathTouchCount(i)>0) buildSpots.push(i); }
buildSpots.sort((a,b)=>pathTouchCount(b)-pathTouchCount(a));
// Tower cap: keep gaps in the gauntlet so monsters can break through -> real contest.
const TOWER_CAP = clamp(Math.round(buildSpots.length * 0.16), 7, 22);

function existingCoverage(i){
  // how many towers already cover area near i (discourage clumping)
  let n=0; const ci=cellCenter(i);
  for(let j=0;j<N;j++){ if(cells[j].tower){ const cj=cellCenter(j); if(Math.hypot(ci.x-cj.x,ci.y-cj.y) < 2.4*CW) n++; } }
  return n;
}
function chooseTowerType(){
  // adapt to ghost threat: many fast/swarm -> arc/fros; tanky black -> surge/coil
  let tank=0,fast=0,total=monsters.length||1;
  for(const m of monsters){ if(m.type==='black'||m.type==='surge')tank++; if(m.type==='swarm'||m.type==='flick')fast++; }
  const tankR=tank/total, fastR=fast/total;
  const r=Math.random();
  const haveSurge = countType('surge');
  if(DEF.power>=140 && tankR>.25 && haveSurge<2 && r<.5) return 'surge';
  if(tankR>.3 && r<.55) return 'coil';
  if(fastR>.45 && r<.5) return 'fros';
  if(GHO.wave>=3 && DEF.power>=95 && r<.25 && haveSurge<3) return 'surge';
  if(r<.30) return 'fros';
  if(r<.62) return 'coil';
  return 'arc';
}
function countType(t){let n=0;for(let i=0;i<N;i++)if(cells[i].tower&&cells[i].tower.type===t)n++;return n;}

function defenderThink(){
  DEF.alarm = clamp(monsters.length*4 + (coreMax-coreHP), 0, 100);
  // upgrade pass: if rich and front towers exist
  if(DEF.power>=70 && Math.random()<.5){
    const cands=[];
    for(let i=0;i<N;i++){const t=cells[i].tower;if(t){const base=TOWERS[t.type];if(t.lvl<base.up.length){const cost=base.up[t.lvl].cost;if(cost<=DEF.power)cands.push({i,t,cost,pri:pathTouchCount(i)+t.lvl});}}}
    if(cands.length){
      cands.sort((a,b)=>b.pri-a.pri);
      const pick=cands[Math.min(cands.length-1,ri(0,1))];
      DEF.power-=pick.cost; pick.t.lvl++;
      markDirty(pick.i); paintCell(pick.i);
      const base=TOWERS[pick.t.type];
      pushLog(`=UPGRADE("${base.name}",${ref(pick.i)},Lv${pick.t.lvl+1})`,
        `${base.name} ${ref(pick.i)} → Lv${pick.t.lvl+1} 강화`, 'def');
      floatText(cellCenter(pick.i).x-6, cellCenter(pick.i).y-4, '↑Lv'+(pick.t.lvl+1), '#107c41');
      return;
    }
  }
  // build pass — respect the tower cap (forces gaps in the gauntlet -> see-saw)
  if(DEF.towers >= TOWER_CAP) return;
  const type = chooseTowerType();
  const cost = TOWERS[type].cost;
  // safety floor scales with threat so it can still spend under pressure
  const floor = coreHP < 35 ? 0 : (waveActive? cost*0.2 : cost*0.6);
  if(DEF.power < cost + floor) return;
  // pick best empty build spot: high path touch, low existing coverage, near pressure
  let best=-1, bestScore=-1e9;
  for(const i of buildSpots){
    if(cells[i].tower) continue;
    const cov=existingCoverage(i);
    // pressure: distance from where monsters currently are (favor ahead-of-pack)
    let score = pathTouchCount(i)*5 - cov*3 + Math.random()*2;
    // prefer spots covering early/mid path when leaking, late path when core low
    cellCenter(i);
    if(coreHP<45){ const r2=i/COLS|0; score += (COLS - (i%COLS))*0.4; } // defend near core
    if(bestScore<score){bestScore=score;best=i;}
  }
  if(best<0) return;
  DEF.power-=cost;
  cells[best].tower={type,lvl:0,cd:0};
  DEF.towers++;
  markDirty(best); paintCell(best);
  const T=TOWERS[type];
  pushLog(`=BUILD("${T.name}",${ref(best)},₩${cost})`, `${T.name} ${ref(best)} 설치 (잔액 ₩${DEF.power|0})`, 'def');
  floatText(cellCenter(best).x-8, cellCenter(best).y-4, '＋'+T.name, T.color);
}

// ---------- GHOST AI ----------
// Procedural adaptive wave generation: budget scales with both economies and how the
// defender is doing, but capped so it can't instakill. Composition adapts to towers.
function planWave(){
  GHO.wave++;
  year = GHO.wave;
  // adaptive budget: base grows, modulated by defender strength vs ghost success
  const towerStrength = sumTowerPower();
  const leakRate = DEF.leaked/(GHO.sent+1);
  // Adaptive: scale to defender strength so ghosts can actually break through, but
  // ease off when the core is near death so the game stays a long see-saw, not a one-shot kill.
  let pressure = 1.25 + clamp(towerStrength/52 - GHO.wave*0.02, 0, 2.8);
  if(coreHP < 14) pressure *= 0.5;            // hard back-off ONLY at the brink -> no instakill, long game
  else if(coreHP < 30) pressure *= 0.78;
  if(coreHP > 88) pressure *= 1.15;           // push harder when defender is comfortable
  if(leakRate > 0.30) pressure *= 0.88;
  const budget = Math.round((34 + GHO.wave*15) * pressure + GHO.energy*0.5);
  GHO.energy = Math.max(0, GHO.energy - budget*0.25);
  // composition adapts to defender mix
  const slowTowers = countType('fros'), splashTowers=countType('coil');
  const comp = [];
  let b = budget;
  // counter-pick: if lots of splash, send fewer-but-tanky; if slow heavy, send phase/black
  const wantTank = splashTowers>=2 || GHO.wave>=4;
  const wantPhase = slowTowers>=2 && Math.random()<.6;
  const order = [];
  let guard=0;
  while(b>6 && guard++<400){
    let pick;
    const r=Math.random();
    if(wantTank && r<.30 && GHO.wave>=3) pick='black';
    else if(wantPhase && r<.22) pick='phase';
    else if(r<.18 && GHO.wave>=2) pick='surge';
    else if(r<.55) pick='flick';
    else pick='swarm';
    const e=GHOSTS[pick].energy;
    if(e>b) { if(b>3){pick='swarm';} else break; }
    order.push(pick); b-=GHOSTS[pick].energy;
  }
  // shuffle a bit but keep tanks spread
  GHO.queue = order;
  GHO.queueGap = clamp(30 - GHO.wave*2, 9, 30);
  GHO.queueCd = 8;
  GHO.mood = wantTank? '중장갑 돌파' : wantPhase? '위상 침투' : '물량 압박';
  const tally = {};
  for(const o of order) tally[o]=(tally[o]||0)+1;
  const desc = Object.entries(tally).map(([k,v])=>`${GHOSTS[k].name}×${v}`).join(', ');
  pushLog(`=WAVE(#${GHO.wave},예산${budget},"${GHO.mood}")`,
    `WAVE ${GHO.wave} 편성: ${desc||'정찰대'} — ${GHO.mood}`, 'gho');
  waveActive = true; waveTimer = order.length*GHO.queueGap + 240;
}
function sumTowerPower(){
  let s=0;for(let i=0;i<N;i++){const t=cells[i].tower;if(t){const st=towerStat(t);s+=st.dmg*30/st.rate*(1+t.lvl*.3);}}return s;
}

function spawnGhost(type){
  const g=GHOSTS[type];
  // HP scales with wave so the gauntlet stops being a free kill later on.
  const hpScale = 1 + (GHO.wave-1)*0.42 + Math.max(0,GHO.wave-4)*0.40;
  const hp = Math.round(g.hp*hpScale);
  monsters.push({type, hp, maxhp:hp, t:0, slowT:0, slowF:1, id:mid++});
  GHO.sent++;
  flagFormula(`=SPAWN("${g.name}",${ref(SPAWN)},#${GHO.wave})`);
}

// ---------- combat tick ----------
function gameTick(){
  tick++;
  // economy
  DEF.power += DEF.income*0.05;
  GHO.energy += GHO.gen*0.05;

  // wave scheduling
  if(!waveActive && !manualWavePending){
    intermission--;
    if(intermission<=0){ planWave(); }
  }
  if(manualWavePending){ manualWavePending=false; planWave(); intermission=Math.max(intermission,1); }

  if(GHO.queue && GHO.queue.length){
    GHO.queueCd--;
    if(GHO.queueCd<=0){
      // swarm bursts spawn 2-3
      const type=GHO.queue.shift();
      spawnGhost(type);
      if(type==='swarm' && GHO.queue[0]==='swarm'){ spawnGhost(GHO.queue.shift()); }
      GHO.queueCd = (type==='swarm'?Math.max(8,GHO.queueGap*0.5):GHO.queueGap);
    }
  } else if(waveActive){
    if(monsters.length===0){
      waveActive=false; intermission=Math.max(180, 260 - GHO.wave*5);
      const bonus = 10 + GHO.wave*2; DEF.power += bonus; // clear bonus (modest)
      const repair = Math.min(coreMax-coreHP, coreHP<40?6:3); coreHP += repair; // modest self-repair -> see-saw
      pushLog(`=WAVE.CLEAR(#${GHO.wave},+₩${bonus}${repair?`,코어+${repair}%`:''})`,
        `WAVE ${GHO.wave} 격퇴 — 배전반 안정화${repair?` (코어 +${repair}%)`:''}`, 'def');
    }
  }

  // towers fire
  for(let i=0;i<N;i++){
    const t=cells[i].tower; if(!t)continue;
    if(t.cd>0){t.cd--;continue;}
    const st=towerStat(t);
    const ci=cellCenter(i);
    const rngPx = st.rng*CW;
    // find furthest-along target in range (or for splash, densest)
    let target=null, bestT=-1;
    for(const m of monsters){
      if(GHOSTS[m.type].phase && Math.random()<0) {}
      const mp=lerpPos(m.t);
      const d=Math.hypot(mp.x-ci.x, mp.y-ci.y);
      if(d<=rngPx){
        if(m.t>bestT){bestT=m.t;target=m;}
      }
    }
    if(target){
      const mp=lerpPos(target.t);
      // phase ghosts dodge 30%
      if(GHOSTS[target.type].phase && Math.random()<.30){
        t.cd=st.rate; beam(ci.x,ci.y,mp.x,mp.y,'#bbb'); continue;
      }
      beam(ci.x,ci.y,mp.x,mp.y,TOWERS[t.type].color);
      applyDamage(target, st.dmg);
      if(st.splash){
        const sp=st.splash*CW;
        for(const m2 of monsters){ if(m2===target)continue; const p2=lerpPos(m2.t); if(Math.hypot(p2.x-mp.x,p2.y-mp.y)<=sp) applyDamage(m2, st.dmg*0.5); }
      }
      if(st.slow){ target.slowT=Math.max(target.slowT,40); target.slowF=1-st.slow; }
      t.cd=st.rate;
    }
  }

  // resolve deaths
  for(let k=monsters.length-1;k>=0;k--){
    if(monsters[k].hp<=0){
      const m=monsters[k]; const g=GHOSTS[m.type];
      DEF.power += g.bounty + Math.floor(GHO.wave*0.6); DEF.kills++; GHO.dead++;
      const mp=lerpPos(m.t);
      floatText(mp.x-6,mp.y-6,'＋₩'+g.bounty,'#107c41');
      monsters.splice(k,1);
    }
  }

  // move monsters
  for(let k=monsters.length-1;k>=0;k--){
    const m=monsters[k]; const g=GHOSTS[m.type];
    let spd=g.spd; // cells advanced per tick (longer path -> longer traversal -> longer game)
    if(m.slowT>0){ m.slowT--; spd*=m.slowF; }
    m.t += spd;
    if(m.t >= wpts.length-1){
      // reached core
      monsters.splice(k,1);
      GHO.energy += g.energy*0.5;
      DEF.leaked++;
      coreHP -= Math.max(4, Math.round(g.hp/9));
      coreHP=Math.max(0,coreHP);
      const cp=cellCenter(CORE);
      floatText(cp.x-10,cp.y-6,'정전!','#dc2626');
      pushLog(`=LEAK("${g.name}",${ref(CORE)},-HP)`, `${g.name} 코어 도달 — 정전 진행 (코어 ${coreHP}%)`, 'gho');
      if(coreHP<=0) endGame('ghost');
    }
  }

  // AI decisions (paced)
  if(tick%14===0) defenderThink();

  // render dirty cells
  for(const i of dirty) paintCell(i);
  dirty.clear();

  // render monsters
  renderMonsters();
  // panel / status
  if(tick%6===0) renderPanel();
  renderStatus();
}

function applyDamage(m, dmg){
  const armor=GHOSTS[m.type].armor||0;
  m.hp -= Math.max(1, dmg-armor);
}

function renderMonsters(){
  // reuse pooled spans
  while(monLayer.childElementCount < monsters.length){
    const s=document.createElement('div');
    s.style.cssText='position:absolute;font-size:13px;font-weight:700;transform:translate(-50%,-50%);will-change:left,top';
    const bar=document.createElement('div');bar.className='hpbar';bar.style.cssText='position:absolute;left:-9px;top:9px;width:18px;height:3px;background:#3a0a0a';
    const inner=document.createElement('i');inner.style.cssText='display:block;height:100%;background:#ff5252';
    bar.appendChild(inner);s.appendChild(bar);
    monLayer.appendChild(s);
  }
  const kids=monLayer.children;
  for(let k=0;k<kids.length;k++){
    const el=kids[k];
    if(k>=monsters.length){ el.style.display='none'; continue; }
    el.style.display='';
    const m=monsters[k], g=GHOSTS[m.type];
    const p=lerpPos(m.t);
    el.style.left=p.x+'px'; el.style.top=p.y+'px';
    el.style.color=g.color;
    el.style.opacity = g.phase? .7 : 1;
    if(el.dataset.g!==g.glyph){ el.dataset.g=g.glyph; el.childNodes[0]?.remove? null:null; el.firstChild?.nodeType; }
    // set glyph text node (keep bar)
    if(el.firstChild && el.firstChild.nodeType===3) el.firstChild.textContent=g.glyph;
    else el.insertBefore(document.createTextNode(g.glyph), el.firstChild);
    const inner=el.querySelector('.hpbar>i');
    if(inner) inner.style.width=clamp(m.hp/m.maxhp*100,0,100)+'%';
  }
}

// ---------- panel ----------
function bar(pct,color){return `<div class="bar"><i style="width:${clamp(pct,0,100)}%;background:${color}"></i></div>`;}
function renderPanel(){
  let h='<h4>전황 (관전)</h4>';
  h+=`<div class="row"><span><span class="sw" style="background:#107c41"></span>코어 무결성</span><b>${coreHP}%</b></div>`;
  h+=bar(coreHP,'#107c41');
  h+=`<div class="row"><span><span class="sw" style="background:#107c41"></span>전력 (방어 AI)</span><b>₩${DEF.power|0}</b></div>`;
  h+=`<div class="row"><span><span class="sw" style="background:#7c3aed"></span>음전하 (유령 AI)</span><b>${GHO.energy|0}</b></div>`;
  h+=`<div class="row"><span>타워 / 격파</span><b>${DEF.towers} / ${DEF.kills}</b></div>`;
  h+=`<div class="row"><span>웨이브 / 침입중</span><b>#${GHO.wave} / ${monsters.length}</b></div>`;
  h+=`<div class="row"><span>유령 의도</span><b style="color:#7c3aed">${GHO.mood}</b></div>`;
  h+='<div id="logbox">';
  for(const e of log.slice(-5).reverse()){
    const col = e.who==='gho'?'#7c3aed':'#107c41';
    h+=`<div style="color:${col}">${e.msg}</div>`;
  }
  h+='</div>';
  panel.innerHTML=h;
}
function renderStatus(){
  const last=log.length?log[log.length-1].msg:'전장 초기화 완료';
  statusbar.innerHTML=`준비<span class="sep">|</span>WAVE <b>${GHO.wave}</b><span class="sep">|</span>코어 <b>${coreHP}%</b><span class="sep">|</span>전력 <b>₩${DEF.power|0}</b><span class="sep">|</span>격파 <b>${DEF.kills}</b><span class="sep">|</span>${last}`;
}

// ---------- end game ----------
let over=false;
function endGame(who){
  if(over)return; over=true;
  running=false;
  if(who==='ghost'){
    document.getElementById('ttl').textContent='정전.xlsx - Excel [전면 정전]';
    pushLog('=BLACKOUT(CORE,0%)',`코어 정전 — 정전 유령 승리 (WAVE ${GHO.wave}). 새 전장 재가동 중...`, 'gho');
  }
  flagFormula('=BLACKOUT("정전 유령 승리") — 새 전장 자동 재가동 중...');
  renderPanel(); renderStatus();
  // endless spectate: regenerate a fresh procedural battlefield after a short beat
  setTimeout(()=>location.reload(), 4200);
}

// ---------- main loop with speed ----------
let running=true, speed=1; // ticks per frame
let manualWavePending=false;
function frame(){
  if(running){
    for(let s=0;s<speed;s++){ if(over)break; gameTick(); }
  }
  requestAnimationFrame(frame);
}

// ---------- controls ----------
const bpause=document.getElementById('bpause');
const bspd=document.getElementById('bspd');
const bbuild=document.getElementById('bbuild');
const bwave=document.getElementById('bwave');
const hint=document.getElementById('hint');
bpause.onclick=()=>{ running=!running; bpause.textContent=running?'⏸ 일시정지':'▶ 재생'; bpause.classList.toggle('on',!running); };
const speeds=[1,2,4]; let spi=0;
bspd.onclick=()=>{ spi=(spi+1)%speeds.length; speed=speeds[spi]; bspd.textContent='▶ '+speed+'x'; };
let buildMode=false, buildPick='arc';
const buildTypes=['arc','coil','fros','surge'];
let bti=0;
bbuild.onclick=()=>{
  buildMode=!buildMode;
  bbuild.classList.toggle('on',buildMode);
  if(buildMode){ buildPick=buildTypes[bti]; hint.innerHTML=`직접 설치: <span id="buildmode">${TOWERS[buildPick].name}(₩${TOWERS[buildPick].cost})</span> — 셀 클릭 / 버튼 재클릭으로 종류변경`; bbuild.textContent='＋'+TOWERS[buildPick].name; }
  else { hint.textContent='관전 모드 — 양측 AI가 자동 교전 중'; bbuild.textContent='＋ 직접 설치'; }
  if(buildMode && bbuild.dataset.armed){ bti=(bti+1)%buildTypes.length; buildPick=buildTypes[bti]; bbuild.textContent='＋'+TOWERS[buildPick].name; hint.innerHTML=`직접 설치: <span id="buildmode">${TOWERS[buildPick].name}(₩${TOWERS[buildPick].cost})</span> — 셀 클릭`; }
  bbuild.dataset.armed='1';
};
bwave.onclick=()=>{ manualWavePending=true; bwave.classList.add('on'); setTimeout(()=>bwave.classList.remove('on'),300); pushLog('=FORCE.WAVE()','관전자 개입: 다음 웨이브 즉시 소환','gho'); };

// ---------- cell click: history or manual build ----------
let selected=-1;
sheet.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t)return;
  const i=+t.dataset.i;
  if(buildMode){
    const c=cells[i];
    if(c.kind==='open' && !c.tower && pathTouchCount(i)>0){
      const cost=TOWERS[buildPick].cost;
      if(DEF.power>=cost){
        DEF.power-=cost; c.tower={type:buildPick,lvl:0,cd:0}; DEF.towers++;
        paintCell(i);
        pushLog(`=BUILD.MANUAL("${TOWERS[buildPick].name}",${ref(i)})`, `관전자 직접 설치: ${TOWERS[buildPick].name} ${ref(i)}`, 'def');
        floatText(cellCenter(i).x-8,cellCenter(i).y-4,'＋설치','#107c41');
      } else { flagFormula(`=ERR(전력부족: ₩${DEF.power|0} < ₩${cost})`); }
    } else { flagFormula('=ERR(설치불가: 길/벽 인접 빈 셀만 가능)'); }
    return;
  }
  if(selected>=0)cellEls[selected].classList.remove('sel');
  selected=i; t.classList.add('sel'); namebox.textContent=ref(i);
  const c=cells[i];
  if(c.tower){const T=TOWERS[c.tower.type];const st=towerStat(c.tower);flagFormula(`=TOWER("${T.name}",Lv${c.tower.lvl+1},DMG${st.dmg},RNG${st.rng})`);}
  else if(c.kind==='spawn')flagFormula(`=SPAWN.GATE(${ref(i)}) — 유령 출현 지점`);
  else if(c.kind==='core')flagFormula(`=CORE(${ref(i)},HP${coreHP}%) — 배전반(사수 대상)`);
  else if(c.kind==='path')flagFormula(`=PATH(${ref(i)}) — 유령 진군로`);
  else if(c.kind==='wall')flagFormula(`=RACK(${ref(i)}) — 서버랙(설치불가)`);
  else flagFormula(`=CELL(${ref(i)},빈 부지${pathTouchCount(i)?', 설치가능':''})`);
});

// ---------- sheet tabs ----------
const tabs=document.querySelectorAll('#tabs div');
const altBoard=document.getElementById('sheet-board');
const altLog=document.getElementById('sheet-log');
tabs.forEach(tab=>{
  tab.onclick=()=>{
    tabs.forEach(t=>t.classList.remove('on')); tab.classList.add('on');
    const s=tab.dataset.sheet;
    sheet.style.visibility = s==='grid'?'visible':'hidden';
    monLayer.style.display = s==='grid'?'':'none';
    fxLayer.style.display = s==='grid'?'':'none';
    panel.style.display = s==='grid'?'':'none';
    altBoard.style.display = s==='board'?'block':'none';
    altLog.style.display = s==='log'?'block':'none';
    if(s==='board') renderBoardSheet();
    if(s==='log') renderLogSheet();
  };
});
function renderBoardSheet(){
  let towerRows='';
  const counts={};for(let i=0;i<N;i++){const t=cells[i].tower;if(t){const k=t.type+'_'+t.lvl;counts[k]=(counts[k]||0)+1;}}
  for(const k in counts){const[type,lvl]=k.split('_');towerRows+=`<tr><td>${TOWERS[type].name}</td><td class="r">Lv${+lvl+1}</td><td class="r">${counts[k]}기</td></tr>`;}
  if(!towerRows)towerRows='<tr><td colspan="3">설치된 타워 없음</td></tr>';
  altBoard.innerHTML=`<div class="ttl">전황 요약 — =DASHBOARD()</div>
  <table><tr><th>지표</th><th>전력 타워(방어 AI)</th><th>정전 유령(공격 AI)</th></tr>
  <tr><td>자원</td><td class="r">전력 ₩${DEF.power|0}</td><td class="r">음전하 ${GHO.energy|0}</td></tr>
  <tr><td>처치/투입</td><td class="r">격파 ${DEF.kills}</td><td class="r">출격 ${GHO.sent} / 침투 ${DEF.leaked}</td></tr>
  <tr><td>현재 웨이브</td><td class="r">#${GHO.wave}</td><td class="r">${GHO.mood}</td></tr>
  <tr><td>코어 무결성</td><td class="r" colspan="2">${coreHP}% / 100%</td></tr></table>
  <div class="ttl">배치 현황 — =TOWERS()</div>
  <table><tr><th>종류</th><th>레벨</th><th>수량</th></tr>${towerRows}</table>`;
}
function renderLogSheet(){
  let rows='';
  for(const e of [...log].reverse()){
    const col=e.who==='gho'?'#7c3aed':'#107c41';
    rows+=`<tr><td class="r">#${e.wave}</td><td style="font-family:Consolas,monospace;color:${col}">${e.formula}</td><td>${e.msg}</td></tr>`;
  }
  if(!rows)rows='<tr><td colspan="3">기록 없음</td></tr>';
  altLog.innerHTML=`<div class="ttl">격파기록 / 의사결정 로그 — =LOG.STREAM()</div>
  <table><tr><th>WAVE</th><th>수식</th><th>이벤트</th></tr>${rows}</table>`;
}

// ---------- kickoff ----------
renderPanel(); renderStatus();
// give defender a head start so first paint already shows a live spreadsheet mid-battle
// (and so the opening waves aren't a blitz on an empty board -> rarer instant blackout)
DEF.power=260;
for(let k=0;k<10;k++) defenderThink();
DEF.power=85;
intermission=80; // first wave comes quickly
requestAnimationFrame(frame);
})();
