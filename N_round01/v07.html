<script>
(() => {
"use strict";
/* ============================================================
   방역.xlsx — 엑셀로 위장한 좀비 셀 확산 방어 (타워 디펜스)
   셀 그리드 = 전장. 좀비가 셀 경로를 따라 우→좌로 진군.
   디펜더 AI: 자금으로 셀에 타워 설치/업그레이드(자율).
   좀비 AI: 절차생성 웨이브 — 양측 자원/난이도에 적응.
   관전(spectate) 기본. 사람 개입 가능(일시정지/배속/설치/소환).
   ============================================================ */

// ---------- 그리드 사이징 (1440 / 390 대응) ----------
const HDW = 40;
const CW = innerWidth < 560 ? 30 : 34, CH = innerWidth < 560 ? 24 : 22;
const CHROME = 30+28+46+26+25+24; // 타이틀+메뉴+리본+수식바+탭+상태바 ≈ 179
function calcCols(){ return Math.max(13, Math.min(46, Math.floor((innerWidth - HDW - 6) / CW))); }
function calcRows(){ return Math.max(9, Math.min(24, Math.floor((innerHeight - CHROME - 10) / CH))); }
let COLS = calcCols(), ROWS = calcRows();

const $ = id => document.getElementById(id);
const sheet=$('sheet'), fmla=$('formula'), namebox=$('namebox'), statusbar=$('statusbar');
const pStatus=$('pStatus'), pFactions=$('pFactions'), logEl=$('log'), toastEl=$('toast'), ttl=$('ttl');

function colName(n){ let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0;} return s; }
const refOf=(x,y)=>colName(x)+(y+1);
const idx=(x,y)=>y*COLS+x;
const xOf=i=>i%COLS, yOf=i=>(i/COLS)|0;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=arr=>arr[(Math.random()*arr.length)|0];

// ---------- 셀 DOM ----------
let cellEls=[];
function buildGrid(){
  sheet.style.gridTemplateColumns = `${HDW}px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridAutoRows = CH+'px';
  sheet.innerHTML='';
  cellEls=new Array(COLS*ROWS);
  const frag=document.createDocumentFragment();
  const corner=document.createElement('div'); corner.className='hd'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){ const h=document.createElement('div'); h.className='hd'; h.textContent=colName(c); frag.appendChild(h); }
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div'); h.className='hd'; h.textContent=r+1; frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div'); d.className='cell'; d.dataset.i=r*COLS+c;
      cellEls[r*COLS+c]=d; frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

// ============================================================
//  게임 상태
// ============================================================
let board;     // 셀: {type:'floor'|'path'|'core'|'spawn', tower, dist, base}
let zombies, particles, logLines, killLog;
let waveNo, year, money, coreHP, coreMax, kills, leaked, infectScore;
let pathCells;          // 경로 셀 인덱스 집합 (배열)
let spawnPoints;        // 좀비 출현 셀 인덱스
let defenderAI=true, running=true, speedMul=1, placeMode=null, selected=-1;
let toastTimer=0, gameOver=false;
let waveQueue=[];       // 현재 웨이브의 대기 좀비 [{type,delay}]
let waveTimer=0, interWaveTimer=0, betweenWaves=true;
let aiThinkTimer=0;

// ---------- 타워 / 좀비 정의 ----------
const TOWERS={
  T1:{name:'차단막',glyph:'◈',cost:85, color:'#2563eb',baseDmg:13,rng:1.7, rof:13,splash:0,  slow:0,   up:1.6 },
  T2:{name:'소각로',glyph:'✸',cost:165,color:'#c0392b',baseDmg:26,rng:2.45,rof:28,splash:1.5, slow:0,   up:1.62},
  T3:{name:'냉각탑',glyph:'❄',cost:210,color:'#0d9488',baseDmg:8, rng:2.85,rof:20,splash:0,  slow:0.55,up:1.5 },
};
const T_ORDER=['T1','T2','T3'];
const ZTYPES={
  walker: {name:'보행자',  glyph:'z',color:'#7030a0',hp:32, spd:0.024,val:9, arm:0, tier:1},
  runner: {name:'질주체',  glyph:'»',color:'#b5179e',hp:20, spd:0.050,val:11,arm:0, tier:1},
  spitter:{name:'분사체',  glyph:'✦',color:'#9d4edd',hp:48, spd:0.028,val:14,arm:2, tier:2},
  brute:  {name:'거구',    glyph:'❖',color:'#5a189a',hp:120,spd:0.017,val:22,arm:6, tier:2},
  hulk:   {name:'변종 거인',glyph:'☣',color:'#3c096c',hp:340,spd:0.013,val:50,arm:12,tier:3},
};

// ============================================================
//  맵 절차 생성: 우측 spawn 열 → 좌측 core 열, 굽이치는 다중 경로
// ============================================================
function genTerrain(){
  board=new Array(COLS*ROWS);
  for(let i=0;i<board.length;i++) board[i]={type:'floor',tower:null,dist:Infinity,base:0};
  for(let y=0;y<ROWS;y++){ board[idx(0,y)].type='core'; board[idx(COLS-1,y)].type='spawn'; }

  pathCells=[]; spawnPoints=[];
  const lanes=Math.max(2,Math.min(5,Math.round(ROWS/4)));
  const startRows=[];
  for(let l=0;l<lanes;l++){
    let sy=Math.round(1+(l+0.5)*(ROWS-2)/lanes + rnd(-1,1));
    sy=clamp(sy,1,ROWS-2);
    startRows.push(sy);
  }
  for(const sy of startRows){
    const p=carvePath(sy);
    for(const i of p) if(board[i].type==='floor') board[i].type='path';
    spawnPoints.push(idx(COLS-1,sy));
  }
  // path 셀 수집
  for(let i=0;i<board.length;i++) if(board[i].type==='path') pathCells.push(i);
  computeDist();
  // 무결성: 모든 spawn 셀의 dist가 유한해야 함(코어 도달 가능). 아니면 강제 접속.
  for(let y=0;y<ROWS;y++){
    const sp=idx(COLS-1,y);
    if(board[sp].dist===Infinity){
      // 이 행에서 왼쪽으로 직선 통로를 뚫어 강제 연결
      for(let x=COLS-2;x>=1;x--){ if(board[idx(x,y)].type==='floor') board[idx(x,y)].type='path'; if(board[idx(x,y)].type==='path'&&board[idx(x-1,y)].dist!==Infinity)break; }
    }
  }
  pathCells=[]; for(let i=0;i<board.length;i++) if(board[i].type==='path') pathCells.push(i);
  computeDist();
  try{ window.__G={board,COLS,ROWS,spawnPoints,xOf,yOf}; }catch(e){}
}

// 굽이치는 경로: 우측 spawn(COLS-1,sy)에서 좌향 우세 random walk, 코어(x=0) 도달.
// 핵심: 매 스텝 정확히 한 칸 이동하며 항상 4-인접 → 경로는 끊김 없이 연속.
// 첫 스텝은 반드시 좌향(x-1)으로 강제해 spawn 셀이 바로 경로에 접속되게 한다.
function carvePath(sy){
  const out=[idx(COLS-1,sy)]; // spawn 셀(시작점)
  let x=COLS-2, y=sy, guard=0; // 첫 칸은 항상 spawn 바로 왼쪽
  while(x>=0 && guard++<COLS*ROWS*3){
    const i=idx(x,y);
    out.push(i);
    if(x===0) break; // 코어 열 도달
    // 다음 한 칸: 좌향 우세, 가끔 상/하 (단, 다음도 좌로 갈 수 있게 x는 여기서 안 줄임)
    const opts=[[x-1,y],[x-1,y],[x-1,y]]; // 좌향 강한 가중
    if(y>0     && Math.random()<0.40) opts.push([x,y-1]);
    if(y<ROWS-1&& Math.random()<0.40) opts.push([x,y+1]);
    const [nx,ny]=pick(opts);
    x=nx; y=clamp(ny,0,ROWS-1);
  }
  return out;
}

// 코어까지의 셀 거리(BFS over path+core). 좀비는 dist 내림차순으로 이동.
function computeDist(){
  for(const c of board) c.dist=Infinity;
  const q=[];
  for(let y=0;y<ROWS;y++){ const i=idx(0,y); board[i].dist=0; q.push(i); }
  const walkable=i=>board[i].type==='path'||board[i].type==='core'||board[i].type==='spawn';
  let h=0;
  while(h<q.length){
    const i=q[h++], x=xOf(i), y=yOf(i), d=board[i].dist;
    const nb=[];
    if(x>0)nb.push(idx(x-1,y)); if(x<COLS-1)nb.push(idx(x+1,y));
    if(y>0)nb.push(idx(x,y-1)); if(y<ROWS-1)nb.push(idx(x,y+1));
    for(const j of nb) if(walkable(j) && board[j].dist>d+1){ board[j].dist=d+1; q.push(j); }
  }
}

// ============================================================
//  좀비 절차 웨이브: 양측 자원/진척에 따라 적응적으로 조합·스케일
// ============================================================
function buildWave(){
  waveNo++;
  // 적응형 난이도: 코어 체력 비율과 디펜더 자금/타워밀도가 높을수록 더 강하게.
  const coreRatio=coreHP/coreMax;            // 1=건강, 0=위기
  const towers=board.filter(c=>c.tower).length;
  const towerStr=board.reduce((s,c)=>s+(c.tower?c.tower.lvl:0),0);
  // 좀비 진영 적응 점수: 디펜더가 강하면(코어 건강+타워 많음) infectScore 상승 → 더 거센 웨이브
  const pressure = clamp(0.5 + (coreRatio-0.5)*0.85 + towerStr*0.010, 0.35, 2.0);
  infectScore = clamp(infectScore*0.65 + pressure*0.35 + waveNo*0.012, 0.3, 2.8);

  const budget = Math.round((20 + waveNo*9) * infectScore);
  // 티어 해금: 웨이브 진행 + 압박에 따라
  const pool=['walker','runner'];
  if(waveNo>=3 || infectScore>1.0) pool.push('spitter');
  if(waveNo>=5 || infectScore>1.3) pool.push('brute');
  if(waveNo>=8 && (waveNo%4===0 || infectScore>2.0)) pool.push('hulk');

  // 디펜더 구성에 대응: 냉각탑(감속) 많으면 거구 비중↑, 소각로(광역) 많으면 분산(러너)↑
  const t3=board.filter(c=>c.tower&&c.tower.type==='T3').length;
  const t2=board.filter(c=>c.tower&&c.tower.type==='T2').length;
  const weight=t=>{
    let w=1;
    if(t==='runner' && t2>3) w*=0.6;        // 광역 많으면 러너 덜
    if(t==='brute'  && t3>2) w*=1.6;        // 감속 많으면 거구로 압박
    if(t==='runner' && t3>2) w*=1.4;        // 감속 회피용 러너
    if(t==='walker') w*=1.1;
    return w;
  };

  const q=[]; let spent=0, guard=0;
  while(spent<budget && guard++<400){
    const cand=pool.filter(t=>ZTYPES[t].val<=budget-spent+8);
    if(!cand.length) break;
    // 가중 선택
    let tot=0; const ws=cand.map(t=>{const w=weight(t);tot+=w;return w;});
    let r=Math.random()*tot, sel=cand[0];
    for(let k=0;k<cand.length;k++){ r-=ws[k]; if(r<=0){sel=cand[k];break;} }
    spent+=ZTYPES[sel].val;
    q.push(sel);
  }
  // 출현 간격(틱): 후반일수록 촘촘
  const gap=Math.max(7, 26 - waveNo*0.8);
  waveQueue=q.map((t,k)=>({type:t, delay:Math.round(k*gap + rnd(0,gap*0.4))}));
  waveTimer=0;
  // 멀티 레인 출현 — 좀비 AI가 레인을 분산/집중 결정
  const focusLane = Math.random()<0.4 ? (Math.random()*spawnPoints.length|0) : -1;
  for(const z of waveQueue){
    z.lane = focusLane>=0 && Math.random()<0.65 ? focusLane : (Math.random()*spawnPoints.length|0);
  }

  const comp={}; for(const t of q) comp[t]=(comp[t]||0)+1;
  const compStr=Object.entries(comp).map(([t,n])=>`${ZTYPES[t].name}×${n}`).join(', ');
  log('atk', `=SPAWN(웨이브 ${waveNo}, [${compStr}])`,
      `웨이브 ${waveNo} 진군 시작 — ${q.length}마리`);
  betweenWaves=false;
}

// ============================================================
//  디펜더 AI: 자금으로 타워 설치/업그레이드를 자율 판단
// ============================================================
function defenderTurn(){
  if(!defenderAI || money<TOWERS.T1.cost*0.9) return;
  // 위협 평가: 각 빈 셀에 대해 "근처 경로 셀의 거리(코어 근접) + 경로 노출도"로 점수
  // 코어에 가까운 경로 곁 셀을 선호. 이미 타워 많은 칸 회피.
  const coreRatio=coreHP/coreMax;
  // 업그레이드 우선? — 자금 여유 있고 타워 있으면 가끔 업글
  const towersList=board.map((c,i)=>({c,i})).filter(o=>o.c.tower);
  if(towersList.length>4 && money>260 && Math.random()<0.4){
    // 코어 근접 + 저레벨 타워 업글
    towersList.sort((a,b)=>(a.c.tower.lvl - b.c.tower.lvl) || (board[a.i].dist - board[b.i].dist));
    const tgt=towersList[0];
    const t=tgt.c.tower, cost=upgradeCost(t);
    if(money>=cost){
      money-=cost; t.lvl++;
      paint(tgt.i);
      log('def', `=UPGRADE(${refOf(xOf(tgt.i),yOf(tgt.i))}, ${TOWERS[t.type].name} Lv${t.lvl})`,
          `방역 AI: ${refOf(xOf(tgt.i),yOf(tgt.i))} ${TOWERS[t.type].name} Lv${t.lvl} 강화`);
      return;
    }
  }
  // 신규 설치 후보 평가
  let best=null, bestScore=-1;
  const candidates=[];
  for(let i=0;i<board.length;i++){
    const c=board[i];
    if(c.type!=='floor' || c.tower) continue;
    // 인접/대각에 경로가 있는 칸만 의미 있음
    const x=xOf(i),y=yOf(i);
    let nearPath=0, minDist=Infinity, exposure=0;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      const nx=x+dx,ny=y+dy; if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
      const nc=board[idx(nx,ny)];
      if(nc.type==='path'||nc.type==='core'){
        const dd=Math.abs(dx)+Math.abs(dy);
        if(dd<=2){ nearPath++; exposure+= (3-Math.min(2,dd)); }
        minDist=Math.min(minDist,nc.dist);
      }
    }
    if(nearPath===0) continue;
    // 코어 근접(낮은 dist) 가산 + 노출 가산 + 기존 타워 밀집 감점
    let crowd=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const nx=x+dx,ny=y+dy; if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
      if(board[idx(nx,ny)].tower) crowd++;
    }
    const score=exposure*3 + (COLS-minDist)*1.4 - crowd*4 + rnd(0,2);
    candidates.push({i,score,minDist,exposure});
    if(score>bestScore){ bestScore=score; best=i; }
  }
  if(best==null) return;
  // 어떤 타워? — 상황 기반 선택
  const c2=board.filter(c=>c.tower&&c.tower.type==='T2').length;
  const c3=board.filter(c=>c.tower&&c.tower.type==='T3').length;
  const total=board.filter(c=>c.tower).length;
  let type='T1';
  // 위기(코어 낮음)면 저렴·즉효 차단막. 안정되면 소각로/냉각탑 믹스.
  if(coreRatio<0.4) type='T1';
  else if(total>=3 && c2<=total*0.4 && money>=TOWERS.T2.cost && Math.random()<0.5) type='T2';
  else if(total>=2 && c3===0 && money>=TOWERS.T3.cost && Math.random()<0.4) type='T3';
  else if(money>=TOWERS.T2.cost && Math.random()<0.3) type='T2';
  const def=TOWERS[type];
  if(money<def.cost) type='T1';
  if(money<TOWERS.T1.cost) return;
  placeTower(best, type, true);
}

function upgradeCost(t){ return Math.round(TOWERS[t.type].cost*0.7*Math.pow(1.6,t.lvl-1)); }

function placeTower(i, type, byAI){
  const def=TOWERS[type], c=board[i];
  if(c.type!=='floor'||c.tower||money<def.cost) return false;
  money-=def.cost;
  c.tower={type, lvl:1, cd:0, target:null};
  paint(i);
  const ref=refOf(xOf(i),yOf(i));
  log('def', `=BUILD("${def.name}", ${ref}, ₩${def.cost})`,
      `${byAI?'방역 AI':'관리자'}: ${ref}에 ${def.name} 설치`);
  return true;
}
function sellTower(i){
  const c=board[i]; if(!c.tower)return;
  const def=TOWERS[c.tower.type];
  const refund=Math.round((def.cost + (c.tower.lvl-1)*def.cost*0.5)*0.6);
  money+=refund; const ref=refOf(xOf(i),yOf(i)); const nm=def.name;
  c.tower=null; paint(i);
  log('def', `=SELL(${ref}, +₩${refund})`, `${ref} ${nm} 철거(+₩${refund})`);
}

// ============================================================
//  좀비 진군 + 전투
// ============================================================
let zid=0;
function spawnZombie(type, lane){
  const def=ZTYPES[type];
  const sp = spawnPoints[lane] !== undefined ? spawnPoints[lane] : pick(spawnPoints);
  const hpScale = 1 + waveNo*0.10 + infectScore*0.18;
  const hp=Math.round(def.hp*hpScale);
  zombies.push({
    id:zid++, type, cell:sp, prog:0, hp, maxhp:hp,
    spd:def.spd*(0.9+infectScore*0.04), slow:0, slowT:0, arm:def.arm, val:def.val, dead:false, stuck:0
  });
}

// 좀비를 다음 경로 셀로(코어 방향: dist 더 작은 walkable 이웃)
// 1순위: dist가 더 작은 path/core. 2순위(고립 대비): dist가 더 작은 어떤 walkable이든.
// 3순위(최후 실패안전): x가 더 작은(코어쪽) 어떤 인접 칸이든. 그래도 없으면 -1.
function nextCell(i){
  const x=xOf(i),y=yOf(i),d=board[i].dist;
  const N=[];
  if(x>0)N.push(idx(x-1,y)); if(x<COLS-1)N.push(idx(x+1,y));
  if(y>0)N.push(idx(x,y-1)); if(y<ROWS-1)N.push(idx(x,y+1));
  const walk=j=>{const t=board[j].type; return t==='path'||t==='core'||t==='spawn';};
  let best=N.filter(j=>walk(j)&&board[j].dist<d);
  if(best.length) return pick(best);
  best=N.filter(j=>board[j].dist<d);                 // dist 우선(타입 무관)
  if(best.length) return pick(best);
  best=N.filter(j=>walk(j)&&xOf(j)<x);               // 코어 방향 walkable
  if(best.length) return pick(best);
  best=N.filter(j=>xOf(j)<x);                         // 코어 방향 아무 칸
  if(best.length) return pick(best);
  return -1;
}

function damageZombie(z, dmg){
  const eff=Math.max(1, dmg - z.arm*0.5);
  z.hp-=eff;
  if(z.hp<=0 && !z.dead){
    z.dead=true;
    money+=z.val; kills++;
    killLog[z.type]=(killLog[z.type]||0)+1;
    cellEls[z.cell] && cellEls[z.cell].classList.add('hit');
    setTimeout(c=>c&&c.classList.remove('hit'), 250, cellEls[z.cell]);
  }
}

function towersFire(){
  for(let i=0;i<board.length;i++){
    const c=board[i]; if(!c.tower)continue;
    const t=c.tower; if(t.cd>0){ t.cd--; continue; }
    const def=TOWERS[t.type];
    const rng=def.rng + (t.lvl-1)*0.25;
    const tx=xOf(i),ty=yOf(i);
    // 사거리 내 코어 최근접 좀비 타겟
    let tgt=null, tgtDist=Infinity;
    for(const z of zombies){
      if(z.dead)continue;
      const zx=xOf(z.cell),zy=yOf(z.cell);
      const dd=Math.hypot(zx-tx, zy-ty);
      if(dd<=rng && board[z.cell].dist<tgtDist){ tgtDist=board[z.cell].dist; tgt=z; }
    }
    if(!tgt)continue;
    const dmg=def.baseDmg*Math.pow(def.up,t.lvl-1);
    damageZombie(tgt, dmg);
    if(def.slow>0){ tgt.slow=Math.max(tgt.slow,def.slow); tgt.slowT=Math.max(tgt.slowT,40); }
    if(def.splash>0){
      const zx=xOf(tgt.cell),zy=yOf(tgt.cell);
      for(const z of zombies){ if(z===tgt||z.dead)continue;
        const dd=Math.hypot(xOf(z.cell)-zx, yOf(z.cell)-zy);
        if(dd<=def.splash) damageZombie(z, dmg*0.6);
      }
    }
    particles.push({x:tx,y:ty,tx:xOf(tgt.cell),ty:yOf(tgt.cell),life:6,color:def.color});
    t.cd=Math.max(4, def.rof - (t.lvl-1)*2);
  }
}

function moveZombies(){
  for(const z of zombies){
    if(z.dead)continue;
    let sp=z.spd;
    if(z.slowT>0){ sp*=(1-z.slow); z.slowT--; if(z.slowT<=0)z.slow=0; }
    z.prog+=sp;
    while(z.prog>=1){
      z.prog-=1;
      if(board[z.cell].type==='core'){
        // 코어 타격
        coreHP-=Math.round(4+z.val*0.35); leaked++;
        z.dead=true; z.reached=true;
        flashCore();
        break;
      }
      const nx=nextCell(z.cell);
      if(nx<0){
        // 진행 불가(고립된 경로 등) — 실패안전: 누적되면 소멸시켜 웨이브 행이 멈추지 않게.
        z.prog=0; z.stuck++;
        if(z.stuck>180){ z.dead=true; }
        break;
      }
      z.stuck=0;
      z.cell=nx;
      if(board[z.cell].type==='core'){
        coreHP-=Math.round(4+z.val*0.35); leaked++;
        z.dead=true; z.reached=true; flashCore(); break;
      }
    }
  }
  zombies=zombies.filter(z=>!z.dead);
}

function flashCore(){
  for(let y=0;y<ROWS;y++){ const el=cellEls[idx(0,y)]; if(el){el.classList.add('hit'); setTimeout(c=>c&&c.classList.remove('hit'),250,el);} }
}

//  렌더링: 좀비/타워/경로/HP를 셀에 그림
// ============================================================
function baseGlyph(c){
  if(c.type==='core') return {g:'▣', col:'#107c41', bg:'#d7f0e0'};
  if(c.type==='spawn')return {g:'☠', col:'#7030a0', bg:'#efe3f6'};
  if(c.type==='path') return {g:'·', col:'#c9c9c9', bg:'#fafafa'};
  return {g:'', col:'#222', bg:''};
}
function paint(i){
  const c=board[i], el=cellEls[i]; if(!el)return;
  const b=baseGlyph(c);
  let bg=b.bg, g=b.g, col=b.col, w='', title='';
  // HP 바 제거
  const old=el.querySelector('.hp'); if(old)old.remove();
  if(c.tower){
    const def=TOWERS[c.tower.type];
    bg=hexA(def.color, 0.14+c.tower.lvl*0.06);
    g=def.glyph; col=def.color; w='700';
    title=`${def.name} Lv${c.tower.lvl}`;
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  el.textContent=g; el.title=title;
}
function hexA(hex,a){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }

// 좀비 오버레이: 매 프레임 path/spawn 셀을 다시 칠하고 좀비 글리프 덧입힘
let occupied=new Set();
function renderZombies(){
  // 이전 점유 셀 원복
  for(const i of occupied){ if(!board[i].tower) paint(i); }
  occupied.clear();
  // 셀별 최우선 좀비
  const byCell=new Map();
  for(const z of zombies){
    if(z.dead)continue;
    const cur=byCell.get(z.cell);
    if(!cur || ZTYPES[z.type].tier>ZTYPES[cur.type].tier) byCell.set(z.cell,z);
  }
  for(const [i,z] of byCell){
    const el=cellEls[i]; if(!el)continue;
    if(board[i].tower) continue; // 타워 칸엔 좀비 안 겹침(경로엔 타워 없음)
    const def=ZTYPES[z.type];
    el.textContent=def.glyph;
    el.style.color=def.color;
    el.style.fontWeight='700';
    el.style.background=hexA(def.color,0.16);
    // HP 바
    let bar=el.querySelector('.hp'); if(!bar){ bar=document.createElement('div'); bar.className='hp'; el.appendChild(bar);}
    const ratio=clamp(z.hp/z.maxhp,0,1);
    bar.style.width=(ratio*100)+'%';
    bar.style.background = ratio>0.5?'#107c41':ratio>0.25?'#d97706':'#c0392b';
    occupied.add(i);
  }
}

//  메인 루프
// ============================================================
let acc=0;
function loop(){
  requestAnimationFrame(loop);
  if(toastTimer>0){ toastTimer--; if(toastTimer===0) toastEl.style.opacity='0'; }
  if(!running||gameOver){ renderStatus(); return; }
  const steps=speedMul;
  for(let s=0;s<steps;s++) tick();
  renderZombies();
  renderParticles();
  renderPanels();
  renderStatus();
}

function tick(){
  year++;
  // 웨이브 진행
  if(betweenWaves){
    interWaveTimer--;
    if(interWaveTimer<=0) buildWave();
  } else {
    waveTimer++;
    // 큐에서 출현
    for(let k=waveQueue.length-1;k>=0;k--){
      if(waveQueue[k].delay<=waveTimer){
        spawnZombie(waveQueue[k].type, waveQueue[k].lane);
        waveQueue.splice(k,1);
      }
    }
    if(waveQueue.length===0 && zombies.length===0){
      betweenWaves=true;
      interWaveTimer=130;
      const bonus=40+waveNo*10;
      money+=bonus;
      log('def', `=WAVE.CLEAR(${waveNo}, 보너스 +₩${bonus})`, `웨이브 ${waveNo} 방어 성공 (+₩${bonus})`);
    }
  }
  // 디펜더 AI 사고
  aiThinkTimer--;
  if(aiThinkTimer<=0){ defenderTurn(); aiThinkTimer=Math.round(rnd(10,22)); }

  towersFire();
  moveZombies();
  for(const p of particles) p.life--;
  particles=particles.filter(p=>p.life>0);

  if(coreHP<=0 && !gameOver){
    coreHP=0; gameOver=true;
    log('atk', `=GAME.OVER(웨이브 ${waveNo})`, `코어 함락 — 좀비 승리`);
    toast(`코어 함락! 좀비 진영 승리 (웨이브 ${waveNo})`);
  }
}

// 발사체 시각 효과 (셀 위 오버레이 점)
let pcanvas;
function setupParticleCanvas(){
  pcanvas=document.createElement('canvas');
  pcanvas.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:4';
  $('sheetwrap').appendChild(pcanvas);
}
function renderParticles(){
  const w=$('sheetwrap').clientWidth, h=$('sheetwrap').clientHeight;
  if(pcanvas.width!==w)pcanvas.width=w; if(pcanvas.height!==h)pcanvas.height=h;
  const ctx=pcanvas.getContext('2d');
  ctx.clearRect(0,0,w,h);
  const cx=x=>HDW + x*CW + CW/2;
  const cy=y=>y*CH + CH/2;
  for(const p of particles){
    ctx.strokeStyle=p.color; ctx.lineWidth=1.6; ctx.globalAlpha=p.life/6;
    ctx.beginPath(); ctx.moveTo(cx(p.x),cy(p.y)); ctx.lineTo(cx(p.tx),cy(p.ty)); ctx.stroke();
    ctx.globalAlpha=1; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(cx(p.tx),cy(p.ty),2.4,0,7); ctx.fill();
  }
}

// ============================================================
//  입력 / UI
// ============================================================
function setPlaceMode(m){
  placeMode = placeMode===m ? null : m;
  ['rbT1','rbT2','rbT3','rbSell'].forEach(id=>$(id).classList.remove('on'));
  if(placeMode==='T1')$('rbT1').classList.add('on');
  if(placeMode==='T2')$('rbT2').classList.add('on');
  if(placeMode==='T3')$('rbT3').classList.add('on');
  if(placeMode==='sell')$('rbSell').classList.add('on');
}

function bindUI(){
  $('rbPlay').onclick=()=>{ running=!running; $('ppIcon').textContent=running?'⏸':'▶';
    $('rbPlay').lastChild.textContent=running?'일시정지':'재생'; $('rbPlay').classList.toggle('on',running); };
  $('rbSpeed').onclick=()=>{ speedMul = speedMul===1?2 : speedMul===2?4:1; $('spIcon').textContent=speedMul+'x'; };
  $('rbWave').onclick=()=>{ if(gameOver)return;
    if(betweenWaves){ interWaveTimer=1; toast('웨이브 즉시 소환'); }
    else toast('이미 교전 중'); };
  $('rbAuto').onclick=()=>{ defenderAI=!defenderAI; $('rbAuto').classList.toggle('on',defenderAI);
    toast(defenderAI?'자동 방역 AI 가동':'수동 모드 — 직접 설치하세요'); };
  $('rbT1').onclick=()=>setPlaceMode('T1');
  $('rbT2').onclick=()=>setPlaceMode('T2');
  $('rbT3').onclick=()=>setPlaceMode('T3');
  $('rbSell').onclick=()=>setPlaceMode('sell');

  sheet.addEventListener('click', e=>{
    const t=e.target.closest('.cell'); if(!t)return;
    const i=+t.dataset.i;
    if(selected>=0 && cellEls[selected]) cellEls[selected].classList.remove('sel');
    selected=i; t.classList.add('sel');
    namebox.textContent=refOf(xOf(i),yOf(i));
    const c=board[i];
    if(placeMode==='sell'){ sellTower(i); return; }
    if(placeMode && c.type==='floor' && !c.tower){
      if(money>=TOWERS[placeMode].cost) placeTower(i,placeMode,false);
      else toast('예산 부족');
      return;
    }
    if(placeMode && c.tower){
      // 같은 타워 칸 클릭 = 업그레이드
      const cost=upgradeCost(c.tower);
      if(money>=cost){ money-=cost; c.tower.lvl++; paint(i);
        log('def',`=UPGRADE(${refOf(xOf(i),yOf(i))}, Lv${c.tower.lvl})`,`${refOf(xOf(i),yOf(i))} Lv${c.tower.lvl} 강화`);
      } else toast('예산 부족');
      return;
    }
    // 셀 정보 → 수식바
    if(c.tower){ const d=TOWERS[c.tower.type];
      fmla.textContent=`=TOWER("${d.name}", Lv${c.tower.lvl}, DMG ${Math.round(d.baseDmg*Math.pow(d.up,c.tower.lvl-1))}, 사거리 ${(d.rng+(c.tower.lvl-1)*0.25).toFixed(1)})`;
    } else if(c.type==='core'){ fmla.textContent=`=CORE("방역 코어", 무결성 ${Math.max(0,coreHP)}/${coreMax})`; }
    else if(c.type==='spawn'){ fmla.textContent=`=SPAWNER("좀비 출현구", 웨이브 ${waveNo})`; }
    else if(c.type==='path'){ fmla.textContent=`=PATH(코어까지 ${c.dist}칸)`; }
    else fmla.textContent=`=CELL(${refOf(xOf(i),yOf(i))}, "빈 칸 — 타워 설치 가능")`;
  });

  // 탭 전환
  document.querySelectorAll('#tabs div').forEach(d=>{
    d.onclick=()=>{
      document.querySelectorAll('#tabs div').forEach(x=>x.classList.remove('on'));
      d.classList.add('on');
      const s=d.dataset.s;
      $('sheetwrap').style.display = s==='1'?'block':'none';
      $('sheet2').style.display = s==='2'?'block':'none';
      $('sheet3').style.display = s==='3'?'block':'none';
      if(s==='2')renderSheet2();
      if(s==='3')renderSheet3();
    };
  });
  // 격파기록 탭 카운트 갱신
  setInterval(()=>{ const tot=Object.values(killLog).reduce((a,b)=>a+b,0);
    $('tab3').textContent=`격파기록 (${tot})`;
    if($('sheet2').style.display==='block')renderSheet2();
    if($('sheet3').style.display==='block')renderSheet3();
  }, 700);

  // 키보드
  window.addEventListener('keydown', e=>{
    if(e.key===' '){ e.preventDefault(); $('rbPlay').click(); }
    else if(e.key==='1')setPlaceMode('T1');
    else if(e.key==='2')setPlaceMode('T2');
    else if(e.key==='3')setPlaceMode('T3');
    else if(e.key==='+'||e.key==='=')$('rbSpeed').click();
    else if(e.key==='w'||e.key==='W')$('rbWave').click();
  });
}

const COLOR_DEF='#2563eb', COLOR_ATK='#7030a0';

// ============================================================
//  초기화
// ============================================================
function init(){
  zombies=[]; particles=[]; logLines=[]; killLog={};
  waveNo=0; year=0; money=400; coreMax=240; coreHP=240;
  kills=0; leaked=0; infectScore=0.8;
  waveQueue=[]; betweenWaves=true; interWaveTimer=90; aiThinkTimer=12;
  gameOver=false; selected=-1; occupied=new Set();
  buildGrid();
  genTerrain();
  for(let i=0;i<board.length;i++) paint(i);
  // 첫 페인트부터 동작: 안내 + 시작 수식
  fmla.textContent=`=DEFEND($A$1:$${colName(COLS-1)}$${ROWS}, "좀비 셀 확산 방어 — 관전 모드 가동")`;
  log('def', `=DEFEND($A$1:$${colName(COLS-1)}$${ROWS}, "방역 개시")`, '방역 시뮬레이션 시작 — 양측 AI 관전 모드');
  // 디펜더 AI가 초반 몇 개를 미리 깔아 첫 화면이 풍성하게
  for(let k=0;k<3;k++) defenderTurn();
  renderPanels(); renderStatus(); renderLog();
  setInterval(renderLog, 400);
  toast('관전 모드 — 양측 AI가 자동으로 교전합니다');
}

function main(){
  init();
  bindUI();
  setupParticleCanvas();
  loop();
}

main();
})();
