<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보안로그.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px;white-space:nowrap}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px}
  #namebox{width:62px;min-width:62px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333}
  #fx{width:28px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1}
  #sheet{display:grid;background:#fff}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:11px}
  .cell{position:relative;border-right:1px solid #e6e6e6;border-bottom:1px solid #e6e6e6;
    display:flex;align-items:center;justify-content:center;font-size:12px;
    overflow:hidden;cursor:cell;line-height:1}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:3}
  .cell.path{background:#fff7e6}
  .cell.buildable:hover{background:#eaf3ff;outline:1.5px dashed #2563eb;outline-offset:-2px}
  .hp{position:absolute;left:1px;right:1px;bottom:1px;height:2px;background:#e3a0a0;border-radius:1px;overflow:hidden;pointer-events:none}
  .hp>i{display:block;height:100%;background:#16a34a;width:100%}
  .rng{position:absolute;inset:0;pointer-events:none}
  @keyframes shot{0%{opacity:.9}100%{opacity:0}}
  .zap{position:absolute;height:2px;transform-origin:left center;background:#e11d48;
    box-shadow:0 0 4px #f43f5e;z-index:4;pointer-events:none;animation:shot .18s linear forwards}
  @keyframes brf{0%,100%{box-shadow:inset 0 0 0 2px #dc2626}50%{box-shadow:inset 0 0 0 2px #fecaca}}
  .breach{animation:brf .3s 3}
  #legend{position:absolute;top:8px;right:14px;background:#fffce6;border:1px solid #d8c66a;
    box-shadow:2px 3px 8px rgba(0,0,0,.18);padding:8px 11px;font-size:11px;z-index:6;
    min-width:182px;line-height:1.65}
  #legend .sw{display:inline-block;width:9px;height:9px;margin-right:6px;border-radius:2px;vertical-align:middle}
  #legend h4{margin:0 0 3px;font-size:11px;color:#7a6a1f}
  #legend .bar{height:7px;background:#eee;border-radius:3px;overflow:hidden;margin:2px 0 5px}
  #legend .bar>i{display:block;height:100%}
  #controls{position:absolute;top:8px;left:10px;background:rgba(255,255,255,.94);
    border:1px solid #cfcfcf;box-shadow:1px 2px 6px rgba(0,0,0,.12);padding:6px 8px;z-index:6;
    font-size:11px;line-height:1.5;border-radius:3px}
  #controls button{font:inherit;font-size:11px;border:1px solid #b9b9b9;background:#f7f7f7;
    border-radius:3px;padding:2px 7px;margin:1px 2px 1px 0;cursor:pointer;color:#333}
  #controls button:hover{background:#eaf3ff;border-color:#2563eb}
  #controls button.on{background:#107c41;color:#fff;border-color:#107c41}
  #controls .hint{color:#777;font-size:10px;margin-top:3px}
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;white-space:nowrap;overflow:hidden}
  #statusbar .sep{margin:0 9px;opacity:.5}
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:26px;
    border-top:1px solid #d4d4d4;font-size:11.5px}
  #tabs div{padding:3px 13px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  body{display:flex;flex-direction:column;height:100%}
</style>
</head>
<body>
<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <span>보안로그.xlsx - Excel</span>
</div>
<div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
<div id="fbar">
  <div id="namebox">A1</div>
  <div id="fx">fx</div>
  <div id="formula"></div>
</div>
<div id="sheetwrap">
  <div id="sheet"></div>
  <div id="controls"></div>
  <div id="legend"></div>
</div>
<div id="tabs"><div class="on" data-t="0">전장</div><div data-t="1">전황</div><div data-t="2">격파기록 (0)</div></div>
<div id="statusbar"></div>

<script>
(() => {
"use strict";
/* ============================================================
   보안로그.xlsx — 엑셀로 위장한 타워 디펜스
   테마: 데이터 유출 침입자(攻) vs 방화벽 타워(守)
   양측 모두 AI. 자동 관전(spectate)이 기본. 사람 개입 가능.
   웨이브는 절차 생성 + 적응형 난이도로 동적 스케일링.
   ============================================================ */

const CW = 34, CH = 24;
const COLS = Math.max(16, Math.min(40, Math.floor((innerWidth  - 50) / CW)));
const ROWS = Math.max(11, Math.min(26, Math.floor((innerHeight - 170) / CH)));
const N = COLS * ROWS;

const sheet     = document.getElementById('sheet');
const sheetwrap = document.getElementById('sheetwrap');
const fmla      = document.getElementById('formula');
const namebox   = document.getElementById('namebox');
const statusbar = document.getElementById('statusbar');
const legend    = document.getElementById('legend');
const controls  = document.getElementById('controls');

sheet.style.gridTemplateColumns = `44px repeat(${COLS}, ${CW}px)`;
sheet.style.gridAutoRows = CH + 'px';

const ROWH = 44; // header col px ; ROW header width
function colName(n){ let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0; } return s; }
function ref(i){ return colName(i%COLS) + (Math.floor(i/COLS)+1); }
function ix(c,r){ return r*COLS + c; }
const cx = i => i%COLS, cy = i => (i/COLS|0);

/* ---------- 시트 DOM ---------- */
const cellEls = new Array(N);
{
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd'; frag.appendChild(corner);
  for(let c=0;c<COLS;c++){ const h=document.createElement('div'); h.className='hd'; h.textContent=colName(c); frag.appendChild(h); }
  for(let r=0;r<ROWS;r++){
    const h=document.createElement('div'); h.className='hd'; h.textContent=r+1; frag.appendChild(h);
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div'); d.className='cell'; d.dataset.i=ix(c,r);
      cellEls[ix(c,r)]=d; frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

/* ============================================================
   절차 생성 경로 — 침입자가 따라가는 '데이터 라우트'
   왼쪽 열(SOURCE: 외부망)에서 출발해 오른쪽 SINK(서버/금고)로.
   세그먼트 단위로 위/아래로 꺾이며 길게 만든다.
   ============================================================ */
let path = [];           // 셀 인덱스 배열 (SOURCE→SINK 순서)
const isPath = new Uint8Array(N);
let pathRank = new Int16Array(N).fill(-1);

function buildPath(){
  path.length = 0; isPath.fill(0); pathRank.fill(-1);
  let r = (ROWS>>1) + ((Math.random()*3|0)-1);
  r = Math.max(1, Math.min(ROWS-2, r));
  let c = 0;
  const segMin = 3, segMax = Math.max(4, (COLS/4)|0);
  let lastDir = 0;
  const push = (cc,rr)=>{ const i=ix(cc,rr); if(!isPath[i]){ isPath[i]=1; path.push(i); } };
  push(c,r);
  while(c < COLS-1){
    // 수평 구간
    const seg = segMin + (Math.random()*(segMax-segMin+1)|0);
    for(let k=0;k<seg && c<COLS-1;k++){ c++; push(c,r); }
    if(c>=COLS-1) break;
    // 수직 꺾임 (벽 안에서)
    let dir = Math.random()<.5 ? -1 : 1;
    if(lastDir!==0 && Math.random()<.6) dir = lastDir; // 같은 방향 선호 → 큰 곡선
    const room = dir<0 ? r-1 : (ROWS-2)-r;
    if(room < 2) dir = -dir;
    const room2 = dir<0 ? r-1 : (ROWS-2)-r;
    const vlen = Math.max(2, Math.min(room2, 2 + (Math.random()*3|0)));
    for(let k=0;k<vlen;k++){ r += dir; r=Math.max(1,Math.min(ROWS-2,r)); push(c,r); }
    lastDir = dir;
  }
  // SINK 보장
  push(COLS-1, r);
  for(let k=0;k<path.length;k++) pathRank[path[k]] = k;
}

/* 경로 인접(타워가 효과적인) 표시는 안 하고, 빌드 가능 셀 = 비경로 셀 */
function buildable(i){ return !isPath[i]; }

/* ============================================================
   엔티티
   ============================================================ */
// 타워 종류 (방화벽 계열)
const TOWERS = {
  fw:  { key:'fw',  name:'방화벽',   glyph:'▦', col:'#2563eb', cost:50,  rng:2.4, dmg:8,   rate:11, splash:0,    note:'기본 차단' },
  ids: { key:'ids', name:'침입탐지', glyph:'◎', col:'#0d9488', cost:80,  rng:3.6, dmg:11,  rate:14, splash:0,    note:'장사거리·정밀' },
  enc: { key:'enc', name:'암호화벽', glyph:'⊞', col:'#7c3aed', cost:115, rng:2.4, dmg:7,   rate:9,  splash:0,    slow:.5, note:'속도저하' },
  hon: { key:'hon', name:'허니팟',   glyph:'❋', col:'#d97706', cost:140, rng:2.6, dmg:18,  rate:22, splash:1.6,  note:'광역 폭발' },
};
const TOWER_ORDER = ['fw','ids','enc','hon'];

// 침입자 종류
const ENEMIES = {
  bot:    { key:'bot',    name:'봇넷',     glyph:'☣', col:'#dc2626', hp:24,  spd:.11, bounty:11, leak:1, w:1 },
  worm:   { key:'worm',   name:'웜',       glyph:'∿', col:'#b45309', hp:15,  spd:.19, bounty:8,  leak:1, w:1 },
  trojan: { key:'trojan', name:'트로이목마',glyph:'♆', col:'#9333ea', hp:55,  spd:.09, bounty:20, leak:2, w:2 },
  ddos:   { key:'ddos',   name:'DDoS',     glyph:'⚡', col:'#be185d', hp:10,  spd:.26, bounty:5,  leak:1, w:1 },
  rkit:   { key:'rkit',   name:'루트킷',   glyph:'☠', col:'#1f2937', hp:120, spd:.065,bounty:40, leak:3, w:3, armor:3 },
};

let towers = [];   // {i, key, lvl, cd, kills}
const towerAt = new Map(); // i -> tower
let enemies = [];  // {key,t(0..1 along path),hp,maxhp,slow}
let zaps = [];

/* 상태 */
let defCredits = 230;   // 방어측 자금 (격파 보상)
let atkData    = 50;    // 공격측 데이터 예산 (시간/누수로 누적)
let serverHP   = 100, serverMax = 100;
let leaked = 0, killed = 0;
let wave = 0, waveActive = false, waveQueue = [], spawnTimer = 0;
let interWave = 120;    // 웨이브 사이 틱
let tickN = 0;
let speed = 1, paused = false;
let placingKey = null;  // 사람이 수동 설치 중인 타워 key
let selected = -1;
let lastBuild = '시뮬레이션을 초기화했습니다.';
const obituaries = [];  // 격파기록
let activeTab = 0;

/* 적응형 난이도 신호: 방어측이 강할수록 ↑ → 공격 강화 */
function pressure(){
  // 서버 체력비, 방어 경제, 타워 수로 양측 균형을 추정
  const hpFrac = serverHP / serverMax;          // 1 안전
  const towerStr = towers.reduce((s,t)=>s+t.lvl,0);
  // 공격이 밀리면(서버 건강·타워 많음) 압력↑, 서버 위태로우면 압력↓ → 엎치락뒤치락
  let p = 0.55 + (hpFrac-0.5)*0.9 + towerStr*0.012 + wave*0.03;
  return Math.max(0.3, Math.min(3.2, p));
}

/* ============================================================
   페인트
   ============================================================ */
function baseClass(i){
  let cls = 'cell';
  if(isPath[i]) cls += ' path';
  else cls += ' buildable';
  if(i===selected) cls += ' sel';
  return cls;
}
function paintBase(i){
  const el = cellEls[i];
  el.className = baseClass(i);
  el.style.background='';
  el.innerHTML='';
  if(i===path[0]){            // SOURCE
    el.textContent='⟶'; el.style.color='#c026d3'; el.style.fontWeight='700'; el.style.background='#fdf2ff';
  } else if(i===path[path.length-1]){ // SINK / 서버
    el.textContent='🛢'; el.style.fontWeight='700'; el.style.background='#dff3e6';
  } else if(isPath[i]){
    el.textContent='·'; el.style.color='#d9b46a';
  } else {
    el.textContent=''; el.style.color='#222'; el.style.fontWeight='';
  }
}
function paintTower(t){
  const el = cellEls[t.i];
  const d = TOWERS[t.key];
  el.className = baseClass(t.i);
  el.style.background = hexA(d.col, .12 + t.lvl*0.06);
  el.style.color = d.col;
  el.style.fontWeight='700';
  el.innerHTML = d.glyph + (t.lvl>1?`<sub style="font-size:7px;vertical-align:-1px">${t.lvl}</sub>`:'');
}
function hexA(hex,a){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }

/* 적은 매 프레임 좌표가 바뀌므로 path 셀 위에 절대좌표 오버레이로 그린다 */
const enemyLayer = document.createElement('div');
enemyLayer.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:2';
sheetwrap.appendChild(enemyLayer);

function cellRect(i){
  // 그리드 좌상단(헤더 포함) 기준 셀 중심 좌표
  const left = 44 + cx(i)*CW + CW/2;
  const top  = CH + cy(i)*CH + CH/2; // 첫 행은 열헤더
  return {x:left, y:top};
}
function pathPos(t){ // t in [0,1] -> {x,y}
  const f = t * (path.length-1);
  const a = Math.max(0, Math.min(path.length-1, Math.floor(f)));
  const b = Math.min(path.length-1, a+1);
  const fr = f - a;
  const pa = cellRect(path[a]), pb = cellRect(path[b]);
  return { x: pa.x+(pb.x-pa.x)*fr, y: pa.y+(pb.y-pa.y)*fr };
}

/* ============================================================
   방어측 AI — 어디에 무엇을 지을지 스스로 결정
   ============================================================ */
// 경로에 가까운 빈 빌드칸일수록 가치 ↑ (경로 셀 커버 수 기준)
let buildSpots = [];
function computeBuildSpots(){
  buildSpots = [];
  for(let i=0;i<N;i++){
    if(!buildable(i) || towerAt.has(i)) continue;
    // 이 칸 주변(반경2) 경로 셀 수
    let cover=0, near=99;
    for(const j of path){
      const d = Math.hypot(cx(i)-cx(j), cy(i)-cy(j));
      if(d<=2.8) cover++;
      if(d<near) near=d;
    }
    if(near<=2.2 && cover>0) buildSpots.push({i,cover,near});
  }
  buildSpots.sort((a,b)=> b.cover-a.cover || a.near-b.near);
}

function defenderAI(){
  // 천천히 결정: 자금이 충분하고 좋은 자리가 있을 때
  const towerStr = towers.reduce((s,t)=>s+t.lvl,0);
  const danger = serverHP < serverMax*0.55;

  // 타워가 많아질수록 신규 건설은 비싸진다(벽 도배 방지) → 깊이(업그레이드) 위주로 유도
  const buildSurcharge = Math.round(towers.length*towers.length*2.2);
  // 좋은 자리가 거의 다 찼는지
  if(!buildSpots.length) computeBuildSpots();
  const freeSpot = buildSpots.find(s=>!towerAt.has(s.i));
  const spotsScarce = !freeSpot || towers.length >= Math.max(5, (buildSpots.length*0.6|0));

  // 1) 업그레이드 우선 (위급/자금여유/자리부족이면 깊이로)
  if(towers.length && (danger || defCredits>140 || spotsScarce) ){
    const cand = towers.filter(t=>t.lvl<5).sort((a,b)=> b.kills-a.kills);
    if(cand.length){
      const t = cand[0];
      const cost = upCost(t);
      if(defCredits >= cost && Math.random()<0.6){
        defCredits -= cost; t.lvl++;
        paintTower(t);
        logBuild(`${TOWERS[t.key].name} 업그레이드 → Lv.${t.lvl}`, `=UPGRADE("${TOWERS[t.key].name}", ${ref(t.i)}, ${t.lvl})`);
        return;
      }
    }
    if(spotsScarce) return; // 자리 없으면 여기서 끝(돈 모아 다음 틱 업글)
  }

  // 2) 신규 건설
  if(!freeSpot){ computeBuildSpots(); return; }
  const spot = freeSpot;

  const hasArmor = enemies.some(e=>ENEMIES[e.key].armor);
  const fast = enemies.filter(e=>ENEMIES[e.key].spd>0.17).length; // 빠른 적(웜/DDoS)
  let pick;
  if(danger || defCredits<90+buildSurcharge) pick='fw';
  else if(fast>=2 && defCredits>=TOWERS.enc.cost+buildSurcharge) pick='enc';   // 빠른 적 → 감속
  else if(hasArmor && defCredits>=TOWERS.hon.cost+buildSurcharge) pick='hon';  // 장갑 → 광역
  else if(towers.length>=3 && defCredits>=TOWERS.ids.cost+buildSurcharge && Math.random()<.5) pick='ids';
  else pick='fw';

  const d = TOWERS[pick];
  const cost = d.cost + buildSurcharge;
  if(defCredits >= cost){
    defCredits -= cost;
    placeTower(spot.i, pick);
    logBuild(`${d.name} 설치 (₩${cost})`, `=BUILD("${d.name}", ${ref(spot.i)}, ₩${cost})`);
    computeBuildSpots();
  }
}
function upCost(t){ return Math.round(TOWERS[t.key].cost * (0.8 + t.lvl*0.55)); }
function placeTower(i,key){
  const t = {i, key, lvl:1, cd:0, kills:0};
  towers.push(t); towerAt.set(i,t); paintTower(t);
}

/* ============================================================
   공격측 AI — 웨이브를 절차 생성, 적응형 스케일링
   ============================================================ */
function composeWave(){
  wave++;
  const p = pressure();
  // 데이터 예산: 웨이브·압력에 비례 (방어가 강할수록 공세 강화 → 엎치락뒤치락)
  const budget = Math.round(40 + wave*16 + p*34 + atkData*0.6);
  atkData = Math.max(0, atkData - budget*0.35);

  // 사용 가능한 적 풀 (웨이브 진행에 따라 해금)
  const pool = ['bot','worm','ddos'];
  if(wave>=2) pool.push('trojan');
  if(wave>=4) pool.push('rkit');

  // 압력이 높으면(방어 강) 강한 적 비중 ↑
  const q = [];
  let spent = 0, guard=0;
  while(spent < budget && guard++ < 400){
    // 가중 선택: 압력 높을수록 무거운 적
    let r = Math.random();
    let key;
    const heavy = p>1.3 && wave>=3;
    if(pool.includes('rkit') && r<0.10*Math.min(1,p)) key='rkit';
    else if(pool.includes('trojan') && r<0.10+0.18*Math.min(1.5,p)) key='trojan';
    else if(r<0.34) key='worm';
    else if(r<0.5) key='ddos';
    else key='bot';
    const e = ENEMIES[key];
    const costE = e.bounty*1.1 + e.hp*0.18; // 적 1마리 비용
    if(spent+costE > budget && q.length>0) break;
    // 적 HP 스케일: 웨이브 + 방어 타워총합에 비례 → 방어가 두꺼워질수록 적도 단단해진다(엎치락뒤치락)
    const towerStr = towers.reduce((s,t)=>s+t.lvl,0);
    const scale = 1 + wave*0.22 + (p-1)*0.28 + towerStr*0.055;
    q.push({key, hpScale: scale});
    spent += costE;
  }
  // 셔플(섞어 보내기) — 단, 가벼운 적이 약간 앞서게
  q.sort(()=>Math.random()-0.55);
  waveQueue = q;
  spawnTimer = 0;
  waveActive = true;
  const counts = {};
  for(const x of waveQueue) counts[x.key]=(counts[x.key]||0)+1;
  const summary = Object.entries(counts).map(([k,n])=>`${ENEMIES[k].name}×${n}`).join(' + ');
  logBuild(`웨이브 ${wave} 개시 — ${summary}`, `=WAVE(${wave}, [${Object.entries(counts).map(([k,n])=>`"${ENEMIES[k].name}":${n}`).join(', ')}])`);
}

function spawnNext(){
  if(!waveQueue.length){ waveActive=false; interWave = 45 + Math.max(0, 28 - wave); return; }
  const spec = waveQueue.shift();
  const e = ENEMIES[spec.key];
  const hp = Math.round(e.hp*spec.hpScale);
  enemies.push({ key:spec.key, t:0, hp, maxhp:hp, slow:0, slowT:0 });
  if(Math.random()<0.18) logBuild(`${e.name} 침투 시작`, `=SPAWN("${e.name}", ${ref(path[0])})`);
}

/* ============================================================
   전투 틱
   ============================================================ */
function logBuild(msg, formula){
  lastBuild = msg;
  if(formula) fmla.textContent = formula;
}

function fireZap(from, to, col){
  const dx=to.x-from.x, dy=to.y-from.y;
  const len=Math.hypot(dx,dy), ang=Math.atan2(dy,dx)*180/Math.PI;
  const z=document.createElement('div');
  z.className='zap';
  z.style.cssText+=`left:${from.x}px;top:${from.y}px;width:${len}px;transform:rotate(${ang}deg);background:${col};box-shadow:0 0 4px ${col}`;
  enemyLayer.appendChild(z);
  setTimeout(()=>z.remove(),180);
}

function tick(){
  tickN++;
  // ---- 공격측 예산 누적 + 웨이브 스케줄 ----
  atkData += 0.6 + wave*0.05;

  if(!waveActive){
    interWave--;
    if(interWave<=0) composeWave();
  } else {
    spawnTimer--;
    if(spawnTimer<=0){
      spawnNext();
      // 압력 높을수록 촘촘하게 — 후반엔 떼로 몰려 방어선을 뚫으려 한다
      spawnTimer = Math.max(3, 22 - wave*2 - (pressure()*5|0));
    }
  }

  // ---- 적 이동 + 누수 ----
  for(let k=enemies.length-1;k>=0;k--){
    const e=enemies[k]; const E=ENEMIES[e.key];
    if(e.hp<=0){ enemies.splice(k,1); continue; }
    let sp = E.spd; if(e.slowT>0){ sp*=(1-e.slow); e.slowT--; }
    // 속도는 '칸/틱' — 경로 길이에 맞춰 정규화해 긴 맵일수록 교전 시간이 늘어난다
    e.t += sp / Math.max(1, path.length-1);
    if(e.t>=1){
      // 서버 도달 → 데이터 유출
      serverHP -= E.leak*4;
      atkData += E.leak*3;
      leaked += E.leak;
      enemies.splice(k,1);
      cellEls[path[path.length-1]].classList.add('breach');
      setTimeout(()=>cellEls[path[path.length-1]].classList.remove('breach'),900);
      logBuild(`${E.name}이(가) 서버에서 데이터를 유출했습니다 (-${E.leak*4}HP)`, `=BREACH("${E.name}", ${ref(path[path.length-1])}, -${E.leak*4})`);
      if(serverHP<=0){ serverHP=0; resetWorld('서버 함락 — 시스템을 복구하고 재가동합니다.'); return; }
    }
  }

  // ---- 타워 사격 ----
  for(const t of towers){
    if(t.cd>0){ t.cd--; continue; }
    const d = TOWERS[t.key];
    const tp = cellRect(t.i);
    // 가장 진행된(t 큰) 적 우선 타격 (서버에 가까운 적)
    let best=null, bestT=-1;
    for(const e of enemies){
      const ep = pathPos(e.t);
      const dist = Math.hypot(ep.x-tp.x, ep.y-tp.y) / CW; // 칸 단위
      if(dist <= d.rng && e.t>bestT){ best=e; bestT=e.t; best._ep=ep; }
    }
    if(best){
      fireZap(tp, best._ep, d.col);
      let dmg = d.dmg + t.lvl*2;
      const armor = ENEMIES[best.key].armor||0;
      dmg = Math.max(1, dmg-armor);
      best.hp -= dmg;
      if(d.slow){ best.slow=d.slow; best.slowT=24; }
      if(d.splash){
        for(const e2 of enemies){ if(e2===best) continue;
          const p2=pathPos(e2.t);
          if(Math.hypot(p2.x-best._ep.x,p2.y-best._ep.y)/CW <= d.splash){
            e2.hp -= dmg*0.6;
          }
        }
      }
      t.cd = d.rate;
      // 킬 처리
      if(best.hp<=0){
        killEnemy(best, t);
      }
    }
  }
  // 광역/누적 피해로 죽은 적 정리 (killEnemy가 안전하게 splice + 중복방지)
  for(let k=enemies.length-1;k>=0;k--){ if(enemies[k] && enemies[k].hp<=0 && !enemies[k]._dead) killEnemy(enemies[k], null); }

  // ---- AI 의사결정 ----
  if(tickN % 14 === 0) defenderAI();

  // ---- 렌더 ----
  renderEnemies();
  if(tickN % 4 === 0) renderHud();
}

function killEnemy(e, byTower){
  const E=ENEMIES[e.key];
  // 이미 enemies에서 splice될 수 있으니 중복 보상 방지
  if(e._dead) return; e._dead=true;
  const idx = enemies.indexOf(e); if(idx>=0) enemies.splice(idx,1);
  defCredits += E.bounty;
  killed++;
  if(byTower){ byTower.kills++; }
  if(Math.random()<0.14 || E.armor){
    obituaries.push({name:E.name, wave, at:tickN});
    logBuild(`${E.name} 격파 (+₩${E.bounty})`, `=KILL("${E.name}", +${E.bounty})`);
    document.querySelector('#tabs div[data-t="2"]').textContent = `격파기록 (${obituaries.length})`;
  } else {
    obituaries.push({name:E.name, wave, at:tickN});
    document.querySelector('#tabs div[data-t="2"]').textContent = `격파기록 (${obituaries.length})`;
  }
}

function resetWorld(reason){
  // 라운드 리셋 (엎치락뒤치락 — 게임은 계속 굴러간다)
  logBuild(reason, `=RESTORE(서버, ${serverMax}HP)`);
  serverHP = serverMax = Math.min(160, 100 + wave*4);
  // 타워 절반 손실, 자금 보너스
  towers = towers.filter(()=>Math.random()<0.5);
  towerAt.clear();
  for(const t of towers) towerAt.set(t.i,t);
  enemies = []; waveQueue=[]; waveActive=false; interWave=160;
  defCredits += 120; atkData = 40;
  repaintAll();
}

/* ---------- 적/HUD 렌더 ---------- */
let enemyNodes = [];
function renderEnemies(){
  // 풀링: 노드 수 맞추기
  while(enemyNodes.length < enemies.length){
    const n=document.createElement('div');
    n.style.cssText='position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:30px';
    n.innerHTML='<div class="g" style="font-size:13px;line-height:1;font-weight:700"></div>'+
                '<div class="hp" style="position:static;width:22px;margin-top:1px"><i></i></div>';
    enemyLayer.appendChild(n); enemyNodes.push(n);
  }
  while(enemyNodes.length > enemies.length){ enemyNodes.pop().remove(); }
  for(let k=0;k<enemies.length;k++){
    const e=enemies[k], E=ENEMIES[e.key], n=enemyNodes[k];
    const p=pathPos(e.t);
    n.style.left=p.x+'px'; n.style.top=p.y+'px';
    const g=n.firstChild; g.textContent=E.glyph; g.style.color=E.col;
    const bar=n.lastChild.firstChild;
    const frac=Math.max(0,e.hp/e.maxhp);
    bar.style.width=(frac*100)+'%';
    bar.style.background = frac>0.5?'#16a34a':frac>0.25?'#eab308':'#dc2626';
    if(e.slowT>0) n.style.filter='hue-rotate(40deg) brightness(.9)'; else n.style.filter='';
  }
}

function bar(frac, col){ return `<div class="bar"><i style="width:${Math.max(0,Math.min(1,frac))*100}%;background:${col}"></i></div>`; }

function renderHud(){
  // 상태바
  const p=pressure();
  statusbar.innerHTML =
    `준비<span class="sep">|</span>웨이브 ${wave}<span class="sep">|</span>`+
    `서버 ${serverHP}/${serverMax}HP<span class="sep">|</span>`+
    `방어자금 ₩${defCredits}<span class="sep">|</span>`+
    `격파 ${killed}<span class="sep">|</span>유출 ${leaked}<span class="sep">|</span>${lastBuild}`;

  if(activeTab===0){
    // 전장 탭: 범례 = 양측 상태
    let h='<h4>🛡 방어 (AI)</h4>';
    h+= bar(serverHP/serverMax, serverHP>serverMax*0.4?'#16a34a':'#dc2626');
    h+= `<div style="font-size:10px;color:#555">서버 ${serverHP}/${serverMax} · 자금 ₩${defCredits} · 타워 ${towers.length}</div>`;
    h+='<h4 style="margin-top:7px">☣ 침입 (AI)</h4>';
    h+= bar(Math.min(1,enemies.length/12), '#dc2626');
    h+= `<div style="font-size:10px;color:#555">활성 ${enemies.length} · 데이터예산 ${Math.round(atkData)} · 압력 ${p.toFixed(2)}</div>`;
    h+='<h4 style="margin-top:7px">타워</h4>';
    for(const k of TOWER_ORDER){ const d=TOWERS[k];
      h+=`<div><span class="sw" style="background:${d.col}"></span>${d.glyph} ${d.name} <span style="color:#999">₩${d.cost}</span></div>`;
    }
    legend.innerHTML=h;
  }
}

/* 전황/격파기록 탭 — 시트 위 오버레이로 표시 */
const tabOverlay = document.createElement('div');
tabOverlay.style.cssText='position:absolute;inset:0;background:#fff;overflow:auto;z-index:5;display:none;padding:14px 18px;font-size:12px';
sheetwrap.appendChild(tabOverlay);

function renderTab(){
  cellEls; // no-op
  if(activeTab===0){ tabOverlay.style.display='none'; enemyLayer.style.display='block'; legend.style.display='block'; controls.style.display='block'; return; }
  enemyLayer.style.display='none'; legend.style.display='none'; controls.style.display='none';
  tabOverlay.style.display='block';
  if(activeTab===1){
    // 전황 (실시간 통계 셀처럼)
    const counts={}; for(const e of enemies) counts[e.key]=(counts[e.key]||0)+1;
    let rows = TOWER_ORDER.map(k=>{ const ts=towers.filter(t=>t.key===k); const kills=ts.reduce((s,t)=>s+t.kills,0);
      return `<tr><td>${TOWERS[k].glyph} ${TOWERS[k].name}</td><td style="text-align:right">${ts.length}</td><td style="text-align:right">${kills}</td></tr>`; }).join('');
    let erows = Object.keys(ENEMIES).map(k=> `<tr><td>${ENEMIES[k].glyph} ${ENEMIES[k].name}</td><td style="text-align:right">${counts[k]||0}</td></tr>`).join('');
    tabOverlay.innerHTML =
      `<div style="font-weight:700;color:#107c41;margin-bottom:8px">전황 요약 — 서기(틱) ${tickN}</div>`+
      `<div style="display:flex;gap:30px;flex-wrap:wrap">`+
      `<div><div style="color:#555;margin-bottom:4px">방어 진영</div>`+
        `<div>서버 체력: <b>${serverHP}/${serverMax}</b></div>`+
        `<div>방어 자금: <b>₩${defCredits}</b></div>`+
        `<div>총 격파: <b>${killed}</b></div>`+
        `<table style="margin-top:6px;border-collapse:collapse" cellpadding="3">`+
        `<tr style="color:#888"><td>타워</td><td>수</td><td>킬</td></tr>${rows}</table></div>`+
      `<div><div style="color:#555;margin-bottom:4px">공격 진영</div>`+
        `<div>현재 웨이브: <b>${wave}</b></div>`+
        `<div>데이터 예산: <b>${Math.round(atkData)}</b></div>`+
        `<div>누적 유출: <b>${leaked}</b></div>`+
        `<div>적응 압력: <b>${pressure().toFixed(2)}</b></div>`+
        `<table style="margin-top:6px;border-collapse:collapse" cellpadding="3">`+
        `<tr style="color:#888"><td>침입자(활성)</td><td>수</td></tr>${erows}</table></div>`+
      `</div>`;
  } else {
    let h=`<div style="font-weight:700;color:#107c41;margin-bottom:8px">격파기록 — 총 ${obituaries.length}건</div>`;
    if(!obituaries.length) h+='<div style="color:#999">아직 격파된 침입자가 없습니다.</div>';
    else { h+='<table style="border-collapse:collapse" cellpadding="4"><tr style="color:#888"><td>#</td><td>침입자</td><td>웨이브</td></tr>';
      for(const o of obituaries.slice(-200).reverse()){ const n=ENEMIES[Object.keys(ENEMIES).find(k=>ENEMIES[k].name===o.name)]||{};
        h+=`<tr><td style="color:#aaa">†</td><td>${n.glyph||''} ${o.name}</td><td style="text-align:center">W${o.wave}</td></tr>`; }
      h+='</table>'; }
    tabOverlay.innerHTML=h;
  }
}

/* ============================================================
   사람 개입 — 컨트롤 패널
   ============================================================ */
function renderControls(){
  controls.innerHTML =
    `<div style="font-weight:700;color:#107c41;margin-bottom:3px">관전 중 (자동 진행)</div>`+
    `<button id="bPause">${paused?'▶ 재개':'⏸ 일시정지'}</button>`+
    `<button data-sp="1" class="${speed===1?'on':''}">1×</button>`+
    `<button data-sp="2" class="${speed===2?'on':''}">2×</button>`+
    `<button data-sp="4" class="${speed===4?'on':''}">4×</button>`+
    `<button id="bWave">⚡ 웨이브 소환</button>`+
    `<div style="margin-top:4px">수동 설치:</div>`+
    TOWER_ORDER.map(k=>`<button data-build="${k}" class="${placingKey===k?'on':''}" title="${TOWERS[k].note}">${TOWERS[k].glyph} ${TOWERS[k].name} ₩${TOWERS[k].cost}</button>`).join('')+
    `<div class="hint">${placingKey?'빈 칸을 클릭해 설치 (Esc 취소)':'타워 버튼 → 칸 클릭. 셀 클릭=정보'}</div>`;
}
controls.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='bPause'){ paused=!paused; }
  else if(b.dataset.sp){ speed=+b.dataset.sp; }
  else if(b.id==='bWave'){ if(!waveActive) composeWave(); else { interWave=0; } }
  else if(b.dataset.build){ placingKey = placingKey===b.dataset.build?null:b.dataset.build; }
  renderControls();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ placingKey=null; renderControls(); }
  else if(e.key===' '){ paused=!paused; renderControls(); e.preventDefault(); }
});

/* 셀 클릭: 수동 설치 or 정보 */
sheet.addEventListener('click', e=>{
  const tEl=e.target.closest('.cell'); if(!tEl) return;
  const i=+tEl.dataset.i;
  if(placingKey){
    const d=TOWERS[placingKey];
    if(!buildable(i)){ flashFx(`=ERROR("경로 위에는 설치 불가", ${ref(i)})`); return; }
    if(towerAt.has(i)){ flashFx(`=ERROR("이미 타워 있음", ${ref(i)})`); return; }
    if(defCredits < d.cost){ flashFx(`=ERROR("자금 부족: ₩${defCredits}/${d.cost}")`); return; }
    defCredits -= d.cost; placeTower(i, placingKey);
    logBuild(`[수동] ${d.name} 설치`, `=BUILD.MANUAL("${d.name}", ${ref(i)})`);
    computeBuildSpots();
    return;
  }
  // 선택/정보
  if(selected>=0){ const pe=cellEls[selected]; if(towerAt.has(selected)) paintTower(towerAt.get(selected)); else paintBase(selected); }
  selected=i;
  if(towerAt.has(i)) paintTower(towerAt.get(i)); else paintBase(i);
  cellEls[i].classList.add('sel');
  namebox.textContent=ref(i);
  const t=towerAt.get(i);
  if(t){ const d=TOWERS[t.key]; fmla.textContent=`=TOWER("${d.name}", Lv.${t.lvl}, 사거리 ${d.rng}, 피해 ${d.dmg+t.lvl*2}, 격파 ${t.kills})`; }
  else if(isPath[i]) fmla.textContent=`=PATH(${ref(i)}, 순서 ${pathRank[i]+1}/${path.length})`;
  else fmla.textContent=`=EMPTY(${ref(i)}, "방화벽 설치 가능")`;
});
function flashFx(s){ fmla.textContent=s; }

/* 탭 전환 */
document.getElementById('tabs').addEventListener('click', e=>{
  const d=e.target.closest('div[data-t]'); if(!d) return;
  document.querySelectorAll('#tabs div').forEach(x=>x.classList.remove('on'));
  d.classList.add('on'); activeTab=+d.dataset.t; renderTab(); renderHud();
});

/* ============================================================
   초기화 + 루프
   ============================================================ */
function repaintAll(){
  for(let i=0;i<N;i++) paintBase(i);
  for(const t of towers) paintTower(t);
}
function init(){
  buildPath();
  repaintAll();
  computeBuildSpots();
  renderControls();
  renderHud();
  fmla.textContent=`=DEFEND($A$1:$${colName(COLS-1)}$${ROWS}, "데이터 유출을 차단하라")`;
  // 시작 타워 몇 개 (AI가 즉시 의미있게 보이도록) — 방어 진형을 갖춘 채 시작
  defenderAI(); defenderAI(); defenderAI();
  // 짧은 준비 시간 후 첫 웨이브 (관전자가 진형 형성→교전 순서로 본다)
  waveActive = false; interWave = 24;
}

let acc=0, last=performance.now();
const TICK_MS=80;
function loop(now){
  const dt=now-last; last=now;
  if(!paused){
    acc += dt*speed;
    let steps=0;
    while(acc>=TICK_MS && steps<6){ tick(); acc-=TICK_MS; steps++; }
  } else { acc=0; }
  requestAnimationFrame(loop);
}

init();
renderTab();
requestAnimationFrame(loop);

// 디버그 핸들
window.__td = { get state(){ return {wave, serverHP, defCredits, towers:towers.length, enemies:enemies.length, killed, leaked}; }, paused:()=>paused };
})();
</script>
