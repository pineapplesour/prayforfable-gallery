<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>방제작전.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;user-select:none;-webkit-user-select:none}
  #app{display:flex;flex-direction:column;height:100%}
  /* ---- title bar ---- */
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:0 0 auto}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* ---- menu bar ---- */
  #menubar{height:26px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:14px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;flex:0 0 auto;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:3px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:3px 2px}
  /* ---- ribbon (controls disguised as ribbon) ---- */
  #ribbon{height:46px;background:#f7f7f7;border-bottom:1px solid #d4d4d4;display:flex;
    align-items:center;padding:0 8px;gap:6px;flex:0 0 auto;overflow-x:auto}
  .rgrp{display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-right:1px solid #e0e0e0;padding:0 8px;height:38px}
  .rgrp .lab{font-size:9.5px;color:#888;margin-top:2px}
  .rbtn{display:flex;gap:4px}
  .rbtn button{font-family:inherit;font-size:11px;background:#fff;border:1px solid #cfcfcf;
    border-radius:3px;padding:3px 8px;cursor:pointer;color:#333;min-width:30px}
  .rbtn button:hover{background:#eaf6ee;border-color:#107c41}
  .rbtn button.on{background:#107c41;color:#fff;border-color:#107c41}
  /* ---- formula bar ---- */
  #fbar{height:24px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px;flex:0 0 auto}
  #namebox{width:66px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;flex:0 0 auto}
  #fx{width:26px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif;flex:0 0 auto}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* ---- sheet area ---- */
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1 1 auto}
  #sheet{display:grid;background:#fff}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:10.5px;overflow:hidden}
  .hd.hi{background:#dff0e6;color:#107c41;font-weight:600}
  .cell{border-right:1px solid #e8e8e8;border-bottom:1px solid #e8e8e8;
    display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;
    overflow:hidden;cursor:cell;position:relative}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:4}
  .cell.buildable{cursor:pointer}
  .hp{position:absolute;left:1px;bottom:0;height:2px;background:#d62828;border-radius:1px}
  .rng{position:absolute;inset:0;background:rgba(16,124,65,.10);pointer-events:none}
  @keyframes hit{0%{background:#fff3b0}100%{}}
  .cell.hit{animation:hit .25s}
  @keyframes spray{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
  .spray{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#0d8a4f;pointer-events:none;animation:spray .3s forwards}
  /* ---- side panel (legend look) ---- */
  #panel{position:absolute;top:6px;right:8px;width:206px;background:#fffdf0;border:1px solid #d8c66a;
    box-shadow:2px 3px 9px rgba(0,0,0,.16);font-size:11px;z-index:6;line-height:1.55;border-radius:2px}
  #panel h4{margin:0;padding:5px 9px;font-size:11px;color:#7a6a1f;background:#fbf3c9;border-bottom:1px solid #e6d98f}
  #panel .body{padding:6px 9px;max-height:42vh;overflow:auto}
  #panel .row{display:flex;justify-content:space-between;gap:6px}
  #panel .row b{font-weight:600}
  #panel .sw{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px;border-radius:1px}
  #panel .dim{color:#999}
  #panel .barwrap{background:#eee;border-radius:2px;height:7px;margin-top:2px;overflow:hidden}
  #panel .bar{height:100%}
  .panhide{display:none !important}
  /* ---- chronicle / kill log views ---- */
  #logview{position:absolute;inset:0;background:#fff;overflow:auto;display:none;font-size:11.5px}
  #logview table{border-collapse:collapse;width:100%}
  #logview td,#logview th{border:1px solid #e3e3e3;padding:3px 8px;text-align:left;
    font-family:Consolas,Menlo,monospace}
  #logview th{background:#f5f5f5;color:#555;position:sticky;top:0}
  #logview td.f{color:#0a5c30}
  /* ---- status bar ---- */
  #statusbar{height:22px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 10px;font-size:11px;flex:0 0 auto;white-space:nowrap;overflow:hidden;gap:0}
  #statusbar .sep{margin:0 8px;opacity:.45}
  #statusbar b{color:#fff}
  /* ---- sheet tabs ---- */
  #tabs{height:24px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:24px;
    border-top:1px solid #d4d4d4;font-size:11px;flex:0 0 auto;overflow:hidden}
  #tabs div{padding:3px 12px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  @media (max-width:520px){
    #ribbon{height:42px}
    .rgrp{padding:0 5px}
    #panel{width:150px;font-size:10px}
    #menubar{gap:9px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <span id="ttl">방제작전.xlsx - Excel</span>
  </div>
  <div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i></div>
  <div id="ribbon">
    <div class="rgrp"><div class="rbtn">
      <button id="bPause" title="일시정지/재생">⏸ 일시정지</button>
    </div><div class="lab">시뮬레이션</div></div>
    <div class="rgrp"><div class="rbtn">
      <button data-sp="0.5">0.5×</button>
      <button data-sp="1" class="on">1×</button>
      <button data-sp="2">2×</button>
      <button data-sp="4">4×</button>
    </div><div class="lab">속도</div></div>
    <div class="rgrp"><div class="rbtn">
      <button id="bSummon" title="다음 웨이브 즉시 소환">⚡ 웨이브 소환</button>
      <button id="bBuild" title="직접 타워 설치 모드">＋ 타워 설치</button>
    </div><div class="lab">개입</div></div>
    <div class="rgrp"><div class="rbtn">
      <button id="bPanel" class="on" title="현황 패널">▤ 현황</button>
    </div><div class="lab">보기</div></div>
  </div>
  <div id="fbar">
    <div id="namebox">A1</div>
    <div id="fx">fx</div>
    <div id="formula"></div>
  </div>
  <div id="sheetwrap">
    <div id="sheet"></div>
    <div id="logview"></div>
    <div id="panel">
      <h4 id="panelTitle">B1 · 전황 보고서</h4>
      <div class="body" id="panelBody"></div>
    </div>
  </div>
  <div id="statusbar"></div>
  <div id="tabs">
    <div class="on" data-view="battle">전장</div>
    <div data-view="report">전황</div>
    <div data-view="kills">격파기록</div>
  </div>
</div>
<script>
(() => {
"use strict";
/* ===================================================================
   방제작전.xlsx — 엑셀로 위장한 타워 디펜스
   픽셀 곤충 떼(SWARM AI)  vs  살충 타워(GUARD AI)
   양측 모두 AI. 관전이 기본. 절차생성 적응형 웨이브.
   =================================================================== */

// ---- DOM ----
const $ = s => document.querySelector(s);
const sheet = $('#sheet'), fmla = $('#formula'), namebox = $('#namebox'),
      statusbar = $('#statusbar'), panel = $('#panel'),
      panelBody = $('#panelBody'), panelTitle = $('#panelTitle'),
      logview = $('#logview'), ttl = $('#ttl');

// ---- grid sizing (responsive) ----
const isNarrow = innerWidth < 560;
const CW = isNarrow ? 26 : 32, CH = isNarrow ? 22 : 24;
const HDW = 32;
let COLS = Math.max(14, Math.min(38, Math.floor((innerWidth - HDW - 6) / CW)));
let ROWS = Math.max(12, Math.min(26, Math.floor((sheetH() - 6) / CH)));
function sheetH(){
  // estimate available sheet height
  const used = 30+26+46+24+22+24; // bars
  return Math.max(280, innerHeight - used);
}
const N = () => COLS * ROWS;

sheet.style.gridTemplateColumns = `${HDW}px repeat(${COLS}, ${CW}px)`;
sheet.style.gridAutoRows = CH + 'px';

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
function ref(idx){return colName(idx%COLS)+(Math.floor(idx/COLS)+1);}
function rc(i){return [i%COLS, i/COLS|0];}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=arr=>arr[Math.random()*arr.length|0];

// =====================================================================
// PATH GENERATION — procedural serpentine route through the cells
// =====================================================================
let path = [];        // array of cell indices, start -> goal
let pathSet = new Set();
let entryIdx = 0, goalIdx = 0;

function genPath(){
  // Procedural serpentine confined to an interior WINDOW of the sheet, leaving a
  // 1-cell margin all round so every leg has buildable flanks. Legs span the
  // window width (margin..COLS-1-margin), giving a compact, defensible route
  // (~70-130 cells) instead of one that fills the whole grid.
  path = []; pathSet = new Set();
  // Confine the route to a compact window (~12-18 cols wide, 5-7 legs) so the
  // total length stays ~60-110 cells: long enough to read as a journey, short
  // enough that the defender AI can actually cover it. Window is placed with a
  // bit of random offset for map variety; margins on all sides stay buildable.
  const winW = clamp(Math.round(COLS*0.5), 11, 18);
  const slack = Math.max(0, COLS-2-winW);
  const mL = 1 + (slack? ri(0,slack):0);
  const mR = mL + winW - 1;
  const top = 1, bot = ROWS-2;
  const stepRows = (bot-top) >= 18 ? 3 : ((bot-top) >= 10 ? 2 : 2);
  const rowsUsed = [];
  for (let r=top; r<=bot && rowsUsed.length<7; r+=stepRows) rowsUsed.push(r);
  if (rowsUsed.length<2) rowsUsed.push(clamp(top+stepRows,top,bot));

  let dir = Math.random()<.5 ? 1 : -1;
  let curC = dir===1 ? mL : mR;
  let curR = rowsUsed[0];
  const push=(cc,rr)=>{ const id=rr*COLS+cc; if(!pathSet.has(id)){path.push(id);pathSet.add(id);} };
  push(curC,curR);
  for (let k=0;k<rowsUsed.length;k++){
    const targetC = dir===1 ? mR : mL;
    while (curC !== targetC){ curC += dir; push(curC,curR); }
    if (k < rowsUsed.length-1){
      const nextR = rowsUsed[k+1];
      while (curR !== nextR){ curR++; push(curC,curR); }
      dir = -dir;
    }
  }
  entryIdx = path[0];
  goalIdx = path[path.length-1];
}

// =====================================================================
// CELL STATE
// =====================================================================
let cellEls = [];
let cells = [];   // {kind:'empty'|'path'|'wall', tower:null|obj}
function buildSheet(){
  sheet.innerHTML='';
  cellEls = new Array(N());
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd'; frag.appendChild(corner);
  for (let c=0;c<COLS;c++){const h=document.createElement('div');h.className='hd';h.dataset.col=c;h.textContent=colName(c);frag.appendChild(h);}
  for (let rr=0;rr<ROWS;rr++){
    const h=document.createElement('div');h.className='hd';h.dataset.row=rr;h.textContent=rr+1;frag.appendChild(h);
    for (let c=0;c<COLS;c++){
      const i=rr*COLS+c;
      const d=document.createElement('div');d.className='cell';d.dataset.i=i;
      cellEls[i]=d;frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
}

function initCells(){
  cells = new Array(N());
  for (let i=0;i<N();i++) cells[i]={kind:'empty', tower:null};
  for (const i of path) cells[i].kind='path';
  // mark entry/goal kinds
  cells[entryIdx].kind='entry';
  cells[goalIdx].kind='goal';
}

// buildable = empty cell adjacent (8-dir) to the path
function buildableSet(){
  const s = new Set();
  for (const p of path){
    const [c,r]=rc(p);
    for (let dc=-1;dc<=1;dc++)for(let dr=-1;dr<=1;dr++){
      const nc=c+dc, nr=r+dr;
      if(nc<0||nr<0||nc>=COLS||nr>=ROWS)continue;
      const id=nr*COLS+nc;
      if(cells[id].kind==='empty') s.add(id);
    }
  }
  return s;
}
let buildable = new Set();

// =====================================================================
// TOWER TYPES — 살충 타워
// =====================================================================
const TOWERS = {
  spray:  {name:'분무기',  glyph:'✸', color:'#1f9e57', cost:55,  rng:1.6, dmg:7,  rate:34, splash:0,   desc:'살충 분무'},
  trap:   {name:'끈끈이덫',glyph:'▦', color:'#b07a1a', cost:40,  rng:1.2, dmg:3,  rate:20, splash:0,   slow:.45, desc:'감속 트랩'},
  zapper: {name:'전격등',  glyph:'⚡', color:'#2563eb', cost:90,  rng:2.4, dmg:14, rate:50, splash:0,   desc:'고압 전격'},
  fogger: {name:'연막탄',  glyph:'❉', color:'#8e44ad', cost:120, rng:1.9, dmg:9,  rate:60, splash:1.3, desc:'광역 연막'},
};
const TOWER_KEYS = Object.keys(TOWERS);

// =====================================================================
// BUG TYPES — 픽셀 곤충
// =====================================================================
// spd = relative speed factor (1.0 = baseline). Actual cells/step is normalized
// to the path length in spawnBug so traversal time is consistent on any grid.
// Glyphs are BMP Unicode symbols (render in any system font) chosen to evoke
// each pixel insect — emoji are avoided so bugs are always visible.
const BUGS = {
  ant:    {name:'개미',    glyph:'ꙮ', hp:22,  spd:1.0,  val:8,  color:'#7a4a1f'},
  beetle: {name:'딱정벌레',glyph:'⬢', hp:60,  spd:0.66, val:14, color:'#2d6a3a', armor:2},
  fly:    {name:'파리',    glyph:'✲', hp:14,  spd:1.7,  val:7,  color:'#555'},
  roach:  {name:'바퀴',    glyph:'☗', hp:40,  spd:1.15, val:12, color:'#6b3a1f'},
  spider: {name:'독거미',  glyph:'⁂', hp:34,  spd:1.3,  val:11, color:'#3a0a0a'},
  queen:  {name:'여왕벌',  glyph:'✺', hp:240, spd:0.55, val:60, color:'#b88600', boss:true},
};

// =====================================================================
// GAME STATE
// =====================================================================
const G = {
  paused:false, speed:1,
  buildMode:false, buildSel:'spray',
  wave:0, money:260, lives:20, maxLives:20,
  bugBudget:0,          // swarm AI accumulating resource
  bugIncome:14,
  killed:0, leaked:0, totalSpawn:0,
  bugs:[],              // live bugs
  towers:[],            // tower cell indices
  pendingSpawns:[],     // {bug, t}
  selected:-1,
  difficulty:1,         // adaptive scalar
  view:'battle',
  log:[],              // {f:formula, t:text, side}
  tick:0, waveTimer:0, interWave:true, betweenT:0,
  threat:0,            // recent leak pressure (drives defender urgency)
  panelOn:true,
};

// formula-bar log (the disguise)
function logF(formula, text, side){
  G.log.unshift({f:formula, t:text, side, wave:G.wave});
  if (G.log.length>240) G.log.pop();
  fmla.textContent = formula;
  if (G.view!=='battle') renderLogView();
}

// =====================================================================
// WAVE GENERATION — procedural, adaptive, balanced
// =====================================================================
function defenderStrength(){
  let s=0; for (const ti of G.towers){const t=cells[ti].tower; if(t) s += (TOWERS[t.type].dmg)*(t.level) * (1000/(TOWERS[t.type].rate));}
  return s;
}
function planWave(){
  G.wave++;
  // Adaptive (rubber-band) difficulty. The wave budget is tied mostly to how the
  // DEFENDER is doing — high life => press harder, low life => ease off sharply —
  // plus a small scaling vs the defender's actual firepower so it never trivializes.
  // This keeps the two AIs locked in a long back-and-forth instead of a blowout.
  const defS = defenderStrength()+1;
  const lifeRatio = G.lives / G.maxLives;        // 1 = full, 0 = dead
  // pressure factor: ~0.45 when nearly dead, ~1.5 when healthy
  const pressure = 0.45 + lifeRatio*lifeRatio*1.05;
  // target budget chases a fraction of the defender's firepower, scaled by pressure
  const target = (28 + defS*0.05) * pressure;
  // ease toward target so spikes are smoothed
  G.difficulty = G.difficulty*0.5 + 1*0.5; // kept for panel display
  const budget = Math.round(clamp(target, 22, 460));

  // swarm AI composes the wave from a budget — chooses a "strategy"
  const strategies = ['rush','tank','mixed','swarm','flank'];
  // pick strategy based on what hurt the defender least last time (simple memory)
  const strat = chooseStrategy();
  const comp = [];
  let b = budget;
  const buyCost = {ant:8, beetle:18, fly:6, roach:13, spider:11};
  function buy(type, weight){
    const c = buyCost[type];
    const n = Math.max(0, Math.floor((b*weight)/c));
    for (let k=0;k<n;k++) comp.push(type);
    b -= n*c;
  }
  if (strat==='rush'){ buy('fly',.55); buy('ant',.45); }
  else if (strat==='tank'){ buy('beetle',.7); buy('roach',.3); }
  else if (strat==='swarm'){ buy('ant',.6); buy('fly',.4); }
  else if (strat==='flank'){ buy('spider',.5); buy('roach',.5); }
  else { buy('ant',.3); buy('roach',.3); buy('spider',.2); buy('beetle',.2); }
  // spend leftovers
  while (b>=6){ const t=pick(['ant','fly','roach']); comp.push(t); b-=buyCost[t]; }
  // cap wave size so the path reads as a marching column, not a solid wall
  const CAP = 16;
  if (comp.length>CAP){ shuffle(comp); comp.length=CAP; }
  // boss every 5th wave
  if (G.wave%5===0){ comp.push('queen'); }
  // shuffle for organic ordering
  shuffle(comp);
  G.bugIncome = 12 + G.wave*1.6;
  G.lastStrategy = strat;
  G.lastWaveSize = comp.length;
  // schedule spawns: each entry holds a RELATIVE gap (only head counts down).
  // gap must exceed a bug's cell-crossing time (~22 steps) so bugs stay separated.
  const gap = clamp(26 - G.wave*0.5, 16, 26);
  G.pendingSpawns = [];
  comp.forEach((type,k)=>{
    const g = (k===0) ? 2 : Math.round((type==='queen'?gap*2.4:gap)*rnd(.85,1.25));
    G.pendingSpawns.push({type, t:g});
  });
  G.totalSpawn += comp.length;
  logF(`=WAVE(${G.wave}, "${stratName(strat)}", ${comp.length})`,
       `${G.wave}웨이브: ${stratName(strat)} 전략, 곤충 ${comp.length}마리 편성`, 'bug');
}
function stratName(s){return {rush:'속공 러시',tank:'중장갑 돌파',mixed:'혼성 편대',swarm:'물량 공세',flank:'침투 교란'}[s]||s;}

// swarm AI strategy memory: track which strategy leaked most -> repeat winners
const stratScore = {rush:0,tank:0,mixed:0,swarm:0,flank:0};
function chooseStrategy(){
  // epsilon-greedy on past leak performance + life pressure
  if (Math.random()<0.3) return pick(['rush','tank','mixed','swarm','flank']);
  let best='mixed', bv=-1e9;
  for (const k in stratScore){ if (stratScore[k]>bv){bv=stratScore[k];best=k;} }
  // if defender very strong, prefer tank/flank to break through
  if (defenderStrength()>650 && Math.random()<.6) return pick(['tank','flank']);
  return best;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}}

// =====================================================================
// SPAWN / BUG MOVEMENT
// =====================================================================
let bugId=0;
const TRAVERSE_STEPS = 360; // baseline bug crosses full path in ~this many sim steps
function spawnBug(type){
  const def = BUGS[type];
  const hpScale = 1 + G.wave*0.11;
  const hp = Math.round(def.hp*hpScale);
  const cellsPerStep = (path.length / TRAVERSE_STEPS) * def.spd;
  G.bugs.push({
    id:bugId++, type, glyph:def.glyph, color:def.color,
    hp, maxhp:hp, spd:cellsPerStep, val:def.val,
    armor:def.armor||0, boss:!!def.boss,
    pos:0,                  // progress along path (float index)
    slow:0,                 // slow timer
    cell:entryIdx, prevCell:-1,
  });
  logF(`=SPAWN("${def.name}", ${ref(entryIdx)}, HP=${hp})`,
       `${def.name} 출현 — ${ref(entryIdx)} 진입`, 'bug');
}

function moveBugs(){
  const dead=[];
  for (let bi=0; bi<G.bugs.length; bi++){
    const b=G.bugs[bi];
    if (b.hp<=0){ dead.push(bi); continue; }   // remove killed bugs from the field
    let sp=b.spd;
    if (b.slow>0){ sp*=0.5; b.slow--; }
    b.pos += sp;
    const idx = Math.floor(b.pos);
    if (idx >= path.length-1){
      // reached goal -> leak
      b.cell=goalIdx;
      G.lives--;
      G.leaked++;
      stratScore[G.lastStrategy]=(stratScore[G.lastStrategy]||0)+1.4;
      G.threat=clamp(G.threat+1.2,0,12);
      flashCell(goalIdx,'#ffd1d1');
      logF(`=LEAK("${BUGS[b.type].name}", ${ref(goalIdx)})`,
           `${BUGS[b.type].name} 침투 성공! 잔여 생명 ${Math.max(0,G.lives)}`, 'bug');
      dead.push(bi);
      continue;
    }
    const newCell = path[idx];
    if (newCell!==b.cell){ b.prevCell=b.cell; b.cell=newCell; }
  }
  for (let k=dead.length-1;k>=0;k--) G.bugs.splice(dead[k],1);
  if (G.lives<=0) gameOver();
}

// =====================================================================
// TOWERS — placement (defender AI) + targeting/firing
// =====================================================================
function dist(i,j){const[a,b]=rc(i),[c,d]=rc(j);return Math.hypot(a-c,b-d);}

function placeTower(idx, type){
  const T=TOWERS[type];
  if (cells[idx].kind!=='empty') return false;
  if (!buildable.has(idx)) return false;
  cells[idx].tower = {type, level:1, cd:0, kills:0, fired:0};
  cells[idx].kind='wall';
  G.towers.push(idx);
  return true;
}
function upgradeTower(idx){
  const t=cells[idx].tower; if(!t)return false;
  if (t.level>=3) return false;
  t.level++;
  return true;
}
function towerStats(idx){
  const t=cells[idx].tower, T=TOWERS[t.type];
  return {
    dmg: Math.round(T.dmg*(1+ (t.level-1)*0.6)),
    rng: T.rng + (t.level-1)*0.35,
    rate: Math.max(8, T.rate - (t.level-1)*6),
    splash: T.splash, slow:T.slow||0,
  };
}
function upgCost(idx){const t=cells[idx].tower;return Math.round(TOWERS[t.type].cost*0.8*t.level);}

function fireTowers(){
  for (const ti of G.towers){
    const t=cells[ti].tower; if(!t)continue;
    if (t.cd>0){ t.cd--; continue; }
    const st=towerStats(ti);
    // target the bug furthest along path within range
    let best=null, bestPos=-1;
    for (const b of G.bugs){
      if (b.hp<=0) continue;
      if (dist(ti, b.cell) <= st.rng+0.05){
        if (b.pos>bestPos){ bestPos=b.pos; best=b; }
      }
    }
    if (best){
      t.cd=st.rate; t.fired++;
      sprayFx(ti, best.cell, t.type);
      damageBug(best, st.dmg, ti);
      if (TOWERS[t.type].slow) best.slow=Math.max(best.slow, 18);
      if (st.splash>0){
        for (const b2 of G.bugs){
          if (b2!==best && b2.hp>0 && dist(best.cell,b2.cell)<=st.splash){
            damageBug(b2, Math.round(st.dmg*0.6), ti);
          }
        }
      }
    }
  }
}
function damageBug(b, dmg, towerIdx){
  const real = Math.max(1, dmg - b.armor);
  b.hp -= real;
  flashCell(b.cell,'#fff3b0');
  if (b.hp<=0){
    b.hp=0;
    G.money += b.val;
    G.killed++;
    const t=cells[towerIdx]?cells[towerIdx].tower:null;
    if (t){ t.kills++; }
    G.kills = G.kills||[];
    pushKill(b, towerIdx);
    // defender AI gains confidence -> strategy memory penalize bug
    stratScore[G.lastStrategy]=(stratScore[G.lastStrategy]||0)-0.25;
  }
}
const killLog=[];
function pushKill(b, towerIdx){
  const t=cells[towerIdx]?cells[towerIdx].tower:null;
  killLog.unshift({
    wave:G.wave, bug:BUGS[b.type].name, cell:ref(b.cell),
    tower: t?TOWERS[t.type].name:'-', tcell: ref(towerIdx),
    val:b.val
  });
  if (killLog.length>200) killLog.pop();
  if (G.view==='kills') renderLogView();
}

// =====================================================================
// DEFENDER AI — spends money to build & upgrade, judging coverage
// =====================================================================
let aiCooldown=0;
function defenderAI(){
  if (aiCooldown>0){ aiCooldown--; return; }
  // build fast while the path still has uncovered gaps; relax once it's defended
  aiCooldown = pathFullyCovered() ? 10 : 3;

  // urgency rises with low life / active threat / big incoming wave
  const lifeP = 1 - G.lives/G.maxLives;
  const urgency = lifeP*1.5 + G.threat*0.12 + (G.bugs.length>10?0.4:0);

  // 1) consider upgrading an existing high-value tower if cheap & it has kills
  if (G.towers.length>0 && Math.random()<0.4){
    let cand=-1, bestK=-1;
    for (const ti of G.towers){
      const t=cells[ti].tower;
      if (t.level>=3) continue;
      const score = t.kills + t.fired*0.05;
      if (score>bestK){bestK=score;cand=ti;}
    }
    if (cand>=0){
      const cost=upgCost(cand);
      if (G.money>=cost && (Math.random()<0.5+urgency*0.3)){
        G.money-=cost; upgradeTower(cand);
        const t=cells[cand].tower;
        logF(`=UPGRADE(${ref(cand)}, Lv${t.level}, ₩${cost})`,
             `방제반: ${ref(cand)} ${TOWERS[t.type].name} → Lv${t.level} 강화`, 'guard');
        flashCell(cand,'#cdeccd');
        return;
      }
    }
  }

  // 2) build a new tower. Choose type & location by coverage heuristics.
  // pick affordable type weighted by situation
  const affordable = TOWER_KEYS.filter(k=>TOWERS[k].cost<=G.money);
  if (!affordable.length) return;
  // strategy: if many tanky bugs -> zapper; many fast -> trap/spray; crowd -> fogger
  const crowd = G.bugs.length;
  const avgHp = crowd? G.bugs.reduce((s,b)=>s+b.maxhp,0)/crowd : 30;
  let want;
  if (crowd>=8 && affordable.includes('fogger')) want='fogger';
  else if (avgHp>55 && affordable.includes('zapper')) want='zapper';
  else if (G.bugs.some(b=>b.spd>.06) && affordable.includes('trap') && Math.random()<.5) want='trap';
  else want = pick(affordable);
  // sometimes economize early
  if (G.money<140 && affordable.includes('spray') && Math.random()<.6) want='spray';

  const spot = bestBuildSpot(want);
  if (spot>=0 && G.money>=TOWERS[want].cost){
    G.money -= TOWERS[want].cost;
    placeTower(spot, want);
    buildable = buildableSet(); // recompute (a cell became a wall)
    repaintBuildable();
    logF(`=BUILD("${TOWERS[want].name}", ${ref(spot)}, ₩${TOWERS[want].cost})`,
         `방제반: ${ref(spot)}에 ${TOWERS[want].name} 설치`, 'guard');
    flashCell(spot,'#cdeccd');
    paintCell(spot);
  }
}

// choose build spot. Defender AI fills the route FROM the entry toward the goal,
// always plugging the earliest stretch of path that no tower yet covers.
function bestBuildSpot(type){
  const T=TOWERS[type];
  // 1) compute, for every path position, how many towers cover it now
  const covered = new Array(path.length).fill(0);
  for (const ti of G.towers){
    const t=cells[ti].tower; if(!t)continue;
    const rng=towerStats(ti).rng+0.05;
    for (let pi=0; pi<path.length; pi++){
      if (dist(ti, path[pi])<=rng) covered[pi]++;
    }
  }
  // earliest uncovered path position (the gap the bugs will exploit first)
  let firstGap=-1;
  for (let pi=0; pi<path.length; pi++){ if(covered[pi]===0){firstGap=pi;break;} }

  let best=-1, bestScore=-1e9;
  const cand=[...buildable];
  shuffle(cand);
  const limit=Math.min(cand.length, 90);
  for (let k=0;k<limit;k++){
    const idx=cand[k];
    if (cells[idx].kind!=='empty') continue;
    let newCover=0, reCover=0, earliest=1e9;
    for (let pi=0; pi<path.length; pi++){
      if (dist(idx, path[pi])<=T.rng+0.05){
        if (covered[pi]===0){ newCover++; if(pi<earliest) earliest=pi; }
        else reCover++;
      }
    }
    if (newCover===0 && firstGap>=0) continue; // must help close a gap if one exists
    // strong reward for plugging the earliest gap; light reward for overlap (defense in depth)
    const gapBonus = (firstGap>=0 && earliest<1e9)
        ? (1 - (earliest-firstGap)/Math.max(1,path.length)) * 6
        : 0;
    // reactive: cover cells where bugs currently crowd
    let near=0; for(const b of G.bugs){ if(dist(idx,b.cell)<=T.rng+0.05){near++;} }
    const score = newCover*2.4 + gapBonus*3 + reCover*0.35 + near*0.7 + Math.random()*0.5;
    if (score>bestScore){bestScore=score;best=idx;}
  }
  // fallback: if everything is covered, just reinforce near the earliest path
  if (best<0){
    for (const idx of cand){
      if (cells[idx].kind!=='empty') continue;
      let cover=0; for(const p of path){ if(dist(idx,p)<=T.rng+0.05)cover++; }
      if (cover>0){ best=idx; break; }
    }
  }
  return best;
}
// how many towers currently cover path cell p
function coverageAt(p){
  let n=0;
  for (const ti of G.towers){
    const t=cells[ti].tower; if(!t)continue;
    if (dist(ti,p)<=towerStats(ti).rng+0.05) n++;
  }
  return n;
}
// is every path cell covered by at least one tower?
function pathFullyCovered(){
  for (const p of path){ if (coverageAt(p)===0) return false; }
  return true;
}
// seed initial defenses so the opening waves aren't a free run for the bugs
function seedDefense(){
  const seeds = [['spray',0], ['spray',0]];
  for (const [type] of seeds){
    const spot = bestBuildSpot(type);
    if (spot>=0){
      placeTower(spot, type);
      buildable=buildableSet();
    }
  }
}

// =====================================================================
// RENDER
// =====================================================================
const KIND_BG = {
  empty:'', path:'#fdf4e3', entry:'#ffe0c2', goal:'#ffd6d6', wall:'',
};
function paintCell(i){
  const c=cells[i], el=cellEls[i];
  let bg='', tx='', col='#333', fs='';
  if (c.kind==='entry'){ bg='#ffd9a8'; tx='⛳'; col='#b5651d'; }
  else if (c.kind==='goal'){ bg='#ffd0d0'; tx='🍽'; col='#b30000'; }
  else if (c.kind==='path'){ bg='#fbe6c8'; tx='·'; col='#d8b878'; }
  else if (c.kind==='wall' && c.tower){
    const T=TOWERS[c.tower.type];
    bg=hexA(T.color, .16+c.tower.level*0.14); tx=T.glyph; col=T.color;
    fs= c.tower.level>=2?'700':'';
  } else if (buildable.has(i)){
    bg='#f6fbf7';
  }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=fs;
  el.textContent=tx;
  // remove any leftover overlays except range
  for (const ov of [...el.querySelectorAll('.hp,.spray')]) ov.remove();
}
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}

// bugs are drawn as an overlay each frame. We diff this frame's occupied cells
// against last frame's and repaint any cell a bug just LEFT back to its base.
let bugCells=new Set();
function renderBugs(){
  // 1) compute the cells occupied this frame (a cell may hold several bugs;
  //    draw the most-advanced one)
  const nowCells=new Set();
  const top=new Map();          // cell -> bug with greatest pos
  for (const b of G.bugs){
    const i=b.cell; if(i<0||i>=N())continue;
    if (cells[i].kind==='wall') continue;
    nowCells.add(i);
    const cur=top.get(i);
    if (!cur || b.pos>cur.pos) top.set(i,b);
  }
  // 2) repaint cells that had a bug last frame but not now
  for (const i of bugCells){ if(!nowCells.has(i)) paintCell(i); }
  // 3) draw current bugs
  for (const [i,b] of top){
    const el=cellEls[i];
    el.textContent=b.glyph;
    el.style.color=b.color;
    el.style.fontWeight= b.boss?'700':'';
    el.style.background = b.boss? '#ffe9b0' : (cells[i].kind==='goal'?'#ffd0d0':'#fbe6c8');
    if (b.slow>0) el.style.background='#e9e2ff';
    let hpEl=el.querySelector('.hp');
    if(!hpEl){hpEl=document.createElement('div');hpEl.className='hp';el.appendChild(hpEl);}
    const w=clamp(b.hp/b.maxhp,0,1)*(CW-3);
    hpEl.style.width=w+'px';
    hpEl.style.background = b.hp/b.maxhp>0.5?'#2e9e4f':(b.hp/b.maxhp>0.25?'#e8a200':'#d62828');
  }
  bugCells=nowCells;
}

function flashCell(i,color){
  const el=cellEls[i]; if(!el)return;
  el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
}
function sprayFx(from,to,type){
  const el=cellEls[to]; if(!el)return;
  const s=document.createElement('div');s.className='spray';
  s.textContent= type==='zapper'?'⚡':type==='fogger'?'❉':type==='trap'?'░':'✷';
  el.appendChild(s);
  setTimeout(()=>s.remove(),300);
}

// range ring on select
function showRange(idx){
  clearRange();
  const t=cells[idx].tower; if(!t)return;
  const st=towerStats(idx);
  for (let i=0;i<N();i++){
    if (dist(idx,i)<=st.rng+0.05){
      const r=document.createElement('div');r.className='rng';r.dataset.rng='1';
      cellEls[i].appendChild(r);
    }
  }
}
function clearRange(){ document.querySelectorAll('.rng').forEach(e=>e.remove()); }

function repaintBuildable(){
  // light-tint buildable empties
  for (let i=0;i<N();i++){
    if (cells[i].kind==='empty'){ paintCell(i); }
  }
}

// =====================================================================
// GAME LOOP
// =====================================================================
function gameOver(){
  G.over=true;
  logF(`=GAMEOVER("주방 함락", 웨이브=${G.wave})`,
       `주방이 곤충에게 함락되었습니다. ${G.wave}웨이브까지 버팀. (자동 재시작)`, 'bug');
  ttl.textContent='방제작전.xlsx - Excel (주방 함락!)';
  // auto restart after a beat so spectate keeps going
  setTimeout(()=>{ if(G.over) restart(); }, 2600);
}
function restart(){
  G.over=false;
  G.wave=0; G.money=260; G.lives=G.maxLives; G.bugs=[]; G.pendingSpawns=[];
  G.killed=0; G.leaked=0; G.totalSpawn=0; G.difficulty=1; G.threat=0; G.lastStrategy=null;
  killLog.length=0; G.log.length=0;
  for(const k in stratScore)stratScore[k]=0;
  // clear towers
  for (const ti of [...G.towers]){ cells[ti].tower=null; cells[ti].kind='empty'; }
  G.towers=[];
  genPath(); initCells();
  buildable=buildableSet();
  seedDefense();
  for (let i=0;i<N();i++) paintCell(i);
  G.interWave=true; G.betweenT=110;
  ttl.textContent='방제작전.xlsx - Excel';
  logF(`=RESET() ; =NEWMAP(${ref(entryIdx)}→${ref(goalIdx)})`,
       `새 작전 개시 — 침입로 ${ref(entryIdx)} → 주방 ${ref(goalIdx)}`, 'guard');
}

let acc=0;
function step(){
  if (G.over || G.paused) return;
  G.tick++;

  // between-wave countdown -> plan next wave
  if (G.interWave){
    G.betweenT--;
    // defender uses lull to build up (small passive R&D budget each step)
    if (G.tick%6===0) G.money += 1;
    defenderAI();
    if (G.betweenT<=0 && G.bugs.length===0){
      planWave(); G.interWave=false;
    }
  } else {
    // release scheduled spawns
    if (G.pendingSpawns.length){
      const head=G.pendingSpawns[0];
      head.t -= 1;
      if (head.t<=0){ spawnBug(head.type); G.pendingSpawns.shift(); }
    }
    moveBugs();
    fireTowers();
    defenderAI();
    G.threat=Math.max(0,G.threat-0.03);
    // wave end?
    if (G.pendingSpawns.length===0 && G.bugs.length===0 && !G.over){
      G.interWave=true; G.betweenT=ri(50,90);
      // adapt difficulty memory at wave end
      const bonus = 70 + G.wave*16 + Math.max(0,G.lives)*2;
      G.money += bonus;
      // "seal the breach": recover some defense line each cleared wave (more when
      // hurt). Lives can ebb AND flow -> long oscillating fight instead of a slide.
      let regen=0;
      if (G.lives>0 && G.lives<G.maxLives){
        regen = 1 + (G.lives < G.maxLives*0.5 ? 2 : 0);
        G.lives = Math.min(G.maxLives, G.lives+regen);
      }
      logF(`=WAVE.CLEAR(${G.wave}, 생존=${Math.max(0,G.lives)}, +₩${bonus}${regen?`, 방어선+${regen}`:''})`,
           `${G.wave}웨이브 종료. 방어 보너스 ₩${bonus}${regen?` · 방어선 +${regen} 복구`:''}`, 'guard');
    }
  }
}

let drawAcc=0;
function frame(ts){
  requestAnimationFrame(frame);
  if (!frame.last) frame.last=ts;
  const dt=ts-frame.last; frame.last=ts;
  if (G.paused||G.over){ if(G.over)renderStatus(); requestAnimationFrame; }
  acc += dt*G.speed;
  const stepMs=55;          // base sim step
  let guard=0;
  while (acc>=stepMs && guard<20){ step(); acc-=stepMs; guard++; }
  renderBugs();
  // periodic UI refresh
  drawAcc+=dt;
  if (drawAcc>120){ drawAcc=0; renderStatus(); if(G.view==='battle')renderPanel(); ttlTick(); }
}
let ttlN=0;
function ttlTick(){
  ttlN++;
  if (!G.over && ttlN%4===0) ttl.textContent=`방제작전.xlsx - Excel (${G.wave}웨이브)`;
}

// =====================================================================
// INTERACTION (optional human intervention)
// =====================================================================
sheet.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t)return;
  const i=+t.dataset.i;
  if (G.selected>=0) cellEls[G.selected].classList.remove('sel');
  G.selected=i; t.classList.add('sel');
  namebox.textContent=ref(i);
  clearRange();

  if (G.buildMode && buildable.has(i) && cells[i].kind==='empty'){
    const type=G.buildSel;
    if (G.money>=TOWERS[type].cost){
      G.money-=TOWERS[type].cost;
      placeTower(i,type);
      buildable=buildableSet(); repaintBuildable(); paintCell(i);
      logF(`=BUILD.MANUAL("${TOWERS[type].name}", ${ref(i)}, ₩${TOWERS[type].cost})`,
           `관전자: ${ref(i)}에 ${TOWERS[type].name} 직접 설치`, 'guard');
      flashCell(i,'#cdeccd');
    } else {
      fmla.textContent=`=ERROR("자금 부족: ${TOWERS[type].name} ₩${TOWERS[type].cost} 필요")`;
    }
    return;
  }
  // inspect
  const c=cells[i];
  if (c.kind==='wall' && c.tower){
    const T=TOWERS[c.tower.type], st=towerStats(i);
    fmla.textContent=`=TOWER("${T.name}", Lv${c.tower.level}, DMG=${st.dmg}, RNG=${st.rng.toFixed(1)}, 격파=${c.tower.kills})`;
    showRange(i);
  } else if (c.kind==='path'||c.kind==='entry'||c.kind==='goal'){
    const onit=G.bugs.find(b=>b.cell===i);
    if (onit) fmla.textContent=`=BUG("${BUGS[onit.type].name}", HP=${onit.hp}/${onit.maxhp}, ${ref(i)})`;
    else fmla.textContent=`=PATH(${ref(i)}, 침입로)`;
  } else if (buildable.has(i)){
    fmla.textContent=`=PLOT(${ref(i)}, 설치가능) ${G.buildMode?'— 클릭하여 설치':''}`;
  } else {
    fmla.textContent=`=CELL(${ref(i)}, 빈칸)`;
  }
});

// column/row header highlight on hover-ish select (cosmetic)
sheet.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t)return;
  const [c,r]=rc(+t.dataset.i);
  document.querySelectorAll('.hd.hi').forEach(h=>h.classList.remove('hi'));
  const colH=sheet.children[1+c]; if(colH)colH.classList.add('hi');
});

// ---- ribbon buttons ----
$('#bPause').addEventListener('click', ()=>{
  G.paused=!G.paused;
  $('#bPause').textContent = G.paused?'▶ 재생':'⏸ 일시정지';
  $('#bPause').classList.toggle('on', G.paused);
  renderStatus();
});
document.querySelectorAll('[data-sp]').forEach(b=>{
  b.addEventListener('click', ()=>{
    G.speed=parseFloat(b.dataset.sp);
    document.querySelectorAll('[data-sp]').forEach(x=>x.classList.toggle('on',x===b));
  });
});
$('#bSummon').addEventListener('click', ()=>{
  if (G.interWave){ G.betweenT=0; if(G.bugs.length===0){planWave();G.interWave=false;} }
  else { /* compress current pending cadence */ for(const p of G.pendingSpawns)p.t=Math.min(p.t,3); }
  logF(`=FORCE.WAVE(${G.wave+ (G.interWave?1:0)})`,`관전자: 웨이브 즉시 소환`, 'bug');
});
$('#bBuild').addEventListener('click', ()=>{
  G.buildMode=!G.buildMode;
  $('#bBuild').classList.toggle('on', G.buildMode);
  $('#bBuild').textContent = G.buildMode?`＋ ${TOWERS[G.buildSel].name} 설치중`:'＋ 타워 설치';
  if (G.buildMode){
    // cycle build selection on repeated clicks
    fmla.textContent=`=BUILD.MODE("${TOWERS[G.buildSel].name}", ₩${TOWERS[G.buildSel].cost}) — 설치가능 칸 클릭`;
  } else clearRange();
});
// right-click / shift cycles tower type in build mode
$('#bBuild').addEventListener('contextmenu', e=>{
  e.preventDefault();
  const idx=(TOWER_KEYS.indexOf(G.buildSel)+1)%TOWER_KEYS.length;
  G.buildSel=TOWER_KEYS[idx];
  $('#bBuild').textContent = G.buildMode?`＋ ${TOWERS[G.buildSel].name} 설치중`:'＋ 타워 설치';
  fmla.textContent=`=SELECT.TOWER("${TOWERS[G.buildSel].name}", ₩${TOWERS[G.buildSel].cost})`;
});
$('#bPanel').addEventListener('click', ()=>{
  G.panelOn=!G.panelOn;
  $('#bPanel').classList.toggle('on', G.panelOn);
  renderPanel();
});

// ---- sheet tabs ----
document.querySelectorAll('#tabs div').forEach(d=>{
  d.addEventListener('click', ()=>setView(d.dataset.view));
});

// keyboard
addEventListener('keydown', e=>{
  if (e.code==='Space'){ e.preventDefault(); $('#bPause').click(); }
  else if (e.key==='1'){G.speed=1;syncSpeed();}
  else if (e.key==='2'){G.speed=2;syncSpeed();}
  else if (e.key==='4'){G.speed=4;syncSpeed();}
  else if (e.key==='b'||e.key==='B'){$('#bBuild').click();}
  else if (e.key==='w'||e.key==='W'){$('#bSummon').click();}
});
function syncSpeed(){document.querySelectorAll('[data-sp]').forEach(x=>x.classList.toggle('on',parseFloat(x.dataset.sp)===G.speed));}

// =====================================================================
// BOOT
// =====================================================================
function boot(){
  buildSheet();
  genPath();
  initCells();
  buildable=buildableSet();
  seedDefense();
  for (let i=0;i<N();i++) paintCell(i);
  logF(`=SIM.TOWERDEFENSE($A$1:$${colName(COLS-1)}$${ROWS}, "주방 방어")`,
       `방제작전 개시 — 침입로 ${ref(entryIdx)} → 주방 ${ref(goalIdx)}. 양측 AI 자동 교전(관전).`, 'guard');
  G.interWave=true; G.betweenT=110;
  renderStatus(); renderPanel();
  requestAnimationFrame(frame);
}
boot();

})();
</script>
