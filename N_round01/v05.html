<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>방어작전.xlsx - Excel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  body{display:flex;flex-direction:column}
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar span{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:18px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px}
  #namebox{width:64px;min-width:64px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333}
  #fx{width:28px;min-width:28px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toolbar{height:30px;background:#faf9f8;display:flex;align-items:center;gap:6px;
    padding:0 8px;border-bottom:1px solid #e1e1e1;font-size:11.5px;overflow-x:auto}
  #toolbar button{font:inherit;font-size:11px;border:1px solid #c8c8c8;background:#fff;
    border-radius:3px;padding:3px 8px;cursor:pointer;color:#333;white-space:nowrap}
  #toolbar button:hover{background:#eef6f0;border-color:#107c41}
  #toolbar button.on{background:#107c41;color:#fff;border-color:#0b5e31}
  #toolbar .grp{display:flex;gap:3px;align-items:center}
  #toolbar .lab{color:#888;margin:0 2px}
  #toolbar .sepv{width:1px;height:18px;background:#ddd;margin:0 4px}
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1 1 auto;min-height:0}
  #sheet{display:grid;background:#fff;position:absolute;top:0;left:0}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:10px}
  .cell{border-right:1px solid #e3e3e3;border-bottom:1px solid #e3e3e3;
    display:flex;align-items:center;justify-content:center;font-size:12px;
    overflow:hidden;cursor:cell;position:relative;line-height:1}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:3}
  .cell.buildable:hover{outline:2px dashed #107c41;outline-offset:-2px;z-index:3}
  .hp{position:absolute;left:1px;right:1px;bottom:0;height:2px;background:#c0392b;transform-origin:left;z-index:2}
  .rng{position:absolute;border:1px solid rgba(16,124,65,.4);background:rgba(16,124,65,.05);
    border-radius:50%;pointer-events:none;z-index:1;display:none}
  @keyframes hit{0%{background:#ffd0d0}100%{background:transparent}}
  .cell.hit{animation:hit .25s}
  @keyframes muzz{0%,100%{box-shadow:none}50%{box-shadow:inset 0 0 6px 1px rgba(255,200,0,.8)}}
  .cell.fire{animation:muzz .18s}
  #panel{position:absolute;top:8px;right:10px;background:#fffce6;border:1px solid #d8c66a;
    box-shadow:2px 3px 8px rgba(0,0,0,.18);padding:8px 11px;font-size:11px;z-index:6;
    min-width:172px;max-width:200px;line-height:1.65}
  #panel h4{margin:0 0 3px;font-size:11px;color:#7a6a1f}
  #panel .bar{height:7px;background:#e2dab0;border-radius:3px;overflow:hidden;margin:2px 0 5px}
  #panel .bar > i{display:block;height:100%}
  #panel .sw{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:2px;vertical-align:-1px}
  #panel .mut{color:#9a8b50;font-size:10px}
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 9px;opacity:.5}
  #tabs{height:25px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:24px;
    border-top:1px solid #d4d4d4;font-size:11.5px}
  #tabs div{padding:3px 13px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  /* 로그 시트 (전황/격파기록) */
  #logsheet{position:absolute;inset:0;background:#fff;overflow:auto;display:none;z-index:4}
  #logsheet table{border-collapse:collapse;width:100%;font-size:11.5px}
  #logsheet td,#logsheet th{border:1px solid #e3e3e3;padding:2px 6px;text-align:left;white-space:nowrap}
  #logsheet th{background:#f5f5f5;color:#555;font-weight:600;position:sticky;top:0;font-size:10px}
  #logsheet td.r{color:#555;width:42px;text-align:center;background:#f5f5f5;font-size:10px}
  #logsheet td.f{font-family:Consolas,Menlo,monospace;color:#107c41;font-size:11px}
  @media (max-width:560px){
    #panel{font-size:10px;min-width:130px;max-width:150px;padding:6px 8px;top:4px;right:6px}
    #menubar{gap:9px}
    #toolbar{gap:4px}
  }
</style>
</head>
<body>
<div id="titlebar">
  <div class="dot" style="background:#ff5f57"></div>
  <div class="dot" style="background:#febc2e"></div>
  <div class="dot" style="background:#28c840"></div>
  <span id="titletext">방어작전.xlsx - Excel</span>
</div>
<div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
<div id="fbar">
  <div id="namebox">A1</div>
  <div id="fx">fx</div>
  <div id="formula"></div>
</div>
<div id="toolbar">
  <div class="grp">
    <button id="btnPause" title="일시정지/재개">⏸ 일시정지</button>
    <span class="sepv"></span>
    <span class="lab">속도</span>
    <button class="spd" data-s="1">1×</button>
    <button class="spd on" data-s="2">2×</button>
    <button class="spd" data-s="4">4×</button>
  </div>
  <span class="sepv"></span>
  <div class="grp">
    <span class="lab">개입</span>
    <button id="btnWave" title="다음 군단을 즉시 소환">⚑ 웨이브 소환</button>
    <button id="btnBuild" title="셀을 골라 직접 타워 설치">🛠 타워 설치</button>
  </div>
  <span class="sepv"></span>
  <span id="modehint" class="lab">관전 모드 — 양측 AI 자동 교전 중</span>
</div>
<div id="sheetwrap">
  <div id="sheet"></div>
  <div id="logsheet"></div>
  <div id="panel"></div>
</div>
<div id="tabs">
  <div class="on" data-v="board">전장</div>
  <div data-v="war">전황</div>
  <div data-v="dead" id="tab-dead">격파기록 (0)</div>
</div>
<div id="statusbar"></div>

<script>
(() => {
"use strict";
const sheet = document.getElementById('sheet');
const sheetwrap = document.getElementById('sheetwrap');
const logsheet = document.getElementById('logsheet');
const fmla = document.getElementById('formula');
const namebox = document.getElementById('namebox');
const statusbar = document.getElementById('statusbar');
const panel = document.getElementById('panel');
const titletext = document.getElementById('titletext');

// ---------- 그리드 차원 (반응형) ----------
let COLS, ROWS, CW, CH, HDW = 40, HDH = 18, N;
function computeDims() {
  const W = sheetwrap.clientWidth || innerWidth;
  const H = sheetwrap.clientHeight || (innerHeight - 200);
  const narrow = W < 560;
  CW = narrow ? 26 : 34;
  CH = narrow ? 22 : 24;
  COLS = Math.max(14, Math.min(34, Math.floor((W - HDW) / CW)));
  ROWS = Math.max(11, Math.min(22, Math.floor((H - HDH) / CH)));
  // 컬럼 폭을 남는 공간에 맞춰 살짝 늘려 빈틈 제거
  CW = Math.floor((W - HDW) / COLS);
  CH = Math.floor((H - HDH) / ROWS);
  N = COLS * ROWS;
}

function colName(n){ let s=''; n++; while(n>0){const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26|0;} return s; }
const idx = (x,y) => y*COLS + x;
const xOf = i => i % COLS, yOf = i => i / COLS | 0;
function ref(i){ return colName(xOf(i)) + (yOf(i)+1); }

// ---------- 경로 생성 (serpentine + 절차생성 흔들림) ----------
let path = [];      // 경로 셀 인덱스 (순서대로)
let pathSet = null; // Set
let spawnCell, baseCell;
function buildPath() {
  // 가로 레인(serpentine). 각 레인 사이 수직 이음. 레인 행은 균등 간격.
  path = [];
  const lanes = Math.max(3, Math.min(6, Math.floor(ROWS/3)));
  const laneRows = [];
  for (let l = 0; l < lanes; l++) laneRows.push(Math.round((l + 0.5) * (ROWS-1) / lanes));
  let cur = { x: 0, y: laneRows[0] };
  path.push(idx(cur.x, cur.y));
  for (let l = 0; l < lanes; l++) {
    const y = laneRows[l];
    const goRight = (l % 2 === 0);
    // 현재 y로 수직 이동
    while (cur.y !== y) { cur.y += (y > cur.y) ? 1 : -1; path.push(idx(cur.x, cur.y)); }
    // 가로 주행
    const endX = goRight ? COLS-1 : 0;
    while (cur.x !== endX) { cur.x += goRight ? 1 : -1; path.push(idx(cur.x, cur.y)); }
  }
  // 마지막 레인 끝에서 기지까지 (오른쪽 가장자리에 기지)
  const lastY = laneRows[lanes-1];
  if (cur.x !== COLS-1) { while (cur.x < COLS-1){ cur.x++; path.push(idx(cur.x,cur.y)); } }
  spawnCell = path[0];
  baseCell = path[path.length-1];
  pathSet = new Set(path);
  // 경로 진행 인덱스 맵
  pathIndexOf = new Map();
  path.forEach((c,k)=>{ if(!pathIndexOf.has(c)) pathIndexOf.set(c,k); });
}
let pathIndexOf;

// ---------- 게임 상태 ----------
let cells;            // {tower:null|obj}
let cellEls;          // DOM
let towers = [];      // {i, x,y, kind, level, cd, kills}
let mobs = [];        // {id, p(경로 진행 실수), hp, max, kind, speed, slow, bounty, value}
let projFx = [];      // 잠깐 켜지는 셀 인덱스 (muzzle)
let mobId = 1;

let defGold = 110;       // 디펜더 자금
let baseHP = 100, baseMax = 100;
let wave = 0;
let mobBudget = 14;      // 몬스터 AI 예산 (절차/적응형)
let leaked = 0, totalKills = 0;
let lastFormula = '=DEFENSE.SIM($A$1, "매크로 군단 침공")';

// 적응형 압박 지표
let pressureEMA = 0.5;   // 0=디펜더 압승, 1=기지 위기
const obituaries = [];   // 격파/유출 기록 (행)
const warLog = [];       // 전황 로그 (행: {y, msg, formula})

// 타워 종류
const TOWER = {
  gun:   { name:'사수',   glyph:'⌖', col:'#2563eb', cost:20, range:1.7, dmg:6,  rate:9,  slow:0,   up:16, label:'SUM' },
  cannon:{ name:'포대',   glyph:'◎', col:'#b45309', cost:44, range:2.0, dmg:20, rate:30, splash:1.0, up:32, label:'POWER' },
  frost: { name:'빙결탑', glyph:'❄', col:'#0d9488', cost:34, range:1.8, dmg:3,  rate:16, slow:0.45,up:26, label:'FREEZE' },
};
const TOWER_KEYS = ['gun','cannon','frost'];

// 몬스터 종류
// speed = 경로 칸/틱. 평균 경로 길이를 ~18~22초에 통과하도록 튜닝.
const MOB = {
  grunt:  { name:'잡졸봇',   glyph:'▲', col:'#dc2626', hp:20,  speed:0.30, bounty:5,  cost:3 },
  runner: { name:'고속봇',   glyph:'➤', col:'#9333ea', hp:13,  speed:0.58, bounty:6,  cost:4 },
  tank:   { name:'중장갑봇', glyph:'■', col:'#4b5563', hp:90,  speed:0.19, bounty:15, cost:9 },
  swarm:  { name:'벌떼봇',   glyph:'•', col:'#be185d', hp:8,   speed:0.42, bounty:3,  cost:1.5 },
  boss:   { name:'우두머리', glyph:'◆', col:'#7a0000', hp:420, speed:0.15, bounty:55, cost:34 },
};

// ---------- DOM 구성 ----------
function buildDOM() {
  computeDims();
  buildPath();
  sheet.style.gridTemplateColumns = `${HDW}px repeat(${COLS}, ${CW}px)`;
  sheet.style.gridTemplateRows = `${HDH}px repeat(${ROWS}, ${CH}px)`;
  sheet.innerHTML = '';
  cellEls = new Array(N);
  cells = new Array(N);
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd'; frag.appendChild(corner);
  for (let c=0;c<COLS;c++){ const h=document.createElement('div'); h.className='hd'; h.textContent=colName(c); frag.appendChild(h); }
  for (let r=0;r<ROWS;r++){
    const h=document.createElement('div'); h.className='hd'; h.textContent=r+1; frag.appendChild(h);
    for (let c=0;c<COLS;c++){
      const i=idx(c,r);
      const d=document.createElement('div'); d.className='cell'; d.dataset.i=i;
      cells[i]={tower:null};
      cellEls[i]=d; frag.appendChild(d);
    }
  }
  sheet.appendChild(frag);
  // 정적 셀(경로/기지/스폰/지형) 칠하기
  for (let i=0;i<N;i++) paintStatic(i);
}

// ---------- 셀 렌더 ----------
function paintStatic(i){
  const el = cellEls[i];
  el.innerHTML='';
  el.style.fontWeight=''; el.style.color=''; el.style.background='';
  el.classList.remove('buildable');
  if (i === spawnCell){ el.style.background='#fde2e2'; el.textContent='出'; el.style.color='#c0392b'; el.style.fontWeight='700'; return; }
  if (i === baseCell){ el.style.background='#dbeafe'; el.textContent='★'; el.style.color='#1d4ed8'; el.style.fontWeight='700'; return; }
  if (pathSet.has(i)){ el.style.background='#f3f0e6'; el.style.color='#cdbf9a'; el.textContent='·'; return; }
  // 빌드 가능 (지형감: 경로 인접은 약한 잔디톤)
  el.classList.add('buildable');
  let near=false;
  const x=xOf(i),y=yOf(i);
  if ((x>0&&pathSet.has(i-1))||(x<COLS-1&&pathSet.has(i+1))||(y>0&&pathSet.has(i-COLS))||(y<ROWS-1&&pathSet.has(i+COLS))) near=true;
  el.style.background = near ? '#eef4e8' : '#ffffff';
}

function paintTowerCell(i){
  const el = cellEls[i];
  const t = cells[i].tower;
  el.innerHTML='';
  if (!t){ paintStatic(i); return; }
  const def = TOWER[t.kind];
  el.style.background = hexA(def.col, 0.14 + t.level*0.12);
  el.style.color = def.col; el.style.fontWeight='700';
  el.textContent = def.glyph;
  // 레벨 표시 (작은 첨자)
  if (t.level>1){
    const lv=document.createElement('span');
    lv.textContent=t.level;
    lv.style.cssText='position:absolute;right:1px;bottom:0;font-size:8px;font-weight:700;color:'+def.col+';opacity:.85';
    el.appendChild(lv);
  }
}

function hexA(hex,a){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }

// ---------- 몬스터 레이어: 경로 셀 위에 글리프 ----------
// 몬스터는 경로 셀 텍스트를 덮어쓴다. 매 프레임 경로 셀을 다시 칠한다.
function renderMobs(){
  // 경로 셀 리셋 (기지/스폰 제외 텍스트만)
  for (const i of path){
    if (i===baseCell) continue;
    const el=cellEls[i];
    if (i===spawnCell){ el.textContent='出'; }
    else { el.style.background='#f3f0e6'; el.style.color='#cdbf9a'; el.textContent='·'; el.style.fontWeight=''; }
    // 남아있던 hp바 제거
    const old=el.querySelector('.hp'); if(old) old.remove();
  }
  // 셀별 최상위 몹 기록 (여러 마리면 가장 진행 빠른 것 표시 + 카운트)
  const occ = new Map(); // cellIndex -> {mob, count}
  for (const m of mobs){
    const k = Math.max(0, Math.min(path.length-1, Math.round(m.p)));
    const ci = path[k];
    if (ci===baseCell) continue;
    const cur = occ.get(ci);
    if (!cur) occ.set(ci, {mob:m, count:1});
    else { cur.count++; if (m.p > cur.mob.p) cur.mob = m; }
  }
  for (const [ci, info] of occ){
    const el = cellEls[ci];
    const m = info.mob, def = MOB[m.kind];
    el.style.background = m.slow>0 ? '#d6eef0' : hexA(def.col, 0.18);
    el.style.color = def.col; el.style.fontWeight='700';
    el.textContent = info.count>1 ? def.glyph : def.glyph;
    if (info.count>1){
      const c=document.createElement('span');
      c.textContent='×'+info.count;
      c.style.cssText='position:absolute;left:1px;top:0;font-size:8px;font-weight:700;color:'+def.col;
      el.appendChild(c);
    }
    // hp 바
    const bar=document.createElement('i'); bar.className='hp';
    bar.style.transform='scaleX('+Math.max(0,m.hp/m.max)+')';
    if (m.hp/m.max>0.5) bar.style.background='#2e8b57'; else if(m.hp/m.max>0.25) bar.style.background='#d9822b';
    el.appendChild(bar);
  }
}

// ---------- 로그 ----------
function log(msg, formula, kind){
  wave; // noop
  lastFormula = formula || lastFormula;
  if (formula) fmla.textContent = formula;
  warLog.push({y:`서기 ${100+gameTime|0}`, t:gameTime|0, msg, formula:formula||'', kind:kind||''});
  if (warLog.length>400) warLog.shift();
  if (currentView==='war') renderLogSheet();
}
function recordKO(text){
  obituaries.push({t:gameTime|0, text});
  if (obituaries.length>500) obituaries.shift();
  document.getElementById('tab-dead').textContent = `격파기록 (${totalKills})`;
  if (currentView==='dead') renderLogSheet();
}

// ---------- 디펜더 AI ----------
// 가용 빌드 셀에 대해 "경로 커버리지 점수"를 매겨 최적 위치/종류를 고른다.
function buildableCells(){
  const out=[];
  for (let i=0;i<N;i++){
    if (pathSet.has(i)) continue;
    if (cells[i].tower) continue;
    out.push(i);
  }
  return out;
}
function pathCellsInRange(i, range){
  const cx=xOf(i), cy=yOf(i); let cnt=0; const r2=range*range;
  for (const p of path){
    const dx=xOf(p)-cx, dy=yOf(p)-cy;
    if (dx*dx+dy*dy <= r2) cnt++;
  }
  return cnt;
}
function defenderAI(){
  // 타워 공급 한도: 웨이브에 따라 점증. 무한 벽쌓기 방지 → 업그레이드로 유도, 시소 유지.
  const towerCap = Math.min(24, 5 + wave*1.4 | 0);
  const atCap = towers.length >= towerCap;
  // 신축 후보 (한도 미만일 때만)
  if (!atCap && defGold >= TOWER.gun.cost){
    // 종류 선택: 기지 HP 낮으면 화력(cannon), 고속봇 많으면 frost, 평시 gun
    const runners = mobs.filter(m=>m.kind==='runner'||m.kind==='swarm').length;
    const heavy = mobs.filter(m=>m.kind==='tank'||m.kind==='boss').length;
    let kind='gun';
    if (heavy>=1 && defGold>=TOWER.cannon.cost && Math.random()<0.6) kind='cannon';
    else if (runners>=3 && defGold>=TOWER.frost.cost && Math.random()<0.6) kind='frost';
    else if (defGold>=TOWER.cannon.cost && towers.length>4 && Math.random()<0.3) kind='cannon';
    const def = TOWER[kind];
    if (defGold >= def.cost){
      // 최적 위치 = 커버리지 최대 (약간 무작위로 다양성)
      const cand = buildableCells();
      if (cand.length){
        let best=-1, bestScore=-1;
        const sample = cand.length>120 ? shuffleSample(cand,120) : cand;
        for (const i of sample){
          let s = pathCellsInRange(i, def.range);
          // 스폰 가까운 쪽 약간 선호(요격 시간↑) + 기존 타워 밀집 회피
          s += (1 - xOf(i)/COLS)*0.6;
          for (const t of towers){ const dx=t.x-xOf(i),dy=t.y-yOf(i); if(dx*dx+dy*dy<2.2) s-=1.5; }
          s += Math.random()*1.2;
          if (s>bestScore){ bestScore=s; best=i; }
        }
        if (best>=0 && bestScore>0){ placeTower(best, kind, false); return; }
      }
    }
  }
  // 2) 여유 자금 → 가장 많이 잡은 타워 업그레이드
  if (towers.length){
    const upCands = towers.filter(t=>t.level<4);
    if (upCands.length){
      upCands.sort((a,b)=> (b.kills - a.kills) || (b.level - a.level));
      const t = upCands[0];
      const upCost = TOWER[t.kind].up * t.level;
      if (defGold >= upCost && Math.random()<0.5){
        defGold -= upCost; t.level++;
        log(`${ref(t.i)} ${TOWER[t.kind].name} → Lv.${t.level} 강화`, `=UPGRADE(${ref(t.i)}, "${TOWER[t.kind].name}", ${t.level})`, 'up');
        paintTowerCell(t.i);
      }
    }
  }
}
function shuffleSample(arr,n){ const a=arr.slice(); for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]];} return a.slice(0,n); }

function placeTower(i, kind, manual){
  const def = TOWER[kind];
  if (cells[i].tower || pathSet.has(i)) return false;
  if (defGold < def.cost) return false;
  defGold -= def.cost;
  const t = { i, x:xOf(i), y:yOf(i), kind, level:1, cd:0, kills:0 };
  cells[i].tower = t; towers.push(t);
  paintTowerCell(i);
  log(`${manual?'사령부':'디펜더AI'}가 ${ref(i)}에 ${def.name} 설치`,
      `=BUILD("${def.name}", ${ref(i)}, ${def.label}=${def.dmg})`, 'build');
  return true;
}

// ---------- 몬스터 AI (절차/적응형 웨이브) ----------
function spawnWave(forced){
  wave++;
  // 예산: 시간/웨이브 기반 성장 + 적응형 러버밴딩
  const base = 16 + wave*8 + Math.pow(wave,1.5);
  // pressureEMA 낮음(=디펜더 압승) → 예산↑↑, 높음(=기지위기) → 예산↓
  // 디펜더 화력(타워수)에 비례해 추가 가산 — 벽쌓기를 응징해 시소 유지
  const adapt = 1 + (0.5 - pressureEMA)*1.5;        // 0.25 ~ 1.75
  const wallTax = 1 + towers.length*0.02;           // 타워 많을수록 군단 강화(완만)
  mobBudget = Math.max(10, base * Math.max(0.35, adapt) * wallTax);
  // 보스 웨이브
  const isBoss = (wave % 6 === 0);
  // 조합 결정: 디펜더 구성에 대응
  const frostCount = towers.filter(t=>t.kind==='frost').length;
  const cannonCount = towers.filter(t=>t.kind==='cannon').length;
  let budget = mobBudget;
  const pack = [];
  if (isBoss){ pack.push('boss'); budget -= MOB.boss.cost; }
  // frost가 많으면 tank/boss로 밀기, cannon 많으면 swarm으로 분산
  const wTank = 1 + frostCount*0.4 + wave*0.04;
  const wSwarm = 1 + cannonCount*0.5;
  const wRunner = 1 + Math.max(0, (pressureEMA-0.5))*2; // 압박 낮을때 고속 러시 덜
  const wGrunt = 2;
  const choices = [['tank',wTank],['swarm',wSwarm],['runner',wRunner],['grunt',wGrunt]];
  let guard=0;
  while (budget > 1 && guard++<400){
    const tot = choices.reduce((s,c)=>s+c[1],0);
    let r=Math.random()*tot, pick='grunt';
    for (const [k,w] of choices){ r-=w; if(r<=0){pick=k;break;} }
    if (MOB[pick].cost<=budget){ pack.push(pick); budget-=MOB[pick].cost; }
    else if (MOB.swarm.cost<=budget){ pack.push('swarm'); budget-=MOB.swarm.cost; }
    else break;
  }
  // 큐에 적재 (시차 스폰)
  for (let k=0;k<pack.length;k++){
    spawnQueue.push({kind:pack[k], delay: k * (isBoss?9:6) });
  }
  const comp = summarize(pack);
  log(`제${wave}군단 침공 — ${comp}${isBoss?' [우두머리 동반]':''}`,
      `=WAVE(#${wave}, 예산=${mobBudget|0}, {${comp}})`, 'wave');
  titletext.textContent = `방어작전.xlsx - Excel (제${wave}군단)`;
}
function summarize(pack){
  const c={}; for(const k of pack) c[k]=(c[k]||0)+1;
  return Object.entries(c).map(([k,n])=>`${MOB[k].name}×${n}`).join(', ');
}
let spawnQueue = []; // {kind, delay}
function processSpawnQueue(){
  for (const s of spawnQueue) s.delay--;
  const ready = spawnQueue.filter(s=>s.delay<=0);
  spawnQueue = spawnQueue.filter(s=>s.delay>0);
  for (const s of ready) actuallySpawn(s.kind);
}
function actuallySpawn(kind){
  const def = MOB[kind];
  const hpScale = 1 + wave*0.30 + wave*wave*0.022;   // 시간에 따라 가파르게 강해짐
  const hp = Math.round(def.hp * hpScale);
  const bounty = Math.round(def.bounty * (1 + wave*0.03));  // 처치 보상은 완만히 상승
  mobs.push({ id:mobId++, p:0, hp, max:hp, kind, speed:def.speed, slow:0, slowT:0, bounty });
}

// ---------- 전투 틱 ----------
let gameTime = 0;           // 게임 내부 시계 (틱)
let nextWaveAt = 60;        // 다음 자동 웨이브 시각
let frame = 0;
function tick(dt){
  gameTime += dt;
  frame++;

  // 자동 웨이브
  if (gameTime >= nextWaveAt && spawnQueue.length===0){
    spawnWave(false);
    // 다음 웨이브 간격: 압박 높으면 살짝 길게(숨돌릴 틈), 낮으면 짧게
    const gap = 90 + (pressureEMA)*70 - Math.min(40, wave*1.5);
    nextWaveAt = gameTime + Math.max(45, gap);
  }
  processSpawnQueue();

  // 디펜더 AI (자금 여유 있을 때 주기적으로)
  if (frame % 8 === 0) defenderAI();

  // 몬스터 이동
  let reachedBase = 0;
  for (const m of mobs){
    let sp = m.speed * (m.slow>0 ? (1-m.slow) : 1);
    if (m.slowT>0){ m.slowT-=dt; if(m.slowT<=0){ m.slow=0; } }
    m.p += sp * dt;
    if (m.p >= path.length-1){
      // 기지 도달
      const dmg = (MOB[m.kind].cost>=9? 14 : 6);
      baseHP -= dmg; reachedBase++;
      m.dead=true; leaked++;
      recordKO(`${MOB[m.kind].name} #${m.id} 방어선 돌파 (기지 -${dmg})`);
      log(`${MOB[m.kind].name}이(가) 기지에 침투! 기지 HP ${Math.max(0,baseHP)|0}`,
          `=BREACH("${MOB[m.kind].name}", 기지HP=${Math.max(0,baseHP)|0})`, 'breach');
    }
  }
  if (baseHP <= 0){ gameOver(); }

  // 타워 사격
  for (const t of towers){
    if (t.cd>0){ t.cd--; continue; }
    const def = TOWER[t.kind];
    const range = def.range + (t.level-1)*0.25;
    const dmg = def.dmg + (t.level-1)*Math.max(2, def.dmg*0.55);
    const r2 = range*range;
    // 목표: 사거리 내 가장 진행 빠른 몹
    let target=null;
    for (const m of mobs){
      if (m.dead) continue;
      const k = Math.max(0,Math.min(path.length-1, Math.round(m.p)));
      const dx=xOf(path[k])-t.x, dy=yOf(path[k])-t.y;
      if (dx*dx+dy*dy<=r2){ if(!target || m.p>target.p) target=m; }
    }
    if (target){
      t.cd = def.rate;
      flashFire(t.i);
      if (def.splash){
        // 스플래시
        const tk=Math.max(0,Math.min(path.length-1,Math.round(target.p)));
        const tx=xOf(path[tk]), ty=yOf(path[tk]);
        for (const m of mobs){
          if (m.dead) continue;
          const k=Math.max(0,Math.min(path.length-1,Math.round(m.p)));
          const dx=xOf(path[k])-tx, dy=yOf(path[k])-ty;
          if (dx*dx+dy*dy <= def.splash*def.splash) damage(m, dmg, t);
        }
      } else {
        damage(target, dmg, t);
        if (def.slow>0){ target.slow=def.slow; target.slowT=24; }
      }
    }
  }

  // 사망 처리
  if (mobs.some(m=>m.dead)){
    mobs = mobs.filter(m=>{
      if (m.dead && !m.banked && !m.leakedFlag){ /* already handled */ }
      return !m.dead;
    });
  }

  // 압박 EMA 갱신: ①기지HP손실 ②화면 군단 규모 ③선두 군단의 기지 근접도
  const live = mobs.reduce((s,m)=>s+m.hp,0);
  let lead = 0;
  for (const m of mobs){ const fr = m.p/(path.length-1); if (fr>lead) lead=fr; }
  const inst = Math.min(1,
      (1-baseHP/baseMax)*0.5 +
      Math.min(1, live/(90+wave*22))*0.3 +
      lead*lead*0.2);
  pressureEMA += (inst - pressureEMA)*0.05;

  renderMobs();
  updatePanel();
  updateStatus();
}

function damage(m, dmg, tower){
  m.hp -= dmg;
  const k=Math.max(0,Math.min(path.length-1,Math.round(m.p)));
  const el=cellEls[path[k]]; if(el){ el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }
  if (m.hp<=0 && !m.dead){
    m.dead=true; m.banked=true;
    totalKills++;
    defGold += m.bounty;
    if (tower){ tower.kills++; }
    if (MOB[m.kind].cost>=9 || totalKills%12===0){
      recordKO(`${MOB[m.kind].name} #${m.id} 격파 (+${m.bounty}G, ${tower?ref(tower.i)+' '+TOWER[tower.kind].name:'?'})`);
    }
  }
}

function flashFire(i){ const el=cellEls[i]; el.classList.remove('fire'); void el.offsetWidth; el.classList.add('fire'); }

// ---------- 패널 ----------
function updatePanel(){
  if (currentView!=='board') return;
  const hpPct = Math.max(0,baseHP)/baseMax*100;
  const hpCol = hpPct>50?'#2e8b57':hpPct>25?'#d9822b':'#c0392b';
  const prPct = Math.round(pressureEMA*100);
  let h = `<h4>🛡 방어 현황</h4>`;
  h += `<div>기지 HP <b style="color:${hpCol}">${Math.max(0,baseHP)|0}</b>/${baseMax}</div>`;
  h += `<div class="bar"><i style="width:${hpPct}%;background:${hpCol}"></i></div>`;
  h += `<div>디펜더 자금 <b style="color:#107c41">${defGold|0}G</b></div>`;
  h += `<div>타워 ${towers.length} · 누적격파 ${totalKills}</div>`;
  h += `<div>화면 군단 ${mobs.length}기 · 유출 ${leaked}</div>`;
  h += `<h4 style="margin-top:6px">⚔ 전황 (제${wave}군단)</h4>`;
  h += `<div>다음 침공 T-${Math.max(0,nextWaveAt-gameTime)|0}</div>`;
  h += `<div class="mut">압박지수 ${prPct}% (적응형)</div>`;
  h += `<div class="bar"><i style="width:${prPct}%;background:linear-gradient(90deg,#2e8b57,#d9822b,#c0392b)"></i></div>`;
  panel.innerHTML = h;
}
function updateStatus(){
  statusbar.innerHTML =
    `준비<span class="sep">|</span>제${wave}군단<span class="sep">|</span>기지 ${Math.max(0,baseHP)|0}HP`+
    `<span class="sep">|</span>자금 ${defGold|0}G<span class="sep">|</span>격파 ${totalKills}<span class="sep">|</span>`+
    `${gameOverFlag?'<b>방어선 붕괴 — 시뮬레이션 종료</b>':'관전 중 (양측 AI)'}`;
}

// ---------- 로그 시트 렌더 ----------
let currentView = 'board';
function renderLogSheet(){
  if (currentView==='war'){
    let rows = warLog.slice(-200).reverse();
    let h = '<table><thead><tr><th class="r">행</th><th style="width:78px">시각</th><th style="width:46%">이벤트</th><th>수식</th></tr></thead><tbody>';
    rows.forEach((e,k)=>{
      h += `<tr><td class="r">${k+1}</td><td>${e.y}년</td><td>${escapeH(e.msg)}</td><td class="f">${escapeH(e.formula)}</td></tr>`;
    });
    h += '</tbody></table>';
    logsheet.innerHTML = h;
  } else if (currentView==='dead'){
    let rows = obituaries.slice(-300).reverse();
    let h = `<table><thead><tr><th class="r">행</th><th style="width:90px">시각(T)</th><th>격파/유출 기록</th></tr></thead><tbody>`;
    if (!rows.length) h += `<tr><td class="r">1</td><td>-</td><td class="mut">아직 격파 기록이 없습니다.</td></tr>`;
    rows.forEach((e,k)=>{ h += `<tr><td class="r">${k+1}</td><td>T+${e.t}</td><td>${escapeH(e.text)}</td></tr>`; });
    h += '</tbody></table>';
    logsheet.innerHTML = h;
  }
}
function escapeH(s){ return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---------- 탭 전환 ----------
document.getElementById('tabs').addEventListener('click', e=>{
  const d = e.target.closest('div[data-v]'); if(!d) return;
  document.querySelectorAll('#tabs div').forEach(x=>x.classList.remove('on'));
  d.classList.add('on');
  currentView = d.dataset.v;
  if (currentView==='board'){ logsheet.style.display='none'; sheet.style.display='grid'; panel.style.display='block'; }
  else { sheet.style.display='none'; panel.style.display='none'; logsheet.style.display='block'; renderLogSheet(); }
});

// ---------- 셀 클릭 (선택 + 수동 설치) ----------
let selected=-1;
let buildMode=false, buildKind='gun';
sheet.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  const i=+t.dataset.i;
  if (selected>=0 && cellEls[selected]) cellEls[selected].classList.remove('sel');
  selected=i; t.classList.add('sel');
  namebox.textContent = ref(i);
  // 수식바: 셀 내용 설명
  if (i===spawnCell) fmla.textContent='=SPAWN.POINT("매크로 군단 출현구")';
  else if (i===baseCell) fmla.textContent=`=BASE(HP=${Math.max(0,baseHP)|0}/${baseMax})`;
  else if (cells[i].tower){ const tw=cells[i].tower; const d=TOWER[tw.kind];
    fmla.textContent=`=TOWER("${d.name}", Lv${tw.level}, 사거리=${(d.range+(tw.level-1)*0.25).toFixed(1)}, 격파=${tw.kills})`; }
  else if (pathSet.has(i)) fmla.textContent=`=PATH(진행도 ${pathIndexOf.get(i)}/${path.length-1})`;
  else fmla.textContent = buildMode ? `=PLACE?("${TOWER[buildKind].name}", ${ref(i)}, 비용=${TOWER[buildKind].cost}G)` : `=EMPTY(${ref(i)})`;

  if (buildMode && !pathSet.has(i) && !cells[i].tower){
    if (placeTower(i, buildKind, true)){
      // 설치 후에도 모드 유지(연속 설치)
    } else {
      fmla.textContent=`=ERR(자금부족: ${TOWER[buildKind].cost}G 필요, 보유 ${defGold|0}G)`;
    }
  }
});

// ---------- 컨트롤 ----------
let paused=false, speed=2;
const btnPause=document.getElementById('btnPause');
btnPause.addEventListener('click', ()=>{ paused=!paused; btnPause.textContent = paused?'▶ 재개':'⏸ 일시정지'; });
document.querySelectorAll('.spd').forEach(b=>{
  b.addEventListener('click', ()=>{ document.querySelectorAll('.spd').forEach(x=>x.classList.remove('on')); b.classList.add('on'); speed=+b.dataset.s; });
});
document.getElementById('btnWave').addEventListener('click', ()=>{ spawnWave(true); nextWaveAt = gameTime + 80; });
const btnBuild=document.getElementById('btnBuild');
const modehint=document.getElementById('modehint');
let buildIdx=0;
btnBuild.addEventListener('click', ()=>{
  if (!buildMode){ buildMode=true; buildKind=TOWER_KEYS[buildIdx]; }
  else { buildIdx=(buildIdx+1)%(TOWER_KEYS.length+1);
    if (buildIdx===TOWER_KEYS.length){ buildMode=false; buildIdx=0; }
    else buildKind=TOWER_KEYS[buildIdx];
  }
  if (buildMode){ btnBuild.classList.add('on'); const d=TOWER[buildKind];
    btnBuild.textContent=`🛠 ${d.name}(${d.cost}G)`;
    modehint.textContent=`설치 모드 — 빈 셀 클릭 (${d.name} ${d.cost}G). 다시 누르면 종류 변경`; }
  else { btnBuild.classList.remove('on'); btnBuild.textContent='🛠 타워 설치';
    modehint.textContent='관전 모드 — 양측 AI 자동 교전 중'; }
});

// 키보드: 스페이스=일시정지
addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); btnPause.click(); } });

// ---------- 게임오버 / 재시작 ----------
let gameOverFlag=false;
function gameOver(){
  if (gameOverFlag) return;
  gameOverFlag=true; paused=true; btnPause.textContent='▶ 재개';
  log(`방어선 붕괴 — 제${wave}군단까지 방어, 총 ${totalKills}격파`,
      `=GAME.OVER(웨이브=${wave}, 격파=${totalKills})`, 'over');
  setTimeout(()=>{
    // 자동 재시작 (관전 연속성)
    resetGame();
  }, 3200);
}
function resetGame(){
  towers=[]; mobs=[]; spawnQueue=[]; mobId=1;
  defGold=110; baseHP=100; baseMax=100; wave=0; mobBudget=14;
  leaked=0; totalKills=0; pressureEMA=0.5; gameTime=0; nextWaveAt=60;
  gameOverFlag=false; paused=false; btnPause.textContent='⏸ 일시정지';
  obituaries.length=0; warLog.length=0;
  document.getElementById('tab-dead').textContent='격파기록 (0)';
  buildDOM();
  log('새 방어작전 개시 — 매크로 군단 침공 시뮬레이션', '=DEFENSE.SIM($A$1, "매크로 군단 침공")','init');
}

// ---------- 메인 루프 ----------
let last=performance.now(), acc=0;
const STEP = 1; // 논리 틱 단위
function loop(now){
  const real=Math.min(64, now-last); last=now;
  if (!paused){
    acc += real/16.6 * speed;
    let steps=0;
    while (acc>=STEP && steps<12){ tick(STEP); acc-=STEP; steps++; }
  }
  requestAnimationFrame(loop);
}

// ---------- 초기화 ----------
buildDOM();
fmla.textContent = lastFormula;
log('방어작전 개시 — 매크로 군단 침공 시뮬레이션', '=DEFENSE.SIM($A$1, "매크로 군단 침공")','init');
spawnWave(false);
nextWaveAt = gameTime + 70;
requestAnimationFrame(loop);

// ---------- 리사이즈 (디바운스, 게임 상태 보존은 단순화: 그리드 재구성) ----------
let rzT=null;
addEventListener('resize', ()=>{
  clearTimeout(rzT);
  rzT=setTimeout(()=>{
    const oldCols=COLS, oldRows=ROWS;
    computeDims();
    if (COLS!==oldCols || ROWS!==oldRows){
      // 차원 변경 시 경로/타워 좌표가 깨지므로 안전하게 재시작
      resetGame();
    } else {
      // 폭만 변한 경우: 셀 크기 갱신
      sheet.style.gridTemplateColumns = `${HDW}px repeat(${COLS}, ${CW}px)`;
      sheet.style.gridTemplateRows = `${HDH}px repeat(${ROWS}, ${CH}px)`;
    }
  }, 280);
});
})();
