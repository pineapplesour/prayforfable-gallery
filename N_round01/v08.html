<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>항만방어.xlsx - Excel</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;
    font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:12px;color:#222;-webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}
  /* ── 타이틀바 ── */
  #titlebar{height:30px;background:#f3f2f1;display:flex;align-items:center;
    padding:0 10px;gap:7px;border-bottom:1px solid #ddd;flex:none}
  .dot{width:11px;height:11px;border-radius:50%}
  #titlebar .ttl{margin-left:8px;color:#444;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* ── 메뉴바 ── */
  #menubar{height:28px;background:#fff;display:flex;align-items:flex-end;
    padding:0 12px;gap:16px;border-bottom:1px solid #e1e1e1;font-size:12px;color:#444;flex:none;overflow:hidden}
  #menubar b{color:#107c41;border-bottom:2.5px solid #107c41;padding:4px 2px;font-weight:600}
  #menubar i{font-style:normal;padding:4px 2px}
  /* ── 리본 ── */
  #ribbon{height:46px;background:#f9f9f9;border-bottom:1px solid #e1e1e1;display:flex;
    align-items:center;padding:0 8px;gap:6px;flex:none;overflow-x:auto;overflow-y:hidden}
  .rgrp{display:flex;align-items:center;gap:4px;padding:0 8px;border-right:1px solid #e3e3e3;height:100%}
  .rgrp:last-child{border-right:none}
  .rbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:46px;height:40px;border:1px solid transparent;border-radius:3px;cursor:pointer;
    color:#444;padding:2px 6px;line-height:1.15;background:#fff}
  .rbtn:hover{background:#eaf4ee;border-color:#bcdcc8}
  .rbtn.on{background:#e2efe7;border-color:#107c41;color:#0a5c30}
  .rbtn .ic{font-size:15px}
  .rbtn .lb{font-size:10px;margin-top:1px;white-space:nowrap}
  .rgrp .glab{font-size:9.5px;color:#999;align-self:flex-end}
  /* ── 수식바 ── */
  #fbar{height:26px;background:#fff;display:flex;align-items:center;
    border-bottom:1px solid #d4d4d4;font-size:12px;flex:none}
  #namebox{width:62px;height:100%;border-right:1px solid #d4d4d4;display:flex;
    align-items:center;justify-content:center;color:#333;flex:none;font-weight:600}
  #fx{width:28px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif;flex:none}
  #formula{flex:1;padding:0 8px;font-family:Consolas,Menlo,monospace;font-size:11.5px;
    color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid #e4e4e4}
  /* ── 시트 영역 ── */
  #sheetwrap{position:relative;overflow:hidden;background:#fff;flex:1;min-height:0}
  #sheet{display:grid;background:#fff;position:absolute;top:0;left:0}
  .hd{background:#f5f5f5;border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:11px}
  .hd.cornr{background:#eee}
  .cell{border-right:1px solid #e6e6e6;border-bottom:1px solid #e6e6e6;
    display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;
    overflow:hidden;cursor:cell;position:relative}
  .cell.sel{outline:2px solid #107c41;outline-offset:-2px;z-index:3}
  .cell.place{cursor:crosshair}
  .hpbar{position:absolute;left:1px;right:1px;bottom:0;height:2px;background:#e23;border-radius:1px}
  .muz{position:absolute;inset:0;pointer-events:none;z-index:2}
  @keyframes hitf{0%{box-shadow:inset 0 0 0 2px #ffeb3b}100%{box-shadow:none}}
  .hit{animation:hitf .25s 1}
  @keyframes boom{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
  .boom{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:14px;pointer-events:none;z-index:4;animation:boom .4s ease-out forwards;color:#d35400}
  /* ── 플로팅 패널 ── */
  #panel{position:absolute;top:8px;right:10px;background:#fffef6;border:1px solid #d8c66a;
    box-shadow:2px 3px 10px rgba(0,0,0,.16);padding:8px 11px;font-size:11px;z-index:6;
    width:200px;line-height:1.55;border-radius:3px}
  #panel h4{margin:0 0 4px;font-size:11px;color:#7a6a1f;border-bottom:1px solid #e5d68f;padding-bottom:2px}
  #panel .row{display:flex;justify-content:space-between;gap:6px}
  #panel .bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin:2px 0 5px}
  #panel .bar > i{display:block;height:100%}
  #panel .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:8;
    background:rgba(16,124,65,.95);color:#fff;padding:5px 14px;border-radius:14px;font-size:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .3s}
  .toast.show{opacity:1}
  /* ── 상태바 ── */
  #statusbar{height:24px;background:#107c41;color:#eaf6ee;display:flex;align-items:center;
    padding:0 12px;font-size:11.5px;flex:none;overflow:hidden;white-space:nowrap}
  #statusbar .sep{margin:0 9px;opacity:.5}
  #statusbar .ev{overflow:hidden;text-overflow:ellipsis;flex:1}
  /* ── 시트탭 ── */
  #tabs{height:26px;background:#f3f2f1;display:flex;align-items:flex-end;padding-left:24px;
    border-top:1px solid #d4d4d4;font-size:11.5px;flex:none}
  #tabs div{padding:3px 14px;border:1px solid #d4d4d4;border-bottom:none;margin-right:2px;
    background:#e8e8e8;color:#555;cursor:pointer;white-space:nowrap}
  #tabs div.on{background:#fff;color:#107c41;font-weight:600;border-top:2px solid #107c41}
  /* ── 데이터 시트(전황/격파기록) ── */
  #datasheet{position:absolute;inset:0;background:#fff;overflow:auto;display:none;font-size:11.5px}
  #datasheet table{border-collapse:collapse;width:100%}
  #datasheet th,#datasheet td{border:1px solid #e3e3e3;padding:3px 8px;text-align:left;white-space:nowrap}
  #datasheet th{background:#f5f5f5;color:#555;position:sticky;top:0;font-weight:600}
  #datasheet td.fx{font-family:Consolas,monospace;color:#0a5c30}
  #datasheet .corner{background:#f5f5f5;color:#bbb;width:34px;text-align:center}
  @media (max-width:520px){
    #ribbon{height:42px} .rbtn{min-width:40px;height:36px} .rbtn .ic{font-size:13px}
    #panel{width:150px;font-size:10px} #menubar{gap:10px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <div class="ttl" id="ttl">항만방어.xlsx - Excel</div>
  </div>
  <div id="menubar"><i>파일</i><b>홈</b><i>삽입</i><i>페이지 레이아웃</i><i>수식</i><i>데이터</i><i>검토</i><i>보기</i><i>도움말</i></div>
  <div id="ribbon">
    <div class="rgrp">
      <div class="rbtn" id="btnPlay"><div class="ic">❙❙</div><div class="lb" id="lbPlay">일시정지</div></div>
      <div class="rbtn" id="btnSpeed"><div class="ic">▶▶</div><div class="lb" id="lbSpeed">1.0×</div></div>
      <div class="glab">진행</div>
    </div>
    <div class="rgrp">
      <div class="rbtn" id="btnWave"><div class="ic">≋</div><div class="lb">웨이브 소환</div></div>
      <div class="rbtn" id="btnAuto"><div class="ic">◆</div><div class="lb" id="lbAuto">AI 관전</div></div>
      <div class="glab">전투</div>
    </div>
    <div class="rgrp">
      <div class="rbtn" id="btnT1"><div class="ic" style="color:#2563eb">砲</div><div class="lb">기관포 8</div></div>
      <div class="rbtn" id="btnT2"><div class="ic" style="color:#b45309">榴</div><div class="lb">곡사포 22</div></div>
      <div class="rbtn" id="btnT3"><div class="ic" style="color:#0d9488">網</div><div class="lb">감속망 16</div></div>
      <div class="glab">직접 건설 (자금)</div>
    </div>
  </div>
  <div id="fbar">
    <div id="namebox">A1</div>
    <div id="fx">fx</div>
    <div id="formula"></div>
  </div>
  <div id="sheetwrap">
    <div id="sheet"></div>
    <div id="datasheet"></div>
    <div id="panel"></div>
    <div class="toast" id="toast"></div>
  </div>
  <div id="tabs">
    <div class="on" data-sheet="battle">전장</div>
    <div data-sheet="status">전황</div>
    <div data-sheet="kills">격파기록 <span id="killCount">(0)</span></div>
  </div>
  <div id="statusbar"></div>
</div>

<script>
(() => {
"use strict";
// ════════════════════════════════════════════════════════════════
//  항만방어.xlsx — 엑셀로 위장한 타워 디펜스 (해적 함대 vs 항만 포대)
//  양측 모두 AI. 자동 관전이 기본. 사람은 개입 가능.
// ════════════════════════════════════════════════════════════════

const sheetEl   = document.getElementById('sheet');
const dataEl    = document.getElementById('datasheet');
const fmla      = document.getElementById('formula');
const namebox   = document.getElementById('namebox');
const statusbar = document.getElementById('statusbar');
const panel     = document.getElementById('panel');
const toastEl   = document.getElementById('toast');
const ttl       = document.getElementById('ttl');

// ── 그리드 규격 (반응형) ──
const wrap = document.getElementById('sheetwrap');
let CW, CH, COLS, ROWS, N;
function computeGrid() {
  const w = window.innerWidth, h = window.innerHeight;
  CW = w < 520 ? 26 : 32;
  CH = w < 520 ? 22 : 24;
  // sheetwrap 가용 높이 추정 (titlebar30+menu28+ribbon46+fbar26+tabs26+status24 ≈ 180)
  const availW = w, availH = h - 182;
  COLS = Math.max(16, Math.min(44, Math.floor((availW - 46) / CW)));
  ROWS = Math.max(12, Math.min(30, Math.floor((availH - 24) / CH)));
  N = COLS * ROWS;
}
computeGrid();

function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26|0;}return s;}
const RC = (r,c)=> r*COLS+c;
const ref = i => colName(i%COLS) + (Math.floor(i/COLS)+1);
const rnd = (a,b)=> a + Math.random()*(b-a);
const ri  = (a,b)=> a + (Math.random()*(b-a+1)|0);
const clamp=(v,a,b)=> v<a?a:(v>b?b:v);

// ════════════════════════════════════════════════════════════════
//  맵 / 경로 생성 (절차생성)
//  왼쪽 = 외해(스폰), 오른쪽 = 항구(목표). 사행하는 항로(바다)를 따라
//  해적이 진군. 항로 양옆 육지(부두)에만 포대 설치 가능.
// ════════════════════════════════════════════════════════════════
let cells = [];      // {kind:'land'|'lane'|'port'|'spawn', tower:null|{...}, lanePos}
let path  = [];      // 경로 셀 인덱스 순서 배열 (spawn → port)
let portIdx = -1;

function buildMap() {
  cells = new Array(N);
  for (let i=0;i<N;i++) cells[i] = { kind:'land', tower:null, lanePos:-1 };
  path = [];
  // 사행 경로: 좌→우로 진행하되 위/아래로 굽이친다
  let row = ri(2, ROWS-3);
  const startCol = 0;
  portIdx = -1;
  let c = startCol, r = row;
  const visited = new Set();
  let guard = 0;
  while (c < COLS-1 && guard++ < N*3) {
    const idx = RC(r,c);
    if (!visited.has(idx)) { path.push(idx); visited.add(idx); }
    // 진행 방향 결정: 주로 오른쪽, 가끔 상/하로 굽이
    const roll = Math.random();
    if (roll < 0.58) { c++; }
    else {
      const dir = (Math.random()<0.5? -1: 1);
      const nr = r + dir;
      if (nr>=1 && nr<=ROWS-2) {
        r = nr;
        const vi = RC(r,c);
        if (!visited.has(vi)) { path.push(vi); visited.add(vi); }
      } else { c++; }
    }
  }
  // 마지막: 항구 열까지 직진
  while (c < COLS-1) { c++; const idx=RC(r,c); if(!visited.has(idx)){path.push(idx);visited.add(idx);} }
  portIdx = path[path.length-1];

  // 경로 셀 표시
  path.forEach((idx,k)=>{ cells[idx].kind='lane'; cells[idx].lanePos=k; });
  cells[path[0]].kind = 'spawn';
  cells[portIdx].kind = 'port';

  // 항로에 인접한 육지를 "부두"(건설 가능 우량지)로 — 나머지는 일반 육지(설치 가능하나 사거리 보너스 없음)
  // 모든 육지는 설치 가능. 잔잔한 바다 장식 약간.
  for (let i=0;i<N;i++){
    if (cells[i].kind==='land' && Math.random()<0.06) cells[i].kind='reef'; // 암초(설치불가 장식)
  }
}
buildMap();

// 경로 길이 기반 진행 척도
const PATH_LEN = () => path.length;

// ════════════════════════════════════════════════════════════════
//  타워(포대) 정의
// ════════════════════════════════════════════════════════════════
const TOWER_DEF = {
  gun:   { name:'기관포',  glyph:'砲', cost:8,  rng:1.9, dmg:5,  rate:7,  slow:0, splash:0, color:'#2563eb' },
  how:   { name:'곡사포',  glyph:'榴', cost:22, rng:2.8, dmg:16, rate:24, slow:0, splash:1.3, color:'#b45309' },
  slow:  { name:'감속망',  glyph:'網', cost:16, rng:2.1, dmg:1,  rate:12, slow:0.55,splash:0, color:'#0d9488' },
};
const TKEYS = ['gun','how','slow'];
const UPGRADE_MULT = [1, 1, 1.7, 2.7]; // lv1..3 누적 효과 배수(dmg/rng)
const UPGRADE_COST = [0, 0, 18, 40];

// ════════════════════════════════════════════════════════════════
//  해적 함선(몬스터) 정의
// ════════════════════════════════════════════════════════════════
const SHIP_DEF = {
  raft:  { name:'쾌속정', glyph:'舟', color:'#0e7490', hpB:14,  spd:0.16, bounty:4,  armor:0,   leak:1 },
  brig:  { name:'무장범선',glyph:'帆', color:'#b45309', hpB:40,  spd:0.11, bounty:9,  armor:1,   leak:2 },
  iron:  { name:'철갑선', glyph:'鐵', color:'#374151', hpB:120, spd:0.072,bounty:20, armor:3,   leak:4 },
  ghost: { name:'유령선', glyph:'霊', color:'#6d28d9', hpB:64,  spd:0.14, bounty:14, armor:1,   leak:3 },
};

// ════════════════════════════════════════════════════════════════
//  게임 상태
// ════════════════════════════════════════════════════════════════
const G = {
  defGold: 55,        // 디펜더 자금
  defGoldRate: 0.22,  // 틱당 자동수입(기본)
  portHP: 100, portMax: 100,
  wave: 0,
  pirateBudget: 18,   // 몬스터 AI 예산(웨이브마다 적응형 증가)
  ships: [],          // 활성 함선
  spawnQueue: [],     // {type, t} 예약 스폰
  kills: 0, leaked: 0,
  defScore: 0, pirScore: 0,
  tick: 0,
  paused: false,
  speed: 1, speedIdx: 1,
  autopilot: true,    // 디펜더 자동(AI 관전 기본 ON)
  placeMode: null,    // 직접 설치할 타워 키
  killLog: [],        // 격파기록
  buildLog: [],       // AI 의사결정 로그
  waveLog: [],
  selected: -1,
  lastEvent: '항만 방어 시뮬레이션 시작 — 양측 AI 교전 중',
  waveActive: false,
  interWave: 80,      // 다음 웨이브까지 카운트다운
  shipSeq: 0,
};
const SPEEDS = [0.5, 1, 2, 4];

// ════════════════════════════════════════════════════════════════
//  시트 DOM 구축
// ════════════════════════════════════════════════════════════════
let cellEls = [];
function buildSheet() {
  sheetEl.innerHTML = '';
  sheetEl.style.gridTemplateColumns = `46px repeat(${COLS}, ${CW}px)`;
  sheetEl.style.gridAutoRows = CH + 'px';
  cellEls = new Array(N);
  const frag = document.createDocumentFragment();
  const corner = document.createElement('div'); corner.className='hd cornr'; frag.appendChild(corner);
  for (let c=0;c<COLS;c++){ const h=document.createElement('div'); h.className='hd'; h.textContent=colName(c); frag.appendChild(h); }
  for (let r=0;r<ROWS;r++){
    const h=document.createElement('div'); h.className='hd'; h.textContent=r+1; frag.appendChild(h);
    for (let c=0;c<COLS;c++){
      const d=document.createElement('div'); d.className='cell'; d.dataset.i=RC(r,c);
      cellEls[RC(r,c)]=d; frag.appendChild(d);
    }
  }
  sheetEl.appendChild(frag);
}
buildSheet();

// ── 셀 정적 배경 그리기 ──
function paintCell(i) {
  const cl = cells[i], el = cellEls[i];
  if (!el) return;
  let bg='', tx='', col='#222', w='', title='';
  const t = cl.tower;
  if (t) {
    const def = TOWER_DEF[t.key];
    bg = hexA(def.color, 0.16 + t.lv*0.10);
    tx = def.glyph + (t.lv>1 ? '⁺'.repeat(Math.min(2,t.lv-1)) : '');
    col = def.color; w='700';
  } else if (cl.kind==='spawn') { bg='#fde2e2'; tx='碇'; col='#b91c1c'; w='700'; }
  else if (cl.kind==='port')  { bg='#dbeafe'; tx='港'; col='#1d4ed8'; w='700'; }
  else if (cl.kind==='lane')  { bg='#eef4fb'; tx='≈'; col='#9db8d6'; }
  else if (cl.kind==='reef')  { bg='#f0ece2'; tx='岩'; col='#b9a878'; }
  else { bg=''; tx=''; }
  el.style.background=bg; el.style.color=col; el.style.fontWeight=w;
  // 함선/이펙트는 별도 오버레이로 textContent 위에 그림 — 정적 글리프는 첫 노드로
  el.dataset.base = tx;
  if (!el.querySelector('.dyn')) el.textContent = tx;
}
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}

function paintAll(){ for(let i=0;i<N;i++) paintCell(i); }
paintAll();

// ════════════════════════════════════════════════════════════════
//  로깅 / 수식바
// ════════════════════════════════════════════════════════════════
function setFormula(s){ fmla.textContent = s; }
function logEvent(msg, formula){
  G.lastEvent = msg;
  if (formula) setFormula(formula);
}
function pushBuild(entry){ G.buildLog.unshift(entry); if(G.buildLog.length>120) G.buildLog.pop(); }
function pushKill(entry){ G.killLog.unshift(entry); if(G.killLog.length>200) G.killLog.pop(); }

let toastT=0;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),1400);
}

// ════════════════════════════════════════════════════════════════
//  몬스터 AI — 절차생성 웨이브 (적응형)
//  budget으로 함대 조합 구성. 디펜더가 강하면 철갑/유령 비중↑,
//  포대가 적으면 쾌속정 러시. 한쪽이 즉사하지 않게 스케일링.
// ════════════════════════════════════════════════════════════════
function towerStrength(){
  let s=0; for(let i=0;i<N;i++){const t=cells[i].tower; if(t){const d=TOWER_DEF[t.key]; s += (d.dmg*UPGRADE_MULT[t.lv]) * (60/d.rate);}} return s;
}
function planWave(){
  G.wave++;
  // 적응형 예산: 기본 성장 + 디펜더 강함/항구 체력에 따라 보정
  const tStr = towerStrength();
  const portFrac = G.portHP / G.portMax;
  let budget = 16 + G.wave*7 + tStr*0.12;
  // 디펜더가 너무 강하면 예산 더, 항구가 위태로우면 살짝 자제(엎치락뒤치락)
  if (portFrac < 0.35) budget *= 0.78;
  if (G.defGold > 70) budget *= 1.12;
  budget = Math.round(budget);
  G.pirateBudget = budget;

  // 조합: 디펜더 화력 높으면 철갑/유령 선호(질긴 적), 낮으면 쾌속정 러시
  const composition = [];
  const costOf = { raft:5, brig:11, iron:30, ghost:18 };
  let remaining = budget;
  const heavyBias = clamp(tStr/40, 0, 1);
  let safety=0;
  while (remaining >= 5 && safety++ < 200) {
    const roll = Math.random();
    let type;
    if (G.wave>=4 && roll < 0.10 + heavyBias*0.22 && remaining>=30) type='iron';
    else if (G.wave>=2 && roll < 0.30 + heavyBias*0.15 && remaining>=18) type='ghost';
    else if (G.wave>=2 && roll < 0.62 && remaining>=11) type='brig';
    else type='raft';
    if (remaining >= costOf[type]) { composition.push(type); remaining -= costOf[type]; }
    else break;
  }
  if (!composition.length) composition.push('raft');

  // 스폰 스케줄: 약간의 시차로 줄지어 진군
  const gap = clamp(28 - G.wave, 9, 24);
  G.spawnQueue = [];
  composition.forEach((type,k)=> G.spawnQueue.push({ type, t: k*gap + ri(0,6) }));
  G.waveActive = true;

  const counts = composition.reduce((m,t)=>{m[t]=(m[t]||0)+1;return m;},{});
  const desc = Object.entries(counts).map(([t,n])=> `${SHIP_DEF[t].name}×${n}`).join(', ');
  G.waveLog.unshift({ wave:G.wave, desc, budget, tick:G.tick });
  if (G.waveLog.length>80) G.waveLog.pop();
  logEvent(`웨이브 ${G.wave} 출항: ${desc} (해적예산 ${budget})`,
    `=WAVE(${G.wave}, "${desc}", BUDGET=${budget})`);
  toast(`[웨이브] ${G.wave} — ${desc}`);
}

// ── 함선 스폰 ──
function spawnShip(type){
  const def = SHIP_DEF[type];
  // 웨이브에 따른 hp 스케일
  const hp = Math.round(def.hpB * (1 + (G.wave-1)*0.18));
  G.ships.push({
    id: ++G.shipSeq, type, hp, hpMax:hp,
    pos: 0,                 // 경로상 진행도 (path index float)
    spd: def.spd, baseSpd: def.spd,
    armor: def.armor, slowT: 0, el:null, cellI:-1, hitT:0,
  });
}

// ════════════════════════════════════════════════════════════════
//  디펜더 AI — 자금으로 어디에 무엇을 지을지, 업그레이드할지 판단
// ════════════════════════════════════════════════════════════════
function buildableCells(){
  // 육지/암초 아님/타워없음 + 경로 근처(맨해튼≤2) 우선
  const out=[];
  for (let i=0;i<N;i++){
    const cl=cells[i];
    if (cl.tower) continue;
    if (cl.kind!=='land') continue;
    out.push(i);
  }
  return out;
}
function minPathDist(i){
  // 셀 i에서 가장 가까운 경로 셀까지의 격자 거리
  const x=i%COLS, y=i/COLS|0; let best=999;
  for (const p of path){ const px=p%COLS, py=p/COLS|0; const d=Math.abs(px-x)+Math.abs(py-y); if(d<best)best=d; if(best<=1)break; }
  return best;
}
// 후보 셀의 "사거리 내 경로 칸 수"로 입지 점수
function coverageScore(i, rng){
  const x=i%COLS, y=i/COLS|0; let n=0;
  for (const p of path){ const px=p%COLS, py=p/COLS|0; const d=Math.hypot(px-x,py-y); if(d<=rng) n++; }
  return n;
}
function defenderAI(){
  if (!G.autopilot) return;
  // 절약: 자금 충분할 때만, 너무 자주는 X
  if (G.tick % 6 !== 0) return;

  // 1) 위협 평가: 사거리 안에 함선이 거의 안 닿는 구간이 있으면 신규 건설
  //    먼저 업그레이드 고려(좋은 입지의 타워 강화가 효율적)
  // 현재 타워 목록
  const towers = [];
  for (let i=0;i<N;i++){ if(cells[i].tower) towers.push(i); }

  // 업그레이드 후보: 사거리 내 경로 많고 레벨<3
  let bestUp=-1, bestUpScore=-1;
  for (const i of towers){
    const t=cells[i].tower; if(t.lv>=3) continue;
    const def=TOWER_DEF[t.key];
    const cost=UPGRADE_COST[t.lv+1];
    if (G.defGold < cost) continue;
    const cov = coverageScore(i, def.rng*UPGRADE_MULT[t.lv+1]);
    const score = cov * (def.dmg+ (def.splash?6:0)) / (cost+1);
    if (score>bestUpScore){bestUpScore=score; bestUp=i;}
  }

  // 신규 건설 후보 탐색
  const cands = buildableCells().filter(i=>minPathDist(i)<=2);
  // 어떤 타워를 지을지: 자금/현재 구성에 따라
  let typeKey;
  const r=Math.random();
  // 곡사포(스플래시)는 무리(다수 적)에 강함, 감속망은 빠른 적, 기관포는 저렴 도배
  const hasSlow = towers.some(i=>cells[i].tower.key==='slow');
  if (G.defGold>=22 && r<0.45) typeKey='how';
  else if (!hasSlow && G.defGold>=16 && r<0.7) typeKey='slow';
  else typeKey='gun';
  const def=TOWER_DEF[typeKey];

  let bestNew=-1, bestNewScore=-1;
  for (const i of cands){
    const cov = coverageScore(i, def.rng);
    if (cov<=0) continue;
    // 기존 타워와 너무 겹치면 감점(분산 배치)
    let overlap=0;
    for (const j of towers){ const d=Math.abs((i%COLS)-(j%COLS))+Math.abs(((i/COLS|0)-(j/COLS|0))); if(d<=1)overlap++; }
    const score = cov - overlap*1.5 + Math.random()*0.6;
    if (score>bestNewScore){bestNewScore=score; bestNew=i;}
  }

  // 결정: 업그레이드 vs 신축. 자금 여유 적으면 신축 우선(커버리지 확보), 많으면 효율 비교
  const canBuild = bestNew>=0 && G.defGold>=def.cost;
  if (canBuild && (bestUp<0 || G.defGold < 30 || bestNewScore*2 > bestUpScore)) {
    placeTower(bestNew, typeKey, true);
  } else if (bestUp>=0) {
    upgradeTower(bestUp, true);
  }
}

function placeTower(i, key, byAI){
  const def=TOWER_DEF[key];
  if (cells[i].tower) return false;
  if (cells[i].kind!=='land') { if(!byAI) toast('여기엔 포대를 둘 수 없습니다(항로/항구/암초)'); return false; }
  if (G.defGold < def.cost) { if(!byAI) toast('자금 부족'); return false; }
  G.defGold -= def.cost;
  cells[i].tower = { key, lv:1, cool:0, kills:0 };
  paintCell(i);
  const who = byAI ? 'AI' : '지휘관';
  logEvent(`${who}: ${ref(i)}에 ${def.name} 배치 (-${def.cost})`,
    `=BUILD("${def.name}", ${ref(i)}, COST=${def.cost})`);
  pushBuild({ tick:G.tick, txt:`BUILD ${def.name} @${ref(i)}`, fx:`=BUILD("${def.name}", ${ref(i)}, ${def.cost})`, who });
  return true;
}
function upgradeTower(i, byAI){
  const t=cells[i].tower; if(!t || t.lv>=3) return false;
  const cost=UPGRADE_COST[t.lv+1];
  if (G.defGold<cost){ if(!byAI) toast('업그레이드 자금 부족'); return false; }
  G.defGold-=cost; t.lv++;
  paintCell(i);
  const def=TOWER_DEF[t.key]; const who=byAI?'AI':'지휘관';
  logEvent(`${who}: ${ref(i)}의 ${def.name} Lv${t.lv}로 강화 (-${cost})`,
    `=UPGRADE(${ref(i)}, "${def.name}", LV=${t.lv})`);
  pushBuild({ tick:G.tick, txt:`UPGRADE ${def.name}→Lv${t.lv} @${ref(i)}`, fx:`=UPGRADE(${ref(i)}, LV=${t.lv})`, who });
  return true;
}

// ════════════════════════════════════════════════════════════════
//  전투 시뮬레이션 (틱)
// ════════════════════════════════════════════════════════════════
function pathCellOf(shipPos){
  const k = clamp(Math.floor(shipPos),0,path.length-1);
  return path[k];
}
function shipScreenPos(s){
  // 경로상 보간 위치 → 셀 인덱스 (정수 칸 단위로 표시)
  return pathCellOf(s.pos);
}

function effects(){ /* placeholder */ }

function fireTowers(){
  for (let i=0;i<N;i++){
    const t=cells[i].tower; if(!t) continue;
    if (t.cool>0){ t.cool--; continue; }
    const def=TOWER_DEF[t.key];
    const mult=UPGRADE_MULT[t.lv];
    const rng=def.rng*(1+(t.lv-1)*0.18);
    const tx=i%COLS, ty=i/COLS|0;
    // 가장 진행도 높은(항구에 가까운) 사거리 내 적 우선
    let target=null, bestPos=-1;
    for (const s of G.ships){
      if (s.hp<=0) continue;
      const sc=shipScreenPos(s); const sx=sc%COLS, sy=sc/COLS|0;
      const d=Math.hypot(sx-tx,sy-ty);
      if (d<=rng && s.pos>bestPos){ bestPos=s.pos; target=s; }
    }
    if (!target) continue;
    // 발사
    t.cool = def.rate;
    const dmg = Math.max(1, def.dmg*mult - target.armor*0.6);
    applyHit(target, dmg, i);
    // 스플래시
    if (def.splash){
      const sc=shipScreenPos(target); const sx=sc%COLS, sy=sc/COLS|0;
      for (const s of G.ships){
        if (s===target||s.hp<=0) continue;
        const o=shipScreenPos(s); const d=Math.hypot((o%COLS)-sx,(o/COLS|0)-sy);
        if (d<=def.splash) applyHit(s, dmg*0.5, i);
      }
    }
    // 감속
    if (def.slow>0){ target.slowT = 14; target.spd = target.baseSpd*(1-def.slow); }
    muzzle(i, shipScreenPos(target));
  }
}
function applyHit(s, dmg, towerI){
  s.hp -= dmg; s.hitT=2;
  if (s.hp<=0){
    s.hp=0;
    const def=SHIP_DEF[s.type];
    G.defGold += def.bounty; G.kills++; G.defScore += def.bounty;
    if (towerI>=0 && cells[towerI].tower) cells[towerI].tower.kills++;
    pushKill({ tick:G.tick, wave:G.wave, name:def.name, by:towerI>=0?ref(towerI):'-', bounty:def.bounty,
      fx:`=KILL("${def.name}", BY=${towerI>=0?ref(towerI):'?'}, +${def.bounty})` });
    boomAt(shipScreenPos(s));
    if (G.kills%6===0) logEvent(`해적선 격침 — ${def.name} (현상금 +${def.bounty})`,
      `=KILL("${def.name}", +${def.bounty})`);
  }
}

// ── 함선 이동 ──
function moveShips(){
  for (const s of G.ships){
    if (s.hp<=0) continue;
    if (s.slowT>0){ s.slowT--; if(s.slowT===0) s.spd=s.baseSpd; }
    s.pos += s.spd * G.speed;
    if (s.hitT>0) s.hitT--;
    if (s.pos >= path.length-1){
      // 항구 도달 → 누수 피해
      const def=SHIP_DEF[s.type];
      const dmg = def.leak * (1 + (G.wave-1)*0.12);
      G.portHP = Math.max(0, G.portHP - dmg);
      G.leaked++; G.pirScore += dmg;
      s.hp=0;
      logEvent(`[경보] ${def.name}이(가) 항구 돌파! 항만 -${dmg.toFixed(1)}`,
        `=BREACH("${def.name}", PORT_HP=${G.portHP.toFixed(0)})`);
      pushKill({ tick:G.tick, wave:G.wave, name:def.name, by:'港돌파', bounty:-Math.round(dmg),
        fx:`=BREACH("${def.name}", -${dmg.toFixed(0)})` });
      breachFlash();
    }
  }
  // 죽은/도달 함선 정리
  G.ships = G.ships.filter(s=> s.hp>0);
}

// ════════════════════════════════════════════════════════════════
//  비주얼: 함선/이펙트 오버레이 (셀 위에 동적 글리프)
// ════════════════════════════════════════════════════════════════
let dynClear = [];
function renderShips(){
  // 이전 동적 노드 제거
  for (const el of dynClear){ const d=el.querySelector('.dyn'); if(d)d.remove(); const hb=el.querySelector('.hpbar'); if(hb)hb.remove(); el.style.textContent; }
  dynClear.forEach(el=>{ el.textContent = el.dataset.base||''; });
  dynClear = [];

  // 셀별로 가장 위험한(진행도 큰) 함선 1척 글리프 표시 + 누적 HP바
  const occ = new Map(); // cellI -> {ships:[]}
  for (const s of G.ships){
    const ci=shipScreenPos(s);
    if (!occ.has(ci)) occ.set(ci,[]);
    occ.get(ci).push(s);
  }
  for (const [ci, list] of occ){
    const el=cellEls[ci]; if(!el) continue;
    list.sort((a,b)=>b.pos-a.pos);
    const lead=list[0]; const def=SHIP_DEF[lead.type];
    // 글리프(스택이면 개수 표시)
    el.textContent = def.glyph + (list.length>1? list.length : '');
    el.style.color = lead.hitT>0 ? '#d11' : def.color;
    el.style.fontWeight='700';
    // HP바
    const frac = clamp(lead.hp/lead.hpMax,0,1);
    let hb=document.createElement('i'); hb.className='hpbar';
    hb.style.width=(frac*100)+'%';
    hb.style.background = frac>0.5? '#27ae60' : frac>0.25? '#e67e22':'#c0392b';
    el.appendChild(hb);
    if (lead.hitT>0){ el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'),250); }
    dynClear.push(el);
  }
}
function muzzle(fromI, toI){
  // 간단: 대상 셀에 점멸
  const el=cellEls[toI]; if(!el) return;
}
function boomAt(ci){
  const el=cellEls[ci]; if(!el) return;
  const b=document.createElement('div'); b.className='boom'; b.textContent='✸';
  el.appendChild(b); setTimeout(()=>b.remove(),420);
}
function breachFlash(){
  const el=cellEls[portIdx]; if(!el) return;
  el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'),250);
  const b=document.createElement('div'); b.className='boom'; b.textContent='✷';
  el.appendChild(b); setTimeout(()=>b.remove(),420);
}

// ════════════════════════════════════════════════════════════════
//  메인 틱
// ════════════════════════════════════════════════════════════════
function step(){
  G.tick++;
  // 디펜더 자동수입(웨이브 진행 따라 약간 증가)
  G.defGold += G.defGoldRate * (1 + G.wave*0.04);

  // 웨이브 관리: 큐 비고 활성함선 없으면 인터웨이브 카운트다운
  if (G.waveActive){
    // 예약 스폰 처리
    for (let k=G.spawnQueue.length-1;k>=0;k--){
      G.spawnQueue[k].t -= 1;
      if (G.spawnQueue[k].t<=0){ spawnShip(G.spawnQueue[k].type); G.spawnQueue.splice(k,1); }
    }
    if (G.spawnQueue.length===0 && G.ships.length===0){
      G.waveActive=false; G.interWave = clamp(90 - G.wave*3, 40, 90);
      // 웨이브 클리어 보너스
      const bonus = 10 + G.wave*2;
      G.defGold += bonus;
      logEvent(`웨이브 ${G.wave} 방어 성공 — 보급 +${bonus}`,
        `=WAVE.CLEAR(${G.wave}, BONUS=${bonus})`);
    }
  } else {
    G.interWave--;
    if (G.interWave<=0) planWave();
  }

  // AI 결정 + 전투
  defenderAI();
  fireTowers();
  moveShips();

  // 항구 함락 체크
  if (G.portHP<=0 && !G.over){
    G.over=true; G.paused=true;
    logEvent(`항만 함락! 해적 승리 (웨이브 ${G.wave}까지 버팀)`, `=DEFEAT(WAVE=${G.wave})`);
    toast('[함락] 항만 — 시뮬레이션 재시작');
    setTimeout(restart, 2600);
  }

  renderShips();
  updateHUD();
  if (G.activeSheet!=='battle' && G.tick%8===0) renderDataSheet();
}

function updateHUD(){
  // 상태바
  const portFrac=clamp(G.portHP/G.portMax,0,1);
  statusbar.innerHTML =
    `준비<span class="sep">|</span>웨이브 ${G.wave}<span class="sep">|</span>`+
    `[港] 항만 ${G.portHP.toFixed(0)}/${G.portMax}<span class="sep">|</span>`+
    `[金] 자금 ${G.defGold.toFixed(0)}<span class="sep">|</span>`+
    `격침 ${G.kills} / 돌파 ${G.leaked}`+
    `<span class="sep">|</span><span class="ev">${G.lastEvent}</span>`;

  // 플로팅 패널
  let towers=0; for(let i=0;i<N;i++) if(cells[i].tower) towers++;
  const nextWave = G.waveActive ? '교전 중' : `${G.interWave}틱 후`;
  panel.innerHTML =
    `<h4>전황판 (양측 AI)</h4>`+
    `<div class="row"><span>[港] 항만 체력</span><b>${G.portHP.toFixed(0)}%</b></div>`+
    `<div class="bar"><i style="width:${portFrac*100}%;background:${portFrac>0.5?'#27ae60':portFrac>0.25?'#e67e22':'#c0392b'}"></i></div>`+
    `<div class="row"><span><span class="sw" style="background:#107c41"></span>디펜더 자금</span><b>${G.defGold.toFixed(0)}金</b></div>`+
    `<div class="row"><span>배치 포대</span><b>${towers}문</b></div>`+
    `<div class="row"><span><span class="sw" style="background:#b91c1c"></span>해적 예산</span><b>${G.pirateBudget}</b></div>`+
    `<div class="row"><span>해상 함선</span><b>${G.ships.length}척</b></div>`+
    `<div class="row"><span>다음 웨이브</span><b>${nextWave}</b></div>`+
    `<div class="row" style="margin-top:4px;border-top:1px solid #eadf9a;padding-top:3px">`+
      `<span>격침 / 돌파</span><b>${G.kills} / ${G.leaked}</b></div>`+
    `<div style="margin-top:5px;font-size:10px;color:#8a7a2f">`+
      `${G.autopilot?'◆ 디펜더 AI 자동건설 ON':'◇ 수동 — 리본에서 포대 선택'}</div>`;

  document.getElementById('killCount').textContent = `(${G.killLog.length})`;
  if (G.tick%20===0) ttl.textContent = `항만방어.xlsx - Excel (웨이브 ${G.wave})`;
}

//  데이터 시트 (전황 / 격파기록)

function renderDataSheet(){
  if (G.activeSheet==='status'){
    let h=`<table><tr><th class="corner"></th><th>A</th><th>B</th><th>C</th><th>D</th></tr>`;
    h+=`<tr><td class="corner">1</td><td>지표</td><td>값</td><td>수식</td><td>비고</td></tr>`;
    const rows=[
      ['현재 웨이브', G.wave, '=COUNTER(WAVE)', G.waveActive?'교전 중':'대기'],
      ['항만 체력', `${G.portHP.toFixed(0)}/${G.portMax}`, '=PORT.HP()', G.portHP<35?'위급':'안정'],
      ['디펜더 자금', `${G.defGold.toFixed(0)}金`, '=DEF.GOLD()', G.autopilot?'AI 운용':'수동'],
      ['해적 예산', G.pirateBudget, '=PIRATE.BUDGET()', '적응형'],
      ['해상 함선', `${G.ships.length}척`, '=COUNTA(SHIPS)', ''],
      ['누적 격침', G.kills, '=SUM(KILLS)', `점수 ${G.defScore.toFixed(0)}`],
      ['항구 돌파', G.leaked, '=SUM(BREACH)', `점수 ${G.pirScore.toFixed(0)}`],
      ['진행 속도', `${G.speed}×`, '=SPEED()', G.paused?'일시정지':'재생'],
    ];
    let r=2;
    for (const [k,v,fx,note] of rows){
      h+=`<tr><td class="corner">${r++}</td><td>${k}</td><td><b>${v}</b></td><td class="fx">${fx}</td><td>${note}</td></tr>`;
    }
    // AI 의사결정 로그
    h+=`<tr><td class="corner">${r++}</td><td colspan="4" style="background:#f0f7f3;font-weight:600;color:#0a5c30">▼ AI 의사결정 로그 (=BUILD/=UPGRADE/=WAVE)</td></tr>`;
    const logs = [...G.waveLog.slice(0,3).map(w=>({fx:`=WAVE(${w.wave}, "${w.desc}")`, t:w.tick, txt:`웨이브 ${w.wave}: ${w.desc}`})),
                  ...G.buildLog.slice(0,12)];
    logs.sort((a,b)=>b.tick-a.tick);
    for (const e of logs.slice(0,16)){
      h+=`<tr><td class="corner">${r++}</td><td>${e.txt||''}</td><td>${e.who||''}</td><td class="fx" colspan="2">${e.fx||''}</td></tr>`;
    }
    h+=`</table>`;
    dataEl.innerHTML=h;
  } else if (G.activeSheet==='kills'){
    let h=`<table><tr><th class="corner"></th><th>A 시각</th><th>B 함종</th><th>C 처리</th><th>D 현상금</th><th>E 수식</th></tr>`;
    let r=1;
    if (!G.killLog.length){
      h+=`<tr><td class="corner">1</td><td colspan="5" style="color:#999">아직 격파 기록이 없습니다 — 전투를 기다리는 중...</td></tr>`;
    }
    for (const e of G.killLog.slice(0,120)){
      const breach = e.by.includes('돌파');
      h+=`<tr><td class="corner">${r++}</td><td>t${e.tick}·W${e.wave}</td><td>${e.name}</td>`+
         `<td style="color:${breach?'#c0392b':'#0a5c30'}">${e.by}</td>`+
         `<td style="color:${e.bounty<0?'#c0392b':'#0a5c30'}">${e.bounty>=0?'+':''}${e.bounty}</td>`+
         `<td class="fx">${e.fx}</td></tr>`;
    }
    h+=`</table>`;
    dataEl.innerHTML=h;
  }
}

// ════════════════════════════════════════════════════════════════
//  시트탭 전환
// ════════════════════════════════════════════════════════════════
G.activeSheet='battle';
document.querySelectorAll('#tabs div').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('#tabs div').forEach(t=>t.classList.remove('on'));
    tab.classList.add('on');
    G.activeSheet = tab.dataset.sheet;
    if (G.activeSheet==='battle'){
      dataEl.style.display='none'; sheetEl.style.display='grid'; panel.style.display='block';
    } else {
      dataEl.style.display='block'; sheetEl.style.display='none'; panel.style.display='none';
      renderDataSheet();
    }
  });
});

// ════════════════════════════════════════════════════════════════
//  리본 컨트롤 (사람 개입)
// ════════════════════════════════════════════════════════════════
const btnPlay=document.getElementById('btnPlay'), lbPlay=document.getElementById('lbPlay');
btnPlay.addEventListener('click', ()=>{
  G.paused=!G.paused;
  document.querySelector('#btnPlay .ic').textContent = G.paused?'▶':'❙❙';
  lbPlay.textContent = G.paused?'재생':'일시정지';
  btnPlay.classList.toggle('on', G.paused);
});
const btnSpeed=document.getElementById('btnSpeed'), lbSpeed=document.getElementById('lbSpeed');
btnSpeed.addEventListener('click', ()=>{
  G.speedIdx=(G.speedIdx+1)%SPEEDS.length; G.speed=SPEEDS[G.speedIdx];
  lbSpeed.textContent = G.speed.toFixed(1)+'×';
});
document.getElementById('btnWave').addEventListener('click', ()=>{
  // 즉시 다음 웨이브 강제 소환
  if (!G.waveActive){ G.interWave=0; planWave(); }
  else toast('현재 웨이브 진행 중 — 끝나면 자동 출항');
});
const btnAuto=document.getElementById('btnAuto'), lbAuto=document.getElementById('lbAuto');
function refreshAuto(){ btnAuto.classList.toggle('on', G.autopilot); lbAuto.textContent = G.autopilot?'AI 관전':'수동 조작'; }
refreshAuto();
btnAuto.addEventListener('click', ()=>{ G.autopilot=!G.autopilot; refreshAuto();
  toast(G.autopilot?'◆ 디펜더 AI 자동 운용':'◇ 수동 — 직접 포대를 건설하세요'); });

// 타워 건설 버튼
function setPlace(key){
  G.placeMode = (G.placeMode===key)?null:key;
  document.querySelectorAll('#btnT1,#btnT2,#btnT3').forEach(b=>b.classList.remove('on'));
  if (G.placeMode){
    document.getElementById({gun:'btnT1',how:'btnT2',slow:'btnT3'}[key]).classList.add('on');
    sheetEl.querySelectorAll('.cell').forEach(c=>c.classList.add('place'));
    toast(`${TOWER_DEF[key].name} 배치 모드 — 부두 셀 클릭 (비용 ${TOWER_DEF[key].cost})`);
  } else {
    sheetEl.querySelectorAll('.cell').forEach(c=>c.classList.remove('place'));
  }
}
document.getElementById('btnT1').addEventListener('click',()=>setPlace('gun'));
document.getElementById('btnT2').addEventListener('click',()=>setPlace('how'));
document.getElementById('btnT3').addEventListener('click',()=>setPlace('slow'));

// ════════════════════════════════════════════════════════════════
//  셀 클릭: 직접 건설 / 또는 정보 표시
// ════════════════════════════════════════════════════════════════
sheetEl.addEventListener('click', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  const i=+t.dataset.i;
  // 선택 표시
  if (G.selected>=0 && cellEls[G.selected]) cellEls[G.selected].classList.remove('sel');
  G.selected=i; t.classList.add('sel'); namebox.textContent=ref(i);

  if (G.placeMode){
    const ok=placeTower(i, G.placeMode, false);
    if (ok && G.defGold < TOWER_DEF[G.placeMode].cost) setPlace(G.placeMode); // 자금 떨어지면 모드 해제
    return;
  }
  // 정보
  const cl=cells[i];
  if (cl.tower){
    const def=TOWER_DEF[cl.tower.key];
    setFormula(`=TOWER("${def.name}", LV=${cl.tower.lv}, KILLS=${cl.tower.kills}, RNG=${(def.rng*(1+(cl.tower.lv-1)*0.18)).toFixed(1)})`);
    // 클릭으로 업그레이드(수동)
    if (!G.autopilot || true) {
      // 더블의도: 타워 정보만, 업그레이드는 길게 안내
    }
  } else if (cl.kind==='lane'||cl.kind==='spawn'||cl.kind==='port'){
    setFormula(`=LANE(${ref(i)}, "해적 항로 — 포대 설치 불가")`);
  } else if (cl.kind==='reef'){
    setFormula(`=REEF(${ref(i)}, "암초 — 설치 불가")`);
  } else {
    setFormula(`=DOCK(${ref(i)}, "부두 — 포대 설치 가능")`);
  }
});
// 타워 더블클릭 = 수동 업그레이드
sheetEl.addEventListener('dblclick', e=>{
  const t=e.target.closest('.cell'); if(!t) return;
  const i=+t.dataset.i;
  if (cells[i].tower) upgradeTower(i, false);
});

// ════════════════════════════════════════════════════════════════
//  재시작 (항만 함락 시)
// ════════════════════════════════════════════════════════════════
function restart(){
  G.defGold=55; G.portHP=100; G.portMax=100; G.wave=0; G.pirateBudget=18;
  G.ships=[]; G.spawnQueue=[]; G.kills=0; G.leaked=0; G.defScore=0; G.pirScore=0;
  G.tick=0; G.waveActive=false; G.interWave=60; G.killLog=[]; G.buildLog=[]; G.waveLog=[];
  G.over=false; G.paused=false; G.shipSeq=0;
  document.querySelector('#btnPlay .ic').textContent='❙❙'; lbPlay.textContent='일시정지'; btnPlay.classList.remove('on');
  buildMap(); paintAll();
  logEvent('새 항만 방어전 시작 — 양측 AI 교전', '=RESTART()');
  toast('[재시작] 새 방어전');
}

// ════════════════════════════════════════════════════════════════
//  반응형 리빌드
// ════════════════════════════════════════════════════════════════
let rzT=0;
window.addEventListener('resize', ()=>{
  clearTimeout(rzT);
  rzT=setTimeout(()=>{
    const oldC=COLS, oldR=ROWS; computeGrid();
    if (COLS!==oldC||ROWS!==oldR){ buildSheet(); restart(); }
  }, 220);
});

// ════════════════════════════════════════════════════════════════
//  메인 루프 (requestAnimationFrame 기반, 고정 틱)
// ════════════════════════════════════════════════════════════════
setFormula(`=TOWER.DEFENSE($A$1:$${colName(COLS-1)}$${ROWS}, "해적 함대 vs 항만 포대")`);
logEvent('항만 방어 시뮬레이션 시작 — 양측 AI 교전 중', `=SIM.START("관전 모드", AI_BOTH=TRUE)`);
updateHUD();

let acc=0, last=performance.now();
const TICK_MS=90;
function loop(now){
  const dt=now-last; last=now;
  if (!G.paused){
    acc+=dt;
    let guard=0;
    while (acc>=TICK_MS && guard++<5){ step(); acc-=TICK_MS; }
  } else { acc=0; }
  requestAnimationFrame(loop);
}
// 첫 웨이브 즉시 시작(첫 페인트가 곧 동작하는 스프레드시트)
G.interWave=14;
requestAnimationFrame(loop);

})();
</script>
