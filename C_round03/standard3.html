<!DOCTYPE html>
<html lang="ko" data-lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buylow — 브랜드 × 글로벌 인플루언서 매칭</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Pretendard', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
        colors: {
          brand: {
            50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd',
            400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9',
            800: '#5b21b6', 900: '#4c1d95',
          },
        },
        boxShadow: {
          soft: '0 10px 40px -10px rgba(0,0,0,.08)',
          card: '0 4px 20px -2px rgba(0,0,0,.05)',
          glow: '0 18px 50px -12px rgba(124,58,237,.45)',
        },
        keyframes: {
          fadeIn: { '0%': { opacity: 0, transform: 'translateY(10px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
          float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
          ping2: { '75%,100%': { transform: 'scale(2)', opacity: 0 } },
        },
        animation: {
          fadeIn: 'fadeIn .5s ease both',
          float: 'float 6s ease-in-out infinite',
          ping2: 'ping2 1.4s cubic-bezier(0,0,.2,1) infinite',
        },
      },
    },
  };
</script>
<style>
  html { scroll-behavior: smooth; }
  body { background-color: #f8fafc; overflow-x: hidden; }
  .gradient-text {
    background: linear-gradient(135deg, #7c3aed, #a78bfa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .glass-nav { background: rgba(255,255,255,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .glass-card { background: rgba(255,255,255,.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  [data-route-view] { display: none; }
  [data-route-view].is-active { display: block; animation: fadeIn .45s ease both; }
  [data-route-view], [data-route-view] > * { max-width: 100%; }
  [data-visible-state][hidden] { display: none !important; }
  .typing-dot { animation: float 1.1s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body class="font-sans text-slate-900 antialiased">

  <!-- ============ DECOR BLOBS ============ -->
  <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -top-32 -left-24 h-[28rem] w-[28rem] rounded-full bg-brand-100/60 blur-3xl"></div>
    <div class="absolute top-[30%] -right-32 h-[26rem] w-[26rem] rounded-full bg-indigo-100/50 blur-3xl"></div>
    <div class="absolute bottom-0 left-1/3 h-[22rem] w-[22rem] rounded-full bg-brand-50 blur-3xl"></div>
  </div>

  <!-- ============ TOP NAV (glass) ============ -->
  <header class="glass-nav sticky top-0 z-40 border-b border-slate-100">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
      <a href="#/home" data-action="navigate" data-route="home" class="flex items-center gap-2.5 shrink-0">
        <span class="grid h-9 w-9 place-items-center rounded-2xl bg-gradient-to-br from-brand-600 to-indigo-600 text-white shadow-glow">
          <i data-lucide="badge-check" class="h-5 w-5"></i>
        </span>
        <span class="text-xl font-extrabold tracking-tight">Buylow</span>
      </a>

      <!-- desktop nav -->
      <nav class="hidden items-center gap-1 lg:flex" aria-label="primary">
        <a href="#/home" data-action="navigate" data-route="home" data-nav-link class="rounded-full px-3.5 py-2 text-sm font-semibold text-slate-600 transition hover:bg-brand-50 hover:text-brand-700"><span data-i18n="nav.home"></span></a>
        <a href="#/directory" data-action="navigate" data-route="directory" data-nav-link class="rounded-full px-3.5 py-2 text-sm font-semibold text-slate-600 transition hover:bg-brand-50 hover:text-brand-700"><span data-i18n="nav.directory"></span></a>
        <a href="#/match" data-action="navigate" data-route="match" data-nav-link class="rounded-full px-3.5 py-2 text-sm font-semibold text-slate-600 transition hover:bg-brand-50 hover:text-brand-700"><span data-i18n="nav.match"></span></a>
        <a href="#/forecast" data-action="navigate" data-route="forecast" data-nav-link class="rounded-full px-3.5 py-2 text-sm font-semibold text-slate-600 transition hover:bg-brand-50 hover:text-brand-700"><span data-i18n="nav.forecast"></span></a>
        <a href="#/chat" data-action="navigate" data-route="chat" data-nav-link class="rounded-full px-3.5 py-2 text-sm font-semibold text-slate-600 transition hover:bg-brand-50 hover:text-brand-700"><span data-i18n="nav.chat"></span></a>
        <a href="#/create" data-action="navigate" data-route="create" data-nav-link class="rounded-full px-3.5 py-2 text-sm font-semibold text-slate-600 transition hover:bg-brand-50 hover:text-brand-700"><span data-i18n="nav.create"></span></a>
        <a href="#/escrow" data-action="navigate" data-route="escrow" data-nav-link class="rounded-full px-3.5 py-2 text-sm font-semibold text-slate-600 transition hover:bg-brand-50 hover:text-brand-700"><span data-i18n="nav.escrow"></span></a>
      </nav>

      <div class="flex items-center gap-2">
        <!-- role switcher -->
        <div class="hidden items-center rounded-full border border-slate-200 bg-white/70 p-0.5 text-xs font-semibold sm:flex" role="group" aria-label="role">
          <button data-action="set-role" data-role="brand" data-role-btn class="rounded-full px-3 py-1.5 transition"><span data-i18n="role.brand"></span></button>
          <button data-action="set-role" data-role="creator" data-role-btn class="rounded-full px-3 py-1.5 transition"><span data-i18n="role.creator"></span></button>
        </div>
        <!-- health dot -->
        <span class="hidden items-center gap-1.5 rounded-full bg-emerald-50 px-2.5 py-1.5 text-xs font-semibold text-emerald-700 md:flex">
          <span class="relative flex h-2 w-2"><span class="absolute inline-flex h-full w-full animate-ping2 rounded-full bg-emerald-400"></span><span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span></span>
          <span data-i18n="nav.live"></span>
        </span>
        <!-- lang -->
        <button data-action="toggle-lang" class="flex items-center gap-1 rounded-full border border-slate-200 bg-white/70 px-3 py-1.5 text-xs font-bold text-slate-700 transition hover:border-brand-300 hover:text-brand-700">
          <i data-lucide="languages" class="h-3.5 w-3.5"></i><span data-bind="lang-label">KO</span>
        </button>
        <!-- primary CTA -->
        <a href="#/create" data-action="navigate" data-route="create" class="hidden items-center gap-1.5 rounded-full bg-gradient-to-r from-brand-600 to-indigo-600 px-4 py-2 text-sm font-bold text-white shadow-lg shadow-brand-500/30 transition hover:-translate-y-0.5 sm:flex">
          <i data-lucide="rocket" class="h-4 w-4"></i><span data-i18n="cta.start"></span>
        </a>
        <!-- hamburger -->
        <button data-action="toggle-menu" class="grid h-10 w-10 place-items-center rounded-full border border-slate-200 bg-white/70 text-slate-700 lg:hidden" aria-label="menu">
          <i data-lucide="menu" class="h-5 w-5"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- mobile menu panel -->
  <div data-bind="mobile-menu" class="fixed inset-0 z-50 hidden lg:hidden">
    <div data-action="toggle-menu" class="absolute inset-0 bg-slate-900/30 backdrop-blur-sm"></div>
    <div class="absolute right-0 top-0 flex h-full w-[82%] max-w-sm flex-col bg-white shadow-2xl animate-fadeIn">
      <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
        <span class="text-lg font-extrabold tracking-tight">Buylow</span>
        <button data-action="toggle-menu" class="grid h-9 w-9 place-items-center rounded-full bg-slate-100 text-slate-600" aria-label="close"><i data-lucide="x" class="h-5 w-5"></i></button>
      </div>
      <nav class="flex flex-1 flex-col gap-1 overflow-y-auto p-4" aria-label="mobile">
        <a href="#/home" data-action="navigate" data-route="home" data-nav-link-m class="flex items-center gap-3 rounded-2xl px-4 py-3 text-base font-semibold text-slate-700 transition hover:bg-brand-50"><i data-lucide="home" class="h-5 w-5 text-brand-500"></i><span data-i18n="nav.home"></span></a>
        <a href="#/directory" data-action="navigate" data-route="directory" data-nav-link-m class="flex items-center gap-3 rounded-2xl px-4 py-3 text-base font-semibold text-slate-700 transition hover:bg-brand-50"><i data-lucide="layout-grid" class="h-5 w-5 text-brand-500"></i><span data-i18n="nav.directory"></span></a>
        <a href="#/match" data-action="navigate" data-route="match" data-nav-link-m class="flex items-center gap-3 rounded-2xl px-4 py-3 text-base font-semibold text-slate-700 transition hover:bg-brand-50"><i data-lucide="handshake" class="h-5 w-5 text-brand-500"></i><span data-i18n="nav.match"></span></a>
        <a href="#/forecast" data-action="navigate" data-route="forecast" data-nav-link-m class="flex items-center gap-3 rounded-2xl px-4 py-3 text-base font-semibold text-slate-700 transition hover:bg-brand-50"><i data-lucide="trending-up" class="h-5 w-5 text-brand-500"></i><span data-i18n="nav.forecast"></span></a>
        <a href="#/chat" data-action="navigate" data-route="chat" data-nav-link-m class="flex items-center gap-3 rounded-2xl px-4 py-3 text-base font-semibold text-slate-700 transition hover:bg-brand-50"><i data-lucide="message-circle" class="h-5 w-5 text-brand-500"></i><span data-i18n="nav.chat"></span></a>
        <a href="#/create" data-action="navigate" data-route="create" data-nav-link-m class="flex items-center gap-3 rounded-2xl px-4 py-3 text-base font-semibold text-slate-700 transition hover:bg-brand-50"><i data-lucide="sparkles" class="h-5 w-5 text-brand-500"></i><span data-i18n="nav.create"></span></a>
        <a href="#/escrow" data-action="navigate" data-route="escrow" data-nav-link-m class="flex items-center gap-3 rounded-2xl px-4 py-3 text-base font-semibold text-slate-700 transition hover:bg-brand-50"><i data-lucide="shield-check" class="h-5 w-5 text-brand-500"></i><span data-i18n="nav.escrow"></span></a>
      </nav>
      <div class="border-t border-slate-100 p-4">
        <div class="mb-3 flex items-center rounded-full border border-slate-200 p-0.5 text-sm font-semibold">
          <button data-action="set-role" data-role="brand" data-role-btn class="flex-1 rounded-full px-3 py-2 transition"><span data-i18n="role.brand"></span></button>
          <button data-action="set-role" data-role="creator" data-role-btn class="flex-1 rounded-full px-3 py-2 transition"><span data-i18n="role.creator"></span></button>
        </div>
        <a href="#/create" data-action="navigate" data-route="create" class="flex items-center justify-center gap-2 rounded-2xl bg-slate-900 px-4 py-3 text-base font-bold text-white"><i data-lucide="rocket" class="h-4 w-4"></i><span data-i18n="cta.start"></span></a>
      </div>
    </div>
  </div>

  <!-- ============ MAIN ============ -->
  <main class="mx-auto max-w-7xl overflow-x-clip px-4 pb-28 pt-8 sm:px-6 lg:pb-16">

    <!-- ============================ HOME ============================ -->
    <section data-route-view="home" aria-label="home">
      <!-- hero -->
      <div class="grid items-center gap-10 lg:grid-cols-[1.05fr_1fr]">
        <div class="min-w-0 animate-fadeIn">
          <span class="inline-flex items-center gap-2 rounded-full bg-brand-50 px-3.5 py-1.5 text-xs font-bold text-brand-700">
            <i data-lucide="sparkles" class="h-3.5 w-3.5"></i><span data-i18n="home.eyebrow"></span>
          </span>
          <h1 class="mt-5 text-4xl font-extrabold leading-[1.12] tracking-tight sm:text-5xl">
            <span data-i18n="home.hero1"></span><br />
            <span class="gradient-text" data-i18n="home.hero2"></span>
          </h1>
          <p class="mt-5 max-w-xl text-base leading-relaxed text-slate-600 sm:text-lg" data-i18n="home.heroBody"></p>

          <!-- search -->
          <div class="mt-7 flex max-w-xl items-center gap-2 rounded-2xl border border-slate-200 bg-white p-2 shadow-card">
            <i data-lucide="search" class="ml-2 h-5 w-5 text-slate-400"></i>
            <input data-bind="home-search" class="min-w-0 flex-1 bg-transparent px-1 py-2 text-sm outline-none placeholder:text-slate-400" data-i18n-ph="home.searchPh" />
            <button data-action="navigate" data-route="directory" class="rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 px-5 py-2.5 text-sm font-bold text-white shadow-lg shadow-brand-500/30 transition hover:-translate-y-0.5"><span data-i18n="home.searchBtn"></span></button>
          </div>

          <!-- feature chips -->
          <div class="mt-6 flex flex-wrap gap-2">
            <button data-action="navigate" data-route="directory" class="flex items-center gap-2 rounded-2xl border border-slate-200 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 transition hover:-translate-y-0.5 hover:border-brand-300 hover:text-brand-700"><i data-lucide="layout-grid" class="h-4 w-4 text-brand-500"></i><span data-i18n="nav.directory"></span></button>
            <button data-action="navigate" data-route="match" class="flex items-center gap-2 rounded-2xl border border-slate-200 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 transition hover:-translate-y-0.5 hover:border-brand-300 hover:text-brand-700"><i data-lucide="handshake" class="h-4 w-4 text-indigo-500"></i><span data-i18n="nav.match"></span></button>
            <button data-action="navigate" data-route="forecast" class="flex items-center gap-2 rounded-2xl border border-slate-200 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 transition hover:-translate-y-0.5 hover:border-brand-300 hover:text-brand-700"><i data-lucide="trending-up" class="h-4 w-4 text-rose-500"></i><span data-i18n="nav.forecast"></span></button>
            <button data-action="navigate" data-route="escrow" class="flex items-center gap-2 rounded-2xl border border-slate-200 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 transition hover:-translate-y-0.5 hover:border-brand-300 hover:text-brand-700"><i data-lucide="shield-check" class="h-4 w-4 text-emerald-500"></i><span data-i18n="nav.escrow"></span></button>
          </div>

          <!-- stats -->
          <div class="mt-8 flex flex-wrap gap-8" data-bind="home-stats"></div>
        </div>

        <!-- floating chat mockup card -->
        <div class="relative min-w-0 animate-fadeIn">
          <div class="absolute -right-4 -top-4 z-10 hidden animate-float items-center gap-2 rounded-2xl border border-emerald-100 bg-white px-3.5 py-2.5 text-xs font-bold text-emerald-700 shadow-soft sm:flex">
            <i data-lucide="shield-check" class="h-4 w-4"></i><span data-i18n="home.escrowBadge"></span> <span class="text-slate-900">$2,800</span>
          </div>
          <div class="rounded-[2rem] border border-slate-100 bg-white p-5 shadow-soft">
            <div class="flex items-center gap-3 border-b border-slate-100 pb-4">
              <img src="https://i.pravatar.cc/120?img=47" alt="" class="h-12 w-12 rounded-full object-cover ring-2 ring-brand-100" />
              <div class="min-w-0 flex-1">
                <p class="truncate text-sm font-bold">Aria Nakamura</p>
                <p class="flex items-center gap-1.5 text-xs text-slate-500"><span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span><span data-i18n="home.online"></span> · Tokyo</p>
              </div>
              <span class="rounded-full bg-brand-50 px-2.5 py-1 text-[11px] font-bold text-brand-700">ROAS 512%</span>
            </div>
            <div class="space-y-3 py-4">
              <div class="max-w-[85%] rounded-2xl rounded-tl-md bg-slate-100 px-3.5 py-2.5 text-sm text-slate-700" data-i18n="home.chat1"></div>
              <div class="ml-auto max-w-[85%] rounded-2xl rounded-tr-md bg-gradient-to-br from-brand-600 to-indigo-600 px-3.5 py-2.5 text-sm text-white shadow-glow" data-i18n="home.chat2"></div>
              <div class="max-w-[85%] rounded-2xl rounded-tl-md bg-slate-100 px-3.5 py-2.5 text-sm text-slate-700" data-i18n="home.chat3"></div>
            </div>
            <div class="flex items-center gap-2 rounded-2xl bg-slate-50 p-2">
              <input class="min-w-0 flex-1 bg-transparent px-2 text-sm outline-none placeholder:text-slate-400" data-i18n-ph="chat.inputPh" disabled />
              <button data-action="navigate" data-route="chat" class="rounded-xl bg-brand-600 px-3.5 py-2 text-xs font-bold text-white"><span data-i18n="home.openChat"></span></button>
            </div>
          </div>
        </div>
      </div>

      <!-- 3-step flow -->
      <div class="mt-16">
        <div class="mb-6 flex items-end justify-between">
          <h2 class="text-2xl font-extrabold tracking-tight" data-i18n="home.flowTitle"></h2>
          <span class="hidden text-sm text-slate-500 sm:block" data-i18n="home.flowHint"></span>
        </div>
        <div class="grid gap-4 md:grid-cols-3" data-bind="home-flow"></div>
      </div>

      <!-- recommended influencers -->
      <div class="mt-14">
        <div class="mb-6 flex items-end justify-between">
          <h2 class="text-2xl font-extrabold tracking-tight" data-i18n="home.recoTitle"></h2>
          <button data-action="navigate" data-route="directory" class="text-sm font-semibold text-brand-700 hover:underline" data-i18n="home.viewAll"></button>
        </div>
        <div class="-mx-1 flex gap-4 overflow-x-auto px-1 pb-2 no-scrollbar" data-bind="home-creators"></div>
      </div>
    </section>

    <!-- ============================ DIRECTORY ============================ -->
    <section data-route-view="directory" aria-label="directory">
      <div class="rounded-[2rem] border border-slate-100 bg-white p-6 shadow-card sm:p-8">
        <span class="text-xs font-bold uppercase tracking-widest text-brand-600">Discovery</span>
        <h1 class="mt-3 text-3xl font-extrabold tracking-tight sm:text-4xl" data-i18n="dir.title"></h1>
        <p class="mt-3 max-w-2xl text-slate-600" data-i18n="dir.body"></p>
        <div class="mt-6 flex max-w-2xl items-center gap-2 rounded-2xl border border-slate-200 bg-slate-50 p-2">
          <i data-lucide="search" class="ml-2 h-5 w-5 text-slate-400"></i>
          <input data-bind="dir-search" data-action="dir-filter" class="min-w-0 flex-1 bg-transparent px-1 py-2 text-sm outline-none placeholder:text-slate-400" data-i18n-ph="dir.searchPh" />
        </div>
        <div class="mt-4 flex flex-wrap gap-2" data-bind="dir-chips"></div>
      </div>

      <h2 class="mb-4 mt-10 text-xl font-extrabold tracking-tight" data-i18n="dir.featured"></h2>
      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3" data-bind="dir-featured"></div>

      <div class="mb-4 mt-10 flex items-end justify-between">
        <h2 class="text-xl font-extrabold tracking-tight"><span data-i18n="dir.results"></span> <span data-bind="dir-count" class="text-brand-600"></span></h2>
      </div>
      <div class="grid gap-4 lg:grid-cols-2" data-bind="dir-list"></div>
    </section>

    <!-- ============================ MATCH ============================ -->
    <section data-route-view="match" aria-label="match">
      <div class="rounded-[2rem] border border-slate-100 bg-white p-6 shadow-card sm:p-8">
        <span class="text-xs font-bold uppercase tracking-widest text-brand-600">Deal Flow</span>
        <h1 class="mt-3 text-3xl font-extrabold tracking-tight sm:text-4xl" data-i18n="match.title"></h1>
        <p class="mt-3 max-w-2xl text-slate-600" data-i18n="match.body"></p>
        <div class="mt-6 grid grid-cols-3 gap-3" data-bind="match-summary"></div>
      </div>

      <div class="mt-8 grid gap-6 lg:grid-cols-[0.9fr_1.1fr]">
        <!-- new offer -->
        <div class="rounded-3xl border border-slate-100 bg-white p-6 shadow-card">
          <h2 class="text-lg font-extrabold tracking-tight" data-i18n="match.newOffer"></h2>
          <p class="mt-1 text-sm text-slate-500" data-i18n="match.newOfferBody"></p>
          <div class="mt-5 space-y-4">
            <label class="block">
              <span class="mb-1.5 block text-xs font-bold text-slate-500" data-i18n="match.target"></span>
              <select data-bind="offer-target" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-brand-400"></select>
            </label>
            <label class="block">
              <span class="mb-1.5 block text-xs font-bold text-slate-500" data-i18n="match.message"></span>
              <textarea data-bind="offer-message" rows="3" class="w-full resize-none rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-brand-400">다음 롤아웃을 위한 다이렉트 라인을 열고 여기서 조건을 확정하시죠.</textarea>
            </label>
            <label class="block">
              <span class="mb-1.5 block text-xs font-bold text-slate-500" data-i18n="match.amount"></span>
              <div class="flex items-center rounded-xl border border-slate-200 bg-slate-50 px-3 focus-within:border-brand-400">
                <span class="text-sm font-bold text-slate-400">$</span>
                <input data-bind="offer-amount" type="number" value="2200" class="w-full bg-transparent px-2 py-2.5 text-sm outline-none" />
              </div>
            </label>
            <button data-action="send-offer" class="flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-brand-600 to-indigo-600 px-4 py-3 text-sm font-bold text-white shadow-lg shadow-brand-500/30 transition hover:-translate-y-0.5">
              <i data-lucide="send" class="h-4 w-4"></i><span data-i18n="match.send"></span>
            </button>

    }
  }

  // ---- escrow ----
  function renderEscrow() {
    var total = DATA.escrow.filter(function (p) { return p.status === "held"; }).reduce(function (a, p) { return a + p.amount; }, 0);
    var tEl = bind("esc-total"); if (tEl) tEl.textContent = "$" + total.toLocaleString();
    var ko = state.lang === "ko";
    var steps = [
      { icon: "handshake", title: ko ? "딜 합의" : "Deal agreed", done: true },
      { icon: "lock", title: ko ? "에스크로 보관" : "Held in escrow", done: true },
      { icon: "package-check", title: ko ? "결과물 검수" : "Deliverable review", done: false, active: true },
      { icon: "unlock", title: ko ? "정산 해제" : "Released", done: false },
    ];
    var stEl = bind("esc-steps");
    if (stEl) stEl.innerHTML = steps.map(function (s, i) {
      var cls = s.done ? "bg-emerald-50 text-emerald-700 border-emerald-200" : (s.active ? "bg-brand-50 text-brand-700 border-brand-200" : "bg-slate-50 text-slate-400 border-slate-200");
      return '<div class="rounded-2xl border ' + cls + ' p-4 text-center">' +
        '<span class="mx-auto grid h-10 w-10 place-items-center rounded-full bg-white shadow-sm"><i data-lucide="' + (s.done ? "check" : s.icon) + '" class="h-5 w-5"></i></span>' +
        '<p class="mt-2 text-xs font-bold">' + esc(s.title) + '</p>' +
        '<p class="mt-0.5 text-[11px] opacity-70">Step ' + (i + 1) + '</p>' +
      '</div>';
    }).join("");

    var lEl = bind("esc-ledger");
    if (lEl) lEl.innerHTML = DATA.escrow.map(function (p) {
      var color = p.status === "released" ? "emerald" : "amber";
      return '<div class="flex items-center justify-between gap-3 rounded-2xl border border-slate-100 p-4">' +
        '<div><p class="text-sm font-bold">' + p.currency + ' ' + p.amount.toLocaleString() + ' · ' + esc(p.ms) + '</p>' +
        '<p class="text-xs text-slate-500">' + esc(p.payer) + ' → ' + esc(p.payee) + '</p></div>' +
        '<span class="rounded-full bg-' + color + '-50 px-2.5 py-1 text-[11px] font-bold text-' + color + '-700">' + esc(p.status) + '</span>' +
      '</div>';
    }).join("");

    var held = DATA.escrow.filter(function (p) { return p.status === "held"; })[0];
    if (held) {
      var nm = bind("esc-ms-name"); if (nm) nm.textContent = held.ms;
      var am = bind("esc-ms-amount"); if (am) am.textContent = "$" + held.amount.toLocaleString();
    }
    icons();
  }

  function renderAll() {
    renderHomeStats(); renderHomeFlow(); renderHomeCreators();
    renderDirChips(); renderDirectory();
    renderMatch();
    renderForecastTargets();
    renderChatThreads(); renderChatThread();
    renderCreateCampaigns(); applyPreviewMode(); renderPreview();
    renderEscrow();
  }

  // =========================================================================
  // MENU / SOURCE WINDOW
  // =========================================================================
  function openMenu() { var m = bind("mobile-menu"); if (m) m.classList.remove("hidden"); }
  function closeMenu() { var m = bind("mobile-menu"); if (m) m.classList.add("hidden"); }
  function toggleMenu() { var m = bind("mobile-menu"); if (m) m.classList.toggle("hidden"); icons(); }
  function openSource() {
    var w = bind("source-window"); var b = bind("source-body");
    if (b) b.textContent = (state.lang === "ko" ? DEAL_TERMS.ko : DEAL_TERMS.en);
    if (w) w.classList.remove("hidden");
    icons();
  }
  function closeSource() { var w = bind("source-window"); if (w) w.classList.add("hidden"); }

  // =========================================================================
  // CHAT STATE MACHINE (locked invariants)
  // =========================================================================
  function submitQuestion(text, clientActionId) {
    // Invariant 1: ignore SUBMIT while a job is active for same chat unless new clientActionId
    if (state.chat.activeJob && state.chat.activeJob.chatId === state.chat.activeId) {
      if (state.chat.activeJob.clientActionId === clientActionId) return;
      return; // already running for this chat
    }
    var th = state.chat.threads[state.chat.activeId];
    if (!th || !text.trim()) return;
    // Invariant 2: exactly one user msg + one assistant placeholder per submit
    th.msgs.push({ role: "me", text: text.trim() });
    var assistantIdx = th.msgs.push({ role: "peer", text: "", pending: true }) - 1;
    renderChatThread();
    setAppState("submitting");
    refreshChatComposerState();

    var job = api.submitChat(state.chat.activeId, text.trim(),
      function onStatus(jobId, status) {
        if (!state.chat.activeJob || state.chat.activeJob.jobId !== jobId) return; // ownership
        setAppState(status); // queued | running
        refreshChatComposerState();
      },
      function onResult(jobId, reply) {
        // Invariant 3 & 5: result attaches only to placeholder owning same jobId & chat
        var aj = state.chat.activeJob;
        if (!aj || aj.jobId !== jobId) return;
        var owner = state.chat.threads[aj.chatId];
        if (owner && owner.msgs[aj.assistantIdx] && owner.msgs[aj.assistantIdx].pending) {
          owner.msgs[aj.assistantIdx] = { role: "peer", text: reply };
        }
        state.chat.activeJob = null;
        setAppState("completed");
        if (aj.chatId === state.chat.activeId) renderChatThread();
        renderChatThreads();
        // settle back to idle for composer
        setAppState("idle"); refreshChatComposerState();
      },
      function onFail() {});
    state.chat.activeJob = { jobId: job.jobId, _timer: job._timer, chatId: state.chat.activeId, assistantIdx: assistantIdx, clientActionId: clientActionId };
  }
  function cancelJob() {
    var aj = state.chat.activeJob; if (!aj) return;
    setAppState("cancelling");
    if (aj._timer) clearTimeout(aj._timer);
    // Invariant 4: cancelled jobs must not append answers later — remove pending placeholder
    var th = state.chat.threads[aj.chatId];
    if (th && th.msgs[aj.assistantIdx] && th.msgs[aj.assistantIdx].pending) {
      th.msgs.splice(aj.assistantIdx, 1);
    }
    state.chat.activeJob = null;
    setAppState("cancelled");
    if (aj.chatId === state.chat.activeId) renderChatThread();
    refreshChatComposerState();
    setTimeout(function () { if (state.appState === "cancelled") { setAppState("idle"); refreshChatComposerState(); } }, 2200);
  }

  // =========================================================================
  // FORECAST RUN
  // =========================================================================
  var fcJob = null;
  function runForecast() {
    if (fcJob && fcJob._iv) clearInterval(fcJob._iv);
    setFcState("submitting");
    var creatorId = (bind("fc-creator") && bind("fc-creator").value) || DATA.creators[0].id;
    var budget = Number((bind("fc-budget") && bind("fc-budget").value) || 3000) || 3000;
    var pl = bind("fc-progress-label"); if (pl) pl.textContent = (state.lang === "ko" ? "예측 0%" : "Forecast 0%");
    var bar = bind("fc-progress-bar"); if (bar) bar.style.width = "0%";
    setTimeout(function () { setFcState("queued"); setTimeout(function () { setFcState("running"); }, 250); }, 200);
    fcJob = api.runForecast(creatorId, budget,
      function onProgress(pct) {
        var pl2 = bind("fc-progress-label"); if (pl2) pl2.textContent = (state.lang === "ko" ? "예측 " : "Forecast ") + pct + "%";
        var b2 = bind("fc-progress-bar"); if (b2) b2.style.width = pct + "%";
      },
      function onResult(res) {
        renderForecastResult(res);
        setFcState("completed");
        fcJob = null;
      },
      function onFail() { setFcState("failed"); fcJob = null; });
  }

  // =========================================================================
  // EVENT DELEGATION (single listener — invariant 11)
  // =========================================================================
  function handleAction(action, el, ev) {
    switch (action) {
      case "navigate": {
        var r = el.getAttribute("data-route");
        if (r) location.hash = "#/" + r;
        break;
      }
      case "toggle-menu": toggleMenu(); break;
      case "toggle-lang":
        state.lang = state.lang === "ko" ? "en" : "ko";
        applyI18n(); renderAll(); refreshChatComposerState(); icons();
        break;
      case "set-role":
        state.role = el.getAttribute("data-role"); applyRole(); renderHomeStats(); icons();
        break;
      case "dir-chip": {
        var chip = el.getAttribute("data-chip");
        var inp = bind("dir-search"); if (inp) inp.value = chip;
        state.dirQuery = chip; renderDirectory();
        break;
      }
      case "propose": {
        var cid = el.getAttribute("data-creator");
        var sel = bind("offer-target"); if (sel && cid) sel.value = cid;
        location.hash = "#/match";
        break;
      }
      case "send-offer": {
        var sel2 = bind("offer-target");
        var targetId = sel2 ? sel2.value : DATA.creators[0].id;
        var amount = Number((bind("offer-amount") && bind("offer-amount").value) || 0) || 0;
        var msg = (bind("offer-message") && bind("offer-message").value) || "";
        var o = { id: api._newId("o").slice(-7), target: targetId, message: msg, amount: amount, status: "negotiating", conv: "cv-1" };
        DATA.offers.unshift(o);
        // also create escrow held entry
        DATA.escrow.unshift({ id: api._newId("p"), currency: "USD", amount: amount, status: "held", payer: state.role === "brand" ? "My Brand" : "Partner", payee: DATA.nameById[targetId] || "Creator", ms: "Kickoff" });
        renderMatch(); renderEscrow();
        var toast = bind("offer-toast"); if (toast) { toast.textContent = t("match.toast"); toast.classList.remove("hidden"); }
        break;
      }
      case "open-source": setAppState("source_open"); openSource(); break;
      case "close-source": closeSource(); setAppState("idle"); refreshChatComposerState(); break;
      case "select-chat": {
        var ch = el.getAttribute("data-chat");
        if (ch && state.chat.threads[ch]) {
          state.chat.activeId = ch;
          // do not carry active job visuals across chats; only show composer state if job belongs here
          renderChatThreads(); renderChatThread();
          if (!state.chat.activeJob || state.chat.activeJob.chatId !== ch) { setAppState("idle"); }
          refreshChatComposerState();
        }
        break;
      }
      case "create-chat": {
        var id = api._newId("cv");
        var imgs = [9, 11, 24, 33]; var img = imgs[Math.floor(Math.random() * imgs.length)];
        state.chat.threads[id] = { peer: state.lang === "ko" ? "새 파트너" : "New partner", img: img, msgs: [{ role: "peer", text: state.lang === "ko" ? "안녕하세요! 협업 논의 시작할까요?" : "Hi! Shall we start discussing the collab?" }] };
        state.chat.activeId = id;
        setAppState("idle");
        renderChatThreads(); renderChatThread(); refreshChatComposerState();
        break;
      }
      case "cancel-job": cancelJob(); break;
      case "retry-job":
      case "submit-question": break; // handled in submit listener / not here
      case "run-forecast": runForecast(); break;
      case "set-preview-mode": state.previewMode = el.getAttribute("data-mode"); applyPreviewMode(); renderPreview(); break;
      case "render-preview": renderPreview(); break;
      case "create-campaign": {
        var title = (bind("c-title") && bind("c-title").value.trim()) || "";
        if (!title) { var ti = bind("c-title"); if (ti) ti.focus(); break; }
        DATA.campaigns.unshift({
          id: api._newId("c"), title: title,
          regions: ((bind("c-regions") && bind("c-regions").value) || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean),
          min: Number((bind("c-min") && bind("c-min").value) || 0) || 0,
          max: Number((bind("c-max") && bind("c-max").value) || 0) || 0,
          platforms: ((bind("c-platforms") && bind("c-platforms").value) || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean),
          status: "open", applicants: 0,
        });
        renderCreateCampaigns(); renderHomeStats();
        var ct = bind("c-toast"); if (ct) { ct.textContent = t("create.cToast"); ct.classList.remove("hidden"); }
        if (bind("c-title")) bind("c-title").value = "";
        break;
      }
      case "apply-campaign": {
        var at = bind("create-campaigns");
        // create a chat thread and jump
        var nid = api._newId("cv");
        state.chat.threads[nid] = { peer: state.lang === "ko" ? "브랜드 담당자" : "Brand manager", img: 60, msgs: [
          { role: "me", text: (bind("a-message") && bind("a-message").value) || "" },
          { role: "peer", text: state.lang === "ko" ? "지원 감사합니다! 견적 확인 후 회신드릴게요." : "Thanks for applying! We'll get back after reviewing your quote." },
        ] };
        state.chat.activeId = nid;
        setAppState("idle");
        renderChatThreads(); renderChatThread();
        location.hash = "#/chat";
        break;
      }
      case "release-escrow": {
        var held = DATA.escrow.filter(function (p) { return p.status === "held"; })[0];
        if (held) held.status = "released";
        renderEscrow();
        var et = bind("esc-toast"); if (et) { et.textContent = t("esc.released"); et.classList.remove("hidden"); }
        break;
      }
    }
  }

  function init() {
    // single delegated click listener
    document.addEventListener("click", function (ev) {
      var el = ev.target.closest("[data-action]");
      if (!el) return;
      var action = el.getAttribute("data-action");
      // links/buttons that navigate: prevent default anchor jump handled via hash anyway
      if (action === "navigate" && el.tagName === "A") { /* allow hash change naturally too */ }
      if (action !== "submit-question") {
        if (el.tagName === "A" && el.getAttribute("href") && el.getAttribute("href").indexOf("#") === 0) {
          // let hash change fire; still run handler for side effects (menu close etc.)
        }
        handleAction(action, el, ev);
      }
    });

    // chat submit (form) — idempotent via clientActionId
    document.addEventListener("submit", function (ev) {
      var form = ev.target.closest('[data-action="submit-question"]');
      if (!form) return;
      ev.preventDefault();
      var input = bind("chat-input");
      var text = input ? input.value : "";
      if (!text.trim()) return;
      var clientActionId = api._newId("ca");
      submitQuestion(text, clientActionId);
      if (input) input.value = "";
    });

    // dir filter (input)
    document.addEventListener("input", function (ev) {
      var el = ev.target.closest('[data-action="dir-filter"]');
      if (el) { state.dirQuery = el.value; renderDirectory(); }
    });

    // composing state when typing in chat
    document.addEventListener("input", function (ev) {
      if (ev.target === bind("chat-input")) {
        if (state.route === "chat" && !state.chat.activeJob) {
          setAppState(ev.target.value ? "composing" : "idle");
          refreshChatComposerState();
        }
      }
    });

    // network state machine hooks (NETWORK_OFFLINE/ONLINE)
    window.addEventListener("offline", function () { /* state hook present per contract */ });
    window.addEventListener("online", function () { /* resume hook */ });

    window.addEventListener("hashchange", renderRoute);

    // BOOT -> idle, first paint is HOME (no splash)
    // hide every state-gated block first, then let state machines reveal the right one
    $all("[data-visible-state]").forEach(function (el) { el.setAttribute("hidden", ""); });
    applyI18n();
    applyRole();
    renderAll();
    setAppState("idle");
    setFcState("idle");
    if (!location.hash) location.hash = "#/home";
    renderRoute();
    icons();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
