<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'] },

        keyframes: {
          fadeUp:{ '0%':{opacity:'0',transform:'translateY(10px)'}, '100%':{opacity:'1',transform:'translateY(0)'} },

          shimmer:{ '0%':{backgroundPosition:'-200% 0'}, '100%':{backgroundPosition:'200% 0'} },
          pingdot:{ '0%':{transform:'scale(1)',opacity:'.7'}, '100%':{transform:'scale(2.4)',opacity:'0'} },
          slideUp:{ '0%':{transform:'translateY(100%)'}, '100%':{transform:'translateY(0)'} }
        },
        animation: {
          fadeUp:'fadeUp .45s cubic-bezier(.16,1,.3,1) both',
          floaty:'floaty 6s ease-in-out infinite',

          slideUp:'slideUp .3s cubic-bezier(.16,1,.3,1) both'

<style>
  html,body{ overflow-x:hidden; }
  body{ background:#eef0f5; -webkit-font-smoothing:antialiased; }
  .gradient-text{ background:linear-gradient(135deg,#7c3aed,#a78bfa); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .glass{ background:rgba(255,255,255,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .glass-dark{ background:rgba(17,17,27,.55); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  /* hide scrollbars but keep scroll */
  .noscroll::-webkit-scrollbar{ display:none; }
  .noscroll{ scrollbar-width:none; -ms-overflow-style:none; }
  /* phone frame for desktop */
  .phone{ width:390px; height:844px; }
  @media (min-width:560px){
    .phone{ border-radius:44px; border:10px solid #111118; box-shadow:0 40px 90px -30px rgba(76,29,149,.5),0 0 0 1px rgba(0,0,0,.04); overflow:hidden; }
    .phone .screen-mask{ border-radius:34px; overflow:hidden; }
  }
  @media (max-width:559px){
    .phone{ width:100vw; height:100dvh; border:0; border-radius:0; }
    body{ background:#fff; }
  }
  .tabpane{ animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both; }
  /* skeleton */
  .skel{ background:linear-gradient(90deg,#eef0f5 25%,#f7f8fc 37%,#eef0f5 63%); background-size:200% 100%; animation:shimmer 1.6s linear infinite; }
  [data-state-view]{ display:none; }
  .navactive [data-i],.navactive [data-lab]{ color:#7c3aed; }
  /* gradient blob bg */
  .blob{ filter:blur(48px); }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
  input,textarea,select{ font-family:inherit; }
  .chip-press:active{ transform:scale(.96); }
  .tap:active{ transform:scale(.97); transition:transform .08s; }
</style>
</head>

        </div>
        <div class="leading-none">

        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button data-action="toggle-lang" class="tap h-8 px-2.5 rounded-full bg-white/70 border border-slate-200 text-[12px] font-bold text-slate-600 flex items-center gap-1">
          <i data-lucide="languages" class="w-3.5 h-3.5"></i><span data-bind="lang-label">KO</span>
        </button>
        <button data-action="goto-notifications" class="tap relative w-8 h-8 rounded-full bg-white/70 border border-slate-200 grid place-items-center text-slate-600">
          <i data-lucide="bell" class="w-4 h-4"></i>
          <span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-rose-500"></span>
        </button>
        <button data-action="toggle-role" class="tap h-8 pl-1 pr-2.5 rounded-full bg-brand-600 text-white text-[11px] font-bold flex items-center gap-1.5 shadow-glow">

          <span data-bind="role-label">브랜드</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== scroll content (router target) ===== -->
  <main id="view" class="relative z-10 flex-1 overflow-y-auto noscroll overscroll-contain pb-28"></main>

  <!-- ===== bottom tab bar (glass, 7 tabs scrollable) ===== -->
  <nav id="tabbar" class="absolute bottom-0 inset-x-0 z-30 glass border-t border-white/60 pb-[env(safe-area-inset-bottom)]">
    <div class="flex items-stretch justify-between gap-0.5 px-2 pt-1.5 pb-2 overflow-x-auto noscroll">

    </div>
    <div class="mx-auto mb-1.5 w-32 h-1 rounded-full bg-slate-900/80 hidden sm:block"></div>
  </nav>

  <!-- ===== toast ===== -->

      <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-300"></i><span id="toast-msg"></span>
    </div>
  </div>

  </div>

</div>

                      <div class="text-[15px] font-extrabold">${p.currency} ${fmt(p.amount)}</div>
                      ${pill(t(isHeld?"pay_held":"pay_released"), isHeld?"bg-amber-100 text-amber-700":"bg-emerald-100 text-emerald-700")}
                    </div>
                  </div>
                  ${isHeld?`
                  <div class="flex gap-2 mt-3">
                    <button data-action="release-escrow" data-id="${p.id}" class="tap flex-1 bg-emerald-600 text-white text-[12px] font-bold rounded-xl py-2.5 flex items-center justify-center gap-1.5" ${state.busy["rel_"+p.id]?"disabled":""}>
                      <i data-lucide="unlock" class="w-3.5 h-3.5"></i><span>${esc(state.busy["rel_"+p.id]?t("pay_releasing"):t("pay_release"))}</span>
                    </button>
                    <button data-action="dispute" class="tap text-[12px] font-bold text-rose-600 bg-rose-50 rounded-xl px-3.5 py-2.5">${esc(t("pay_dispute"))}</button>
                  </div>`:`
                  <div class="flex items-center gap-1.5 text-[11px] font-semibold text-emerald-600 mt-2"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>${esc(t("pay_released"))}</div>`}
                </div>`;
              }).join("")}
            </div>
          </div>`)}

        ${card(`
          <div class="p-5">
            <h2 class="text-[15px] font-extrabold mb-3">${esc(t("pay_method"))}</h2>
            <div class="flex items-center gap-3 bg-gradient-to-r from-brand-600 to-indigo-600 rounded-2xl p-4 text-white shadow-glow">
              <i data-lucide="credit-card" class="w-7 h-7"></i>
              <div class="flex-1">
                <div class="text-[13px] font-bold">Buylow Escrow Wallet</div>
                <div class="text-[12px] text-white/70 tracking-widest">•••• •••• •••• 4821</div>
              </div>
              <i data-lucide="badge-check" class="w-5 h-5 text-emerald-300"></i>
            </div>
          </div>`)}
      </section>`;
    }
  };

  /* ---------- partial renderers ---------- */
  function forecastResult(f){
    const max=Math.max(...f.curve);
    return `
      <div class="space-y-3 animate-fadeUp">
        ${card(`
          <div class="p-5">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-[15px] font-extrabold">${esc(t("fc_res_title"))}</h2>
              ${pill(t("fc_conf")+" "+f.conf+"%", "bg-emerald-50 text-emerald-600")}
            </div>
            <div class="grid grid-cols-3 gap-2">
              <div class="bg-brand-50 rounded-2xl p-3 text-center"><div class="text-[20px] font-extrabold text-brand-700">${f.roas}%</div><div class="text-[10px] text-slate-500 mt-0.5">${esc(t("fc_roas"))}</div></div>
              <div class="bg-indigo-50 rounded-2xl p-3 text-center"><div class="text-[20px] font-extrabold text-indigo-700">${compact(f.reach)}</div><div class="text-[10px] text-slate-500 mt-0.5">${esc(t("fc_reach"))}</div></div>
              <div class="bg-emerald-50 rounded-2xl p-3 text-center"><div class="text-[20px] font-extrabold text-emerald-700">${fmt(f.conv)}</div><div class="text-[10px] text-slate-500 mt-0.5">${esc(t("fc_conv"))}</div></div>
            </div>
          </div>`)}
        ${card(`
          <div class="p-5">
            <h3 class="text-[13px] font-bold mb-3">${esc(t("fc_curve"))}</h3>
            <div class="flex items-end justify-between gap-2 h-28">
              ${f.curve.map((v,i)=>`
                <div class="flex-1 flex flex-col items-center justify-end gap-1.5 h-full">
                  <span class="text-[9px] font-bold text-slate-400">${compact(v)}</span>
                  <div class="w-full rounded-t-lg bg-gradient-to-t from-brand-600 to-brand-300" style="height:${Math.max(8,Math.round(v/max*100))}%"></div>
                  <span class="text-[9px] text-slate-400">W${i+1}</span>
                </div>`).join("")}
            </div>
            <p class="text-[11px] text-slate-400 mt-3 leading-relaxed">${esc(t("fc_note"))}</p>
          </div>`)}
      </div>`;
  }

  function wmPreviewBox(){
    const p=state._wmPreview;
    if(p.mode==="image"){
      return `<div class="rounded-2xl overflow-hidden border border-slate-200 mt-1">
        <div class="relative aspect-[16/9] bg-gradient-to-br from-slate-900 to-brand-700 grid place-items-center">
          <div class="text-center px-4">
            <div class="text-white font-extrabold text-[15px]">Dubai Skincare Debut</div>
            <div class="text-white/60 text-[10px] mt-1">Dual-track launch preview</div>
          </div>
          <div class="absolute inset-0 grid place-items-center pointer-events-none">
            <span class="text-white/15 font-extrabold text-2xl -rotate-12 tracking-widest">${esc(p.watermark)}</span>
          </div>
        </div>
      </div>`;
    }
    return `<div class="rounded-2xl border border-slate-200 bg-slate-50 p-4 mt-1 relative overflow-hidden">
      <div class="text-[11px] font-mono text-slate-600 leading-relaxed">${esc(p.concept||"")}</div>
      <span class="absolute inset-0 grid place-items-center text-slate-900/[.06] font-extrabold text-xl -rotate-12 pointer-events-none">${esc(p.watermark)}</span>
      <div class="text-[10px] text-slate-400 mt-2">${esc(p.filename)}</div>
    </div>`;
  }

  function chatBubble(m){
    if(m.who==="me"){
      return `<div class="flex justify-end"><div class="max-w-[78%]"><div class="bg-brand-600 text-white text-[13px] rounded-2xl rounded-tr-md px-3.5 py-2.5 leading-relaxed">${esc(state.lang==="en"&&m.textEn?m.textEn:m.text)}</div><div class="text-[10px] text-slate-400 text-right mt-1">${esc(m.t)}</div></div></div>`;
    }
    const txt = state.lang==="en"&&m.textEn?m.textEn:m.text;
    return `<div class="flex items-end gap-2">
      <img src="${avatarUrl(1)}" class="w-7 h-7 rounded-full object-cover shrink-0" alt="">
      <div class="max-w-[78%]">
        <div class="bg-white text-slate-700 text-[13px] rounded-2xl rounded-tl-md px-3.5 py-2.5 leading-relaxed border border-slate-100">${esc(txt)}</div>
        ${m.tr&&state.lang==="ko"?`<div class="text-[10px] text-slate-400 mt-1 pl-1 flex items-center gap-1"><i data-lucide="languages" class="w-3 h-3"></i>${esc(m.tr)}</div>`:""}
        <div class="text-[10px] text-slate-400 mt-0.5 pl-1">${esc(m.t)}</div>
      </div>
    </div>`;
  }

  /* ===================== ROUTER ===================== */
  async function render(){
    const view = $("#view");
    const route = state.route;
    // skeleton while async screen builds
    view.innerHTML = `<div class="px-4 pt-4 space-y-3">${skelCard()}${skelCard()}</div>`;
    view.scrollTop = 0;
    const html = await screens[route]();
    if(state.route!==route) return; // route changed mid-flight, abort
    view.innerHTML = html;
    icons();
    renderTabs();
    // chat: scroll to bottom
    if(route==="chat"){ const sc=$("#chat-scroll"); if(sc) sc.scrollTop=sc.scrollHeight; }
  }

  function renderTabs(){
    const bar = $("#tabbar > div");
    bar.innerHTML = TABS.map(tab=>{
      const active = tab.id===state.route;
      return `<button data-action="nav" data-to="${tab.id}" class="tap flex flex-col items-center justify-center gap-0.5 min-w-[44px] flex-1 py-1 ${active?"navactive":""}">
        <div class="relative">
          <i data-lucide="${tab.icon}" data-i class="w-[21px] h-[21px] ${active?"text-brand-600":"text-slate-400"}"></i>
          ${active?'<span class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-brand-600"></span>':""}
        </div>
        <span data-lab class="text-[9.5px] font-bold ${active?"text-brand-600":"text-slate-400"}">${esc(t(tab.lab))}</span>
      </button>`;
    }).join("");
    icons();
  }

  function navigate(to){
    if(!screens[to]) to="home";
    if(state.route===to && to!=="chat"){ /* same: still rerender for fresh state */ }
    state.route=to;
    if(location.hash!=="#"+to){ history.replaceState(null,"",location.pathname+"#"+to); }
    render();
  }

  /* ===================== STATE-MUTATING HANDLERS ===================== */
  function applyLang(){
    document.documentElement.lang = state.lang;
    $$("[data-i18n]").forEach(el=>{ el.textContent=t(el.getAttribute("data-i18n")); });
    $("[data-bind='lang-label']").textContent = state.lang.toUpperCase();
    $("[data-bind='role-label']").textContent = t("role_"+state.role);
  }
  function applyRole(){
    $("[data-bind='role-label']").textContent = t("role_"+state.role);
    $("#avatar").src = state.role==="brand" ? "https://i.pravatar.cc/80?img=47" : "https://i.pravatar.cc/80?img=5";
  }

  function openProposeSheet(id){
    const c = CREATORS.find(x=>x.id===id); if(!c) return;
    const body=$("#sheet-body");
    body.innerHTML=`
      <div class="mx-auto mb-4 w-10 h-1 rounded-full bg-slate-200"></div>
      <div class="flex items-center gap-3 mb-4">
        <img src="${avatarUrl(c.img)}" class="w-16 h-16 rounded-2xl object-cover" alt="">
        <div class="min-w-0">
          <div class="flex items-center gap-1.5"><span class="text-[16px] font-extrabold truncate">${esc(c.name)}</span>${pill(tierLabel(c.tier),tierClass(c.tier))}</div>
          <div class="text-[12px] text-slate-400">${c.flag} ${esc(c.country)} · ${esc(creatorCats(c).join(", "))}</div>
        </div>
      </div>
      <p class="text-[13px] text-slate-600 leading-relaxed mb-4">${esc(creatorBio(c))}</p>
      <div class="grid grid-cols-3 gap-2 mb-4">
        <div class="bg-brand-50 rounded-xl py-2.5 text-center"><div class="text-[15px] font-extrabold text-brand-700">${c.roas}%</div><div class="text-[10px] text-slate-400">ROAS</div></div>
        <div class="bg-slate-50 rounded-xl py-2.5 text-center"><div class="text-[15px] font-extrabold text-slate-700">${esc(c.reach)}</div><div class="text-[10px] text-slate-400">Reach</div></div>
        <div class="bg-slate-50 rounded-xl py-2.5 text-center"><div class="text-[15px] font-extrabold text-slate-700">${c.eng}%</div><div class="text-[10px] text-slate-400">Eng</div></div>
      </div>
      <div class="flex gap-2">
        <button data-action="propose-confirm" data-id="${c.id}" class="tap flex-1 bg-gradient-to-r from-brand-600 to-indigo-600 text-white text-[13px] font-bold rounded-2xl py-3 shadow-glow flex items-center justify-center gap-1.5"><i data-lucide="send" class="w-4 h-4"></i>${esc(t("dir_propose"))}</button>
        <button data-action="close-sheet" class="tap text-[13px] font-bold text-slate-600 bg-slate-100 rounded-2xl px-5 py-3">${esc(t("nav_chat"))}</button>
      </div>`;
    $("#sheet").classList.remove("hidden"); icons();
  }
  function openRoleSheet(){
    const body=$("#sheet-body");
    const opt=(role,icon)=>`
      <button data-action="set-role" data-role="${role}" class="tap w-full flex items-center gap-3 p-4 rounded-2xl border ${state.role===role?"border-brand-300 bg-brand-50":"border-slate-200 bg-white"} mb-2">
        <div class="w-11 h-11 rounded-2xl ${role==="brand"?"bg-brand-100 text-brand-600":"bg-indigo-100 text-indigo-600"} grid place-items-center"><i data-lucide="${icon}" class="w-5 h-5"></i></div>
        <div class="flex-1 text-left"><div class="text-[14px] font-bold">${esc(t("role_"+role))}</div></div>
        ${state.role===role?'<i data-lucide="check-circle-2" class="w-5 h-5 text-brand-600"></i>':""}
      </button>`;
    body.innerHTML=`
      <div class="mx-auto mb-4 w-10 h-1 rounded-full bg-slate-200"></div>
      <h3 class="text-[16px] font-extrabold">${esc(t("sheet_role_title"))}</h3>
      <p class="text-[12px] text-slate-400 mb-4 mt-1">${esc(t("sheet_role_body"))}</p>
      ${opt("brand","building-2")}${opt("creator","user-round")}`;
    $("#sheet").classList.remove("hidden"); icons();
  }
  function openNotifSheet(){
    const body=$("#sheet-body");
    const items=[
      {icon:"handshake", t:"Aria Nakamura", b:state.lang==="en"?"accepted your direct offer":"다이렉트 오퍼를 수락했어요", time:"2m"},
      {icon:"shield-check", t:t("nav_pay"), b:state.lang==="en"?"Escrow $1,500 released":"에스크로 $1,500 릴리스됨", time:"1h"},
      {icon:"trending-up", t:t("nav_forecast"), b:state.lang==="en"?"New forecast ready":"새 예측이 준비됐어요", time:"3h"}
    ];
    body.innerHTML=`
      <div class="mx-auto mb-4 w-10 h-1 rounded-full bg-slate-200"></div>
      <h3 class="text-[16px] font-extrabold mb-3">${esc(t("notif_title"))}</h3>
      <div class="space-y-2">
        ${items.map(n=>`<div class="flex items-center gap-3 p-3 rounded-2xl bg-slate-50">
          <div class="w-9 h-9 rounded-xl bg-brand-100 text-brand-600 grid place-items-center shrink-0"><i data-lucide="${n.icon}" class="w-4 h-4"></i></div>
          <div class="flex-1 min-w-0"><div class="text-[13px] font-bold truncate">${esc(n.t)}</div><div class="text-[11px] text-slate-400 truncate">${esc(n.b)}</div></div>
          <span class="text-[10px] text-slate-300">${esc(n.time)}</span></div>`).join("")}
      </div>`;
    $("#sheet").classList.remove("hidden"); icons();
  }
  function closeSheet(){ $("#sheet").classList.add("hidden"); }

  /* ---------- async action helpers ---------- */
  async function doSendOffer(){
    if(state.busy.offer) return;
    state.busy.offer=true;
    const btn=$("[data-bind='offer-btn']"); if(btn) btn.textContent=t("match_sending");
    const target=$("#m-target")?.value, msg=$("#m-msg")?.value, amount=Number($("#m-amount")?.value||0);
    await api.createOffer({target,msg,amount});
    state.busy.offer=false;
    toast("st_offer_sent");
    await render();
    navigate("chat");
  }
  async function doRegister(){
    if(state.busy.register) return;
    state.busy.register=true;
    const btn=$("[data-bind='register-btn']"); if(btn) btn.textContent=t("cr_registering");
    await api.registerCampaign({
      title:$("#c-title")?.value||"Untitled", brief:$("#c-brief")?.value||"",
      regions:($("#c-reg")?.value||"").split(",").map(s=>s.trim()).filter(Boolean),
      bmin:Number($("#c-bmin")?.value||0), bmax:Number($("#c-bmax")?.value||0)
    });
    state.busy.register=false;
    toast("st_registered");
    await render();
  }
  async function doApply(id){
    await api.applyCampaign({id, msg:$("#c-apply")?.value, quote:Number($("#c-quote")?.value||0)});
    toast("st_applied");
  }
  async function doPreview(){
    if(state.busy.preview) return;
    state.busy.preview=true;
    const btn=$("[data-bind='preview-btn']"); if(btn) btn.textContent=t("cr_genning");
    const mode=state._wmMode||"text";
    const watermark=$("#wm-text")?.value||"BUYLOW PREVIEW";
    const filename=$("#wm-file")?.value||"";
    const concept=$("#wm-concept")?.value||"";
    await api.renderPreview({mode,watermark,filename,concept});
    state._wmPreview={mode,watermark,filename,concept};
    state.busy.preview=false;
    toast("st_preview");
    await render();
  }
  async function doRelease(id){
    if(state.busy["rel_"+id]) return;
    state.busy["rel_"+id]=true; await render();
    await api.releaseEscrow(id);
    state.busy["rel_"+id]=false;
    toast("st_released");
    await render();
  }
  async function doForecast(){
    if(state.busy.forecast) return;
    state._fcBudget=$("#fc-budget")?.value; state._fcPlatform=$("#fc-platform")?.value; state._fcMarket=$("#fc-market")?.value;
    state.busy.forecast=true; await render();
    const f=await api.runForecast({budget:state._fcBudget, platform:state._fcPlatform, market:state._fcMarket});
    state.forecast=f; state.busy.forecast=false;
    await render();
  }
  async function doSendMessage(){
    const inp=$("#chat-input"); const text=(inp?.value||"").trim();
    if(!text) return;
    inp.value="";
    state.chat.push({who:"me", text, t:nowHM()});
    await render();
    const sc=$("#chat-scroll"); if(sc) sc.scrollTop=sc.scrollHeight;
    // mock auto-reply
    setTimeout(async ()=>{
      state.chat.push({who:"them", who_name:"Aria Nakamura", text:state.lang==="en"?"Got it — sending a quote shortly!":"확인했어요 — 곧 견적 보낼게요!", textEn:"Got it — sending a quote shortly!", t:nowHM(), tr:"Got it — sending a quote shortly!"});
      if(state.route==="chat"){ await render(); const s=$("#chat-scroll"); if(s) s.scrollTop=s.scrollHeight; }
    }, 1100);
  }
  async function doCreateEscrow(){
    await api.createEscrow({with:"Aria Nakamura", currency:"USD", amount:2200, img:1, milestone:state.lang==="en"?"Kickoff (1/3)":"착수금 (1/3)", milestoneEn:"Kickoff (1/3)"});
    toast("st_escrow_created");
  }

  /* ===================== DELEGATED EVENTS (registered once) ===================== */
  document.addEventListener("click", function(e){
    const el = e.target.closest("[data-action]");
    if(!el) return;
    const a = el.getAttribute("data-action");
    switch(a){
      case "nav": navigate(el.getAttribute("data-to")); break;
      case "toggle-lang":
        state.lang = state.lang==="ko"?"en":"ko";
        localStorage.setItem("bl_lang",state.lang);
        applyLang(); render(); break;
      case "toggle-role": openRoleSheet(); break;
      case "set-role":
        state.role = el.getAttribute("data-role");
        localStorage.setItem("bl_role",state.role);
        applyRole(); closeSheet(); toast(state.role==="brand"?"st_role_brand":"st_role_creator"); render(); break;
      case "goto-notifications": openNotifSheet(); break;
      case "close-sheet": closeSheet(); break;
      case "open-propose": openProposeSheet(el.getAttribute("data-id")); break;
      case "propose-confirm": closeSheet(); toast("st_proposed"); navigate("chat"); break;
      case "dir-chip":
        state._dirSearch = el.getAttribute("data-q"); render(); break;
      case "match-target": break;
      case "send-offer": doSendOffer(); break;
      case "run-forecast": doForecast(); break;
      case "register-campaign": doRegister(); break;
      case "apply-campaign": doApply(el.getAttribute("data-id")); break;
      case "wm-mode": state._wmMode=el.getAttribute("data-mode"); state._wmPreview=null; render(); break;
      case "render-preview": doPreview(); break;
      case "release-escrow": doRelease(el.getAttribute("data-id")); break;
      case "dispute": toast("pay_dispute"); break;
      case "send-message": doSendMessage(); break;
      case "create-escrow": doCreateEscrow(); break;
    }
  });
  // dir search input (delegated, debounced)
  let dirTimer=null;
  document.addEventListener("input", function(e){
    const el=e.target.closest("[data-action='dir-search']");
    if(el){ clearTimeout(dirTimer); const v=el.value; dirTimer=setTimeout(()=>{ state._dirSearch=v; render(); const i=$("#dir-search"); if(i){ i.focus(); i.setSelectionRange(v.length,v.length); } },260); }
  });
  // enter to send in chat
  document.addEventListener("keydown", function(e){
    if(e.key==="Enter" && e.target && e.target.id==="chat-input"){ e.preventDefault(); doSendMessage(); }
  });

  /* ===================== BOOT (home = first paint, no gate) ===================== */
  function boot(){
    applyLang(); applyRole();
    const initial = (location.hash||"").replace("#","");
    state.route = screens[initial] ? initial : "home";
    render();
  }
  window.addEventListener("hashchange", ()=>{
    const r=(location.hash||"").replace("#","");
    if(screens[r] && r!==state.route){ state.route=r; render(); }
  });

  // start immediately — home is the first frame
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",boot); } else { boot(); }
  icons();
})();
</script>
</body>
</html>
