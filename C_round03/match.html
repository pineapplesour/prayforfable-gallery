<style>
  html { scroll-behavior: smooth; }

  [hidden] { display:none !important; }

  /* ---- swipe deck ---- */
  .deck { position:relative; height:548px; }
  .swipe-card {
    position:absolute; inset:0; will-change:transform,opacity;
    transition: transform .5s cubic-bezier(.34,1.56,.64,1), opacity .35s ease;
    touch-action:pan-y; backface-visibility:hidden;
  }
  .swipe-card.dragging { transition:none; }
  .swipe-card .tint {
    position:absolute; inset:0; z-index:4; opacity:0; pointer-events:none;
    transition:opacity .12s ease; border-radius:1.75rem;
  }
  .swipe-card .tint.like { background:linear-gradient(180deg, rgba(16,185,129,.0), rgba(16,185,129,.28)); }
  .swipe-card .tint.nope { background:linear-gradient(180deg, rgba(225,29,72,.0), rgba(225,29,72,.26)); }
  .swipe-card .tint.up   { background:linear-gradient(0deg, rgba(124,58,237,.0), rgba(124,58,237,.34)); }
  .swipe-card .stamp {
    position:absolute; top:24px; padding:6px 16px; border-radius:14px; z-index:6;
    font-weight:900; font-size:24px; letter-spacing:.05em; border:3px solid;
    opacity:0; transition:opacity .1s ease; pointer-events:none; backdrop-filter:blur(2px);
  }
  .swipe-card .stamp.like { left:22px; color:#10b981; border-color:#10b981; transform:rotate(-15deg); background:rgba(255,255,255,.7); }
  .swipe-card .stamp.nope { right:22px; color:#e11d48; border-color:#e11d48; transform:rotate(15deg); background:rgba(255,255,255,.7); }
  .swipe-card .stamp.up   { left:50%; top:auto; bottom:120px; transform:translateX(-50%) rotate(-4deg); color:#7c3aed; border-color:#7c3aed; background:rgba(255,255,255,.78); }
  @media (prefers-reduced-motion: reduce) {
    .swipe-card { transition:none; }
    .animate-float, .animate-fadeIn, .animate-popIn, .animate-slideUp, .animate-cardIn { animation:none !important; }
    .ringPulse, .confetti-pc { display:none !important; }
  }
  .nav-link.active { color:#7c3aed; background:#f5f3ff; }
  .bn-item.active { color:#7c3aed; }
  .bn-item.active .bn-ico { background:#ede9fe; }

  /* ---- match modal + confetti ---- */
  .match-ring { position:absolute; inset:0; border:3px solid rgba(255,255,255,.55); border-radius:9999px; animation:ringPulse 1.4s ease-out infinite; }
  .confetti-pc { position:absolute; top:-12px; width:9px; height:14px; border-radius:2px; opacity:.95; animation:confFall linear forwards; }
  @keyframes confFall { to { transform:translateY(120vh) rotate(720deg); opacity:0; } }

/* mock forecast model — deterministic from inputs */
function computeForecast(partnerId, budget, market){
  const p = byId(partnerId) || INFLUENCERS[0];
  const b = Math.max(200, Number(budget)||0);
  const marketBoost = (p.country === market) ? 1.18 : (market==="Global" ? 1.05 : 0.94);
  const roas = Math.round(p.roas * marketBoost * (1 + (p.er-4)/40));
  const reach = Math.round((b/1000) * (parseFloat(p.reach)||0.6) * 1000 * (p.er/5));
  const conv = Math.round(reach * (p.er/100) * 0.22);
  const revenue = b * (roas/100);
  const cpa = conv>0 ? (b/conv) : 0;
  const confidence = Math.min(96, Math.round(60 + p.fit*0.3 + (p.tier==="Platinum"?6:p.tier==="Gold"?3:0)));
  return {
    roas, reach, conv, cpa, confidence, revenue,
    drivers:[
      { label:t("ms.fit"), val:p.fit, max:100 },
      { label:"ER", val:Math.round(p.er*16), max:100 },
      { label:"Market match", val: p.country===market?92:market==="Global"?74:58, max:100 },
    ],
    scenarios:[
      { name:"Conservative", roas:Math.round(roas*0.82), rev:Math.round(revenue*0.82) },
      { name:"Base", roas:roas, rev:Math.round(revenue) },
      { name:"Stretch", roas:Math.round(roas*1.22), rev:Math.round(revenue*1.22) },
    ],
  };
}

/* ---------- reducer: the ONLY place domain state changes ---------- */
const MATCH_FIT_THRESHOLD = 92; // right-swipe on a high-fit partner triggers IT'S A MATCH
function reduce(cmd, p){
  switch(cmd){
    case "BOOT": { STORE.ui.phase = "idle"; break; }
    case "NAV": {
      STORE.route = p.route || "home";
      if (STORE.match.open) STORE.match = { open:false, partnerId:null, kind:null };
      window.scrollTo({ top:0, behavior:"instant" in window ? "instant" : "auto" });
      break;
    }
    case "SET_ROLE": {
      if (p.role && p.role !== STORE.role){ STORE.role = p.role; effectToast("toast.role","user-cog"); }
      break;
    }
    case "CHANGE_LANGUAGE": {
      STORE.language = STORE.language === "ko" ? "en" : "ko";
      document.documentElement.lang = STORE.language;
      break;
    }
    /* ----- swipe deck (dir: like | nope | up) ----- */
    case "DECK_SWIPE": {
      const d = STORE.deck;
      if (d.index >= d.order.length) break;
      const id = d.order[d.index];
      const prof = byId(id);
      d.anim = { id, dir: p.dir };
      if (p.dir === "up"){
        d.liked.push(id); d.lastAction = { id, kind:"like" };
        effectToast("toast.super","star");
        STORE.match = { open:true, partnerId:id, kind:"super" };
        effectConfetti();
      } else if (p.dir === "like"){
        d.liked.push(id); d.lastAction = { id, kind:"like" };
        effectToast("toast.liked","send");
        if (prof && prof.fit >= MATCH_FIT_THRESHOLD){ STORE.match = { open:true, partnerId:id, kind:"match" }; effectConfetti(); }
      } else {
        d.passed.push(id); d.lastAction = { id, kind:"pass" }; effectToast("toast.passed","x");
      }
      d.index += 1;
      break;
    }
    case "DECK_UNDO": {
      const d = STORE.deck;
      if (!d.lastAction || d.index===0) break;
      const last = d.lastAction;
      if (last.kind==="like") d.liked = d.liked.filter(x=>x!==last.id);
      else d.passed = d.passed.filter(x=>x!==last.id);
      d.index -= 1; d.lastAction = null; d.anim = { id:d.order[d.index], dir:"in" };
      effectToast("toast.undo","rotate-ccw");
      break;
    }
    case "DECK_RELOAD": {
      STORE.deck = { order: INFLUENCERS.map(x=>x.id), index:0, liked: STORE.deck.liked, passed:[], lastAction:null, anim:{id:INFLUENCERS[0].id,dir:"in"} };
      break;
    }
    /* ----- IT'S A MATCH overlay ----- */
    case "MATCH_CLOSE": { STORE.match = { open:false, partnerId:null, kind:null }; break; }
    case "MATCH_OFFER": {
      const id = STORE.match.partnerId || p.id;
      STORE.match = { open:false, partnerId:null, kind:null };
      const conv = STORE.chat.convos.find(c=>c.with===id);
      STORE.chat.activeId = conv ? conv.id : STORE.chat.activeId;
      STORE.route = "chat";
      effectToast("toast.offer","handshake");
      break;
    }
    /* directory / liked-rail shortcut into chat */
    case "DECK_OFFER": {
      const conv = STORE.chat.convos.find(c=>c.with===p.id);
      STORE.chat.activeId = conv ? conv.id : STORE.chat.activeId;
      STORE.route = "chat";
      effectToast("toast.offer","handshake");
      break;
    }
    /* ----- forecast ----- */
    case "FC_SET": { Object.assign(STORE.forecast, p); break; }
    case "FC_RUN": {
      const f = STORE.forecast;
      f.phase = "running"; f.result = null;
      effectForecast(f.partnerId, f.budget, f.market);
      break;
    }
    case "FC_DONE": {
      STORE.forecast.phase = "completed";
      STORE.forecast.result = p.result;
      effectToast("toast.fcDone","trending-up");
      break;
    }
    /* ----- chat (submit idempotency + job ownership) ----- */
    case "CHAT_SELECT": { STORE.chat.activeId = p.id; STORE.chat.draft=""; break; }
    case "CHAT_DRAFT": { STORE.chat.draft = p.value; break; }
    case "SUBMIT_QUESTION": {
      const c = STORE.chat;
      const conv = c.convos.find(x=>x.id===c.activeId);
      if (!conv) break;
      const text = (p.text||"").trim();
      if (!text) break;
      if (c.jobs[conv.id] && c.jobs[conv.id].phase==="running") break; // idempotency
      const jobId = uid(), userMsgId = uid(), placeholderId = uid();
      conv.msgs.push({ id:userMsgId, from:"me", text });
      conv.msgs.push({ id:placeholderId, from:"them", text:"", pending:true });
      c.jobs[conv.id] = { jobId, phase:"running", chatId:conv.id, assistantMessageId:placeholderId };
      c.draft = "";
      effectChatReply(conv.id, jobId, placeholderId);
      effectToast("toast.sent","send");
      break;
    }
    case "JOB_RESULT_RECEIVED": {
      const c = STORE.chat;
      const job = Object.values(c.jobs).find(j=>j.jobId===p.jobId);
      if (!job || job.phase!=="running") break;       // cancelled jobs cannot append
      const conv = c.convos.find(x=>x.id===job.chatId);
      if (!conv) break;
      const msg = conv.msgs.find(m=>m.id===job.assistantMessageId);
      if (!msg) break;                                 // result only attaches to its own placeholder
      msg.text = p.text; msg.pending = false; job.phase = "completed";
      break;
    }
    case "CANCEL_JOB": {
      const c = STORE.chat;
      const conv = c.convos.find(x=>x.id===c.activeId);
      if (!conv) break;
      const job = c.jobs[conv.id];
      if (!job || job.phase!=="running") break;
      job.phase = "cancelled";
      conv.msgs = conv.msgs.filter(m=>m.id!==job.assistantMessageId);
      effectToast("toast.cancelled","x");
      break;
    }
    /* ----- create campaign ----- */
    case "CR_SET": { STORE.create.form[p.field] = p.value; break; }
    case "CR_SUBMIT": {
      const f = STORE.create.form;
      if (!f.title.trim()) { STORE.create.phase="idle"; break; }
      STORE.create.campaigns.unshift({
        id: uid(), title:f.title.trim(), brief:f.brief.trim()||"새 캠페인",
        min:Number(f.min)||0, max:Number(f.max)||0,
        platforms: f.platforms.split(",").map(s=>s.trim()).filter(Boolean),
        regions: f.regions.split(",").map(s=>s.trim()).filter(Boolean),
        applicants:0, status:"open", fresh:true,
      });
      STORE.create.form = { title:"", brief:"", min:"1800", max:"3400", platforms:"Instagram, YouTube", regions:"France" };
      STORE.create.phase = "completed";
      effectToast("toast.created","megaphone");
      break;
    }
    /* ----- payment / escrow ----- */
    case "PAY_SELECT": { STORE.payment.activeId = p.id; break; }
    case "PAY_FUND": {
      const it = STORE.payment.items.find(x=>x.id===p.id);
      if (it && it.status==="pending"){ it.status="funded"; if(it.milestones[0]) it.milestones[0].done=true; effectToast("toast.funded","lock"); }
      break;
    }
    case "PAY_RELEASE": {
      const it = STORE.payment.items.find(x=>x.id===p.id);
      if (it){
        const next = it.milestones.find(m=>!m.done);
        if (next){ next.done = true; effectToast("toast.released","unlock"); }
        if (it.milestones.every(m=>m.done)) it.status = "released";
      }
      break;
    }
    default: break;
  }
}

}

      c.style.animationDelay = (Math.random()*0.35) + "s";

function applyI18nStatic(){

function syncChrome(){
  applyI18nStatic();

  document.documentElement.lang = STORE.language;
  document.querySelectorAll('.nav-link').forEach(a=>a.classList.toggle('active', a.getAttribute('data-route')===STORE.route));
  document.querySelectorAll('.bn-item').forEach(a=>a.classList.toggle('active', a.getAttribute('data-route')===STORE.route));
  document.querySelectorAll('.role-btn').forEach(b=>{

/* ---------- hash router ---------- */
const ROUTES = ["home","directory","match","forecast","chat","create","payment"];
function routeFromHash(){
  const h = (location.hash || "#/home").replace(/^#\//,"").split("?")[0];
  return ROUTES.includes(h) ? h : "home";
}
function onHashChange(){
  const r = routeFromHash();
  if (r !== STORE.route) dispatch("NAV", { route:r });
}

/* ---------- single delegated event layer (registered once) ---------- */
document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.getAttribute("data-action");
  switch(action){
    case "nav": { location.hash = "#/" + el.getAttribute("data-route"); break; }
    case "set-role": dispatch("SET_ROLE", { role: el.getAttribute("data-role") }); break;
    case "toggle-lang": dispatch("CHANGE_LANGUAGE"); break;
    case "deck-like": dispatch("DECK_SWIPE", { dir:"like" }); break;
    case "deck-nope": dispatch("DECK_SWIPE", { dir:"nope" }); break;
    case "deck-super": dispatch("DECK_SWIPE", { dir:"up" }); break;
    case "deck-undo": dispatch("DECK_UNDO"); break;
    case "deck-reload": dispatch("DECK_RELOAD"); break;
    case "deck-offer": dispatch("DECK_OFFER", { id: el.getAttribute("data-id") }); break;
    case "match-offer": dispatch("MATCH_OFFER", { id: el.getAttribute("data-id") }); break;
    case "match-close": dispatch("MATCH_CLOSE"); break;
    case "fc-run": { e.preventDefault(); dispatch("FC_RUN"); break; }
    case "chat-select": dispatch("CHAT_SELECT", { id: el.getAttribute("data-id") }); break;
    case "chat-send": { e.preventDefault(); sendChatFromInput(); break; }
    case "chat-cancel": dispatch("CANCEL_JOB"); break;
    case "chat-quote": { sendChatQuick(STORE.language==="ko"?"견적: $2,200 — 릴 2편 + 룩북 화보. 에스크로로 진행할게요.":"Quote: $2,200 — 2 reels + lookbook shots. Let's run via escrow."); break; }
    case "cr-submit": { e.preventDefault(); dispatch("CR_SUBMIT"); break; }
    case "pay-select": dispatch("PAY_SELECT", { id: el.getAttribute("data-id") }); break;
    case "pay-fund": dispatch("PAY_FUND", { id: el.getAttribute("data-id") }); break;
    case "pay-release": dispatch("PAY_RELEASE", { id: el.getAttribute("data-id") }); break;
    default: break;
  }
});

document.addEventListener("input", (e)=>{
  const el = e.target.closest("[data-bind-input]");
  if (!el) return;
  const kind = el.getAttribute("data-bind-input");
  if (kind === "chat-draft") STORE.chat.draft = el.value; // no re-render: keep focus
  else if (kind === "fc-budget") dispatch("FC_SET", { budget: el.value });
  else if (kind === "fc-partner") dispatch("FC_SET", { partnerId: el.value });
  else if (kind === "fc-market") dispatch("FC_SET", { market: el.value });
  else if (kind && kind.startsWith("cr-")) STORE.create.form[kind.slice(3)] = el.value;
});
document.addEventListener("keydown", (e)=>{
  if (STORE.match.open){ if (e.key==="Escape") dispatch("MATCH_CLOSE"); return; }
  if (STORE.route === "match" && !e.metaKey && !e.ctrlKey){
    const onField = e.target && e.target.matches && e.target.matches("input,textarea,select");
    if (!onField){
      if (e.key === "ArrowRight") { e.preventDefault(); dispatch("DECK_SWIPE", { dir:"like" }); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); dispatch("DECK_SWIPE", { dir:"nope" }); }
      else if (e.key === "ArrowUp") { e.preventDefault(); dispatch("DECK_SWIPE", { dir:"up" }); }
    }
  }
  if (e.target && e.target.getAttribute && e.target.getAttribute("data-bind-input")==="chat-draft" && e.key==="Enter" && !e.shiftKey){
    e.preventDefault(); sendChatFromInput();
  }
});

function sendChatFromInput(){
  const input = document.querySelector('[data-bind-input="chat-draft"]');
  const text = input ? input.value : STORE.chat.draft;
  dispatch("SUBMIT_QUESTION", { text, clientActionId: uid() });
}
function sendChatQuick(text){ dispatch("SUBMIT_QUESTION", { text, clientActionId: uid() }); }
function scrollChatBottom(){ const box = document.getElementById("chat-scroll"); if (box) box.scrollTop = box.scrollHeight; }

/* deck drag: pointer events on top card -> commit swipe via dispatch.
   supports right(like) / left(nope) / up(super) with velocity-aware fling. */
function wireDeck(){
  const deck = document.getElementById("deck");
  if (!deck) return;
  const top = deck.querySelector(".swipe-card.is-top");
  if (!top) return;
  let startX=0, startY=0, dx=0, dy=0, dragging=false, t0=0;
  const tintLike = top.querySelector(".tint.like"), tintNope = top.querySelector(".tint.nope"), tintUp = top.querySelector(".tint.up");
  const sLike = top.querySelector(".stamp.like"), sNope = top.querySelector(".stamp.nope"), sUp = top.querySelector(".stamp.up");
  const clearFx = ()=>{ [tintLike,tintNope,tintUp,sLike,sNope,sUp].forEach(e=>{ if(e) e.style.opacity=0; }); };
  const onDown = (e)=>{
    dragging=true; t0=Date.now(); top.classList.add("dragging");
    startX = (e.touches?e.touches[0].clientX:e.clientX);
    startY = (e.touches?e.touches[0].clientY:e.clientY);
    if (top.setPointerCapture && e.pointerId!=null){ try{ top.setPointerCapture(e.pointerId);}catch(_){} }
    window.addEventListener("pointermove", onMove); window.addEventListener("pointerup", onUp);
  };
  const onMove = (e)=>{
    if(!dragging) return;
    dx = e.clientX - startX; dy = e.clientY - startY;
    const rot = dx/18;
    top.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
    const upBias = (-dy) > Math.abs(dx)*1.15 && dy < -40; // mostly upward
    clearFx();
    if (upBias){
      const k = Math.min(1, (-dy)/130); if(tintUp) tintUp.style.opacity=k; if(sUp) sUp.style.opacity=k;
    } else if (dx>0){
      const k = Math.min(1, dx/120); if(tintLike) tintLike.style.opacity=k; if(sLike) sLike.style.opacity=k;
    } else {
      const k = Math.min(1, (-dx)/120); if(tintNope) tintNope.style.opacity=k; if(sNope) sNope.style.opacity=k;
    }
  };
  const onUp = ()=>{
    if(!dragging) return; dragging=false; top.classList.remove("dragging");
    window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp);
    const dt = Math.max(1, Date.now()-t0);
    const vx = dx/dt, vy = dy/dt;
    const upBias = (-dy) > Math.abs(dx)*1.15;
    const fastUp = vy < -0.7;
    if ((upBias && (-dy) > 130) || (upBias && fastUp)){
      top.style.transition = "transform .4s ease, opacity .4s ease";
      top.style.transform = `translate(${dx}px, -800px) rotate(${dx/16}deg)`; top.style.opacity="0";
      setTimeout(()=>dispatch("DECK_SWIPE", { dir:"up" }), 230); return;
    }
    const threshold = 108;
    if (Math.abs(dx) > threshold || Math.abs(vx) > 0.8){
      const dir = dx>0 ? "like" : "nope";
      top.style.transition = "transform .38s ease, opacity .38s ease";
      top.style.transform = `translate(${dx>0?760:-760}px, ${dy}px) rotate(${dx/12}deg)`; top.style.opacity="0";
      setTimeout(()=>dispatch("DECK_SWIPE", { dir }), 230);
    } else {
      top.style.transition = "transform .35s cubic-bezier(.34,1.56,.64,1)";
      top.style.transform = ""; clearFx();
    }
  };
  top.addEventListener("pointerdown", onDown);
}

VIEWS.chat = function(){
  const c = STORE.chat;
  const active = c.convos.find(x=>x.id===c.activeId) || c.convos[0];
  const job = active ? c.jobs[active.id] : null;
  const busy = job && job.phase==="running";
  const list = c.convos.map(cv=>{
    const last = cv.msgs.filter(m=>!m.pending).slice(-1)[0];
    const on = cv.id===c.activeId;
    return `<button data-action="chat-select" data-id="${cv.id}" class="flex w-full items-center gap-3 rounded-2xl p-2.5 text-left transition ${on?'bg-brand-50 ring-1 ring-brand-200':'hover:bg-slate-50'}">
      <div class="relative">${avatar(byId(cv.with),44)}
        ${cv.online?'<span class="absolute -bottom-0.5 -right-0.5 h-3 w-3 rounded-full border-2 border-white bg-emerald-500"></span>':''}</div>
      <div class="min-w-0 flex-1"><div class="flex items-center justify-between gap-2"><span class="truncate text-sm font-bold">${esc(cv.name)}</span><span class="shrink-0">${pill(cv.fit+"%","green")}</span></div>
        <div class="truncate text-xs text-slate-400">${last?esc(last.text):""}</div></div></button>`;
  }).join("");

  const bubbles = active ? active.msgs.map(m=>{
    if (m.from==="me") return `<div class="ml-auto w-fit max-w-[78%] rounded-2xl rounded-br-sm gradient-cta px-3.5 py-2 text-sm text-white">${esc(m.text)}</div>`;
    if (m.pending) return `<div class="w-fit rounded-2xl rounded-bl-sm bg-slate-100 px-4 py-3 text-sm text-slate-400"><span class="inline-flex gap-1"><span class="h-1.5 w-1.5 animate-bounce rounded-full bg-slate-400" style="animation-delay:0ms"></span><span class="h-1.5 w-1.5 animate-bounce rounded-full bg-slate-400" style="animation-delay:120ms"></span><span class="h-1.5 w-1.5 animate-bounce rounded-full bg-slate-400" style="animation-delay:240ms"></span></span></div>`;
    return `<div class="w-fit max-w-[78%] rounded-2xl rounded-bl-sm bg-slate-100 px-3.5 py-2 text-sm text-slate-700">${esc(m.text)}</div>`;
  }).join("") : "";

  return `
  <div class="grid gap-6 lg:grid-cols-[320px_1fr]">
    <aside class="min-w-0 rounded-3xl border border-slate-100 bg-white p-4 shadow-card">
      <div class="mb-2 px-1">${eyebrow(t("chat.inbox"))}<h2 class="mt-1 text-lg font-extrabold">${t("chat.title")}</h2></div>
      <div class="space-y-1.5">${list}</div>
    </aside>

    <section class="flex min-w-0 flex-col rounded-3xl border border-slate-100 bg-white shadow-soft" style="min-height:560px">
      ${active?`
      <header class="flex items-center gap-3 border-b border-slate-100 p-4">
        <div class="relative">${avatar(byId(active.with),46)}
          ${active.online?'<span class="absolute -bottom-0.5 -right-0.5 h-3 w-3 rounded-full border-2 border-white bg-emerald-500"></span>':''}</div>
        <div class="min-w-0 flex-1"><div class="text-sm font-extrabold">${esc(active.name)}</div>
          <div class="text-xs ${busy?'text-brand-600':'text-emerald-600'} font-semibold">${busy?t("chat.typing"):(active.online?t("chat.online"):esc(active.meta))}</div></div>
        ${pill(active.fit+"% "+t("match.fit"),"green")}
        <a href="#/payment" data-action="nav" data-route="payment" class="hidden sm:inline-flex items-center gap-1.5 rounded-2xl bg-brand-50 px-3 py-2 text-xs font-bold text-brand-700 transition hover:bg-brand-100"><i data-lucide="shield-check" class="h-3.5 w-3.5"></i>${t("chat.escrowCta")}</a>
      </header>
      <div id="chat-scroll" class="no-bar flex-1 space-y-2.5 overflow-y-auto p-4" style="max-height:420px">${bubbles}
        <div class="mx-auto mt-2 flex w-fit items-center gap-2 rounded-full bg-brand-50 px-3 py-1.5 text-xs font-bold text-brand-700"><i data-lucide="shield-check" class="h-3.5 w-3.5"></i>${fmtUSD(active.escrow)} ${t("home.chatEscrow")} · ${active.escrowState==='funded'?t("home.chatFunded"):t("pay.pending")}</div>
      </div>
      <footer class="border-t border-slate-100 p-3">
        <div class="flex min-w-0 items-center gap-2">
          <button data-action="chat-quote" class="grid h-10 w-10 shrink-0 place-items-center rounded-2xl border border-slate-200 text-brand-600 transition hover:bg-brand-50" title="${t("chat.quote")}"><i data-lucide="receipt" class="h-4 w-4"></i></button>

          ${busy
            ? `<button data-action="chat-cancel" class="grid h-10 w-10 shrink-0 place-items-center rounded-2xl border border-rose-200 bg-rose-50 text-rose-600" title="${t("chat.cancel")}"><i data-lucide="square" class="h-4 w-4"></i></button>`

        </div>
      </footer>`:`<div class="grid flex-1 place-items-center text-sm text-slate-400">${t("chat.empty")}</div>`}
    </section>
  </div>`;
};

      <textarea data-bind-input="cr-${key}" rows="3" class="mt-1.5 w-full resize-none rounded-2xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm focus:border-brand-400 focus:outline-none">${esc(f[key])}</textarea></div>`;
    return `<div><label class="block text-xs font-bold text-slate-500">${label}</label>
      <input data-bind-input="cr-${key}" type="${opts.type||'text'}" value="${esc(f[key])}" class="mt-1.5 w-full rounded-2xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm focus:border-brand-400 focus:outline-none" /></div>`;
  };
  return `
  <section class="mesh relative overflow-hidden rounded-[2rem] border border-slate-100 bg-white p-6 sm:p-8 shadow-soft">
    <span class="blob bg-brand-100/50" style="width:260px;height:260px;top:-90px;left:-40px"></span>
    <div class="relative">${eyebrow(t("cr.eyebrow"))}
      <h1 class="mt-2 text-3xl sm:text-4xl font-extrabold tracking-tight">${t("cr.title")}</h1>
      <p class="mt-2 max-w-xl text-[15px] leading-relaxed text-slate-600">${t("cr.body")}</p>
    </div>
  </section>

  <div class="mt-6 grid gap-6 lg:grid-cols-2">
    <form class="rounded-3xl border border-slate-100 bg-white p-6 shadow-card space-y-4" onsubmit="return false">
      ${field(t("cr.cname"),"title")}
      ${field(t("cr.brief"),"brief",{area:true})}
      <div class="grid grid-cols-2 gap-4">${field(t("cr.bmin"),"min",{type:"number"})}${field(t("cr.bmax"),"max",{type:"number"})}</div>
      ${field(t("cr.plat"),"platforms")}
      ${field(t("cr.region"),"regions")}
      <button data-action="cr-submit" class="inline-flex w-full items-center justify-center gap-2 rounded-2xl gradient-cta px-4 py-3 text-sm font-bold text-white shadow-glow transition hover:-translate-y-0.5">
        <i data-lucide="megaphone" class="h-4 w-4"></i>${t("cr.submit")}</button>
    </form>

    <div class="space-y-4">
      <div class="rounded-3xl border border-brand-100 bg-gradient-to-br from-brand-600 to-indigo-600 p-6 text-white shadow-glow">
        <span class="text-[11px] font-extrabold uppercase tracking-widest text-white/70">${t("cr.preview")}</span>
        <h3 class="mt-2 text-xl font-extrabold">${esc(f.title||t("cr.cname"))}</h3>
        <p class="mt-2 text-sm leading-relaxed text-white/85">${esc(f.brief||t("cr.body"))}</p>
        <div class="mt-4 flex flex-wrap gap-1.5">
          <span class="rounded-full bg-white/20 px-2.5 py-0.5 text-xs font-bold">${fmtUSD(f.min||0)} – ${fmtUSD(f.max||0)}</span>
          ${(f.platforms||'').split(',').map(s=>s.trim()).filter(Boolean).map(s=>`<span class="rounded-full bg-white/15 px-2.5 py-0.5 text-xs font-semibold">${esc(s)}</span>`).join("")}
          ${(f.regions||'').split(',').map(s=>s.trim()).filter(Boolean).map(s=>`<span class="rounded-full bg-white/15 px-2.5 py-0.5 text-xs font-semibold">${esc(s)}</span>`).join("")}
        </div>
      </div>
      <div class="rounded-3xl border border-slate-100 bg-white p-5 shadow-card">
        <h3 class="text-sm font-extrabold text-slate-900">${t("cr.live")}</h3>
        <div class="mt-3 space-y-2.5">
          ${STORE.create.campaigns.map(cp=>`
            <div class="rounded-2xl border ${cp.fresh?'border-brand-200 bg-brand-50/40':'border-slate-100'} p-3.5">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0"><div class="truncate text-sm font-bold">${esc(cp.title)}${cp.fresh?' <span class="text-brand-600">●</span>':''}</div>
                  <div class="mt-0.5 truncate text-xs text-slate-400">${cp.regions.join(", ")} · ${cp.platforms.join(", ")}</div></div>
                ${pill(fmtUSD(cp.min)+"–"+fmtUSD(cp.max),"brand")}
              </div>
              <div class="mt-2 flex items-center gap-3 text-xs text-slate-500">
                <span class="inline-flex items-center gap-1"><i data-lucide="users" class="h-3.5 w-3.5"></i>${cp.applicants} ${t("cr.applicants")}</span>
                <span class="inline-flex items-center gap-1 text-emerald-600"><i data-lucide="circle-dot" class="h-3.5 w-3.5"></i>open</span></div>
            </div>`).join("")}
        </div>
      </div>
    </div>
  </div>`;
};

/* ============================================================
   VIEW: PAYMENT / ESCROW
   ============================================================ */
VIEWS.payment = function(){
  const items = STORE.payment.items;
  const active = items.find(x=>x.id===STORE.payment.activeId) || items[0];
  const total = items.reduce((s,i)=>s+i.amount,0);
  const protectedAmt = items.filter(i=>i.status!=="released").reduce((s,i)=>s+i.amount,0);
  const statusPill = (s)=> s==="funded"?pill(t("pay.held"),"brand"): s==="released"?pill(t("pay.released"),"green"):pill(t("pay.pending"),"amber");
  const row = (it)=>{
    const on = it.id===active.id;
    return `<button data-action="pay-select" data-id="${it.id}" class="flex w-full items-center gap-3 rounded-2xl border p-3 text-left transition ${on?'border-brand-200 bg-brand-50':'border-slate-100 hover:bg-slate-50'}">
      <span class="grid h-10 w-10 place-items-center rounded-2xl ${it.status==='released'?'bg-emerald-50 text-emerald-600':'bg-brand-50 text-brand-600'}"><i data-lucide="${it.status==='released'?'check-circle-2':'shield'}" class="h-5 w-5"></i></span>
      <div class="min-w-0 flex-1"><div class="truncate text-sm font-bold">${esc(it.title)}</div><div class="truncate text-xs text-slate-400">${esc(it.payer)} → ${esc(it.payee)}</div></div>
      <div class="text-right"><div class="text-sm font-extrabold">${fmtUSD(it.amount)}</div>${statusPill(it.status)}</div></button>`;
  };
  const doneCount = active.milestones.filter(m=>m.done).length;
  const progressPct = Math.round(doneCount/active.milestones.length*100);
  const fullyReleased = active.status==="released";

  return `
  <section class="mesh relative overflow-hidden rounded-[2rem] border border-slate-100 bg-white p-6 sm:p-8 shadow-soft">
    <span class="blob bg-emerald-100/50" style="width:260px;height:260px;top:-90px;right:-30px"></span>
    <div class="relative">${eyebrow(t("pay.eyebrow"))}
      <h1 class="mt-2 text-3xl sm:text-4xl font-extrabold tracking-tight">${t("pay.title")}</h1>
      <p class="mt-2 max-w-xl text-[15px] leading-relaxed text-slate-600">${t("pay.body")}</p>
      <div class="mt-5 grid grid-cols-2 gap-3 sm:grid-cols-3">
        <div class="rounded-2xl bg-slate-50 p-4"><div class="text-xs font-bold text-slate-400">${t("pay.total")}</div><div class="mt-1 text-2xl font-extrabold gradient-text">${fmtUSD(total)}</div></div>
        <div class="rounded-2xl bg-brand-50 p-4"><div class="text-xs font-bold text-brand-700">${t("pay.protected")}</div><div class="mt-1 text-2xl font-extrabold text-brand-700">${fmtUSD(protectedAmt)}</div></div>
        <div class="rounded-2xl bg-emerald-50 p-4"><div class="text-xs font-bold text-emerald-700">${t("pay.released")}</div><div class="mt-1 text-2xl font-extrabold text-emerald-600">${items.filter(i=>i.status==='released').length}</div></div>
      </div>
    </div>
  </section>

  <div class="mt-6 grid gap-6 lg:grid-cols-[340px_1fr]">
    <div class="rounded-3xl border border-slate-100 bg-white p-4 shadow-card">
      <h2 class="mb-3 px-1 text-sm font-extrabold">${t("pay.history")}</h2>
      <div class="space-y-2">${items.map(row).join("")}</div>
    </div>

    <div class="rounded-3xl border border-slate-100 bg-white p-6 shadow-soft">
      <div class="flex items-start justify-between gap-3">
        <div><h3 class="text-lg font-extrabold">${esc(active.title)}</h3>
          <p class="mt-1 text-sm text-slate-500">${esc(active.payer)} → ${esc(active.payee)}</p></div>
        ${statusPill(active.status)}
      </div>
      <div class="mt-4 flex items-end justify-between">
        <div><div class="text-xs font-bold text-slate-400">${t("pay.total")}</div><div class="text-3xl font-extrabold">${fmtUSD(active.amount)}</div></div>
        <div class="text-right text-sm text-slate-500">${doneCount}/${active.milestones.length} ${t("pay.milestones")}</div>
      </div>
      <div class="mt-2 h-2.5 w-full overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full gradient-cta transition-all duration-700" style="width:${progressPct}%"></div></div>

      <h4 class="mt-6 text-sm font-extrabold text-slate-900">${t("pay.milestones")}</h4>
      <div class="mt-3 space-y-2">
        ${active.milestones.map((m,i)=>`
          <div class="flex items-center gap-3 rounded-2xl border ${m.done?'border-emerald-100 bg-emerald-50/40':'border-slate-100'} p-3">
            <span class="grid h-8 w-8 place-items-center rounded-full ${m.done?'bg-emerald-500 text-white':'bg-slate-100 text-slate-400'} text-xs font-bold">${m.done?'✓':i+1}</span>
            <div class="flex-1 text-sm font-semibold ${m.done?'text-slate-500 line-through':'text-slate-800'}">${esc(m.label)}</div>
            <div class="text-sm font-extrabold">${fmtUSD(m.amount)}</div></div>`).join("")}
      </div>

      <div class="mt-6 flex flex-wrap gap-3">
        ${active.status==="pending"
          ? `<button data-action="pay-fund" data-id="${active.id}" class="inline-flex items-center gap-2 rounded-2xl gradient-cta px-5 py-3 text-sm font-bold text-white shadow-glow transition hover:-translate-y-0.5"><i data-lucide="lock" class="h-4 w-4"></i>${t("pay.fund")}</button>`
          : ""}
        ${!fullyReleased
          ? `<button data-action="pay-release" data-id="${active.id}" ${active.status==='pending'?'disabled':''} class="inline-flex items-center gap-2 rounded-2xl border border-slate-200 bg-white px-5 py-3 text-sm font-bold text-slate-700 transition hover:-translate-y-0.5 hover:shadow-card disabled:opacity-40"><i data-lucide="unlock" class="h-4 w-4"></i>${t("pay.release")}</button>`
          : `<span class="inline-flex items-center gap-2 rounded-2xl bg-emerald-50 px-5 py-3 text-sm font-bold text-emerald-700"><i data-lucide="check-check" class="h-4 w-4"></i>${t("pay.released")}</span>`}
      </div>
      <div class="mt-4 flex items-center gap-2 rounded-2xl bg-slate-50 px-4 py-3 text-xs text-slate-500">
        <i data-lucide="shield-check" class="h-4 w-4 text-brand-600"></i>${STORE.language==='ko'?'에스크로가 자금을 보호하며, 마일스톤 승인 시에만 단계별로 해제됩니다.':'Escrow protects funds and releases them per milestone only upon approval.'}
      </div>
    </div>
  </div>`;
};

/* ============================================================
   BOOTSTRAP
   ============================================================ */
window.addEventListener("hashchange", onHashChange);
document.addEventListener("DOMContentLoaded", ()=>{
  STORE.route = routeFromHash();
  if (!location.hash) location.replace("#/home");
  dispatch("BOOT");          // phase -> idle
  render();                  // first paint = home content (no splash/gate)
});
</script>
</body>
</html>
