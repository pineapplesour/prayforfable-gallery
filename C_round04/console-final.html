      <img src="https://i.pravatar.cc/64?img=${c.img}" class="h-11 w-11 shrink-0 rounded-full object-cover" alt=""/>
      <div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="truncate text-sm font-bold">${esc(c.peer)}</span>
        ${c.unread ? `<span class="ml-auto grid h-5 min-w-[20px] place-items-center rounded-full bg-rose-500 px-1.5 text-[11px] font-bold text-white">${c.unread}</span>` : ""}</div>
        <div class="truncate text-[12px] text-slate-500">${esc(c.last)}</div></div></button>`;
  }
  function convChip(c) {
    const on = c.id === App.selectedConversationId;
    return `<button data-action="select-chat" data-conv="${c.id}" class="conv-chip flex shrink-0 items-center gap-2 rounded-full border px-2.5 py-1.5 text-left transition ${on ? "border-brand-200 bg-brand-50" : "border-slate-200 bg-white hover:bg-slate-50"}">
      <span class="relative"><img src="https://i.pravatar.cc/48?img=${c.img}" class="h-7 w-7 rounded-full object-cover" alt=""/>
      ${c.unread ? `<span class="absolute -right-0.5 -top-0.5 grid h-4 min-w-[16px] place-items-center rounded-full bg-rose-500 px-1 text-[9px] font-bold text-white ring-2 ring-white">${c.unread}</span>` : ""}</span>
      <span class="max-w-[7rem] truncate text-xs font-bold ${on ? "text-brand-700" : "text-slate-600"}">${esc(c.peer)}</span></button>`;
  }
  function refreshConvLists() {
    const list = $("#conv-list"); if (list) { list.innerHTML = DB.conversations.map(convRow).join(""); }
    const mob = $("#conv-list-mobile"); if (mob) { mob.innerHTML = DB.conversations.map(convChip).join(""); }
    icons();
  }

  async function renderThread() {
    const panel = $("#chat-panel"); if (!panel) return;
    const cid = App.selectedConversationId;
    if (!cid) { panel.innerHTML = `<div class="grid h-full place-items-center p-8 text-sm text-slate-400" data-i18n="chat.empty">${esc(t("chat.empty"))}</div>`; return; }
    const conv = DB.conversations.find((c) => c.id === cid);
    panel.innerHTML = `<div class="skeleton m-4 flex-1 rounded-2xl"></div>`;
    const { messages } = await api.messages(cid);
    panel.innerHTML = `
      <header class="flex items-center gap-3 border-b border-slate-100 px-4 py-3 sm:px-5">
        <img src="https://i.pravatar.cc/64?img=${conv.img}" class="h-10 w-10 shrink-0 rounded-full object-cover" alt=""/>
        <div class="min-w-0"><div class="truncate text-sm font-extrabold">${esc(conv.peer)}</div><div class="flex items-center gap-1 text-[11px] text-emerald-500"><span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>online</div></div>
        <a href="#/matching" class="ml-auto inline-flex shrink-0 items-center gap-1.5 rounded-xl border border-brand-200 bg-brand-50 px-2.5 py-1.5 text-xs font-bold text-brand-700 transition hover:bg-brand-100 sm:px-3"><i data-lucide="handshake" class="h-3.5 w-3.5"></i><span class="hidden sm:inline" data-i18n="chat.makeOffer">${esc(t("chat.makeOffer"))}</span></a>
      </header>
      <div id="msg-scroll" class="min-w-0 flex-1 space-y-3 overflow-y-auto scroll-thin px-4 py-4 sm:px-5">
        ${messages.map(bubble).join("")}
        <div data-visible-state="submitting running" class="flex items-center gap-2 text-xs text-slate-400">
          <span class="flex gap-1"><span class="h-1.5 w-1.5 animate-bounce rounded-full bg-brand-400"></span><span class="h-1.5 w-1.5 animate-bounce rounded-full bg-brand-400" style="animation-delay:.15s"></span><span class="h-1.5 w-1.5 animate-bounce rounded-full bg-brand-400" style="animation-delay:.3s"></span></span>
          <span data-i18n="chat.thinking">${esc(t("chat.thinking"))}</span>
        </div>
      </div>
      <form data-action="submit-question" class="flex items-center gap-2 border-t border-slate-100 p-3">
        <button type="button" data-action="attach" class="grid h-10 w-10 shrink-0 place-items-center rounded-xl border border-slate-200 text-slate-500 transition hover:border-brand-200" title="${esc(t("chat.attach"))}"><i data-lucide="paperclip" class="h-4 w-4"></i></button>
        <input name="text" autocomplete="off" data-i18n-ph="chat.placeholder" placeholder="${esc(t("chat.placeholder"))}" class="min-w-0 flex-1 rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-brand-400"/>
        <button type="submit" data-visible-state="idle composing completed failed source_open cancelled offline_queued" class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-brand-600 to-indigo-600 text-white transition hover:shadow-glow"><i data-lucide="send" class="h-4 w-4"></i></button>
        <button type="button" data-action="cancel-job" data-visible-state="submitting running" class="grid h-10 w-10 shrink-0 place-items-center rounded-xl border border-rose-200 bg-rose-50 text-rose-600" title="${esc(t("chat.cancel"))}"><i data-lucide="square" class="h-4 w-4"></i></button>
      </form>`;
    icons();
    refreshVisibleStates();
    scrollMsgs();
  }

  function bubble(m) {
    const mine = m.from === "me";
    const src = m.source ? `<button data-action="open-source" data-msg="${m.id}" class="mt-1.5 inline-flex items-center gap-1 text-[11px] font-bold ${mine ? "text-brand-200" : "text-brand-600"} hover:underline"><i data-lucide="quote" class="h-3 w-3"></i><span data-i18n="chat.source">${esc(t("chat.source"))}</span></button>` : "";
    const att = m.attachment ? `<div class="mt-2 flex items-center gap-2 rounded-xl ${mine ? "bg-white/15" : "bg-slate-100"} px-3 py-2 text-xs font-semibold"><i data-lucide="file-text" class="h-4 w-4"></i><span>${esc(m.attachment.filename)}</span>${m.attachment.watermark ? `<span class="rounded bg-brand-500/20 px-1.5 py-0.5 text-[10px]">WM</span>` : ""}</div>` : "";
    return `<div class="flex ${mine ? "justify-end" : "justify-start"}" data-msg-id="${m.id}">
      <div class="max-w-[80%] min-w-0">
        <div class="break-words rounded-2xl px-4 py-2.5 text-sm leading-relaxed ${mine ? "rounded-tr-md bg-gradient-to-br from-brand-600 to-indigo-600 text-white" : "rounded-tl-md bg-slate-100 text-slate-800"}">${esc(m.text)}${att}</div>
        <div class="mt-1 flex items-center gap-2 ${mine ? "justify-end" : ""}"><span class="text-[10px] text-slate-400">${esc(m.ts)}</span>${src}</div>
      </div></div>`;
  }
  function scrollMsgs() { const s = $("#msg-scroll"); if (s) s.scrollTop = s.scrollHeight; }

  /* ============================================================
     ROUTER
     ============================================================ */
  function currentRoute() {
    const h = (location.hash || "#/home").replace(/^#\//, "").split("/")[0];
    return ROUTES.find((r) => r.id === h) ? h : "home";
  }
  async function render() {
    App.route = currentRoute();
    renderNav();
    // reset transient machine state on navigation (but keep offline)
    setMachineState(App.network === "offline" ? "offline_queued" : "idle");
    const fn = Views[App.route] || Views.home;
    try { await fn(); } catch (e) { console.error(e); $("#view").innerHTML = `<div class="p-8 text-sm text-rose-600">render error: ${esc(e.message)}</div>`; }
    applyI18n($("#view"));
    refreshVisibleStates();
    $("#view").scrollTop = 0;
  }

  /* ============================================================
     COMMAND PALETTE
     ============================================================ */
  function paletteCommands() {
    const cmds = ROUTES.map((r) => ({ icon: r.icon, label: t(r.i18n), hint: "이동", run: () => (location.hash = "#/" + r.id) }));
    cmds.push(
      { icon: "languages", label: App.lang === "ko" ? "Switch to English" : "한국어로 전환", hint: "i18n", run: () => dispatch("change-language") },
      { icon: "user-cog", label: App.role === "brand" ? "크리에이터 역할로" : "브랜드 역할로", hint: "role", run: () => setRole(App.role === "brand" ? "creator" : "brand") },
      { icon: "rocket", label: t("home.startCampaign"), hint: "create", run: () => (location.hash = "#/create") },
      { icon: "shield-check", label: t("nav.payment"), hint: "escrow", run: () => (location.hash = "#/payment") },
    );
    return cmds;
  }
  let paletteFiltered = [];
  function openPalette() {
    const p = $("#palette"); p.classList.remove("hidden"); p.classList.add("flex");
    $("#palette-input").value = ""; drawPalette(""); $("#palette-input").focus();
  }
  function closePalette() { const p = $("#palette"); p.classList.add("hidden"); p.classList.remove("flex"); }
  function drawPalette(q) {
    const all = paletteCommands();
    paletteFiltered = all.filter((c) => !q || c.label.toLowerCase().includes(q.toLowerCase()));
    const list = $("#palette-list");
    list.innerHTML = paletteFiltered.length ? paletteFiltered.map((c, i) => `
      <button data-pi="${i}" class="palette-item flex w-full items-center gap-3 rounded-2xl px-3 py-2.5 text-left transition ${i === 0 ? "bg-brand-50" : "hover:bg-slate-50"}">
        <span class="grid h-8 w-8 place-items-center rounded-xl bg-slate-100 text-brand-600"><i data-lucide="${c.icon}" class="h-4 w-4"></i></span>
        <span class="flex-1 text-sm font-semibold">${esc(c.label)}</span>
        <span class="text-[11px] text-slate-400">${esc(c.hint)}</span></button>`).join("")
      : `<div class="px-3 py-6 text-center text-sm text-slate-400">No results</div>`;
    icons();
  }

  /* ============================================================
     COMMAND DISPATCH (single delegated handler)
     ============================================================ */
  function setRole(role) {
    App.role = role; renderRole(); renderNav();
    toast("toast.role");
    if (App.route === "create" || App.route === "home") render();
  }

  // network-aware mutation runner: queues while offline, honors job idempotency
  async function runMutation(label, fn, onDone) {
    if (App.network === "offline") {
      App.offlineQueue.push({ fn, onDone });
      toast("toast.queued", "warn");
      setMachineState("offline_queued");
      return;
    }
    await fn(onDone);
  }
  async function flushQueue() {
    if (!App.offlineQueue.length) return;
    const q = App.offlineQueue.splice(0);
    for (const job of q) { try { await job.fn(job.onDone); } catch (e) { console.error(e); } }
    toast("toast.flushed", "info");
  }

  function dispatch(action, target, ev) {
    switch (action) {
      case "open-palette": openPalette(); break;
      case "close-palette": closePalette(); break;
      case "toggle-drawer": $("#drawer").classList.remove("hidden"); break;
      case "close-drawer": $("#drawer").classList.add("hidden"); break;
      case "set-role": setRole(target.getAttribute("data-role")); $("#drawer").classList.add("hidden"); break;
      case "change-language":
        App.lang = App.lang === "ko" ? "en" : "ko"; renderLang(); renderRole(); renderNav();
        toast("toast.lang", "info"); render(); break;
      case "toggle-network": toggleNetwork(); break;

      case "dir-filter": break; // handled inline

      case "propose": {
        const cid = target.getAttribute("data-creator");
        const cr = DB.creators.find((c) => c.id === cid);
        runMutation("offer", async () => {
          setMachineState("submitting");
          const { conversationId } = await api.createOffer({ targetUserId: cid, message: `${cr.displayName}님께 협업을 제안합니다.`, offerAmount: 2200 });
          App.selectedConversationId = conversationId;
          setMachineState("completed");
          toast("toast.offerSent"); location.hash = "#/chat";
        });
        break;
      }

      case "select-chat":
        if (App.selectedConversationId === target.getAttribute("data-conv")) break;
        App.selectedConversationId = target.getAttribute("data-conv");
        { const conv = DB.conversations.find((c) => c.id === App.selectedConversationId); if (conv) conv.unread = 0; }
        refreshConvLists();
        renderNav();
        renderThread();
        break;

      case "attach": {
        // simulate a file pick (no real upload) — adds a pending attachment chip via toast
        const inp = $('#chat-panel input[name="text"]');
        if (inp) { inp.value = (inp.value ? inp.value + " " : "") + "[concept-brief.txt]"; inp.focus(); }
        break;
      }

      case "cancel-job":
        if (App.activeJob) {
          setMachineState("cancelling");
          App.activeJob.cancelled = true;
          setMachineState("cancelled");
          App.activeJob = null;
          toast("toast.cancelled", "warn");
          setTimeout(() => setMachineState("idle"), 200);
        }
        break;

      case "open-source": {
        const mid = target.getAttribute("data-msg");
        let src = null;
        Object.values(DB.messages).forEach((arr) => arr.forEach((m) => { if (m.id === mid && m.source) src = m.source; }));
        if (src) openSource(src);
        break;
      }
      case "close-source": closeSource(); break;
      case "escrow-action": doEscrow(target); break;
      default: break;
    }
  }

  /* ---------- forms (submit handlers) ---------- */
  function busy(form, on) {
    const btn = form.querySelector('button[type="submit"][data-submit-label]') || form.querySelector('button[data-submit-label]');
    if (!btn) return;
    btn.disabled = on;
    const span = btn.querySelector("span[data-i18n]");
    if (span) span.textContent = t(on ? btn.getAttribute("data-busy-label") : btn.getAttribute("data-submit-label"));
  }

  function handleSubmit(form, action, ev) {
    const data = Object.fromEntries(new FormData(form).entries());

    if (action === "submit-question") {
      const text = (data.text || "").trim();
      if (!text) return;
      // INVARIANT: ignore if a job is already active for this chat (idempotency)
      if (App.activeJob && App.activeJob.chatId === App.selectedConversationId) return;
      const cid = App.selectedConversationId;
      runMutation("send", async () => {
        const clientActionId = uid("act");
        const jobId = uid("job");
        App.activeJob = { jobId, chatId: cid, clientActionId, cancelled: false };
        setMachineState("submitting");
        const { message } = await api.sendMessage(cid, { text });
        // append exactly one user message
        const scroll = $("#msg-scroll");
        if (scroll) { scroll.insertAdjacentHTML("beforeend", bubble(message)); icons(); scrollMsgs(); }
        form.reset();
        setMachineState("running");
        const reply = await api.assistantReply(cid);
        // INVARIANT: cancelled jobs must not append results; result must own same jobId
        if (!App.activeJob || App.activeJob.jobId !== jobId || App.activeJob.cancelled) { setMachineState("idle"); return; }
        const sc = $("#msg-scroll");
        if (sc) { sc.insertAdjacentHTML("beforeend", bubble(reply.message)); applyI18n(sc); icons(); scrollMsgs(); }
        App.activeJob = null;
        setMachineState("completed");
        setTimeout(() => { if (App.state === "completed") setMachineState("idle"); }, 300);
      });
      return;
    }

    if (action === "submit-offer") {
      runMutation("offer", async () => {
        busy(form, true); setMachineState("submitting");
        const { offer, conversationId } = await api.createOffer({ targetUserId: data.target, message: data.message, offerAmount: Number(data.amount) });
        App.selectedConversationId = conversationId;
        busy(form, false); setMachineState("completed");
        const list = $("#offer-list"); if (list) { const empty = list.querySelector("[data-i18n]"); if (empty && empty.getAttribute("data-i18n") === "match.noOffers") list.innerHTML = ""; list.insertAdjacentHTML("afterbegin", offerRow(offer)); applyI18n(list); icons(); }
        toast("toast.offerSent");
      });
      return;
    }

    if (action === "create-campaign") {
      runMutation("campaign", async () => {
        busy(form, true); setMachineState("submitting");
        await api.createCampaign({ title: data.title, brief: data.brief, budgetMin: Number(data.min), budgetMax: Number(data.max),
          platforms: String(data.platforms).split(",").map((s) => s.trim()).filter(Boolean),
          targetRegions: String(data.regions).split(",").map((s) => s.trim()).filter(Boolean) });
        busy(form, false); setMachineState("completed"); toast("toast.campaign");
      });
      return;
    }

    if (action === "apply-campaign") {
      const cId = (ev && ev.submitter && ev.submitter.getAttribute("data-campaign")) || "";
      runMutation("apply", async () => {
        setMachineState("submitting");
        await api.applyToCampaign({ campaignId: cId, message: data.message, quoteAmount: Number(data.quote) });
        setMachineState("completed"); toast("toast.applied");
      });
      return;
    }

    if (action === "gen-preview") {
      runMutation("preview", async () => {
        busy(form, true); setMachineState("submitting");
        const { previewSvg } = await api.createAssetPreview({ mode: data.mode, filename: data.filename, watermarkText: data.watermark, concept: data.concept });
        busy(form, false); setMachineState("completed");
        const out = $("#preview-out"); if (out) out.innerHTML = `<div class="aspect-video w-full">${previewSvg}</div>`;
        toast("toast.preview", "info");
      });
      return;
    }

    if (action === "create-escrow") {
      runMutation("escrow", async () => {
        busy(form, true); setMachineState("submitting");
        const { payment } = await api.createEscrowHold({ payeeUserId: data.payee, conversationId: data.conv, amount: Number(data.amount), currency: data.currency });
        busy(form, false); setMachineState("completed");
        const ledger = $("#ledger"); if (ledger) { const empty = ledger.querySelector('[data-i18n="pay.noEscrow"]'); if (empty) ledger.innerHTML = ""; ledger.insertAdjacentHTML("afterbegin", ledgerRow(payment)); applyI18n(ledger); icons(); }
        toast("toast.escrowCreated");
      });
      return;
    }

    if (action === "run-forecast") {
      busy(form, true); setMachineState("running");
      setTimeout(() => {
        const f = api.runForecast({ budget: Number(data.budget), platform: data.platform, market: data.market });
        App.forecast = f;
        busy(form, false); setMachineState("completed");
        const out = $("#fc-result"); if (out) { out.innerHTML = forecastResult(f); applyI18n(out); icons(); }
      }, 850);
      return;
    }
  }

  async function doEscrow(btn) {
    const pid = btn.getAttribute("data-payment");
    const op = btn.getAttribute("data-op");
    const next = op === "release" ? "released" : op;
    setMachineState("submitting");
    const { payment } = await api.updateEscrow(pid, next);
    setMachineState("completed");
    const row = btn.closest("[data-payment-row]");
    if (row && payment) { const fresh = el(ledgerRow(payment)); row.replaceWith(fresh); applyI18n(fresh); icons(); }
    toast(op === "release" ? "toast.released" : op === "refunded" ? "toast.refunded" : "toast.disputed", op === "disputed" ? "warn" : undefined);
  }

  /* ---------- source window ---------- */
  function openSource(src) {
    setMachineState("source_open");
    const ov = el(`<div id="source-ov" class="fixed inset-0 z-[65] flex items-end justify-center sm:items-center">
      <div data-action="close-source" class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm"></div>
      <div class="relative w-full max-w-lg rounded-t-3xl border border-white/60 bg-white p-6 shadow-2xl animate-fadeIn sm:rounded-3xl">
        <div class="mb-3 flex items-center justify-between">
          <div class="flex items-center gap-2"><i data-lucide="quote" class="h-4 w-4 text-brand-600"></i>
          <span class="text-sm font-extrabold" data-i18n="chat.sourceTitle">${esc(t("chat.sourceTitle"))}</span></div>
          <button data-action="close-source" class="grid h-8 w-8 place-items-center rounded-lg text-slate-400 hover:bg-slate-100"><i data-lucide="x" class="h-4 w-4"></i></button>
        </div>
        <div class="text-[11px] font-bold uppercase tracking-wide text-brand-700">${esc(src.title)}</div>
        <p class="mt-3 rounded-2xl bg-slate-50 p-4 text-sm leading-relaxed text-slate-700">
          <span class="text-slate-400">${esc(src.before || "")}</span><mark class="rounded bg-brand-100 px-1 text-brand-900">${esc(src.quote)}</mark><span class="text-slate-400">${esc(src.after || "")}</span>
        </p>
      </div></div>`);
    document.body.appendChild(ov); icons();
  }
  function closeSource() {
    const ov = $("#source-ov"); if (ov) ov.remove();
    setMachineState(App.network === "offline" ? "offline_queued" : "idle");
  }

  /* ---------- network ---------- */
  function toggleNetwork() {
    if (App.network === "online") {
      App.network = "offline";
      $("#net-ico").setAttribute("data-lucide", "wifi-off");
      $("#net-btn").className = "grid h-9 w-9 place-items-center rounded-full border border-amber-200 bg-amber-50 text-amber-600 transition";
      setMachineState("offline_queued");
    } else {
      App.network = "online";
      $("#net-ico").setAttribute("data-lucide", "wifi");
      $("#net-btn").className = "grid h-9 w-9 place-items-center rounded-full border border-slate-200 bg-white text-emerald-500 transition";
      setMachineState("idle");
      flushQueue();
    }
    icons(); refreshVisibleStates();
  }

  /* ============================================================
     GLOBAL EVENT WIRING (delegated, registered once)
     ============================================================ */
  document.addEventListener("click", (e) => {
    const actEl = e.target.closest("[data-action]");
    if (!actEl) return;
    const action = actEl.getAttribute("data-action");
    if (["submit-question","submit-offer","create-campaign","apply-campaign","gen-preview","create-escrow","run-forecast","dir-filter"].includes(action)) return; // form actions
    e.preventDefault();
    dispatch(action, actEl, e);
  });

  document.addEventListener("submit", (e) => {
    const form = e.target.closest("form[data-action]");
    if (!form) return;
    e.preventDefault();
    handleSubmit(form, form.getAttribute("data-action"), e);
  });

  // palette interactions
  $("#palette-input").addEventListener("input", (e) => drawPalette(e.target.value));
  $("#palette-list").addEventListener("click", (e) => {
    const item = e.target.closest("[data-pi]"); if (!item) return;
    const cmd = paletteFiltered[Number(item.getAttribute("data-pi"))];
    closePalette(); if (cmd) cmd.run();
  });

  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); const p = $("#palette"); p.classList.contains("hidden") ? openPalette() : closePalette(); return; }
    if (e.key === "Escape") { closePalette(); closeSource(); $("#drawer").classList.add("hidden"); return; }
    if (!$("#palette").classList.contains("hidden") && e.key === "Enter") {
      const cmd = paletteFiltered[0]; closePalette(); if (cmd) cmd.run();
    }
  });

  window.addEventListener("hashchange", () => { $("#drawer").classList.add("hidden"); render(); });

  /* ============================================================
     BOOT — home is the first paint (no splash / no gate)
     ============================================================ */
  function boot() {
    setMachineState("booting");
    renderLang(); renderRole(); renderNav();
    if (!location.hash) location.hash = "#/home";
    render();
    setMachineState("idle");
    icons();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
