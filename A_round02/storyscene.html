<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>등불을 든 아이 · The Lamp-Bearer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gothic+A1:wght@300;400;500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0a0c18;
  --ink2:#11142a;
  --paper:#f4ecd8;
  --flame:#ffcf6b;
  --flame2:#ff9d3b;
  --ember:#ff6a3d;
  --teal:#6fe3d2;
  --violet:#7a6bff;
  --rose:#ff7aa8;
  --mute:#9aa0c4;
  --halo: 60vmax;
  --mx:50vw; --my:48vh;
}
@property --halo{syntax:'<length-percentage>';inherits:true;initial-value:40vmax}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--ink);overflow:hidden;color:var(--paper);
  font-family:"Gothic A1",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{position:fixed;inset:0;cursor:none}
@media (pointer:coarse){body{cursor:auto}}

/* ====== STAGE ====== */
#stage{position:absolute;inset:0;}
svg{display:block;width:100%;height:100%}
.scene{opacity:0;transition:opacity 1.1s cubic-bezier(.45,0,.2,1);pointer-events:none}
.scene.live{opacity:1}

/* ====== NIGHT VEIL / LIGHT MASK ====== */
#veil{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;z-index:5;
  background:
   radial-gradient(var(--halo) var(--halo) at var(--mx) var(--my),
     rgba(255,255,255,0) 0%,
     rgba(40,42,70,.04) 30%,
     rgba(14,16,34,.40) 52%,
     rgba(6,7,18,.86) 74%,
     #04050e 100%);}
#glow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;z-index:6;
  background:radial-gradient(calc(var(--halo)*.62) calc(var(--halo)*.62) at var(--mx) var(--my),
     rgba(255,214,128,.40) 0%, rgba(255,157,59,.18) 32%, rgba(255,106,61,0) 62%);}
body.dawn #veil{background:radial-gradient(140vmax 140vmax at var(--mx) var(--my),
     rgba(255,255,255,0) 0%, rgba(20,22,46,0) 60%, rgba(10,12,24,.18) 100%)}
body.dawn #glow{opacity:.4}

/* grain */
#grain{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>")}

/* cursor lamp dot */
#cur{position:fixed;z-index:30;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle,#fff6df 0%,#ffcf6b 40%,rgba(255,157,59,0) 72%);
  transform:translate(-50%,-50%) scale(1);pointer-events:none;filter:drop-shadow(0 0 8px #ffcf6b);
  transition:transform .15s ease}
@media (pointer:coarse){#cur{display:none}}

/* ====== UI / TEXT ====== */
#hud{position:absolute;inset:0;z-index:12;pointer-events:none}
.eyebrow{position:absolute;top:30px;left:36px;font-size:11px;letter-spacing:.42em;color:var(--mute);
  font-weight:500;text-transform:uppercase;display:flex;gap:14px;align-items:center}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--flame);box-shadow:0 0 10px var(--flame);
  animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.6)}}
.corner-r{position:absolute;top:30px;right:36px;font-size:11px;letter-spacing:.34em;color:var(--mute);
  text-align:right;font-weight:500;line-height:2}

/* narrative card */
#story{position:absolute;left:50%;bottom:11vh;transform:translateX(-50%);width:min(680px,86vw);
  text-align:center;pointer-events:none}
#chapno{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:15px;letter-spacing:.2em;
  color:var(--flame);opacity:.85;margin-bottom:10px}
#title{font-family:"Gowun Batang",serif;font-weight:700;line-height:1.12;
  font-size:clamp(30px,5.4vw,62px);text-shadow:0 2px 40px rgba(0,0,0,.6);margin-bottom:14px;
  letter-spacing:-.01em}
#title .em{color:var(--flame);text-shadow:0 0 30px rgba(255,207,107,.6)}
#title .em2{color:var(--teal)}
#title .em3{color:var(--rose)}
#body{font-size:clamp(14px,1.5vw,17px);line-height:1.85;color:#e7e2d2;opacity:.92;
  font-weight:300;max-width:560px;margin:0 auto;text-shadow:0 2px 18px rgba(0,0,0,.7)}
#body b{color:var(--flame);font-weight:500}

/* word reveal */
#title span.w,#body span.w{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(6px);
  transition:opacity .6s,transform .6s,filter .6s}
#title span.w.on,#body span.w.on{opacity:1;transform:none;filter:none}

/* choices */
#choices{position:absolute;left:50%;bottom:3.4vh;transform:translateX(-50%);display:flex;gap:14px;
  pointer-events:auto;flex-wrap:wrap;justify-content:center;width:min(720px,92vw);z-index:14}
.choice{position:relative;cursor:pointer;border:1px solid rgba(244,236,216,.2);
  background:rgba(12,14,30,.55);backdrop-filter:blur(8px);color:var(--paper);
  padding:13px 22px;border-radius:40px;font-size:13.5px;font-weight:500;letter-spacing:.02em;
  display:flex;align-items:center;gap:10px;overflow:hidden;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),border-color .3s,background .3s;opacity:0;
  transform:translateY(18px)}
.choice.in{opacity:1;transform:none}
.choice .gem{width:8px;height:8px;border-radius:50%;background:var(--flame);box-shadow:0 0 10px var(--flame);
  flex:none;transition:background .3s,box-shadow .3s}
.choice:hover{transform:translateY(-3px);border-color:var(--flame);background:rgba(40,28,12,.65)}
.choice:hover .gem{background:#fff;box-shadow:0 0 14px var(--flame)}
.choice::after{content:"";position:absolute;inset:0;background:
  radial-gradient(120px 60px at var(--cx,50%) 120%,rgba(255,207,107,.4),transparent 70%);opacity:0;
  transition:opacity .3s}
.choice:hover::after{opacity:1}
.choice .sub{color:var(--mute);font-weight:300;font-size:11.5px}

/* progress dots */
#track{position:absolute;left:50%;top:34px;transform:translateX(-50%);display:flex;gap:9px;z-index:14}
.tk{width:26px;height:3px;border-radius:3px;background:rgba(244,236,216,.18);overflow:hidden;position:relative}
.tk i{position:absolute;inset:0;background:var(--flame);transform:scaleX(0);transform-origin:left;
  transition:transform .5s;box-shadow:0 0 8px var(--flame)}
.tk.done i{transform:scaleX(1)}
.tk.now i{transform:scaleX(1);animation:none}

/* bottom controls */
#ctrl{position:absolute;left:36px;bottom:30px;z-index:14;display:flex;gap:10px;pointer-events:auto;align-items:center}
.btn{cursor:pointer;border:1px solid rgba(244,236,216,.16);background:rgba(12,14,30,.5);
  color:var(--mute);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  backdrop-filter:blur(6px);transition:all .25s}
.btn:hover{color:var(--flame);border-color:var(--flame)}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7}
#hint{position:absolute;right:36px;bottom:32px;z-index:14;font-size:11px;color:var(--mute);
  letter-spacing:.2em;display:flex;gap:8px;align-items:center;opacity:.8}
#hint .k{border:1px solid rgba(244,236,216,.25);border-radius:5px;padding:2px 7px;font-size:10px}

/* intro skip overlay (auto fades; content visible behind) */
#splash{position:absolute;inset:0;z-index:20;display:grid;place-items:center;
  background:radial-gradient(60vmax 60vmax at 50% 46%,rgba(10,12,28,.0),#04050e 78%);
  transition:opacity 1s;pointer-events:none}
#splash.gone{opacity:0}
#splash .mark{font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:.6em;
  color:var(--flame);text-transform:uppercase;opacity:.9;animation:fadeUp 1.2s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:.9;transform:none}}

/* end card */
#endcard{position:absolute;inset:0;z-index:22;display:grid;place-items:center;opacity:0;
  pointer-events:none;background:radial-gradient(70vmax 70vmax at 50% 46%,rgba(255,207,107,.05),rgba(4,5,14,.9));
  transition:opacity 1.2s}
#endcard.on{opacity:1;pointer-events:auto}
.endbox{text-align:center;max-width:560px;padding:40px}
.endbox h2{font-family:"Gowun Batang",serif;font-size:clamp(26px,4vw,46px);color:var(--paper);margin-bottom:18px}
.endbox p{color:#d9d3c2;font-weight:300;line-height:1.9;font-size:15px;margin-bottom:8px}
.endbox .stamp{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--flame);
  font-size:18px;margin:18px 0 26px}
.replay{cursor:pointer;display:inline-flex;gap:10px;align-items:center;color:var(--ink);
  background:var(--flame);border:none;padding:13px 26px;border-radius:40px;font-weight:700;
  font-size:14px;font-family:"Gothic A1";letter-spacing:.02em;transition:transform .3s,box-shadow .3s}
.replay:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(255,157,59,.35)}

@media(max-width:560px){
  .eyebrow{top:16px;left:16px;font-size:9px;letter-spacing:.28em}
  .corner-r{display:none}
  #track{top:44px}
  #ctrl{left:14px;bottom:16px}
  #hint{display:none}
  /* text lives in the UPPER band; character + lit scene own the lower 55% */
  #story{top:9vh;bottom:auto;width:92vw}
  #title{font-size:clamp(26px,8vw,40px)}
  #body{font-size:13.5px;line-height:1.7;max-width:92vw}
  #choices{bottom:2.4vh;gap:9px}
  .choice{padding:11px 15px;font-size:12px}
  .choice .sub{display:none}
  #endcard .endbox{padding:24px}
}
@media(max-width:560px) and (max-height:720px){ #story #body{display:none} }
</style>
</head>
<body>

<div id="stage">
<svg id="art" viewBox="0 0 1600 900" preserveAspectRatio="xMinYMid slice">
 <defs>
  <radialGradient id="skyNight" cx="50%" cy="20%" r="120%">
    <stop offset="0%" stop-color="#1b2050"/><stop offset="45%" stop-color="#101434"/>
    <stop offset="100%" stop-color="#070912"/>
  </radialGradient>
  <linearGradient id="skyForest" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0d2a2b"/><stop offset="60%" stop-color="#0a1c22"/>
    <stop offset="100%" stop-color="#06121a"/>
  </linearGradient>
  <radialGradient id="skyWater" cx="50%" cy="35%" r="110%">
    <stop offset="0%" stop-color="#10243f"/><stop offset="60%" stop-color="#0a1830"/>
    <stop offset="100%" stop-color="#050a1c"/>
  </radialGradient>
  <linearGradient id="skyDawn" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3a2c63"/><stop offset="38%" stop-color="#8a5a8e"/>
    <stop offset="62%" stop-color="#e8896a"/><stop offset="84%" stop-color="#ffc879"/>
    <stop offset="100%" stop-color="#ffe6b0"/>
  </linearGradient>
  <radialGradient id="flameG" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#fff7e0"/><stop offset="40%" stop-color="#ffcf6b"/>
    <stop offset="80%" stop-color="#ff9d3b"/><stop offset="100%" stop-color="#ff6a3d"/>
  </radialGradient>
  <linearGradient id="riverG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1a3a5e"/><stop offset="100%" stop-color="#0a1a30"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="soft2"><feGaussianBlur stdDeviation="2.2"/></filter>
 </defs>

 <!-- backdrop that recolors per scene -->
 <rect id="bg" width="1600" height="900" fill="url(#skyNight)"/>

 <!-- ====== STARFIELD (persistent) ====== -->
 <g id="stars"></g>
 <!-- moon -->
 <g id="moon" class="scene live" data-min="0" data-max="2">
   <circle cx="1310" cy="170" r="62" fill="#eef2ff" opacity=".92"/>
   <circle cx="1330" cy="155" r="58" fill="url(#skyNight)" opacity=".55"/>
   <circle cx="1288" cy="188" r="9" fill="#cdd4ef" opacity=".5"/>
   <circle cx="1322" cy="200" r="6" fill="#cdd4ef" opacity=".4"/>
 </g>

 <!-- ====== SCENE 0: HOME on a hill (intro/first paint) ====== -->
 <g id="sc-home" class="scene live">
   <path d="M0 660 Q400 600 800 640 T1600 620 V900 H0 Z" fill="#0e1430"/>
   <path d="M0 720 Q500 680 900 710 T1600 700 V900 H0 Z" fill="#0a0f24"/>
   <!-- distant village -->
   <g opacity=".7">
     <rect x="180" y="600" width="46" height="58" fill="#161c3a"/><polygon points="178,600 203,580 228,600" fill="#1d2447"/>
     <rect x="250" y="612" width="38" height="46" fill="#141a36"/><polygon points="248,612 269,596 290,612" fill="#1b2243"/>
     <rect x="120" y="616" width="34" height="42" fill="#10162f"/>
   </g>
   <!-- big tree -->
   <g transform="translate(1180,400)">
     <rect x="-10" y="150" width="20" height="120" rx="8" fill="#1a1308"/>
     <circle cx="0" cy="90" r="120" fill="#0c2418"/>
     <circle cx="-70" cy="130" r="80" fill="#0a1f15"/>
     <circle cx="70" cy="120" r="86" fill="#0b2117"/>
   </g>
   <!-- the cottage with warm window -->
   <g transform="translate(360,470)">
     <rect x="0" y="60" width="200" height="150" rx="6" fill="#241a2e"/>
     <polygon points="-18,60 100,-14 218,60" fill="#311f33"/>
     <rect x="86" y="120" width="44" height="90" fill="#1a1322"/>
     <rect id="homeWin" x="22" y="92" width="46" height="46" rx="4" fill="#ffcf6b"/>
     <rect x="132" y="92" width="46" height="46" rx="4" fill="#3a2a3e"/>
     <circle cx="108" cy="34" r="6" fill="#0f0a14"/>
   </g>
 </g>

 <!-- ====== SCENE 1: FOREST ====== -->
 <g id="sc-forest" class="scene">
   <g opacity=".9">
     <!-- layered trunks -->
     <g fill="#06140f">
       <rect x="120" y="200" width="70" height="700"/><rect x="380" y="120" width="100" height="780"/>
       <rect x="1180" y="160" width="90" height="740"/><rect x="1420" y="220" width="70" height="680"/>
     </g>
     <g fill="#0b2118">
       <rect x="640" y="260" width="60" height="640"/><rect x="900" y="220" width="80" height="680"/>
     </g>
   </g>
   <!-- canopy -->
   <path d="M0 0 Q200 160 0 260 M1600 0 Q1400 180 1600 280" stroke="#0a1d14" stroke-width="0" fill="none"/>
   <path d="M0 0 H1600 V120 Q1200 220 800 130 Q400 40 0 160 Z" fill="#08160f"/>
   <!-- fireflies -->
   <g id="flies"></g>
   <!-- ground -->
   <path d="M0 760 Q800 720 1600 760 V900 H0 Z" fill="#06120c"/>
   <!-- fox companion (appears later) -->
   <g id="fox" opacity="0" transform="translate(1000,720)">
     <ellipse cx="0" cy="40" rx="46" ry="22" fill="#b6552a"/>
     <path d="M30 36 q60 -6 90 24 q-30 6 -54 -2 q14 14 4 24 q-26 -6 -40 -22 Z" fill="#c66433"/>
     <circle cx="-36" cy="20" r="20" fill="#c66433"/>
     <polygon points="-50,4 -44,-18 -34,2" fill="#b6552a"/><polygon points="-26,2 -20,-18 -14,6" fill="#b6552a"/>
     <circle cx="-44" cy="20" r="3.2" fill="#1a0e08"/>
     <circle cx="-52" cy="22" r="3" fill="#fff" opacity=".25"/>
     <ellipse cx="-36" cy="28" rx="7" ry="5" fill="#f3e6d4"/>
     <circle cx="-38" cy="29" r="2.2" fill="#1a0e08"/>
   </g>
 </g>

 <!-- ====== SCENE 2: RIVER ====== -->
 <g id="sc-river" class="scene">
   <path d="M0 520 Q500 470 1000 510 T1600 500 V640 H0 Z" fill="#0a1830"/>
   <!-- water -->
   <rect id="riverRect" x="0" y="600" width="1600" height="300" fill="url(#riverG)"/>
   <g id="ripples"></g>
   <!-- moon reflection -->
   <ellipse cx="1310" cy="720" rx="40" ry="120" fill="#eef2ff" opacity=".12"/>
   <!-- stepping stones -->
   <g fill="#1b2440" stroke="#27314f" stroke-width="2">
     <ellipse cx="280" cy="700" rx="44" ry="16"/><ellipse cx="520" cy="740" rx="40" ry="15"/>
     <ellipse cx="760" cy="710" rx="46" ry="16"/><ellipse cx="1010" cy="745" rx="42" ry="15"/>
     <ellipse cx="1260" cy="712" rx="44" ry="16"/>
   </g>
   <!-- paper boat lantern -->
   <g id="boat" opacity="0" transform="translate(700,690)">
     <path d="M-40 0 L40 0 L26 22 L-26 22 Z" fill="#f4ecd8"/>
     <path d="M0 -2 L0 -34" stroke="#caa66a" stroke-width="2"/>
     <polygon points="0,-34 30,-22 0,-12" fill="#ff9d3b"/>
     <circle cx="0" cy="8" r="7" fill="url(#flameG)"/>
   </g>
 </g>

 <!-- ====== SCENE 3: CLIFF / SUMMIT ====== -->
 <g id="sc-cliff" class="scene">
   <path d="M0 900 V520 Q260 470 520 540 L520 900 Z" fill="#0c1126"/>
   <path d="M1600 900 V480 Q1300 430 1040 520 L1040 900 Z" fill="#0e1430"/>
   <path d="M520 900 V600 Q780 560 1040 600 L1040 900 Z" fill="#070b1c"/>
   <!-- far peaks silhouettes -->
   <g fill="#141a3a" opacity=".7">
     <polygon points="0,540 200,360 380,540"/><polygon points="300,540 520,300 740,540"/>
     <polygon points="900,540 1140,330 1380,540"/><polygon points="1240,540 1460,380 1600,540"/>
   </g>
   <!-- wind streaks -->
   <g id="wind" stroke="#9fb0e0" stroke-width="1.4" opacity=".4" fill="none"></g>
 </g>

 <!-- ====== SCENE 4: DAWN HORIZON ====== -->
 <g id="sc-dawn" class="scene">
   <!-- sun rising -->
   <circle id="dawnSun" cx="800" cy="900" r="150" fill="url(#flameG)" opacity="0"/>
   <path d="M0 640 Q800 600 1600 640 V900 H0 Z" fill="#5a3a55" opacity=".7"/>
   <path d="M0 720 Q800 690 1600 720 V900 H0 Z" fill="#3a2447" opacity=".8"/>
   <path d="M0 800 Q800 778 1600 800 V900 H0 Z" fill="#241632"/>
   <!-- birds -->
   <g id="birds" stroke="#2a1d33" stroke-width="3" fill="none" stroke-linecap="round"></g>
 </g>

 <!-- ====== THE CHILD (lantern-bearer) — always on top, walks across ====== -->
 <g id="child" transform="translate(620,720)" style="--s:1.5">
 <g transform="scale(1.5)">
   <!-- lantern glow handled by CSS mask; here the lantern object -->
   <g id="lantern" transform="translate(46,-8)">
     <circle cx="0" cy="0" r="22" fill="url(#flameG)" opacity=".55"/>
     <rect x="-9" y="-12" width="18" height="24" rx="4" fill="#1a1208" stroke="#caa66a" stroke-width="1.5"/>
     <circle cx="0" cy="0" r="6" fill="#fff7e0"/>
     <path d="M0 -12 q-10 -10 0 -18 q10 8 0 18" fill="none" stroke="#caa66a" stroke-width="1.5"/>
     <line x1="0" y1="-30" x2="2" y2="-46" stroke="#caa66a" stroke-width="1.5"/>
   </g>
   <!-- body -->
   <g id="kid">
     <!-- cloak -->
     <path d="M-18 -34 Q0 -50 18 -34 L26 18 Q0 30 -26 18 Z" fill="#5b3aa0"/>
     <path d="M-18 -34 Q0 -50 18 -34 L20 -10 Q0 -2 -20 -10 Z" fill="#6f4ac0"/>
     <!-- head -->
     <circle cx="0" cy="-52" r="15" fill="#f0d2b0"/>
     <path d="M-15 -56 Q0 -78 15 -56 Q12 -64 0 -66 Q-12 -64 -15 -56" fill="#2a1b14"/>
     <circle cx="-5" cy="-52" r="2" fill="#241a14"/><circle cx="6" cy="-52" r="2" fill="#241a14"/>
     <path d="M-4 -45 Q0 -42 5 -45" stroke="#b06a4a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
     <!-- arm holding lantern -->
     <path id="armR" d="M14 -22 Q34 -22 44 -10" stroke="#6f4ac0" stroke-width="9" fill="none" stroke-linecap="round"/>
     <!-- legs (animated) -->
     <path id="legL" d="M-6 16 L-12 40" stroke="#2c1c52" stroke-width="9" stroke-linecap="round"/>
     <path id="legR" d="M6 16 L12 40" stroke="#3a2668" stroke-width="9" stroke-linecap="round"/>
   </g>
 </g>
 </g>
</svg>
</div>

<div id="veil"></div>
<div id="glow"></div>
<div id="grain"></div>

<div id="hud">
  <div class="eyebrow"><span class="dot"></span>INTERACTIVE FABLE · 다섯 장면의 밤</div>
  <div class="corner-r">THE LAMP-BEARER<br>등불을 든 아이<br><span style="color:#5a6090">손전등을 따라 / FOLLOW THE LIGHT</span></div>

  <div id="track"></div>

  <div id="story">
    <div id="chapno"></div>
    <h1 id="title"></h1>
    <p id="body"></p>
  </div>

  <div id="choices"></div>

  <div id="ctrl">
    <div class="btn" id="prev" title="이전 장면"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="btn" id="next" title="다음 장면"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>
    <div class="btn" id="sound" title="소리"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="sndWave" d="M16 9a4 4 0 010 6"/></svg></div>
  </div>
  <div id="hint"><span class="k">←</span><span class="k">→</span> 이동 · 마우스로 빛 비추기</div>
</div>

<div id="splash"><div class="mark">A FABLE IN FIVE SCENES · 밤이 끝나는 곳까지</div></div>

<div id="endcard">
  <div class="endbox">
    <h2 id="endTitle">아침이 왔다</h2>
    <p id="endText"></p>
    <div class="stamp" id="endStamp">— 끝, 그러나 다시 켜질 수 있는 불 —</div>
    <button class="replay" id="replay">↻ 다시 처음부터</button>
  </div>
</div>

<div id="cur"></div>

<script>
/* =========================================================
   THE LAMP-BEARER · single-file interactive fable
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ns="http://www.w3.org/2000/svg";

/* ---------- starfield ---------- */
(function stars(){
  const g=$('#stars');
  for(let i=0;i<140;i++){
    const c=document.createElementNS(ns,'circle');
    c.setAttribute('cx',Math.random()*1600);
    c.setAttribute('cy',Math.random()*560);
    const r=Math.random()*1.6+.3; c.setAttribute('r',r);
    c.setAttribute('fill','#fff');
    c.setAttribute('opacity',(Math.random()*.7+.2).toFixed(2));
    c.style.animation=`tw ${(Math.random()*4+2).toFixed(1)}s ${(Math.random()*4).toFixed(1)}s infinite`;
    g.appendChild(c);
  }
})();
/* fireflies */
(function flies(){
  const g=$('#flies');
  for(let i=0;i<26;i++){
    const c=document.createElementNS(ns,'circle');
    c.setAttribute('r',(Math.random()*2+1.2).toFixed(1));
    c.setAttribute('fill','#cd"');c.setAttribute('fill','#ffe39a');
    c.dataset.x=Math.random()*1600; c.dataset.y=Math.random()*500+260;
    c.dataset.ph=Math.random()*6.28; c.dataset.sp=Math.random()*.4+.2;
    g.appendChild(c);
  }
})();
/* ripples */
(function ripples(){
  const g=$('#ripples');
  for(let i=0;i<7;i++){
    const e=document.createElementNS(ns,'ellipse');
    e.setAttribute('cx',Math.random()*1600);e.setAttribute('cy',640+Math.random()*220);
    e.setAttribute('rx',40+Math.random()*120);e.setAttribute('ry',5+Math.random()*6);
    e.setAttribute('fill','none');e.setAttribute('stroke','#3a6a9e');
    e.setAttribute('stroke-width','1.4');e.setAttribute('opacity','.0');
    e.style.animation=`rip ${(4+Math.random()*3).toFixed(1)}s ${(Math.random()*3).toFixed(1)}s infinite`;
    g.appendChild(e);
  }
})();
/* wind streaks */
(function wind(){
  const g=$('#wind');
  for(let i=0;i<10;i++){
    const p=document.createElementNS(ns,'path');
    const y=140+Math.random()*500;
    p.setAttribute('d',`M-200 ${y} q200 -20 420 0 t420 0`);
    p.style.animation=`gust ${(3+Math.random()*2).toFixed(1)}s ${(Math.random()*3).toFixed(1)}s infinite`;
    g.appendChild(p);
  }
})();
/* birds */
(function birds(){
  const g=$('#birds');
  for(let i=0;i<7;i++){
    const p=document.createElementNS(ns,'path');
    p.setAttribute('d','M0 0 q10 -8 20 0 q10 -8 20 0');
    p.setAttribute('transform',`translate(${200+i*160},${160+Math.sin(i)*40}) scale(${.6+Math.random()*.5})`);
    p.style.animation=`flap ${(.5+Math.random()*.3).toFixed(2)}s infinite, drift ${(14+i).toFixed(0)}s linear infinite`;
    g.appendChild(p);
  }
})();

/* dynamic keyframes */
const kf=document.createElement('style');
kf.textContent=`
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes rip{0%{opacity:0;transform:scaleX(.4)}40%{opacity:.5}100%{opacity:0;transform:scaleX(1.3)}}
@keyframes gust{0%{transform:translateX(0);opacity:0}30%{opacity:.5}100%{transform:translateX(420px);opacity:0}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.5)}}
`;
document.head.appendChild(kf);

/* =========================================================
   SCENE DATA
   ========================================================= */
const SCENES=[
 {
   id:'home', bg:'skyNight', stars:true,
   chap:'Scene I', chapEn:'The Cold Hearth',
   title:'불씨 하나가 <span class="em">꺼졌다</span>',
   body:'마을의 마지막 등불이 사위었다. 아이는 차가운 화로 앞에서 결심한다 — <b>밤 끝까지 걸어가 새 불씨를 가져오겠다고.</b> 손에 든 작은 등불만이 세상을 밝힌다.',
   childX:360, childTo:360, halo:'58vmax', dawn:false,
   choices:[
     {t:'등불을 들고 집을 나선다', sub:'숲으로', go:'forest', glow:1},
     {t:'조금 더 화로를 살려본다', sub:'재를 뒤적인다', toast:'재는 차갑다. 남은 길은 하나뿐.', glow:0}
   ]
 },
 {
   id:'forest', bg:'skyForest', stars:true,
   chap:'Scene II', chapEn:'Where the Trees Whisper',
   title:'숲은 <span class="em2">움직이는 어둠</span>이었다',
   body:'나무들이 속삭인다. 등불의 동그란 빛 안에서만 길이 보인다. 무언가 빛 밖에서 따라온다 — 작은 발소리.',
   childX:300, childTo:1040, halo:'40vmax', dawn:false,
   onEnter:()=>{ animFox(); },
   choices:[
     {t:'빛을 들어 발소리를 비춘다', sub:'용기', go:'fox', glow:1},
     {t:'빛을 끄고 숨죽인다', sub:'두려움', toast:'어둠 속에서 그것이 더 가까이 왔다…', shake:1}
   ]
 },
 {
   id:'fox', bg:'skyForest', stars:true,
   chap:'Scene II ·', chapEn:'A Companion',
   title:'그것은 <span class="em">길 잃은 여우</span>였다',
   body:'겁먹은 두 눈이 빛에 물든다. 아이가 손을 내밀자 여우는 꼬리를 낮춘다. 이제 둘은 함께 강가로 향한다.',
   childX:600, childTo:1040, halo:'46vmax', dawn:false, fox:true,
   choices:[ {t:'여우와 함께 강으로 간다', sub:'동행', go:'river', glow:1} ]
 },
 {
   id:'river', bg:'skyWater', stars:true,
   chap:'Scene III', chapEn:'The Black River',
   title:'강은 <span class="em3">검고 깊었다</span>',
   body:'다리는 없다. 디딤돌만 어둠 속에 잠겨 있다. 아이는 등불을 종이배에 옮겨 강에 띄워 — 물이 빛을 받아 길을 드러낸다.',
   childX:280, childTo:1260, halo:'34vmax', dawn:false,
   onEnter:()=>{ animBoat(); },
   choices:[
     {t:'종이배에 불을 옮겨 강을 건넌다', sub:'지혜', go:'cliff', glow:1},
     {t:'돌만 보고 어둠 속을 뛴다', sub:'무모', toast:'발이 미끄러진다 — 다시 빛이 필요하다.', shake:1}
   ]
 },
 {
   id:'cliff', bg:'skyForest', stars:true,
   chap:'Scene IV', chapEn:'The Last Ascent',
   title:'마지막은 <span class="em">바람의 절벽</span>',
   body:'정상의 바람이 등불을 흔든다. 불꽃이 작아진다. 아이는 등불을 가슴에 품어 — <b>자신의 온기로 불을 지킨다.</b>',
   childX:300, childTo:980, halo:'30vmax', dawn:false,
   choices:[
     {t:'등불을 품고 끝까지 오른다', sub:'헌신', go:'dawn', glow:1},
     {t:'바람을 등지고 잠시 멈춘다', sub:'휴식', toast:'바람은 멎지 않는다. 빛을 지켜야 한다.'}
   ]
 },
 {
   id:'dawn', bg:'skyDawn', stars:false,
   chap:'Scene V', chapEn:'The Sun, Returned',
   title:'그리고 <span class="em">아침이 차올랐다</span>',
   body:'세상에서 가장 큰 불씨가 지평선 너머에서 떠오른다. 아이의 작은 등불은 이제 필요 없다 — 그러나 그 작은 빛이 밤을 끝까지 건너게 했다.',
   childX:700, childTo:780, halo:'150vmax', dawn:true,
   onEnter:()=>{ animDawn(); },
   choices:[ {t:'새 불씨를 들고 마을로 돌아간다', sub:'완결', end:1, glow:1} ]
 }
];

/* =========================================================
   STATE & ELEMENTS
   ========================================================= */
let cur=-1, busy=false, soundOn=false, audioCtx=null;
const root=document.documentElement, body=document.body;
const child=$('#child'), legL=$('#legL'), legR=$('#legR'), lantern=$('#lantern');
let walkTimer=null, walkPos=620, walkTarget=620, walking=false;

/* build progress track */
const trackEl=$('#track');
SCENES.forEach(()=>{const d=document.createElement('div');d.className='tk';d.innerHTML='<i></i>';trackEl.appendChild(d);});
const tks=$$('.tk');

/* halo anchors to the lantern; mouse adds a decaying offset so you can "paint" light */
let smx=window.innerWidth*.4, smy=window.innerHeight*.5;     // smoothed halo pos (screen px)
let pmx=null, pmy=null;                                       // raw pointer
let infl=0;                                                   // mouse influence 0..1 (decays)
let camX=0;                                                   // viewBox pan (portrait camera)
const artSvg=$('#art');
window.addEventListener('pointermove',e=>{ pmx=e.clientX; pmy=e.clientY; infl=1;
  $('#cur').style.left=e.clientX+'px'; $('#cur').style.top=e.clientY+'px'; });
window.addEventListener('pointerdown',()=>{ $('#cur').style.transform='translate(-50%,-50%) scale(1.6)';
  setTimeout(()=>$('#cur').style.transform='translate(-50%,-50%) scale(1)',150); blip(440); pulseHaloKick(); });

/* map an SVG point to screen px. viewBox=[camX 0 1600 900], preserveAspectRatio xMinYMid slice */
function svgToScreen(vx,vy){
  const r=artSvg.getBoundingClientRect();
  const scale=Math.max(r.width/1600, r.height/900);  // slice = cover
  const oy=(r.height-900*scale)/2;                    // Y centered, X pinned to min
  return {x:r.left+(vx-camX)*scale, y:r.top+oy+vy*scale};
}

/* =========================================================
   RENDER LOOP
   ========================================================= */
let t=0;
function loop(){
  t+=0.016;
  /* CAMERA: pan viewBox X to keep child framed (esp. narrow/portrait viewports) */
  const r=artSvg.getBoundingClientRect();
  const scale=Math.max(r.width/1600, r.height/900);
  const vw = r.width/scale;                         // visible world width
  const portrait = r.width/r.height < 1.05;
  if(vw < 1340){                                    // clearly narrow -> active camera
    const want = walkPos - vw*0.5;                  // center child horizontally
    const maxX = 1600 - vw;
    const tgt = Math.max(0, Math.min(maxX, want));
    camX += (tgt-camX)*0.06;
  } else {                                           // wide -> center the full scene
    const tgt = (1600 - vw)/2;
    camX += (tgt-camX)*0.1;
  }
  artSvg.setAttribute('viewBox',`${camX.toFixed(1)} 0 1600 900`);
  /* target = lantern world pos (child scaled 1.5: lantern local 46,-8) */
  const baseY0 = SCENES[cur]&&SCENES[cur].id==='dawn'?760:720;
  const lant=svgToScreen(walkPos+46*1.5, (portrait?baseY0-40:baseY0)-8*1.5-14);
  // mouse influence decays back to lantern over ~2.5s of stillness
  infl*=0.985;
  let tx=lant.x, ty=lant.y;
  if(pmx!==null){ tx=lant.x+(pmx-lant.x)*infl; ty=lant.y+(pmy-lant.y)*infl; }
  smx+=(tx-smx)*.14; smy+=(ty-smy)*.14;
  root.style.setProperty('--mx',smx+'px');
  root.style.setProperty('--my',smy+'px');

  /* lantern flame flicker */
  const fl=1+Math.sin(t*9)*0.05+Math.sin(t*23)*0.03;
  lantern.style.transform=`translate(46px,-8px) scale(${fl})`;

  /* fireflies float */
  $$('#flies circle').forEach(c=>{
    const ph=+c.dataset.ph, sp=+c.dataset.sp, bx=+c.dataset.x, by=+c.dataset.y;
    c.setAttribute('cx',bx+Math.sin(t*sp+ph)*40);
    c.setAttribute('cy',by+Math.cos(t*sp*1.3+ph)*26);
    c.setAttribute('opacity',(0.3+0.6*Math.abs(Math.sin(t*1.5+ph))).toFixed(2));
  });

  /* walk */
  if(walking){
    walkPos+=(walkTarget-walkPos)*0.025;
    const baseY = SCENES[cur]&&SCENES[cur].id==='dawn'?760: 720;
    child.setAttribute('transform',`translate(${walkPos.toFixed(1)},${baseY})`);
    const step=Math.sin(t*10)*16;
    legL.setAttribute('d',`M-6 16 L${-12-step*0.4} ${40-Math.abs(step)*0.2}`);
    legR.setAttribute('d',`M6 16 L${12+step*0.4} ${40-Math.abs(step*0.5)*0.2}`);
    const bob=Math.abs(Math.sin(t*10))*-3;
    $('#kid').setAttribute('transform',`translate(0,${bob.toFixed(1)})`);
    if(Math.abs(walkTarget-walkPos)<2){walking=false;}
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =========================================================
   SCENE TRANSITION
   ========================================================= */
const sceneEls={ home:$('#sc-home'), forest:$('#sc-forest'), fox:$('#sc-forest'),
  river:$('#sc-river'), cliff:$('#sc-cliff'), dawn:$('#sc-dawn') };

function showScene(idx,{back=false}={}){
  if(busy) return;
  const s=SCENES[idx]; if(!s) return;
  busy=true;
  const prev=SCENES[cur];

  /* swap background */
  $('#bg').setAttribute('fill',`url(#${s.bg})`);
  body.classList.toggle('dawn',!!s.dawn);

  /* toggle scene art groups */
  $$('.scene').forEach(g=>g.classList.remove('live'));
  if(s.stars){$('#stars').style.opacity=s.dawn?'.15':'1';$('#moon').classList.add('live');}
  else {$('#stars').style.opacity='0';}
  if(s.id==='dawn')$('#moon').classList.remove('live');
  // scene element
  const el=sceneEls[s.id]; if(el)el.classList.add('live');
  // home keeps moon
  if(s.id==='home')$('#moon').classList.add('live');

  // fox visibility
  $('#fox').style.transition='opacity 1s';
  $('#fox').style.opacity = (s.fox||s.id==='river'||s.id==='cliff'||s.id==='dawn')&&cur>1 ? '1':'0';

  /* halo size */
  root.style.setProperty('--halo',s.halo);

  /* place + walk child */
  walkPos = back? s.childTo : s.childX;
  walkTarget = s.childTo;
  const baseY = s.id==='dawn'?760:720;
  child.setAttribute('transform',`translate(${walkPos},${baseY})`);
  setTimeout(()=>{ walking=true; }, 500);

  /* progress */
  tks.forEach((k,i)=>{k.classList.toggle('done',i<idx);k.classList.toggle('now',i===idx);});

  cur=idx;
  renderText(s);
  renderChoices(s);
  if(s.onEnter)setTimeout(s.onEnter,400);

  // ambient tone per scene
  ambient(s.id);

  setTimeout(()=>busy=false,700);
}

/* find index by id-or-number */
function resolve(go){
  if(typeof go==='number') return go;
  return SCENES.findIndex(s=>s.id===go);
}

/* ---------- text reveal ---------- */
function wrap(el,html){
  el.innerHTML=html;
  // wrap text nodes into words, keep <b>/<span> emphasis
  const out=[];
  el.childNodes.forEach(n=>{
    if(n.nodeType===3){
      n.textContent.split(/(\s+)/).forEach(w=>{
        if(w.trim()){const s=document.createElement('span');s.className='w';s.textContent=w;out.push(s);}
        else out.push(document.createTextNode(w));
      });
    } else {
      n.classList?.add('w'); out.push(n);
    }
  });
  el.innerHTML=''; out.forEach(o=>el.appendChild(o));
  const ws=$$('.w',el);
  ws.forEach((w,i)=>setTimeout(()=>w.classList.add('on'), 120+i*42));
}
function renderText(s){
  $('#chapno').textContent=`${s.chap} · ${s.chapEn}`;
  $('#chapno').style.opacity=0;
  setTimeout(()=>$('#chapno').style.transition='opacity .6s',10);
  setTimeout(()=>$('#chapno').style.opacity=.85,100);
  wrap($('#title'),s.title);
  setTimeout(()=>wrap($('#body'),s.body),420);
}

/* ---------- choices ---------- */
function renderChoices(s){
  const box=$('#choices'); box.innerHTML='';
  s.choices.forEach((c,i)=>{
    const b=document.createElement('div'); b.className='choice';
    b.innerHTML=`<span class="gem"></span><span>${c.t}</span>${c.sub?`<span class="sub">· ${c.sub}</span>`:''}`;
    b.addEventListener('mousemove',e=>{const r=b.getBoundingClientRect();b.style.setProperty('--cx',(e.clientX-r.left)+'px');});
    b.addEventListener('click',()=>onChoice(c,b));
    box.appendChild(b);
    setTimeout(()=>b.classList.add('in'), 700+i*140);
  });
}
function onChoice(c,btn){
  if(busy && !c.toast) return;
  blip(660);
  if(c.glow){ pulseHalo(); }
  if(c.toast){ toast(c.toast); if(c.shake)shake(); return; }
  if(c.end){ endStory(); return; }
  const idx=resolve(c.go);
  if(idx>=0) showScene(idx);
}

/* =========================================================
   FX
   ========================================================= */
let haloRestore=null;
function pulseHalo(){
  // flare: expand the light, then settle back to the scene's base halo
  const base=parseFloat(SCENES[cur]?.halo)||40;
  root.style.transition='--halo .5s';
  root.style.setProperty('--halo',(base+34)+'vmax');
  clearTimeout(haloRestore);
  haloRestore=setTimeout(()=>{ root.style.setProperty('--halo',base+'vmax'); },520);
  // brighten cursor too
  $('#cur').animate([{filter:'drop-shadow(0 0 8px #ffcf6b)'},
    {filter:'drop-shadow(0 0 26px #fff6df)'},{filter:'drop-shadow(0 0 8px #ffcf6b)'}],{duration:600});
}
function pulseHaloKick(){
  const base=parseFloat(SCENES[cur]?.halo)||40;
  root.style.transition='--halo .25s';
  root.style.setProperty('--halo',(base+8)+'vmax');
  setTimeout(()=>root.style.setProperty('--halo',base+'vmax'),240);
}
function toast(msg){
  let el=$('#toast');
  if(!el){el=document.createElement('div');el.id='toast';
    el.style.cssText='position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:18;'+
    'background:rgba(12,14,30,.8);backdrop-filter:blur(8px);border:1px solid rgba(255,157,59,.3);'+
    'color:#f4ecd8;padding:14px 24px;border-radius:14px;font-size:14px;letter-spacing:.02em;'+
    'opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;text-align:center;max-width:80vw';
    $('#hud').appendChild(el);}
  el.textContent=msg; el.style.opacity=1; el.style.transform='translate(-50%,-50%) scale(1)';
  clearTimeout(el._t); el._t=setTimeout(()=>{el.style.opacity=0;},2300);
}
function shake(){ $('#stage').animate(
  [{transform:'translate(0,0)'},{transform:'translate(-6px,3px)'},{transform:'translate(6px,-2px)'},
   {transform:'translate(-4px,2px)'},{transform:'translate(0,0)'}],{duration:420});
}

/* fox slinks in */
function animFox(){ const f=$('#fox'); f.style.transition='none';
  f.setAttribute('transform','translate(1200,720)'); f.style.opacity='0';
  requestAnimationFrame(()=>{ f.style.transition='opacity 1.4s';
    f.animate([{transform:'translate(1200px,720px)'},{transform:'translate(940px,720px)'}],
      {duration:2600,fill:'forwards',easing:'ease-out'}); f.style.opacity='1'; });
}
/* boat drifts */
function animBoat(){ const b=$('#boat'); b.style.opacity='1';
  b.animate([{transform:'translate(300px,690px)'},{transform:'translate(700px,700px)'},
    {transform:'translate(1200px,692px)'}],{duration:6000,easing:'ease-in-out'});
}
/* sun rises */
function animDawn(){ const sun=$('#dawnSun');
  sun.style.transition='none'; sun.setAttribute('cy','980'); sun.setAttribute('opacity','0');
  requestAnimationFrame(()=>{ sun.style.transition='opacity 2s';
    sun.animate([{transform:'translateY(0)'},{transform:'translateY(-180px)'}],
      {duration:3200,fill:'forwards',easing:'cubic-bezier(.3,0,.2,1)'}); sun.setAttribute('opacity','1'); });
}

/* =========================================================
   END
   ========================================================= */
function endStory(){
  $('#endText').textContent='작은 등불 하나가 다섯 장면의 밤을 건넜다. 빛은 클 필요가 없었다. 꺼지지 않을 만큼이면 충분했다.';
  $('#endcard').classList.add('on');
  chord();
}
$('#replay').addEventListener('click',()=>{ $('#endcard').classList.remove('on'); window.__c=0; showScene(0); });

/* =========================================================
   CONTROLS
   ========================================================= */
$('#next').addEventListener('click',()=>{ if(cur<SCENES.length-1) showScene(cur+1); });
$('#prev').addEventListener('click',()=>{ if(cur>0) showScene(cur-1,{back:true}); });
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'&&cur<SCENES.length-1)showScene(cur+1);
  if(e.key==='ArrowLeft'&&cur>0)showScene(cur-1,{back:true});
});

/* =========================================================
   SIMPLE WEBAUDIO AMBIENCE (off by default; toggle)
   ========================================================= */
function ensureAudio(){ if(!audioCtx){ try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } }
function blip(freq){ if(!soundOn)return; ensureAudio(); if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);
  g.gain.setValueAtTime(.0001,audioCtx.currentTime);
