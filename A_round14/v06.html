<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>瑪瑙 · Agate Drift</title>
<style>
  :root{ color-scheme: dark; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#06050a; }
  body{
    font-family: "Iowan Old Style", "Hoefler Text", Georgia, "Times New Roman", serif;
    cursor: crosshair;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #gl{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  /* grain + vignette overlay drawn purely in CSS so first paint = artwork */
  #vig{
    position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(130% 110% at 50% 42%, rgba(0,0,0,0) 52%, rgba(4,3,8,0.55) 86%, rgba(2,1,5,0.92) 100%);
    mix-blend-mode:multiply;
  }
  #hud{
    position:fixed; left:24px; bottom:20px; pointer-events:none;
    color:rgba(244,236,255,0.78); user-select:none;
    text-shadow:0 1px 16px rgba(0,0,0,0.85);
  }
  #title{ font-size:26px; letter-spacing:0.42em; font-weight:400;
    background:linear-gradient(92deg,#ffe7c2,#ffb6d9 38%,#9ad9ff 70%,#c8b6ff);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 10px rgba(255,160,210,0.25)); }
  #sub{ font-size:11px; letter-spacing:0.34em; margin-top:7px; opacity:0.62;
    text-transform:uppercase; font-family:ui-monospace,"SF Mono",Menlo,monospace; -webkit-text-fill-color:initial; color:rgba(230,220,250,0.7); }
  #tip{
    position:fixed; right:22px; bottom:20px; pointer-events:none;
    text-align:right; color:rgba(225,215,250,0.5);
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:10.5px; letter-spacing:0.12em; line-height:1.85;
    text-shadow:0 1px 10px rgba(0,0,0,0.8); user-select:none;
    transition:opacity 1.1s ease; }
  #tip b{ color:rgba(255,222,196,0.9); font-weight:600; }
  @media (max-width:520px){
    #title{ font-size:19px; letter-spacing:0.3em; }
    #sub{ font-size:9px; letter-spacing:0.22em; }
    #hud{ left:16px; bottom:16px; }
    #tip{ font-size:9px; right:14px; bottom:14px; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="hud">
  <div id="title">瑪瑙</div>
  <div id="sub">agate&nbsp;·&nbsp;drift</div>
</div>
<div id="tip"><b>이동</b> 렌즈 굴절 &nbsp;·&nbsp; <b>클릭</b> 결정핵 &nbsp;·&nbsp; <b>휠</b> 연마 깊이 &nbsp;·&nbsp; <b>스페이스</b> 새 표본</div>

<script>
"use strict";
(function(){
  const cv = document.getElementById('gl');
  const tip = document.getElementById('tip');
  const gl = cv.getContext('webgl', {antialias:false, alpha:false, premultipliedAlpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance'});

  if(!gl){ document.body.innerHTML='<div style="color:#fff;padding:40px;font-family:serif">WebGL unsupported</div>'; return; }

  // ---------- shaders ----------
  const VERT = `
    attribute vec2 p;
    void main(){ gl_Position = vec4(p,0.0,1.0); }
  `;

  // The whole agate lives in this fragment shader.
  const FRAG = `
  precision highp float;

  uniform vec2  uRes;
  uniform float uTime;
  uniform vec2  uMouse;     // 0..1 in screen, y already flipped
  uniform float uMvel;      // pointer speed -> lens intensity
  uniform float uPolish;    // wheel: band frequency / polish depth
  uniform vec4  uSeeds;     // two seed centres (xy, xy) in aspect space
  uniform float uSeedAmp;   // newest seed influence pulse
  uniform float uPalette;   // palette hue rotation (per specimen)
  uniform float uReveal;    // 0..1 specimen morph crossfade

  // ---- hash / noise ----
  vec2 hash2(vec2 p){
    p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)));
    return fract(sin(p)*43758.5453)*2.0-1.0;
  }
  float vnoise(vec2 p){
    vec2 i=floor(p), f=fract(p);
    vec2 u=f*f*(3.0-2.0*f);
    float a=dot(hash2(i+vec2(0,0)), f-vec2(0,0));
    float b=dot(hash2(i+vec2(1,0)), f-vec2(1,0));
    float c=dot(hash2(i+vec2(0,1)), f-vec2(0,1));
    float d=dot(hash2(i+vec2(1,1)), f-vec2(1,1));
    return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
  }
  float fbm(vec2 p){
    float v=0.0, a=0.5; mat2 m=mat2(1.6,1.2,-1.2,1.6);
    for(int i=0;i<5;i++){ v+=a*vnoise(p); p=m*p; a*=0.5; }
    return v;
  }
  // ridged turbulence for the angular "fortification" interior
  float ridged(vec2 p){
    float v=0.0, a=0.5; mat2 m=mat2(1.7,1.0,-1.0,1.7);
    for(int i=0;i<4;i++){ v+=a*(1.0-abs(vnoise(p))); p=m*p; a*=0.5; }
    return v;
  }

  // smooth-min so multiple nucleation fields merge into one organic stone
  float smin(float a,float b,float k){
    float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);
    return mix(b,a,h)-k*h*(1.0-h);
  }

  // ---- mineral palette: layered banding colour ----
  vec3 minPal(float t, vec3 hueShift){
    // base spectral curve, biased toward agate browns / blues / honey
    t = fract(t);
    vec3 a = vec3(0.46, 0.31, 0.22);
    vec3 b = vec3(0.42, 0.34, 0.30);
    vec3 c = vec3(1.0, 1.0, 1.0);
    vec3 d = vec3(0.0, 0.16, 0.38) + hueShift;
    vec3 col = a + b*cos(6.2831853*(c*t + d));
    return col;
  }

  // soft glow line for crystalline rim accents
  float band(float x, float w){
    return smoothstep(w, 0.0, abs(x));
  }

  void main(){
    vec2 frag = gl_FragCoord.xy;
    vec2 res = uRes;
    vec2 uv = (frag - 0.5*res) / res.y;   // aspect-correct, centred
    float asp = res.x/res.y;

    // ----- mouse as refraction lens (in same aspect space) -----
    vec2 m = (uMouse*res - 0.5*res)/res.y;
    vec2 toM = uv - m;
    float md = length(toM);
    float lensR = 0.34;
    float lens = smoothstep(lensR, 0.0, md);          // 1 at centre
    float lensPow = lens*lens*(0.6 + uMvel*2.4);
    // bend space toward/around the lens -> caustic refraction of bands
    vec2 refr = normalize(toM+1e-5) * lensPow * 0.075;
    vec2 P = uv - refr;

    // ----- domain warp: gives the stone its flowing, liquid bands -----
    float tt = uTime*0.045;
    vec2 w1 = vec2(fbm(P*1.7 + vec2(0.0, tt)), fbm(P*1.7 + vec2(5.2,-tt)));
    vec2 w2 = vec2(fbm(P*3.3 - w1*1.1 + tt*0.6), fbm(P*3.3 + w1*1.1 - tt*0.6));
    vec2 Q = P + w1*0.42 + w2*0.16;

    // ----- distance field from nucleation seeds (the agate's growth) -----
    vec2 s0 = uSeeds.xy, s1 = uSeeds.zw;
    float d0 = length(Q - s0);
    float d1 = length(Q - s1) * (1.0 - 0.35*uSeedAmp);
    float field = smin(d0, d1, 0.45 + 0.25*uSeedAmp);

    // outer chalcedony shell: distance to an irregular cavity wall
    float wall = 0.62 + 0.10*fbm(Q*2.2 + 11.0);
    float shellMask = smoothstep(wall+0.02, wall-0.10, length(P)); // 1 inside

    // ----- the banding itself -----
    // frequency rises with polish; ridged term adds angular fortification core
    float freq = mix(14.0, 30.0, uPolish);
    float core = ridged(Q*2.4 + 3.0);
    float fieldB = field*freq + core*5.0*smoothstep(0.5,0.0,field);
    // breathing
    fieldB += sin(uTime*0.5)*0.35;
    float bandPhase = fieldB;
    float layer = fract(bandPhase);

    // crisp band edges via derivative-aware smoothing
    float fw = fwidth(bandPhase)*1.2 + 1e-4;
    float edge = smoothstep(0.0, fw, layer) * smoothstep(1.0, 1.0-fw, layer);
    float lineDark = 0.30 + 0.70*edge;                 // dark hairlines between bands

    // band index drives palette stepping (discrete mineral layers)
    float idx = floor(bandPhase);
    float idxN = idx + vnoise(vec2(idx*1.7, 3.0));     // jitter per layer thickness
    float palT = idxN*0.085 + length(Q)*0.06 + uPalette;

    vec3 col = minPal(palT, vec3(0.0));
    // alternate translucent / opaque chalcedony rings
    float trans = 0.5 + 0.5*sin(idxN*2.2);
    col = mix(col*0.72, col*1.18 + 0.05, trans);

    // fine internal fibres (chalcedony) — high-freq streaks along bands
    float fibre = fbm(vec2(length(Q-s0)*120.0, atan(Q.y-s0.y,Q.x-s0.x)*6.0));
    col += (fibre-0.5)*0.10;

    col *= lineDark;

    // ----- iris iridescence on thin bands near the rim -----
    float irisZone = smoothstep(0.18,0.55,field)*shellMask;
    vec3 iris = 0.5+0.5*cos(6.2831*(vec3(0.0,0.33,0.66)+ bandPhase*0.12 + uTime*0.02));
    col = mix(col, col*0.6 + iris*0.6, irisZone*0.35);

    // ----- central drusy quartz pocket (sparkle) -----
    float pocket = smoothstep(0.16, 0.0, field);
    if(pocket>0.001){
      vec2 gp = Q*60.0;
      float spark = pow(fbm(gp + uTime*0.4), 6.0)*8.0;
      vec3 quartz = vec3(0.75,0.8,0.95);
      col = mix(col, quartz*(0.35+spark), pocket*0.9);
      col += spark*pocket*vec3(0.9,0.95,1.0)*0.5;
    }

    // ----- polished surface specular sweep -----
    float sweep = sin((uv.x+uv.y)*2.2 - uTime*0.35);
    float gloss = smoothstep(0.86,1.0,sweep)*0.18;
    col += gloss;

    // ----- lens brighten + chromatic caustic ring -----
    col += lensPow*0.10;
    float ring = band(md-lensR*0.62, 0.012)*lensPow;
    col += ring*vec3(1.0,0.7,0.9)*0.6;
    // subtle chromatic split inside lens
    if(lensPow>0.01){
      float ca = lensPow*0.012;
      vec2 Pr = uv - refr*1.06;
      vec2 Pb = uv - refr*0.94;
      // cheap CA: re-evaluate band phase shift only
      float pr = (smin(length(Pr+w1.x*0.0 - s0),length(Pr - s1),0.45))*freq;
      // approximate — tint by difference
      col.r += sin(pr)*ca*6.0;
      col.b -= sin(pr)*ca*6.0;
    }

    // ----- outside the stone: deep matte velvet with faint dust -----
    float outside = 1.0 - shellMask;
    vec3 bg = vec3(0.035,0.028,0.055);
    bg += fbm(uv*3.0 + uTime*0.01)*0.02;
    // rim light around the stone
    float rim = band(length(P)-wall, 0.018);
    bg += rim*vec3(0.6,0.5,0.85)*0.5;
    col = mix(col, bg, outside);

    // gentle reveal morph between specimens
    col = mix(vec3(0.02,0.018,0.03), col, uReveal);

    // tonemap + grade
    col = col/(col+0.72);
    col = pow(col, vec3(0.92));
    // soft vignette baked too
    float vg = smoothstep(1.25, 0.35, length(uv*vec2(asp,1.0)*0.95));
    col *= mix(0.55,1.0,vg);

    gl_FragColor = vec4(col,1.0);
  }
  `;

  function compile(type, src){
    const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
      console.error(gl.getShaderInfoLog(s)); throw new Error('shader compile');
    }
    return s;
  }
  const prog=gl.createProgram();
  // need derivatives for crisp bands
  gl.getExtension('OES_standard_derivatives');
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, '#extension GL_OES_standard_derivatives : enable\n'+FRAG));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){ console.error(gl.getProgramInfoLog(prog)); return; }
  gl.useProgram(prog);

  const buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

  const U={};
  ['uRes','uTime','uMouse','uMvel','uPolish','uSeeds','uSeedAmp','uPalette','uReveal']
    .forEach(n=>U[n]=gl.getUniformLocation(prog,n));

  // ---------- state ----------
  let DPR=1, W=0, H=0;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);          // resolution cap for perf
    const cssW=window.innerWidth, cssH=window.innerHeight;
    // additional pixel cap for very large/hidpi screens -> stable 60fps
    const maxPix = 2300000;
    let scale = DPR;
    if(cssW*cssH*DPR*DPR > maxPix){ scale = Math.sqrt(maxPix/(cssW*cssH)); }
    W = Math.max(2, Math.floor(cssW*scale));
    H = Math.max(2, Math.floor(cssH*scale));
    cv.width=W; cv.height=H;
    cv.style.width=cssW+'px'; cv.style.height=cssH+'px';
    gl.viewport(0,0,W,H);
  }
  window.addEventListener('resize', resize);
  resize();

  // pointer
  let mx=0.5, my=0.55, tmx=0.5, tmy=0.55;
  let vel=0, lastT=performance.now();
  let lastMX=0.5, lastMY=0.55;
  function setPointer(x,y){
    tmx = x/window.innerWidth;
    tmy = 1.0 - y/window.innerHeight;
  }
  window.addEventListener('mousemove', e=>setPointer(e.clientX,e.clientY), {passive:true});
  window.addEventListener('touchmove', e=>{ if(e.touches[0]) setPointer(e.touches[0].clientX,e.touches[0].clientY); }, {passive:true});

  // polish via wheel
  let polish=0.32, tpolish=0.32;
  window.addEventListener('wheel', e=>{
    tpolish = Math.min(1, Math.max(0, tpolish + (e.deltaY>0? 0.06 : -0.06)));
  }, {passive:true});

  // seeds
  function rndSeed(){ return [(Math.random()*2-1)*0.55, (Math.random()*2-1)*0.5]; }
  let seeds=[ [-0.12,0.05], [0.18,-0.10] ];
  let seedAmp=0;
  let palette=Math.random();
  let reveal=1, tReveal=1;

  function dropSeed(x,y){
    // map screen px -> aspect space (matches shader: (frag-0.5*res)/res.y)
    const ux = (x*DPR - 0.5*W)/H;
    const uy = (-(y*DPR) + 0.5*H)/H;
    seeds[0]=seeds[1];
    seeds[1]=[ux, uy];
    seedAmp=1;
  }
  window.addEventListener('mousedown', e=>{ dropSeed(e.clientX,e.clientY); }, {passive:true});
  window.addEventListener('touchstart', e=>{
    if(e.touches[0]){ setPointer(e.touches[0].clientX,e.touches[0].clientY); dropSeed(e.touches[0].clientX,e.touches[0].clientY); }
  }, {passive:true});

  function newSpecimen(){
    seeds=[rndSeed(), rndSeed()];
    palette=Math.random();
    tpolish=0.20+Math.random()*0.55;
    seedAmp=1;
    reveal=0; tReveal=1;
  }
  window.addEventListener('keydown', e=>{
    if(e.code==='Space'){ e.preventDefault(); newSpecimen(); }
  });

  // hide the tip after a while
  let started=performance.now();

  // ---------- render loop ----------
  function frame(now){
    const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;

    // ease pointer
    mx += (tmx-mx)*Math.min(1,dt*12);
    my += (tmy-my)*Math.min(1,dt*12);
    const dmx=mx-lastMX, dmy=my-lastMY; lastMX=mx; lastMY=my;
    const inst=Math.sqrt(dmx*dmx+dmy*dmy)/Math.max(dt,1e-3);
    vel += (Math.min(inst*0.6,1.6)-vel)*Math.min(1,dt*6);

    polish += (tpolish-polish)*Math.min(1,dt*4);
    seedAmp *= Math.pow(0.06, dt);              // decay pulse
    reveal += (tReveal-reveal)*Math.min(1,dt*1.6);

    gl.uniform2f(U.uRes, W, H);
    gl.uniform1f(U.uTime, now*0.001);
    gl.uniform2f(U.uMouse, mx, my);
    gl.uniform1f(U.uMvel, vel);
    gl.uniform1f(U.uPolish, polish);
    gl.uniform4f(U.uSeeds, seeds[0][0],seeds[0][1], seeds[1][0],seeds[1][1]);
    gl.uniform1f(U.uSeedAmp, seedAmp);
    gl.uniform1f(U.uPalette, palette);
    gl.uniform1f(U.uReveal, reveal);

    gl.drawArrays(gl.TRIANGLES,0,3);

    if(tip.style.opacity!=='0' && now-started>9000){ tip.style.opacity='0'; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- test hooks ----------
  window.__agate = {
    state(){ return {mx,my,polish,seedAmp,reveal,palette,seeds:JSON.parse(JSON.stringify(seeds))}; },
    move(x,y){ setPointer(x,y); },
    drop(x,y){ dropSeed(x,y); },
    wheel(d){ tpolish=Math.min(1,Math.max(0,tpolish+(d>0?0.06:-0.06))); },
    specimen(){ newSpecimen(); },
    sample(){ // average luminance to confirm real pixels rendered
      const px=new Uint8Array(4*64*64);
      gl.readPixels(Math.floor(W/2-32),Math.floor(H/2-32),64,64,gl.RGBA,gl.UNSIGNED_BYTE,px);
      let s=0; for(let i=0;i<px.length;i+=4){ s+=px[i]+px[i+1]+px[i+2]; }
      return s/(64*64*3);
    }
  };
})();
</script>
</body>
</html>
