<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PROTEUS — living metaball</title>
<style>
  :root{ color-scheme:dark; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#05060b;overflow:hidden;
    font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;cursor:crosshair;}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  /* ---- HUD ---- */
  .hud{position:fixed;z-index:10;pointer-events:none;
       color:#cdd6ff;text-shadow:0 1px 24px rgba(0,0,0,.6);
       mix-blend-mode:screen;-webkit-user-select:none;user-select:none}
  #brand{top:clamp(16px,3.4vw,40px);left:clamp(16px,3.4vw,42px)}
  #brand h1{font-weight:800;letter-spacing:.42em;
       font-size:clamp(20px,3.4vw,40px);line-height:1;
       background:linear-gradient(92deg,#9bf0ff,#b69bff 46%,#ff9bd2);
       -webkit-background-clip:text;background-clip:text;color:transparent}
  #brand p{margin-top:.7em;font-size:clamp(9px,1.05vw,12px);letter-spacing:.32em;
       text-transform:uppercase;color:#7e88b8;font-weight:600}
  #state{top:clamp(16px,3.4vw,40px);right:clamp(16px,3.4vw,42px);text-align:right}
  #state .k{font-size:clamp(9px,1.05vw,11px);letter-spacing:.3em;color:#6c76a6;text-transform:uppercase}
  #state .v{font-size:clamp(15px,2.1vw,24px);font-weight:700;letter-spacing:.12em;
       background:linear-gradient(92deg,#aef,#c9b6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #hint{bottom:clamp(14px,3vw,34px);left:50%;transform:translateX(-50%);
       text-align:center;font-size:clamp(9px,1.1vw,12px);letter-spacing:.22em;
       color:#838dc0;text-transform:uppercase;font-weight:600;
       transition:opacity 1.2s ease;width:92%}
  #hint b{color:#cdd6ff;font-weight:700}
  #hint.gone{opacity:0}
  /* phase rail */
  #rail{bottom:clamp(40px,7vw,72px);left:50%;transform:translateX(-50%);
        display:flex;gap:clamp(8px,1.4vw,16px);align-items:center}
  #rail .dot{width:7px;height:7px;border-radius:50%;background:#2a2f4d;
        box-shadow:0 0 0 1px rgba(180,200,255,.12) inset;transition:.45s}
  #rail .dot.on{background:#bcd4ff;box-shadow:0 0 14px 2px rgba(160,190,255,.8)}
  #vig{position:fixed;inset:0;z-index:5;pointer-events:none;
       background:radial-gradient(130% 120% at 50% 42%,transparent 38%,rgba(3,4,9,.62) 100%)}
  .grain{position:fixed;inset:-50%;z-index:6;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
       background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
       animation:gr 1.1s steps(3) infinite}
  @keyframes gr{0%{transform:translate(0,0)}33%{transform:translate(-2%,1%)}66%{transform:translate(1%,-2%)}100%{transform:translate(0,0)}}
  @media (max-width:520px){ #rail{bottom:64px} }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="vig"></div>
<div class="grain"></div>

<div class="hud" id="brand"><h1>PROTEUS</h1><p>living&nbsp;·&nbsp;metaball&nbsp;·&nbsp;organism</p></div>
<div class="hud" id="state"><div class="k">phase</div><div class="v" id="phaseName">LIQUID</div></div>
<div class="hud" id="rail"><span class="dot on"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<div class="hud" id="hint"><b>MOVE</b> to feed it &nbsp;·&nbsp; <b>CLICK / TAP</b> shockwave &nbsp;·&nbsp; <b>SCROLL / DRAG-V</b> to morph &nbsp;·&nbsp; <b>DRAG</b> to spin</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* ============================================================
   PROTEUS — a CPU marching-cubes metaball organism.
   It is alive at first paint: orbiting, breathing, drifting.
   Mouse = a food metaball it chases & engulfs.
   Scroll/vertical-drag = morph through 4 phases.
   Click/tap = shockwave that ripples the implicit field.
   ============================================================ */

const cvs = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas:cvs, antialias:true, alpha:false, powerPreference:'high-performance'});
renderer.setClearColor(0x05060b, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060b, 0.055);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(0, 0, 11.0);

/* ---------- resolution / perf caps ---------- */
const isMobile = Math.min(innerWidth, innerHeight) < 560 || /Mobi|Android/i.test(navigator.userAgent);
const DPR_CAP  = isMobile ? 1.6 : 2.0;
const MC_RES   = isMobile ? 40 : 56;          // marching cubes grid resolution (capped)

/* ---------- lighting ---------- */
scene.add(new THREE.AmbientLight(0x223055, 0.9));
const key  = new THREE.DirectionalLight(0xbfe0ff, 2.1); key.position.set(4,6,8); scene.add(key);
const rim  = new THREE.DirectionalLight(0xff7ad0, 1.7); rim.position.set(-6,-2,-4); scene.add(rim);
const fill = new THREE.PointLight(0x6affd0, 1.6, 40);   fill.position.set(0,3,6);  scene.add(fill);

/* ---------- environment for crisp specular reflections ---------- */
function makeEnv(){
  const c = document.createElement('canvas'); c.width=c.height=256;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0,0,0,256);
  grd.addColorStop(0,'#0a1230'); grd.addColorStop(0.42,'#1b2a66');
  grd.addColorStop(0.55,'#3a2a7a'); grd.addColorStop(0.72,'#7e2f86');
  grd.addColorStop(1,'#120a22');
  g.fillStyle=grd; g.fillRect(0,0,256,256);
  // glowing bands → make reflections lively
  for(let i=0;i<5;i++){
    g.globalAlpha=0.5;
    g.fillStyle=['#9be8ff','#ff9bd6','#b69bff','#7affd0','#ffd28a'][i];
    const y=20+i*48; g.fillRect(0,y,256,5+Math.sin(i)*3);
  }
  g.globalAlpha=1;
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const envTex = makeEnv();
scene.environment = envTex;

/* ---------- the organism material ---------- */
const mat = new THREE.MeshPhysicalMaterial({
  color: 0x8ab6ff,
  metalness: 0.18,
  roughness: 0.12,
  clearcoat: 1.0,
  clearcoatRoughness: 0.12,
  transmission: 0.42,
  thickness: 2.4,
  ior: 1.42,
  iridescence: 1.0,
  iridescenceIOR: 1.7,
  iridescenceThicknessRange: [120, 520],
  envMapIntensity: 1.55,
  sheen: 0.6,
  sheenColor: new THREE.Color(0xff9bd6),
  attenuationColor: new THREE.Color(0x6fb6ff),
  attenuationDistance: 3.2,
});

/* ---------- marching cubes object (the organism body) ---------- */
const mc = new MarchingCubes(MC_RES, mat, true, true, 120000);
mc.scale.set(5.4, 5.4, 5.4);
mc.isolation = 64;
scene.add(mc);

/* inner emissive heart-core (gives the blob a glowing soul that bloom catches) */
const coreMat = new THREE.MeshBasicMaterial({color:0xbcd6ff, transparent:true, opacity:0.9,
  blending:THREE.AdditiveBlending, depthWrite:false});
const core = new THREE.Mesh(new THREE.SphereGeometry(0.55, 24, 24), coreMat);
scene.add(core);
/* glow halo sprite behind core for volumetric feel (needs a soft radial map,
   otherwise a map-less sprite renders as a hard square) */
function radialTex(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d');
  const grd=g.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0,'rgba(255,255,255,1)');
  grd.addColorStop(0.25,'rgba(255,255,255,0.55)');
  grd.addColorStop(0.6,'rgba(255,255,255,0.12)');
  grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const haloTex = radialTex();
const haloMat = new THREE.SpriteMaterial({map:haloTex, color:0x6fb6ff, transparent:true, opacity:0.5,
  blending:THREE.AdditiveBlending, depthWrite:false});
const halo = new THREE.Sprite(haloMat); halo.scale.set(7,7,1); halo.position.z=-1.2; scene.add(halo);

/* ---------- star dust backdrop (alive at first paint) ---------- */
const DUST = isMobile? 900 : 1800;
const dpos = new Float32Array(DUST*3);
const dcol = new Float32Array(DUST*3);
const tmpC = new THREE.Color();
for(let i=0;i<DUST;i++){
  const r = 9 + Math.random()*22;
  const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
  dpos[i*3]   = r*Math.sin(ph)*Math.cos(th);
  dpos[i*3+1] = r*Math.sin(ph)*Math.sin(th)*0.7;
  dpos[i*3+2] = r*Math.cos(ph);
  tmpC.setHSL(0.55 + Math.random()*0.28, 0.8, 0.55 + Math.random()*0.3);
  dcol[i*3]=tmpC.r; dcol[i*3+1]=tmpC.g; dcol[i*3+2]=tmpC.b;
}
const dgeo = new THREE.BufferGeometry();
dgeo.setAttribute('position', new THREE.BufferAttribute(dpos,3));
dgeo.setAttribute('color', new THREE.BufferAttribute(dcol,3));
const dmat = new THREE.PointsMaterial({size:0.085, vertexColors:true, transparent:true,
  opacity:0.85, blending:THREE.AdditiveBlending, depthWrite:false,
  sizeAttenuation:true, map:haloTex, alphaTest:0.01});
const dust = new THREE.Points(dgeo, dmat);
scene.add(dust);

/* ---------- post processing: bloom + chromatic vignette ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1,1), 0.9, 0.62, 0.22);
composer.addPass(bloom);

const ChromaShader = {
  uniforms:{ tDiffuse:{value:null}, amount:{value:0.0016}, time:{value:0} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float amount; uniform float time; varying vec2 vUv;
    void main(){
      vec2 d = vUv-0.5;
      float r2 = dot(d,d);
      float a = amount*(0.5+r2*2.2);
      vec2 dir = normalize(d+1e-5);
      vec4 col;
      col.r = texture2D(tDiffuse, vUv - dir*a).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv + dir*a).b;
      col.a = 1.0;
      // subtle scanline shimmer
      col.rgb *= 1.0 - 0.04*r2;
      gl_FragColor = col;
    }`
};
const chroma = new ShaderPass(ChromaShader);
composer.addPass(chroma);

/* =====================================================================
   FIELD: build metaballs each frame and stamp into MarchingCubes.
   ===================================================================== */
const NB = isMobile? 7 : 10;        // organism balls
class Ball{
  constructor(){
    this.theta=Math.random()*6.283; this.phi=Math.random()*6.283;
    this.rad=0.18+Math.random()*0.26;
    this.spd=0.4+Math.random()*0.8;
    this.str=0.7+Math.random()*0.6;     // strength
    this.off=Math.random()*6.283;
    this.x=0;this.y=0;this.z=0;
  }
}
const balls=[];
for(let i=0;i<NB;i++) balls.push(new Ball());

/* food ball driven by pointer */
const food = {x:0.5,y:0.5,z:0.5, tx:0.5,ty:0.5, str:0.0, eat:0};
/* shockwaves */
const waves=[]; // {t,strength}

/* ---------- phases ---------- */
const PHASES = [
  {name:'LIQUID',    cohesion:1.00, sub:1.6,  metal:0.18, rough:0.12, trans:0.42, irid:1.0,  hue:0x8ab6ff, sheen:0xff9bd6, spin:0.18, bloom:0.9 },
  {name:'PLASMA',    cohesion:0.80, sub:2.4,  metal:0.05, rough:0.06, trans:0.62, irid:1.0,  hue:0xff7ad0, sheen:0xffd28a, spin:0.34, bloom:1.25},
  {name:'CRYSTAL',   cohesion:1.25, sub:1.15, metal:0.85, rough:0.04, trans:0.10, irid:0.4,  hue:0x9be8ff, sheen:0xffffff, spin:0.10, bloom:0.7 },
  {name:'SWARM',     cohesion:0.42, sub:3.2,  metal:0.12, rough:0.22, trans:0.50, irid:1.0,  hue:0x7affd0, sheen:0xb69bff, spin:0.46, bloom:1.05},
];
let phaseF = 0;            // continuous phase position 0..3
const railDots = [...document.querySelectorAll('#rail .dot')];
const phaseNameEl = document.getElementById('phaseName');

function lerp(a,b,t){return a+(b-a)*t;}
function lerpColor(a,b,t){
  const ca=new THREE.Color(a), cb=new THREE.Color(b); return ca.lerp(cb,t);
}
let cur = {...PHASES[0]};
function applyPhase(){
  const i = Math.floor(phaseF) % PHASES.length;
  const j = (i+1)%PHASES.length;
  let t = phaseF - Math.floor(phaseF);
  // when wrapping from last back to first keep smooth but rail shows nearest
  const A=PHASES[i], B=PHASES[j];
  cur.cohesion=lerp(A.cohesion,B.cohesion,t);
  cur.sub=lerp(A.sub,B.sub,t);
  cur.spin=lerp(A.spin,B.spin,t);
  mat.metalness=lerp(A.metal,B.metal,t);
  mat.roughness=lerp(A.rough,B.rough,t);
  mat.transmission=lerp(A.trans,B.trans,t);
  mat.iridescence=lerp(A.irid,B.irid,t);
  mat.color.copy(lerpColor(A.hue,B.hue,t));
  mat.sheenColor.copy(lerpColor(A.sheen,B.sheen,t));
  mat.attenuationColor.copy(lerpColor(A.hue,B.hue,t));
  bloom.strength = lerp(A.bloom,B.bloom,t);
  coreMat.color.copy(lerpColor(A.sheen,B.hue,t)).lerp(new THREE.Color(0xffffff),0.3);
  haloMat.color.copy(lerpColor(A.hue,B.hue,t));
  const nearest = (t<0.5? i : j);
  railDots.forEach((d,k)=>d.classList.toggle('on', k===nearest));
  const nm = (t<0.5?A.name:B.name);
  if(phaseNameEl.textContent!==nm) phaseNameEl.textContent=nm;
}

/* =====================================================================
   FIELD STAMP
   ===================================================================== */
function stampField(time){
  mc.reset();
  const coh = cur.cohesion;            // 0.4 (swarm) .. 1.25 (crystal)
  const sub = cur.sub;                  // subtract / softness driver
  const subtract = 12;                  // MC field subtract constant

  // breathing pulse — the organism is alive
  const breath = 1 + 0.06*Math.sin(time*1.1) + 0.025*Math.sin(time*2.7);

  // strong central cohesive core so the body is one creature, not scattered dots
  mc.addBall(0.5,0.5,0.5, 0.62*coh*breath, subtract, new THREE.Color(0xffffff));

  // how far the satellites orbit: tight when cohesive, flung when swarm
  // base orbit radius small enough that balls always overlap the core field
  const spread = lerp(0.14, 0.34, 1-(coh-0.4)/0.85);    // bigger when low cohesion

  for(let i=0;i<balls.length;i++){
    const b=balls[i];
    b.theta += b.spd*0.006*(0.6+cur.spin);
    b.phi   += b.spd*0.004;
    let rr = (0.10 + b.rad*0.5) * breath + spread*(0.5+0.5*Math.sin(b.off+time*0.3));
    const px = 0.5 + Math.cos(b.theta+b.off)*Math.sin(b.phi)*rr;
    const py = 0.5 + Math.sin(b.theta)*Math.cos(b.phi*0.8)*rr*0.95;
    const pz = 0.5 + Math.cos(b.phi+b.off)*rr*0.9;
    b.x=px;b.y=py;b.z=pz;
    const st = (0.34 + 0.10*Math.sin(time*1.7+b.off)) * (0.7+0.6*b.str) * (0.8+coh*0.5);
    mc.addBall(px,py,pz, st, subtract);
  }

  // FOOD ball — when pointer active, the organism reaches toward it & engulfs
  if(food.str>0.02){
    const fs = 0.30 + food.str*0.22 + food.eat*0.25;
    mc.addBall(food.x,food.y,food.z, fs, subtract, new THREE.Color(0xffffff));
  }

  // SHOCKWAVES — expanding ring of bumps rippling the surface
  for(let w=0;w<waves.length;w++){
    const wv=waves[w];
    const ring = 0.10 + wv.t*0.42;
    const n=10;
    const fall = Math.max(0,1-wv.t);
    for(let k=0;k<n;k++){
      const a=(k/n)*6.283 + time;
      const x=0.5+Math.cos(a)*ring;
      const y=0.5+Math.sin(a)*ring*0.85;
      const z=0.5+Math.cos(a*1.7+wv.t*3)*ring*0.5;
      mc.addBall(x,y,z, 0.16*wv.strength*fall, subtract);
    }
  }

  mc.update();
}

/* =====================================================================
   POINTER / SCROLL / DRAG interaction
   ===================================================================== */
let dragging=false, lastX=0, lastY=0;
let yaw=0.0, pitch=0.05, yawV=0, pitchV=0;
let pointerActive=false;
const ndc = new THREE.Vector2();
const ray = new THREE.Raycaster();
// plane through origin facing camera for unprojecting pointer to world
const interPlane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
const worldPt = new THREE.Vector3();

function setNDC(cx,cy){
  ndc.x = (cx/innerWidth)*2-1;
  ndc.y = -(cy/innerHeight)*2+1;
}
function pointerToField(cx,cy){
  setNDC(cx,cy);
  ray.setFromCamera(ndc, camera);
  // intersect a plane that follows the blob (z=0 in world, but rotated group => use simple z-plane)
  if(ray.ray.intersectPlane(interPlane, worldPt)){
    // map world (scale 4.6 half-extent ~2.3) into field 0..1
    const half = 2.3;
    food.tx = THREE.MathUtils.clamp(0.5 + worldPt.x/(half*2),0.05,0.95);
    food.ty = THREE.MathUtils.clamp(0.5 + worldPt.y/(half*2),0.05,0.95);
    return true;
  }
  return false;
}

function onMove(cx,cy){
  pointerActive=true;
  pointerToField(cx,cy);
  hideHint();
}

cvs.addEventListener('pointermove',(e)=>{
  if(dragging){
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY;
    yawV   += dx*0.0006;
    pitchV += dy*0.0006;
    // vertical drag also nudges phase if mostly vertical
  } else {
    onMove(e.clientX,e.clientY);
  }
});
cvs.addEventListener('pointerdown',(e)=>{
  cvs.setPointerCapture && cvs.setPointerCapture(e.pointerId);
  dragging=true; lastX=e.clientX; lastY=e.clientY;
  dragStartY=e.clientY; dragMoved=0; dragDownT=performance.now();
  hideHint();
});
let dragStartY=0, dragMoved=0, dragDownT=0;
cvs.addEventListener('pointermove',(e)=>{
  if(dragging){ dragMoved += Math.abs(e.movementX||0)+Math.abs(e.movementY||0); }
},{passive:true});
function endDrag(e){
  if(!dragging) return;
  dragging=false;
  const dt = performance.now()-dragDownT;
  // a quick low-movement press = shockwave (click/tap)
  if(dragMoved<8 && dt<400){
    triggerWave();
    onMove(e.clientX,e.clientY);
  }
}
cvs.addEventListener('pointerup', endDrag);
cvs.addEventListener('pointercancel', endDrag);
cvs.addEventListener('pointerleave',(e)=>{ if(!dragging) pointerActive=false; });

/* wheel → morph phase */
let scrollTarget=0;
cvs.addEventListener('wheel',(e)=>{
  e.preventDefault();
  scrollTarget += e.deltaY*0.0016;
  hideHint();
},{passive:false});

/* vertical drag on touch also morphs (in addition to spin) — handled via touch fallback */
let touchY=null, touchStartPhase=0;
cvs.addEventListener('touchstart',(e)=>{
  if(e.touches.length===1){ touchY=e.touches[0].clientY; touchStartPhase=scrollTarget; }
},{passive:true});
cvs.addEventListener('touchmove',(e)=>{
  if(e.touches.length===1 && touchY!=null){
    const dy = e.touches[0].clientY - touchY;
    scrollTarget = touchStartPhase + dy*0.004; // drag down = morph forward
  }
},{passive:true});
cvs.addEventListener('touchend',()=>{ touchY=null; });

function triggerWave(){
  if(waves.length>4) waves.shift();
  waves.push({t:0, strength:1.0});
  food.eat = 1.0; // burst
  bloomKick = 1.0;
}
let bloomKick=0;

function hideHint(){ const h=document.getElementById('hint'); if(h) h.classList.add('gone'); }

/* keyboard for accessibility / verification hooks */
addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight'){ scrollTarget+=0.5; }
  if(e.key==='ArrowLeft'){ scrollTarget-=0.5; }
  if(e.key===' '){ triggerWave(); e.preventDefault(); }
});

/* =====================================================================
   RESIZE
   ===================================================================== */
function resize(){
  const w=innerWidth, h=innerHeight;
  const dpr=Math.min(devicePixelRatio||1, DPR_CAP);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w,h,false);
  composer.setPixelRatio(dpr);
  composer.setSize(w,h);
  bloom.setSize(w*dpr, h*dpr);
  camera.aspect=w/h;
  // pull camera back a touch on narrow screens so blob fits
  camera.position.z = (w/h < 0.9) ? 13.5 : 11.0;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

/* =====================================================================
   LOOP
   ===================================================================== */
const clock = new THREE.Clock();
let frame=0;
let fpsSmooth=60, lastT=performance.now();
let adaptiveDropped=false;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  frame++;

  // fps watch (adaptive: dim bloom/dust if struggling)
  const now=performance.now(); const inst=1000/Math.max(1,now-lastT); lastT=now;
  fpsSmooth = fpsSmooth*0.94 + inst*0.06;
  if(!adaptiveDropped && frame>120 && fpsSmooth<34){
    adaptiveDropped=true;
    dmat.opacity*=0.5; bloom.strength*=0.7;
  }

  // ----- phase morph easing -----
  scrollTarget = ((scrollTarget % PHASES.length)+PHASES.length)%PHASES.length;
  // shortest-path wrap
  let diff = scrollTarget - phaseF;
  if(diff>PHASES.length/2) diff-=PHASES.length;
  if(diff<-PHASES.length/2) diff+=PHASES.length;
  phaseF += diff*Math.min(1, dt*4.0);
  phaseF = ((phaseF % PHASES.length)+PHASES.length)%PHASES.length;
  applyPhase();

  // ----- food ball ease toward pointer & strength -----
  const wantStr = pointerActive ? 1.0 : 0.0;
  food.str = lerp(food.str, wantStr, dt*5);
  food.x = lerp(food.x, food.tx, dt*6);
  food.y = lerp(food.y, food.ty, dt*6);
  food.z = lerp(food.z, 0.5 + Math.sin(t*0.8)*0.05, dt*4);
  // organism leans toward food (core drift) — fake by pulling some balls
  if(food.str>0.2){
    for(let i=0;i<3;i++){
      const b=balls[i];
      b.x=lerp(b.x, food.x, dt*1.5);
    }
  }
  food.eat = lerp(food.eat,0,dt*3);

  // ----- waves advance -----
  for(let i=waves.length-1;i>=0;i--){
    waves[i].t += dt*1.4;
    if(waves[i].t>1.15) waves.splice(i,1);
  }
  bloomKick = lerp(bloomKick,0,dt*2.5);

  // ----- spin (auto + inertia drag) -----
  yaw   += yawV   + cur.spin*dt;
  pitch += pitchV;
  pitch = THREE.MathUtils.clamp(pitch,-0.9,0.9);
  yawV  *= 0.92; pitchV*=0.92;
  mc.rotation.y = yaw;     mc.rotation.x = pitch;

  // ----- inner core + halo track the breathing & pulse with interaction -----
  const pulse = 1 + 0.08*Math.sin(t*1.1) + food.eat*0.5 + bloomKick*0.4;
  core.scale.setScalar(0.55*pulse);
  coreMat.opacity = 0.55 + food.str*0.3 + bloomKick*0.3;
  halo.scale.setScalar(5.5*pulse + food.str*1.5);
  haloMat.opacity = 0.30 + bloomKick*0.25;

  // ----- build field -----
  stampField(t);

  // bloom kick from interaction
  bloom.strength = Math.min(2.2, bloom.strength + bloomKick*0.6);

  // dust slow swirl + parallax to pointer
  dust.rotation.y += dt*0.02;
  dust.rotation.x  = Math.sin(t*0.1)*0.06;
  const targetPx = (ndc.x||0)*0.4, targetPy=(ndc.y||0)*0.3;
  camera.position.x = lerp(camera.position.x, targetPx, dt*2);
  camera.position.y = lerp(camera.position.y, targetPy, dt*2);
  camera.lookAt(0,0,0);

  // moving lights for shimmering specular
  rim.position.x = Math.cos(t*0.4)*6;
  rim.position.z = Math.sin(t*0.4)*6;
  fill.color.copy(mat.color).offsetHSL(0.1,0,0);

  chroma.uniforms.time.value = t;
  chroma.uniforms.amount.value = 0.0016 + bloomKick*0.004;

  composer.render();
}

/* ---- expose a verification hook (no behavior change for users) ---- */
window.__proteus = {
  state(){ return {
    phaseF, phaseName:phaseNameEl.textContent,
    foodStr:+food.str.toFixed(3),
    waves:waves.length,
    fps:+fpsSmooth.toFixed(1),
    yaw:+yaw.toFixed(3), pitch:+pitch.toFixed(3),
    triangles: mc.count|0
  };},
  morph(d){ scrollTarget+=d; },
  wave(){ triggerWave(); },
  feed(nx,ny){ pointerActive=true; food.tx=nx; food.ty=ny; },
  firstPaintOk(){ return (mc.count|0) > 100; }
};

animate();
</script>
