<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AETHERFORM — point cloud morph</title>
<style>
  :root{ --ink:#e8ecff; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%;overflow:hidden;background:#04060d;cursor:crosshair}
  #gl{position:fixed;inset:0;display:block;touch-action:none}
  /* vignette + grain overlay for cinema feel */
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 120% at 50% 42%, rgba(0,0,0,0) 38%, rgba(2,3,8,.55) 78%, rgba(1,1,4,.92) 100%);
    mix-blend-mode:multiply;z-index:2}
  #hud{position:fixed;left:0;right:0;bottom:0;z-index:4;pointer-events:none;
    font:500 12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink)}
  .bar{display:flex;align-items:flex-end;justify-content:space-between;
    padding:18px 22px 16px;gap:16px}
  .title{font:800 13px/1 ui-monospace,monospace;letter-spacing:.42em;text-transform:uppercase;
    opacity:.92;text-shadow:0 0 18px rgba(120,160,255,.5)}
  .sub{opacity:.5;font-size:10px;letter-spacing:.18em;margin-top:7px}
  .form{text-align:right}
  .form .name{font:800 14px/1 ui-monospace,monospace;letter-spacing:.3em;
    text-shadow:0 0 22px currentColor}
  .form .hint{opacity:.42;font-size:9.5px;letter-spacing:.16em;margin-top:6px}
  /* progress dots */
  #dots{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:4;
    display:flex;gap:9px;pointer-events:none}
  #dots i{width:6px;height:6px;border-radius:50%;background:rgba(160,180,255,.22);
    transition:.5s ease;display:block}
  #dots i.on{background:var(--ink);box-shadow:0 0 12px rgba(150,180,255,.95);transform:scale(1.35)}
  #hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;
    font:600 11px/1.6 ui-monospace,monospace;letter-spacing:.22em;color:var(--ink);
    text-align:center;opacity:.0;pointer-events:none;text-transform:uppercase;
    text-shadow:0 0 20px rgba(0,0,0,.8);transition:opacity 1.1s ease}
  #hint.show{opacity:.6}
  @media (max-width:520px){
    .bar{padding:14px 15px 14px}
    .title{font-size:10.5px;letter-spacing:.3em}
    .form .name{font-size:12px}
    #hint{font-size:9.5px}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="dots"></div>
<div id="hint">drag · orbit &nbsp;|&nbsp; move · disturb &nbsp;|&nbsp; scroll / click · morph</div>
<div id="hud"><div class="bar">
  <div><div class="title">Aetherform</div><div class="sub">120k-point morphing field · webgl</div></div>
  <div class="form"><div class="name" id="fname">GALAXY</div><div class="hint" id="fhint">▸ next shape</div></div>
</div></div>

<script>
/* ============================================================================
   AETHERFORM — a single-file WebGL point-cloud that morphs between sculpted
   3D forms. Every particle owns its slot across ALL shapes (index-aligned),
   so morphs are coherent flows, not random reshuffles. Color is a function of
   depth + form-energy + per-particle phase, additively blended into a glowing
   nebula. Pointer creates a 3D gravity-well that bends the cloud in real time.
   No libraries, no loaders — first frame is the artwork.
   ============================================================================ */
(()=>{
'use strict';
const cvs = document.getElementById('gl');
const gl = cvs.getContext('webgl',{antialias:true,alpha:false,premultipliedAlpha:false,
  preserveDrawingBuffer:false,powerPreference:'high-performance'});
if(!gl){ document.body.innerHTML='<div style="color:#fff;font:14px monospace;padding:40px">WebGL unavailable</div>'; return; }

/* ---------- particle budget (capped for mobile) ---------- */
const isMobile = Math.min(innerWidth,innerHeight) < 560 || /Mobi|Android/i.test(navigator.userAgent);
const N = isMobile ? 46000 : 120000;

/* ---------- shape generators : each fills xyz for index i of N ----------
   All return values roughly within a unit-ish ball so morphs stay framed.   */
function golden(i,n){ return [ Math.acos(1-2*(i+0.5)/n), Math.PI*(1+Math.sqrt(5))*i ]; } // theta,phi fib

const TAU = Math.PI*2;
const shapes = [
  { name:'GALAXY', col:[0.55,0.72,1.0], fn:(i,n,o)=>{   // logarithmic spiral disk + bulge
      const arms=3, r=Math.pow(i/n,0.62);
      const arm=(i%arms), a=arm*TAU/arms + r*5.2 + Math.sin(r*9)*0.12;
      const spread=(1-r)*0.22 + 0.02;
      const rr=r*1.35;
      const jx=(hash(i*1.3)-0.5)*spread, jz=(hash(i*2.7)-0.5)*spread;
      o[0]=Math.cos(a)*rr + jx;
      o[2]=Math.sin(a)*rr + jz;
      const bulge=Math.exp(-r*r*7)*0.32;
      o[1]=(hash(i*3.9)-0.5)*(0.06+ (1-r)*0.16) + bulge*(hash(i*5.1)-0.5)*2;
    }},
  { name:'TORUS KNOT', col:[1.0,0.45,0.78], fn:(i,n,o)=>{ // (p,q) torus knot tube
      const p=3,q=2, t=(i/n)*TAU;
      const tubeAng=hash(i*7.7)*TAU, tubeR=0.16*Math.sqrt(hash(i*9.3));
      const R=0.62 + Math.cos(q*t)*0.32;
      const cx=Math.cos(p*t)*R, cy=Math.sin(p*t)*R, cz=Math.sin(q*t)*0.32;
      // local frame approximation -> fatten the tube
      o[0]=cx + Math.cos(tubeAng)*tubeR;
      o[1]=cy + Math.sin(tubeAng)*tubeR*0.7;
      o[2]=cz + Math.sin(tubeAng+t)*tubeR;
    }},
  { name:'DNA HELIX', col:[0.5,1.0,0.7], fn:(i,n,o)=>{   // double helix + rungs
      const turns=9, t=(i/n);
      const strand=i%3;
      const ang=t*TAU*turns;
      const y=(t-0.5)*2.4;
      if(strand<2){ const off=strand?Math.PI:0; const rr=0.42;
        o[0]=Math.cos(ang+off)*rr; o[2]=Math.sin(ang+off)*rr; o[1]=y;
      } else { const f=hash(i*4.1); // rung between strands
        o[0]=Math.cos(ang)*0.42*(1-2*f); o[2]=Math.sin(ang)*0.42*(1-2*f); o[1]=y; }
      o[0]+=(hash(i*6.6)-0.5)*0.03; o[2]+=(hash(i*8.2)-0.5)*0.03;
    }},
  { name:'SUPERSPHERE', col:[1.0,0.82,0.4], fn:(i,n,o)=>{ // rippling supershape sphere
      const g=golden(i,n), th=g[0], ph=g[1];
      const m=6;
      const r=1 + 0.18*Math.sin(m*ph)*Math.sin(m*th) + 0.10*Math.cos(8*th);
      const rr=r*0.92;
      o[0]=rr*Math.sin(th)*Math.cos(ph);
      o[1]=rr*Math.cos(th);
      o[2]=rr*Math.sin(th)*Math.sin(ph);
    }},
  { name:'RIPPLE SHELL', col:[0.4,0.85,1.0], fn:(i,n,o)=>{ // 3D standing-wave sphere shell
      const g=golden(i,n), th=g[0], ph=g[1];
      // modulate radius by interfering spherical harmonics -> rippled shell, volumetric
      const r=1.0 + 0.16*Math.sin(7*th)*Math.cos(5*ph) + 0.10*Math.sin(11*ph);
      const rr=r*0.9;
      o[0]=rr*Math.sin(th)*Math.cos(ph);
      o[1]=rr*Math.cos(th);
      o[2]=rr*Math.sin(th)*Math.sin(ph);
    }},
  { name:'LOTUS', col:[1.0,0.55,0.82], fn:(i,n,o)=>{     // layered rose-curve bloom (3D petals)
      const layer=i%5;                                    // 5 petal rings, rising & opening
      const k=5 + layer;                                  // more petals on outer rings
      const t=(i/n)*TAU*k;
      const open=0.30 + layer*0.16;                       // outer rings flare wider
      const rad=Math.abs(Math.cos(k/2*t))*open + 0.04;
      const curl=Math.pow(rad/ (open+0.04), 1.6);         // petal tips curl up
      const lift=layer*0.12 + curl*0.55 - 0.40;
      const jit=(hash(i*5.5)-0.5)*0.04;
      o[0]=Math.cos(t)*rad + jit;
      o[2]=Math.sin(t)*rad + jit;
      o[1]=lift + (hash(i*2.2)-0.5)*0.05;
    }},
];
const NS = shapes.length;

/* cheap deterministic hash -> [0,1) */
function hash(x){ x=Math.sin(x*127.1+ x*0.017)*43758.5453; return x-Math.floor(x); }

/* ---------- bake all shapes into one big Float32 buffer ----------
   layout per particle: NS*3 target positions, then 1 seed (phase).        */
const stride = NS*3 + 1;
const data = new Float32Array(N*stride);
const tmp=[0,0,0];
for(let i=0;i<N;i++){
  const base=i*stride;
  for(let s=0;s<NS;s++){ shapes[s].fn(i,N,tmp); data[base+s*3]=tmp[0]; data[base+s*3+1]=tmp[1]; data[base+s*3+2]=tmp[2]; }
  data[base+NS*3]= hash(i*0.911)*TAU; // per-particle phase seed
}

/* ---------- GL program ---------- */
const VS=`
precision highp float;
attribute float a_seed;
${shapes.map((_,k)=>`attribute vec3 a_p${k};`).join('\n')}
uniform mat4 u_proj;
uniform mat4 u_view;
uniform float u_time;
uniform float u_mix;     // continuous shape position, [0, NS)
uniform vec3  u_pointer; // pointer in world space (on a plane)
uniform float u_pull;    // +attract / -repel strength
uniform float u_pscale;  // point size base
uniform vec2  u_res;
varying float v_depth;
varying float v_energy;
varying float v_seed;

vec3 sampleShape(float fm){
  ${shapes.map((_,k)=>`vec3 p${k}=a_p${k};`).join('\n  ')}
  float idx=floor(fm);
  float f=fm-idx;
  // smootherstep for buttery morph
  f=f*f*f*(f*(f*6.0-15.0)+10.0);
  vec3 a=p0;
  ${shapes.map((_,k)=>k===0?'':`a = (idx >= ${k}.0-0.5 && idx < ${k}.0+0.5) ? mix(p${k-1},p${k},f) : a;`).join('\n  ')}
  // wrap segment (last -> first)
  a = (idx >= ${NS-1}.0-0.5) ? mix(p${NS-1},p0,f) : a;
  return a;
}

void main(){
  vec3 pos = sampleShape(u_mix);

  // gentle living breathing so even a "static" shape is alive
  float br = sin(u_time*0.6 + a_seed*6.2831)*0.012;
  pos *= 1.0 + br;
  pos.y += sin(u_time*0.5 + pos.x*2.0)*0.012;

  // pointer 3D gravity-well (inverse-square-ish, softened)
  vec3 d = pos - u_pointer;
  float dist = length(d) + 0.0001;
  float infl = u_pull * 0.10 / (dist*dist + 0.06);
  pos += normalize(d) * infl;

  vec4 mv = u_view * vec4(pos,1.0);
  gl_Position = u_proj * mv;

  float depth = -mv.z;
  v_depth = depth;
  v_energy = clamp(abs(infl)*5.0 + br*8.0 + 0.0, 0.0, 1.0);
  v_seed = a_seed;

  // perspective-correct, energy-boosted point size, capped
  float size = u_pscale * (1.0/depth);
  size *= 1.0 + v_energy*1.8;
  gl_PointSize = clamp(size, 1.0, 9.0);
}
`;
const FS=`
precision highp float;
varying float v_depth;
varying float v_energy;
varying float v_seed;
uniform vec3 u_baseA;
uniform vec3 u_baseB;
uniform float u_time;
void main(){
  // round soft sprite
  vec2 q = gl_PointCoord - 0.5;
  float r2 = dot(q,q);
  if(r2 > 0.25) discard;
  float core = smoothstep(0.25,0.0,r2);

  // depth -> palette blend (far=baseA cool, near=baseB), plus phase shimmer
  float t = clamp((v_depth-1.4)/3.6, 0.0, 1.0);
  vec3 col = mix(u_baseB, u_baseA, t);
  // iridescent shimmer per particle (chromatic, not white)
  float sh = 0.5+0.5*sin(u_time*1.3 + v_seed*6.2831);
  col += vec3(0.10,0.02,0.16)*sh;
  // energy -> hot pink flare where the pointer disturbs the field (tinted, not pure white)
  col = mix(col, vec3(1.0,0.55,0.78), v_energy*0.8);

  // additive blending stacks fast -> keep each splat dim & color-preserving so
  // dense regions deepen in hue rather than clipping to white.
  float a = core * (0.060 + 0.12*core);
  gl_FragColor = vec4(col * (0.34 + 0.40*core), a);
}
`;

function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);
const FB=4, S=stride*FB;
for(let k=0;k<NS;k++){ const loc=gl.getAttribLocation(prog,'a_p'+k);
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,3,gl.FLOAT,false,S,k*3*FB); }
const seedLoc=gl.getAttribLocation(prog,'a_seed');
gl.enableVertexAttribArray(seedLoc); gl.vertexAttribPointer(seedLoc,1,gl.FLOAT,false,S,NS*3*FB);

const U={}; ['u_proj','u_view','u_time','u_mix','u_pointer','u_pull','u_pscale','u_res','u_baseA','u_baseB']
  .forEach(n=>U[n]=gl.getUniformLocation(prog,n));

/* ---------- matrices ---------- */
function perspective(out,fovy,asp,n,f){ const t=1/Math.tan(fovy/2);
  out[0]=t/asp;out[1]=0;out[2]=0;out[3]=0; out[4]=0;out[5]=t;out[6]=0;out[7]=0;
  out[8]=0;out[9]=0;out[10]=(f+n)/(n-f);out[11]=-1; out[12]=0;out[13]=0;out[14]=2*f*n/(n-f);out[15]=0; return out;}
function lookAt(out,eye,ctr,up){
  let zx=eye[0]-ctr[0],zy=eye[1]-ctr[1],zz=eye[2]-ctr[2];
  let zl=1/Math.hypot(zx,zy,zz); zx*=zl;zy*=zl;zz*=zl;
  let xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx;
  let xl=1/(Math.hypot(xx,xy,xz)||1); xx*=xl;xy*=xl;xz*=xl;
  let yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  out[0]=xx;out[1]=yx;out[2]=zx;out[3]=0; out[4]=xy;out[5]=yy;out[6]=zy;out[7]=0;
  out[8]=xz;out[9]=yz;out[10]=zz;out[11]=0;
  out[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);
  out[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);
  out[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]); out[15]=1; return out;}
const proj=new Float32Array(16), view=new Float32Array(16);

/* ---------- interaction state ---------- */
let yaw=0.5, pitch=-0.18, tYaw=0.5, tPitch=-0.18;
let camDist=3.6, tDist=3.6;
let dragging=false, lastX=0,lastY=0, autoSpin=true, idleT=0;
let ptrX=0, ptrY=0, ptrTX=0, ptrTY=0, pull=1, pullTarget=1;
let mixTarget=0, mix=0;          // shape position
let lastInteract=performance.now();

function resize(){ const dpr=Math.min(devicePixelRatio||1, isMobile?2:2);
  cvs.width=Math.floor(innerWidth*dpr); cvs.height=Math.floor(innerHeight*dpr);
  cvs.style.width=innerWidth+'px'; cvs.style.height=innerHeight+'px';
  gl.viewport(0,0,cvs.width,cvs.height); }
addEventListener('resize',resize); resize();

/* dots */
const dotsEl=document.getElementById('dots');
for(let s=0;s<NS;s++){ const d=document.createElement('i'); dotsEl.appendChild(d); }
const dotEls=[...dotsEl.children];
const fname=document.getElementById('fname'), fhint=document.getElementById('fhint');
function setForm(idx){
  idx=((idx%NS)+NS)%NS;
  const next=(idx+1)%NS;
  fname.textContent=shapes[idx].name;
  fname.style.color=`rgb(${shapes[idx].col.map(c=>Math.round(c*255)).join(',')})`;
  fhint.textContent='▸ '+shapes[next].name;
  dotEls.forEach((d,k)=>d.classList.toggle('on',k===idx));
}
setForm(0);

function go(dir){ mixTarget=Math.round(mixTarget)+dir; lastInteract=performance.now();
  const fi=((Math.round(mixTarget)%NS)+NS)%NS; setForm(fi); poke(); }

/* pointer mapping: screen -> world plane at origin (z=0 in view) approx */
function updatePointer(cx,cy){
  ptrTX=(cx/innerWidth*2-1);
  ptrTY=-(cy/innerHeight*2-1);
  lastInteract=performance.now();
}

/* ---------- input ---------- */
cvs.addEventListener('pointerdown',e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY;
  cvs.setPointerCapture(e.pointerId); pullTarget=-1.6; lastInteract=performance.now(); });
cvs.addEventListener('pointermove',e=>{
  updatePointer(e.clientX,e.clientY);
  if(dragging){ const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
    tYaw+=dx*0.006; tPitch+=dy*0.006; tPitch=Math.max(-1.35,Math.min(1.35,tPitch)); autoSpin=false; }
});
addEventListener('pointerup',()=>{ dragging=false; pullTarget=1; });
cvs.addEventListener('click',e=>{ if(Math.abs(e.clientX-lastX)<4 && Math.abs(e.clientY-lastY)<4) go(1); });
addEventListener('wheel',e=>{ e.preventDefault();
  if(Math.abs(e.deltaY)>2){ wheelAcc+=e.deltaY; if(wheelAcc>120){go(1);wheelAcc=0;} if(wheelAcc<-120){go(-1);wheelAcc=0;} }
},{passive:false});
let wheelAcc=0;
// pinch / two-finger zoom + tap-to-morph for touch
let pinchD=0;
addEventListener('touchmove',e=>{ if(e.touches.length===2){ e.preventDefault();
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  if(pinchD){ tDist=Math.max(2.2,Math.min(6.5,tDist*(pinchD/d))); } pinchD=d; } },{passive:false});
addEventListener('touchend',()=>pinchD=0);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')go(1); if(e.key==='ArrowLeft')go(-1); });

function poke(){ /* small visual kick on morph */ pullTarget = pull>0?1.0:-1.6; }

/* show hint briefly then fade */
const hintEl=document.getElementById('hint');
requestAnimationFrame(()=>{ setTimeout(()=>hintEl.classList.add('show'),350);
  setTimeout(()=>hintEl.classList.remove('show'),4200); });

/* ---------- render loop ---------- */
gl.disable(gl.DEPTH_TEST);
gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA,gl.ONE);          // additive glow
gl.clearColor(0.015,0.022,0.05,1);

const pscaleBase = (isMobile?260:520);
let t0=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-t0)/1000); t0=now;
  const time=now/1000;

  // idle auto-cycle: if user hasn't touched anything for a while, morph on its own
  if(now-lastInteract > 6500){ idleT+=dt;
    if(idleT>3.2){ mixTarget=Math.round(mixTarget)+1; idleT=0;
      const fi=((Math.round(mixTarget)%NS)+NS)%NS; setForm(fi); }
    autoSpin=true;
  } else idleT=0;

  // smooth all the things
  mix += (mixTarget-mix)*Math.min(1,dt*3.4);
  if(autoSpin) tYaw += dt*0.12;
  yaw += (tYaw-yaw)*Math.min(1,dt*6);
  pitch += (tPitch-pitch)*Math.min(1,dt*6);
  camDist += (tDist-camDist)*Math.min(1,dt*4);
  pull += (pullTarget-pull)*Math.min(1,dt*3);
  ptrX += (ptrTX-ptrX)*Math.min(1,dt*8);
  ptrY += (ptrTY-ptrY)*Math.min(1,dt*8);

  // camera orbit
  const cx=Math.cos(pitch)*Math.sin(yaw)*camDist;
  const cy=Math.sin(pitch)*camDist;
  const cz=Math.cos(pitch)*Math.cos(yaw)*camDist;
  perspective(proj, 0.95, cvs.width/cvs.height, 0.1, 100);
  lookAt(view,[cx,cy,cz],[0,0,0],[0,1,0]);

  // map smoothed pointer onto a world-space point near the cloud, facing camera
  // build a plane through origin oriented to camera; place pointer there
  const right=[Math.cos(yaw),0,-Math.sin(yaw)];
  const upv=[ -Math.sin(pitch)*Math.sin(yaw), Math.cos(pitch), -Math.sin(pitch)*Math.cos(yaw) ];
  const reach=1.35;
  const pwx=right[0]*ptrX*reach + upv[0]*ptrY*reach;
  const pwy=right[1]*ptrX*reach + upv[1]*ptrY*reach;
  const pwz=right[2]*ptrX*reach + upv[2]*ptrY*reach;

  // trailing fade instead of hard clear -> motion smear / nebula trails
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.useProgram(prog);
  gl.uniformMatrix4fv(U.u_proj,false,proj);
  gl.uniformMatrix4fv(U.u_view,false,view);
  gl.uniform1f(U.u_time,time);
  gl.uniform1f(U.u_mix,mix);
  gl.uniform3f(U.u_pointer,pwx,pwy,pwz);
  gl.uniform1f(U.u_pull,pull);
  gl.uniform1f(U.u_pscale,pscaleBase*(cvs.height/900));
  gl.uniform2f(U.u_res,cvs.width,cvs.height);

  // palette interpolates between current and next shape colors
  const fi=((Math.floor(mix)%NS)+NS)%NS, ni=(fi+1)%NS, ff=mix-Math.floor(mix);
  const cA=shapes[fi].col, cB=shapes[ni].col;
  const blend=(a,b,k)=>a+(b-a)*k;
  let r=blend(cA[0],cB[0],ff), g=blend(cA[1],cB[1],ff), b=blend(cA[2],cB[2],ff);
  // crank saturation: push each channel away from its luma so additive sums keep a hue
  const lum=0.299*r+0.587*g+0.114*b, sat=1.55;
  r=Math.max(0,lum+(r-lum)*sat); g=Math.max(0,lum+(g-lum)*sat); b=Math.max(0,lum+(b-lum)*sat);
  // FAR = deep saturated hue (the body of the nebula)
  gl.uniform3f(U.u_baseA, r*0.95, g*0.95, b*1.0);
  // NEAR = brighter SAME hue (glow without going white)
  gl.uniform3f(U.u_baseB, Math.min(1,r*1.45), Math.min(1,g*1.45), Math.min(1,b*1.5));

  gl.drawArrays(gl.POINTS,0,N);

  requestAnimationFrame(frame);
}
