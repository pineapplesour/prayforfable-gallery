<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070d" />
  <meta name="description" content="STYLE:ON — AI 스타일리스트 워크 OS. 다크 시네마틱 네온. 소싱 · 스폰서십 · 협찬 트래킹 · 가상 트라이온." />
  <title>STYLE:ON — AI 스타일리스트 워크 OS</title>

  <!-- Korean+Latin body: Pretendard · Display/英: Archivo (compressed cinematic) · Mono: Spline Sans Mono (timecode/D-day) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Spline+Sans+Mono:wght@400;500;600;700&display=swap" />

  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305070d'/%3E%3Crect x='1' y='1' width='30' height='30' rx='7' fill='none' stroke='%233df0ff' stroke-width='1.4'/%3E%3Ctext x='16' y='22' font-family='Archivo,system-ui,sans-serif' font-size='17' font-weight='900' fill='%233df0ff' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- cinematic ambient layers -->
  <div class="cine-bg" aria-hidden="true">
    <div class="cine-glow cg1"></div>
    <div class="cine-glow cg2"></div>
    <div class="cine-grid"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <div id="topbar-progress" class="topbar-progress" aria-hidden="true"></div>

  <a class="skip-link" href="#main">본문 바로가기</a>

  <header class="masthead" id="masthead"><!-- rendered by app.js --></header>

  <main id="main" class="app-main" tabindex="-1"><!-- views render here --></main>

  <footer class="app-foot">
    <span class="foot-mark">STYLE<span class="on">:ON</span></span>
    <span class="foot-meta">AI 스타일리스트 워크 OS · 다크 시네마틱 네온 · Sourcing · Sponsor · Track · Fit · Ref · Lens · Trend · Pay · Desk · Crew</span>
    <span class="foot-conn" id="foot-conn">연결 확인 중…</span>
  </footer>

  <div id="toast-stack" class="toast-stack" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>

  <script type="module" src="./js/app.js"></script>
  <noscript>
    <p style="padding:2rem;font-family:sans-serif;color:#cdd6e6">STYLE:ON 콘솔은 JavaScript가 필요합니다.</p>
  </noscript>
</body>
</html>
