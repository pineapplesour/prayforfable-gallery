<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="description" content="STYLE:ON — AI 스타일리스트 워크 OS. 소싱 · 스폰서십 · 협찬 트래킹 · 가상 트라이온." />
  <title>STYLE:ON — AI 스타일리스트 워크 OS</title>

  <!-- 폰트: Pretendard (Re:Connect 디자인 언어) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Mono (코드/D-day) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400;500;600&display=swap" />

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Tailwind Configuration — Re:Connect brand scale (violet on slate) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'system-ui', 'sans-serif'],
            mono: ['"Spline Sans Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd', 400: '#a78bfa',
              500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9', 800: '#5b21b6', 900: '#4c1d95',
            },
          },
          boxShadow: {
            'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
            'card': '0 4px 20px -2px rgba(0,0,0,0.05)',
            'glow': '0 0 24px rgba(124, 58, 237, 0.45)',
            'brand': '0 12px 30px -8px rgba(124, 58, 237, 0.45)',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            float:  { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
          },
          animation: {
            fadeIn: 'fadeIn 0.4s ease-out',
            float: 'float 6s ease-in-out infinite',
          },
        },
      },
    };
  </script>

  <!-- Re:Connect 디자인 언어: glass / gradient / blob / soft motion -->
  <style>
    :root {
      --brand-600: #7c3aed;
      --brand-700: #6d28d9;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Pretendard', system-ui, sans-serif;
      margin: 0; padding: 0;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .glass-nav {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(15, 23, 42, 0.06);
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .gradient-text {
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 보라 컬러 블롭 (배경 디테일) */
    .blob {
      position: absolute; border-radius: 9999px; filter: blur(64px);
      pointer-events: none; z-index: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
    }
  </style>

  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c3aed'/%3E%3Ctext x='16' y='22' font-family='Pretendard,system-ui,sans-serif' font-size='17' font-weight='800' fill='%23ffffff' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
</head>
<body class="min-h-screen text-slate-900">
  <!-- 전역 상단 프로그레스바 -->
  <div id="topbar-progress" class="topbar-progress" aria-hidden="true"></div>

  <a class="skip-link" href="#main">본문 바로가기</a>

  <!-- 글래스 마스트헤드 (app.js가 렌더) -->
  <header class="masthead" id="masthead"><!-- rendered by app.js --></header>

  <!-- 본문 영역 -->
  <main id="main" class="app-main" tabindex="-1"><!-- views render here --></main>

  <!-- 모바일 하단 탭 (app.js가 렌더) -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="빠른 이동"><!-- rendered by app.js --></nav>

  <footer class="app-foot">
    <span class="foot-mark">STYLE<span class="on">:ON</span></span>
    <span class="foot-meta">AI 스타일리스트 워크 OS · Sourcing · Sponsor · Track · Fit · Ref · Lens · Trend · Pay · Desk · Crew</span>
    <span class="foot-conn" id="foot-conn">연결 확인 중…</span>
  </footer>

  <div id="toast-stack" class="toast-stack" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>

  <script type="module" src="./js/app.js"></script>
  <noscript>
    <p style="padding:2rem;font-family:sans-serif">STYLE:ON 콘솔은 JavaScript가 필요합니다.</p>
  </noscript>
</body>
</html>
