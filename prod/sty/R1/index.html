<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" />
  <meta name="description" content="STYLE:ON — AI 스타일리스트 워크 OS. 소싱 · 스폰서십 · 협찬 트래킹 · 가상 트라이온." />
  <title>STYLE:ON — AI 스타일리스트 워크 OS</title>

  <!-- Pretendard (본문/디스플레이) + Spline Sans Mono (코드/D-day) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400;500;600&display=swap" />

  <!-- Re:Connect 디자인 언어 스택: Tailwind(CDN) + Lucide -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Re:Connect 토큰을 그대로 가져옴 (brand 바이올렛 스케일 + soft/card/glow 그림자).
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Pretendard", "system-ui", "sans-serif"], mono: ['"Spline Sans Mono"', "ui-monospace", "monospace"] },
          colors: {
            brand: {
              50: "#f5f3ff", 100: "#ede9fe", 200: "#ddd6fe", 300: "#c4b5fd", 400: "#a78bfa",
              500: "#8b5cf6", 600: "#7c3aed", 700: "#6d28d9", 800: "#5b21b6", 900: "#4c1d95",
            },
          },
          boxShadow: {
            soft: "0 10px 40px -10px rgba(0,0,0,0.08)",
            card: "0 4px 20px -2px rgba(0,0,0,0.05)",
            glow: "0 0 24px rgba(124, 58, 237, 0.45)",
          },
          borderRadius: { "2rem": "2rem" },
          keyframes: {
            fadeIn: { from: { opacity: 0, transform: "translateY(10px)" }, to: { opacity: 1, transform: "translateY(0)" } },
            float: { "0%,100%": { transform: "translateY(0px)" }, "50%": { transform: "translateY(-10px)" } },
          },
          animation: { fadeIn: "fadeIn .4s ease-out both", float: "float 6s ease-in-out infinite" },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c3aed'/%3E%3Ctext x='16' y='22' font-family='Pretendard,system-ui,sans-serif' font-size='17' font-weight='800' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
  <!-- 보라 컬러 블롭 배경 디테일 -->
  <div class="page-blobs" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <div id="topbar-progress" class="topbar-progress" aria-hidden="true"></div>

  <a class="skip-link" href="#main">본문 바로가기</a>

  <header class="masthead" id="masthead"><!-- app.js 가 글래스 내비를 렌더 --></header>

  <main id="main" class="app-main" tabindex="-1"><!-- view 가 여기에 렌더 --></main>

  <footer class="app-foot">
    <div class="app-foot-inner">
      <span class="foot-mark">STYLE<span class="text-brand-600">:ON</span></span>
      <span class="foot-meta">AI 스타일리스트 워크 OS · 10 modules · Sourcing · Sponsor · Track · Fit · Ref · Lens · Trend · Pay · Desk · Crew</span>
      <span class="foot-conn" id="foot-conn">연결 확인 중…</span>
    </div>
  </footer>

  <!-- 모바일 하단 탭바 (app.js 렌더) -->
  <nav id="bottom-nav" class="bottom-nav" aria-label="빠른 이동"></nav>

  <div id="toast-stack" class="toast-stack" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>

  <script type="module" src="./js/app.js"></script>
  <noscript>
    <p style="padding:2rem;font-family:sans-serif">STYLE:ON 콘솔은 JavaScript가 필요합니다.</p>
  </noscript>
</body>
</html>
