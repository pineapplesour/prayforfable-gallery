<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16181b" />
  <meta name="description" content="STYLE:ON — AI 스타일리스트 워크 콘솔. 소싱 · 협찬 · 트래킹 · 가상피팅 · 정산을 하나의 도구로." />
  <title>STYLE:ON · Work Console</title>

  <!-- Korean+Latin UI: Pretendard · Mono (codes / D-day / metrics): Spline Sans Mono -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400;500;600;700&display=swap" />

  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316181b'/%3E%3Ctext x='16' y='22' font-family='Spline Sans Mono,monospace' font-size='17' font-weight='700' fill='%2334d399' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="topbar-progress" class="topbar-progress" aria-hidden="true"></div>

  <a class="skip-link" href="#main">본문 바로가기</a>

  <div class="app-shell">
    <!-- left rail / sidebar — rendered by app.js -->
    <aside class="sidebar" id="sidebar"><!-- rendered by app.js --></aside>

    <!-- backdrop for the mobile drawer -->
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <div class="workspace">
      <!-- slim command bar — rendered by app.js -->
      <header class="topbar" id="topbar"><!-- rendered by app.js --></header>

      <main id="main" class="app-main" tabindex="-1"><!-- views render here --></main>

      <footer class="app-foot">
        <span class="foot-mark">STYLE<span class="on">:ON</span></span>
        <span class="foot-meta">AI Stylist Work Console · Sourcing · Sponsor · Track · Fit · Ref · Lens · Trend · Pay · Desk · Crew</span>
        <span class="foot-conn" id="foot-conn">연결 확인 중…</span>
      </footer>
    </div>
  </div>

  <div id="toast-stack" class="toast-stack" aria-live="polite" aria-atomic="false"></div>
  <div id="palette-root"></div>
  <div id="modal-root"></div>

  <script type="module" src="./js/app.js"></script>
  <noscript>
    <p style="padding:2rem;font-family:sans-serif">STYLE:ON 콘솔은 JavaScript가 필요합니다.</p>
  </noscript>
</body>
</html>
