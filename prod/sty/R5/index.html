<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" />
  <meta name="description" content="STYLE:ON — AI 스타일리스트 워크 OS. 소싱 · 스폰서십 · 협찬 트래킹 · 가상 트라이온." />
  <title>STYLE:ON — AI 스타일리스트 워크 OS</title>

  <!-- Pretendard (body & display) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Mono: Spline Sans Mono (codes / D-day / numerics) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400;500;600&display=swap" />

  <!-- Tailwind CSS (Re:Connect design language) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Tailwind Configuration — Re:Connect brand scale + shadows (kept 1:1) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'system-ui', 'sans-serif'],
            mono: ['"Spline Sans Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd', 400: '#a78bfa',
              500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9', 800: '#5b21b6', 900: '#4c1d95',
            }
          },
          boxShadow: {
            'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
            'card': '0 4px 20px -2px rgba(0,0,0,0.05)',
            'glow': '0 0 20px rgba(124, 58, 237, 0.5)',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: 0, transform: 'translateY(10px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
            float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
          },
          animation: {
            fadeIn: 'fadeIn 0.4s ease-out',
            float: 'float 6s ease-in-out infinite',
          },
        }
      }
    }
  </script>

  <!-- Re:Connect design tokens (glass nav, gradient text, motion) -->
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c3aed'/%3E%3Ctext x='16' y='22' font-family='Pretendard,system-ui,sans-serif' font-size='17' font-weight='800' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <!-- soft violet background blobs (Re:Connect ambience) -->
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
  </div>

  <div id="topbar-progress" class="topbar-progress" aria-hidden="true"></div>

  <a class="skip-link" href="#main">본문 바로가기</a>

  <header class="masthead" id="masthead"><!-- rendered by app.js (glass nav) --></header>

  <main id="main" class="app-main" tabindex="-1"><!-- views render here --></main>

  <footer class="app-foot">
    <div class="foot-inner">
      <span class="foot-mark">
        <span class="foot-logo"><i data-lucide="sparkles"></i></span>
        STYLE<span class="on">:ON</span>
      </span>
      <span class="foot-meta">AI 스타일리스트 워크 OS · 10개 기능 · Sourcing · Sponsor · Track · Fit · Ref · Lens · Trend · Pay · Desk · Crew</span>
      <span class="foot-conn" id="foot-conn">연결 확인 중…</span>
    </div>
  </footer>

  <div id="toast-stack" class="toast-stack" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>

  <script type="module" src="./js/app.js"></script>
  <noscript>
    <p style="padding:2rem;font-family:sans-serif">STYLE:ON 콘솔은 JavaScript가 필요합니다.</p>
  </noscript>
</body>
</html>
