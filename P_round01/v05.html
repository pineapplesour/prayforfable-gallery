<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>침묵의 거리 — 폐허 동행기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#e9eef2; --ink-dim:#9fb0bc; --paper:#0b1014;
    --box:rgba(8,13,18,0.82); --box-edge:rgba(150,200,220,0.22);
    --accent:#7fd4c8; --accent2:#e6b86a; --bad:#d77a86;
    --name:#9fe3d8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#05080a;overflow:hidden;
    font-family:'Gowun Batang',serif;color:var(--ink);user-select:none;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #frame{position:relative;width:100%;height:100%;max-width:1440px;margin:0 auto;
    background:#05080a;overflow:hidden;}
  /* scene layers */
  .layer{position:absolute;inset:0;width:100%;height:100%;}
  #bg{z-index:1;}
  #bg svg, #fx svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #fx{z-index:2;pointer-events:none;}
  .fadelayer{position:absolute;inset:0;background:#05080a;z-index:9;opacity:0;
    transition:opacity .55s ease;pointer-events:none;}
  .fadelayer.show{opacity:1;}

  /* portraits */
  #cast{position:absolute;inset:0;z-index:3;pointer-events:none;}
  .port{position:absolute;bottom:0;height:78%;width:auto;
    opacity:0;transform:translateY(18px) scale(.98);
    transition:opacity .5s ease, transform .5s ease, filter .35s ease;}
  .port svg{height:100%;width:auto;display:block;}
  .port.on{opacity:1;transform:translateY(0) scale(1);}
  .port.dim{filter:brightness(.5) saturate(.6);}
  #portL{left:2%;transform-origin:bottom left;}
  #portR{right:2%;transform-origin:bottom right;}

  /* dialogue */
  #ui{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:0 3% 3%;}
  #namebar{display:inline-block;margin:0 0 -10px 4%;padding:6px 22px;
    font-family:'Gowun Dodum',sans-serif;font-weight:700;font-size:1.15rem;color:var(--name);
    background:linear-gradient(180deg,rgba(12,20,26,.95),rgba(8,14,18,.95));
    border:1px solid var(--box-edge);border-bottom:none;border-radius:12px 12px 0 0;
    box-shadow:0 -2px 14px rgba(0,0,0,.4);letter-spacing:.04em;
    opacity:0;transition:opacity .25s;}
  #namebar.on{opacity:1;}
  #dbox{position:relative;background:var(--box);border:1px solid var(--box-edge);
    border-radius:16px;padding:26px 34px 30px;min-height:160px;
    backdrop-filter:blur(3px);box-shadow:0 10px 40px rgba(0,0,0,.55), inset 0 0 30px rgba(80,140,160,.05);}
  #text{font-size:1.32rem;line-height:1.95;letter-spacing:.01em;min-height:3.6em;
    color:var(--ink);text-shadow:0 1px 6px rgba(0,0,0,.6);}
  #text .nar{color:var(--ink-dim);font-style:italic;}
  #cursor{display:inline-block;width:.55em;color:var(--accent);animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  #adv{position:absolute;right:24px;bottom:16px;color:var(--accent);font-size:1.4rem;
    animation:bob 1.1s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.5;}50%{transform:translateY(5px);opacity:1;}}

  /* choices */
  #choices{position:absolute;inset:0;z-index:7;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:8% 8%;
    background:radial-gradient(ellipse at center,rgba(4,7,9,.35),rgba(4,7,9,.78));}
  #choices.on{display:flex;}
  .choice{width:min(720px,86%);padding:18px 26px;font-family:'Gowun Batang',serif;
    font-size:1.18rem;color:var(--ink);text-align:center;cursor:pointer;
    background:linear-gradient(180deg,rgba(18,30,36,.92),rgba(10,18,22,.92));
    border:1px solid var(--box-edge);border-radius:14px;
    transition:transform .18s,border-color .18s,box-shadow .18s,color .18s;
    opacity:0;transform:translateY(14px);}
  .choice.in{opacity:1;transform:translateY(0);}
  .choice:hover{transform:translateY(-2px) scale(1.015);border-color:var(--accent);
    color:#fff;box-shadow:0 6px 24px rgba(80,180,170,.22);}
  .choice .tag{display:block;font-size:.82rem;color:var(--accent2);margin-top:4px;
    font-family:'Gowun Dodum',sans-serif;letter-spacing:.05em;}

  /* top controls */
  #ctrl{position:absolute;top:14px;right:14px;z-index:8;display:flex;gap:8px;}
  .btn{font-family:'Gowun Dodum',sans-serif;font-size:.86rem;color:var(--ink-dim);
    background:rgba(10,16,20,.7);border:1px solid var(--box-edge);border-radius:10px;
    padding:8px 13px;cursor:pointer;transition:.18s;backdrop-filter:blur(2px);}
  .btn:hover{color:#fff;border-color:var(--accent);}
  .btn.act{color:var(--accent);border-color:var(--accent);}

  /* backlog */
  #backlog{position:absolute;inset:0;z-index:20;background:rgba(4,7,9,.94);
    display:none;flex-direction:column;padding:5% 8%;}
  #backlog.on{display:flex;}
  #backlog h2{font-family:'Gowun Dodum',sans-serif;color:var(--accent);margin:0 0 14px;font-size:1.1rem;letter-spacing:.1em;}
  #logbody{overflow-y:auto;flex:1;padding-right:10px;}
  .logitem{margin-bottom:16px;line-height:1.7;}
  .logitem .who{color:var(--name);font-family:'Gowun Dodum',sans-serif;font-size:.9rem;display:block;margin-bottom:2px;}
  .logitem .ln{color:var(--ink);font-size:1.05rem;}

  /* title */
  #title{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;background:#05080a;}
  #title svg{position:absolute;inset:0;width:100%;height:100%;}
  #titlebox{position:relative;z-index:2;text-align:center;padding:30px;}
  #titlebox h1{font-family:'Gowun Batang',serif;font-weight:700;font-size:clamp(2.2rem,6vw,4.4rem);
    margin:0;letter-spacing:.18em;color:#eaf4f2;text-shadow:0 0 28px rgba(120,210,200,.45),0 4px 18px rgba(0,0,0,.7);}
  #titlebox .sub{font-family:'Gowun Dodum',sans-serif;color:var(--accent2);
    letter-spacing:.42em;margin-top:14px;font-size:clamp(.8rem,1.6vw,1.05rem);opacity:.9;}
  #menu{position:relative;z-index:2;margin-top:48px;display:flex;flex-direction:column;gap:14px;align-items:center;}
  .mbtn{font-family:'Gowun Dodum',sans-serif;font-size:1.05rem;color:var(--ink);
    background:rgba(10,18,22,.6);border:1px solid var(--box-edge);border-radius:30px;
    padding:13px 46px;cursor:pointer;transition:.2s;letter-spacing:.12em;min-width:230px;}
  .mbtn:hover{color:#fff;border-color:var(--accent);background:rgba(20,40,46,.7);box-shadow:0 0 22px rgba(100,200,190,.2);}
  .mbtn.dis{opacity:.35;cursor:default;}
  #credit{position:absolute;bottom:18px;z-index:2;color:var(--ink-dim);font-family:'Gowun Dodum',sans-serif;font-size:.78rem;letter-spacing:.08em;opacity:.7;}

  /* ending card */
  #endcard{position:absolute;inset:0;z-index:25;display:none;flex-direction:column;
    align-items:center;justify-content:center;background:rgba(4,7,9,.96);text-align:center;padding:8%;}
  #endcard.on{display:flex;}
  #endcard .etitle{font-family:'Gowun Batang',serif;font-weight:700;font-size:clamp(1.8rem,5vw,3rem);
    color:var(--accent);letter-spacing:.1em;margin-bottom:10px;text-shadow:0 0 24px rgba(120,210,200,.4);}
  #endcard .edesc{font-size:1.15rem;color:var(--ink-dim);line-height:1.9;max-width:640px;margin-bottom:34px;}
  #endcard .eroute{font-family:'Gowun Dodum',sans-serif;color:var(--accent2);letter-spacing:.3em;margin-bottom:30px;font-size:.95rem;}

  #toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:40;
    background:rgba(10,20,24,.92);border:1px solid var(--accent);color:var(--accent);
    font-family:'Gowun Dodum',sans-serif;padding:10px 22px;border-radius:30px;font-size:.92rem;
    opacity:0;transition:opacity .3s;pointer-events:none;letter-spacing:.06em;}
  #toast.on{opacity:1;}

  @media (max-width:560px){
    #text{font-size:1.08rem;line-height:1.8;}
    #dbox{padding:18px 20px 24px;min-height:138px;}
    #namebar{font-size:1rem;margin-left:3%;}
    .port{height:62%;}
    .choice{font-size:1.02rem;padding:14px 18px;width:94%;}
    #ctrl{top:8px;right:8px;}
    .btn{padding:6px 9px;font-size:.76rem;}
    #ui{padding:0 2% 2%;}
  }
</style>
</head>
<body>
<div id="stage"><div id="frame">

  <div id="bg" class="layer"></div>
  <div id="fx" class="layer"></div>
  <div id="cast">
    <div id="portL" class="port"></div>
    <div id="portR" class="port"></div>
  </div>
  <div id="fade" class="fadelayer"></div>

  <div id="ctrl">
    <button class="btn" id="bAuto">오토</button>
    <button class="btn" id="bSkip">스킵</button>
    <button class="btn" id="bLog">백로그</button>
    <button class="btn" id="bSave">세이브</button>
    <button class="btn" id="bSnd">♪ 음</button>
    <button class="btn" id="bMenu">메뉴</button>
  </div>

  <div id="ui">
    <div id="namebar"></div>
    <div id="dbox">
      <div id="text"></div>
      <div id="adv">▼</div>
    </div>
  </div>

  <div id="choices"></div>

  <div id="backlog">
    <h2>지난 대화 ▾</h2>
    <div id="logbody"></div>
    <button class="btn" id="logClose" style="align-self:center;margin-top:14px;padding:10px 30px;">닫기</button>
  </div>

  <div id="endcard">
    <div class="eroute" id="endRoute"></div>
    <div class="etitle" id="endTitle"></div>
    <div class="edesc" id="endDesc"></div>
    <button class="mbtn" id="endBack">타이틀로</button>
  </div>

  <div id="toast"></div>

  <div id="title">
    <div id="titleArt"></div>
    <div id="titlebox">
      <h1>침묵의 거리</h1>
      <div class="sub">폐 허 동 행 기</div>
    </div>
    <div id="menu">
      <button class="mbtn" id="mNew">처음부터</button>
      <button class="mbtn dis" id="mCont">이어하기</button>
      <button class="mbtn" id="mGallery">엔딩 기록</button>
    </div>
    <div id="credit">SVG Visual Novel · 클릭 / 탭으로 진행</div>
  </div>

</div></div>

<script>
"use strict";
/* =========================================================================
   침묵의 거리 — 폐허 동행기  (single-file SVG visual novel)
   ========================================================================= */
const $ = s => document.querySelector(s);

/* ---------------------------------------------------------------------------
   1. SVG ART  — 모든 그림은 도형 조합
   --------------------------------------------------------------------------- */

   - 여울(Yeoul): 라디오 수리공, 차분/단단함

// 표정 부품: 눈/눈썹/입을 emotion으로 분기
function eyes(emo, cx1, cx2, cy){
  const open = `<ellipse cx="${cx1}" cy="${cy}" rx="6.5" ry="8" fill="#1a1414"/><ellipse cx="${cx2}" cy="${cy}" rx="6.5" ry="8" fill="#1a1414"/>
                <circle cx="${cx1+2}" cy="${cy-2}" r="2" fill="#fff" opacity=".9"/><circle cx="${cx2+2}" cy="${cy-2}" r="2" fill="#fff" opacity=".9"/>`;
  const soft = `<path d="M${cx1-7} ${cy} Q${cx1} ${cy-7} ${cx1+7} ${cy}" stroke="#1a1414" stroke-width="3.4" fill="none" stroke-linecap="round"/>
                <path d="M${cx2-7} ${cy} Q${cx2} ${cy-7} ${cx2+7} ${cy}" stroke="#1a1414" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
  const wide = `<circle cx="${cx1}" cy="${cy}" r="9" fill="#fff" stroke="#1a1414" stroke-width="1.5"/><circle cx="${cx1}" cy="${cy}" r="4.5" fill="#1a1414"/>
                <circle cx="${cx2}" cy="${cy}" r="9" fill="#fff" stroke="#1a1414" stroke-width="1.5"/><circle cx="${cx2}" cy="${cy}" r="4.5" fill="#1a1414"/>`;
  if(emo==='happy'||emo==='warm') return soft;
  if(emo==='shock'||emo==='surprise') return wide;
  return open;
}
function brows(emo, cx1, cx2, cy){
  if(emo==='sad') return `<line x1="${cx1-9}" y1="${cy+3}" x2="${cx1+8}" y2="${cy-3}" stroke="#3a2b22" stroke-width="3.2" stroke-linecap="round"/><line x1="${cx2-8}" y1="${cy-3}" x2="${cx2+9}" y2="${cy+3}" stroke="#3a2b22" stroke-width="3.2" stroke-linecap="round"/>`;
  if(emo==='angry'||emo==='resolve') return `<line x1="${cx1-9}" y1="${cy-4}" x2="${cx1+8}" y2="${cy+2}" stroke="#3a2b22" stroke-width="3.4" stroke-linecap="round"/><line x1="${cx2-8}" y1="${cy+2}" x2="${cx2+9}" y2="${cy-4}" stroke="#3a2b22" stroke-width="3.4" stroke-linecap="round"/>`;
  if(emo==='surprise'||emo==='shock') return `<line x1="${cx1-8}" y1="${cy-5}" x2="${cx1+8}" y2="${cy-6}" stroke="#3a2b22" stroke-width="3" stroke-linecap="round"/><line x1="${cx2-8}" y1="${cy-6}" x2="${cx2+8}" y2="${cy-5}" stroke="#3a2b22" stroke-width="3" stroke-linecap="round"/>`;
  return `<line x1="${cx1-9}" y1="${cy}" x2="${cx1+8}" y2="${cy-1}" stroke="#3a2b22" stroke-width="3" stroke-linecap="round"/><line x1="${cx2-8}" y1="${cy-1}" x2="${cx2+9}" y2="${cy}" stroke="#3a2b22" stroke-width="3" stroke-linecap="round"/>`;
}
function mouth(emo, cx, cy){
  if(emo==='happy'||emo==='warm') return `<path d="M${cx-13} ${cy} Q${cx} ${cy+14} ${cx+13} ${cy}" stroke="#7a3b3b" stroke-width="3" fill="#7a3b3b" opacity=".9"/>`;
  if(emo==='sad') return `<path d="M${cx-11} ${cy+5} Q${cx} ${cy-3} ${cx+11} ${cy+5}" stroke="#7a3b3b" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if(emo==='surprise'||emo==='shock') return `<ellipse cx="${cx}" cy="${cy+2}" rx="7" ry="10" fill="#5a2a2a"/>`;
  if(emo==='resolve'||emo==='angry') return `<line x1="${cx-12}" y1="${cy+2}" x2="${cx+12}" y2="${cy+2}" stroke="#7a3b3b" stroke-width="3.4" stroke-linecap="round"/>`;
  return `<path d="M${cx-10} ${cy} Q${cx} ${cy+5} ${cx+10} ${cy}" stroke="#7a3b3b" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
}

/* ---------------------------------------------------------------------------
   2. AUDIO  (WebAudio 분위기) — 가볍게, 토글 가능
   --------------------------------------------------------------------------- */
const Audio_ = {
  ctx:null, on:false, nodes:[], drone:null, mode:'calm',
  init(){
    if(this.ctx) return;
    try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.ctx=null; }
  },
  start(){
    this.init(); if(!this.ctx) return;
    if(this.ctx.state==='suspended') this.ctx.resume();
    this.stop();
    const c=this.ctx, master=c.createGain(); master.gain.value=0.0; master.connect(c.destination);
    master.gain.linearRampToValueAtTime(0.10, c.currentTime+2);
    this.master=master;
    // two detuned sine drones + slow LFO
    const base = this.mode==='tense'?70 : this.mode==='warm'?98 : 84;
    [0,3,-2].forEach((d,i)=>{
      const o=c.createOscillator(); o.type='sine'; o.frequency.value=base*(i===2?1.5:1)+d;
      const g=c.createGain(); g.gain.value=i===0?0.5:0.28;
      const lfo=c.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.05+i*0.02;
      const lg=c.createGain(); lg.gain.value=0.12; lfo.connect(lg); lg.connect(g.gain);
      o.connect(g); g.connect(master); o.start(); lfo.start();
      this.nodes.push(o,lfo);
    });
    // soft wind noise
    const buf=c.createBuffer(1, c.sampleRate*2, c.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.18;
    const noise=c.createBufferSource(); noise.buffer=buf; noise.loop=true;
    const nf=c.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=this.mode==='tense'?600:340;
    const ng=c.createGain(); ng.gain.value=0.05; noise.connect(nf); nf.connect(ng); ng.connect(master);
    noise.start(); this.nodes.push(noise);
    this.on=true;
  },
  setMode(m){ if(m===this.mode) return; this.mode=m; if(this.on) this.start(); },
  blip(freq=520, dur=0.08){
    this.init(); if(!this.ctx||!this.on) return;
    const c=this.ctx, o=c.createOscillator(), g=c.createGain();
    o.type='triangle'; o.frequency.value=freq; g.gain.value=0.0;
    o.connect(g); g.connect(c.destination);
    g.gain.linearRampToValueAtTime(0.05, c.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+dur);
    o.start(); o.stop(c.currentTime+dur+0.02);
  },
  chime(){ // ending / key moment
    this.init(); if(!this.ctx) return; if(this.ctx.state==='suspended')this.ctx.resume();
    const c=this.ctx; [523,659,784,1047].forEach((f,i)=>{
      const o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.value=f;
      o.connect(g); g.connect(c.destination); const t=c.currentTime+i*0.16;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.12,t+0.04);
      g.gain.exponentialRampToValueAtTime(0.001,t+1.2); o.start(t); o.stop(t+1.3);
    });
  },
  stop(){ this.nodes.forEach(n=>{try{n.stop();}catch(e){}}); this.nodes=[]; this.on=false; }
};

    {who:'여울', t:"괜찮아. 내가 평생 들을게. 절대 안 놓을게. 다신 너 혼자 안 둬."},

  lines:[

/* ---------------------------------------------------------------------------
   4. ENGINE
   --------------------------------------------------------------------------- */
const SPEAKER = {
  '나':{color:'#cfe0e6'}, '여울':{color:'#9fe3d8'}, '노을':{color:'#caa0ff'}, '':{color:'#9fb0bc'}
};

const state = {
  cur:null, idx:0, flags:{}, log:[], endings:loadEndings(),
  typing:false, auto:false, skip:false, soundOn:false, queue:[]
};

function loadEndings(){ try{ return JSON.parse(localStorage.getItem('hush_endings')||'[]'); }catch(e){ return []; } }
function saveEndings(){ try{ localStorage.setItem('hush_endings', JSON.stringify(state.endings)); }catch(e){} }

/* ---- 렌더링 ---- */
let lastBg=null, lastFx=null;
function setBG(name){
  if(name===lastBg) return; lastBg=name;
  $('#bg').innerHTML = BG[name]||BG.dark;
}
function setFX(fn){
  if(fn===lastFx) return; lastFx=fn;
  const f = (fn==='fxFog')?fxFog():fxNone();
  $('#fx').innerHTML = f;
}
function setPort(side, spec){
  const el = side==='L'?$('#portL'):$('#portR');
  if(!spec){ el.classList.remove('on'); el.innerHTML=''; return; }
  const fn = PORTS[spec.c]; if(!fn){ el.classList.remove('on'); return; }
  el.innerHTML = fn(spec.e||'neutral');
  requestAnimationFrame(()=>el.classList.add('on'));
}
function dimPorts(activeSide){
  const L=$('#portL'), R=$('#portR');
  L.classList.toggle('dim', activeSide==='R' && L.classList.contains('on'));
  R.classList.toggle('dim', activeSide==='L' && R.classList.contains('on'));
}

function resolveSpec(node, key){
  let v = node[key];
  // getter on object already resolved by access; handle function-less
  return (typeof v==='undefined')?null:v;
}

let fadeT=null;
function fadeTo(cb){
  $('#fade').classList.add('show');
  clearTimeout(fadeT);
  fadeT = setTimeout(()=>{ cb(); requestAnimationFrame(()=>$('#fade').classList.remove('show')); }, 560);
}

/* ---- 장면 진입 ---- */
function goScene(id, withFade=true){
  const node = S[id];
  if(!node){ console.warn('no scene',id); return; }
  const enter = ()=>{
    state.cur=id; state.idx=0;
    setBG(node.bg||'dark'); setFX(node.fx||'fxNone');
    if(node.music) Audio_.setMode(node.music);
    // portraits (getters resolve on access)
    setPort('L', resolveSpec(node,'l'));
    setPort('R', resolveSpec(node,'r'));
    hideChoices();
    showLine();
  };
  if(withFade) fadeTo(enter); else enter();
}

/* ---- 라인 출력 (타이프라이터) ---- */
let typeTimer=null;
function showLine(){
  const node=S[state.cur];
  const line=node.lines[state.idx];
  if(!line){ afterLines(node); return; }
  const sp=SPEAKER[line.who]||SPEAKER[''];
  const nb=$('#namebar');
  if(line.who){ nb.textContent=line.who; nb.style.color=sp.color; nb.classList.add('on'); }
  else { nb.classList.remove('on'); }
  // dim non-speaking portrait
  let activeSide=null;
  if(line.who==='여울') activeSide='R';
  else if(line.who==='노을' || line.who==='나') activeSide='L';
  dimPorts(activeSide);

  const isNar = !line.who;
  const txtEl=$('#text');
  $('#adv').style.display='none';
  state.typing=true;
  const full=line.t;
  txtEl.innerHTML = isNar?'<span class="nar"></span>':'';
  let target = isNar? txtEl.querySelector('.nar') : txtEl;
  let i=0;
  clearInterval(typeTimer);
  const speed = state.skip?2 : 22;
  // log push
  pushLog(line.who, full);

  if(state.skip){
    target.textContent=full; finishType();
    return;
  }
  typeTimer=setInterval(()=>{
    target.textContent = full.slice(0,++i);
    if(i%3===0) Audio_.blip(440+(i%5)*40, 0.04);
    if(i>=full.length){ finishType(); }
  }, speed);

  function finishType(){
    clearInterval(typeTimer); state.typing=false;
    txtEl.innerHTML = isNar?`<span class="nar">${escapeHtml(full)}</span>`:escapeHtml(full);
    $('#adv').style.display='block';
    scheduleAuto();
  }
}
function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function pushLog(who,t){
  state.log.push({who,t});
  if(state.log.length>400) state.log.shift();
}

let autoT=null;
function scheduleAuto(){
  clearTimeout(autoT);
  if(state.auto && !choicesOpen()){
    const node=S[state.cur];
    const len=(node.lines[state.idx]?.t.length||30);
    autoT=setTimeout(advance, 900+len*45);
  } else if(state.skip && !choicesOpen()){
    autoT=setTimeout(advance, 120);
  }
}

/* ---- 진행 ---- */
function advance(){
  if(choicesOpen()) return;
  if(state.typing){ // skip typing
    const node=S[state.cur]; const line=node.lines[state.idx];
    clearInterval(typeTimer); state.typing=false;
    const isNar=!line.who; const txtEl=$('#text');
    txtEl.innerHTML = isNar?`<span class="nar">${escapeHtml(line.t)}</span>`:escapeHtml(line.t);
    $('#adv').style.display='block'; scheduleAuto(); return;
  }
  state.idx++;
  const node=S[state.cur];
  if(state.idx < node.lines.length){ showLine(); }
  else { afterLines(node); }
}

function afterLines(node){
  // choices?
  if(node.choices){ openChoices(node.choices); return; }
  // branch function?
  if(typeof node.branch==='function'){ goScene(node.branch()); return; }
  // ending?
  if(node.ending){ showEnding(node.ending); return; }
  // next
  if(node.next){ goScene(node.next); return; }
  // dead end
  showEnding({route:'END', title:'끝', desc:'이야기가 여기서 멈췄다.'});
}

/* ---- 선택지 ---- */
function choicesOpen(){ return $('#choices').classList.contains('on'); }
function hideChoices(){ $('#choices').classList.remove('on'); $('#choices').innerHTML=''; }
function openChoices(list){
  if(state.skip){ state.skip=false; $('#bSkip').classList.remove('act'); }
  const box=$('#choices'); box.innerHTML=''; box.classList.add('on');
  $('#adv').style.display='none';
  list.forEach((c,i)=>{
    const b=document.createElement('div'); b.className='choice';
    b.innerHTML = escapeHtml(c.label) + (c.tag?`<span class="tag">${escapeHtml(c.tag)}</span>`:'');
    b.onclick = ()=>{
      Audio_.blip(660,0.1);
      if(c.set) Object.assign(state.flags, applySet(c.set));
      hideChoices();
      pushLog('— 선택', c.label.replace(/^"|"$/g,''));
      goScene(c.to);
    };
    box.appendChild(b);
    setTimeout(()=>b.classList.add('in'), 120+i*110);
  });
}
function applySet(set){
  const out={};
  for(const k in set){ out[k]=(state.flags[k]||0)+set[k]; }
  return out;
}

/* ---- 엔딩 ---- */
function showEnding(end){
  Audio_.chime();
  $('#endRoute').textContent=end.route||'';
  $('#endTitle').textContent=end.title||'끝';
  $('#endDesc').textContent=end.desc||'';
  $('#endcard').classList.add('on');
  // record
  if(end.title && !state.endings.find(e=>e.title===end.title)){
    state.endings.push({route:end.route,title:end.title,desc:end.desc});
    saveEndings();
  }
}

/* ---- 백로그 ---- */
function openLog(){
  const body=$('#logbody'); body.innerHTML='';
  state.log.slice(-120).forEach(it=>{
    const d=document.createElement('div'); d.className='logitem';
    const who=it.who||'…';
    d.innerHTML=`<span class="who" style="color:${(SPEAKER[it.who]||SPEAKER['']).color}">${escapeHtml(who)}</span><span class="ln">${escapeHtml(it.t)}</span>`;
    body.appendChild(d);
  });
  $('#backlog').classList.add('on');
  body.scrollTop=body.scrollHeight;
}

/* ---- 세이브 / 로드 ---- */
function doSave(){
  const data={ cur:state.cur, idx:state.idx, flags:state.flags, log:state.log.slice(-200) };
  try{ localStorage.setItem('hush_save', JSON.stringify(data)); toast('저장되었습니다'); }
  catch(e){ toast('저장 실패'); }
  refreshContinue();
}
function hasSave(){ try{ return !!localStorage.getItem('hush_save'); }catch(e){ return false; } }
function doLoad(){
  try{
    const d=JSON.parse(localStorage.getItem('hush_save'));
    if(!d){ toast('저장 없음'); return; }
    state.flags=d.flags||{}; state.log=d.log||[];
    hideTitle();
    goScene(d.cur||'start');
    if(typeof d.idx==='number'){ state.idx=d.idx; showLine(); }
    toast('이어합니다');
  }catch(e){ toast('불러오기 실패'); }
}
function refreshContinue(){
  const b=$('#mCont');
  if(hasSave()) b.classList.remove('dis'); else b.classList.add('dis');
}

/* ---- 토스트 ---- */
let toastT=null;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1600);
}

/* ---- 타이틀 ---- */
function showTitle(){
  $('#title').style.display='flex';
  $('#titleArt').innerHTML=BG.title;
  refreshContinue();
}
function hideTitle(){ $('#title').style.display='none'; }

function startNew(){
  state.flags={}; state.log=[]; state.idx=0;
  hideTitle(); hideEndcard();
  if(!Audio_.on && state.soundOn) Audio_.start();
  goScene('start');
}
function hideEndcard(){ $('#endcard').classList.remove('on'); }

/* ---- 갤러리(엔딩 기록) ---- */
function showGallery(){
  const e=state.endings;
  if(!e.length){ toast('아직 본 엔딩이 없습니다'); return; }
  const list=e.map(x=>`◆ [${x.route}] ${x.title}`).join('\n');
  toast(`발견한 엔딩 ${e.length}/3`);
  // 간단 표시: endcard 재활용
  $('#endRoute').textContent='ENDING GALLERY';
  $('#endTitle').textContent=`${e.length} / 3 엔딩 발견`;
  $('#endDesc').textContent = e.map(x=>`[${x.route}] ${x.title}\n${x.desc}`).join('\n\n');
  $('#endcard').classList.add('on');
}

/* ---------------------------------------------------------------------------
   5. INPUT WIRING
   --------------------------------------------------------------------------- */
function onAdvanceClick(e){
  // ignore clicks on controls / choices / overlays
  if(e.target.closest('#ctrl,#choices,#backlog,#endcard,#title,.btn,.mbtn')) return;
  if($('#title').style.display!=='none' && $('#title').style.display!=='') return;
  if(choicesOpen()) return;
  if(!Audio_.on && state.soundOn) Audio_.start();
  advance();
}
$('#frame').addEventListener('click', onAdvanceClick);
document.addEventListener('keydown', e=>{
  if(e.code==='Space'||e.code==='Enter'){
    if($('#title').style.display==='none'||$('#title').style.display===''){
      if(!choicesOpen() && !$('#backlog').classList.contains('on') && !$('#endcard').classList.contains('on')){
        e.preventDefault(); advance();
      }
    }
  }
  if(e.code==='Escape'){ $('#backlog').classList.remove('on'); }
});

$('#bAuto').onclick=()=>{ state.auto=!state.auto; $('#bAuto').classList.toggle('act',state.auto); if(state.auto && !state.typing) scheduleAuto(); toast(state.auto?'오토 ON':'오토 OFF'); };
$('#bSkip').onclick=()=>{ state.skip=!state.skip; $('#bSkip').classList.toggle('act',state.skip); if(state.skip) scheduleAuto(); toast(state.skip?'스킵 ON':'스킵 OFF'); };
$('#bLog').onclick=openLog;
$('#logClose').onclick=()=>$('#backlog').classList.remove('on');
$('#bSave').onclick=doSave;
$('#bSnd').onclick=()=>{
  state.soundOn=!state.soundOn; $('#bSnd').classList.toggle('act',state.soundOn);
  if(state.soundOn){ Audio_.start(); toast('음악 ON'); } else { Audio_.stop(); toast('음악 OFF'); }
};
$('#bMenu').onclick=()=>{ hideEndcard(); $('#backlog').classList.remove('on'); showTitle(); };

$('#mNew').onclick=startNew;
$('#mCont').onclick=()=>{ if(hasSave()){ if(!Audio_.on && state.soundOn)Audio_.start(); doLoad(); } };
$('#mGallery').onclick=showGallery;
$('#endBack').onclick=()=>{ hideEndcard(); showTitle(); };

/* ---------------------------------------------------------------------------
   6. BOOT
   --------------------------------------------------------------------------- */
showTitle();
</script>
