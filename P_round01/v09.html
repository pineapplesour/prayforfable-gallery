<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>유리의 증언 — 누가 거짓말하는가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0e16; --panel:rgba(10,12,20,.86); --ink:#f3efe6; --ink-dim:#b7b2a6;
    --gold:#d8b15a; --gold2:#f2d493; --crim:#b8443f; --teal:#5fb6ac; --blue:#6f86c9;
    --line:#2a2f42; --shadow:0 10px 40px rgba(0,0,0,.6);
    --serif:'Gowun Batang',serif; --sans:'Noto Sans KR',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--sans);color:var(--ink);}
  #app{position:fixed;inset:0;background:var(--bg);}
  .stage{position:absolute;inset:0;overflow:hidden;}
  /* scene art layer */
  #sceneLayer{position:absolute;inset:0;}
  #sceneLayer svg, #charLayer svg{position:absolute;width:100%;height:100%;display:block;}
  #charLayer{position:absolute;inset:0;pointer-events:none;}
  /* width derived from height via aspect-ratio so SVG actually paints */
  .charSlot{position:absolute;bottom:8%;height:80%;aspect-ratio:300/360;
    transition:opacity .5s, transform .5s, filter .35s;opacity:0;
    filter:drop-shadow(0 12px 24px rgba(0,0,0,.55));}
  .charSlot.show{opacity:1;}
  .charSlot.dim{filter:brightness(.5) saturate(.6) drop-shadow(0 12px 24px rgba(0,0,0,.55));}
  .charSlot.speaking{filter:drop-shadow(0 12px 28px rgba(0,0,0,.6));}
  .slotL{left:2%;transform:translateX(-30px);}
  .slotC{left:50%;transform:translateX(-50%) translateY(20px);}
  .slotR{right:2%;transform:translateX(30px);}
  .charSlot.show.slotL{transform:translateX(0);}
  .charSlot.show.slotR{transform:translateX(0);}
  .charSlot.show.slotC{transform:translateX(-50%) translateY(0);}
  .charSlot svg{position:absolute;inset:0;height:100%;width:100%;}
  /* fade overlay */
  #fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:40;}
  #fade.on{opacity:1;}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:45;}

  /* ---------- Dialogue box ---------- */
  #dlg{position:absolute;left:0;right:0;bottom:0;z-index:30;padding:0 3.2vw 2.4vh;}
  #dlgInner{max-width:1180px;margin:0 auto;position:relative;}
  #nameTag{display:inline-block;font-family:var(--serif);font-weight:700;font-size:clamp(15px,2vw,22px);
    color:#15141a;background:linear-gradient(180deg,var(--gold2),var(--gold));padding:.28em 1.1em;border-radius:10px 10px 0 0;
    box-shadow:0 -2px 10px rgba(0,0,0,.4);transform:translateY(2px);letter-spacing:.04em;min-width:80px;text-align:center;}
  #nameTag.empty{visibility:hidden;}
  #textBox{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--gold);
    border-radius:0 14px 14px 14px;padding:clamp(14px,2.4vh,26px) clamp(18px,2.6vw,34px);
    min-height:clamp(96px,18vh,150px);box-shadow:var(--shadow);backdrop-filter:blur(6px);position:relative;cursor:pointer;}
  #txt{font-family:var(--serif);font-size:clamp(16px,2.25vw,23px);line-height:1.62;letter-spacing:.01em;
    white-space:pre-wrap;min-height:1.6em;}
  #txt .em{color:var(--gold2);font-weight:700;}
  #txt .nrr{color:var(--ink-dim);font-style:italic;}
  #cursor{display:inline-block;width:.55em;color:var(--gold);animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  #advHint{position:absolute;right:18px;bottom:10px;color:var(--gold);font-size:14px;opacity:.0;animation:bob 1.4s ease-in-out infinite;}
  #advHint.on{opacity:.9;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(4px);}}

  /* ---------- choices ---------- */
  #choices{position:absolute;left:0;right:0;top:14%;bottom:24%;z-index:35;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,1.8vh,16px);padding:0 6vw;}
  #choices.on{display:flex;}
  .choice{width:min(720px,92%);text-align:left;font-family:var(--sans);font-weight:500;
    font-size:clamp(15px,1.9vw,19px);color:var(--ink);background:linear-gradient(180deg,rgba(28,32,50,.95),rgba(16,18,30,.95));
    border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;padding:.85em 1.2em;cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.4);transition:transform .14s,border-color .14s,background .14s;opacity:0;transform:translateY(14px);}
  .choice.in{opacity:1;transform:translateY(0);}
  .choice:hover{transform:translateY(-2px) scale(1.012);border-left-color:var(--gold);background:linear-gradient(180deg,rgba(40,44,66,.98),rgba(22,24,38,.98));}
  .choice .ck{color:var(--gold2);font-weight:700;margin-right:.5em;}
  .choice.danger{border-left-color:var(--crim);}
  .choice.evi{border-left-color:var(--gold);}
  .choice .tag{float:right;font-size:12px;color:var(--ink-dim);margin-left:1em;}

  /* prompt header above choices */
  #choicePrompt{position:absolute;top:6%;left:0;right:0;text-align:center;z-index:35;display:none;
    font-family:var(--serif);font-size:clamp(15px,2vw,21px);color:var(--gold2);text-shadow:0 2px 8px #000;padding:0 8vw;}
  #choicePrompt.on{display:block;}

  /* ---------- top HUD ---------- */
  #hud{position:absolute;top:0;left:0;right:0;z-index:25;display:flex;align-items:center;gap:10px;
    padding:10px clamp(12px,2vw,22px);background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);}
  .hbtn{font-family:var(--sans);font-weight:700;font-size:13px;color:var(--ink-dim);background:rgba(20,22,34,.7);
    border:1px solid var(--line);border-radius:8px;padding:.45em .8em;cursor:pointer;transition:.14s;}
  .hbtn:hover{color:var(--gold2);border-color:var(--gold);}
  .hbtn.active{color:#15141a;background:var(--gold);}
  .spacer{flex:1;}
  #chapTitle{font-family:var(--serif);font-size:14px;color:var(--gold);opacity:.85;letter-spacing:.05em;}
  /* trust meter */
  #meterWrap{display:flex;align-items:center;gap:8px;}
  #meterWrap .lbl{font-size:11px;color:var(--ink-dim);}
  #meter{width:clamp(80px,12vw,150px);height:9px;background:#1a1d2c;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  #meterFill{height:100%;width:50%;background:linear-gradient(90deg,var(--crim),var(--gold),var(--teal));transition:width .5s;}

  /* ---------- title screen ---------- */
  #title{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 30%,#1a1f33 0%,#0a0c14 70%);transition:opacity .8s;}
  #title.hide{opacity:0;pointer-events:none;}
  #titleArt{width:min(640px,86vw);max-height:46vh;}
  #title h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,6.5vw,58px);margin:.2em 0 .05em;
    color:var(--gold2);letter-spacing:.06em;text-shadow:0 4px 24px rgba(0,0,0,.7);}
  #title .sub{font-family:var(--serif);font-size:clamp(13px,2.2vw,19px);color:var(--ink-dim);letter-spacing:.32em;margin-bottom:1.6em;}
  .menuBtn{font-family:var(--sans);font-weight:700;font-size:clamp(15px,2vw,18px);color:var(--ink);
    background:rgba(20,24,38,.8);border:1px solid var(--gold);border-radius:12px;padding:.7em 2.4em;margin:.3em;cursor:pointer;
    transition:.16s;min-width:200px;}
  .menuBtn:hover{background:var(--gold);color:#15141a;transform:translateY(-2px);}
  .menuBtn.small{font-size:13px;padding:.5em 1.4em;border-color:var(--line);min-width:0;}
  #title .credit{position:absolute;bottom:14px;font-size:11px;color:#54586a;letter-spacing:.1em;}

  /* backlog */
  #backlog{position:absolute;inset:0;z-index:70;background:rgba(6,7,12,.96);display:none;flex-direction:column;padding:4vh 5vw;}
  #backlog.on{display:flex;}
  #backlog h2{font-family:var(--serif);color:var(--gold2);margin:0 0 12px;font-size:22px;}
  #blList{flex:1;overflow-y:auto;padding-right:10px;}
  .blItem{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #1c2030;}
  .blItem .bn{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:14px;margin-bottom:3px;}
  .blItem .bt{font-family:var(--serif);color:var(--ink);font-size:15px;line-height:1.5;}
  #blList::-webkit-scrollbar{width:8px;}#blList::-webkit-scrollbar-thumb{background:#2a2f42;border-radius:4px;}

  /* evidence notebook */
  #evidence{position:absolute;inset:0;z-index:70;background:rgba(6,7,12,.96);display:none;flex-direction:column;padding:4vh 5vw;}
  #evidence.on{display:flex;}
  #evidence h2{font-family:var(--serif);color:var(--gold2);margin:0 0 12px;font-size:22px;}
  #eviGrid{display:flex;flex-wrap:wrap;gap:14px;overflow-y:auto;align-content:flex-start;}
  .evcard{width:min(280px,42vw);background:linear-gradient(180deg,#161a2a,#0e1120);border:1px solid var(--line);
    border-radius:12px;padding:12px;display:flex;gap:10px;}
  .evcard .ei{width:54px;height:54px;flex:none;}
  .evcard .en{font-family:var(--serif);color:var(--gold2);font-weight:700;font-size:14px;margin-bottom:3px;}
  .evcard .ed{font-size:12.5px;color:var(--ink-dim);line-height:1.45;}

  /* toast */
  #toast{position:absolute;top:54px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:50;
    background:rgba(216,177,90,.95);color:#15141a;font-weight:700;font-size:14px;padding:.6em 1.3em;border-radius:10px;
    box-shadow:var(--shadow);opacity:0;transition:.4s;pointer-events:none;}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

  .closeX{position:absolute;top:14px;right:18px;font-size:26px;color:var(--ink-dim);cursor:pointer;line-height:1;}
  .closeX:hover{color:var(--gold2);}

  /* ending overlay */
  #endScreen{position:absolute;inset:0;z-index:55;display:none;flex-direction:column;
    align-items:center;justify-content:center;padding:6vh 7vw;
    background:linear-gradient(180deg,rgba(6,7,12,.35),rgba(6,7,12,.78));opacity:0;transition:opacity .9s;}
  #endScreen.on{display:flex;opacity:1;}
  #endScreen .et1{font-family:var(--serif);font-weight:700;font-size:clamp(22px,4vw,38px);
    letter-spacing:.14em;margin-bottom:.7em;text-shadow:0 4px 24px #000;}
  #endScreen .et2{font-family:var(--serif);font-size:clamp(15px,2.2vw,22px);color:#e3ddcf;line-height:1.85;
    white-space:pre-wrap;text-align:center;max-width:760px;text-shadow:0 2px 10px #000;}
  #endScreen .estat{margin-top:1.6em;color:#9a9aab;font-size:13px;letter-spacing:.08em;}
  #endScreen .ebtns{margin-top:2.2em;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}

  @media (max-width:520px){
    #dlg{padding:0 3vw 1.4vh;}
    .charSlot{height:74%;}
    #hud{gap:6px;padding:8px 10px;}
    .hbtn{font-size:11px;padding:.4em .55em;}
    #chapTitle{display:none;}
    #meter{width:74px;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="stage" id="stage">
    <div id="sceneLayer"></div>
    <div id="charLayer"></div>
    <div id="flash"></div>
    <div id="fade"></div>

    <div id="hud">
      <button class="hbtn" id="bAuto">오토</button>
      <button class="hbtn" id="bSkip">스킵</button>
      <button class="hbtn" id="bLog">백로그</button>
      <button class="hbtn" id="bEvi">증거</button>
      <span class="spacer"></span>
      <span id="chapTitle"></span>
      <div id="meterWrap"><span class="lbl">심증</span><div id="meter"><div id="meterFill"></div></div></div>
      <button class="hbtn" id="bSave">저장</button>
      <button class="hbtn" id="bMenu">메뉴</button>
    </div>

    <div id="choicePrompt"></div>
    <div id="choices"></div>

    <div id="dlg">
      <div id="dlgInner">
        <div id="nameTag" class="empty">　</div>
        <div id="textBox">
          <div id="txt"></div>
          <span id="advHint">▼</span>
        </div>
      </div>
    </div>

    <div id="toast"></div>

    <div id="endScreen"></div>
  </div>

  <!-- Title -->
  <div id="title">
    <svg id="titleArt" viewBox="0 0 640 420" aria-label="title art"></svg>
    <h1>유리의 증언</h1>
    <div class="sub">누 가 거 짓 말 을 하 는 가</div>
    <button class="menuBtn" id="btnStart">처음부터</button>
    <button class="menuBtn" id="btnCont">이어하기</button>
    <button class="menuBtn small" id="btnSound">♪ 음악 켜기</button>
    <div class="credit">A SVG COURTROOM MYSTERY — SINGLE FILE VISUAL NOVEL</div>
  </div>

  <!-- Backlog -->
  <div id="backlog"><span class="closeX" id="blClose">×</span><h2>백로그</h2><div id="blList"></div></div>
  <!-- Evidence -->
  <div id="evidence"><span class="closeX" id="evClose">×</span><h2>증거 수첩</h2><div id="eviGrid"></div></div>
</div>

<script>
"use strict";
/* =========================================================================
   유리의 증언 — SVG 법정 추리 비주얼노벨
   모든 그림은 SVG 도형. 단일 파일. 백엔드 없음.
   ========================================================================= */

/* ---------- tiny DOM helpers ---------- */
const $=s=>document.querySelector(s);
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};

/* =========================================================================
   1. SVG ART LIBRARY  — characters, backgrounds, props, evidence icons
   ========================================================================= */

/* ---- color palettes per character ---- */
const PAL={
  yuna:{skin:'#f4d3bd',skin2:'#e6b89c',hair:'#2b2a33',hair2:'#46434f',cloth:'#39507a',cloth2:'#2a3a5c',acc:'#cdd7ee'}, // 변호인(주인공)
  seo: {skin:'#f6d8c4',skin2:'#e9bda4',hair:'#1c1b22',hair2:'#34323d',cloth:'#5a5360',cloth2:'#403b46',acc:'#b9b3bf'}, // 피고 서지호
  oh:  {skin:'#f0cbb4',skin2:'#dfb194',hair:'#5b4632',hair2:'#73583e',cloth:'#6f4a3a',cloth2:'#54372c',acc:'#caa382'}, // 증인 오관리인
  min: {skin:'#f7dccb',skin2:'#ecc3ac',hair:'#3a2c44',hair2:'#52405f',cloth:'#7a3550',cloth2:'#5c2740',acc:'#e6b9c9'}, // 증인 민서연
  kang:{skin:'#eccab2',skin2:'#dbae92',hair:'#15161b',hair2:'#2c2d34',cloth:'#26303a',cloth2:'#1b232b',acc:'#8fa3b0'}, // 증인 강도윤(형사)
  ha:  {skin:'#f3d4c0',skin2:'#e7b89f',hair:'#6a6a72',hair2:'#85858c',cloth:'#3d3640',cloth2:'#2c272f',acc:'#c0bcc4'}, // 검사 하경
  judge:{skin:'#ecc9b1',skin2:'#d9ac90',hair:'#cfcfd6',hair2:'#e6e6ec',cloth:'#1a1a22',cloth2:'#101016',acc:'#d8b15a'} // 판사
};

/* Build a character SVG. expr: neutral|talk|shock|smug|sad|angry|think|cry|smile
   Returns a full <svg> string sized by viewBox 300x520 (portrait). */
function charSVG(id, expr){
  const p=PAL[id]||PAL.yuna;
  expr=expr||'neutral';
  // expression params
  const E={
    neutral:{brow:0,eye:1,mouth:'m0',blush:0,tear:0},
    talk:   {brow:0,eye:1,mouth:'mO',blush:0,tear:0},
    smile:  {brow:-2,eye:.78,mouth:'mU',blush:.5,tear:0},
    smug:   {brow:-3,eye:.7,mouth:'mSmug',blush:0,tear:0},
    shock:  {brow:-9,eye:1.35,mouth:'mO2',blush:0,tear:0},
    angry:  {brow:9,eye:1.05,mouth:'mFrown',blush:0,tear:0},
    sad:    {brow:5,eye:.92,mouth:'mD',blush:0,tear:0},
    think:  {brow:3,eye:.9,mouth:'mFlat',blush:0,tear:0},
    cry:    {brow:6,eye:.8,mouth:'mD',blush:.6,tear:1},
    sweat:  {brow:6,eye:1.1,mouth:'mFlat',blush:0,tear:0,sweat:1}
  }[expr]||{brow:0,eye:1,mouth:'m0'};

  // mouth path
  function mouth(){
    const cx=150;
    switch(E.mouth){
      case 'm0':   return `<path d="M138 360 Q150 366 162 360" stroke="#9c5b50" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      case 'mU':   return `<path d="M134 356 Q150 372 166 356" stroke="#9c5b50" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
      case 'mD':   return `<path d="M136 366 Q150 354 164 366" stroke="#9c5b50" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      case 'mO':   return `<ellipse cx="150" cy="362" rx="9" ry="7" fill="#7d3b35"/><path d="M141 359 Q150 356 159 359" stroke="#5a2a26" stroke-width="1.4" fill="none"/>`;
      case 'mO2':  return `<ellipse cx="150" cy="364" rx="11" ry="13" fill="#6e312c"/>`;
      case 'mSmug':return `<path d="M137 358 Q150 360 165 352" stroke="#9c5b50" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      case 'mFrown':return `<path d="M134 366 Q150 356 166 366" stroke="#8a3a33" stroke-width="3.6" fill="none" stroke-linecap="round"/>`;
      case 'mFlat':return `<path d="M139 360 L161 360" stroke="#9c5b50" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      default:     return `<path d="M138 360 Q150 366 162 360" stroke="#9c5b50" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    }
  }
  const eyeRy=6*E.eye;
  const browDy=E.brow;
  const tear = E.tear? `
    <path d="M126 348 q-3 14 1 22 q5 -4 4 -16z" fill="#bfe0ef" opacity="0.85"/>
    <path d="M174 348 q3 14 -1 22 q-5 -4 -4 -16z" fill="#bfe0ef" opacity="0.85"/>`:'';
  const sweat = E.sweat? `<path d="M196 300 q8 16 0 26 q-8 -2 -8 -14 q0 -8 8 -12z" fill="#bfe0ef" opacity="0.9"/>`:'';
  const blush = E.blush? `<ellipse cx="118" cy="346" rx="13" ry="7" fill="#e98a8a" opacity="${0.35*E.blush}"/><ellipse cx="182" cy="346" rx="13" ry="7" fill="#e98a8a" opacity="${0.35*E.blush}"/>`:'';

  /* hair shapes differ per character for identity */
  const hair = HAIR[id] ? HAIR[id](p) : HAIR.default(p);
  const access = ACCESS[id] ? ACCESS[id](p) : '';
  const cloth = CLOTH[id] ? CLOTH[id](p) : CLOTH.default(p);

  return `<svg viewBox="0 195 300 360" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">
    <defs>
      <linearGradient id="cl_${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${p.cloth}"/><stop offset="1" stop-color="${p.cloth2}"/>
      </linearGradient>
      <radialGradient id="sk_${id}" cx="0.5" cy="0.4" r="0.7">
        <stop offset="0" stop-color="${p.skin}"/><stop offset="1" stop-color="${p.skin2}"/>
      </radialGradient>
      <linearGradient id="hr_${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${p.hair2}"/><stop offset="1" stop-color="${p.hair}"/>
      </linearGradient>
    </defs>
    <!-- body / clothes -->
    ${cloth}
    <!-- neck -->
    <path d="M132 312 q18 14 36 0 l4 28 q-22 16 -44 0z" fill="url(#sk_${id})"/>
    <!-- head -->
    <path d="M150 250
      q-46 0 -52 52
      q-4 36 14 60
      q14 20 38 20
      q24 0 38 -20
      q18 -24 14 -60
      q-6 -52 -52 -52z" fill="url(#sk_${id})" stroke="${p.skin2}" stroke-width="1"/>
    <!-- ears -->
    <ellipse cx="98" cy="350" rx="9" ry="13" fill="url(#sk_${id})"/>
    <ellipse cx="202" cy="350" rx="9" ry="13" fill="url(#sk_${id})"/>
    ${blush}
    <!-- eyes -->
    <g>
      <ellipse cx="123" cy="338" rx="10" ry="${eyeRy}" fill="#fff"/>
      <ellipse cx="177" cy="338" rx="10" ry="${eyeRy}" fill="#fff"/>
      <circle cx="124" cy="339" r="${4.6}" fill="#2a2330"/>
      <circle cx="178" cy="339" r="${4.6}" fill="#2a2330"/>
      <circle cx="125.6" cy="337.4" r="1.5" fill="#fff"/>
      <circle cx="179.6" cy="337.4" r="1.5" fill="#fff"/>
    </g>
    <!-- brows -->
    <path d="M110 ${320+browDy} q13 ${-6-browDy*.4} 28 0" stroke="${p.hair}" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M162 ${320+browDy} q15 ${-6-browDy*.4} 28 0" stroke="${p.hair}" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <!-- nose -->

/* show character at slot with expr; manage caching */

/* =========================================================================
   4. AUDIO (WebAudio ambient + sfx)
   ========================================================================= */
const Audio_={
  ctx:null,on:false,master:null,droneNodes:[],
  init(){ if(this.ctx)return; try{
    this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    this.master=this.ctx.createGain(); this.master.gain.value=0.0; this.master.connect(this.ctx.destination);
  }catch(e){} },
  enable(){ this.init(); if(!this.ctx)return; this.ctx.resume&&this.ctx.resume(); this.on=true;
    this.master.gain.linearRampToValueAtTime(0.5,this.ctx.currentTime+0.8); this.startDrone(); },
  disable(){ if(!this.ctx)return; this.on=false; this.master.gain.linearRampToValueAtTime(0,this.ctx.currentTime+0.5); },
  startDrone(){ if(!this.ctx||this.droneNodes.length)return;
    const base=[110,164.81,220]; // A minor-ish pad
    base.forEach((f,i)=>{ const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type=i? 'sine':'triangle'; o.frequency.value=f; g.gain.value=0.0; o.connect(g); g.connect(this.master); o.start();
      g.gain.linearRampToValueAtTime(0.08/(i+1),this.ctx.currentTime+2);
      // slow LFO
      const lfo=this.ctx.createOscillator(),lg=this.ctx.createGain(); lfo.frequency.value=0.05+i*0.02; lg.gain.value=0.02; lfo.connect(lg); lg.connect(g.gain); lfo.start();
      this.droneNodes.push(o,lfo);
    });
  },
  setMood(m){ if(!this.ctx||!this.on)return;
    const t=this.ctx.currentTime;
    if(m==='tense') this.master.gain.linearRampToValueAtTime(0.35,t+1);
    else this.master.gain.linearRampToValueAtTime(0.5,t+1);
  },
  blip(freq,dur,type){ if(!this.ctx||!this.on)return; const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'square'; o.frequency.value=freq; g.gain.value=0.0; o.connect(g); g.connect(this.master);
    const t=this.ctx.currentTime; g.gain.linearRampToValueAtTime(0.12,t+0.005); g.gain.exponentialRampToValueAtTime(0.001,t+(dur||0.08));
    o.start(t); o.stop(t+(dur||0.08)+0.02); },
  type(){ this.blip(420+Math.random()*60,0.03,'sine'); },
  select(){ this.blip(660,0.09,'triangle'); setTimeout(()=>this.blip(880,0.09,'triangle'),70); },
  objection(){ if(!this.ctx||!this.on)return; this.blip(180,0.18,'sawtooth'); setTimeout(()=>this.blip(120,0.3,'sawtooth'),120); },
  ding(){ this.blip(990,0.4,'sine'); }
};

/* render text with simple markup: *em* and _narr_ handled at end */
function renderTyped(len){
  const sub=fullText.slice(0,len);

  html=html.replace(/\*([^*]+)\*/g,'<span class="em">$1</span>');
  txtEl.innerHTML=html+(len<fullText.length?'<span id="cursor">▌</span>':'');

function typeText(text,cb){
  clearInterval(typeTimer);
  fullText=text; shownLen=0; onDone=cb; typing=true;
  $('#advHint').classList.remove('on');
  const speed= State.skip?2: 22;
  typeTimer=setInterval(()=>{
    if(State.skip){ shownLen=fullText.length; }
    else{ shownLen+=1; if(shownLen%2===0)Audio_.type(); }
    renderTyped(shownLen);
    if(shownLen>=fullText.length){
      clearInterval(typeTimer); typing=false;
      txtEl.innerHTML=txtEl.innerHTML.replace(/<span id="cursor">▌<\/span>/,'');
      $('#advHint').classList.add('on');
      if(onDone)onDone();
      maybeAuto();
    }
  },speed);
}
function finishTyping(){
  if(!typing)return;
  clearInterval(typeTimer); typing=false; shownLen=fullText.length;
  renderTyped(shownLen);
  txtEl.innerHTML=txtEl.innerHTML.replace(/<span id="cursor">▌<\/span>/,'');
  $('#advHint').classList.add('on');
  if(onDone)onDone();
  maybeAuto();
}

let autoTimer=null;
function maybeAuto(){

/* =========================================================================
   7. SCRIPT ENGINE
   A "node" is an object in SCENES keyed by id.
   Types:
     line:   {bg?,chars?[{slot,id,expr}],s:speakerId,t:text, next:id|fn}
     do:     {do:fn, next}
     choice: {prompt?, choices:[{label, to, if?, set?, evi?, trust?, class?}]}
     fade:   {fadeTo:id}   (fade out, run, fade in)
     end:    {end:title}
   We compile into a runner.
   ========================================================================= */

let choiceOpen=false;
let pending=null; // node currently displayed (for advance)

function go(id){
  const node=SCENES[id];
  if(!node){ console.error('missing node',id); return; }
  State.cur=id;
  run(node);
}

function resolveNext(n){
  if(typeof n==='function') return n(State);
  return n;
}

function run(node){
  // hide choices
  closeChoices();

  // background
  if(node.bg) setBG(node.bg);
  if(node.chap!==undefined){ $('#chapTitle').textContent=node.chap; }

  // characters config
  if(node.clear) hideAllChars();
  if(node.chars){
    // remove slots not present? keep simple: set listed
    node.chars.forEach(c=>{
      if(c.hide){ hideChar(c.slot); }
      else showChar(c.slot,c.id,c.expr||'neutral');
    });
  }

  if(node.do){ node.do(State); }

  if(node.set){ Object.assign(State.flags,node.set); }
  if(node.evi){ node.evi.forEach(addEvi); }
  if(node.trust!==undefined){ changeTrust(node.trust); }
  if(node.mood){ Audio_.setMood(node.mood); }

  // typed line
  if(node.t!==undefined){
    pending=node;
    setSpeaker(node.s||null);
    setName(node.s||'');
    if(node.s==='objection') Audio_.objection();
    const textStr = (typeof node.t==='function') ? node.t(State) : node.t;
    typeText(textStr,()=>{
      // push to backlog
      pushLog(node.s||'', textStr);
    });
    return;
  }

  // choice
  if(node.choices){
    showChoices(node);
    return;
  }

  // pure transitions
  if(node.fadeTo){
    (async()=>{ await fadeOut(); go(node.fadeTo); await fadeIn(); })();
    return;
  }
  if(node.end){
    showEnd(node.end);
    return;
  }
  if(node.next!==undefined){ go(resolveNext(node.next)); return; }
}

function advance(){
  if(choiceOpen) return;
  if(typing){ finishTyping(); return; }
  if(!pending) return;
  const node=pending;
  if(node.fadeNext){
    (async()=>{ await fadeOut(); const nx=resolveNext(node.next); pending=null; go(nx); await fadeIn(); })();
    return;
  }
  if(node.flashNext){ flash(); }
  if(node.next!==undefined){ const nx=resolveNext(node.next); pending=null; go(nx); }
}

    {label:'"수면제는 당신 처방이더군요."', to:'min_a_pill', if:s=>!s.flags.min_pill, evi:['pill'], class:'evi'},
    {label:'신문을 마친다', to:'min_done', class:'evi'}
  ]});
S('min_done',{chars:[{slot:'C',id:'min',expr:'sad'},{slot:'L',id:'yuna',expr:'neutral'}],
  s:'yuna',t:'(민서연. 슬퍼 보이지만 *유언장*이라는 묵직한 동기가 있다.\n게다가 수면제를 故人에게 건넸다. …눈물이 진짜인지부터 의심해야 한다.)',
  set:{doneMin:true}, trust:3, next:'trial_hub'});

/* ============ WITNESS 3: 강 형사 ============ */
S('w_kang_intro',{bg:'court_wide',clear:true,chap:'증언 · 강 형사',
  chars:[{slot:'C',id:'kang',expr:'neutral'},{slot:'L',id:'yuna',expr:'neutral'}],
  s:'kang',t:'강도윤. 강력계 형사입니다.\n눈 때문에 신고 접수가 늦었지만, 새벽에 헬기로 가장 먼저 현장에 들어갔습니다.',next:'kang1'});
S('kang1',{chars:[{slot:'C',id:'kang',expr:'talk'},{slot:'L',id:'yuna'}],
  s:'kang',t:'시신은 절벽 아래. 머리 외상. 추락사로 보였습니다.\n절벽 난간 근처에서 *피고인의 단추*가 떨어진 채 발견됐고요. 정황은 명백했습니다.',next:'kang2'});
S('kang2',{chars:[{slot:'C',id:'kang',expr:'neutral'},{slot:'L',id:'yuna',expr:'think'}],
  s:'yuna',t:'(단추. 결정적이라는 듯 말하지만…\n*붉은 목도리*가 난간에 걸려 있었다는 보고는, 형사가 언급하지 않았다.)',evi:['scarf'],next:'kang_q1'});
S('kang_q1',{chars:[{slot:'C',id:'kang',expr:'neutral'},{slot:'L',id:'yuna'}],
  prompt:'강 형사에게 무엇을 물을까?',
  choices:[
    {label:'"난간에 걸려 있던 붉은 목도리는 누구 것입니까?"', to:'kang_a_scarf', set:{kang_scarf:true}, evi:['scarf'], class:'evi'},
    {label:'"현장에 가장 먼저 들어갔다… 정말 \'가장\'입니까?"', to:'kang_a_first', set:{kang_first:true}},
    {label:'"서재가 안에서 잠겨 있었다는 게 사실입니까?"', to:'kang_a_locked', set:{kang_locked:true}, evi:['key']},
  ]});
S('kang_a_scarf',{chars:[{slot:'C',id:'kang',expr:'sweat'},{slot:'L',id:'yuna'}],
  s:'kang',t:'목도리…요? 아, 그런 게 있었던가요.\n현장이 워낙 어지러워서. 중요한 건 단추였고, 목도리는… 따로 감식하진 않았습니다.',next:'kang_a_scarf2'});
S('kang_a_scarf2',{chars:[{slot:'C',id:'kang',expr:'neutral'},{slot:'L',id:'yuna',expr:'angry'}],
  s:'yuna',t:'(*감식하지 않았다.* 결정적 증거가 될 수도 있는데 일부러 비켜갔다.\n이 형사는 피고인이 범인이기를 *바라고 있다*. 왜?)',set:{kang_bias:true},next:'kang_back'});
S('kang_a_first',{chars:[{slot:'C',id:'kang',expr:'think'},{slot:'L',id:'yuna'}],
  s:'kang',t:'…헬기로는 제가 가장 먼저 맞습니다.\n다만 그 *전날 밤*, 폭설 전에 잠깐… 사적인 일로 산장 근처에 들른 적은 있습니다. 사건과는 무관해요.',next:'kang_a_first2'});
S('kang_a_first2',{chars:[{slot:'C',id:'kang',expr:'sweat'},{slot:'L',id:'yuna',expr:'shock'}],
  s:'yuna',t:'(사건 전날 밤, 산장 근처에 형사가 있었다?\n수사관이 *피해자와 사적인 접점*이 있다면 — 이건 단순한 편향이 아닐 수도 있다.)',set:{kang_present:true},evi:['phone'],next:'kang_back'});
S('kang_a_locked',{chars:[{slot:'C',id:'kang',expr:'neutral'},{slot:'L',id:'yuna'}],
  s:'kang',t:'서재 말입니까. 예, 문은 안에서 잠겨 있었습니다. 열쇠는 두 개.\n하나는 어르신이, 다른 하나는… 관리인 오씨가 가지고 있었지요.',next:'kang_a_locked2'});
S('kang_a_locked2',{chars:[{slot:'C',id:'kang',expr:'neutral'},{slot:'L',id:'yuna',expr:'think'}],
  s:'yuna',t:'(서재 열쇠는 둘. 어르신과 *관리인 오씨*.\n그런데 오씨는 그날 밤 줄곧 거실에 있었다고 했다. 정말 그랬을까?)',evi:['key'],next:'kang_back'});
S('kang_back',{chars:[{slot:'C',id:'kang',expr:'neutral'},{slot:'L',id:'yuna'}],
  prompt:'더 물을까?',
  choices:[
    {label:'"붉은 목도리는 누구 것입니까?"', to:'kang_a_scarf', if:s=>!s.flags.kang_scarf, evi:['scarf'], class:'evi'},
    {label:'"정말 \'가장\' 먼저였습니까?"', to:'kang_a_first', if:s=>!s.flags.kang_first},
    {label:'"서재 열쇠는 몇 개입니까?"', to:'kang_a_locked', if:s=>!s.flags.kang_locked},
    {label:'신문을 마친다', to:'kang_done', class:'evi'}
  ]});
S('kang_done',{chars:[{slot:'C',id:'kang',expr:'neutral'},{slot:'L',id:'yuna',expr:'think'}],
  s:'yuna',t:'(강 형사. 노골적인 편향, 감식 누락, 그리고 사건 전날 밤의 행적.\n이 사람은 *증인이 아니라 용의자*일지도 모른다.)',
  set:{doneKang:true}, trust:5, next:'trial_hub'});

/* ============ WITNESS 4: 서지호 (재신문) ============ */
S('w_seo_intro',{bg:'court_wide',clear:true,chap:'증언 · 서지호',
  chars:[{slot:'C',id:'seo',expr:'sad'},{slot:'L',id:'yuna',expr:'neutral'}],
  s:'seo',t:'…변호사님. 솔직히 말할게요.\n백부님과 다툰 건 맞아요. 그분이 제 그림을 *"쓰레기"*라고 하셨거든요.',next:'seo1'});
S('seo1',{chars:[{slot:'C',id:'seo',expr:'sad'},{slot:'L',id:'yuna'}],
  s:'seo',t:'화가 나서 뛰쳐나왔어요. 찬바람이라도 쐬려고 절벽 쪽으로 걸었죠.\n그런데… 거기서 *이미 쓰러져 계신* 백부님을 봤어요. 제가 도착했을 땐 늦었어요.',next:'seo2'});
S('seo2',{chars:[{slot:'C',id:'seo',expr:'cry'},{slot:'L',id:'yuna',expr:'think'}],
  s:'yuna',t:'(이미 쓰러져 있었다고? 그렇다면 다투고 나서 백부가 절벽까지 간 시간이 너무 짧다.\n누군가 *먼저* 그를 절벽으로 데려갔다는 뜻.)',next:'seo_q1'});
S('seo_q1',{chars:[{slot:'C',id:'seo',expr:'neutral'},{slot:'L',id:'yuna'}],
  prompt:'서지호에게 무엇을 물을까?',
  choices:[
    {label:'"단추가 난간에서 발견됐어요. 설명할 수 있나요?"', to:'seo_a_button', set:{seo_button:true}},
    {label:'"백부님이 왜 당신을 산장에 불렀죠?"', to:'seo_a_call', set:{seo_call:true}},
    {label:'"당신… 사실은 그 집 \'조카\'가 아니죠?"', to:'seo_a_secret', set:{seo_secret:true}, class:'danger'},
  ]});
S('seo_a_button',{chars:[{slot:'C',id:'seo',expr:'shock'},{slot:'L',id:'yuna'}],
  s:'seo',t:'단추요? 제 코트… 분명 다 멀쩡한데. 난간에서 떨어졌다니 말도 안 돼요.\n…혹시 누가, 일부러 거기 둔 게 아닐까요?',next:'seo_a_button2'});
S('seo_a_button2',{chars:[{slot:'C',id:'seo',expr:'sad'},{slot:'L',id:'yuna',expr:'think'}],
  s:'yuna',t:'(*심어진 증거*. 누군가 서지호를 범인으로 만들려 했다.\n강 형사가 단추만 강조하고 목도리는 묻은 것과… 연결된다.)',set:{seo_framed:true},next:'seo_back'});
S('seo_a_call',{chars:[{slot:'C',id:'seo',expr:'sad'},{slot:'L',id:'yuna'}],
  s:'seo',t:'백부님이… *유언장을 다시 쓰겠다*고 절 부르셨어요.\n저한테 전부 물려주겠다고. 그게… 다툼의 진짜 이유였어요.',next:'seo_a_call2'});
S('seo_a_call2',{chars:[{slot:'C',id:'seo',expr:'think'},{slot:'L',id:'yuna',expr:'shock'}],
  s:'yuna',t:'(잠깐. 민서연은 유언장이 *자기에게* 유리하게 바뀐다 했다.\n서지호는 *자기에게* 유리하게 바뀐다 한다. 둘 중 하나는 거짓이거나 — *둘 다 속았다*.)',set:{will_conflict:true},evi:['will'],next:'seo_back'});
S('seo_a_secret',{chars:[{slot:'C',id:'seo',expr:'shock'},{slot:'L',id:'yuna',expr:'smug'}],
  s:'seo',t:'…어떻게, 그걸.\n네. 저는 친조카가 아니에요. 백부님이 *오래전 입양*하려다 끝내 호적에 못 올린, 그런 아이예요.',next:'seo_a_secret2'});
S('seo_a_secret2',{chars:[{slot:'C',id:'seo',expr:'sad'},{slot:'L',id:'yuna',expr:'think'}],
  s:'yuna',t:'(피 한 방울 안 섞인 사이. 그런데도 유산을 물려주려 했다…\n저 *찢긴 가족사진*. 지워진 얼굴은 누구의 것일까.)',set:{seo_adopted:true},evi:['photo'],next:'seo_back'});
S('seo_back',{chars:[{slot:'C',id:'seo',expr:'neutral'},{slot:'L',id:'yuna'}],
  prompt:'더 물을까?',
  choices:[
    {label:'"난간의 단추를 설명할 수 있나요?"', to:'seo_a_button', if:s=>!s.flags.seo_button},
    {label:'"백부님이 왜 당신을 불렀죠?"', to:'seo_a_call', if:s=>!s.flags.seo_call},
    {label:'"당신, 친조카가 아니죠?"', to:'seo_a_secret', if:s=>!s.flags.seo_secret, class:'danger'},
    {label:'신문을 마친다', to:'seo_done', class:'evi'}
  ]});
S('seo_done',{chars:[{slot:'C',id:'seo',expr:'sad'},{slot:'L',id:'yuna',expr:'neutral'}],
  s:'yuna',t:'(서지호. 거짓말하는 것 같진 않다. 오히려 *함정에 빠진* 사람의 얼굴이다.\n유언장의 모순 — 이게 사건의 심장이다.)',
  set:{doneSeo:true}, trust:6, next:'trial_hub'});

/* ============ ACT 2: 모순의 교차 ============ */
S('act2_intro',{bg:'court_wide',clear:true,chap:'2부 · 모순의 교차',mood:'tense',
  chars:[{slot:'L',id:'yuna',expr:'think'}],
  s:'yuna',t:'(네 증언을 손에 쥐었다. 이제 *겹쳐* 본다.\n어디가 어긋나는가. 어긋나는 곳에 거짓말쟁이가 서 있다.)',next:'act2_b'});
S('act2_b',{chars:[{slot:'L',id:'yuna',expr:'neutral'}],
  s:'narr',t:'― 변호인이 자리에서 일어섰다. 방청석이 술렁였다.',next:'act2_c'});
S('act2_c',{chars:[{slot:'L',id:'yuna',expr:'neutral'},{slot:'R',id:'ha',expr:'smug'}],
  s:'ha',t:'변호인, 무얼 하려는 겁니까. 증거는 이미 충분합니다.\n피고인의 단추, 다툼, 동기. 더 들을 게 있습니까?',next:'act2_pick'});
S('act2_pick',{chars:[{slot:'L',id:'yuna',expr:'angry'},{slot:'R',id:'ha',expr:'neutral'}],
  prompt:'― 어떤 모순부터 파고들 것인가? (선택이 진실에 다가가는 길을 가른다)',
  choices:[
    {label:'유언장의 모순: 서지호와 민서연, 둘 다 "내게 유리하다"고 했다', to:'cx_will', class:'evi', tag:'핵심'},
    {label:'시간의 모순: 관리인 11시, 민서연 11시 10분, 멈춘 시계 11시 14분', to:'cx_time', class:'evi', tag:'핵심'},
    {label:'형사의 모순: 목도리를 감식하지 않았고, 전날 밤 산장에 있었다', to:'cx_kang', class:'danger', tag:'핵심'},
  ]});

/* --- 모순 A: 유언장 --- */
S('cx_will',{chars:[{slot:'L',id:'yuna',expr:'talk'}],
  s:'yuna',t:'재판장님. 이상한 점이 있습니다.\n민서연 증인은 유언장이 *자신에게* 넘어온다 했고, 피고인은 *자신에게* 넘어온다 했습니다.',next:'cx_will2'});
S('cx_will2',{chars:[{slot:'L',id:'yuna',expr:'angry'},{slot:'C',id:'judge',expr:'neutral'}],
  s:'yuna',t:'한 장의 유언장이 두 사람에게 동시에 유리할 수는 없습니다.\n*누군가는 거짓을 말하고 있거나* — 아니면 두 사람 모두, 가짜 약속에 놀아난 겁니다.',evi:['will'],next:'cx_will3'});
S('cx_will3',{chars:[{slot:'C',id:'judge',expr:'think'},{slot:'L',id:'yuna'}],
  s:'judge',t:'…흥미롭군요. 변호인, 그렇다면 묻겠습니다.\n그 거짓 약속을 *누가* 흘렸다고 보십니까?',next:'cx_will_q'});
S('cx_will_q',{chars:[{slot:'C',id:'judge',expr:'neutral'},{slot:'L',id:'yuna',expr:'think'}],
  prompt:'유언장의 거짓 약속을 흘릴 수 있었던 사람은?',
  choices:[
    {label:'유언장을 직접 본 사람 — 서재 열쇠를 가진 "관리인 오씨"', to:'cx_will_oh', trust:8, set:{ins_will:true}},
    {label:'故人과 가장 가까웠던 "민서연" 본인의 자작극', to:'cx_will_min', trust:-4},
    {label:'아직 모르겠다 — 다른 모순을 먼저 본다', to:'act2_pick2'},
  ]});
S('cx_will_oh',{chars:[{slot:'L',id:'yuna',expr:'smug'}],
  s:'yuna',t:'서재 열쇠는 두 개. 하나는 故人, 다른 하나는 *관리인 오씨*.\n유언장을 미리 들여다볼 수 있었던 건 오씨뿐입니다. 그가 양쪽에 다른 말을 흘렸다면?',next:'cx_will_oh2'});
S('cx_will_oh2',{chars:[{slot:'C',id:'oh',expr:'sweat'},{slot:'L',id:'yuna',expr:'angry'}],
  s:'oh',t:'무, 무슨 말씀을! 제가 왜 그런 짓을!\n저는… 저는 그냥, 시키는 대로 살아온 사람입니다!',next:'cx_will_oh3'});
S('cx_will_oh3',{chars:[{slot:'C',id:'oh',expr:'sad'},{slot:'L',id:'yuna',expr:'think'}],
  s:'yuna',t:'(흔들린다. 하지만 *진범의 흔들림*인지, *겁먹은 목격자의 흔들림*인지는 아직 모른다.\n조각이 하나 더 필요하다.)',set:{ins_will:true},next:'act2_pick2'});
S('cx_will_min',{chars:[{slot:'C',id:'min',expr:'cry'},{slot:'L',id:'yuna'}],
  s:'min',t:'제가 자작극을 했다고요?! 어떻게 그런 말씀을…\n저는 선생님을 진심으로 존경했어요!',next:'cx_will_min2'});
S('cx_will_min2',{chars:[{slot:'C',id:'min',expr:'sad'},{slot:'L',id:'yuna',expr:'sweat'}],
  s:'yuna',t:'(너무 성급했다. 증거 없이 던진 추궁은 *역효과*다.\n방청석의 눈빛이 차가워졌다. 다른 길을 찾아야 한다.)',next:'act2_pick2'});

/* --- 모순 B: 시간 --- */
S('cx_time',{chars:[{slot:'L',id:'yuna',expr:'talk'}],
  s:'yuna',t:'시간을 맞춰보겠습니다.\n관리인은 *11시*, 민서연은 *11시 10분*에 다툼을 들었다 했습니다. 그리고 거실 괘종시계는 *11시 14분*에 멈춰 있었습니다.',evi:['clock'],next:'cx_time2'});
S('cx_time2',{chars:[{slot:'L',id:'yuna',expr:'angry'},{slot:'C',id:'judge',expr:'think'}],
  s:'yuna',t:'누군가 시계를 *11시 14분에 멈춰* 사건 시각을 고정하려 했습니다.\n하지만 그 시각, 피고인은 이미 절벽에서 쓰러진 故人을 발견한 뒤였습니다. *알리바이의 틈*입니다.',next:'cx_time_q'});
S('cx_time_q',{chars:[{slot:'C',id:'judge',expr:'neutral'},{slot:'L',id:'yuna',expr:'think'}],
  prompt:'거실 괘종시계를 멈출 수 있었던 사람은?',
  choices:[
    {label:'그 시각 거실에 "혼자" 있었다던 관리인 오씨', to:'cx_time_oh', trust:7, set:{ins_time:true}},
    {label:'현장을 정리한 강 형사 — 시계는 사후에 멈췄다', to:'cx_time_kang', trust:5, set:{ins_kang_time:true}},
    {label:'아직 모르겠다 — 다른 모순을 먼저 본다', to:'act2_pick2'},
  ]});
S('cx_time_oh',{chars:[{slot:'C',id:'oh',expr:'sweat'},{slot:'L',id:'yuna',expr:'smug'}],
  s:'yuna',t:'오씨, 당신은 그 시각 거실에 혼자였다고 했습니다.\n시계는 바로 그 거실에 있었고요. 멈출 수 있었던 건 당신뿐입니다.',next:'cx_time_oh2'});
S('cx_time_oh2',{chars:[{slot:'C',id:'oh',expr:'shock'},{slot:'L',id:'yuna',expr:'think'}],
  s:'oh',t:'…저는, 저는 그냥 장작만!\n시계는 원래 자주 멈췄어요! 낡았으니까!',next:'cx_time_oh3'});

S('cx_time_kang',{chars:[{slot:'C',id:'kang',expr:'sweat'},{slot:'L',id:'yuna',expr:'angry'}],

S('cx_time_kang3',{chars:[{slot:'C',id:'kang',expr:'neutral'},{slot:'L',id:'yuna',expr:'think'}],

S('cx_kang',{chars:[{slot:'L',id:'yuna',expr:'angry'},{slot:'C',id:'kang',expr:'neutral'}],
  s:'yuna',t:'강 형사. 당신은 난간의 *붉은 목도리*를 감식하지 않았습니다.\n그리고 *사건 전날 밤*, 산장 근처에 있었다고 스스로 인정했죠.',evi:['scarf','phone'],next:'cx_kang2'});
S('cx_kang2',{chars:[{slot:'C',id:'kang',expr:'sweat'},{slot:'L',id:'yuna',expr:'smug'}],
  s:'yuna',t:'결정적일 수 있는 증거를 묻고, 단추 하나만 부각시켰습니다.\n수사관이 결론을 정해두고 *증거를 골라낸* 겁니다. 왜죠?',next:'cx_kang3'});
S('cx_kang3',{chars:[{slot:'C',id:'kang',expr:'angry'},{slot:'L',id:'yuna',expr:'neutral'}],
  s:'kang',t:'…그 목도리는, 사건과 무관해서 뺀 겁니다.\n전날 밤 일은… 개인적인 빚 문제였소. 故人에게 돈을 빌렸을 뿐이오.',next:'cx_kang4'});
S('cx_kang4',{chars:[{slot:'C',id:'kang',expr:'sweat'},{slot:'L',id:'yuna',expr:'shock'}],
  s:'yuna',t:'(빚! 강 형사도 故人에게 *돈을 빌렸다*. 또 하나의 동기.\n관리인의 밀린 월급, 민서연의 유언장, 형사의 빚 — *모두가 故人의 죽음으로 득을 본다*.)',set:{kang_debt:true},evi:['note'],next:'cx_kang_q'});
S('cx_kang_q',{chars:[{slot:'C',id:'kang',expr:'neutral'},{slot:'L',id:'yuna',expr:'think'}],
  prompt:'그 붉은 목도리는 — 누구의 것이었을까?',

    {label:'강 형사가 떨어뜨린 것 (전날 밤의 흔적)', to:'cx_scarf_kang', trust:4, set:{ins_scarf:true,scarf_kang:true}},
    {label:'아직 모르겠다 — 종합 추리로 넘어간다', to:'act2_pick2'},
  ]});
S('cx_scarf_min',{chars:[{slot:'C',id:'min',expr:'shock'},{slot:'L',id:'yuna',expr:'smug'}],
  s:'yuna',t:'난간의 붉은 목도리. 민서연 증인, 당신이 그날 두르고 있던 것과 같은 색입니다.\n올이 누군가의 단추에 뜯겨 있었습니다 — *피고인의 코트가 아니라, 다른 누군가의 옷*에.',next:'cx_scarf_min2'});
S('cx_scarf_min2',{chars:[{slot:'C',id:'min',expr:'cry'},{slot:'L',id:'yuna',expr:'think'}],
  s:'min',t:'그, 그건 제 목도리가 맞아요. 하지만 절벽엔 간 적 없어요!\n바람에 날아갔을 수도 있잖아요…!',next:'cx_scarf_min3'});
S('cx_scarf_min3',{chars:[{slot:'C',id:'min',expr:'sad'},{slot:'L',id:'yuna',expr:'think'}],
  s:'yuna',t:'(목도리는 민서연의 것. 그러나 "바람"이라는 변명도 완전히 깨지진 않는다.\n*누구의 단추에 뜯겼는지* — 그 마지막 못이 필요하다.)',set:{ins_scarf:true},next:'act2_pick2'});
S('cx_scarf_kang',{chars:[{slot:'C',id:'kang',expr:'sweat'},{slot:'L',id:'yuna',expr:'angry'}],

S('cx_scarf_kang2',{chars:[{slot:'C',id:'kang',expr:'angry'},{slot:'L',id:'yuna',expr:'think'}],

S('cx_scarf_kang3',{chars:[{slot:'C',id:'kang',expr:'neutral'},{slot:'L',id:'yuna',expr:'sweat'}],
  s:'yuna',t:'(검은색이라고 받아친다 — 사실일 수도. 색을 헷갈렸다면 내 신뢰가 깎인다.\n섣불렀다. 하지만 형사가 *목도리 색까지 정확히 기억한다*는 것 자체가, 또 이상하다.)',set:{ins_scarf:true},next:'act2_pick2'});

S('act3_gate',{bg:'court_wide',clear:true,chap:'3부 · 지목',mood:'tense',

    if(c===2) return '(두 갈래의 모순을 풀었다. 완벽하진 않지만, 충분히 멀리 왔다.\n…진실의 이름을 부를 시간이다.)';
    return '(아직 풀지 못한 모순이 많다. 손에 쥔 게 약하다.\n그래도 — 더는 미룰 수 없다. 지목해야 한다.)';
  },

S('accuse',{chars:[{slot:'L',id:'yuna',expr:'angry'},{slot:'C',id:'judge',expr:'neutral'}],

  s:'yuna',t:'그날 故人은 유언장을 고쳐, 작품 전부를 *서지호*에게 남기기로 했습니다.\n민서연 당신에게가 *아니라*요. 당신은 그 사실을 알아버렸습니다.',next:'fin_min3'});

S('end_truth_e',{bg:'court_wide',clear:true,chars:[{slot:'C',id:'seo',expr:'cry'},{slot:'L',id:'yuna',expr:'smile'}],

S('end_truth_f',{chars:[{slot:'L',id:'yuna',expr:'smile'},{slot:'C',id:'seo',expr:'smile'}],

S('fin_kang2',{chars:[{slot:'C',id:'kang',expr:'angry'},{slot:'L',id:'yuna',expr:'angry'}],

S('fin_kang3',{chars:[{slot:'C',id:'kang',expr:'smug'},{slot:'L',id:'yuna',expr:'sweat'}],

/* 진범 = 관리인 오씨 (정황 강하나 비정답) */
S('fin_oh',{bg:'court_wide',clear:true,chars:[{slot:'C',id:'oh',expr:'sweat'},{slot:'L',id:'yuna',expr:'angry'}],mood:'tense',
  s:'yuna',t:'재판장님. 저는 *관리인 오씨*를 지목합니다.\n서재 열쇠, 멈춘 시계, 밀린 월급 — 모든 정황이 그를 가리킵니다.',next:'fin_oh2'});
S('fin_oh2',{chars:[{slot:'C',id:'oh',expr:'cry'},{slot:'L',id:'yuna',expr:'neutral'}],
  s:'oh',t:'아닙니다! 아니에요! 제가 시계를 멈춘 건… 사실입니다.\n하지만 그건 살인 때문이 아니라… 부탁받았기 때문입니다!',next:'fin_oh3'});
S('fin_oh3',{chars:[{slot:'C',id:'oh',expr:'sad'},{slot:'L',id:'yuna',expr:'shock'}],
  s:'oh',t:'그날 밤, 한 사람이 제게 사정했어요. "시계를 11시 14분에 맞춰 멈춰달라"고.\n밀린 월급 석 달치를 대신 갚아주겠다며… 저는, 돈에 눈이 멀었습니다.',next:'fin_oh4'});
S('fin_oh4',{chars:[{slot:'C',id:'oh',expr:'cry'},{slot:'L',id:'yuna',expr:'think'}],
  s:'yuna',t:'(오씨는 진범이 아니라 *매수된 손*이었다. 시간을 조작한 건 알리바이를 위해서.\n그렇다면 — 11시 14분에 알리바이가 필요했던 자가 진범이다.)',set:{oh_confessed:true},next:'fin_oh_q'});
S('fin_oh_q',{chars:[{slot:'C',id:'oh',expr:'sad'},{slot:'L',id:'yuna',expr:'angry'}],
  prompt:'"누가 당신에게 시계를 멈추라 했습니까?" ― 오씨의 입에서 나올 이름은',
  choices:[
    {label:'오씨가 가리키는 사람을 끝까지 캐묻는다', to:'fin_oh_name'},
    {label:'여기서 멈추고 "공범" 선에서 마무리한다', to:'deal_end'},
  ]});
S('fin_oh_name',{chars:[{slot:'C',id:'oh',expr:'cry'},{slot:'L',id:'yuna',expr:'neutral'}],
  s:'oh',t:'…그날 밤, 붉은 목도리를 두른 *민서연 선생*이었습니다.\n그분이… 그분이 제게 부탁했어요. 정말입니다!',next:'fin_oh_redirect'});
S('fin_oh_redirect',{chars:[{slot:'L',id:'yuna',expr:'angry'},{slot:'C',id:'judge',expr:'neutral'}],
  set:{ins_scarf:true},
  prompt:'― 관리인의 자백이 진범을 가리킨다',
  choices:[
    {label:'"진범은 — 민서연입니다"', to:'fin_min', class:'evi'},
    {label:'증거가 부족하다 — 여기서 멈춘다', to:'standoff_end'},
  ]});

/* 서지호 지목 = 오심 엔딩 */
S('fin_seo',{bg:'court_wide',clear:true,chars:[{slot:'C',id:'seo',expr:'shock'},{slot:'L',id:'yuna',expr:'sad'}],mood:'tense',
  s:'yuna',t:'…재판장님. 변호인으로서, 저는… *피고인의 유죄를* 다툴 근거를 찾지 못했습니다.',next:'fin_seo2'});
S('fin_seo2',{chars:[{slot:'C',id:'seo',expr:'cry'},{slot:'L',id:'yuna',expr:'sad'}],
  s:'seo',t:'변호사님?! 어떻게… 당신마저!\n저는 안 그랬어요! 정말로, 정말로 아니란 말이에요!',next:'fin_seo3'});
S('fin_seo3',{chars:[{slot:'C',id:'judge',expr:'neutral'}],bg:'court',clear:true,
  s:'judge',t:'…변호인의 포기는 유감입니다.\n증거에 따라, 피고인 서지호에게 *유죄*를 선고합니다.',next:'fin_seo4',flashNext:true});
S('fin_seo4',{bg:'black',clear:true,
  s:'narr',t:'쇠창살 너머, 한 청년의 눈빛이 꺼져갔다.\n그리고 방청석 어딘가에서 — 붉은 목도리를 고쳐 매는 손이 있었다.',next:'framed_end'});
S('framed_end',{end:'framed'});

/* standoff */
S('fin_standoff',{bg:'court_wide',clear:true,chars:[{slot:'L',id:'yuna',expr:'think'},{slot:'C',id:'judge',expr:'neutral'}],mood:'tense',
  s:'yuna',t:'재판장님. 검찰의 증거는 정황뿐입니다.\n*합리적 의심*이 남는 한, 피고인을 유죄로 단정할 수 없습니다.',next:'fin_standoff2'});
S('fin_standoff2',{chars:[{slot:'C',id:'judge',expr:'think'},{slot:'L',id:'yuna'}],
  s:'judge',t:'…일리 있습니다. 그러나 진범을 밝히지 못한 변론이기도 합니다.\n무죄 추정의 원칙에 따라 — 판결을 유보합니다.',next:'standoff_end'});
S('standoff_end',{end:'standoff'});

/* deal */
S('deal_end',{bg:'court_wide',clear:true,chars:[{slot:'L',id:'yuna',expr:'sad'}],
  s:'yuna',t:'(완전한 진실 대신, 한 조각의 자백을 얻었다.\n서지호는 풀려나겠지만 — 진범의 이름은 끝내 부르지 못했다.)',next:'deal_end2'});
S('deal_end2',{chars:[{slot:'C',id:'judge',expr:'neutral'},{slot:'L',id:'yuna',expr:'sad'}],
  s:'judge',t:'증인의 위증과 은폐가 드러났으니, 피고인의 혐의는 무죄로 봅니다.\n다만 故人을 죽음에 이르게 한 자는… 다음 수사로 넘기겠습니다.',next:'deal_end3'});
S('deal_end3',{end:'deal'});

/* =========================================================================
   11. WIRE go() properly (functions above call bare `go`)
   We defined goWrap; make all internal calls route through it by aliasing.
   ========================================================================= */
/* Because run()/advance()/showChoices use the identifier `go`, and `go` is a
   function declaration, we shadow with a final assignment that delegates. */
go = function(id){ goWrap===undefined ? _origGo(id) : goWrap(id); };

/* first-paint safety: ensure title art rendered & meter set */
$('#meterFill').style.width=State.trust+'%';
$('#btnCont').style.display = hasSave()? '' : 'none';

/* Allow stage background click (outside textbox) to also advance when no choice */
$('#sceneLayer').addEventListener('click',()=>{ if(!choiceOpen && $('#title').classList.contains('hide')){ Audio_.init(); advance(); }});

/* keyboard number keys for choices */
document.addEventListener('keydown',e=>{
  if(!choiceOpen)return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=9){ const btns=$('#choices').querySelectorAll('.choice'); if(btns[n-1])btns[n-1].click(); }
});

/* mark first paint done for self-check */
window.State=State;
window.__VN_READY__=true;
</script>
</body>
</html>
