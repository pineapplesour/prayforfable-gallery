<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>구중심처 · 九重深處 — 조선 궁중 암투 비주얼노벨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1410; --paper:#efe6d2; --gold:#c9a24a; --gold2:#e7c97a;
  --red:#8c1f28; --red2:#b6303a; --jade:#3c6b5c; --night:#10131f;
  --silk:#f4ecd8; --shadow:rgba(10,7,4,.55);
  --box:rgba(22,16,12,.86); --boxedge:rgba(201,162,74,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#000;font-family:'Gowun Batang','Nanum Myeongjo',serif;color:var(--paper)}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05060a}
#stage{position:relative;width:100%;height:100%;max-width:none;overflow:hidden;background:#05060a}

/* layers */
#bgLayer,#fxLayer,#charLayer{position:absolute;inset:0;width:100%;height:100%}
#bgLayer{position:absolute;inset:0}
#bgLayer>svg{position:absolute;inset:0;width:100%;height:100%}
#charLayer{pointer-events:none}
.sprite{position:absolute;bottom:0;height:88%;aspect-ratio:420/760;transform-origin:bottom center;transition:opacity .5s ease, transform .5s ease, filter .4s ease;}
.sprite>svg{display:block;width:100%;height:100%}
.sprite.dim{filter:brightness(.5) saturate(.7)}
.sprite.enter{animation:spIn .55s ease both}
@keyframes spIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* fade between scenes */
#fade{position:absolute;inset:0;background:#05060a;opacity:0;pointer-events:none;transition:opacity .45s ease;z-index:40}
#fade.on{opacity:1}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:41;transition:opacity .25s ease}

/* vignette + dust */
#vig{position:absolute;inset:0;pointer-events:none;z-index:20;
  background:radial-gradient(120% 90% at 50% 38%, transparent 40%, rgba(0,0,0,.30) 78%, rgba(0,0,0,.62) 100%)}

/* dialogue box */
#dlg{position:absolute;left:0;right:0;bottom:0;z-index:30;padding:0 4% 3.2vh;display:flex;flex-direction:column;align-items:center;cursor:pointer}
#dlgInner{position:relative;width:100%;max-width:1080px;background:var(--box);
  border:1px solid var(--boxedge);border-radius:14px;
  box-shadow:0 -6px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(231,201,122,.10);
  padding:22px 30px 26px;backdrop-filter:blur(2px)}
#dlgInner::before{content:"";position:absolute;left:14px;top:14px;right:14px;bottom:14px;
  border:1px solid rgba(201,162,74,.18);border-radius:8px;pointer-events:none}
#nameTag{position:absolute;top:-20px;left:26px;background:linear-gradient(180deg,var(--red2),var(--red));
  color:#fff;font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(15px,2.1vw,21px);
  padding:6px 20px;border-radius:8px;border:1px solid var(--gold2);
  box-shadow:0 3px 12px rgba(0,0,0,.5);letter-spacing:1px;min-width:60px;text-align:center}
#nameTag.empty{display:none}
#text{font-size:clamp(16px,2.45vw,23px);line-height:1.78;min-height:5.2em;color:var(--silk);
  letter-spacing:.2px;text-shadow:0 1px 2px rgba(0,0,0,.6);word-break:keep-all}
#text .nar{color:#cdbf9d;font-style:italic}
#cursor{display:inline-block;width:.55em;color:var(--gold2);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* choices */
#choices{position:absolute;inset:0;z-index:35;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:6%;background:rgba(5,6,10,.45)}
#choices.show{display:flex}
.choice{width:min(80%,640px);background:linear-gradient(180deg,rgba(34,24,18,.94),rgba(20,14,10,.96));
  border:1px solid var(--boxedge);border-radius:10px;padding:16px 22px;color:var(--silk);
  font-size:clamp(15px,2.1vw,20px);text-align:center;cursor:pointer;transition:.18s;
  box-shadow:0 4px 18px rgba(0,0,0,.5);letter-spacing:.3px;position:relative;overflow:hidden}
.choice:hover,.choice:focus{background:linear-gradient(180deg,rgba(140,31,40,.92),rgba(90,18,24,.96));
  border-color:var(--gold2);transform:translateY(-2px);color:#fff}
.choice .pre{color:var(--gold2);margin-right:.4em;font-weight:700}

/* top HUD */
#hud{position:absolute;top:0;right:0;z-index:36;display:flex;gap:8px;padding:12px 14px}
.hbtn{background:rgba(18,13,9,.7);border:1px solid rgba(201,162,74,.4);color:var(--gold2);
  font-family:'Nanum Myeongjo',serif;font-size:13px;padding:7px 12px;border-radius:8px;cursor:pointer;transition:.15s;letter-spacing:1px}
.hbtn:hover{background:var(--red);color:#fff;border-color:var(--gold2)}
.hbtn.act{background:var(--jade);color:#fff}
#chapTag{position:absolute;top:0;left:0;z-index:36;padding:12px 16px;color:rgba(231,201,122,.7);
  font-size:13px;letter-spacing:2px;font-family:'Nanum Myeongjo',serif;text-shadow:0 1px 3px #000}

/* overlays (title, backlog, save) */
.overlay{position:absolute;inset:0;z-index:60;display:none;background:rgba(6,7,12,.94);
  flex-direction:column;align-items:center;justify-content:center;padding:5%;backdrop-filter:blur(3px)}
.overlay.show{display:flex}
#backlog{align-items:stretch;justify-content:flex-start}
#blScroll{width:min(96%,900px);max-height:78vh;overflow-y:auto;margin:8vh auto 0;padding:10px}
.blRow{padding:12px 16px;border-bottom:1px solid rgba(201,162,74,.16);font-size:16px;line-height:1.7;color:#e6dcc4}
.blRow b{color:var(--gold2);font-family:'Nanum Myeongjo',serif;margin-right:.5em}
.ovTitle{font-family:'Nanum Myeongjo',serif;color:var(--gold2);font-size:26px;letter-spacing:6px;margin-bottom:18px}
.ovClose{margin-top:22px}
.slotGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;width:min(96%,760px)}
.slot{background:rgba(26,18,13,.9);border:1px solid var(--boxedge);border-radius:10px;padding:16px;cursor:pointer;transition:.15s}
.slot:hover{border-color:var(--gold2);background:rgba(140,31,40,.4)}
.slot .st{color:var(--gold2);font-weight:700;font-family:'Nanum Myeongjo',serif;margin-bottom:6px}
.slot .sd{font-size:13px;color:#bcae90;line-height:1.5}
.slot.empty .sd{opacity:.5}

/* TITLE screen */
#title{z-index:70}
#title.show{display:flex}
#titleArt{position:absolute;inset:0;z-index:-1}
#titleArt svg{width:100%;height:100%}
.tWrap{text-align:center;animation:fadeUp 1.4s ease both;pointer-events:none}
.tHan{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(54px,12vw,150px);
  color:var(--silk);letter-spacing:.12em;line-height:1;text-shadow:0 6px 30px rgba(0,0,0,.7), 0 0 40px rgba(201,162,74,.25)}
.tSub{font-family:'Nanum Myeongjo',serif;color:var(--gold2);font-size:clamp(15px,3.2vw,26px);
  letter-spacing:.55em;margin-top:18px;padding-left:.55em}
.tTag{color:#cdbf9d;font-size:clamp(12px,2.4vw,16px);margin-top:26px;letter-spacing:.2em;opacity:.85;max-width:80vw;margin-left:auto;margin-right:auto;line-height:1.7}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
.tMenu{margin-top:40px;display:flex;flex-direction:column;gap:12px;align-items:center;pointer-events:auto}
.tBtn{font-family:'Nanum Myeongjo',serif;font-size:clamp(17px,3vw,22px);color:var(--silk);
  background:linear-gradient(180deg,rgba(140,31,40,.9),rgba(86,16,22,.95));
  border:1px solid var(--gold2);border-radius:10px;padding:13px 50px;cursor:pointer;
  letter-spacing:.3em;transition:.18s;min-width:240px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.tBtn:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(201,162,74,.3);color:#fff}
.tBtn.ghost{background:rgba(18,13,9,.7);color:var(--gold2)}

/* ending card */
#endCard{z-index:65}
#endCard.show{display:flex}
.endName{font-family:'Nanum Myeongjo',serif;font-size:clamp(30px,7vw,68px);color:var(--gold2);letter-spacing:.1em;text-align:center;text-shadow:0 4px 24px rgba(0,0,0,.7)}
.endDesc{margin-top:18px;color:#e6dcc4;font-size:clamp(15px,2.6vw,20px);max-width:680px;text-align:center;line-height:1.85;word-break:keep-all}
.endSeal{margin:24px 0}

#hint{position:absolute;bottom:1vh;left:50%;transform:translateX(-50%);z-index:31;color:rgba(231,201,122,.5);font-size:12px;letter-spacing:2px;pointer-events:none;animation:blink 2.2s infinite}

/* responsive: narrow (390) */
@media (max-width:560px){
  .sprite{height:74%}
  #dlg{padding:0 3% 2.4vh}
  #dlgInner{padding:18px 18px 20px}
  #text{min-height:6em}
  #hud{padding:8px;gap:5px}
  .hbtn{padding:5px 7px;font-size:11px;letter-spacing:0}
  #chapTag{font-size:11px;padding:8px 10px;max-width:52vw;line-height:1.3}
  #title .tHan{font-size:clamp(46px,17vw,90px)}
}
@media (min-aspect-ratio:16/10){
  .sprite{height:92%}
}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:rgba(201,162,74,.4);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="bgLayer"></div>
    <div id="charLayer"></div>
    <div id="vig"></div>
    <div id="fxLayer"></div>

    <div id="chapTag"></div>
    <div id="hud">
      <button class="hbtn" id="btnAuto">자동</button>
      <button class="hbtn" id="btnSkip">건너뛰기</button>
      <button class="hbtn" id="btnLog">기록</button>
      <button class="hbtn" id="btnSave">저장</button>
      <button class="hbtn" id="btnMenu">제목</button>
    </div>

    <div id="dlg">
      <div id="dlgInner">
        <div id="nameTag" class="empty"></div>
        <div id="text"></div>
      </div>
    </div>
    <div id="hint">화면을 누르면 다음으로 진행 ▸</div>

    <div id="choices"></div>

    <div id="fade"></div>
    <div id="flash"></div>

    <!-- overlays -->
    <div class="overlay" id="backlog">
      <div class="ovTitle">지난 이야기 · 記</div>
      <div id="blScroll"></div>
      <button class="tBtn ghost ovClose" data-close="backlog">닫기</button>
    </div>

    <div class="overlay" id="saveOv">
      <div class="ovTitle" id="saveTitle">저장</div>
      <div class="slotGrid" id="slotGrid"></div>
      <button class="tBtn ghost ovClose" data-close="saveOv">닫기</button>
    </div>

    <div class="overlay" id="endCard">
      <div class="endSeal" id="endSeal"></div>
      <div class="endName" id="endName"></div>
      <div class="endDesc" id="endDesc"></div>
      <button class="tBtn ovClose" style="margin-top:34px" data-end="1">처음으로</button>
    </div>

    <!-- title -->
    <div class="overlay show" id="title">
      <div id="titleArt"></div>
      <div class="tWrap">
        <div class="tHan">九重深處</div>
        <div class="tSub">구 중 심 처</div>
        <div class="tTag">달빛이 닿지 않는 궁궐 가장 깊은 곳, 한 줄의 약방문이 왕조의 운명을 가른다.<br>— 한 어린 의녀의 선택에 관한 이야기 —</div>
        <div class="tMenu">
          <button class="tBtn" id="tStart">새로 시작</button>
          <button class="tBtn ghost" id="tContinue">이어하기</button>
          <button class="tBtn ghost" id="tAbout">등장인물</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="about">
      <div class="ovTitle">등장인물 · 人物</div>
      <div id="aboutBody" style="width:min(96%,820px);max-height:74vh;overflow-y:auto;line-height:1.9;font-size:16px;color:#e6dcc4"></div>
      <button class="tBtn ghost ovClose" data-close="about">닫기</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   九重深處 — SVG Visual Novel Engine
   모든 그림은 SVG 도형. 백엔드 없음. 단일 HTML.
   ========================================================================= */

/* ---------- tiny SVG helpers ---------- */
const SVGNS="http://www.w3.org/2000/svg";
function svg(w,h,inner,extra){
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMax meet" ${extra||''}>${inner}</svg>`;
}
function lerpColor(){return''}

/* ============================ BACKGROUNDS ============================ */
/* each returns an inner-svg string sized 1600x900 (16:9), drawn with shapes */

const SKY = {
  dawn:['#3a2a3d','#6b4a52','#caa06f'],
  day:['#9fc0d8','#cdd9d8','#e7e2cf'],
  dusk:['#21243b','#5a3a52','#b8714e'],
  night:['#0a0d1a','#141a30','#26304f'],
};
function gradDef(id,stops,x1,y1,x2,y2){
  const s=stops.map((c,i)=>`<stop offset="${i/(stops.length-1)*100}%" stop-color="${c}"/>`).join('');
  return `<linearGradient id="${id}" x1="${x1||0}" y1="${y1||0}" x2="${x2||0}" y2="${y2||1}">${s}</linearGradient>`;
}
function radDef(id,stops,cx,cy,r){
  const s=stops.map((c)=>`<stop offset="${c[0]}" stop-color="${c[1]}" stop-opacity="${c[2]==null?1:c[2]}"/>`).join('');
  return `<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${s}</radialGradient>`;
}
/* roof tile shape (hanok eaves) */
function hanokRoof(x,y,w,h,col,dark){
  const x2=x+w, midX=x+w/2;
  return `
  <path d="M${x-w*0.06} ${y+h} Q${midX} ${y-h*0.55} ${x2+w*0.06} ${y+h} L${x2-w*0.02} ${y+h} Q${midX} ${y-h*0.25} ${x+w*0.02} ${y+h} Z" fill="${col}"/>
  <path d="M${x-w*0.10} ${y+h} Q${midX} ${y-h*0.62} ${x2+w*0.10} ${y+h} L${x2+w*0.10} ${y+h+h*0.10} Q${midX} ${y-h*0.40} ${x-w*0.10} ${y+h+h*0.10} Z" fill="${dark}"/>
  <path d="M${x-w*0.10} ${y+h+h*0.10} L${x2+w*0.10} ${y+h+h*0.10} L${x2+w*0.10} ${y+h+h*0.24} L${x-w*0.10} ${y+h+h*0.24} Z" fill="${col}"/>`;
}
function pillarsRow(x,y,w,h,n,col){
  let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${col}"/>`;
  const gap=w/(n);
  for(let i=0;i<=n;i++){const px=x+i*gap-7;s+=`<rect x="${px}" y="${y}" width="14" height="${h}" fill="#7a3526"/>`;}
  return s;
}
function paperDoors(x,y,w,h,n){
  let s='';const gap=w/n;
  for(let i=0;i<n;i++){const px=x+i*gap;
    s+=`<rect x="${px+3}" y="${y}" width="${gap-6}" height="${h}" fill="#e9dcb8" opacity=".85"/>`;
    for(let r=1;r<5;r++)s+=`<line x1="${px+3}" y1="${y+h*r/5}" x2="${px+gap-3}" y2="${y+h*r/5}" stroke="#9a8557" stroke-width="2"/>`;
    for(let c=1;c<4;c++)s+=`<line x1="${px+gap*c/4}" y1="${y}" x2="${px+gap*c/4}" y2="${y+h}" stroke="#9a8557" stroke-width="2"/>`;
    s+=`<rect x="${px+3}" y="${y}" width="${gap-6}" height="${h}" fill="none" stroke="#6f4a2c" stroke-width="3"/>`;
  }
  return s;
}
function lantern(x,y,s,glow){
  return `<g>
    <line x1="${x}" y1="${y-s*2.2}" x2="${x}" y2="${y-s}" stroke="#3a2418" stroke-width="3"/>
    ${glow?`<circle cx="${x}" cy="${y}" r="${s*2.4}" fill="url(#lglow)"/>`:''}
    <rect x="${x-s*0.5}" y="${y-s*0.6}" width="${s}" height="${s*1.3}" rx="${s*0.3}" fill="${glow?'#f6cf6b':'#b89a55'}" stroke="#5a3a14" stroke-width="2"/>
    <rect x="${x-s*0.6}" y="${y-s*0.7}" width="${s*1.2}" height="${s*0.18}" fill="#5a3a14"/>
    <rect x="${x-s*0.6}" y="${y+s*0.6}" width="${s*1.2}" height="${s*0.18}" fill="#5a3a14"/>
  </g>`;
}
function moon(cx,cy,r){
  return `<circle cx="${cx}" cy="${cy}" r="${r*1.7}" fill="url(#moonGlow)"/>
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="#f3ead0"/>
  <circle cx="${cx-r*0.3}" cy="${cy-r*0.2}" r="${r*0.22}" fill="#e3d6b3" opacity=".6"/>
  <circle cx="${cx+r*0.35}" cy="${cy+r*0.3}" r="${r*0.16}" fill="#e3d6b3" opacity=".5"/>`;
}
function stars(n){let s='';for(let i=0;i<n;i++){const x=Math.random()*1600,y=Math.random()*420,r=Math.random()*1.6+.4;s+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(1)}" fill="#fff" opacity="${(Math.random()*.7+.2).toFixed(2)}"/>`;}return s;}
function trees(){
  let s='';
  for(let i=0;i<5;i++){const x=120+i*330+(i%2)*60,y=560,sc=.8+(i%3)*.15;
    s+=`<g transform="translate(${x},${y}) scale(${sc})">
      <rect x="-10" y="-60" width="20" height="120" fill="#4a3322"/>
      <ellipse cx="0" cy="-90" rx="80" ry="60" fill="#2f5440"/>
      <ellipse cx="-40" cy="-60" rx="55" ry="42" fill="#3a6b50"/>
      <ellipse cx="45" cy="-65" rx="55" ry="44" fill="#274a38"/>
    </g>`;}
  return s;
}

const BG = {
  /* throne hall / 정전 */
  throne(){return svg(1600,900,`
    <defs>${gradDef('thb',['#2a1410','#4a2418','#3a1c12'],0,0,0,1)}${radDef('thr',[['0','#e7c97a',.5],['1','#e7c97a',0]],.5,.32,.6)}</defs>
    <rect width="1600" height="900" fill="url(#thb)"/>
    <rect y="600" width="1600" height="300" fill="#5a2e1c"/>
    ${[...Array(16)].map((_,i)=>`<rect x="${i*100}" y="600" width="50" height="300" fill="#4a2416" opacity=".5"/>`).join('')}
    ${pillarsRow(0,120,1600,520,6,'transparent')}
    <ellipse cx="800" cy="640" rx="520" ry="60" fill="#7a1f24" opacity=".55"/>
    <circle cx="800" cy="300" r="260" fill="url(#thr)"/>
    <!-- throne -->
    <rect x="680" y="360" width="240" height="220" rx="10" fill="#7a1f24" stroke="#c9a24a" stroke-width="4"/>
    <rect x="700" y="330" width="200" height="60" rx="8" fill="#8c1f28" stroke="#e7c97a" stroke-width="3"/>
    <path d="M700 360 Q800 280 900 360" fill="none" stroke="#e7c97a" stroke-width="6"/>
    <circle cx="800" cy="318" r="26" fill="#e7c97a"/><path d="M800 300 L812 318 L800 336 L788 318Z" fill="#8c1f28"/>
    ${hanokRoof(150,60,1300,80,'#3a2a44','#241828')}
    ${lantern(300,200,30,true)}${lantern(1300,200,30,true)}`);},

  /* 후원 / royal garden, day */
  garden(){return svg(1600,900,`
    <defs>${gradDef('gsky',SKY.day,0,0,0,1)}${gradDef('grass',['#6f8f5a','#4e7042'],0,0,0,1)}</defs>
    <rect width="1600" height="900" fill="url(#gsky)"/>
    <circle cx="1300" cy="160" r="70" fill="#fdf6df" opacity=".9"/>
    ${trees()}
    <rect y="600" width="1600" height="300" fill="url(#grass)"/>
    <path d="M0 720 Q400 680 800 730 T1600 720 L1600 900 L0 900Z" fill="#3f5e38"/>
    <ellipse cx="800" cy="800" rx="420" ry="70" fill="#5b86a6" opacity=".85"/>
    <ellipse cx="800" cy="800" rx="420" ry="70" fill="none" stroke="#cfe3ee" stroke-width="3" opacity=".5"/>
    ${[...Array(7)].map(()=>{const x=520+Math.random()*560,y=775+Math.random()*40;return `<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="26" ry="12" fill="#3c6b5c"/><circle cx="${(x+4).toFixed(0)}" cy="${(y-3).toFixed(0)}" r="6" fill="#e88fb0"/>`;}).join('')}
    <!-- pavilion -->
    <g transform="translate(180,360)">
      <rect x="20" y="120" width="14" height="160" fill="#7a3526"/><rect x="186" y="120" width="14" height="160" fill="#7a3526"/>
      <rect x="0" y="100" width="220" height="26" fill="#8c4a2c"/>
      ${hanokRoof(0,0,220,70,'#46322a','#2c1f18')}

/* Function builds an SVG portrait from shapes.
   opts: hue (hanbangok color), accent, hair, role, expr, pose
   sized 420x760 (standing bust+upper body). */

function face(expr){
  // eyes/brows/mouth by expression
  const E={
    neutral:{brow:[-2,-2],eye:1,pupil:[0,0],mouth:'<path d="M188 372 Q210 380 232 372" stroke="#7a3b3b" stroke-width="3" fill="none"/>'},
    smile:{brow:[-4,-4],eye:.9,pupil:[0,1],mouth:'<path d="M184 368 Q210 386 236 368" stroke="#7a3b3b" stroke-width="3" fill="none"/>'},
    soft:{brow:[-3,-3],eye:.85,pupil:[0,1],mouth:'<path d="M190 372 Q210 378 230 372" stroke="#7a3b3b" stroke-width="3" fill="none"/>'},
    sad:{brow:[5,-7],eye:1,pupil:[0,2],mouth:'<path d="M188 378 Q210 370 232 378" stroke="#7a3b3b" stroke-width="3" fill="none"/>',tear:true},
    angry:{brow:[10,2],eye:1.05,pupil:[0,-1],mouth:'<path d="M188 376 Q210 370 232 376" stroke="#7a3b3b" stroke-width="3.5" fill="none"/>'},
    shock:{brow:[-9,-9],eye:1.3,pupil:[0,0],mouth:'<ellipse cx="210" cy="376" rx="9" ry="12" fill="#5a2424"/>'},
    sly:{brow:[-1,3],eye:.6,pupil:[2,1],mouth:'<path d="M184 370 Q204 388 236 366" stroke="#7a3b3b" stroke-width="3" fill="none"/>'},
    cry:{brow:[7,-8],eye:1,pupil:[0,2],mouth:'<path d="M190 380 Q210 368 230 380" stroke="#7a3b3b" stroke-width="3" fill="none"/>',tear:true,tear2:true},
    cold:{brow:[2,-2],eye:.8,pupil:[0,0],mouth:'<path d="M190 374 L230 374" stroke="#7a3b3b" stroke-width="3" fill="none"/>'},
    pain:{brow:[8,4],eye:.5,pupil:[0,0],mouth:'<path d="M188 378 Q210 372 232 378" stroke="#7a3b3b" stroke-width="3.5" fill="none"/>'},
  };
  const e=E[expr]||E.neutral;
  const eyeH=8*e.eye;
  function eye(cx){
    return `<ellipse cx="${cx}" cy="350" rx="15" ry="${eyeH}" fill="#fff"/>
      <circle cx="${cx+e.pupil[0]}" cy="${350+e.pupil[1]}" r="${5.5*e.eye}" fill="#2a1b14"/>
      <circle cx="${cx+e.pupil[0]-1.5}" cy="${348+e.pupil[1]}" r="1.6" fill="#fff"/>
      <path d="M${cx-16} 350 Q${cx} ${350-eyeH-2} ${cx+16} 350" stroke="#2a1b14" stroke-width="2.2" fill="none"/>`;
  }
  const tears=(e.tear?`<ellipse cx="186" cy="${365}" rx="3" ry="7" fill="#bfe0f0" opacity=".85"/>`:'')+(e.tear2?`<ellipse cx="234" cy="${368}" rx="3" ry="8" fill="#bfe0f0" opacity=".85"/>`:'');
  return `
    <path d="M${172-e.brow[0]} 330 Q186 ${324-e.brow[0]} 200 ${328}" stroke="#2a1b14" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M220 ${328} Q234 ${324-e.brow[1]} ${248+e.brow[1]} 330" stroke="#2a1b14" stroke-width="4" fill="none" stroke-linecap="round"/>
    ${eye(186)}${eye(234)}
    <path d="M210 352 Q205 364 210 368 Q214 366 212 368" stroke="#caa17a" stroke-width="2.5" fill="none"/>
    ${e.mouth}${tears}
    <ellipse cx="172" cy="368" rx="9" ry="6" fill="#e89aa0" opacity=".35"/>
    <ellipse cx="248" cy="368" rx="9" ry="6" fill="#e89aa0" opacity=".35"/>`;
}

/* hair styles */
function hair(style,col,col2){
  const d=col2||col;
  if(style==='gache') // elaborate court wig (queen/consort)

      <ellipse cx="210" cy="150" rx="120" ry="62" fill="${col}"/>

      <path d="M302 300 Q312 360 288 410" stroke="${col}" stroke-width="26" fill="none"/>`;
  if(style==='braid') // young maid braided / coiled
    return `<path d="M126 320 Q120 210 210 188 Q300 210 294 320 Q290 256 210 244 Q130 256 126 320Z" fill="${col}"/>
      <ellipse cx="210" cy="206" rx="100" ry="56" fill="${col}"/>
      <ellipse cx="210" cy="196" rx="100" ry="44" fill="${d}" opacity=".4"/>

  if(style==='topknot') // male / king — sangtu + gat region

      <ellipse cx="210" cy="218" rx="90" ry="46" fill="${col}"/>

    <ellipse cx="210" cy="212" rx="94" ry="50" fill="${col}"/>`;
}

/* full portrait */
function portrait(c){
  const expr=c.expr||'neutral';
  const skin=c.skin||'#f2d2b3';
  const ornaments = c.crown ? `
    <ellipse cx="210" cy="118" rx="70" ry="20" fill="#caa24a"/>
    <path d="M150 120 L210 78 L270 120Z" fill="#e7c97a" stroke="#8c1f28" stroke-width="2"/>
    <circle cx="210" cy="100" r="9" fill="#8c1f28"/>` : (c.binyeo? `<rect x="146" y="206" width="128" height="7" rx="3" fill="#caa24a" transform="rotate(-6 210 209)"/><circle cx="142" cy="214" r="9" fill="#8c1f28"/>` : '');
  const beard = c.beard? `<path d="M180 396 Q210 470 240 396 Q230 430 210 432 Q190 430 180 396Z" fill="${c.hairCol}"/>`:'';
  return svg(420,760,`
    ${hanbok(c.jeo,c.chima,c.trim,c.collar)}
    <ellipse cx="210" cy="372" rx="74" ry="84" fill="${skin}"/>
    <path d="M136 372 Q138 440 210 452 Q282 440 284 372" fill="${skin}"/>
    ${beard}
    ${face(expr)}
    ${hair(c.hair,c.hairCol||'#1a1208',c.hairCol2)}
    ${ornaments}
  `);
}

p6:S({bg:'black',name:'연우',text:'<span class="nar">복수를 위해서가 아니다. … 진실을 위해서다. 아버지가 무엇을 보았기에 죽어야 했는지를.</span>',next:'c1_open'}),

/* ===== 一章 · 입궐 ===== */
c1_open:S({bg:'pharmacy',chap:'一章 · 구중(九重)의 문',who:[{key:'physician',pos:'R',expr:'neutral'}],name:'어의',text:'네가 새로 든 의녀냐. 연우라 하였지. 손이 야무지다 들었다. 약재는 좀 다룰 줄 아느냐?',next:'c1_2',bgm:'court'}),
c1_2:S({who:[{key:'physician',pos:'R',expr:'neutral'},{key:'yeonu',pos:'L',expr:'soft'}],name:'연우',text:'아비… 아니, 어려서 의서를 좀 보았사옵니다. 부족하나마 정성을 다하겠나이다.',next:'c1_3'}),
c1_3:S({who:[{key:'physician',pos:'R',expr:'cold'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'어의',text:'정성이라. … 이 궁에서 정성만큼 값싼 것도 없고, 위험한 것도 없느니라. 명심하거라. 보아도 못 본 척, 들어도 못 들은 척.',next:'c1_4'}),
c1_4:S({who:[{key:'yeonu',pos:'C',expr:'neutral'}],name:'연우',text:'<span class="nar">못 본 척, 못 들은 척. 그것이 이곳에서 살아남는 법이라 하였다. 그러나 나는 — 보러 왔다.</span>',next:'c1_5'}),
c1_5:S({bg:'corridor',fx:'fade',who:[{key:'damo',pos:'R',expr:'smile'},{key:'yeonu',pos:'L',expr:'soft'}],name:'복순',text:'언니! 새로 오셨다죠? 저는 복순이어요. 같은 처소 쓰게 됐으니 잘 부탁드려요. 이 궁, 처음엔 무섭지만 곧 익숙해져요.',next:'c1_6'}),
c1_6:S({who:[{key:'damo',pos:'R',expr:'soft'},{key:'yeonu',pos:'L',expr:'smile'}],name:'복순',text:'아, 그리고요. 한 가지만. … 중전마마와 희빈마마, 두 분 일에는 절대 끼지 마세요. 그 사이에 낀 사람은… 다들 사라졌거든요.',next:'c1_7'}),
c1_7:S({who:[{key:'yeonu',pos:'C',expr:'neutral'}],name:'연우',text:'<span class="nar">중전과 희빈. 왕의 적처와 총애받는 후궁. 칠 년 전, 아버지를 옭아맨 사건의 한가운데에도 — 그 두 사람의 그림자가 있었다.</span>',next:'c1_8'}),
c1_8:S({bg:'corridor',fx:'flash',who:[{key:'yeonu',pos:'C',expr:'shock'}],name:'',text:'<span class="nar">— 그때, 회랑 끝에서 다급한 비명과 함께 무언가 깨지는 소리가 났다.</span>',next:'c1_9'}),
c1_9:S({who:[{key:'eunuch',pos:'R',expr:'angry'},{key:'yeonu',pos:'L',expr:'shock'}],name:'상선',text:'거기 의녀! 무엇 하느냐, 어서 오지 않고! 희빈마마께서 쓰러지셨다. 어의는 입시 중이니 네가 먼저 가 보거라!',next:'c1_choice1'}),

c1_choice1:S({who:[{key:'eunuch',pos:'R',expr:'cold'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'연우',text:'<span class="nar">첫날부터 후궁의 침전이라니. 어의의 경고가 귓가를 스쳤다. … 그러나 의녀가 어찌 환자를 외면하랴.</span>',
  choices:[
    {t:'한달음에 달려간다. 사람을 살리는 것이 먼저다.',go:'c1_run',set:{conscience:1}},
    {t:'증상부터 침착히 묻는다. 섣불리 굴면 위험하다.',go:'c1_calm',set:{caution:1}},
  ]}),
c1_run:S({bg:'chamber',fx:'fade',who:[{key:'consort',pos:'C',expr:'pain'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'연우',text:'<span class="nar">달려간 침전. 희빈은 식은땀을 흘리며 가슴을 움켜쥐고 있었다. 입술이 푸르렀다.</span>',next:'c1_diag'}),
c1_calm:S({bg:'chamber',fx:'fade',who:[{key:'consort',pos:'C',expr:'pain'},{key:'yeonu',pos:'L',expr:'soft'}],name:'연우',text:'마마, 어디가 어떻게 불편하시옵니까. 무엇을 드셨는지, 언제부터인지 — 소녀에게 소상히 일러 주소서.',next:'c1_diag'}),
c1_diag:S({who:[{key:'consort',pos:'C',expr:'pain'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'연우',text:'<span class="nar">맥은 결대(結代)하고, 입술은 청자색. 다과상에 놓인 정과(正果) 한 점. … 부자(附子)의 냄새. 독이다.</span>',next:'c1_diag2'}),
c1_diag2:S({who:[{key:'consort',pos:'C',expr:'pain'},{key:'yeonu',pos:'L',expr:'angry'}],name:'연우',text:'<span class="nar">아버지가 가르친 해독의 순서가 떠올랐다. 감초와 검은콩 달인 물, 그리고 토하게 하는 법. 시간이 없다.</span>',
  choices:[
    {t:'즉시 토하게 하고 감두탕을 먹인다 — 정석대로.',go:'c1_save',set:{skill:1}},
    {t:'"이건 독입니다" 큰 소리로 외쳐 사람을 부른다.',go:'c1_shout',set:{rash:1}},
  ]}),
c1_shout:S({who:[{key:'eunuch',pos:'R',expr:'shock'},{key:'yeonu',pos:'L',expr:'shock'}],name:'상선',text:'독이라니! 함부로 입을 놀리지 마라! 그 말이 새어 나가면 궁이 발칵 뒤집힌다! …하나 지금은, 마마부터 살려라!',next:'c1_save'}),
c1_save:S({fx:'flash',who:[{key:'consort',pos:'C',expr:'soft'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'연우',text:'<span class="nar">한 식경. 검은 물을 토해 낸 희빈의 입술에 핏기가 돌았다. 가까스로 — 살렸다.</span>',next:'c1_meetconsort'}),
c1_meetconsort:S({who:[{key:'consort',pos:'C',expr:'neutral'},{key:'yeonu',pos:'L',expr:'soft'}],name:'희빈',text:'… 네가 나를 살렸느냐. 어린것이 손끝은 매섭구나. 이름이?',next:'c1_name'}),
c1_name:S({who:[{key:'consort',pos:'C',expr:'sly'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'연우',text:'연우라 하옵니다, 마마.',next:'c1_consort2'}),
c1_consort2:S({who:[{key:'consort',pos:'C',expr:'sly'}],name:'희빈',text:'연우라. … 기억해 두마. 이 궁에서 누군가가 나를 죽이려 했다. 그것도 정과에. 너는 그걸 알아챘고. … 영리한 아이는 쓸모가 많지.',next:'c1_consort3'}),
c1_consort3:S({who:[{key:'consort',pos:'C',expr:'neutral'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'희빈',text:'다과는 중전전(中殿殿)에서 보내온 것이었다. … 무슨 뜻인지, 알겠느냐?',next:'c1_consort4'}),
c1_consort4:S({who:[{key:'yeonu',pos:'C',expr:'neutral'}],name:'연우',text:'<span class="nar">중전이 희빈을 독살하려 했다 — 표면은 그렇게 말하고 있었다. 그러나 너무 빤했다. 부자를 정과에 넣는 어설픈 수법. 정작 중전이라면 이리 허술할까.</span>',next:'c1_endchap'}),
c1_endchap:S({who:[{key:'yeonu',pos:'C',expr:'soft'}],name:'연우',text:'<span class="nar">입궐 첫날, 나는 두 세력의 전쟁 한복판에 던져졌다. 그리고 깨달았다. 이 독사건의 냄새가 — 칠 년 전 그 밤과 똑같다는 것을.</span>',next:'c2_open'}),

/* ===== 二章 · 두 세력 ===== */
c2_open:S({bg:'garden',fx:'fade',chap:'二章 · 두 개의 달',who:[{key:'damo',pos:'R',expr:'shock'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'복순',text:'언니! 그 얘기 들었어요? 첫날부터 희빈마마를 살리셨다고 궁이 다 떠들썩해요. … 근데 그거, 좋은 게 아닐 수도 있어요.',next:'c2_2'}),
c2_2:S({who:[{key:'damo',pos:'R',expr:'sad'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'복순',text:'이제 중전마마 쪽에서도, 희빈마마 쪽에서도 언니를 주목할 거예요. 양쪽 다… 사람을 쓰고 버리는 데는 도가 텄거든요.',next:'c2_3'}),
c2_3:S({bg:'corridor',fx:'fade',who:[{key:'eunuch',pos:'C',expr:'cold'}],name:'상선',text:'의녀 연우는 들라. 중전마마께서 너를 부르신다.',next:'c2_queen1'}),
c2_queen1:S({bg:'council',fx:'fade',who:[{key:'queen',pos:'C',expr:'cold'},{key:'yeonu',pos:'L',expr:'soft'}],name:'중전',text:'네가 그 의녀로구나. … 희빈을 살렸다지. 칭찬할 일이다. 한데, 한 가지 묻자. 그 독이, 어디서 온 것이라 보느냐?',next:'c2_queen2'}),
c2_queen2:S({who:[{key:'queen',pos:'C',expr:'neutral'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'연우',text:'<span class="nar">중전의 눈은 깊고 차가웠다. 떠보는 것이다. 내가 무엇을 아는지를. 한 마디로 내 운명이 갈릴 수 있다.</span>',
  choices:[
    {t:'"정과에서 부자 냄새가 났사옵니다." — 사실대로.',go:'c2_truth',set:{queenTrust:1}},
    {t:'"소녀는 의술만 알 뿐, 출처는 모르옵니다." — 발을 뺀다.',go:'c2_dodge',set:{caution:1}},
    {t:'"마마전에서 보낸 다과라 들었나이다." — 떠본다.',go:'c2_probe',set:{rash:1}},
  ]}),
c2_truth:S({who:[{key:'queen',pos:'C',expr:'neutral'}],name:'중전',text:'부자라. … 너는 독을 아는 아이로구나. 솔직하니 마음에 든다. 헌데 — 그 다과가 내 전(殿)에서 나갔다는 소문은 들었느냐?',next:'c2_queen3'}),
c2_dodge:S({who:[{key:'queen',pos:'C',expr:'sly'}],name:'중전',text:'모른다라. … 영리한 대답이다. 너무 영리해서 탈이지. 이 궁에서 모르는 척하는 자는 둘 중 하나다. 진짜 바보거나 — 가장 위험한 자거나.',next:'c2_queen3'}),
c2_probe:S({who:[{key:'queen',pos:'C',expr:'angry'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'중전',text:'… 겁이 없구나. 내 앞에서 그 말을 입에 담다니. 그래, 다과는 내 전에서 나갔다. 허나 나는 보내지 않았다. 누군가 내 이름을 빌렸지.',next:'c2_queen3'}),
c2_queen3:S({who:[{key:'queen',pos:'C',expr:'sad'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'중전',text:'세상은 내가 희빈을 시기해 독을 보냈다 말한다. … 허나 생각해 보아라. 내가 그리 어리석을까. 내 전의 이름을 그대로 써서?',next:'c2_queen4'}),
c2_queen4:S({who:[{key:'queen',pos:'C',expr:'cold'}],name:'중전',text:'누군가 우리 둘을 싸우게 만들고 있다. 그 틈에 — 진짜로 노리는 것은 따로 있고. 연우야. 너는 의술이 깊고 독을 안다. 내 사람이 되어, 그 진짜를 찾아 다오.',next:'c2_q_choice'}),
c2_q_choice:S({who:[{key:'yeonu',pos:'C',expr:'neutral'}],name:'연우',text:'<span class="nar">중전의 말은 일리가 있었다. 그러나 이것 역시 함정일 수 있다. 두 마마는 모두 — 사람을 쓰고 버리는 데 능하다.</span>',
  choices:[
    {t:'"마마를 믿겠나이다." — 중전 쪽에 선다.',go:'c2_side_queen',set:{queenSide:1,queenTrust:1}},
    {t:'"소녀는 어느 편도 들 수 없나이다." — 중립.',go:'c2_neutral',set:{neutral:1}},
  ]}),
c2_side_queen:S({who:[{key:'queen',pos:'C',expr:'soft'},{key:'yeonu',pos:'L',expr:'soft'}],name:'중전',text:'… 현명한 선택이다. 너를 거두마. 무엇이든 알게 되거든 내게 먼저 고하거라. 너의 안위는 내가 지킨다.',next:'c2_after'}),
c2_neutral:S({who:[{key:'queen',pos:'C',expr:'cold'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'중전',text:'중립이라… 이 궁에 중립이란 없다. 어느 쪽도 아니라는 건, 양쪽 모두의 적이 된다는 뜻이지. … 허나 좋다. 네 고집을 지켜보마.',next:'c2_after'}),
c2_after:S({bg:'corridor',fx:'fade',who:[{key:'scholar',pos:'R',expr:'sly'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'정후겸',text:'호오. 중전전에서 나오는 길인가. 처음 보는 의녀로군. 나는 정후겸. 이조정랑(吏曹正郞)이라 하지. … 한데 자네, 어디서 본 듯한 얼굴인데.',next:'c2_scholar2'}),
c2_scholar2:S({who:[{key:'yeonu',pos:'C',expr:'shock'}],name:'연우',text:'<span class="nar">정후겸. 칠 년 전, 아버지의 옥사(獄事)를 주관했던 자의 이름. 심장이 얼어붙었다. 그가 — 내 얼굴을 알아볼 리 없다. 그때 나는 어린아이였으니. … 그래야만 한다.</span>',next:'c2_scholar3'}),
c2_scholar3:S({who:[{key:'scholar',pos:'R',expr:'sly'},{key:'yeonu',pos:'L',expr:'cold'}],name:'연우',text:'… 처음 뵙겠나이다, 나리. 소녀, 그저 새로 든 의녀일 뿐이옵니다.',next:'c2_scholar4'}),
c2_scholar4:S({who:[{key:'scholar',pos:'R',expr:'neutral'}],name:'정후겸',text:'그런가. 착각이었나 보군. … 헌데 의녀, 충고 하나 하지. 이 궁의 독은 약방에만 있는 게 아니야. 사람의 입에도, 종이 한 장에도 있지. 조심하게.',next:'c2_end'}),
c2_end:S({who:[{key:'yeonu',pos:'C',expr:'angry'}],name:'연우',text:'<span class="nar">그자가 멀어지자 다리가 풀렸다. 원수가 바로 곁에 있다. 그리고 그는 — 여전히 이 궁의 권력 한복판에 있다. 나는 더 깊이 들어가야 한다.</span>',next:'c3_open'}),

/* ===== 三章 · 약방문의 비밀 ===== */
c3_open:S({bg:'pharmacy',fx:'fade',chap:'三章 · 잿더미 속 글자',who:[{key:'yeonu',pos:'C',expr:'neutral'}],name:'연우',text:'<span class="nar">그날 밤, 나는 내의원 깊숙한 곳 — 선왕 때의 의안(醫案)이 보관된 서고로 숨어들었다. 아버지가 마지막으로 남긴 말이 떠올라서였다. "약방문을 보라."</span>',next:'c3_2'}),
c3_2:S({who:[{key:'yeonu',pos:'C',expr:'neutral'}],name:'연우',text:'<span class="nar">선왕 승하 무렵의 약방문 묶음. 그런데 — 결정적인 한 장이 찢겨 나가 있었다. 누군가 먼저 다녀갔다.</span>',
  choices:[
    {t:'타다 남은 종이 조각을 뒤진다.',go:'c3_paper',set:{clue1:1}},
    {t:'다른 의안들과 대조해 빠진 날짜를 찾는다.',go:'c3_date',set:{clue1:1}},
  ]}),
c3_paper:S({fx:'flash',who:[{key:'yeonu',pos:'C',expr:'shock'}],name:'연우',text:'<span class="nar">화로 옆, 반쯤 탄 종잇조각. 거기 적힌 두 글자. "丹砂(단사)" — 그리고 흐릿한 한 글자, "�囧(어떤 인장의 일부)". 누군가 증거를 태웠다.</span>',next:'c3_3'}),
c3_date:S({who:[{key:'yeonu',pos:'C',expr:'neutral'}],name:'연우',text:'<span class="nar">빠진 약방문의 날짜는 — 선왕이 승하하기 사흘 전. 그날 누군가 선왕께 약을 올렸다. 그리고 그 기록만 사라졌다.</span>',next:'c3_3'}),
c3_3:S({who:[{key:'physician',pos:'R',expr:'angry'},{key:'yeonu',pos:'L',expr:'shock'}],name:'어의',text:'거기서 무엇을 하느냐!! … 연우. 네가 어찌 이곳에. 이 서고는 출입이 금지된 곳이다. 본 것을 당장 잊어라. 네 목숨이 아깝거든.',next:'c3_4'}),
c3_4:S({who:[{key:'yeonu',pos:'C',expr:'neutral'}],name:'연우',text:'<span class="nar">어의의 눈빛이 흔들렸다. 분노가 아니라 — 두려움이었다. 그는 무언가를 알고 있다.</span>',
  choices:[
    {t:'"어의 어른은 칠 년 전 그날을 아십니까?" 정면돌파.',go:'c3_confront',set:{rash:1,physTrust:1}},
    {t:'"송구하옵니다. 길을 잃었나이다." 일단 물러난다.',go:'c3_retreat',set:{caution:1}},
  ]}),
c3_confront:S({who:[{key:'physician',pos:'R',expr:'sad'},{key:'yeonu',pos:'L',expr:'cold'}],name:'어의',text:'… 칠 년 전. 네가 어찌 그 말을. … 너, 대체 누구냐. 그 눈빛. 그 손끝. … 설마, 인영(仁英)의… 그 아이냐.',next:'c3_reveal1'}),
c3_reveal1:S({who:[{key:'yeonu',pos:'C',expr:'shock'}],name:'연우',text:'<span class="nar">인영. 아버지의 이름. 칠 년 만에 누군가 그 이름을 불렀다. 나는 — 무너지지 않으려 이를 악물었다.</span>',next:'c3_reveal2'}),
c3_reveal2:S({who:[{key:'physician',pos:'R',expr:'sad'},{key:'yeonu',pos:'L',expr:'sad'}],name:'어의',text:'… 네 아비는 죄가 없었다. 나는 안다. 허나 그때 나는 — 입을 다물었다. 살기 위해. 미안하구나. 정말로.',next:'c3_reveal3'}),
c3_reveal3:S({who:[{key:'physician',pos:'R',expr:'neutral'}],name:'어의',text:'선왕을 시해한 독은 단사(丹砂)에서 뽑은 수은(水銀)이었다. 그것을 불로장생의 단약(丹藥)이라 속여 올린 자가 있었지. 네 아비는 그걸 알아챘고 — 그래서 죽었다.',next:'c3_reveal4'}),
c3_retreat:S({who:[{key:'physician',pos:'R',expr:'cold'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'어의',text:'… 다시는 이곳에 발을 들이지 마라. 다음엔 나도 너를 지켜줄 수 없다. … 허나, 네 눈을 보니 멈추지 않겠구나. 그렇다면 이것만 알아 두어라.',next:'c3_reveal4'}),
c3_reveal4:S({who:[{key:'physician',pos:'R',expr:'neutral'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'어의',text:'단약을 선왕께 올린 진상(進上)을 주관한 자 — 그자가 진짜 범인이다. 그리고 그 기록 끝에 찍힌 인장. 이조(吏曹)의 인(印)이었다.',next:'c3_end'}),
c3_end:S({who:[{key:'yeonu',pos:'C',expr:'angry'}],name:'연우',text:'<span class="nar">이조. … 정후겸. 모든 실이 그 한 사람에게로 이어지고 있었다. 선왕 독살, 아버지의 누명, 그리고 지금 두 마마를 싸우게 하는 손까지.</span>',next:'c4_open'}),

/* ===== 四章 · 갈림길 ===== */
c4_open:S({bg:'corridor',fx:'fade',chap:'四章 · 달빛 아래 두 갈래',who:[{key:'yeonu',pos:'C',expr:'neutral'}],name:'연우',text:'<span class="nar">정후겸을 무너뜨리려면 증거가 필요하다. 그러나 일개 의녀에겐 힘이 없다. 권력을 빌려야 한다. … 누구의 힘을?</span>',next:'c4_2'}),
c4_2:S({who:[{key:'yeonu',pos:'C',expr:'soft'}],name:'연우',text:'<span class="nar">중전은 냉철하고 정의롭되 차갑다. 희빈은 영민하고 따뜻한 척하되 위험하다. 둘 다 정후겸을 적으로 둘 이유가 있다. 나는 한쪽을 택해야 한다.</span>',next:'c4_branch'}),
c4_branch:S({who:[{key:'queen',pos:'L',expr:'cold'},{key:'consort',pos:'R',expr:'sly'},{key:'yeonu',pos:'C',expr:'neutral'}],name:'연우',text:'<span class="nar">두 개의 달이 나를 내려다보고 있었다. 어느 빛 아래로 걸어 들어갈 것인가.</span>',
  choices:[
    {t:'【중전의 길】 정의로 정후겸을 단죄한다.',go:'q_open'},
    {t:'【희빈의 길】 책략으로 정후겸을 무너뜨린다.',go:'h_open'},
    {t:'【홀로 가는 길】 누구의 손도 빌리지 않는다.',go:'s_open'},
  ]}),

/* ===== ROUTE: 중전(QUEEN) ===== */
q_open:S({bg:'council',fx:'fade',chap:'중전의 길 · 一',who:[{key:'queen',pos:'C',expr:'neutral'},{key:'yeonu',pos:'L',expr:'soft'}],name:'연우',text:'마마. 칠 년 전 선왕 시해와 지금의 독사건 — 한 사람의 소행이옵니다. 이조정랑 정후겸. 증거는 사라진 약방문이오나, 되살릴 길이 있나이다.',next:'q2'}),
q2:S({who:[{key:'queen',pos:'C',expr:'shock'}],name:'중전',text:'정후겸이라… 선대왕의 외척이자 지금 조정의 실세. 그자를 건드린다는 건 조정 절반을 적으로 돌린다는 뜻이다. … 허나 선왕을 시해했다면, 용서할 수 없지.',next:'q3'}),
q3:S({who:[{key:'queen',pos:'C',expr:'cold'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'중전',text:'증거를 되살릴 길이라 했느냐. 말해 보아라.',next:'q4'}),
q4:S({who:[{key:'yeonu',pos:'C',expr:'neutral'}],name:'연우',text:'<span class="nar">사라진 약방문은 어의가 베껴 둔 사본이 있을 수 있다. 또 단약을 진상한 자라면, 그 단사를 다룬 손에는 흔적이 남는다. 수은에 중독된 자 특유의 증상 — 떨리는 손, 검게 변한 잇몸.</span>',
  choices:[
    {t:'어의를 설득해 사본을 받아낸다.',go:'q_phys',set:{q_evidence:1}},
    {t:'정후겸의 몸에서 수은 중독의 증거를 찾는다.',go:'q_body',set:{q_evidence:1}},
  ]}),
q_phys:S({bg:'pharmacy',fx:'fade',who:[{key:'physician',pos:'R',expr:'sad'},{key:'yeonu',pos:'L',expr:'soft'}],name:'어의',text:'… 사본이라. 있다. 네 아비가 죽던 날, 나는 차마 다 태우지 못하고 한 장을 숨겼다. 칠 년을 죄책감에 떨며 간직했지. … 이제 네게 주마. 네 아비의 한을 풀어다오.',next:'q_mid'}),
q_body:S({bg:'council',fx:'fade',who:[{key:'scholar',pos:'C',expr:'neutral'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'연우',text:'<span class="nar">연회에서 정후겸을 가까이서 살폈다. 술잔을 쥔 손이 미세하게 떨렸다. 웃을 때 드러난 잇몸은 — 검은 테를 두르고 있었다. 수은 중독. 그는 직접 단약을 다뤘다.</span>',next:'q_mid'}),
q_mid:S({bg:'throne',fx:'fade',chap:'중전의 길 · 二',who:[{key:'king',pos:'C',expr:'neutral'},{key:'queen',pos:'L',expr:'cold'}],name:'중전',text:'전하. 칠 년 전 선왕 시해의 진범이 밝혀졌나이다. 증거가 여기 있사옵니다. 부디 친국(親鞫)을 윤허하소서.',next:'q_king2'}),
q_king2:S({who:[{key:'king',pos:'C',expr:'angry'}],name:'주상',text:'… 선왕을, 짐의 아버지를 시해한 자가 여태 짐의 곁에서 녹을 먹었단 말이냐. 정후겸을 당장 잡아들여라!',next:'q_trial'}),
q_trial:S({bg:'dungeon',fx:'fade',chap:'중전의 길 · 三',who:[{key:'scholar',pos:'C',expr:'angry'},{key:'yeonu',pos:'L',expr:'cold'}],name:'정후겸',text:'증거? 한낱 의녀가 끄집어낸 종이 쪼가리 따위로 나를? … 네 눈빛. 이제 알겠다. 너, 인영의 딸이로구나. 칠 년 전 그 계집아이가 살아 돌아왔어.',next:'q_trial2'}),
q_trial2:S({who:[{key:'yeonu',pos:'C',expr:'angry'}],name:'연우',text:'그렇다. 나는 인영의 딸이다. 네가 불로장생을 미끼로 선왕을 시해하고, 그 죄를 내 아버지에게 뒤집어씌웠지. 이 손끝의 떨림, 검은 잇몸이 그 증거다. 네가 직접 단사를 달였으니까.',next:'q_trial3'}),
q_trial3:S({who:[{key:'scholar',pos:'C',expr:'shock'}],name:'정후겸',text:'… 하하. 하하하! 그래, 내가 했다! 늙은 왕은 죽음이 두려워 단약을 갈구했고, 나는 그 두려움에 수은을 섞었을 뿐. 권력은 두려움을 쥔 자의 것이다. 네 아비는 그저 — 너무 많이 알았을 뿐이고.',next:'q_climax'}),
q_climax:S({fx:'flash',who:[{key:'king',pos:'C',expr:'angry'},{key:'queen',pos:'R',expr:'cold'}],name:'주상',text:'역적 정후겸의 죄, 만천하에 드러났다. 능지처참하고 그 일족을 멸하라! 그리고 — 칠 년 전 누명을 쓴 의원 인영의 죄를 사하고, 그 명예를 회복하라.',next:'q_choice_final'}),
q_choice_final:S({who:[{key:'yeonu',pos:'C',expr:'cry'}],name:'연우',text:'<span class="nar">아버지의 이름이 회복되었다. 칠 년을 짊어진 짐이 내려앉았다. 중전이 내게 물었다. 무엇을 원하느냐고.</span>',
  choices:[
    {t:'"궁에 남아 어의가 되어, 다신 이런 일이 없게 하겠나이다."',go:'end_queen_court'},
    {t:'"이제 됐사옵니다. 궁을 떠나 백성을 고치며 살겠나이다."',go:'end_queen_free'},
  ]}),
end_queen_court:S({bg:'pharmacy',fx:'fade',who:[{key:'yeonu',pos:'C',expr:'soft'}],text:'<span class="nar">약 냄새 가득한 내의원에, 비로소 봄빛이 들었다.</span>',end:{name:'정의의 의관(醫官)',desc:'연우는 사상 최초의 여성 어의가 되었다. 중전과 함께 궁의 독을 하나씩 걷어냈고, 다시는 약(藥)이 사람을 해하는 일이 없도록 평생을 바쳤다. 아버지가 꿈꾸던, 사람을 살리는 의술이 비로소 궁에 뿌리내렸다. — 正道의 엔딩.'}}),
end_queen_free:S({bg:'garden',fx:'fade',who:[{key:'yeonu',pos:'C',expr:'smile'}],text:'<span class="nar">궁문을 나서는 그녀의 어깨 위로, 칠 년 만의 햇살이 따스했다.</span>',end:{name:'바람이 된 의녀',desc:'명예를 회복한 연우는 궁을 떠났다. 권력의 가장 깊은 곳을 보았기에, 그녀는 가장 낮은 곳을 택했다. 변두리 의원에서, 아버지가 그러했듯, 가난한 이들의 맥을 짚으며 — 마침내 자유로워졌다. — 解放의 엔딩.'}}),

/* ===== ROUTE: 희빈(CONSORT) ===== */
h_open:S({bg:'chamber',fx:'fade',chap:'희빈의 길 · 一',who:[{key:'consort',pos:'C',expr:'sly'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'연우',text:'마마. 마마를 독살하려 한 손과, 칠 년 전 선왕을 시해한 손은 같사옵니다. 정후겸이옵니다. 정면으로는 그를 이길 수 없으나 — 책략으로는 가능하옵니다.',next:'h2'}),
h2:S({who:[{key:'consort',pos:'C',expr:'sly'}],name:'희빈',text:'호오. 영리한 아이라더니. 정후겸이라… 그자는 내가 전하의 총애를 받는 걸 못마땅해했지. 나를 죽이고 중전에게 죄를 씌우면, 둘 다 제거하는 셈. … 일석이조로구나.',next:'h3'}),
h3:S({who:[{key:'consort',pos:'C',expr:'neutral'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'희빈',text:'그자를 무너뜨리고 싶다. 허나 증거는 약하고, 그는 조정의 실세. 정공법으론 안 돼. … 그래서 책략이라 했느냐. 말해 보아라. 어디까지 더러워질 수 있느냐, 너는.',next:'h4'}),
h4:S({who:[{key:'yeonu',pos:'C',expr:'cold'}],name:'연우',text:'<span class="nar">더러워질 수 있느냐. … 아버지라면 절대 택하지 않았을 길. 그러나 깨끗한 손으론 괴물을 잡을 수 없다.</span>',
  choices:[
    {t:'정후겸이 마마를 독살하려 한 것처럼 역으로 함정을 판다.',go:'h_trap',set:{h_scheme:1}},
    {t:'그의 수은 중독을 이용해, 스스로 무너지도록 약을 쓴다.',go:'h_poison',set:{h_scheme:1,darkness:1}},
  ]}),
h_trap:S({who:[{key:'consort',pos:'C',expr:'sly'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'희빈',text:'그자가 즐겨 마시는 단약 — 우리가 그걸 빌미로 삼는다. "왕께 올린 단약과 같은 것을 사사로이 복용했다." 진상(進上) 기록만 손에 넣으면, 시해의 증거가 된다. 좋다, 그 기록을 빼내자.',next:'h_mid'}),
h_poison:S({fx:'flash',who:[{key:'consort',pos:'C',expr:'sly'},{key:'yeonu',pos:'L',expr:'cold'}],name:'연우',text:'<span class="nar">수은 중독자는 특정 약재에 격렬히 반응한다. 그의 단약에 그 약재를 더한다면 — 증상이 폭발해, 만인 앞에서 정체가 드러날 것이다. 나는 의술을, 처음으로, 해치는 데 썼다.</span>',next:'h_mid'}),
h_mid:S({bg:'throne',fx:'fade',chap:'희빈의 길 · 二',who:[{key:'scholar',pos:'C',expr:'pain'},{key:'king',pos:'R',expr:'shock'}],name:'정후겸',text:'으윽…! 이, 이게 무슨…! 손이… 손이 떨려… 입에서… 검은… 누, 누가 내게…!',next:'h_expose'}),
h_expose:S({who:[{key:'consort',pos:'C',expr:'sly'},{key:'king',pos:'R',expr:'angry'}],name:'희빈',text:'전하. 보소서. 정후겸의 저 증상 — 수은(水銀) 중독이옵니다. 불로장생의 단약을 사사로이 복용한 자만이 저리 되옵니다. 선왕께 단약을 진상한 자가, 제 손으로 그 죄를 토설하고 있나이다.',next:'h_king'}),
h_king:S({who:[{key:'king',pos:'C',expr:'angry'}],name:'주상',text:'단약이라… 선왕께서 드신 그 단약! 정후겸, 네가 선왕을 시해하였느냐! 진상 기록을 가져오라! … 짐을 속인 죄, 결코 용서치 않으리라.',next:'h_trial'}),
h_trial:S({bg:'dungeon',fx:'fade',chap:'희빈의 길 · 三',who:[{key:'scholar',pos:'C',expr:'angry'},{key:'yeonu',pos:'L',expr:'cold'}],name:'정후겸',text:'이건… 함정이다! 누군가 내게 약을 썼어! …너로구나. 그 의녀. 인영의 딸. 네가 감히 나를 — 이런 더러운 수로!',next:'h_trial2'}),
h_trial2:S({who:[{key:'yeonu',pos:'C',expr:'cold'}],name:'연우',text:'더러운 수라. … 칠 년 전 죄 없는 내 아버지를 역적으로 몰아 죽인 너의 손은 깨끗했더냐. 나는 너의 방식으로 너를 잡았을 뿐이다. 괴물을 잡는 데, 사냥꾼이 깨끗할 필요는 없지.',next:'h_trial3'}),
h_trial3:S({who:[{key:'scholar',pos:'C',expr:'shock'}],name:'정후겸',text:'… 너는, 나와 똑같구나. 결국. 권력의 맛을 본 자의 눈이다. … 좋다. 같이 지옥에 가자꾸나. 하하…',next:'h_climax'}),
h_climax:S({fx:'flash',who:[{key:'consort',pos:'C',expr:'sly'},{key:'yeonu',pos:'R',expr:'cold'}],name:'희빈',text:'<span class="nar">정후겸은 처형되었다. 아버지의 누명도 벗겨졌다. 그러나 그 자리를 채운 것은 — 희빈의 권세였다. 그녀는 이제 중전마저 위협하는 실세가 되었다. 그리고 그 곁에는, 내가 있었다.</span>',next:'h_choice_final'}),
h_choice_final:S({who:[{key:'consort',pos:'C',expr:'sly'},{key:'yeonu',pos:'L',expr:'neutral'}],name:'희빈',text:'연우야. 너는 이제 내게 없어선 안 될 사람이다. 내 곁에 남아, 이 궁의 진짜 주인이 되는 길을 함께 걷자. … 어떠냐. 권력은, 한 번 쥐면 놓기 어려운 법이지.',
  choices:[
    {t:'"마마와 함께 가겠나이다." 권력의 길을 받아들인다.',go:'end_consort_power'},
    {t:'"여기까지이옵니다." 손에 묻은 피를 보며 떠난다.',go:'end_consort_leave'},

/* ============================ ENGINE ============================ */
const $=s=>document.querySelector(s);
const bgLayer=$('#bgLayer'), charLayer=$('#charLayer'), fade=$('#fade'), flash=$('#flash');
const nameTag=$('#nameTag'), textEl=$('#text'), choicesEl=$('#choices'), chapTag=$('#chapTag'), hint=$('#hint');

const state={
  cur:'start', vars:{}, history:[], curBg:null,
  typing:false, fullText:'', autoMode:false, skipMode:false, started:false,
  bgmName:null,
};
let typeTimer=null, autoTimer=null;

/* ----- SVG layers ----- */
function setBG(name,fxFlash){
  if(state.curBg===name) return;
  state.curBg=name;
  bgLayer.innerHTML=(BG[name]||BG.black)();
}
const POS={LL:'6%',L:'15%',C:'50%',R:'66%',RR:'78%'};
function renderChars(who){
  charLayer.innerHTML='';
  (who||[]).forEach(w=>{
    const div=document.createElement('div');
    div.className='sprite enter'+(w.dim?' dim':'');
    let left=POS[w.pos]||'50%';
    div.style.left=left;
    if(w.pos==='C'||!w.pos) div.style.transform='translateX(-50%)';
    div.innerHTML=makePortrait(w.key, w.expr||'neutral');
    charLayer.appendChild(div);
  });
}

/* ----- typewriter ----- */
function typeText(html){
  clearTimeout(typeTimer);
  state.typing=true; state.fullText=html;
  // strip tags for char-by-char but keep them: simple approach -> split into tokens
  textEl.innerHTML='';
  // We type by progressively revealing text content while preserving spans.
  const tmp=document.createElement('div'); tmp.innerHTML=html;
  const nodes=[];
  (function walk(parent,target){
    parent.childNodes.forEach(n=>{
      if(n.nodeType===3){ // text
        for(const ch of n.textContent){nodes.push({t:'c',ch,target});}
      }else if(n.nodeType===1){
        const el=document.createElement(n.tagName);
        if(n.className) el.className=n.className;
        target.appendChild(el);
        nodes.push({t:'open',el});
        walk(n,el);
      }
    });
  })(tmp,textEl);
  let i=0;
  const speed=state.skipMode?2:22;
  function step(){
    if(i>=nodes.length){ finishType(); return; }
    const node=nodes[i++];
    if(node.t==='c'){ node.target.appendChild(document.createTextNode(node.ch)); }
    typeTimer=setTimeout(step, node.t==='c'?speed:0);
  }
  // cursor
  step();
}
function finishType(){
  state.typing=false;
  textEl.innerHTML=state.fullText;
  const sc=document.createElement('span'); sc.id='cursor'; sc.textContent='▾';
  textEl.appendChild(sc);
  // auto/skip advance
  if(state.skipMode){ autoTimer=setTimeout(advance, 180); }
  else if(state.autoMode){ autoTimer=setTimeout(advance, Math.min(4200, 900+state.fullText.length*45)); }
}

/* ----- show a scene ----- */
function show(id){
  const sc=STORY[id];
  if(!sc){ console.warn('missing scene',id); return; }
  state.cur=id;
  clearTimeout(autoTimer);

  const doRender=()=>{
    if(sc.set) Object.assign(state.vars, sc.set);
    if(sc.chap){ chapTag.textContent=sc.chap; }
    if(sc.bg) setBG(sc.bg, sc.fx==='flash');
    renderChars(sc.who||[]);
    // name + color
    const nm=sc.name||'';
    if(nm){ nameTag.classList.remove('empty'); nameTag.textContent=nm; nameTag.style.background=`linear-gradient(180deg, ${shade(SP_COLOR[nm]||'#8c1f28',18)}, ${SP_COLOR[nm]||'#8c1f28'})`; }
    else { nameTag.classList.add('empty'); }
    // history
    const rawText=sc.text||'';
    state.history.push({name:nm, text:rawText.replace(/<[^>]+>/g,'')});
    if(state.history.length>400) state.history.shift();
    // ending?
    if(sc.end){ typeText(sc.text||('<span class="nar">'+sc.end.name+'</span>')); setTimeout(()=>showEnding(sc.end), 700); choicesEl.classList.remove('show'); hint.style.display='none'; return; }
    // text
    choicesEl.classList.remove('show');
    if(sc.choices){
      typeText(sc.text||'');
      state._pendingChoices=sc.choices;
      hint.textContent='선택지가 나타납니다…';
      // show choices once typing nearly done
      setTimeout(()=>{ if(state.cur===id) renderChoices(sc.choices); }, state.skipMode?60:Math.min(1600,(sc.text||'').length*22+250));
    }else{
      state._pendingChoices=null;
      hint.textContent='화면을 누르면 다음으로 진행 ▸';
      hint.style.display='block';
      typeText(sc.text||'');
      state._next=sc.next;
    }
    if(sc.fx==='flash') doFlash();
    if(sc.bgm) Audio.play(sc.bgm);
  };

  // fade transition
  if(sc.fx==='fade' || (sc.bg && sc.bg!==state.curBg)){
    fade.classList.add('on');
    setTimeout(()=>{ doRender(); fade.classList.remove('on'); }, 360);
  }else{
    doRender();
  }
}
function renderChoices(choices){
  choicesEl.innerHTML='';
  choices.forEach((c,idx)=>{
    const b=document.createElement('div'); b.className='choice';
    b.innerHTML=`<span class="pre">${['一','二','三','四'][idx]||'•'}</span>${c.t}`;
    b.onclick=(e)=>{ e.stopPropagation(); if(c.set)Object.assign(state.vars,c.set); state.autoMode=false; state.skipMode=false; updateHud(); show(c.go); };
    choicesEl.appendChild(b);
  });
  choicesEl.classList.add('show');
  hint.style.display='none';
}
function advance(){
  if(state._pendingChoices){ renderChoices(state._pendingChoices); return; }
  if(state.typing){ finishType(); return; }
  if(state._next){ show(state._next); }
}

/* ----- ending ----- */
function showEnding(end){
  $('#endName').textContent=end.name;
  $('#endDesc').textContent=end.desc;
  $('#endSeal').innerHTML=svg(140,140,`
    <circle cx="70" cy="70" r="64" fill="none" stroke="#c9a24a" stroke-width="3"/>
    <rect x="34" y="34" width="72" height="72" rx="6" fill="#8c1f28"/>
    <text x="70" y="86" text-anchor="middle" font-size="48" fill="#e7c97a" font-family="Nanum Myeongjo">終</text>`,'width="140" height="140"');
  $('#endCard').classList.add('show');
  Audio.play('end');
}

/* ----- effects ----- */
function doFlash(){ flash.style.opacity='.85'; setTimeout(()=>flash.style.opacity='0',180); }
function shade(hex,amt){ // lighten
  const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.min(255,r);g=Math.min(255,g);b=Math.min(255,b);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ----- HUD ----- */
function updateHud(){
  $('#btnAuto').classList.toggle('act',state.autoMode);
  $('#btnSkip').classList.toggle('act',state.skipMode);
}
$('#btnAuto').onclick=e=>{e.stopPropagation();state.autoMode=!state.autoMode;state.skipMode=false;updateHud(); if(state.autoMode&&!state.typing)advance();};
$('#btnSkip').onclick=e=>{e.stopPropagation();state.skipMode=!state.skipMode;state.autoMode=false;updateHud(); if(state.skipMode&&!state.typing)advance();};
$('#btnLog').onclick=e=>{e.stopPropagation();openBacklog();};
$('#btnSave').onclick=e=>{e.stopPropagation();openSave('저장');};
$('#btnMenu').onclick=e=>{e.stopPropagation();goTitle();};

/* ----- backlog ----- */
function openBacklog(){
  const sc=$('#blScroll'); sc.innerHTML='';
  state.history.slice(-120).forEach(h=>{
    const d=document.createElement('div'); d.className='blRow';
    d.innerHTML=(h.name?`<b>${h.name}</b>`:'')+h.text;
    sc.appendChild(d);
  });
  $('#backlog').classList.add('show'); sc.scrollTop=sc.scrollHeight;
}

/* ----- save/load ----- */
const SAVE_KEY='gujung_saves_v1';
function getSaves(){ try{return JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');}catch(e){return{};} }
function setSaves(o){ try{localStorage.setItem(SAVE_KEY,JSON.stringify(o));}catch(e){} }
let saveMode='save';
function openSave(mode){
  saveMode=mode==='저장'?'save':'load';
  $('#saveTitle').textContent=mode;
  const saves=getSaves(); const grid=$('#slotGrid'); grid.innerHTML='';
  for(let i=1;i<=4;i++){
    const s=saves['s'+i];
    const div=document.createElement('div'); div.className='slot'+(s?'':' empty');
    const sc=STORY[s?s.cur:null];
    div.innerHTML=`<div class="st">자리 ${i}</div><div class="sd">${s?((sc&&sc.chap||'진행 중')+'<br>'+s.date):'— 비어 있음 —'}</div>`;
    div.onclick=()=>{
      if(saveMode==='save'){
        saves['s'+i]={cur:state.cur,vars:state.vars,history:state.history.slice(-200),date:new Date().toLocaleString('ko-KR')};
        setSaves(saves); openSave('저장');
      }else{
        if(!s)return;
        state.cur=s.cur; state.vars=s.vars||{}; state.history=s.history||[];
        $('#saveOv').classList.remove('show'); $('#title').classList.remove('show');
        state.started=true; state.curBg=null; show(state.cur);
      }
    };
    grid.appendChild(div);
  }
  $('#saveOv').classList.add('show');
}

<p style="margin-bottom:14px"><b style="color:#a8161c">주상(主上)</b> — 현재의 임금. 선왕(아버지)의 죽음에 오랜 의혹을 품어 왔다.</p>
<p style="margin-bottom:14px"><b style="color:#2b3a5a">정후겸(鄭厚謙)</b> — 이조정랑. 조정의 실세. 칠 년 전 아버지의 옥사를 주관한 자. 모든 음모의 그림자가 그에게로 향한다.</p>
<p style="margin-bottom:14px"><b style="color:#3a4a3e">어의(御醫)</b> — 내의원의 수장. 칠 년 전의 진실을 알면서도 침묵한 죄책감을 안고 산다.</p>
<p style="margin-bottom:14px"><b style="color:#6b5234">복순(福順)</b> — 같은 처소의 다모(茶母). 연우의 유일한 벗. 밝고 정 많다.</p>
<p style="margin-bottom:6px"><b style="color:#3a4656">상선(尙膳)</b> — 내시부의 우두머리 환관. 궁의 모든 일을 관장한다.</p>`;
function goTitle(){
  $('#title').classList.add('show'); buildTitleArt();
  $('#tContinue').style.display=Object.keys(getSaves()).length?'block':'none';
}
$('#tStart').onclick=()=>{ state.cur='start';state.vars={};state.history=[];state.curBg=null;state.started=true; $('#title').classList.remove('show'); show('start'); };
$('#tContinue').onclick=()=>openSave('이어하기');
$('#tAbout').onclick=()=>{ $('#aboutBody').innerHTML=ABOUT; $('#about').classList.add('show'); };
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=e=>{e.stopPropagation();$('#'+b.dataset.close).classList.remove('show');});
document.querySelectorAll('[data-end]').forEach(b=>b.onclick=e=>{e.stopPropagation();$('#endCard').classList.remove('show');goTitle();});

/* ----- click to advance ----- */
$('#dlg').onclick=()=>{ if(!state.started)return; advance(); };
document.addEventListener('keydown',e=>{
  if(!state.started)return;
  if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){ e.preventDefault(); advance(); }
  if(e.key==='Escape'){ document.querySelectorAll('.overlay.show').forEach(o=>{if(o.id!=='title')o.classList.remove('show');}); }
});

/* ============================ WEB AUDIO (ambient) ============================ */
const Audio=(function(){
  let ctx=null, master=null, cur=null, started=false;
  function init(){ if(ctx)return; try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.12; master.connect(ctx.destination);}catch(e){} }
  // simple pentatonic drone+pluck per mood
  const MOODS={
    court:{root:196,scale:[0,2,4,7,9],drone:true},
    end:{root:147,scale:[0,3,5,7,10],drone:true},
  };
  function play(name){
    init(); if(!ctx)return;
    if(ctx.state==='suspended')ctx.resume();
    if(state.bgmName===name && cur)return;
    state.bgmName=name;
    if(cur){try{cur.stop();}catch(e){}}
    const mood=MOODS[name]||MOODS.court;
    const grp=ctx.createGain(); grp.gain.value=0; grp.connect(master);
    grp.gain.linearRampToValueAtTime(1, ctx.currentTime+1.5);
    // drone
    if(mood.drone){
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=mood.root/2;
      const g=ctx.createGain(); g.gain.value=0.5; o.connect(g); g.connect(grp); o.start();
      const o2=ctx.createOscillator(); o2.type='triangle'; o2.frequency.value=mood.root*1.5;
      const g2=ctx.createGain(); g2.gain.value=0.12; o2.connect(g2); g2.connect(grp); o2.start();
      grp._osc=[o,o2];
    }
    // gentle plucks (gayageum-ish)
    function pluck(){
      if(state.bgmName!==name)return;
      const note=mood.root*Math.pow(2,(mood.scale[Math.floor(Math.random()*mood.scale.length)]+(Math.random()<.3?12:0))/12);
      const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=note;
      const g=ctx.createGain(); g.gain.value=0.0001;
      g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+1.6);
      o.connect(g); g.connect(grp); o.start(); o.stop(ctx.currentTime+1.7);
      setTimeout(pluck, 1400+Math.random()*2600);
    }
    setTimeout(pluck, 800);
    cur={stop(){ grp.gain.linearRampToValueAtTime(0,ctx.currentTime+0.8); if(grp._osc)grp._osc.forEach(o=>{try{o.stop(ctx.currentTime+1);}catch(e){}}); }};
  }
  return {play, init};
})();
// resume audio on first interaction
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,function f(){Audio.init();},{once:true}));

/* ----- boot ----- */
buildTitleArt();
updateHud();
// preload first background so first paint is instant (title art already shown)
setBG('black');
</script>
