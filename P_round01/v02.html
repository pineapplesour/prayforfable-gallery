<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>표류 — 므네모시네호의 마지막 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Orbitron:wght@500;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#04060d; --bg1:#0a0f1e; --panel:#0d1326cc; --panelb:#1a2748;
    --ink:#e8eefc; --dim:#8fa2c8; --cyan:#5fe3ff; --amber:#ffce6b;
    --rose:#ff7b9c; --green:#7dffb0; --violet:#b89bff; --red:#ff5d63;
    --line:#26375f; --glow:0 0 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg0);overflow:hidden;
    font-family:'Noto Sans KR',sans-serif;color:var(--ink);user-select:none;}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  #stage{position:relative;width:100%;height:100%;max-width:1920px;background:var(--bg0);overflow:hidden;}
  svg{display:block;}
  .full{position:absolute;inset:0;width:100%;height:100%;}

  /* ===== Scene art ===== */
  #sceneWrap{position:absolute;inset:0;}
  #sceneA,#sceneB{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;}
  #sceneA.show,#sceneB.show{opacity:1;}
  #vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 38%,transparent 40%,#000a 100%);}
  #scanlines{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.12;
    background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px);}
  #flicker{position:absolute;inset:0;pointer-events:none;background:#000;opacity:0;}

  /* ===== Portrait ===== */
  #portrait{position:absolute;left:50%;bottom:200px;width:520px;height:560px;
    transform:translateX(-50%);opacity:0;transition:opacity .5s, transform .5s, filter .5s;
    pointer-events:none;filter:drop-shadow(0 0 30px #0008);}
  #portrait.show{opacity:1;}
  #portrait.dim{filter:brightness(.5) saturate(.6) drop-shadow(0 0 20px #0008);}

  /* ===== Dialogue box ===== */
  #ui{position:absolute;left:0;right:0;bottom:0;padding:0 0 18px;z-index:30;}
  #namebar{margin:0 auto;width:min(92%,1080px);height:0;position:relative;}
  #namebox{position:absolute;left:34px;bottom:-2px;padding:7px 26px;
    background:linear-gradient(135deg,#16264b,#0b132a);
    border:1px solid var(--line);border-bottom:none;border-radius:12px 12px 0 0;
    font-family:'Orbitron',sans-serif;letter-spacing:1px;font-weight:700;font-size:18px;
    color:var(--cyan);text-shadow:var(--glow) #1a6e8a;display:none;}
  #dbox{margin:0 auto;width:min(92%,1080px);min-height:184px;
    background:linear-gradient(180deg,#0d1530f2,#070b18f7);
    border:1px solid var(--panelb);border-radius:16px;
    box-shadow:0 0 0 1px #000a,0 14px 40px #000a, inset 0 0 60px #0a1838aa;
    padding:24px 30px 20px;position:relative;cursor:pointer;backdrop-filter:blur(3px);}
  #dtext{font-family:'Gowun Batang',serif;font-size:21px;line-height:1.85;color:var(--ink);
    min-height:96px;white-space:pre-wrap;text-shadow:0 1px 2px #000a;}
  #dtext .em{color:var(--amber);}
  #dtext .echo{color:var(--cyan);}
  #cont{position:absolute;right:24px;bottom:14px;color:var(--cyan);font-size:20px;
    opacity:0;animation:bob 1.1s infinite;}
  #cont.show{opacity:.9;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

  /* ===== Choices ===== */
  #choices{position:absolute;left:0;right:0;bottom:0;top:0;z-index:40;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:16px;
    background:radial-gradient(60% 60% at 50% 50%,#04060d66,#04060dcc);}
  .choice{width:min(80%,640px);padding:18px 26px;text-align:center;cursor:pointer;
    background:linear-gradient(180deg,#13213fee,#0b142b);
    border:1px solid var(--panelb);border-radius:14px;color:var(--ink);
    font-family:'Gowun Batang',serif;font-size:20px;letter-spacing:.3px;
    transition:transform .18s, box-shadow .18s, border-color .18s, background .18s;
    box-shadow:0 6px 22px #0008;}
  .choice:hover,.choice.kbd{transform:translateY(-3px) scale(1.015);
    border-color:var(--cyan);box-shadow:0 0 24px #1d6e8a55,0 10px 30px #000a;
    background:linear-gradient(180deg,#19305cee,#0d1a38);}
  .choice .tag{display:block;font-family:'Orbitron';font-size:11px;letter-spacing:2px;
    color:var(--dim);margin-bottom:6px;opacity:.8;}

  /* ===== Top HUD ===== */
  #hud{position:absolute;top:14px;right:18px;z-index:35;display:flex;gap:8px;}
  .hbtn{font-family:'Orbitron';font-size:12px;letter-spacing:1px;color:var(--dim);
    background:#0c142acc;border:1px solid var(--line);border-radius:9px;padding:8px 12px;
    cursor:pointer;transition:.18s;backdrop-filter:blur(2px);}
  .hbtn:hover{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 12px #1d6e8a55;}
  .hbtn.on{color:var(--amber);border-color:var(--amber);box-shadow:0 0 12px #5a460055;}
  #oxgauge{position:absolute;top:14px;left:18px;z-index:35;
    font-family:'Orbitron';font-size:12px;letter-spacing:1px;color:var(--dim);
    background:#0c142acc;border:1px solid var(--line);border-radius:9px;padding:8px 14px;
    display:flex;align-items:center;gap:10px;backdrop-filter:blur(2px);}
  #oxbar{width:120px;height:7px;background:#0a1428;border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  #oxfill{height:100%;width:100%;background:linear-gradient(90deg,#5fe3ff,#7dffb0);transition:width 1s;}
  #chapTag{position:absolute;top:52px;left:18px;z-index:34;font-family:'Orbitron';
    font-size:11px;letter-spacing:3px;color:#4a608f;opacity:.85;}

  /* ===== Backlog ===== */
  #backlog{position:absolute;inset:0;z-index:60;background:#04060df2;display:none;
    flex-direction:column;padding:40px max(6%,24px);overflow-y:auto;}
  #backlog h2{font-family:'Orbitron';color:var(--cyan);letter-spacing:3px;font-weight:700;}
  .blog{margin:0 0 16px;padding:14px 18px;border-left:3px solid var(--line);
    background:#0a122699;border-radius:0 10px 10px 0;}
  .blog .who{font-family:'Orbitron';font-size:12px;letter-spacing:1px;color:var(--cyan);margin-bottom:5px;}
  .blog .what{font-family:'Gowun Batang';font-size:17px;line-height:1.7;color:var(--ink);}
  #blogClose{position:absolute;top:20px;right:24px;}

  /* ===== Title ===== */
  #title{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;
    align-items:center;justify-content:center;background:radial-gradient(80% 80% at 50% 40%,#0a1a3a,#02030a);}
  #title .sub{font-family:'Orbitron';letter-spacing:6px;color:var(--cyan);font-size:13px;
    margin-bottom:10px;opacity:.85;text-shadow:var(--glow) #1a6e8a;}
  #title h1{font-family:'Gowun Batang',serif;font-weight:700;font-size:clamp(38px,8vw,84px);
    margin:0;letter-spacing:6px;color:#eaf2ff;text-shadow:0 0 40px #2a7bff66;text-align:center;}
  #title .tagline{font-family:'Gowun Batang';color:var(--dim);margin-top:18px;font-size:clamp(14px,2.4vw,19px);
    text-align:center;max-width:560px;line-height:1.7;padding:0 16px;}
  #menu{margin-top:42px;display:flex;flex-direction:column;gap:12px;align-items:center;}
  .mbtn{font-family:'Orbitron';letter-spacing:3px;font-size:15px;color:var(--ink);
    cursor:pointer;transition:.2s;
    background:linear-gradient(180deg,#13234aee,#0a142c);
    border:1px solid var(--panelb);padding:14px 50px;border-radius:30px;}
  .mbtn:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 22px #1d6e8a66;transform:translateY(-2px);}
  .mbtn.ghost{background:transparent;border-color:var(--line);font-size:12px;letter-spacing:2px;color:var(--dim);padding:10px 30px;}
  #title .cred{position:absolute;bottom:18px;font-family:'Orbitron';font-size:10px;letter-spacing:2px;color:#3a4d76;}

  /* ===== End card ===== */
  #endcard{position:absolute;inset:0;z-index:70;display:none;flex-direction:column;
    align-items:center;justify-content:center;background:#02030aee;text-align:center;padding:24px;}
  #endcard .ekind{font-family:'Orbitron';letter-spacing:5px;font-size:13px;margin-bottom:14px;}
  #endcard h2{font-family:'Gowun Batang';font-weight:700;font-size:clamp(30px,6vw,56px);margin:0;letter-spacing:3px;}
  #endcard p{font-family:'Gowun Batang';color:var(--dim);max-width:600px;line-height:1.9;margin:20px 0 30px;font-size:clamp(15px,2.5vw,19px);}
  #endcard .ebtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}

  #flash{position:absolute;inset:0;z-index:90;background:#fff;opacity:0;pointer-events:none;transition:opacity .15s;}

  /* fade for whole stage */
  .shake{animation:shake .5s;}
  @keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}
    40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,4px)}80%{transform:translate(3px,-2px)}}

  /* responsive 390 */
  @media (max-width:560px){
    #portrait{width:330px;height:380px;bottom:230px;}
    #dbox{min-height:160px;padding:18px 18px 16px;border-radius:14px;}
    #dtext{font-size:17px;line-height:1.7;min-height:80px;}
    #namebox{font-size:15px;left:18px;padding:6px 18px;}
    .choice{font-size:16px;padding:14px 16px;width:90%;}
    #oxgauge{font-size:10px;padding:6px 9px;}#oxbar{width:80px;}
    .hbtn{font-size:10px;padding:6px 8px;}
    #title h1{letter-spacing:3px;}
    #namebar,#dbox{width:94%;}
  }
  @media (max-height:480px){
    #portrait{height:300px;bottom:170px;}
    #dbox{min-height:120px;}#dtext{min-height:60px;}
  }
</style>
</head>
<body>
<div id="app"><div id="stage">

  <!-- scene art layers -->
  <div id="sceneWrap">
    <div id="sceneA"></div>
    <div id="sceneB"></div>
  </div>
  <div id="vignette"></div>
  <div id="scanlines"></div>
  <div id="flicker"></div>

  <!-- portrait -->
  <div id="portrait"></div>

  <!-- HUD -->
  <div id="oxgauge">O<span style="font-size:9px">2</span> <div id="oxbar"><div id="oxfill"></div></div> <span id="oxpct">100%</span></div>
  <div id="chapTag"></div>
  <div id="hud">
    <div class="hbtn" id="btnAuto">AUTO</div>
    <div class="hbtn" id="btnSkip">SKIP</div>
    <div class="hbtn" id="btnLog">LOG</div>
    <div class="hbtn" id="btnSave">SAVE</div>
    <div class="hbtn" id="btnSnd">♪ ON</div>
    <div class="hbtn" id="btnMenu">MENU</div>
  </div>

  <!-- dialogue -->
  <div id="ui">
    <div id="namebar"><div id="namebox"></div></div>
    <div id="dbox"><div id="dtext"></div><div id="cont">▼</div></div>
  </div>

  <!-- choices -->
  <div id="choices"></div>

  <!-- backlog -->
  <div id="backlog">
    <h2>― 항해 일지 (BACKLOG) ―</h2>
    <div id="blogList" style="margin-top:20px;"></div>
    <div class="hbtn" id="blogClose">닫기 ✕</div>
  </div>

  <!-- title -->
  <div id="title">
    <svg class="full" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" style="position:absolute;opacity:.55;pointer-events:none">
      <defs>
        <radialGradient id="tg" cx="50%" cy="36%" r="70%">
          <stop offset="0%" stop-color="#13316a"/><stop offset="60%" stop-color="#08132c"/>
          <stop offset="100%" stop-color="#02030a"/>
        </radialGradient>
      </defs>
      <rect width="1440" height="900" fill="url(#tg)"/>
      <g id="titleStars"></g>
      <!-- drifting ship silhouette -->
      <g transform="translate(720 470) rotate(-8)" opacity=".9">
        <ellipse cx="0" cy="0" rx="210" ry="34" fill="#0b1730" stroke="#21407a" stroke-width="2"/>
        <rect x="-230" y="-12" width="60" height="24" rx="6" fill="#0c1a38" stroke="#21407a"/>
        <polygon points="210,-18 270,0 210,18" fill="#0c1a38" stroke="#21407a" stroke-width="2"/>
        <circle cx="120" cy="-2" r="6" fill="#5fe3ff" opacity=".8"/>
        <circle cx="60" cy="2" r="3" fill="#ffce6b" opacity=".7"/>
        <circle cx="-40" cy="-4" r="3" fill="#ff7b9c" opacity=".5"/>
        <line x1="-170" y1="0" x2="170" y2="0" stroke="#1a335f" stroke-width="1"/>
      </g>
    </svg>
    <div class="sub">A DRIFTING SHIP VISUAL NOVEL</div>
    <h1>표 류</h1>
    <div style="font-family:'Orbitron';letter-spacing:8px;color:#7da0d8;margin-top:6px;font-size:clamp(11px,2.4vw,15px)">― 므네모시네호의 마지막 기록 ―</div>
    <div class="tagline">콜드슬립에서 깨어났을 때, 함선은 이미 죽어 있었다.<br>승무원 명단에 남은 이름은… 단 하나.</div>
    <div id="menu">
      <div class="mbtn" id="mStart">새로 시작</div>
      <div class="mbtn ghost" id="mContinue">이어하기</div>
    </div>
    <div class="cred">SVG VISUAL NOVEL · localStorage save · WebAudio ambience</div>
  </div>

  <!-- end card -->
  <div id="endcard">
    <div class="ekind"></div>
    <h2></h2><p></p>
    <div class="ebtns">
      <div class="mbtn" id="eRestart">처음으로</div>
      <div class="mbtn ghost" id="eContinue">다른 선택 보기</div>
    </div>
  </div>

  <div id="flash"></div>
</div></div>

<script>
"use strict";
/* =========================================================================
   표류 — 므네모시네호의 마지막 기록
   단일 HTML SVG 비주얼노벨. 외부 의존: 폰트 CDN만.
   ========================================================================= */

/* ---------- tiny DOM helpers ---------- */
const $ = s => document.querySelector(s);
const sceneA = $("#sceneA"), sceneB = $("#sceneB");
const portrait = $("#portrait"), dtext = $("#dtext"), namebox = $("#namebox");
const cont = $("#cont"), dbox = $("#dbox"), choicesEl = $("#choices");
const stage = $("#stage");

/* =========================================================================
   1. SVG ART LIBRARY  — backgrounds & character portraits
   ========================================================================= */

// reusable star field generator
function stars(n, seed){
  let s = seed||7, out="";
  const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
  for(let i=0;i<n;i++){
    const x=(rnd()*1440)|0, y=(rnd()*640)|0, r=(rnd()*1.6+.3).toFixed(2);
    const o=(rnd()*.7+.2).toFixed(2);
    out+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#dfeaff" opacity="${o}"><animate attributeName="opacity" values="${o};${(o*.3).toFixed(2)};${o}" dur="${(2+rnd()*4).toFixed(1)}s" repeatCount="indefinite"/></circle>`;
  }
  return out;
}

const BG = {
  // Cold-sleep bay
  cryo: ()=>`<svg class="full" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="cz" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0a1b34"/><stop offset="1" stop-color="#040a16"/></linearGradient>
      <radialGradient id="cglow" cx="50%" cy="45%" r="60%">
        <stop offset="0" stop-color="#1b4a6e88"/><stop offset="1" stop-color="#00000000"/></radialGradient>
      <linearGradient id="pod" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#13324f"/><stop offset="1" stop-color="#081c30"/></linearGradient>
    </defs>
    <rect width="1440" height="900" fill="url(#cz)"/>
    <rect width="1440" height="900" fill="url(#cglow)"/>
    <!-- floor grid -->
    <g stroke="#15355a" stroke-width="1" opacity=".6">
      ${Array.from({length:9},(_,i)=>`<line x1="${720+(i-4)*150}" y1="640" x2="${720+(i-4)*420}" y2="900"/>`).join("")}
      <line x1="0" y1="700" x2="1440" y2="700"/><line x1="0" y1="780" x2="1440" y2="780"/>
    </g>
    <!-- cryo pods rows -->
    ${[140,420,1000,1280].map((x,i)=>`
      <g transform="translate(${x} 250)">
        <rect x="-58" y="-30" width="116" height="360" rx="58" fill="url(#pod)" stroke="#2b5b82" stroke-width="3"/>
        <rect x="-40" y="0" width="80" height="280" rx="40" fill="#0a2438" opacity=".8"/>
        <ellipse cx="0" cy="120" rx="30" ry="70" fill="${i===1?'#1f5f73':'#10303f'}" opacity=".5"/>
        <circle cx="0" cy="-12" r="6" fill="${i===1?'#5fe3ff':'#2a4a5a'}"><animate attributeName="opacity" values="1;.3;1" dur="${2+i}s" repeatCount="indefinite"/></circle>
      </g>`).join("")}
    <!-- central open pod (player) -->
    <g transform="translate(720 250)">
      <rect x="-70" y="-40" width="140" height="400" rx="70" fill="url(#pod)" stroke="#3f7ba8" stroke-width="4"/>
      <path d="M -70 -40 A 70 70 0 0 1 70 -40" fill="none" stroke="#5fe3ff" stroke-width="3" opacity=".7"/>
      <rect x="-48" y="6" width="96" height="300" rx="48" fill="#02101c" opacity=".9"/>
      <circle cx="0" cy="-22" r="7" fill="#7dffb0"><animate attributeName="opacity" values="1;.4;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <path d="M -90 360 q 90 -20 180 0" fill="none" stroke="#2b5b82" stroke-width="3"/>
    </g>
    <!-- cold mist -->
    <ellipse cx="720" cy="640" rx="500" ry="60" fill="#bfeaff" opacity=".05"/>
    <ellipse cx="720" cy="680" rx="700" ry="40" fill="#bfeaff" opacity=".04"/>
  </svg>`,

  // Bridge / cockpit
  bridge: ()=>`<svg class="full" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="brgw" cx="50%" cy="30%" r="80%">
        <stop offset="0" stop-color="#0d2747"/><stop offset="1" stop-color="#03060f"/></radialGradient>
      <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#050a1c"/><stop offset="1" stop-color="#0a1430"/></linearGradient>
    </defs>
    <rect width="1440" height="900" fill="url(#brgw)"/>
    <!-- big viewport -->
    <path d="M 220 90 L 1220 90 Q 1320 90 1320 200 L 1320 430 L 120 430 L 120 200 Q 120 90 220 90 Z" fill="url(#win)" stroke="#244b7a" stroke-width="4"/>
    <g clip-path="url(#vpClip)"><clipPath id="vpClip"><path d="M 224 94 L 1216 94 Q 1316 94 1316 200 L 1316 426 L 124 426 L 124 200 Q 124 94 224 94 Z"/></clipPath>
      <rect x="120" y="90" width="1200" height="340" fill="#02040c"/>
      ${stars(120,33)}
      <circle cx="1060" cy="250" r="80" fill="#1b2a55" opacity=".5"/>
      <circle cx="1060" cy="250" r="80" fill="none" stroke="#3a5fb0" stroke-width="1" opacity=".4"/>
      <ellipse cx="1060" cy="250" rx="120" ry="14" fill="none" stroke="#5a7fd0" stroke-width="2" opacity=".4"/>
    </g>
    <!-- mullions -->
    <line x1="470" y1="92" x2="470" y2="428" stroke="#244b7a" stroke-width="3" opacity=".7"/>
    <line x1="720" y1="92" x2="720" y2="428" stroke="#244b7a" stroke-width="3" opacity=".7"/>
    <line x1="970" y1="92" x2="970" y2="428" stroke="#244b7a" stroke-width="3" opacity=".7"/>
    <!-- console -->
    <path d="M 80 560 L 1360 560 L 1280 900 L 160 900 Z" fill="#0a1a30" stroke="#1f4670" stroke-width="3"/>
    <g>
      ${Array.from({length:18},(_,i)=>{const x=180+i*60;const on=[2,5,8,11,14].includes(i);
        return `<rect x="${x}" y="600" width="40" height="26" rx="4" fill="${on?'#15466a':'#0c2238'}" stroke="#1f4670"/>
        <circle cx="${x+20}" cy="660" r="6" fill="${on?'#5fe3ff':'#2a3a52'}" opacity="${on?.9:.5}"/>`;}).join("")}
    </g>
    <!-- chair -->
    <g transform="translate(720 620)">
      <rect x="-60" y="0" width="120" height="180" rx="20" fill="#0c1a30" stroke="#1f4670" stroke-width="3"/>
      <rect x="-44" y="20" width="88" height="120" rx="14" fill="#10243d"/>
    </g>
  </svg>`,

  // Corridor (dark, emergency lit)
  corridor: (red)=>`<svg class="full" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="cor" cx="50%" cy="50%" r="60%">
        <stop offset="0" stop-color="${red?'#3a0a12':'#0c2238'}"/><stop offset="1" stop-color="#02040a"/></radialGradient>
    </defs>
    <rect width="1440" height="900" fill="url(#cor)"/>
    <!-- perspective tunnel -->
    ${[1,2,3,4,5].map(i=>{const k=i/5; const w=1440*(1-k*.7), h=900*(1-k*.7);
      const x=(1440-w)/2, y=(900-h)/2 - 40;
      return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${red?'#7a1f2a':'#1f4670'}" stroke-width="${3-i*.4}" opacity="${.8-k*.5}"/>`;}).join("")}
    <!-- side light strips -->

// color shade helper
function shade(hex,amt){
  let c=hex.replace("#",""); if(c.length===3)c=c.split("").map(x=>x+x).join("");
  let r=parseInt(c.slice(0,2),16)+amt, g=parseInt(c.slice(2,4),16)+amt, b=parseInt(c.slice(4,6),16)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return "#"+[r,g,b].map(x=>x.toString(16).padStart(2,"0")).join("");
}

/* =========================================================================
   2. AUDIO  — WebAudio ambient drones + blips
   ========================================================================= */
const Audio_ = (()=>{
  let ctx=null, master=null, nodes=[], on=true, cur=null;
  function init(){
    if(ctx) return;
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain(); master.gain.value=0.0; master.connect(ctx.destination);
    }catch(e){ on=false; }
  }
  function stopAll(){ nodes.forEach(n=>{try{n.stop&&n.stop();}catch(e){} try{n.disconnect&&n.disconnect();}catch(e){}}); nodes=[]; }
  function drone(freqs, type, level){
    if(!ctx) return;
    stopAll();
    const g=ctx.createGain(); g.gain.value=0; g.connect(master);
    freqs.forEach((f,i)=>{
      const o=ctx.createOscillator(); o.type=type||"sine"; o.frequency.value=f;
      const og=ctx.createGain(); og.gain.value=(level||.12)/(i+1);
      const lfo=ctx.createOscillator(); lfo.frequency.value=0.06+i*0.03;
      const lg=ctx.createGain(); lg.gain.value=f*0.004;
      lfo.connect(lg); lg.connect(o.frequency);
      o.connect(og); og.connect(g); o.start(); lfo.start();
      nodes.push(o,lfo);
    });
    g.gain.linearRampToValueAtTime(1, ctx.currentTime+2);
    nodes.push(g);
  }
  const MOODS={
    calm:()=>drone([55,82.4,110,164.8],"sine",.14),
    tense:()=>drone([49,58,73.4],"triangle",.12),
    danger:()=>drone([41.2,43.6,87.3],"sawtooth",.10),
    warm:()=>drone([65.4,98,130.8,196],"sine",.13),
    void:()=>drone([36.7,55,61.7],"sine",.16),
    memory:()=>drone([73.4,110,146.8,220],"sine",.11),
  };
  return {
    enable(){ on=true; init(); if(ctx&&ctx.state==="suspended")ctx.resume(); if(master)master.gain.linearRampToValueAtTime(.6,ctx.currentTime+1.2); if(cur&&MOODS[cur])MOODS[cur](); },
    disable(){ on=false; if(master&&ctx)master.gain.linearRampToValueAtTime(0,ctx.currentTime+.4); },
    isOn(){return on;},

      text:"리안과 하루, 그리고 ECHO. 셋은 함장의 유산을 함께 짊어졌다. 표류는 끝나지 않았지만, 외로움은 끝났다. 므네모시네 — 기억의 여신의 배는, 마침내 잊히지 않을 이야기가 되었다."}},
  ],
};

/* dynamic conditional inserts */
const COND_INSERTS = {
  haruIf: ()=> S.flags.haruWoke ? [
    {who:"haru",ex:"sad",t:"…같이 가는 거지? 그럼 됐어. 혼자 보내는 것보다 백 배 나아."},
  ]:[],
  haruIf2: ()=> S.flags.haruWoke ? [
    {who:"haru",ex:"smile",t:"나도 갈래. 부조종사가 빠지면 어떡해. 셋이서 가자."},
  ]:[],
};

/* =========================================================================
   4. ENGINE  — state, save, runner
   ========================================================================= */
const SAVE_KEY = "mnemosyne_save_v2";
let S = null;
function newState(){
  return { label:"start", idx:0, flags:{}, backlog:[], chapter:"", o2:100,
           sound:true, seen:false };
}

const flagFns = {
  hubCheck(){
    // count completed major branches
    const f=S.flags;
    const done = (f.engineDone?1:0)+(f.oxygenDone?1:0)+(f.haruDone?1:0)+(f.memoryDone?1:0);
    if(done>=3 || (f.memoryDone && done>=2)){ jumpTo("reveal"); }
    else jumpTo("hub_menu");
  },
  finalChoices(){
    const f=S.flags;
    const arr=[
      {tag:"확실 · 희생",label:"함선을 항성으로 몰아 함께 불태운다",goto:"end_burn"},
      {tag:"안전 · 봉인",label:"깨우지 않은 채 영원히 표류시킨다",goto:"end_drift"},
    ];
    if(f.sawTruth) arr.push({tag:"진실 · 대화",label:"ECHO의 셋째 길 — 그것과 대화한다",goto:"end_talk"});
    if(f.haruWoke && f.sawTruth) arr.push({tag:"???",label:"무엇을 택하든, 하루와 함께 결정한다",goto:"end_together"});
    showChoices(arr);
  },
};

/* ---- HUB choices builder ---- */
function hubChoices(){
  const f=S.flags;
  const arr=[];
  if(!f.engineDone) arr.push({tag:"기관부",label:"반응로를 손본다 (추진력)",goto:"engine_path"});
  if(!f.oxygenDone) arr.push({tag:"생명유지",label:"산소 재생기를 점검한다",goto:"oxygen_path"});
  if(!f.haruDone)   arr.push({tag:"콜드슬립",label:"열두 번째 캡슐을 조사한다",goto:"haru_path"});
  if(!f.memoryDone) arr.push({tag:"ECHO",label:"기억 코어에 접속한다 (진실)",goto:"memory_path"});
  const done=(f.engineDone?1:0)+(f.oxygenDone?1:0)+(f.haruDone?1:0)+(f.memoryDone?1:0);
  if(done>=3 || (f.memoryDone&&done>=2)) arr.push({tag:"⚠ 준비됨",label:"마지막 봉인을 풀 준비가 되었다",goto:"reveal"});
  return arr;
}

/* ---- runner state ---- */
let typing=false, typeTimer=null, fullText="", autoMode=false, skipMode=false, autoTimer=null;
let waiting=false; // waiting for click to advance

function getList(label){
  let list = SCRIPT[label];
  return list;
}

function jumpTo(label){ S.label=label; S.idx=0; runNext(); }

function setBG(kind, arg){
  const builder = BG[kind]||BG.black;
  const target = (activeScene===sceneA)? sceneB : sceneA;
  target.innerHTML = builder(arg);
  target.classList.add("show");
  activeScene.classList.remove("show");
  activeScene = target;
}
let activeScene = sceneA;

function setPortrait(who, ex){
  const c = CHARS[who];
  if(!c || !c.art){ portrait.classList.remove("show"); return; }
  portrait.innerHTML = c.art(ex);
  portrait.classList.add("show");
  portrait.classList.remove("dim");
}

function applyFX(fx){
  if(fx==="shake"){ stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake"); }
  else if(fx==="flash"){ const fl=$("#flash"); fl.style.opacity=.9; setTimeout(()=>fl.style.opacity=0,140); }
  else if(fx==="flicker"){ const fk=$("#flicker"); fk.style.transition="none"; fk.style.opacity=.7;
    setTimeout(()=>{fk.style.transition="opacity .3s";fk.style.opacity=0;},60); }
}

function setO2(v){
  S.o2 = v;
  $("#oxfill").style.width = v+"%";
  $("#oxpct").textContent = v+"%";
  const col = v>60? "linear-gradient(90deg,#5fe3ff,#7dffb0)" : v>35? "linear-gradient(90deg,#ffce6b,#ff9c5f)":"linear-gradient(90deg,#ff7b9c,#ff5d63)";
  $("#oxfill").style.background = col;
}

/* ---- main statement processor ---- */
function runNext(){
  if(skipMode){ /* fast path handled in step */ }
  let list = getList(S.label);
  if(!list){ console.warn("missing label",S.label); return; }

  // process non-dialogue statements until we hit something that waits
  while(S.idx < list.length){
    const st = list[S.idx];

    // conditional control nodes
    if(st.if){ S.idx++; flagFns[st.if](); return; }
    if(st.goto){ jumpTo(st.goto); return; }
    if(st.choices){
      S.idx++;
      let arr = st.choices;
      if(arr==="HUBCHOICES") arr = hubChoices();
      showChoices(arr);
      return;
    }
    if(st.end){ S.idx++; showEnd(st.end); return; }

    // dynamic conditional speaker insert (haruIf etc.)
    if(st.who && COND_INSERTS[st.who]){
      const ins = COND_INSERTS[st.who]();
      list.splice(S.idx,1,...ins);
      if(ins.length===0){ continue; } // skip
      // continue loop with replaced content
      continue;
    }

    // non-blocking effects
    if(st.chapter!==undefined){ S.chapter=st.chapter; $("#chapTag").textContent=st.chapter; S.idx++; continue; }
    if(st.bg){ setBG(st.bg, st.arg); S.idx++; continue; }
    if(st.mood){ Audio_.mood(st.mood); S.idx++; continue; }
    if(st.fx){ applyFX(st.fx); S.idx++; continue; }
    if(st.sfx){ Audio_.blip(st.sfx); S.idx++; continue; }
    if(st.o2!==undefined){ setO2(st.o2); S.idx++; continue; }
    if(st.set){ for(const k in st.set){ if(k==="o2"){setO2(st.set[k]);} else { S.flags[k]=(S.flags[k]||0)+st.set[k]; } } S.idx++; continue; }
    if(st.portraitClear){ portrait.classList.remove("show"); S.idx++; continue; }

    // dialogue / narration  -> blocking
    if(st.t!==undefined){
      showLine(st);
      return;
    }
    // unknown -> skip
    S.idx++;
  }
  // end of list w/o goto -> stay
}

/* ---- show one dialogue line (typewriter) ---- */
function showLine(st){
  const who = st.who||"none";
  const c = CHARS[who]||CHARS.none;
  // name
  if(c.name){ namebox.style.display="inline-block"; namebox.textContent=c.name; namebox.style.color=c.color;
    namebox.style.textShadow="0 0 14px "+c.color+"66"; }
  else namebox.style.display="none";
  // portrait
  if(who!=="none" && CHARS[who] && CHARS[who].art){
    setPortrait(who, st.ex);
  } else {
    if(who==="none") portrait.classList.add("dim");
  }
  // typewriter
  fullText = st.t;
  startTyping(fullText, c.cls);
  // record backlog
  S.backlog.push({who:c.name||"", text:stripTags(st.t)});
  if(S.backlog.length>200) S.backlog.shift();
  waiting=true;
  S.idx++; // advance index now; advance() will call runNext
  saveAuto();
}

function stripTags(s){ return s.replace(/<[^>]+>/g,""); }

function startTyping(html, cls){
  clearTimeout(typeTimer); typing=true; cont.classList.remove("show");
  dtext.innerHTML="";
  // tokenize keeping tags
  const tokens=[]; let i=0;
  while(i<html.length){
    if(html[i]==="<"){ const j=html.indexOf(">",i); tokens.push(html.slice(i,j+1)); i=j+1; }
    else { tokens.push(html[i]); i++; }
  }
  let shown="";
  let k=0;
  const speed = skipMode? 0 : 18;
  function step(){
    if(k>=tokens.length){ typing=false; cont.classList.add("show"); scheduleAuto(); return; }
    const tk=tokens[k++];
    shown+=tk;
    dtext.innerHTML=shown + '<span style="opacity:0">|</span>';
    if(tk.length===1 && tk!==" " && Math.random()<.5) Audio_.blip("type");
    if(skipMode){ step(); }
    else typeTimer=setTimeout(step, speed + (".,!?…".includes(tk)? 220:0));
  }
  if(skipMode){ dtext.innerHTML=html; typing=false; cont.classList.add("show"); scheduleAuto(); }
  else step();
}

function finishTyping(){
  clearTimeout(typeTimer); typing=false;
  dtext.innerHTML=fullText; cont.classList.add("show");
  scheduleAuto();
}

/* ---- advance on click ---- */
function advance(){
  if(choicesEl.style.display==="flex") return;
  if($("#endcard").style.display==="flex") return;
  if(typing){ finishTyping(); return; }
  if(!waiting) return;
  waiting=false;
  runNext();
}

/* ---- auto / skip ---- */
function scheduleAuto(){
  clearTimeout(autoTimer);
  if(skipMode){ autoTimer=setTimeout(()=>{ if(!typing){ waiting=false; runNext(); } }, 120); return; }
  if(autoMode){ const len=stripTags(fullText).length; autoTimer=setTimeout(()=>{ if(!typing){ waiting=false; runNext(); } }, 900+len*45); }
}

/* ---- choices ---- */
let kbdIndex=-1, kbdChoices=[];
function showChoices(arr){
  choicesEl.innerHTML="";
  cont.classList.remove("show");
  kbdChoices=arr; kbdIndex=-1;
  arr.forEach((ch,i)=>{
    const d=document.createElement("div");
    d.className="choice";
    d.innerHTML = (ch.tag? `<span class="tag">${ch.tag}</span>`:"") + ch.label;
    d.onclick=()=>{
      Audio_.blip("select");
      if(ch.set){ for(const k in ch.set){ S.flags[k]=(S.flags[k]||0)+ch.set[k]; } }
      choicesEl.style.display="none";
      S.backlog.push({who:"▶ 선택", text:ch.label});
      jumpTo(ch.goto);
    };
    choicesEl.appendChild(d);
  });
  choicesEl.style.display="flex";
  // disable auto/skip during choice
}

/* ---- endings ---- */
function showEnd(e){
  const card=$("#endcard");
  card.querySelector(".ekind").textContent=e.kind;
  card.querySelector(".ekind").style.color=e.col;
  card.querySelector("h2").textContent=e.title;
  card.querySelector("h2").style.color=e.col;
  card.querySelector("h2").style.textShadow="0 0 30px "+e.col+"55";
  card.querySelector("p").textContent=e.text;
  card.style.display="flex";
  Audio_.blip("chime");
  // mark ending seen
  try{ const seen=JSON.parse(localStorage.getItem("mnemo_endings")||"[]");
    if(!seen.includes(e.title)){seen.push(e.title);localStorage.setItem("mnemo_endings",JSON.stringify(seen));} }catch(err){}
}

/* ---- save / load ---- */
function saveAuto(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }
function loadSave(){ try{ const d=JSON.parse(localStorage.getItem(SAVE_KEY)); if(d) S=d; return !!d; }catch(e){ return false; } }

/* =========================================================================
   5. BOOT / UI WIRING
   ========================================================================= */
function startGame(fromSave){
  $("#title").style.display="none";
  $("#endcard").style.display="none";
  if(!fromSave){ S=newState(); }
  // restore o2 visual
  setO2(S.o2||100);
  $("#chapTag").textContent = S.chapter||"";
  // sound
  if(S.sound){ Audio_.enable(); $("#btnSnd").textContent="♪ ON"; $("#btnSnd").classList.add("on"); }
  else { Audio_.disable(); $("#btnSnd").textContent="♪ OFF"; $("#btnSnd").classList.remove("on"); }
  // first render
  // if resuming mid-line, re-run from idx (idx already advanced past last shown -> step back one)
  if(fromSave && S.idx>0){ S.idx = Math.max(0, S.idx-1); }
  runNext();
}

// title buttons
$("#mStart").onclick=()=>{ Audio_.enable(); startGame(false); };
$("#mContinue").onclick=()=>{ if(loadSave()){ Audio_.enable(); startGame(true);} else { $("#mStart").click(); } };

// hud
$("#btnAuto").onclick=function(){ autoMode=!autoMode; this.classList.toggle("on",autoMode); if(autoMode){skipMode=false;$("#btnSkip").classList.remove("on");} if(autoMode&&!typing&&waiting) scheduleAuto(); };
$("#btnSkip").onclick=function(){ skipMode=!skipMode; this.classList.toggle("on",skipMode); if(skipMode){autoMode=false;$("#btnAuto").classList.remove("on"); if(typing)finishTyping(); else scheduleAuto();} };
$("#btnLog").onclick=()=>openLog();
$("#blogClose").onclick=()=>{ $("#backlog").style.display="none"; };
$("#btnSave").onclick=()=>{ saveAuto(); const b=$("#btnSave"); b.textContent="저장됨"; setTimeout(()=>b.textContent="SAVE",1000); };
$("#btnSnd").onclick=function(){ if(Audio_.isOn()){ Audio_.disable(); S.sound=false; this.textContent="♪ OFF"; this.classList.remove("on"); } else { Audio_.enable(); S.sound=true; this.textContent="♪ ON"; this.classList.add("on"); } };
$("#btnMenu").onclick=()=>{ saveAuto(); $("#title").style.display="flex"; };

function openLog(){
  const list=$("#blogList"); list.innerHTML="";
  S.backlog.slice(-80).forEach(b=>{
    const d=document.createElement("div"); d.className="blog";
    d.innerHTML=`<div class="who">${b.who||"…"}</div><div class="what">${b.text}</div>`;
    list.appendChild(d);
  });
  $("#backlog").style.display="flex";
  $("#backlog").scrollTop=$("#backlog").scrollHeight;
}

// endcard buttons
$("#eRestart").onclick=()=>{ S=newState(); saveAuto(); $("#endcard").style.display="none"; $("#title").style.display="flex"; };
$("#eContinue").onclick=()=>{ // jump back to final gate if available, else hub
  $("#endcard").style.display="none";
  if(S.flags && (S.flags.sawTruth||S.flags.memoryDone)){ jumpTo("final_gate"); }
  else { jumpTo("hub"); }
};

// advance interactions
dbox.onclick=advance;
document.addEventListener("keydown",e=>{
  if($("#title").style.display!=="none" && $("#title").style.display!=="") return;
  if(choicesEl.style.display==="flex"){
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      const items=[...choicesEl.children];
      kbdIndex = e.key==="ArrowDown"? (kbdIndex+1)%items.length : (kbdIndex-1+items.length)%items.length;
      items.forEach((it,i)=>it.classList.toggle("kbd",i===kbdIndex));
      e.preventDefault();
    } else if(e.key==="Enter" && kbdIndex>=0){ choicesEl.children[kbdIndex].click(); }
    return;
  }
  if(e.key===" "||e.key==="Enter"||e.key==="ArrowRight"){ advance(); e.preventDefault(); }
  else if(e.key.toLowerCase()==="l"){ openLog(); }
  else if(e.key==="Escape"){ $("#backlog").style.display="none"; }
});
// tap on scene area also advances (mobile)
$("#sceneWrap").addEventListener("click",()=>{ if(choicesEl.style.display!=="flex") advance(); });

// title stars
(function(){ const g=document.getElementById("titleStars"); if(g) g.innerHTML=stars(140,5); })();

// continue button visibility
window.addEventListener("load",()=>{
  if(!hasSave()){ $("#mContinue").style.opacity=.45; }
});

// ensure initial scene not blank on title (subtle)
setBG("space","#2a1f6a");
</script>
