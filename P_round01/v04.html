<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>기억의 잔향 — Echoes of Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@400;600;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --neon-cyan:#34f5ff; --neon-mag:#ff3ca6; --neon-pur:#9b6bff;
    --neon-amber:#ffb347; --bg0:#05060e; --bg1:#0b1020; --ink:#e8f4ff;
    --panel:rgba(8,12,26,.82); --panelbd:rgba(80,200,255,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg0);overflow:hidden;
    font-family:'Gowun Dodum',sans-serif;color:var(--ink);}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  /* 16:9-ish stage that letterboxes; works at 1440 wide and 390 narrow */
  #stage{position:relative;width:100%;height:100%;max-width:100vw;max-height:100vh;
    background:var(--bg0);overflow:hidden;}
  svg{display:block;}

  /* ===== Scene art layer ===== */
  #scene{position:absolute;inset:0;width:100%;height:100%;}
  #bgLayer,#fxLayer,#charLayer{position:absolute;inset:0;width:100%;height:100%;}
  .fade{transition:opacity 1.1s ease;}
  .charSlot{position:absolute;bottom:14%;height:78%;width:clamp(280px,30vw,460px);
    transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1), filter .5s;}
  .charSlot svg{width:100%;height:100%;}
  #charL{left:3%;}
  #charC{left:50%;transform:translateX(-50%);}
  #charR{right:3%;}
  .dim{filter:brightness(.45) saturate(.7);}
  .pop{filter:drop-shadow(0 0 18px rgba(52,245,255,.4));}

  /* ===== Dialogue UI ===== */
  #ui{position:absolute;inset:0;pointer-events:none;}
  #dbox{position:absolute;left:3%;right:3%;bottom:3.2%;min-height:23%;
    background:linear-gradient(180deg,rgba(6,10,22,.62),rgba(6,10,22,.95));
    border:1px solid var(--panelbd);border-radius:14px;
    box-shadow:0 0 30px rgba(52,245,255,.12),inset 0 0 40px rgba(0,0,0,.5);
    backdrop-filter:blur(6px);padding:18px 26px 20px;pointer-events:auto;cursor:pointer;
    opacity:0;transition:opacity .4s;}
  #dbox.show{opacity:1;}
  #namebox{position:absolute;top:-18px;left:24px;font-family:'Orbitron',sans-serif;
    font-weight:700;font-size:clamp(13px,1.5vw,20px);letter-spacing:1px;
    padding:5px 18px;border-radius:8px;background:linear-gradient(90deg,var(--neon-cyan),var(--neon-pur));
    color:#04121a;text-shadow:none;box-shadow:0 0 18px rgba(52,245,255,.5);}
  #dtext{font-family:'Noto Serif KR',serif;font-size:clamp(15px,1.7vw,23px);line-height:1.7;
    margin-top:14px;min-height:3.4em;white-space:pre-wrap;text-shadow:0 2px 10px #000;}
  #dtext .glitch{color:var(--neon-mag);text-shadow:0 0 8px var(--neon-mag);}
  #caret{display:inline-block;width:.5ch;color:var(--neon-cyan);animation:blink 1s steps(2) infinite;}
  @keyframes blink{50%{opacity:0;}}
  #hint{position:absolute;right:22px;bottom:12px;font-size:11px;letter-spacing:2px;
    color:var(--neon-cyan);opacity:.6;font-family:'Orbitron',sans-serif;animation:blink 1.4s infinite;}

  /* choices */
  #choices{position:absolute;left:6%;right:6%;top:0;bottom:30%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;pointer-events:none;}
  .choice{pointer-events:auto;cursor:pointer;width:min(640px,86%);padding:15px 22px;
    font-family:'Noto Serif KR',serif;font-size:clamp(14px,1.5vw,20px);color:var(--ink);
    background:linear-gradient(90deg,rgba(20,30,60,.85),rgba(30,18,55,.85));
    border:1px solid var(--neon-pur);border-radius:10px;text-align:center;
    box-shadow:0 0 16px rgba(155,107,255,.25);transition:.25s;transform:translateY(8px);opacity:0;}
  .choice.in{transform:translateY(0);opacity:1;}
  .choice:hover{border-color:var(--neon-cyan);background:linear-gradient(90deg,rgba(30,60,90,.95),rgba(50,30,80,.95));
    box-shadow:0 0 26px rgba(52,245,255,.5);transform:scale(1.025);}
  .choice .tag{font-family:'Orbitron';font-size:11px;color:var(--neon-cyan);opacity:.8;margin-right:8px;}

  /* ===== Top bar controls ===== */
  #bar{position:absolute;top:10px;right:12px;display:flex;gap:8px;pointer-events:auto;z-index:30;}
  .btn{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:1px;color:var(--neon-cyan);
    background:rgba(8,14,30,.7);border:1px solid var(--panelbd);border-radius:8px;
    padding:7px 11px;cursor:pointer;transition:.2s;user-select:none;}
  .btn:hover{background:rgba(20,40,70,.9);box-shadow:0 0 14px rgba(52,245,255,.4);color:#fff;}
  .btn.on{background:linear-gradient(90deg,var(--neon-cyan),var(--neon-pur));color:#04121a;}

  /* chapter title card */
  #chapter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(10,16,40,.6),rgba(2,3,9,.96));
    opacity:0;pointer-events:none;transition:opacity .8s;z-index:25;}
  #chapter.show{opacity:1;}
  #chapNo{font-family:'Orbitron';color:var(--neon-mag);letter-spacing:6px;font-size:clamp(12px,1.4vw,18px);
    text-shadow:0 0 18px var(--neon-mag);}
  #chapTitle{font-family:'Noto Serif KR';font-weight:900;font-size:clamp(26px,4vw,56px);margin-top:14px;
    text-shadow:0 0 30px rgba(52,245,255,.4);}

  /* ===== Title screen ===== */
  #title{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;
    background:radial-gradient(circle at 50% 42%,rgba(6,10,26,.55),rgba(2,3,9,.93) 75%);}
  #tLogo{font-family:'Noto Serif KR';font-weight:900;font-size:clamp(40px,7vw,104px);line-height:1;
    background:linear-gradient(120deg,var(--neon-cyan),var(--neon-pur) 50%,var(--neon-mag));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 30px rgba(52,245,255,.35));letter-spacing:2px;}
  #tSub{font-family:'Orbitron';letter-spacing:8px;color:var(--neon-cyan);margin-top:18px;
    font-size:clamp(11px,1.6vw,20px);opacity:.85;}
  #tMenu{margin-top:46px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:2;}
  .tBtn{font-family:'Orbitron';font-size:clamp(13px,1.5vw,18px);letter-spacing:2px;
    color:var(--ink);background:rgba(10,16,36,.6);border:1px solid var(--neon-cyan);
    border-radius:30px;padding:13px 46px;cursor:pointer;transition:.25s;min-width:220px;}
  .tBtn:hover{background:linear-gradient(90deg,var(--neon-cyan),var(--neon-pur));color:#04121a;
    box-shadow:0 0 28px rgba(52,245,255,.6);transform:scale(1.04);}
  #tCredit{position:absolute;bottom:18px;font-family:'Orbitron';font-size:10px;letter-spacing:2px;
    color:rgba(160,200,255,.5);}

  /* backlog overlay */
  #backlog{position:absolute;inset:0;z-index:50;background:rgba(2,4,12,.95);display:none;
    flex-direction:column;padding:4% 6%;}
  #backlog.show{display:flex;}
  #blTitle{font-family:'Orbitron';color:var(--neon-cyan);letter-spacing:3px;margin-bottom:14px;}
  #blList{flex:1;overflow-y:auto;padding-right:10px;}
  .blItem{margin-bottom:14px;padding:10px 14px;border-left:3px solid var(--neon-pur);
    background:rgba(12,20,44,.5);border-radius:6px;}
  .blItem b{color:var(--neon-cyan);font-family:'Orbitron';font-size:12px;letter-spacing:1px;}
  .blItem p{margin:6px 0 0;font-family:'Noto Serif KR';line-height:1.6;}

  /* toast */
  #toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:35;
    font-family:'Orbitron';font-size:12px;letter-spacing:2px;color:#04121a;
    background:linear-gradient(90deg,var(--neon-cyan),var(--neon-pur));padding:9px 22px;border-radius:20px;
    opacity:0;transition:.4s;pointer-events:none;box-shadow:0 0 20px rgba(52,245,255,.5);}
  #toast.show{opacity:1;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--neon-pur);border-radius:4px;}

  @media (max-aspect-ratio:1/1){
    .charSlot{height:62%;bottom:23%;}
    #dbox{min-height:27%;bottom:2%;padding:16px 18px 18px;}
    #dtext{min-height:4em;}
    #bar{top:8px;right:8px;}
    .btn{padding:6px 8px;font-size:10px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <!-- art -->
    <div id="scene">
      <div id="bgLayer" class="fade"></div>
      <div id="fxLayer"></div>
      <div id="charLayer">
        <div id="charL" class="charSlot"></div>
        <div id="charC" class="charSlot"></div>
        <div id="charR" class="charSlot"></div>
      </div>
    </div>

    <!-- chapter card -->
    <div id="chapter"><div id="chapNo"></div><div id="chapTitle"></div></div>

    <!-- ui -->
    <div id="ui">
      <div id="bar">
        <div class="btn" id="bAuto">AUTO</div>
        <div class="btn" id="bSkip">SKIP</div>
        <div class="btn" id="bLog">LOG</div>
        <div class="btn" id="bSave">SAVE</div>
        <div class="btn" id="bLoad">LOAD</div>
        <div class="btn" id="bSnd">♪ ON</div>
        <div class="btn" id="bMenu">MENU</div>
      </div>
      <div id="choices"></div>
      <div id="dbox">
        <div id="namebox"></div>
        <div id="dtext"></div>
        <div id="hint">▼ CLICK</div>
      </div>
    </div>

    <!-- chapter title screen / menu -->
    <div id="title">
      <div id="tLogo">기억의 잔향</div>
      <div id="tSub">E C H O E S &nbsp; O F &nbsp; M E M O R Y</div>
      <div id="tMenu">
        <div class="tBtn" id="tStart">새 기억 추적</div>
        <div class="tBtn" id="tContinue">이어하기</div>
        <div class="tBtn" id="tAbout">사건 개요</div>
      </div>
      <div id="tCredit">NOVA KARMA · 2087 · MNEMONIC DETECTIVE</div>
    </div>

    <!-- backlog -->
    <div id="backlog">
      <div id="blTitle">▣ 기억 로그 (BACKLOG)</div>
      <div id="blList"></div>
      <div class="btn" id="blClose" style="align-self:center;margin-top:10px;">닫기</div>
    </div>

    <div id="toast"></div>
  </div>
</div>

<script>
/* ============================================================
   기억의 잔향 — SVG 비주얼노벨
   모든 아트는 SVG 도형. 스크립트는 ART(배경/캐릭터) + STORY(분기) + ENGINE.
   ============================================================ */

/* ---------- SVG 헬퍼 ---------- */
const VB = 'viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice"';
function rnd(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return()=>((h=Math.imul(h^(h>>>15),2246822507))>>>0)/4294967296;}

/* ============================================================
   배경 SVG 라이브러리  (모두 도형으로)
   ============================================================ */
const BG = {};

/* 공통: 별/입자 */
function dust(seed,n,col,op){const r=rnd(seed);let s='';for(let i=0;i<n;i++){const x=r()*1280,y=r()*460,rr=r()*1.6+.3;s+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${rr.toFixed(1)}" fill="${col}" opacity="${(op*r()).toFixed(2)}"/>`;}return s;}

/* 비 효과 */
function rain(seed,n){const r=rnd(seed);let s='';for(let i=0;i<n;i++){const x=r()*1320-20,y=r()*720,len=r()*30+18;s+=`<line x1="${x.toFixed(0)}" y1="${y.toFixed(0)}" x2="${(x-7).toFixed(0)}" y2="${(y+len).toFixed(0)}" stroke="rgba(120,200,255,.18)" stroke-width="1.2"/>`;}return s;}

/* 네온 도시 거리 (비 내리는 밤) */
BG.street = ()=>`<svg ${VB} xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="skyS" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0a0822"/><stop offset=".5" stop-color="#1a0b33"/><stop offset="1" stop-color="#2a0e3a"/>
 </linearGradient>
 <linearGradient id="grS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1248"/><stop offset="1" stop-color="#080612"/></linearGradient>
 <radialGradient id="haze" cx="50%" cy="78%" r="60%"><stop offset="0" stop-color="rgba(255,60,166,.30)"/><stop offset="1" stop-color="rgba(255,60,166,0)"/></radialGradient>
</defs>
<rect width="1280" height="720" fill="url(#skyS)"/>
${dust('s1',80,'#9fd8ff',.8)}
<!-- skyline silhouettes -->
<g opacity=".95">
 <polygon points="0,360 0,720 120,720 120,300 160,300 160,720 250,720 250,250 300,250 300,720 0,720" fill="#0c0a22"/>
 <rect x="60" y="320" width="14" height="20" fill="#34f5ff" opacity=".8"/><rect x="90" y="360" width="14" height="20" fill="#ff3ca6" opacity=".7"/>
 <rect x="180" y="280" width="12" height="18" fill="#34f5ff" opacity=".7"/><rect x="210" y="330" width="12" height="18" fill="#ffb347" opacity=".7"/>
 <polygon points="980,720 980,200 1030,180 1080,200 1080,720" fill="#0c0a22"/>
 <polygon points="1100,720 1100,140 1280,90 1280,720" fill="#0a0820"/>
 <rect x="1130" y="200" width="16" height="22" fill="#34f5ff" opacity=".8"/><rect x="1180" y="260" width="16" height="22" fill="#ff3ca6" opacity=".7"/>
 <rect x="1130" y="320" width="16" height="22" fill="#9b6bff" opacity=".7"/><rect x="1210" y="180" width="16" height="22" fill="#ffb347" opacity=".7"/>
</g>
<rect width="1280" height="720" fill="url(#haze)"/>
<!-- mid neon signs -->
<g font-family="Orbitron" font-weight="700">
 <rect x="330" y="240" width="120" height="70" rx="6" fill="none" stroke="#ff3ca6" stroke-width="3" opacity=".9"/>
 <text x="390" y="285" fill="#ff3ca6" font-size="34" text-anchor="middle" opacity=".95">夢</text>
 <rect x="820" y="210" width="60" height="150" rx="6" fill="none" stroke="#34f5ff" stroke-width="3" opacity=".85"/>
 <text x="850" y="255" fill="#34f5ff" font-size="26" text-anchor="middle">記</text>
 <text x="850" y="300" fill="#34f5ff" font-size="26" text-anchor="middle">憶</text>
 <text x="850" y="345" fill="#34f5ff" font-size="26" text-anchor="middle">店</text>
</g>
<!-- street ground & reflections -->
<polygon points="0,520 1280,520 1280,720 0,720" fill="url(#grS)"/>
<rect x="0" y="520" width="1280" height="4" fill="#ff3ca6" opacity=".4"/>
<g opacity=".22">
 <rect x="380" y="540" width="90" height="120" fill="#ff3ca6"/><rect x="835" y="540" width="40" height="120" fill="#34f5ff"/>
</g>
<!-- puddle highlight -->
<ellipse cx="640" cy="660" rx="520" ry="40" fill="rgba(52,245,255,.08)"/>
${rain('rn',140)}
<rect width="1280" height="720" fill="rgba(10,4,30,.10)"/>
</svg>`;

/* 탐정 사무실 (어둡고 네온 새는) */
BG.office = ()=>`<svg ${VB} xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13182c"/><stop offset="1" stop-color="#070912"/></linearGradient>
 <linearGradient id="winG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1450"/><stop offset="1" stop-color="#0c1030"/></linearGradient>
</defs>
<rect width="1280" height="720" fill="url(#wall)"/>
<!-- window with city -->
<rect x="760" y="60" width="440" height="420" fill="url(#winG)"/>
<g opacity=".9">${dust('o1',40,'#7fd8ff',.7)}
 <polygon points="760,300 760,480 900,480 900,250 940,250 940,480 1080,480 1080,200 1200,200 1200,480 760,480" fill="#0a0c22"/>
 <rect x="820" y="320" width="10" height="14" fill="#ff3ca6" opacity=".8"/><rect x="1000" y="260" width="10" height="14" fill="#34f5ff" opacity=".8"/>
 <rect x="1120" y="240" width="10" height="14" fill="#ffb347" opacity=".8"/>
</g>
<!-- window frame -->
<rect x="760" y="60" width="440" height="420" fill="none" stroke="#1c2440" stroke-width="10"/>
<line x1="980" y1="60" x2="980" y2="480" stroke="#1c2440" stroke-width="6"/>
<line x1="760" y1="270" x2="1200" y2="270" stroke="#1c2440" stroke-width="6"/>
<!-- venetian neon stripes -->
<g opacity=".10">${Array.from({length:9},(_,i)=>`<rect x="760" y="${70+i*46}" width="440" height="10" fill="#ff3ca6"/>`).join('')}</g>
<!-- desk -->
<rect x="60" y="520" width="620" height="30" rx="4" fill="#221a14"/>
<rect x="60" y="550" width="620" height="170" fill="#15100c"/>
<!-- desk lamp glow -->
<ellipse cx="180" cy="510" rx="130" ry="60" fill="rgba(255,179,71,.16)"/>
<rect x="150" y="430" width="14" height="90" fill="#3a3026"/>
<polygon points="120,430 210,430 195,400 135,400" fill="#ffb347" opacity=".9"/>
<circle cx="165" cy="430" r="8" fill="#fff4d0"/>
<!-- holographic case file -->
<g opacity=".85">
 <rect x="420" y="430" width="160" height="92" rx="6" fill="rgba(52,245,255,.08)" stroke="#34f5ff" stroke-width="1.5"/>
 <line x1="435" y1="455" x2="560" y2="455" stroke="#34f5ff" stroke-width="2" opacity=".6"/>
 <line x1="435" y1="475" x2="540" y2="475" stroke="#34f5ff" stroke-width="2" opacity=".5"/>
 <line x1="435" y1="495" x2="560" y2="495" stroke="#34f5ff" stroke-width="2" opacity=".4"/>
 <circle cx="500" cy="410" r="3" fill="#34f5ff"/>
</g>
<!-- coffee mug -->
<rect x="300" y="492" width="34" height="30" rx="4" fill="#2a2018"/><path d="M334 498 q14 0 14 12 q0 12 -14 12" fill="none" stroke="#2a2018" stroke-width="4"/>
<rect width="1280" height="720" fill="rgba(8,6,20,.18)"/>
</svg>`;

/* 기억 공간 (추상적 데이터 보이드) */
BG.memory = (tint='#34f5ff')=>`<svg ${VB} xmlns="http://www.w3.org/2000/svg">
<defs>
 <radialGradient id="void" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="${tint}" stop-opacity=".18"/><stop offset=".6" stop-color="#0a0820"/><stop offset="1" stop-color="#02030a"/></radialGradient>
</defs>
<rect width="1280" height="720" fill="#02030a"/>
<rect width="1280" height="720" fill="url(#void)"/>
<!-- floating fragment shards -->
<g opacity=".8">
${(()=>{const r=rnd('mem'+tint);let s='';for(let i=0;i<26;i++){const x=r()*1280,y=r()*620+40,w=r()*60+20,rot=r()*60-30;s+=`<g transform="translate(${x.toFixed(0)},${y.toFixed(0)}) rotate(${rot.toFixed(0)})"><rect x="0" y="0" width="${w.toFixed(0)}" height="${(w*.62).toFixed(0)}" fill="none" stroke="${tint}" stroke-width="1.4" opacity="${(.25+r()*.55).toFixed(2)}"/></g>`;}return s;})()}
</g>
<!-- grid floor (perspective) -->
<g stroke="${tint}" stroke-width="1" opacity=".35">
${Array.from({length:14},(_,i)=>{const y=560+i*i*1.0;return `<line x1="0" y1="${y}" x2="1280" y2="${y}"/>`;}).join('')}
${Array.from({length:17},(_,i)=>{const x=i*80;return `<line x1="${x}" y1="560" x2="${(x-(x-640)*1.6)}" y2="720"/>`;}).join('')}
</g>
${dust('mv',120,tint,.9)}
<!-- central core -->
<circle cx="640" cy="320" r="60" fill="none" stroke="${tint}" stroke-width="2" opacity=".5"/>
<circle cx="640" cy="320" r="90" fill="none" stroke="${tint}" stroke-width="1" opacity=".3"/>
<circle cx="640" cy="320" r="30" fill="${tint}" opacity=".25"/>
</svg>`;

/* 녹스 코프 기업 타워 로비 (차갑고 흰) */
BG.nox = ()=>`<svg ${VB} xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="noxBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1424"/><stop offset="1" stop-color="#040810"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10182e"/><stop offset="1" stop-color="#05080f"/></linearGradient>
</defs>
<rect width="1280" height="720" fill="url(#noxBg)"/>
<!-- huge logo -->
<g opacity=".9">
 <circle cx="640" cy="200" r="86" fill="none" stroke="#9b6bff" stroke-width="3"/>

/* ============================================================
   캐릭터 SVG 라이브러리 — 표정 파라미터로 변형
   좌표계: viewBox 0 0 400 720 (반신 포트레이트)
   exp(표정): 'neutral'|'happy'|'sad'|'angry'|'surprise'|'smirk'|'fear'|'cry'
   ============================================================ */
const CV='viewBox="0 0 400 720" preserveAspectRatio="xMidYMax meet"';

/* 눈/입을 표정에 맞춰 생성하는 공통 얼굴 부품 */
function eyes(exp,cx1,cx2,cy,col){
  const e=(x)=>{
    switch(exp){
      case 'happy': case 'smirk': return `<path d="M${x-13} ${cy} q13 -12 26 0" fill="none" stroke="#1a1020" stroke-width="3.5" stroke-linecap="round"/>`;
      case 'surprise': case 'fear': return `<circle cx="${x}" cy="${cy}" r="11" fill="#fff"/><circle cx="${x}" cy="${cy}" r="6" fill="${col}"/><circle cx="${x}" cy="${cy}" r="2.5" fill="#0a0612"/>`;
      case 'angry': return `<path d="M${x-13} ${cy-5} L${x+13} ${cy+2}" stroke="#1a1020" stroke-width="2.5" stroke-linecap="round" fill="none"/><ellipse cx="${x}" cy="${cy+3}" rx="9" ry="8" fill="#fff"/><circle cx="${x+1}" cy="${cy+4}" r="5" fill="${col}"/><circle cx="${x+1}" cy="${cy+4}" r="2" fill="#0a0612"/>`;
      case 'sad': case 'cry': return `<path d="M${x-12} ${cy-2} q12 6 24 0" fill="none" stroke="#1a1020" stroke-width="2"/><ellipse cx="${x}" cy="${cy+4}" rx="9" ry="9" fill="#fff"/><circle cx="${x}" cy="${cy+6}" r="5" fill="${col}"/><circle cx="${x}" cy="${cy+6}" r="2" fill="#0a0612"/>`;
      default: return `<ellipse cx="${x}" cy="${cy}" rx="9.5" ry="11" fill="#fff"/><circle cx="${x}" cy="${cy+1}" r="5.5" fill="${col}"/><circle cx="${x}" cy="${cy+1}" r="2.3" fill="#0a0612"/><circle cx="${x-2}" cy="${cy-2}" r="1.6" fill="#fff"/>`;
    }
  };
  return e(cx1)+e(cx2);
}
function brows(exp,cx1,cx2,cy){
  const b=(x,m)=>{
    switch(exp){
      case 'angry': return `<path d="M${x-12} ${cy-3} L${x+12} ${cy+5}" stroke="#1a1020" stroke-width="4" stroke-linecap="round" transform="scale(${m},1)" transform-origin="${x} ${cy}"/>`;
      case 'sad': case 'cry': case 'fear': return `<path d="M${x-12} ${cy+4} L${x+12} ${cy-3}" stroke="#1a1020" stroke-width="3.5" stroke-linecap="round" transform="scale(${m},1)" transform-origin="${x} ${cy}"/>`;
      case 'surprise': return `<path d="M${x-11} ${cy-4} q11 -4 22 0" fill="none" stroke="#1a1020" stroke-width="3.5" stroke-linecap="round"/>`;
      default: return `<path d="M${x-12} ${cy} q12 -4 24 0" fill="none" stroke="#1a1020" stroke-width="3.5" stroke-linecap="round"/>`;
    }
  };
  return b(cx1,1)+b(cx2,1);
}
function mouth(exp,cx,cy){
  switch(exp){
    case 'happy': return `<path d="M${cx-16} ${cy} q16 18 32 0" fill="#5a1f2e" stroke="#1a1020" stroke-width="2"/>`;
    case 'smirk': return `<path d="M${cx-14} ${cy+2} q16 8 28 -6" fill="none" stroke="#1a1020" stroke-width="3" stroke-linecap="round"/>`;
    case 'sad': return `<path d="M${cx-13} ${cy+4} q13 -10 26 0" fill="none" stroke="#1a1020" stroke-width="3" stroke-linecap="round"/>`;
    case 'cry': return `<path d="M${cx-13} ${cy+5} q13 -12 26 0" fill="#5a1f2e" stroke="#1a1020" stroke-width="2"/>`;
    case 'angry': return `<path d="M${cx-15} ${cy+4} q15 -8 30 0 q-15 12 -30 0" fill="#3a0f18" stroke="#1a1020" stroke-width="2"/>`;
    case 'surprise': case 'fear': return `<ellipse cx="${cx}" cy="${cy+3}" rx="9" ry="13" fill="#3a0f18" stroke="#1a1020" stroke-width="2"/>`;
    default: return `<path d="M${cx-12} ${cy} q12 5 24 0" fill="none" stroke="#1a1020" stroke-width="2.5" stroke-linecap="round"/>`;
  }
}
function tears(exp,cx1,cx2,cy){
  if(exp!=='cry') return '';
  return `<path d="M${cx1} ${cy+8} q-3 24 0 34" stroke="#7fd8ff" stroke-width="3" fill="none" opacity=".8"/><path d="M${cx2} ${cy+8} q3 24 0 34" stroke="#7fd8ff" stroke-width="3" fill="none" opacity=".8"/>`;
}

  lines:[
    {who:'narr', t:'사무실 문이 열렸다. 빗물 냄새와 함께 한 여자가 들어섰다.'},
    {who:'lira', cast:{C:['lira','sad']}, t:'…카이엔 탐정님, 맞으시죠?\n부탁이… 부탁이 있어서 왔어요.'},
    {who:'kaien', cast:{L:['lira','sad'],C:['kaien','neutral']}, pos:'C', t:'앉아요. 비 맞은 채로 서 있지 말고.\n이름은?'},
    {who:'lira', cast:{L:['lira','neutral'],C:['kaien','neutral']}, t:'리라예요. 제… 동생 세라의 기억을 찾아주세요.'},
    {who:'kaien', t:'동생의 기억? 그 애가 기억을 팔았나?'},
    {who:'lira', cast:{L:['lira','cry'],C:['kaien','neutral']}, t:'세라는… 한 달 전에 죽었어요.\n사고였다고 들었지만, 시신도, 기록도, 아무것도 없어요.'},
    {who:'lira', t:'마치 처음부터 존재하지 않았던 사람처럼.\n도시의 모든 시스템에서 세라가 지워졌어요.'},
    {who:'kaien', cast:{C:['kaien','angry']}, pos:'C', t:'…기록 말소. 그건 사고가 아냐.\n누군가 의도적으로 한 사람을 도시에서 도려낸 거다.'},
    {who:'lira', cast:{L:['lira','sad'],C:['kaien','neutral']}, t:'제게 남은 건 이것뿐이에요.'},
    {who:'narr', t:'리라가 손바닥 위에 작은 메모리 칩을 올려놓았다.\n표면에서 희미한 시안빛이 맥동했다.'},
    {who:'lira', t:'세라가 죽기 전날 제게 보낸 거예요.\n열어보려 했지만… 잠겨 있어요. 그리고 열면, 머리가 깨질 듯 아파요.'},
    {who:'kaien', cast:{C:['kaien','neutral']}, t:'(부서진 기억 조각이군. 봉인된 — 위험한 종류다.)'},
  ],
  choices:[
    {txt:'의뢰를 받는다. "찾아주지. 단, 진실이 아플 수도 있어."', tag:'[탐정]', to:'accept', set:{trust:1}},
    {txt:'경계한다. "잠긴 기억은 함정일 때가 많아. 누가 보냈는지부터."', tag:'[의심]', to:'wary', set:{caution:1}},
  ]
},

accept:{ bg:'office', music:'noir',
  lines:[
    {who:'lira', cast:{L:['lira','happy'],C:['kaien','smirk']}, t:'…고마워요. 정말로.'},
    {who:'kaien', pos:'C', t:'아직 고마워하긴 일러. 잠긴 조각에 잠수하려면\n네 동생의 기억 주파수가 필요하다. 칩을 이리.'},
    {who:'kaien', cast:{C:['kaien','neutral']}, t:'(이 시안빛… 어디서 본 것 같은데. 왜 이렇게 익숙하지?)'},
  ], next:'dive_prep' },

wary:{ bg:'office', music:'noir',
  lines:[
    {who:'kaien', cast:{L:['lira','surprise'],C:['kaien','angry']}, pos:'C', t:'잠긴 기억은 미끼다. 머릿속에 폭탄을 심을 수도 있어.\n증명해. 네가 정말 그 애 언니라는 걸.'},
    {who:'lira', cast:{L:['lira','cry'],C:['kaien','neutral']}, t:'…믿어주세요. 제겐 이 칩과, 흐릿한 기억밖에 안 남았어요.\n세라의 웃음소리조차 가물가물해요.'},
    {who:'kaien', t:'(거짓말하는 눈은 아니군. 하지만 이 도시에선 진심도 조작된다.)'},
    {who:'kaien', cast:{C:['kaien','smirk']}, t:'…좋아. 의심은 잠시 접어두지.\n대신 내 방식대로 한다. 칩을 이리.'},
  ], next:'dive_prep' },

dive_prep:{ bg:'office', music:'tense',
  lines:[
    {who:'kaien', cast:{C:['kaien','neutral']}, t:'잠수는 위험하다. 남의 기억은 미로고, 길을 잃으면\n내 정신이 그 안에 영영 갇힐 수도 있어.'},
    {who:'lira', cast:{L:['lira','fear'],C:['kaien','neutral']}, t:'…그렇게까지 위험한 거였어요? 그럼 하지 마세요, 차라리—'},
    {who:'kaien', cast:{C:['kaien','smirk']}, pos:'C', t:'됐어. 이게 내 일이니까.\n자, 의안에 동기화한다. 셋, 둘, 하나—'},
    {who:'sys', cast:{C:null}, glitch:true, t:'MEMRIA 잠수 시작… 주파수 동기화… 경고: 봉인 코드 감지.'},
  ], next:'mem1' },

/* ============ MEMORY DIVE 1 ============ */
mem1:{ bg:'memory', bgTint:'#34f5ff', music:'dream', chapter:{no:'CHAPTER 2',title:'세라의 미로'},
  lines:[
    {who:'narr', t:'세계가 산산이 부서지며 다시 조립됐다.\n카이엔은 데이터의 바다 한가운데 떠 있었다.'},
    {who:'kaien', cast:{C:['kaien','surprise']}, t:'…여긴 세라의 기억 속. 파편들이 떠다니는군.\n대부분 깨져 있어. 누가 일부러 부쉈다.'},
    {who:'sera', cast:{L:['kaien','neutral'],C:['sera','neutral']}, pos:'C', glitch:true, t:'…누, 구…세요? 여긴… 들어오면 안 돼요.'},
    {who:'kaien', cast:{L:['kaien','surprise'],C:['sera','neutral']}, pos:'L', t:'(저 아이… 세라인가. 기억 속에 남은 잔류 인격이군.)\n해치러 온 게 아니야. 네 언니 리라가 보냈어.'},
    {who:'sera', cast:{C:['sera','sad']}, pos:'C', t:'언니… 리라 언니… 아, 맞아. 언니가 있었지.\n근데 왜 자꾸 잊어버리지? 내 이름조차…'},
    {who:'kaien', t:'기억이 침식당하고 있어. 빨리 핵심을 찾아야 한다.\n세라, 네가 죽기 전 마지막으로 본 게 뭐지?'},
    {who:'sera', cast:{C:['sera','fear']}, glitch:true, t:'보라색… 빛. 안경. 그 사람이… "넌 위험한 걸 봤어"라고…\n그리고 하얀 방. 차가운—'},
  ],
  choices:[
    {txt:'하얀 방의 기억을 따라간다 (위험한 진실)', tag:'[추적]', to:'mem_nox', set:{truth:1}},
    {txt:'세라를 먼저 안정시킨다 (그녀를 지킨다)', tag:'[공감]', to:'mem_calm', set:{bond:1}},
  ]
},

mem_calm:{ bg:'memory', bgTint:'#9b6bff', music:'dream',
  lines:[
    {who:'kaien', cast:{C:['kaien','neutral']}, t:'괜찮아. 천천히. 무서운 건 안 봐도 돼.\n네가 행복했던 순간을 떠올려봐.'},
    {who:'sera', cast:{C:['sera','happy']}, pos:'C', t:'행복했던 거… 언니랑 옥상에서 별을 셌어요.\n진짜 별은 아니고, 광고판 불빛이었지만요.'},
    {who:'narr', t:'기억의 색이 보랏빛으로 따뜻해졌다.\n부서졌던 파편 몇 개가 제자리로 돌아왔다.'},
    {who:'sera', cast:{C:['sera','sad']}, t:'언니한테 전해줘요. 미안하다고.\n나 때문에… 언니가 위험해질 거예요. 그 사람들이 언니도 노려요.'},
    {who:'kaien', cast:{C:['kaien','angry']}, t:'그 사람들이 누구야?'},
    {who:'sera', cast:{C:['sera','fear']}, glitch:true, t:'녹스… 녹스 코프. 그들이 내 기억을 가져갔어요.\n내가 본 건… 그들의 비밀이었어요.'},
  ], next:'wake1' },

mem_nox:{ bg:'memory', bgTint:'#ff3ca6', music:'tense',
  lines:[
    {who:'kaien', cast:{C:['kaien','angry']}, t:'그 하얀 방으로 가자. 진실은 거기 있어.'},
    {who:'sera', cast:{C:['sera','fear']}, pos:'C', t:'안 돼요, 거긴… 거긴 너무 아파요—'},
    {who:'narr', t:'기억이 격렬하게 일그러졌다. 시안빛이 핏빛으로 번졌다.\n방어 코드가 카이엔을 공격했다.'},
    {who:'kaien', cast:{C:['kaien','fear']}, glitch:true, t:'크윽—! 방어벽이… 너무 강해. 이건 개인이 칠 수 있는 게 아냐.\n기업급 봉인이다!'},
    {who:'sys', glitch:true, t:'경고: 침입자 정신 붕괴 임박. 강제 사출 권고.'},
    {who:'narr', t:'쏟아지는 데이터 폭풍 속에서, 카이엔은 한 장면을 붙잡았다 —\n흰 가운의 남자, 보라색 안경, 그리고 수술대 위의 세라.'},
    {who:'sera', cast:{C:['sera','cry']}, t:'봤죠… 봤으니까, 이제 당신도 표적이에요.\n미안해요… 도망쳐요!'},
  ], next:'wake1' },

wake1:{ bg:'office', music:'noir',
  lines:[
    {who:'narr', t:'카이엔이 거칠게 숨을 몰아쉬며 현실로 돌아왔다.\n의안에서 시안빛이 불안하게 깜빡였다.'},
    {who:'lira', cast:{L:['lira','fear'],C:['kaien','sad']}, pos:'C', t:'탐정님! 코피가… 괜찮으세요?!'},
    {who:'kaien', cast:{C:['kaien','neutral']}, t:'…괜찮아. 봤어. 세라를. 그리고 그 애를 이렇게 만든 자들도.'},
    {who:'kaien', cast:{C:['kaien','angry']}, t:'녹스 코프. 도시 최대의 기억 기업.\n네 동생은 그들의 비밀을 봤고, 그 대가로 지워졌다.'},
    {who:'lira', cast:{L:['lira','cry'],C:['kaien','neutral']}, t:'녹스 코프를… 어떻게 상대해요. 그들은 도시 그 자체인데.'},
    {who:'kaien', cast:{C:['kaien','smirk']}, t:'방법은 있어. 다만 길이 두 갈래지.\n정공법이냐, 뒷골목이냐.'},
  ],
  choices:[
    {txt:'정보원 핀에게 연락한다 (뒷골목 루트)', tag:'[잠입]', to:'finn1', set:{path:'street'}},
    {txt:'녹스 코프에 정면으로 들어간다 (위장 잠입)', tag:'[대담]', to:'nox_enter', set:{path:'front'}},
  ]
},

/* ============ ROUTE A: 핀 / 뒷골목 ============ */
finn1:{ bg:'alley', music:'street', chapter:{no:'CHAPTER 3 · A',title:'데이터 도둑'},
  lines:[
    {who:'narr', t:'네온이 새는 뒷골목. 폐기된 단말기 더미 위에\n후드를 뒤집어쓴 소년이 앉아 있었다.'},
    {who:'finn', cast:{C:['finn','smirk']}, t:'어이, 의안 아저씨. 또 골치 아픈 일 들고 왔지?\n핀이 모르는 데이터는 이 도시에 없어.'},
    {who:'kaien', cast:{L:['kaien','neutral'],C:['finn','smirk']}, pos:'L', t:'녹스 코프 내부 서버. 5년 전부터의 기억 말소 기록.\n뚫을 수 있나?'},
    {who:'finn', cast:{C:['finn','surprise']}, pos:'C', t:'…미쳤어? 녹스를 뚫자고?\n그건 자살이야, 아저씨. …근데, 가격만 맞으면.'},
    {who:'finn', cast:{C:['finn','smirk']}, t:'마침 나도 녹스한테 갚을 빚이 있거든.\n걔네가 내 누나 기억도 훔쳐 갔어. 그래서—'},
    {who:'finn', cast:{C:['finn','neutral']}, t:'백도어 하나 깔아줄게. 대신 잠입은 아저씨가 해.\n나는 바깥에서 길을 열어줄 테니까.'},
  ],
  choices:[
    {txt:'핀을 믿고 협력한다', tag:'[동맹]', to:'finn_help', set:{ally:1}},
    {txt:'"네 누나 얘긴 거짓말이지." 떠본다', tag:'[간파]', to:'finn_test', set:{caution:1}},
  ]
},

finn_test:{ bg:'alley', music:'street',
  lines:[
    {who:'finn', cast:{C:['finn','angry']}, pos:'C', t:'…뭐? 누나가 거짓말이라고?'},
    {who:'finn', cast:{C:['finn','cry']}, t:'…아저씨, 함부로 말하지 마.\n누나 이름도 이젠 기억 안 나. 그게 어떤 기분인 줄 알아?'},
    {who:'kaien', cast:{L:['kaien','sad'],C:['finn','cry']}, pos:'L', t:'(…안다. 너무 잘 안다.)\n…미안. 너도 당했군. 도시 전체가 같은 병을 앓고 있어.'},
    {who:'finn', cast:{C:['finn','neutral']}, t:'…쳇. 진심이네. 좋아, 더 믿어주지.\n백도어, 공짜로 깔아줄게.'},

finn_help:{ bg:'alley', music:'tense',
  lines:[
    {who:'finn', cast:{C:['finn','smirk']}, pos:'C', t:'자, 이 칩을 녹스 본사 12층 메인 노드에 꽂아.\n그럼 5년치 말소 로그가 통째로 빠져나올 거야.'},

    {who:'finn', cast:{C:['finn','happy']}, t:'직원 ID 하나 위조해뒀어. ‘제이콥 린’. 야간 기술팀.\n표정 관리만 잘해, 아저씨. 그 의안 너무 튀니까 좀 가려.'},
    {who:'narr', t:'리라가 카이엔의 옷깃을 붙잡았다.'},

    {who:'lira', cast:{L:['lira','angry'],C:['kaien','surprise']}, pos:'L', t:'세라는 제 동생이에요! 더 이상 누가 절 지켜주길 기다리지 않아요.'},

},

nox_enter:{ bg:'nox', music:'cold', chapter:{no:'CHAPTER 3 · B',title:'사자의 입 속으로'},
  lines:[
    {who:'narr', t:'녹스 코프 본사 로비. 차갑고 흰 대리석.\n천장까지 솟은 보라색 로고가 두 사람을 내려다봤다.'},
    {who:'kaien', cast:{C:['kaien','neutral']}, t:'정면 돌파. 가장 위험하지만, 가장 빠른 길이지.\n나는 기억 감정 의뢰인으로 위장한다. 너는 내 보호자.'},
    {who:'lira', cast:{L:['lira','fear'],C:['kaien','neutral']}, pos:'C', t:'…심장이 터질 것 같아요.'},
    {who:'narr', t:'그때, 안내 데스크 너머에서 흰 가운의 남자가 다가왔다.\n보라색 안경이 차갑게 빛났다.'},
    {who:'nox', cast:{L:['kaien','surprise'],C:['nox','smirk']}, pos:'C', t:'어서 오십시오. 녹스 코프에 오신 걸 환영합니다.\n저는 이곳의 수석 연구원, 녹스입니다.'},
    {who:'nox', cast:{C:['nox','neutral']}, t:'기억 감정이라… 그런데 손님,\n그쪽 의안의 주파수가 무척… 흥미롭군요. 어디서 받으셨죠?'},
    {who:'kaien', cast:{L:['kaien','angry'],C:['nox','smirk']}, pos:'L', t:'(이 자… 처음부터 날 알아봤다. 함정인가.)\n…사고로요. 기억은 안 납니다.'},
    {who:'nox', cast:{C:['nox','smirk']}, t:'기억이 안 난다. 후후, 이 도시에서 가장 흔한 병이죠.\n…그리고 우리가 가장 잘 다루는 병이기도 합니다.'},
  ],
  choices:[
    {txt:'위장을 유지하며 정보를 캔다', tag:'[연기]', to:'nox_talk', set:{withLira:1}},
    {txt:'정체를 밝히고 정면 추궁한다', tag:'[돌격]', to:'nox_confront_early', set:{reckless:1, withLira:1}},
  ]
},

nox_talk:{ bg:'nox', music:'cold',
  lines:[
    {who:'kaien', cast:{L:['nox','neutral'],C:['kaien','smirk']}, pos:'C', t:'그쪽이야말로 흥미롭군요, 박사. 한 달 전,\n‘세라’라는 이름의 기억을 다루셨다던데.'},
    {who:'nox', cast:{L:['kaien','smirk'],C:['nox','angry']}, pos:'C', glitch:true, t:'…(미소가 굳었다) …그 이름을 어디서.'},
    {who:'nox', cast:{C:['nox','smirk']}, t:'후후. 좋습니다. 가면놀이는 그만하죠, 카이엔 탐정.\n그래요, 당신을 기다리고 있었습니다. 5년 동안.'},
    {who:'kaien', cast:{L:['nox','smirk'],C:['kaien','surprise']}, pos:'C', t:'5년…?'},

nox_confront_early:{ bg:'nox', music:'tense',

/* ============================================================
   WebAudio — 분위기 음악/효과 (절차적, 파일 없음)
   ============================================================ */
const Audio2 = (()=>{
  let ctx=null, master=null, on=false, nodes=[], cur=null;
  function init(){ if(ctx) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=0.0; master.connect(ctx.destination); }
  function setOn(v){ on=v; if(!ctx) return; master.gain.linearRampToValueAtTime(v?0.5:0.0, ctx.currentTime+0.6); }
  function clear(){ nodes.forEach(n=>{try{n.stop?n.stop():n.disconnect();}catch(e){}}); nodes=[]; }
  // 분위기 패드: 음계/속도가 트랙마다 다름
  const TRACKS = {
    rain:{root:110,scale:[0,3,7,10],lp:600,rate:.5,col:.15},
    noir:{root:98,scale:[0,3,5,7,10],lp:800,rate:.4,col:.2},
    tense:{root:73,scale:[0,1,5,6],lp:500,rate:.7,col:.25},
    dream:{root:130,scale:[0,2,4,7,9],lp:1400,rate:.3,col:.18},
    street:{root:110,scale:[0,3,7],lp:1000,rate:.9,col:.22},
    cold:{root:87,scale:[0,2,5,7],lp:700,rate:.35,col:.16},
    reveal:{root:65,scale:[0,3,7,10,12],lp:900,rate:.45,col:.22},
    climax:{root:73,scale:[0,3,5,7,10],lp:1600,rate:.9,col:.3},
    hope:{root:146,scale:[0,4,7,11],lp:1800,rate:.4,col:.2},
    sad:{root:82,scale:[0,3,5,8],lp:600,rate:.32,col:.18},
    bitter:{root:98,scale:[0,2,3,7],lp:700,rate:.36,col:.18},
    sacrifice:{root:65,scale:[0,5,7,12],lp:1000,rate:.4,col:.24},
  };
  function play(name){ if(!ctx) return; if(cur===name) return; cur=name; clear();
    const t=TRACKS[name]||TRACKS.noir;
    // drone pad: 3 detuned saws -> lowpass
    const pad=ctx.createGain(); pad.gain.value=t.col; const lp=ctx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=t.lp; pad.connect(lp); lp.connect(master);
    [0,.2,-.18].forEach((d,i)=>{ const o=ctx.createOscillator(); o.type=i===0?'sine':'sawtooth';
      o.frequency.value=t.root*(i===2?2:1)+d; const g=ctx.createGain(); g.gain.value=i===0?.5:.18;
      o.connect(g); g.connect(pad); o.start(); nodes.push(o); });
    // slow LFO on filter
    const lfo=ctx.createOscillator(); lfo.frequency.value=0.07; const lg=ctx.createGain(); lg.gain.value=t.lp*.4;
    lfo.connect(lg); lg.connect(lp.frequency); lfo.start(); nodes.push(lfo);
    // arpeggio loop
    let step=0; const interval=setInterval(()=>{ if(!ctx) return;
      const semi=t.scale[step%t.scale.length]+(step%(t.scale.length*2)>=t.scale.length?12:0);
      const f=t.root*2*Math.pow(2,semi/12);
      const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=f;
      const g=ctx.createGain(); g.gain.value=0; o.connect(g); g.connect(master);
      const now=ctx.currentTime; g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(.08,now+.02);
      g.gain.exponentialRampToValueAtTime(.0008,now+.9); o.start(now); o.stop(now+1.0);
      step++;
    }, 1000/t.rate); nodes.push({stop:()=>clearInterval(interval)});
  }
  function sfx(type){ if(!ctx||!on) return; const now=ctx.currentTime;
    if(type==='blip'){ const o=ctx.createOscillator(); const g=ctx.createGain(); o.type='square';
      o.frequency.setValueAtTime(880,now); o.frequency.exponentialRampToValueAtTime(1200,now+.04);
      g.gain.setValueAtTime(.05,now); g.gain.exponentialRampToValueAtTime(.0005,now+.07);
      o.connect(g); g.connect(master); o.start(now); o.stop(now+.08);
    } else if(type==='select'){ const o=ctx.createOscillator(); const g=ctx.createGain(); o.type='sine';
      o.frequency.setValueAtTime(523,now); o.frequency.exponentialRampToValueAtTime(784,now+.12);
      g.gain.setValueAtTime(.12,now); g.gain.exponentialRampToValueAtTime(.0005,now+.25);
      o.connect(g); g.connect(master); o.start(now); o.stop(now+.26);
    } else if(type==='glitch'){ const b=ctx.createBuffer(1,2048,ctx.sampleRate); const d=b.getChannelData(0);
      for(let i=0;i<2048;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/2048,2);
      const s=ctx.createBufferSource(); s.buffer=b; const g=ctx.createGain(); g.gain.value=.14;
      const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800;
      s.connect(bp); bp.connect(g); g.connect(master); s.start();
    } else if(type==='dive'){ const o=ctx.createOscillator(); const g=ctx.createGain(); o.type='sawtooth';
      o.frequency.setValueAtTime(1200,now); o.frequency.exponentialRampToValueAtTime(60,now+1.1);
      g.gain.setValueAtTime(.12,now); g.gain.exponentialRampToValueAtTime(.0005,now+1.2);
      const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2000;
      o.connect(lp); lp.connect(g); g.connect(master); o.start(now); o.stop(now+1.2);
    }
  }
  return { init, setOn, play, sfx, isOn:()=>on, resume:()=>{ if(ctx&&ctx.state==='suspended') ctx.resume(); } };
})();

/* ============================================================
   ENGINE
   ============================================================ */
const $=s=>document.querySelector(s);
const G = {
  node:null, line:0, typing:false, full:'', tIdx:0, tTimer:null,
  auto:false, skip:false, vars:{}, backlog:[], cast:{L:null,C:null,R:null},
  curBg:'', awaitChoice:false, started:false, soundReq:false,
};

function setBG(name,tint){ const key=name+(tint||''); if(key===G.curBg) return;
  const first = !G.curBg; G.curBg=key;
  const layer=$('#bgLayer'); const fn=BG[name]||BG.black;
  const html = name==='memory' ? fn(tint||'#34f5ff') : fn();
  if(first){ layer.innerHTML=html; layer.style.opacity=1; return; } // 첫 페인트는 즉시
  // crossfade via opacity
  layer.style.opacity=0;
  setTimeout(()=>{ layer.innerHTML=html; layer.style.opacity=1; },180);
}

function renderCast(){
  ['L','C','R'].forEach(p=>{
    const slot=$('#char'+p); const c=G.cast[p];
    if(!c){ slot.style.opacity=0; slot.innerHTML=''; return; }
    const [name,exp]=c; const fn=CHAR[name];
    if(!fn){ slot.style.opacity=0; return; }
    const sig=name+'|'+exp;
    if(slot.dataset.sig!==sig){ slot.innerHTML=fn(exp); slot.dataset.sig=sig; }
    slot.style.opacity=1;
  });
}

function highlight(pos){
  ['L','C','R'].forEach(p=>{
    const slot=$('#char'+p); if(!G.cast[p]){return;}
    slot.classList.toggle('dim', pos && p!==pos);
    slot.classList.toggle('pop', pos && p===pos);
  });
}

function resetChapterDOM(){
  const c=$('#chapter');
  if(!$('#chapNo')||!$('#chapTitle')){
    c.innerHTML='<div id="chapNo"></div><div id="chapTitle"></div>';
  }
  return c;
}
function showChapter(no,title,cb){
  const c=resetChapterDOM();
  $('#chapNo').textContent=no; $('#chapTitle').textContent=title;
  c.classList.add('show');
  setTimeout(()=>{ c.classList.remove('show'); setTimeout(cb,800); }, 1900);
}

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1600); }

/* 노드 진입 */
function goNode(id){
  // resolve dynamic branch
  if(id==='$totitle'){ toTitle(); return; }
  if(id && id.startsWith('$branch')){ id=resolveBranch(id); }
  const node=STORY[id]; if(!node){ console.warn('missing node',id); return; }
  G.node=id; G.line=0; G.awaitChoice=false;
  if(node.bg) setBG(node.bg,node.bgTint);
  if(node.music){ Audio2.play(node.music); }
  const run=()=>{ G.line=0; showLine(); };
  if(node.chapter){ showChapter(node.chapter.no,node.chapter.title,run); }
  else run();
}

function resolveBranch(tag){
  const v=G.vars;
  if(tag==='$branch_free'){ return (v.bond||v.trust>=2) ? 'END_FREE_BOND' : 'END_FREE_COLD'; }
  if(tag==='$branch_save'){ return 'END_SAVE'; }
  if(tag==='$branch_self'){ return 'END_SELF'; }
  return 'END_SAVE';
}

/* 한 줄 출력 */
function showLine(){
  const node=STORY[G.node]; if(!node) return;
  const lines=node.lines||[];
  if(G.line>=lines.length){ afterLines(node); return; }
  const ln=lines[G.line];
  // cast updates
  if(ln.cast){ Object.keys(ln.cast).forEach(p=>{ G.cast[p]=ln.cast[p]; }); renderCast(); }
  else renderCast();
  highlight(ln.pos);
  // speaker
  const spk=SPK[ln.who]||SPK.narr;
  const nb=$('#namebox');
  if(spk.name){ nb.style.display='inline-block'; nb.textContent=spk.name;
    nb.style.background=`linear-gradient(90deg,${spk.col},#9b6bff)`; }
  else nb.style.display='none';
  $('#dbox').classList.add('show');
  // backlog push
  G.backlog.push({name:spk.name, text:ln.t});
  if(G.backlog.length>200) G.backlog.shift();
  // glitch sfx
  if(ln.glitch) Audio2.sfx('glitch');
  typewrite(ln.t, ln.glitch);
}

function typewrite(text, glitch){
  const el=$('#dtext'); G.typing=true; G.full=text; G.tIdx=0;
  el.innerHTML=''; clearInterval(G.tTimer);
  const speed = G.skip?2:(G.auto?16:24);
  const caret='<span id="caret">▌</span>';
  G.tTimer=setInterval(()=>{
    G.tIdx++;
    let shown=text.slice(0,G.tIdx);
    // wrap glitch styling occasionally
    let html = glitch ? shown.replace(/([…—!?])/g,'<span class="glitch">$1</span>') : shown;
    el.innerHTML = html + (G.tIdx<text.length?caret:'');
    if(G.tIdx%3===0 && G.tIdx<text.length) Audio2.sfx('blip');
    if(G.tIdx>=text.length){ clearInterval(G.tTimer); G.typing=false; lineDone(); }
  }, speed);
}

function lineDone(){
  // auto/skip advance
  if(G.skip){ setTimeout(advance, 90); }
  else if(G.auto){ setTimeout(()=>{ if(G.auto&&!G.typing&&!G.awaitChoice) advance(); }, 1100); }
}

/* 클릭/진행 */
function advance(){
  if(G.awaitChoice) return;
  if(G.typing){ // skip typewriter -> show full
    clearInterval(G.tTimer); const ln=STORY[G.node].lines[G.line];
    $('#dtext').innerHTML = ln.glitch ? ln.t.replace(/([…—!?])/g,'<span class="glitch">$1</span>') : ln.t;
    G.typing=false; lineDone(); return;
  }
  G.line++; showLine();
}

/* 줄이 끝난 뒤: 선택지 or 다음 노드 */
function afterLines(node){
  if(node.end){ showEnding(node.end); return; }
  if(node.choices){ renderChoices(node.choices); return; }
  if(node.next){ goNode(node.next); return; }
}

function renderChoices(choices){
  G.awaitChoice=true; $('#dbox').classList.remove('show');
  const box=$('#choices'); box.innerHTML='';
  const avail=choices.filter(c=>!c.req || Object.keys(c.req).every(k=>(G.vars[k]||0)>=(c.req[k]||1)));
  avail.forEach((c,i)=>{
    const el=document.createElement('div'); el.className='choice';
    el.innerHTML=(c.tag?`<span class="tag">${c.tag}</span>`:'')+c.txt;
    el.onclick=(e)=>{ e.stopPropagation(); Audio2.sfx('select');
      if(c.set){ Object.keys(c.set).forEach(k=>{
        const v=c.set[k]; G.vars[k]=(typeof v==='number')?((G.vars[k]||0)+v):v; }); }
      box.innerHTML=''; G.awaitChoice=false; goNode(c.to);
    };
    box.appendChild(el);
    setTimeout(()=>el.classList.add('in'), 80*i+40);
  });
}

function showEnding(end){
  G.awaitChoice=true;            // 엔딩 중엔 진행 클릭 무력화
  $('#dbox').classList.remove('show'); $('#choices').innerHTML='';
  showChapter('— THE END —', end.title, ()=>{
    const c=$('#chapter'); c.classList.add('show');
    c.innerHTML=`<div id="chapNo" style="color:var(--neon-mag)">${end.title}</div>
      <div style="font-family:'Noto Serif KR';font-size:clamp(15px,1.8vw,24px);margin-top:18px;max-width:80%;text-align:center;line-height:1.7">${end.sub}</div>
      <div class="tBtn" id="endBack" style="margin-top:42px">타이틀로</div>`;
    document.getElementById('endBack').onclick=(e)=>{e.stopPropagation();
      c.classList.remove('show'); resetChapterDOM(); toTitle();};
  });
}

/* ============ TITLE / SAVE / BACKLOG ============ */
function toTitle(){ G.awaitChoice=true; $('#dbox').classList.remove('show'); $('#choices').innerHTML='';
  $('#title').style.display='flex'; setBG('street'); Audio2.play('rain'); }

function startGame(){ G.vars={}; G.backlog=[]; G.cast={L:null,C:null,R:null};
  $('#title').style.display='none'; G.awaitChoice=false; G.started=true;
  Audio2.sfx('dive'); goNode('start'); }

function saveGame(){
  const data={node:G.node,line:G.line,vars:G.vars,cast:G.cast,bg:STORY[G.node]?.bg,
    bgTint:STORY[G.node]?.bgTint,music:STORY[G.node]?.music,backlog:G.backlog.slice(-60)};
  localStorage.setItem('echoes_save',JSON.stringify(data)); toast('기억 저장됨 · SAVED');
}
function hasSave(){ return !!localStorage.getItem('echoes_save'); }
function loadGame(){
  const raw=localStorage.getItem('echoes_save'); if(!raw){ toast('저장된 기억 없음'); return; }
  try{ const d=JSON.parse(raw); G.vars=d.vars||{}; G.cast=d.cast||{L:null,C:null,R:null};
    G.backlog=d.backlog||[]; G.started=true; $('#title').style.display='none';
    if(d.bg) setBG(d.bg,d.bgTint); if(d.music) Audio2.play(d.music);
    renderCast(); G.node=d.node; G.line=d.line||0; G.awaitChoice=false;
    // re-show current line
    showLine(); toast('기억 복원됨 · LOADED');
  }catch(e){ toast('복원 실패'); }
}

function openBacklog(){ const list=$('#blList'); list.innerHTML='';
  G.backlog.forEach(b=>{ const d=document.createElement('div'); d.className='blItem';
    d.innerHTML=`<b>${b.name||'···'}</b><p>${b.text.replace(/</g,'&lt;')}</p>`; list.appendChild(d); });
  $('#backlog').classList.add('show'); list.scrollTop=list.scrollHeight; }

/* ============ WIRING ============ */
function ensureSound(){ if(!G.soundReq){ Audio2.init(); G.soundReq=true; } Audio2.resume(); }

window.addEventListener('DOMContentLoaded',()=>{
  // first paint: title + street bg immediately
  setBG('street');
  $('#tContinue').style.opacity = hasSave()?'1':'.4';

  // title menu
  $('#tStart').onclick=()=>{ ensureSound(); if(!Audio2.isOn()){ Audio2.setOn(true); $('#bSnd').textContent='♪ ON'; $('#bSnd').classList.add('on'); } startGame(); };
  $('#tContinue').onclick=()=>{ ensureSound(); if(!Audio2.isOn()){ Audio2.setOn(true); $('#bSnd').classList.add('on'); } if(hasSave()) loadGame(); else toast('저장된 기억 없음'); };
  $('#tAbout').onclick=()=>{ ensureSound(); $('#title').style.display='none'; G.started=true; G.awaitChoice=false; G.vars={}; G.cast={L:null,C:null,R:null}; goNode('about'); };

  // dialogue advance
  $('#dbox').onclick=()=>{ ensureSound(); advance(); };
  // also tap on scene area advances (but not on choices/bar)
  $('#scene').onclick=()=>{ if(G.started && !G.awaitChoice && $('#title').style.display==='none') { ensureSound(); advance(); } };

  // controls
  $('#bAuto').onclick=(e)=>{e.stopPropagation(); G.auto=!G.auto; e.target.classList.toggle('on',G.auto);
    toast(G.auto?'오토 모드 ON':'오토 모드 OFF'); if(G.auto&&!G.typing&&!G.awaitChoice) advance(); };
  $('#bSkip').onclick=(e)=>{e.stopPropagation(); G.skip=!G.skip; e.target.classList.toggle('on',G.skip);
    toast(G.skip?'스킵 ON':'스킵 OFF'); if(G.skip&&!G.awaitChoice) advance(); };
  $('#bLog').onclick=(e)=>{e.stopPropagation(); openBacklog();};
  $('#blClose').onclick=(e)=>{e.stopPropagation(); $('#backlog').classList.remove('show');};
  $('#bSave').onclick=(e)=>{e.stopPropagation(); if(G.started) saveGame(); else toast('게임을 먼저 시작하세요');};
  $('#bLoad').onclick=(e)=>{e.stopPropagation(); ensureSound(); loadGame();};
  $('#bSnd').onclick=(e)=>{e.stopPropagation(); ensureSound(); const v=!Audio2.isOn(); Audio2.setOn(v);
    e.target.textContent=v?'♪ ON':'♪ OFF'; e.target.classList.toggle('on',v); };
  $('#bMenu').onclick=(e)=>{e.stopPropagation(); toTitle(); };

  // keyboard
  window.addEventListener('keydown',(ev)=>{
    if($('#title').style.display!=='none') return;
    if(ev.code==='Space'||ev.code==='Enter'){ ev.preventDefault(); ensureSound(); advance(); }
    if(ev.key==='l'||ev.key==='L') openBacklog();
    if(ev.key==='Escape') $('#backlog').classList.remove('show');
  });
});
</script>
</body>
