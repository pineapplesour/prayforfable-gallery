<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>비 그치지 않는 교사(校舍)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#e9e6df; --ink-dim:#a59f95; --paper:#0b0d10;
  --box:rgba(8,10,13,.82); --box-line:rgba(150,170,190,.28);
  --accent:#7fb2c9; --blood:#9e2b25; --ghost:#bfe3e6;
  --choice:rgba(18,24,30,.86); --choice-hi:rgba(40,62,74,.95);
  --shadow:0 18px 60px rgba(0,0,0,.7);
  --ui:'Nanum Myeongjo',serif; --story:'Gowun Batang',serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--ui);color:var(--ink)}
#app{position:fixed;inset:0;background:#04060a}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#scene-svg{position:absolute;inset:0;width:100%;height:100%}
#scene-svg svg{width:100%;height:100%;display:block}

/* scene cross-fade layers */
.bglayer{position:absolute;inset:0;transition:opacity 1.1s ease}
.bglayer svg{width:100%;height:100%;display:block}

/* portrait */
#portrait{position:absolute;left:50%;bottom:clamp(150px,21vh,260px);transform:translateX(-50%);
  width:min(46vw,520px);max-height:64vh;pointer-events:none;
  filter:drop-shadow(0 22px 30px rgba(0,0,0,.65));transition:opacity .5s ease, transform .5s ease;opacity:0}
#portrait.show{opacity:1}
#portrait svg{width:100%;height:auto;display:block}

/* rain canvas */
#rain{position:absolute;inset:0;pointer-events:none}
/* lightning flash */
#flash{position:absolute;inset:0;background:#dfeefc;opacity:0;pointer-events:none;mix-blend-mode:screen}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 95% at 50% 38%,transparent 42%,rgba(0,0,0,.5) 78%,rgba(0,0,0,.86) 100%)}

/* dialogue */
#dbox{position:absolute;left:50%;bottom:clamp(14px,2.4vh,30px);transform:translateX(-50%);
  width:min(1180px,94vw);background:var(--box);border:1px solid var(--box-line);
  border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(7px);
  padding:clamp(16px,2vw,26px) clamp(20px,2.6vw,40px) clamp(18px,2.2vw,30px);
  min-height:clamp(150px,21vh,210px);cursor:pointer;z-index:20}
#speaker{font-family:var(--ui);font-weight:800;font-size:clamp(16px,2vw,23px);
  letter-spacing:.04em;margin-bottom:10px;display:inline-block;min-height:1em;
  color:var(--accent);text-shadow:0 1px 0 #000}
#speaker.ghost{color:var(--ghost)}
#speaker.me{color:#e6c98a}
#text{font-family:var(--story);font-size:clamp(16px,1.85vw,22px);line-height:1.85;
  color:var(--ink);min-height:3.4em;white-space:pre-wrap;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#text .em{color:var(--ghost);font-weight:700}
#next{position:absolute;right:18px;bottom:12px;width:16px;height:16px;opacity:.0;
  border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);
  transform:rotate(45deg);animation:bob 1.1s infinite}
#next.on{opacity:.85}
@keyframes bob{0%,100%{transform:rotate(45deg) translate(0,0)}50%{transform:rotate(45deg) translate(3px,3px)}}

/* choices */
#choices{position:absolute;left:50%;bottom:clamp(180px,26vh,300px);transform:translateX(-50%);
  width:min(820px,90vw);display:flex;flex-direction:column;gap:12px;z-index:25}
.choice{font-family:var(--ui);font-size:clamp(15px,1.7vw,19px);color:var(--ink);
  background:var(--choice);border:1px solid var(--box-line);border-radius:10px;
  padding:15px 22px;cursor:pointer;text-align:center;transition:.18s;backdrop-filter:blur(4px);
  box-shadow:0 8px 26px rgba(0,0,0,.5)}
.choice:hover,.choice:focus{background:var(--choice-hi);border-color:var(--accent);transform:translateY(-2px);outline:none}
.choice .tag{display:block;font-size:.72em;color:var(--ink-dim);margin-top:4px;letter-spacing:.04em}

/* top hud */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
  align-items:center;padding:12px clamp(14px,2vw,26px);z-index:30;
  background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent);pointer-events:none}
#chapter{font-size:clamp(12px,1.3vw,15px);color:var(--ink-dim);letter-spacing:.16em;
  text-shadow:0 1px 3px #000;font-weight:700}
#tools{display:flex;gap:8px;pointer-events:auto}
.tbtn{font-family:var(--ui);font-size:13px;color:var(--ink);background:rgba(10,14,18,.7);
  border:1px solid var(--box-line);border-radius:8px;padding:7px 13px;cursor:pointer;transition:.15s;letter-spacing:.04em}
.tbtn:hover{background:rgba(40,60,74,.9);border-color:var(--accent)}
.tbtn.active{background:var(--accent);color:#06121a;font-weight:700}

/* title screen */
#title{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;background:#02040700;transition:opacity 1s}
#title .bgwrap{position:absolute;inset:0;z-index:-1}
#title .bgwrap svg{width:100%;height:100%}
#title .veil{position:absolute;inset:0;background:radial-gradient(80% 70% at 50% 40%,transparent,rgba(0,0,0,.7))}
.tname{font-family:var(--ui);font-weight:800;font-size:clamp(34px,6.4vw,76px);
  letter-spacing:.06em;color:#eef3f6;text-shadow:0 2px 20px rgba(0,0,0,.9),0 0 30px rgba(120,180,210,.25);
  line-height:1.18}
.tname .b{color:var(--blood);text-shadow:0 0 24px rgba(158,43,37,.6)}
.tsub{margin-top:18px;font-family:var(--story);font-size:clamp(13px,1.7vw,19px);color:var(--ink-dim);letter-spacing:.22em}
#tmenu{margin-top:40px;display:flex;flex-direction:column;gap:14px;width:min(330px,80vw)}
.mbtn{font-family:var(--ui);font-size:clamp(16px,2vw,20px);color:var(--ink);
  background:rgba(8,12,16,.7);border:1px solid var(--box-line);border-radius:10px;
  padding:14px;cursor:pointer;transition:.18s;letter-spacing:.1em;backdrop-filter:blur(3px)}
.mbtn:hover{background:rgba(40,60,74,.92);border-color:var(--accent);transform:translateY(-2px)}
.mbtn:disabled{opacity:.38;cursor:default;transform:none}
.tcredit{position:absolute;bottom:16px;font-size:11px;color:#5c6068;letter-spacing:.18em}

/* overlay panels (backlog / route map) */
.panel{position:absolute;inset:0;z-index:75;background:rgba(2,4,7,.92);display:none;
  flex-direction:column;padding:clamp(20px,4vw,60px)}
.panel.open{display:flex}
.panel h2{font-family:var(--ui);font-weight:800;font-size:clamp(18px,2.4vw,26px);
  color:var(--accent);letter-spacing:.1em;margin-bottom:18px}
.panel .close{position:absolute;top:20px;right:24px}
#backlog-list{overflow-y:auto;flex:1;padding-right:10px}
.blrow{margin-bottom:16px;border-left:2px solid var(--box-line);padding-left:14px}
.blrow .sp{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:.04em}
.blrow .sp.ghost{color:var(--ghost)} .blrow .sp.me{color:#e6c98a}
.blrow .tx{font-family:var(--story);color:var(--ink);font-size:15px;line-height:1.7;margin-top:3px}

/* ending card */
#endcard{position:absolute;inset:0;z-index:55;display:none;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(1,2,4,.94);text-align:center;padding:30px}
#endcard.open{display:flex}
#endcard .etitle{font-family:var(--ui);font-weight:800;font-size:clamp(28px,5vw,56px);letter-spacing:.08em;margin-bottom:14px}
#endcard .edesc{font-family:var(--story);font-size:clamp(15px,2vw,20px);color:var(--ink-dim);max-width:640px;line-height:1.9}
#endcard .ebadge{margin:22px 0 28px;font-size:14px;color:var(--accent);letter-spacing:.2em}

#toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:70;
  background:rgba(8,12,16,.92);border:1px solid var(--box-line);border-radius:8px;
  padding:10px 20px;font-size:14px;color:var(--ink);opacity:0;transition:.4s;pointer-events:none;letter-spacing:.06em}
#toast.show{opacity:1}

@media (max-width:480px){
  #portrait{width:74vw;bottom:clamp(160px,23vh,260px)}
  #dbox{width:96vw;min-height:160px}
  #choices{bottom:clamp(176px,30vh,300px);width:94vw}
  #hud{flex-wrap:wrap}
  #text{line-height:1.7}
}
</style>
</head>
<body>
<div id="app">
  <div class="stage">
    <div id="scene-svg"></div>
    <canvas id="rain"></canvas>
    <div id="flash"></div>
    <div id="vignette"></div>
    <div id="portrait"></div>
  </div>

  <div id="hud">
    <div id="chapter">序章</div>
    <div id="tools">
      <button class="tbtn" id="t-auto">오토</button>
      <button class="tbtn" id="t-skip">스킵</button>
      <button class="tbtn" id="t-log">백로그</button>
      <button class="tbtn" id="t-save">세이브</button>
      <button class="tbtn" id="t-load">로드</button>
      <button class="tbtn" id="t-sound">소리 ♪</button>
      <button class="tbtn" id="t-title">타이틀</button>
    </div>
  </div>

  <div id="choices" style="display:none"></div>

  <div id="dbox">
    <div id="speaker"></div>
    <div id="text"></div>
    <div id="next"></div>
  </div>

  <!-- Title -->
  <div id="title">
    <div class="bgwrap" id="title-bg"></div>
    <div class="veil"></div>
    <div class="tname">비 그치지 않는 <span class="b">교사</span></div>
    <div class="tsub">校 舍 ─ THE RAIN NEVER STOPS</div>
    <div id="tmenu">
      <button class="mbtn" id="m-start">새로 시작</button>
      <button class="mbtn" id="m-continue" disabled>이어하기</button>
      <button class="mbtn" id="m-routes">경로 / 엔딩</button>
    </div>
    <div class="tcredit">SVG VISUAL NOVEL · 단일 HTML · 글·그림·코드 일인 제작</div>
  </div>

  <!-- Backlog -->
  <div class="panel" id="backlog">
    <h2>백로그</h2>
    <button class="tbtn close" data-close="backlog">닫기 ✕</button>
    <div id="backlog-list"></div>
  </div>

  <!-- Route map -->
  <div class="panel" id="routes">
    <h2>경로 · 엔딩</h2>
    <button class="tbtn close" data-close="routes">닫기 ✕</button>
    <div id="routes-body" style="overflow-y:auto;flex:1;font-family:var(--story);line-height:1.9;color:var(--ink-dim)"></div>
  </div>

  <!-- Ending -->
  <div id="endcard">
    <div class="ebadge" id="end-badge"></div>
    <div class="etitle" id="end-title"></div>
    <div class="edesc" id="end-desc"></div>
    <button class="mbtn" id="end-back" style="margin-top:30px;width:min(300px,80vw)">타이틀로</button>
  </div>

  <div id="toast"></div>
</div>

<script>
/* ============================================================
   비 그치지 않는 교사(校舍) — SVG 호러 비주얼노벨
   글 / SVG 아트 / 엔진 일인 제작. 외부 라이브러리 없음(폰트 CDN만).
   ============================================================ */
"use strict";
</script>
<script>
/* ===================== SVG ART : BACKGROUNDS ===================== */
/* 모든 그림은 SVG 기본 도형(rect/circle/path/polygon/그라데이션)으로만 그린다. */
const SVGNS='http://www.w3.org/2000/svg';
const VB='0 0 1280 720';

/* 공통 정의: 비, 안개, 음영 그라데이션 */
function defsCommon(){return `
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#0a1018"/><stop offset="1" stop-color="#070b11"/></linearGradient>
 <linearGradient id="skyStorm" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#161e2a"/><stop offset=".55" stop-color="#0d141d"/><stop offset="1" stop-color="#05080c"/></linearGradient>
 <radialGradient id="glow" cx="50%" cy="40%" r="60%">
   <stop offset="0" stop-color="#3a5566" stop-opacity=".5"/><stop offset="1" stop-color="#0a0f14" stop-opacity="0"/></radialGradient>
 <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#1a1c1d"/><stop offset="1" stop-color="#070808"/></linearGradient>
 <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#1f2a30"/><stop offset="1" stop-color="#101820"/></linearGradient>
 <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#9fb6c4" stop-opacity="0"/><stop offset="1" stop-color="#9fb6c4" stop-opacity=".10"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
 <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
</defs>`;}

/* 부유하는 안개 띠 */
function mistBand(y,o){return `<rect x="-50" y="${y}" width="1380" height="120" fill="url(#mist)" opacity="${o}" filter="url(#blur6)"/>`;}

/* 0. 교문 (정문, 비, 번개 실루엣) */
function bg_gate(){return `<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice">${defsCommon()}
 <rect width="1280" height="720" fill="url(#skyStorm)"/>
 <ellipse cx="640" cy="250" rx="640" ry="300" fill="url(#glow)" opacity=".5"/>
 <!-- far tree line -->
 <path d="M0 470 Q120 420 200 460 T420 450 T640 470 T880 450 T1100 465 T1280 455 V720 H0Z" fill="#0a1016"/>
 <!-- school building silhouette -->
 <rect x="180" y="250" width="920" height="240" fill="#0c1218"/>
 <rect x="180" y="250" width="920" height="22" fill="#070b10"/>
 <!-- windows grid (dark, a few faint) -->
 ${(()=>{let s='';for(let r=0;r<3;r++)for(let c=0;c<11;c++){let x=210+c*78,y=285+r*62;let lit=(r===1&&c===7);
   s+=`<rect x="${x}" y="${y}" width="46" height="40" rx="2" fill="${lit?'#243640':'#0a0f14'}" stroke="#05080b" stroke-width="2"/>`;
   if(lit)s+=`<rect x="${x}" y="${y}" width="46" height="40" fill="#3a5b68" opacity=".35"/>`;}return s;})()}
 <!-- gate pillars -->
 <rect x="120" y="430" width="46" height="200" fill="#10161c"/><rect x="116" y="420" width="54" height="18" fill="#1a242c"/>
 <rect x="1114" y="430" width="46" height="200" fill="#10161c"/><rect x="1110" y="420" width="54" height="18" fill="#1a242c"/>
 <!-- gate bars -->
 ${(()=>{let s='';for(let i=0;i<14;i++){let x=180+i*64;s+=`<rect x="${x}" y="440" width="6" height="190" fill="#0d1318"/>`;}return s;})()}
 <rect x="166" y="448" width="948" height="6" fill="#0d1318"/><rect x="166" y="600" width="948" height="6" fill="#0d1318"/>
 <!-- school name plate -->
 <rect x="560" y="455" width="160" height="44" rx="4" fill="#0a0e12" stroke="#2a3a44" stroke-width="2"/>
 <text x="640" y="484" text-anchor="middle" font-family="serif" font-size="22" fill="#5e7682" letter-spacing="6">瑞延高</text>
 <!-- ground wet -->
 <rect x="0" y="630" width="1280" height="90" fill="url(#floorG)"/>
 <rect x="0" y="630" width="1280" height="90" fill="#0a141c" opacity=".5"/>
 <ellipse cx="640" cy="700" rx="520" ry="26" fill="#12222c" opacity=".5"/>
 ${mistBand(560,.7)}${mistBand(610,.5)}
</svg>`;}

/* 1. 현관 / 신발장 로비 */
function bg_lobby(){return `<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice">${defsCommon()}
 <rect width="1280" height="720" fill="url(#wallG)"/>
 <!-- back wall + double door with rain glass -->
 <rect x="0" y="0" width="1280" height="470" fill="#141d24"/>
 <rect x="440" y="120" width="400" height="350" fill="#0c141a" stroke="#26343d" stroke-width="6"/>
 <rect x="450" y="130" width="180" height="250" fill="#1a2a33" opacity=".5"/>
 <rect x="650" y="130" width="180" height="250" fill="#1a2a33" opacity=".5"/>
 <line x1="640" y1="120" x2="640" y2="380" stroke="#26343d" stroke-width="6"/>
 <!-- rain streaks on glass -->
 ${(()=>{let s='';for(let i=0;i<26;i++){let x=455+Math.random()*370,y=135+Math.random()*230,h=20+Math.random()*60;s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+h}" stroke="#7fb2c9" stroke-width="1.2" opacity="${.1+Math.random()*.2}"/>`;}return s;})()}
 <!-- shoe lockers left/right -->
 ${(()=>{let s='';for(let side=0;side<2;side++){let bx=side?960:60;for(let r=0;r<5;r++)for(let c=0;c<4;c++){let x=bx+c*60,y=210+r*52;s+=`<rect x="${x}" y="${y}" width="54" height="46" fill="${(r+c)%3===0?'#0a0f13':'#15212a'}" stroke="#070b0e" stroke-width="2"/><circle cx="${x+44}" cy="${y+23}" r="2.5" fill="#3a4a52"/>`;}}return s;})()}
 <!-- floor -->
 <rect x="0" y="470" width="1280" height="250" fill="url(#floorG)"/>
 ${(()=>{let s='';for(let i=-2;i<14;i++){s+=`<line x1="${640+(i-6)*40-200}" y1="470" x2="${640+(i-6)*180}" y2="720" stroke="#0a0e11" stroke-width="2" opacity=".6"/>`;}return s;})()}
 <ellipse cx="640" cy="640" rx="280" ry="30" fill="#16262e" opacity=".45"/>
 ${mistBand(450,.5)}
</svg>`;}

/* 2. 복도 (1점 투시, 비 새는 천장, 깨진 형광등) */
function bg_corridor(flicker){return `<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice">${defsCommon()}
 <rect width="1280" height="720" fill="#06090c"/>
 <!-- vanishing perspective -->
 <polygon points="0,0 1280,0 760,290 520,290" fill="#101a21"/>
 <polygon points="0,720 1280,720 760,430 520,430" fill="url(#floorG)"/>
 <polygon points="0,0 0,720 520,430 520,290" fill="#15202a"/>
 <polygon points="1280,0 1280,720 760,430 760,290" fill="#15202a"/>
 <rect x="520" y="290" width="240" height="140" fill="#0a1218"/>
 <rect x="556" y="318" width="168" height="92" fill="#1b2c34" opacity=".5"/>
 <!-- doors along walls -->
 ${(()=>{let s='';for(let i=0;i<4;i++){let t=i/4;let lx=520*t,ly=290+140*t,lw=70-46*t,lh=150-90*t;
   s+=`<rect x="${lx+8}" y="${ly}" width="${lw*.5}" height="${lh}" fill="#0a0f13" stroke="#060a0d" stroke-width="2"/>`;
   s+=`<rect x="${1280-lx-8-lw*.5}" y="${ly}" width="${lw*.5}" height="${lh}" fill="#0a0f13" stroke="#060a0d" stroke-width="2"/>`;}return s;})()}
 <!-- ceiling lights -->
 <rect x="600" y="60" width="80" height="14" rx="3" fill="${flicker?'#243038':'#33505e'}" opacity="${flicker?.6:.9}"/>
 ${flicker?'':'<ellipse cx="640" cy="120" rx="220" ry="120" fill="url(#glow)" opacity=".4"/>'}
 <rect x="558" y="120" width="40" height="9" rx="2" fill="#1c2830" opacity=".6"/>
 <!-- water leak puddle center -->
 <ellipse cx="640" cy="560" rx="160" ry="26" fill="#13242d" opacity=".6"/>
 <ellipse cx="640" cy="560" rx="90" ry="14" fill="#1d3742" opacity=".5"/>
 <!-- drip -->
 <line x1="640" y1="120" x2="640" y2="540" stroke="#5e8a9c" stroke-width="1" opacity=".18"/>
 ${mistBand(380,.55)}${mistBand(470,.4)}
</svg>`;}

/* 3. 교실 (책상 줄, 칠판, 비 창문) */
function bg_classroom(){return `<svg viewBox="${VB}" preserveAspectRatio="xMidYMid slice">${defsCommon()}
 <rect width="1280" height="720" fill="url(#wallG)"/>
 <!-- windows right with rain -->
 <rect x="780" y="80" width="460" height="330" fill="#0c141a" stroke="#26343d" stroke-width="6"/>
 ${(()=>{let s='';for(let c=0;c<4;c++){let x=792+c*112;s+=`<rect x="${x}" y="90" width="100" height="310" fill="#1a2a33" opacity=".45"/><line x1="${x+100}" y1="90" x2="${x+100}" y2="400" stroke="#26343d" stroke-width="4"/>`;}return s;})()}
 ${(()=>{let s='';for(let i=0;i<30;i++){let x=790+Math.random()*440,y=92+Math.random()*300,h=18+Math.random()*54;s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+h}" stroke="#7fb2c9" stroke-width="1.1" opacity="${.08+Math.random()*.18}"/>`;}return s;})()}
 <!-- blackboard left -->
 <rect x="40" y="90" width="430" height="240" rx="6" fill="#0c1410" stroke="#2a3a30" stroke-width="8"/>
 <rect x="40" y="90" width="430" height="240" rx="6" fill="#16241c" opacity=".4"/>

<script>
/* ===================== SVG ART : CHARACTERS ===================== */
/* 캐릭터 = 머리/얼굴/표정/몸을 SVG 도형으로 조합. expr 인자로 표정 변형. */

function eyeSet(expr,cx,gy,gc){
 // expr: normal, sad, fear, smile, angry, closed, glow, empty, cry
 gc=gc||'#1a1410';
 const L=cx-32,R=cx+32;
 function eye(x){
   if(expr==='closed')return `<path d="M${x-15} ${gy} Q${x} ${gy+7} ${x+15} ${gy}" stroke="#2a221a" stroke-width="2.4" fill="none"/>`;
   if(expr==='empty')return `<ellipse cx="${x}" cy="${gy}" rx="13" ry="15" fill="#0a0c0e"/><circle cx="${x}" cy="${gy}" r="3" fill="#3a4a52" opacity=".5"/>`;
   if(expr==='glow')return `<ellipse cx="${x}" cy="${gy}" rx="13" ry="15" fill="#0c1416"/><circle cx="${x}" cy="${gy}" r="7" fill="#bfe3e6"/><circle cx="${x}" cy="${gy}" r="3" fill="#fff"/>`;
   let sclera=`<ellipse cx="${x}" cy="${gy}" rx="13" ry="${expr==='fear'?16:14}" fill="#f1ece2"/>`;
   let py=gy+(expr==='sad'?2:0);
   let pupil=`<circle cx="${x}" cy="${py}" r="6.5" fill="${gc}"/><circle cx="${x+2}" cy="${py-2}" r="2" fill="#fff" opacity=".8"/>`;
   let lid='';
   if(expr==='angry')lid=`<path d="M${x-15} ${gy-12} L${x+15} ${gy-6}" stroke="#2a221a" stroke-width="3"/>`;
   if(expr==='sad')lid=`<path d="M${x-15} ${gy-9} Q${x} ${gy-13} ${x+15} ${gy-8}" stroke="#2a221a" stroke-width="2" fill="none"/>`;
   if(expr==='fear')lid=`<path d="M${x-15} ${gy-13} Q${x} ${gy-17} ${x+15} ${gy-13}" stroke="#2a221a" stroke-width="2" fill="none"/>`;
   return sclera+pupil+lid;
 }
 let extra='';
 if(expr==='cry')extra=`<path d="M${L} ${gy+10} q-3 22 -1 40" stroke="#9fd6e0" stroke-width="3" fill="none" opacity=".8"/><path d="M${R} ${gy+10} q3 22 1 40" stroke="#9fd6e0" stroke-width="3" fill="none" opacity=".8"/>`;
 return eye(L)+eye(R)+extra;
}
function browSet(expr,cx,by){
 const L=cx-32,R=cx+32;
 if(expr==='angry')return `<path d="M${L-14} ${by-2} L${L+12} ${by+6}" stroke="#241a12" stroke-width="4" stroke-linecap="round"/><path d="M${R-12} ${by+6} L${R+14} ${by-2}" stroke="#241a12" stroke-width="4" stroke-linecap="round"/>`;
 if(expr==='sad'||expr==='fear'||expr==='cry')return `<path d="M${L-13} ${by+4} L${L+12} ${by-3}" stroke="#241a12" stroke-width="3.6" stroke-linecap="round"/><path d="M${R-12} ${by-3} L${R+13} ${by+4}" stroke="#241a12" stroke-width="3.6" stroke-linecap="round"/>`;
 return `<path d="M${L-13} ${by} L${L+13} ${by-2}" stroke="#241a12" stroke-width="3.6" stroke-linecap="round"/><path d="M${R-13} ${by-2} L${R+13} ${by}" stroke="#241a12" stroke-width="3.6" stroke-linecap="round"/>`;
}
function mouthSet(expr,cx,my){
 if(expr==='smile')return `<path d="M${cx-20} ${my} Q${cx} ${my+16} ${cx+20} ${my}" stroke="#7a3a36" stroke-width="3" fill="#5a2420"/>`;

 if(expr==='fear')return `<ellipse cx="${cx}" cy="${my+3}" rx="11" ry="14" fill="#3a1410"/><ellipse cx="${cx}" cy="${my+5}" rx="6" ry="8" fill="#5a2420"/>`;
 if(expr==='empty')return `<line x1="${cx-14}" y1="${my+4}" x2="${cx+14}" y2="${my+4}" stroke="#5a2a26" stroke-width="2.4"/>`;
 return `<path d="M${cx-16} ${my} Q${cx} ${my+8} ${cx+16} ${my}" stroke="#7a3a36" stroke-width="3" fill="none"/>`;
}

<script>
/* ===================== ENGINE ===================== */
"use strict";
const $=s=>document.querySelector(s);
const sceneEl=$('#scene-svg'), portraitEl=$('#portrait'), dboxEl=$('#dbox'),
      speakerEl=$('#speaker'), textEl=$('#text'), nextEl=$('#next'),
      choicesEl=$('#choices'), chapterEl=$('#chapter'),
      titleEl=$('#title'), flashEl=$('#flash');

const SAVE_KEY='rain_school_vn_save_v1';
const SEEN_KEY='rain_school_vn_seen_v1';

let state={node:null,line:0,flags:{},chapter:'序章',music:null,curBg:null,curChars:[]};
let auto=false, skip=false, soundOn=false, typing=false, typeTimer=null, autoTimer=null;
let endingShown=false, endTimer=null;
let backlog=[];

/* ---------- Scene rendering (cross-fade) ---------- */
let bgFront=null;
function setBackground(name,arg){
  if(state.curBg===name+(arg||'') && bgFront) return;
  state.curBg=name+(arg||'');
  const fn=BG[name]; if(!fn) return;
  const html = name==='corridor'?fn(arg==='flicker'): name==='void'?fn(arg): fn();
  const layer=document.createElement('div');
  layer.className='bglayer'; layer.style.opacity='0'; layer.innerHTML=html;
  sceneEl.appendChild(layer);
  // fade in
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{layer.style.opacity='1';});});
  const old=bgFront; bgFront=layer;
  if(old){ old.style.opacity='0'; setTimeout(()=>{ if(old.parentNode)old.parentNode.removeChild(old); },1200); }
}
function setPortrait(charName,expr){
  if(!charName){ portraitEl.classList.remove('show'); state.curChars=[]; return; }
  const fn=CHAR[charName]; if(!fn) return;
  portraitEl.innerHTML=fn(expr||'normal');
  portraitEl.classList.add('show');
}

/* ---------- Rain (canvas) ---------- */
const rainCv=$('#rain'); const rctx=rainCv.getContext('2d');
let drops=[], rainOn=true, rW=0, rH=0;
function resizeRain(){ rW=rainCv.width=window.innerWidth; rH=rainCv.height=window.innerHeight;
  drops=[]; const n=Math.floor(rW/6);
  for(let i=0;i<n;i++)drops.push({x:Math.random()*rW,y:Math.random()*rH,l:8+Math.random()*18,s:6+Math.random()*7,o:.12+Math.random()*.22});
}
function rainTick(){
  rctx.clearRect(0,0,rW,rH);
  if(rainOn){
    rctx.lineWidth=1.1;
    for(const d of drops){
      rctx.strokeStyle='rgba(150,190,210,'+d.o+')';
      rctx.beginPath(); rctx.moveTo(d.x,d.y); rctx.lineTo(d.x-1.5,d.y+d.l); rctx.stroke();
      d.y+=d.s*2; d.x-=0.4;
      if(d.y>rH){ d.y=-d.l; d.x=Math.random()*rW; }
    }
  }
  requestAnimationFrame(rainTick);
}
window.addEventListener('resize',resizeRain);
resizeRain(); rainTick();

/* ---------- Lightning flash ---------- */
let flashScheduled=false;
function scheduleLightning(){
  if(flashScheduled) return; flashScheduled=true;
  const loop=()=>{
    const delay=6000+Math.random()*9000;
    setTimeout(()=>{
      if(rainOn){ doFlash(); if(soundOn) playThunder(); }
      loop();
    },delay);
  };
  loop();
}
function doFlash(){
  flashEl.style.transition='none'; flashEl.style.opacity='0.0';
  requestAnimationFrame(()=>{ flashEl.style.transition='opacity 70ms'; flashEl.style.opacity='0.85';
    setTimeout(()=>{ flashEl.style.opacity='0.1'; setTimeout(()=>{ flashEl.style.opacity='0.6';
      setTimeout(()=>{ flashEl.style.transition='opacity 600ms'; flashEl.style.opacity='0'; },80); },70); },70); });
}
function flickerLights(){
  let c=0; const t=setInterval(()=>{ flashEl.style.transition='opacity 40ms';
    flashEl.style.opacity=(Math.random()<.5?'0.18':'0'); if(++c>10){clearInterval(t);flashEl.style.opacity='0';} },90);
}

/* ---------- WebAudio (atmosphere + sfx) ---------- */
let actx=null, ambGain=null, rainNoise=null, droneOsc=null;
function initAudio(){
  if(actx) return;
  actx=new (window.AudioContext||window.webkitAudioContext)();
  ambGain=actx.createGain(); ambGain.gain.value=0; ambGain.connect(actx.destination);
  // rain noise (filtered white)
  const bufSize=actx.sampleRate*2; const buf=actx.createBuffer(1,bufSize,actx.sampleRate);
  const data=buf.getChannelData(0); for(let i=0;i<bufSize;i++)data[i]=(Math.random()*2-1)*0.5;
  rainNoise=actx.createBufferSource(); rainNoise.buffer=buf; rainNoise.loop=true;
  const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1600;
  const hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=380;
  rainNoise.connect(hp); hp.connect(lp); lp.connect(ambGain);
  rainNoise.start();
  // low drone
  droneOsc=actx.createOscillator(); droneOsc.type='sine'; droneOsc.frequency.value=55;
  const dg=actx.createGain(); dg.gain.value=0.06; droneOsc.connect(dg); dg.connect(ambGain);
  droneOsc.start();
}
function setMusicMood(mood){
  if(!actx||!soundOn) return;
  state.music=mood;
  const g=ambGain.gain;
  if(mood==='fire'){ g.cancelScheduledValues(actx.currentTime); g.linearRampToValueAtTime(0.5,actx.currentTime+1); droneOsc.frequency.linearRampToValueAtTime(42,actx.currentTime+1); }
  else if(mood==='calm'){ g.linearRampToValueAtTime(0.16,actx.currentTime+2); droneOsc.frequency.linearRampToValueAtTime(98,actx.currentTime+2); }
  else { g.linearRampToValueAtTime(0.32,actx.currentTime+1.5); droneOsc.frequency.linearRampToValueAtTime(55,actx.currentTime+1.5); }
}
function playThunder(){
  if(!actx||!soundOn) return;
  const bufSize=actx.sampleRate*1.2; const buf=actx.createBuffer(1,bufSize,actx.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<bufSize;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,2);
  const src=actx.createBufferSource(); src.buffer=buf;
  const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=300;
  const g=actx.createGain(); g.gain.value=0.45; g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+1.1);
  src.connect(lp); lp.connect(g); g.connect(actx.destination); src.start();
}
function blip(freq){
  if(!actx||!soundOn) return;
  const o=actx.createOscillator(); const g=actx.createGain();
  o.type='triangle'; o.frequency.value=freq||520; g.gain.value=0.0;
  g.gain.linearRampToValueAtTime(0.05,actx.currentTime+0.005);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.08);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+0.1);
}

/* ---------- Typewriter ---------- */
function renderText(html){
  // html may contain <span class="em">; type plain chars but preserve markup at end
  textEl.innerHTML=''; nextEl.classList.remove('on');
  typing=true;
  const tmp=document.createElement('div'); tmp.innerHTML=html;
  const full=html;
  // We type by revealing characters of the HTML string but keeping tags intact.
  let i=0; const chars=[]; // tokenize into [text-char | tag]
  let buf=''; let inTag=false;
  for(const ch of full){ if(ch==='<'){inTag=true;buf=ch;} else if(ch==='>'){buf+=ch;chars.push({tag:true,v:buf});inTag=false;buf='';}
    else if(inTag){buf+=ch;} else {chars.push({tag:false,v:ch});} }
  let shown='';
  const speed=skip?0:(auto?16:26);
  function step(){
    if(i>=chars.length){ typing=false; nextEl.classList.add('on'); maybeAuto(); return; }
    const c=chars[i++]; shown+=c.v; textEl.innerHTML=shown;
    if(!c.tag && c.v.trim() && Math.random()<0.5) blip(440+Math.random()*120);
    if(c.tag){ step(); return; }
    if(speed===0){ step(); } else { typeTimer=setTimeout(step,speed); }
  }
  if(skip){ textEl.innerHTML=full; typing=false; nextEl.classList.add('on'); maybeAuto(); }
  else step();
}
function finishTyping(){
  if(typing){ clearTimeout(typeTimer); typing=false;
    const n=STORY[state.node]; const ln=n.lines[state.line];
    textEl.innerHTML=ln.t; nextEl.classList.add('on'); maybeAuto(); return true; }
  return false;
}

/* ---------- Core advance ---------- */
function startNode(key){
  const n=STORY[key]; if(!n){console.warn('no node',key);return;}
  if(!(n.end))endingShown=false;
  state.node=key; state.line=0;
  if(n.chapter){ state.chapter=n.chapter; chapterEl.textContent=n.chapter; }
  if(n.music){ setMusicMood(n.music); }
  applyNodeStage(n,0);
  showLine();
}
function applyNodeStage(n,idx){
  // background
  let bgArg=null;
  if(n.fx==='flicker') bgArg='flicker';
  if(n.bg==='void') bgArg= (state.flags.calm? '#0a0f16':'#04060a');
  setBackground(n.bg,bgArg);
  rainOn = !(n.bg==='fire'||n.bg==='classroom' && false); // rain visible most places
  if(n.bg==='fire'){ rainOn=false; } else { rainOn=true; }
  // characters declared at node level
  if(n.ch){ if(n.ch.length){ const c=n.ch[0]; setPortrait(c.show?c.char:null,c.expr); } else { setPortrait(null); } }
}
function showLine(){
  const n=STORY[state.node];
  const ln=n.lines?n.lines[state.line]:null;
  if(!ln){ afterLines(n); return; }
  // per-line fx
  if(ln.fx==='flash'||n.fx==='flash'){ doFlash(); if(soundOn)playThunder(); }
  if(ln.fx==='flicker'){ flickerLights(); }
  // per-line portrait override (char appears on a specific line via ch.show + who)
  if(ln.expr && state.curCharName){ setPortrait(state.curCharName,ln.expr); }
  // speaker
  let name=ln.name||SPK[ln.who]||'';
  if(ln.who==='Y'&&!ln.name) name=SPK.Y;
  speakerEl.textContent=name;
  speakerEl.className=''; if(ln.cls)speakerEl.classList.add(ln.cls);
  // if line has a character implied, ensure portrait
  if((ln.who==='Y'||ln.who==='Y2') && ln.expr){ state.curCharName='yunha'; setPortrait('yunha',ln.expr); }
  if(ln.who==='YY' && ln.expr){ state.curCharName='youngyunha'; setPortrait('youngyunha',ln.expr); }
  if(ln.who==='K' && ln.expr){ state.curCharName='keeper'; setPortrait('keeper',ln.expr); }
  if(ln.who==='D' && ln.expr){ /* protagonist not shown as portrait (first person) */ }
  // node-level portrait if specified for this character role
  if(n.ch&&n.ch.length&&n.ch[0].show){ state.curCharName=n.ch[0].char; }
  renderText(ln.t);
  pushBacklog(name,ln.t,ln.cls);
}
function pushBacklog(name,t,cls){ backlog.push({name,t,cls}); if(backlog.length>400)backlog.shift(); }

function advance(){
  if(choicesEl.style.display==='block') return;
  if(finishTyping()) return;
  const n=STORY[state.node];
  state.line++;
  if(n.lines && state.line<n.lines.length){ showLine(); }
  else afterLines(n);
}
function afterLines(n){
  // apply set flags
  if(n.set)Object.assign(state.flags,n.set);
  if(n.end){ if(!endingShown){ endingShown=true; showEnding(n); } return; }
  if(n.choice){ showChoices(n.choice); return; }
  if(n.next){ if(STORY[n.next].set)Object.assign(state.flags,STORY[n.next].set||{}); startNode(n.next); return; }
}

function showChoices(choice){
  choicesEl.innerHTML='';
  choicesEl.style.display='block';
  dboxEl.style.opacity='0.35';
  choice.options.forEach((o)=>{
    const b=document.createElement('button'); b.className='choice';
    b.innerHTML=o.t+(o.tag?`<span class="tag">— ${o.tag}</span>`:'');
    b.onclick=(e)=>{ e.stopPropagation(); blip(620);
      if(o.set)Object.assign(state.flags,o.set);
      choicesEl.style.display='none'; dboxEl.style.opacity='1';
      pushBacklog('▶ 선택', o.t, 'me');
      startNode(o.next); };
    choicesEl.appendChild(b);
  });
}

/* ---------- Ending ---------- */
function showEnding(n){
  setMusicMood(n.music||'calm');
  markSeen(n.end.badge);
  $('#end-badge').textContent=n.end.badge;
  $('#end-title').textContent=n.end.title;
  $('#end-desc').textContent=n.end.desc;
  $('#end-title').style.color = n.end.badge.includes('TRUE')?'#9fe0c0': n.end.badge.includes('BAD')?'#c87a72':'#cdb98a';
  clearTimeout(endTimer);
  endTimer=setTimeout(()=>{ $('#endcard').classList.add('open'); }, 600);
}

/* ---------- Auto / Skip ---------- */
function maybeAuto(){
  if(auto && !typing && choicesEl.style.display!=='block'){
    clearTimeout(autoTimer);
    autoTimer=setTimeout(()=>{ if(auto)advance(); }, 1400);
  }
  if(skip && choicesEl.style.display!=='block'){
    clearTimeout(autoTimer);
    autoTimer=setTimeout(()=>{ if(skip)advance(); }, 90);
  }
}

/* ---------- Seen / route tracking ---------- */
function markSeen(badge){ let seen=loadSeen(); seen[badge]=true; localStorage.setItem(SEEN_KEY,JSON.stringify(seen)); }
function loadSeen(){ try{return JSON.parse(localStorage.getItem(SEEN_KEY))||{};}catch(e){return {};} }

/* ---------- Save / Load ---------- */
function saveGame(){
  const data={node:state.node,line:state.line,flags:state.flags,chapter:state.chapter,backlog:backlog.slice(-120)};
  localStorage.setItem(SAVE_KEY,JSON.stringify(data));
  toast('저장되었습니다');
  $('#m-continue').disabled=false;
}
function hasSave(){ return !!localStorage.getItem(SAVE_KEY); }
function loadGame(){
  const raw=localStorage.getItem(SAVE_KEY); if(!raw){toast('저장된 기록이 없습니다');return false;}
  const d=JSON.parse(raw);
  hideTitle();
  state.flags=d.flags||{}; state.chapter=d.chapter||'序章'; backlog=d.backlog||[];
  chapterEl.textContent=state.chapter;
  startNode(d.node);
  // jump to line
  if(d.line){ for(let i=0;i<d.line;i++){ const n=STORY[state.node]; if(n.lines&&state.line<n.lines.length-1)state.line++; }
    showLine(); }
  toast('불러왔습니다');
  return true;
}

/* ---------- Toast ---------- */
let toastTimer=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600); }

/* ---------- Title control ---------- */
function showTitle(){
  // 엔딩 카드 / 모든 패널 / 선택지를 확실히 닫고 타이틀로
  clearTimeout(endTimer); endingShown=false;
  $('#endcard').classList.remove('open');
  document.querySelectorAll('.panel.open').forEach(p=>p.classList.remove('open'));
  choicesEl.style.display='none'; dboxEl.style.opacity='1';
  auto=false; skip=false;
  $('#t-auto').classList.remove('active'); $('#t-skip').classList.remove('active');
  clearTimeout(autoTimer);
  $('#title-bg').innerHTML=BG.gate();
  titleEl.style.display='flex'; titleEl.style.opacity='1';
  $('#m-continue').disabled=!hasSave();
  setPortrait(null);
}
function hideTitle(){
  titleEl.style.opacity='0';
  setTimeout(()=>{ titleEl.style.display='none'; },1000);
  if(soundOn) setMusicMood('rain');
}
function newGame(){ hideTitle(); state.flags={}; backlog=[]; startNode('start'); }

/* ---------- Backlog panel ---------- */
function openBacklog(){
  const list=$('#backlog-list'); list.innerHTML='';
  backlog.forEach(b=>{ const row=document.createElement('div'); row.className='blrow';
    row.innerHTML=`<div class="sp ${b.cls||''}">${b.name||'·'}</div><div class="tx">${b.t}</div>`;
    list.appendChild(row); });
  $('#backlog').classList.add('open');
  list.scrollTop=list.scrollHeight;
}

/* ---------- Routes panel ---------- */
function openRoutes(){
  const seen=loadSeen();
  const body=$('#routes-body');
  const ends=[
    ['TRUE ENDING','비, 그치다','진실을 직시하고 윤하를 보내준다. 비가 그친다.'],
    ['BITTER ENDING','나란한 빈자리','윤하 곁에 남기를 택한다. 비는 영원히 내린다.'],
    ['BAD ENDING','다시, 묻다','진실을 보고도 도망친다. 교가가 평생 따라온다.']
  ];
  body.innerHTML=`<p style="color:#cfd6dc;margin-bottom:14px">서연고 분교, 16년 전 화재. 죄책감에 봉인된 진실을 향해 — 당신의 선택이 결말을 가른다.</p>`+
    ends.map(e=>{ const got=seen[e[0]];
      return `<div style="margin-bottom:18px;border-left:2px solid ${got?'#7fb2c9':'#2a3640'};padding-left:14px">
        <div style="color:${got?'#7fb2c9':'#5a626a'};font-weight:700;letter-spacing:.1em">${e[0]} ${got?'✦ 도달함':'· 미도달'}</div>
        <div style="color:#cfd6dc;font-size:1.05em;margin:3px 0">${got?e[1]:'？？？'}</div>
        <div style="font-size:.92em">${got?e[2]:'엔딩에 도달하면 공개됩니다.'}</div></div>`;
    }).join('')+
    `<p style="margin-top:20px;font-size:.9em;color:#5a626a">갈림길: 관리인의 태도 → 복도/계단 경로 → 유령에 대한 반응(사죄/거부/침묵) → 그날의 진실 직면 → 마지막 선택(보내기/머무름/도피).</p>`;
  $('#routes').classList.add('open');
}

/* ---------- Event wiring ---------- */
dboxEl.addEventListener('click',()=>advance());
document.addEventListener('keydown',(e)=>{
  if(e.code==='Space'||e.code==='Enter'){ if(titleEl.style.display!=='none')return; e.preventDefault(); advance(); }
  if(e.code==='Escape'){ document.querySelectorAll('.panel.open').forEach(p=>p.classList.remove('open')); }
});
$('#t-auto').onclick=()=>{ auto=!auto; skip=false; $('#t-auto').classList.toggle('active',auto); $('#t-skip').classList.remove('active'); if(auto)maybeAuto(); };
$('#t-skip').onclick=()=>{ skip=!skip; auto=false; $('#t-skip').classList.toggle('active',skip); $('#t-auto').classList.remove('active'); if(skip)advance(); };
$('#t-log').onclick=openBacklog;
$('#t-save').onclick=saveGame;
$('#t-load').onclick=()=>loadGame();
$('#t-sound').onclick=()=>{ soundOn=!soundOn; $('#t-sound').classList.toggle('active',soundOn);
  if(soundOn){ initAudio(); if(actx.state==='suspended')actx.resume(); setMusicMood(state.music||'rain'); scheduleLightning(); $('#t-sound').textContent='소리 ♪ ON'; }
  else { if(ambGain)ambGain.gain.linearRampToValueAtTime(0,actx.currentTime+0.3); $('#t-sound').textContent='소리 ♪'; } };
$('#t-title').onclick=()=>{ if(confirm('타이틀로 돌아갈까요? (저장하지 않은 진행은 사라집니다)')){ $('#endcard').classList.remove('open'); showTitle(); } };
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).classList.remove('open'));
$('#m-start').onclick=()=>{ initAudio&&null; newGame(); };
$('#m-continue').onclick=()=>loadGame();
$('#m-routes').onclick=openRoutes;
$('#end-back').onclick=()=>{ $('#endcard').classList.remove('open'); showTitle(); };

scheduleLightning();
showTitle();
</script>

</body>
</html>
