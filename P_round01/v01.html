<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>비 내리는 청람 — 사라진 7월의 그녀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c14; --panel:rgba(10,12,22,.82); --panel-edge:rgba(150,180,255,.22);
    --ink:#eef2ff; --ink-dim:#9aa6c8; --accent:#7fb2ff; --accent2:#ffd27f;
    --rose:#ff9bb6; --good:#8be0c0; --warn:#ffb37a;
    --serif:'Nanum Myeongjo',serif; --soft:'Gowun Batang',serif; --round:'Gowun Dodum',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:var(--soft);overflow:hidden;}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100%;height:100%;max-width:1920px;margin:0 auto;
    background:#05060c;overflow:hidden;}
  /* ===== art layer ===== */
  #scene{position:absolute;inset:0;}
  #scene svg, #fxlayer svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #bg-a,#bg-b{position:absolute;inset:0;transition:opacity 1.1s ease;}
  #bg-b{opacity:0;}
  #portraits{position:absolute;inset:0;pointer-events:none;}
  .port{position:absolute;bottom:0;height:78%;transition:opacity .5s ease, transform .5s ease, filter .5s ease;
    transform:translateY(8%);opacity:0;filter:saturate(.55) brightness(.6);}
  .port.show{opacity:1;transform:translateY(0);}
  .port.active{filter:saturate(1) brightness(1.03);}
  .port.left{left:-2%;}
  .port.right{right:-2%;transform:translateY(8%) scaleX(-1);}
  .port.right.show{transform:translateY(0) scaleX(-1);}
  .port.center{left:50%;transform:translate(-50%,8%);}
  .port.center.show{transform:translate(-50%,0);}
  #fxlayer{position:absolute;inset:0;pointer-events:none;}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .12s;}
  #vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55) 100%);}
  #fadecover{position:absolute;inset:0;background:#05060c;opacity:0;pointer-events:none;transition:opacity .6s ease;z-index:40;}

  /* ===== dialogue UI ===== */
  #ui{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;}
  #dbox{margin:0 3.2% 3.4%;background:var(--panel);border:1px solid var(--panel-edge);
    border-radius:16px;backdrop-filter:blur(8px);box-shadow:0 18px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);
    padding:22px 30px 26px;position:relative;cursor:pointer;min-height:24%;}
  #namebar{position:absolute;top:-20px;left:26px;padding:7px 22px;border-radius:11px;
    font-family:var(--round);font-weight:700;letter-spacing:.5px;font-size:18px;
    background:linear-gradient(135deg,#243056,#3a4b86);border:1px solid var(--panel-edge);
    box-shadow:0 6px 18px rgba(0,0,0,.4);}
  #namebar.hidden{display:none;}
  #dtext{font-size:21px;line-height:1.75;letter-spacing:.2px;min-height:3.4em;
    color:var(--ink);text-shadow:0 2px 8px rgba(0,0,0,.6);white-space:pre-wrap;}
  #dtext .nm{color:var(--accent2);}
  #dtext.think{font-style:italic;color:#cdd6f5;}
  #cont{position:absolute;right:24px;bottom:14px;color:var(--accent);font-size:14px;opacity:.8;
    animation:bob 1.1s infinite;font-family:var(--round);}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

  /* choices */
  #choices{position:absolute;left:0;right:0;bottom:0;top:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;z-index:35;padding:0 8%;}
  #choices.on{display:flex;background:rgba(4,6,14,.45);}
  .choice{width:min(720px,90%);padding:17px 24px;border-radius:13px;cursor:pointer;
    background:linear-gradient(135deg,rgba(28,36,66,.92),rgba(40,52,96,.92));
    border:1px solid rgba(150,180,255,.32);font-family:var(--round);font-size:19px;color:var(--ink);
    text-align:center;transition:transform .14s, box-shadow .14s, border-color .14s;
    box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .choice:hover{transform:translateY(-3px) scale(1.012);border-color:var(--accent);
    box-shadow:0 14px 34px rgba(60,90,180,.4);}
  .choice .tag{display:block;font-size:13px;color:var(--accent2);margin-top:4px;font-family:var(--soft);opacity:.85;}

  /* top toolbar */
  #bar{position:absolute;top:14px;right:16px;z-index:36;display:flex;gap:8px;}
  .tbtn{font-family:var(--round);font-size:13px;color:var(--ink-dim);background:rgba(20,26,44,.7);
    border:1px solid var(--panel-edge);border-radius:9px;padding:8px 13px;cursor:pointer;transition:.15s;}
  .tbtn:hover{color:var(--ink);border-color:var(--accent);background:rgba(34,44,74,.85);}
  .tbtn.act{color:var(--accent2);border-color:var(--accent2);}
  #chapchip{position:absolute;top:16px;left:18px;z-index:36;font-family:var(--round);font-size:13px;
    color:var(--ink-dim);background:rgba(20,26,44,.6);border:1px solid var(--panel-edge);
    border-radius:9px;padding:7px 14px;max-width:46%;}

  /* overlays: title / backlog / menu / ending */
  .overlay{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;
    background:rgba(5,6,12,.94);backdrop-filter:blur(3px);}
  .overlay.on{display:flex;}
  #title{align-items:center;justify-content:center;background:transparent;}
  #titleart{position:absolute;inset:0;z-index:-1;}
  .tcard{text-align:center;max-width:760px;padding:30px;}
  .tcard h1{font-family:var(--serif);font-weight:800;font-size:clamp(34px,6vw,68px);margin:0 0 6px;
    letter-spacing:6px;color:#eaf0ff;text-shadow:0 4px 30px rgba(80,130,255,.5);}
  .tcard .sub{font-family:var(--soft);font-size:clamp(14px,2.4vw,20px);color:var(--accent2);letter-spacing:3px;margin-bottom:34px;}
  .tcard .menu{display:flex;flex-direction:column;gap:13px;align-items:center;}
  .mbtn{font-family:var(--round);font-size:19px;color:var(--ink);background:rgba(20,28,52,.6);
    border:1px solid var(--panel-edge);border-radius:12px;padding:14px 60px;cursor:pointer;transition:.16s;min-width:260px;}
  .mbtn:hover{transform:translateY(-2px);border-color:var(--accent);color:#fff;background:rgba(40,54,98,.8);box-shadow:0 12px 30px rgba(50,80,170,.4);}
  .mbtn.sm{font-size:15px;padding:10px 30px;min-width:0;}
  .tcredit{position:absolute;bottom:18px;width:100%;text-align:center;color:var(--ink-dim);font-size:12px;font-family:var(--round);}

  #backlog{padding:0;}
  .ohead{display:flex;align-items:center;justify-content:space-between;padding:18px 26px;border-bottom:1px solid var(--panel-edge);}
  .ohead h2{margin:0;font-family:var(--serif);font-size:24px;letter-spacing:3px;color:var(--accent);}
  .oclose{font-family:var(--round);font-size:15px;color:var(--ink-dim);background:rgba(30,38,64,.7);
    border:1px solid var(--panel-edge);border-radius:9px;padding:9px 18px;cursor:pointer;}
  .oclose:hover{color:#fff;border-color:var(--accent);}
  #blogbody{overflow-y:auto;padding:18px 30px 40px;flex:1;}
  .blog-row{margin-bottom:15px;padding-bottom:13px;border-bottom:1px dashed rgba(150,180,255,.12);}
  .blog-row .who{font-family:var(--round);color:var(--accent2);font-size:14px;margin-bottom:3px;}
  .blog-row .ln{font-family:var(--soft);font-size:16px;line-height:1.6;color:var(--ink);}
  .blog-row.think .ln{font-style:italic;color:#cbd4f0;}

  #menu .mwrap{margin:auto;background:rgba(14,18,32,.9);border:1px solid var(--panel-edge);
    border-radius:18px;padding:30px 40px;min-width:340px;text-align:center;}
  #menu h2{font-family:var(--serif);letter-spacing:3px;color:var(--accent);margin:0 0 22px;}
  #menu .menu{display:flex;flex-direction:column;gap:12px;}

  #ending{align-items:center;justify-content:center;}
  #ending .ecard{text-align:center;max-width:720px;padding:30px;}
  #ending .badge{font-family:var(--round);font-size:14px;letter-spacing:4px;color:var(--accent2);margin-bottom:10px;}
  #ending h2{font-family:var(--serif);font-weight:800;font-size:clamp(30px,5vw,50px);margin:0 0 18px;letter-spacing:4px;}
  #ending p{font-family:var(--soft);font-size:18px;line-height:1.85;color:var(--ink-dim);margin:0 auto 26px;max-width:600px;}
  #ending .efx{position:absolute;inset:0;z-index:-1;}

  #toast{position:absolute;left:50%;top:64px;transform:translateX(-50%) translateY(-12px);z-index:55;
    background:rgba(20,28,52,.92);border:1px solid var(--accent);color:var(--ink);padding:11px 22px;
    border-radius:11px;font-family:var(--round);font-size:14px;opacity:0;transition:.35s;pointer-events:none;}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

  .clue-pop{color:var(--accent2);}

  /* responsive: narrow (390) */
  @media (max-width:560px){
    #dbox{margin:0 3% 9%;padding:18px 18px 22px;min-height:30%;border-radius:13px;}
    #dtext{font-size:17px;line-height:1.7;}
    #namebar{font-size:15px;padding:6px 16px;top:-17px;left:16px;}
    .choice{font-size:16px;padding:14px 16px;}
    .mbtn{font-size:17px;padding:13px 30px;min-width:220px;}
    #chapchip{font-size:11px;max-width:40%;}
    .tbtn{font-size:11px;padding:7px 10px;}
    .port{height:62%;}
  }
  @media (max-height:520px){ #dbox{min-height:34%;} .port{height:88%;} }
</style>
</head>
<body>
<div id="app"><div id="stage">

  <div id="scene">
    <div id="bg-a"></div>
    <div id="bg-b"></div>
  </div>
  <div id="portraits"></div>
  <div id="fxlayer"></div>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="fadecover"></div>

  <div id="ui">
    <div id="chapchip">序章</div>
    <div id="bar">
      <button class="tbtn" id="b-auto">AUTO</button>
      <button class="tbtn" id="b-skip">SKIP</button>
      <button class="tbtn" id="b-log">로그</button>
      <button class="tbtn" id="b-save">저장</button>
      <button class="tbtn" id="b-menu">메뉴</button>
    </div>
    <div id="choices"></div>
    <div id="dbox">
      <div id="namebar"></div>
      <div id="dtext"></div>
      <div id="cont">▼ 클릭</div>
    </div>
  </div>

  <!-- TITLE -->
  <div class="overlay on" id="title">
    <div id="titleart"></div>
    <div class="tcard">
      <h1>비 내리는 청람</h1>
      <div class="sub">— 사라진 7월의 그녀 —</div>
      <div class="menu">
        <button class="mbtn" id="t-new">새로 시작</button>
        <button class="mbtn" id="t-cont">이어하기</button>
        <button class="mbtn sm" id="t-route">엔딩 기록</button>
      </div>
    </div>
    <div class="tcredit">SVG 비주얼노벨 · 클릭/탭으로 진행 · 학원 미스터리</div>
  </div>

  <!-- BACKLOG -->
  <div class="overlay" id="backlog">
    <div class="ohead"><h2>백로그</h2><button class="oclose" id="bl-close">닫기</button></div>
    <div id="blogbody"></div>
  </div>

  <!-- MENU -->
  <div class="overlay" id="menu">
    <div class="mwrap">
      <h2>메뉴</h2>
      <div class="menu">
        <button class="mbtn" id="m-resume">계속하기</button>
        <button class="mbtn sm" id="m-save">저장</button>
        <button class="mbtn sm" id="m-load">불러오기</button>
        <button class="mbtn sm" id="m-title">타이틀로</button>
      </div>
    </div>
  </div>

  <!-- ENDING -->
  <div class="overlay" id="ending">
    <div class="efx" id="endfx"></div>
    <div class="ecard">
      <div class="badge" id="end-badge">ENDING</div>
      <h2 id="end-title">엔딩</h2>
      <p id="end-text"></p>
      <div class="menu" style="display:flex;flex-direction:column;gap:12px;align-items:center;">
        <button class="mbtn sm" id="end-title-btn">타이틀로</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

</div></div>

<script>
"use strict";
/* =========================================================================
   비 내리는 청람 — SVG 비주얼노벨 엔진
   - 모든 그림은 SVG 도형 (캐릭터/배경/소품/이펙트)
   - 분기 스토리 + 복수 엔딩 + 플래그 + 단서 시스템
   - 타이프라이터, 백로그, 오토/스킵, 세이브(localStorage), WebAudio
   ========================================================================= */

/* ---------- SVG 배경 (도형 조합) ---------- */
const BG = {};

BG.rainNight = () => `
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
 <defs>
  <linearGradient id="rn-sky" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#0b1230"/><stop offset="0.55" stop-color="#141b3d"/><stop offset="1" stop-color="#1d2138"/>
  </linearGradient>
  <radialGradient id="rn-moon" cx="0.5" cy="0.5" r="0.5">
   <stop offset="0" stop-color="#cdd9ff" stop-opacity="0.9"/><stop offset="1" stop-color="#cdd9ff" stop-opacity="0"/>
  </radialGradient>
 </defs>
 <rect width="1600" height="900" fill="url(#rn-sky)"/>
 <circle cx="1230" cy="190" r="160" fill="url(#rn-moon)"/>
 <circle cx="1230" cy="190" r="64" fill="#e7eeff" opacity="0.85"/>
 <circle cx="1255" cy="175" r="64" fill="#141b3d" opacity="0.55"/>
 <!-- city silhouette -->
 <g fill="#0c1126" opacity="0.9">
  <rect x="0" y="560" width="180" height="340"/><rect x="150" y="500" width="120" height="400"/>
  <rect x="250" y="600" width="160" height="300"/><rect x="1180" y="520" width="150" height="380"/>
  <rect x="1300" y="580" width="180" height="320"/><rect x="1450" y="540" width="160" height="360"/>
 </g>
 <g fill="#ffd98a" opacity="0.5">
  <rect x="30" y="600" width="14" height="20"/><rect x="70" y="640" width="14" height="20"/>
  <rect x="180" y="540" width="12" height="18"/><rect x="220" y="600" width="12" height="18"/>
  <rect x="1210" y="560" width="12" height="18"/><rect x="1330" y="620" width="12" height="18"/>
  <rect x="1480" y="580" width="12" height="18"/>
 </g>
 <!-- school block + gate -->
 <rect x="430" y="430" width="740" height="470" fill="#10162e"/>
 <g fill="#1a2murky"></g>
 <g fill="#1a2murky"></g>
 <g fill="#22305c" opacity="0.55">
  <rect x="470" y="470" width="60" height="80"/><rect x="560" y="470" width="60" height="80"/>
  <rect x="650" y="470" width="60" height="80"/><rect x="980" y="470" width="60" height="80"/>
  <rect x="1070" y="470" width="60" height="80"/>
  <rect x="470" y="600" width="60" height="80"/><rect x="650" y="600" width="60" height="80"/>
  <rect x="1070" y="600" width="60" height="80"/>
 </g>
 <rect x="730" y="640" width="140" height="260" fill="#0a0f22"/>
 <rect x="788" y="700" width="24" height="200" fill="#1c2750"/>
 <!-- rain -->
 <g stroke="#9fb6ff" stroke-width="1.4" opacity="0.35">
  ${Array.from({length:60},(_,i)=>{const x=(i*27+ (i*53%40))%1600;const y=(i*61)%900;return `<line x1="${x}" y1="${y}" x2="${x-14}" y2="${y+40}"/>`}).join('')}
 </g>
 <rect width="1600" height="900" fill="#0a1029" opacity="0.18"/>
</svg>`;

BG.classroomDay = () => `
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
 <defs>
  <linearGradient id="cd-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfeaf6"/><stop offset="1" stop-color="#b9cbe0"/></linearGradient>
  <linearGradient id="cd-light" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7e0" stop-opacity="0.7"/><stop offset="1" stop-color="#fff7e0" stop-opacity="0"/></linearGradient>
 </defs>
 <rect width="1600" height="900" fill="url(#cd-w)"/>
 <rect x="0" y="0" width="1600" height="610" fill="#cfe0f0"/>
 <!-- windows -->
 <g>
  <rect x="930" y="80" width="600" height="430" fill="#aecdee"/>
  <rect x="930" y="80" width="600" height="430" fill="url(#cd-light)"/>
  <g stroke="#7e93b3" stroke-width="8" fill="none">
   <rect x="930" y="80" width="600" height="430"/><line x1="1230" y1="80" x2="1230" y2="510"/><line x1="930" y1="295" x2="1530" y2="295"/>
  </g>
  <polygon points="980,120 1090,120 1010,470 920,470" fill="#ffffff" opacity="0.18"/>
  <polygon points="1250,120 1340,120 1280,470 1200,470" fill="#ffffff" opacity="0.14"/>
 </g>
 <!-- blackboard -->
 <rect x="70" y="120" width="700" height="330" rx="8" fill="#2c4a3c"/>
 <rect x="60" y="120" width="720" height="346" rx="10" fill="none" stroke="#caa46a" stroke-width="14"/>
 <g stroke="#dfe9d8" stroke-width="4" opacity="0.6" fill="none" stroke-linecap="round">
  <path d="M120 200 h220"/><path d="M120 250 h300"/><path d="M120 300 h180"/><path d="M120 360 h260"/>
 </g>
 <!-- floor -->
 <rect x="0" y="610" width="1600" height="290" fill="#c7a884"/>
 <g stroke="#a98a66" stroke-width="3" opacity="0.5">
  <line x1="0" y1="660" x2="1600" y2="660"/><line x1="0" y1="730" x2="1600" y2="730"/><line x1="0" y1="810" x2="1600" y2="810"/>
 </g>
 <!-- desks -->
 ${[ [120,640],[360,640],[600,640],[1050,660],[1300,660] ].map(([x,y])=>`
  <g><rect x="${x}" y="${y}" width="150" height="22" rx="4" fill="#d9b98c"/><rect x="${x}" y="${y}" width="150" height="9" rx="4" fill="#eccfa6"/>
   <rect x="${x+12}" y="${y+22}" width="12" height="80" fill="#9c7c54"/><rect x="${x+126}" y="${y+22}" width="12" height="80" fill="#9c7c54"/></g>`).join('')}
 <rect width="1600" height="900" fill="#fff" opacity="0.04"/>
</svg>`;

BG.classroomDusk = () => `
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
 <defs>
  <linearGradient id="ck-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3050"/><stop offset="1" stop-color="#2a2640"/></linearGradient>
  <linearGradient id="ck-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb27a"/><stop offset="0.5" stop-color="#e0738a"/><stop offset="1" stop-color="#6b4a7a"/></linearGradient>
 </defs>
 <rect width="1600" height="900" fill="url(#ck-w)"/>
 <rect x="0" y="0" width="1600" height="610" fill="#352c4c"/>
 <g>
  <rect x="930" y="80" width="600" height="430" fill="url(#ck-sky)"/>
  <circle cx="1180" cy="360" r="60" fill="#ffe6b0" opacity="0.9"/>
  <g stroke="#5a4a6e" stroke-width="8" fill="none"><rect x="930" y="80" width="600" height="430"/><line x1="1230" y1="80" x2="1230" y2="510"/><line x1="930" y1="295" x2="1530" y2="295"/></g>
 </g>
 <rect x="70" y="120" width="700" height="330" rx="8" fill="#23382e"/>
 <rect x="60" y="120" width="720" height="346" rx="10" fill="none" stroke="#7a623e" stroke-width="14"/>
 <rect x="0" y="610" width="1600" height="290" fill="#5b4a3c"/>
 ${[ [120,640],[360,640],[600,640],[1050,660],[1300,660] ].map(([x,y])=>`<g><rect x="${x}" y="${y}" width="150" height="22" rx="4" fill="#7a6048"/><rect x="${x+12}" y="${y+22}" width="12" height="80" fill="#564434"/><rect x="${x+126}" y="${y+22}" width="12" height="80" fill="#564434"/></g>`).join('')}
 <rect width="1600" height="900" fill="#1a0f2a" opacity="0.22"/>
</svg>`;

BG.hallway = () => `
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
 <defs><linearGradient id="hw-f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb0c4"/><stop offset="1" stop-color="#6f7e92"/></linearGradient></defs>
 <rect width="1600" height="900" fill="#aeb9c9"/>
 <rect x="0" y="0" width="1600" height="560" fill="#c2cbd8"/>

function charSVG({hair, hairBack, hairAcc, uniform, accent, expr, skin="#f6dcc4", eyeC="#3a2c4a", blushOn=false, extra=""}){
  return `
<svg viewBox="-200 0 400 760" preserveAspectRatio="xMidYMax meet">
 <g transform="translate(0,0)">
  <!-- body / uniform -->
  <g transform="translate(0,470)">
   <path d="M-150 290 Q-150 70 -70 30 L70 30 Q150 70 150 290 Z" fill="${uniform}"/>

   <path d="M-70 30 L-40 30 L-20 110 L-44 130 Z" fill="${uniform}" opacity="0.85"/>
   <path d="M70 30 L40 30 L20 110 L44 130 Z" fill="${uniform}" opacity="0.85"/>
   <rect x="-150" y="250" width="300" height="60" fill="${uniform}"/>
  </g>
  <!-- neck -->
  <rect x="-22" y="430" width="44" height="80" rx="12" fill="${skin}"/>
  <!-- hair back -->
  ${hairBack||""}
  <!-- head -->
  <ellipse cx="0" cy="330" rx="118" ry="132" fill="${skin}"/>
  <path d="M-118 330 q-14 24 6 36 q12 6 16 -10 Z" fill="${skin}"/>
  <path d="M118 330 q14 24 -6 36 q-12 6 -16 -10 Z" fill="${skin}"/>
  <!-- face features (centered ~ 0,330) -->
  <g transform="translate(0,318)">
   ${blush(blushOn)}
   <g transform="translate(0,0)">${eyes(expr,eyeC)}</g>
   <g>${mouth(expr)}</g>
   <path d="M-3 14 q3 8 -3 14" stroke="#c98f78" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- eyebrows for emphasis handled in eyes -->
  <!-- hair front -->
  ${hair}
  ${hairAcc||""}
  ${extra}
 </g>
</svg>`;
}

/* ---- WebAudio: 절차적 분위기 ---- */
const Audio_ = (()=>{
  let ctx=null, master=null, nodes=[], cur=null, rainTimer=null, on=true;
  function init(){ if(ctx) return; try{ ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.gain.value=0.16; master.connect(ctx.destination);}catch(e){on=false;} }
  function stopAll(){ nodes.forEach(n=>{try{n.stop&&n.stop();}catch(e){} try{n.disconnect&&n.disconnect();}catch(e){}}); nodes=[];
    if(rainTimer){clearInterval(rainTimer);rainTimer=null;} }
  function tone(freq,type,gain,detune=0){ if(!ctx)return null; const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.value=freq;o.detune.value=detune;g.gain.value=0;g.connect(master);o.connect(g);o.start();
    g.gain.linearRampToValueAtTime(gain,ctx.currentTime+2.5); nodes.push(o);nodes.push(g);return {o,g}; }
  function rainNoise(){ if(!ctx)return; const bufSize=ctx.sampleRate*2; const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<bufSize;i++) d[i]=(Math.random()*2-1)*0.5;
    const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
    const flt=ctx.createBiquadFilter(); flt.type="bandpass"; flt.frequency.value=1200; flt.Q.value=0.4;
    const g=ctx.createGain(); g.gain.value=0.0; g.gain.linearRampToValueAtTime(0.12,ctx.currentTime+2);
    src.connect(flt);flt.connect(g);g.connect(master); src.start(); nodes.push(src);nodes.push(g); }
  const moods = {
    rain:()=>{ rainNoise(); tone(110,"sine",0.05); tone(146.8,"sine",0.04,4); },
    calm:()=>{ tone(196,"sine",0.05); tone(261.6,"sine",0.04); tone(329.6,"triangle",0.02); },
    tense:()=>{ tone(73.4,"sawtooth",0.03); tone(98,"sine",0.04); rainTimer=setInterval(()=>{const t=tone(220+Math.random()*80,"sine",0.03);setTimeout(()=>{if(t)t.g.gain.linearRampToValueAtTime(0,ctx.currentTime+1.5);},400);},2600); },
    mystery:()=>{ tone(130.8,"sine",0.045); tone(155.6,"triangle",0.03); tone(207.6,"sine",0.02); },
    wind:()=>{ rainNoise(); tone(174.6,"sine",0.04); },
    reveal:()=>{ tone(164.8,"sine",0.05); tone(220,"sine",0.04); tone(329.6,"triangle",0.025); },
    climax:()=>{ tone(82.4,"sawtooth",0.035); tone(123.5,"sine",0.045); tone(246.9,"triangle",0.025);
      rainNoise(); },
    sad:()=>{ tone(146.8,"sine",0.05); tone(174.6,"sine",0.04); tone(220,"triangle",0.02); },
    hope:()=>{ tone(261.6,"sine",0.05); tone(329.6,"sine",0.04); tone(392,"triangle",0.03); tone(523.2,"sine",0.015); },
  };
  return {
    init,
    play(name){ if(!on) return; init(); if(!ctx) return; if(cur===name) return; cur=name; stopAll();
      (moods[name]||moods.calm)(); },
    sfx(kind){ if(!on||!ctx) return; const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(master); const t=ctx.currentTime;
      if(kind==="click"){o.type="sine";o.frequency.setValueAtTime(660,t);g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);o.start(t);o.stop(t+0.13);}
      else if(kind==="select"){o.type="triangle";o.frequency.setValueAtTime(440,t);o.frequency.exponentialRampToValueAtTime(880,t+0.12);g.gain.setValueAtTime(0.09,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.18);o.start(t);o.stop(t+0.2);}
      else if(kind==="reveal"){o.type="sine";o.frequency.setValueAtTime(330,t);o.frequency.exponentialRampToValueAtTime(110,t+0.5);g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.6);o.start(t);o.stop(t+0.6);} },
    toggle(){ on=!on; if(!on){stopAll();cur=null;} else if(ctx){ /* resume current */ } return on; },
    get enabled(){return on;}
  };
})();

/* ---- 타이프라이터 ---- */
function typeOut(text, isThink){
  clearTimeout(G.typer);
  G.typing=true; G.full=text; G.typed="";
  dtext.classList.toggle("think", !!isThink);
  dtext.textContent="";
  cont.style.opacity=0;
  let i=0;
  const speed = G.skip?2:22;
  function step(){
    if(i<=text.length){
      dtext.textContent=text.slice(0,i);
      i++;
      G.typer=setTimeout(step, speed);
    } else {
      G.typing=false; cont.style.opacity=0.8;
      if(G.auto && !G.curHasChoice){ scheduleAuto(); }
    }
  }
  if(G.skip){ dtext.textContent=text; G.typing=false; cont.style.opacity=0.8; if(G.auto&&!G.curHasChoice) scheduleAuto(); }
  else step();
}
function finishTyping(){ if(G.typing){ clearTimeout(G.typer); dtext.textContent=G.full; G.typing=false; cont.style.opacity=0.8; if(G.auto&&!G.curHasChoice) scheduleAuto(); } }

function scheduleAuto(){ clearTimeout(G.autoT); G.autoT=setTimeout(()=>{ if(G.auto) advance(); }, 1400); }

/* ---- 단서/플래그 ---- */
function applySet(set){
  if(!set) return;
  for(const k in set){
    if(k==="clue"){ if(!G.clues[set[k]]){ G.clues[set[k]]=true; flashClue(set[k]); } }
    else if(k==="met"){ G.met[set[k]]=true; }
    else G.flags[k]=set[k];
  }
}

function condOK(cond){
  if(!cond) return true;
  const [type,val]=cond.split(":");
  if(type==="clue") return !!G.clues[val];
  if(type==="flag") return !!G.flags[val];
  return true;
}

/* ---- 노드 진입 ---- */
function goto(id){
  let node = story[id];
  if(!node){ console.warn("missing node",id); return; }

  // dynamic gate
  if(node._gate){ id = resolveGate(); node = story[id]; }

  G.nodeId=id; G.node=node;

  if(node.chapter){ G.chapter=node.chapter; chapchip.textContent=node.chapter; }
  if(node.bg) setBG(node.bg);
  if(node.fx!==undefined) setFX(node.fx);
  if(node.music) Audio_.play(node.music);
  applySet(node.set);

  // track visited hubs
  if(id==="art_done") G.visited.art=true;
  if(id==="club_done") G.visited.club=true;
  if(id==="gym7") G.visited.gym=true;

  // portraits
  if(node.port!==undefined || node.port2!==undefined){
    if(node.port===null){ clearPorts(); }
    else if(node.port){ showPort(node.port); }
    if(node.port2){ showPort(node.port2, false); }
    if(node.port){ dimOthers(node.port[2]); }
  } else if(node.bg && !node.who){ /* bg-only narration keeps ports */ }

  // ending?
  if(node.end){ return doEnding(node.end); }

  // choices?
  if(node.choices){
    G.curHasChoice=true;
    renderChoices(node.choices);
    namebar.classList.add("hidden"); dtext.textContent=""; cont.style.opacity=0;
    pushBacklog(node);
    return;
  }
  G.curHasChoice=false;
  choicesEl.classList.remove("on");

  // speaker
  if(node.who){ namebar.classList.remove("hidden"); namebar.textContent=node.who; }
  else { namebar.classList.add("hidden"); }

  // text
  typeOut(node.text||"", node.think);
  pushBacklog(node);
  saveAuto();
}

function pushBacklog(node){
  if(node.choices){ G.backlog.push({who:"— 선택 —", text:node.choices.map(c=>"· "+c.t).join("\n"), think:true}); return; }
  if(node.text) G.backlog.push({who:node.who||(node.think?"(독백)":""), text:node.text, think:!!node.think});
  if(G.backlog.length>400) G.backlog.shift();
}

function renderChoices(list){
  choicesEl.innerHTML="";
  list.forEach(c=>{
    if(c.if && !condOK(c.if)) return;
    const b=document.createElement("div"); b.className="choice";
    b.innerHTML = c.t + (c.tag?`<span class="tag">[${c.tag}]</span>`:"");
    b.onclick=(e)=>{ e.stopPropagation(); Audio_.sfx("select"); applySet(c.set); choicesEl.classList.remove("on");
      G.backlog.push({who:"▶ 선택",text:c.t,think:true}); goto(c.to); };
    choicesEl.appendChild(b);
  });
  choicesEl.classList.add("on");
}

/* 허브 게이트: 미방문 분기 제시, 다 봤으면 3장으로 */
function resolveGate(){
  const remaining=[];
  if(!G.visited.art) remaining.push({t:"미술실 — 유나가 남긴 그림", to:"art1", tag:"단서"});
  if(!G.visited.club) remaining.push({t:"옛 신문부실 — 후배 백시아", to:"club1", tag:"인물"});
  if(!G.visited.gym) remaining.push({t:"체육관 뒤 — 소문의 진원지", to:"gym1", tag:"소문"});
  if(remaining.length===0){
    return "ch3";
  }
  // 임시 노드 등록
  remaining.push({t:"…더 캐지 않고 진실로 향한다", to:"ch3", tag:"결단"});
  story["_dyn_gate"]={bg:"hallway", fx:"none", music:"mystery",
    think:true, text:"아직 가보지 않은 곳이 남아 있다. 더 파고들까, 아니면 지금까지의 단서로 충분할까.",
    choices:remaining};
  return "_dyn_gate";
}

/* ---- 진행 ---- */
function advance(){
  if(G.curHasChoice) return;
  if(G.typing){ finishTyping(); return; }
  clearTimeout(G.autoT);
  const node=G.node;
  if(node && node.next){ goto(node.next); }
}

/* ---- 엔딩 ---- */
const ENDINGS_SEEN_KEY="rainchung_endings";
function doEnding(end){
  choicesEl.classList.remove("on");
  setFX(end.fx||"none");
  $("#endfx").innerHTML = (FX[end.fx]?FX[end.fx]():"");
  $("#end-badge").textContent=end.badge;
  $("#end-title").textContent=end.title;
  $("#end-text").textContent=end.text;
  $("#ending").classList.add("on");
  // record
  try{ const seen=JSON.parse(localStorage.getItem(ENDINGS_SEEN_KEY)||"{}"); seen[end.title]=end.badge; localStorage.setItem(ENDINGS_SEEN_KEY, JSON.stringify(seen)); }catch(e){}
  Audio_.sfx("reveal");
}

/* ---- 저장/불러오기 ---- */
const SAVE_KEY="rainchung_save_v1", AUTO_KEY="rainchung_auto_v1";
function snapshot(){ return {nodeId:G.nodeId, flags:G.flags, clues:G.clues, met:G.met, visited:G.visited,
  chapter:G.chapter, backlog:G.backlog.slice(-200)}; }
function restore(s){ G.flags=s.flags||{}; G.clues=s.clues||{}; G.met=s.met||{}; G.visited=s.visited||{art:false,club:false,gym:false};
  G.backlog=s.backlog||[]; G.chapter=s.chapter||"序章"; }
function saveAuto(){ try{ localStorage.setItem(AUTO_KEY, JSON.stringify(snapshot())); }catch(e){} }
function saveManual(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot())); showToast("저장했습니다"); Audio_.sfx("click"); }catch(e){ showToast("저장 실패"); } }
function loadManual(){ try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)); if(!s){showToast("저장 데이터가 없습니다");return false;}
  restore(s); closeAllOverlays(); startGame(false); goto(s.nodeId||"start"); showToast("불러왔습니다"); return true; }catch(e){ showToast("불러오기 실패"); return false; } }
function hasAuto(){ try{ return !!localStorage.getItem(AUTO_KEY); }catch(e){ return false; } }
function loadAutoCont(){ try{ const s=JSON.parse(localStorage.getItem(AUTO_KEY)); if(!s){return false;} restore(s); closeAllOverlays(); startGame(false); goto(s.nodeId||"start"); return true; }catch(e){ return false; } }

/* ---- 백로그 ---- */
function openBacklog(){ const body=$("#blogbody"); body.innerHTML="";
  G.backlog.forEach(r=>{ const d=document.createElement("div"); d.className="blog-row"+(r.think?" think":"");
    d.innerHTML=`<div class="who">${r.who||""}</div><div class="ln">${(r.text||"").replace(/\n/g,"<br>")}</div>`; body.appendChild(d); });
  $("#backlog").classList.add("on"); body.scrollTop=body.scrollHeight; }

/* ---- 오버레이 ---- */
function closeAllOverlays(){ document.querySelectorAll(".overlay").forEach(o=>o.classList.remove("on")); }

/* ---- 게임 시작 ---- */
let gameStarted=false;
function startGame(reset){
  closeAllOverlays();
  gameStarted=true;
  Audio_.init();
  if(reset){ G.flags={};G.clues={};G.met={};G.visited={art:false,club:false,gym:false};G.backlog=[]; }
}

/* ---- 입력 ---- */
dbox.addEventListener("click", ()=>{ if(!gameStarted) return; advance(); });
stage.addEventListener("click",(e)=>{
  if(!gameStarted) return;
  if(e.target.closest("#dbox")||e.target.closest("#bar")||e.target.closest(".overlay")||e.target.closest(".choice")) return;
  if(G.curHasChoice) return;
  advance();
});
document.addEventListener("keydown",(e)=>{
  if(!gameStarted) return;
  if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(!G.curHasChoice) advance(); }
  if(e.key==="Escape"){ $("#menu").classList.toggle("on"); }
});

/* AUTO / SKIP */
$("#b-auto").onclick=()=>{ G.auto=!G.auto; $("#b-auto").classList.toggle("act",G.auto);
  if(G.auto && !G.typing && !G.curHasChoice) scheduleAuto(); else clearTimeout(G.autoT); };
$("#b-skip").onclick=()=>{ G.skip=!G.skip; $("#b-skip").classList.toggle("act",G.skip);
  if(G.skip){ const fast=()=>{ if(!G.skip) return; if(G.curHasChoice) {return;} if(G.typing){finishTyping();} else {advance();} G.skipT=setTimeout(fast,120);} ; fast(); }
  else clearTimeout(G.skipT); };
$("#b-log").onclick=openBacklog;
$("#bl-close").onclick=()=>$("#backlog").classList.remove("on");
$("#b-save").onclick=saveManual;
$("#b-menu").onclick=()=>$("#menu").classList.add("on");

/* MENU */
$("#m-resume").onclick=()=>$("#menu").classList.remove("on");
$("#m-save").onclick=saveManual;
$("#m-load").onclick=loadManual;
$("#m-title").onclick=()=>{ closeAllOverlays(); gameStarted=false; G.auto=false;G.skip=false;
  $("#b-auto").classList.remove("act");$("#b-skip").classList.remove("act"); $("#title").classList.add("on"); buildTitle(); };

/* ENDING screen */
$("#end-title-btn").onclick=()=>{ closeAllOverlays(); gameStarted=false; $("#title").classList.add("on"); buildTitle(); };

/* TITLE */
$("#t-new").onclick=()=>{ Audio_.init(); startGame(true); goto("start"); };
$("#t-cont").onclick=()=>{ Audio_.init(); if(hasAuto()){ if(!loadAutoCont()) showToast("이어할 기록이 없습니다"); } else showToast("이어할 기록이 없습니다"); };
$("#t-route").onclick=()=>{ try{ const seen=JSON.parse(localStorage.getItem(ENDINGS_SEEN_KEY)||"{}"); const keys=Object.keys(seen);
  if(keys.length===0){ showToast("아직 본 엔딩이 없습니다"); }
  else { showToast("발견한 엔딩: "+keys.length+"개 — "+keys.join(", ")); } }catch(e){ showToast("기록 없음"); } };

/* 타이틀 아트 (SVG 비 내리는 학교) */
function buildTitle(){
  $("#titleart").innerHTML = BG.rainNight() + `<div style="position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 30%,rgba(10,16,40,0.2),rgba(5,6,12,0.78))"></div>`;
}
buildTitle();

/* 첫 페인트: 타이틀 배경 보장 */
setBG("rainNight", false);
setFX("rain");

</script>
</body>
</html>
