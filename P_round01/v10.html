<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>마지막 점화자 — 신들의 황혼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#ece3d0; --ink-dim:#b9ad95; --gold:#e5b34b; --gold-deep:#a8772a;
  --ash:#1a1620; --ash2:#241e2c; --blood:#8c2f2f; --frost:#7fb0c4;
  --panel:rgba(14,11,18,.82); --panel-edge:rgba(229,179,75,.45);
  --shadow:0 8px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; width:100%; overflow:hidden; background:#08060c;}
body{
  font-family:'Gowun Batang', serif; color:var(--ink);
  -webkit-tap-highlight-color:transparent; user-select:none;
  display:flex; align-items:center; justify-content:center;
}
#stage{
  position:relative; width:100%; height:100%;
  max-width:none; background:#05040a; overflow:hidden;
}
/* ====== Scene art layer ====== */
#artLayer{position:absolute; inset:0; width:100%; height:100%;}
#artLayer svg{position:absolute; inset:0; width:100%; height:100%;
  opacity:0; transition:opacity 1.1s ease;}
#artLayer svg.show{opacity:1;}
/* vignette */
#vignette{position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%, transparent 36%, rgba(0,0,0,.55) 100%);}
/* ====== Portraits ====== */
#portraitWrap{position:absolute; inset:0; pointer-events:none;}
.portrait{position:absolute; bottom:0; height:74%; opacity:0;
  transition:opacity .55s ease, transform .55s ease; transform:translateY(20px);}
.portrait.show{opacity:1; transform:translateY(0);}
.portrait.dim svg{filter:brightness(.5) saturate(.7);}
.portrait.left{left:2%;}
.portrait.right{right:2%;}
.portrait.center{left:50%; transform:translateX(-50%) translateY(20px);}
.portrait.center.show{transform:translateX(-50%) translateY(0);}
.portrait svg{height:100%; width:auto; filter:drop-shadow(0 6px 22px rgba(0,0,0,.7));
  transition:filter .5s ease;}
/* ====== Dialogue box ====== */
#dlgBox{
  position:absolute; left:50%; transform:translateX(-50%);
  bottom:3.2%; width:92%; max-width:1180px;
  background:var(--panel); border:1px solid var(--panel-edge);
  border-radius:14px; padding:20px 30px 24px; box-shadow:var(--shadow);
  backdrop-filter:blur(3px);
}
#dlgBox.narration{font-style:italic; color:var(--ink-dim);}
#speaker{
  font-family:'Cinzel', serif; font-weight:700; color:var(--gold);
  font-size:clamp(18px,2.4vw,24px); letter-spacing:.04em;
  margin-bottom:8px; min-height:1.2em; text-shadow:0 0 12px rgba(229,179,75,.35);
}
#speaker .ko{font-family:'Gowun Batang'; font-weight:700; margin-left:.5em; font-size:.86em; color:var(--ink);}
#dlgText{
  font-size:clamp(16px,2.05vw,21px); line-height:1.66; min-height:4.6em;
  white-space:pre-wrap; word-break:keep-all;
}
#dlgText .cursor{color:var(--gold); animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
#advanceHint{
  position:absolute; right:22px; bottom:12px; color:var(--gold);
  font-size:20px; opacity:.85; animation:bob 1.4s ease-in-out infinite;}
@keyframes bob{50%{transform:translateY(4px);}}
/* ====== Choices ====== */
#choices{
  position:absolute; left:50%; transform:translateX(-50%);
  bottom:24%; width:80%; max-width:760px;
  display:flex; flex-direction:column; gap:14px; z-index:6;
}
.choice{
  background:linear-gradient(180deg, rgba(40,32,52,.92), rgba(20,16,28,.95));
  border:1px solid var(--panel-edge); color:var(--ink);
  padding:15px 22px; border-radius:10px; cursor:pointer;
  font-family:'Gowun Batang'; font-size:clamp(15px,1.9vw,19px); line-height:1.4;
  text-align:center; transition:all .22s ease; word-break:keep-all;
  box-shadow:0 4px 18px rgba(0,0,0,.5);
}
.choice:hover, .choice.kbsel{
  border-color:var(--gold); color:#fff;
  background:linear-gradient(180deg, rgba(70,52,30,.95), rgba(40,28,16,.96));
  transform:translateY(-2px); box-shadow:0 8px 26px rgba(229,179,75,.25);
}
.choice .req{display:block; font-size:.78em; color:var(--frost); margin-top:4px; opacity:.85;}
/* ====== Top bar ====== */
#topBar{
  position:absolute; top:0; left:0; right:0; padding:12px 18px;
  display:flex; gap:8px; align-items:center; z-index:8;
  background:linear-gradient(180deg, rgba(0,0,0,.55), transparent);
}
#chapTitle{font-family:'Cinzel'; color:var(--gold-deep); font-size:14px;
  letter-spacing:.12em; text-transform:uppercase; flex:0 0 auto; opacity:.9;}
#topSpacer{flex:1;}
.tbtn{
  background:rgba(20,16,28,.7); border:1px solid rgba(229,179,75,.3);
  color:var(--ink-dim); padding:6px 12px; border-radius:8px; cursor:pointer;
  font-family:'Cinzel'; font-size:12px; letter-spacing:.05em; transition:all .2s;
}
.tbtn:hover{color:var(--gold); border-color:var(--gold);}
.tbtn.active{color:#fff; background:rgba(140,47,47,.5); border-color:var(--blood);}
/* ====== Overlays ====== */
.overlay{
  position:absolute; inset:0; z-index:20; display:none;
  background:rgba(6,4,10,.94); backdrop-filter:blur(6px);
  padding:60px 8%; overflow-y:auto;
}
.overlay.open{display:block;}
.overlay h2{font-family:'Cinzel'; color:var(--gold); font-size:26px;
  letter-spacing:.08em; margin-bottom:20px; text-align:center;}
#backlogList{max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:12px;}
.blog-line{border-left:2px solid var(--gold-deep); padding:6px 0 6px 16px;}
.blog-line .who{color:var(--gold); font-family:'Cinzel'; font-size:14px; margin-bottom:2px;}
.blog-line .txt{color:var(--ink-dim); font-size:15px; line-height:1.5; word-break:keep-all;}
.ov-close{position:absolute; top:24px; right:32px; font-size:30px; color:var(--gold);
  cursor:pointer; line-height:1;}
/* Title screen */
#titleScreen{
  position:absolute; inset:0; z-index:30; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
  background:#05040a; transition:opacity 1.2s ease;
}
#titleScreen.hide{opacity:0; pointer-events:none;}
#titleArt{position:absolute; inset:0; width:100%; height:100%;}
#titleInner{position:relative; z-index:2;}
#gameTitle{
  font-family:'Cinzel'; font-weight:700; color:var(--gold);
  font-size:clamp(34px,6vw,68px); letter-spacing:.06em;
  text-shadow:0 0 30px rgba(229,179,75,.5), 0 4px 12px #000;
}
#gameSub{
  font-family:'Gowun Batang'; color:var(--ink-dim); font-size:clamp(15px,2.2vw,22px);
  margin-top:10px; letter-spacing:.3em; text-shadow:0 2px 8px #000;
}
#titleMenu{margin-top:48px; display:flex; flex-direction:column; gap:16px; align-items:center;}
.menu-btn{
  font-family:'Cinzel'; font-size:clamp(16px,2.4vw,22px); color:var(--ink);
  background:transparent; border:1px solid var(--panel-edge); padding:12px 48px;
  border-radius:8px; cursor:pointer; letter-spacing:.1em; transition:all .25s;
  min-width:240px;
}
.menu-btn:hover{color:#fff; border-color:var(--gold); background:rgba(229,179,75,.12);
  box-shadow:0 0 24px rgba(229,179,75,.2);}
.menu-btn.dis{opacity:.35; cursor:not-allowed;}
#titleHint{position:absolute; bottom:30px; color:var(--ink-dim); font-size:13px;
  letter-spacing:.2em; opacity:.6; z-index:2;}
/* flash / fade overlay */
#fader{position:absolute; inset:0; z-index:15; background:#000; opacity:0;
  pointer-events:none; transition:opacity .6s ease;}
#fader.black{opacity:1;}
#fader.white{background:#fff; opacity:1;}
/* ending card */
#endCard{
  position:absolute; inset:0; z-index:25; display:none; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
  background:rgba(5,4,10,.96); padding:8%;
}
#endCard.open{display:flex;}
#endTitle{font-family:'Cinzel'; color:var(--gold); font-size:clamp(28px,5vw,52px);
  letter-spacing:.06em; text-shadow:0 0 30px rgba(229,179,75,.4);}
#endName{font-family:'Gowun Batang'; color:var(--frost); font-size:clamp(16px,2.6vw,24px);
  margin-top:14px; letter-spacing:.2em;}
#endDesc{max-width:680px; margin-top:24px; color:var(--ink-dim);
  font-size:clamp(15px,2vw,19px); line-height:1.8; word-break:keep-all;}
#endBtns{margin-top:40px; display:flex; gap:18px; flex-wrap:wrap; justify-content:center;}
/* toast */
#toast{position:absolute; top:64px; left:50%; transform:translateX(-50%);
  background:rgba(20,16,28,.92); border:1px solid var(--gold-deep); color:var(--gold);
  padding:8px 20px; border-radius:8px; font-size:14px; z-index:18; opacity:0;
  transition:opacity .4s; font-family:'Cinzel'; letter-spacing:.05em;}
#toast.show{opacity:1;}
/* mobile portrait tweaks */
@media (max-aspect-ratio:3/4){
  .portrait{height:52%;}
  #dlgBox{bottom:2%; padding:14px 18px 20px;}
  #dlgText{min-height:5em;}
  #choices{bottom:30%; width:92%;}
  #chapTitle{font-size:11px;}
  .tbtn{padding:5px 9px; font-size:11px;}
}
</style>
</head>
<body>
<div id="stage">
  <div id="artLayer"></div>
  <div id="vignette"></div>
  <div id="portraitWrap"></div>

  <div id="topBar">
    <span id="chapTitle">PROLOGUE</span>
    <span id="topSpacer"></span>
    <button class="tbtn" id="btnAuto">AUTO</button>
    <button class="tbtn" id="btnSkip">SKIP</button>
    <button class="tbtn" id="btnLog">LOG</button>
    <button class="tbtn" id="btnSave">SAVE</button>
    <button class="tbtn" id="btnLoad">LOAD</button>
    <button class="tbtn" id="btnMute">♪</button>
    <button class="tbtn" id="btnTitle">TITLE</button>
  </div>

  <div id="choices" style="display:none;"></div>

  <div id="dlgBox">
    <div id="speaker"></div>
    <div id="dlgText"></div>
    <div id="advanceHint">▼</div>
  </div>

  <div id="fader"></div>
  <div id="toast"></div>

  <!-- Backlog overlay -->
  <div class="overlay" id="backlog">
    <span class="ov-close" data-close="backlog">×</span>
    <h2>지나온 말들 · BACKLOG</h2>
    <div id="backlogList"></div>
  </div>

  <!-- Title -->
  <div id="titleScreen">
    <div id="titleArt"></div>
    <div id="titleInner">
      <h1 id="gameTitle">The Last Kindler</h1>
      <div id="gameSub">마 지 막 점 화 자</div>
      <div id="titleMenu">
        <button class="menu-btn" id="mNew">새로 시작</button>
        <button class="menu-btn" id="mContinue">이어하기</button>
        <button class="menu-btn" id="mGallery">엔딩 기록</button>
      </div>
    </div>
    <div id="titleHint">— 신들의 황혼, 그 마지막 밤에 —</div>
  </div>

  <!-- Ending card -->
  <div id="endCard">
    <div id="endTitle"></div>
    <div id="endName"></div>
    <div id="endDesc"></div>
    <div id="endBtns">
      <button class="menu-btn" id="endReplay">다시 처음부터</button>
      <button class="menu-btn" id="endTitleBtn">타이틀로</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   마지막 점화자 — SVG 비주얼노벨
   모든 그림은 SVG 도형. 분기 스토리. 단일 자기완결 HTML.
   ========================================================================= */

/* ---------- 1. SVG ART LIBRARY ---------- */
/* 배경 — 함수로 생성, 표정/시간대 변주 */

const SVGNS = "http://www.w3.org/2000/svg";

// 공통 그라데이션/필터 defs (장면마다 inline)
function defs(extra){return `<defs>
  <radialGradient id="skyDusk" cx="50%" cy="30%" r="90%">
    <stop offset="0%" stop-color="#3a1f3a"/><stop offset="40%" stop-color="#241433"/>
    <stop offset="100%" stop-color="#0a0612"/></radialGradient>
  <radialGradient id="skyFire" cx="50%" cy="80%" r="120%">
    <stop offset="0%" stop-color="#c4421f"/><stop offset="30%" stop-color="#5e1d22"/>
    <stop offset="80%" stop-color="#180810"/><stop offset="100%" stop-color="#05030a"/></radialGradient>
  <radialGradient id="skyFrost" cx="50%" cy="40%" r="100%">
    <stop offset="0%" stop-color="#2a4a5e"/><stop offset="60%" stop-color="#13202e"/>
    <stop offset="100%" stop-color="#070b12"/></radialGradient>
  <radialGradient id="skyVoid" cx="50%" cy="50%" r="90%">
    <stop offset="0%" stop-color="#1b1430"/><stop offset="60%" stop-color="#0a0718"/>
    <stop offset="100%" stop-color="#020106"/></radialGradient>
  <radialGradient id="skyDawn" cx="50%" cy="70%" r="110%">
    <stop offset="0%" stop-color="#e8c06a"/><stop offset="35%" stop-color="#c97a4a"/>
    <stop offset="75%" stop-color="#4a2a4a"/><stop offset="100%" stop-color="#12101e"/></radialGradient>
  <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffe9a8" stop-opacity=".95"/>
    <stop offset="50%" stop-color="#e5b34b" stop-opacity=".5"/>
    <stop offset="100%" stop-color="#e5b34b" stop-opacity="0"/></radialGradient>
  <linearGradient id="treeBark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5a4a3a"/><stop offset="100%" stop-color="#241a12"/></linearGradient>
  <linearGradient id="treeDead" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3a3340"/><stop offset="100%" stop-color="#15121c"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="soft8"><feGaussianBlur stdDeviation="8"/></filter>
  ${extra||""}
</defs>`;}

// 별
function stars(n,seed){let s="";let r=seed||7;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280;};
  for(let i=0;i<n;i++){const x=(rnd()*1440)|0,y=(rnd()*450)|0,rad=(rnd()*1.4+.3).toFixed(2),o=(rnd()*.7+.2).toFixed(2);
    s+=`<circle cx="${x}" cy="${y}" r="${rad}" fill="#fff" opacity="${o}"/>`;}
  return s;}

// 세계수 (상태: alive / dying / ash)
function worldTree(state){
  const bark = state==="ash" ? "url(#treeDead)" : "url(#treeBark)";
  let crown="";
  if(state==="alive"){
    crown=`<ellipse cx="720" cy="240" rx="360" ry="220" fill="#2f5a36" opacity=".9"/>
      <ellipse cx="560" cy="300" rx="200" ry="150" fill="#396b41" opacity=".8"/>
      <ellipse cx="900" cy="290" rx="220" ry="160" fill="#2c5232" opacity=".85"/>
      <circle cx="720" cy="230" r="60" fill="url(#glowGold)"/>`;
  }else if(state==="dying"){
    crown=`<ellipse cx="720" cy="250" rx="340" ry="200" fill="#3a3320" opacity=".75"/>
      <ellipse cx="600" cy="300" rx="170" ry="120" fill="#4a2c1a" opacity=".7"/>
      <ellipse cx="880" cy="290" rx="180" ry="130" fill="#5a2418" opacity=".7"/>
      <circle cx="720" cy="240" r="44" fill="url(#glowGold)" opacity=".6"/>
      ${emberField(18,720,260)}`;
  }else{ // ash
    crown=`<g stroke="#2a2530" stroke-width="6" fill="none" opacity=".9">
      <path d="M720 360 L600 180 M720 360 L850 200 M720 360 L720 150 M600 180 L520 120 M850 200 L930 150 M720 150 L680 90 M720 150 L770 100"/>
      </g>`;
  }
  return `<g>
    ${crown}
    <path d="M690 700 Q700 460 710 360 L730 360 Q740 460 750 700 Z" fill="${bark}"/>
    <path d="M710 360 Q670 320 640 300 M730 360 Q780 310 820 290 M715 400 Q660 390 620 400 M725 400 Q800 392 850 410"
      stroke="${state==='ash'?'#2a2530':'#3a2a1c'}" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M690 690 Q640 700 560 720 M750 690 Q820 702 900 722" stroke="${state==='ash'?'#1a1620':'#241a12'}" stroke-width="22" fill="none" stroke-linecap="round" opacity=".8"/>
  </g>`;
}
function emberField(n,cx,cy){let s="";for(let i=0;i<n;i++){const a=Math.random()*6.28,d=Math.random()*180;
  const x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d*.7-Math.random()*60;
  s+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(Math.random()*2+.6).toFixed(1)}" fill="#ffb347" opacity="${(Math.random()*.6+.3).toFixed(2)}"/>`;}
  return s;}

// ===== 배경 장면들 =====
const BG = {
  // 잿빛 들판 + 죽어가는 세계수, 황혼
  vigridDusk(){return svgWrap(`${defs()}
    <rect width="1440" height="810" fill="url(#skyDusk)"/>
    ${stars(90,11)}
    <circle cx="1180" cy="170" r="70" fill="#caa0c0" opacity=".25" filter="url(#soft8)"/>
    <circle cx="1180" cy="170" r="48" fill="#e8d8e8" opacity=".5"/>
    ${worldTree("dying")}
    <path d="M0 620 Q360 560 720 600 T1440 590 L1440 810 L0 810 Z" fill="#1c1620"/>
    <path d="M0 690 Q400 650 720 680 T1440 670 L1440 810 L0 810 Z" fill="#120d18"/>
    <g opacity=".5" stroke="#2a2230" stroke-width="2">
      <path d="M120 700 l8 -40 M180 715 l-6 -34 M1280 700 l-10 -38 M1180 718 l8 -30"/>
    </g>`);},

  // 불타는 발할라 / 황금 궁전 붕괴
  hallaBurning(){return svgWrap(`${defs()}
    <rect width="1440" height="810" fill="url(#skyFire)"/>
    ${emberField(60,720,400)}
    <g opacity=".9">
      <polygon points="300,700 360,300 420,700" fill="#1a1014"/>
      <polygon points="480,700 560,200 640,700" fill="#241418"/>
      <polygon points="700,700 720,140 740,700" fill="#2a161a"/>
      <polygon points="800,700 880,220 960,700" fill="#241418"/>
      <polygon points="1020,700 1080,320 1140,700" fill="#1a1014"/>
      <rect x="280" y="690" width="900" height="120" fill="#0d0810"/>
    </g>
    <g fill="#ffb347" opacity=".8">${emberField(30,560,540)}${emberField(30,900,560)}</g>
    <path d="M520 690 q40 -120 20 -200 q60 90 30 200 Z" fill="#e8732a" opacity=".7" filter="url(#soft)"/>
    <path d="M880 690 q-30 -140 10 -230 q50 110 20 230 Z" fill="#d4541f" opacity=".7" filter="url(#soft)"/>
    <path d="M700 690 q20 -160 0 -260 q40 120 30 260 Z" fill="#f0a23a" opacity=".6" filter="url(#soft)"/>`);},

  // 얼어붙은 강 / 니플헤임의 경계
  frostRiver(){return svgWrap(`${defs()}
    <rect width="1440" height="810" fill="url(#skyFrost)"/>
    ${stars(60,21)}
    <g opacity=".6">
      <polygon points="0,420 200,180 380,420" fill="#1a2a38"/>
      <polygon points="280,420 520,120 760,420" fill="#22384a"/>
      <polygon points="700,420 980,160 1240,420" fill="#1a2a38"/>
      <polygon points="1100,420 1320,220 1440,420" fill="#22384a"/>
    </g>
    <g fill="#cfe8f0" opacity=".7">
      <polygon points="0,200 200,180 220,210 0,230"/>
      <polygon points="520,120 600,150 540,160"/>
      <polygon points="980,160 1040,190 990,200"/>
    </g>
    <path d="M0 540 Q360 500 720 540 T1440 530 L1440 810 L0 810 Z" fill="#16242e"/>
    <path d="M0 600 L1440 590 L1440 810 L0 810 Z" fill="#0e1820"/>
    <g stroke="#9ec8d8" stroke-width="2" opacity=".4" fill="none">
      <path d="M100 660 q200 -10 400 0 M600 700 q300 -12 600 0 M200 740 q400 -8 700 0"/>
    </g>`);},

  // 무지개다리 비프로스트
  bifrost(){return svgWrap(`${defs(`<linearGradient id="rb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8c2f6f"/><stop offset="25%" stop-color="#c4421f"/>
      <stop offset="50%" stop-color="#e5b34b"/><stop offset="75%" stop-color="#3a8c5a"/>
      <stop offset="100%" stop-color="#3a5ac4"/></linearGradient>`)}
    <rect width="1440" height="810" fill="url(#skyVoid)"/>
    ${stars(140,33)}
    <path d="M-50 760 Q720 480 1490 760" stroke="url(#rb)" stroke-width="90" fill="none" opacity=".85" filter="url(#soft)"/>
    <path d="M-50 760 Q720 480 1490 760" stroke="#fff" stroke-width="10" fill="none" opacity=".5"/>
    <path d="M-50 800 Q720 520 1490 800" stroke="url(#rb)" stroke-width="40" fill="none" opacity=".4" filter="url(#soft8)"/>
    ${(()=>{let s="";for(let i=0;i<40;i++){const x=Math.random()*1440,y=Math.random()*810;
      s+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(Math.random()*1.6+.4).toFixed(1)}" fill="#ffe9a8" opacity="${(Math.random()*.6+.2).toFixed(2)}"/>`;}return s;})()}`);},

  // 운명의 샘 / 우르드의 우물
  wellOfFate(){return svgWrap(`${defs()}
    <rect width="1440" height="810" fill="url(#skyVoid)"/>
    ${stars(70,44)}

/* ---------- 3. AUDIO (WebAudio ambient) ---------- */
const Audio2 = (()=>{
  let ctx=null, master=null, nodes=[], muted=false, cur=null;
  function ensure(){
    if(ctx) return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain(); master.gain.value=muted?0:.5; master.connect(ctx.destination);
    }catch(e){ctx=null;}
  }
  function clear(){nodes.forEach(n=>{try{n.stop&&n.stop();}catch(e){} try{n.disconnect&&n.disconnect();}catch(e){}});nodes=[];}
  function drone(freqs, type, gain){
    if(!ctx) return;
    const g=ctx.createGain(); g.gain.value=0; g.connect(master);
    g.gain.linearRampToValueAtTime(gain, ctx.currentTime+2);
    freqs.forEach(f=>{
      const o=ctx.createOscillator(); o.type=type||"sine"; o.frequency.value=f;
      const lfo=ctx.createOscillator(); lfo.frequency.value=.07+Math.random()*.1;
      const lg=ctx.createGain(); lg.gain.value=f*.01; lfo.connect(lg); lg.connect(o.frequency);
      o.connect(g); o.start(); lfo.start(); nodes.push(o,lfo);
    });
    nodes.push(g); return g;
  }
  const MOODS={
    calm:   ()=>{drone([110,164.81,220],"sine",.18);},
    tense:  ()=>{drone([82.41,98,110],"triangle",.16); drone([220],"sine",.05);},
    fire:   ()=>{drone([55,73.42,87.31],"sawtooth",.10); drone([146.83],"triangle",.06);},
    frost:  ()=>{drone([196,261.63,329.63],"sine",.12);},
    sacred: ()=>{drone([130.81,196,261.63,392],"sine",.14);},
    dark:   ()=>{drone([41.2,55,61.74],"sine",.20);},
    hope:   ()=>{drone([174.61,261.63,349.23,523.25],"sine",.13);}
  };
  return {
    play(mood){ ensure(); if(!ctx) return; if(cur===mood) return; cur=mood;
      clear(); (MOODS[mood]||MOODS.calm)(); },
    sfx(kind){ ensure(); if(!ctx||muted) return;
      const o=ctx.createOscillator(), g=ctx.createGain(); o.connect(g); g.connect(master);
      const t=ctx.currentTime;
      if(kind==="select"){o.type="sine"; o.frequency.setValueAtTime(660,t); o.frequency.exponentialRampToValueAtTime(990,t+.08); g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+.18);}
      else if(kind==="choice"){o.type="triangle"; o.frequency.setValueAtTime(440,t); o.frequency.exponentialRampToValueAtTime(880,t+.12); g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.001,t+.25);}
      else if(kind==="boom"){o.type="sawtooth"; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(40,t+.5); g.gain.setValueAtTime(.3,t); g.gain.exponentialRampToValueAtTime(.001,t+.6);}
      else {o.type="sine"; o.frequency.value=550; g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.12);}
      o.start(t); o.stop(t+.7);
    },
    toggle(){ ensure(); muted=!muted; if(master) master.gain.value=muted?0:.5; return muted; },
    resume(){ ensure(); if(ctx&&ctx.state==="suspended") ctx.resume(); },
    isMuted(){return muted;}
  };
})();

norn_intro:{ bg:"vigridDusk", mood:"sacred", art:[["eir","left","neutral"],["norn","right","neutral"]], lines:[
  {who:"norn", t:"눈을 떴구나, 마지막 점화자여."},
  {who:"eir", expr:"shock", t:"점화자? 난…… 내 이름도 모르는데."},
  {who:"norn", t:"이름은 우물에 가라앉았다. 너는 죽은 자였다. 그리고 죽음과 삶의 경계에서 우리가 너를 불러올렸지."},
  {who:"norn", t:"나는 운명을 잣는 노른. 세 자매의 마지막 목소리다. 오늘 밤, 신들의 세계가 불탄다. 그 불을 다시 지필 자— 그것이 너다."},
  {who:"eir", expr:"sad", t:"왜 하필 나지. 난 아무것도 기억나지 않아."},
  {who:"norn", t:"기억이 없기에. 운명에 매이지 않은 자만이 운명을 바꿀 수 있으니."},
], next:"prologue_choice" },

prologue_choice:{ bg:"vigridDusk", mood:"sacred", art:[["norn","right","neutral"]], lines:[
  {who:"norn", t:"네 가슴의 불씨로 무엇을 할지는 네가 정한다. 다만 먼저— 너는 어떤 마음으로 이 황혼을 걷겠느냐?"},
], choices:[
  {t:"신들을 구하겠다. 세계를 다시 지피겠어.", set:{hope:1}, next:"p_hope"},
  {t:"운명이 끝이라면, 끝을 지켜보겠다.", set:{doubt:1}, next:"p_doubt"},
  {t:"누가 이 운명을 적었지? 그자를 만나야겠다.", set:{rebel:1}, next:"p_rebel"},
] },

p_hope:{ bg:"vigridDusk", mood:"sacred", art:[["eir","left","happy"],["norn","right","neutral"]], lines:[
  {who:"eir", expr:"neutral", t:"불이 있다면, 다시 지필 수 있다는 거잖아. 난 그걸 믿어 보겠어."},
  {who:"norn", t:"불을 믿는 자라. 그 믿음이 너를 가장 먼 곳까지 데려가거나— 가장 깊은 재 속에 묻으리라."},
], next:"hub1_intro" },
p_doubt:{ bg:"vigridDusk", mood:"sacred", art:[["eir","left","sad"],["norn","right","neutral"]], lines:[
  {who:"eir", expr:"sad", t:"끝은 끝이야. 억지로 붙드는 건…… 더 잔인할지도 몰라."},
  {who:"norn", t:"끝을 직시하는 눈. 드물구나. 그 눈이 어떤 진실을 보게 될지, 나조차 다 잣지 못했다."},
], next:"hub1_intro" },
p_rebel:{ bg:"vigridDusk", mood:"tense", art:[["eir","left","angry"],["norn","right","neutral"]], lines:[
  {who:"eir", expr:"angry", t:"운명이 적혀 있다면, 적은 자가 있겠지. 난 그 손목을 붙들고 묻겠어. 왜 이렇게 끝나야 하느냐고."},
  {who:"norn", t:"……너는 위험한 불씨로구나. 좋다. 그 분노가 어디까지 타오르는지 보자."},
], next:"hub1_intro" },

hub1_intro:{ bg:"vigridDusk", mood:"calm", art:[["norn","right","neutral"]], lines:[
  {who:"norn", t:"세 길이 너를 부른다. 불타는 발할라의 오딘. 얼어붙은 강 너머의 헬. 그리고 사슬을 끊은 늑대, 펜리르."},
  {who:"norn", t:"황혼은 짧다. 네가 닿을 수 있는 곳은 한정되어 있다. 누구를 먼저 만나겠느냐?"},
], next:"hub1" },

/* ====== HUB 1 — 세 갈래 ====== */
hub1:{ bg:"vigridDusk", mood:"calm", hub:1, lines:[
  {who:"nar", t:"비그리드의 갈림길. 세 방향에서 서로 다른 빛과 어둠이 새어 나온다."},
], choices:[
  {t:"불타는 발할라로 — 오딘을 만난다", cond:s=>!s.metOdin, next:"odin_path"},
  {t:"얼어붙은 강으로 — 헬을 만난다", cond:s=>!s.metHel, next:"hel_path"},
  {t:"부서진 사슬로 — 펜리르를 만난다", cond:s=>!s.metFenrir, next:"fenrir_path"},
  {t:"세 신을 모두 만났다 — 운명의 우물로 간다", cond:s=>s.metOdin&&s.metHel&&s.metFenrir, next:"converge_intro"},
] },

/* ----- ODIN PATH ----- */
odin_path:{ chap:"제1장 · 외눈의 왕", bg:"hallaBurning", mood:"fire", set:{metOdin:1}, art:[["eir","center","shock"]], lines:[
  {who:"nar", t:"황금빛 지붕이 무너지고, 방패로 덮였던 발할라가 불길에 잠겨 있었다. 죽은 전사들의 함성도 이젠 들리지 않는다."},
  {who:"eir", expr:"shock", t:"신들의 궁전이…… 이렇게 불타고 있다니.", sfx:"boom"},
], next:"odin1" },
odin1:{ bg:"hallaBurning", mood:"fire", art:[["eir","left","neutral"],["odin","right","neutral"]], lines:[
  {who:"odin", t:"불 속을 걸어오는 자가 있군. 살아 있는 자의 냄새다. 너는 망자가 아니구나."},
  {who:"eir", expr:"neutral", t:"당신이…… 오딘. 모든 것을 안다는 신."},
  {who:"odin", t:"모든 것을 안다? 하하. 나는 내 한쪽 눈을 우물에 바쳐 지혜를 샀다. 그러나 그 지혜가 보여준 건 단 하나— 이 밤이 온다는 것뿐이었다."},
  {who:"odin", expr:"angry", t:"나는 막으려 했다. 늑대를 묶고, 뱀을 바다에 던지고, 영웅들을 모았지. 그러나 운명은…… 한 글자도 비키지 않았다."},
], next:"odin2" },
odin2:{ bg:"hallaBurning", mood:"fire", art:[["eir","left","sad"],["odin","right","neutral"]], lines:[
  {who:"odin", t:"노른이 너를 보냈겠지. 가슴의 불씨, 보인다. 그것이 세계를 다시 지필 마지막 불."},
  {who:"odin", t:"점화자여. 묻겠다. 너는 그 불로 무엇을 태우려느냐. 무엇을 남기려느냐."},
], choices:[
  {t:"당신들 신을 다시 살리겠습니다.", set:{trustOdin:1}, next:"odin_save"},
  {t:"왜 그렇게 운명에 순순히 따랐죠?", set:{question:1}, next:"odin_q"},
  {t:"솔직히, 신들이 사라지는 게 맞는 것 같습니다.", set:{cold:1}, next:"odin_cold"},
] },
odin_save:{ bg:"hallaBurning", mood:"fire", art:[["eir","left","happy"],["odin","right","happy"]], lines:[
  {who:"odin", expr:"happy", t:"신을 살리겠다…… 오랜만에 듣는 따뜻한 어리석음이군. 좋다."},
  {who:"odin", t:"그렇다면 이것을 받아라. 내 창 궁니르의 마지막 조각. 결코 빗나가지 않는 의지의 파편이다."},
  {who:"nar", t:"오딘이 부러진 창끝을 건넸다. 에이르의 손 안에서 그것은 작은 룬으로 녹아들었다.", sfx:"select"},
  {who:"odin", t:"기억해라. 결코 빗나가지 않는다는 건— 한 번 겨눈 것은 반드시 끝낸다는 뜻이기도 하다."},
], set:{gungnir:1}, next:"odin_end" },
odin_q:{ bg:"hallaBurning", mood:"tense", art:[["eir","left","angry"],["odin","right","sad"]], lines:[
  {who:"eir", expr:"angry", t:"당신은 미래를 봤잖아요. 그런데 왜 그저 따랐죠? 그게 신이 할 일인가요?"},
  {who:"odin", expr:"sad", t:"……아픈 질문이다. 나는 운명을 알았기에, 운명을 준비했다. 영웅을 모으고, 전쟁을 설계했지. 막으려 한 게 아니라— 가장 영광스럽게 지려고 했다."},
  {who:"odin", t:"그게 내 죄다. 나는 끝을 막는 대신, 끝을 멋지게 꾸미는 데 평생을 썼다. 너는…… 부디 다르거라."},
  {who:"nar", t:"오딘의 외눈에서 무언가 떨어졌다. 신의 눈물은 불티가 되어 흩어졌다."},
], set:{odinTruth:1, gungnir:1}, next:"odin_end" },
odin_cold:{ bg:"hallaBurning", mood:"tense", art:[["eir","left","neutral"],["odin","right","angry"]], lines:[
  {who:"eir", expr:"neutral", t:"신들의 시대는 너무 오래됐어요. 인간도, 거인도, 모두 당신들 그림자 아래 살았죠. 끝나는 게 맞을지도."},
  {who:"odin", expr:"angry", t:"……대담하구나. 망자였던 주제에."},
  {who:"odin", expr:"neutral", t:"허나 틀린 말은 아니다. 신이 사라진 세계가 더 자유로울지도 모르지. 나는 그 답을 모른다. 한 번도 신이 아니었던 적이 없으니까."},
  {who:"odin", t:"가라, 차가운 불씨여. 다만 이 룬은 두고 가마. 네가 결국 무언가를 끝내야 할 때, 빗나가지 않도록."},
], set:{gungnir:1, coldHeart:1}, next:"odin_end" },
odin_end:{ bg:"hallaBurning", mood:"fire", art:[["odin","center","neutral"]], lines:[
  {who:"odin", t:"가라. 다른 이들도 너를 기다린다. 늑대는 분노로, 헬은 침묵으로 너를 시험할 것이다."},
  {who:"nar", t:"불길이 마지막 기둥을 삼켰다. 에이르는 발할라를 등지고 다시 갈림길로 돌아섰다.", fx:"fadeArt"},
], next:"hub1" },

/* ----- HEL PATH ----- */
hel_path:{ chap:"제2장 · 침묵의 여왕", bg:"frostRiver", mood:"frost", set:{metHel:1}, art:[["eir","center","neutral"]], lines:[
  {who:"nar", t:"강은 죽은 자들의 이름으로 얼어 있었다. 한 걸음마다 얼음 아래에서 수천의 눈동자가 에이르를 올려다보는 듯했다."},
  {who:"eir", expr:"sad", t:"(이 강 아래…… 전부 죽은 자들이야. 나도, 한때는 이 아래 있었을까.)"},
], next:"hel1" },
hel1:{ bg:"frostRiver", mood:"frost", art:[["eir","left","neutral"],["hel","right","neutral"]], lines:[
  {who:"hel", t:"……살아 있는 발소리. 이 강에선 백 년 만이군."},
  {who:"eir", expr:"shock", t:"당신이 헬. 죽은 자들의 여왕."},
  {who:"hel", t:"여왕이라. 나는 그저 버려진 것들의 보호자다. 신들은 내가 흉하다 하여 명계로 던졌지. 절반은 살, 절반은 죽음— 그 누구도 온전히 사랑하지 않았다."},
  {who:"hel", expr:"sad", t:"그런데 이제 와 세계를 구해 달라고? 너를 보낸 자들이 우습구나."},
], next:"hel2" },
hel2:{ bg:"frostRiver", mood:"frost", art:[["eir","left","sad"],["hel","right","neutral"]], lines:[
  {who:"hel", t:"점화자여. 네 가슴의 불은 산 자의 것이다. 그러나 세계를 다시 지피려면, 죽은 자들의 몫도 필요하다."},
  {who:"hel", t:"내 강에는 잊힌 모든 이름이 잠들어 있다. 그들을 깨워 너에게 줄 수도 있다. 다만— 그건 그들의 안식을 빼앗는 일이지."},
], choices:[
  {t:"안식을 깨워선 안 됩니다. 다른 길을 찾죠.", set:{respectDead:1}, next:"hel_respect"},
  {t:"세계를 위해서라면, 그들의 이름이 필요합니다.", set:{takeDead:1}, next:"hel_take"},
  {t:"당신은 왜 버려졌는데도 명계를 지켜요?", set:{question:1}, next:"hel_why"},
] },
hel_respect:{ bg:"frostRiver", mood:"frost", art:[["eir","left","neutral"],["hel","right","happy"]], lines:[
  {who:"eir", expr:"neutral", t:"죽은 자들은 이미 충분히 줬어요. 이름까지 빼앗을 순 없습니다."},
  {who:"hel", expr:"happy", t:"……살아 있는 자가 죽은 자를 위해 손해를 택하다니. 신들도 안 한 일이다."},
  {who:"hel", t:"좋다. 이름 대신 이것을 줄게. 내 손길— 깨진 것을 잠시 잇는 명계의 자비다. 단 한 번, 끊어진 무언가를 되돌릴 수 있다."},
], set:{helMercy:1, helTrust:1}, next:"hel_end" },
hel_take:{ bg:"frostRiver", mood:"dark", art:[["eir","left","neutral"],["hel","right","sad"]], lines:[
  {who:"eir", expr:"neutral", t:"미안하지만…… 세계를 살리려면 그들의 힘이 필요해요."},
  {who:"hel", expr:"sad", t:"산 자는 늘 그렇게 말하지. '더 큰 선을 위해서'. 그 말에 내 백성이 또 한 번 희생되는군."},
  {who:"hel", t:"가져가라. 잊힌 이름들의 무게를. 그러나 명심해라— 빼앗은 안식은 언젠가 반드시 대가를 청구한다."},
  {who:"nar", t:"얼음 강에서 수많은 속삭임이 에이르의 불씨로 빨려들었다. 불은 더 커졌으나, 빛은 더 차가워졌다.", sfx:"boom"},
], set:{stolenNames:1, coldHeart:1}, next:"hel_end" },
hel_why:{ bg:"frostRiver", mood:"frost", art:[["eir","left","sad"],["hel","right","sad"]], lines:[
  {who:"eir", expr:"sad", t:"신들은 당신을 버렸어요. 그런데 왜 그 신들의 죽은 자까지 지키는 거죠?"},
  {who:"hel", expr:"sad", t:"……누구도 묻지 않은 질문이다. 답은 간단해. 그들은 나를 버렸지만, 죽은 자들은 나를 버리지 않았다."},
  {who:"hel", t:"미움받는 자에게 명계는 감옥이 아니라 집이었다. 버려진 것들끼리는, 서로가 서로의 온기가 되니까."},
  {who:"hel", expr:"neutral", t:"너도 한때 버려진 자였지, 점화자. 그래서 내가 너에게 마음이 가는지도 모르겠다."},
  {who:"hel", t:"이것을 받아라. 명계의 자비. 단 한 번, 끊어진 무언가를 되돌릴 수 있는 손길이다."},
], set:{helMercy:1, helTrust:1, helTruth:1}, next:"hel_end" },
hel_end:{ bg:"frostRiver", mood:"frost", art:[["hel","center","neutral"]], lines:[
  {who:"hel", t:"가라. 늑대가 너를 기다린다. 그 아이는…… 가장 화가 많은 아이다. 부디 너만은 그 분노를 들어주거라."},
  {who:"nar", t:"얼음 강이 등 뒤에서 다시 침묵에 잠겼다.", fx:"fadeArt"},
], next:"hub1" },

/* ----- FENRIR PATH ----- */
fenrir_path:{ chap:"제3장 · 사슬을 끊은 자", bg:"throneVoid", mood:"dark", set:{metFenrir:1}, art:[["eir","center","shock"]], lines:[
  {who:"nar", t:"부서진 사슬 글레이프니르의 조각들이 검은 들판에 흩어져 있었다. 그 한가운데, 산만 한 그림자가 숨을 쉬고 있었다."},
  {who:"eir", expr:"shock", t:"(저게…… 신들이 그토록 두려워한 늑대.)", sfx:"boom"},
], next:"fenrir1" },
fenrir1:{ bg:"throneVoid", mood:"dark", art:[["eir","left","neutral"],["fenrir","right","neutral"]], lines:[
  {who:"fenrir", t:"작은 불씨. 가까이 오는군. 겁이 없는 거냐, 아니면 어리석은 거냐."},
  {who:"eir", expr:"neutral", t:"당신이 펜리르. 해를 삼킨다는 늑대."},
  {who:"fenrir", expr:"angry", t:"해를 삼킨다? 그래. 예언이 그렇게 적었지. 그래서 신들은 내가 새끼였을 때부터 나를 묶었다. 거짓말로, 미소로, 사슬로."},
  {who:"fenrir", t:"내가 무슨 짓을 하기도 전에 죄인이 되었다. '너는 세계를 멸할 것이다'— 그 한 줄 때문에."},
], next:"fenrir2" },
fenrir2:{ bg:"throneVoid", mood:"dark", art:[["eir","left","sad"],["fenrir","right","angry"]], lines:[
  {who:"fenrir", expr:"angry", t:"티르라는 신만이 내게 손을 내밀었다. 사슬을 채울 때, 내가 그의 팔을 물어뜯어도— 그는 약속을 지켰다며 웃었지. 그 하나뿐이었다, 나를 두려워하지 않은 자는."},
  {who:"fenrir", t:"이제 사슬은 끊겼고, 예언은 이루어지는 중이다. 점화자여. 너도 나를 묶으러 왔나? 아니면…… 다른 걸 원하나?"},
], choices:[
  {t:"당신은 예언의 피해자였군요. 미안합니다.", set:{fenrirPity:1}, next:"fenrir_pity"},
  {t:"분노를 거두면, 함께 세계를 구할 수 있어요.", set:{fenrirAlly:1}, next:"fenrir_ally"},
  {t:"예언대로라면, 당신은 멈춰야 합니다.", set:{fenrirFoe:1}, next:"fenrir_foe"},
] },
fenrir_pity:{ bg:"throneVoid", mood:"dark", art:[["eir","left","sad"],["fenrir","right","sad"]], lines:[
  {who:"eir", expr:"sad", t:"태어나기도 전에 죄인이 됐군요. 당신이 한 게 아니라, 예언이 당신을 그렇게 만든 거예요."},
  {who:"fenrir", expr:"sad", t:"……동정인가. 아니. 동정이 아니구나. 너는 정말로…… 이해하려 하고 있어."},
  {who:"fenrir", t:"오랜만이다. 그 눈을. 티르 이후 처음이다. 작은 불씨여, 네 이름을 묻고 싶구나— 하지만 너도 이름이 없겠지."},
  {who:"eir", expr:"neutral", t:"네. 우물에 가라앉았대요. 우린 둘 다 빼앗긴 게 있네요."},

const G = {
  node:null, idx:0, flags:{}, lines:[], typing:false, autoT:null,
  auto:false, skip:false, history:[], pendingChoices:null, started:false,
  endingsSeen: JSON.parse(localStorage.getItem("tlk_endings")||"[]")
};
const $ = id=>document.getElementById(id);
const artLayer=$("artLayer"), portraitWrap=$("portraitWrap"),
  speakerEl=$("speaker"), dlgText=$("dlgText"), dlgBox=$("dlgBox"),
  choicesEl=$("choices"), advHint=$("advanceHint"), fader=$("fader");

let curBgKey=null, curPortraits="";

function setBG(key){
  if(key===curBgKey) return; curBgKey=key;
  const svg=(BG[key]||BG.vigridDusk)();
  const div=document.createElement("div");
  div.innerHTML=svg;
  const el=div.firstChild;
  artLayer.appendChild(el);
  // force reflow then show
  void el.offsetWidth;
  el.classList.add("show");
  // remove old
  const kids=[...artLayer.children];
  if(kids.length>1){
    for(let i=0;i<kids.length-1;i++){
      const old=kids[i]; old.classList.remove("show");
      setTimeout(()=>{ if(old.parentNode) old.parentNode.removeChild(old); },1200);
    }
  }
}

function setPortraits(arr){
  const sig=JSON.stringify(arr||[]);
  if(sig===curPortraits) return; curPortraits=sig;
  portraitWrap.innerHTML="";
  if(!arr) return;
  // 마지막 화자 강조
  arr.forEach(([key,pos,expr])=>{
    if(!CHARS[key]) return;
    const d=document.createElement("div");
    d.className="portrait "+pos;
    d.dataset.key=key;
    d.innerHTML=CHARS[key](expr||"neutral");
    portraitWrap.appendChild(d);
    void d.offsetWidth;
    d.classList.add("show");
  });
}

function highlightSpeaker(who){
  [...portraitWrap.children].forEach(p=>{
    if(p.dataset.key===who || who===""||who==="nar") p.classList.remove("dim");
    else p.classList.add("dim");
  });
}

function updateExpr(who,expr){
  [...portraitWrap.children].forEach(p=>{
    if(p.dataset.key===who && CHARS[who]){
      p.innerHTML=CHARS[who](expr||"neutral");
    }
  });
}

/* fade helpers */
function faderFade(color,cb){
  fader.className=""; void fader.offsetWidth;
  fader.classList.add(color);
  setTimeout(()=>{ cb&&cb(); fader.classList.remove(color); },650);
}
function whiteFlash(cb){
  fader.className="white"; void fader.offsetWidth;
  setTimeout(()=>{ cb&&cb(); fader.classList.remove("white"); },500);
}

/* ---------- node runner ---------- */
function goNode(key){
  const node=STORY[key];
  if(!node){ console.warn("no node",key); return; }
  G.node=key; G.idx=0;
  // hub: reset converge availability handled by cond
  if(node.set) Object.assign(G.flags, node.set);
  if(node.chap) $("chapTitle").textContent=node.chap;
  if(node.mood) Audio2.play(node.mood);

  const run=()=>{
    if(node.bg) setBG(node.bg);
    if(node.clearPortraits) setPortraits([]);
    G.lines=node.lines||[];
    G.pendingChoices=node.choices||null;
    G.idx=0;
    if(G.lines.length) showLine();
    else if(node.choices) showChoices();
    else if(node.next) goNode(node.next);
    else if(node.ending) showEnding(node.ending);
  };

  if(node.fxIn==="whiteFlash") whiteFlash(run);
  else if(node.fxIn==="blackFlash") faderFade("black",run);
  else run();
}

let typeTimer=null;
function showLine(){
  const ln=G.lines[G.idx];
  if(!ln){ afterLines(); return; }
  // portrait management: line may carry its own art via node-level only; we use node art on first
  const node=STORY[G.node];
  if(G.idx===0 && node.art) setPortraits(node.art);
  if(ln.art) setPortraits(ln.art);

  const who=ln.who||"";
  const nm=NAMES[who]||["",""];
  if(who==="nar"||who===""){
    dlgBox.classList.add("narration");
    speakerEl.innerHTML="";
  }else{
    dlgBox.classList.remove("narration");
    speakerEl.innerHTML = `${nm[0]}<span class="ko">${nm[1]}</span>`;
  }
  if(ln.expr) updateExpr(who,ln.expr);
  highlightSpeaker(who);
  if(ln.fx==="fadeArt"){ /* slight pause via art fade already */ }
  if(ln.sfx) Audio2.sfx(ln.sfx);

  // history
  G.history.push({who:nm[1]||(who==="nar"?"":"")||"", txt:ln.t, narr:(who==="nar"||who==="")});
  if(G.history.length>400) G.history.shift();

  typeText(ln.t);
}

function typeText(txt){
  G.typing=true; advHint.style.display="none";
  clearTimeout(typeTimer);
  if(G.skip){ dlgText.textContent=txt; G.typing=false; advHint.style.display="block"; scheduleAutoOrSkip(); return; }
  let i=0; dlgText.textContent="";
  const speed=G.auto?14:20;
  const step=()=>{
    if(!G.typing){ return; }
    if(i<=txt.length){
      dlgText.innerHTML = escapeHtml(txt.slice(0,i)) + '<span class="cursor">▍</span>';
      i++;
      typeTimer=setTimeout(step, txt[i-1]===' '?speed/2:speed);
    }else{
      dlgText.textContent=txt;
      G.typing=false; advHint.style.display="block";
      scheduleAutoOrSkip();
    }
  };
  step();
}
function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function finishTyping(){
  if(!G.typing) return false;
  G.typing=false; clearTimeout(typeTimer);
  const ln=G.lines[G.idx];
  dlgText.textContent=ln?ln.t:"";
  advHint.style.display="block";
  scheduleAutoOrSkip();
  return true;
}

function scheduleAutoOrSkip(){
  clearTimeout(G.autoT);
  if(G.skip){ G.autoT=setTimeout(advance, 120); }
  else if(G.auto){ const ln=G.lines[G.idx]; const dwell=Math.min(3200, 900+(ln?ln.t.length*32:900)); G.autoT=setTimeout(advance,dwell); }
}

function advance(){
  if(G.typing){ finishTyping(); return; }
  G.idx++;
  if(G.idx<G.lines.length){ showLine(); }
  else { afterLines(); }
}

function afterLines(){
  const node=STORY[G.node];
  // branchLine: conditional extra line
  if(node.branchLine && node.branchLine.cond && node.branchLine.cond(G.flags) && !node._blShown){
    node._blShown=true;
    const bl=node.branchLine;
    G.lines=[bl]; G.idx=0; showLine(); return;
  }
  if(node.choices){ showChoices(); return; }
  if(node.next){ goNode(node.next); return; }
  if(node.ending){ showEnding(node.ending); return; }
}

function showChoices(){
  advHint.style.display="none";
  const node=STORY[G.node];
  const list=(G.pendingChoices||node.choices||[]).filter(c=>!c.cond||c.cond(G.flags));
  choicesEl.innerHTML="";
  list.forEach((c,i)=>{
    const b=document.createElement("div");
    b.className="choice"; b.innerHTML=c.t + (c.reqLabel?`<span class="req">${c.reqLabel}</span>`:"");
    b.onclick=()=>{ Audio2.sfx("choice"); G.history.push({who:"— 선택 —",txt:c.t,narr:true});
      choicesEl.style.display="none";
      if(c.set) Object.assign(G.flags,c.set);
      goNode(c.next);
    };
    choicesEl.appendChild(b);
  });
  choicesEl.style.display="flex";
}

function showEnding(end){
  Audio2.play(end.title.includes("SILENCE")?"dark":"hope");
  setTimeout(()=>{
    $("endTitle").textContent=end.title;
    $("endName").textContent=end.name;
    $("endDesc").textContent=end.desc;
    $("endCard").classList.add("open");
    if(!G.endingsSeen.includes(end.title)){
      G.endingsSeen.push(end.title);
      localStorage.setItem("tlk_endings",JSON.stringify(G.endingsSeen));
    }
    G.auto=false; G.skip=false; updateModeBtns();
  }, 600);
}

/* ---------- save / load ---------- */
function saveGame(){
  const data={node:G.node, idx:0, flags:G.flags, history:G.history.slice(-200), chap:$("chapTitle").textContent, t:Date.now()};
  localStorage.setItem("tlk_save", JSON.stringify(data));
  toast("기록되었다 · SAVED");
}
function loadGame(silent){
  const raw=localStorage.getItem("tlk_save");
  if(!raw){ if(!silent) toast("저장된 기록이 없다"); return false; }
  try{
    const d=JSON.parse(raw);
    G.flags=d.flags||{}; G.history=d.history||[];
    Object.keys(STORY).forEach(k=>{ if(STORY[k]) STORY[k]._blShown=false; });
    hideTitle();
    goNode(d.node||"start");
    if(!silent) toast("불러왔다 · LOADED");
    return true;
  }catch(e){ if(!silent) toast("기록을 읽을 수 없다"); return false; }
}
function hasSave(){return !!localStorage.getItem("tlk_save");}

/* ---------- toast ---------- */
let toastT=null;
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1800);
}

/* ---------- backlog ---------- */
function openBacklog(){
  const list=$("backlogList"); list.innerHTML="";
  G.history.slice(-120).forEach(h=>{
    const d=document.createElement("div"); d.className="blog-line";
    d.innerHTML=`${h.who?`<div class="who">${h.who}</div>`:""}<div class="txt">${escapeHtml(h.txt)}</div>`;
    list.appendChild(d);
  });
  $("backlog").classList.add("open");
  list.scrollTop=list.scrollHeight;
}

/* ---------- mode buttons ---------- */
function updateModeBtns(){
  $("btnAuto").classList.toggle("active",G.auto);
  $("btnSkip").classList.toggle("active",G.skip);
  $("btnMute").textContent=Audio2.isMuted()?"♪̶":"♪";
}

/* ---------- title control ---------- */
function buildTitleArt(){
  $("titleArt").innerHTML = BG.bifrost();
  // overlay world tree silhouette + glow handled by bg
}
function hideTitle(){ $("titleScreen").classList.add("hide"); G.started=true; }
function showTitle(){
  $("titleScreen").classList.remove("hide");
  $("endCard").classList.remove("open");
  $("backlog").classList.remove("open");
  $("mContinue").classList.toggle("dis",!hasSave());
  G.auto=false; G.skip=false; updateModeBtns();
}

/* ---------- input ---------- */
function onAdvanceClick(e){
  if(!G.started) return;
  if($("endCard").classList.contains("open")) return;
  if($("backlog").classList.contains("open")) return;
  if(choicesEl.style.display!=="none") return;
  // ignore clicks on top bar / buttons
  if(e.target.closest("#topBar")||e.target.closest(".choice")||e.target.closest(".overlay")||e.target.closest(".menu-btn")) return;
  advance();
}

/* ---------- wire up ---------- */
function startGame(fresh){
  Audio2.resume();
  if(fresh){
    G.flags={}; G.history=[]; G.auto=false; G.skip=false;
    Object.keys(STORY).forEach(k=>{ if(STORY[k]) STORY[k]._blShown=false; });
    hideTitle();
    goNode("start");
  }
}

window.addEventListener("DOMContentLoaded",()=>{
  buildTitleArt();
  // first paint: title visible, ambient on title
  Audio2.play("sacred");

  $("mNew").onclick=()=>{ Audio2.sfx("select"); startGame(true); };
  $("mContinue").onclick=()=>{ if(!hasSave()) return; Audio2.sfx("select"); loadGame(false); };
  $("mGallery").onclick=()=>{ Audio2.sfx("select"); showGallery(); };

  $("btnAuto").onclick=()=>{ G.auto=!G.auto; G.skip=false; updateModeBtns(); if(G.auto&&!G.typing) scheduleAutoOrSkip(); };
  $("btnSkip").onclick=()=>{ G.skip=!G.skip; G.auto=false; updateModeBtns(); if(G.skip){ if(G.typing) finishTyping(); else scheduleAutoOrSkip(); } };
  $("btnLog").onclick=()=>openBacklog();
  $("btnSave").onclick=()=>saveGame();
  $("btnLoad").onclick=()=>loadGame(false);
  $("btnMute").onclick=()=>{ Audio2.toggle(); updateModeBtns(); };
  $("btnTitle").onclick=()=>{ showTitle(); };

  $("endReplay").onclick=()=>{ $("endCard").classList.remove("open"); startGame(true); };
  $("endTitleBtn").onclick=()=>{ showTitle(); };

  document.querySelectorAll("[data-close]").forEach(x=>x.onclick=()=>$(x.dataset.close).classList.remove("open"));

  $("stage").addEventListener("click", onAdvanceClick);

  // keyboard
  window.addEventListener("keydown",(e)=>{
    if(!G.started){ if(e.key==="Enter") $("mNew").click(); return; }
    if(e.key===" "||e.key==="Enter"){ e.preventDefault();
      if(choicesEl.style.display!=="none"){ const sel=choicesEl.querySelector(".kbsel"); if(sel) sel.click(); else { const f=choicesEl.querySelector(".choice"); if(f)f.click(); } }
      else advance();
    }
    else if(e.key==="l"||e.key==="L") openBacklog();
    else if(e.key==="Escape"){ $("backlog").classList.remove("open"); }
    else if(e.key==="a"||e.key==="A") $("btnAuto").click();
    else if((e.key==="ArrowDown"||e.key==="ArrowUp") && choicesEl.style.display!=="none"){
      const items=[...choicesEl.querySelectorAll(".choice")]; if(!items.length) return;
      let cur=items.findIndex(x=>x.classList.contains("kbsel"));
      items.forEach(x=>x.classList.remove("kbsel"));
      cur = e.key==="ArrowDown" ? (cur+1)%items.length : (cur-1+items.length)%items.length;
      items[cur].classList.add("kbsel");
    }
  });

  $("mContinue").classList.toggle("dis",!hasSave());
  updateModeBtns();
});

/* ---------- gallery ---------- */
function showGallery(){
  const all=[
    ["THE KINDLED DAWN","다시 지핀 새벽"],["THE LAST SILENCE","마지막 침묵"],
    ["THE BROKEN WHEEL","부서진 수레바퀴"],["THE UNWRITTEN","적히지 않은 길"]
  ];
  const list=$("backlogList"); list.innerHTML="";
  const h=document.createElement("div"); h.style.cssText="text-align:center;color:var(--ink-dim);margin-bottom:18px;";
  h.textContent=`발견한 엔딩 ${G.endingsSeen.length} / ${all.length}`;
  list.appendChild(h);
  all.forEach(([id,ko])=>{
    const seen=G.endingsSeen.includes(id);
    const d=document.createElement("div"); d.className="blog-line";
    d.style.opacity=seen?"1":".4";
    d.innerHTML=`<div class="who">${seen?id:"？？？"}</div><div class="txt">${seen?ko:"아직 도달하지 못한 결말"}</div>`;
    list.appendChild(d);
  });
  $("backlog").querySelector("h2").textContent="엔딩 기록 · GALLERY";
  $("backlog").classList.add("open");
  // restore title text when closed
  $("backlog").querySelector("[data-close]").onclick=()=>{
    $("backlog").classList.remove("open");
    $("backlog").querySelector("h2").textContent="지나온 말들 · BACKLOG";
  };
}
</script>
</body>
