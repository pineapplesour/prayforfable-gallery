<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON HARBOR — 물 위에 도시가 산다</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#04060d; }
  body { font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif; -webkit-user-select:none; user-select:none; touch-action:none; cursor:crosshair; }
  #stage { position:fixed; inset:0; display:block; }
  /* HUD */
  .hud { position:fixed; pointer-events:none; color:#bfe9ff; mix-blend-mode:screen; text-shadow:0 0 14px rgba(80,200,255,.55); }
  #title { top:26px; left:30px; }
  #title b { display:block; font-size:13px; letter-spacing:.62em; font-weight:600; opacity:.92; }
  #title span { display:block; font-size:10.5px; letter-spacing:.28em; opacity:.5; margin-top:7px; }
  #clock { top:26px; right:30px; text-align:right; font-variant-numeric:tabular-nums; }
  #clock b { font-size:30px; letter-spacing:.06em; font-weight:300; }
  #clock span { display:block; font-size:9.5px; letter-spacing:.34em; opacity:.55; margin-top:3px; }
  #tips { bottom:22px; left:30px; font-size:9.5px; letter-spacing:.26em; opacity:.42; line-height:1.9; }
  #tips u { text-decoration:none; color:#ff8fd0; opacity:.95; }
  #mark { bottom:22px; right:30px; font-size:9px; letter-spacing:.4em; opacity:.34; }
  @media (max-width:560px){
    #title{top:18px;left:18px} #title b{font-size:11px;letter-spacing:.4em} #title span{letter-spacing:.2em}
    #clock{top:18px;right:18px} #clock b{font-size:22px}
    #tips{bottom:16px;left:18px;font-size:8.5px;letter-spacing:.18em}
    #mark{display:none}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hud" id="title"><b>NEON&nbsp;HARBOR</b><span>REFLECTIONS · 反射都市</span></div>
<div class="hud" id="clock"><b id="ct">23:14</b><span id="cd">HARBOR DISTRICT</span></div>
<div class="hud" id="tips">DRAG <u>물결을 휘젓다</u> &nbsp;·&nbsp; CLICK <u>파문</u> &nbsp;·&nbsp; SCROLL <u>시간/시점</u></div>
<div class="hud" id="mark">A·R16 / v06</div>

<script>
"use strict";
(function(){
const cv = document.getElementById('stage');
const g  = cv.getContext('2d', { alpha:false });
let DPR = Math.min(devicePixelRatio || 1, 2);
let W=0, H=0, CW=0, CH=0;       // device px / css px
let horizon=0;                  // css-px y of water line
const TAU = Math.PI*2;
const rand = (a,b)=> a + Math.random()*(b-a);
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const smooth= t=> t*t*(3-2*t);

// ---------- world state ----------
let dayT = 0.74;        // 0..1 time-of-day, drives palette (controlled by scroll)
let camLift = 0.0;      // -1..1 camera height bias (scroll vertical secondary)
let scrollAcc = 0;
const pointer = { x:.5, y:.5, px:.5, py:.5, vx:0, vy:0, down:false, active:false, life:0 };

// ---------- responsive layout ----------
function resize(){
  CW = innerWidth; CH = innerHeight;
  // cap device pixels: smaller phones can afford 2x; large desktops stay crisp at 1.5x
  const cap = CW*CH > 1100*900 ? 1.5 : 2;
  DPR = Math.min(devicePixelRatio || 1, cap);
  W = Math.round(CW*DPR); H = Math.round(CH*DPR);
  cv.width = W; cv.height = H;
  cv.style.width = CW+'px'; cv.style.height = CH+'px';
  horizon = Math.round(CH * (CW<560 ? 0.46 : 0.50));
  buildSkyline();
}

// ---------- palette: time of day ----------
// returns gradient stops + accent set for a given dayT
function palette(t){
  // keyframes: deep night -> blue dusk -> magenta sunset -> teal predawn (loop)
  const KF = [
    { sky:[ '#05070f','#0a1430','#1a2b55' ], glow:'#2a4a8a', neon:['#ff2e88','#19e3ff','#b46bff','#ffd23f'] }, // night
    { sky:[ '#0a0a1a','#241340','#5a2a6e' ], glow:'#7a2e8a', neon:['#ff5e9e','#46d8ff','#ffa24b','#8affd4'] }, // dusk
    { sky:[ '#160a18','#4a1638','#a8324f' ], glow:'#c8344f', neon:['#ffd23f','#ff6a3d','#19e3ff','#ff2e88'] }, // sunset
    { sky:[ '#04101a','#0a3550','#1d6e7a' ], glow:'#1c7a86', neon:['#7affe0','#ffd66b','#ff4fa3','#5ec8ff'] }, // teal predawn
  ];
  const n = KF.length;
  const f = (t%1+1)%1 * n;
  const i = Math.floor(f), j=(i+1)%n, k=smooth(f-i);
  const mixHex=(A,B,m)=>{
    const a=parseInt(A.slice(1),16), b=parseInt(B.slice(1),16);
    const ar=a>>16&255,ag=a>>8&255,ab=a&255, br=b>>16&255,bg=b>>8&255,bb=b&255;
    return [Math.round(lerp(ar,br,m)),Math.round(lerp(ag,bg,m)),Math.round(lerp(ab,bb,m))];
  };
  const toCss=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
  const A=KF[i], B=KF[j];
  return {
    sky: [ toCss(mixHex(A.sky[0],B.sky[0],k)), toCss(mixHex(A.sky[1],B.sky[1],k)), toCss(mixHex(A.sky[2],B.sky[2],k)) ],
    skyRGB: [ mixHex(A.sky[0],B.sky[0],k), mixHex(A.sky[1],B.sky[1],k), mixHex(A.sky[2],B.sky[2],k) ],
    glow: mixHex(A.glow,B.glow,k),
    neon: A.neon.map((c,ix)=> mixHex(c, B.neon[ix], k)),
  };
}

// ---------- skyline generation (procedural, layered for parallax) ----------
let layers = [];   // each: {depth, build:[{x,w,h,topY, hue, lights:[...], roof}], color}
function buildSkyline(){
  layers = [];
  const baseY = horizon;
  // 3 depth layers, back -> front
  const cfg = [
    { depth:0.22, count: Math.max(10, Math.round(CW/70)), minW:34, maxW:74, minH:0.16, maxH:0.42, dim:0.40 },
    { depth:0.45, count: Math.max(9,  Math.round(CW/95)), minW:46, maxW:104,minH:0.24, maxH:0.62, dim:0.66 },
    { depth:0.80, count: Math.max(7,  Math.round(CW/135)),minW:62, maxW:150,minH:0.34, maxH:0.92, dim:1.00 },
  ];
  for (const c of cfg){
    const builds=[];
    let x = -rand(20,90);
    const span = CW + 160;
    while (x < span){
      const w = rand(c.minW, c.maxW) * (CW<560?0.72:1);
      const h = baseY * rand(c.minH, c.maxH);
      const topY = baseY - h;
      // window light grid
      const cols = Math.max(2, Math.floor(w/13));
      const rows = Math.max(3, Math.floor(h/15));
      const lights=[];
      const hueIdx = (Math.random()<0.5)?0:(Math.random()<0.6?1:(Math.random()<0.7?2:3));
      const lit = rand(0.18, 0.52);
      for (let r=0;r<rows;r++){
        for (let cc=0; cc<cols; cc++){
          if (Math.random()<lit){
            lights.push({
              lx: (cc+0.5)/cols, ly:(r+0.5)/rows,
              tw: Math.random()<0.30 ? rand(0.6,2.2) : 0,   // twinkle speed (some windows breathe)
              ph: rand(0,TAU),
              hue: (Math.random()<0.82)? hueIdx : ((hueIdx+1+ (Math.random()*3|0))%4),
              br: rand(0.55,1)
            });
          }
        }
      }
      // antenna / roof beacon for tall ones
      const beacon = (h > baseY*0.55 && Math.random()<0.6);
      builds.push({ x, w, h, topY, cols, rows, lights, beacon, beaconPh:rand(0,TAU), hueIdx });
      x += w + rand(2, 16);
    }
    layers.push({ depth:c.depth, dim:c.dim, builds });
  }
}

// ---------- ripples (click) ----------
const ripples = [];
function addRipple(x,y,strength){
  ripples.push({ x, y, r:0, max: rand(180,340)*(CW/1200+0.6), life:1, str:strength });
  if (ripples.length>26) ripples.shift();
}

// ---------- floating light motes on the water ----------
const motes=[];
function initMotes(){
  motes.length=0;
  const n = CW<560? 26 : 54;
  for(let i=0;i<n;i++) motes.push({ x:rand(0,1), y:rand(0,1), s:rand(0.4,1.6), sp:rand(0.06,0.22), ph:rand(0,TAU), hue:(Math.random()*4|0) });
}

// ---------- input ----------
function setPointer(cx,cy){
  pointer.px=pointer.x; pointer.py=pointer.y;
  pointer.x = cx/CW; pointer.y = cy/CH;
  pointer.vx = pointer.x-pointer.px; pointer.vy=pointer.y-pointer.py;
  pointer.active=true; pointer.life=1;
}
cv.addEventListener('pointermove', e=>{ setPointer(e.clientX, e.clientY); }, {passive:true});
cv.addEventListener('pointerdown', e=>{
  pointer.down=true; setPointer(e.clientX,e.clientY);
  addRipple(e.clientX, e.clientY*0 + clamp(e.clientY, horizon, CH), 1.0); // ripple on water
  if (e.clientY < horizon) addRipple(e.clientX, 2*horizon - e.clientY, 0.7); // mirror tap above -> echo below
}, {passive:true});
addEventListener('pointerup', ()=>{ pointer.down=false; }, {passive:true});
cv.addEventListener('pointerleave', ()=>{ pointer.active=false; }, {passive:true});

addEventListener('wheel', e=>{
  e.preventDefault();
  scrollAcc += e.deltaY;
  dayT += e.deltaY * 0.00016;
  camLift = clamp(camLift - e.deltaY*0.00018, -1, 1);
}, {passive:false});

// touch scroll -> time
let lastTouchY=null;
cv.addEventListener('touchstart', e=>{ if(e.touches[0]) lastTouchY=e.touches[0].clientY; }, {passive:true});
cv.addEventListener('touchmove', e=>{
  if(e.touches[0] && lastTouchY!=null){
    const dy = lastTouchY - e.touches[0].clientY;
    dayT += dy*0.0006; camLift=clamp(camLift+dy*0.0006,-1,1);
    lastTouchY = e.touches[0].clientY;
  }
}, {passive:true});

addEventListener('resize', resize);

// ---------- offscreen city buffer (drawn once per frame above water, then sampled for reflection) ----------
let cityBuf = document.createElement('canvas');
let cbx = cityBuf.getContext('2d');
// vertically-flipped copy of the city, used as the reflection source (true top-bottom mirror)
let flipBuf = document.createElement('canvas');
let fbx = flipBuf.getContext('2d');
// low-res bloom buffer (cheap neon glow)
let bloomBuf = document.createElement('canvas');
let blx = bloomBuf.getContext('2d');

// draw the city (sky + skyline) into target ctx, in CSS px coords scaled by DPR
function drawCity(ctx, pal, time){
  // sky gradient
  const sg = ctx.createLinearGradient(0,0,0,horizon);
  sg.addColorStop(0, pal.sky[0]);
  sg.addColorStop(0.55, pal.sky[1]);
  sg.addColorStop(1, pal.sky[2]);
  ctx.fillStyle = sg; ctx.fillRect(0,0,CW,horizon+2);

  // stars (only when darker) — cheap deterministic
  const darkness = clamp(1 - Math.abs(((dayT%1+1)%1)-0.0)*0.0, 0,1);
  drawStars(ctx, time);

  // big atmospheric glow behind tallest layer (the city's light pollution dome)
  const domeY = horizon;
  const grd = ctx.createRadialGradient(CW*0.5, domeY, 10, CW*0.5, domeY, Math.max(CW,horizon)*0.85);
  grd.addColorStop(0, `rgba(${pal.glow[0]},${pal.glow[1]},${pal.glow[2]},0.55)`);
  grd.addColorStop(0.4, `rgba(${pal.glow[0]},${pal.glow[1]},${pal.glow[2]},0.16)`);
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd; ctx.fillRect(0,0,CW,horizon+4);

  // moon / sun disc depending on dayT
  drawCelestial(ctx, pal, time);

  // skyline layers back->front
  for (let li=0; li<layers.length; li++){
    const L = layers[li];
    const par = (pointer.x-0.5) * 26 * L.depth;     // horizontal parallax with pointer
    const lift = camLift * 30 * L.depth;
    ctx.save();
    ctx.translate(par, lift);
    drawLayer(ctx, L, pal, time);
    ctx.restore();
  }
}

function drawStars(ctx, time){
  // deterministic star field via hashed positions; fade by layer depth
  const N = CW<560?70:130;
  ctx.save();
  for (let i=0;i<N;i++){
    const sx = ((i*131.71)%1.0?(( (i*97.13)%CW )):0);
    const x = (Math.sin(i*12.9898)*43758.5453 % 1 + 1)%1 * CW;
    const y = (Math.sin(i*78.233)*12543.987 % 1 + 1)%1 * (horizon*0.82);
    const tw = 0.4 + 0.6*Math.abs(Math.sin(time*0.0009*(0.5+ (i%5)) + i));
    ctx.globalAlpha = 0.5*tw;
    ctx.fillStyle = '#cfe6ff';
    ctx.fillRect(x, y, 1.1, 1.1);
  }
  ctx.restore();
}

function drawCelestial(ctx, pal, time){
  const t = (dayT%1+1)%1;
  const cx = lerp(CW*0.18, CW*0.84, ((t*1.3)%1));
  const cy = horizon*0.30 + Math.sin(t*TAU)*horizon*0.12;
  const R = CW<560? 30 : 46;
  ctx.save();
  const gg = ctx.createRadialGradient(cx,cy,1,cx,cy,R*3.4);
  const c = pal.neon[3];
  gg.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},0.9)`);
  gg.addColorStop(0.18,`rgba(${c[0]},${c[1]},${c[2]},0.5)`);
  gg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(cx,cy,R*3.4,0,TAU); ctx.fill();
  ctx.fillStyle=`rgba(${c[0]+30},${c[1]+20},${c[2]+30},0.95)`;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,TAU); ctx.fill();
  ctx.restore();
  drawCelestial._x=cx; drawCelestial._y=cy; drawCelestial._R=R; drawCelestial._c=c;
}

function drawLayer(ctx, L, pal, time){
  ctx.save();
  for (const b of L.builds){
    // building body — subtle vertical gradient, darker than sky so silhouette reads
    const bg = ctx.createLinearGradient(0,b.topY,0,horizon);
    const s = pal.skyRGB;
    const f = 0.10 + 0.10*L.depth;
    bg.addColorStop(0, `rgb(${(s[0][0]*f)|0},${(s[0][1]*f)|0},${(s[0][2]*f)|0})`);
    bg.addColorStop(1, `rgb(${(s[2][0]*f*1.3)|0},${(s[2][1]*f*1.3)|0},${(s[2][2]*f*1.3)|0})`);
    ctx.fillStyle = bg;
    ctx.fillRect(b.x, b.topY, b.w, b.h);
    // crisp lit rim on one edge (neon edge accent on front layer)
    if (L.depth>0.7){
      const ec = pal.neon[b.hueIdx];
      ctx.fillStyle = `rgba(${ec[0]},${ec[1]},${ec[2]},0.10)`;
      ctx.fillRect(b.x, b.topY, 2, b.h);
    }
  }
  // windows in additive pass for glow
  ctx.globalCompositeOperation='lighter';
  for (const b of L.builds){
    const wcell = b.w/b.cols, hcell=b.h/b.rows;
    const wsz = Math.max(1.3, wcell*0.46), hsz=Math.max(1.6, hcell*0.5);
    for (const w of b.lights){
      let br = w.br * L.dim;
      if (w.tw>0) br *= 0.55 + 0.45*Math.sin(time*0.001*w.tw + w.ph);
      if (br<0.04) continue;
      const c = pal.neon[w.hue];
      const wx = b.x + w.lx*b.w, wy = b.topY + w.ly*b.h;
      // soft halo around brighter windows (only front layers, only bright ones — bounded)
      if (L.depth>0.6 && br>0.7){
        ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${0.16*br})`;
        ctx.fillRect(wx-wsz*1.3, wy-hsz*1.1, wsz*2.6, hsz*2.2);
      }
      ctx.fillStyle = `rgba(${Math.min(255,c[0]+40)},${Math.min(255,c[1]+40)},${Math.min(255,c[2]+40)},${0.95*br})`;
      ctx.fillRect(wx-wsz/2, wy-hsz/2, wsz, hsz);
    }
    if (b.beacon){
      const pulse = 0.4+0.6*Math.abs(Math.sin(time*0.0018 + b.beaconPh));
      const bx=b.x+b.w*0.5;
      ctx.fillStyle=`rgba(255,60,80,${0.85*pulse*L.dim})`;
      ctx.beginPath(); ctx.arc(bx, b.topY-4, 2.4, 0, TAU); ctx.fill();
      ctx.fillStyle=`rgba(255,60,80,${0.18*pulse*L.dim})`;
      ctx.beginPath(); ctx.arc(bx, b.topY-4, 9, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}

// ---------- water reflection: sample city columns, draw shifted/warped vertical slices ----------
function drawWater(time){
  const wH = CH - horizon;
  if (wH<=2) return;
  const SLICE = CW<560? 4 : 3;            // px width per slice (perf cap)
  const cols = Math.ceil(CW/SLICE);
  // base dark water fill (so gaps don't show sky)
  const wg = g.createLinearGradient(0,horizon,0,CH);
  const pal = currentPal;
  wg.addColorStop(0, `rgba(${pal.skyRGB[2][0]*0.5|0},${pal.skyRGB[2][1]*0.5|0},${pal.skyRGB[2][2]*0.6|0},1)`);
  wg.addColorStop(1, '#02040a');
  g.fillStyle = wg; g.fillRect(0,horizon,CW,wH+1);

  // pointer wake influence — a moving disturbance following the cursor on the water
  const wake = pointer.active ? clamp(Math.hypot(pointer.vx,pointer.vy)*40,0,1) : 0;
  const wakeX = pointer.x*CW, wakeY = clamp(pointer.y*CH, horizon, CH);

  // -------- band-based mirrored reflection (perf: ~bands full-width blits, not cols*bands) --------
  // Each band is ONE drawImage of the full-width city, sampled from the vertically-mirrored
  // city region and pushed horizontally by traveling waves. Localized ripple/pointer distortion
  // is added as a few extra displaced segment blits ONLY where a disturbance is active.
  // adaptive band count: more bands = smoother warp, fewer = faster. scale with measured fps.
  const baseBands = wH < 300 ? 16 : 22;
  const bands = fpsAvg < 40 ? Math.max(11, baseBands-7) : baseBands;
  const bh = wH/bands;
  const ph = time*0.0011;
  g.save();
  for (let bI=0; bI<bands; bI++){
    const wy = horizon + bI*bh;                 // top of this water band (dst y, css px)
    const depth = (bI+0.5)/bands;               // 0 near horizon .. 1 deep
    // flipBuf is the city mirrored top->bottom, so the reflected source row == same y as wy.
    const srcY = wy;                             // (css px) sample from flipped buffer
    // traveling-wave horizontal shift for the whole band (broken-mirror feel)
    const dx =
      Math.sin(wy*0.045 + ph*1.7) * (1.5 + depth*11) +
      Math.sin(wy*0.115 - ph*2.4) * (0.8 + depth*6) +
      Math.cos(wy*0.024 + ph*1.05)* (1.2 + depth*8) +
      (pointer.active ? pointer.vx*CW*0.55*Math.exp(-Math.abs(wy-wakeY)/90)*(0.5+depth) : 0);
    g.globalAlpha = (0.97 - depth*0.46);
    // full-width band blit from the vertically-flipped city
    try {
      g.drawImage(flipBuf,
        0, srcY*DPR, W, (bh+1)*DPR,   // src rect (flipped city)
        dx, wy, CW, bh+1);            // dst rect (water), horizontally displaced
    } catch(e){}
  }
  g.restore();

  // localized distortion bursts: only near active ripples / pointer wake (cheap, bounded)
  function localBurst(cx, cy, rad, amp, segH){
    if (cy < horizon-bh || cy > CH+bh) return;
    const x0 = Math.max(0, cx-rad), x1 = Math.min(CW, cx+rad);
    if (x1<=x0) return;
    const segs = 7;
    const sw = (x1-x0)/segs;
    for (let s=0;s<segs;s++){
      const sx = x0 + s*sw + sw*0.5;
      const d = Math.abs(sx-cx);
      const fall = 1 - d/rad; if (fall<=0) continue;
      const wob = Math.sin((d - (cy-horizon))*0.16 - time*0.02) * amp * fall;
      const srcY = clamp(cy, horizon, CH-1);   // flipBuf: same y as the water row
      g.globalAlpha = 0.55*fall;
      try {
        g.drawImage(flipBuf,
          (sx-sw*0.5)*DPR, srcY*DPR, sw*DPR, segH*DPR,
          sx-sw*0.5 + wob, cy, sw+1, segH+1);
      } catch(e){}
    }
  }
  g.save();
  for (const rp of ripples){
    if (rp.y < horizon) continue;
    localBurst(rp.x, rp.y - rp.r, Math.min(rp.r+30, 220), 18*rp.life*rp.str, bh*0.9);
    localBurst(rp.x, rp.y + rp.r, Math.min(rp.r+30, 220), 18*rp.life*rp.str, bh*0.9);
  }
  if (pointer.active && Math.hypot(pointer.vx,pointer.vy) > 0.003){
    localBurst(wakeX, wakeY, 150, 22, bh);
  }
  g.restore();

  // color-grade the water: deepen + blue-tint so the reflection reads as *water*, not a copy
  g.save();
  const tg = g.createLinearGradient(0,horizon,0,CH);
  tg.addColorStop(0, 'rgba(6,14,30,0.10)');
  tg.addColorStop(0.5,'rgba(4,10,26,0.30)');
  tg.addColorStop(1, 'rgba(2,5,14,0.62)');
  g.fillStyle = tg; g.fillRect(0,horizon,CW,wH+1);
  g.restore();

  // expanding ripple rings on the surface (visible neon-lit wavefronts from clicks)
  g.save();
  g.globalCompositeOperation='lighter';
  for (const rp of ripples){
    if (rp.y < horizon) continue;
    const a = rp.life*rp.life*0.5*rp.str;
    if (a<0.02 || rp.r < 2) continue;
    const cc = pal.glow;
    const rx = Math.max(2, rp.r), ry = Math.max(0.8, rp.r*0.32);
    g.strokeStyle = `rgba(${cc[0]+60},${cc[1]+90},${Math.min(255,cc[2]+120)},${a})`;
    g.lineWidth = 1.4;
    g.beginPath(); g.ellipse(rp.x, rp.y, rx, ry, 0, 0, TAU); g.stroke();
    g.strokeStyle = `rgba(${cc[0]+30},${cc[1]+50},${Math.min(255,cc[2]+80)},${a*0.5})`;
    g.beginPath(); g.ellipse(rp.x, rp.y, Math.max(2,rx*0.62), Math.max(0.8,ry*0.62), 0, 0, TAU); g.stroke();
  }
  g.restore();

  // shimmering specular streaks (additive) — the neon highlights skating on the surface
  g.save();
  g.globalCompositeOperation='lighter';
  const sn = CW<560? 60 : 120;
  for(let i=0;i<sn;i++){
    const fx = (Math.sin(i*45.3)*0.5+0.5);
    const x = fx*CW;
    const dep = (Math.sin(i*9.7)*0.5+0.5);
    const y = horizon + dep*wH;
    const sway = Math.sin(time*0.002 + i + x*0.01)* (4+dep*22);
    const ci = i%4;
    const cc = pal.neon[ci];
    const a = (0.05 + 0.10*Math.abs(Math.sin(time*0.0015+i))) * (1-dep*0.4);
    g.fillStyle = `rgba(${cc[0]},${cc[1]},${cc[2]},${a})`;
    const len = 12 + dep*60;
    g.fillRect(x+sway - len/2, y, len, 1.4 + dep*1.6);
  }
  g.restore();

  // floating motes drifting on surface
  g.save();
  g.globalCompositeOperation='lighter';
  for(const m of motes){
    m.x += m.sp*0.0006; if(m.x>1.05) m.x-=1.1;
    const x=m.x*CW;
    const y=horizon + (0.06 + m.y*0.9)*wH + Math.sin(time*0.001*m.sp*6+m.ph)*3;
    const cc=pal.neon[m.hue];
    const tw=0.4+0.6*Math.abs(Math.sin(time*0.001+m.ph));
    g.fillStyle=`rgba(${cc[0]},${cc[1]},${cc[2]},${0.5*tw})`;
    const r=m.s*(0.7+ (y-horizon)/wH*1.2);
    g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }
  g.restore();

  // horizon line glow seam
  g.save();
  g.globalCompositeOperation='lighter';
  const seam=g.createLinearGradient(0,horizon-8,0,horizon+22);
  seam.addColorStop(0,'rgba(0,0,0,0)');
  seam.addColorStop(0.4,`rgba(${pal.glow[0]},${pal.glow[1]},${pal.glow[2]},0.5)`);
  seam.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=seam; g.fillRect(0,horizon-8,CW,30);
  g.restore();

  // soft dark vignette over whole frame
  g.save();
  const vg=g.createRadialGradient(CW*0.5,CH*0.46,CH*0.2, CW*0.5,CH*0.5, CH*0.85);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.5)');
  g.fillStyle=vg; g.fillRect(0,0,CW,CH);
  g.restore();
}

// ---------- main loop ----------
let currentPal = palette(dayT);
let startT = performance.now();
let lastFrame = startT;
let fpsAvg = 60;

function frame(now){
  const dt = Math.min(50, now-lastFrame); lastFrame=now;
  fpsAvg = lerp(fpsAvg, 1000/Math.max(1,dt), 0.05);
  const time = now - startT;

  // ease autonomous drift so it's alive even idle: gentle time progression
  dayT += 0.000004 * dt;
  camLift *= 0.985;
  // pointer life decay
  if (!pointer.down){ pointer.vx*=0.9; pointer.vy*=0.9; }
  pointer.life *= 0.94; if (pointer.life<0.02) pointer.active = pointer.down;

  currentPal = palette(dayT);

  // update ripples
  for (let i=ripples.length-1;i>=0;i--){
    const r=ripples[i]; r.r += dt*0.32*(1+r.str*0.4); r.life -= dt*0.0011; if(r.life<=0||r.r>r.max) ripples.splice(i,1);
  }

  // 1) render city to offscreen buffer (CSS px space scaled by DPR)
  if (cityBuf.width!==W || cityBuf.height!==H){ cityBuf.width=W; cityBuf.height=H; cbx=cityBuf.getContext('2d'); }
  cbx.setTransform(DPR,0,0,DPR,0,0);
  cbx.clearRect(0,0,CW,CH);
  cbx.fillStyle='#04060d'; cbx.fillRect(0,0,CW,horizon+2);
  drawCity(cbx, currentPal, time);

  // 1b) build vertically-flipped reflection source (one blit)
  if (flipBuf.width!==W || flipBuf.height!==H){ flipBuf.width=W; flipBuf.height=H; fbx=flipBuf.getContext('2d'); }
  fbx.setTransform(1,0,0,1,0,0);
  fbx.clearRect(0,0,W,H);
  fbx.save();
  fbx.translate(0, H);
  fbx.scale(1, -1);
  fbx.drawImage(cityBuf, 0, 0);
  fbx.restore();

  // 2) blit city onto main canvas (upper half) at DPR
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle='#04060d'; g.fillRect(0,0,W,H);
  g.drawImage(cityBuf, 0,0, W, horizon*DPR+2, 0,0, W, horizon*DPR+2);

  // 3) water reflection (works in CSS px; uses internal DPR scaling)
  g.setTransform(DPR,0,0,DPR,0,0);
  drawWater(time);

  // 4) cheap neon bloom WITHOUT the (software-slow) CSS blur filter:
  //    aggressively downscale the bright city + reflection into a tiny buffer, then upscale with
  //    bilinear smoothing — the upscale itself IS the blur. Two-tap for a softer falloff.
  const bw = Math.max(120, Math.round(CW*0.14)), bh2 = Math.max(76, Math.round(CH*0.14));
  if (bloomBuf.width!==bw || bloomBuf.height!==bh2){ bloomBuf.width=bw; bloomBuf.height=bh2; blx=bloomBuf.getContext('2d'); blx.imageSmoothingEnabled=true; }
  blx.setTransform(1,0,0,1,0,0);
  blx.globalCompositeOperation='source-over';
  blx.clearRect(0,0,bw,bh2);
  blx.drawImage(cityBuf, 0,0, W,H, 0,0, bw,bh2);          // city glow (downscaled)
  blx.globalCompositeOperation='lighter';
  blx.drawImage(flipBuf, 0,0, W,H, 0,0, bw,bh2);          // reflection glow (downscaled)
  blx.globalCompositeOperation='source-over';
  g.setTransform(1,0,0,1,0,0);
  g.globalCompositeOperation='lighter';
  g.imageSmoothingEnabled = true;
  // single soft upscale tap (bilinear upscale = the blur)
  g.globalAlpha = 0.52; g.drawImage(bloomBuf, 0,0, bw,bh2, 0,0, W,H);
  g.globalAlpha = 1; g.globalCompositeOperation='source-over';

  // update HUD clock from dayT
  updateClock();

  requestAnimationFrame(frame);
}

// HUD time text
const ctEl=document.getElementById('ct'), cdEl=document.getElementById('cd');
const DISTRICTS=['HARBOR DISTRICT','NIGHT BAY','MIRROR QUAY','LUMEN PORT'];
let _clkAcc=0;
function updateClock(){
  const t=(dayT%1+1)%1;
  // map 0..1 to 18:00 .. next 18:00 (evening loop), keeps it nocturnal-ish
  const hours = (18 + t*24) % 24;
  const h=Math.floor(hours), m=Math.floor((hours-h)*60);
  ctEl.textContent = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  cdEl.textContent = DISTRICTS[Math.floor(t*DISTRICTS.length)%DISTRICTS.length];
}

// ---------- boot ----------
resize();
initMotes();
// seed a couple ambient ripples so first paint already has life on water
addRipple(CW*0.32, horizon+ (CH-horizon)*0.4, 0.5);
addRipple(CW*0.7,  horizon+ (CH-horizon)*0.65,0.4);
requestAnimationFrame(frame);

// expose minimal hooks for verification
window.__neon = { state:()=>({ fps:fpsAvg, ripples:ripples.length, dayT, horizon, CW, CH }),
                  ripple:(x,y)=>addRipple(x,y,1), drag:(x,y,vx,vy)=>{ pointer.active=true; pointer.x=x/CW; pointer.y=y/CH; pointer.vx=vx; pointer.vy=vy; pointer.life=1; },
                  scroll:(d)=>{ dayT+=d*0.00016; } };
})();
</script>
