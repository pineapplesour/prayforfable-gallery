<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CHROMASPHERE — spectral field</title>
<style>
  :root{ --ink:#eef1ff; --dim:rgba(238,241,255,.42); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; width:100%; overflow:hidden; background:#05060a; }
  body{
    font-family:'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased; touch-action:none; cursor:crosshair;
  }
  #gl{ position:fixed; inset:0; width:100%; height:100%; display:block; }

  .ui{ position:fixed; inset:0; pointer-events:none; z-index:5; }

  .mark{
    position:absolute; top:clamp(20px,3.4vw,40px); left:clamp(20px,3.4vw,44px);
    transition:opacity 1.4s ease; mix-blend-mode:screen;
  }
  .mark .t1{ font-size:clamp(15px,1.5vw,21px); font-weight:700; letter-spacing:.42em; }
  .mark .t2{
    margin-top:9px; font-size:clamp(9px,.82vw,11px); font-weight:400;
    letter-spacing:.34em; color:var(--dim); text-transform:uppercase;
  }
  .mark .bar{
    margin-top:13px; height:1px; width:min(34vw,300px);
    background:linear-gradient(90deg,rgba(238,241,255,.55),rgba(238,241,255,0));
  }

  .idx{
    position:absolute; top:clamp(20px,3.4vw,40px); right:clamp(20px,3.4vw,44px);
    text-align:right; font-size:clamp(9px,.82vw,11px); letter-spacing:.3em;
    color:var(--dim); text-transform:uppercase; transition:opacity 1.4s ease; mix-blend-mode:screen;
  }
  .idx b{ color:var(--ink); font-weight:600; }

  .hint{
    position:absolute; left:50%; bottom:clamp(22px,4vw,42px); transform:translateX(-50%);
    font-size:clamp(10px,.92vw,12.5px); letter-spacing:.26em; text-transform:uppercase;
    color:var(--dim); text-align:center; transition:opacity .6s ease; white-space:nowrap;
  }
  .hint .pulse{ color:var(--ink); animation:bl 2.4s ease-in-out infinite; }
  @keyframes bl{ 0%,100%{opacity:.35} 50%{opacity:1} }

  .ctl{
    position:absolute; left:50%; bottom:clamp(20px,3.6vw,38px); transform:translateX(-50%);
    display:flex; gap:10px; pointer-events:auto; opacity:0; transition:opacity .8s ease;
  }
  .ctl button{
    pointer-events:auto; cursor:pointer; font:inherit; color:var(--ink);
    font-size:clamp(9.5px,.82vw,11px); letter-spacing:.22em; text-transform:uppercase;
    padding:10px 16px; border-radius:100px; background:rgba(255,255,255,.045);
    border:1px solid rgba(238,241,255,.16); backdrop-filter:blur(8px);
    transition:background .25s ease,border-color .25s ease,transform .25s ease;
  }
  .ctl button:hover{ background:rgba(255,255,255,.11); border-color:rgba(238,241,255,.4); }
  .ctl button:active{ transform:scale(.95); }
  .ctl button.on{ background:rgba(238,241,255,.92); color:#06070c; border-color:transparent; }

  .show{ opacity:1 !important; }
  .gone{ opacity:0 !important; }
  .dimd{ opacity:.32 !important; }

  .fb{ position:fixed; inset:0; display:none; align-items:center; justify-content:center;
       text-align:center; padding:30px; color:var(--dim); font-size:13px; letter-spacing:.1em; z-index:9; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="ui">
  <div class="mark" id="mark">
    <div class="t1">CHROMASPHERE</div>
    <div class="t2">spectral field · no.04</div>
    <div class="bar"></div>
  </div>
  <div class="idx" id="idx">64-band radial<br><b id="mode">simulated signal</b></div>
  <div class="hint" id="hint"><span class="pulse">click / tap</span> &nbsp;to awaken sound &nbsp;·&nbsp; move to bend space &nbsp;·&nbsp; scroll to charge</div>
  <div class="ctl" id="ctl">
    <button id="bSound" class="on">sound</button>
    <button id="bMic">mic</button>
  </div>
</div>
<div class="fb" id="fb">WebGL is required to view this piece.</div>

<script>
"use strict";
(function(){
/* ============================== WebGL boot ============================== */
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl',{antialias:false,alpha:false,powerPreference:'high-performance'})
        || cv.getContext('experimental-webgl');
if(!gl){ document.getElementById('fb').style.display='flex'; return; }

const VERT = `attribute vec2 aPos; void main(){ gl_Position = vec4(aPos,0.0,1.0); }`;

const FRAG = `
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform vec2  uMouse;
uniform sampler2D uBands;
uniform float uLevel, uBass, uMid, uTreble, uEnergy, uActive, uPulse;

#define TAU 6.28318530718
mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
float hash(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.345); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=rot(0.6)*p*1.92; a*=0.5; } return v; }
vec3 pal(float t){ return 0.5 + 0.5*cos(TAU*(t + vec3(0.0,0.18,0.37))); }
float bandAt(float x){ return texture2D(uBands, vec2(clamp(x,0.0,1.0),0.5)).r; }

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;

  // gravitational bend around the cursor
  vec2 dm = uv - uMouse; float dl = length(dm);
  uv += normalize(dm + 1e-4) * (-0.055) * exp(-dl*2.4) * (0.55 + uBass*1.4);

  vec2 p = uv;
  float zoom = 1.0 - 0.12*uEnergy + 0.045*uBass;
  p *= zoom;
  float spin = uTime*0.055 + uEnergy*0.55 + uPulse*0.06;
  p = rot(spin)*p;

  float r = length(p);
  float a = atan(p.y, p.x);
  float ang = a/TAU + 0.5;

  vec3 col = vec3(0.0);

  // ---- nebula backdrop ----
  vec2 nq = rot(uTime*0.02) * (uv*1.3);
  float n  = fbm(nq + vec2(uTime*0.05,-uTime*0.03) + uMid);
  float n2 = fbm(nq*2.1 - n + uTime*0.04);
  col += pal(0.62 + 0.16*n + 0.22*uTreble) * n2 * 0.20 * (0.45+uLevel*0.9) * (1.0-smoothstep(0.0,1.35,r));

  // ---- circular 64-band spectrum ----
  const float NB = 64.0;
  float seg   = ang*NB;
  float idx   = floor(seg);
  float local = fract(seg) - 0.5;
  float sp    = pow(bandAt((idx+0.5)/NB), 0.85);

  float inner = 0.24;
  float len   = 0.055 + sp*(0.55 + 0.25*uEnergy);
  float outer = inner + len;
  float wm    = smoothstep(0.5,0.27, abs(local));
  float radm  = smoothstep(inner, inner+0.006, r) * smoothstep(outer, outer-0.03, r);
  float bar   = wm*radm;
  float tip   = exp(-pow((r-outer)*26.0,2.0)) * wm * (0.55+sp);
  vec3 barCol = pal(idx/NB + uTime*0.045 + 0.08*sp);
  col += barCol * (bar*0.82 + tip*1.35) * (0.4 + sp*1.55);

  // inner mirrored iris
  float inb  = inner - sp*0.16;
  float radm2= smoothstep(inb, inb+0.02, r) * smoothstep(inner, inner-0.006, r);
  col += barCol * radm2 * wm * 0.55 * (0.4+sp);

  // faint guide ring
  col += pal(0.5) * exp(-pow((r-inner)*70.0,2.0)) * 0.12;

  // ---- bass core ----
  float core = exp(-r*r*11.0);
  col += pal(0.06 + uTime*0.03) * core * (0.18 + uBass*1.35);
  float coreRing = exp(-pow((r-(0.12+0.055*uBass))*15.0,2.0));
  col += pal(0.12 + uBass) * coreRing * (0.4 + uBass*1.6);

  // ---- drifting embers ----
  float em = 0.0;
  for(int i=0;i<3;i++){
    float fi = float(i);
    vec2 q = uv*(3.6+fi*2.1) + vec2(0.0, uTime*(0.28+0.12*fi));
    vec2 cell = floor(q); vec2 f = fract(q)-0.5;
    float h = hash(cell + fi*11.3);
    em += smoothstep(0.13,0.0,length(f)) * step(0.93,h) * (0.35 + uTreble*1.7);
  }
  col += pal(0.16 + uTime*0.05) * em * 0.85;

  // cursor halo + chromatic fringe
  col += pal(0.5 + uTime*0.05) * exp(-dl*dl*13.0) * 0.26 * (0.55+uLevel);
  float fr = exp(-pow((r-outer)*22.0,2.0));
  col.r += bandAt((idx+0.5)/NB) * fr * 0.11;
  col.b += bandAt((idx+1.5)/NB) * fr * 0.11;

  // ---- grade ----
  col *= 1.0 + 0.3*uPulse;
  col  = 1.0 - exp(-col*1.32);
  col  = pow(col, vec3(0.86));
  col *= smoothstep(1.28,0.22,r);                 // vignette
  col += (hash(gl_FragCoord.xy + uTime) - 0.5)*0.03; // grain
  col  = mix(col*vec3(0.84,0.9,1.05), col, uActive); // cool tint while simulated

  gl_FragColor = vec4(max(col,0.0), 1.0);
}`;

function compile(type,src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(s)); }
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){ console.error(gl.getProgramInfoLog(prog)); document.getElementById('fb').style.display='flex'; return; }
gl.useProgram(prog);

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
const aPos=gl.getAttribLocation(prog,'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);

const U={};
['uRes','uTime','uMouse','uBands','uLevel','uBass','uMid','uTreble','uEnergy','uActive','uPulse']
  .forEach(n=>U[n]=gl.getUniformLocation(prog,n));

// band data texture (64x1, R in all channels)
const NB=64;
const texData=new Uint8Array(NB*4);
const bandTex=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,bandTex);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,NB,1,0,gl.RGBA,gl.UNSIGNED_BYTE,texData);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.uniform1i(U.uBands,0);

let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,1.6);
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.6);
  W=Math.floor(innerWidth*DPR); H=Math.floor(innerHeight*DPR);
  cv.width=W; cv.height=H; cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  gl.viewport(0,0,W,H);
}
window.addEventListener('resize',resize); resize();

/* ============================== interaction ============================== */
let mTarget=[0,0], mPos=[0,0], lastInput=-999, energy=0, pressed=false, lastY=0;
function setPointer(x,y){
  mTarget=[(x-innerWidth/2)/innerHeight, (innerHeight/2-y)/innerHeight];
  lastInput=performance.now()/1000;
}
window.addEventListener('pointermove',e=>{
  setPointer(e.clientX,e.clientY);
  if(pressed){ energy=Math.min(1,Math.max(0,energy+(lastY-e.clientY)*0.0022)); lastY=e.clientY; }
});
window.addEventListener('pointerdown',e=>{ pressed=true; lastY=e.clientY; setPointer(e.clientX,e.clientY); enableAudio(); });
window.addEventListener('pointerup',()=>pressed=false);
window.addEventListener('wheel',e=>{ energy=Math.min(1,Math.max(0,energy+e.deltaY*0.0009)); e.preventDefault(); },{passive:false});
window.addEventListener('keydown',e=>{ enableAudio(); if(e.code==='Space'){ toggleSound(); e.preventDefault(); } });

/* ============================== audio engine ============================== */
let AC=null, master=null, analyser=null, freqArr=null, bins=0;
let micStream=null, micOn=false, soundOn=true, audioReady=false;
const bands=new Float32Array(NB);
let feat={level:0,bass:0,mid:0,treble:0};
let kickEnv=0, pendingKicks=[];

const BASE=130.81;                       // C3
const ROOTS=[0,3,7,5,3,-2];              // chord-root motion (semitones)
const SCALE=[0,3,5,7,10];                // minor pentatonic
const PATTERN=[0,2,4,2,3,1,4,2];
let chordIx=0, curRoot=BASE;

function semi(base,s){ return base*Math.pow(2,s/12); }

function enableAudio(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }

  master=AC.createGain(); master.gain.value=0;
  const comp=AC.createDynamicsCompressor();
  comp.threshold.value=-22; comp.ratio.value=10; comp.attack.value=0.004; comp.release.value=0.22;
  analyser=AC.createAnalyser(); analyser.fftSize=2048; analyser.smoothingTimeConstant=0.8;
  bins=analyser.frequencyBinCount; freqArr=new Uint8Array(bins);
  master.connect(comp); comp.connect(analyser); analyser.connect(AC.destination);

  // sustained pad (3 detuned saws + lp filter + slow LFO)
  padFilter=AC.createBiquadFilter(); padFilter.type='lowpass'; padFilter.frequency.value=900; padFilter.Q.value=7;
  padGain=AC.createGain(); padGain.gain.value=0.0;
  padFilter.connect(padGain); padGain.connect(master);
  padOsc=[];
  [ -7, 0, 7 ].forEach((det,i)=>{
    const o=AC.createOscillator(); o.type='sawtooth'; o.detune.value=det; o.frequency.value=semi(curRoot,[0,7,12][i]);
    o.connect(padFilter); o.start(); padOsc.push(o);
  });
  const lfo=AC.createOscillator(); const lfoG=AC.createGain();
  lfo.frequency.value=0.07; lfoG.gain.value=520; lfo.connect(lfoG); lfoG.connect(padFilter.frequency); lfo.start();
  padGain.gain.setTargetAtTime(0.085, AC.currentTime, 1.5);

  // noise buffer (for hats)
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const nd=noiseBuf.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;

  master.gain.setTargetAtTime(soundOn?0.82:0.0, AC.currentTime, 1.6);

  nextBeatTime=AC.currentTime+0.12; beat=0;
  if(schedTimer) clearInterval(schedTimer);
  schedTimer=setInterval(scheduler,25);

  audioReady=true;
  document.getElementById('mark').classList.add('dimd');
  document.getElementById('idx').classList.add('dimd');
  document.getElementById('hint').classList.add('gone');
  document.getElementById('ctl').classList.add('show');
  document.getElementById('mode').textContent='live · generative';
}

let padFilter,padGain,padOsc,noiseBuf,schedTimer,nextBeatTime=0,beat=0;

function setChord(ix){
  curRoot=semi(BASE,ROOTS[ix%ROOTS.length]);
  if(!padOsc) return;
  const targets=[0,7,12];
  padOsc.forEach((o,i)=> o.frequency.setTargetAtTime(semi(curRoot,targets[i]), AC.currentTime, 0.4));
}

function kick(t){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(44,t+0.16);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.95,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.24);
  pendingKicks.push(t);
}
function bassNote(t){
  const o=AC.createOscillator(), s=AC.createOscillator(), g=AC.createGain();
  o.type='triangle'; s.type='sine';
  o.frequency.value=semi(curRoot,-12); s.frequency.value=semi(curRoot,-24);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
  o.connect(g); s.connect(g); g.connect(master);
  o.start(t); s.start(t); o.stop(t+0.55); s.stop(t+0.55);
}
function hat(t){
  const src=AC.createBufferSource(), hp=AC.createBiquadFilter(), g=AC.createGain();
  src.buffer=noiseBuf; hp.type='highpass'; hp.frequency.value=7200;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  src.connect(hp); hp.connect(g); g.connect(master); src.start(t); src.stop(t+0.06);
}
function pluck(deg,t){
  const o=AC.createOscillator(), bp=AC.createBiquadFilter(), g=AC.createGain();
  o.type='triangle'; o.frequency.value=semi(curRoot,deg+12);
  bp.type='bandpass'; bp.frequency.value=semi(curRoot,deg+12)*2; bp.Q.value=4;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.11,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.32);
  o.connect(bp); bp.connect(g); g.connect(master); o.start(t); o.stop(t+0.36);
}

function scheduler(){
  if(!AC) return;
  const bpm=96, spb=60/bpm;
  while(nextBeatTime < AC.currentTime+0.2){
    const b=beat, t=nextBeatTime;
    if(b%8===0) setChord(chordIx++);
    if(b%2===0){ kick(t); bassNote(t); }
    hat(t+spb*0.5);
    pluck(SCALE[PATTERN[(b*2)%8]],   t);
    pluck(SCALE[PATTERN[(b*2+1)%8]], t+spb*0.5);
    beat++; nextBeatTime+=spb;
  }
}

/* mic + sound toggles */
const bSound=document.getElementById('bSound'), bMic=document.getElementById('bMic');
function toggleSound(){
  if(!AC) return;
  soundOn=!soundOn;
  master.gain.setTargetAtTime(soundOn&&!micOn?0.82:(micOn?0.0:0.0), AC.currentTime, 0.2);
  if(soundOn&&!micOn) master.gain.setTargetAtTime(0.82,AC.currentTime,0.2);
  bSound.classList.toggle('on',soundOn);
}
bSound.addEventListener('click',toggleSound);
bMic.addEventListener('click',async()=>{
  enableAudio();
  if(micOn){
    micOn=false; bMic.classList.remove('on');
    if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
    if(micSrc){ try{micSrc.disconnect();}catch(e){} micSrc=null; }
    master.gain.setTargetAtTime(soundOn?0.82:0.0, AC.currentTime, 0.3);
    document.getElementById('mode').textContent='live · generative';
    return;
  }
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    micSrc=AC.createMediaStreamSource(micStream); micSrc.connect(analyser);
    micOn=true; bMic.classList.add('on');
    master.gain.setTargetAtTime(0.0, AC.currentTime, 0.3); // duck generative, listen to room
    document.getElementById('mode').textContent='live · microphone';
  }catch(e){ console.warn('mic denied',e); }
});
let micSrc=null;

/* ============================== feature analysis ============================== */
function simSpectrum(t){
  const hump=22+15*Math.sin(t*0.5);
  for(let i=0;i<NB;i++){
    let v=(Math.sin(i*0.25 - t*2.0)*0.5+0.5)*Math.exp(-i/42);
    if(i<8) v+=(Math.sin(t*2.0)*0.5+0.5)*0.65*Math.exp(-i/4);
    v+=Math.exp(-Math.pow(i-hump,2)/55)*0.7;
    if(i>40) v+=Math.random()*0.16;
    v*=0.62+0.38*Math.sin(t*0.7+i*0.05);
    bands[i]=Math.max(bands[i]*0.8, Math.min(1, Math.max(0,v)));
  }
  // simulated beat pulse
  const ph=(t*1.6)%1.0;
  if(ph<lastPhase) kickEnv=1; lastPhase=ph;
}
let lastPhase=0;

function realSpectrum(){
  analyser.getByteFrequencyData(freqArr);
  for(let i=0;i<NB;i++){
    const f0=Math.pow(i/NB,1.85), f1=Math.pow((i+1)/NB,1.85);
    let lo=Math.floor(f0*bins), hi=Math.max(lo+1,Math.floor(f1*bins));
    let s=0,c=0; for(let j=lo;j<hi&&j<bins;j++){ s+=freqArr[j]; c++; }
    let v=(c?s/c:0)/255; v=Math.pow(v,0.9);
    bands[i]=Math.max(bands[i]*0.82, v);
  }
}

function computeFeatures(){
  let b=0,m=0,tr=0,lv=0;
  for(let i=0;i<NB;i++){ lv+=bands[i]; if(i<7)b+=bands[i]; if(i>=10&&i<30)m+=bands[i]; if(i>=40)tr+=bands[i]; }
  feat.level=lv/NB; feat.bass=b/7; feat.mid=m/20; feat.treble=tr/24;
}

/* ============================== render loop ============================== */
let t0=performance.now();
function frame(now){
  const t=(now-t0)/1000;

  const active = audioReady && (soundOn||micOn);
  if(active){
    realSpectrum();
    while(pendingKicks.length && pendingKicks[0]<=AC.currentTime){ kickEnv=1; pendingKicks.shift(); }
  } else {
    simSpectrum(t);
  }
  computeFeatures();
  kickEnv*=0.90;

  // upload band texture
  for(let i=0;i<NB;i++){ const v=Math.max(0,Math.min(255,bands[i]*255))|0; const o=i*4; texData[o]=texData[o+1]=texData[o+2]=v; texData[o+3]=255; }
  gl.bindTexture(gl.TEXTURE_2D,bandTex);
  gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,NB,1,gl.RGBA,gl.UNSIGNED_BYTE,texData);

  // idle auto-drift of the lens
  const idle=t-lastInput>2.5;
  if(idle){ mTarget=[0.5*Math.sin(t*0.27), 0.34*Math.sin(t*0.41+1.3)]; }
  mPos[0]+=(mTarget[0]-mPos[0])*0.045; mPos[1]+=(mTarget[1]-mPos[1])*0.045;
  energy*=0.99;

  gl.uniform2f(U.uRes,W,H);
  gl.uniform1f(U.uTime,t);
  gl.uniform2f(U.uMouse,mPos[0],mPos[1]);
  gl.uniform1f(U.uLevel,feat.level);
  gl.uniform1f(U.uBass,feat.bass);
  gl.uniform1f(U.uMid,feat.mid);
  gl.uniform1f(U.uTreble,feat.treble);
  gl.uniform1f(U.uEnergy,energy);
  gl.uniform1f(U.uActive, active?1.0:0.0);
  gl.uniform1f(U.uPulse, Math.max(kickEnv, feat.bass*0.6));

  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// soften the intro wordmark after a beat even without interaction
setTimeout(()=>{ if(!audioReady){ document.getElementById('mark').classList.add('dimd'); document.getElementById('idx').classList.add('dimd'); } },5200);

})();
</script>
