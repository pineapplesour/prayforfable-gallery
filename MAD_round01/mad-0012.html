<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CAUSTIQUE — 光</title>
<style>
  :root { --ink: #04070d; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:var(--ink); }
  body {
    font-family: "Helvetica Neue", Helvetica, "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    cursor: crosshair;
  }
  #gl { display:block; position:fixed; inset:0; width:100%; height:100%; }

  /* --- composition overlay (part of the artwork) --- */
  .frame { position:fixed; inset:0; pointer-events:none; z-index:5; mix-blend-mode:screen; }
  .corner {
    position:absolute; width:42px; height:42px;
    border:1px solid rgba(180,220,255,0.28);
  }
  .corner.tl { top:24px; left:24px; border-right:none; border-bottom:none; }
  .corner.tr { top:24px; right:24px; border-left:none; border-bottom:none; }
  .corner.bl { bottom:24px; left:24px; border-right:none; border-top:none; }
  .corner.br { bottom:24px; right:24px; border-left:none; border-top:none; }

  .meta { position:fixed; z-index:6; pointer-events:none; color:#cfe6ff; mix-blend-mode:difference; }
  .title {
    top:36px; left:40px;
    font-weight:300; letter-spacing:0.42em;
    font-size: clamp(18px, 2.4vw, 30px);
    text-transform:uppercase;
    opacity:0.92;
  }
  .sub {
    top: calc(36px + clamp(26px,3.4vw,42px)); left:42px;
    font-size: clamp(9px, 1vw, 11px); letter-spacing:0.55em;
    font-weight:400; opacity:0.62; text-transform:uppercase;
  }
  .glyph {
    top:40px; right:40px;
    font-size: clamp(34px, 5vw, 64px); font-weight:200;
    opacity:0.78; line-height:1;
  }
  .legend {
    bottom:40px; left:42px;
    font-size: clamp(9px, 1vw, 11px); letter-spacing:0.34em;
    font-weight:400; opacity:0.6; text-transform:uppercase;
    display:flex; gap:18px; flex-wrap:wrap; max-width:70vw;
  }
  .legend span { white-space:nowrap; }
  .legend i { font-style:normal; opacity:0.5; }
  .idx {
    bottom:40px; right:42px;
    font-size: clamp(9px, 1vw, 11px); letter-spacing:0.3em;
    font-weight:400; opacity:0.55; text-align:right;
    font-variant-numeric: tabular-nums;
  }
  .fade-in { animation: fade 2.4s ease-out both; }
  @keyframes fade { from { opacity:0; } }

  @media (max-width: 560px) {
    .corner { width:28px; height:28px; }
    .corner.tl,.corner.tr { top:18px; } .corner.tl,.corner.bl { left:18px; }
    .corner.tr,.corner.br { right:18px; } .corner.bl,.corner.br { bottom:18px; }
    .title { top:26px; left:26px; }
    .sub { top:58px; left:27px; }
    .glyph { top:26px; right:28px; }
    .legend { bottom:30px; left:27px; gap:12px; }
    .idx { bottom:30px; right:28px; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="frame fade-in">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
</div>
<div class="meta title fade-in">Caustique</div>
<div class="meta sub fade-in">refracted light · field study</div>
<div class="meta glyph fade-in">光</div>
<div class="meta legend fade-in">
  <span><i>move</i> &nbsp;light</span>
  <span><i>hold</i> &nbsp;surge</span>
  <span><i>scroll</i> &nbsp;depth</span>
</div>
<div class="meta idx fade-in">N°&nbsp;0012 / I</div>

<script>
(function () {
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl', { antialias:false, alpha:false, premultipliedAlpha:false, powerPreference:'high-performance' })
           || canvas.getContext('experimental-webgl');

  if (!gl) {
    document.body.style.background =
      'radial-gradient(120% 90% at 50% 30%, #0b2436, #05080f 70%)';
    return;
  }

  const VERT = `
    attribute vec2 a_pos;
    void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }
  `;

  const FRAG = `
    precision highp float;
    uniform vec2  u_res;
    uniform float u_time;
    uniform vec2  u_mouse;   // 0..1
    uniform float u_zoom;    // depth / density
    uniform float u_energy;  // pointer surge 0..1
    uniform vec2  u_vel;     // pointer velocity

    #define TAU 6.28318530718

    float hash(vec2 p){
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      float a = hash(i), b = hash(i + vec2(1.0,0.0));
      float c = hash(i + vec2(0.0,1.0)), d = hash(i + vec2(1.0,1.0));
      vec2 u = f*f*(3.0 - 2.0*f);
      return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
    }
    float fbm(vec2 p){
      float s = 0.0, a = 0.5;
      mat2 m = mat2(1.62, 1.2, -1.2, 1.62);
      for(int i=0;i<4;i++){ s += a*noise(p); p = m*p; a *= 0.5; }
      return s;
    }

    // net-like caustic field — convergent light rays through a rippling surface
    float caustic(vec2 uv, float time){
      vec2 p = mod(uv * TAU, TAU) - 250.0;
      vec2 i = p;
      float c = 1.0;
      float inten = 0.0045;
      for(int n=0; n<6; n++){
        float t = time * 0.55 * (1.0 - (3.4 / float(n+1)));
        i = p + vec2(cos(t - i.x) + sin(t + i.y),
                     sin(t - i.y) + cos(t + i.x));
        c += 1.0 / length(vec2(
              p.x / (sin(i.x + t) / inten),
              p.y / (cos(i.y + t) / inten)));
      }
      c /= 6.0;
      c = 1.17 - pow(c, 1.4);
      return clamp(c, 0.0, 1.0);
    }

    // iridescent cosine palette (teal · gold · violet)
    vec3 pal(float t){
      vec3 a = vec3(0.20, 0.32, 0.40);
      vec3 b = vec3(0.46, 0.43, 0.42);
      vec3 c = vec3(1.00, 1.00, 1.00);
      vec3 d = vec3(0.00, 0.18, 0.44);
      return a + b * cos(TAU * (c*t + d));
    }

    void main(){
      vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;
      float t = u_time;

      vec2 m = (u_mouse - 0.5) * vec2(u_res.x/u_res.y, 1.0);

      // refraction flow — slow drifting glass surface
      float zoom = u_zoom;
      vec2 g = uv * zoom;
      float w1 = fbm(g*1.45 + vec2( t*0.045, -t*0.038));
      float w2 = fbm(g*1.45 + 7.3 + vec2(-t*0.030,  t*0.055));
      vec2 flow = vec2(w1, w2) - 0.5;

      // cursor acts as a converging lens of light
      float md  = length(uv - m);
      float lens = 0.22 / (md*md + 0.11);

      vec2 cuv = g
               + flow * (0.55 + 0.45*u_energy)
               + (uv - m) * 0.055 * lens
               + u_vel * 0.4 * exp(-md*1.5);

      // chromatic dispersion along the surface gradient
      vec2 dir = normalize(flow + 1e-4);
      float disp = 0.010 + 0.022*u_energy + 0.006*lens;

      float rC = caustic(cuv + dir*disp,  t);
      float gC = caustic(cuv,             t*1.02);
      float bC = caustic(cuv - dir*disp,  t*0.985);
      vec3 caus = vec3(rC, gC, bC);

      // fine secondary layer for shimmer depth
      float fine = caustic(cuv*2.35 + vec2(31.0,17.0), t*1.35);
      caus += fine * 0.32 * vec3(0.9, 1.0, 1.08);

      // deep volumetric base
      float depth = smoothstep(-0.9, 0.95, uv.y + 0.32*w1);
      vec3 base = mix(vec3(0.012,0.034,0.058), vec3(0.018,0.058,0.10), depth);
      base = mix(base, vec3(0.035,0.020,0.072), 0.40*w2);

      // colourise the light field
      float inten = dot(caus, vec3(0.333));
      vec3 colour = pal(0.55 + 0.55*inten + 0.18*w1);
      colour *= caus * 1.45;

      vec3 col = base + colour;

      // incandescent cores where rays focus
      float core = pow(max(gC - 0.55, 0.0)/0.45, 3.0);
      col += vec3(1.0, 0.94, 0.82) * core * 1.25;

      // soft light bloom at the cursor
      col += pal(0.08 + 0.18*sin(t*0.2)) * lens * 0.05 * (0.5 + u_energy);

      // vignette
      float vig = smoothstep(1.5, 0.18, length(uv));
      col *= 0.5 + 0.5*vig;

      // film grain
      col += (hash(gl_FragCoord.xy + t) - 0.5) * 0.035;

      // filmic tonemap + gentle gamma
      col = col / (col + 0.72);
      col = pow(clamp(col, 0.0, 1.0), vec3(0.86));

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      console.error(gl.getShaderInfoLog(s));
    return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const U = {
    res:    gl.getUniformLocation(prog, 'u_res'),
    time:   gl.getUniformLocation(prog, 'u_time'),
    mouse:  gl.getUniformLocation(prog, 'u_mouse'),
    zoom:   gl.getUniformLocation(prog, 'u_zoom'),
    energy: gl.getUniformLocation(prog, 'u_energy'),
    vel:    gl.getUniformLocation(prog, 'u_vel'),
  };

  // ---- state ----
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  const QMAX = isMobile ? 1.3 : 1.75;
  let dpr = 1, W = 1, H = 1;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, QMAX);
    W = Math.max(1, Math.floor(window.innerWidth  * dpr));
    H = Math.max(1, Math.floor(window.innerHeight * dpr));
    canvas.width = W; canvas.height = H;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    gl.viewport(0, 0, W, H);
  }
  window.addEventListener('resize', resize);
  resize();

  // pointer
  let mx = 0.5, my = 0.5;      // target (0..1)
  let cx = 0.5, cy = 0.5;      // smoothed
  let px = 0.5, py = 0.5;      // previous smoothed
  let velX = 0, velY = 0;
  let energyT = 0, energy = 0; // surge
  let zoomT = 3.0, zoom = 3.0; // density / depth
  let lastMove = 0;

  function setPointer(clientX, clientY){
    mx = clientX / window.innerWidth;
    my = 1.0 - clientY / window.innerHeight;
    lastMove = performance.now();
  }
  window.addEventListener('mousemove', e => setPointer(e.clientX, e.clientY));
  window.addEventListener('mousedown', () => energyT = 1.0);
  window.addEventListener('mouseup',   () => energyT = 0.0);

  window.addEventListener('touchstart', e => {
    energyT = 1.0;
    if (e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive:true });
  window.addEventListener('touchmove', e => {
    if (e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive:true });
  window.addEventListener('touchend', () => energyT = 0.0);

  window.addEventListener('wheel', e => {
    zoomT += (e.deltaY > 0 ? 1 : -1) * 0.22;
    zoomT = Math.max(1.4, Math.min(7.0, zoomT));
  }, { passive:true });

  const t0 = performance.now();

  function frame(now){
    const time = (now - t0) * 0.001;

    // autonomous light drift when idle
    const idle = (now - lastMove) > 2600;
    if (idle){
      mx = 0.5 + 0.32 * Math.cos(time * 0.16);
      my = 0.5 + 0.26 * Math.sin(time * 0.13);
    }

    // smoothing
    px = cx; py = cy;
    cx += (mx - cx) * 0.07;
    cy += (my - cy) * 0.07;
    velX += ((cx - px) - velX) * 0.2;
    velY += ((cy - py) - velY) * 0.2;
    energy += (energyT - energy) * 0.06;
    zoom   += (zoomT  - zoom)   * 0.05;

    gl.uniform2f(U.res, W, H);
    gl.uniform1f(U.time, time);
    gl.uniform2f(U.mouse, cx, cy);
    gl.uniform1f(U.zoom, zoom);
    gl.uniform1f(U.energy, energy);
    gl.uniform2f(U.vel, velX, velY);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
