<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>INFINITE KALEIDOSCOPE</title>
<style>
  :root{ --ink:#f2eeff; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; background:#04030a; overflow:hidden; }
  body{
    font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    -webkit-tap-highlight-color:transparent; cursor:crosshair; touch-action:none;
  }
  #gl{ position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* HUD — never a gate; first paint is the artwork. It just floats over it. */
  .hud{ position:fixed; z-index:5; color:var(--ink); mix-blend-mode:difference;
        pointer-events:none; user-select:none; transition:opacity 1.1s ease; }
  .hud.dim{ opacity:.14; }

  .brand{ left:clamp(18px,4vw,46px); bottom:clamp(18px,4vh,40px);
          display:flex; align-items:baseline; gap:.7em; }
  .brand .mark{ font-weight:800; letter-spacing:.34em; font-size:clamp(12px,1.5vw,15px); }
  .brand .sub{ font-weight:300; letter-spacing:.42em; font-size:clamp(8px,1vw,10px); opacity:.7; }

  .meta{ right:clamp(18px,4vw,46px); bottom:clamp(18px,4vh,40px); text-align:right;
         font-weight:300; letter-spacing:.36em; font-size:clamp(8px,1vw,10px); line-height:2.1; opacity:.8; }
  .meta b{ font-weight:700; }

  .top{ left:50%; top:clamp(18px,4vh,38px); transform:translateX(-50%);
        font-weight:300; letter-spacing:.5em; font-size:clamp(8px,1vw,10px); opacity:.6; white-space:nowrap; }

  @media (max-width:540px){
    .meta{ display:none; }
    .brand .sub{ display:none; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="hud brand"><span class="mark">KALEIDO∞</span><span class="sub">ENDLESS MANDALA</span></div>
<div class="hud meta" id="meta">
  SEG <b id="mSeg">8</b><br>
  DEPTH <b id="mDep">0.00</b>
</div>
<div class="hud top" id="hint">DRAG · ROTATE&nbsp;&nbsp;/&nbsp;&nbsp;SCROLL · DIVE&nbsp;&nbsp;/&nbsp;&nbsp;TAP · BLOOM</div>

<script>
(function(){
  "use strict";
  var canvas = document.getElementById("gl");
  var gl = canvas.getContext("webgl", {antialias:false, alpha:false, premultipliedAlpha:false, powerPreference:"high-performance"})
        || canvas.getContext("experimental-webgl");
  if(!gl){ document.body.style.background="#120016"; document.getElementById("hint").textContent="WebGL not supported"; return; }

  var VERT = "attribute vec2 p; void main(){ gl_Position = vec4(p,0.0,1.0); }";

  var FRAG = [
"precision highp float;",
"uniform vec2  u_res;",
"uniform float u_time;",
"uniform vec2  u_mouse;",   // smoothed -1..1
"uniform float u_zoom;",    // scroll depth
"uniform float u_seg;",     // symmetry segments
"uniform float u_rot;",     // manual rotation
"uniform float u_pulse;",   // tap bloom 0..1
"uniform float u_hue;",     // hue offset (mouse.x)",
"#define PI 3.14159265359",
"#define TAU 6.28318530718",
"mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }",
"float hash(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.345); return fract(p.x*p.y); }",
"float vnoise(vec2 p){",
"  vec2 i=floor(p), f=fract(p);",
"  vec2 u=f*f*(3.0-2.0*f);",
"  float a=hash(i), b=hash(i+vec2(1.0,0.0)), c=hash(i+vec2(0.0,1.0)), d=hash(i+vec2(1.0,1.0));",
"  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);",
"}",
"float fbm(vec2 p){",
"  float v=0.0, amp=0.5; mat2 m=rot(0.63);",
"  for(int i=0;i<4;i++){ v+=amp*vnoise(p); p=m*p*2.02+11.5; amp*=0.5; }",
"  return v;",
"}",
"vec2 kaleido(vec2 p, float reps){",
"  float a=atan(p.y,p.x); float r=length(p); float seg=TAU/reps;",
"  a=mod(a,seg); a=abs(a-0.5*seg);",
"  return vec2(cos(a),sin(a))*r;",
"}",
"vec3 palette(float t){",
"  vec3 a=vec3(0.52,0.48,0.55);",
"  vec3 b=vec3(0.48,0.46,0.50);",
"  vec3 c=vec3(1.0,1.05,0.95);",
"  vec3 d=vec3(0.18,0.42,0.74);",
"  return a + b*cos(TAU*(c*t + d));",
"}",
"void main(){",
"  vec2 uv = (gl_FragCoord.xy - 0.5*u_res)/u_res.y;",
"  uv += u_mouse*0.05;",
"  uv *= rot(u_rot + u_time*0.035 + sin(u_time*0.06)*0.16);",
"  float breath = 1.0 + 0.06*sin(u_time*0.5);",
"  uv *= breath;",
   // twin kaleidoscope fold (same seg -> clean symmetry, doubled richness)
"  vec2 k = kaleido(uv, u_seg);",
"  k = kaleido(k*rot(0.32 + u_time*0.012), u_seg);",
"  float zoom = u_time*0.10 + u_zoom;",
"  float f = fract(zoom);",
"  float hue = u_hue + u_time*0.025 + length(uv)*0.28;",
"  vec3 col = vec3(0.0); float total = 0.0;",
"  for(int i=0;i<5;i++){",
"    float li = float(i) + f;",                  // 0..5 continuous
"    float s  = exp2(li);",
"    vec2 q = k*s;",
"    vec2 w = vec2(fbm(q + zoom*0.22), fbm(q.yx - zoom*0.17));",
"    q += (w-0.5)*0.95;",
"    float v = fbm(q*1.28 + 5.0);",
"    v = pow(v, 1.55);",
"    float win = 0.5 - 0.5*cos(TAU*li/5.0);",     // hann -> seamless infinite zoom
"    vec3 c = palette(v*1.45 + hue + float(i)*0.05);",
"    col += c*v*win; total += win;",
"  }",
"  col /= max(total, 0.001);",
"  float r = length(uv);",
"  col += palette(hue+0.3) * exp(-r*1.7) * 0.34;",                      // core glow
"  float fil = smoothstep(0.62, 0.98, col.r+col.g+col.b);",            // bright filaments / bloom
"  col += fil * palette(hue+0.62) * 0.55;",
"  float ring = sin(r*28.0 - u_time*6.0);",                            // tap ripple
"  col += u_pulse * smoothstep(0.0,1.0,ring) * palette(hue+0.5) * exp(-r*2.0) * 0.85;",
"  col = col/(1.0+col);",                                              // reinhard
"  col = pow(col, vec3(0.86));",
"  col *= 1.0 + 0.32*u_pulse;",
"  vec2 vp = gl_FragCoord.xy/u_res;",
"  float vig = smoothstep(1.28, 0.18, length((vp-0.5)*vec2(u_res.x/u_res.y,1.0))*1.32);",
"  col *= mix(0.5, 1.0, vig);",
"  col += (hash(gl_FragCoord.xy + fract(u_time))*0.06 - 0.03);",       // grain
"  gl_FragColor = vec4(col, 1.0);",
"}"
].join("\n");

  function compile(type, src){
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
      console.error(gl.getShaderInfoLog(sh)); return null;
    }
    return sh;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){ console.error(gl.getProgramInfoLog(prog)); return; }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var U = {
    res:   gl.getUniformLocation(prog,"u_res"),
    time:  gl.getUniformLocation(prog,"u_time"),
    mouse: gl.getUniformLocation(prog,"u_mouse"),
    zoom:  gl.getUniformLocation(prog,"u_zoom"),
    seg:   gl.getUniformLocation(prog,"u_seg"),
    rot:   gl.getUniformLocation(prog,"u_rot"),
    pulse: gl.getUniformLocation(prog,"u_pulse"),
    hue:   gl.getUniformLocation(prog,"u_hue")
  };

  // ---- state ----
  var dpr = Math.min(window.devicePixelRatio || 1, 1.8);
  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    var heavy = (w*h > 1500*900);
    var q = (heavy ? 0.82 : 1.0) * dpr;
    canvas.width  = Math.max(2, Math.floor(w*q));
    canvas.height = Math.max(2, Math.floor(h*q));
    canvas.style.width = w+"px"; canvas.style.height = h+"px";
    gl.viewport(0,0,canvas.width,canvas.height);
  }
  window.addEventListener("resize", resize); resize();

  var mTar=[0,0], mCur=[0,0];
  var rot=0, rotVel=0;
  var zoom=0, zoomVel=0;
  var segCur=8.0, segTar=8.0;
  var hueCur=0, hueTar=0;
  var pulse=0;
  var dragging=false, lastX=0;

  var hint=document.getElementById("hint");
  var meta=document.getElementById("meta");
  var brand=document.querySelector(".brand");
  var mSeg=document.getElementById("mSeg"), mDep=document.getElementById("mDep");
  var idle=0;
  function wake(){ idle=0; hint.classList.remove("dim"); meta.classList.remove("dim"); brand.classList.remove("dim"); }

  function setPointer(x,y){
    var w=window.innerWidth, h=window.innerHeight;
    mTar[0] = (x/w)*2-1;
    mTar[1] = -((y/h)*2-1);
    hueTar  = mTar[0]*0.5;
    segTar  = 8.0 + mTar[1]*4.0;     // mouse Y morphs symmetry order
  }

  canvas.addEventListener("pointerdown", function(e){
    dragging=true; lastX=e.clientX; setPointer(e.clientX,e.clientY); wake();
    pulse=1.0;                         // tap bloom
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  });
  canvas.addEventListener("pointermove", function(e){
    setPointer(e.clientX,e.clientY); wake();
    if(dragging){ var dx=e.clientX-lastX; lastX=e.clientX; rotVel += dx*0.00045; }
  });
  function endDrag(){ dragging=false; }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("pointerleave", endDrag);

  window.addEventListener("wheel", function(e){
    e.preventDefault();
    zoomVel += (e.deltaY>0?1:-1) * 0.05 + e.deltaY*0.00018;
    wake();
  }, {passive:false});

  var t0 = performance.now();
  function frame(now){
    var t = (now - t0)/1000;

    // smoothing
    mCur[0] += (mTar[0]-mCur[0])*0.06;
    mCur[1] += (mTar[1]-mCur[1])*0.06;
    hueCur  += (hueTar-hueCur)*0.04;
    segCur  += (segTar + Math.sin(t*0.05)*1.6 - segCur)*0.04;

    rot += rotVel; rotVel *= 0.93;
    zoom += zoomVel*0.016; zoomVel *= 0.90;
    pulse *= 0.94;

    gl.uniform2f(U.res, canvas.width, canvas.height);
    gl.uniform1f(U.time, t);
    gl.uniform2f(U.mouse, mCur[0], mCur[1]);
    gl.uniform1f(U.zoom, zoom);
    gl.uniform1f(U.seg, Math.max(3.0, segCur));
    gl.uniform1f(U.rot, rot);
    gl.uniform1f(U.pulse, pulse);
    gl.uniform1f(U.hue, hueCur);

    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // HUD readout + idle fade
    mSeg.textContent = Math.round(Math.max(3.0,segCur));
    mDep.textContent = (t*0.10 + zoom).toFixed(2);
    idle += 0.016;
    if(idle>4.5){ hint.classList.add("dim"); meta.classList.add("dim"); brand.classList.add("dim"); }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // gentle auto-drift so it's alive even untouched
  setTimeout(function(){ if(idle>4) zoomVel += 0.15; }, 6000);
})();
</script>
</body>
</html>
