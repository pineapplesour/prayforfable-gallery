<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>은하 · SPIRAL DRIFT</title>
<style>
  :root{ --ink:#e9e6ff; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; background:#05030c; overflow:hidden; }
  body{
    font-family:"Helvetica Neue",-apple-system,system-ui,"Segoe UI",sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    cursor:crosshair;
  }
  #stage{ position:fixed; inset:0; display:block; }

  /* 후처리 비네팅 + 미세 그레인 (전부 오버레이, 입력 통과) */
  .vig{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:
      radial-gradient(120% 95% at 50% 46%, transparent 38%, rgba(4,2,12,.30) 72%, rgba(2,1,8,.82) 100%);
    mix-blend-mode:multiply;
  }
  .grain{
    position:fixed; inset:-50%; pointer-events:none; z-index:6; opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation:grain 1.1s steps(2) infinite;
  }
  @keyframes grain{ 0%{transform:translate(0,0)} 50%{transform:translate(-12px,8px)} 100%{transform:translate(6px,-10px)} }

  .hud{ position:fixed; z-index:8; pointer-events:none; user-select:none; }
  .brand{
    top:clamp(18px,3.4vw,40px); left:clamp(18px,3.4vw,44px);
    line-height:1.05;
  }
  .brand .k{
    font-size:clamp(11px,1.5vw,14px); letter-spacing:.5em; text-indent:.5em;
    font-weight:600; color:rgba(207,200,255,.66);
  }
  .brand .t{
    margin-top:.42em; font-size:clamp(30px,6.4vw,62px); font-weight:800;
    letter-spacing:-.02em;
    background:linear-gradient(96deg,#fff 0%,#bcd0ff 38%,#ffd9a8 70%,#ff9ecb 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 22px rgba(150,170,255,.22));
  }
  .brand .s{
    margin-top:.5em; font-size:clamp(10px,1.35vw,12.5px); letter-spacing:.34em;
    color:rgba(180,176,214,.5); font-weight:500;
  }
  .meta{
    bottom:clamp(16px,3vw,34px); left:clamp(18px,3.4vw,44px);
    font-size:clamp(10px,1.3vw,12px); letter-spacing:.12em; color:rgba(168,164,202,.5);
    font-variant-numeric:tabular-nums; line-height:1.7;
  }
  .meta b{ color:rgba(220,216,255,.82); font-weight:600; }
  .hint{
    bottom:clamp(16px,3vw,34px); right:clamp(18px,3.4vw,44px); text-align:right;
    font-size:clamp(10px,1.3vw,12px); letter-spacing:.16em; color:rgba(190,186,228,.62);
    line-height:1.85; transition:opacity 1.4s ease; font-weight:500;
  }
  .hint .dot{ color:rgba(120,160,255,.7); }
  .hint.gone{ opacity:0; }
  @media (max-width:560px){
    .brand .s{ display:none; }
    .meta{ display:none; }
    .hint{ font-size:10px; letter-spacing:.1em; }
  }
  .nope{ position:fixed; inset:0; display:grid; place-items:center; z-index:20;
    color:#cdd; font-size:14px; letter-spacing:.1em; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="vig"></div>
<div class="grain"></div>

<div class="hud brand">
  <div class="k">CELESTIAL ATLAS</div>
  <div class="t">나선은하</div>
  <div class="s">SPIRAL&nbsp;&nbsp;DRIFT&nbsp;//&nbsp;NGC&nbsp;∞</div>
</div>
<div class="hud meta">
  <span id="m-stars">— stars</span> &nbsp;·&nbsp; <span id="m-fps">60 fps</span><br>
  zoom <b id="m-zoom">1.00×</b> &nbsp;·&nbsp; incl <b id="m-incl">58°</b>
</div>
<div class="hud hint" id="hint">
  <span class="dot">◦</span> 드래그 — 은하 회전<br>
  <span class="dot">◦</span> 스크롤 / 핀치 — 확대·가속<br>
  <span class="dot">◦</span> 클릭 / 탭 — 초신성 충격파
</div>

<script>
(function(){
"use strict";
const cv = document.getElementById('stage');
let gl = cv.getContext('webgl',{alpha:false,antialias:false,premultipliedAlpha:false,preserveDrawingBuffer:false})
       || cv.getContext('experimental-webgl',{alpha:false});
if(!gl){
  document.body.insertAdjacentHTML('beforeend','<div class="nope">WebGL을 사용할 수 없는 환경입니다.</div>');
  return;
}

/* ---------- 셰이더 컴파일 헬퍼 ---------- */
function sh(type,src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function prog(vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

/* ---------- 별(점) 프로그램 ---------- */
const STAR_VS = `
precision highp float;
attribute float a_radius, a_theta, a_ecc, a_orient, a_size, a_z, a_tw;
attribute vec3  a_color;
uniform float u_time, u_baseSpeed, u_coreScale;
uniform float u_incl, u_azim, u_zoom, u_psize, u_dpr;
uniform vec2  u_aspect, u_mouse;
uniform float u_mSigma, u_mSwirl, u_mPull;
uniform vec4  u_shocks[6];
uniform float u_shockSpeed, u_shockW;
varying vec3 v_color; varying float v_bright;
void main(){
  float a = a_radius;
  // 차등 회전: 안쪽이 빠르게 (회전곡선 평탄 근사)
  float omega = u_baseSpeed * (0.25 + 0.95*(u_coreScale/(a+u_coreScale)));
  float ang = a_theta + u_time*omega;
  // 밀도파: 방향(a_orient)은 시간 불변 → 팔이 감기지 않고 별만 통과
  float b = a*(1.0 - a_ecc);
  vec2 el = vec2(a*cos(ang), b*sin(ang));
  float co=cos(a_orient), so=sin(a_orient);
  vec3 pos = vec3(el.x*co - el.y*so, el.x*so + el.y*co, a_z);
  // 시점 회전: 방위각(Y축) → 경사(X축)
  float ca=cos(u_azim), sa=sin(u_azim);
  pos = vec3(pos.x*ca + pos.z*sa, pos.y, -pos.x*sa + pos.z*ca);
  float ci=cos(u_incl), si=sin(u_incl);
  pos = vec3(pos.x, pos.y*ci - pos.z*si, pos.y*si + pos.z*ci);
  vec2 p = pos.xy;
  float depth = clamp(0.55 + pos.z*0.65, 0.16, 1.5);
  // 포인터 소용돌이 렌즈 (화면 평면)
  vec2 d = p - u_mouse;
  float dl = length(d)+1e-5;
  float fall = exp(-dl*dl/(2.0*u_mSigma*u_mSigma));
  p += ( vec2(-d.y,d.x)/dl*u_mSwirl - d/dl*u_mPull ) * fall;
  // 초신성 충격파
  for(int i=0;i<6;i++){
    vec4 s=u_shocks[i];
    if(s.w>0.0){
      vec2 sd=p-s.xy; float sl=length(sd)+1e-5;
      float age=u_time-s.z;
      float dr=sl - age*u_shockSpeed;
      float amp=s.w*exp(-dr*dr/(2.0*u_shockW*u_shockW))*exp(-age*1.15);
      p += sd/sl*amp;
    }
  }
  vec2 ndc = p*u_zoom*u_aspect;
  gl_Position = vec4(ndc,0.0,1.0);
  float tw = 0.62 + 0.45*sin(u_time*2.4 + a_tw);
  gl_PointSize = clamp(a_size*u_dpr*u_zoom*u_psize*(0.62+0.6*depth), 1.4, 40.0);
  v_color = a_color;
  v_bright = tw*depth;
}`;
const STAR_FS = `
precision highp float;
varying vec3 v_color; varying float v_bright;
void main(){
  vec2 c = gl_PointCoord-0.5;
  float r2 = dot(c,c);
  if(r2>0.25) discard;
  float a = exp(-r2*6.5);
  float core = exp(-r2*26.0);
  vec3 col = v_color*v_bright + vec3(1.0)*core*v_bright*0.5;
  gl_FragColor = vec4(col, a);
}`;

/* ---------- 풀스크린 쿼드(페이드 트레일 + 코어 글로우) ---------- */
const QUAD_VS = `attribute vec2 a_pos; void main(){ gl_Position=vec4(a_pos,0.0,1.0); }`;
const FADE_FS = `precision mediump float; uniform vec3 u_bg; uniform float u_fade;
  void main(){ gl_FragColor=vec4(u_bg,u_fade); }`;
const GLOW_FS = `precision highp float;
  uniform vec2 u_res; uniform float u_zoom, u_time;
  void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*u_res)/(0.5*min(u_res.x,u_res.y));
    uv/=u_zoom;
    float r=length(uv);
    float bulge=exp(-r*r*6.5);
    float halo =exp(-r*2.0)*0.20;
    float disk =exp(-r*r*1.25)*0.09;
    float pulse=0.92+0.08*sin(u_time*0.7);
    vec3 c=mix(vec3(1.0,0.96,0.88), vec3(1.0,0.72,0.44), smoothstep(0.0,0.38,r));
    vec3 col=c*(bulge*1.15+halo+disk)*pulse*0.5;
    gl_FragColor=vec4(col,1.0);
  }`;

const starP = prog(STAR_VS,STAR_FS);
const fadeP = prog(QUAD_VS,FADE_FS);
const glowP = prog(QUAD_VS,GLOW_FS);

/* uniform/attribute 위치 */
const SU = {};
['u_time','u_baseSpeed','u_coreScale','u_incl','u_azim','u_zoom','u_psize','u_dpr',
 'u_aspect','u_mouse','u_mSigma','u_mSwirl','u_mPull','u_shocks[0]','u_shockSpeed','u_shockW']
 .forEach(n=>SU[n]=gl.getUniformLocation(starP,n));
const SA = {};
['a_radius','a_theta','a_ecc','a_orient','a_size','a_z','a_tw','a_color']
 .forEach(n=>SA[n]=gl.getAttribLocation(starP,n));
const FU={ bg:gl.getUniformLocation(fadeP,'u_bg'), fade:gl.getUniformLocation(fadeP,'u_fade'),
           pos:gl.getAttribLocation(fadeP,'a_pos') };
const GU={ res:gl.getUniformLocation(glowP,'u_res'), zoom:gl.getUniformLocation(glowP,'u_zoom'),
           time:gl.getUniformLocation(glowP,'u_time'), pos:gl.getAttribLocation(glowP,'a_pos') };

/* 풀스크린 쿼드 버퍼 */
const quadBuf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);

/* ---------- 은하 생성 ---------- */
function randn(){ // Box-Muller
  let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(6.28318530718*v);
}
function mix(a,b,t){ return a+(b-a)*t; }

const RMAX=1.0, K_TWIST=6.0, ARM_FUZZ=0.17, DISK_SCALE=0.33;
const isMobile = Math.min(innerWidth,innerHeight)<600 || innerWidth<700;
const N = isMobile ? 17000 : 44000;

const a_radius=new Float32Array(N), a_theta=new Float32Array(N), a_ecc=new Float32Array(N),
      a_orient=new Float32Array(N), a_size=new Float32Array(N), a_z=new Float32Array(N),
      a_tw=new Float32Array(N), a_color=new Float32Array(N*3);

function diskColor(t, out, i){
  // 반경 t(0~1)에 따른 온도 그라데이션
  let r,g,b;
  if(t<0.26){ const k=t/0.26; r=mix(0.74,1.0,k); g=mix(0.84,1.0,k); b=mix(1.0,0.98,k); }
  else if(t<0.62){ const k=(t-0.26)/0.36; r=1.0; g=mix(1.0,0.84,k); b=mix(0.98,0.58,k); }
  else { const k=Math.min(1,(t-0.62)/0.38); r=1.0; g=mix(0.84,0.58,k); b=mix(0.58,0.40,k); }
  const br=0.66+Math.random()*0.34;
  out[i]=r*br; out[i+1]=g*br; out[i+2]=b*br;
}

for(let i=0;i<N;i++){
  const ci=i*3;
  const f=i/N;
  if(f>=0.86){
    // 헤일로 / 배경 산개성
    const r=1.32+Math.random()*1.42;
    a_radius[i]=r; a_ecc[i]=Math.random()*0.05;
    a_orient[i]=Math.random()*6.2832; a_theta[i]=Math.random()*6.2832;
    a_z[i]=(Math.random()*2-1)*0.07; a_size[i]=0.55+Math.random()*0.7;
    a_tw[i]=Math.random()*6.2832;
    const br=0.32+Math.random()*0.3;
    a_color[ci]=0.78*br; a_color[ci+1]=0.83*br; a_color[ci+2]=1.0*br;
    continue;
  }
  if(Math.random()<0.16){
    // 벌지(핵 팽대부) — 황금빛, 두껍고 거의 원형
    const r=Math.pow(Math.random(),1.8)*0.19;
    a_radius[i]=r; a_ecc[i]=Math.random()*0.1;
    a_orient[i]=Math.random()*6.2832; a_theta[i]=Math.random()*6.2832;
    a_z[i]=randn()*0.055; a_size[i]=0.8+Math.random()*1.5;
    a_tw[i]=Math.random()*6.2832;
    const br=0.7+Math.random()*0.3, w=Math.random()*0.12;
    a_color[ci]=1.0*br; a_color[ci+1]=(0.86-w)*br; a_color[ci+2]=(0.6-w)*br;
    continue;
  }
  // 원반: 지수형 분포
  let u=Math.random();
  let r=-DISK_SCALE*Math.log(1-u*(1-Math.exp(-RMAX/DISK_SCALE)));
  if(r>RMAX) r=RMAX;
  a_radius[i]=r;
  let e=(r/RMAX)*0.42 + (Math.random()*0.08-0.04);
  a_ecc[i]=Math.max(0,Math.min(0.5,e));
  a_orient[i]=r*K_TWIST + randn()*ARM_FUZZ;        // 밀도파 팔
  a_theta[i]=Math.random()*6.2832;
  a_z[i]=randn()*0.034*Math.exp(-r*1.4);
  a_tw[i]=Math.random()*6.2832;
  let sz=0.8+Math.random()*1.4;
  const rnd=Math.random();
  if(rnd<0.07){ // 젊은 청색 거성
    sz*=1.75;
    const br=0.85+Math.random()*0.25;
    a_color[ci]=0.6*br; a_color[ci+1]=0.74*br; a_color[ci+2]=1.0*br;
  } else if(rnd<0.12){ // HII 발광운(분홍)
    sz*=1.6;
    const br=0.7+Math.random()*0.3;
    a_color[ci]=1.0*br; a_color[ci+1]=0.5*br; a_color[ci+2]=0.74*br;
  } else {
    diskColor(r/RMAX, a_color, ci);
  }
  a_size[i]=sz;
}

/* 속성 버퍼 업로드 */
function makeBuf(arr,loc,size){
  const b=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,arr,gl.STATIC_DRAW);
  return {b,loc,size};
}
const buffers=[
  makeBuf(a_radius,SA.a_radius,1),
  makeBuf(a_theta ,SA.a_theta ,1),
  makeBuf(a_ecc   ,SA.a_ecc   ,1),
  makeBuf(a_orient,SA.a_orient,1),
  makeBuf(a_size  ,SA.a_size  ,1),
  makeBuf(a_z     ,SA.a_z     ,1),
  makeBuf(a_tw    ,SA.a_tw    ,1),
  makeBuf(a_color ,SA.a_color ,3),
];

/* ---------- 상태 ---------- */
let DPR=1, W=0, H=0, minCss=1, psize=2.0, aspect=[1,1];
let zoom=0.85, camAzim=0, dragAzim=0, dragIncl=0, hoverAzim=0, hoverIncl=0;
let tgtHoverAzim=0, tgtHoverIncl=0;
const BASE_INCL=1.02;
let mouse=[999,999], mSwirl=0, tgtSwirl=0, lastMove=-9;
let energy=0, simTime=0;
let shocks=[];
const shockData=new Float32Array(24);

function resize(){
  DPR=Math.min(window.devicePixelRatio||1, isMobile?2:1.9);
  const w=innerWidth, h=innerHeight;
  cv.style.width=w+'px'; cv.style.height=h+'px';
  W=Math.floor(w*DPR); H=Math.floor(h*DPR);
  cv.width=W; cv.height=H;
  minCss=Math.min(w,h);
  psize=Math.max(1.4, minCss/520);
  aspect = (W>=H) ? [H/W,1] : [1,W/H];
  gl.viewport(0,0,W,H);
  gl.clearColor(0.012,0.009,0.032,1); gl.clear(gl.COLOR_BUFFER_BIT);
}
window.addEventListener('resize',resize,{passive:true});
resize();

/* ---------- 입력 ---------- */
const pointers=new Map();
let dragging=false, moved=false, downX=0, downY=0, pinchPrev=0;

function toWorld(clientX,clientY){
  const r=cv.getBoundingClientRect();
  const nx=(clientX-r.left - r.width/2)/(minCss/2);
  const ny=-(clientY-r.top - r.height/2)/(minCss/2);
  return [nx/zoom, ny/zoom];
}
function setHoverTarget(clientX,clientY){
  const r=cv.getBoundingClientRect();
  const nx=(clientX-r.left)/r.width*2-1;
  const ny=(clientY-r.top)/r.height*2-1;
  tgtHoverAzim=nx*0.28; tgtHoverIncl=-ny*0.18;
}

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){ dragging=true; moved=false; downX=e.clientX; downY=e.clientY; }
  if(pointers.size===2){ const p=[...pointers.values()]; pinchPrev=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); }
  hintGone();
});
cv.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  mouse=toWorld(e.clientX,e.clientY); lastMove=simTime; tgtSwirl=0.062;
  if(pointers.size>=2){
    const p=[...pointers.values()];
    const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinchPrev>0){ zoom*=Math.pow(d/pinchPrev,1.0); zoom=Math.max(0.4,Math.min(6,zoom)); }
    pinchPrev=d; energy=Math.min(1.6,energy+0.05); return;
  }
  if(dragging){
    const dx=e.clientX-downX, dy=e.clientY-downY;
    if(Math.abs(dx)+Math.abs(dy)>5) moved=true;
    dragAzim += (e.movementX||0)*0.0052;
    dragIncl -= (e.movementY||0)*0.0052;
    dragIncl=Math.max(-BASE_INCL+0.22, Math.min(0.42, dragIncl));
  } else if(e.pointerType==='mouse'){
    setHoverTarget(e.clientX,e.clientY);
  }
});
function endPtr(e){
  if(!moved && pointers.size===1 && dragging){
    const w=toWorld(e.clientX,e.clientY);
    shocks.push({x:w[0],y:w[1],t:simTime,strength:0.078});
    if(shocks.length>6) shocks=shocks.slice(-6);
    energy=Math.min(1.6,energy+0.5);
  }
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinchPrev=0;
  if(pointers.size===0) dragging=false;
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse'){ mouse=[999,999]; tgtSwirl=0; tgtHoverAzim=0; tgtHoverIncl=0; } });

cv.addEventListener('wheel',e=>{
  e.preventDefault();
  zoom*=Math.exp(-e.deltaY*0.0011);
  zoom=Math.max(0.4,Math.min(6,zoom));
  energy=Math.min(1.6,energy+0.22);
  hintGone();
},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());

let hinted=false;
function hintGone(){ if(hinted)return; hinted=true; const h=document.getElementById('hint'); if(h) h.classList.add('gone'); }
setTimeout(hintGone, 8000);

/* ---------- 렌더 루프 ---------- */
const mZoom=document.getElementById('m-zoom'), mIncl=document.getElementById('m-incl'),
      mFps=document.getElementById('m-fps'), mStars=document.getElementById('m-stars');
mStars.textContent = (N).toLocaleString()+' stars';

let last=performance.now(), fps=60, hudT=0;

function bindStarAttribs(){
  for(const bb of buffers){
    if(bb.loc<0) continue;
    gl.bindBuffer(gl.ARRAY_BUFFER,bb.b);
    gl.enableVertexAttribArray(bb.loc);
    gl.vertexAttribPointer(bb.loc,bb.size,gl.FLOAT,false,0,0);
  }
}

function frame(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  fps += ((1/Math.max(dt,1e-3))-fps)*0.08;

  // 시간 흐름 (상호작용 시 가속)
  const flow = 1 + energy*1.15;
  simTime += dt*0.26*flow;
  energy *= Math.pow(0.92, dt*60);

  // 카메라 이징
  camAzim += dt*0.018;
  if(simTime-lastMove>0.25) tgtSwirl=0;
  mSwirl += (tgtSwirl-mSwirl)*Math.min(1,dt*8);
  hoverAzim += (tgtHoverAzim-hoverAzim)*Math.min(1,dt*3);
  hoverIncl += (tgtHoverIncl-hoverIncl)*Math.min(1,dt*3);
  const azim = camAzim + dragAzim + hoverAzim;
  let incl = BASE_INCL + dragIncl + hoverIncl;
  incl=Math.max(0.18,Math.min(1.45,incl));

  // 만료된 충격파 정리
  if(shocks.length){ shocks=shocks.filter(s=> simTime-s.t<4.0); }
  for(let i=0;i<6;i++){
    const s=shocks[i];
    if(s){ shockData[i*4]=s.x; shockData[i*4+1]=s.y; shockData[i*4+2]=s.t; shockData[i*4+3]=s.strength; }
    else { shockData[i*4+3]=0; }
  }

  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);

  // 1) 페이드 트레일 (잔상 + 블룸 베이스)
  gl.useProgram(fadeP);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.uniform3f(FU.bg, 0.012,0.009,0.032);
  gl.uniform1f(FU.fade, 0.26);
  gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf);
  gl.enableVertexAttribArray(FU.pos);
  gl.vertexAttribPointer(FU.pos,2,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLES,0,3);

  // 2) 코어 글로우 (가산)
  gl.useProgram(glowP);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.uniform2f(GU.res, W, H);
  gl.uniform1f(GU.zoom, zoom);
  gl.uniform1f(GU.time, simTime);
  gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf);
  gl.enableVertexAttribArray(GU.pos);
  gl.vertexAttribPointer(GU.pos,2,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLES,0,3);

  // 3) 별 (가산)
  gl.useProgram(starP);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  bindStarAttribs();
  gl.uniform1f(SU['u_time'],simTime);
  gl.uniform1f(SU['u_baseSpeed'],0.16);
  gl.uniform1f(SU['u_coreScale'],0.18);
  gl.uniform1f(SU['u_incl'],incl);
  gl.uniform1f(SU['u_azim'],azim);
  gl.uniform1f(SU['u_zoom'],zoom);
  gl.uniform1f(SU['u_psize'],psize);
  gl.uniform1f(SU['u_dpr'],DPR);
  gl.uniform2f(SU['u_aspect'],aspect[0],aspect[1]);
  gl.uniform2f(SU['u_mouse'],mouse[0],mouse[1]);
  gl.uniform1f(SU['u_mSigma'],0.22);
  gl.uniform1f(SU['u_mSwirl'],mSwirl);
  gl.uniform1f(SU['u_mPull'],mSwirl*0.32);
  gl.uniform1f(SU['u_shockSpeed'],0.95);
  gl.uniform1f(SU['u_shockW'],0.05);
  gl.uniform4fv(SU['u_shocks[0]'],shockData);
  gl.drawArrays(gl.POINTS,0,N);

  // HUD
  hudT+=dt;
  if(hudT>0.25){
    hudT=0;
    mZoom.textContent=zoom.toFixed(2)+'×';
    mIncl.textContent=Math.round(incl*57.2958)+'°';
    mFps.textContent=Math.round(fps)+' fps';
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
