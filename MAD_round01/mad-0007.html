<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>STRANGE · attractor field</title>
<style>
  :root{ color-scheme: dark; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#06070d; }
  body{
    font-family:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    -webkit-tap-highlight-color:transparent; cursor:crosshair;
    touch-action:none;
  }
  #c{ display:block; position:fixed; inset:0; width:100%; height:100%; }

  /* ── overlay UI (no gate, no loader — pure ornament) ── */
  .ui{ position:fixed; pointer-events:none; z-index:5; mix-blend-mode:screen; }

  #brand{
    top:clamp(20px,3.4vw,42px); left:clamp(20px,3.4vw,46px);
    display:flex; flex-direction:column; gap:6px;
  }
  #brand .mark{
    font-size:clamp(28px,5.6vw,64px); font-weight:300; letter-spacing:-.04em; line-height:.86;
    color:#f2f4ff;
    text-shadow:0 0 40px rgba(120,160,255,.35);
  }
  #brand .mark b{ font-weight:700; }
  #brand .sub{
    font-size:clamp(9px,1.05vw,11.5px); letter-spacing:.42em; text-transform:uppercase;
    color:#7e88b8; padding-left:.18em;
  }

  #meta{
    bottom:clamp(20px,3.4vw,40px); left:clamp(20px,3.4vw,46px);
    display:flex; align-items:baseline; gap:14px;
  }
  #meta .idx{ font-size:11px; letter-spacing:.3em; color:#5a6390; }
  #meta .name{
    font-size:clamp(22px,3.6vw,40px); font-weight:600; letter-spacing:.02em;
    color:#eef0ff; transition:color .6s ease;
  }
  #meta .eq{
    font-size:clamp(9px,1vw,11px); letter-spacing:.06em; color:#6b74a4;
    max-width:42ch;
  }

  #ticker{
    bottom:clamp(20px,3.4vw,40px); right:clamp(20px,3.4vw,46px);
    text-align:right; display:flex; flex-direction:column; gap:5px;
  }
  #ticker .row{ font-size:10.5px; letter-spacing:.16em; color:#646d9c; }
  #ticker .row span{ color:#aab3e6; }

  #hint{
    top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:11px; letter-spacing:.34em; text-transform:uppercase; color:#9aa2d6;
    text-align:center; line-height:2; transition:opacity 1.1s ease; text-shadow:0 0 24px rgba(90,120,255,.5);
  }
  #hint.gone{ opacity:0; }

  #dots{ top:clamp(22px,3.4vw,44px); right:clamp(20px,3.4vw,46px); display:flex; gap:9px; }
  #dots i{
    width:7px; height:7px; border-radius:50%; background:#2a3050; display:block;
    box-shadow:0 0 0 1px rgba(255,255,255,.05) inset; transition:all .5s ease;
  }
  #dots i.on{ background:#cdd6ff; box-shadow:0 0 14px rgba(150,180,255,.9); transform:scale(1.25); }

  .scan{ position:fixed; inset:0; z-index:6; pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.16) 2px 3px);
    mix-blend-mode:multiply; opacity:.5; }
  .vig{ position:fixed; inset:0; z-index:4; pointer-events:none;
    background:radial-gradient(130% 130% at 50% 42%,rgba(0,0,0,0) 52%,rgba(2,3,9,.82) 100%); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vig"></div>
<div class="scan"></div>

<div class="ui" id="brand">
  <div class="mark">STRANGE<b>·</b>FIELD</div>
  <div class="sub">deterministic chaos / vol.07</div>
</div>

<div class="ui" id="dots"></div>

<div class="ui" id="meta">
  <div class="idx" id="idx">01 / 06</div>
  <div style="display:flex;flex-direction:column;gap:4px">
    <div class="name" id="name">THOMAS</div>
    <div class="eq" id="eq">ẋ = sin y − b·x</div>
  </div>
</div>

<div class="ui" id="ticker">
  <div class="row">PARTICLES <span id="tp">—</span></div>
  <div class="row">ROTATION <span id="tr">auto</span></div>
  <div class="row">ZOOM <span id="tz">1.00×</span></div>
</div>

<div class="ui" id="hint">drag&nbsp;·&nbsp;rotate &nbsp;&nbsp;|&nbsp;&nbsp; scroll&nbsp;·&nbsp;zoom &nbsp;&nbsp;|&nbsp;&nbsp; click&nbsp;·&nbsp;mutate</div>

<script>
(()=>{
"use strict";
const cv = document.getElementById('c');
const ctx = cv.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,CX=0,CY=0,MINV=0;

// ─────────────────────────────────────────────────────────────
//  attractor catalogue — each in its own natural coordinates
//  step(p,o): writes derivative into o.  rad = characteristic radius
// ─────────────────────────────────────────────────────────────
const ATTR = [
  { name:"THOMAS", eq:"ẋ = sin y − b·x   (b=0.2082)",
    rad:4.2, dt:0.013, c:[0,0,0], seed:[0.1,0,0], spread:2.6,
    base:188, range:120, vmax:1.6,
    step:(x,y,z,o)=>{ const b=0.208186; o.x=Math.sin(y)-b*x; o.y=Math.sin(z)-b*y; o.z=Math.sin(x)-b*z; } },

  { name:"AIZAWA", eq:"ẋ = (z−b)x − d·y   a.95 b.7 c.6 d3.5",
    rad:1.55, dt:0.0095, c:[0,0,0.62], seed:[0.1,0,0], spread:0.45,
    base:332, range:96, vmax:2.4,
    step:(x,y,z,o)=>{ const a=.95,b=.7,c=.6,d=3.5,e=.25,f=.1;
      o.x=(z-b)*x-d*y; o.y=d*x+(z-b)*y; o.z=c+a*z-z*z*z/3-(x*x+y*y)*(1+e*z)+f*z*x*x*x; } },

  { name:"HALVORSEN", eq:"ẋ = −a·x − 4y − 4z − y²   a=1.4",
    rad:9.2, dt:0.0052, c:[-1.48,-1.48,-1.48], seed:[-1.48,-1.5,-1.5], spread:1.1,
    base:152, range:128, vmax:14,
    step:(x,y,z,o)=>{ const a=1.4; o.x=-a*x-4*y-4*z-y*y; o.y=-a*y-4*z-4*x-z*z; o.z=-a*z-4*x-4*y-x*x; } },

  { name:"LORENZ", eq:"ẋ = σ(y−x)   σ10 ρ28 β2.667",
    rad:27, dt:0.0052, c:[0,0,24], seed:[0.1,0,20], spread:1.2,
    base:204, range:132, vmax:90,
    step:(x,y,z,o)=>{ const s=10,r=28,b=2.6667; o.x=s*(y-x); o.y=x*(r-z)-y; o.z=x*y-b*z; } },

  { name:"DADRAS", eq:"ẋ = y − a·x + b·yz   a3 b2.7 c1.7",
    rad:14, dt:0.0058, c:[0,0,0], seed:[1.1,2.1,-2], spread:1.4,
    base:24, range:86, vmax:30,
    step:(x,y,z,o)=>{ const a=3,b=2.7,c=1.7,d=2,e=9; o.x=y-a*x+b*y*z; o.y=c*y-x*z+z; o.z=d*x*y-e*z; } },

  { name:"RÖSSLER", eq:"ẋ = −(y+z)   a0.2 b0.2 c5.7",
    rad:13, dt:0.014, c:[0,0,5.5], seed:[1,1,1], spread:1.0,
    base:262, range:104, vmax:14,
    step:(x,y,z,o)=>{ const a=.2,b=.2,c=5.7; o.x=-(y+z); o.y=x+a*y; o.z=b+z*(x-c); } },
];

// ── particles (pure field-advection, no inertia) ──
let N = 0;
let px,py,pz;            // position
let pseed;               // per-particle stable randoms for size jitter
let cur=0, nxt=1, morph=0; // attractor index + crossfade not used heavily
const der = {x:0,y:0,z:0};

// ── glow sprite atlas (one per hue bucket) ──
const HUES=72, sprites=[]; let SPR=64;
function buildSprites(){
  sprites.length=0;
  for(let i=0;i<HUES;i++){
    const h=i/HUES*360;
    const s=document.createElement('canvas'); s.width=s.height=SPR;
    const g=s.getContext('2d');
    const r=SPR/2;
    const grd=g.createRadialGradient(r,r,0,r,r,r);
    grd.addColorStop(0,   `hsla(${h},95%,72%,1)`);
    grd.addColorStop(0.25,`hsla(${h},92%,60%,0.85)`);
    grd.addColorStop(0.55,`hsla(${h},88%,50%,0.32)`);
    grd.addColorStop(1,   `hsla(${h},88%,50%,0)`);
    g.fillStyle=grd; g.beginPath(); g.arc(r,r,r,0,7); g.fill();
    sprites.push(s);
  }
}

// ── view / interaction state ──
let yaw=0.6, pitch=-0.42, yawV=0, pitchV=0;
let autoYaw=0.0016, autoPitch=0.0;
let zoom=1, zoomT=1;
let dragging=false, lastX=0, lastY=0, moved=0, downT=0;
let pointer={x:0,y:0,active:0}; // pull point, active decays
let userRot=0;                   // how recently user rotated (decays)
const N_DESK=6200, N_MOB=2800;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2; CY=H/2; MINV=Math.min(W,H);
  SPR = MINV<700?48:64; buildSprites();
  const wantN = (W<760?N_MOB:N_DESK);
  if(wantN!==N){ N=wantN; alloc(); reseed(true); }
  // initial clear so first paint is already the artwork
  ctx.fillStyle='#06070d'; ctx.fillRect(0,0,W,H);
  document.getElementById('tp').textContent=N.toLocaleString();
}
function alloc(){
  px=new Float32Array(N); py=new Float32Array(N); pz=new Float32Array(N);
  pseed=new Float32Array(N);
  for(let i=0;i<N;i++) pseed[i]=Math.random();
}
function g3(){ return (Math.random()+Math.random()+Math.random()-1.5); }
function reseed(){
  const a=ATTR[cur], sp=a.spread, c=a.seed;
  for(let i=0;i<N;i++){
    px[i]=c[0]+g3()*sp; py[i]=c[1]+g3()*sp; pz[i]=c[2]+g3()*sp;
  }
}

function setAttractor(i){
  cur=((i%ATTR.length)+ATTR.length)%ATTR.length;
  reseed();
  const a=ATTR[cur];
  document.getElementById('name').textContent=a.name;
  document.getElementById('name').style.color=`hsl(${a.base+a.range*0.4},80%,82%)`;
  document.getElementById('eq').textContent=a.eq;
  document.getElementById('idx').textContent=String(cur+1).padStart(2,'0')+" / "+String(ATTR.length).padStart(2,'0');
  [...document.getElementById('dots').children].forEach((d,k)=>d.classList.toggle('on',k===cur));
}

// build dot indicators
(()=>{ const d=document.getElementById('dots'); ATTR.forEach(()=>d.appendChild(document.createElement('i'))); })();

// ─────────────────────────────────────────────────────────────
//  render loop
// ─────────────────────────────────────────────────────────────
let t=0, last=performance.now(), autoTimer=0, paused=false;

function frame(now){
  const dtms=Math.min(now-last,50); last=now; t+=dtms*0.001;
  if(paused){ requestAnimationFrame(frame); return; }

  const a=ATTR[cur];

  // ── camera dynamics ──
  zoom += (zoomT-zoom)*0.08;
  yaw += yawV; pitch += pitchV;
  yawV*=0.92; pitchV*=0.92;
  userRot*=0.97;
  pitch=Math.max(-1.45,Math.min(1.45,pitch));
  if(!dragging){ yaw += autoYaw*(1-userRot); pitch += Math.sin(t*0.13)*0.00045*(1-userRot); }

  // auto-mutate when left idle
  autoTimer+=dtms;
  if(autoTimer>21000 && userRot<0.05){ autoTimer=0; setAttractor(cur+1); }

  const cy=Math.cos(yaw), sy=Math.sin(yaw);
  const cx=Math.cos(pitch), sx=Math.sin(pitch);
  const scale = (0.40*MINV / a.rad) * zoom;
  const ox=a.c[0], oy=a.c[1], oz=a.c[2];

  // pull point in world space (inverse rotate screen pointer on tilted plane)
  let pull=0, wx=0,wy=0,wz=0;
  if(pointer.active>0.01){
    pull = pointer.active*0.9;
    const Xr=(pointer.x-CX)/scale, Yr=(pointer.y-CY)/scale;
    const y1=Yr*cx, z1=-Yr*sx, x1=Xr;
    wx = x1*cy - z1*sy + ox;
    wz = x1*sy + z1*cy + oz;
    wy = y1 + oy;
    pointer.active*=0.94;
  }
  const pr2 = (a.rad*0.55)*(a.rad*0.55);

  // ── trail fade ──
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(6,7,13,0.13)';
  ctx.fillRect(0,0,W,H);

  // ── advect + draw ──
  ctx.globalCompositeOperation='lighter';
  const dt=a.dt, sub=2, base=a.base, range=a.range, vmaxInv=1/a.vmax;
  const baseSize=MINV*0.011;
  const o=der;

  for(let i=0;i<N;i++){
    let x=px[i],y=py[i],z=pz[i];
    let vx=0,vy=0,vz=0;
    for(let s=0;s<sub;s++){
      a.step(x,y,z,o);
      vx=o.x; vy=o.y; vz=o.z;
      x+=vx*dt; y+=vy*dt; z+=vz*dt;
    }
    // pointer pull
    if(pull){
      const dx=wx-x, dy=wy-y, dz=wz-z, d2=dx*dx+dy*dy+dz*dz;
      const f=pull/(1+d2/pr2);
      x+=dx*f*dt*6; y+=dy*f*dt*6; z+=dz*f*dt*6;
    }
    // guard against blow-ups
    if(!(x*x+y*y+z*z < 1e7)){ x=a.seed[0]+g3()*a.spread; y=a.seed[1]+g3()*a.spread; z=a.seed[2]+g3()*a.spread; }
    px[i]=x; py[i]=y; pz[i]=z;

    // rotate (yaw→pitch)
    const X=x-ox, Y=y-oy, Z=z-oz;
    const x1=X*cy+Z*sy, z1=-X*sy+Z*cy;
    const y2=Y*cx-z1*sx, z2=Y*sx+z1*cx;
    // perspective by normalized depth
    let zN=z2/a.rad; if(zN>0.92)zN=0.92; else if(zN<-0.92)zN=-0.92;
    const persp=1/(1-zN*0.5);
    const sxx=CX+x1*scale*persp;
    const syy=CY+y2*scale*persp;
    if(sxx<-40||sxx>W+40||syy<-40||syy>H+40) continue;

    // colour by speed
    const sp=Math.sqrt(vx*vx+vy*vy+vz*vz)*vmaxInv;
    let tt=sp>1?1:sp;
    let h=base+tt*range+t*9;
    h=((h%360)+360)%360;
    const hi=(h/360*HUES)|0;

    const depthB=0.45+0.55*((persp-0.66)/0.84); // closer = brighter
    ctx.globalAlpha=Math.min(0.6, 0.22+tt*0.4)*depthB;
    const sz=baseSize*persp*(0.55+tt*0.9+pseed[i]*0.25);
    ctx.drawImage(sprites[hi], sxx-sz, syy-sz, sz*2, sz*2);
  }
  ctx.globalAlpha=1;

  // ticker
  document.getElementById('tr').textContent = dragging?'manual':(userRot>0.05?'manual':'auto');
  document.getElementById('tz').textContent = zoom.toFixed(2)+'×';

  requestAnimationFrame(frame);
}

// ─────────────────────────────────────────────────────────────
//  interaction
// ─────────────────────────────────────────────────────────────
const hint=document.getElementById('hint');
function killHint(){ hint.classList.add('gone'); }

function down(x,y){ dragging=true; lastX=x; lastY=y; moved=0; downT=performance.now();
  pointer.x=x; pointer.y=y; pointer.active=1; }
function move(x,y){
  pointer.x=x; pointer.y=y; pointer.active=Math.max(pointer.active,0.7);
  if(dragging){
    const dx=x-lastX, dy=y-lastY; lastX=x; lastY=y;
    moved+=Math.abs(dx)+Math.abs(dy);
    yawV += dx*0.0010; pitchV += dy*0.0010; userRot=1; killHint();
  }
}
function up(x,y){
  if(dragging && moved<6 && performance.now()-downT<400){ setAttractor(cur+1); autoTimer=0; killHint(); }
  dragging=false;
}

cv.addEventListener('mousedown',e=>{down(e.clientX,e.clientY);});
window.addEventListener('mousemove',e=>{move(e.clientX,e.clientY);});
window.addEventListener('mouseup',e=>{up(e.clientX,e.clientY);});
cv.addEventListener('mouseleave',()=>{dragging=false;});

cv.addEventListener('touchstart',e=>{const t0=e.touches[0]; down(t0.clientX,t0.clientY);
  if(e.touches.length===2){ pinchD=dist2(e); } e.preventDefault();},{passive:false});
cv.addEventListener('touchmove',e=>{
  if(e.touches.length===2){ const d=dist2(e); if(pinchD){ zoomT=Math.max(0.4,Math.min(3.2,zoomT*(d/pinchD))); } pinchD=d; }
  else { const t0=e.touches[0]; move(t0.clientX,t0.clientY); }
  e.preventDefault();
},{passive:false});
cv.addEventListener('touchend',e=>{ pinchD=0; if(e.touches.length===0){ const ct=e.changedTouches[0]; up(ct.clientX,ct.clientY); } },{passive:false});
let pinchD=0;
function dist2(e){const a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}

window.addEventListener('wheel',e=>{
  zoomT *= Math.exp(-e.deltaY*0.0011);
  zoomT=Math.max(0.4,Math.min(3.2,zoomT));
  // strong flick also nudges rotation for liveliness
  yawV += e.deltaX*0.0006; userRot=Math.min(1,userRot+0.2);
  killHint(); autoTimer=0; e.preventDefault();
},{passive:false});

// scroll on touch devices → also drive a slow camera drift via vertical pan handled in touchmove(pull); add keyboard niceties
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){ setAttractor(cur+1); autoTimer=0; killHint(); }
  else if(e.key==='ArrowLeft'){ setAttractor(cur-1); autoTimer=0; killHint(); }
});

document.addEventListener('visibilitychange',()=>{ paused=document.hidden; last=performance.now(); });
window.addEventListener('resize',resize);

// auto-hide hint
setTimeout(killHint, 5200);

// ── boot (no gate, no loader) ──
resize();
setAttractor(0);
// paint a couple of seed frames immediately so first visible frame is the field
for(let k=0;k<3;k++){ /* warm advection */ }
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
