<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SILK — 천(布)의 물리</title>
<style>
  :root { --ink:#05060a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:var(--ink); }
  body {
    font-family:"Helvetica Neue", Helvetica, "Segoe UI", system-ui, sans-serif;
    color:#eef0f6; -webkit-font-smoothing:antialiased; cursor:crosshair;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #stage { position:fixed; inset:0; display:block; }
  /* 비네트 + 그레인 오버레이 — 첫 페인트부터 분위기 */
  #vig {
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:
      radial-gradient(130% 100% at 50% 38%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.55) 100%),
      radial-gradient(80% 60% at 50% 0%, rgba(120,140,255,0.07), rgba(0,0,0,0) 60%);
    mix-blend-mode:normal;
  }
  /* HUD */
  .hud { position:fixed; z-index:10; pointer-events:none;
         font-weight:300; letter-spacing:.14em; }
  #title { top:26px; left:30px; }
  #title b { display:block; font-size:13px; font-weight:600; letter-spacing:.42em;
             color:#fff; opacity:.92; }
  #title span { display:block; margin-top:7px; font-size:10.5px; letter-spacing:.3em;
                color:#aeb6d8; opacity:.62; }
  #hint { bottom:24px; left:30px; font-size:10.5px; letter-spacing:.16em;
          color:#9aa2c4; line-height:1.9; transition:opacity 1.1s ease; }
  #hint i { font-style:normal; color:#e7c98a; }
  #fps { position:fixed; top:26px; right:30px; z-index:10; font-size:10px;
         letter-spacing:.12em; color:#5a6285; opacity:.5; pointer-events:none;
         font-variant-numeric:tabular-nums; }
  /* 컨트롤 */
  #ctl { position:fixed; z-index:11; right:26px; bottom:24px; display:flex; gap:10px; }
  .btn {
    pointer-events:auto; cursor:pointer; border:1px solid rgba(170,180,220,.22);
    background:rgba(20,24,38,.5); color:#cfd5ee; backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px); border-radius:999px; padding:9px 15px;
    font-size:11px; letter-spacing:.12em; font-weight:400;
    transition:all .25s ease; white-space:nowrap;
  }
  .btn:hover { border-color:rgba(200,210,255,.5); color:#fff; background:rgba(34,40,62,.62); }
  .btn.on { border-color:#e7c98a; color:#1a1206; background:#e7c98a; box-shadow:0 0 22px rgba(231,201,138,.4); }
  @media (max-width:520px){
    #title{ left:18px; top:18px;} #hint{ left:18px; bottom:78px; font-size:10px;}
    #ctl{ right:16px; bottom:18px;} #fps{ right:18px; top:20px;}
    .btn{ padding:10px 14px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="vig"></div>
<div class="hud" id="title"><b>S I L K</b><span>천(布) · 베를레 물리 · No.15</span></div>
<div class="hud" id="hint">
  드래그 — <i>천을 움켜쥐기</i> · 커서 — <i>바람의 결</i><br>
  휠 — <i>돌풍</i> · 빈 곳 클릭 — <i>충격파</i> · ✂ 모드 — <i>찢기</i>
</div>
<div id="fps">—</div>
<div id="ctl">
  <div class="btn" id="bTear">✂ 찢기</div>
  <div class="btn" id="bReset">↺ 리셋</div>
</div>

<script>
"use strict";
(function(){
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { alpha:false });
let W=0,H=0,DPR=1,CX=0,CY=0;
const isMobile = matchMedia('(max-width:520px)').matches || ('ontouchstart' in window && innerWidth<760);

/* ---------- 투영 ---------- */
const FOCAL = 1150;

/* ---------- 클로스 상태 (typed arrays) ---------- */
let cols, rows, N;
let px_, py_, pz_, ox_, oy_, oz_, pin_, anchX, anchY, anchZ, anchI;
let sx_, sy_, sc_; // 화면 투영 캐시
// 제약: H(가로), V(세로), 그리고 shear(대각)
let cA, cB, cRest, cStiff, cBroken, cKind; // kind 0=H,1=V,2=shear
let hCount, vCount, cCount;
// 쿼드 → 외곽 제약 인덱스
let qTop, qBot, qLft, qRgt, quadIdx, quadDepth;
let quadCount;

const PAL = { base: 210 }; // 흐르는 기준 색조

let windStrength = 0.62, windTarget = 0.62;
let gust = 0;          // 휠/충격 돌풍 에너지
let hueDrift = 0;

/* ---------- 포인터 ---------- */
const P = { x:0,y:0, px:0,py:0, vx:0,vy:0, down:false, inside:false };
let grabbed = -1;
let tearMode = false;

/* ================= 빌드 ================= */
function build(){
  const clothW = Math.min(W*0.66, 980);
  const clothH = Math.min(H*0.72, 760);
  const aspect = clothW/clothH;
  const budget = isMobile ? 1050 : 2150;
  rows = Math.max(14, Math.round(Math.sqrt(budget/aspect)));
  cols = Math.max(14, Math.round(rows*aspect));
  N = cols*rows;

  px_=new Float32Array(N); py_=new Float32Array(N); pz_=new Float32Array(N);
  ox_=new Float32Array(N); oy_=new Float32Array(N); oz_=new Float32Array(N);
  pin_=new Uint8Array(N);
  sx_=new Float32Array(N); sy_=new Float32Array(N); sc_=new Float32Array(N);

  const dx = clothW/(cols-1), dy = clothH/(rows-1);
  const x0 = -clothW/2, y0 = -clothH*0.52;

  // 상단 앵커: 일정 간격 + 양끝 → 부드러운 스캘럽 주름
  const every = Math.max(3, Math.round(cols/7));
  const anchorsCols = [];
  for(let c=0;c<cols;c++){ if(c===0||c===cols-1||c%every===0) anchorsCols.push(c); }

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const i=r*cols+c;
      const x = x0 + c*dx;
      const y = y0 + r*dy;
      const z = Math.sin(c*0.55)*4 + Math.sin(r*0.4)*3 + (Math.random()-0.5)*3;
      px_[i]=x; py_[i]=y; pz_[i]=z;
      ox_[i]=x; oy_[i]=y; oz_[i]=z;
      if(r===0 && anchorsCols.indexOf(c)>=0) pin_[i]=1;
    }
  }
  // 앵커 원위치 저장(살랑임 기준)
  const ac=[];
  for(let i=0;i<N;i++) if(pin_[i]) ac.push(i);
  anchI=new Int32Array(ac);
  anchX=new Float32Array(ac.length); anchY=new Float32Array(ac.length); anchZ=new Float32Array(ac.length);
  for(let k=0;k<ac.length;k++){ anchX[k]=px_[ac[k]]; anchY[k]=py_[ac[k]]; anchZ[k]=pz_[ac[k]]; }

  // ----- 제약 -----
  hCount = rows*(cols-1);
  vCount = cols*(rows-1);
  const shear = 2*(cols-1)*(rows-1);
  cCount = hCount + vCount + shear;
  cA=new Int32Array(cCount); cB=new Int32Array(cCount);
  cRest=new Float32Array(cCount); cStiff=new Float32Array(cCount);
  cBroken=new Uint8Array(cCount); cKind=new Uint8Array(cCount);

  let k=0;
  // H
  for(let r=0;r<rows;r++) for(let c=0;c<cols-1;c++){
    const a=r*cols+c, b=r*cols+c+1;
    cA[k]=a; cB[k]=b; cRest[k]=dx; cStiff[k]=1.0; cKind[k]=0; k++;
  }
  // V
  for(let c=0;c<cols;c++) for(let r=0;r<rows-1;r++){
    const a=r*cols+c, b=(r+1)*cols+c;
    cA[k]=a; cB[k]=b; cRest[k]=dy; cStiff[k]=1.0; cKind[k]=1; k++;
  }
  // shear (안정/드레이프)
  const diag=Math.hypot(dx,dy);
  for(let r=0;r<rows-1;r++) for(let c=0;c<cols-1;c++){
    let a=r*cols+c, b=(r+1)*cols+c+1;
    cA[k]=a; cB[k]=b; cRest[k]=diag; cStiff[k]=0.55; cKind[k]=2; k++;
    a=r*cols+c+1; b=(r+1)*cols+c;
    cA[k]=a; cB[k]=b; cRest[k]=diag; cStiff[k]=0.55; cKind[k]=2; k++;
  }

  // ----- 쿼드 -----
  quadCount=(cols-1)*(rows-1);
  qTop=new Int32Array(quadCount); qBot=new Int32Array(quadCount);
  qLft=new Int32Array(quadCount); qRgt=new Int32Array(quadCount);
  quadIdx=new Int32Array(quadCount); quadDepth=new Float32Array(quadCount);
  const Hh=(r,c)=> r*(cols-1)+c;
  const Vv=(r,c)=> hCount + c*(rows-1)+r;
  let q=0;
  for(let r=0;r<rows-1;r++) for(let c=0;c<cols-1;c++){
    qTop[q]=Hh(r,c); qBot[q]=Hh(r+1,c); qLft[q]=Vv(r,c); qRgt[q]=Vv(r,c+1);
    quadIdx[q]=q; q++;
  }
}

/* ================= 리사이즈 ================= */
function resize(){
  W=innerWidth; H=innerHeight;
  DPR=Math.min(devicePixelRatio||1, 2);
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2; CY=H*0.46;
  build();
  initParticles();
  projectAll();
}

/* ================= 물리 ================= */
const GRAV=0.42, DAMP=0.986;
let timeT=0;

function physics(){
  timeT += 0.016;
  windTarget += (windStrength*0 + 0) ; // (no-op, windTarget set by input)
  windStrength += (windTarget-windStrength)*0.05;
  gust *= 0.94;
  hueDrift += 0.06 + gust*0.02;

  // 앵커 살랑임
  const sway = 6 + gust*8;
  for(let kk=0;kk<anchI.length;kk++){
    const i=anchI[kk];
    px_[i]=anchX[kk] + Math.sin(timeT*0.7 + kk*1.3)*sway*0.18;
    py_[i]=anchY[kk] + Math.sin(timeT*1.1 + kk)*1.6;
    pz_[i]=anchZ[kk] + Math.sin(timeT*0.9 + kk*0.7)*sway;
    ox_[i]=px_[i]; oy_[i]=py_[i]; oz_[i]=pz_[i];
  }

  const SUB=2;
  for(let s=0;s<SUB;s++){
    integrate();
    const IT=3;
    for(let it=0; it<IT; it++) solve();
  }
}

function integrate(){
  const wS = windStrength*(0.85+gust*0.9);
  const rippleOn = P.inside;
  const rR = isMobile?120:160, rR2=rR*rR;
  for(let i=0;i<N;i++){
    if(pin_[i]) continue;
    let x=px_[i], y=py_[i], z=pz_[i];
    let vx=(x-ox_[i])*DAMP, vy=(y-oy_[i])*DAMP, vz=(z-oz_[i])*DAMP;

    // 바람(흐르는 의사-노이즈)
    const wz = (Math.sin(x*0.010 + timeT*1.25) * Math.cos(y*0.013 - timeT*0.85)
                + 0.5*Math.sin((x+y)*0.008 + timeT*2.1)) * wS * 3.0;
    const wx = (Math.cos(y*0.011 + timeT*0.9)) * wS * 1.1;
    let ax=wx, ay=GRAV, az=wz;

    // 커서 결(스크린 기준)
    if(rippleOn){
      const ddx=sx_[i]-P.x, ddy=sy_[i]-P.y;
      const d2=ddx*ddx+ddy*ddy;
      if(d2<rR2){
        const f=(1-d2/rR2);
        const sp=Math.min(40, Math.hypot(P.vx,P.vy));
        az -= (8 + sp*0.5)*f;           // 화면 쪽으로 부풀림
        ax += P.vx*0.06*f; ay += P.vy*0.06*f;
      }
    }

    ox_[i]=x; oy_[i]=y; oz_[i]=z;
    px_[i]=x+vx+ax; py_[i]=y+vy+ay; pz_[i]=z+vz+az;
  }

  // 움켜쥠
  if(grabbed>=0){
    const i=grabbed, sc=sc_[i]||1;
    const tx=(P.x-CX)/sc, ty=(P.y-CY)/sc;
    px_[i]+=(tx-px_[i])*0.5; py_[i]+=(ty-py_[i])*0.5; pz_[i]+=(-40-pz_[i])*0.25;
    ox_[i]=px_[i]-(P.vx*0.4); oy_[i]=py_[i]-(P.vy*0.4); oz_[i]=pz_[i];
  }
}

function solve(){
  for(let k=0;k<cCount;k++){
    if(cBroken[k]) continue;
    const a=cA[k], b=cB[k];
    let dx=px_[b]-px_[a], dy=py_[b]-py_[a], dz=pz_[b]-pz_[a];
    let d=Math.sqrt(dx*dx+dy*dy+dz*dz); if(d<1e-6) continue;
    const diff=(d-cRest[k])/d*0.5*cStiff[k];
    const ox=dx*diff, oy=dy*diff, oz=dz*diff;
    const pa=pin_[a], pb=pin_[b];
    if(pa&&pb) continue;
    if(!pa&&!pb){
      px_[a]+=ox; py_[a]+=oy; pz_[a]+=oz;
      px_[b]-=ox; py_[b]-=oy; pz_[b]-=oz;
    } else if(pa){
      px_[b]-=ox*2; py_[b]-=oy*2; pz_[b]-=oz*2;
    } else {
      px_[a]+=ox*2; py_[a]+=oy*2; pz_[a]+=oz*2;
    }
  }
}

/* ================= 투영 ================= */
function projectAll(){
  for(let i=0;i<N;i++){
    const sc=FOCAL/(FOCAL+pz_[i]+260);
    sx_[i]=CX+px_[i]*sc; sy_[i]=CY+py_[i]*sc; sc_[i]=sc;
  }
}

/* ================= 찢기 ================= */
function tearAt(){
  if(!P.down) return;
  const R=isMobile?26:30, R2=R*R;
  for(let k=0;k<cCount;k++){
    if(cBroken[k]) continue;
    const a=cA[k], b=cB[k];
    const mx=(sx_[a]+sx_[b])*0.5, my=(sy_[a]+sy_[b])*0.5;
    const dx=mx-P.x, dy=my-P.y;
    if(dx*dx+dy*dy<R2) cBroken[k]=1;
  }
  gust=Math.min(2.4, gust+0.15);
}

/* ================= 렌더 ================= */
// 광원
const LX=-0.34, LY=-0.52, LZ=-0.78;
let particles;
function initParticles(){
  const n=isMobile?38:78;
  particles=new Array(n);
  for(let i=0;i<n;i++){
    particles[i]={ x:(Math.random()-0.5)*W*1.2, y:(Math.random()-0.5)*H*1.2,
                   z:Math.random()*600-100, vx:(Math.random()-0.5)*0.25,
                   vy:(Math.random()-0.5)*0.18, r:Math.random()*1.6+0.4 };
  }
}

function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#070912'); g.addColorStop(0.5,'#05060c'); g.addColorStop(1,'#020205');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // 오로라 — 기준 색조 따라 천천히 회전
  ctx.globalCompositeOperation='lighter';
  const t=timeT;
  for(let a=0;a<2;a++){
    const hue=(PAL.base + hueDrift*0.4 + a*70)%360;
    const ang=t*(a?0.13:-0.1)+a*2.3;
    const rx=CX + Math.cos(ang)*W*0.26, ry=CY + Math.sin(ang*0.8)*H*0.22 - H*0.05;
    const rad=Math.max(W,H)*0.55;
    const rg=ctx.createRadialGradient(rx,ry,0,rx,ry,rad);
    rg.addColorStop(0,`hsla(${hue},75%,58%,${0.12+0.05*Math.sin(t+a)})`);
    rg.addColorStop(0.5,`hsla(${hue},70%,40%,0.05)`);
    rg.addColorStop(1,'hsla(0,0%,0%,0)');
    ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
  }
  ctx.globalCompositeOperation='source-over';
}

function drawParticles(){
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    p.x+=p.vx + Math.sin(timeT*0.3+i)*0.05; p.y+=p.vy + Math.cos(timeT*0.2+i)*0.04;
    const hw=W*0.62, hh=H*0.62;
    if(p.x<-hw)p.x=hw; if(p.x>hw)p.x=-hw; if(p.y<-hh)p.y=hh; if(p.y>hh)p.y=-hh;
    const sc=FOCAL/(FOCAL+p.z+260);
    const X=CX+p.x*sc, Y=CY+p.y*sc, r=p.r*sc;
    const hue=(PAL.base+hueDrift*0.4+40)%360;
    ctx.fillStyle=`hsla(${hue},60%,82%,${0.5*sc})`;
    ctx.beginPath(); ctx.arc(X,Y,r,0,6.2832); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
}

function render(){
  drawBG();
  drawParticles();

  // 쿼드 깊이 계산 + 정렬(painter)
  const base=PAL.base + hueDrift*0.5;
  let vis=0;
  for(let q=0;q<quadCount;q++){
    if(cBroken[qTop[q]]||cBroken[qBot[q]]||cBroken[qLft[q]]||cBroken[qRgt[q]]) { quadDepth[q]=1e9; continue; }
    const r=(q/(cols-1))|0, c=q-(r*(cols-1));
    const i0=r*cols+c;
    quadDepth[q]=(pz_[i0]+pz_[i0+cols+1])*0.5;
    vis++;
  }
  // 인덱스 정렬 (먼 것 먼저 = 큰 z 먼저)
  quadIdx.sort((A,B)=>quadDepth[B]-quadDepth[A]);

  for(let n=0;n<quadCount;n++){
    const q=quadIdx[n];
    if(quadDepth[q]>=1e8) continue;
    const r=(q/(cols-1))|0, c=q-(r*(cols-1));
    const i0=r*cols+c, i1=i0+1, i2=i0+cols+1, i3=i0+cols;

    // 법선 (월드 3D)
    const e1x=px_[i1]-px_[i0], e1y=py_[i1]-py_[i0], e1z=pz_[i1]-pz_[i0];
    const e2x=px_[i3]-px_[i0], e2y=py_[i3]-py_[i0], e2z=pz_[i3]-pz_[i0];
    let nx=e1y*e2z-e1z*e2y, ny=e1z*e2x-e1x*e2z, nz=e1x*e2y-e1y*e2x;
    const nl=Math.sqrt(nx*nx+ny*ny+nz*nz)||1; nx/=nl; ny/=nl; nz/=nl;

    let ndl=nx*LX+ny*LY+nz*LZ;
    const back = ndl<0;
    let m=Math.abs(ndl);
    const diffuse=0.22+0.78*m;

    // 스페큘러
    const rfx=2*ndl*nx-LX, rfy=2*ndl*ny-LY, rfz=2*ndl*nz-LZ;
    let spec=-rfz; if(spec<0)spec=0; spec=spec*spec; spec=spec*spec*spec; // ^6

    // 깊이(대기 원근)
    const depth=quadDepth[q];
    const fog=1-Math.min(0.42, Math.max(0, (depth+120)/900));

    // 색조 — 흐르는 리본
    const worldY=py_[i0];
    let hue=base + nx*62 + ny*18 + nz*30 + Math.sin(worldY*0.011+timeT*0.6)*42 + (back?140:0);
    hue=((hue%360)+360)%360;
    const sat=(back?52:66)+spec*18;
    let lum=(diffuse*46 + spec*46)*fog + (back?4:8);
    if(lum>96)lum=96;

    ctx.fillStyle='hsl('+hue.toFixed(0)+','+sat.toFixed(0)+'%,'+lum.toFixed(0)+'%)';
    ctx.beginPath();
    ctx.moveTo(sx_[i0],sy_[i0]);
    ctx.lineTo(sx_[i1],sy_[i1]);
    ctx.lineTo(sx_[i2],sy_[i2]);
    ctx.lineTo(sx_[i3],sy_[i3]);
    ctx.closePath();
    ctx.fill();
  }
}

/* ================= 루프 ================= */
let last=performance.now(), fpsAcc=0, fpsN=0, fpsEl=document.getElementById('fps');
function loop(now){
  const dt=now-last; last=now;
  physics();
  if(tearMode) tearAt();
  projectAll();
  render();
  // fps
  fpsAcc+=dt; fpsN++;
  if(fpsAcc>500){ fpsEl.textContent=Math.round(1000/(fpsAcc/fpsN))+' fps · '+(N)+'p'; fpsAcc=0; fpsN=0; }
  // 포인터 속도 감쇠
  P.vx*=0.6; P.vy*=0.6;
  requestAnimationFrame(loop);
}

/* ================= 입력 ================= */
function nearestPoint(x,y){
  let best=-1, bd=(isMobile?44:34); bd*=bd;
  for(let i=0;i<N;i++){
    if(pin_[i]) continue;
    const dx=sx_[i]-x, dy=sy_[i]-y, d=dx*dx+dy*dy;
    if(d<bd){ bd=d; best=i; }
  }
  return best;
}
function setP(e){
  const nx=e.clientX, ny=e.clientY;
  P.vx=nx-P.x; P.vy=ny-P.y; P.x=nx; P.y=ny; P.inside=true;
}
cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId);
  setP(e); P.down=true;
  if(tearMode){ tearAt(); return; }
  grabbed=nearestPoint(P.x,P.y);
  if(grabbed<0){ // 빈 곳 → 충격파
    gust=Math.min(2.6, gust+1.0);
    const rR=200, rR2=rR*rR;
    for(let i=0;i<N;i++){ if(pin_[i])continue;
      const dx=sx_[i]-P.x, dy=sy_[i]-P.y, d2=dx*dx+dy*dy;
      if(d2<rR2){ const f=1-d2/rR2; pz_[i]-=70*f; }
    }
  }
});
cv.addEventListener('pointermove', e=>{ setP(e); });
function release(){ P.down=false; grabbed=-1; }
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('pointerleave', ()=>{ P.inside=false; });
cv.addEventListener('pointerenter', ()=>{ P.inside=true; });
// 우클릭 = 임시 찢기
cv.addEventListener('contextmenu', e=>{ e.preventDefault(); });

addEventListener('wheel', e=>{
  windTarget=Math.max(0.18, Math.min(2.1, windTarget + (e.deltaY>0?0.12:-0.12)));
  gust=Math.min(2.6, gust + Math.min(0.6, Math.abs(e.deltaY)*0.0016));
}, {passive:true});

addEventListener('keydown', e=>{
  if(e.key==='r'||e.key==='R') doReset();
  if(e.key==='x'||e.key==='X') toggleTear();
});

const bTear=document.getElementById('bTear'), bReset=document.getElementById('bReset');
function toggleTear(){ tearMode=!tearMode; bTear.classList.toggle('on',tearMode);
  cv.style.cursor=tearMode?'cell':'crosshair'; }
function doReset(){ build(); initParticles(); projectAll(); gust=0.6; }
bTear.addEventListener('click', toggleTear);
bReset.addEventListener('click', doReset);

// 힌트 페이드
let hintEl=document.getElementById('hint');
setTimeout(()=>{ hintEl.style.opacity='0.28'; }, 6500);

/* ================= 시작 ================= */
addEventListener('resize', ()=>{ clearTimeout(window.__rz); window.__rz=setTimeout(resize,150); });
resize();
gust=0.9;
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
