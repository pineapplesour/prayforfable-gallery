<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>STYLE:ON — AI Stylist Work OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#F4F1E8;        /* warm off-white */
  --paper2:#EAE6D6;       /* grid line / second surface */
  --paper3:#FBF9F2;       /* card highlight */
  --ink:#101010;
  --ink2:#1c1c1c;
  --acid:#C6FF1A;         /* acid lime */
  --magenta:#FF2D8E;      /* electric magenta */
  --blue:#1F4BFF;         /* vivid blue */
  --orange:#FF5B12;       /* vivid orange */
  --cyan:#22E0D6;         /* cyan */
  --violet:#7A3CFF;
  --muted:#3a3a36;

  --bd:4px;
  --bd3:3px;
  --shadow:9px 9px 0 0 var(--ink);
  --shadow-sm:5px 5px 0 0 var(--ink);
  --shadow-xs:3px 3px 0 0 var(--ink);

  /* unified spacing rhythm */
  --pad:clamp(26px,4vw,68px);
  --gap:clamp(10px,1.1vw,18px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans KR','Archivo',system-ui,sans-serif;
  overflow:hidden;
  position:fixed;inset:0;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.mono{font-family:'Space Mono','Space Grotesk',monospace;}
.archivo{font-family:'Archivo','Space Grotesk',system-ui,sans-serif;}

/* ===================== DECK ===================== */
#deck{position:absolute;inset:0;}
.slide{
  position:absolute;inset:0;
  padding:var(--pad);
  padding-bottom:clamp(78px,9vh,98px);
  display:none;
  flex-direction:column;
  opacity:0;
  background:var(--paper);
  background-image:
    linear-gradient(var(--paper2) 1px,transparent 1px),
    linear-gradient(90deg,var(--paper2) 1px,transparent 1px);
  background-size:46px 46px;
  background-position:center;
}
.slide.active{display:flex;animation:slideIn .5s cubic-bezier(.22,.9,.18,1) forwards;}
.slide.prev{display:flex;animation:slideOut .42s cubic-bezier(.5,0,.78,.2) forwards;}
@keyframes slideIn{from{opacity:0;transform:translateX(42px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideOut{from{opacity:1;transform:translateX(0);}to{opacity:0;transform:translateX(-38px);}}

/* ===== top frame ===== */
.frame{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.14em;
  border-bottom:var(--bd) solid var(--ink);
  padding-bottom:11px;margin-bottom:clamp(16px,2.4vh,30px);
  flex:0 0 auto;gap:10px;
}
.frame .tag{display:flex;gap:13px;align-items:center;flex-wrap:wrap;}
.frame .sep{opacity:.45;}
.brand{display:flex;align-items:center;gap:9px;}
.brand .mk{
  width:23px;height:23px;background:var(--ink);color:var(--acid);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;
  font-family:'Archivo',sans-serif;
}
.brand b{font-weight:800;letter-spacing:.1em;}

.kicker{
  display:inline-block;background:var(--ink);color:var(--paper);
  font-family:'Space Mono',monospace;font-weight:700;font-size:11px;
  text-transform:uppercase;letter-spacing:.16em;
  padding:6px 13px;border:3px solid var(--ink);
}
.kicker.fill-acid{background:var(--acid);color:var(--ink);}
.kicker.fill-mag{background:var(--magenta);color:#fff;}
.kicker.fill-blue{background:var(--blue);color:#fff;}
.kicker.fill-org{background:var(--orange);color:#fff;}

/* ===== body rhythm ===== */
.body{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0;}
.body.top{justify-content:flex-start;}
.head{display:flex;flex-direction:column;gap:9px;flex:0 0 auto;}
h1.title{font-family:'Archivo','Space Grotesk',sans-serif;font-weight:900;letter-spacing:-.025em;line-height:.96;overflow-wrap:break-word;word-break:keep-all;}
.sub{font-size:clamp(13px,1.12vw,17px);max-width:64ch;line-height:1.55;color:var(--muted);font-weight:500;}
.hl{background:var(--acid);box-shadow:0 -.36em 0 var(--acid) inset;padding:0 .04em;}
.mg{color:var(--magenta);}

/* unified dark conclusion bar */
.concl{
  background:var(--ink);color:var(--paper);
  padding:13px 18px;border:var(--bd) solid var(--ink);
  font-weight:800;font-family:'Archivo',sans-serif;
  font-size:clamp(13px,1.4vw,18px);line-height:1.35;
}
.concl.center{text-align:center;}
.concl .a{color:var(--acid);} .concl .m{color:var(--magenta);} .concl .b{color:var(--cyan);}

/* ===== cards ===== */
.card{
  background:var(--paper3);
  border:var(--bd) solid var(--ink);
  box-shadow:var(--shadow-sm);
  padding:clamp(13px,1.35vw,20px);
}
.card.b3{border-width:var(--bd3);}
.card.flat{box-shadow:none;}
.card.xs{box-shadow:var(--shadow-xs);}

/* chips */
.chip{
  border:3px solid var(--ink);background:var(--paper3);
  font-family:'Space Mono',monospace;font-weight:700;font-size:12px;
  text-transform:uppercase;letter-spacing:.06em;padding:8px 13px;
  display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow-xs);
}
.chip.flat{box-shadow:none;}
.dot{width:10px;height:10px;border:2px solid var(--ink);flex:0 0 auto;}
.swatch{border:3px solid var(--ink);flex:0 0 auto;}
.fill-acid{background:var(--acid);}
.fill-mag{background:var(--magenta);}
.fill-blue{background:var(--blue);}
.fill-org{background:var(--orange);}
.fill-cyan{background:var(--cyan);}
.fill-vio{background:var(--violet);}

/* arrow connector */
.arr{font-weight:900;font-size:18px;align-self:center;color:var(--ink);}

/* ===================== NAV ===================== */
#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;justify-content:space-between;align-items:center;
  padding:11px clamp(20px,3vw,40px);
  border-top:var(--bd) solid var(--ink);
  background:var(--paper2);
  height:clamp(60px,7.5vh,74px);
}
.navbtn{
  width:44px;height:44px;border:3px solid var(--ink);background:var(--paper3);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-weight:900;font-size:18px;font-family:'Archivo';box-shadow:var(--shadow-xs);
  transition:transform .09s,box-shadow .09s,background .15s;user-select:none;
}
.navbtn:hover{background:var(--acid);}
.navbtn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink);}
.navbtn[aria-disabled="true"]{opacity:.32;pointer-events:none;}
.navmid{display:flex;align-items:center;gap:18px;}
.dots{display:flex;gap:6px;flex-wrap:wrap;max-width:58vw;}
.pd{width:11px;height:11px;border:2px solid var(--ink);background:var(--paper3);cursor:pointer;transition:background .18s,transform .12s;}
.pd:hover{background:var(--acid);}
.pd.on{background:var(--magenta);transform:scale(1.28);}
.counter{font-family:'Space Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.05em;}
.counter b{font-size:18px;}

#progress{position:fixed;top:0;left:0;height:6px;background:var(--magenta);z-index:50;border-right:3px solid var(--ink);transition:width .48s cubic-bezier(.22,.9,.18,1);width:6.66%;}

/* ===================== ANIMATION PRIMITIVES ===================== */
@keyframes popIn{0%{transform:translateY(22px) scale(.97);opacity:0;}100%{transform:translateY(0) scale(1);opacity:1;}}
@keyframes wipe{0%{clip-path:inset(0 100% 0 0);}100%{clip-path:inset(0 0 0 0);}}
@keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
.anim-pop{animation:popIn .5s cubic-bezier(.22,.9,.18,1) both;}
.anim-wipe{animation:wipe .68s cubic-bezier(.4,0,0,1) both;}
.cursor{display:inline-block;width:.5ch;background:var(--magenta);animation:blink 1s steps(1) infinite;}

/* generic reveal-on-enter (applied per slide) */
.rv{opacity:0;transform:translateY(14px);}
.slide.active .rv{animation:popIn .46s cubic-bezier(.22,.9,.18,1) both;}

/* count-up emphasis */
.bignum{font-family:'Archivo';font-weight:900;line-height:1;letter-spacing:-.03em;}

/* ===== bar chart (brutal) ===== */
.bars{display:flex;align-items:flex-end;gap:clamp(14px,1.8vw,30px);height:100%;width:100%;}
.bar-wrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;}
.bar{
  border:var(--bd) solid var(--ink);height:0;
  transition:height 1.05s cubic-bezier(.2,.9,.2,1);
  position:relative;box-shadow:var(--shadow-xs);
  display:flex;align-items:flex-start;justify-content:center;min-height:3px;
}
.bar .bv{position:absolute;top:8px;width:100%;text-align:center;font-family:'Archivo';font-weight:900;font-size:15px;}
.bar .bval{position:absolute;top:-26px;width:100%;text-align:center;font-family:'Space Mono';font-weight:700;font-size:12px;opacity:0;transition:opacity .5s .6s;}
.bar.shown .bval{opacity:1;}
.bar-lbl{margin-top:10px;font-family:'Space Mono';font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;text-align:center;line-height:1.25;}

/* utility grids */
.grid{display:grid;gap:var(--gap);}
.num-badge{
  width:34px;height:34px;min-width:34px;border:3px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-family:'Archivo';font-weight:900;font-size:16px;
}

/* feature mini-cards */
.feat{display:flex;gap:12px;align-items:flex-start;border:3px solid var(--ink);padding:12px 13px;background:var(--paper3);box-shadow:var(--shadow-xs);transition:transform .14s,box-shadow .14s;}
.feat:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow-sm);}
.feat .fn{font-weight:800;font-size:14px;font-family:'Archivo';line-height:1.1;}
.feat .fd{font-size:11.5px;color:var(--muted);line-height:1.4;}

/* tier cards */
.tier{display:flex;flex-direction:column;gap:8px;border:var(--bd) solid var(--ink);padding:16px;background:var(--paper3);box-shadow:var(--shadow-sm);transition:transform .14s,box-shadow .14s;}
.tier:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow);}
.tier .tn{font-family:'Archivo';font-weight:900;font-size:22px;}
.tier .tp{font-family:'Space Mono';font-weight:700;font-size:11px;letter-spacing:.06em;}

.slide::-webkit-scrollbar{display:none;}

/* ===================== RESPONSIVE ===================== */
/* large desktop (1440+) — give content room */
@media (min-width:1500px){
  :root{--shadow:11px 11px 0 0 var(--ink);--shadow-sm:6px 6px 0 0 var(--ink);}
}
.hideart{display:flex;}
@media (max-width:920px){.hideart{display:none !important;}}

@media (max-width:760px){
  :root{--shadow:6px 6px 0 0 var(--ink);--shadow-sm:4px 4px 0 0 var(--ink);--shadow-xs:3px 3px 0 0 var(--ink);--bd:3px;--bd3:3px;--pad:16px;}
  .slide{padding:16px 15px 76px;background-size:36px 36px;}
  .frame{font-size:9px;flex-wrap:wrap;gap:6px;padding-bottom:8px;margin-bottom:14px;}
  .frame .brand .mk{width:19px;height:19px;font-size:11px;}
  .body{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;}
  .dots{display:none;}
  .navmid{gap:0;}
  .navbtn{width:46px;height:46px;}
  .m-1{grid-template-columns:1fr !important;}
  .m-2{grid-template-columns:1fr 1fr !important;}
  .sub{max-width:100%;}
  .body,.head,.body > *,.head > *{max-width:100%;min-width:0;}
  h1.title{overflow-wrap:anywhere;word-break:break-word;}
  .bars{gap:10px;}
  .bar .bv{font-size:12px;}
  .bar .bval{font-size:10px;top:-20px;}
  .bar-lbl{font-size:9px;}
  .road,.gtm-row{flex-direction:column;}
  .road > div,.gtm-row > div{min-width:0 !important;}
  .road > div > .mono,.gtm-row > div > div:first-child{border-right:3px solid var(--ink) !important;}
  .road .card,.gtm-row .card{border-right:3px solid var(--ink) !important;border-top:0 !important;}
}
@media (max-width:430px){
  .m-2{grid-template-columns:1fr !important;}
  h1.title{font-size:clamp(22px,6.6vw,30px) !important;line-height:1.08;overflow-wrap:anywhere !important;word-break:break-word !important;max-width:100% !important;}
  .bignum{font-size:clamp(38px,12vw,60px) !important;}
  .body{overflow-x:hidden;}
}
</style>
</head>
<body>
<div id="progress"></div>
<div id="deck"></div>

<div id="nav">
  <div class="navbtn" id="prev" aria-label="이전" aria-disabled="true">&#8592;</div>
  <div class="navmid">
    <div class="counter"><b id="cur">01</b> / <span id="tot">15</span></div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="navbtn" id="next" aria-label="다음">&#8594;</div>
</div>

<script>
/* ============================================================
   STYLE:ON IR — Neo-brutalist ACID deck (FINAL POLISH).
   All copy sourced verbatim from ir_content.md (15 slides).
   ============================================================ */
const A='acid',M='mag',B='blue',O='org',C='cyan',V='vio';
const fillMap={acid:'fill-acid',mag:'fill-mag',blue:'fill-blue',org:'fill-org',cyan:'fill-cyan',vio:'fill-vio'};
const varMap={acid:'acid',mag:'magenta',blue:'blue',org:'orange',cyan:'cyan',vio:'violet'};
const fc=c=>fillMap[c];
const cv=c=>`var(--${varMap[c]})`;
const whiteOn=['mag','blue','org','vio'];
const fgFor=c=>whiteOn.includes(c)?'#fff':'var(--ink)';
/* staggered reveal helper: returns inline style with delay */
const rv=(i,base=0)=>`class="rv" style="animation-delay:${(base+i*0.06).toFixed(2)}s;"`;

/* ---- shared header ---- */
function frame(idx,label,right){
  return `<div class="frame">
    <div class="tag">
      <div class="brand"><span class="mk">S</span><b>STYLE:ON</b></div>
      <span class="sep">/</span><span>${label}</span>
    </div>
    <div class="tag"><span>${right||'AI STYLIST WORK OS'}</span><span class="sep">·</span><span>${String(idx).padStart(2,'0')} / 15</span></div>
  </div>`;
}

/* ===================== SLIDES ===================== */
const slides=[];

/* ---------- S1 COVER ---------- */
slides.push(()=>`
${frame(1,'COVER','PRE-SEED · SEED')}
<div class="body" style="justify-content:center;">
  <div style="display:flex;gap:clamp(22px,4vw,64px);align-items:center;flex-wrap:wrap;">
    <div style="flex:1 1 430px;min-width:300px;">
      <div class="kicker anim-pop" style="animation-delay:.05s;margin-bottom:18px;">현직 스타일리스트가 만든 통합 워크 플랫폼</div>
      <h1 class="title" style="font-size:clamp(48px,8.6vw,132px);">
        <span class="anim-pop" style="display:inline-block;animation-delay:.12s;">STYLE</span><span class="anim-pop" style="display:inline-block;animation-delay:.22s;color:var(--magenta);">:ON</span><span class="cursor" style="height:.78em;margin-left:.06em;">&nbsp;</span>
      </h1>
      <div class="anim-wipe" style="animation-delay:.34s;background:var(--ink);color:var(--acid);display:inline-block;padding:9px 17px;font-family:'Archivo';font-weight:800;font-size:clamp(16px,2.5vw,36px);margin-top:12px;letter-spacing:-.01em;box-shadow:var(--shadow-xs);">AI STYLIST WORK&nbsp;OS</div>
      <p class="sub anim-pop" style="animation-delay:.5s;margin-top:24px;font-size:clamp(14px,1.4vw,19px);color:var(--ink);">협찬 · 소싱 · 피팅 · 정산을 한곳에 묶는 통합 워크 플랫폼.<br><b>"스타일리스트의 일을 더 체계적으로, 현장을 더 스마트하게."</b></p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;">
        ${[['MVP 구축 완료',A],['협업 네트워크 연계',C],['AI 10개 핵심 기능',M]].map((b,i)=>`<span class="chip anim-pop" style="animation-delay:${(.6+i*.08).toFixed(2)}s;"><span class="dot ${fc(b[1])}"></span>${b[0]}</span>`).join('')}
      </div>
    </div>
    <div class="hideart" style="flex:1 1 300px;min-width:290px;flex-direction:column;gap:14px;">
      ${[['ON SOURCING','무드 기반 의상 소싱',M],['ON SPONSOR','브랜드 협찬 확인·요청',B],['ON PAY','영수증 OCR 정산',A]].map((c,i)=>`
        <div class="card anim-pop" style="animation-delay:${(.42+i*.12).toFixed(2)}s;display:flex;justify-content:space-between;align-items:center;border-width:4px;box-shadow:var(--shadow-sm);">
          <div><div class="mono" style="font-size:11px;letter-spacing:.1em;color:#666;">APP MODULE</div><div style="font-family:'Archivo';font-weight:900;font-size:23px;">${c[0]}</div><div style="font-size:12px;color:var(--muted);">${c[1]}</div></div>
          <div class="swatch" style="width:56px;height:56px;border-width:4px;background:${cv(c[2])};"></div>
        </div>`).join('')}
    </div>
  </div>
</div>`);

/* ---------- S2 PROBLEM ---------- */
slides.push(()=>{
  const pains=[['협찬','브랜드별 개별 문의, 회신 지연',M],['의상 수배','쇼룸/대행사 보유처 탐색 비효율',B],['피팅','실물 준비와 반복 피팅 비용 증가',O],['리서치','인스타/샤오훙슈/룩북 수동 탐색',V],['정산','영수증 수기 정리, 누락·오기입 발생',A],['정보 단절','담당자/노하우가 카톡방에 흩어짐',C]];
  const chans=['메일','DM','카톡','엑셀','수집','SNS'];
  return `
${frame(2,'PROBLEM')}
<div class="body">
  <div class="head">
    <div><span class="kicker fill-mag">PROBLEM</span></div>
    <h1 class="title" style="font-size:clamp(26px,4.4vw,58px);max-width:18ch;margin-top:5px;">스타일리스트의 일은 아직도<br><span class="hl">파편화</span>되어 있습니다</h1>
    <p class="sub">메일, DM, 카톡, 엑셀, 수집, 인터넷으로 오가는 비효율적인 현장 업무 (As-is Workflow)</p>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0;">
    ${chans.map((x,i)=>`<span class="chip flat" ${rv(i)} style="font-size:11px;padding:7px 11px;background:var(--paper2);">${x}</span>${i<chans.length-1?'<span class="arr rv" style="animation-delay:'+(i*0.06+0.03).toFixed(2)+'s;">⟶</span>':''}`).join('')}
  </div>
  <div class="grid m-2" style="grid-template-columns:repeat(3,1fr);">
    ${pains.map((p,i)=>`<div class="feat" ${rv(i,.12)}>
      <div class="num-badge ${fc(p[2])}" style="color:${fgFor(p[2])};">${i+1}</div>
      <div><div class="fn">${p[0]}</div><div class="fd">${p[1]}</div></div></div>`).join('')}
  </div>
  <div class="concl rv" style="animation-delay:.5s;margin-top:18px;">
    스타일리스트의 시간은 <span class="a">스타일링이 아닌 반복 업무</span>에 잠식되고 있습니다.
  </div>
</div>`;});

/* ---------- S3 PRODUCT (10 features) ---------- */
slides.push(()=>{
  const f=[['ON Sourcing','무드 기반 의상 소싱',M],['ON Sponsor','브랜드 협찬 확인·요청',B],['ON Track','픽업·반납 트래킹',O],['ON Ref','레퍼런스 검색',V],['ON Lens','사진 제품 검색',C],['ON Fit','AI 가상 피팅',M],['ON Trend','트렌드 예측',A],['ON Pay','영수증 OCR 정산',B],['ON Desk','촬영 일정 관리',O],['ON Crew','실무 커뮤니티·아카이브',V]];
  return `
${frame(3,'PRODUCT')}
<div class="body">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;">

/* ===================== ENGINE ===================== */
const deck=document.getElementById('deck');
const TOTAL=slides.length;
document.getElementById('tot').textContent=TOTAL;
let cur=0,animating=false;
const prevBtn=document.getElementById('prev'),nextBtn=document.getElementById('next');

// build slide shells
const els=slides.map((fn,i)=>{
  const d=document.createElement('section');
  d.className='slide';d.dataset.i=i;d.innerHTML=fn();
  deck.appendChild(d);return d;
});

// dots
const dotsEl=document.getElementById('dots');
els.forEach((_,i)=>{
  const p=document.createElement('div');p.className='pd';p.dataset.i=i;
  p.onclick=()=>go(i);dotsEl.appendChild(p);
});
const pds=[...dotsEl.children];

function paintMeta(){
  document.getElementById('cur').textContent=String(cur+1).padStart(2,'0');
  pds.forEach((p,i)=>p.classList.toggle('on',i===cur));
  document.getElementById('progress').style.width=((cur+1)/TOTAL*100)+'%';
  prevBtn.setAttribute('aria-disabled',cur===0);
  nextBtn.setAttribute('aria-disabled',cur===TOTAL-1);
}

function runAnims(slide){
  // count-up
  slide.querySelectorAll('.cu').forEach(el=>{
    const to=parseFloat(el.dataset.to);const dec=parseInt(el.dataset.dec||'0');
    const dur=1150;const st=performance.now();
    function tick(now){
      let t=Math.min(1,(now-st)/dur);
      t=1-Math.pow(1-t,3);
      const v=to*t;
      el.textContent=dec?v.toFixed(dec):Math.round(v);
      if(t<1)requestAnimationFrame(tick);else el.textContent=dec?to.toFixed(dec):to;
    }
    el.textContent='0';requestAnimationFrame(tick);
  });
  // bars
  slide.querySelectorAll('.bar').forEach((b,i)=>{
    b.style.height='0';b.classList.remove('shown');
    setTimeout(()=>{b.style.height=b.dataset.h+'%';b.classList.add('shown');},140+i*150);
  });
}

function go(n){
  if(animating||n===cur||n<0||n>=TOTAL)return;
  animating=true;
  const old=els[cur],nw=els[n];
  old.classList.remove('active');old.classList.add('prev');
  // re-render to reset inline reveal/anim state
  nw.innerHTML=slides[n]();
  nw.classList.add('active');
  cur=n;paintMeta();
  runAnims(nw);
  setTimeout(()=>{old.classList.remove('prev');animating=false;},500);
}
const next=()=>go(cur+1);
const prev=()=>go(cur-1);

nextBtn.onclick=next;
prevBtn.onclick=prev;

// keyboard
window.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next();}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev();}
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(TOTAL-1);
});
// wheel
let wlock=false;
window.addEventListener('wheel',e=>{
  if(wlock)return;
  if(Math.abs(e.deltaY)<24&&Math.abs(e.deltaX)<24)return;
  wlock=true;
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  if(d>0)next();else prev();
  setTimeout(()=>wlock=false,650);
},{passive:true});
// touch
let tx=0,ty=0;
window.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
window.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){dx<0?next():prev();}
},{passive:true});

// init — slide 1 paints instantly (no loader / no intro gate)
els[0].classList.add('active');
paintMeta();
runAnims(els[0]);
</script>
