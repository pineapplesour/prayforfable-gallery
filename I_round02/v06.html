<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>새벽 연못 · 리퀴드 글래스</title>
<style>
  :root{
    --rim-w: 22px;          /* glass rim thickness (large curvature band) */
    --card-r: 30px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0d0c;
    font-family:"Helvetica Neue","Segoe UI",-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:none;z-index:0;}

  /* ----- floating liquid-glass card (octocat) ----- */
  #card{
    position:fixed;z-index:3;
    top:50%;left:50%;transform:translate(-50%,-50%);
    width:330px;
    color:#f3efe9;
    pointer-events:none;             /* clicks fall through to the pond */
    text-align:center;
    -webkit-user-select:none;user-select:none;
  }
  /* the glass slab that the WebGL rim-refraction is locked to */
  #slab{
    position:relative;
    border-radius:var(--card-r);
    padding:26px 20px 22px;
    /* central frosted-glass: flat, soft frost only (rim handled by WebGL) */
    background:
      linear-gradient(180deg, rgba(255,250,244,.10), rgba(120,140,150,.045) 40%, rgba(40,55,60,.07));
    backdrop-filter:blur(7px) saturate(120%) brightness(1.04);
    -webkit-backdrop-filter:blur(7px) saturate(120%) brightness(1.04);
    /* rim specular ring (bright, like polished glass edge) */
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.55),
      inset 0 0 0 1px rgba(255,255,255,.16),
      inset 0 0 22px rgba(255,255,255,.10),
      inset 0 -10px 26px rgba(20,40,45,.30),
      0 26px 60px rgba(0,0,0,.45),
      0 4px 14px rgba(0,0,0,.30);
    overflow:hidden;
  }
  /* moving dawn-mist highlight sweep on the glass */
  #slab::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:
      radial-gradient(120% 70% at 28% -10%, rgba(255,236,214,.42), rgba(255,236,214,0) 55%),
      radial-gradient(90% 60% at 90% 8%, rgba(180,225,235,.22), transparent 60%);
    mix-blend-mode:screen;
    animation:mist 11s ease-in-out infinite alternate;
  }
  /* sharp rim specular arc on top-left */
  #slab::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(135deg, rgba(255,255,255,.7), rgba(255,255,255,0) 18%);
    -webkit-mask:
       linear-gradient(#000 0 0) content-box,
       linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask-composite:exclude;
    padding:1.5px;opacity:.85;
  }
  @keyframes mist{0%{opacity:.7;transform:translate(-4px,-2px)}100%{opacity:1;transform:translate(6px,3px)}}

  .ava{width:74px;height:74px;border-radius:50%;margin:2px auto 12px;position:relative;
    background:radial-gradient(circle at 38% 32%, #4a4f57, #23262c 70%);
    box-shadow:0 0 0 3px rgba(255,255,255,.10), 0 8px 18px rgba(0,0,0,.4);}
  .ava svg{position:absolute;inset:0;margin:auto;width:48px;height:48px;}
  .ava .pad{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
    width:46px;height:9px;border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(120,200,230,.85), rgba(120,200,230,0) 70%);}
  .name{font-size:25px;font-weight:800;letter-spacing:.2px;margin:0;line-height:1.05;
    text-shadow:0 1px 10px rgba(0,0,0,.35);}
  .handle{font-size:14px;color:#cfe1e4;opacity:.85;margin:3px 0 10px;}
  .blurb{font-size:13px;line-height:1.5;color:#e7efef;opacity:.9;margin:0 6px 16px;}

  .stats{display:flex;gap:8px;justify-content:center;margin:0 0 12px;}
  .stat{flex:1;border-radius:16px;padding:9px 4px;
    background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.30), inset 0 0 0 1px rgba(255,255,255,.08);}
  .stat b{display:block;font-size:17px;font-weight:800}
  .stat span{font-size:10.5px;color:#cfe1e4;opacity:.85;letter-spacing:.3px}

  .panel{border-radius:18px;padding:12px 14px;margin:0 0 12px;text-align:left;
    background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 0 1px rgba(255,255,255,.07);}
  .panel .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .panel .ph .lab{font-size:10.5px;letter-spacing:2px;color:#cfe1e4;opacity:.8;font-weight:700}
  .panel .ph .clr{font-size:11px;padding:3px 10px;border-radius:99px;color:#0d1413;font-weight:700;
    background:linear-gradient(180deg,#fff,#dfeaea);cursor:pointer;pointer-events:auto;}
  /* signature pad */
  #sigwrap{position:relative;height:46px;}
  #sig{position:absolute;inset:0;width:100%;height:100%;border-radius:8px;
     pointer-events:auto;cursor:crosshair;touch-action:none;}
  #sigHint{position:absolute;left:6px;top:14px;font-style:italic;font-size:13px;
     color:#bcd0d2;opacity:.65;pointer-events:none;transition:opacity .2s}
  #sigLine{position:absolute;left:6px;right:6px;bottom:6px;height:1px;
     background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);}

  .chips{display:flex;gap:8px;justify-content:center;}
  .chip{font-size:11.5px;display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:99px;
    background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.08);}
  .chip svg{width:12px;height:12px;opacity:.85}

  #hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:4;
    color:rgba(255,247,235,.82);font-size:12.5px;letter-spacing:.16em;
    background:rgba(20,30,30,.34);padding:8px 20px;border-radius:99px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    pointer-events:none;transition:opacity 1.6s;white-space:nowrap;}

  @media (max-width:430px){
    #card{width:312px;transform:translate(-50%,-50%) scale(.96)}
    #hint{font-size:11px;padding:7px 16px}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="card">
  <div id="slab">
    <div class="ava">
      <svg viewBox="0 0 16 16" fill="#1b1f24" aria-hidden="true"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <div class="pad"></div>
    </div>
    <h1 class="name">Octocat</h1>
    <div class="handle">@octocat</div>
    <p class="blurb">새벽 연못 위에 뜬 리퀴드 글래스 프로필 카드. 가장자리는 물을 휘게 굴절하고 중앙은 안개처럼 프로스티드다.</p>

    <div class="stats">
      <div class="stat"><b>8</b><span>REPOS</span></div>
      <div class="stat"><b>9.0k</b><span>FOLLOWERS</span></div>
      <div class="stat"><b>9</b><span>FOLLOWING</span></div>
    </div>

    <div class="panel">
      <div class="ph"><span class="lab">SIGNATURE</span><span class="clr" id="clrBtn">Clear</span></div>
      <div id="sigwrap">
        <canvas id="sig"></canvas>
        <div id="sigHint">sign here ✎</div>
        <div id="sigLine"></div>
      </div>
    </div>

    <div class="chips">
      <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="#cfe1e4" stroke-width="2"><path d="M12 21s-7-5.2-7-10a7 7 0 1114 0c0 4.8-7 10-7 10z"/><circle cx="12" cy="11" r="2.4"/></svg>San Francisco</span>
      <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="#cfe1e4" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>Joined 2011</span>
    </div>
  </div>
</div>

<div id="hint">수면을 클릭 — 먹이가 떨어지고 파동이 일며 코이가 모여듭니다</div>

<script>
'use strict';
(()=>{
const TAU=Math.PI*2;
const canvas=document.getElementById('gl');
const hint=document.getElementById('hint');
const cardEl=document.getElementById('card');
const slabEl=document.getElementById('slab');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false});
if(!gl){hint.textContent='이 브라우저는 WebGL2를 지원하지 않습니다';return;}
gl.getExtension('EXT_color_buffer_float');
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);

/* ===================================================================
   PIPELINE
   1. SIM   : ping-pong height-field water (ripples)  -> texA
   2. WATER : render dawn pond + koi (refracted by water normals) -> sceneFBO color tex
   3. GLASS : fullscreen composite; inside the card rect apply a
              ROUNDED-RECT VARIABLE-CURVATURE lens (flat center, strongly
              curved rim that magnifies/warps the pond behind) -> screen
   =================================================================== */

const VERT=`#version 300 es
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main(){vUv=aPos*0.5+0.5;gl_Position=vec4(aPos,0.,1.);}`;

/* ---- water height-field sim (from frangollo, drops kept) ---- */
const SIM_FRAG=`#version 300 es
precision highp float;
uniform sampler2D uPrev;
uniform vec2 uTexel;
uniform vec4 uDrops[8];
uniform int uCount;
in vec2 vUv; out vec4 o;
void main(){
  vec2 c=texture(uPrev,vUv).rg;
  float sum=
    texture(uPrev,vUv+vec2(uTexel.x,0.)).r+
    texture(uPrev,vUv-vec2(uTexel.x,0.)).r+
    texture(uPrev,vUv+vec2(0.,uTexel.y)).r+
    texture(uPrev,vUv-vec2(0.,uTexel.y)).r;
  float nh=(sum*0.5-c.g)*0.992;
  vec2 px=vUv/uTexel;
  for(int i=0;i<8;i++){
    if(i>=uCount)break;
    vec4 d=uDrops[i];
    float dist=distance(px,d.xy);
    if(dist<d.z) nh+=d.w*(cos(dist/d.z*3.14159)*0.5+0.5);
  }
  vec2 e=min(vUv,1.0-vUv);
  float edge=smoothstep(0.0,0.05,min(e.x,e.y));
  nh*=mix(0.86,1.0,edge);
  o=vec4(nh,c.r,0.,1.);
}`;

/* ---- dawn-macro pond render: refraction + caustics + shallow DOF bokeh + dawn light ---- */
const WATER_FRAG=`#version 300 es
precision highp float;
uniform sampler2D uH;
uniform sampler2D uBottom;   // pond bottom (dawn toned, already blurry/bokeh)
uniform sampler2D uFish;     // koi + food sprite layer (premultiplied alpha)
uniform vec2 uTexel;
uniform vec2 uRes;
uniform float uT;
uniform vec2 uFocus;         // shallow-DOF focus point (uv)
in vec2 vUv; out vec4 o;

void main(){
  vec2 d=uTexel*1.5;
  float h =texture(uH,vUv).r;
  float hL=texture(uH,vUv-vec2(d.x,0.)).r;
  float hR=texture(uH,vUv+vec2(d.x,0.)).r;
  float hB=texture(uH,vUv-vec2(0.,d.y)).r;
  float hT=texture(uH,vUv+vec2(0.,d.y)).r;
  vec3 n=normalize(vec3((hL-hR)*6.0,(hB-hT)*6.0,1.0));
  // micro surface ripple for sparkle
  n.xy+=0.0030*vec2(
    sin(vUv.x*150.0+uT*1.2)+sin(vUv.y*96.0-uT*0.7),
    cos(vUv.x*84.0-uT*0.9)+cos(vUv.y*150.0+uT*1.4));
  n=normalize(n);
  vec2 off=n.xy*0.044;

  // ---- shallow depth-of-field: bottom is creamy bokeh away from focus ----
  float foc=distance(vUv,uFocus);
  float dofR=smoothstep(0.06,0.5,foc);          // 0 sharp -> 1 very blurry
  vec3 bottom=vec3(0.0);
  float blurPx=mix(0.6,5.5,dofR);
  vec2 bstep=uTexel*blurPx;
  // 9-tap creamy blur, more weight further out
  bottom+=texture(uBottom,vUv+off).rgb*0.28;
  bottom+=texture(uBottom,vUv+off+bstep*vec2( 1.0, 0.4)).rgb*0.10;
  bottom+=texture(uBottom,vUv+off+bstep*vec2(-1.0,-0.5)).rgb*0.10;
  bottom+=texture(uBottom,vUv+off+bstep*vec2( 0.6,-1.0)).rgb*0.10;
  bottom+=texture(uBottom,vUv+off+bstep*vec2(-0.7, 1.0)).rgb*0.10;
  bottom+=texture(uBottom,vUv+off+bstep*vec2( 1.4, 1.2)).rgb*0.08;
  bottom+=texture(uBottom,vUv+off+bstep*vec2(-1.5, 1.1)).rgb*0.08;
  bottom+=texture(uBottom,vUv+off+bstep*vec2( 1.3,-1.4)).rgb*0.08;
  bottom+=texture(uBottom,vUv+off+bstep*vec2(-1.2,-1.3)).rgb*0.08;

  // ---- caustics: dawn-gold bright lines where surface focuses light ----
  float lap=(hL+hR+hB+hT-4.0*h);
  float caust=min(max(-lap,0.0)*100.0,0.85);
  bottom+=vec3(1.0,0.86,0.62)*caust*0.70;          // warm dawn caustic
  bottom*=1.0-min(max(lap,0.0)*70.0,0.32);

  // koi shadow on the bottom
  float sh=texture(uFish,vUv+off+vec2(0.012,-0.016)).a;
  bottom*=1.0-sh*0.30;

  // dawn water tint: teal-green deep, warm near top (light comes from upper area)
  vec3 deepWater=vec3(0.07,0.21,0.23);
  vec3 dawnWater=vec3(0.20,0.24,0.27);
  vec3 water=mix(deepWater,dawnWater,smoothstep(0.85,0.0,vUv.y)); // top warmer
  vec3 col=mix(bottom,water,0.30);

  // ---- koi (the in-focus ones read crisp) ----
  vec4 fish=texture(uFish,vUv+off*0.42);
  // gentle fish-edge tint into water
  vec3 fcol=mix(fish.rgb,water,0.08);
  col=mix(col,fcol,fish.a);

  // ---- specular sparkle from dawn sun (upper-left), tight + warm ----
  vec3 L=normalize(vec3(-0.30,0.55,0.78));
  float spec=pow(max(dot(reflect(vec3(0.,0.,-1.),n),L),0.0),150.0);
  col+=vec3(1.0,0.92,0.78)*spec*1.15;             // glints
  // soft pink/cyan secondary sheen
  col+=vec3(0.40,0.30,0.36)*pow(max(dot(n,normalize(vec3(0.25,-0.35,0.9))),0.0),3.0)*0.07;

  // ---- dawn light gradient over everything (golden top, cool bottom) ----
  vec3 dawnTop=vec3(1.05,0.86,0.66);   // gold-pink
  vec3 dawnBot=vec3(0.55,0.70,0.74);   // cool teal
  vec3 dawn=mix(dawnBot,dawnTop,smoothstep(0.95,0.05,vUv.y));
  col*=mix(vec3(1.0),dawn,0.32);

  // film grain / particles in air (very subtle)
  float g=fract(sin(dot(gl_FragCoord.xy,vec2(12.99,78.23)))*43758.5)-0.5;
  col+=g*0.018;

  // ---- bokeh vignette : darker, dreamier corners ----
  float vg=smoothstep(1.15,0.30,length((vUv-0.5)*vec2(uRes.x/uRes.y,1.0)));
  col*=mix(0.52,1.04,vg);

  // gentle filmic lift
  col=pow(max(col,0.0),vec3(0.95));
  o=vec4(col,1.0);
}`;

/* ---- GLASS composite: rounded-rect variable curvature lens over card ---- */
const GLASS_FRAG=`#version 300 es
precision highp float;
uniform sampler2D uScene;     // rendered pond
uniform vec2 uRes;
uniform vec2 uCenter;         // card center, device px (y-up)
uniform vec2 uHalf;           // card half-size, device px
uniform float uRadius;        // corner radius, device px
uniform float uRim;           // rim band thickness, device px
uniform float uTime;
in vec2 vUv; out vec4 o;

// signed distance to a rounded rectangle (centered at origin)
float sdRoundRect(vec2 p, vec2 b, float r){
  vec2 q=abs(p)-b+r;
  return min(max(q.x,q.y),0.0)+length(max(q,0.0))-r;
}

vec3 samp(vec2 px){
  return texture(uScene, clamp(px/uRes, vec2(0.0015), vec2(0.9985))).rgb;
}

void main(){
  vec2 fc=vUv*uRes;            // device px, y-up
  vec3 base=texture(uScene,vUv).rgb;

  vec2 p=fc-uCenter;
  float sd=sdRoundRect(p,uHalf,uRadius);   // <0 inside

  if(sd>1.0){ o=vec4(base,1.0); return; }  // fully outside the glass

  // gradient of SDF = outward normal of the rounded-rect border
  vec2 eps=vec2(1.2,0.0);
  float gx=sdRoundRect(p+eps.xy,uHalf,uRadius)-sdRoundRect(p-eps.xy,uHalf,uRadius);
  float gy=sdRoundRect(p+eps.yx,uHalf,uRadius)-sdRoundRect(p-eps.yx,uHalf,uRadius);
  vec2 nrm=normalize(vec2(gx,gy)+1e-6);    // points outward

  // depth from the inner edge of the rim, 0 at rim-inner .. 1 at very edge
  // sd in [-uRim, 0] is the rim band (outer shell). interior sd<-uRim is flat.
  float rimT=clamp((sd+uRim)/uRim,0.0,1.0);  // 0 inner .. 1 outer edge

  vec3 col;
  float inGlass=step(sd,0.0);

  if(sd < -uRim){
    // ---- FLAT FROSTED CENTER : nearly no displacement, soft frost only ----
    // tiny stable magnification so center looks like a clean glass pane
    vec2 disp = p*0.012;          // very gentle pull-in (flat lens)
    vec2 src = uCenter + p - disp;
    // light frost blur
    vec3 a=samp(src);
    vec3 b=samp(src+vec2(2.0,1.0));
    vec3 c2=samp(src+vec2(-1.5,2.0));
    vec3 dd=samp(src+vec2(1.0,-2.0));
    col=(a*0.5+b*0.18+c2*0.16+dd*0.16);
    col=mix(col, vec3(dot(col,vec3(.299,.587,.114))), 0.10); // slight desat frost
    col=col*0.96+vec3(0.05);                                 // milky lift
  } else {
    // ---- CURVED RIM : strong lens. push sampling inward along normal,
    //      magnify (pull from deeper inside) so background bends & enlarges ----
    float curve=rimT*rimT;                       // curvature grows toward edge
    // refraction: bend the view inward; deeper bend near the outer edge
    float bend = (18.0 + 90.0*curve);            // px of inward displacement
    // magnify: sample from further inside the card so pond looks enlarged at rim
    float mag  = 1.0 + 0.55*curve;
    vec2 srcRefr = uCenter + p*(1.0/mag) - nrm*bend;

    // chromatic split at the rim (glass dispersion)
    float ca = 1.4 + 5.0*curve;
    vec3 cr=samp(srcRefr - nrm*ca);
    vec3 cg=samp(srcRefr);
    vec3 cb=samp(srcRefr + nrm*ca);
    col=vec3(cr.r,cg.g,cb.b);

    // rim shading: darker glass wall, then bright specular ring on the lip
    col*=mix(1.0,0.55,curve);                    // wall darkening
    // bright outer specular arc (dawn light from upper-left)
    float th=atan(nrm.y,nrm.x);
    float arc=pow(max(cos(th-2.35),0.0),5.0)+0.6*pow(max(cos(th+0.6),0.0),9.0);
    float lip=smoothstep(0.55,1.0,rimT);
    col+=vec3(1.0,0.95,0.86)*lip*(0.10+0.55*arc);
    // thin bright inner ring where rim meets flat center
    col+=vec3(0.9,0.97,1.0)*smoothstep(0.18,0.0,abs(rimT-0.04))*0.25;
  }

  // overall glass milkiness + top sheen (screen-blend dawn highlight)
  vec2 hp=uCenter+vec2(-0.4,0.5)*uHalf;
  float sheen=exp(-dot(fc-hp,fc-hp)/(uHalf.x*uHalf.x*0.5));
  col+=vec3(0.18,0.17,0.16)*sheen*inGlass;

  // soft contact shadow just outside the glass
  float outside=smoothstep(0.0,6.0,sd);
  base*=mix(1.0,0.80,smoothstep(8.0,0.0,sd)*step(0.0,sd));

  col=mix(base,col,inGlass);
  o=vec4(clamp(col,0.0,1.5),1.0);
}`;

function compile(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  return p;
}
const simProg=program(VERT,SIM_FRAG);
const watProg=program(VERT,WATER_FRAG);
const glsProg=program(VERT,GLASS_FRAG);

const su={prev:gl.getUniformLocation(simProg,'uPrev'),texel:gl.getUniformLocation(simProg,'uTexel'),
  drops:gl.getUniformLocation(simProg,'uDrops[0]'),count:gl.getUniformLocation(simProg,'uCount')};
const wu={h:gl.getUniformLocation(watProg,'uH'),bottom:gl.getUniformLocation(watProg,'uBottom'),
  fish:gl.getUniformLocation(watProg,'uFish'),texel:gl.getUniformLocation(watProg,'uTexel'),

  focus:gl.getUniformLocation(watProg,'uFocus')};
const gu={scene:gl.getUniformLocation(glsProg,'uScene'),res:gl.getUniformLocation(glsProg,'uRes'),
  center:gl.getUniformLocation(glsProg,'uCenter'),half:gl.getUniformLocation(glsProg,'uHalf'),
  radius:gl.getUniformLocation(glsProg,'uRadius'),rim:gl.getUniformLocation(glsProg,'uRim'),

const quad=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,quad);

gl.enableVertexAttribArray(0);

/* ---------------- textures / targets ---------------- */
let cssW=0,cssH=0,dpr=1,fishScale=1;
let simW=0,simH=0,texA=null,texB=null,fboA=null,fboB=null;
let sceneTex=null,sceneFBO=null,sceneW=0,sceneH=0;
const bCan=document.createElement('canvas'),bctx=bCan.getContext('2d');
const fCan=document.createElement('canvas'),fctx=fCan.getContext('2d');
const bottomTex=gl.createTexture(),fishTex=gl.createTexture();
let fishTexW=0,fishTexH=0;
let focusUV=[0.5,0.45];

function texParams(){
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
}
function makeTargetF(w,h){
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
  texParams();
  const f=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
  return [t,f];
}
function makeTargetU(w,h){
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  texParams();
  const f=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);

}
function createSim(){
  if(texA){gl.deleteTexture(texA);gl.deleteTexture(texB);gl.deleteFramebuffer(fboA);gl.deleteFramebuffer(fboB);}
  const scale=Math.min(0.5,768/Math.max(cssW,cssH));
  simW=Math.max(64,Math.round(cssW*scale));
  simH=Math.max(64,Math.round(cssH*scale));
  [texA,fboA]=makeTargetF(simW,simH);
  [texB,fboB]=makeTargetF(simW,simH);
}
function createScene(){
  if(sceneTex){gl.deleteTexture(sceneTex);gl.deleteFramebuffer(sceneFBO);}
  sceneW=canvas.width;sceneH=canvas.height;
  [sceneTex,sceneFBO]=makeTargetU(sceneW,sceneH);
}
function uploadBottom(){
  gl.bindTexture(gl.TEXTURE_2D,bottomTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,bCan);
  texParams();
}
function uploadFish(){
  gl.bindTexture(gl.TEXTURE_2D,fishTex);
  if(fishTexW!==fCan.width||fishTexH!==fCan.height){
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,fCan);
    texParams();fishTexW=fCan.width;fishTexH=fCan.height;
  }else gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,gl.RGBA,gl.UNSIGNED_BYTE,fCan);
}

/* ---------------- pond bottom : dawn macro tones ---------------- */
function paintBottom(){
  const c=bctx,w=cssW,h=cssH;
  c.setTransform(fishScale,0,0,fishScale,0,0);
  // warm dawn substrate: gold-pink upper, teal-olive deep
  const g=c.createLinearGradient(0,0,w*0.4,h);
  g.addColorStop(0,'#6f5e3e');     // warm sand under dawn light
  g.addColorStop(0.45,'#55563b');
  g.addColorStop(1,'#2c3a33');     // cool teal-olive depth
  c.fillStyle=g;c.fillRect(0,0,w,h);
  // soft dawn glow blooms (bokeh-ready)
  const blooms=[['rgba(255,210,150,0.22)',0.28,0.22],['rgba(255,180,170,0.16)',0.7,0.16],
                ['rgba(150,210,205,0.16)',0.55,0.7],['rgba(255,230,180,0.14)',0.86,0.62]];
  for(const [col,fx,fy] of blooms){
    const x=w*fx,y=h*fy,r=Math.max(w,h)*0.5;
    const ag=c.createRadialGradient(x,y,0,x,y,r);
    ag.addColorStop(0,col);ag.addColorStop(1,col.replace(/[\d.]+\)$/,'0)'));
    c.fillStyle=ag;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
  }
  // mossy patches
  for(let i=0;i<10;i++){
    const x=Math.random()*w,y=Math.random()*h,r=90+Math.random()*200;
    const ag=c.createRadialGradient(x,y,0,x,y,r);
    ag.addColorStop(0,'rgba(40,58,34,0.26)');ag.addColorStop(1,'rgba(40,58,34,0)');
    c.fillStyle=ag;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
  }
  // fine glittering substrate grains (sparkle seeds)
  for(let i=0;i<2600;i++){
    const x=Math.random()*w,y=Math.random()*h,r=Math.random()*1.8+0.4;
    c.fillStyle=Math.random()<0.5
      ?'rgba(255,236,196,'+(Math.random()*0.11).toFixed(3)+')'
      :'rgba(20,26,16,'+(Math.random()*0.14).toFixed(3)+')';
    c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
  }
  // pebbles
  const np=Math.max(14,Math.round(w*h/56000));
  for(let i=0;i<np;i++)drawPebble(c,Math.random()*w,Math.random()*h,12+Math.random()*46,Math.random()*TAU);
}
function drawPebble(c,x,y,r,rot){
  c.save();c.translate(x,y);c.rotate(rot);
  const ry=r*(0.62+Math.random()*0.3);
  c.fillStyle='rgba(0,0,0,0.30)';
  c.beginPath();c.ellipse(r*0.13,ry*0.2,r*1.02,ry*1.02,0,0,TAU);c.fill();
  const hue=30+Math.random()*30,sat=8+Math.random()*14,li=38+Math.random()*26;
  const g=c.createRadialGradient(-r*0.35,-ry*0.4,r*0.08,0,0,r*1.15);
  g.addColorStop(0,'hsl('+hue+','+sat+'%,'+(li+18)+'%)');
  g.addColorStop(0.7,'hsl('+hue+','+sat+'%,'+li+'%)');
  g.addColorStop(1,'hsl('+hue+','+(sat+5)+'%,'+(li-14)+'%)');
  c.fillStyle=g;c.beginPath();c.ellipse(0,0,r,ry,0,0,TAU);c.fill();
  c.restore();
}

/* ---------------- koi (frangollo body, dawn palette) ---------------- */
function palette(type){
  if(type==='orange')return{core:'#ffc15a',mid:'#ff842a',edge:'#cf4708',fin:'rgba(255,150,60,',patches:[]};
  if(type==='red')return{core:'#ff8a55',mid:'#f04a12',edge:'#a82803',fin:'rgba(238,90,40,',patches:[]};
  if(type==='kohaku'){
    const p=[];const n=3+(Math.random()*2|0);
    for(let i=0;i<n;i++)p.push({s:0.10+Math.random()*0.62,o:(Math.random()-0.5)*1.2,r:0.13+Math.random()*0.13,col:'rgba(241,80,26,0.92)'});
    return{core:'#fffaf2',mid:'#f6eedd',edge:'#cdbfa8',fin:'rgba(255,240,222,',patches:p};
  }
  if(type==='calico'){
    const p=[];
    for(let i=0;i<3;i++)p.push({s:0.12+Math.random()*0.58,o:(Math.random()-0.5)*1.3,r:0.12+Math.random()*0.12,col:'rgba(249,120,40,0.9)'});
    for(let i=0;i<3;i++)p.push({s:0.10+Math.random()*0.68,o:(Math.random()-0.5)*1.4,r:0.05+Math.random()*0.07,col:'rgba(40,38,52,0.85)'});
    return{core:'#fffaf2',mid:'#f3ebdc',edge:'#c9bba2',fin:'rgba(255,244,228,',patches:p};
  }
  return{core:'#fffdf8',mid:'#f8f1e6',edge:'#d3c5ae',fin:'rgba(255,242,228,',
    patches:[{s:0.07,o:0,r:0.12,col:'rgba(236,52,24,0.95)'}]};
}
function makeFish(type,len){
  const pal=palette(type);
  return{x:120+Math.random()*Math.max(60,cssW-240),y:120+Math.random()*Math.max(60,cssH-240),
    a:Math.random()*TAU,len,phase:Math.random()*10,speed:28,spT:30,turn:0,
    changeT:Math.random()*3,wakeT:Math.random()*0.2,speedN:0.3,po:Math.random()*TAU,
    core:pal.core,mid:pal.mid,edge:pal.edge,fin:pal.fin,patches:pal.patches};
}
let fishes=[];
const foods=[];
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;};

function updateFish(f,dt){
  f.changeT-=dt;
  if(f.changeT<=0){f.spT=18+Math.random()*40;if(Math.random()<0.16)f.spT=95+Math.random()*45;f.changeT=2+Math.random()*4;}
  f.turn+=(Math.random()-0.5)*3.2*dt;f.turn*=Math.exp(-dt*1.4);
  let target=null,fdist=1e9;
  for(const fd of foods){const d=Math.hypot(fd.x-f.x,fd.y-f.y);if(d<fdist){fdist=d;target=fd;}}
  let ta;
  if(target&&fdist<560){ta=Math.atan2(target.y-f.y,target.x-f.x);f.spT=Math.max(f.spT,fdist<90?60:100);}
  else{target=null;ta=f.a+f.turn;}
  const m=85;
  if(f.x<m||f.y<m||f.x>cssW-m||f.y>cssH-m)ta=Math.atan2(cssH*0.5-f.y,cssW*0.5-f.x);
  for(const g of fishes){if(g===f)continue;const dx=f.x-g.x,dy=f.y-g.y;if(dx*dx+dy*dy<5600){ta=Math.atan2(dy,dx);break;}}
  const da=angDiff(ta,f.a);
  const mt=(target?2.7:1.1)*dt;
  f.a+=Math.max(-mt,Math.min(mt,da));
  f.speed+=(f.spT-f.speed)*Math.min(1,dt*1.8);
  f.x+=Math.cos(f.a)*f.speed*dt;f.y+=Math.sin(f.a)*f.speed*dt;
  f.x=Math.max(24,Math.min(cssW-24,f.x));f.y=Math.max(24,Math.min(cssH-24,f.y));
  f.speedN=Math.min(1,f.speed/120);
  f.phase+=dt*(3.5+f.speed*0.075)*2.4;
  f.wakeT-=dt;
  if(f.wakeT<=0&&f.speed>30){
    addDrop(f.x+Math.cos(f.a)*f.len*0.42,f.y+Math.sin(f.a)*f.len*0.42,6+f.speedN*8,0.05+0.16*f.speedN);
    f.wakeT=0.10+Math.random()*0.08;
  }
  if(target&&fdist<16){foods.splice(foods.indexOf(target),1);addDrop(f.x,f.y,11,0.55);f.spT=14;f.changeT=1.2;}
}

function bodyOutline(pts,wfun){
  const top=[],bot=[];
  for(let i=0;i<pts.length;i++){
    const p=pts[i];
    const pa=pts[Math.max(0,i-1)],pb=pts[Math.min(pts.length-1,i+1)];
    let dx=pb.x-pa.x,dy=pb.y-pa.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
    const w=wfun(p.s);
    top.push({x:p.x-dy*w,y:p.y+dx*w});bot.push({x:p.x+dy*w,y:p.y-dx*w});
  }
  return{top,bot};
}
function tailLobe(c,len,spread,sw){
  const ty=spread+sw;
  c.beginPath();c.moveTo(0,0);
  c.bezierCurveTo(len*0.32,spread*0.06+sw*0.2,len*0.72,ty*0.6,len,ty);
  c.bezierCurveTo(len*0.78,ty*0.98,len*0.30,spread*0.55+sw*0.25,0,0);
  c.closePath();c.fill();
}
function finShape(c,x,y,ang,len,flip){
  c.save();c.translate(x,y);c.rotate(ang);if(flip)c.scale(1,-1);
  c.beginPath();c.moveTo(0,0);
  c.quadraticCurveTo(len*0.55,-len*0.10,len,len*0.22);
  c.quadraticCurveTo(len*0.45,len*0.34,0,0);
  c.closePath();c.fill();c.restore();
}
function drawFish(c,f){
  const L=f.len;c.save();c.translate(f.x,f.y);c.rotate(f.a);
  const segs=16,pts=[];const amp=L*(0.05+0.06*f.speedN);
  for(let i=0;i<=segs;i++){const s=i/segs;pts.push({x:L*0.48-s*L*0.96,y:Math.sin(f.phase-s*4.4)*amp*Math.pow(s,1.5),s});}
  const wmax=L*0.16;
  const wf=s=>wmax*Math.pow(Math.sin(Math.PI*Math.min(0.10+s*0.90,1)),0.85)*(1-0.58*s)+L*0.018;
  const tp=pts[segs],tq=pts[segs-1];const tang=Math.atan2(tp.y-tq.y,tp.x-tq.x);
  c.save();c.translate(tp.x,tp.y);c.rotate(tang);
  const tl=L*0.66;const sw=Math.sin(f.phase-5.2)*tl*0.30;
  const tg=c.createRadialGradient(0,0,tl*0.06,0,0,tl);
  tg.addColorStop(0,f.fin+'0.85)');tg.addColorStop(0.55,f.fin+'0.5)');tg.addColorStop(1,f.fin+'0)');
  c.fillStyle=tg;
  tailLobe(c,tl,tl*0.52,sw);tailLobe(c,tl,-tl*0.52,sw*0.85);
  tailLobe(c,tl*0.72,tl*0.16,sw*0.7);tailLobe(c,tl*0.72,-tl*0.16,sw*0.6);
  c.restore();
  const pp=pts[5],wp=wf(pts[5].s);const fl=Math.sin(f.phase*1.2+f.po)*0.22;
  c.fillStyle=f.fin+'0.55)';
  finShape(c,pp.x,pp.y+wp*0.85,2.3+fl,L*0.24,false);finShape(c,pp.x,pp.y-wp*0.85,-2.3-fl,L*0.24,true);
  const o=bodyOutline(pts,wf);
  const path=()=>{c.beginPath();c.moveTo(o.top[0].x,o.top[0].y);
    for(let i=1;i<o.top.length;i++)c.lineTo(o.top[i].x,o.top[i].y);
    for(let i=o.bot.length-1;i>=0;i--)c.lineTo(o.bot[i].x,o.bot[i].y);
    c.quadraticCurveTo(pts[0].x+L*0.16,pts[0].y,o.top[0].x,o.top[0].y);c.closePath();};
  const bg=c.createRadialGradient(L*0.12,0,L*0.05,L*0.05,0,L*0.62);
  bg.addColorStop(0,f.core);bg.addColorStop(0.55,f.mid);bg.addColorStop(1,f.edge);
  path();c.fillStyle=bg;c.fill();
  if(f.patches.length){c.save();path();c.clip();
    for(const p of f.patches){const i=Math.min(segs,Math.round(p.s*segs));const pt=pts[i],w=wf(p.s);
      c.beginPath();c.ellipse(pt.x,pt.y+p.o*w,p.r*L,p.r*L*0.75,0,0,TAU);c.fillStyle=p.col;c.fill();}
    c.restore();}
  c.save();path();c.clip();
  const hg=c.createRadialGradient(L*0.15,0,0,L*0.10,0,L*0.5);
  hg.addColorStop(0,'rgba(255,255,255,0.32)');hg.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=hg;c.beginPath();c.ellipse(L*0.10,0,L*0.45,wmax*0.55,0,0,TAU);c.fill();
  c.strokeStyle='rgba(60,20,0,0.18)';c.lineWidth=L*0.016;
  c.beginPath();c.moveTo(pts[3].x,pts[3].y);for(let i=4;i<=11;i++)c.lineTo(pts[i].x,pts[i].y);c.stroke();
  c.strokeStyle='rgba(0,0,0,0.10)';c.lineWidth=L*0.012;
  c.beginPath();c.arc(pts[2].x-L*0.02,pts[2].y,wf(pts[2].s)*0.85,-1.2,1.2);c.stroke();
  c.restore();
  path();c.strokeStyle='rgba(40,15,0,0.18)';c.lineWidth=1;c.stroke();
  const ep=pts[1],ew=wf(pts[1].s);c.fillStyle='#19120a';
  c.beginPath();c.arc(ep.x,ep.y+ew*0.72,L*0.026,0,TAU);c.fill();
  c.beginPath();c.arc(ep.x,ep.y-ew*0.72,L*0.026,0,TAU);c.fill();
  c.fillStyle='rgba(255,255,255,0.6)';
  c.beginPath();c.arc(ep.x-L*0.008,ep.y+ew*0.72-L*0.008,L*0.008,0,TAU);c.fill();
  c.beginPath();c.arc(ep.x-L*0.008,ep.y-ew*0.72-L*0.008,L*0.008,0,TAU);c.fill();
  c.restore();
}
function drawFishCanvas(t){
  fctx.setTransform(fishScale,0,0,fishScale,0,0);
  fctx.clearRect(0,0,cssW,cssH);
  for(const fd of foods){
    const bob=Math.sin(t*3+fd.ph)*1.3;
    fctx.fillStyle='rgba(255,232,180,0.95)';
    fctx.beginPath();fctx.arc(fd.x+bob,fd.y+Math.cos(t*2.4+fd.ph)*1.1,2.5,0,TAU);fctx.fill();
  }
  for(const f of fishes)drawFish(fctx,f);
}

/* ---------------- ripples ---------------- */
const drops=[];
function addDrop(x,y,r,s){drops.push({x,y,r,s});if(drops.length>24)drops.shift();}
const dropArr=new Float32Array(32);
function simulate(){
  gl.useProgram(simProg);gl.viewport(0,0,simW,simH);
  gl.uniform2f(su.texel,1/simW,1/simH);
  for(let step=0;step<2;step++){
    let n=0;
    if(step===0){
      n=Math.min(drops.length,8);
      for(let j=0;j<n;j++){const d=drops[j];
        dropArr[j*4]=d.x/cssW*simW;dropArr[j*4+1]=(1-d.y/cssH)*simH;
        dropArr[j*4+2]=Math.max(2,d.r*simW/cssW);dropArr[j*4+3]=d.s;}
      drops.splice(0,n);
    }
    gl.uniform4fv(su.drops,dropArr);gl.uniform1i(su.count,n);
    gl.bindFramebuffer(gl.FRAMEBUFFER,fboB);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texA);gl.uniform1i(su.prev,0);
    gl.drawArrays(gl.TRIANGLES,0,3);
    let tt=texA;texA=texB;texB=tt;tt=fboA;fboA=fboB;fboB=tt;
  }
}
function renderWater(t){
  gl.useProgram(watProg);
  gl.bindFramebuffer(gl.FRAMEBUFFER,sceneFBO);
  gl.viewport(0,0,sceneW,sceneH);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texA);gl.uniform1i(wu.h,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,bottomTex);gl.uniform1i(wu.bottom,1);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,fishTex);gl.uniform1i(wu.fish,2);
  gl.uniform2f(wu.texel,1/simW,1/simH);
  gl.uniform2f(wu.res,sceneW,sceneH);
  gl.uniform1f(wu.t,t);
  gl.uniform2f(wu.focus,focusUV[0],focusUV[1]);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
let cardRect={cx:0,cy:0,hw:0,hh:0,r:0};
function renderGlass(t){
  gl.useProgram(glsProg);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,sceneTex);gl.uniform1i(gu.scene,0);
  gl.uniform2f(gu.res,canvas.width,canvas.height);
  gl.uniform2f(gu.center,cardRect.cx,cardRect.cy);
  gl.uniform2f(gu.half,cardRect.hw,cardRect.hh);
  gl.uniform1f(gu.radius,cardRect.r);
  gl.uniform1f(gu.rim,parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rim-w'))*dpr||22*dpr);
  gl.uniform1f(gu.time,t);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* measure card rect in device px (y-up) for the glass shader */
function measureCard(){
  const rb=slabEl.getBoundingClientRect();
  cardRect.cx=(rb.left+rb.width/2)*dpr;
  cardRect.cy=canvas.height-(rb.top+rb.height/2)*dpr;  // flip y
  cardRect.hw=(rb.width/2)*dpr;
  cardRect.hh=(rb.height/2)*dpr;
  const rcss=parseFloat(getComputedStyle(slabEl).borderTopLeftRadius)||30;
  cardRect.r=rcss*dpr;
}

/* ---------------- layout / input ---------------- */
function resize(){
  cssW=window.innerWidth;cssH=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(cssW*dpr);canvas.height=Math.round(cssH*dpr);
  fishScale=Math.min(dpr,1.5);
  fCan.width=Math.round(cssW*fishScale);fCan.height=Math.round(cssH*fishScale);
  fishTexW=0;
  bCan.width=fCan.width;bCan.height=fCan.height;
  paintBottom();uploadBottom();createSim();createScene();
  for(const f of fishes){f.x=Math.max(40,Math.min(cssW-40,f.x));f.y=Math.max(40,Math.min(cssH-40,f.y));}
  measureCard();
}
window.addEventListener('resize',()=>{resize();});

function isOnCard(x,y){
  const rb=slabEl.getBoundingClientRect();
  return x>=rb.left&&x<=rb.right&&y>=rb.top&&y<=rb.bottom;
}
canvas.addEventListener('pointerdown',e=>{
  const x=e.clientX,y=e.clientY;
  addDrop(x,y,18,1.3);
  if(foods.length<25)foods.push({x:x+(Math.random()-0.5)*16,y:y+(Math.random()-0.5)*16,ph:Math.random()*TAU});
  focusUV=[x/cssW,1-y/cssH];        // shift shallow-DOF focus toward the food
  hint.style.opacity=0;
});
let lmx=-1,lmy=-1;
canvas.addEventListener('pointermove',e=>{
  if(lmx<0){lmx=e.clientX;lmy=e.clientY;return;}
  const d=Math.hypot(e.clientX-lmx,e.clientY-lmy);
  if(d>26){addDrop(e.clientX,e.clientY,7,0.06);lmx=e.clientX;lmy=e.clientY;}
});

/* ---------------- signature pad ---------------- */
(function(){
  const sig=document.getElementById('sig'),hintS=document.getElementById('sigHint');
  const sc=sig.getContext('2d');let drawing=false,last=null,inked=false;
  function size(){const r=sig.getBoundingClientRect();sig.width=r.width*2;sig.height=r.height*2;sc.scale(2,2);
    sc.lineWidth=2.1;sc.lineCap='round';sc.lineJoin='round';sc.strokeStyle='#fffaf0';}
  setTimeout(size,60);window.addEventListener('resize',()=>{const data=inked;size();});
  function pos(e){const r=sig.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
  sig.addEventListener('pointerdown',e=>{e.stopPropagation();drawing=true;last=pos(e);inked=true;hintS.style.opacity=0;sig.setPointerCapture(e.pointerId);});
  sig.addEventListener('pointermove',e=>{if(!drawing)return;e.stopPropagation();const p=pos(e);
    sc.beginPath();sc.moveTo(last.x,last.y);sc.lineTo(p.x,p.y);sc.stroke();last=p;});
  sig.addEventListener('pointerup',e=>{drawing=false;});
  document.getElementById('clrBtn').addEventListener('click',e=>{e.stopPropagation();
    sc.clearRect(0,0,sig.width,sig.height);inked=false;hintS.style.opacity=0.65;});
})();

/* ---------------- boot ---------------- */
resize();
fishes=[
  makeFish('orange',118),makeFish('kohaku',104),makeFish('calico',92),
  makeFish('red',128),makeFish('orange',72),makeFish('tancho',86),
  makeFish('kohaku',96),makeFish('orange',82)
];
for(let i=0;i<3;i++)addDrop(Math.random()*cssW,Math.random()*cssH,14,0.6);
setTimeout(()=>{hint.style.opacity=0;},10000);

let ambT=3,last=0,frames=0;
function frame(ts){
  requestAnimationFrame(frame);
  const t=ts/1000;
  const dt=Math.min(0.05,Math.max(0.001,t-last));last=t;
  ambT-=dt;
  if(ambT<=0){addDrop(Math.random()*cssW,Math.random()*cssH,8,0.30);ambT=3+Math.random()*5;}
  for(const f of fishes)updateFish(f,dt);
  drawFishCanvas(t);
  uploadFish();
  simulate();
  renderWater(t);
  if((frames++ & 7)===0) measureCard();   // keep glass locked to the card cheaply
  renderGlass(t);
}
requestAnimationFrame(frame);
})();
</script>
