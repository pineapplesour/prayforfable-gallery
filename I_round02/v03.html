<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dawn Koi · Liquid Glass</title>
<style>
  :root{ color-scheme:dark; }
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0d0e;
    font-family:"SF Pro Text",-apple-system,"Helvetica Neue","Segoe UI",system-ui,sans-serif;}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:none;}

  /* ===== Liquid-glass window (DOM layer, refraction is done in WebGL behind it) ===== */
  #stage{position:fixed;inset:0;pointer-events:none;}
  .card{
    position:absolute;pointer-events:auto;
    /* the WebGL refraction layer renders the warped water behind these,
       so the DOM only carries the frosted veil + rim lighting + content */
    background:linear-gradient(155deg, rgba(214,236,234,.10), rgba(120,168,170,.05) 46%, rgba(40,70,72,.08));
    border:1px solid rgba(225,244,242,.30);
    box-shadow:
      0 28px 70px rgba(0,18,20,.46),
      0 6px 22px rgba(0,12,14,.30),
      inset 0 1px 0 rgba(255,255,255,.42),
      inset 0 0 0 1px rgba(190,230,228,.06),
      inset 0 -24px 50px rgba(8,28,30,.22);
    backdrop-filter:blur(3px) saturate(1.18) brightness(1.04);
    -webkit-backdrop-filter:blur(3px) saturate(1.18) brightness(1.04);
    overflow:hidden;
    transition:transform .5s cubic-bezier(.2,.7,.2,1);
  }
  /* central frosted glass — flatter, milkier than the rim */
  .card::before{
    content:"";position:absolute;inset:14px;border-radius:inherit;
    background:radial-gradient(120% 120% at 30% 18%, rgba(255,255,255,.10), rgba(255,255,255,0) 52%);
    backdrop-filter:blur(7px) saturate(1.05);
    -webkit-backdrop-filter:blur(7px) saturate(1.05);
    pointer-events:none;
  }
  /* bright specular sweep on the rim */
  .card::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:
      linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,0) 18%),
      radial-gradient(80% 60% at 78% 8%, rgba(180,240,255,.30), rgba(180,240,255,0) 40%);
    mix-blend-mode:screen;opacity:.9;
  }
  .card *{position:relative;z-index:2;}

  #panel{
    left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(440px,84vw);padding:30px 30px 26px;border-radius:32px;
  }
  #chip{
    left:calc(50% + min(220px,42vw) - 12px);top:calc(50% + 132px);
    transform:translate(-100%,0);
    width:min(186px,52vw);padding:16px 18px;border-radius:22px;
  }

  .ava{width:60px;height:60px;border-radius:50%;display:block;margin:0 auto 14px;
    border:2px solid rgba(255,255,255,.7);box-shadow:0 8px 22px rgba(0,20,22,.4);
    background:radial-gradient(circle at 38% 32%, #bfe9e6, #2a4d4d 70%, #16302f);}
  .ava svg{width:100%;height:100%;display:block;}
  h1{margin:0;text-align:center;font-size:25px;font-weight:700;letter-spacing:.2px;
    color:rgba(244,253,252,.97);text-shadow:0 2px 12px rgba(0,16,18,.5);}
  .sub{margin:3px 0 18px;text-align:center;font-size:13.5px;letter-spacing:.04em;
    color:rgba(206,231,229,.78);}
  .stats{display:flex;gap:10px;justify-content:center;}
  .stat{flex:1;text-align:center;padding:11px 6px;border-radius:16px;
    background:rgba(220,242,240,.07);border:1px solid rgba(225,244,242,.22);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28);}
  .stat b{display:block;font-size:18px;font-weight:700;color:rgba(245,253,252,.96);}
  .stat span{font-size:11px;letter-spacing:.05em;color:rgba(198,226,224,.72);}
  .tagrow{display:flex;gap:9px;justify-content:center;margin-top:16px;}
  .tag{font-size:12px;padding:8px 14px;border-radius:999px;
    background:rgba(220,242,240,.07);border:1px solid rgba(225,244,242,.24);
    color:rgba(220,240,238,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.24);
    display:flex;align-items:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:#7ee0c8;box-shadow:0 0 8px #7ee0c8;}

  #chip .ctitle{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(190,224,222,.7);margin-bottom:6px;}
  #chip .cbig{font-size:21px;font-weight:700;color:rgba(245,253,252,.96);line-height:1.1;}
  #chip .cnote{font-size:11px;color:rgba(196,224,222,.74);margin-top:4px;}

  #hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    color:rgba(240,250,248,.82);font-size:12.5px;letter-spacing:.16em;
    background:rgba(6,26,28,.34);padding:8px 20px;border-radius:99px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(220,240,238,.14);
    pointer-events:none;transition:opacity 1.4s;white-space:nowrap;z-index:5;}

  @media (max-width:520px){
    #panel{width:88vw;padding:24px 20px 22px;border-radius:26px;}
    #chip{left:50%;top:auto;bottom:84px;transform:translateX(-50%);width:70vw;}
    h1{font-size:22px;}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="stage">
  <section class="card" id="panel" aria-label="Dawn koi profile">
    <span class="ava">
      <svg viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="32" fill="#16302f"/>
        <path d="M32 14c-9.5 0-17 6.6-17 16.4 0 7.4 4.4 12.9 11 14.8.8.2 1.1-.3 1.1-.8v-2.8c-4 .9-5-1.7-5-1.7-.6-1.5-1.5-1.9-1.5-1.9-1.3-.9.1-.9.1-.9 1.5.1 2.2 1.5 2.2 1.5 1.3 2.2 3.4 1.6 4.2 1.2.1-.9.5-1.6.9-2-3.2-.4-6.6-1.6-6.6-7.2 0-1.6.6-2.9 1.5-3.9-.2-.4-.7-1.9.1-3.9 0 0 1.2-.4 4 1.5a13.8 13.8 0 0 1 7.2 0c2.8-1.9 4-1.5 4-1.5.8 2 .3 3.5.1 3.9.9 1 1.5 2.3 1.5 3.9 0 5.6-3.4 6.8-6.7 7.2.5.5 1 1.4 1 2.8v4.1c0 .5.3 1 1.1.8 6.6-1.9 11-7.4 11-14.8C49 20.6 41.5 14 32 14z" fill="#e9f6f4"/>
        <ellipse cx="32" cy="50" rx="13" ry="4" fill="#7ec8e8" opacity=".55"/>
      </svg>
    </span>
    <h1>Koi at Dawn</h1>
    <p class="sub">새벽 연못 · 리퀴드 글래스</p>
    <div class="stats">
      <div class="stat"><b>6</b><span>Koi</span></div>
      <div class="stat"><b>∞</b><span>Ripples</span></div>
      <div class="stat"><b>05:14</b><span>Dawn</span></div>
    </div>
    <div class="tagrow">
      <span class="tag"><i class="dot"></i>Macro focus</span>
      <span class="tag"><i class="dot"></i>Variable glass</span>
    </div>
  </section>

  <aside class="card" id="chip" aria-label="water temperature chip">
    <div class="ctitle">Surface</div>
    <div class="cbig">17.3°C</div>
    <div class="cnote">미풍 · 캐스틱 흔들림</div>
  </aside>
</div>

<div id="hint">화면을 클릭 — 먹이가 떨어지고 코이가 모여듭니다</div>

<script>
'use strict';
(()=>{
const TAU=Math.PI*2;
const canvas=document.getElementById('gl');
const hint=document.getElementById('hint');
const panel=document.getElementById('panel');
const chip=document.getElementById('chip');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false});
if(!gl){hint.textContent='이 브라우저는 WebGL2를 지원하지 않습니다';return;}
gl.getExtension('EXT_color_buffer_float');
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);

/* ============================== shaders ============================== */
const VERT=`#version 300 es
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main(){vUv=aPos*0.5+0.5;gl_Position=vec4(aPos,0.,1.);}`;

/* --- ripple height-field simulation (frangollo lineage) --- */
const SIM_FRAG=`#version 300 es
precision highp float;
uniform sampler2D uPrev;
uniform vec2 uTexel;
uniform vec4 uDrops[8];
uniform int uCount;
in vec2 vUv; out vec4 o;
void main(){
  vec2 c=texture(uPrev,vUv).rg;
  float sum=
    texture(uPrev,vUv+vec2(uTexel.x,0.)).r+
    texture(uPrev,vUv-vec2(uTexel.x,0.)).r+
    texture(uPrev,vUv+vec2(0.,uTexel.y)).r+
    texture(uPrev,vUv-vec2(0.,uTexel.y)).r;
  float nh=(sum*0.5-c.g)*0.991;
  vec2 px=vUv/uTexel;
  for(int i=0;i<8;i++){
    if(i>=uCount)break;
    vec4 d=uDrops[i];
    float dist=distance(px,d.xy);
    if(dist<d.z) nh+=d.w*(cos(dist/d.z*3.14159)*0.5+0.5);
  }
  vec2 e=min(vUv,1.0-vUv);
  float edge=smoothstep(0.0,0.05,min(e.x,e.y));
  nh*=mix(0.86,1.0,edge);
  o=vec4(nh,c.r,0.,1.);
}`;

/* --- pond render: dawn macro look (warm rim light, shallow DOF bokeh, caustics) --- */
const RENDER_FRAG=`#version 300 es
precision highp float;
uniform sampler2D uH;       // ripple height
uniform sampler2D uBottom;  // pond bed (with bokeh discs baked)
uniform sampler2D uFish;    // koi + food, premultiplied focus done in JS
uniform sampler2D uDof;     // per-pixel focus mask r=focus(0..1) from fish canvas
uniform vec2 uTexel;
uniform vec2 uRes;
uniform float uT;
in vec2 vUv; out vec4 o;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

void main(){
  vec2 d=uTexel*1.5;
  float h =texture(uH,vUv).r;
  float hL=texture(uH,vUv-vec2(d.x,0.)).r;
  float hR=texture(uH,vUv+vec2(d.x,0.)).r;
  float hB=texture(uH,vUv-vec2(0.,d.y)).r;
  float hT=texture(uH,vUv+vec2(0.,d.y)).r;
  vec3 n=normalize(vec3((hL-hR)*6.0,(hB-hT)*6.0,1.0));
  // micro surface ripple (always-on glassy shimmer)
  n.xy+=0.0030*vec2(
    sin(vUv.x*150.0+uT*1.1)+sin(vUv.y*96.0-uT*0.7),
    cos(vUv.x*84.0-uT*0.85)+cos(vUv.y*150.0+uT*1.3));
  n=normalize(n);
  vec2 off=n.xy*0.044;

  vec3 bottom=texture(uBottom,vUv+off).rgb;

  // caustics from surface curvature — warm dawn gold
  float lap=(hL+hR+hB+hT-4.0*h);
  float caust=min(max(-lap,0.0)*95.0,0.85);
  bottom+=vec3(1.0,0.86,0.62)*caust*0.70;
  bottom*=1.0-min(max(lap,0.0)*72.0,0.30);

  // koi shadow on bed
  float sh=texture(uFish,vUv+off+vec2(0.012,-0.016)).a;
  bottom*=1.0-sh*0.34;

  // tint water with a teal-dawn body color, denser toward edges (depth)
  vec3 waterDeep=vec3(0.045,0.165,0.180);
  vec3 waterShal=vec3(0.10,0.30,0.30);
  float depth=smoothstep(0.15,0.95,length(vUv-0.5));
  vec3 water=mix(waterShal,waterDeep,depth);
  vec3 col=mix(bottom,water,mix(0.22,0.40,depth));

  // koi color, slightly absorbed by water
  vec4 fish=texture(uFish,vUv+off*0.42);
  vec3 fcol=mix(fish.rgb,water,0.08);
  col=mix(col,fcol,fish.a);

  // ---- shallow depth of field: blur out-of-focus regions into creamy bokeh ----
  float focus=texture(uDof,vUv).r;            // 1 = sharp koi, 0 = far/blurred
  float blurAmt=(1.0-focus);                  // 0..1
  if(blurAmt>0.02){
    vec3 acc=col; float wsum=1.0;
    float rad=blurAmt*0.020;
    for(int i=0;i<10;i++){
      float a=float(i)*2.39996;             // golden-angle bokeh ring
      float rr=rad*(0.35+0.65*float(i)/10.0);
      vec2 sp=vUv+vec2(cos(a),sin(a))*rr;
      vec3 s=texture(uBottom,sp+off).rgb;
      s=mix(s,water,mix(0.22,0.40,depth));
      vec4 sf=texture(uFish,sp+off*0.42);
      s=mix(s,mix(sf.rgb,water,0.08),sf.a);
      // bright bokeh weighting: highlights bloom into discs
      float lum=dot(s,vec3(0.299,0.587,0.114));
      float w=0.5+1.6*smoothstep(0.45,0.9,lum);
      acc+=s*w; wsum+=w;
    }
    col=mix(col,acc/wsum,clamp(blurAmt*1.3,0.0,1.0));
  }

  // dawn rim light — specular sun glints riding the wavelets
  vec3 L=normalize(vec3(-0.42,0.52,0.74));
  float spec=pow(max(dot(reflect(vec3(0.,0.,-1.),n),L),0.0),150.0);
  col+=vec3(1.0,0.84,0.60)*spec*1.05;
  // cool sky bounce specular
  float spec2=pow(max(dot(n,normalize(vec3(0.25,-0.35,0.9))),0.0),3.0);
  col+=vec3(0.42,0.56,0.62)*spec2*0.07;

  // floating dust / pollen motes catching the light (macro feel)
  vec2 gp=vUv*vec2(uRes.x/uRes.y,1.0)*7.0;
  float mote=hash(floor(gp));
  if(mote>0.985){
    vec2 f=fract(gp)-0.5;
    float m=exp(-dot(f,f)*26.0)*(0.6+0.4*sin(uT*1.7+mote*40.0));
    col+=vec3(1.0,0.92,0.78)*m*0.5*(1.0-depth*0.6);
  }

  // warm dawn grade + gentle bloom in the focal center
  col*=vec3(1.06,1.0,0.95);
  float focalBloom=smoothstep(0.7,0.0,length(vUv-vec2(0.5,0.46)))*0.06;
  col+=vec3(1.0,0.8,0.62)*focalBloom*focus;

  // vignette
  float vg=smoothstep(1.05,0.30,length(vUv-0.5));
  col*=mix(0.52,1.06,vg);

  // subtle film grain (macro sensor)
  col+=(hash(gl_FragCoord.xy+fract(uT)*131.0)-0.5)*0.018;

  col=pow(col,vec3(0.95)); // slight lift
  o=vec4(col,1.0);
}`;

/* --- liquid-glass refraction: VARIABLE CURVATURE
       flat-ish center (light magnify) + strongly bent rim lens (q^5)
       sampling the rendered pond. Adapted from the glass-on-monitor optics. --- */
const GLASS_FRAG=`#version 300 es
precision highp float;
uniform sampler2D uScene;   // the rendered pond (full screen)
uniform vec2 uRes;
uniform vec4 uRect[2];      // xy = center px (y-up), zw = halfsize px
uniform vec4 uRound[2];     // x = corner radius px, y = enabled
uniform float uT;
in vec2 vUv; out vec4 o;

// signed distance to rounded rect (p relative to center, half size b, radius r)
float sdRound(vec2 p, vec2 b, float r){
  vec2 q=abs(p)-b+r;
  return min(max(q.x,q.y),0.0)+length(max(q,0.0))-r;
}
vec3 scn(vec2 uv){ return texture(uScene, clamp(uv/uRes,0.001,0.999)).rgb; }

void main(){
  vec2 fc=vUv*uRes;          // pixel coord, y-up (vUv from aPos*.5+.5)
  vec3 col=scn(fc);

  for(int k=0;k<2;k++){
    vec2 ctr=uRect[k].xy;
    vec2 hs=uRect[k].zw;
    float rad=uRound[k].x;
    if(uRound[k].y<0.5) continue;

    vec2 p=fc-ctr;
    float sd=sdRound(p,hs,rad);   // <0 inside
    // normalize distance from inner-flat zone (sd<-band) to rim (sd~0)
    float band=min(hs.x,hs.y)*0.34;    // rim thickness
    // x: 0 at deep center, 1 at the very edge
    float x=clamp(1.0 + sd/band, 0.0, 1.0);

    if(sd>2.0) continue;        // fully outside (with AA margin)

    float inside=smoothstep(1.0,0.985,x); // 1 inside glass
    // outward normal of the rounded-rect field (gradient)
    vec2 eps=vec2(1.0,0.0);
    float gx=sdRound(p+eps.xy,hs,rad)-sdRound(p-eps.xy,hs,rad);
    float gy=sdRound(p+eps.yx,hs,rad)-sdRound(p-eps.yx,hs,rad);
    vec2 nrm=normalize(vec2(gx,gy)+1e-5);   // points outward

    // ---- VARIABLE CURVATURE displacement ----
    // center (q small): nearly flat, gentle magnification toward center
    // rim   (q->1)    : q^5 explosive bend, lens-like compression + magnify
    float q=x;
    float q5=q*q*q*q*q;
    float magCenter=0.18;     // flat center: small inward magnify
    float bendRim=1.45;       // rim: strong displacement (lens-like)
    // displacement pushes sampling along -normal (toward glass center) at center,
    // and strongly along +normal (compress outside-in) at the rim
    float disp = mix(-magCenter, bendRim, q5);
    float push = disp * band;
    vec2 src = fc + nrm*push;

    // chromatic split that grows toward the rim (real glass dispersion)
    float ca = 2.6 * q5 + 0.4*q;
    vec3 g;
    g.r=scn(src+nrm*ca).r;
    g.g=scn(src).g;
    g.b=scn(src-nrm*ca).b;

    // rim micro-blur to read as thick glass
    float rimBlur=smoothstep(0.55,1.0,q)*6.0;
    if(rimBlur>0.5){
      vec3 acc=g; float ws=1.0;
      for(int i=0;i<6;i++){
        float a=float(i)*1.0472;
        vec2 sp=src+vec2(cos(a),sin(a))*rimBlur;
        acc+=scn(sp); ws+=1.0;
      }
      g=mix(g,acc/ws,smoothstep(0.6,1.0,q));
    }

    // frosted milky veil — denser at center (flat frosted panel), clearer at rim (clear lens)
    float lum=dot(g,vec3(0.299,0.587,0.114));
    float frost=mix(0.30,0.04,q);           // center frostier than rim
    g=mix(g,vec3(lum),0.16*(1.0-q));         // center desaturates
    g=mix(g,vec3(0.88,0.94,0.95),frost*0.5);
    g*=mix(0.96,1.04,q);                      // rim brighter (light gathering)

    // rim specular ring + dark glass wall
    float ring=smoothstep(0.78,0.95,q)*smoothstep(1.0,0.90,q);
    float th=atan(nrm.y,nrm.x);
    float arc=pow(max(cos(th-2.2),0.0),5.0)+0.7*pow(max(cos(th+0.7),0.0),9.0)
             +0.5*pow(max(cos(th-4.3),0.0),12.0);
    g+=ring*(0.14+1.05*arc);                 // bright specular highlights on rim
    g*=1.0-smoothstep(0.955,1.0,q)*0.42;     // thin dark outer lip

    // inner bright accent where flat panel meets curved rim
    g+=smoothstep(0.60,0.70,q)*smoothstep(0.80,0.70,q)*0.18;

    // contact shadow just outside the glass
    float outShadow=smoothstep(0.0,band*0.7,sd)*smoothstep(band*0.7,0.0,sd);
    col=mix(col, col*(1.0-0.22*outShadow), step(0.0,sd));

    col=mix(col, g, inside);
  }
  o=vec4(col,1.0);
}`;

function compile(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s),src);
    throw new Error(gl.getShaderInfoLog(s));
  }
  return s;
}
function program(vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  return p;
}
const simProg=program(VERT,SIM_FRAG);
const renProg=program(VERT,RENDER_FRAG);
const glassProg=program(VERT,GLASS_FRAG);

const su={
  prev:gl.getUniformLocation(simProg,'uPrev'),
  texel:gl.getUniformLocation(simProg,'uTexel'),
  drops:gl.getUniformLocation(simProg,'uDrops[0]'),
  count:gl.getUniformLocation(simProg,'uCount')};
const ru={
  h:gl.getUniformLocation(renProg,'uH'),
  bottom:gl.getUniformLocation(renProg,'uBottom'),
  fish:gl.getUniformLocation(renProg,'uFish'),
  dof:gl.getUniformLocation(renProg,'uDof'),
  texel:gl.getUniformLocation(renProg,'uTexel'),
  res:gl.getUniformLocation(renProg,'uRes'),
  t:gl.getUniformLocation(renProg,'uT')};
const gu={
  scene:gl.getUniformLocation(glassProg,'uScene'),
  res:gl.getUniformLocation(glassProg,'uRes'),
  rect:gl.getUniformLocation(glassProg,'uRect[0]'),
  round:gl.getUniformLocation(glassProg,'uRound[0]'),
  t:gl.getUniformLocation(glassProg,'uT')};

const quad=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,quad);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

/* ============================== textures / targets ============================== */
let cssW=0,cssH=0,dpr=1,fishScale=1;
let simW=0,simH=0,texA=null,texB=null,fboA=null,fboB=null;
let sceneTex=null,sceneFbo=null;         // pond render target (for glass to sample)
const bCan=document.createElement('canvas'),bctx=bCan.getContext('2d');
const fCan=document.createElement('canvas'),fctx=fCan.getContext('2d');   // koi color
const dCan=document.createElement('canvas'),dctx=dCan.getContext('2d');   // focus mask
const bottomTex=gl.createTexture(),fishTex=gl.createTexture(),dofTex=gl.createTexture();
let fishTexW=0,fishTexH=0;

function texParams(){
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
}
function makeTarget(w,h,fmt,type,ifmt){
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,ifmt,w,h,0,fmt,type,null);
  texParams();
  const f=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
  return [t,f];
}
function createSim(){
  if(texA){gl.deleteTexture(texA);gl.deleteTexture(texB);gl.deleteFramebuffer(fboA);gl.deleteFramebuffer(fboB);}
  if(sceneTex){gl.deleteTexture(sceneTex);gl.deleteFramebuffer(sceneFbo);}
  const scale=Math.min(0.5,768/Math.max(cssW,cssH));
  simW=Math.max(64,Math.round(cssW*scale));
  simH=Math.max(64,Math.round(cssH*scale));
  [texA,fboA]=makeTarget(simW,simH,gl.RGBA,gl.HALF_FLOAT,gl.RGBA16F);
  [texB,fboB]=makeTarget(simW,simH,gl.RGBA,gl.HALF_FLOAT,gl.RGBA16F);
  // scene target at device resolution for the glass to refract
  [sceneTex,sceneFbo]=makeTarget(canvas.width,canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,gl.RGBA8);
}
function uploadBottom(){
  gl.bindTexture(gl.TEXTURE_2D,bottomTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,bCan);
  texParams();
}
function uploadFish(){
  gl.bindTexture(gl.TEXTURE_2D,fishTex);
  if(fishTexW!==fCan.width||fishTexH!==fCan.height){
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,fCan);
    texParams();
    fishTexW=fCan.width;fishTexH=fCan.height;
  }else{
    gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,gl.RGBA,gl.UNSIGNED_BYTE,fCan);
  }
}
function uploadDof(){
  gl.bindTexture(gl.TEXTURE_2D,dofTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,dCan);
  texParams();
}

/* ============================== pond bottom (dawn macro bed + bokeh) ============================== */
function paintBottom(){
  const c=bctx,w=cssW,h=cssH;
  c.setTransform(fishScale,0,0,fishScale,0,0);
  c.clearRect(0,0,w,h);
  // warm dawn bed: gold-pink center fading to teal-shadow rim
  const g=c.createRadialGradient(w*0.46,h*0.40,0,w*0.5,h*0.5,Math.max(w,h)*0.82);
  g.addColorStop(0,'#8a7350');
  g.addColorStop(0.40,'#6e6747');
  g.addColorStop(0.72,'#42513c');
  g.addColorStop(1,'#23362f');
  c.fillStyle=g;c.fillRect(0,0,w,h);
  // dawn pink/gold wash from upper-left (sun)
  const sun=c.createRadialGradient(w*0.22,h*0.16,0,w*0.22,h*0.16,Math.max(w,h)*0.7);
  sun.addColorStop(0,'rgba(255,196,150,0.30)');
  sun.addColorStop(0.5,'rgba(255,170,140,0.10)');
  sun.addColorStop(1,'rgba(255,170,140,0)');
  c.fillStyle=sun;c.fillRect(0,0,w,h);
  // soft mossy blooms
  for(let i=0;i<10;i++){
    const x=Math.random()*w,y=Math.random()*h,r=90+Math.random()*200;
    const ag=c.createRadialGradient(x,y,0,x,y,r);
    ag.addColorStop(0,'rgba(40,60,34,0.26)');ag.addColorStop(1,'rgba(40,60,34,0)');
    c.fillStyle=ag;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
  }
  // fine sediment specks
  for(let i=0;i<2600;i++){
    const x=Math.random()*w,y=Math.random()*h,r=Math.random()*1.6+0.4;
    c.fillStyle=Math.random()<0.55
      ?'rgba(255,228,180,'+(Math.random()*0.10).toFixed(3)+')'
      :'rgba(16,22,14,'+(Math.random()*0.13).toFixed(3)+')';
    c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
  }
  // pebbles
  const np=Math.max(12,Math.round(w*h/60000));
  for(let i=0;i<np;i++) drawPebble(c,Math.random()*w,Math.random()*h,12+Math.random()*44,Math.random()*TAU);

  // ---- bokeh discs (out-of-focus highlights, baked into the bed so DOF blur reveals them) ----
  // these read as glittering creamy circles when blurred -> "shallow DOF" macro feel
  const nb=Math.max(10,Math.round(w*h/52000));
  for(let i=0;i<nb;i++){
    const x=Math.random()*w,y=Math.random()*h;
    const r=10+Math.random()*30;
    const hue=Math.random()<0.6?[255,210,160]:[150,210,205];
    const a=0.05+Math.random()*0.10;
    const bg=c.createRadialGradient(x,y,r*0.2,x,y,r);
    bg.addColorStop(0,`rgba(${hue[0]},${hue[1]},${hue[2]},${a})`);
    bg.addColorStop(0.72,`rgba(${hue[0]},${hue[1]},${hue[2]},${a*0.5})`);
    bg.addColorStop(0.85,`rgba(${hue[0]},${hue[1]},${hue[2]},${a*0.85})`); // bright bokeh ring
    bg.addColorStop(1,`rgba(${hue[0]},${hue[1]},${hue[2]},0)`);
    c.fillStyle=bg;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
  }
}
function drawPebble(c,x,y,r,rot){
  c.save();c.translate(x,y);c.rotate(rot);
  const ry=r*(0.62+Math.random()*0.3);
  c.fillStyle='rgba(0,0,0,0.28)';
  c.beginPath();c.ellipse(r*0.13,ry*0.2,r*1.02,ry*1.02,0,0,TAU);c.fill();
  const hue=30+Math.random()*30,sat=8+Math.random()*14,li=38+Math.random()*24;
  const g=c.createRadialGradient(-r*0.35,-ry*0.4,r*0.08,0,0,r*1.15);
  g.addColorStop(0,'hsl('+hue+','+sat+'%,'+(li+18)+'%)');
  g.addColorStop(0.7,'hsl('+hue+','+sat+'%,'+li+'%)');
  g.addColorStop(1,'hsl('+hue+','+(sat+5)+'%,'+(li-15)+'%)');
  c.fillStyle=g;c.beginPath();c.ellipse(0,0,r,ry,0,0,TAU);c.fill();
  c.restore();
}

/* ============================== koi ============================== */
function palette(type){
  if(type==='orange')return{core:'#ffc170',mid:'#ff7d17',edge:'#cf4708',fin:'rgba(255,150,46,',patches:[]};
  if(type==='red')   return{core:'#ff8a55',mid:'#f04a12',edge:'#a82803',fin:'rgba(238,76,26,', patches:[]};
  if(type==='kohaku'){
    const p=[];const n=3+(Math.random()*2|0);
    for(let i=0;i<n;i++)p.push({s:0.10+Math.random()*0.62,o:(Math.random()-0.5)*1.2,r:0.13+Math.random()*0.13,col:'rgba(241,71,18,0.92)'});
    return{core:'#ffffff',mid:'#f6eede',edge:'#d2c4ac',fin:'rgba(255,238,218,',patches:p};
  }
  if(type==='calico'){
    const p=[];
    for(let i=0;i<3;i++)p.push({s:0.12+Math.random()*0.58,o:(Math.random()-0.5)*1.3,r:0.12+Math.random()*0.12,col:'rgba(249,109,30,0.9)'});
    for(let i=0;i<3;i++)p.push({s:0.10+Math.random()*0.68,o:(Math.random()-0.5)*1.4,r:0.05+Math.random()*0.07,col:'rgba(40,40,52,0.85)'});
    return{core:'#ffffff',mid:'#f2ebdc',edge:'#cabca3',fin:'rgba(255,244,228,',patches:p};
  }
  return{core:'#ffffff',mid:'#f8f1e6',edge:'#d6c8b1',fin:'rgba(255,242,226,',
    patches:[{s:0.07,o:0,r:0.12,col:'rgba(234,40,18,0.95)'}]};
}
function makeFish(type,len,focus){
  const pal=palette(type);
  return{
    x:120+Math.random()*Math.max(60,cssW-240),
    y:120+Math.random()*Math.max(60,cssH-240),
    a:Math.random()*TAU,len,
    phase:Math.random()*10,speed:28,spT:30,turn:0,
    changeT:Math.random()*3,wakeT:Math.random()*0.2,speedN:0.3,
    po:Math.random()*TAU,
    focus, // 1 = in-focus (sharp), <1 = behind focal plane -> blurred bokeh
    core:pal.core,mid:pal.mid,edge:pal.edge,fin:pal.fin,patches:pal.patches
  };
}
let fishes=[];
const foods=[];
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;};

function updateFish(f,dt){
  f.changeT-=dt;
  if(f.changeT<=0){
    f.spT=18+Math.random()*40;
    if(Math.random()<0.16)f.spT=95+Math.random()*45;
    f.changeT=2+Math.random()*4;
  }
  f.turn+=(Math.random()-0.5)*3.2*dt;
  f.turn*=Math.exp(-dt*1.4);
  let target=null,fdist=1e9;
  for(const fd of foods){
    const d=Math.hypot(fd.x-f.x,fd.y-f.y);
    if(d<fdist){fdist=d;target=fd;}
  }
  let ta;
  if(target&&fdist<600){
    ta=Math.atan2(target.y-f.y,target.x-f.x);
    f.spT=Math.max(f.spT,fdist<90?60:100);
  }else{target=null;ta=f.a+f.turn;}
  const m=85;
  if(f.x<m||f.y<m||f.x>cssW-m||f.y>cssH-m)
    ta=Math.atan2(cssH*0.5-f.y,cssW*0.5-f.x);
  for(const g of fishes){
    if(g===f)continue;
    const dx=f.x-g.x,dy=f.y-g.y;
    if(dx*dx+dy*dy<5600){ta=Math.atan2(dy,dx);break;}
  }
  const da=angDiff(ta,f.a);
  const mt=(target?2.7:1.1)*dt;
  f.a+=Math.max(-mt,Math.min(mt,da));
  f.speed+=(f.spT-f.speed)*Math.min(1,dt*1.8);
  f.x+=Math.cos(f.a)*f.speed*dt;
  f.y+=Math.sin(f.a)*f.speed*dt;
  f.x=Math.max(24,Math.min(cssW-24,f.x));
  f.y=Math.max(24,Math.min(cssH-24,f.y));
  f.speedN=Math.min(1,f.speed/120);
  f.phase+=dt*(3.5+f.speed*0.075)*2.4;
  f.wakeT-=dt;
  if(f.wakeT<=0&&f.speed>30){
    addDrop(f.x+Math.cos(f.a)*f.len*0.42,f.y+Math.sin(f.a)*f.len*0.42,
      6+f.speedN*8,0.05+0.16*f.speedN);
    f.wakeT=0.10+Math.random()*0.08;
  }
  if(target&&fdist<16){
    foods.splice(foods.indexOf(target),1);
    addDrop(f.x,f.y,10,0.55);
    f.spT=14;f.changeT=1.2;
  }
}

function bodyOutline(pts,wfun){
  const top=[],bot=[];
  for(let i=0;i<pts.length;i++){
    const p=pts[i];
    const pa=pts[Math.max(0,i-1)],pb=pts[Math.min(pts.length-1,i+1)];
    let dx=pb.x-pa.x,dy=pb.y-pa.y;
    const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
    const w=wfun(p.s);
    top.push({x:p.x-dy*w,y:p.y+dx*w});
    bot.push({x:p.x+dy*w,y:p.y-dx*w});
  }
  return{top,bot};
}
function tailLobe(c,len,spread,sw){
  const ty=spread+sw;
  c.beginPath();c.moveTo(0,0);
  c.bezierCurveTo(len*0.32,spread*0.06+sw*0.2,len*0.72,ty*0.6,len,ty);
  c.bezierCurveTo(len*0.78,ty*0.98,len*0.30,spread*0.55+sw*0.25,0,0);
  c.closePath();c.fill();
}
function finShape(c,x,y,ang,len,flip){
  c.save();c.translate(x,y);c.rotate(ang);
  if(flip)c.scale(1,-1);
  c.beginPath();c.moveTo(0,0);
  c.quadraticCurveTo(len*0.55,-len*0.10,len,len*0.22);
  c.quadraticCurveTo(len*0.45,len*0.34,0,0);
  c.closePath();c.fill();c.restore();
}
function drawFish(c,f){
  const L=f.len;
  c.save();
  c.translate(f.x,f.y);c.rotate(f.a);
  const segs=16,pts=[];
  const amp=L*(0.05+0.06*f.speedN);
  for(let i=0;i<=segs;i++){
    const s=i/segs;
    pts.push({x:L*0.48-s*L*0.96,y:Math.sin(f.phase-s*4.4)*amp*Math.pow(s,1.5),s});
  }
  const wmax=L*0.16;
  const wf=s=>wmax*Math.pow(Math.sin(Math.PI*Math.min(0.10+s*0.90,1)),0.85)*(1-0.58*s)+L*0.018;
  const tp=pts[segs],tq=pts[segs-1];
  const tang=Math.atan2(tp.y-tq.y,tp.x-tq.x);
  c.save();c.translate(tp.x,tp.y);c.rotate(tang);
  const tl=L*0.66;
  const sw=Math.sin(f.phase-5.2)*tl*0.30;
  const tg=c.createRadialGradient(0,0,tl*0.06,0,0,tl);
  tg.addColorStop(0,f.fin+'0.85)');tg.addColorStop(0.55,f.fin+'0.5)');tg.addColorStop(1,f.fin+'0)');
  c.fillStyle=tg;
  tailLobe(c,tl,tl*0.52,sw);tailLobe(c,tl,-tl*0.52,sw*0.85);
  tailLobe(c,tl*0.72,tl*0.16,sw*0.7);tailLobe(c,tl*0.72,-tl*0.16,sw*0.6);
  c.restore();
  const pp=pts[5],wp=wf(pts[5].s);
  const fl=Math.sin(f.phase*1.2+f.po)*0.22;
  c.fillStyle=f.fin+'0.55)';
  finShape(c,pp.x,pp.y+wp*0.85,2.3+fl,L*0.24,false);
  finShape(c,pp.x,pp.y-wp*0.85,-2.3-fl,L*0.24,true);
  const o=bodyOutline(pts,wf);
  const path=()=>{
    c.beginPath();
    c.moveTo(o.top[0].x,o.top[0].y);
    for(let i=1;i<o.top.length;i++)c.lineTo(o.top[i].x,o.top[i].y);
    for(let i=o.bot.length-1;i>=0;i--)c.lineTo(o.bot[i].x,o.bot[i].y);
    c.quadraticCurveTo(pts[0].x+L*0.16,pts[0].y,o.top[0].x,o.top[0].y);
    c.closePath();
  };
  const bg=c.createRadialGradient(L*0.12,0,L*0.05,L*0.05,0,L*0.62);
  bg.addColorStop(0,f.core);bg.addColorStop(0.55,f.mid);bg.addColorStop(1,f.edge);
  path();c.fillStyle=bg;c.fill();
  if(f.patches.length){
    c.save();path();c.clip();
    for(const p of f.patches){
      const i=Math.min(segs,Math.round(p.s*segs));
      const pt=pts[i],w=wf(p.s);
      c.beginPath();c.ellipse(pt.x,pt.y+p.o*w,p.r*L,p.r*L*0.75,0,0,TAU);
      c.fillStyle=p.col;c.fill();
    }
    c.restore();
  }
  c.save();path();c.clip();
  const hg=c.createRadialGradient(L*0.15,0,0,L*0.10,0,L*0.5);
  hg.addColorStop(0,'rgba(255,255,255,0.34)');hg.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=hg;c.beginPath();c.ellipse(L*0.10,0,L*0.45,wmax*0.55,0,0,TAU);c.fill();
  c.strokeStyle='rgba(60,20,0,0.18)';c.lineWidth=L*0.016;
  c.beginPath();c.moveTo(pts[3].x,pts[3].y);
  for(let i=4;i<=11;i++)c.lineTo(pts[i].x,pts[i].y);
  c.stroke();
  c.restore();
  path();c.strokeStyle='rgba(40,15,0,0.18)';c.lineWidth=1;c.stroke();
  const ep=pts[1],ew=wf(pts[1].s);
  c.fillStyle='#19120a';
  c.beginPath();c.arc(ep.x,ep.y+ew*0.72,L*0.026,0,TAU);c.fill();
  c.beginPath();c.arc(ep.x,ep.y-ew*0.72,L*0.026,0,TAU);c.fill();
  c.fillStyle='rgba(255,255,255,0.6)';
  c.beginPath();c.arc(ep.x-L*0.008,ep.y+ew*0.72-L*0.008,L*0.008,0,TAU);c.fill();
  c.beginPath();c.arc(ep.x-L*0.008,ep.y-ew*0.72-L*0.008,L*0.008,0,TAU);c.fill();
  c.restore();
}
function drawFishCanvas(t){
  fctx.setTransform(fishScale,0,0,fishScale,0,0);
  fctx.clearRect(0,0,cssW,cssH);
  // food pellets
  for(const fd of foods){
    const bob=Math.sin(t*3+fd.ph)*1.3;
    fctx.fillStyle='rgba(255,224,160,0.95)';
    fctx.beginPath();fctx.arc(fd.x+bob,fd.y+Math.cos(t*2.4+fd.ph)*1.1,2.5,0,TAU);fctx.fill();
  }
  for(const f of fishes)drawFish(fctx,f);

  // ---- focus mask: white where sharp koi are, dark elsewhere (drives DOF) ----
  dctx.setTransform(fishScale,0,0,fishScale,0,0);
  dctx.fillStyle='#000';dctx.fillRect(0,0,cssW,cssH);
  // base shallow focal band across mid screen (the focal plane)
  const band=dctx.createLinearGradient(0,cssH*0.18,0,cssH*0.86);
  band.addColorStop(0,'rgba(40,40,40,1)');
  band.addColorStop(0.42,'rgba(150,150,150,1)');
  band.addColorStop(0.55,'rgba(150,150,150,1)');
  band.addColorStop(1,'rgba(20,20,20,1)');
  dctx.fillStyle=band;dctx.fillRect(0,0,cssW,cssH);
  // each focused koi paints a bright sharp halo; blurred koi stay dark (bokeh)
  for(const f of fishes){
    const g=dctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.len*1.4);
    const v=f.focus>=1?255:Math.round(60*f.focus);
    g.addColorStop(0,`rgba(${v},${v},${v},1)`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    if(f.focus>=1){dctx.globalCompositeOperation='lighter';dctx.fillStyle=g;
      dctx.beginPath();dctx.arc(f.x,f.y,f.len*1.4,0,TAU);dctx.fill();
      dctx.globalCompositeOperation='source-over';}
  }
}

/* ============================== ripples ============================== */
const drops=[];
function addDrop(x,y,r,s){drops.push({x,y,r,s});if(drops.length>24)drops.shift();}
const dropArr=new Float32Array(32);
function simulate(){
  gl.useProgram(simProg);
  gl.viewport(0,0,simW,simH);
  gl.uniform2f(su.texel,1/simW,1/simH);
  for(let step=0;step<2;step++){
    let n=0;
    if(step===0){
      n=Math.min(drops.length,8);
      for(let j=0;j<n;j++){
        const d=drops[j];
        dropArr[j*4]=d.x/cssW*simW;
        dropArr[j*4+1]=(1-d.y/cssH)*simH;
        dropArr[j*4+2]=Math.max(2,d.r*simW/cssW);
        dropArr[j*4+3]=d.s;
      }
      drops.splice(0,n);
    }
    gl.uniform4fv(su.drops,dropArr);
    gl.uniform1i(su.count,n);
    gl.bindFramebuffer(gl.FRAMEBUFFER,fboB);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,texA);
    gl.uniform1i(su.prev,0);
    gl.drawArrays(gl.TRIANGLES,0,3);
    let tt=texA;texA=texB;texB=tt;
    tt=fboA;fboA=fboB;fboB=tt;
  }
}

/* render pond -> sceneTex */
function renderPond(t){
  gl.useProgram(renProg);
  gl.bindFramebuffer(gl.FRAMEBUFFER,sceneFbo);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texA);gl.uniform1i(ru.h,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,bottomTex);gl.uniform1i(ru.bottom,1);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,fishTex);gl.uniform1i(ru.fish,2);
  gl.activeTexture(gl.TEXTURE3);gl.bindTexture(gl.TEXTURE_2D,dofTex);gl.uniform1i(ru.dof,3);
  gl.uniform2f(ru.texel,1/simW,1/simH);
  gl.uniform2f(ru.res,canvas.width,canvas.height);
  gl.uniform1f(ru.t,t);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* refract pond through glass windows -> screen */
const rectArr=new Float32Array(8);
const roundArr=new Float32Array(8);
function glassRects(){
  // read DOM card geometry, convert CSS -> device px, y-up for shader
  function fill(el,idx,radius){
    const r=el.getBoundingClientRect();
    const cx=(r.left+r.width/2)*dpr;
    const cy=canvas.height-(r.top+r.height/2)*dpr;  // y-up
    rectArr[idx*4]=cx;
    rectArr[idx*4+1]=cy;
    rectArr[idx*4+2]=r.width/2*dpr;
    rectArr[idx*4+3]=r.height/2*dpr;
    roundArr[idx*4]=radius*dpr;
    roundArr[idx*4+1]=1.0;
  }
  fill(panel,0,32);
  fill(chip,1,22);
}
function renderGlass(t){
  glassRects();
  gl.useProgram(glassProg);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,sceneTex);gl.uniform1i(gu.scene,0);
  gl.uniform2f(gu.res,canvas.width,canvas.height);
  gl.uniform4fv(gu.rect,rectArr);
  gl.uniform4fv(gu.round,roundArr);
  gl.uniform1f(gu.t,t);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* ============================== layout / input ============================== */
function resize(){
  cssW=window.innerWidth;cssH=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(cssW*dpr);
  canvas.height=Math.round(cssH*dpr);
  fishScale=Math.min(dpr,1.5);
  fCan.width=Math.round(cssW*fishScale);fCan.height=Math.round(cssH*fishScale);
  dCan.width=fCan.width;dCan.height=fCan.height;
  fishTexW=0;
  bCan.width=fCan.width;bCan.height=fCan.height;
  paintBottom();uploadBottom();createSim();
  for(const f of fishes){
    f.x=Math.max(40,Math.min(cssW-40,f.x));
    f.y=Math.max(40,Math.min(cssH-40,f.y));
  }
}
window.addEventListener('resize',resize);

canvas.addEventListener('pointerdown',e=>{
  const x=e.clientX,y=e.clientY;
  addDrop(x,y,18,1.35);
  if(foods.length<25)
    foods.push({x:x+(Math.random()-0.5)*16,y:y+(Math.random()-0.5)*16,ph:Math.random()*TAU});
  hint.style.opacity=0;
});
let lmx=-1,lmy=-1;
canvas.addEventListener('pointermove',e=>{
  if(lmx<0){lmx=e.clientX;lmy=e.clientY;return;}
  const d=Math.hypot(e.clientX-lmx,e.clientY-lmy);
  if(d>26){addDrop(e.clientX,e.clientY,7,0.06);lmx=e.clientX;lmy=e.clientY;}
});
// gentle parallax breathing on the glass cards
let pmx=0,pmy=0;
window.addEventListener('pointermove',e=>{
  pmx=(e.clientX/window.innerWidth-0.5);
  pmy=(e.clientY/window.innerHeight-0.5);
});

/* ============================== main ============================== */
resize();
// 3 focused (sharp) koi near focal plane + 3 behind (creamy bokeh)
const big=Math.min(cssW,cssH)/900;  // scale koi up on large macro canvases
fishes=[
  makeFish('orange',168*big,1),
  makeFish('kohaku',150*big,1),
  makeFish('red',182*big,1),
  makeFish('calico',92,0.45),
  makeFish('orange',74,0.40),
  makeFish('tancho',86,0.50)
];
for(let i=0;i<3;i++) addDrop(Math.random()*cssW,Math.random()*cssH,14,0.6);
setTimeout(()=>{hint.style.opacity=0;},9000);

let ambT=3,last=0,started=false;
function frame(ts){
  requestAnimationFrame(frame);
  const t=ts/1000;
  const dt=Math.min(0.05,Math.max(0.001,t-last));last=t;
  ambT-=dt;
  if(ambT<=0){addDrop(Math.random()*cssW,Math.random()*cssH,8,0.3);ambT=3+Math.random()*5;}
  for(const f of fishes)updateFish(f,dt);
  drawFishCanvas(t);
  uploadFish();uploadDof();
  simulate();
  renderPond(t);
  renderGlass(t);

  // glass parallax breathing
  const bx=pmx*10,by=pmy*8;
  panel.style.transform=`translate(calc(-50% + ${bx}px),calc(-50% + ${by}px))`;
}
requestAnimationFrame(frame);

// signal for headless verification
window.__POND_READY__=true;
})();
</script>
</body>
