<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GHOST HARMONOGRAPH</title>
<style>
  :root{ color-scheme: dark; }
  html,body{ margin:0; height:100%; background:#03030a; overflow:hidden; }
  #stage{ display:block; width:100vw; height:100vh; touch-action:none; cursor:crosshair; }
  #hud{
    position:fixed; left:0; right:0; bottom:0; padding:14px 18px 16px;
    display:flex; gap:18px; align-items:flex-end; justify-content:space-between;
    font:500 12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:#cdd6ff; letter-spacing:.04em; pointer-events:none;
    background:linear-gradient(0deg, rgba(3,3,12,.6), rgba(3,3,12,0));
    z-index:5; user-select:none; -webkit-user-select:none;
  }
  #title b{ font-weight:700; letter-spacing:.32em; font-size:13px;
    background:linear-gradient(90deg,#7fe9ff,#b39bff 45%,#ff8fd0);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 8px rgba(150,140,255,.45)); }
  #title small{ display:block; margin-top:4px; opacity:.5; font-weight:500; letter-spacing:.12em; font-size:10px; }
  #pad{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .stat{ opacity:.62; white-space:nowrap; }
  .stat b{ color:#9fe7ff; font-weight:700; }
  #pal{ pointer-events:auto; display:flex; gap:7px; align-items:center; }
  .sw{ width:16px; height:16px; border-radius:50%; cursor:pointer; border:1px solid rgba(255,255,255,.25);
    transition:transform .15s ease, box-shadow .2s ease; }
  .sw:hover{ transform:scale(1.22); }
  .sw.on{ box-shadow:0 0 0 2px rgba(255,255,255,.85), 0 0 12px currentColor; transform:scale(1.12); }
  #hint{ position:fixed; top:16px; left:0; right:0; text-align:center; z-index:5;
    font:500 11px/1.4 ui-monospace,monospace; color:#aeb6e6; letter-spacing:.14em;
    pointer-events:none; opacity:0; transition:opacity 1.1s ease; }
  #hint.show{ opacity:.62; }
  @media (max-width:640px){
    #hud{ padding:10px 12px 12px; gap:10px; }
    #title b{ font-size:11px; letter-spacing:.22em; }
    #title small{ display:none; }
    .stat{ font-size:10px; }
    #hint{ font-size:10px; letter-spacing:.08em; padding:0 14px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hint">DRAG to bend the field · CLICK to ignite a pen · SCROLL / pinch to morph harmonics</div>
<div id="hud">
  <div id="title"><b>GHOST&nbsp;HARMONOGRAPH</b><small id="ratio">— living lissajous field —</small></div>
  <div id="pad">
    <span class="stat">pens&nbsp;<b id="sPens">0</b></span>
    <span class="stat" id="sFps">·</span>
    <div id="pal" aria-label="palette"></div>
  </div>
</div>
<script>
(()=>{
"use strict";
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { alpha:false, desynchronized:true });
const TAU = Math.PI*2;
let W=0,H=0,DPR=1, cx=0, cy=0, R=1;

// ---------- palettes ----------
const PAL = [
  { name:'aurora', cols:['#5cf0ff','#6aa8ff','#b58bff','#ff8fd6','#ffd28a'], glow:'#a9c6ff', sw:'#8fb4ff' },
  { name:'ember',  cols:['#ffd06b','#ff9a5a','#ff5e7e','#c64dff','#7affd5'], glow:'#ffb074', sw:'#ff8d5e' },
  { name:'jade',   cols:['#9affd0','#5fe0c8','#52b8ff','#7c8cff','#e0aaff'], glow:'#86ffd0', sw:'#69e7c2' },
  { name:'flux',   cols:['#ffffff','#a8e0ff','#7aa0ff','#c89bff','#ffc4f0'], glow:'#dce6ff', sw:'#cfe0ff' },
];
let palIx = 0;
function hexToRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function lerp(a,b,t){ return a+(b-a)*t; }
function palColor(t){
  const c = PAL[palIx].cols;
  t = ((t%1)+1)%1;
  const f = t*c.length;
  const i = Math.floor(f)%c.length, fr = f-Math.floor(f);
  const a = hexToRgb(c[i]), b = hexToRgb(c[(i+1)%c.length]);
  return [Math.round(lerp(a[0],b[0],fr)), Math.round(lerp(a[1],b[1],fr)), Math.round(lerp(a[2],b[2],fr))];
}

function rand(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }

// integer-ish frequency families → clean rosettes; tiny detune → slow precession (the "living" part)
const FREQS = [1,2,3,4,5,2,3];

// ---------- harmonograph pen ----------
// Lateral harmonograph: x = A1 sin(f1 t + p1) + A2 sin(f2 t + p2), similarly y.
// Instead of a one-shot decay we use a slow BREATHING envelope so the pen perpetually
// re-traces and the curve fills the canvas — a living rosette, not a dying scribble.
class Pen{
  constructor(seedHue){ this.reset(seedHue); }
  reset(seedHue){
    // Small-integer frequency ratio → a (nearly) CLOSED rosette. A tiny detune makes that
    // closed curve slowly PRECESS, laying many rotated copies that accumulate into a dense
    // spirograph web. detune kept small so each loop still closes ≈ on itself.
    const det = 0.012;
    const bx=pick(FREQS), by=pick(FREQS);
    this.fx1 = bx;
    this.fy1 = by + (Math.random()<.5?det:-det);     // the precession
    this.fx2 = bx*2 + (Math.random()<.5?det:-det);   // octave harmonic enriches the petal shape
    this.fy2 = by*2;
    this.px1=rand(0,TAU); this.py1=rand(0,TAU);
    this.px2=rand(0,TAU); this.py2=rand(0,TAU);
    this.ax1=rand(.7,1); this.ax2=rand(.2,.45);
    this.ay1=rand(.7,1); this.ay2=rand(.2,.45);
    const nx = this.ax1+this.ax2, ny = this.ay1+this.ay2;
    this.norm = 0.96/Math.max(nx,ny);
    this.breathF = rand(0.00006,0.00014);
    this.breathP = rand(0,TAU);
    this.hue0 = seedHue!==undefined?seedHue:Math.random();
    this.hueRate = rand(.00003,.00008)*(Math.random()<.5?-1:1);
    this.spin = rand(-0.00004,0.00004);
    this.rot = rand(0,TAU);
    this.t = rand(0,4000);
    this.energy = 1;
    this.width = rand(0.7,1.2);
    this.prevx=null; this.prevy=null;
    this.born = performance.now();
  }
  // warpM (≈0.4..2.6) MORPHS petal shape by re-weighting the harmonics and shifting
  // their phase — the rosette stays CLOSED (frequencies remain integer-locked) so it
  // transforms smoothly between simple ellipse and dense flower, never scrambling.
  sample(t, warpM){
    const env = (0.85 + 0.15*Math.sin(this.breathF*t + this.breathP)) * this.energy;
    const T = t*0.0024;   // base angular rate (constant)
    const w = warpM===undefined?1:warpM;
    const wAmp = this.ax2 * w;          // warp grows/shrinks the petal harmonic
    const wAmpY = this.ay2 * w;
    const wPh = (w-1)*1.4;              // warp adds a phase twist
    let x = this.ax1*Math.sin(this.fx1*T + this.px1)
          + wAmp*Math.sin(this.fx2*T + this.px2 + wPh);
    let y = this.ay1*Math.sin(this.fy1*T + this.py1)
          + wAmpY*Math.sin(this.fy2*T + this.py2 + wPh);
    const nm = this.norm / (1 + (w-1)*0.45);   // keep within radius as petals grow
    x*=nm*env; y*=nm*env;
    const ca=Math.cos(this.rot), sa=Math.sin(this.rot);
    return [x*ca - y*sa, x*sa + y*ca];
  }
}

// ---------- field ----------
const MAXPENS = 6;
let pens = [];
let pointer = { x:0, y:0, active:false, down:false, vx:0, vy:0, lastx:0, lasty:0 };
let warp=1.0, warpTarget=1.0;
let lastFrame = performance.now();
let fpsSmooth = 60;
let idleSince = performance.now();
let speed = 1.0;        // adaptive draw-rate to hold 60fps
let quality = 1.0;      // adaptive segment density to hold 60fps
let flash = 0;
let segs = 0;

function spawnPen(hue){ pens.push(new Pen(hue)); if(pens.length>MAXPENS) pens.shift(); }

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = Math.floor(innerWidth); H = Math.floor(innerHeight);
  cv.width = Math.floor(W*DPR); cv.height = Math.floor(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2; cy=H/2; R=Math.min(W,H)*0.44;
  ctx.fillStyle='#03030a'; ctx.fillRect(0,0,W,H);   // never a blank gate
}

// ---------- interaction ----------
function setPointer(x,y){
  pointer.vx=x-pointer.lastx; pointer.vy=y-pointer.lasty;
  pointer.lastx=x; pointer.lasty=y; pointer.x=x; pointer.y=y; pointer.active=true;
  idleSince=performance.now(); hintEl.classList.remove('show');
  // dragging re-pumps energy of the field → curves swell where you move
  const sp=Math.hypot(pointer.vx,pointer.vy);
  if(pointer.down || sp>2){
    for(const p of pens) p.energy=Math.min(1.5, p.energy + sp*0.0008);
  }
}
cv.addEventListener('pointermove', e=>setPointer(e.clientX,e.clientY), {passive:true});
cv.addEventListener('pointerdown', e=>{
  pointer.down=true; pointer.lastx=e.clientX; pointer.lasty=e.clientY;
  setPointer(e.clientX,e.clientY); ignite(e.clientX,e.clientY);
  cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
});
window.addEventListener('pointerup', ()=>pointer.down=false);
cv.addEventListener('pointerleave', ()=>pointer.active=false);

function ignite(x,y){
  spawnPen(x/Math.max(1,W));
  for(const p of pens) p.energy=Math.min(1.5, p.energy+rand(.3,.55));
  flash=1; warpTarget=0.6+Math.random()*1.6; updateRatioLabel();
}

function onWheel(e){
  e.preventDefault();
  warpTarget=Math.max(0.4, Math.min(2.6, warpTarget + (e.deltaY>0?-0.08:0.08)));
  for(const p of pens) p.energy=Math.min(1.4,p.energy+0.04);
  idleSince=performance.now(); hintEl.classList.remove('show'); updateRatioLabel();
}
cv.addEventListener('wheel', onWheel, {passive:false});

let pinchStart=0, pinchWarp=1;
cv.addEventListener('touchstart', e=>{
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
    pinchStart=Math.hypot(dx,dy); pinchWarp=warpTarget;
  }
},{passive:true});
cv.addEventListener('touchmove', e=>{
  if(e.touches.length===2 && pinchStart){
    e.preventDefault();
    const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
    warpTarget=Math.max(0.4,Math.min(2.6, pinchWarp*(Math.hypot(dx,dy)/pinchStart)));
    updateRatioLabel();
  }
},{passive:false});

// ---------- HUD ----------
const sPens=document.getElementById('sPens'), sFps=document.getElementById('sFps'),
      ratioEl=document.getElementById('ratio'), hintEl=document.getElementById('hint');
function updateRatioLabel(){
  const p=pens[pens.length-1];
  if(!p){ ratioEl.textContent='— living lissajous field —'; return; }
  ratioEl.textContent=`ratio ${Math.round(p.fx1)}:${Math.round(p.fy1)}  ·  warp ${warpTarget.toFixed(2)}`;
}
const palWrap=document.getElementById('pal');
PAL.forEach((p,i)=>{
  const s=document.createElement('div'); s.className='sw'+(i===0?' on':'');
  s.style.background=p.sw; s.style.color=p.sw; s.title=p.name;
  s.addEventListener('click',()=>setPalette(i)); palWrap.appendChild(s);
});
function setPalette(i){ palIx=i; [...palWrap.children].forEach((c,j)=>c.classList.toggle('on',j===i)); }

// ---------- draw one segment with two-pass glow ----------
function strokeGlow(x0,y0,x1,y1, r,g,b, w, a, near){
  near = near||0;
  // wide soft halo keeps the saturated COLOR (no white-wash)
  ctx.strokeStyle=`rgba(${r},${g},${b},${a*0.45})`;
  ctx.lineWidth=w*2.6;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  // thin core: whitened only near the pointer (a focused highlight), else stays in-hue
  const lift = 18 + near*120;
  const cr=Math.min(255,r+lift), cg=Math.min(255,g+lift), cb=Math.min(255,b+lift);
  ctx.strokeStyle=`rgba(${cr},${cg},${cb},${a*1.1})`;
  ctx.lineWidth=w*0.75;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
}

// ---------- main loop ----------
function frame(now){
  const dtRaw=now-lastFrame; lastFrame=now;
  const dt=Math.min(50,dtRaw);
  fpsSmooth=fpsSmooth*0.92 + (1000/Math.max(1,dtRaw))*0.08;
  warp += (warpTarget-warp)*0.06;

  for(const p of pens){
    p.energy += (1 - p.energy)*0.01;       // ease back to baseline (never dies)
    p.energy = Math.max(0.7, p.energy);
    p.rot += p.spin*dt;
    p.hue0 += p.hueRate*dt;
  }

  // phosphor decay — the trailing-window redraws the rosette each frame, so we use a
  // FASTER fade: just a soft afterglow, preventing additive over-exposure to white.
  const fade=0.14;
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=`rgba(3,3,10,${fade})`;
  ctx.fillRect(0,0,W,H);

  ctx.globalCompositeOperation='lighter';
  ctx.lineCap='round'; ctx.lineJoin='round';

  // Each pen advances a HEAD time, but every frame we re-draw a long TRAILING WINDOW
  // of its curve (several loops). This continuously re-weaves the full rosette so density
  // is sustained against the fade, while the newest part of the window is the bright comet.
  const budget=2000*quality;                          // total segments / frame (adaptive perf cap)
  const perPen=Math.max(110, Math.floor(budget/Math.max(1,pens.length)));
  const WINDOW=10000;                                 // trailing curve length (~11 loops)
  segs=0;

  const pux=pointer.active?(pointer.x-cx)/R:0;
  const puy=pointer.active?(pointer.y-cy)/R:0;
  const pSpeed=Math.hypot(pointer.vx,pointer.vy);

  for(let pi=0; pi<pens.length; pi++){
    const p=pens[pi];
    p.t += dt*0.95*speed;                              // advance head (constant rate)
    const head=p.t, tail=head-WINDOW;
    const N=perPen;
    let prevx=null, prevy=null;
    for(let k=0;k<=N;k++){
      const frac=k/N;                                 // 0=tail .. 1=head
      const tt=tail + WINDOW*frac;
      let [ux,uy]=p.sample(tt, warp);
      if(pointer.active){       // GENTLE field swirl toward pointer — enhances, never scrambles
        const ddx=pux-ux, ddy=puy-uy;
        const d2=ddx*ddx+ddy*ddy+0.3;
        const cl=Math.min(0.1,(pi===pens.length-1?0.045:0.022)/d2);
        ux+=ddx*cl; uy+=ddy*cl;
      }
      const x=cx+ux*R, y=cy+uy*R;
      if(prevx!==null){
        const ht=p.hue0 + tt*0.000035 + pi*0.14 + warp*0.04;
        const [r,g,b]=palColor(ht);
        const near=pointer.active?Math.max(0,1-Math.hypot(x-pointer.x,y-pointer.y)/(R*0.85)):0;
        // brightness ramps toward the head (comet); whole window stays in-hue
        const headGlow=frac*frac;                      // tail dim, head bright
        const a=Math.min(0.34, 0.16 + headGlow*0.18 + near*0.14 + flash*0.08);
        const w=p.width*(0.7 + headGlow*0.5 + near*0.6 + flash*0.35);
        strokeGlow(prevx,prevy,x,y, r,g,b, w, a, Math.max(near, headGlow*0.3));
        segs++;
      }
      prevx=x; prevy=y;
    }
  }

  // luminous cursor
  if(pointer.active){
    const gl=hexToRgb(PAL[palIx].glow);
    const rad=24+pSpeed*0.5+flash*36;
    const grd=ctx.createRadialGradient(pointer.x,pointer.y,0,pointer.x,pointer.y,rad);
    grd.addColorStop(0,`rgba(${gl[0]},${gl[1]},${gl[2]},0.55)`);
    grd.addColorStop(1,`rgba(${gl[0]},${gl[1]},${gl[2]},0)`);
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(pointer.x,pointer.y,rad,0,TAU); ctx.fill();
  }

  flash*=0.9; pointer.vx*=0.85; pointer.vy*=0.85;

  // adaptive quality: drop segment density first to hold ~60fps, recover when headroom returns
  if(fpsSmooth<50) quality=Math.max(0.55, quality-0.02);
  else if(fpsSmooth>58) quality=Math.min(1, quality+0.01);
  if(fpsSmooth<46) speed=Math.max(0.6, speed-0.01);
  else if(fpsSmooth>57) speed=Math.min(1.15, speed+0.004);

  if((now|0)%6===0){
    sPens.textContent=pens.length;
    sFps.innerHTML='fps&nbsp;<b>'+Math.round(fpsSmooth)+'</b>';
  }
  requestAnimationFrame(frame);
}

// ---------- pre-paint so FIRST FRAME is already a rich rosette ----------
function prePaint(){
  ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
  for(let pi=0;pi<pens.length;pi++){
    const p=pens[pi];
    // match the live trailing window so the FIRST frame already equals steady-state density
    const span=10000, N=2200;
    let prevx=null,prevy=null;
    for(let k=0;k<=N;k++){
      const frac=k/N;
      const tt=p.t - span + span*frac;
      let [ux,uy]=p.sample(tt, 1);
      const x=cx+ux*R, y=cy+uy*R;
      if(prevx!==null){
        const ht=p.hue0+tt*0.000035+pi*0.14;
        const [r,g,b]=palColor(ht);
        const headGlow=frac*frac;
        strokeGlow(prevx,prevy,x,y, r,g,b, p.width*(0.7+headGlow*0.5), 0.16+headGlow*0.16, headGlow*0.3);
      }
      prevx=x; prevy=y;
    }
    p.prevx=prevx; p.prevy=prevy;
  }
}

function boot(){
  resize();
  for(let i=0;i<4;i++){
    const p=new Pen(i/4 + 0.05);
    p.t=rand(1500,5000); p.energy=1;
    pens.push(p);
  }
  prePaint();
  updateRatioLabel();
  setTimeout(()=>hintEl.classList.add('show'),350);
  setTimeout(()=>hintEl.classList.remove('show'),6800);
  // breathing idle evolution so it stays alive untouched
  setInterval(()=>{
    if(performance.now()-idleSince>4500 && pens.length){
      warpTarget=1.0 + Math.sin(performance.now()*0.00012)*0.85;
      if(Math.random()<0.45){ spawnPen(Math.random()); updateRatioLabel(); }
    }
  },5200);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize, {passive:true});
window.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); ignite(cx,cy); }
  else if(e.key==='p'){ setPalette((palIx+1)%PAL.length); }
  else if('1234'.includes(e.key)){ setPalette(parseInt(e.key)-1); }
});

window.__ghost = {
  ignite, setPalette, spawnPen,
  setWarp:(w)=>{ warpTarget=w; updateRatioLabel(); },
  drag:(x,y)=>setPointer(x,y),
  state:()=>({pens:pens.length, warp:+warpTarget.toFixed(2), fps:Math.round(fpsSmooth), palette:PAL[palIx].name, segs})
};

boot();
})();
</script>
</body>
</html>
