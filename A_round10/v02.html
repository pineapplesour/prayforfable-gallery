<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EBRU — 잉크 유체 마블링</title>
<style>
  html,body{margin:0;height:100%;background:#e9e0cb;overflow:hidden;
    font-family:"Helvetica Neue",Helvetica,system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;cursor:crosshair;}
  #stage{position:fixed;inset:0;display:block;touch-action:none;}
  .hud{position:fixed;left:18px;bottom:16px;z-index:5;color:#e9e2d0;
    pointer-events:none;mix-blend-mode:difference;user-select:none;}
  .hud .t{font-size:13px;letter-spacing:.42em;font-weight:600;opacity:.92;text-transform:uppercase;}
  .hud .s{font-size:10.5px;letter-spacing:.16em;opacity:.6;margin-top:5px;line-height:1.65;max-width:74vw;}
  #pal{position:fixed;right:16px;bottom:16px;z-index:5;display:flex;gap:9px;}
  #pal button{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.32);
    cursor:pointer;padding:0;transition:transform .18s ease,box-shadow .18s ease;outline:none;}
  #pal button:hover{transform:scale(1.22);}
  #pal button[aria-pressed="true"]{transform:scale(1.32);box-shadow:0 0 0 2px rgba(255,255,255,.85);}
  #hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:6;
    color:#f4eedd;font-size:12px;letter-spacing:.34em;text-transform:uppercase;text-align:center;
    pointer-events:none;mix-blend-mode:difference;opacity:0;transition:opacity 1.1s ease;}
  @media (max-width:520px){
    .hud .t{font-size:11px;letter-spacing:.3em;} .hud .s{font-size:9.5px;}
    #pal button{width:28px;height:28px;}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hud">
  <div class="t">E&nbsp;B&nbsp;R&nbsp;U</div>
  <div class="s">드래그 — 빗질 / 클릭 — 잉크 한 방울 / 휠 — 빗 간격 / 더블클릭 — 새 물</div>
</div>
<div id="pal" aria-label="ink palette"></div>
<div id="hint">움직여 보세요</div>
<script>
(()=>{
"use strict";
const cv=document.getElementById('stage'), ctx=cv.getContext('2d',{alpha:false});

/* ---------- sizing & DPR cap (perf) ---------- */
let W=0,H=0,DPR=1,DIAG=1;
function resize(){
  // Render BELOW native resolution: ink is soft/blurry so sub-native is
  // invisible, and fill-rate (the bottleneck) scales with pixel count. The
  // canvas is upscaled by CSS. ~0.8x device px keeps it crisp enough.
  DPR=Math.min(window.devicePixelRatio||1, 1) * 0.82;
  W=Math.floor(innerWidth*DPR); H=Math.floor(innerHeight*DPR);
  cv.width=W; cv.height=H; cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  DIAG=Math.hypot(W,H);
  paperCv=null;            // paper depends on size → rebuild
  paintPaper();
}
addEventListener('resize',()=>{clearTimeout(resize._t);resize._t=setTimeout(()=>{resize();if(booted){seed();}},150);});

/* ---------- paper base: warm size-water / handmade paper (pre-rendered once) ---------- */
let paperCv=null;
function buildPaper(){
  paperCv=document.createElement('canvas'); paperCv.width=W; paperCv.height=H;
  const c=paperCv.getContext('2d');
  const g=c.createRadialGradient(W*0.40,H*0.36,0,W*0.5,H*0.5,DIAG*0.78);
  g.addColorStop(0,'#f4ecd9'); g.addColorStop(0.55,'#e9dfc7'); g.addColorStop(1,'#dccfb0');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  c.globalAlpha=0.045;
  for(let k=0;k<320;k++){
    const x=Math.random()*W, y=Math.random()*H, l=8+Math.random()*44, a=Math.random()*3.14;
    c.strokeStyle=Math.random()<0.5?'#bda87f':'#fff8e6'; c.lineWidth=1;
    c.beginPath(); c.moveTo(x,y); c.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); c.stroke();
  }
  c.globalAlpha=1;
}
function paintPaper(){ if(!paperCv||paperCv.width!==W)buildPaper(); ctx.drawImage(paperCv,0,0); }

/* ---------- flow field (curl-noise-ish, animated) ---------- */
// cheap value-noise hash → smooth pseudo-random gradient field
function hash2(x,y){ let h=x*374761393+y*668265263; h=(h^(h>>13))*1274126177; return ((h^(h>>16))>>>0)/4294967295; }
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi+1,yi+1),d=hash2(xi,yi+1);
  return a+(b-a)*u+(d-a)*v+(a-b-d+c)*u*v;
}
let flowT=0;
function flow(x,y){
  // sample noise at two offsets to approximate a divergence-free curl
  const s=0.0016, e=1.45;
  const n1=vnoise(x*s, y*s+flowT);
  const n2=vnoise(x*s+5.2, y*s-flowT+9.1);
  const a=(n1*6.2831853);            // primary swirl direction
  const b=(n2*6.2831853);
  let vx=Math.cos(a)+0.55*Math.cos(b);
  let vy=Math.sin(a)+0.55*Math.sin(b);
  // very mild large-scale rotation → coherent swirl without draining one side
  const cx=W*0.5, cy=H*0.5, dx=x-cx, dy=y-cy;
  vx+= -dy*3.5e-4; vy+= dx*3.5e-4;
  const m=Math.hypot(vx,vy)||1; return [vx/m*e, vy/m*e];
}

/* ---------- ink particles ---------- */
const PAL=[
  ['#1f6f9e','#0c3a57'], // lapis
  ['#d23b54','#7a132a'], // carmine
  ['#e7a13a','#9a5a10'], // saffron
  ['#2fae84','#0e5440'], // viridian
  ['#efe7d2','#b9ad8e'], // bone white
  ['#7b53b6','#3a1f64'], // violet
];
let inkIdx=0;
// Two-layer model: a one-time-baked rich BASIN (full coverage, free per frame)
// + a small set of LIVE particles redrawn each frame (the motion). This breaks
// the coverage-vs-fps tradeoff: coverage lives in the bitmap, motion is cheap.
const LIVECAP= (innerWidth<560)?420:640;    // live particles drawn per frame
const MAXP   = LIVECAP;                      // P holds only LIVE particles
const P = { n:0, x:new Float32Array(MAXP), y:new Float32Array(MAXP),
            vx:new Float32Array(MAXP), vy:new Float32Array(MAXP),
            r:new Float32Array(MAXP), life:new Float32Array(MAXP),
            cr:new Float32Array(MAXP), cg:new Float32Array(MAXP),
            cb:new Float32Array(MAXP), a:new Float32Array(MAXP),
            age:new Float32Array(MAXP) };
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}

/* ---------- BASIN: offscreen canvas holding the deep, fully-covered marble.
   Baked once (and slowly accreted from settling live particles). Blitted under
   the live layer every frame for ~0ms — coverage without per-frame fill cost. */
let basin=null, bctx=null;
function newBasin(){
  basin=document.createElement('canvas'); basin.width=W; basin.height=H;
  bctx=basin.getContext('2d');
}

/* ---------- pre-rendered soft sprite (white, tinted at draw via globalAlpha
   + per-color sprite cache). drawImage >> createRadialGradient per frame. */
const SPR=96;                 // sprite texel size
const spriteCache=new Map();  // key "r,g,b" -> canvas
function sprite(cr,cg,cb){
  const key=(cr<<16)|(cg<<8)|cb;
  let s=spriteCache.get(key);
  if(s)return s;
  s=document.createElement('canvas'); s.width=s.height=SPR;
  const c=s.getContext('2d');
  const g=c.createRadialGradient(SPR/2,SPR/2,0,SPR/2,SPR/2,SPR/2);
  g.addColorStop(0,`rgba(${cr},${cg},${cb},1)`);
  g.addColorStop(0.55,`rgba(${cr},${cg},${cb},0.82)`);
  g.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
  c.fillStyle=g; c.fillRect(0,0,SPR,SPR);
  if(spriteCache.size<64) spriteCache.set(key,s);  // bound cache
  return s;
}
// quantize colors so the sprite cache stays small (=> always cache hit)
function q(v){return (Math.round(v/16)*16)&255;}

/* draw one ink blob (velocity-stretched vein) onto any 2d context */
function drawBlob(c, x,y,vx,vy,r,cr,cg,cb,a){
  const spr=sprite(cr,cg,cb);
  c.globalAlpha=a;
  const sp=vx*vx+vy*vy;
  if(sp>0.25){
    const s=Math.sqrt(sp), stretch=Math.min(1+s*0.7, 2.6);
    const w=r*2*stretch, h=r*2/Math.sqrt(stretch);
    c.translate(x,y); c.rotate(Math.atan2(vy,vx));
    c.drawImage(spr,-w/2,-h/2,w,h);
    c.setTransform(1,0,0,1,0,0);
  } else {
    const d=r*2; c.drawImage(spr,x-r,y-r,d,d);
  }
  c.globalAlpha=1;
}

/* spawn a LIVE particle. When live set is full, the oldest particle is BAKED
   into the basin (so its pigment persists as coverage) then its slot reused. */
function spawn(px,py,vx,vy,rad,col,life,al){
  let i;
  if(P.n<MAXP){ i=P.n++; }
  else { i=(spawn._k=(spawn._k+1)%MAXP);
         if(bctx) drawBlob(bctx,P.x[i],P.y[i],P.vx[i],P.vy[i],P.r[i],P.cr[i],P.cg[i],P.cb[i],P.a[i]); }
  P.x[i]=px;P.y[i]=py;P.vx[i]=vx;P.vy[i]=vy;P.r[i]=rad;P.life[i]=life;
  P.cr[i]=q(col[0]);P.cg[i]=q(col[1]);P.cb[i]=q(col[2]);P.a[i]=al;P.age[i]=0;
}
spawn._k=0;

/* drop an expanding ring of ink (like a real ebru drop blooming outward) */
function inkDrop(px,py,colorPair,scale){
  scale=scale||1;
  const [c0,c1]=colorPair||PAL[inkIdx];
  const base=hex(c0), edge=hex(c1);
  const ringR=(22+Math.random()*12)*DPR*scale;
  const cnt=Math.floor(30*scale);
  for(let k=0;k<cnt;k++){
    const ang=(k/cnt)*6.2831853 + Math.random()*0.12;
    const rr=ringR*(0.55+Math.random()*0.55);
    const ox=Math.cos(ang)*rr, oy=Math.sin(ang)*rr;
    const out=2.0+Math.random()*1.6;                 // outward bloom velocity
    const t=k/cnt, col=[ base[0]+(edge[0]-base[0])*t*0.6,
                         base[1]+(edge[1]-base[1])*t*0.6,
                         base[2]+(edge[2]-base[2])*t*0.6 ];
    spawn(px+ox, py+oy, Math.cos(ang)*out, Math.sin(ang)*out,
          (16.0+Math.random()*10.0)*DPR*scale, col, 1, 0.8+Math.random()*0.14);
  }
  // a dense opaque core
  for(let k=0;k<8*scale;k++){
    const ang=Math.random()*6.283, rr=Math.random()*ringR*0.5;
    spawn(px+Math.cos(ang)*rr, py+Math.sin(ang)*rr, 0,0,
          (18+Math.random()*12)*DPR*scale, base, 1, 0.94);
  }
}

/* ---------- downsampled basin color-map (so rake can LIFT existing ink into
   moving particles → dragging smears the real marble, not just new ink).
   Refreshed lazily; cheap nearest lookups. */
let cmap=null, cmW=0, cmH=0;
function refreshColorMap(){
  if(!bctx)return;
  cmW=Math.max(8,Math.round(W/24)); cmH=Math.max(8,Math.round(H/24));
  try{ cmap=bctx.getImageData(0,0,W,H); }catch(e){ cmap=null; }
}
function basinColorAt(x,y){
  if(!cmap) return null;
  const xx=Math.min(W-1,Math.max(0,x|0)), yy=Math.min(H-1,Math.max(0,y|0));
  const i=(yy*W+xx)*4, d=cmap.data;
  // ignore bare paper (low saturation light)
  const r=d[i],g=d[i+1],b=d[i+2];
  const light=(r+g+b)/3, sat=Math.max(r,g,b)-Math.min(r,g,b);
  if(light>198 && sat<26) return null;
  return [r,g,b];
}

/* comb / rake stroke: the marbling "stylus". Pushes live particles, lays new
   ink, AND lifts existing basin ink into moving particles so the whole marble
   appears to deform under the drag. */
let combGap=34;            // wheel-controlled comb spacing
let cmapDirty=true;
function rake(px,py,dx,dy,speed){
  if(cmapDirty){ refreshColorMap(); cmapDirty=false; }
  const ang=Math.atan2(dy,dx);
  const R=(70+speed*9)*DPR, R2=R*R;
  for(let i=0;i<P.n;i++){
    const ex=P.x[i]-px, ey=P.y[i]-py, d2=ex*ex+ey*ey;
    if(d2<R2){
      const f=(1-d2/R2);
      P.vx[i]+=dx*f*1.6; P.vy[i]+=dy*f*1.6;
      const teeth=Math.sin((px*Math.cos(ang)+py)/combGap*6.283);
      P.vx[i]+= -dy*teeth*f*0.6; P.vy[i]+= dx*teeth*f*0.6;
    }
  }
  // LIFT basin ink: sample colors across the stroke width and spawn live
  // particles carrying them, moving in the drag direction → visible smear.
  const sp=Math.min(speed,40);
  const lifts=Math.min(6+(sp*0.6|0),18);
  const nx=-dy, ny=dx;
  for(let k=0;k<lifts;k++){
    const off=((k/(lifts-1))-0.5)*R*1.3;
    const sx=px+nx*off+(Math.random()-0.5)*10*DPR;
    const sy=py+ny*off+(Math.random()-0.5)*10*DPR;
    const col=basinColorAt(sx,sy);
    const teeth=Math.sin((sx*Math.cos(ang)+sy)/combGap*6.283);
    if(col){
      spawn(sx,sy, dx*0.9+(-dy)*teeth*0.4, dy*0.9+dx*teeth*0.4,
            (8+Math.random()*7)*DPR, col, 1, 0.6+Math.random()*0.2);
    }
  }
  // a little new ink from the stylus tip too
  const [c0,c1]=PAL[inkIdx]; const base=hex(c0), edge=hex(c1);
  const drips=Math.min(3+(sp*0.4|0),9);
  for(let k=0;k<drips;k++){
    spawn(px+(Math.random()-0.5)*16*DPR, py+(Math.random()-0.5)*16*DPR,
          dx*0.5,dy*0.5,(6+Math.random()*6)*DPR,(k%2?edge:base),1,0.62+Math.random()*0.18);
  }
}

/* ---------- pointer ---------- */
let px=-999,py=-999,ppx=-999,ppy=-999,down=false,moved=false,lastDrop=0;
function pos(e){const t=e.touches?e.touches[0]:e; return [t.clientX*DPR,t.clientY*DPR];}
cv.addEventListener('pointerdown',e=>{ [px,py]=pos(e); ppx=px;ppy=py; down=true; moved=false; hideHint();});
cv.addEventListener('pointerup',e=>{
  if(down && !moved){ // a tap = ink drop
    inkDrop(px,py,PAL[inkIdx],1);
  }
  down=false;
});
cv.addEventListener('pointermove',e=>{
  const [nx,ny]=pos(e);
  if(ppx<-900){ppx=nx;ppy=ny;}
  px=nx;py=ny;
  const dx=px-ppx, dy=py-ppy, sp=Math.hypot(dx,dy);
  if(down){
    if(sp>2) moved=true;
    if(sp>0.5){ rake(px,py,dx/(sp||1),dy/(sp||1),sp/DPR); }
  } else {
    // hover = gentle breeze through the field
    if(sp>1){ const R=46*DPR,R2=R*R;
      for(let i=0;i<P.n;i++){const ex=P.x[i]-px,ey=P.y[i]-py,d2=ex*ex+ey*ey;
        if(d2<R2){const f=1-d2/R2;P.vx[i]+=dx/(sp||1)*f*0.4;P.vy[i]+=dy/(sp||1)*f*0.4;}}}
  }
  ppx=px;ppy=py;
});
cv.addEventListener('pointerleave',()=>{down=false;ppx=ppy=-999;});
cv.addEventListener('wheel',e=>{e.preventDefault();
  combGap=Math.max(12,Math.min(90,combGap - Math.sign(e.deltaY)*5));
},{passive:false});
cv.addEventListener('dblclick',e=>{e.preventDefault(); freshWater();});

/* ---------- palette UI ---------- */
const palEl=document.getElementById('pal');
PAL.forEach((c,i)=>{
  const b=document.createElement('button');
  b.style.background=`radial-gradient(circle at 35% 30%, ${c[0]}, ${c[1]})`;
  b.setAttribute('aria-pressed', i===0?'true':'false');
  b.title='ink '+(i+1);
  b.addEventListener('click',()=>{ inkIdx=i;
    [...palEl.children].forEach((x,j)=>x.setAttribute('aria-pressed', j===i?'true':'false'));
  });
  palEl.appendChild(b);
});

/* ---------- fresh water: bake a brand-new composition into the basin ---------- */
function freshWater(){
  P.n=0; spawn._k=0;
  flowT=Math.random()*40;     // new flow phase => a genuinely new composition
  seed();
  cmapDirty=true;
}

/* lay a wave of drops, advect/comb it, then bake into the basin & clear live.
   Repeating waves builds a deep, fully-covered marble in the static layer
   without ever holding many live particles → coverage AND 60fps. */
function fillWave(opts){
  const {cx,cy,sc0,tall,comb}=opts;
  P.n=0; spawn._k=0;
  const cols=Math.max(5,Math.round(W/ (118*DPR)));
  const rows=Math.max(6,Math.round(H/ (118*DPR)));
  for(let r=0;r<rows && P.n<MAXP*0.9;r++){
    for(let c=0;c<cols && P.n<MAXP*0.9;c++){
      const jx=(Math.random()-0.5)*1.0, jy=(Math.random()-0.5)*1.0;
      const x=(c+0.5+jx)/cols*W, y=(r+0.5+jy)/rows*H;
      const idx=( (c*2+r)+((x<cx)?0:1)+((y<cy)?0:3)+(opts.tint|0) )%PAL.length;
      inkDrop(x,y,PAL[idx], (0.6+Math.random()*0.4)*sc0);
    }
  }
  for(let pass=0;pass<10;pass++) stepParticles(1.0);
  if(comb){
    const steps=22;
    for(let s=0;s<steps;s++){
      const x=W*0.05 + (W*0.90)*s/steps;
      const y=H*0.5 + Math.sin(s*0.5+comb)*H*(tall?0.10:0.18);
      rake(x,y, 1, Math.cos(s*0.5+comb)*(tall?0.3:0.55), 6);
    }
    if(!tall){
      for(let s=0;s<steps;s++){
        const y=H*0.05 + (H*0.90)*s/steps;
        const x=W*0.5 + Math.cos(s*0.45+comb)*W*0.16;
        rake(x,y, Math.sin(s*0.45+comb)*0.55, 1, 6);
      }
    }
    for(let pass=0;pass<5;pass++) stepParticles(1.0);
  }
  bakeAll();           // freeze this wave into the basin
}

/* ---------- seed: build the static basin, then leave one live wave on top ---------- */
function seed(){
  newBasin();
  // paper background baked into the basin once
  paintPaperTo(bctx);
  const cx=W*0.5, cy=H*0.5, tall=(H/W>1.4);
  const sc0=(W<700)?0.78:1.0;
  // three overlapping waves → deep, layered, fully-covered marble
  fillWave({cx,cy,sc0,tall,comb:0.0,  tint:0});
  fillWave({cx,cy,sc0,tall,comb:1.7,  tint:2});
  fillWave({cx,cy,sc0:sc0*1.25,tall,comb:3.1, tint:4});
  // hero blooms baked for focal contrast
  P.n=0; spawn._k=0;
  const heroes=[ [cx,cy,1,1.9],[W*0.26,H*0.30,0,1.5],[W*0.75,H*0.28,2,1.5],
                 [W*0.22,H*0.72,3,1.4],[W*0.78,H*0.70,5,1.4] ];
  heroes.forEach(([x,y,ci,s])=>inkDrop(x,y,PAL[ci],s*sc0));
  for(let pass=0;pass<6;pass++) stepParticles(1.0);
  bakeAll();
  // deterministic gap-fill straight into the basin (guaranteed coverage)
  for(let g=0;g<3;g++){ if(!gapFill()) break; }
  // finally: a fresh live wave that will animate over the static basin
  P.n=0; spawn._k=0;
  fillLive(cx,cy,sc0,tall);
}
// a moderate set of LIVE particles that keep moving over the basin (the motion)
function fillLive(cx,cy,sc0,tall){
  const cols=Math.max(4,Math.round(W/ (170*DPR)));
  const rows=Math.max(4,Math.round(H/ (170*DPR)));
  for(let r=0;r<rows && P.n<LIVECAP*0.85;r++){
    for(let c=0;c<cols && P.n<LIVECAP*0.85;c++){
      const x=(c+0.5+(Math.random()-0.5))/cols*W, y=(r+0.5+(Math.random()-0.5))/rows*H;
      const idx=((c+r*2))%PAL.length;
      inkDrop(x,y,PAL[idx],(0.55+Math.random()*0.4)*sc0);
    }
  }
  for(let pass=0;pass<8;pass++) stepParticles(1.0);
}
function paintPaperTo(c){
  if(!paperCv||paperCv.width!==W)buildPaper();
  c.drawImage(paperCv,0,0);
}
// sample the BASIN grid; drop static ink into any bare cell, baked into basin.
function gapFill(){
  const gx=11, gy=Math.max(6,Math.round(11*H/W));
  let img; try{ img=bctx.getImageData(0,0,W,H); }catch(e){ return 0; }
  const d=img.data; let filled=0;
  for(let cyi=0;cyi<gy;cyi++){
    for(let cxi=0;cxi<gx;cxi++){
      const x=Math.floor((cxi+0.5)/gx*W), y=Math.floor((cyi+0.5)/gy*H);
      // 5-point cross average: a cell is "bare" if it reads as faint paper.
      let sumL=0,sumS=0,np=0;
      for(const [ox,oy] of [[0,0],[20,0],[-20,0],[0,20],[0,-20]]){
        const xx=Math.min(W-1,Math.max(0,x+ox)), yy=Math.min(H-1,Math.max(0,y+oy));
        const i=(yy*W+xx)*4, r=d[i],g2=d[i+1],b=d[i+2];
        sumL+=(r+g2+b)/3; sumS+=Math.max(r,g2,b)-Math.min(r,g2,b); np++;
      }
      if(sumL/np>188 && sumS/np<40){
        // bake a small static cluster straight into the basin
        const base=hex(PAL[(cxi*3+cyi*2)%PAL.length][0]);
        for(let k=0;k<8;k++){
          const a=Math.random()*6.283, rr=Math.random()*30*DPR;
          drawBlob(bctx, x+Math.cos(a)*rr, y+Math.sin(a)*rr, 0,0,
                   (22+Math.random()*12)*DPR, q(base[0]),q(base[1]),q(base[2]),
                   0.88);
        }
        filled++;
      }
    }
  }
  return filled;
}

/* ---------- physics step ---------- */
function stepParticles(dtMul){
  flowT+=0.0008*dtMul;
  for(let i=0;i<P.n;i++){
    if(P.life[i]<=0) continue;
    const [fx,fy]=flow(P.x[i],P.y[i]);
    P.vx[i]=P.vx[i]*0.86 + fx*0.16*dtMul;
    P.vy[i]=P.vy[i]*0.86 + fy*0.16*dtMul;
    P.x[i]+=P.vx[i]*dtMul; P.y[i]+=P.vy[i]*dtMul;
    // ink keeps its pigment (we repaint each frame) but slowly spreads & thins
    P.r[i]+=0.016*dtMul;
    if(P.r[i]>40*DPR)P.r[i]=40*DPR;        // cap blob size (fill-rate)
    if(P.a[i]>0.62)P.a[i]*=(1-0.0010*dtMul); // only over-strong cores relax
    // soft wrap so the basin never empties
    if(P.x[i]<-40)P.x[i]=W+40; else if(P.x[i]>W+40)P.x[i]=-40;
    if(P.y[i]<-40)P.y[i]=H+40; else if(P.y[i]>H+40)P.y[i]=-40;
  }
}

/* ---------- render: blit the baked BASIN, then the small LIVE layer on top.
   Basin = full-coverage marble (1 blit, ~0ms). Live = only LIVECAP animated
   particles. This is what makes rich coverage + 60fps possible together. */
function render(){
  if(basin) ctx.drawImage(basin,0,0); else paintPaper();
  for(let i=0;i<P.n;i++){
    const a=P.a[i]; if(a<=0.004) continue;
    drawBlob(ctx,P.x[i],P.y[i],P.vx[i],P.vy[i],P.r[i],P.cr[i],P.cg[i],P.cb[i],a);
  }
}
/* bake the CURRENT live particles permanently into the basin (used to deepen
   coverage right after seeding so the static layer is already a full marble). */
function bakeAll(){
  if(!bctx) return;
  for(let i=0;i<P.n;i++){
    drawBlob(bctx,P.x[i],P.y[i],P.vx[i],P.vy[i],P.r[i],P.cr[i],P.cg[i],P.cb[i],P.a[i]);
  }
}

/* ---------- ambient: occasional self-generated drop so it stays alive ---------- */
let ambT=0;
function ambient(now){
  if(now-ambT>4200 && P.n<MAXP*0.85){
    ambT=now;
    const ang=Math.random()*6.283, rad=DIAG*0.12+Math.random()*DIAG*0.2;
    inkDrop(W*0.5+Math.cos(ang)*rad, H*0.5+Math.sin(ang)*rad,
            PAL[(Math.random()*PAL.length)|0], 0.6+Math.random()*0.5);
  }
}

/* ---------- hint ---------- */
const hintEl=document.getElementById('hint'); let hintShown=false,hintGone=false;
function maybeHint(now){ if(!hintShown && now>1400){hintShown=true;hintEl.style.opacity='0.85';} }
function hideHint(){ if(!hintGone){hintGone=true;hintEl.style.opacity='0';} }

/* ---------- loop (fixed-ish timestep, perf-capped) ---------- */
let last=performance.now();
let depositK=0, cmapT=0;
function frame(now){
  let dt=(now-last)/16.6667; last=now;
  if(dt>2.4)dt=2.4;            // clamp after tab-switch
  stepParticles(dt);
  render();
  // continuous deposition: every frame bake a slice of the live particles into
  // the basin at low alpha → moving ink leaves permanent marbled veins (the
  // soul of marbling) and the static layer keeps evolving. Cheap (few blobs).
  if(bctx && P.n>0){
    const slice=Math.max(6,(P.n*0.05)|0);
    for(let s=0;s<slice;s++){
      const i=(depositK=(depositK+1)%P.n);
      const a=P.a[i]; if(a<=0.02) continue;
      drawBlob(bctx,P.x[i],P.y[i],P.vx[i],P.vy[i],P.r[i],P.cr[i],P.cg[i],P.cb[i],a*0.10);
    }
  }
  // refresh the rake color-map at most a few times/sec (full getImageData is
  // costly; deposition changes are tiny so staleness is invisible)
  if(now-cmapT>450){ cmapT=now; cmapDirty=true; }
  ambient(now);
  maybeHint(now);
  if(now>9000 && !hintGone) hideHint();
  requestAnimationFrame(frame);
}

/* ---------- boot: build basin + seed BEFORE first frame so first paint = art ---------- */
let booted=false;
resize();
seed();
booted=true;
render();          // immediate art on first paint
requestAnimationFrame(frame);

/* expose for self-verification */
window.__ebru={
  state:()=>({n:P.n,inkIdx,combGap,W,H}),
  drop:(x,y)=>inkDrop((x??W*0.5),(y??H*0.5),PAL[inkIdx],1),
  rakeAt:(x,y,dx,dy)=>rake(x,y,dx,dy,12),
  fresh:freshWater,
  setInk:(i)=>{inkIdx=i;}
};
})();
</script>
</body>
