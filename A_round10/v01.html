<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SQUISH — soft body jelly field</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060c; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action:none; cursor:none; }
  #stage { position:fixed; inset:0; display:block; }
  /* layered canvases: glow (metaball) below, crisp jelly above */
  canvas { position:fixed; inset:0; width:100%; height:100%; }
  #glow { filter: blur(0px); }
  .ui { position:fixed; pointer-events:none; user-select:none; z-index:10; color:#cdd6ff; }
  #title {
    left:clamp(18px,3vw,46px); top:clamp(16px,3vh,40px);
    font-weight:800; letter-spacing:.34em;
    font-size:clamp(13px,1.5vw,20px);
    text-transform:uppercase;
    mix-blend-mode:screen; opacity:.92;
    text-shadow:0 0 24px rgba(120,150,255,.45);
  }
  #title small{ display:block; letter-spacing:.18em; font-weight:500; font-size:.62em; opacity:.55; margin-top:.55em; }
  #hint {
    right:clamp(18px,3vw,46px); bottom:clamp(16px,3vh,34px);
    text-align:right; font-size:clamp(10px,1.05vw,13px); line-height:1.85;
    opacity:.42; font-weight:500; letter-spacing:.06em; mix-blend-mode:screen;
  }
  #hint b{ color:#fff; font-weight:700; opacity:.9; }
  #count {
    left:clamp(18px,3vw,46px); bottom:clamp(16px,3vh,34px);
    font-variant-numeric:tabular-nums; font-size:clamp(10px,1vw,12px);
    opacity:.30; letter-spacing:.12em; font-weight:600;
  }
  @media (max-width:560px){
    #hint{ display:none; }
    #count{ font-size:10px; }
  }
</style>
</head>
<body>
  <canvas id="glow"></canvas>
  <canvas id="stage"></canvas>
  <div class="ui" id="title">SQUISH<small>drag · fling · poke · double-tap to pop</small></div>
  <div class="ui" id="hint">
    <div><b>move</b> — repel the jelly</div>
    <div><b>drag</b> — grab &amp; sling a blob</div>
    <div><b>click / tap</b> — spawn a balloon</div>
    <div><b>double-click</b> — pop it</div>
  </div>
  <div class="ui" id="count"></div>

<script>
(() => {
"use strict";

/* ============================================================
   SQUISH — pressure-based soft-body jelly / balloon field
   Pure verlet + ideal-gas internal pressure. No libraries.
   Two-pass render: blurred metaball glow + crisp jelly skin.
   ============================================================ */

const glow   = document.getElementById('glow');
const stage  = document.getElementById('stage');
const gctx   = glow.getContext('2d');
const ctx    = stage.getContext('2d');
const countEl= document.getElementById('count');

let W=0, H=0, DPR=1, GS=0.42; // glow canvas runs at lower res for cheap blur
let glowW=0, glowH=0;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  stage.width  = Math.floor(W*DPR);  stage.height = Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  glowW = Math.max(2, Math.floor(W*GS)); glowH = Math.max(2, Math.floor(H*GS));
  glow.width = glowW; glow.height = glowH;
  // CSS blur on the glow canvas (cheap, GPU) — scaled by element size
  glow.style.filter = 'blur(' + (10*GS).toFixed(1) + 'px) saturate(1.35) brightness(1.18)';
}
window.addEventListener('resize', resize);

/* ---------- palette: jelly hues, soft neon candy ---------- */
const PALETTES = [
  { h: 330, name:'rose'   },
  { h: 280, name:'violet' },
  { h: 200, name:'cyan'   },
  { h: 158, name:'mint'   },
  { h:  42, name:'amber'  },
  { h:  16, name:'coral'  },
  { h: 250, name:'indigo' },
];
function hsl(h,s,l,a){ return `hsla(${h},${s}%,${l}%,${a})`; }

/* ---------- pointer ---------- */
const pointer = { x:-9999, y:-9999, px:-9999, py:-9999, vx:0, vy:0, down:false, active:false };
let grabbed = null;        // {body, idx, ox, oy}
let lastTap = 0, lastTapX=0, lastTapY=0;

function setPointer(x,y){
  pointer.px = pointer.x; pointer.py = pointer.y;
  pointer.x = x; pointer.y = y;
  pointer.vx = pointer.x - pointer.px;
  pointer.vy = pointer.y - pointer.py;
  pointer.active = true;
}

stage.addEventListener('pointermove', e => setPointer(e.clientX, e.clientY));
stage.addEventListener('pointerdown', e => {
  setPointer(e.clientX, e.clientY);
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.px = e.clientX; pointer.py = e.clientY;
  pointer.down = true; pointer.active = true;
  stage.setPointerCapture(e.pointerId);

  const now = performance.now();
  const isDbl = (now - lastTap < 320) && Math.hypot(e.clientX-lastTapX, e.clientY-lastTapY) < 36;
  lastTap = now; lastTapX = e.clientX; lastTapY = e.clientY;

  // try to grab a body near the pointer
  const hit = bodyAt(e.clientX, e.clientY);
  if (isDbl && hit) { popBody(hit.body); grabbed=null; return; }
  if (hit){
    grabbed = { body:hit.body, idx:hit.idx };
    hit.body.grab = true;
  } else {
    // empty space → schedule a spawn on release-as-click handled in up via timing
    grabbed = null;
  }
});
function endPointer(e){
  pointer.down = false;
  if (grabbed){
    // fling: transfer pointer velocity to grabbed point
    const p = grabbed.body.pts[grabbed.idx];
    p.px = p.x - pointer.vx*1.4; p.py = p.y - pointer.vy*1.4;
    grabbed.body.grab = false;
  } else {
    // treat as a click → spawn a balloon if it was a quick tap on empty space
    if (!bodyAt(pointer.x, pointer.y)) spawnBody(pointer.x, pointer.y);
  }
  grabbed = null;
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', () => { if(grabbed){grabbed.body.grab=false;} grabbed=null; pointer.down=false; });
stage.addEventListener('pointerleave', () => { if(!pointer.down){ pointer.active=false; pointer.x=-9999; pointer.y=-9999; }});
window.addEventListener('blur', () => { pointer.down=false; if(grabbed){grabbed.body.grab=false;} grabbed=null; });
// prevent context menu / scroll
window.addEventListener('contextmenu', e=>e.preventDefault());
window.addEventListener('dblclick', e=>e.preventDefault());

/* ============================================================
   SOFT BODY (pressure model)
   A closed loop of N point masses. Edge springs hold the skin;
   an ideal-gas pressure term pushes every edge outward by the
   normal, proportional to (targetArea / currentArea). This gives
   genuine "squish then bounce back" behavior.
   ============================================================ */

let BODIES = [];
const GRAV = 0.16;
const DAMP = 0.985;
let bodyId = 0;

function makeBody(cx, cy, r, n, pal, mass){
  const pts = [];
  for (let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2;
    const x = cx + Math.cos(a)*r;
    const y = cy + Math.sin(a)*r;
    pts.push({ x, y, px:x - (Math.random()-0.5)*1.2, py:y - (Math.random()-0.5)*1.2, nx:0, ny:0 });
  }
  const edges = [];
  let perim = 0;
  for (let i=0;i<n;i++){
    const j=(i+1)%n;
    const L = Math.hypot(pts[j].x-pts[i].x, pts[j].y-pts[i].y);
    perim += L;
    edges.push({ a:i, b:j, len:L });
  }
  const targetArea = Math.PI*r*r;
  return {
    id: bodyId++, pts, edges, n, r0:r,
    targetArea, area:targetArea,
    pressure: 1.0,
    pal, hue: pal.h + (Math.random()-0.5)*14,
    mass: mass||1,
    grab:false, born: performance.now(),
    spawnT: 0,           // 0→1 grow-in
    popT: -1,            // >=0 → popping
    wobble: Math.random()*6.283,
    seed: Math.random()*1000,
  };
}

function spawnBody(x,y){
  if (BODIES.length >= MAX_BODIES) {
    // pop the oldest non-popping body to make room
    const old = BODIES.find(b=>b.popT<0);
    if (old) popBody(old);
  }
  const pal = PALETTES[(Math.random()*PALETTES.length)|0];
  const r = 30 + Math.random()*42;
  const n = Math.max(14, Math.min(22, Math.round(r*0.42)));
  const b = makeBody(x, y, r*0.25, n, pal, r/46);
  b.r0 = r;
  b.targetArea = Math.PI*r*r;
  b.spawnRadius = r;
  // give it a little upward birth pop
  for (const p of b.pts){ p.py += 2.4; }
  BODIES.push(b);
}

function popBody(b){
  if (b.popT>=0) return;
  b.popT = 0;
  b.pressure = 0; // deflate
  // burst impulse outward
  const c = centroid(b);
  for (const p of b.pts){
    const dx=p.x-c.x, dy=p.y-c.y; const d=Math.hypot(dx,dy)||1;
    p.px = p.x - (dx/d)*(5+Math.random()*4);
    p.py = p.y - (dy/d)*(5+Math.random()*4);
  }
  spawnSparkles(c.x, c.y, b.hue, b.spawnRadius||b.r0);
}

function centroid(b){
  let x=0,y=0; for(const p of b.pts){ x+=p.x; y+=p.y; } return {x:x/b.n, y:y/b.n};
}
function polyArea(pts){
  let a=0; const n=pts.length;
  for(let i=0;i<n;i++){ const j=(i+1)%n; a += pts[i].x*pts[j].y - pts[j].x*pts[i].y; }
  return a*0.5;
}

function bodyAt(x,y){
  // returns nearest point of a body whose centroid-ish region contains (x,y)
  let best=null, bestD=1e9;
  for (const b of BODIES){
    if (b.popT>=0) continue;
    const c = centroid(b);
    const dc = Math.hypot(x-c.x, y-c.y);
    if (dc < (b.spawnRadius||b.r0)*1.15){
      // find closest control point to attach grab
      let bi=0, bd=1e9;
      for (let i=0;i<b.n;i++){ const d=Math.hypot(x-b.pts[i].x, y-b.pts[i].y); if(d<bd){bd=d;bi=i;} }
      if (dc < bestD){ bestD=dc; best={ body:b, idx:bi }; }
    }
  }
  return best;
}

/* ---------- sparkles for pops ---------- */
const SPARKS = [];
function spawnSparkles(x,y,hue,r){
  const n = 16 + (r*0.5|0);
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 2 + Math.random()*7;
    SPARKS.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 1.5,
      life:1, hue:hue+(Math.random()-0.5)*30, size:1.5+Math.random()*3 });
  }
}

/* ---------- spawn count config ---------- */
let MAX_BODIES = 16;
function tuneForScreen(){
  const area = W*H;
  MAX_BODIES = Math.max(8, Math.min(20, Math.round(area/72000)));
}

/* ============================================================
   PHYSICS STEP
   ============================================================ */
const SUBSTEPS = 2;

function simulate(dt){
  for (let s=0;s<SUBSTEPS;s++){
    for (const b of BODIES) verlet(b);
    for (let it=0; it<3; it++){
      for (const b of BODIES) constrainEdges(b);
      for (const b of BODIES) applyPressure(b);
    }
    for (const b of BODIES) collideWalls(b);
    bodyBodyCollisions();
    if (grabbed) applyGrab();
  }
  postStep(dt);
}

function verlet(b){
  const grav = b.popT>=0 ? GRAV*1.7 : GRAV;
  for (const p of b.pts){
    let vx = (p.x - p.px)*DAMP;
    let vy = (p.y - p.py)*DAMP;
    p.px = p.x; p.py = p.y;
    p.x += vx; p.y += vy + grav;
  }
}

function constrainEdges(b){
  const stiff = b.popT>=0 ? 0.18 : 0.34; // skin softens when popping
  for (const e of b.edges){
    const A=b.pts[e.a], Bp=b.pts[e.b];
    let dx=Bp.x-A.x, dy=Bp.y-A.y;
    let d=Math.hypot(dx,dy)||1e-4;
    const diff=(d-e.len)/d * stiff;
    const ox=dx*diff*0.5, oy=dy*diff*0.5;
    A.x+=ox; A.y+=oy; Bp.x-=ox; Bp.y-=oy;
  }
}

function applyPressure(b){
  // compute area + edge normals, push outward by pressure*(target/area)
  const pts=b.pts, n=b.n;
  let area = Math.abs(polyArea(pts));
  b.area = area;
  if (b.popT>=0) return;       // popped bodies have no internal gas
  if (area < 1) area = 1;
  // breathing wobble so idle blobs gently pulse
  const breath = 1 + Math.sin(performance.now()*0.0016 + b.wobble)*0.014;
  const want = b.targetArea*breath*b.spawnT*b.spawnT; // grow-in via spawnT
  const force = (want/area - 1);                       // >0 inflate, <0 deflate
  const pf = force * 0.9;
  for (let i=0;i<n;i++){
    const prev = pts[(i-1+n)%n], cur=pts[i], next=pts[(i+1)%n];
    // outward normal ~ rotate (next-prev) by -90
    let dx = next.x - prev.x, dy = next.y - prev.y;
    let nx = dy, ny = -dx;
    const L = Math.hypot(nx,ny)||1; nx/=L; ny/=L;
    cur.x += nx * pf * (L*0.0); // (L unused; keep normal unit)
    cur.x += nx * pf;
    cur.y += ny * pf;
  }
}

function collideWalls(b){
  const e=0.55;            // restitution
  const fr=0.86;           // floor friction
  for (const p of b.pts){
    if (p.x<0){ p.x=0; p.px=p.x + (p.x-p.px)*e; }
    else if (p.x>W){ p.x=W; p.px=p.x + (p.x-p.px)*e; }
    if (p.y<0){ p.y=0; p.py=p.y + (p.y-p.py)*e; }
    else if (p.y>H){
      p.y=H;
      const vy=p.y-p.py; p.py=p.y + vy*e;
      const vx=p.x-p.px; p.px=p.x - vx*(1-fr); // floor friction
    }
  }
}

/* body-body soft collision via centroid push + point separation */
function bodyBodyCollisions(){
  const N=BODIES.length;
  for (let i=0;i<N;i++){
    const A=BODIES[i]; if(A.popT>=0) continue;
    const ca=centroid(A); const ra=Math.sqrt(Math.abs(A.area)/Math.PI);
    for (let j=i+1;j<N;j++){
      const B=BODIES[j]; if(B.popT>=0) continue;
      const cb=centroid(B); const rb=Math.sqrt(Math.abs(B.area)/Math.PI);
      let dx=cb.x-ca.x, dy=cb.y-ca.y; let d=Math.hypot(dx,dy)||1e-4;
      const min=(ra+rb)*0.92;
      if (d<min){
        const push=(min-d)/d*0.5;
        const ox=dx*push, oy=dy*push;
        const wa=B.mass/(A.mass+B.mass), wb=A.mass/(A.mass+B.mass);
        for(const p of A.pts){ p.x-=ox*wa*0.12; p.y-=oy*wa*0.12; }
        for(const p of B.pts){ p.x+=ox*wb*0.12; p.y+=oy*wb*0.12; }
      }
    }
  }
}

/* pointer repulsion + grab */
function postStep(dt){
  // pointer field repulsion (when not grabbing)
  if (pointer.active && !grabbed){
    const R = pointer.down ? 150 : 118;
    const R2 = R*R;
    const strength = pointer.down ? 3.4 : 2.2;
    for (const b of BODIES){
      for (const p of b.pts){
        const dx=p.x-pointer.x, dy=p.y-pointer.y;
        const d2=dx*dx+dy*dy;
        if (d2<R2 && d2>0.01){
          const d=Math.sqrt(d2);
          const f=(1 - d/R);
          const ff = f*f*strength;
          p.x += (dx/d)*ff;
          p.y += (dy/d)*ff;
          // swirl from pointer motion
          p.x += pointer.vx*f*0.10;
          p.y += pointer.vy*f*0.10;
        }
      }
    }
  }

  // spawn-in / pop lifecycle + culling
  for (let i=BODIES.length-1;i>=0;i--){
    const b=BODIES[i];
    if (b.spawnT<1){ b.spawnT=Math.min(1, b.spawnT + dt*3.2); }
    if (b.popT>=0){
      b.popT += dt*2.4;
      if (b.popT>=1){ BODIES.splice(i,1); }
    }
  }

  // sparkles
  for (let i=SPARKS.length-1;i>=0;i--){
    const s=SPARKS[i];
    s.vy += 0.18; s.vx*=0.97; s.vy*=0.985;
    s.x+=s.vx; s.y+=s.vy; s.life -= dt*1.5;
    if (s.life<=0) SPARKS.splice(i,1);
  }
}

function applyGrab(){
  const p = grabbed.body.pts[grabbed.idx];
  // pull grabbed point toward pointer (soft) so the body stretches
  p.x += (pointer.x - p.x)*0.5;
  p.y += (pointer.y - p.y)*0.5;
  p.px = p.x - pointer.vx*0.5;
  p.py = p.y - pointer.vy*0.5;
}

/* ============================================================
   RENDER
   ============================================================ */

// Catmull-Rom → smooth closed loop path
function blobPath(c, pts, scaleX, scaleY, cx, cy){
  const n=pts.length;
  c.beginPath();
  // helper to transform a point (for pop squash / spawn scale)
  const TX = (p)=> ({ x: cx + (p.x-cx)*scaleX, y: cy + (p.y-cy)*scaleY });
  const P = pts.map(TX);
  c.moveTo((P[0].x+P[n-1].x)/2, (P[0].y+P[n-1].y)/2);
  for (let i=0;i<n;i++){
    const cur=P[i], next=P[(i+1)%n];
    const mx=(cur.x+next.x)/2, my=(cur.y+next.y)/2;
    c.quadraticCurveTo(cur.x, cur.y, mx, my);
  }
  c.closePath();
}

let bgGrad=null, bgKey='';
function bgGradient(){
  const key=W+'x'+H;
  if(key!==bgKey){
    bgKey=key;
    bgGrad=ctx.createRadialGradient(W*0.5,H*0.42,0, W*0.5,H*0.5, Math.hypot(W,H)*0.62);
    bgGrad.addColorStop(0,'#0c1024');
    bgGrad.addColorStop(0.55,'#070912');
    bgGrad.addColorStop(1,'#030309');
  }
  return bgGrad;
}

function render(){
  // ---- glow pass (low res, additive) ----
  gctx.setTransform(1,0,0,1,0,0);
  gctx.clearRect(0,0,glowW,glowH);
  gctx.save();
  gctx.scale(GS,GS);
  gctx.globalCompositeOperation='lighter';
  for (const b of BODIES){
    const c=centroid(b);
    const sc = b.popT>=0 ? (1 - b.popT*0.4) : 1;
    const r = (b.spawnRadius||b.r0)*sc*1.25;
    if (r<=1) continue;
    const a = b.popT>=0 ? (1-b.popT)*0.5 : 0.42*b.spawnT;
    const g=gctx.createRadialGradient(c.x,c.y,0,c.x,c.y,r);
    g.addColorStop(0, hsl(b.hue,95,62, a));
    g.addColorStop(1, hsl(b.hue,95,55, 0));
    gctx.fillStyle=g;
    gctx.beginPath(); gctx.arc(c.x,c.y,r,0,6.283); gctx.fill();
  }
  gctx.restore();

  // ---- main pass ----
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=bgGradient();
  ctx.fillRect(0,0,W,H);

  // subtle vignette grain via faint radial already in bg; draw blobs
  for (const b of BODIES){
    drawBody(b);
  }

  // sparkles
  ctx.globalCompositeOperation='lighter';
  for (const s of SPARKS){
    ctx.beginPath();
    ctx.fillStyle=hsl(s.hue,95,68, Math.max(0,s.life));
    ctx.arc(s.x,s.y, s.size*(0.4+s.life*0.8), 0, 6.283);
    ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';

  // cursor
  drawCursor();
}

function drawBody(b){
  const c=centroid(b);
  // pop squash: flatten & fade
  let sx=1, sy=1, alpha=1;
  if (b.popT>=0){
    sx = 1 + b.popT*0.5;
    sy = 1 - b.popT*0.6;
    alpha = 1 - b.popT;
  }
  const spawnScale = 0.6 + 0.4*b.spawnT;
  sx*=spawnScale; sy*=spawnScale;

  // hue + light dir
  const hue=b.hue;

  ctx.save();
  ctx.globalAlpha = alpha;

  // ---- body fill: glossy candy gradient offset toward top-left light ----
  blobPath(ctx, b.pts, sx, sy, c.x, c.y);
  const rr = (b.spawnRadius||b.r0);
  const g = ctx.createLinearGradient(c.x - rr*0.6, c.y - rr*0.9, c.x + rr*0.5, c.y + rr*0.95);
  g.addColorStop(0,   hsl(hue, 92, 74, 0.96));
  g.addColorStop(0.45,hsl(hue, 88, 58, 0.95));
  g.addColorStop(1,   hsl(hue+10, 80, 40, 0.96));
  ctx.fillStyle=g;
  ctx.shadowColor = hsl(hue,90,55,0.55);
  ctx.shadowBlur = 26;
  ctx.shadowOffsetY = 10;
  ctx.fill();
  ctx.shadowBlur=0; ctx.shadowOffsetY=0;

  // ---- inner depth shading (darker rim, bottom) ----
  blobPath(ctx, b.pts, sx, sy, c.x, c.y);
  const ig = ctx.createRadialGradient(c.x - rr*0.3, c.y - rr*0.35, rr*0.1, c.x, c.y, rr*1.15);
  ig.addColorStop(0, hsl(hue, 90, 80, 0.0));
  ig.addColorStop(0.7, hsl(hue, 85, 45, 0.0));
  ig.addColorStop(1, hsl(hue+8, 70, 22, 0.55));
  ctx.fillStyle=ig;
  ctx.fill();

  // ---- rim light (screen) ----
  ctx.save();
  blobPath(ctx, b.pts, sx, sy, c.x, c.y);
  ctx.clip();
  ctx.globalCompositeOperation='screen';
  const rim=ctx.createLinearGradient(c.x, c.y - rr, c.x, c.y + rr*0.2);
  rim.addColorStop(0, hsl(hue, 100, 88, 0.5));
  rim.addColorStop(0.3, hsl(hue, 100, 80, 0.0));
  ctx.fillStyle=rim;
  ctx.fillRect(c.x-rr*1.4, c.y-rr*1.4, rr*2.8, rr*2.8);
  ctx.restore();

  // ---- specular highlight (the squishy gloss) ----
  ctx.globalCompositeOperation='screen';
  const hx = c.x - rr*0.34*sx, hy = c.y - rr*0.42*sy;
  const hr = rr*0.42;
  const hgrad=ctx.createRadialGradient(hx,hy,0,hx,hy,hr);
  hgrad.addColorStop(0,'rgba(255,255,255,0.92)');
  hgrad.addColorStop(0.5,'rgba(255,255,255,0.20)');
  hgrad.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hgrad;
  ctx.beginPath();
  ctx.ellipse(hx,hy,hr*0.85,hr*1.1, -0.5, 0, 6.283);
  ctx.fill();

  // tiny secondary glint
  const gx=c.x + rr*0.28*sx, gy=c.y - rr*0.05*sy;
  const gg=ctx.createRadialGradient(gx,gy,0,gx,gy,rr*0.16);
  gg.addColorStop(0,'rgba(255,255,255,0.7)');
  gg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gg;
  ctx.beginPath(); ctx.arc(gx,gy,rr*0.16,0,6.283); ctx.fill();

  ctx.globalCompositeOperation='source-over';
  ctx.restore();
}

function drawCursor(){
  if (!pointer.active || pointer.x<-1000) return;
  const t=performance.now()*0.004;
  const baseR = pointer.down ? 13 : 10;
  ctx.save();
  ctx.translate(pointer.x, pointer.y);
  // outer ring (squishes when pressed)
  ctx.globalCompositeOperation='lighter';
  for (let i=0;i<2;i++){
    ctx.beginPath();
    const r = baseR + i*7 + Math.sin(t+i)*1.5;
    ctx.strokeStyle = `rgba(180,200,255,${0.5 - i*0.22})`;
    ctx.lineWidth = 1.6;
    ctx.arc(0,0, r, 0, 6.283);
    ctx.stroke();
  }
  ctx.beginPath();
  const dot=ctx.createRadialGradient(0,0,0,0,0,6);
  dot.addColorStop(0,'rgba(220,230,255,0.95)');
  dot.addColorStop(1,'rgba(220,230,255,0)');
  ctx.fillStyle=dot;
  ctx.arc(0,0,6,0,6.283); ctx.fill();
  ctx.restore();
}

/* ============================================================
   LOOP
   ============================================================ */
let last=performance.now();
let fpsAcc=0, fpsN=0, fpsShown=60;

function frame(now){
  let dt=(now-last)/1000; last=now;
  if (dt>0.05) dt=0.05;        // clamp big gaps
  simulate(dt);
  render();

  // pointer velocity decays so swirl fades when still
  if (!pointer.down){ pointer.vx*=0.5; pointer.vy*=0.5; }

  fpsAcc += 1/Math.max(dt,1e-3); fpsN++;
  if (fpsN>=20){ fpsShown=Math.round(fpsAcc/fpsN); fpsAcc=0; fpsN=0; }
  countEl.textContent = `${BODIES.length} blobs · ${fpsShown} fps`;

  requestAnimationFrame(frame);
}

/* ============================================================
   INIT — seed a pleasing arrangement so first paint = artwork
   ============================================================ */
function seed(){
  BODIES.length=0;
  tuneForScreen();
  const small = W<620;
  const n = small ? 6 : 10;
  for (let i=0;i<n;i++){
    const x = W*(0.12 + 0.76*Math.random());
    const y = H*(0.18 + 0.5*Math.random());
    spawnBody(x,y);
    const b=BODIES[BODIES.length-1];
    b.spawnT = 1;                       // already grown for instant first paint
    b.area = b.targetArea;
    // expand control loop to full radius immediately
    const c=centroid(b); const rr=b.spawnRadius;
    for (let k=0;k<b.n;k++){
      const a=(k/b.n)*Math.PI*2;
      b.pts[k].x = c.x + Math.cos(a)*rr;
      b.pts[k].y = c.y + Math.sin(a)*rr;
      b.pts[k].px = b.pts[k].x; b.pts[k].py = b.pts[k].y;
    }
  }
}

resize();
seed();
// settle a few physics steps so the first painted frame already looks relaxed
for (let i=0;i<24;i++) simulate(1/60);
render();
requestAnimationFrame(frame);

window.addEventListener('resize', ()=>{ /* keep bodies; just clamp into view next steps */ });

// expose for self-test
window.__SQUISH__ = { get bodies(){return BODIES;}, spawnBody, popBody, get pointer(){return pointer;} };
})();
</script>
</body>
