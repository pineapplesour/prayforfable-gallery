<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>liquid glass · photo gallery</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0b0d;cursor:none}
  #gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
  #hint{position:fixed;left:50%;bottom:env(safe-area-inset-bottom,18px);transform:translate(-50%,-6px);
    font:11px/1.4 "SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.18em;color:rgba(255,255,255,.55);
    text-shadow:0 1px 6px rgba(0,0,0,.85);pointer-events:none;transition:opacity 1.4s;text-transform:uppercase;white-space:nowrap}
  #fallback{position:fixed;inset:0;display:none;place-items:center;color:#aeb4bd;font:14px/1.6 ui-sans-serif,system-ui,sans-serif;padding:2em;text-align:center}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hint">move to glide the lens · hold to press · drag to tilt · scroll the gallery</div>
<div id="fallback">WebGL을 사용할 수 없는 환경입니다.</div>
<script>
'use strict';
/* ============================================================
   LIQUID GLASS LENS over a PHOTO GALLERY
   - content layer: canvas2d photo-gallery UI (procedural photos)
   - optics: webgl shader (refraction + magnify + chromatic
     aberration + rim rings + speculars + caustics + DOF + post)
   ============================================================ */

const glCanvas = document.getElementById('gl');
const gl = glCanvas.getContext('webgl', { antialias:false, preserveDrawingBuffer:false, alpha:false });
if (!gl) { document.getElementById('fallback').style.display = 'grid'; document.getElementById('hint').style.display='none'; }

const DPR = Math.min(window.devicePixelRatio || 1, gl ? 2 : 1);
let W = 0, H = 0;

/* ------------------------------------------------------------
   SCENE — a photo-gallery app: top chrome (title, search, tabs)
   then a masonry-ish grid of procedurally rendered photographs.
   Logical content is drawn directly in device px, scroll = scrollY.
   ------------------------------------------------------------ */
const scene = document.createElement('canvas');
const sx = scene.getContext('2d');
let scrollY = 0;
let SCROLL_MAX = 1400;

function tw(c, text, x, y, size, color, weight, align, font){
  c.fillStyle = color;
  c.font = (weight||400) + ' ' + size + 'px ' + (font||'-apple-system,"Helvetica Neue","Segoe UI",sans-serif');
  c.textAlign = align || 'left';
  c.fillText(text, x, y);
  c.textAlign = 'left';
}
function rr(c, x, y, w, h, r){
  r = Math.min(r, w*0.5, h*0.5);
  c.beginPath();
  c.moveTo(x+r, y); c.arcTo(x+w, y, x+w, y+h, r); c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r); c.arcTo(x, y, x+w, y, r); c.closePath();
}

/* deterministic rng for stable procedural photos */
function mkRand(seed){ let s = seed>>>0 || 1; return () => (s = (s*1664525 + 1013904223)>>>0) / 4294967296; }

/* a palette set: each photo gets a mood */
const MOODS = [
  { name:'dune dawn',     sky:['#f7c98b','#e88a5a','#b14e6b'], land:['#7a3b52','#3a2030'], sun:'#ffe6b8', kind:'land' },
  { name:'pine fog',      sky:['#cfe0e6','#8fa9b3','#4d6b73'], land:['#33474a','#16242a'], sun:'#eef6f5', kind:'land' },
  { name:'neon city',     sky:['#1a1140','#3a1d6e','#7a2f8f'], land:['#120a26','#05030d'], sun:'#ff6ad5', kind:'city' },
  { name:'still life',    sky:['#efe6d8','#d8c4a8','#b89a76'], land:['#7c5a3a','#4a3320'], sun:'#fff4e0', kind:'flat' },
  { name:'coastline',     sky:['#bfe3f2','#7fc0e0','#3e84b5'], land:['#2f6f86','#16384a'], sun:'#fbffff', kind:'sea' },
  { name:'lavender hill', sky:['#e9d6f2','#b99adb','#7a5aa8'], land:['#5b487e','#2e2348'], sun:'#fff0ff', kind:'land' },
  { name:'amber desert',  sky:['#ffe3a3','#f0a85a','#c66a3a'], land:['#9a5a32','#5a3018'], sun:'#fff2cc', kind:'land' },
  { name:'midnight sea',  sky:['#0f2236','#13314f','#1d4e72'], land:['#0a1826','#03080f'], sun:'#a9d4ff', kind:'sea' },
  { name:'sakura',        sky:['#ffe6ee','#ffc2d6','#f08cb0'], land:['#c95f86','#7a3550'], sun:'#fff6fa', kind:'land' },
  { name:'forest light',  sky:['#dff0c8','#a9cf7e','#5f8f3f'], land:['#3c5a26','#1c3012'], sun:'#f4ffe0', kind:'land' },
  { name:'cobalt fields', sky:['#cfe8ff','#8fb8f0','#4f6fd0'], land:['#3a52b0','#1c2a66'], sun:'#ffffff', kind:'land' },
  { name:'ember dusk',    sky:['#3a1820','#6e2a2a','#b3552e'], land:['#2a1212','#0d0606'], sun:'#ffb86b', kind:'land' },
];

/* draw one procedural photograph inside (x,y,w,h) */
function drawPhoto(c, x, y, w, h, mood, seed){
  const rand = mkRand(seed);
  c.save();
  rr(c, x, y, w, h, 18); c.clip();

  if (mood.kind === 'flat'){
    // soft studio gradient + a few "objects"
    const g = c.createLinearGradient(x, y, x, y+h);
    g.addColorStop(0, mood.sky[0]); g.addColorStop(1, mood.sky[2]);
    c.fillStyle = g; c.fillRect(x, y, w, h);
    for (let i=0;i<3;i++){
      const ox = x + w*(0.2+rand()*0.6), oy = y + h*(0.55+rand()*0.3), or_ = w*(0.10+rand()*0.12);
      const og = c.createRadialGradient(ox-or_*0.3, oy-or_*0.4, or_*0.1, ox, oy, or_);
      og.addColorStop(0, mood.sun); og.addColorStop(1, mood.land[1]);
      c.fillStyle = og; c.beginPath(); c.ellipse(ox, oy, or_, or_*1.15, 0, 0, 7); c.fill();
    }
  } else {
    // sky gradient
    const horizon = y + h*(mood.kind==='sea'?0.62: mood.kind==='city'?0.66:0.58);
    const g = c.createLinearGradient(x, y, x, horizon);
    g.addColorStop(0, mood.sky[0]); g.addColorStop(0.6, mood.sky[1]); g.addColorStop(1, mood.sky[2]);
    c.fillStyle = g; c.fillRect(x, y, w, horizon - y);

    // sun / glow
    const sunx = x + w*(0.22 + rand()*0.56), suny = y + h*(0.18 + rand()*0.22);
    const sr = w*(0.10 + rand()*0.08);
    const sg = c.createRadialGradient(sunx, suny, 1, sunx, suny, sr*2.4);
    sg.addColorStop(0, mood.sun); sg.addColorStop(0.25, mood.sun); sg.addColorStop(1, 'rgba(255,255,255,0)');
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = sg; c.beginPath(); c.arc(sunx, suny, sr*2.4, 0, 7); c.fill();
    c.globalCompositeOperation = 'source-over';

    if (mood.kind === 'land'){
      // layered ridgelines
      const layers = 4;
      for (let L=layers-1; L>=0; L--){
        const ly = horizon - h*0.04 + (L)*h*0.10*0.0 + (horizon - y)*0.0;
        const baseY = horizon - L*h*0.08 - h*0.0;
        const yy = horizon - L*(h*0.085);
        const t = L/(layers-1);
        const col = lerpHex(mood.land[0], mood.land[1], 1-t*0.85);
        c.fillStyle = col;
        c.beginPath(); c.moveTo(x, yy);
        let px = x; const segs = 7;
        const amp = h*(0.05 + 0.03*(L+1));
        for (let s=0;s<=segs;s++){
          const fx = x + (w)*s/segs;
          const fy = yy - Math.sin(s*1.7 + seed*0.3 + L) * amp - rand()*amp*0.4;
          c.lineTo(fx, fy);
        }
        c.lineTo(x+w, y+h); c.lineTo(x, y+h); c.closePath(); c.fill();
      }
    } else if (mood.kind === 'sea'){
      // water
      const wg = c.createLinearGradient(x, horizon, x, y+h);
      wg.addColorStop(0, mood.land[0]); wg.addColorStop(1, mood.land[1]);
      c.fillStyle = wg; c.fillRect(x, horizon, w, y+h-horizon);
      // sun reflection column
      c.globalCompositeOperation = 'lighter';
      for (let i=0;i<10;i++){
        const ry = horizon + (y+h-horizon)*(i/10) + rand()*4;
        const rw = (w*0.10)*(1 + i*0.25);
        c.fillStyle = 'rgba(255,255,255,'+(0.10*(1-i/12))+')';
        c.fillRect(sunx - rw/2, ry, rw, 2 + i*0.5);
      }
      c.globalCompositeOperation = 'source-over';
    } else { // city
      const wg = c.createLinearGradient(x, horizon, x, y+h);
      wg.addColorStop(0, mood.land[0]); wg.addColorStop(1, mood.land[1]);
      c.fillStyle = wg; c.fillRect(x, horizon, w, y+h-horizon);
      // skyline buildings with lit windows
      let bx = x;
      while (bx < x+w){
        const bw = w*(0.06 + rand()*0.08);
        const bh = h*(0.14 + rand()*0.32);
        const by = horizon - bh;
        c.fillStyle = lerpHex(mood.land[0], '#000000', 0.25 + rand()*0.25);
        c.fillRect(bx, by, bw, bh + (y+h-horizon));
        // windows
        for (let wy = by+6; wy < horizon-4; wy += 9){
          for (let wx = bx+4; wx < bx+bw-4; wx += 7){
            if (rand() > 0.55){ c.fillStyle = rand()>0.5? mood.sun : '#ffd27a'; c.globalAlpha = 0.5+rand()*0.5; c.fillRect(wx, wy, 3.5, 4.5); c.globalAlpha=1; }
          }
        }
        bx += bw + w*0.012;
      }
    }
    // foreground vignette / ground shadow
    const fg = c.createLinearGradient(x, y+h*0.7, x, y+h);
    fg.addColorStop(0, 'rgba(0,0,0,0)'); fg.addColorStop(1, 'rgba(0,0,0,0.28)');
    c.fillStyle = fg; c.fillRect(x, y+h*0.7, w, h*0.3);
  }

  // film grain-ish speckle (cheap, static per photo)
  c.globalAlpha = 0.05;
  for (let i=0;i<Math.floor(w*h/900);i++){ c.fillStyle = rand()>0.5?'#fff':'#000'; c.fillRect(x+rand()*w, y+rand()*h, 1, 1); }
  c.globalAlpha = 1;

  // top sheen
  const sh = c.createLinearGradient(x, y, x, y+h*0.18);
  sh.addColorStop(0,'rgba(255,255,255,0.10)'); sh.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle = sh; c.fillRect(x, y, w, h*0.18);

  c.restore();
}

function lerpHex(a, b, t){
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  const ar=(pa>>16)&255, ag=(pa>>8)&255, ab=pa&255;
  const br=(pb>>16)&255, bg=(pb>>8)&255, bb=pb&255;
  const r=Math.round(ar+(br-ar)*t), g=Math.round(ag+(bg-ag)*t), bl=Math.round(ab+(bb-ab)*t);
  return 'rgb('+r+','+g+','+bl+')';
}

/* gallery item metadata */
const GALLERY = MOODS.map((m,i)=>({
  mood:m, seed: 1234 + i*97,
  title:m.name, sub:['Aperture f/'+(1.4+ (i%4)).toFixed(1), 'ISO '+(100*(1+(i%5))), m.kind.toUpperCase()][i%3],
  likes: (3+ (i*7)%40) + 'k', span: (i%7===0||i%7===3)?2:1
}));

function fav(c, x, y, r, filled, col){ // heart
  c.save(); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = r*0.36; c.lineCap='round'; c.lineJoin='round';
  c.beginPath();
  c.moveTo(x, y+r*0.62);
  c.bezierCurveTo(x-r*1.1, y-r*0.2, x-r*0.8, y-r*0.95, x-r*0.12, y-r*0.55);
  c.bezierCurveTo(x, y-r*0.5, x, y-r*0.5, x+r*0.12, y-r*0.55);
  c.bezierCurveTo(x+r*0.8, y-r*0.95, x+r*1.1, y-r*0.2, x, y+r*0.62);
  if (filled) c.fill(); else c.stroke();
  c.restore();
}

let layout = [];   // computed tile rects (content-space, before scroll) -> {x,y,w,h,item}
let GRID_TOP = 0;

function computeLayout(){
  // top chrome height scales with width
  const pad = Math.round(W*0.045);
  const colGap = Math.round(W*0.018);
  const cols = W < H ? 2 : Math.max(3, Math.round(W/360/DPR* (W>2000?1:1)));
  const colsFinal = W < H ? 2 : (W/DPR < 760 ? 2 : (W/DPR < 1200 ? 3 : 4));
  GRID_TOP = Math.round(W*0.0 + (W<H? 250*DPR : 230*DPR));
  const gridW = W - pad*2;
  const colW = (gridW - colGap*(colsFinal-1)) / colsFinal;
  const baseH = colW * 0.82;

  layout = [];
  const colY = new Array(colsFinal).fill(GRID_TOP);
  // greedy masonry: place into shortest column; double-span occasionally
  let i = 0;
  for (const item of GALLERY){
    let span = item.span;
    if (span > colsFinal) span = 1;
    // find shortest start col that fits span
    let best = 0, bestY = Infinity;
    for (let s=0; s+span<=colsFinal; s++){
      let maxY = -Infinity; for (let k=0;k<span;k++) maxY = Math.max(maxY, colY[s+k]);
      if (maxY < bestY){ bestY = maxY; best = s; }
    }
    const tileW = colW*span + colGap*(span-1);
    const tileH = baseH * (item.span===2? 0.78 : (i%5===0?1.18:1.0));
    const tx = pad + best*(colW+colGap);
    const ty = bestY;
    layout.push({ x:tx, y:ty, w:tileW, h:tileH, item });
    for (let k=0;k<span;k++) colY[best+k] = ty + tileH + colGap;
    i++;
  }
  // duplicate a second pass so there is more to scroll through
  const firstPassMax = Math.max(...colY);
  const offset = firstPassMax;
  for (const item of GALLERY){
    let span = item.span; if (span>colsFinal) span=1;
    let best=0,bestY=Infinity;
    for (let s=0;s+span<=colsFinal;s++){ let m=-Infinity; for(let k=0;k<span;k++)m=Math.max(m,colY[s+k]); if(m<bestY){bestY=m;best=s;} }
    const tileW = colW*span + colGap*(span-1);
    const tileH = baseH * (item.span===2?0.78:1.0);
    const tx = pad + best*(colW+colGap);
    layout.push({ x:tx, y:bestY, w:tileW, h:tileH, item });
    for (let k=0;k<span;k++) colY[best+k] = bestY + tileH + colGap;
  }
  const contentBottom = Math.max(...colY) + pad;
  SCROLL_MAX = Math.max(0, contentBottom - H);
}

function drawChrome(c, pad){
  // header background
  c.fillStyle = '#0d0f12'; c.fillRect(0, 0, W, GRID_TOP);
  const topY = Math.round(W<H? 64*DPR : 56*DPR);

  // brand
  tw(c, 'AURELIA', pad, topY, Math.round(26*DPR), '#f4f6f8', 800, 'left');
  // small diamond mark
  c.save(); c.translate(pad - 0*DPR, topY); c.restore();
  tw(c, 'STUDIO GALLERY', pad, topY + 22*DPR, Math.round(11*DPR), '#6f7782', 600);

  // avatar top-right
  const ar = 18*DPR, ax = W - pad - ar, ay = topY - 4*DPR;
  const ag = c.createLinearGradient(ax-ar, ay-ar, ax+ar, ay+ar);
  ag.addColorStop(0,'#6ea8ff'); ag.addColorStop(1,'#b06ad9');
  c.fillStyle = ag; c.beginPath(); c.arc(ax, ay, ar, 0, 7); c.fill();
  c.fillStyle = 'rgba(255,255,255,.92)'; tw(c,'JS', ax, ay+5*DPR, 14*DPR, 'rgba(255,255,255,.95)', 700, 'center');
  // notification dot
  c.fillStyle = '#ff5a7a'; c.beginPath(); c.arc(ax+ar*0.78, ay-ar*0.72, 4.5*DPR, 0,7); c.fill();

  // search bar
  const sbY = topY + 44*DPR, sbH = 44*DPR, sbW = W - pad*2;
  c.fillStyle = '#171a1f'; rr(c, pad, sbY, sbW, sbH, sbH/2); c.fill();
  c.strokeStyle = '#262b32'; c.lineWidth = 1*DPR; rr(c, pad, sbY, sbW, sbH, sbH/2); c.stroke();
  c.strokeStyle = '#7a828c'; c.lineWidth = 2*DPR; c.lineCap='round';
  c.beginPath(); c.arc(pad+24*DPR, sbY+sbH/2-1*DPR, 7*DPR, 0, 7); c.stroke();
  c.beginPath(); c.moveTo(pad+29.5*DPR, sbY+sbH/2+4.5*DPR); c.lineTo(pad+35*DPR, sbY+sbH/2+10*DPR); c.stroke();
  tw(c, 'Search collections, moods, light…', pad+48*DPR, sbY+sbH/2+5*DPR, 15*DPR, '#6f7782', 400);

  // category tabs
  const tabs = ['All','Landscape','Sea','City','Studio','Night'];
  const tabY = sbY + sbH + 38*DPR;
  let tx = pad;
  c.textAlign='left';
  tabs.forEach((t,i)=>{
    c.font = (i===0?700:500)+' '+(15*DPR)+'px -apple-system,sans-serif';
    const tWid = c.measureText(t).width;
    if (i===0){
      c.fillStyle = '#f4f6f8'; rr(c, tx-14*DPR, tabY-20*DPR, tWid+28*DPR, 32*DPR, 16*DPR); c.fill();
      c.fillStyle = '#0d0f12';
    } else c.fillStyle = '#9aa2ad';
    c.fillText(t, tx, tabY);
    tx += tWid + 36*DPR;
  });

  // section title (just above grid)
  tw(c, 'Featured', pad, GRID_TOP - 18*DPR, 20*DPR, '#e7eaee', 800);
  tw(c, 'this week', pad + c2w(c,'Featured', 20*DPR, 800) + 10*DPR, GRID_TOP - 18*DPR, 20*DPR, '#5f6772', 300);
}
function c2w(c, t, size, weight){ c.font=(weight||400)+' '+size+'px -apple-system,sans-serif'; return c.measureText(t).width; }

function drawScene(){
  scene.width = W; scene.height = H;
  const c = sx;
  const pad = Math.round(W*0.045);

  // app background
  const bg = c.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d0f12'); bg.addColorStop(1,'#070809');
  c.fillStyle = bg; c.fillRect(0,0,W,H);

  // grid (scrolled)
  c.save();
  c.beginPath(); c.rect(0, GRID_TOP - 2*DPR, W, H - (GRID_TOP-2*DPR)); c.clip();
  for (const tile of layout){
    const ty = tile.y - scrollY;
    if (ty > H + 40*DPR || ty + tile.h < GRID_TOP - 40*DPR) continue;
    // drop shadow
    c.save(); c.shadowColor='rgba(0,0,0,0.55)'; c.shadowBlur=18*DPR; c.shadowOffsetY=10*DPR;
    c.fillStyle='#000'; rr(c, tile.x, ty, tile.w, tile.h, 18); c.fill(); c.restore();

    drawPhoto(c, tile.x, ty, tile.w, tile.h, tile.item.mood, tile.item.seed);

    // photo caption overlay (bottom gradient)
    const cap = c.createLinearGradient(tile.x, ty+tile.h-70*DPR, tile.x, ty+tile.h);
    cap.addColorStop(0,'rgba(0,0,0,0)'); cap.addColorStop(1,'rgba(0,0,0,0.6)');
    c.save(); rr(c, tile.x, ty, tile.w, tile.h, 18); c.clip();
    c.fillStyle = cap; c.fillRect(tile.x, ty+tile.h-70*DPR, tile.w, 70*DPR);
    c.restore();
    tw(c, tile.item.title, tile.x+14*DPR, ty+tile.h-22*DPR, 14*DPR, '#ffffff', 700);
    tw(c, tile.item.sub, tile.x+14*DPR, ty+tile.h-7*DPR, 11*DPR, 'rgba(255,255,255,.72)', 400);
    // like pill
    fav(c, tile.x+tile.w-34*DPR, ty+18*DPR, 7*DPR, true, '#ff5a7a');
    tw(c, tile.item.likes, tile.x+tile.w-24*DPR, ty+23*DPR, 12*DPR, '#ffffff', 600);
    // thin border
    c.strokeStyle='rgba(255,255,255,0.06)'; c.lineWidth=1*DPR; rr(c, tile.x, ty, tile.w, tile.h, 18); c.stroke();
  }
  c.restore();

  // chrome on top (sticky header) — drawn last so it sits above grid
  drawChrome(c, pad);

  // subtle screen backlight falloff
  const sg = c.createRadialGradient(W*0.5, H*0.42, H*0.25, W*0.5, H*0.55, H*0.95);
  sg.addColorStop(0,'rgba(255,255,255,0.015)'); sg.addColorStop(1,'rgba(0,0,10,0.18)');
  c.fillStyle = sg; c.fillRect(0,0,W,H);
}

/* ------------------------------------------------------------
   WEBGL — optics
   ------------------------------------------------------------ */
const VS = `attribute vec2 aP; void main(){ gl_Position = vec4(aP,0.0,1.0); }`;

const FS = `
precision highp float;
uniform sampler2D uScene;
uniform vec2  uRes, uGlass, uShake, uTilt;
uniform float uR, uTime, uPress, uBlur, uExpo, uRot;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }

vec3 scn(vec2 uv){ return texture2D(uScene, clamp(uv/uRes, vec2(0.0015), vec2(0.9985))).rgb; }

/* gentle handheld camera: rotate + slight barrel + shake on source coords */
vec2 cam(vec2 v){
  vec2 cen = uRes*0.5;
  vec2 p = v - cen;
  float ca=cos(uRot), sa=sin(uRot);
  p = vec2(ca*p.x - sa*p.y, sa*p.x + ca*p.y);
  float rr = dot(p,p)/dot(cen,cen);
  p *= 1.0 + 0.030*rr;
  return cen + p + uShake;
}
float gband(float x, float c, float w){ float d=(x-c)/w; return exp(-d*d); }

void main(){
  vec2 fc = gl_FragCoord.xy;
  vec2 d  = fc - uGlass;

  /* tilt -> ellipse foreshortening */
  float tA = length(uTilt);
  vec2 tD = tA>0.001 ? uTilt/tA : vec2(1.0,0.0);
  vec2 pD = vec2(-tD.y, tD.x);
  float squash = 1.0 - 0.40*tA;
  vec2 ds = tD*(dot(d,tD)/squash) + pD*dot(d,pD);
  float r = length(ds);
  vec2 dir = r>0.5 ? ds/r : vec2(1.0,0.0);
  vec2 tdir = vec2(-dir.y, dir.x);
  float x = r/uR;

  float innerX = 0.82;
  float w    = smoothstep(innerX-0.05, innerX+0.03, x);   // rim zone
  float wOut = smoothstep(1.0, 1.06, x);                  // outside
  float q = clamp(x/innerX, 0.0, 1.0);

  /* refracted source radius: magnified center, compressed edge */
  float magA = mix(0.42, 0.35, uPress);
  float q5 = q*q*q*q*q;
  float rsG = uR*(magA*q + (1.05-magA)*q5);
  float asym = 1.0 + 0.36*tA*dot(dir,tD);
  vec2 refr = dir*mix(rsG, uR*1.06, w)*asym + uTilt*uR*0.50;

  /* anisotropic DOF blur (source px) */
  float q4 = q*q*q*q;
  float radial = mix(mix(q4*uR*0.14, uR*0.02, w), 0.0, wOut) + uBlur + 0.7;
  float tang   = mix(mix(q*q*q*uR*0.05, uR*0.18, w), 0.0, wOut) + uBlur + 0.7;

  vec2 srcBase = uGlass + mix(refr, d, wOut);
  vec3 col = vec3(0.0);
  #define TAP(rx,ty) col += scn(cam(srcBase + dir*((rx)*radial) + tdir*((ty)*tang)));
  TAP( 0.00, 0.00) TAP( 0.62, 0.25) TAP(-0.58, 0.30) TAP( 0.21,-0.64)
  TAP(-0.25,-0.61) TAP( 0.45, 0.68) TAP(-0.70,-0.15) TAP( 0.86,-0.18)
  TAP(-0.41, 0.74) TAP( 0.05, 0.94) TAP(-0.88, 0.35) TAP( 0.33, 0.13)
  TAP(-0.18, 0.20) TAP( 0.69,-0.55)
  col /= 14.0;

  float inG = (1.0 - wOut);
  float inI = inG*(1.0 - w);

  /* chromatic aberration toward rim */
  float caW = 0.5*smoothstep(0.25,1.0,x)*(1.0+1.3*tA)*inG;
  caW = min(caW, 0.85);
  if (caW>0.01){
    vec3 cR = scn(cam(uGlass + refr*0.974));
    vec3 cB = scn(cam(uGlass + refr*1.026));
    col.r = mix(col.r, cR.r, caW);
    col.b = mix(col.b, cB.b, caW);
  }

  /* liquid-glass body: slight clarity boost + faint cool tint + edge milkiness */
  float lum = dot(col, vec3(0.299,0.587,0.114));
  col = mix(col, vec3(lum), 0.10*inI);                 // mild desat
  col = mix(col, (col-0.5)*1.06 + 0.5, 0.35*inI);      // micro-contrast (clarity)
  col = mix(col, col*0.95 + vec3(0.03,0.035,0.05), inG); // faint cool body
  float veil = (0.03 + 0.14*x*x + 0.06*uPress)*inI;
  col = mix(col, vec3(0.97,0.975,1.0), veil);
  col += inI*0.035*(1.0 - x*x);                         // center bloom

  /* radial caustic streaks */
  float th = atan(d.y, d.x);
  float cau = 0.5*sin(th*13.0+2.0) + 0.5*sin(th*29.0+0.6) + 0.35*sin(th*7.0-1.2);
  col += cau*0.045*q4*inI;

  /* rim: dark glass wall + concentric rings + specular arcs */
  float rim = w*(1.0-wOut);
  col = mix(col, col*0.40, rim);
  float bands = gband(x,0.850,0.018)*0.85
              + gband(x,0.925,0.013)*0.55
              + gband(x,0.985,0.010)*0.80;
  float arc = pow(max(cos(th-2.45),0.0),6.0)
            + 0.7*pow(max(cos(th+0.55),0.0),10.0)
            + 0.45*pow(max(cos(th-4.30),0.0),14.0);
  col += rim*bands*(0.14 + 0.70*arc);
  col *= mix(1.0, 0.55, rim*gband(x,1.0,0.012));        // dark outer lip
  col += inI*0.16*gband(x,0.812,0.012);                 // bright inner ring

  /* big soft window-reflection highlight, upper-left */
  vec2 hp = uGlass + vec2(-0.30,0.40)*uR + uTilt*uR*0.5;
  vec2 hd = fc - hp;
  col += exp(-dot(hd,hd)/(uR*uR*0.16))*(0.16+0.08*uPress)*inG;
  /* secondary small sharp specular dot, lower-right */
  vec2 hp2 = uGlass + vec2(0.42,-0.34)*uR;
  vec2 hd2 = fc - hp2;
  col += exp(-dot(hd2,hd2)/(uR*uR*0.006))*0.5*inG;

  /* contact shadow + outer caustic outside the glass */
  col *= 1.0 - (0.30-0.10*uPress)*gband(x,1.030,0.045)*wOut;
  col += vec3(0.06,0.065,0.08)*gband(x,1.10,0.022)*wOut;

  /* ---- camera post ---- */
  col *= uExpo;
  col *= vec3(0.99,1.0,1.025);
  vec2 vc = (fc - uRes*0.5)/(uRes*0.5);
  col *= 1.0 - 0.30*pow(dot(vc,vc)*0.55, 1.4);          // vignette
  col *= 1.0 + 0.010*sin(fc.y*0.07 - uTime*9.0);        // refresh band
  float gn = hash(fc + fract(uTime*7.0)*113.0);
  col += (gn-0.5)*0.035;                                // grain
  col = clamp(col,0.0,1.0);
  col = pow(col, vec3(0.98));
  gl_FragColor = vec4(col,1.0);
}`;

let prog, U = {}, sceneTex;
function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function initGL(){
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aP = gl.getAttribLocation(prog, 'aP');
  gl.enableVertexAttribArray(aP);
  gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);

  for (const n of ['uScene','uRes','uGlass','uShake','uTilt','uR','uTime','uPress','uBlur','uExpo','uRot'])
    U[n] = gl.getUniformLocation(prog, n);

  sceneTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.uniform1i(U.uScene, 0);
}
function uploadScene(){
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, scene);
}

/* ------------------------------------------------------------ state */
const mouse = { x:0, y:0 };
const glass = { x:0, y:0 };
const tilt = { x:0, y:0 };
const tiltManual = { x:0, y:0 };
const tiltVel = { x:0, y:0 };
let rightDrag = null;
let pressTarget = 0, press = 0;
let needScene = true;

function resize(){
  W = Math.round(innerWidth * DPR); H = Math.round(innerHeight * DPR);
  glCanvas.width = W; glCanvas.height = H;
  if (!gl) return;
  gl.viewport(0,0,W,H);
  if (!mouse.x){ mouse.x = innerWidth*0.5; mouse.y = innerHeight*0.5; glass.x = W*0.5; glass.y = H*0.5; }
  scrollY = Math.min(scrollY, SCROLL_MAX);
  computeLayout();
  scrollY = Math.min(scrollY, SCROLL_MAX);
  needScene = true;
}
addEventListener('resize', resize);

addEventListener('contextmenu', e=>e.preventDefault());
addEventListener('pointermove', e=>{
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (rightDrag){
    tiltManual.x = rightDrag.tx + (e.clientX - rightDrag.x)*0.0035;
    tiltManual.y = rightDrag.ty + (rightDrag.y - e.clientY)*0.0035;
    const m = Math.hypot(tiltManual.x, tiltManual.y);
    if (m>0.5){ tiltManual.x *= 0.5/m; tiltManual.y *= 0.5/m; }
  }
});
addEventListener('pointerdown', e=>{
  if (e.button === 2 || e.shiftKey) rightDrag = { x:e.clientX, y:e.clientY, tx:tiltManual.x, ty:tiltManual.y };
  else pressTarget = 1;
});
addEventListener('pointerup', e=>{
  if (e.button === 2 || rightDrag) rightDrag = null;
  pressTarget = 0;
});
addEventListener('wheel', e=>{
  scrollY = Math.max(0, Math.min(SCROLL_MAX, scrollY + e.deltaY*0.8));
  needScene = true;
}, { passive:true });
// touch scroll: vertical drag scrolls when not pressing-tilt
let lastTouchY = null;
addEventListener('touchmove', e=>{
  if (e.touches.length===1 && lastTouchY!=null){
    const dy = lastTouchY - e.touches[0].clientY;
    scrollY = Math.max(0, Math.min(SCROLL_MAX, scrollY + dy*1.4));
    needScene = true;
  }
  if (e.touches.length) lastTouchY = e.touches[0].clientY;
}, { passive:true });
addEventListener('touchstart', e=>{ if(e.touches.length) lastTouchY = e.touches[0].clientY; }, { passive:true });
addEventListener('touchend', ()=>{ lastTouchY=null; }, { passive:true });

setTimeout(()=>{ const h=document.getElementById('hint'); if(h) h.style.opacity='0'; }, 5200);

let huntT0 = 2000 + Math.random()*3000;
function focusHunt(now){
  const dt = now - huntT0;
  if (dt > 900){ huntT0 = now + 3000 + Math.random()*5200; return 0; }
  if (dt < 0) return 0;
  const ph = dt/900;
  return Math.sin(ph*Math.PI)*(3.2 + Math.random()*0.6);
}

let started = false;
function frame(tms){
  const t = tms*0.001;
  if (needScene){ drawScene(); uploadScene(); needScene = false; }

  const tx = mouse.x*DPR + Math.sin(t*8.7)*1.3*DPR + Math.sin(t*13.1+2.0)*0.7*DPR;
  const ty = (innerHeight - mouse.y)*DPR + Math.cos(t*9.4+1.0)*1.2*DPR;
  const pgx = glass.x, pgy = glass.y;
  glass.x += (tx - glass.x)*0.17;
  glass.y += (ty - glass.y)*0.17;
  press += (pressTarget - press)*0.10;

  const vk = -0.010/DPR;
  tiltVel.x += ((glass.x - pgx)*vk - tiltVel.x)*0.18;
  tiltVel.y += ((glass.y - pgy)*vk - tiltVel.y)*0.18;
  if (!rightDrag){ tiltManual.x *= 0.95; tiltManual.y *= 0.95; }
  let ttx = tiltManual.x + tiltVel.x, tty = tiltManual.y + tiltVel.y;
  const tm = Math.hypot(ttx,tty);
  if (tm>0.55){ ttx *= 0.55/tm; tty *= 0.55/tm; }
  tilt.x += (ttx - tilt.x)*0.12;
  tilt.y += (tty - tilt.y)*0.12;

  const R = Math.min(W,H)*(0.30 + press*0.02);

  const shx = (Math.sin(t*1.3)*2.4 + Math.sin(t*0.7+1.7)*3.2 + Math.sin(t*3.1+0.5)*1.0 + Math.sin(t*7.3)*0.4)*DPR;
  const shy = (Math.cos(t*1.1+0.4)*2.6 + Math.sin(t*0.5+2.6)*3.4 + Math.cos(t*2.7+1.2)*1.1 + Math.cos(t*8.1)*0.4)*DPR;
  const rot = 0.0035*Math.sin(t*0.45) + 0.0015*Math.sin(t*1.7+1.0);

  const blur = Math.max(0.0, 0.7 + 0.7*Math.sin(t*0.8) + 0.45*Math.sin(t*2.3+0.7))*DPR + focusHunt(tms)*DPR;
  const expo = 1.0 + 0.04*Math.sin(t*0.4) + 0.025*Math.sin(t*1.1+2.2) - press*0.05;

  gl.uniform2f(U.uRes, W, H);
  gl.uniform2f(U.uGlass, glass.x, glass.y);
  gl.uniform2f(U.uShake, shx, shy);
  gl.uniform2f(U.uTilt, tilt.x, tilt.y);
  gl.uniform1f(U.uR, R);
  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uPress, press);
  gl.uniform1f(U.uBlur, blur);
  gl.uniform1f(U.uExpo, expo);
  gl.uniform1f(U.uRot, rot);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}

if (gl){
  try {
    initGL();
    resize();
    requestAnimationFrame(frame);
  } catch (err){
    document.getElementById('fallback').textContent = '셰이더 초기화 실패: ' + err.message;
    document.getElementById('fallback').style.display = 'grid';
  }
}
</script>
