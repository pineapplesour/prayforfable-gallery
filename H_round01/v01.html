<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>liquid glass · on a social feed</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05060a;cursor:none}
  #gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
  #fallback{position:fixed;inset:0;display:none;place-items:center;color:#8a93a6;
    font:14px/1.5 system-ui,sans-serif;text-align:center;padding:2em;background:#05060a}
  #hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    font:10px/1.5 "SF Mono",Menlo,ui-monospace,monospace;letter-spacing:.22em;
    color:rgba(255,255,255,.5);text-shadow:0 1px 8px rgba(0,0,0,.9);
    pointer-events:none;transition:opacity 1.4s;text-transform:uppercase;white-space:nowrap}
  @media (max-width:560px){#hint{font-size:9px;letter-spacing:.14em}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="fallback">WebGL is unavailable on this device — the liquid-glass lens needs it.</div>
<div id="hint">move · hold to press · right-drag to tilt · scroll the feed</div>
<script>
'use strict';
/* ===========================================================================
   LIQUID GLASS ON A SOCIAL FEED
   ---------------------------------------------------------------------------
   layer 1 (canvas2d)  : a desktop social feed — stories, gradient image
                          cards, text posts — on a faintly tilted, glowing
                          screen filmed in a dim room.
   layer 2 (webgl)     : a thick circular liquid-glass lens resting on the
                          screen. real refraction (center magnify -> rim
                          compress), refraction rings, chromatic edge,
                          specular window highlight, caustics, milky veil,
                          contact shadow, then handheld phone-camera post.
   first paint shows BOTH. no gate, no loader.
   =========================================================================== */

const DPR = Math.min(window.devicePixelRatio || 1, 1.8);
let W = 0, H = 0;

const glCanvas = document.getElementById('gl');
const gl = glCanvas.getContext('webgl', { antialias:false, preserveDrawingBuffer:false, alpha:false });
if (!gl) { document.getElementById('fallback').style.display = 'grid';
           document.getElementById('hint').style.display = 'none'; }

/* ---------------------------------------------------------------------------
   SCENE  — logical space, cover-scaled onto the canvas, then tilted.
   On narrow screens we switch to a single-column mobile layout.
   --------------------------------------------------------------------------- */
const scene = document.createElement('canvas');
const sx = scene.getContext('2d');
let LW = 1600, LH = 1000;     // recomputed per layout
let isMobile = false;
let scrollY = 0;
let SCROLL_MAX = 900;

/* ---- tiny draw helpers ---- */
function tw(c, text, x, y, size, color, weight, align) {
  c.fillStyle = color;
  c.font = (weight||400) + ' ' + size + 'px -apple-system,"Helvetica Neue","Segoe UI",Roboto,sans-serif';
  c.textAlign = align || 'left';
  c.fillText(text, x, y);
  c.textAlign = 'left';
}
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r, y); c.arcTo(x+w, y, x+w, y+h, r); c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r); c.arcTo(x, y, x+w, y, r); c.closePath();
}
function ring(c, x, y, r, w, cols) {     // gradient story ring
  const g = c.createConicGradient ? c.createConicGradient(0, x, y)
          : c.createLinearGradient(x-r, y-r, x+r, y+r);
  if (c.createConicGradient) { for (let i=0;i<cols.length;i++) g.addColorStop(i/(cols.length-1), cols[i]); }
  else { g.addColorStop(0, cols[0]); g.addColorStop(1, cols[cols.length-1]); }
  c.strokeStyle = g; c.lineWidth = w; c.beginPath(); c.arc(x, y, r, 0, 7); c.stroke();
}
function avatar(c, x, y, r, c1, c2, glyph) {
  const g = c.createLinearGradient(x-r, y-r, x+r, y+r);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  if (glyph) { tw(c, glyph, x, y + r*0.34, r*0.95, 'rgba(255,255,255,.92)', 700, 'center'); }
}
function badge(c, x, y, s) {
  c.fillStyle = '#3b82f6'; c.beginPath(); c.arc(x, y, s, 0, 7); c.fill();
  c.strokeStyle = '#fff'; c.lineWidth = s*0.28; c.lineCap='round'; c.lineJoin='round';
  c.beginPath(); c.moveTo(x-s*0.42,y); c.lineTo(x-s*0.1,y+s*0.36); c.lineTo(x+s*0.46,y-s*0.32); c.stroke();
}
function wrapLines(c, text, maxW, size, weight) {
  c.font = (weight||400) + ' ' + size + 'px -apple-system,"Helvetica Neue",sans-serif';
  const words = text.split(' '); const lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (c.measureText(t).width > maxW && line) { lines.push(line); line = w; }
    else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

/* deterministic noise for image textures */
let rseed = 1;
function srnd(s){ rseed = s; }
function rnd(){ rseed = (rseed * 1103515245 + 12345) & 0x7fffffff; return rseed / 0x7fffffff; }

/* a richly colored generative "photo" inside a media card */
function photoCard(c, x, y, w, h, kind) {
  c.save(); rr(c, x, y, w, h, 18); c.clip();
  if (kind === 'aurora') {
    const g = c.createLinearGradient(x, y, x+w, y+h);
    g.addColorStop(0, '#3a1c71'); g.addColorStop(0.45, '#d76d77'); g.addColorStop(1, '#ffaf7b');
    c.fillStyle = g; c.fillRect(x, y, w, h);
    srnd(7);
    for (let i=0;i<5;i++){
      const cx = x + rnd()*w, cy = y + rnd()*h, rad = (0.3+rnd()*0.5)*h;
      const rg = c.createRadialGradient(cx, cy, 0, cx, cy, rad);
      const hue = ['rgba(120,200,255,', 'rgba(255,160,220,', 'rgba(180,140,255,'][i%3];
      rg.addColorStop(0, hue+'0.55)'); rg.addColorStop(1, hue+'0)');
      c.fillStyle = rg; c.fillRect(x, y, w, h);
    }
  } else if (kind === 'ocean') {
    const g = c.createLinearGradient(x, y, x, y+h);
    g.addColorStop(0, '#0b3d6b'); g.addColorStop(0.55, '#1e88c8'); g.addColorStop(1, '#7fd6e8');
    c.fillStyle = g; c.fillRect(x, y, w, h);
    c.globalAlpha = 0.5;
    for (let i=0;i<7;i++){ const yy = y + h*0.45 + i*9;
      c.strokeStyle = 'rgba(255,255,255,'+(0.18-i*0.02)+')'; c.lineWidth = 2;
      c.beginPath(); for(let xx=x; xx<=x+w; xx+=8){ const yo = Math.sin((xx*0.03)+i)*4; (xx===x?c.moveTo:c.lineTo).call(c,xx,yy+yo);} c.stroke();
    }
    c.globalAlpha = 1;
    const sun = c.createRadialGradient(x+w*0.74, y+h*0.26, 0, x+w*0.74, y+h*0.26, h*0.5);
    sun.addColorStop(0,'rgba(255,244,210,.95)'); sun.addColorStop(1,'rgba(255,244,210,0)');
    c.fillStyle = sun; c.fillRect(x,y,w,h);
  } else if (kind === 'grid') {        // a colorful design / poster grid
    c.fillStyle = '#101218'; c.fillRect(x, y, w, h);
    const pal = ['#ff5e5b','#ffd93d','#6bcB77','#4d96ff','#b983ff','#ff9a3c'];
    srnd(21); const cols=4, rows=3, pw=w/cols, ph=h/rows;
    for(let r=0;r<rows;r++) for(let cc=0;cc<cols;cc++){
      c.fillStyle = pal[Math.floor(rnd()*pal.length)];
      const gx=x+cc*pw+4, gy=y+r*ph+4;
      rr(c, gx, gy, pw-8, ph-8, 8); c.fill();
      c.fillStyle='rgba(255,255,255,.16)';
      if(rnd()>0.5){ c.beginPath(); c.arc(gx+pw*0.5-4, gy+ph*0.5-4, Math.min(pw,ph)*0.22, 0, 7); c.fill(); }
    }
  } else {                             // sunset portrait
    const g = c.createLinearGradient(x, y, x, y+h);
    g.addColorStop(0, '#ff9966'); g.addColorStop(0.5, '#ff5e62'); g.addColorStop(1, '#662d8c');
    c.fillStyle = g; c.fillRect(x, y, w, h);
    c.fillStyle = 'rgba(255,238,180,.9)';
    c.beginPath(); c.arc(x+w*0.5, y+h*0.62, h*0.16, 0, 7); c.fill();
    c.fillStyle = 'rgba(40,12,40,.55)';
    c.beginPath(); c.moveTo(x,y+h); c.lineTo(x,y+h*0.78);
    for(let xx=x; xx<=x+w; xx+=14){ c.lineTo(xx, y+h*0.78 + Math.sin(xx*0.05)*10 + (xx%40<20?14:0)); }
    c.lineTo(x+w,y+h); c.closePath(); c.fill();
  }
  c.restore();
}

/* engagement row (heart / comment / repost / share) */
function engageRow(c, x, y, counts, scale) {
  const s = scale || 1;
  c.strokeStyle = '#8b95a7'; c.fillStyle = '#8b95a7'; c.lineWidth = 1.7*s; c.lineCap='round'; c.lineJoin='round';
  // heart
  c.beginPath();
  c.moveTo(x, y+6*s);
  c.bezierCurveTo(x-9*s, y-1*s, x-7*s, y-8*s, x-1*s, y-5*s);
  c.bezierCurveTo(x, y-4.4*s, x, y-4.4*s, x+1*s, y-5*s);
  c.bezierCurveTo(x+7*s, y-8*s, x+9*s, y-1*s, x, y+6*s);
  c.stroke();
  tw(c, counts[0], x+15*s, y+5*s, 13*s, '#8b95a7');
  // comment
  let x2 = x + 92*s;
  rr(c, x2-8*s, y-7*s, 16*s, 12*s, 5*s); c.stroke();
  c.beginPath(); c.moveTo(x2-3*s,y+5*s); c.lineTo(x2-3*s,y+9*s); c.lineTo(x2+2*s,y+5*s); c.stroke();
  tw(c, counts[1], x2+15*s, y+5*s, 13*s, '#8b95a7');
  // repost
  let x3 = x + 184*s;
  c.beginPath(); c.moveTo(x3-7*s,y-2*s); c.lineTo(x3-7*s,y-5*s); c.lineTo(x3+4*s,y-5*s); c.moveTo(x3+1*s,y-8*s); c.lineTo(x3+4*s,y-5*s); c.lineTo(x3+1*s,y-2*s); c.stroke();
  c.beginPath(); c.moveTo(x3+7*s,y+1*s); c.lineTo(x3+7*s,y+4*s); c.lineTo(x3-4*s,y+4*s); c.moveTo(x3-1*s,y+1*s); c.lineTo(x3-4*s,y+4*s); c.lineTo(x3-1*s,y+7*s); c.stroke();
  tw(c, counts[2], x3+15*s, y+5*s, 13*s, '#8b95a7');
  // share (far right)
  let x4 = x + 268*s;
  c.beginPath(); c.moveTo(x4,y-7*s); c.lineTo(x4,y+2*s); c.moveTo(x4-3.5*s,y-3.5*s); c.lineTo(x4,y-7*s); c.lineTo(x4+3.5*s,y-3.5*s); c.stroke();
  c.beginPath(); c.moveTo(x4-6*s,y+1*s); c.lineTo(x4-6*s,y+6*s); c.lineTo(x4+6*s,y+6*s); c.lineTo(x4+6*s,y+1*s); c.stroke();
}

const POSTS = [
  { name:'Mara Voss', handle:'@maravoss', time:'1h', verified:true, av:['#7c3aed','#4338ca'], glyph:'M',
    text:'shot this on the rooftop right as the light went amber. no edits — the sky did everything.',
    media:'sunset', counts:['18.2K','402','1.1K'] },
  { name:'fieldnotes', handle:'@fieldnotes', time:'3h', verified:false, av:['#0ea5e9','#0369a1'], glyph:'f',
    text:'low tide this morning. the whole bay turned to glass for about ten minutes.',
    media:'ocean', counts:['6.4K','188','512'] },
  { name:'Fable', handle:'@fable', time:'5h', verified:true, av:['#d97757','#b85c3d'], glyph:'✦', fable:true,
    text:'a lens is just a promise that the thing underneath is worth a closer look.',
    media:null, counts:['41.0K','2.3K','9.8K'] },
  { name:'studio·noon', handle:'@studionoon', time:'7h', verified:true, av:['#22c55e','#15803d'], glyph:'n',
    text:'poster set for the spring showcase — twelve variations, one grid. swipe? no, just scroll.',
    media:'grid', counts:['12.7K','640','3.0K'] },
  { name:'aurora.daily', handle:'@auroradaily', time:'9h', verified:false, av:['#ec4899','#a21caf'], glyph:'a',
    text:'borealis over the lake last night. stood in the cold for two hours. worth every minute.',
    media:'aurora', counts:['33.5K','1.4K','7.7K'] },
  { name:'quiet builds', handle:'@quietbuilds', time:'12h', verified:false, av:['#f59e0b','#b45309'], glyph:'q',
    text:'refactored the whole render path tonight. it just feels lighter now. you can feel good code.',
    media:null, counts:['2.9K','97','220'] },
];

function layout() {
  isMobile = innerWidth < 560;
  if (isMobile) { LW = 900; LH = 1900; SCROLL_MAX = 1180; }
  else          { LW = 1600; LH = 1000; SCROLL_MAX = 900; }
}

function drawScene() {
  scene.width = W; scene.height = H;
  const c = sx;
  // dim room behind the screen
  const rg = c.createRadialGradient(W*0.5, H*0.42, H*0.15, W*0.5, H*0.55, H*0.95);
  rg.addColorStop(0, '#14161c'); rg.addColorStop(1, '#030305');
  c.fillStyle = rg; c.fillRect(0, 0, W, H);

  const sc = Math.max(W / LW, H / LH) * 1.05;
  c.save();
  c.translate(W/2, H/2);
  c.rotate(isMobile ? -0.008 : -0.014);
  c.scale(sc, sc);
  c.translate(-LW/2, -LH/2);

  // device bezel
  rr(c, 4, 2, LW-8, LH-4, isMobile?40:22); c.fillStyle = '#0c0d11'; c.fill();
  c.strokeStyle = '#23262e'; c.lineWidth = 2; c.stroke();
  // power LED
  c.fillStyle = '#4ade80'; c.shadowColor = '#4ade80'; c.shadowBlur = 9;
  c.beginPath(); c.arc(isMobile? LW*0.5 : 14, isMobile? 16 : LH*0.5, 3.2, 0, 7); c.fill();
  c.shadowBlur = 0;

  // screen rect
  const SXX = isMobile? 16 : 24, SY = isMobile? 30 : 18;
  const SW = LW - SXX*2, SH = LH - SY - (isMobile?30:20);
  rr(c, SXX, SY, SW, SH, isMobile?28:10); c.save(); c.clip();

  // app background (dark social)
  const bg = c.createLinearGradient(SXX, SY, SXX, SY+SH);
  bg.addColorStop(0, '#0d1017'); bg.addColorStop(1, '#0a0c12');
  c.fillStyle = bg; c.fillRect(SXX, SY, SW, SH);

  if (!isMobile) drawDesktop(c, SXX, SY, SW, SH);
  else           drawMobile(c, SXX, SY, SW, SH);

  // backlight glow over everything inside the screen
  const sg = c.createRadialGradient(LW*0.5, SY+SH*0.4, SH*0.15, LW*0.5, SY+SH*0.5, SH*0.95);
  sg.addColorStop(0, 'rgba(120,150,255,0.05)'); sg.addColorStop(1, 'rgba(0,0,20,0.16)');
  c.fillStyle = sg; c.fillRect(SXX, SY, SW, SH);

  c.restore(); // unclip screen
  c.restore(); // untilt
}

function drawDesktop(c, SXX, SY, SW, SH) {
  // top bar
  c.fillStyle = '#0e1219'; c.fillRect(SXX, SY, SW, 56);
  c.strokeStyle = '#1b2030'; c.lineWidth = 1; c.beginPath();
  c.moveTo(SXX, SY+56); c.lineTo(SXX+SW, SY+56); c.stroke();
  // logo
  tw(c, 'orbit', SXX + 100, SY + 36, 24, '#e8ecf5', 800);
  c.fillStyle = '#3b82f6'; c.beginPath(); c.arc(SXX + 88, SY + 29, 5, 0, 7); c.fill();
  // search
  c.fillStyle = '#161b26'; rr(c, SXX + SW*0.5 - 200, SY + 14, 400, 30, 15); c.fill();
  c.strokeStyle = '#7c8aa3'; c.lineWidth = 1.7;
  c.beginPath(); c.arc(SXX + SW*0.5 - 178, SY + 29, 6, 0, 7); c.stroke();
  c.beginPath(); c.moveTo(SXX+SW*0.5-173.5, SY+33.5); c.lineTo(SXX+SW*0.5-170, SY+37); c.stroke();
  tw(c, 'Search orbit', SXX + SW*0.5 - 158, SY + 33, 14, '#7c8aa3');
  // right chip
  avatar(c, SXX + SW - 100, SY + 28, 16, '#3c6e8f', '#1d3d52', 'J');

  const CY = SY + 56;

  // ---- left sidebar ----
  const NAVX = SXX + 60;
  const nav = [['Home', true], ['Explore', false], ['Reels', false], ['Messages', false],
               ['Notifications', false], ['Create', false], ['Profile', false]];
  nav.forEach((n, i) => {
    const ny = CY + 64 + i * 52;
    if (n[1]) { c.fillStyle = '#161e2e'; rr(c, NAVX - 18, ny - 24, 188, 40, 12); c.fill(); }
    // icon dot/glyph
    c.strokeStyle = n[1] ? '#e8ecf5' : '#8b95a7'; c.lineWidth = 2; c.lineCap='round'; c.lineJoin='round';
    navIcon(c, n[0], NAVX, ny - 4);
    tw(c, n[0], NAVX + 28, ny, 17, n[1] ? '#e8ecf5' : '#aab3c4', n[1] ? 700 : 500);
  });
  // create pill
  c.fillStyle = '#3b82f6'; rr(c, NAVX - 18, CY + 64 + 7*52 - 8, 188, 46, 23); c.fill();
  tw(c, '+  New post', NAVX + 76, CY + 64 + 7*52 + 21, 16, '#fff', 700, 'center');
  // me chip
  avatar(c, NAVX + 4, SY + SH - 56, 18, '#3c6e8f', '#1d3d52', 'J');
  tw(c, 'Jules Park', NAVX + 32, SY + SH - 60, 14, '#e8ecf5', 700);
  tw(c, '@julespark', NAVX + 32, SY + SH - 42, 13, '#8b95a7');

  // ---- feed column ----
  const FX = SXX + 300, FW = 600;
  // stories strip (sticky top of feed)
  c.fillStyle = '#0d1017';
  // scrollable region
  c.save();
  c.beginPath(); c.rect(FX, CY + 96, FW, SH - 56 - 96); c.clip();
  let fy = CY + 96 - scrollY + 18;
  for (const p of POSTS) fy += drawPostDesktop(c, FX, fy, FW, p);
  c.restore();

  // sticky stories bar over the feed top
  c.fillStyle = 'rgba(13,16,23,0.97)'; c.fillRect(FX, CY, FW, 96);
  c.strokeStyle = '#1b2030'; c.lineWidth = 1; c.beginPath();
  c.moveTo(FX, CY+96); c.lineTo(FX+FW, CY+96); c.stroke();
  const storyCols = [
    ['#feda75','#fa7e1e','#d62976'], ['#4d96ff','#6bcB77'], ['#b983ff','#ff5e5b'],
    ['#ffd93d','#ff6a88'], ['#22c55e','#0ea5e9'], ['#ec4899','#7c3aed'],
  ];
  const names = ['You','mara','field','fable','noon','aurora'];
  storyCols.forEach((cols, i) => {
    const cx = FX + 44 + i * 92, cy = CY + 42;
    ring(c, cx, cy, 26, 3, cols.concat([cols[0]]));
    avatar(c, cx, cy, 21, '#1a2030', '#0e1320', names[i][0].toUpperCase());
    tw(c, names[i], cx, cy + 44, 12, '#aab3c4', 500, 'center');
  });

  // ---- right column ----
  const RX = FX + FW + 36, RW = SXX + SW - RX - 24;
  if (RW > 220) {
    // suggestions card
    c.strokeStyle = '#1b2030'; c.lineWidth = 1; rr(c, RX, CY + 24, RW, 234, 18); c.stroke();
    c.fillStyle = '#0f131c'; rr(c, RX, CY + 24, RW, 234, 18); c.fill();
    tw(c, 'Suggested for you', RX + 20, CY + 56, 16, '#e8ecf5', 700);
    const sug = [['lighthaus','Photography', ['#f59e0b','#b45309']],
                 ['typecraft','Type & Design', ['#22c55e','#15803d']],
                 ['driftcam','Travel film', ['#0ea5e9','#0369a1']]];
    sug.forEach((s2, i) => {
      const ny = CY + 84 + i * 50;
      avatar(c, RX + 36, ny + 8, 18, s2[2][0], s2[2][1], s2[0][0].toUpperCase());
      tw(c, s2[0], RX + 64, ny + 4, 14, '#e8ecf5', 700);
      tw(c, s2[1], RX + 64, ny + 22, 12, '#8b95a7');
      c.fillStyle = '#3b82f6'; rr(c, RX + RW - 86, ny - 6, 70, 28, 14); c.fill();
      tw(c, 'Follow', RX + RW - 51, ny + 13, 12, '#fff', 700, 'center');
    });
    // trends card
    rr(c, RX, CY + 282, RW, 250, 18); c.strokeStyle = '#1b2030'; c.stroke();
    c.fillStyle = '#0f131c'; rr(c, RX, CY + 282, RW, 250, 18); c.fill();
    tw(c, 'Trending now', RX + 20, CY + 314, 16, '#e8ecf5', 700);
    const tr = [['Photography','Golden hour','24.1K posts','#feda75'],
                ['Design','Liquid glass UI','58.7K posts','#b983ff'],
                ['Nature','Aurora season','12.3K posts','#22c55e'],
                ['Tech','On-device AI','101K posts','#0ea5e9']];
    tr.forEach((t2, i) => {
      const ny = CY + 348 + i * 44;
      c.fillStyle = t2[3]; c.beginPath(); c.arc(RX + 24, ny, 4, 0, 7); c.fill();
      tw(c, t2[0], RX + 40, ny - 6, 11, '#8b95a7');
      tw(c, t2[1], RX + 40, ny + 11, 14, '#e8ecf5', 700);
      tw(c, t2[2], RX + RW - 18, ny + 5, 12, '#8b95a7', 400, 'right');
    });
  }
}

function navIcon(c, name, x, y) {
  switch(name) {
    case 'Home': c.beginPath(); c.moveTo(x-9,y+8); c.lineTo(x-9,y-1); c.lineTo(x,y-9); c.lineTo(x+9,y-1); c.lineTo(x+9,y+8); c.stroke(); c.beginPath(); c.moveTo(x-3,y+8); c.lineTo(x-3,y+2); c.lineTo(x+3,y+2); c.lineTo(x+3,y+8); c.stroke(); break;
    case 'Explore': c.beginPath(); c.arc(x-1,y-1,7,0,7); c.stroke(); c.beginPath(); c.moveTo(x+4,y+4); c.lineTo(x+8,y+8); c.stroke(); break;
    case 'Reels': rr(c,x-8,y-8,16,16,4); c.stroke(); c.beginPath(); c.moveTo(x-2,y-3); c.lineTo(x+4,y); c.lineTo(x-2,y+3); c.closePath(); c.stroke(); break;
    case 'Messages': rr(c,x-8,y-7,16,12,5); c.stroke(); c.beginPath(); c.moveTo(x-3,y+5); c.lineTo(x-3,y+9); c.lineTo(x+2,y+5); c.stroke(); break;
    case 'Notifications': c.beginPath(); c.arc(x,y-1,7,Math.PI,0); c.lineTo(x+7,y+5); c.lineTo(x-7,y+5); c.lineTo(x-7,y-1); c.stroke(); c.beginPath(); c.arc(x,y+7.5,2.2,0,7); c.stroke(); break;

  }
}

function drawPostDesktop(c, FX, y, FW, p) {

  avatar(c, AX, y + 26, 22, p.av[0], p.av[1], p.glyph);

  tw(c, p.name, hx, y + 22, 15, '#e8ecf5', 700);
  c.font = '700 15px -apple-system,sans-serif'; hx += c.measureText(p.name).width + 6;
  if (p.verified) { badge(c, hx + 6, y + 17, 7); hx += 18; }
  tw(c, p.handle + ' · ' + p.time, hx + 2, y + 22, 14, '#8b95a7');
  tw(c, '···', card + cw - pad - 8, y + 20, 16, '#8b95a7', 700, 'right');

  let yy = y + 50;
  const lines = wrapLines(c, p.text, cw - pad*2, 15);
  for (const ln of lines) { tw(c, ln, card + pad, yy, 15, '#cdd5e3'); yy += 22; }
  yy += 6;
  // media
  if (p.media) {
    const mw = cw - pad*2, mh = 320;
    photoCard(c, card + pad, yy, mw, mh, p.media);
    // soft inner edge
    c.strokeStyle = 'rgba(255,255,255,.06)'; c.lineWidth = 1; rr(c, card+pad, yy, mw, mh, 18); c.stroke();

}

/* ---------------------------------------------------------------------------
   WEBGL  — the liquid-glass optics + handheld phone-camera post.
   --------------------------------------------------------------------------- */
const VS = `
attribute vec2 aP;
void main(){ gl_Position = vec4(aP, 0.0, 1.0); }`;

const FS = `
precision highp float;
uniform sampler2D uScene;
uniform vec2  uRes, uGlass, uShake, uTilt;
uniform float uR, uTime, uPress, uBlur, uExpo, uRot;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

vec3 scn(vec2 uv){
  return texture2D(uScene, clamp(uv / uRes, vec2(0.002), vec2(0.998))).rgb;
}
/* handheld camera: rotate + slight barrel + shake, in source space */
vec2 cam(vec2 v){
  vec2 cen = uRes * 0.5;
  vec2 p = v - cen;
  float ca = cos(uRot), sa = sin(uRot);
  p = vec2(ca*p.x - sa*p.y, sa*p.x + ca*p.y);
  float rr = dot(p, p) / dot(cen, cen);
  p *= 1.0 + 0.05 * rr;
  return cen + p + uShake;
}
float gband(float x, float c, float w){ float d = (x - c) / w; return exp(-d * d); }

void main(){
  vec2 fc = gl_FragCoord.xy;
  vec2 d  = fc - uGlass;

  /* tilt: viewed at an angle the disc foreshortens into an ellipse */
  float tA = length(uTilt);
  vec2 tD = tA > 0.001 ? uTilt / tA : vec2(1.0, 0.0);
  vec2 pD = vec2(-tD.y, tD.x);
  float squash = 1.0 - 0.42 * tA;
  vec2 ds = tD * (dot(d, tD) / squash) + pD * dot(d, pD);
  float r = length(ds);
  vec2 dir = r > 0.5 ? ds / r : vec2(1.0, 0.0);
  vec2 tdir = vec2(-dir.y, dir.x);
  float x = r / uR;                       // 0 center .. 1 outer rim

  float innerX = 0.80;
  float w    = smoothstep(innerX - 0.05, innerX + 0.03, x);   // rim weight
  float wOut = smoothstep(1.0, 1.07, x);                      // outside weight
  float q = clamp(x / innerX, 0.0, 1.0);

  /* refracted source radius: magnified center, compressed toward the rim */
  float magA = mix(0.40, 0.33, uPress);
  float q5 = q*q*q*q*q;
  float rsG = uR * (magA * q + (1.06 - magA) * q5);
  float asym = 1.0 + 0.38 * tA * dot(dir, tD);
  vec2 refr = dir * mix(rsG, uR * 1.07, w) * asym + uTilt * uR * 0.55;

  /* anisotropic blur (source px) */
  float q4 = q*q*q*q;
  float radial = mix(mix(q4 * uR * 0.14, uR * 0.02, w), 0.0, wOut) + uBlur + 0.7;
  float tang   = mix(mix(q*q*q * uR * 0.05, uR * 0.18, w), 0.0, wOut) + uBlur + 0.7;

  vec2 srcBase = uGlass + mix(refr, d, wOut);
  vec3 col = vec3(0.0);
  #define TAP(rx, ty) col += scn(cam(srcBase + dir * ((rx) * radial) + tdir * ((ty) * tang)));
  TAP( 0.00,  0.00) TAP( 0.62,  0.25) TAP(-0.58,  0.30) TAP( 0.21, -0.64)
  TAP(-0.25, -0.61) TAP( 0.45,  0.68) TAP(-0.70, -0.15) TAP( 0.86, -0.18)
  TAP(-0.41,  0.74) TAP( 0.05,  0.94) TAP(-0.88,  0.35) TAP( 0.33,  0.13)
  TAP(-0.18,  0.20) TAP( 0.69, -0.55)
  col /= 14.0;

  float inG = (1.0 - wOut);          // inside glass (incl. rim)
  float inI = inG * (1.0 - w);       // inner refraction zone only

  /* chromatic aberration, stronger toward the rim & when tilted */
  float caW = 0.55 * smoothstep(0.25, 1.0, x) * (1.0 + 1.4 * tA) * inG;
  caW = min(caW, 0.9);
  if (caW > 0.01) {
    vec3 cR = scn(cam(uGlass + refr * 0.970));
    vec3 cB = scn(cam(uGlass + refr * 1.030));
    col.r = mix(col.r, cR.r, caW);
    col.b = mix(col.b, cB.b, caW);
  }

  /* liquid-glass body: gentle desaturate, lift, cool veil growing outward */
  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(col, vec3(lum), 0.14 * inI);
  col = mix(col, col * 0.9 + vec3(0.06), inG);
  float veil = (0.04 + 0.15 * x * x + 0.06 * uPress) * inI;
  col = mix(col, vec3(0.93, 0.95, 1.0), veil);
  col += inI * 0.05 * (1.0 - x * x);            // soft center bloom

  /* faint radial caustic streaks */
  float th = atan(d.y, d.x);
  float cau = 0.5 * sin(th * 13.0 + 2.0) + 0.5 * sin(th * 29.0 + 0.6) + 0.35 * sin(th * 7.0 - 1.2);
  col += cau * 0.05 * q4 * inI;

  /* rim: dark glass wall + concentric refraction rings + specular arcs */
  float rim = w * (1.0 - wOut);
  col = mix(col, col * 0.34, rim);
  float bands = gband(x, 0.835, 0.018) * 0.85
              + gband(x, 0.920, 0.014) * 0.50
              + gband(x, 0.985, 0.010) * 0.75;
  float arc = pow(max(cos(th - 2.45), 0.0), 6.0)
            + 0.7 * pow(max(cos(th + 0.55), 0.0), 10.0)
            + 0.45 * pow(max(cos(th - 4.30), 0.0), 14.0);
  col += rim * bands * (0.13 + 0.7 * arc);
  col *= mix(1.0, 0.5, rim * gband(x, 1.0, 0.012));            // dark outer lip
  col += inI * 0.16 * gband(x, 0.805, 0.012);                   // bright inner ring

  /* specular window reflection on the dome, upper-left, drifting with tilt */
  vec2 hp = uGlass + vec2(-0.30, 0.40) * uR + uTilt * uR * 0.5;
  vec2 hd = fc - hp;
  col += exp(-dot(hd, hd) / (uR * uR * 0.16)) * (0.16 + 0.08 * uPress) * inG;
  /* a second tiny pin highlight */
  vec2 hp2 = uGlass + vec2(0.34, -0.30) * uR;
  vec2 hd2 = fc - hp2;
  col += exp(-dot(hd2, hd2) / (uR * uR * 0.012)) * 0.28 * inG;

  /* contact shadow hugging the outside + faint caustic ring on the screen */
  col *= 1.0 - (0.30 - 0.10 * uPress) * gband(x, 1.035, 0.045) * wOut;
  col += vec3(0.04, 0.05, 0.08) * gband(x, 1.10, 0.024) * wOut;

  /* ---- phone-camera post ---- */
  col *= uExpo;
  col *= vec3(0.985, 1.0, 1.03);                               // screen-filming WB
  vec2 vc = (fc - uRes * 0.5) / (uRes * 0.5);
  col *= 1.0 - 0.34 * pow(dot(vc, vc) * 0.55, 1.4);            // vignette
  col *= 1.0 + 0.012 * sin(fc.y * 0.07 - uTime * 9.0);         // refresh banding
  col *= 1.0 + 0.008 * sin(fc.x * 0.21 + fc.y * 0.13 + uTime); // faint moiré
  float gn = hash(fc + fract(uTime * 7.0) * 113.0);
  col += (gn - 0.5) * 0.045;                                   // luma grain
  col.r += (hash(fc.yx + 7.7 + fract(uTime * 5.0) * 51.0) - 0.5) * 0.020;
  col.b += (hash(fc + 3.1 + fract(uTime * 3.0) * 77.0) - 0.5) * 0.016;
  col = clamp(col, 0.0, 1.0);
  col = pow(col, vec3(0.97));
  gl_FragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

let prog, buf, aP, U = {}, sceneTex;
if (gl) {
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  aP = gl.getAttribLocation(prog, 'aP');
  gl.enableVertexAttribArray(aP);
  gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);

  for (const n of ['uScene','uRes','uGlass','uShake','uTilt','uR','uTime','uPress','uBlur','uExpo','uRot'])
    U[n] = gl.getUniformLocation(prog, n);

  sceneTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.uniform1i(U.uScene, 0);
}

function uploadScene() {
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, scene);
}

/* ------------------------------------------------------------------- state */
const mouse = { x: 0, y: 0 };
const glass = { x: 0, y: 0 };
const tilt = { x: 0, y: 0 };
const tiltManual = { x: 0, y: 0 };
const tiltVel = { x: 0, y: 0 };
let rightDrag = null;
let pressTarget = 0, press = 0;
let needScene = true;

function resize() {
  W = Math.round(innerWidth * DPR); H = Math.round(innerHeight * DPR);
  glCanvas.width = W; glCanvas.height = H;
  if (gl) gl.viewport(0, 0, W, H);
  layout();
  if (!mouse.x) { mouse.x = innerWidth * 0.5; mouse.y = innerHeight * 0.50; glass.x = W * 0.5; glass.y = H * 0.50; }
  needScene = true;
}
addEventListener('resize', resize);
layout(); resize();

addEventListener('contextmenu', e => e.preventDefault());
addEventListener('pointermove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (rightDrag) {
    tiltManual.x = rightDrag.tx + (e.clientX - rightDrag.x) * 0.0035;
    tiltManual.y = rightDrag.ty + (rightDrag.y - e.clientY) * 0.0035;
    const m = Math.hypot(tiltManual.x, tiltManual.y);
    if (m > 0.5) { tiltManual.x *= 0.5 / m; tiltManual.y *= 0.5 / m; }
  }
});
addEventListener('pointerdown', e => {
  if (e.button === 2) rightDrag = { x: e.clientX, y: e.clientY, tx: tiltManual.x, ty: tiltManual.y };
  else pressTarget = 1;
});
addEventListener('pointerup', e => {
  if (e.button === 2) rightDrag = null;
  else pressTarget = 0;
});
addEventListener('wheel', e => {
  scrollY = Math.max(0, Math.min(SCROLL_MAX, scrollY + e.deltaY * 0.8));
  needScene = true;
}, { passive: true });
// touch scroll (mobile)
let touchY = null;
addEventListener('touchstart', e => { if (e.touches[0]) touchY = e.touches[0].clientY; }, {passive:true});
addEventListener('touchmove', e => {
  if (e.touches[0] != null && touchY != null) {
    scrollY = Math.max(0, Math.min(SCROLL_MAX, scrollY + (touchY - e.touches[0].clientY)));
    touchY = e.touches[0].clientY;
    mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY;
    needScene = true;
  }
}, {passive:true});

setTimeout(() => { const h = document.getElementById('hint'); if (h) h.style.opacity = '0'; }, 5200);

/* autofocus hunts */
let huntT0 = 1800 + Math.random() * 3000;
function focusHunt(now) {
  const dt = now - huntT0;
  if (dt > 900) { huntT0 = now + 2600 + Math.random() * 4800; return 0; }
  if (dt < 0) return 0;
  const ph = dt / 900;
  return Math.sin(ph * Math.PI) * (3.4 + Math.random() * 0.6);
}

function frame(tms) {
  if (!gl) return;
  const t = tms * 0.001;
  if (needScene) { drawScene(); uploadScene(); needScene = false; }

  // glass follows mouse with lag + grip tremor
  const tx = mouse.x * DPR + Math.sin(t * 8.7) * 1.4 * DPR + Math.sin(t * 13.1 + 2.0) * 0.8 * DPR;
  const ty = (innerHeight - mouse.y) * DPR + Math.cos(t * 9.4 + 1.0) * 1.3 * DPR;
  const pgx = glass.x, pgy = glass.y;
  glass.x += (tx - glass.x) * 0.16;
  glass.y += (ty - glass.y) * 0.16;
  press += (pressTarget - press) * 0.09;

  // tilt: leans against motion + manual right-drag
  const vk = -0.010 / DPR;
  tiltVel.x += ((glass.x - pgx) * vk - tiltVel.x) * 0.18;
  tiltVel.y += ((glass.y - pgy) * vk - tiltVel.y) * 0.18;
  if (!rightDrag) { tiltManual.x *= 0.95; tiltManual.y *= 0.95; }
  let ttx = tiltManual.x + tiltVel.x, tty = tiltManual.y + tiltVel.y;
  const tm = Math.hypot(ttx, tty);
  if (tm > 0.55) { ttx *= 0.55 / tm; tty *= 0.55 / tm; }
  tilt.x += (ttx - tilt.x) * 0.12;
  tilt.y += (tty - tilt.y) * 0.12;

  const R = Math.min(W, H) * (isMobile ? 0.40 : 0.345) * (1 + press * 0.06);

  const shx = (Math.sin(t * 1.3) * 2.6 + Math.sin(t * 0.7 + 1.7) * 3.6 + Math.sin(t * 3.1 + 0.5) * 1.1 + Math.sin(t * 7.3) * 0.4) * DPR;
  const shy = (Math.cos(t * 1.1 + 0.4) * 2.9 + Math.sin(t * 0.5 + 2.6) * 4.0 + Math.cos(t * 2.7 + 1.2) * 1.2 + Math.cos(t * 8.1) * 0.4) * DPR;
  const rot = 0.0040 * Math.sin(t * 0.45) + 0.0018 * Math.sin(t * 1.7 + 1.0);

  const blur = Math.max(0.0, 0.9 + 0.8 * Math.sin(t * 0.8) + 0.5 * Math.sin(t * 2.3 + 0.7)) * DPR + focusHunt(tms) * DPR;
  const expo = 1.0 + 0.04 * Math.sin(t * 0.4) + 0.03 * Math.sin(t * 1.1 + 2.2) - press * 0.04;

  gl.uniform2f(U.uRes, W, H);
  gl.uniform2f(U.uGlass, glass.x, glass.y);
  gl.uniform2f(U.uShake, shx, shy);
  gl.uniform2f(U.uTilt, tilt.x, tilt.y);
  gl.uniform1f(U.uR, R);
  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uPress, press);
  gl.uniform1f(U.uBlur, blur);
  gl.uniform1f(U.uExpo, expo);
  gl.uniform1f(U.uRot, rot);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
if (gl) requestAnimationFrame(frame);
</script>
