<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MIURA — breathing paper</title>
<style>
  html,body{margin:0;height:100%;background:#06070c;overflow:hidden;
    font-family:"Helvetica Neue",Arial,sans-serif;cursor:crosshair;}
  #c{display:block;width:100vw;height:100vh;}
  .ui{position:fixed;pointer-events:none;mix-blend-mode:screen;
    color:#dfe6f5;letter-spacing:.28em;text-transform:uppercase;}
  #title{left:34px;top:30px;font-size:13px;font-weight:700;opacity:.9;}
  #sub{left:34px;top:52px;font-size:9.5px;opacity:.42;letter-spacing:.34em;}
  #hint{left:34px;bottom:26px;font-size:9px;opacity:.34;letter-spacing:.3em;line-height:1.9;}
  #read{right:34px;top:30px;font-size:9px;opacity:.4;text-align:right;
    letter-spacing:.22em;line-height:1.85;font-variant-numeric:tabular-nums;}
  @media (max-width:560px){
    #title{font-size:11px;left:20px;top:22px}
    #sub{left:20px;top:40px;font-size:8px}
    #hint{left:20px;bottom:18px;font-size:8px}
    #read{right:20px;top:22px;font-size:8px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title" class="ui">MIURA · ORI</div>
<div id="sub" class="ui">rigid paper tessellation</div>
<div id="read" class="ui"></div>
<div id="hint" class="ui">
  MOVE · fold &amp; light<br>
  SCROLL · orbit · density<br>
  CLICK · ripple
</div>
<script>
(()=>{
"use strict";
const cv = document.getElementById('c');
const g  = cv.getContext('2d');
const readEl = document.getElementById('read');

let W=0,H=0,DPR=1,cx=0,cy=0;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR|0; cv.height = H*DPR|0;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  g.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2; cy=H/2;
}
window.addEventListener('resize',resize); resize();

// ---- input ----
const small = ()=> W<560;
let mx=0.5, my=0.5;            // normalized pointer
let tmx=0.5, tmy=0.5;
let orbit=0, torbit=0;         // camera azimuth from scroll
let density=0;                 // scroll -> grid density morph
let tdensity=0;
window.addEventListener('pointermove',e=>{ tmx=e.clientX/W; tmy=e.clientY/H; },{passive:true});
window.addEventListener('touchmove',e=>{ if(e.touches[0]){tmx=e.touches[0].clientX/W; tmy=e.touches[0].clientY/H;} },{passive:true});
window.addEventListener('wheel',e=>{
  torbit += e.deltaY*0.0016;
  tdensity += e.deltaY*0.0012;
  tdensity = Math.max(-1, Math.min(1, tdensity));
},{passive:true});

// ripples (click) — stored in SHEET space (gi,gj) so the wave rides the paper.
// The frame loop registers the last click's screen pos; the next frame resolves
// it to the nearest grid vertex (it has the projected verts) and bakes gi,gj.
const ripples=[];
let pendingClick=null;
function addRipple(px,py){ pendingClick={x:px,y:py}; }
window.addEventListener('pointerdown',e=>addRipple(e.clientX,e.clientY));

// ---- Miura-ori geometry ----------------------------------------------------
// Parametric rigid-foldable Miura map. Given fold parameter and panel angle,
// vertex (i,j) maps to 3D. Classic closed-form:
//   theta : dihedral fold (0 flat .. ~1 fully folded)
//   alpha : parallelogram acute angle
// We build the lattice analytically so it folds as ONE rigid mechanism.
const ALPHA = 1.05;          // panel acute angle (rad), ~60deg
// Correct rigid-foldable Miura-ori vertex map.
// fold in [0..1]: 0 = nearly flat, 1 = strongly folded.
// theta is the half dihedral angle of the zig-zag columns.
function miuraVertex(i, j, fold){
  const a=1.0, b=1.0;                 // panel edge lengths
  const sa=Math.sin(ALPHA);
  const theta = fold;                 // fold angle (rad), 0..~1.45
  const st=Math.sin(theta), ct=Math.cos(theta);
  // column pitch & relief (zig-zag along X, popping in Z)
  const colPitch = a*ct;             // horizontal advance per column -> shrinks as it folds
  const colRise  = a*st;             // peak height of the zig-zag
  // row geometry: rows advance in Y, with a lateral skew (herringbone) per row
  const rowPitch = b*sa;             // Y advance per row
  const rowSkew  = b*Math.cos(ALPHA)*st; // X offset that alternates per row -> herringbone
  // X: columns laid out + alternating row skew
  const X = i*colPitch + ((j&1)? rowSkew : -rowSkew);
  // Y: straight rows
  const Y = j*rowPitch;
  // Z: classic Miura zig-zag — alternate columns up/down
  const Z = ((i&1)? colRise : -colRise) * 0.5;
  return [X, Y, Z];
}
// Build base lattice scaled & centered.

// ---- 3D helpers ----
function rotY(p,c,s){ return [ p[0]*c + p[2]*s, p[1], -p[0]*s + p[2]*c ]; }
function rotX(p,c,s){ return [ p[0], p[1]*c - p[2]*s, p[1]*s + p[2]*c ]; }

// palette: paper that shifts iridescent under light
function facetColor(shade, hueShift, glow){
  // base warm paper -> cool, plus iridescent edge
  let h = 210 + hueShift*60;
  let s = 38 + glow*30;
  let l = 14 + shade*64 + glow*22;
  l = Math.max(0,Math.min(96,l));
  return 'hsl('+h.toFixed(0)+','+s.toFixed(0)+'%,'+l.toFixed(0)+'%)';
}

let t0=performance.now();
let GX=18, GY=22;   // grid resolution (capped)

function frame(now){
  const dt = Math.min(40, now - (frame._p||now)); frame._p=now;
  const time = (now - t0)*0.001;

  // ease inputs
  mx += (tmx-mx)*0.07;  my += (tmy-my)*0.07;
  orbit += (torbit-orbit)*0.06;
  density += (tdensity-density)*0.05;

  // autonomous breathing fold even with no input
  const breathe = 0.5 + 0.5*Math.sin(time*0.50);
  // pointer X nudges fold (left flat .. right folded); default gentle breathing.
  const userFold = mx;
  // keep theta in a band where facets stay crisp (no edge-on wall blades)
  const theta = 0.30 + 0.55*(breathe*0.5 + userFold*0.5);
  const thetaClamped = Math.max(0.18, Math.min(0.92, theta));

  // grid density morph from scroll
  const dmix = (density+1)/2;
  const gx = Math.round(12 + dmix*16);
  const gy = Math.round(14 + dmix*18);

  // light direction from pointer Y (sweep the highlight up/down the relief)
  const lAng = (mx-0.5)*Math.PI*1.4;
  const lEl  = 0.65 + (0.5-my)*1.1;
  const L = [Math.cos(lAng)*Math.cos(lEl), Math.sin(lEl), Math.sin(lAng)*Math.cos(lEl)];
  const Ln = Math.hypot(L[0],L[1],L[2])||1;
  L[0]/=Ln; L[1]/=Ln; L[2]/=Ln;

  // camera — stable 3/4 bird's-eye. Orbit (scroll) clamped to a gentle band so
  // we never reach edge-on where the zig-zag walls flatten into blades.
  const azBand = 0.42;
  let az = orbit*0.5; az = Math.max(-azBand, Math.min(azBand, az));
  const camAz = az + Math.sin(time*0.12)*0.05;
  const camEl = 0.92 + Math.sin(time*0.08)*0.05;   // high, looking down
  const cay=Math.cos(camAz), say=Math.sin(camAz);
  const cax=Math.cos(camEl), sax=Math.sin(camEl);

  const scale = small()? Math.min(W,H)*0.046 : Math.min(W,H)*0.052;
  const f = small()? 9.0 : 10.0;   // perspective distance

  // --- background : deep gradient + vignette + faint grain glow ---
  const bg = g.createRadialGradient(cx, cy*0.82, 40, cx, cy, Math.max(W,H)*0.75);
  bg.addColorStop(0,'#11141f');
  bg.addColorStop(0.5,'#0a0c14');
  bg.addColorStop(1,'#04050a');
  g.fillStyle=bg; g.fillRect(0,0,W,H);

  // compute lattice of vertices (gx+1)*(gy+1)
  const NX=gx, NY=gy;
  const verts=[];      // projected
  const v3=[];         // 3d
  // centering offsets
  const cxOff=(NX)/2, cyOff=(NY)/2;

  // resolve a pending click into the nearest grid vertex using last frame's
  // projected positions, then bake it as a sheet-space ripple origin (gi,gj).
  if(pendingClick && frame._proj && frame._gx===NX && frame._gy===NY){
    let best=1e18, bi=NX/2, bj=NY/2;
    const P=frame._proj;
    for(let j=0;j<=NY;j++) for(let i=0;i<=NX;i++){
      const k=j*(NX+1)+i, pv=P[k]; if(!pv) continue;
      const dd=(pv[0]-pendingClick.x)**2+(pv[1]-pendingClick.y)**2;
      if(dd<best){best=dd; bi=i; bj=j;}
    }
    ripples.push({gi:bi, gj:bj, t:now});
    if(ripples.length>5) ripples.shift();
  }
  pendingClick=null;

  // active ripples (sheet-space ring waves)
  const rip=[];
  for(const r of ripples){
    const age=(now-r.t)/1000;
    if(age>2.6) continue;
    rip.push(r._a={gi:r.gi, gj:r.gj, age});
  }

  for(let j=0;j<=NY;j++){
    for(let i=0;i<=NX;i++){
      let p = miuraVertex(i-cxOff, j-cyOff, thetaClamped);
      // a slow travelling wave folds it nonuniformly => alive
      const wave = Math.sin((i*0.5 + j*0.32) - time*1.4)*0.10*thetaClamped;
      p[2]+=wave;
      // 3D ring ripple: expanding cosine ring in sheet space, lifts Z
      for(const r of rip){
        const dr=Math.hypot(i-r.gi, j-r.gj);
        const ring=r.age*9.5;                 // expansion speed (cells/sec)
        const w2=Math.exp(-((dr-ring)**2)/3.2);
        p[2]+=Math.cos((dr-ring)*1.4)*w2*0.55*(1-r.age/2.6);
      }
      v3.push(p);
    }
  }

  // project
  let minZ=1e9,maxZ=-1e9;
  for(let k=0;k<v3.length;k++){
    let p=v3[k];
    p=rotY(p,cay,say);
    p=rotX(p,cax,sax);
    const z = p[2];
    const pf = f/(f - z*0.6);          // perspective (gentle, avoids relief blow-up)
    const X = cx + p[0]*scale*pf;
    const Y = cy*0.96 + p[1]*scale*pf;
    if(z<minZ)minZ=z; if(z>maxZ)maxZ=z;
    verts.push([X,Y,z]);
  }

  // stash projected verts + grid size for next frame's click hit-testing
  frame._proj = verts; frame._gx = NX; frame._gy = NY;

  // build facets (quads) with averaged depth for painter sort
  const faces=[];
  const idx=(i,j)=> j*(NX+1)+i;
  for(let j=0;j<NY;j++){
    for(let i=0;i<NX;i++){
      const a=idx(i,j), b=idx(i+1,j), c=idx(i+1,j+1), d=idx(i,j+1);
      const A=v3[a],B=v3[b],C=v3[c],D=v3[d];
      // normal from triangle (A,B,C)
      const u=[B[0]-A[0],B[1]-A[1],B[2]-A[2]];
      const w=[C[0]-A[0],C[1]-A[1],C[2]-A[2]];
      let n=[u[1]*w[2]-u[2]*w[1], u[2]*w[0]-u[0]*w[2], u[0]*w[1]-u[1]*w[0]];
      const nl=Math.hypot(n[0],n[1],n[2])||1; n[0]/=nl;n[1]/=nl;n[2]/=nl;
      // depth = avg z of projected
      const dep=(verts[a][2]+verts[b][2]+verts[c][2]+verts[d][2])*0.25;
      faces.push({a,b,c,d,n,dep,i,j});
    }
  }
  faces.sort((p,q)=>p.dep-q.dep);   // far first

  // draw facets
  g.lineJoin='round';
  for(const fc of faces){
    const A=verts[fc.a],B=verts[fc.b],C=verts[fc.c],D=verts[fc.d];
    // diffuse + a touch of spec via reflection alignment with view (+z)
    let diff = fc.n[0]*L[0]+fc.n[1]*L[1]+fc.n[2]*L[2];
    diff = (diff+1)*0.5;                 // 0..1, see both sides
    const facing = fc.n[2];              // toward camera-ish
    const spec = Math.pow(Math.max(0,diff),6)*Math.max(0,facing*0.5+0.5);
    const shade = 0.22 + diff*0.70;
    // iridescent hue from normal sweep + position + time
    const hueShift = Math.sin(fc.n[0]*2.0 + fc.n[1]*1.3 + time*0.4 + fc.i*0.12)*0.5+0.5;
    const glow = spec;
    // depth fog
    const depthN = (fc.dep-minZ)/Math.max(0.001,(maxZ-minZ));
    const fog = 0.30 + depthN*0.70;

    g.beginPath();
    g.moveTo(A[0],A[1]); g.lineTo(B[0],B[1]); g.lineTo(C[0],C[1]); g.lineTo(D[0],D[1]); g.closePath();

    g.fillStyle=facetColor(shade*fog, (hueShift-0.5)*2, glow*fog);
    g.fill();

    // crease lines = mountain/valley emphasis, brighter on lit facets
    g.strokeStyle='rgba('+(180+spec*70|0)+','+(195+spec*55|0)+',230,'+(0.10+0.22*diff*fog)+')';
    g.lineWidth=0.6;
    g.stroke();
  }

  // specular highlight glints on brightest vertices (sparkle)
  g.globalCompositeOperation='lighter';
  for(const fc of faces){
    const facing=fc.n[2];
    let diff = fc.n[0]*L[0]+fc.n[1]*L[1]+fc.n[2]*L[2];
    diff=(diff+1)*0.5;
    const spec=Math.pow(Math.max(0,diff),9)*Math.max(0,facing*0.5+0.5);
    if(spec>0.45){
      const A=verts[fc.a],C=verts[fc.c];
      const gx2=(A[0]+C[0])/2, gy2=(A[1]+C[1])/2;
      const rr=2+spec*7;
      const gl=g.createRadialGradient(gx2,gy2,0,gx2,gy2,rr);
      gl.addColorStop(0,'rgba(220,235,255,'+(spec*0.5)+')');
      gl.addColorStop(1,'rgba(220,235,255,0)');
      g.fillStyle=gl; g.beginPath(); g.arc(gx2,gy2,rr,0,7); g.fill();
    }
  }
  g.globalCompositeOperation='source-over';

  // vignette
  const vg=g.createRadialGradient(cx,cy,Math.min(W,H)*0.35,cx,cy,Math.max(W,H)*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.55)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);

  // readout
  readEl.innerHTML =
    'FOLD '+(thetaClamped/1.45*100).toFixed(0)+'%<br>'+
    'CELLS '+(NX*NY)+'<br>'+
    'AZ '+((camAz*57.3)%360).toFixed(0)+'&deg;';

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
