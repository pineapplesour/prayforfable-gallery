<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>QUATERNION · 4D Julia Bloom</title>
<style>
  :root{ --ui:rgba(255,255,255,.62); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:#04040a; overflow:hidden;
    font-family:"SF Mono",ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
    -webkit-tap-highlight-color:transparent; cursor:crosshair; }
  #gl{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  /* ---- HUD (overlaid, never a loading gate) ---- */
  .hud{ position:fixed; pointer-events:none; user-select:none; z-index:5;
    color:var(--ui); text-transform:uppercase; letter-spacing:.18em; }
  #title{ top:clamp(16px,3.2vh,30px); left:clamp(16px,3vw,34px); }
  #title h1{ font-size:clamp(13px,1.5vw,17px); font-weight:600; letter-spacing:.42em;
    color:#fff; text-shadow:0 0 18px rgba(140,180,255,.55); }
  #title .sub{ margin-top:7px; font-size:clamp(8.5px,.95vw,10.5px); letter-spacing:.34em;
    color:rgba(180,200,255,.5); }
  #meta{ bottom:clamp(14px,2.6vh,26px); left:clamp(16px,3vw,34px); font-size:9.5px;
    letter-spacing:.26em; line-height:1.85; color:rgba(170,190,240,.42); }
  #meta b{ color:rgba(210,225,255,.78); font-weight:600; }
  #hint{ bottom:clamp(14px,2.6vh,26px); right:clamp(16px,3vw,34px); text-align:right;
    font-size:9px; letter-spacing:.24em; line-height:2; color:rgba(160,180,235,.4); }
  #hint kbd{ display:inline-block; padding:1px 6px; margin:0 1px; border-radius:4px;
    border:1px solid rgba(160,180,255,.28); color:rgba(205,220,255,.82);
    background:rgba(120,150,255,.07); font-size:8.5px; }
  /* readout dial top-right */
  #dial{ top:clamp(16px,3.2vh,30px); right:clamp(16px,3vw,34px); text-align:right;
    font-size:9px; letter-spacing:.2em; line-height:1.95; color:rgba(170,190,240,.5); }
  #dial .v{ color:#cfe0ff; }
  .corner{ position:fixed; width:22px; height:22px; border:1px solid rgba(150,175,255,.22);
    z-index:5; pointer-events:none; }
  .c1{ top:10px; left:10px; border-right:0; border-bottom:0; }
  .c2{ top:10px; right:10px; border-left:0; border-bottom:0; }
  .c3{ bottom:10px; left:10px; border-right:0; border-top:0; }
  .c4{ bottom:10px; right:10px; border-left:0; border-top:0; }
  #flash{ position:fixed; inset:0; z-index:4; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.5), transparent 60%);
    mix-blend-mode:screen; transition:opacity .5s ease; }
  @media (max-width:560px){
    #hint{ display:none; }
    #title h1{ letter-spacing:.3em; }
    #meta{ font-size:8.5px; }
  }
  .fade{ animation:fin 1.4s ease both; }
  @keyframes fin{ from{opacity:0} to{opacity:1} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="flash"></div>
<div class="corner c1"></div><div class="corner c2"></div>
<div class="corner c3"></div><div class="corner c4"></div>

<div class="hud fade" id="title">
  <h1>QUATERNION</h1>
  <div class="sub">4&#8202;D&nbsp; JULIA &nbsp;·&nbsp; LIVE RAYMARCH</div>
</div>
<div class="hud fade" id="dial">
  <div>SLICE&nbsp;&nbsp;<span class="v" id="dW">+0.00</span></div>
  <div>SPIN&nbsp;&nbsp;&nbsp;<span class="v" id="dS">0.30</span></div>
  <div>FPS&nbsp;&nbsp;&nbsp;&nbsp;<span class="v" id="dF">60</span></div>
</div>
<div class="hud fade" id="meta">
  <div><b>QUATERNION JULIA SET</b> · z &#8594; z&#178; + c</div>
  <div>4D &#8594; 3D HYPERPLANE SLICE</div>
  <div id="palName">PALETTE · AURORA</div>
</div>
<div class="hud fade" id="hint">
  <div>MOVE <kbd>MOUSE</kbd> orbit &amp; slice</div>
  <div>HOLD <kbd>DRAG</kbd> warp · <kbd>WHEEL</kbd> zoom</div>
  <div><kbd>SPACE</kbd> auto · <kbd>P</kbd> palette · <kbd>R</kbd> seed</div>
</div>

<script type="x-shader/x-fragment" id="frag">
precision highp float;
varying vec2 vUv;
uniform vec2  uRes;
uniform float uTime;
uniform vec2  uMouse;      // -1..1 (smoothed)
uniform float uZoom;       // camera distance scale
uniform float uWarp;       // 0..1 drag intensity
uniform float uSlice;      // 4th dim offset
uniform float uSpin;       // auto spin amount
uniform vec3  uSeed;       // julia c base
uniform float uPal;        // palette index (float, blended)
uniform float uPix;        // pixel ratio for quality

#define PI 3.14159265359

// ---------- quaternion math ----------
vec4 qmul(vec4 a, vec4 b){
  return vec4(
    a.x*b.x - a.y*b.y - a.z*b.z - a.w*b.w,
    a.x*b.y + a.y*b.x + a.z*b.w - a.w*b.z,
    a.x*b.z - a.y*b.w + a.z*b.x + a.w*b.y,
    a.x*b.w + a.y*b.z - a.z*b.y + a.w*b.x
  );
}
vec4 qsqr(vec4 a){
  return vec4(
    a.x*a.x - a.y*a.y - a.z*a.z - a.w*a.w,
    2.0*a.x*a.y,
    2.0*a.x*a.z,
    2.0*a.x*a.w
  );
}

// quaternion Julia distance estimator (z->z^2+c), with running derivative.
// trap.x = min radius orbit trap, trap.y = smooth escape iteration (fractional)
float qjulia(vec3 p, vec4 c, out vec2 trap){
  vec4 z = vec4(p, uSlice);     // 4th coordinate = the live hyperplane slice
  vec4 dz = vec4(1.0, 0.0, 0.0, 0.0);
  float m2 = dot(z,z);
  float minTrap = 1e9;
  float planeTrap = 1e9;
  float iter = 0.0;
  for(int i=0;i<11;i++){
    dz = 2.0 * qmul(z, dz);          // dz' = 2 z dz
    z  = qsqr(z) + c;
    m2 = dot(z,z);
    minTrap   = min(minTrap, m2);                  // sphere orbit trap (tight bulbs)
    planeTrap = min(planeTrap, abs(z.y)+abs(z.w)); // plane trap -> banding/filaments
    iter += 1.0;
    if(m2 > 256.0) break;
  }
  // smooth fractional escape for crisp color banding
  float sm = iter - log2(max(log2(max(m2,2.0)),1.0));
  trap = vec2( sqrt(minTrap), planeTrap*0.5 + sm*0.04 );
  float dm = sqrt(m2);
  return 0.4 * dm * log(max(dm,1e-6)) / max(length(dz),1e-6);
}

// ---------- palettes (cosine, iq style) ----------
vec3 pal(float t, vec3 a, vec3 b, vec3 c, vec3 d){
  return a + b*cos(6.28318*(c*t + d));
}
vec3 palette(float t, float idx){
  // three palettes blended by idx in [0,3)
  vec3 A = pal(t, vec3(.50,.48,.55), vec3(.52,.50,.50), vec3(1.,1.,1.), vec3(.55,.42,.18));   // aurora: magenta->teal->gold
  vec3 B = pal(t, vec3(.58,.40,.42), vec3(.55,.48,.40), vec3(1.,.95,.85), vec3(.10,.35,.62)); // ember: amber->violet
  vec3 C = pal(t, vec3(.42,.52,.58), vec3(.48,.50,.52), vec3(1.,1.,1.), vec3(.80,.55,.30));   // ice: teal->blue->pink
  float a = clamp(idx,0.,1.);
  float bm = clamp(idx-1.,0.,1.);
  float cm = clamp(idx-2.,0.,1.);
  vec3 col = mix(A,B,a);
  col = mix(col,C,bm);
  col = mix(col,A,cm);
  return col;
}

mat2 rot(float a){ float s=sin(a),c=cos(a); return mat2(c,-s,s,c); }

// soft shadow via DE marching toward light
float softShadow(vec3 ro, vec3 rd, vec4 c){
  float res=1.0; float t=0.02; float ph=1e9;
  for(int i=0;i<20;i++){
    vec2 tr; float h=qjulia(ro+rd*t, c, tr);
    if(h<0.0008) return 0.0;
    float y=h*h/(2.0*ph); float d=sqrt(max(h*h-y*y,0.0));
    res=min(res, 9.0*d/max(t-y,1e-4)); ph=h;
    t+=clamp(h,0.01,0.2);
    if(t>4.0) break;
  }
  return clamp(res,0.0,1.0);
}

vec3 calcNormal(vec3 p, vec4 c){
  vec2 e=vec2(1.0,-1.0)*0.0006;
  vec2 t;
  return normalize(
    e.xyy*qjulia(p+e.xyy,c,t) +
    e.yyx*qjulia(p+e.yyx,c,t) +
    e.yxy*qjulia(p+e.yxy,c,t) +
    e.xxx*qjulia(p+e.xxx,c,t) );
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;

  // ---------- camera ----------
  float az = uMouse.x*1.7 + uTime*uSpin*0.18;
  float el = uMouse.y*0.85;
  // pull camera back on tall/narrow viewports so the object never clips the frame
  float aspect = uRes.x/uRes.y;
  float fit = 1.0 + clamp(1.0/aspect - 0.85, 0.0, 1.4)*0.95;
  float dist = 2.85*uZoom*fit;
  vec3 ro = vec3(
    dist*cos(el)*sin(az),
    dist*sin(el),
    dist*cos(el)*cos(az)
  );
  vec3 ta = vec3(0.0);
  vec3 ww = normalize(ta-ro);
  vec3 uu = normalize(cross(vec3(0.,1.,0.), ww));
  vec3 vv = normalize(cross(ww,uu));
  vec3 rd = normalize(uv.x*uu + uv.y*vv + 1.45*ww);

  // ---------- julia constant (animated) ----------
  float tt = uTime*0.09;
  vec4 c = vec4(
    uSeed.x + 0.05*cos(tt*1.3),
    uSeed.y + 0.05*sin(tt*1.1),
    uSeed.z + 0.05*cos(tt*0.7 + 1.0),
    0.437 + 0.05*sin(tt*0.9) + uWarp*0.16*sin(uTime*1.7)  // w-axis = signature detail
  );

  // ---------- raymarch ----------
  float t = 0.0;
  vec2 trap = vec2(0.0);
  float glow = 0.0;
  bool hit=false;
  vec3 p;
  int steps = uPix > 1.5 ? 90 : 130;   // adapt iteration to dpr/quality
  for(int i=0;i<140;i++){
    if(i>=steps) break;
    p = ro + rd*t;
    vec2 tr;
    float d = qjulia(p, c, tr);
    // thin volumetric haze hugging the surface (not a fog blanket)
    glow += exp(-abs(d)*22.0) * 0.011;
    if(d < 0.00045){ trap=tr; hit=true; break; }
    t += d * (0.55 + 0.25*uWarp);     // tight stepping reveals filament detail
    if(t>6.5) break;
  }

  vec3 col = vec3(0.0);
  // ---------- deep-space background gradient ----------
  vec3 bg = mix(vec3(0.012,0.014,0.035), vec3(0.02,0.05,0.10), smoothstep(-0.6,0.7,uv.y));
  bg += 0.04*palette(0.6+0.3*sin(uTime*0.2), uPal) * (0.5+0.5*uv.y);
  // faint star/grain field
  float star = fract(sin(dot(floor(gl_FragCoord.xy*0.5),vec2(12.99,78.23)))*43758.5);
  bg += step(0.9985, star)*vec3(0.7,0.8,1.0)*0.9;
  col = bg;

  if(hit){
    vec3 n = calcNormal(p, c);
    vec3 lp  = normalize(vec3(0.75,0.85,0.35));
    vec3 lp2 = normalize(vec3(-0.65,0.25,-0.7));
    float dif  = clamp(dot(n,lp),0.0,1.0);
    float dif2 = clamp(dot(n,lp2),0.0,1.0);
    float amb  = 0.5+0.5*n.y;
    float sh   = softShadow(p+n*0.0015, lp, c);
    vec3 hh = normalize(lp - rd);
    float spe  = pow(clamp(dot(n,hh),0.0,1.0), 48.0);
    float fres = pow(1.0-clamp(dot(n,-rd),0.0,1.0), 3.5);

    // ---- color from the two orbit traps -> banded jewel tones ----
    float band = trap.y;                              // filament/iteration banding
    float bulb = clamp(trap.x*0.55, 0.0, 1.0);        // sphere-trap depth
    // spread tone across the FULL hue circle using position + both traps
    float hueSpread = band*3.2 + bulb*1.6 + dot(p,vec3(0.30,0.34,0.26));
    float tone = fract(hueSpread*0.42);               // rich multi-hue cycling
    vec3 base  = palette(tone, uPal);
    vec3 accent= palette(fract(tone+0.42), uPal+0.6); // complementary accent hue

    // occlusion from how deep the orbit fell into the set (deeper -> darker)
    float ao = mix(0.18, 1.0, smoothstep(0.0,1.1,trap.x));

    col  = base * amb * 0.09 * ao;                    // dim ambient
    col += base * dif * (0.85*sh + 0.05) * 0.72;      // key (contrasty)
    col += accent * dif2 * 0.20 * ao;                 // fill (complementary)
    col += mix(base,accent,0.5) * fres * 0.42;        // chromatic rim (carries color)
    col += vec3(1.0,0.92,0.80) * spe * (0.6*sh+0.08) * 0.6; // tamed spec sparkle
    col *= ao;                                        // crush occluded crevices
    col += vec3(1.0,0.42,0.18) * uWarp * fres * 0.7;  // warp heat at edges
  }

  // ---------- thin volumetric glow add (surface-hugging) ----------
  col += palette(0.5+0.3*sin(uTime*0.3), uPal) * glow * (0.8+uWarp*1.6);

  // distance fade to deep space
  col = mix(col, bg, smoothstep(4.0,6.5,t));

  // ---------- post ----------
  // vignette
  vec2 q = gl_FragCoord.xy/uRes;
  float vig = pow(16.0*q.x*q.y*(1.0-q.x)*(1.0-q.y), 0.28);
  col *= mix(0.45,1.0,vig);
  // exposure pull-down before tonemap (keeps highlights from blooming flat)
  col *= 0.78;
  // tonemap (aces-ish)
  col = (col*(2.51*col+0.03))/(col*(2.43*col+0.59)+0.14);
  // saturation lift for jewel tones
  float l = dot(col, vec3(0.299,0.587,0.114));
  col = mix(vec3(l), col, 1.28);
  col = pow(max(col,0.0), vec3(0.4545));
  // film grain
  float g = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233))+uTime)*43758.5);
  col += (g-0.5)*0.018;

  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
(function(){
  "use strict";
  const cv = document.getElementById('gl');
  const gl = cv.getContext('webgl', {antialias:false, alpha:false,
    powerPreference:'high-performance', preserveDrawingBuffer:true});
  if(!gl){ document.body.innerHTML = '<div style="color:#fff;font-family:monospace;padding:40px">WebGL not available.</div>'; return; }

  // ---- shaders ----
  const VS = "attribute vec2 p; varying vec2 vUv; void main(){ vUv=p*0.5+0.5; gl_Position=vec4(p,0.,1.); }";
  const FS = document.getElementById('frag').textContent;

  function sh(type, src){
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      console.error('shader error:', gl.getShaderInfoLog(s)); throw new Error(gl.getShaderInfoLog(s));
    }
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
    console.error('link error:', gl.getProgramInfoLog(prog)); throw new Error('link');
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  ['uRes','uTime','uMouse','uZoom','uWarp','uSlice','uSpin','uSeed','uPal','uPix']
    .forEach(n=> U[n]=gl.getUniformLocation(prog,n));

  // ---- state ----
  const ST = {
    res:[1,1], pr:1,
    mouse:[0,0], mTarget:[0,0],
    zoom:1.0, zoomT:1.0,
    warp:0.0, warpT:0.0,
    slice:0.0, sliceT:0.0,
    spin:0.30,
    pal:0.0, palT:0.0,
    seed:[ -0.291, -0.399, 0.339 ],
    auto:true,
    dragging:false,
    lastX:0, lastY:0
  };
  const PAL_NAMES = ['AURORA','EMBER','ICE','AURORA'];

  // ---- resize with dpr cap (performance) ----
  function resize(){
    const w = cv.clientWidth, h = cv.clientHeight;
    // cap pixel ratio; lower on large viewports for 60fps
    let pr = Math.min(window.devicePixelRatio||1, 2);
    const px = w*pr*h*pr;
    if(px > 2400*1400) pr = Math.min(pr, 1.5);   // big screens -> lighter
    if(px > 3600*2000) pr = Math.min(pr, 1.25);
    const W = Math.max(2, Math.floor(w*pr)), H = Math.max(2, Math.floor(h*pr));
    if(cv.width!==W || cv.height!==H){
      cv.width=W; cv.height=H;
    }
    ST.res=[W,H]; ST.pr=pr;
    gl.viewport(0,0,W,H);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- input ----
  function setMouseFromXY(x,y){
    const w=cv.clientWidth, h=cv.clientHeight;
    ST.mTarget[0] = (x/w)*2-1;
    ST.mTarget[1] = -((y/h)*2-1);
    ST.sliceT = ST.mTarget[1]*0.9;          // vertical also drives 4D slice
  }
  cv.addEventListener('pointermove', e=>{
    setMouseFromXY(e.clientX, e.clientY);
    if(ST.dragging){
      ST.warpT = 1.0;
      ST.auto = false;
    }
  }, {passive:true});
  cv.addEventListener('pointerdown', e=>{
    ST.dragging=true; ST.warpT=1.0; ST.lastX=e.clientX; ST.lastY=e.clientY;
    cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  });
  window.addEventListener('pointerup', ()=>{ ST.dragging=false; ST.warpT=0.0; });
  cv.addEventListener('wheel', e=>{
    e.preventDefault();
    ST.zoomT = Math.min(2.6, Math.max(0.45, ST.zoomT * (1 + (e.deltaY>0?0.08:-0.08))));
  }, {passive:false});

  // pinch zoom (touch)
  let pinch0=0, pinchZ=1;
  cv.addEventListener('touchstart', e=>{
    if(e.touches.length===2){
      pinch0 = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      pinchZ = ST.zoomT;
    }
  }, {passive:true});
  cv.addEventListener('touchmove', e=>{
    if(e.touches.length===2 && pinch0>0){
      const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      ST.zoomT = Math.min(2.6, Math.max(0.45, pinchZ * (pinch0/Math.max(d,1))));
    }
  }, {passive:true});

  function cyclePalette(){
    ST.palT = (Math.round(ST.palT)+1) % 3;
    document.getElementById('palName').textContent = 'PALETTE · ' + PAL_NAMES[Math.round(ST.palT)%3];
  }
  function reseed(){
    ST.seed = [ rnd(-0.8,0.6), rnd(-0.2,0.8), rnd(-0.4,0.4) ];
    flash();
  }
  function rnd(a,b){ return a + Math.random()*(b-a); }
  function flash(){
    const f=document.getElementById('flash'); f.style.opacity='0.9';
    setTimeout(()=>f.style.opacity='0', 60);
  }
  window.addEventListener('keydown', e=>{
    const k=e.key.toLowerCase();
    if(k===' '){ e.preventDefault(); ST.auto=!ST.auto; }
    else if(k==='p'){ cyclePalette(); }
    else if(k==='r'){ reseed(); }
  });
  // expose for verification / external drive
  window.__quat = {
    setMouse:(nx,ny)=>{ ST.mTarget[0]=nx; ST.mTarget[1]=ny; ST.sliceT=ny*0.9; },
    palette:cyclePalette, reseed, zoom:(z)=>{ST.zoomT=z;},
    warp:(w)=>{ST.warpT=w;}, auto:(b)=>{ST.auto=b;},
    state:()=>({ mouse:ST.mouse.slice(), slice:ST.slice, zoom:ST.zoom, warp:ST.warp,
      pal:Math.round(ST.palT), seed:ST.seed.slice(), spin:ST.spin, auto:ST.auto })
  };

  // ---- render loop ----
  const t0 = performance.now();
  let fpsEMA = 60, lastT = t0, frame=0;
  const dW=document.getElementById('dW'), dS=document.getElementById('dS'),
        dF=document.getElementById('dF');

  function lerp(a,b,t){ return a + (b-a)*t; }

  function loop(now){
    const dt = Math.min(0.05, (now-lastT)/1000); lastT=now;
    // fps
    const inst = 1/Math.max(dt,1e-4);
    fpsEMA = fpsEMA*0.92 + inst*0.08;

    // smoothing
    ST.mouse[0]=lerp(ST.mouse[0], ST.mTarget[0], 0.07);
    ST.mouse[1]=lerp(ST.mouse[1], ST.mTarget[1], 0.07);
    ST.slice  = lerp(ST.slice,  ST.sliceT, 0.05);
    ST.zoom   = lerp(ST.zoom,   ST.zoomT, 0.09);
    ST.warp   = lerp(ST.warp,   ST.warpT, ST.warpT>ST.warp?0.18:0.06);
    ST.pal    = lerp(ST.pal,    ST.palT, 0.06);

    // when idle (auto) gently drift slice for a living feel
    if(ST.auto){
      ST.sliceT = 0.55*Math.sin((now-t0)*0.00022);
      const drift = 0.6*Math.sin((now-t0)*0.00009);
      ST.mTarget[0] = lerp(ST.mTarget[0], drift, 0.01);
      ST.mTarget[1] = lerp(ST.mTarget[1], 0.18*Math.sin((now-t0)*0.00013), 0.01);
    }

    const tsec = (now - t0)/1000;
    gl.uniform2f(U.uRes, ST.res[0], ST.res[1]);
    gl.uniform1f(U.uTime, tsec);
    gl.uniform2f(U.uMouse, ST.mouse[0], ST.mouse[1]);
    gl.uniform1f(U.uZoom, ST.zoom);
    gl.uniform1f(U.uWarp, ST.warp);
    gl.uniform1f(U.uSlice, ST.slice);
    gl.uniform1f(U.uSpin, ST.spin);
    gl.uniform3f(U.uSeed, ST.seed[0], ST.seed[1], ST.seed[2]);
    gl.uniform1f(U.uPal, ST.pal);
    gl.uniform1f(U.uPix, ST.pr);

    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // HUD readout (throttled)
    if((frame++ & 7)===0){
      dW.textContent = (ST.slice>=0?'+':'') + ST.slice.toFixed(2);
      dS.textContent = (ST.auto? ST.spin.toFixed(2) : '0.00');
      dF.textContent = Math.round(fpsEMA);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
