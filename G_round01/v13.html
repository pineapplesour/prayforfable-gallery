<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Habit Tracker — Liquid Glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&display=swap" rel="stylesheet" />
<style>
  :root{
    --liquid: 22;          /* blur px, driven by slider */
    --sat: 1.35;           /* saturate, driven by slider */
    --ink: #f3f6ff;
    --ink-rgb: 255,255,255;
    --accent: #7ee0c0;     /* mint */
    --accent2: #8ab4ff;    /* periwinkle */
    --warn: #ffd27a;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0;
    min-height:100%;
    background:#000;
    font-family:"Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  /* deep black scene with faint colored nebula so the glass has something to refract */
  body{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
    overflow-x:hidden;
  }
  .scene-bg{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:#000;
  }
  .scene-bg::before,
  .scene-bg::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:.55;
  }
  .scene-bg::before{
    width:42vw; height:42vw;
    left:8vw; top:14vh;
    background:radial-gradient(circle at 30% 30%, rgba(126,224,192,.55), rgba(126,224,192,0) 70%);
  }
  .scene-bg::after{
    width:46vw; height:46vw;
    right:6vw; bottom:6vh;
    background:radial-gradient(circle at 60% 40%, rgba(138,180,255,.5), rgba(138,180,255,0) 70%);
  }
  /* moving mouse-follow ambient light that the card refracts */
  .scene-glow{
    position:fixed;
    width:520px; height:520px;
    left:0; top:0;
    z-index:0;
    pointer-events:none;
    transform:translate3d(-50%,-50%,0);
    background:radial-gradient(circle, rgba(190,150,255,.30), rgba(190,150,255,0) 65%);
    transition:opacity .4s ease;
    opacity:0;
    will-change:transform;
  }

  /* ----------------------------------------------------------- card */
  .stage{
    position:relative;
    z-index:2;
    perspective:1400px;
    width:min(420px, 100%);
  }
  #card{
    position:relative;
    border-radius:34px;
    padding:30px 28px 26px;
    background:
      linear-gradient(165deg, rgba(255,255,255,.10), rgba(255,255,255,.02) 55%),
      rgba(18,20,26,.34);
    border:1px solid rgba(var(--ink-rgb),.16);
    box-shadow:
      0 34px 80px -20px rgba(0,0,0,.85),
      0 12px 30px -12px rgba(0,0,0,.7),
      inset 0 1px 0 rgba(255,255,255,.28),
      inset 0 0 0 1px rgba(255,255,255,.04);
    backdrop-filter: blur(calc(var(--liquid)*1px)) saturate(var(--sat));
    -webkit-backdrop-filter: blur(calc(var(--liquid)*1px)) saturate(var(--sat));
    transform-style:preserve-3d;
    transition:transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .3s ease;
    will-change:transform;
  }
  /* moving specular highlight that tracks the cursor (the "liquid" shimmer) */
  #card .sheen{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    pointer-events:none;
    background:radial-gradient(
      240px circle at var(--mx,30%) var(--my,0%),
      rgba(255,255,255,.20),
      rgba(255,255,255,.06) 35%,
      transparent 60%);
    mix-blend-mode:screen;
    opacity:.9;
    transition:opacity .3s ease;
  }
  /* top edge liquid rim light */
  #card .rim{
    position:absolute; inset:0;
    border-radius:inherit;
    pointer-events:none;
    background:
      linear-gradient(180deg, rgba(255,255,255,.14), transparent 18%),
      linear-gradient(0deg, rgba(255,255,255,.05), transparent 22%);
    mix-blend-mode:screen;
  }
  .card-inner{ position:relative; z-index:3; transform:translateZ(40px); }

  /* ---- header ---- */
  .head{
    display:flex; align-items:center; gap:14px;
    margin-bottom:22px;
  }
  .ring{
    position:relative;
    width:58px; height:58px;
    flex:0 0 auto;
    border-radius:50%;
    display:grid; place-items:center;
    background:
      conic-gradient(var(--accent) 0 78%, rgba(255,255,255,.10) 78% 100%);
    box-shadow:0 8px 20px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.14);
  }
  .ring::after{
    content:"";
    position:absolute; inset:5px;
    border-radius:50%;
    background:rgba(14,16,22,.72);
    backdrop-filter:blur(8px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
  }
  .ring b{
    position:relative; z-index:1;
    font-size:15px; font-weight:800; letter-spacing:.3px;
    color:var(--accent);
  }
  .head .who{ flex:1; min-width:0; }
  .head .who h1{
    margin:0;
    font-size:21px; font-weight:800; letter-spacing:-.2px;
    line-height:1.15;
  }
  .head .who p{
    margin:3px 0 0;
    font-size:13px; font-weight:600;
    color:rgba(var(--ink-rgb),.62);
  }
  .head .day{
    text-align:right;
    flex:0 0 auto;
  }
  .head .day .n{
    font-size:24px; font-weight:800; line-height:1;
    background:linear-gradient(120deg, var(--accent), var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .head .day .s{
    font-size:11px; font-weight:700; letter-spacing:1.4px;
    text-transform:uppercase;
    color:rgba(var(--ink-rgb),.55);
    margin-top:3px;
  }

  /* ---- stat tiles (floating glass) ---- */
  .stats{ display:flex; gap:11px; margin-bottom:20px; }
  .stat{
    flex:1;
    border-radius:18px;
    padding:13px 8px 11px;
    text-align:center;
    border:1px solid rgba(var(--ink-rgb),.14);
    background:
      linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.02));
    box-shadow:
      0 10px 22px -12px rgba(0,0,0,.7),
      inset 0 1px 0 rgba(255,255,255,.22);
    backdrop-filter:blur(calc(var(--liquid)*.5px)) saturate(var(--sat));
    -webkit-backdrop-filter:blur(calc(var(--liquid)*.5px)) saturate(var(--sat));
  }
  .stat .num{
    font-size:23px; font-weight:800; line-height:1.05;
  }
  .stat .num .u{ font-size:13px; font-weight:700; opacity:.7; margin-left:1px; }
  .stat .lbl{
    font-size:11px; font-weight:700; letter-spacing:.4px;
    margin-top:4px;
    color:rgba(var(--ink-rgb),.6);
  }

  /* ---- weekly heat row ---- */
  .section-title{
    display:flex; justify-content:space-between; align-items:baseline;
    margin:0 2px 11px;
  }
  .section-title .t{ font-size:13px; font-weight:800; letter-spacing:.3px; }
  .section-title .v{ font-size:12px; font-weight:700; color:rgba(var(--ink-rgb),.55); }

  .week{
    display:flex; gap:7px; margin-bottom:20px;
  }
  .day-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:7px; }
  .cell{
    width:100%;
    aspect-ratio:1/1;
    border-radius:11px;
    border:1px solid rgba(var(--ink-rgb),.10);
    background:rgba(255,255,255,.04);
    position:relative;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
  }
  .cell.lv1{ background:rgba(126,224,192,.22); border-color:rgba(126,224,192,.3); }
  .cell.lv2{ background:rgba(126,224,192,.45); border-color:rgba(126,224,192,.5); }
  .cell.lv3{
    background:rgba(126,224,192,.78);
    border-color:rgba(126,224,192,.9);
    box-shadow:0 0 14px rgba(126,224,192,.45), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .day-col span{ font-size:10px; font-weight:700; color:rgba(var(--ink-rgb),.5); }

  /* ---- habit list ---- */
  .habits{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
  .habit{
    display:flex; align-items:center; gap:13px;
    padding:12px 14px;
    border-radius:17px;
    border:1px solid rgba(var(--ink-rgb),.12);
    background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.015));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 8px 18px -14px rgba(0,0,0,.8);
    cursor:pointer;
    transition:transform .16s ease, background .2s ease, border-color .2s ease;
  }
  .habit:hover{ transform:translateY(-1px); border-color:rgba(var(--ink-rgb),.22); }
  .habit .ic{
    width:38px; height:38px; flex:0 0 auto;
    border-radius:12px;
    display:grid; place-items:center;
    font-size:18px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
  }
  .habit .meta{ flex:1; min-width:0; }
  .habit .meta .nm{ font-size:14.5px; font-weight:700; }
  .habit .meta .sub{
    font-size:11.5px; font-weight:600; margin-top:2px;
    color:rgba(var(--ink-rgb),.55);
    display:flex; align-items:center; gap:6px;
  }
  .flame{ color:var(--warn); }
  /* progress bar */
  .habit .bar{
    width:62px; flex:0 0 auto; height:6px; border-radius:999px;
    background:rgba(255,255,255,.10);
    overflow:hidden;
    box-shadow:inset 0 1px 1px rgba(0,0,0,.4);
  }
  .habit .bar i{
    display:block; height:100%; border-radius:999px;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow:0 0 8px rgba(126,224,192,.6);
  }
  /* check toggle */
  .check{
    width:30px; height:30px; flex:0 0 auto;
    border-radius:50%;
    border:1.5px solid rgba(var(--ink-rgb),.30);
    background:rgba(255,255,255,.04);
    display:grid; place-items:center;
    transition:all .18s ease;
    color:transparent;
  }
  .habit.done .check{
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    border-color:transparent;
    color:#05130e;
    box-shadow:0 4px 14px rgba(126,224,192,.5);
  }
  .check svg{ width:15px; height:15px; }
  .habit.done .meta .nm{ opacity:.85; }

  /* ---- liquidness slider ---- */
  .liquid-ctrl{
    border-top:1px solid rgba(var(--ink-rgb),.10);
    padding-top:18px;
  }
  .liquid-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:10px;
  }
  .liquid-head .t{ font-size:12px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; color:rgba(var(--ink-rgb),.7); }
  .liquid-head .v{ font-size:12px; font-weight:800; color:var(--accent); }
  input[type="range"]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:22px; background:transparent; cursor:pointer; margin:0;
  }
  input[type="range"]::-webkit-slider-runnable-track{
    height:5px; border-radius:999px;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:20px; height:20px; border-radius:50%;
    background:#fff; margin-top:-7.5px;
    box-shadow:0 3px 12px rgba(0,0,0,.55), 0 0 0 5px rgba(126,224,192,.18);
    border:0;
  }
  input[type="range"]::-moz-range-track{ height:5px; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  input[type="range"]::-moz-range-thumb{ width:20px; height:20px; border-radius:50%; background:#fff; border:0; box-shadow:0 3px 12px rgba(0,0,0,.55), 0 0 0 5px rgba(126,224,192,.18); }

  /* ----------------------------------------------------------- responsive */
  @media (max-width:430px){
    body{ padding:26px 14px; }
    .stage{ width:100%; }
    #card{ padding:24px 20px 22px; border-radius:28px; }
    .head .who h1{ font-size:19px; }
    .stat .num{ font-size:20px; }
    .week{ gap:5px; }
    .habit .bar{ display:none; }
  }
  @media (prefers-reduced-motion:reduce){
    #card, .habit{ transition:none; }
  }
</style>
</head>
<body>
  <div class="scene-bg"></div>
  <div class="scene-glow" id="glow"></div>

  <div class="stage">
    <div id="card">
      <div class="sheen" id="sheen"></div>
      <div class="rim"></div>
      <div class="card-inner">

        <!-- header -->
        <div class="head">
          <div class="ring"><b>78%</b></div>
          <div class="who">
            <h1>오늘의 습관</h1>
            <p>월요일 · 6월 22일</p>
          </div>
          <div class="day">
            <div class="n">42</div>
            <div class="s">Day Streak</div>
          </div>
        </div>

        <!-- stat tiles -->
        <div class="stats">
          <div class="stat">
            <div class="num">5<span class="u">/7</span></div>
            <div class="lbl">완료</div>
          </div>
          <div class="stat">
            <div class="num">42<span class="u">d</span></div>
            <div class="lbl">연속</div>
          </div>
          <div class="stat">
            <div class="num">312</div>
            <div class="lbl">총 완료</div>
          </div>
        </div>

        <!-- weekly heat -->
        <div class="section-title">
          <span class="t">이번 주 기록</span>
          <span class="v">19/21 완료</span>
        </div>
        <div class="week" id="week"></div>

        <!-- habit list -->
        <div class="section-title">
          <span class="t">습관</span>
          <span class="v">탭하여 완료</span>
        </div>
        <div class="habits" id="habits"></div>

        <!-- liquidness slider -->
        <div class="liquid-ctrl">
          <div class="liquid-head">
            <span class="t">Liquidness</span>
            <span class="v" id="liqVal">22</span>
          </div>
          <input type="range" id="liq" min="0" max="40" value="22" step="1" aria-label="Liquidness" />
        </div>

      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  // ---- mock data ----
  var week = [
    {d:"월", lv:3}, {d:"화", lv:2}, {d:"수", lv:3}, {d:"목", lv:3},
    {d:"금", lv:1}, {d:"토", lv:2}, {d:"일", lv:0}
  ];
  var habits = [
    {ic:"💧", nm:"물 2L 마시기",     sub:"1,640 ml / 2,000 ml", streak:21, pct:82,  done:true },
    {ic:"🏃", nm:"30분 러닝",        sub:"오늘 3.4 km 달림",      streak:42, pct:100, done:true },
    {ic:"📖", nm:"20쪽 독서",        sub:"» 아토믹 해빗",     streak:12, pct:55,  done:false},
    {ic:"🧘", nm:"명상 10분",        sub:"저녁 루틴",             streak:7,  pct:0,   done:false},
    {ic:"💤", nm:"23:30 취침",       sub:"어제 7h 12m 수면",      streak:9,  pct:70,  done:true }
  ];

  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

  // ---- render weekly heat ----
  var wEl = document.getElementById("week");
  week.forEach(function(c){
    var col = document.createElement("div");
    col.className = "day-col";
    var cell = document.createElement("div");
    cell.className = "cell" + (c.lv>0 ? " lv"+c.lv : "");
    var lab = document.createElement("span");
    lab.textContent = c.d;
    col.appendChild(cell); col.appendChild(lab);
    wEl.appendChild(col);
  });

  // ---- render habits ----
  var hEl = document.getElementById("habits");
  habits.forEach(function(h){
    var row = document.createElement("div");
    row.className = "habit" + (h.done ? " done" : "");
    row.innerHTML =
      '<div class="ic">'+h.ic+'</div>'+
      '<div class="meta">'+
        '<div class="nm">'+h.nm+'</div>'+
        '<div class="sub"><span class="flame">🔥 '+h.streak+'일</span> · '+h.sub+'</div>'+
      '</div>'+
      '<div class="bar"><i style="width:'+h.pct+'%"></i></div>'+
      '<div class="check">'+CHECK+'</div>';
    row.addEventListener("click", function(){
      row.classList.toggle("done");
    });
    hEl.appendChild(row);
  });

  // ---- liquidness slider ----
  var liq = document.getElementById("liq");
  var liqVal = document.getElementById("liqVal");
  var root = document.documentElement;
  function applyLiquid(){
    var v = parseInt(liq.value, 10);
    root.style.setProperty("--liquid", v);
    root.style.setProperty("--sat", (1 + v*0.022).toFixed(3));
    liqVal.textContent = v;
  }
  liq.addEventListener("input", applyLiquid);
  applyLiquid();

  // ---- mouse-follow glow + tilt ----
  var card = document.getElementById("card");
  var sheen = document.getElementById("sheen");
  var glow = document.getElementById("glow");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  document.addEventListener("pointermove", function(e){
    glow.style.opacity = "1";
    glow.style.transform = "translate3d("+(e.clientX)+"px,"+(e.clientY)+"px,0) translate(-50%,-50%)";
  });

  function onMove(e){
    var r = card.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width;   // 0..1
    var py = (e.clientY - r.top) / r.height;   // 0..1
    sheen.style.setProperty("--mx", (px*100).toFixed(1)+"%");
    sheen.style.setProperty("--my", (py*100).toFixed(1)+"%");
    if(reduce) return;
    var rx = (0.5 - py) * 10;   // tilt degrees
    var ry = (px - 0.5) * 12;
    card.style.transform = "rotateX("+rx.toFixed(2)+"deg) rotateY("+ry.toFixed(2)+"deg)";
  }
  function reset(){
    card.style.transform = "rotateX(0deg) rotateY(0deg)";
    sheen.style.opacity = ".6";
  }
  card.addEventListener("pointermove", function(e){ sheen.style.opacity=".9"; onMove(e); });
  card.addEventListener("pointerleave", reset);
})();
</script>
</body>
</html>
