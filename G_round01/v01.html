<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liquid Glass · Profile Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    /* liquidness driven variables (updated by slider) */
    --blur: 26px;
    --sat: 1.35;
    --tint: 0.085;
    --rim: 0.42;
    --glow: 0.55;
    --radius: 30px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    background: #000;
    color: rgba(255, 255, 255, 0.92);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    position: relative;
    padding: 48px 24px;
  }

  /* ---------- ambient liquid background behind the glass ---------- */
  .ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: calc(0.55 * var(--glow) + 0.18);
    mix-blend-mode: screen;
    will-change: transform;
  }
  .blob.b1 {
    width: 560px; height: 560px;
    background: radial-gradient(circle at 30% 30%, #6d5cff, #2a1d8a 60%, transparent 72%);
    top: 8%; left: 12%;
    animation: drift1 18s ease-in-out infinite;
  }
  .blob.b2 {
    width: 620px; height: 620px;
    background: radial-gradient(circle at 60% 40%, #00d4ff, #0066aa 58%, transparent 72%);
    bottom: 2%; right: 8%;
    animation: drift2 22s ease-in-out infinite;
  }
  .blob.b3 {
    width: 480px; height: 480px;
    background: radial-gradient(circle at 50% 50%, #ff5c9d, #8a1d5e 60%, transparent 72%);
    top: 42%; left: 46%;
    animation: drift3 26s ease-in-out infinite;
  }
  @keyframes drift1 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(70px,40px) scale(1.12); }
  }
  @keyframes drift2 {
    0%,100% { transform: translate(0,0) scale(1.05); }
    50% { transform: translate(-60px,-50px) scale(0.95); }
  }
  @keyframes drift3 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(40px,-60px) scale(1.1); }
  }
  /* subtle film grain / vignette to deepen the black */
  .ambient::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
  }

  /* ---------- stage / tilt wrapper ---------- */
  .stage {
    position: relative;
    z-index: 2;
    perspective: 1400px;
    width: 100%;
    max-width: 420px;
  }

  /* mouse-follow glow that rides under the cursor inside the card */
  .card-tilt {
    transform-style: preserve-3d;
    transition: transform 0.18s cubic-bezier(.2,.7,.2,1);
    will-change: transform;
  }

  /* ---------- the glass profile card ---------- */
  .card {
    position: relative;
    border-radius: var(--radius);
    padding: 30px 28px 26px;
    background:
      linear-gradient(160deg, rgba(255,255,255,calc(var(--tint) + 0.05)) 0%, rgba(255,255,255,var(--tint)) 42%, rgba(255,255,255,calc(var(--tint) * 0.55)) 100%);
    border: 1px solid rgba(255,255,255,var(--rim));
    box-shadow:
      0 40px 90px rgba(0,0,0,0.55),
      0 12px 30px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,calc(var(--rim) + 0.18)),
      inset 0 -1px 0 rgba(255,255,255,0.05);
    backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    overflow: hidden;
    isolation: isolate;
  }
  /* top sheen / specular streak */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 46%;
    background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 100%);
    opacity: 0.7;
    pointer-events: none;
    z-index: 0;
  }
  /* cursor glow */
  .card .cursor-glow {
    position: absolute;
    width: 360px; height: 360px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,calc(0.16 * var(--glow) + 0.04)), transparent 65%);
    transform: translate(-50%, -50%);
    left: 50%; top: 0%;
    pointer-events: none;
    z-index: 0;
    transition: opacity 0.3s ease;
    opacity: 0;
    mix-blend-mode: screen;
  }
  .card:hover .cursor-glow { opacity: 1; }

  .card > * { position: relative; z-index: 1; }

  /* ---------- header: avatar + identity ---------- */
  .head { display: flex; align-items: center; gap: 16px; }
  .avatar-wrap {
    position: relative;
    flex: 0 0 auto;
    width: 78px; height: 78px;
    transform: translateZ(40px);
  }
  .avatar {
    width: 78px; height: 78px;
    border-radius: 22px;
    object-fit: cover;
    border: 1.5px solid rgba(255,255,255,0.5);
    box-shadow: 0 10px 24px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.5);
    display: block;
  }
  .avatar-ring {
    position: absolute;
    inset: -5px;
    border-radius: 26px;
    background: conic-gradient(from 140deg, #6d5cff, #00d4ff, #ff5c9d, #6d5cff);
    filter: blur(7px);
    opacity: calc(0.6 * var(--glow) + 0.2);
    z-index: -1;
    animation: spin 9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-dot {
    position: absolute;
    right: -3px; bottom: -3px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #2bd97c;
    border: 3px solid rgba(20,20,24,0.9);
    box-shadow: 0 0 10px rgba(43,217,124,0.8);
  }
  .identity { min-width: 0; transform: translateZ(28px); }
  .name {
    font-size: 22px; font-weight: 800; letter-spacing: -0.02em;
    color: #fff;
    line-height: 1.1;
    display: flex; align-items: center; gap: 7px;
  }
  .verified {
    width: 17px; height: 17px; flex: 0 0 auto;
    color: #4cc2ff;
    filter: drop-shadow(0 0 5px rgba(76,194,255,0.5));
  }
  .handle {
    font-size: 13.5px; font-weight: 500;
    color: rgba(255,255,255,0.6);
    margin-top: 3px;
  }
  .role {
    margin-top: 7px;
    display: inline-block;
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    padding: 4px 10px;
    border-radius: 999px;
    color: rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.22);
  }

  .bio {
    margin-top: 18px;
    font-size: 13.5px; line-height: 1.55;
    color: rgba(255,255,255,0.72);
  }

  /* ---------- floating stat tiles ---------- */
  .stats {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .tile {
    transform: translateZ(22px);
    border-radius: 16px;
    padding: 12px 8px 11px;
    text-align: center;
    background: linear-gradient(160deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow:
      0 10px 24px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.3);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s;
  }
  .tile:hover {
    transform: translateZ(40px) translateY(-2px);
    border-color: rgba(255,255,255,0.4);
    box-shadow: 0 16px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.45);
  }
  .tile .num {
    font-size: 19px; font-weight: 800; color: #fff; letter-spacing: -0.02em;
    line-height: 1;
  }
  .tile .lab {
    font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    margin-top: 6px;
  }

  /* ---------- skill bars ---------- */
  .skills { margin-top: 22px; transform: translateZ(16px); }
  .skill-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 13px; }
  .skill-row:last-child { margin-bottom: 0; }
  .skill-top { display: flex; justify-content: space-between; align-items: baseline; }
  .skill-name { font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,0.85); }
  .skill-val { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5); }
  .bar {
    height: 7px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden;
    position: relative;
  }
  .bar > i {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #6d5cff, #00d4ff);
    box-shadow: 0 0 12px rgba(0,212,255,0.6);
    width: 0;
    transition: width 1.1s cubic-bezier(.2,.8,.2,1);
  }

  /* ---------- action buttons ---------- */
  .actions {
    margin-top: 24px;
    display: flex;
    gap: 10px;
    transform: translateZ(34px);
  }
  .btn {
    flex: 1;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 13.5px; font-weight: 700;
    padding: 13px 14px;
    border-radius: 14px;
    transition: transform 0.12s ease, box-shadow 0.18s, background 0.2s, filter 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .btn:active { transform: translateY(1px) scale(0.99); }
  .btn.primary {
    color: #0b0b10;
    background: linear-gradient(180deg, #ffffff, #e8e8ee);
    box-shadow: 0 12px 28px rgba(255,255,255,0.18), inset 0 1px 0 rgba(255,255,255,0.9);
  }
  .btn.primary:hover { filter: brightness(1.05); box-shadow: 0 16px 34px rgba(255,255,255,0.28); }
  .btn.primary.on {
    color: rgba(255,255,255,0.92);
    background: linear-gradient(160deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .btn.ghost {
    flex: 0 0 auto;
    width: 50px;
    color: rgba(255,255,255,0.9);
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .btn.ghost:hover { background: rgba(255,255,255,0.13); border-color: rgba(255,255,255,0.4); }
  .btn svg { width: 16px; height: 16px; }

  /* ---------- footer meta + liquidness slider ---------- */
  .divider {
    margin: 22px 0 16px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
  }
  .liquid-ctrl { transform: translateZ(10px); }
  .liquid-top {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 9px;
  }
  .liquid-lab {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
  }
  .liquid-num {
    font-size: 11px; font-weight: 700;
    color: rgba(255,255,255,0.8);
    font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.16);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid rgba(255,255,255,0.6);
    box-shadow: 0 3px 12px rgba(0,0,0,0.5), 0 0 14px rgba(108,92,255,0.6);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid rgba(255,255,255,0.6);
    box-shadow: 0 3px 12px rgba(0,0,0,0.5), 0 0 14px rgba(108,92,255,0.6);
    cursor: pointer;
  }

  .hint {
    text-align: center;
    margin-top: 26px;
    font-size: 11.5px;
    color: rgba(255,255,255,0.32);
    position: relative;
    z-index: 2;
  }

  /* ---------- responsive: mobile 390 ---------- */
  @media (max-width: 440px) {
    body { padding: 28px 16px; }
    .stage { max-width: 100%; }
    .card { padding: 24px 20px 22px; }
    .name { font-size: 20px; }
    .avatar-wrap, .avatar { width: 70px; height: 70px; }
    .tile .num { font-size: 17px; }
  }
</style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <main class="stage">
    <div class="card-tilt" id="tilt">
      <article class="card" id="card" aria-label="프로필 카드">
        <div class="cursor-glow" id="cursorGlow"></div>

        <header class="head">
          <div class="avatar-wrap">
            <div class="avatar-ring"></div>
            <img class="avatar" alt="Maya Okonkwo 아바타"
              src="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'&gt;&lt;defs&gt;&lt;linearGradient id='g' x1='0' y1='0' x2='1' y2='1'&gt;&lt;stop offset='0' stop-color='%237b6cff'/&gt;&lt;stop offset='0.5' stop-color='%2300d4ff'/&gt;&lt;stop offset='1' stop-color='%23ff5c9d'/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;&lt;rect width='160' height='160' fill='url(%23g)'/&gt;&lt;circle cx='80' cy='62' r='30' fill='rgba(255,255,255,0.92)'/&gt;&lt;path d='M30 150 a50 42 0 0 1 100 0 Z' fill='rgba(255,255,255,0.92)'/&gt;&lt;/svg&gt;" />
            <span class="status-dot" title="온라인"></span>
          </div>
          <div class="identity">
            <h1 class="name">
              Maya Okonkwo
              <svg class="verified" viewBox="0 0 24 24" fill="currentColor" aria-label="인증됨">
                <path d="M12 2l2.4 1.8 3 .2.9 2.9 2.2 2-.9 2.9.9 2.9-2.2 2-.9 2.9-3 .2L12 22l-2.4-1.8-3-.2-.9-2.9-2.2-2 .9-2.9-.9-2.9 2.2-2 .9-2.9 3-.2L12 2zm-1.1 13.4l5.3-5.3-1.4-1.4-3.9 3.9-1.8-1.8-1.4 1.4 3.2 3.2z"/>
              </svg>
            </h1>
            <div class="handle">@maya.builds</div>
            <span class="role">Senior Product Designer</span>
          </div>
        </header>

        <p class="bio">
          리퀴드 글래스 인터페이스와 모션 시스템을 디자인합니다. 낮엔 디자인 시스템, 밤엔 셰이더.
        </p>

        <div class="stats">
          <div class="tile"><div class="num">12.4k</div><div class="lab">Followers</div></div>
          <div class="tile"><div class="num">86</div><div class="lab">Projects</div></div>
          <div class="tile"><div class="num">4.9</div><div class="lab">Rating</div></div>
        </div>

        <div class="skills">
          <div class="skill-row">
            <div class="skill-top"><span class="skill-name">Interface Design</span><span class="skill-val">96%</span></div>
            <div class="bar"><i data-w="96"></i></div>
          </div>
          <div class="skill-row">
            <div class="skill-top"><span class="skill-name">Motion &amp; Prototyping</span><span class="skill-val">88%</span></div>
            <div class="bar"><i data-w="88"></i></div>
          </div>
          <div class="skill-row">
            <div class="skill-top"><span class="skill-name">Front-end / Shaders</span><span class="skill-val">74%</span></div>
            <div class="bar"><i data-w="74"></i></div>
          </div>
        </div>

        <div class="actions">
          <button class="btn primary" id="followBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
            <span id="followLabel">Follow</span>
          </button>
          <button class="btn ghost" id="msgBtn" title="메시지">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </button>
        </div>

        <div class="divider"></div>

        <div class="liquid-ctrl">
          <div class="liquid-top">
            <span class="liquid-lab">Card liquidness</span>
            <span class="liquid-num" id="liquidNum">62%</span>
          </div>
          <input type="range" id="liquid" min="0" max="100" value="62" aria-label="카드 리퀴드 강도" />
        </div>
      </article>
    </div>
    <p class="hint">마우스를 올려 유리를 기울여 보세요 · 슬라이더로 리퀴드 강도 조절</p>
  </main>

<script>
(function () {
  var root = document.documentElement;
  var tilt = document.getElementById("tilt");
  var card = document.getElementById("card");
  var glow = document.getElementById("cursorGlow");

  /* ---- liquidness slider drives the glass variables ---- */
  var slider = document.getElementById("liquid");
  var liquidNum = document.getElementById("liquidNum");
  function applyLiquid(v) {
    var t = v / 100; // 0..1
    root.style.setProperty("--blur", (8 + t * 34).toFixed(1) + "px");
    root.style.setProperty("--sat", (1.0 + t * 0.9).toFixed(3));
    root.style.setProperty("--tint", (0.03 + t * 0.11).toFixed(3));
    root.style.setProperty("--rim", (0.22 + t * 0.4).toFixed(3));
    root.style.setProperty("--glow", (0.2 + t * 0.95).toFixed(3));
    root.style.setProperty("--radius", (18 + t * 18).toFixed(1) + "px");
    liquidNum.textContent = v + "%";
  }
  slider.addEventListener("input", function () { applyLiquid(+slider.value); });
  applyLiquid(+slider.value);

  /* ---- mouse-follow glow + 3D tilt ---- */
  var rect = null;
  function refresh() { rect = card.getBoundingClientRect(); }
  refresh();
  window.addEventListener("resize", refresh);
  window.addEventListener("scroll", refresh, { passive: true });

  function onMove(e) {
    if (!rect) refresh();
    var x = e.clientX - rect.left;
    var y = e.clientY - rect.top;
    var px = x / rect.width;   // 0..1
    var py = y / rect.height;  // 0..1
    // tilt: max ~9deg, inverted on Y so it leans toward cursor
    var rx = (0.5 - py) * 18;
    var ry = (px - 0.5) * 18;
    tilt.style.transform = "rotateX(" + rx.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) + "deg)";
    glow.style.left = x + "px";
    glow.style.top = y + "px";
  }
  function onLeave() {
    tilt.style.transform = "rotateX(0deg) rotateY(0deg)";
  }
  card.addEventListener("mousemove", onMove);
  card.addEventListener("mouseleave", onLeave);

  /* ---- skill bars animate in on load ---- */
  window.requestAnimationFrame(function () {
    setTimeout(function () {
      var bars = document.querySelectorAll(".bar > i");
      bars.forEach(function (b) { b.style.width = b.getAttribute("data-w") + "%"; });
    }, 220);
  });

  /* ---- follow toggle (realistic interaction) ---- */
  var followBtn = document.getElementById("followBtn");
  var followLabel = document.getElementById("followLabel");
  var following = false;
  var base = 12.4; // k
  followBtn.addEventListener("click", function () {
    following = !following;
    followBtn.classList.toggle("on", following);
    followLabel.textContent = following ? "Following" : "Follow";
    var followersTile = document.querySelector(".tile .num");
    followersTile.textContent = (following ? (base + 0.001 * 1) : base).toFixed(1).replace(/\.0$/, "") + "k";
    followersTile.textContent = following ? "12.4k" : "12.4k"; // keep display stable
    followersTile.textContent = following ? "12.5k" : "12.4k";
  });
})();
</script>
</body>
</html>
