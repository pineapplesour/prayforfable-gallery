<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liquid Glass · Fitness Rings</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
<style>
  :root {
    --liq: 22;                 /* liquidness: backdrop blur px, driven by slider */
    --sat: 1.35;
    --ink: 255, 255, 255;
    --glow-x: 50%;
    --glow-y: 0%;
    --tilt-x: 0deg;
    --tilt-y: 0deg;
    --move: #ff375f;           /* Move ring  (red/pink) */
    --exercise: #a8ff3e;       /* Exercise ring (lime) */
    --stand: #00e0ff;          /* Stand ring (cyan)  */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    min-height: 100%;
    background: #000;
    color: rgba(var(--ink), 0.92);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 48px 24px;
    overflow-x: hidden;
    position: relative;
  }

  /* ambient color blooms behind everything — gives the frosted glass something to refract */
  body::before,
  body::after {
    content: "";
    position: fixed;
    z-index: 0;
    width: 620px;
    height: 620px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.5;
    pointer-events: none;
  }
  body::before {
    top: -180px;
    left: -120px;
    background: radial-gradient(circle, rgba(255, 55, 95, 0.55), transparent 62%);
  }
  body::after {
    bottom: -200px;
    right: -140px;
    background: radial-gradient(circle, rgba(0, 224, 255, 0.42), transparent 62%);
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    perspective: 1400px;
  }

  /* ---- the hero glass card ---- */
  .card {
    position: relative;
    border-radius: 34px;
    padding: 26px 26px 28px;
    border: 1px solid rgba(var(--ink), 0.16);
    background:
      linear-gradient(155deg, rgba(var(--ink), 0.10), rgba(var(--ink), 0.03) 46%, rgba(var(--ink), 0.06));
    backdrop-filter: blur(calc(var(--liq) * 1px)) saturate(var(--sat));
    -webkit-backdrop-filter: blur(calc(var(--liq) * 1px)) saturate(var(--sat));
    box-shadow:
      0 40px 90px -20px rgba(0, 0, 0, 0.85),
      0 12px 30px -12px rgba(0, 0, 0, 0.6),
      inset 0 1px 0 rgba(var(--ink), 0.42),
      inset 0 0 0 1px rgba(var(--ink), 0.04),
      inset 0 -22px 40px -30px rgba(0, 0, 0, 0.7);
    transform: rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
    transform-style: preserve-3d;
    transition: transform 0.25s cubic-bezier(.2,.7,.2,1);
    overflow: hidden;
  }

  /* mouse-following specular glow that lives on the glass surface */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(
      280px circle at var(--glow-x) var(--glow-y),
      rgba(var(--ink), 0.16),
      transparent 60%
    );
    opacity: 0.9;
    pointer-events: none;
    transition: background 0.08s linear;
    z-index: 3;
  }
  /* top edge sheen */
  .card::after {
    content: "";
    position: absolute;
    top: 0; left: 12%; right: 12%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(var(--ink), 0.55), transparent);
    pointer-events: none;
    z-index: 3;
  }

  .card > * { position: relative; z-index: 2; }

  /* ---- header ---- */
  .head {
    display: flex;
    align-items: center;
    gap: 13px;
    margin-bottom: 22px;
  }
  .avatar {
    width: 46px;
    height: 46px;
    border-radius: 16px;
    flex: none;
    display: grid;
    place-items: center;
    font-size: 22px;
    background: linear-gradient(145deg, rgba(255,55,95,0.9), rgba(255,120,60,0.85));
    box-shadow:
      0 8px 20px -6px rgba(255, 55, 95, 0.6),
      inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .head .meta { line-height: 1.25; }
  .head .name {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.2px;
    color: rgba(var(--ink), 0.97);
  }
  .head .sub {
    font-size: 12.5px;
    font-weight: 600;
    color: rgba(var(--ink), 0.5);
  }
  .head .badge {
    margin-left: auto;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 7px 12px;
    border-radius: 999px;
    color: rgba(var(--ink), 0.85);
    border: 1px solid rgba(var(--ink), 0.18);
    background: rgba(var(--ink), 0.06);
    box-shadow: inset 0 1px 0 rgba(var(--ink), 0.25);
  }
  .head .badge b { color: var(--exercise); }

  /* ---- rings hero ---- */
  .rings-wrap {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 18px 16px 16px;
    border-radius: 24px;
    border: 1px solid rgba(var(--ink), 0.12);
    background: rgba(var(--ink), 0.045);
    box-shadow:
      inset 0 1px 0 rgba(var(--ink), 0.22),
      inset 0 -16px 30px -28px rgba(0,0,0,0.8);
    margin-bottom: 16px;
  }
  .rings {
    width: 138px;
    height: 138px;
    flex: none;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.55));
  }
  .rings .track { stroke: rgba(var(--ink), 0.10); fill: none; }
  .rings .prog {
    fill: none;
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: 75px 75px;
    transition: stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1);
  }
  .rings-center {
    position: absolute;
  }

  .ring-legend { display: flex; flex-direction: column; gap: 11px; flex: 1; }
  .leg {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .leg .dot {
    width: 9px; height: 9px; border-radius: 50%; flex: none;
    align-self: center;
    box-shadow: 0 0 8px currentColor;
  }
  .leg .lab {
    font-size: 11.5px;
    font-weight: 700;
    color: rgba(var(--ink), 0.55);
    flex: 1;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .leg .val {
    font-size: 14px;
    font-weight: 800;
    color: rgba(var(--ink), 0.95);
  }
  .leg .val span {
    font-size: 10.5px;
    font-weight: 700;
    color: rgba(var(--ink), 0.45);
    margin-left: 2px;
  }

  /* ---- floating stat tiles ---- */
  .tiles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .tile {
    position: relative;
    border-radius: 18px;
    padding: 14px 15px;
    border: 1px solid rgba(var(--ink), 0.13);
    background:
      linear-gradient(160deg, rgba(var(--ink), 0.085), rgba(var(--ink), 0.025));
    box-shadow:
      0 14px 28px -16px rgba(0,0,0,0.8),
      inset 0 1px 0 rgba(var(--ink), 0.30),
      inset 0 0 0 1px rgba(var(--ink), 0.02);
    transition: transform 0.18s cubic-bezier(.2,.7,.2,1), box-shadow 0.18s ease;
    cursor: default;
  }
  .tile:hover {
    transform: translateY(-3px);
    box-shadow:
      0 22px 40px -16px rgba(0,0,0,0.9),
      inset 0 1px 0 rgba(var(--ink), 0.42);
  }
  .tile .ic {
    font-size: 15px;
    margin-bottom: 9px;
    display: inline-grid;
    place-items: center;
    width: 30px; height: 30px;
    border-radius: 10px;
    background: rgba(var(--ink), 0.07);
    box-shadow: inset 0 1px 0 rgba(var(--ink), 0.25);
  }
  .tile .num {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: rgba(var(--ink), 0.98);
    line-height: 1;
  }
  .tile .num small { font-size: 12px; font-weight: 700; color: rgba(var(--ink), 0.5); margin-left: 3px; }
  .tile .cap {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: rgba(var(--ink), 0.46);
    margin-top: 5px;
  }
  .tile .trend { font-size: 10.5px; font-weight: 800; color: var(--exercise); float: right; margin-top: 2px; }
  .tile .trend.down { color: var(--move); }

  /* ---- weekly bars ---- */
  .week {
    border-radius: 20px;
    padding: 16px 17px 14px;
    border: 1px solid rgba(var(--ink), 0.12);
    background: rgba(var(--ink), 0.045);
    box-shadow: inset 0 1px 0 rgba(var(--ink), 0.20), inset 0 -16px 30px -30px rgba(0,0,0,0.8);
    margin-bottom: 18px;
  }
  .week .wk-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 14px;
  }
  .week .wk-title { font-size: 12px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: rgba(var(--ink), 0.7); }
  .week .wk-sub { font-size: 11.5px; font-weight: 700; color: rgba(var(--ink), 0.42); }
  .bars { display: flex; align-items: flex-end; gap: 9px; height: 64px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end; }
  .bar {
    width: 100%;
    border-radius: 7px 7px 4px 4px;
    background: linear-gradient(180deg, rgba(168,255,62,0.95), rgba(0,224,255,0.55));
    box-shadow: 0 0 12px -2px rgba(168,255,62,0.45), inset 0 1px 0 rgba(255,255,255,0.45);
    transition: height 0.9s cubic-bezier(.2,.8,.2,1);
    height: 4px;
  }
  .bar-col.today .bar { background: linear-gradient(180deg, #fff, rgba(168,255,62,0.85)); box-shadow: 0 0 16px rgba(255,255,255,0.5); }
  .bar-col .d { font-size: 10px; font-weight: 700; color: rgba(var(--ink), 0.4); }
  .bar-col.today .d { color: rgba(var(--ink), 0.9); }

  /* ---- liquidness slider ---- */
  .liq-row { margin-top: 2px; }
  .liq-lab {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; font-weight: 700; color: rgba(var(--ink), 0.7);
    margin-bottom: 10px;
  }
  .liq-lab .v { font-size: 11px; font-weight: 800; color: rgba(var(--ink), 0.45); }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 7px; border-radius: 999px;
    background: rgba(var(--ink), 0.16);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
    outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 3px 12px rgba(0,0,0,0.5), inset 0 -2px 4px rgba(0,0,0,0.18);
    border: 1px solid rgba(255,255,255,0.9);
  }
  input[type="range"]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; border: 1px solid rgba(255,255,255,0.9);
    box-shadow: 0 3px 12px rgba(0,0,0,0.5);
  }

  .foot {
    margin-top: 18px;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: rgba(var(--ink), 0.32);
  }

  /* ---- responsive ---- */
  @media (max-width: 430px) {
    body { padding: 28px 16px; }
    .stage { max-width: 100%; }
    .card { padding: 22px 20px 24px; border-radius: 30px; }
    .rings-wrap { gap: 16px; }
    .rings { width: 118px; height: 118px; }
    .tile .num { font-size: 21px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .tile, .prog, .bar { transition: none !important; }
  }
</style>
</head>
<body>
  <main class="stage" id="stage">
    <section class="card" id="card" aria-label="피트니스 링 스탯 카드">
      <header class="head">
        <div class="avatar" aria-hidden="true">🏃</div>
        <div class="meta">
          <div class="name">Mira Sol</div>
          <div class="sub">@mira · Today, June 20</div>
        </div>
        <div class="badge"><b>●</b> Active</div>
      </header>

      <!-- rings + legend -->
      <div class="rings-wrap">
        <div style="position:relative; display:grid; place-items:center;">
          <svg class="rings" viewBox="0 0 150 150" role="img" aria-label="활동 링: 무브 92%, 운동 85%, 스탠드 75%">
            <!-- tracks -->
            <circle class="track" cx="75" cy="75" r="60" stroke-width="13"/>
            <circle class="track" cx="75" cy="75" r="44" stroke-width="13"/>
            <circle class="track" cx="75" cy="75" r="28" stroke-width="13"/>
            <!-- progress -->
            <circle class="prog r-move"     cx="75" cy="75" r="60" stroke-width="13" stroke="var(--move)"/>
            <circle class="prog r-exercise" cx="75" cy="75" r="44" stroke-width="13" stroke="var(--exercise)"/>
            <circle class="prog r-stand"    cx="75" cy="75" r="28" stroke-width="13" stroke="var(--stand)"/>
          </svg>
        </div>
        <div class="ring-legend">
          <div class="leg">
            <span class="dot" style="color:var(--move)"></span>
            <span class="lab">Move</span>
            <span class="val">552<span>/600 kcal</span></span>
          </div>
          <div class="leg">
            <span class="dot" style="color:var(--exercise)"></span>
            <span class="lab">Exercise</span>
            <span class="val">38<span>/45 min</span></span>
          </div>
          <div class="leg">
            <span class="dot" style="color:var(--stand)"></span>
            <span class="lab">Stand</span>
            <span class="val">9<span>/12 hr</span></span>
          </div>
        </div>
      </div>

      <!-- floating stat tiles -->
      <div class="tiles">
        <div class="tile">
          <span class="trend">▲ 12%</span>
          <div class="ic" aria-hidden="true">👟</div>
          <div class="num">9 842<small>steps</small></div>
          <div class="cap">Daily steps</div>
        </div>
        <div class="tile">
          <span class="trend">▲ 6%</span>
          <div class="ic" aria-hidden="true">🔥</div>
          <div class="num">552<small>kcal</small></div>
          <div class="cap">Active energy</div>
        </div>
        <div class="tile">
          <span class="trend down">▼ 3 bpm</span>
          <div class="ic" aria-hidden="true">❤️</div>
          <div class="num">64<small>bpm</small></div>
          <div class="cap">Resting HR</div>
        </div>
        <div class="tile">
          <span class="trend">▲ 0.4</span>
          <div class="ic" aria-hidden="true">📍</div>
          <div class="num">7.2<small>km</small></div>
          <div class="cap">Distance</div>
        </div>
      </div>

      <!-- weekly bars -->
      <div class="week">
        <div class="wk-head">
          <span class="wk-title">Move · this week</span>
          <span class="wk-sub">avg 487 kcal</span>
        </div>
        <div class="bars" id="bars" aria-hidden="true"></div>
      </div>

      <!-- liquidness slider -->
      <div class="liq-row">
        <div class="liq-lab">
          <span>Card liquidness</span>
          <span class="v" id="liqVal">22px</span>
        </div>
        <input type="range" id="liq" min="0" max="44" value="22" aria-label="카드 유리감(블러) 조절" />
      </div>

      <div class="foot">Liquid Glass · Fitness Rings · v07</div>
    </section>
  </main>

<script>
(function () {
  "use strict";

  /* ---- animate the activity rings on load ---- */
  function setRing(el, pct, r) {
    var c = 2 * Math.PI * r;
    el.style.strokeDasharray = c.toFixed(2);
    el.style.strokeDashoffset = c.toFixed(2);           // start empty
    // force reflow then animate to target
    void el.getBoundingClientRect();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        el.style.strokeDashoffset = (c * (1 - pct)).toFixed(2);
      });
    });
  }
  setRing(document.querySelector(".r-move"), 0.92, 60);
  setRing(document.querySelector(".r-exercise"), 0.85, 44);
  setRing(document.querySelector(".r-stand"), 0.75, 28);

  /* ---- weekly bars (realistic mock kcal) ---- */
  var days = ["M", "T", "W", "T", "F", "S", "S"];
  var vals = [430, 510, 380, 620, 470, 560, 552];   // kcal, last = today
  var max = 700;
  var bars = document.getElementById("bars");
  vals.forEach(function (v, i) {
    var col = document.createElement("div");
    col.className = "bar-col" + (i === vals.length - 1 ? " today" : "");
    var bar = document.createElement("div");
    bar.className = "bar";
    var lab = document.createElement("div");
    lab.className = "d";
    lab.textContent = days[i];
    col.appendChild(bar);
    col.appendChild(lab);
    bars.appendChild(col);
    requestAnimationFrame(function () {
      setTimeout(function () {
        bar.style.height = Math.max(6, Math.round((v / max) * 60)) + "px";
      }, 120 + i * 70);
    });
  });

  /* ---- liquidness slider ---- */
  var root = document.documentElement;
  var liq = document.getElementById("liq");
  var liqVal = document.getElementById("liqVal");
  liq.addEventListener("input", function () {
    root.style.setProperty("--liq", liq.value);
    root.style.setProperty("--sat", (1.1 + liq.value / 44 * 0.6).toFixed(2));
    liqVal.textContent = liq.value + "px";
  });

  /* ---- mouse-following glow + subtle 3D tilt ---- */
  var card = document.getElementById("card");
  var stage = document.getElementById("stage");
  var raf = null;
  var pending = null;

  function applyTilt(data) {
    raf = null;
    root.style.setProperty("--glow-x", data.gx + "%");
    root.style.setProperty("--glow-y", data.gy + "%");
    root.style.setProperty("--tilt-x", data.tx.toFixed(2) + "deg");
    root.style.setProperty("--tilt-y", data.ty.toFixed(2) + "deg");
  }

  stage.addEventListener("pointermove", function (e) {
    var r = card.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width;   // 0..1
    var py = (e.clientY - r.top) / r.height;   // 0..1
    pending = {
      gx: (px * 100).toFixed(1),
      gy: (py * 100).toFixed(1),
      ty: (px - 0.5) * 9,     // rotateY
      tx: (0.5 - py) * 9      // rotateX
    };
    if (!raf) raf = requestAnimationFrame(function () { applyTilt(pending); });
  });

  stage.addEventListener("pointerleave", function () {
    root.style.setProperty("--tilt-x", "0deg");
    root.style.setProperty("--tilt-y", "0deg");
    root.style.setProperty("--glow-x", "50%");
    root.style.setProperty("--glow-y", "0%");
  });
})();
</script>
</body>
</html>
