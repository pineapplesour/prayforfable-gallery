<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liquid Glass Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
<style>
  :root {
    --liquid: 22;          /* blur px, driven by slider */
    --sat: 1.25;
    --glow-x: 50%;
    --glow-y: 0%;
    --tilt-x: 0deg;
    --tilt-y: 0deg;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    min-height: 100vh;
    background: #000;
    color: #fff;
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    overflow-x: hidden;
  }

  /* faint atmospheric glow behind the card so frosted glass has something to refract */
  body::before {
    content: "";
    position: fixed;
    inset: -20%;
    background:
      radial-gradient(620px 620px at 22% 18%, rgba(86, 132, 255, 0.22), transparent 60%),
      radial-gradient(560px 560px at 82% 78%, rgba(120, 90, 220, 0.18), transparent 62%),
      radial-gradient(480px 480px at 60% 40%, rgba(40, 180, 200, 0.10), transparent 65%);
    filter: blur(8px);
    z-index: 0;
    pointer-events: none;
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    perspective: 1400px;
  }

  /* ===== main glass card ===== */
  .card {
    position: relative;
    border-radius: 32px;
    padding: 26px 24px 22px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(calc(var(--liquid) * 1px)) saturate(var(--sat));
    -webkit-backdrop-filter: blur(calc(var(--liquid) * 1px)) saturate(var(--sat));
    box-shadow:
      0 28px 80px rgba(0, 0, 0, 0.65),
      0 6px 22px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.35),
      inset 0 0 0 1px rgba(255, 255, 255, 0.04),
      inset 0 -30px 60px rgba(0, 0, 0, 0.28);
    transform: rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
    transform-style: preserve-3d;
    transition: transform 0.25s cubic-bezier(.2,.8,.2,1);
    overflow: hidden;
  }

  /* mouse-following specular glow */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(
      240px 240px at var(--glow-x) var(--glow-y),
      rgba(255, 255, 255, 0.16),
      transparent 60%
    );
    opacity: 0.9;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 2;
  }

  /* top thin liquid sheen line */
  .card::after {
    content: "";
    position: absolute;
    top: 0; left: 12%; right: 12%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    pointer-events: none;
    z-index: 3;
  }

  .card > * { position: relative; z-index: 4; }

  /* ===== header row ===== */
  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .loc {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .loc .city {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .loc .region {
    font-size: 12.5px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.55);
  }

  .live {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.8);
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .live .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.6);
    animation: pulse 2.2s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(74,222,128,0.55); }
    70%  { box-shadow: 0 0 0 7px rgba(74,222,128,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
  }

  /* ===== hero temp ===== */
  .hero {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 22px 0 6px;
  }
  .icon-sun {
    width: 74px; height: 74px;
    flex: 0 0 auto;
    border-radius: 22px;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 8px 24px rgba(0,0,0,0.35);
  }
  .icon-sun svg { width: 42px; height: 42px; display: block; }

  .temp-wrap { display: flex; flex-direction: column; }
  .temp {
    font-size: 64px;
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.04em;
  }
  .temp sup {
    font-size: 26px;
    font-weight: 600;
    vertical-align: top;
    color: rgba(255,255,255,0.6);
    margin-left: 2px;
  }
  .cond {
    margin-top: 8px;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.78);
  }
  .feels {
    font-size: 12.5px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.5);
    margin-top: 2px;
  }

  /* ===== floating stat tiles ===== */
  .tiles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 20px;
  }
  .tile {
    border-radius: 16px;
    padding: 13px 12px 12px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.09);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.22),
      0 6px 18px rgba(0,0,0,0.3);
    transition: transform 0.18s ease, background 0.18s ease;
  }
  .tile:hover {
    transform: translateY(-3px);
    background: rgba(255, 255, 255, 0.1);
  }
  .tile .label {
    display: flex; align-items: center; gap: 5px;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: rgba(255, 255, 255, 0.5);
  }
  .tile .label svg { width: 12px; height: 12px; opacity: 0.7; }
  .tile .val {
    margin-top: 9px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .tile .val span {
    font-size: 11px;
    font-weight: 500;
    color: rgba(255,255,255,0.5);
    margin-left: 2px;
  }

  /* ===== hourly strip ===== */
  .panel {
    margin-top: 16px;
    border-radius: 18px;
    padding: 14px 14px 12px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 8px 22px rgba(0,0,0,0.3);
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.07em;
    color: rgba(255,255,255,0.5);
    margin-bottom: 12px;
  }
  .hours {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
  }
  .hour {
    display: flex; flex-direction: column;
    align-items: center; gap: 7px;
    padding: 6px 2px;
    border-radius: 12px;
    transition: background 0.16s ease;
  }
  .hour:hover { background: rgba(255,255,255,0.07); }
  .hour .h-t { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.55); }
  .hour .h-i { width: 22px; height: 22px; opacity: 0.92; }
  .hour .h-i svg { width: 100%; height: 100%; }
  .hour .h-d { font-size: 13px; font-weight: 700; }
  .hour.now {
    background: rgba(255,255,255,0.1);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
  }
  .hour.now .h-t { color: rgba(255,255,255,0.9); }

  /* ===== liquidness slider ===== */
  .controls { margin-top: 18px; }
  .ctrl-label {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: rgba(255,255,255,0.5);
    margin-bottom: 9px;
  }
  .ctrl-label .num { color: rgba(255,255,255,0.85); font-weight: 700; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.14);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 3px 10px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(0,0,0,0.06);
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.15); }
  input[type="range"]::-moz-range-thumb {
    width: 20px; height: 20px; border: none;
    border-radius: 50%; background: #fff;
    box-shadow: 0 3px 10px rgba(0,0,0,0.45);
    cursor: pointer;
  }

  .footer {
    margin-top: 16px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11.5px;
    color: rgba(255,255,255,0.4);
    font-weight: 500;
  }
  .footer .upd { display: inline-flex; align-items: center; gap: 6px; }

  /* ===== responsive (mobile 390) ===== */
  @media (max-width: 440px) {
    body { padding: 28px 16px; }
    .card { padding: 22px 18px 20px; border-radius: 28px; }
    .temp { font-size: 56px; }
    .icon-sun { width: 64px; height: 64px; }
    .icon-sun svg { width: 36px; height: 36px; }
    .tile .val { font-size: 17px; }
    .hours { gap: 2px; }
    .hour .h-d { font-size: 12px; }
  }
</style>
</head>
<body>
  <main class="stage">
    <article class="card" id="card">
      <!-- header -->
      <div class="top">
        <div class="loc">
          <div class="city">Seoul</div>
          <div class="region">South Korea · 37.57°N, 126.98°E</div>
        </div>
        <div class="live"><span class="dot"></span>Live</div>
      </div>

      <!-- hero -->
      <div class="hero">
        <div class="icon-sun">
          <svg viewBox="0 0 64 64" fill="none">
            <defs>
              <radialGradient id="sun" cx="50%" cy="42%" r="60%">
                <stop offset="0%" stop-color="#fff3c4"/>
                <stop offset="55%" stop-color="#ffd45e"/>
                <stop offset="100%" stop-color="#ffab2e"/>
              </radialGradient>
            </defs>
            <circle cx="32" cy="30" r="13" fill="url(#sun)"/>
            <g stroke="#ffd45e" stroke-width="3.2" stroke-linecap="round" opacity="0.95">
              <line x1="32" y1="5"  x2="32" y2="12"/>
              <line x1="32" y1="48" x2="32" y2="55"/>
              <line x1="9"  y1="30" x2="16" y2="30"/>
              <line x1="48" y1="30" x2="55" y2="30"/>
              <line x1="15" y1="13" x2="20" y2="18"/>
              <line x1="44" y1="42" x2="49" y2="47"/>
              <line x1="49" y1="13" x2="44" y2="18"/>
              <line x1="20" y1="42" x2="15" y2="47"/>
            </g>
          </svg>
        </div>
        <div class="temp-wrap">
          <div class="temp">24<sup>°C</sup></div>
          <div class="cond">Mostly Sunny</div>
          <div class="feels">Feels like 26° · UV index 6 (High)</div>
        </div>
      </div>

      <!-- stat tiles -->
      <div class="tiles">
        <div class="tile">
          <div class="label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5S5 13 5 15a7 7 0 0 0 7 7z"/></svg>
            Humidity
          </div>
          <div class="val">58<span>%</span></div>
        </div>
        <div class="tile">
          <div class="label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>
            Wind
          </div>
          <div class="val">12<span>km/h</span></div>
        </div>
        <div class="tile">
          <div class="label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            Pressure
          </div>
          <div class="val">1013<span>hPa</span></div>
        </div>
      </div>

      <!-- hourly -->
      <div class="panel">
        <div class="panel-head"><span>Hourly</span><span>Next 6h</span></div>
        <div class="hours" id="hours"></div>
      </div>

      <!-- liquidness slider -->
      <div class="controls">
        <div class="ctrl-label">
          <span>Card liquidness</span>
          <span class="num" id="liqVal">22px</span>
        </div>
        <input type="range" id="liq" min="2" max="40" value="22" />
      </div>

      <!-- footer -->
      <div class="footer">
        <span class="upd">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9 9 0 0 1 6.7 3L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-6.7-3L3 16"/><path d="M3 21v-5h5"/></svg>
          Updated 2 min ago
        </span>
        <span>Liquid Weather</span>
      </div>
    </article>
  </main>

  <script>
    // ----- mock hourly data -----
    const ICONS = {
      sun: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" fill="#ffd45e"/><g stroke="#ffd45e" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><line x1="4" y1="4" x2="6" y2="6"/><line x1="18" y1="18" x2="20" y2="20"/><line x1="20" y1="4" x2="18" y2="6"/><line x1="6" y1="18" x2="4" y2="20"/></g></svg>',
      cloud: '<svg viewBox="0 0 24 24" fill="none"><path d="M6 18a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.5A3.5 3.5 0 0 1 18 18z" fill="#cbd5e1"/></svg>',
      partly: '<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="9" r="4" fill="#ffd45e"/><path d="M8 19a3.5 3.5 0 0 1 0-7 4.5 4.5 0 0 1 8.6-1.3A3 3 0 0 1 18 19z" fill="#cbd5e1"/></svg>',
      rain: '<svg viewBox="0 0 24 24" fill="none"><path d="M6 15a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.5A3.5 3.5 0 0 1 18 15z" fill="#94a3b8"/><g stroke="#60a5fa" stroke-width="2" stroke-linecap="round"><line x1="8" y1="18" x2="7" y2="21"/><line x1="13" y1="18" x2="12" y2="21"/><line x1="16" y1="18" x2="15" y2="21"/></g></svg>'
    };
    const hourly = [
      { t: 'Now', i: 'sun',    d: 24 },
      { t: '3PM', i: 'sun',    d: 25 },
      { t: '4PM', i: 'partly', d: 24 },
      { t: '5PM', i: 'partly', d: 22 },
      { t: '6PM', i: 'cloud',  d: 20 },
      { t: '7PM', i: 'rain',   d: 18 }
    ];
    const hoursEl = document.getElementById('hours');
    hoursEl.innerHTML = hourly.map((h, idx) => `
      <div class="hour${idx === 0 ? ' now' : ''}">
        <div class="h-t">${h.t}</div>
        <div class="h-i">${ICONS[h.i]}</div>
        <div class="h-d">${h.d}°</div>
      </div>`).join('');

    // ----- liquidness slider -----
    const root = document.documentElement;
    const liq = document.getElementById('liq');
    const liqVal = document.getElementById('liqVal');
    liq.addEventListener('input', () => {
      root.style.setProperty('--liquid', liq.value);
      // saturation rides slightly with liquidness for a more "alive" glass
      root.style.setProperty('--sat', (1 + liq.value / 60).toFixed(2));
      liqVal.textContent = liq.value + 'px';
    });

    // ----- mouse-follow glow + subtle tilt -----
    const card = document.getElementById('card');
    card.addEventListener('pointermove', (e) => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      const y = (e.clientY - r.top) / r.height;
      root.style.setProperty('--glow-x', (x * 100).toFixed(1) + '%');
      root.style.setProperty('--glow-y', (y * 100).toFixed(1) + '%');
      root.style.setProperty('--tilt-y', ((x - 0.5) * 8).toFixed(2) + 'deg');
      root.style.setProperty('--tilt-x', ((0.5 - y) * 8).toFixed(2) + 'deg');
    });
    card.addEventListener('pointerleave', () => {
      root.style.setProperty('--tilt-x', '0deg');
      root.style.setProperty('--tilt-y', '0deg');
      root.style.setProperty('--glow-x', '50%');
      root.style.setProperty('--glow-y', '0%');
    });
  </script>
</body>
</html>
