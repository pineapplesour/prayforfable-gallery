<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AURELIA · Membership ID</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --liquid: 0.55;            /* 0 → 1 슬라이더로 제어 */
    --blur: calc(8px + var(--liquid) * 26px);
    --sat: calc(1.05 + var(--liquid) * 0.85);
    --glass: calc(0.045 + var(--liquid) * 0.07);
    --hi: calc(0.18 + var(--liquid) * 0.32);
    --mx: 50%;                 /* 마우스 글로우 X */
    --my: 50%;                 /* 마우스 글로우 Y */
    --rx: 0deg;                /* 틸트 X */
    --ry: 0deg;                /* 틸트 Y */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: #000;
    color: #f4f6fb;
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* 배경: 순흑 + 아주 미세한 컬러 누출(글래스가 빨아들일 빛) */
  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    overflow-x: hidden;
  }
  .bg-aura {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(620px 620px at 22% 18%, rgba(99, 102, 241, 0.20), transparent 60%),
      radial-gradient(720px 720px at 82% 82%, rgba(56, 189, 248, 0.16), transparent 62%),
      radial-gradient(540px 540px at 78% 16%, rgba(244, 114, 182, 0.12), transparent 60%);
    filter: saturate(1.1);
  }
  /* 마우스 추종 외부 글로우 */
  .bg-spot {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(360px 360px at var(--mx) var(--my), rgba(125, 211, 252, 0.10), transparent 65%);
    transition: background 0.18s ease;
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    perspective: 1400px;
  }

  /* ===== 멤버십 ID 카드 ===== */
  .card {
    position: relative;
    border-radius: 30px;
    padding: 26px 26px 22px;
    background: rgba(255, 255, 255, var(--glass));
    border: 1px solid rgba(255, 255, 255, calc(0.10 + var(--liquid) * 0.06));
    backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    box-shadow:
      0 30px 80px -28px rgba(0, 0, 0, 0.85),
      0 8px 24px -12px rgba(0, 0, 0, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, var(--hi)),
      inset 0 0 0 1px rgba(255, 255, 255, 0.02),
      inset 0 -24px 60px -30px rgba(120, 170, 255, 0.18);
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    transform-style: preserve-3d;
    transition: transform 0.25s cubic-bezier(.2,.7,.2,1), box-shadow 0.3s ease;
    overflow: hidden;
  }
  /* 카드 내부 떠다니는 하이라이트(마우스 따라 이동하는 specular) */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(260px 200px at var(--mx) var(--my), rgba(255,255,255,calc(0.12 + var(--liquid)*0.10)), transparent 60%);
    mix-blend-mode: screen;
    transition: background 0.12s ease;
  }
  /* 상단 곡면 글레어 */
  .card::after {
    content: "";
    position: absolute;
    left: -20%;
    top: -60%;
    width: 140%;
    height: 90%;
    pointer-events: none;
    background: radial-gradient(60% 100% at 50% 100%, rgba(255,255,255,0.16), transparent 70%);
    opacity: calc(0.4 + var(--liquid) * 0.4);
    filter: blur(2px);
  }
  .card > * { position: relative; z-index: 2; transform: translateZ(28px); }

  /* 헤더: 브랜드 + 등급칩 */
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand-mark {
    width: 38px; height: 38px;
    border-radius: 12px;
    display: grid; place-items: center;
    background: linear-gradient(150deg, rgba(255,255,255,0.22), rgba(255,255,255,0.04));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 6px 16px -8px rgba(0,0,0,0.7);
  }
  .brand-mark svg { width: 20px; height: 20px; }
  .brand-name { font-size: 15px; font-weight: 800; letter-spacing: 0.14em; }
  .brand-sub { font-size: 10px; font-weight: 600; letter-spacing: 0.28em; color: rgba(244,246,251,0.5); text-transform: uppercase; }

  .tier {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #0b0b0f;
    background: linear-gradient(135deg, #fde68a, #f5c44e 45%, #d99a2b);
    box-shadow: 0 6px 18px -8px rgba(245,196,78,0.7), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .tier .dot { width: 7px; height: 7px; border-radius: 50%; background: #0b0b0f; opacity: 0.55; }

  /* 멤버 정보 행 */
  .member {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 22px;
  }
  .avatar {
    position: relative;
    width: 66px; height: 66px;
    border-radius: 20px;
    flex: none;
    background:
      radial-gradient(120% 120% at 30% 20%, #a5b4fc, transparent 55%),
      linear-gradient(150deg, #6366f1, #0ea5e9 70%, #22d3ee);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 12px 28px -12px rgba(14,165,233,0.65);
    display: grid; place-items: center;
    font-weight: 800; font-size: 24px; color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }
  .avatar .ring {
    position: absolute; inset: -4px;
    border-radius: 24px;
    border: 1.5px solid rgba(255,255,255,0.18);
    pointer-events: none;
  }
  .m-meta { min-width: 0; }
  .m-name { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; }
  .m-handle { font-size: 13px; font-weight: 500; color: rgba(244,246,251,0.55); margin-top: 2px; }
  .m-badges { display: flex; gap: 7px; margin-top: 9px; }
  .pill {
    font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
    padding: 4px 9px; border-radius: 999px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.10);
    color: rgba(244,246,251,0.78);
    backdrop-filter: blur(6px);
  }

  /* 떠있는 글래스 스탯 타일 */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; margin-bottom: 20px; }
  .stat {
    border-radius: 17px;
    padding: 14px 10px 12px;
    text-align: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.09);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 22px -16px rgba(0,0,0,0.8);
    backdrop-filter: blur(calc(var(--blur) * 0.5));
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .stat:hover { transform: translateY(-3px); background: rgba(255,255,255,0.10); }
  .stat .v { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  .stat .v small { font-size: 12px; font-weight: 700; opacity: 0.7; }
  .stat .l { font-size: 9.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(244,246,251,0.5); margin-top: 4px; }

  /* ID 번호 + 데이터 행 */
  .idline {
    display: flex; align-items: center; justify-content: space-between;
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 18px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .idline .k { font-size: 9.5px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(244,246,251,0.45); }
  .idline .num { font-family: "JetBrains Mono", monospace; font-size: 16px; font-weight: 600; letter-spacing: 0.08em; margin-top: 5px; }
  .idline .since { text-align: right; }
  .idline .since .v { font-family: "JetBrains Mono", monospace; font-size: 14px; font-weight: 500; margin-top: 5px; color: rgba(244,246,251,0.85); }

  /* 칩 + 바코드 풋 */
  .foot { display: flex; align-items: center; gap: 14px; }
  .chip {
    flex: none;
    width: 46px; height: 34px;
    border-radius: 8px;
    background: linear-gradient(135deg, #f7e6a8, #d9b24f 55%, #b8862c);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), inset 0 -2px 6px rgba(0,0,0,0.25), 0 4px 12px -6px rgba(0,0,0,0.6);
    position: relative;
    overflow: hidden;
  }
  .chip::before, .chip::after {
    content: ""; position: absolute; background: rgba(0,0,0,0.22);
  }
  .chip::before { left: 0; right: 0; top: 50%; height: 1px; }
  .chip::after { top: 6px; bottom: 6px; left: 33%; width: 1px; box-shadow: 14px 0 0 rgba(0,0,0,0.22); }
  .barcode {
    flex: 1; height: 30px; border-radius: 6px;
    background-image: repeating-linear-gradient(90deg,
      rgba(244,246,251,0.85) 0 2px, transparent 2px 4px,
      rgba(244,246,251,0.85) 4px 5px, transparent 5px 9px,
      rgba(244,246,251,0.85) 9px 12px, transparent 12px 14px);
    opacity: 0.7;
    mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  }
  .nfc {
    flex: none; display: grid; place-items: center;
    width: 30px; height: 30px; color: rgba(244,246,251,0.55);
  }

  /* ===== liquidness 슬라이더 (카드 아래 떠있는 글래스 컨트롤) ===== */
  .controls {
    margin-top: 18px;
    border-radius: 22px;
    padding: 16px 18px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.09);
    backdrop-filter: blur(calc(var(--blur) * 0.7)) saturate(var(--sat));
    -webkit-backdrop-filter: blur(calc(var(--blur) * 0.7)) saturate(var(--sat));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 18px 50px -30px rgba(0,0,0,0.8);
  }
  .ctl-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .ctl-head .lab { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(244,246,251,0.65); }
  .ctl-head .val { font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 500; color: rgba(244,246,251,0.85); }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 8px; border-radius: 999px; outline: none; cursor: pointer;
    background: linear-gradient(90deg, rgba(125,211,252,0.85) calc(var(--liquid)*100%), rgba(255,255,255,0.12) calc(var(--liquid)*100%));
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 3px 10px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.9);
    border: 1px solid rgba(0,0,0,0.05);
  }
  input[type="range"]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%; border: none;
    background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.45);
  }

  .hint { margin-top: 16px; text-align: center; font-size: 11px; letter-spacing: 0.03em; color: rgba(244,246,251,0.34); }

  /* ===== 모바일 390 ===== */
  @media (max-width: 440px) {
    body { padding: 28px 16px; }
    .stage { max-width: 100%; }
    .card { padding: 22px 20px 20px; border-radius: 26px; }
    .m-name { font-size: 19px; }
    .stat .v { font-size: 17px; }
    .stats { gap: 9px; }
  }
</style>
</head>
<body>
  <div class="bg-aura"></div>
  <div class="bg-spot"></div>

  <div class="stage">
    <!-- 멤버십 ID 카드 -->
    <article class="card" id="card" aria-label="멤버십 ID 카드">
      <div class="card-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 2l2.6 6.3L21 9l-5 4.4L17.6 20 12 16.4 6.4 20 8 13.4 3 9l6.4-.7L12 2z"
                    fill="#fff" fill-opacity="0.92"/>
            </svg>
          </span>
          <span>
            <div class="brand-name">AURELIA</div>
            <div class="brand-sub">Members Club</div>
          </span>
        </div>
        <span class="tier"><span class="dot"></span>Obsidian</span>
      </div>

      <div class="member">
        <div class="avatar">
          <span class="ring"></span>
          SK
        </div>
        <div class="m-meta">
          <div class="m-name">서경리</div>
          <div class="m-handle">@kyungri · Seoul</div>
          <div class="m-badges">
            <span class="pill">Priority Access</span>
            <span class="pill">VIP Lounge</span>
          </div>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="v">12<small>년</small></div>
          <div class="l">Tenure</div>
        </div>
        <div class="stat">
          <div class="v">48.2<small>k</small></div>
          <div class="l">Points</div>
        </div>
        <div class="stat">
          <div class="v">#0<small>7</small></div>
          <div class="l">Rank</div>
        </div>
      </div>

      <div class="idline">
        <div>
          <div class="k">Member No.</div>
          <div class="num">AUR-2014-0079-KR</div>
        </div>
        <div class="since">
          <div class="k">Valid Thru</div>
          <div class="v">08 / 27</div>
        </div>
      </div>

      <div class="foot">
        <div class="chip" aria-hidden="true"></div>
        <div class="barcode" aria-hidden="true"></div>
        <span class="nfc" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M5 16a9 9 0 010-8M9 14a4 4 0 010-4M13 18a13 13 0 000-12"/>
          </svg>
        </span>
      </div>
    </article>

    <!-- liquidness 컨트롤 -->
    <div class="controls">
      <div class="ctl-head">
        <span class="lab">Card Liquidness</span>
        <span class="val" id="liqVal">55%</span>
      </div>
      <input type="range" id="liq" min="0" max="100" value="55" aria-label="카드 유리감 조절" />
    </div>

    <div class="hint">마우스를 카드 위에 올려 빛과 기울기를 움직여보세요</div>
  </div>

  <script>
    const root = document.documentElement;
    const card = document.getElementById('card');
    const liq = document.getElementById('liq');
    const liqVal = document.getElementById('liqVal');
    const spot = document.querySelector('.bg-spot');

    // liquidness 슬라이더
    function applyLiquid(v) {
      root.style.setProperty('--liquid', (v / 100).toFixed(3));
      liqVal.textContent = v + '%';
    }
    liq.addEventListener('input', e => applyLiquid(+e.target.value));
    applyLiquid(+liq.value);

    // 마우스 추종: 카드 내부 specular + 외부 spot + 3D 틸트
    function onMove(clientX, clientY) {
      const r = card.getBoundingClientRect();
      const x = clientX - r.left;
      const y = clientY - r.top;
      const px = Math.max(0, Math.min(1, x / r.width));
      const py = Math.max(0, Math.min(1, y / r.height));
      root.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
      root.style.setProperty('--my', (py * 100).toFixed(1) + '%');
      const maxTilt = 8;
      root.style.setProperty('--ry', ((px - 0.5) * 2 * maxTilt).toFixed(2) + 'deg');
      root.style.setProperty('--rx', (-(py - 0.5) * 2 * maxTilt).toFixed(2) + 'deg');
      spot.style.background =
        `radial-gradient(360px 360px at ${clientX}px ${clientY}px, rgba(125,211,252,0.12), transparent 65%)`;
    }
    card.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
    card.addEventListener('mouseleave', () => {
      root.style.setProperty('--rx', '0deg');
      root.style.setProperty('--ry', '0deg');
      root.style.setProperty('--mx', '50%');
      root.style.setProperty('--my', '50%');
    });
    // 터치 대응
    card.addEventListener('touchmove', e => {
      const t = e.touches[0];
      if (t) onMove(t.clientX, t.clientY);
    }, { passive: true });
  </script>
</body>
</html>
