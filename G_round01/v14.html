<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Liquid Glass · Quote Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500;0,6..72,500;0,6..72,600&display=swap" rel="stylesheet" />
<style>
  :root{
    --liquid: 22;                 /* px, driven by slider */
    --sat: 1.2;
    --ink-rgb: 255,255,255;
    --glass: rgba(255,255,255,0.06);
    --glass-2: rgba(255,255,255,0.1);
    --glass-strong: rgba(255,255,255,0.16);
    --hair: rgba(255,255,255,0.30);
    --hair-2: rgba(255,255,255,0.12);
    --mx: 50%; --my: 30%;         /* pointer glow position */
    --rx: 0deg; --ry: 0deg;       /* tilt */
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100%;
    background:#000;
    color:#f4f5f7;
    font-family:"Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
    overflow-x:hidden;
  }

  /* ambient deep-space color wash so the frosted glass has something to refract */
  body::before{
    content:"";
    position:fixed; inset:-20% -10%;
    z-index:0;
    background:
      radial-gradient(46% 40% at 22% 18%, rgba(120,86,255,.20), transparent 60%),
      radial-gradient(40% 38% at 84% 26%, rgba(0,176,255,.16), transparent 62%),
      radial-gradient(50% 45% at 70% 92%, rgba(255,86,150,.16), transparent 60%),
      radial-gradient(38% 34% at 12% 88%, rgba(0,224,180,.12), transparent 60%);
    filter:saturate(1.2);
    animation:drift 26s ease-in-out infinite alternate;
  }
  /* faint grain dots */
  body::after{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1.4px);
    background-size:4px 4px;
    opacity:.5;
    mix-blend-mode:overlay;
  }
  @keyframes drift{
    0%{ transform:translate3d(0,0,0) scale(1); }
    100%{ transform:translate3d(-3%,-2%,0) scale(1.08); }
  }

  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    perspective:1400px;
  }

  /* ============ THE POSTER ============ */
  .poster{
    position:relative;
    border-radius:34px;
    padding:30px 30px 26px;
    background:
      linear-gradient(165deg, rgba(255,255,255,.10), rgba(255,255,255,.03) 42%, rgba(255,255,255,.06));
    backdrop-filter:blur(calc(var(--liquid) * 1px)) saturate(var(--sat));
    -webkit-backdrop-filter:blur(calc(var(--liquid) * 1px)) saturate(var(--sat));
    border:1px solid var(--hair);
    box-shadow:
      0 40px 90px -30px rgba(0,0,0,.85),
      0 10px 26px rgba(0,0,0,.45),
      inset 0 1px 0 rgba(255,255,255,.35),
      inset 0 0 0 1px rgba(255,255,255,.04),
      inset 0 -30px 60px -40px rgba(0,0,0,.6);
    transform:rotateX(var(--rx)) rotateY(var(--ry));
    transform-style:preserve-3d;
    transition:transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .3s ease;
    will-change:transform;
    overflow:hidden;
  }
  /* moving specular glow that follows the pointer */
  .poster::before{
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    background:radial-gradient(220px 220px at var(--mx) var(--my),
              rgba(255,255,255,.16), rgba(255,255,255,.05) 38%, transparent 64%);
    opacity:.9;
    pointer-events:none;
    transition:opacity .4s ease;
    mix-blend-mode:screen;
  }
  /* top crescent sheen */
  .poster::after{
    content:"";
    position:absolute; left:-30%; right:-30%; top:-60%; height:120%;
    background:radial-gradient(60% 50% at 50% 100%, rgba(255,255,255,.20), transparent 70%);
    pointer-events:none; opacity:.55; filter:blur(2px);
  }
  .poster > *{ position:relative; z-index:2; }

  /* ---- header row ---- */
  .head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:22px;
  }
  .brand{ display:flex; align-items:center; gap:11px; }
  .mark{
    width:34px; height:34px; border-radius:12px;
    display:grid; place-items:center;
    background:linear-gradient(155deg, rgba(255,255,255,.5), rgba(255,255,255,.08));
    border:1px solid rgba(255,255,255,.5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 4px 12px rgba(0,0,0,.35);
    color:#0b0b0c; font-weight:800;
  }
  .brand-txt{ line-height:1.1; }
  .brand-txt b{ font-size:14.5px; font-weight:700; letter-spacing:.2px; }
  .brand-txt span{ display:block; font-size:11px; color:rgba(255,255,255,.5); font-weight:500; }

  .pill{
    display:inline-flex; align-items:center; gap:7px;
    padding:7px 13px; border-radius:999px;
    font-size:11.5px; font-weight:600; letter-spacing:.3px;
    color:rgba(255,255,255,.82);
    background:var(--glass);
    border:1px solid var(--hair);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 3px 10px rgba(0,0,0,.3);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:#39d98a;
        box-shadow:0 0 0 3px rgba(57,217,138,.18), 0 0 10px rgba(57,217,138,.7); }

  /* ---- the quote ---- */
  .mark-quote{
    font-family:"Newsreader", Georgia, serif;
    font-style:italic;
    font-size:72px; line-height:.6; height:34px;
    color:rgba(255,255,255,.32);
    margin:2px 0 6px;
    user-select:none;
  }
  .quote{
    font-family:"Newsreader", Georgia, serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(25px, 6.6vw, 31px);
    line-height:1.34;
    letter-spacing:.2px;
    color:#fdfdfe;
    margin:0 2px 22px;
    text-shadow:0 1px 24px rgba(255,255,255,.08), 0 2px 2px rgba(0,0,0,.35);
    transition:opacity .35s ease, transform .35s ease, filter .35s ease;
  }
  .quote.swap{ opacity:0; transform:translateY(8px); filter:blur(3px); }

  /* ---- author block ---- */
  .author{
    display:flex; align-items:center; gap:13px;
    padding:14px 16px; margin:0 0 20px;
    border-radius:20px;
    background:var(--glass);
    border:1px solid var(--hair-2);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 8px 22px rgba(0,0,0,.25);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .avatar{
    width:46px; height:46px; border-radius:50%; flex:0 0 auto;
    display:grid; place-items:center;
    font-weight:700; font-size:16px; color:#0b0b0c;
    border:1px solid rgba(255,255,255,.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 4px 14px rgba(0,0,0,.4);
    background:linear-gradient(150deg, #e9e3ff, #b6c8ff 55%, #ffd6ec);
    transition:background .35s ease;
  }
  .author-meta{ line-height:1.25; min-width:0; }
  .author-meta b{ font-size:15px; font-weight:700; }
  .author-meta span{ display:block; font-size:11.5px; color:rgba(255,255,255,.52); font-weight:500;
                     white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .author .verify{ margin-left:auto; flex:0 0 auto;
    width:22px; height:22px; border-radius:50%;
    background:linear-gradient(150deg,#69b4ff,#3a7bff);
    display:grid; place-items:center; color:#fff; font-size:12px;
    box-shadow:0 3px 10px rgba(58,123,255,.5), inset 0 1px 0 rgba(255,255,255,.5);
  }

  /* ---- floating stat tiles ---- */
  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:11px; margin-bottom:20px; }
  .tile{
    border-radius:18px; padding:14px 10px 12px; text-align:center;
    background:var(--glass);
    border:1px solid var(--hair);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.30), 0 8px 22px rgba(0,0,0,.22);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:transform .2s ease, background .2s ease;
    cursor:default;
  }
  .tile:hover{ transform:translateY(-3px); background:var(--glass-2); }
  .tile b{ display:block; font-size:20px; font-weight:800; letter-spacing:.3px; }
  .tile span{ display:block; font-size:10.5px; margin-top:3px;
              color:rgba(255,255,255,.5); font-weight:600; letter-spacing:.5px; text-transform:uppercase; }
  .tile.like b{ color:#ff7eb0; }
  .tile.share b{ color:#7fd3ff; }
  .tile.save b{ color:#ffd479; }

  /* ---- liquidness slider ---- */
  .control{ margin:4px 2px 18px; }
  .control .lab{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:11.5px; font-weight:600; letter-spacing:.4px;
    color:rgba(255,255,255,.6); margin-bottom:10px; text-transform:uppercase;
  }
  .control .lab em{ font-style:normal; color:#fff; font-weight:700; font-variant-numeric:tabular-nums; }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:6px; border-radius:999px; outline:none; cursor:pointer;
    background:linear-gradient(90deg, rgba(255,255,255,.85) var(--fill,40%), rgba(255,255,255,.12) var(--fill,40%));
    box-shadow:inset 0 1px 2px rgba(0,0,0,.5);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:20px; height:20px; border-radius:50%;
    background:#fff; cursor:grab;
    border:3px solid rgba(255,255,255,.85);
    box-shadow:0 3px 10px rgba(0,0,0,.5), 0 0 0 4px rgba(255,255,255,.06);
  }
  input[type=range]::-webkit-slider-thumb:active{ cursor:grabbing; transform:scale(1.08); }
  input[type=range]::-moz-range-thumb{
    width:20px; height:20px; border-radius:50%; background:#fff;
    border:3px solid rgba(255,255,255,.85);
    box-shadow:0 3px 10px rgba(0,0,0,.5);
  }

  /* ---- actions ---- */
  .actions{ display:flex; gap:11px; }
  .btn{
    flex:1; display:inline-flex; align-items:center; justify-content:center; gap:9px;
    padding:14px 16px; border-radius:16px; cursor:pointer;
    font-family:inherit; font-size:14px; font-weight:700; letter-spacing:.2px;
    border:1px solid var(--hair); color:#fff;
    background:var(--glass-2);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 8px 22px rgba(0,0,0,.25);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:transform .15s ease, background .2s ease, box-shadow .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:hover{ background:var(--glass-strong); transform:translateY(-2px); }
  .btn:active{ transform:translateY(0); }
  .btn.primary{
    flex:1.4;
    color:#0b0b0c;
    background:linear-gradient(160deg, #ffffff, #dfe2ea);
    border:1px solid rgba(255,255,255,.85);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 10px 26px rgba(0,0,0,.4);
  }
  .btn.primary:hover{ background:linear-gradient(160deg, #ffffff, #eef0f5); }
  .btn svg{ width:16px; height:16px; }

  /* tiny toast */
  .toast{
    position:fixed; left:50%; bottom:34px; transform:translate(-50%, 24px);
    z-index:5; padding:11px 18px; border-radius:999px;
    font-size:13px; font-weight:600; color:#0b0b0c;
    background:linear-gradient(160deg,#fff,#e6e8ee);
    box-shadow:0 16px 40px -10px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.9);
    opacity:0; pointer-events:none; transition:opacity .3s ease, transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  @media (max-width:430px){
    body{ padding:26px 16px; }
    .poster{ padding:24px 22px 22px; border-radius:28px; }
    .stats{ gap:8px; }
    .tile b{ font-size:18px; }
    .btn{ padding:13px 12px; font-size:13px; }
  }
  @media (prefers-reduced-motion:reduce){
    body::before{ animation:none; }
    .poster{ transition:none; }
  }
</style>
</head>
<body>
  <main class="stage" aria-label="명언 포스터 카드">
    <article class="poster" id="poster">
      <div class="head">
        <div class="brand">
          <div class="mark">❝</div>
          <div class="brand-txt">
            <b>Daily Verses</b>
            <span>liquid glass edition</span>
          </div>
        </div>
        <div class="pill"><span class="dot"></span> #042 / today</div>
      </div>

      <div class="mark-quote" aria-hidden="true">“</div>
      <p class="quote" id="quote">우리가 두려워해야 할 단 한 가지는 두려움 그 자체다.</p>

      <div class="author">
        <div class="avatar" id="avatar">FR</div>
        <div class="author-meta">
          <b id="authorName">Franklin D. Roosevelt</b>
          <span id="authorRole">미국 제32대 대통령 · 1933</span>
        </div>
        <div class="verify" title="검증된 출처">✓</div>
      </div>

      <div class="stats">
        <div class="tile like"><b id="stLike">12.4k</b><span>Likes</span></div>
        <div class="tile share"><b id="stShare">3.1k</b><span>Shares</span></div>
        <div class="tile save"><b id="stSave">8.7k</b><span>Saved</span></div>
      </div>

      <div class="control">
        <div class="lab"><span>Card liquidness</span><em id="liqVal">22px</em></div>
        <input type="range" id="liq" min="2" max="44" value="22" aria-label="카드 유리 두께" />
      </div>

      <div class="actions">
        <button class="btn primary" id="next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          다음 명언
        </button>
        <button class="btn" id="like" aria-label="좋아요">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          저장
        </button>
      </div>
    </article>
  </main>

  <div class="toast" id="toast">포스터에 저장했어요</div>

<script>
(function(){
  "use strict";

  var QUOTES = [
    { q:"우리가 두려워해야 할 단 한 가지는 두려움 그 자체다.",
      name:"Franklin D. Roosevelt", role:"미국 제32대 대통령 · 1933",
      grad:"linear-gradient(150deg,#e9e3ff,#b6c8ff 55%,#ffd6ec)",
      likes:"12.4k", shares:"3.1k", saves:"8.7k" },
    { q:"머무르는 자는 도태되고, 흐르는 자는 살아남는다. 단, 두려움 없이.",
      name:"Heraclitus", role:"고대 그리스 철학자 · BCE 500",
      grad:"linear-gradient(150deg,#bff3e3,#7fd3ff 55%,#e6ffd6)",
      likes:"9.8k", shares:"2.4k", saves:"6.2k" },
    { q:"완벽함이란 더 보탤 게 없을 때가 아니라, 더 덜어낼 게 없을 때 이루어진다.",
      name:"Antoine de Saint-Exupéry", role:"작가 · 비행사 · 1939",
      grad:"linear-gradient(150deg,#fff0c2,#ffb6d6 55%,#d6c2ff)",
      likes:"21.6k", shares:"5.9k", saves:"14.3k" },
    { q:"네가 할 수 있다고 믿든 할 수 없다고 믿든, 너의 믿음이 옳다.",
      name:"Henry Ford", role:"포드 모터스 창립자 · 1922",
      grad:"linear-gradient(150deg,#d6e4ff,#a7c0ff 55%,#ffe0d6)",
      likes:"15.1k", shares:"4.2k", saves:"10.9k" },
    { q:"별을 향해 손을 뻗는 자는, 끝내 흙을 묻히지 않는다.",
      name:"Leonardo da Vinci", role:"르네상스 예술가 · 1503",
      grad:"linear-gradient(150deg,#ffe2c2,#ffb0c8 55%,#c2ffe9)",
      likes:"33.0k", shares:"8.8k", saves:"19.4k" },
    { q:"고요한 바다는 결코 노련한 뱃사람을 만들지 못한다.",
      name:"Franklin D. Roosevelt", role:"속담 모음 · 1932",
      grad:"linear-gradient(150deg,#cfe0ff,#9fd6ff 55%,#ffd1ec)",
      likes:"7.5k", shares:"1.9k", saves:"5.0k" }
  ];

  var idx = 0;
  var $ = function(id){ return document.getElementById(id); };
  var poster = $("poster"), quoteEl = $("quote"),
      avatar = $("avatar"), nameEl = $("authorName"), roleEl = $("authorRole"),
      stLike = $("stLike"), stShare = $("stShare"), stSave = $("stSave"),
      liq = $("liq"), liqVal = $("liqVal"), toast = $("toast");

  function initials(name){
    var p = name.replace(/[^A-Za-z가-힣 ]/g,"").trim().split(/\s+/);
    if(/[가-힣]/.test(name)) return name.slice(0,2);
    return (p[0]||"").charAt(0) + (p[p.length-1]||"").charAt(0);
  }

  function render(i, animate){
    var d = QUOTES[i];
    function apply(){
      quoteEl.textContent = d.q;
      nameEl.textContent = d.name;
      roleEl.textContent = d.role;
      avatar.textContent = initials(d.name);
      avatar.style.background = d.grad;
      stLike.textContent = d.likes;
      stShare.textContent = d.shares;
      stSave.textContent = d.saves;
    }
    if(animate){
      quoteEl.classList.add("swap");
      setTimeout(function(){ apply(); quoteEl.classList.remove("swap"); }, 230);
    } else { apply(); }
  }

  $("next").addEventListener("click", function(){
    idx = (idx + 1) % QUOTES.length;
    render(idx, true);
  });

  var toastTimer;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove("show"); }, 1600);
  }
  $("like").addEventListener("click", function(){ showToast("포스터에 저장했어요 ♥"); });

  /* liquidness slider -> blur depth + thumb fill */
  function syncLiq(){
    var v = +liq.value;
    document.documentElement.style.setProperty("--liquid", v);
    liqVal.textContent = v + "px";
    var pct = ((v - liq.min) / (liq.max - liq.min)) * 100;
    liq.style.setProperty("--fill", pct + "%");
  }
  liq.addEventListener("input", syncLiq);

  /* pointer-tracked glow + parallax tilt */
  var raf = null, tx = 0, ty = 0, gx = 50, gy = 30;
  function onMove(e){
    var r = poster.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width;   // 0..1
    var py = (e.clientY - r.top) / r.height;   // 0..1
    gx = px * 100; gy = py * 100;
    tx = (py - 0.5) * -10;   // rotateX
    ty = (px - 0.5) * 12;    // rotateY
    if(!raf) raf = requestAnimationFrame(applyMove);
  }
  function applyMove(){
    raf = null;
    var s = document.documentElement.style;
    s.setProperty("--mx", gx + "%");
    s.setProperty("--my", gy + "%");
    s.setProperty("--rx", tx.toFixed(2) + "deg");
    s.setProperty("--ry", ty.toFixed(2) + "deg");
  }
  function reset(){
    var s = document.documentElement.style;
    s.setProperty("--rx","0deg"); s.setProperty("--ry","0deg");
    s.setProperty("--mx","50%"); s.setProperty("--my","26%");
  }
  var fine = window.matchMedia("(pointer:fine)").matches;
  if(fine){
    poster.addEventListener("mousemove", onMove);
    poster.addEventListener("mouseleave", reset);
  }

  /* init */
  render(0, false);
  syncLiq();
  reset();
})();
</script>
</body>
</html>
