<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Liquid Glass · Podcast Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
<style>
  :root{
    --liquid: 1;                       /* 0..1, driven by slider */
    --blur: calc(8px + var(--liquid) * 20px);
    --sat: calc(1.05 + var(--liquid) * 0.55);
    --glass: rgba(255,255,255,0.065);
    --glass-2: rgba(255,255,255,0.10);
    --hair: rgba(255,255,255,0.14);
    --hair-bright: rgba(255,255,255,0.42);
    --ink: #f4f5f7;
    --ink-dim: rgba(244,245,247,0.62);
    --ink-faint: rgba(244,245,247,0.40);
    --accent: #8b7bff;
    --accent-2: #38e0c9;
    --mx: 50%;          /* mouse glow x */
    --my: 30%;          /* mouse glow y */
    --rx: 0deg;         /* tilt */
    --ry: 0deg;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    color:var(--ink);
    background:#000;
    min-height:100dvh;
    display:grid;
    place-items:center;
    padding:48px 20px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ambient color blobs behind the glass so the frost has something to refract */
  .ambient{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .ambient::before,
  .ambient::after{
    content:""; position:absolute; border-radius:50%;
    filter:blur(90px); opacity:.55;
  }
  .ambient::before{
    width:560px; height:560px; left:-120px; top:-80px;
    background:radial-gradient(circle at 30% 30%, #5b4bff, transparent 62%);
    animation:drift1 22s ease-in-out infinite;
  }
  .ambient::after{
    width:620px; height:620px; right:-160px; bottom:-140px;
    background:radial-gradient(circle at 60% 40%, #15b8a0, transparent 60%);
    animation:drift2 28s ease-in-out infinite;
  }
  .ambient .spark{
    position:absolute; width:380px; height:380px; left:46%; top:55%;
    border-radius:50%; filter:blur(80px); opacity:.4;
    background:radial-gradient(circle, #ff5da2, transparent 60%);
    animation:drift3 26s ease-in-out infinite;
  }
  @keyframes drift1{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,40px)} }
  @keyframes drift2{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(-50px,-30px)} }
  @keyframes drift3{ 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-30%,-60%) scale(1.15)} }

  .stage{
    position:relative; z-index:1;
    perspective:1400px;
    width:100%;
    max-width:420px;
  }

  /* ---------- the glass card ---------- */
  .card{
    position:relative;
    border-radius:34px;
    padding:24px 24px 22px;
    background:
      radial-gradient(220px 160px at var(--mx) var(--my), rgba(255,255,255,0.10), transparent 70%),
      linear-gradient(160deg, rgba(255,255,255,0.085), rgba(255,255,255,0.03) 60%);
    backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    border:1px solid var(--hair);
    box-shadow:
      0 1px 0 0 var(--hair-bright) inset,
      0 0 0 1px rgba(0,0,0,0.4),
      0 30px 70px -20px rgba(0,0,0,0.85),
      0 10px 26px rgba(0,0,0,0.5);
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    transform-style:preserve-3d;
    transition: transform .25s cubic-bezier(.2,.7,.2,1);
    will-change:transform;
  }
  /* top sheen */
  .card::before{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,0.16), transparent 22%);
    mix-blend-mode:screen; opacity:.7;
  }
  /* moving specular glow following the mouse */
  .card::after{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:radial-gradient(160px 160px at var(--mx) var(--my), rgba(255,255,255,0.22), transparent 65%);
    mix-blend-mode:screen; opacity:.6; transition:opacity .3s;
  }

  /* ---------- header ---------- */
  .head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px; position:relative; z-index:2;
  }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand .dot{
    width:9px; height:9px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff8a8a, #ff3b6b);
    box-shadow:0 0 10px rgba(255,59,107,0.8);
    animation:live 2s ease-in-out infinite;
  }
  @keyframes live{ 0%,100%{opacity:1} 50%{opacity:.35} }
  .brand .label{
    font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    color:var(--ink-dim);
  }
  .pill{
    font-size:11px; font-weight:600; letter-spacing:.04em;
    color:var(--ink-dim);
    padding:6px 11px; border-radius:999px;
    background:var(--glass); border:1px solid var(--hair);
    box-shadow:0 1px 0 rgba(255,255,255,0.18) inset;
  }

  /* ---------- now playing ---------- */
  .now{ display:flex; gap:16px; position:relative; z-index:2; }
  .art{
    flex:0 0 auto; width:96px; height:96px; border-radius:22px;
    position:relative; overflow:hidden;
    border:1px solid rgba(255,255,255,0.22);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.4) inset,
      0 14px 30px -8px rgba(0,0,0,0.7);
    transform: translateZ(40px);
  }
  .art .cover{
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 25% 20%, #ffd36e, transparent 45%),
      radial-gradient(circle at 80% 30%, #ff5da2, transparent 50%),
      linear-gradient(150deg, #7b5bff, #1fb8c9);
  }
  .art .glyph{
    position:absolute; inset:0; display:grid; place-items:center;
    font-size:34px; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }
  .art::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,0.28), transparent 40%);
    mix-blend-mode:screen;
  }
  .meta{ min-width:0; display:flex; flex-direction:column; justify-content:center; gap:5px; }
  .show{ font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--accent-2); }
  .title{
    font-size:19px; font-weight:800; line-height:1.18; letter-spacing:-0.01em;
    color:var(--ink);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .host{ font-size:13px; font-weight:500; color:var(--ink-dim); }

  /* ---------- stat tiles ---------- */
  .stats{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    margin:18px 0; position:relative; z-index:2;
  }
  .tile{
    text-align:center; padding:13px 8px 11px; border-radius:18px;
    background:var(--glass); border:1px solid var(--hair);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.22) inset,
      0 8px 22px -10px rgba(0,0,0,0.6);
    transform: translateZ(22px);
  }
  .tile .n{ font-size:18px; font-weight:800; letter-spacing:-0.01em; }
  .tile .k{ font-size:10.5px; font-weight:600; letter-spacing:.06em; color:var(--ink-faint); margin-top:3px; }

  /* ---------- waveform progress ---------- */
  .progress{ position:relative; z-index:2; margin-top:4px; }
  .wave{
    display:flex; align-items:flex-end; gap:3px; height:42px;
    padding:0 2px; cursor:pointer; user-select:none;
  }
  .wave .bar{
    flex:1 1 auto; border-radius:3px; min-width:0;
    background:rgba(255,255,255,0.18);
    transition:background .15s;
  }
  .wave .bar.on{
    background:linear-gradient(180deg, var(--accent-2), var(--accent));
    box-shadow:0 0 8px rgba(139,123,255,0.5);
  }
  .times{
    display:flex; justify-content:space-between;
    font-size:11px; font-weight:600; color:var(--ink-faint);
    margin-top:8px; font-variant-numeric:tabular-nums;
  }

  /* ---------- controls ---------- */
  .controls{
    display:flex; align-items:center; justify-content:center; gap:18px;
    margin-top:16px; position:relative; z-index:2;
  }
  .ctl{
    display:grid; place-items:center; cursor:pointer;
    border:1px solid var(--hair); color:var(--ink);
    background:var(--glass);
    box-shadow:0 1px 0 rgba(255,255,255,0.22) inset, 0 8px 18px -8px rgba(0,0,0,0.6);
    transition:transform .15s, background .2s, box-shadow .2s;
  }
  .ctl:hover{ background:var(--glass-2); transform:translateY(-1px); }
  .ctl:active{ transform:translateY(0) scale(.96); }
  .ctl.small{ width:46px; height:46px; border-radius:15px; }
  .ctl.play{
    width:64px; height:64px; border-radius:22px;
    background:linear-gradient(160deg, #fff, #d9d6ff);
    color:#16121f; border-color:rgba(255,255,255,0.7);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 12px 30px -8px rgba(139,123,255,0.7),
      0 6px 16px rgba(0,0,0,0.5);
    transform:translateZ(30px);
  }
  .ctl.play:hover{ background:linear-gradient(160deg,#fff,#cfc9ff); transform:translateY(-1px) translateZ(30px); }
  .ctl svg{ width:20px; height:20px; }
  .ctl.play svg{ width:24px; height:24px; }

  /* ---------- liquidness slider ---------- */
  .liquid-row{
    display:flex; align-items:center; gap:12px; margin-top:20px;
    position:relative; z-index:2;
  }
  .liquid-row .lab{
    font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-dim); white-space:nowrap;
  }
  .liquid-row .val{
    font-size:11px; font-weight:700; color:var(--accent-2);
    font-variant-numeric:tabular-nums; min-width:34px; text-align:right;
  }
  input[type=range]{
    -webkit-appearance:none; appearance:none; flex:1; height:6px; border-radius:999px;
    background:linear-gradient(90deg, var(--accent) calc(var(--liquid)*100%), rgba(255,255,255,0.14) calc(var(--liquid)*100%));
    outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    background:#fff; border:1px solid rgba(255,255,255,0.8);
    box-shadow:0 0 0 4px rgba(139,123,255,0.25), 0 3px 8px rgba(0,0,0,0.5);
    cursor:grab;
  }
  input[type=range]::-webkit-slider-thumb:active{ cursor:grabbing; }
  input[type=range]::-moz-range-thumb{
    width:18px; height:18px; border-radius:50%; background:#fff; border:1px solid rgba(255,255,255,0.8);
    box-shadow:0 0 0 4px rgba(139,123,255,0.25), 0 3px 8px rgba(0,0,0,0.5);
  }

  @media (max-width:430px){
    body{ padding:28px 14px; }
    .stage{ max-width:100%; }
    .art{ width:84px; height:84px; }
    .title{ font-size:17px; }
    .tile .n{ font-size:16px; }
  }
  @media (prefers-reduced-motion:reduce){
    .ambient::before,.ambient::after,.ambient .spark,.brand .dot{ animation:none; }
    .card{ transition:none; }
  }
</style>
</head>
<body>
  <div class="ambient"><div class="spark"></div></div>

  <main class="stage" id="stage">
    <article class="card" id="card">
      <header class="head">
        <div class="brand">
          <span class="dot"></span>
          <span class="label">Now Streaming</span>
        </div>
        <span class="pill">EP · 142</span>
      </header>

      <section class="now">
        <div class="art"><div class="cover"></div><div class="glyph">🎙️</div></div>
        <div class="meta">
          <div class="show">Frost &amp; Signal</div>
          <h1 class="title">유리처럼 투명한 인터페이스 만들기</h1>
          <div class="host">호스트 · 한지우, 도윤</div>
        </div>
      </section>

      <section class="stats">
        <div class="tile"><div class="n">52<span style="font-size:12px">분</span></div><div class="k">길이</div></div>
        <div class="tile"><div class="n">4.9<span style="font-size:12px">★</span></div><div class="k">평점</div></div>
        <div class="tile"><div class="n">128<span style="font-size:12px">k</span></div><div class="k">청취</div></div>
      </section>

      <section class="progress">
        <div class="wave" id="wave" title="여기를 눌러 탐색"></div>
        <div class="times"><span id="cur">18:24</span><span id="dur">-33:36</span></div>
      </section>

      <section class="controls">
        <button class="ctl small" id="back" aria-label="15초 뒤로">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 19 4 12 11 5"/><polyline points="20 19 13 12 20 5"/></svg>
        </button>
        <button class="ctl play" id="play" aria-label="재생/일시정지">
          <svg id="playicon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctl small" id="fwd" aria-label="15초 앞으로">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 5 20 12 13 19"/><polyline points="4 5 11 12 4 19"/></svg>
        </button>
      </section>

      <div class="liquid-row">
        <span class="lab">Liquidness</span>
        <input type="range" id="liquid" min="0" max="100" value="100" />
        <span class="val" id="liquidval">100%</span>
      </div>
    </article>
  </main>

<script>
(function(){
  var root = document.documentElement;
  var card = document.getElementById('card');
  var stage = document.getElementById('stage');

  /* ---- mouse-following glow + parallax tilt ---- */
  stage.addEventListener('pointermove', function(e){
    var r = card.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width;
    var py = (e.clientY - r.top) / r.height;
    root.style.setProperty('--mx', (px*100).toFixed(1) + '%');
    root.style.setProperty('--my', (py*100).toFixed(1) + '%');
    var max = 7;
    root.style.setProperty('--ry', ((px - .5) * max).toFixed(2) + 'deg');
    root.style.setProperty('--rx', ((.5 - py) * max).toFixed(2) + 'deg');
  });
  stage.addEventListener('pointerleave', function(){
    root.style.setProperty('--rx','0deg');
    root.style.setProperty('--ry','0deg');
    root.style.setProperty('--mx','50%');
    root.style.setProperty('--my','30%');
  });

  /* ---- liquidness slider ---- */
  var liquid = document.getElementById('liquid');
  var liquidval = document.getElementById('liquidval');
  function applyLiquid(){
    var v = liquid.value / 100;
    root.style.setProperty('--liquid', v);
    liquidval.textContent = liquid.value + '%';
  }
  liquid.addEventListener('input', applyLiquid);
  applyLiquid();

  /* ---- waveform ---- */
  var wave = document.getElementById('wave');
  var BARS = 56;
  var PROGRESS = 0.35;            // 18:24 of 52:00 ≈ .354
  var heights = [];
  for(var i=0;i<BARS;i++){
    var h = 30 + Math.abs(Math.sin(i*0.55)) * 55 + Math.random()*15;
    heights.push(Math.min(100, h));
    var b = document.createElement('div');
    b.className = 'bar';
    b.style.height = heights[i] + '%';
    wave.appendChild(b);
  }
  var bars = wave.querySelectorAll('.bar');
  var TOTAL = 52*60;             // seconds
  var cur = document.getElementById('cur');
  var dur = document.getElementById('dur');
  function fmt(s){ s=Math.max(0,Math.round(s)); var m=Math.floor(s/60), x=s%60; return m+':'+(x<10?'0':'')+x; }
  function render(){
    var idx = Math.round(PROGRESS * BARS);
    for(var i=0;i<BARS;i++){ bars[i].classList.toggle('on', i < idx); }
    var t = PROGRESS * TOTAL;
    cur.textContent = fmt(t);
    dur.textContent = '-' + fmt(TOTAL - t);
  }
  function seekFromEvent(e){
    var r = wave.getBoundingClientRect();
    PROGRESS = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    render();
  }
  wave.addEventListener('pointerdown', function(e){
    seekFromEvent(e);
    function mv(ev){ seekFromEvent(ev); }
    function up(){ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); }
    window.addEventListener('pointermove',mv);
    window.addEventListener('pointerup',up);
  });
  render();

  /* ---- play / pause with ticking progress ---- */
  var playing = false, timer = null;
  var playicon = document.getElementById('playicon');
  var PLAY = 'M8 5v14l11-7z';
  var PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';
  function setIcon(){ playicon.setAttribute('d', playing ? PAUSE : PLAY); }
  document.getElementById('play').addEventListener('click', function(){
    playing = !playing; setIcon();
    if(playing){
      timer = setInterval(function(){
        PROGRESS = Math.min(1, PROGRESS + 1/TOTAL);
        render();
        if(PROGRESS >= 1){ playing=false; setIcon(); clearInterval(timer); }
      }, 1000);
    } else { clearInterval(timer); }
  });
  document.getElementById('back').addEventListener('click', function(){ PROGRESS = Math.max(0, PROGRESS - 15/TOTAL); render(); });
  document.getElementById('fwd').addEventListener('click', function(){ PROGRESS = Math.min(1, PROGRESS + 15/TOTAL); render(); });
})();
</script>
</body>
</html>
