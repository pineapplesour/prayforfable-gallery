<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liquid Glass Boarding Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink: #f4f6fb;
    --muted: rgba(244,246,251,0.56);
    --faint: rgba(244,246,251,0.34);
    --glass: 0.07;          /* base glass fill */
    --liquid: 0.5;          /* slider 0..1 -> drives blur/sat/glow */
    --blur: 22px;
    --sat: 1.2;
    --accent: #7cc6ff;
    --accent2: #c8a8ff;
    --mx: 50%;
    --my: 50%;
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }

  html,body{ height: 100%; }

  body{
    min-height: 100dvh;
    background: #000;
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 48px 24px;
    overflow-x: hidden;
    position: relative;
  }

  /* deep ambient color blobs behind the glass (very subtle) */
  body::before, body::after{
    content:""; position: fixed; pointer-events:none; z-index:0;
    filter: blur(120px); opacity: .55;
  }
  body::before{
    width: 620px; height: 620px; left: -160px; top: -180px;
    background: radial-gradient(circle at center, rgba(58,120,255,.55), transparent 62%);
  }
  body::after{
    width: 680px; height: 680px; right: -200px; bottom: -220px;
    background: radial-gradient(circle at center, rgba(190,110,255,.42), transparent 62%);
  }

  .stage{ position: relative; z-index: 2; width: min(440px, 100%); perspective: 1400px; }

  /* ===== The boarding pass ===== */
  .pass{
    position: relative;
    border-radius: 34px;
    padding: 26px 26px 22px;
    background:
      radial-gradient(120% 90% at var(--mx) var(--my),
        rgba(255,255,255, calc(var(--glass) + 0.10 * var(--liquid))) 0%,
        rgba(255,255,255, var(--glass)) 42%,
        rgba(255,255,255, calc(var(--glass) * 0.5)) 100%);
    backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow:
      0 30px 70px rgba(0,0,0,0.6),
      0 8px 22px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.45),
      inset 0 0 0 1px rgba(255,255,255,0.04),
      inset 0 -30px 60px rgba(0,0,0,0.35);
    transform-style: preserve-3d;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease;
    will-change: transform;
  }
  /* moving specular highlight that follows the cursor */
  .pass::before{
    content:""; position:absolute; inset:0; border-radius: inherit; pointer-events:none;
    background: radial-gradient(260px 200px at var(--mx) var(--my),
      rgba(255,255,255, calc(0.16 + 0.22*var(--liquid))), transparent 60%);
    mix-blend-mode: screen; opacity:.9; transition: opacity .3s ease;
  }
  /* glossy top sheen */
  .pass::after{
    content:""; position:absolute; inset:0 0 auto 0; height:46%; border-radius: 34px 34px 60% 60% / 34px 34px 22% 22%;
    background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0));
    pointer-events:none; opacity:.7;
  }

  .pass > *{ position: relative; transform: translateZ(28px); }

  /* ===== Header row ===== */
  .head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 20px;
  }
  .brand{ display:flex; align-items:center; gap:11px; }
  .logo{
    width:38px; height:38px; border-radius:12px; display:grid; place-items:center;
    background: linear-gradient(150deg, rgba(124,198,255,.9), rgba(200,168,255,.85));
    box-shadow: 0 6px 16px rgba(124,198,255,.35), inset 0 1px 0 rgba(255,255,255,.6);
    color:#0a0e16;
  }
  .logo svg{ width:20px; height:20px; }
  .brand .name{ font-weight:800; font-size:15px; letter-spacing:.2px; }
  .brand .sub{ font-size:11px; color:var(--muted); letter-spacing:.16em; text-transform:uppercase; }
  .pill{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.12em;
    padding:7px 13px; border-radius:999px; color:var(--ink);
    background: rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 3px 10px rgba(0,0,0,.3);
    display:flex; align-items:center; gap:7px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:#5ff0a8; box-shadow:0 0 10px #5ff0a8; }

  /* ===== Route ===== */
  .route{ display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap:8px; margin: 6px 0 22px; }
  .city{ text-align:center; }
  .city.from{ text-align:left; }
  .city.to{ text-align:right; }
  .code{ font-size:46px; font-weight:800; line-height:1; letter-spacing:-1px; }
  .place{ font-size:12px; color:var(--muted); margin-top:6px; letter-spacing:.04em; }
  .planewrap{ display:flex; flex-direction:column; align-items:center; gap:6px; min-width:74px; }
  .line{ position:relative; width:74px; height:1px; background:repeating-linear-gradient(90deg, rgba(255,255,255,.4) 0 5px, transparent 5px 11px); }
  .line svg{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:22px; height:22px; color:var(--accent); filter:drop-shadow(0 0 8px rgba(124,198,255,.6)); }
  .dur{ font-size:11px; color:var(--faint); letter-spacing:.1em; }

  /* ===== Floating stat tiles ===== */
  .tiles{ display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-bottom:18px; }
  .tile{
    border-radius:16px; padding:12px 10px; text-align:center;
    background: rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 6px 16px rgba(0,0,0,.32);
    transition: transform .25s ease, background .25s ease;
  }
  .tile:hover{ transform: translateY(-3px); background: rgba(255,255,255,0.1); }
  .tile .k{ font-size:9.5px; color:var(--faint); letter-spacing:.18em; text-transform:uppercase; margin-bottom:6px; }
  .tile .v{ font-size:17px; font-weight:700; font-family:'JetBrains Mono', monospace; }

  /* ===== Perforation divider ===== */
  .perf{ position:relative; height:30px; margin: 4px -26px 16px; display:flex; align-items:center; }
  .perf .notch{ position:absolute; top:50%; transform:translateY(-50%); width:28px; height:28px; border-radius:50%; background:#000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
  .perf .notch.l{ left:-14px; } .perf .notch.r{ right:-14px; }
  .perf .dash{ flex:1; height:1px; margin:0 22px; background:repeating-linear-gradient(90deg, rgba(255,255,255,.32) 0 7px, transparent 7px 14px); }

  /* ===== Detail grid ===== */
  .grid{ display:grid; grid-template-columns: repeat(4,1fr); gap:14px 10px; margin-bottom:18px; }
  .grid .k{ font-size:9.5px; color:var(--faint); letter-spacing:.16em; text-transform:uppercase; margin-bottom:4px; }
  .grid .v{ font-size:14px; font-weight:700; }
  .grid .v.big{ color:var(--accent); }

  /* ===== Barcode ===== */
  .barcode{
    border-radius:16px; padding:14px 16px; display:flex; align-items:center; gap:14px;
    background: rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22);
  }
  .bars{ flex:1; height:46px; display:flex; gap:2px; align-items:stretch; }
  .bars i{ display:block; background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.66)); border-radius:1px; }
  .seat{ text-align:right; }
  .seat .k{ font-size:9px; color:var(--faint); letter-spacing:.16em; }
  .seat .v{ font-size:28px; font-weight:800; line-height:1; font-family:'JetBrains Mono', monospace; }

  /* ===== Liquidness control (the interaction) ===== */
  .control{
    margin-top:18px; display:flex; align-items:center; gap:14px;
    color:var(--muted); font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:600;
  }
  .control label{ white-space:nowrap; }
  input[type=range]{
    -webkit-appearance:none; appearance:none; flex:1; height:6px; border-radius:999px; outline:none;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent) calc(var(--liquid)*100%), rgba(255,255,255,.14) calc(var(--liquid)*100%));
    box-shadow: inset 0 1px 2px rgba(0,0,0,.5);
    cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:18px; height:18px; border-radius:50%;
    background:#fff; border:1px solid rgba(255,255,255,.7);
    box-shadow:0 3px 10px rgba(0,0,0,.5), 0 0 14px rgba(124,198,255,.7);
  }
  input[type=range]::-moz-range-thumb{
    width:18px; height:18px; border:none; border-radius:50%; background:#fff;
    box-shadow:0 3px 10px rgba(0,0,0,.5), 0 0 14px rgba(124,198,255,.7); cursor:pointer;
  }
  .val{ font-family:'JetBrains Mono', monospace; color:var(--ink); min-width:34px; text-align:right; }

  /* ===== Responsive (mobile 390) ===== */
  @media (max-width: 460px){
    body{ padding: 28px 16px; }
    .stage{ width:100%; perspective:none; }
    .pass{ padding:22px 20px 18px; border-radius:28px; }
    .pass::after{ border-radius:28px 28px 60% 60% / 28px 28px 22% 22%; }
    .code{ font-size:38px; }
    .tiles{ grid-template-columns: repeat(2,1fr); }
    .grid{ grid-template-columns: repeat(2,1fr); }
    .perf{ margin-left:-20px; margin-right:-20px; }
    .seat .v{ font-size:24px; }
  }

  @media (prefers-reduced-motion: reduce){
    .pass{ transition:none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <article class="pass" id="pass" aria-label="Boarding pass for flight AX 218 from San Francisco to Tokyo">
      <!-- header -->
      <div class="head">
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20M2 12l4-4M2 12l4 4M22 8l-4 4 4 4"/></svg>
          </span>
          <div>
            <div class="name">AURORA AIR</div>
            <div class="sub">Boarding Pass</div>
          </div>
        </div>
        <div class="pill"><span class="dot"></span> ON TIME</div>
      </div>

      <!-- route -->
      <div class="route">
        <div class="city from">
          <div class="code">SFO</div>
          <div class="place">San Francisco</div>
        </div>
        <div class="planewrap">
          <div class="line" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L11 19v-5.5z"/></svg>
          </div>
          <div class="dur">11h 05m</div>
        </div>
        <div class="city to">
          <div class="code">HND</div>
          <div class="place">Tokyo Haneda</div>
        </div>
      </div>

      <!-- floating stat tiles -->
      <div class="tiles">
        <div class="tile"><div class="k">Flight</div><div class="v">AX218</div></div>
        <div class="tile"><div class="k">Gate</div><div class="v">B12</div></div>
        <div class="tile"><div class="k">Terminal</div><div class="v">2</div></div>
        <div class="tile"><div class="k">Zone</div><div class="v">3</div></div>
      </div>

      <!-- perforation -->
      <div class="perf" aria-hidden="true">
        <span class="notch l"></span>
        <span class="dash"></span>
        <span class="notch r"></span>
      </div>

      <!-- detail grid -->
      <div class="grid">
        <div><div class="k">Passenger</div><div class="v">A. NAKAMURA</div></div>
        <div><div class="k">Class</div><div class="v big">BUSINESS</div></div>
        <div><div class="k">Date</div><div class="v">20 JUN</div></div>
        <div><div class="k">Boarding</div><div class="v big">21:40</div></div>
      </div>

      <!-- barcode + seat -->
      <div class="barcode">
        <div class="bars" id="bars" aria-hidden="true"></div>
        <div class="seat">
          <div class="k">SEAT</div>
          <div class="v">2A</div>
        </div>
      </div>

      <!-- liquidness control -->
      <div class="control">
        <label for="liquid">Liquidness</label>
        <input id="liquid" type="range" min="0" max="100" value="50" aria-label="Card liquidness" />
        <span class="val" id="liquidVal">50</span>
      </div>
    </article>
  </main>

<script>
(function(){
  var pass = document.getElementById('pass');
  var root = document.documentElement;

  /* ---- procedural barcode ---- */
  var bars = document.getElementById('bars');
  var frag = document.createDocumentFragment();
  for(var i=0;i<58;i++){
    var b = document.createElement('i');
    var w = (Math.random()*3 + 1).toFixed(1);
    b.style.flex = w;
    b.style.opacity = (0.5 + Math.random()*0.5).toFixed(2);
    frag.appendChild(b);
  }
  bars.appendChild(frag);

  /* ---- liquidness slider drives blur, saturation, glow ---- */
  var slider = document.getElementById('liquid');
  var valEl = document.getElementById('liquidVal');
  function applyLiquid(){
    var t = +slider.value / 100;            // 0..1
    root.style.setProperty('--liquid', t);
    root.style.setProperty('--blur', (10 + t*30).toFixed(1) + 'px');   // 10..40px
    root.style.setProperty('--sat',  (1 + t*1.0).toFixed(2));          // 1..2
    valEl.textContent = slider.value;
  }
  slider.addEventListener('input', applyLiquid);
  applyLiquid();

  /* ---- mouse-follow glow + tilt ---- */
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fine   = window.matchMedia('(pointer: fine)').matches;
  var raf = null, rx = 0, ry = 0;

  function onMove(e){
    var r = pass.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width;
    var py = (e.clientY - r.top)  / r.height;
    root.style.setProperty('--mx', (px*100).toFixed(1) + '%');
    root.style.setProperty('--my', (py*100).toFixed(1) + '%');
    if(reduce) return;
    ry = (px - 0.5) * 14;   // rotateY
    rx = (0.5 - py) * 12;   // rotateX
    if(!raf) raf = requestAnimationFrame(tick);
  }
  function tick(){
    raf = null;
    pass.style.transform = 'rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg)';
  }
  function reset(){
    root.style.setProperty('--mx','50%');
    root.style.setProperty('--my','50%');
    if(!reduce) pass.style.transform = 'rotateX(0deg) rotateY(0deg)';
  }

  if(fine){
    pass.addEventListener('mousemove', onMove);
    pass.addEventListener('mouseleave', reset);
  }
})();
</script>
</body>
</html>
