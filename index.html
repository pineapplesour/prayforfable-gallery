<!DOCTYPE html><html lang=ko><head>
<meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#0a0a0f"><title>prayforfable · 생성 갤러리</title>
<link rel=stylesheet href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%}
body{background:#0a0a0f;color:#f0eef7;font-family:Pretendard,system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding-top:env(safe-area-inset-top)}
.bar{flex:none;padding:8px 10px 6px;border-bottom:1px solid #221f2e}
.title{font-weight:800;font-size:14px;margin-bottom:8px}
.title b{background:linear-gradient(120deg,#a78bfa,#f0abfc,#fca5a5);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
/* tab row with scroll arrows */
.tabrow{display:flex;align-items:center;gap:6px}
.tscroll{flex:none;width:38px;height:40px;border-radius:10px;border:1px solid #2c2839;background:#1b1825;color:#f0eef7;font-size:20px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tscroll:active{background:#2c2839}
.tabs{flex:1;display:flex;gap:7px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding:2px}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid #2c2839;background:#15131d;color:#a79fc0;padding:9px 15px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap;cursor:pointer}
.tab.on{background:linear-gradient(120deg,#7c3aed,#db2777);color:#fff;border-color:transparent}
/* stage */
.fw{flex:1;min-height:0;position:relative;background:#000}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
/* big edge nav */
.edge{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:64px;height:64px;border-radius:50%;
  border:2px solid rgba(255,255,255,.25);background:rgba(15,12,22,.66);color:#fff;font-size:34px;font-weight:800;
  cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);box-shadow:0 6px 20px rgba(0,0,0,.5)}
.edge:hover{background:rgba(124,58,237,.85);border-color:#fff}
.edge.prev{left:14px}.edge.next{right:14px}
.openbtn{position:absolute;top:12px;right:14px;z-index:5;font-size:12px;color:#fff;background:rgba(15,12,22,.7);border:1px solid #2c2839;border-radius:8px;padding:8px 11px;text-decoration:none;font-weight:700}
.lbl{position:absolute;top:12px;left:14px;z-index:5;background:rgba(15,12,22,.7);border:1px solid #2c2839;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* big bottom nav bar */
.nav{flex:none;display:flex;align-items:stretch;gap:10px;padding:10px;border-top:1px solid #221f2e;background:#121019}
.nav .big{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;height:60px;border-radius:14px;
  border:1px solid #2c2839;background:#1b1825;color:#fff;font-size:18px;font-weight:800;cursor:pointer}
.nav .big:active{background:#2c2839}
.nav .big.acc{background:linear-gradient(120deg,#7c3aed,#db2777);border-color:transparent}
.nav .ct{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:96px;padding:0 8px}
.nav .ct .n{font-size:18px;font-weight:800}
.nav .ct .nm{font-size:11px;color:#a79fc0;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arr{font-size:26px;line-height:1}
@media (max-width:560px){ .edge{width:52px;height:52px;font-size:28px} .nav .big{font-size:15px;height:56px} }
</style></head><body>
<div class=bar>
  <div class=title>STYLE<b>:ON</b> 생성 갤러리 — 탭=트랙, 화살표로 차례 이동</div>
  <div class=tabrow>
    <button class=tscroll id=tprev>‹</button>
    <div class=tabs id=tabs></div>
    <button class=tscroll id=tnext>›</button>
  </div>
</div>
<div class=fw>
  <div class=lbl id=lbl>로딩…</div>
  <a class=openbtn id=open target=_blank rel=noopener>전체화면 ↗</a>
  <button class="edge prev" id=eprev aria-label=이전>‹</button>
  <iframe id=fr title=preview allow=autoplay></iframe>
  <button class="edge next" id=enext aria-label=다음>›</button>
</div>
<div class=nav>
  <button class=big id=prev><span class=arr>‹</span> 이전</button>
  <div class=ct><span class=n id=ct>0/0</span><span class=nm id=nm></span></div>
  <button class="big acc" id=next>다음 <span class=arr>›</span></button>
</div>
<script>
let DATA={groups:[]},gi=0,ii=0;const $=x=>document.getElementById(x);
function grp(){return DATA.groups[gi]||{items:[]};}
function cur(){return grp().items[ii];}
let _ft=null;
function loadFrame(src){const fr=$('fr');try{fr.src='about:blank';}catch(e){}clearTimeout(_ft);_ft=setTimeout(()=>{fr.src=src;},230);}
function render(){
  $('tabs').innerHTML='';
  DATA.groups.forEach((g,k)=>{const b=document.createElement('div');b.className='tab'+(k===gi?' on':'');b.textContent=g.label;b.onclick=()=>{gi=k;ii=0;render();const on=$('tabs').children[k];on&&on.scrollIntoView({inline:'center',block:'nearest'});};$('tabs').appendChild(b);});
  const it=cur();if(!it){$('fr').src='about:blank';$('ct').textContent='0/0';$('nm').textContent='';$('lbl').textContent='(없음)';return;}
  $('open').href=it.path; loadFrame(it.path+'?v='+(DATA.updated||''));
  $('ct').textContent=(ii+1)+' / '+grp().items.length;
  $('nm').textContent=it.id; $('lbl').textContent=grp().label.replace(/\s*\(\d+\)$/,'')+' — '+it.id;
}
function nx(){const n=grp().items.length;if(n){ii=(ii+1)%n;render();}}
function pv(){const n=grp().items.length;if(n){ii=(ii-1+n)%n;render();}}
$('next').onclick=nx;$('prev').onclick=pv;$('enext').onclick=nx;$('eprev').onclick=pv;
$('tnext').onclick=()=>$('tabs').scrollBy({left:240,behavior:'smooth'});
$('tprev').onclick=()=>$('tabs').scrollBy({left:-240,behavior:'smooth'});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nx();else if(e.key==='ArrowLeft')pv();});
let sx=0;const fw=document.querySelector('.fw');
fw.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
fw.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)dx<0?nx():pv();},{passive:true});
fetch('manifest.json?ts='+Date.now()).then(r=>r.json()).then(d=>{DATA=d;render();}).catch(()=>{$('lbl').textContent='manifest 로드 실패';});
</script></body></html>
