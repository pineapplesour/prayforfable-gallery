<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verso — 노트</title>
<style>
  :root {
    --bg: #f4f3ef;
    --panel: #ffffff;
    --panel-2: #fbfaf7;
    --ink: #1d1c1a;
    --ink-2: #57544f;
    --ink-3: #8d8a83;
    --line: #e8e6e0;
    --line-2: #f0eee9;
    --accent: #4b5bd6;
    --accent-soft: #eef0fc;
    --accent-ink: #2f3aa8;
    --amber: #d6a23a;
    --rose: #d97a6c;
    --sage: #6c9c7d;
    --sky: #5b9bd0;
    --shadow-sm: 0 1px 2px rgba(28,27,25,.05);
    --shadow-md: 0 6px 24px -8px rgba(28,27,25,.16), 0 2px 6px -2px rgba(28,27,25,.06);
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", "Georgia", "Noto Serif KR", serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--ui);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  ::selection { background: var(--accent-soft); }

  /* ---------- Layout ---------- */
  .app {
    display: grid;
    grid-template-columns: 256px 348px 1fr;
    height: 100vh;
    width: 100%;
  }

  /* ---------- Sidebar ---------- */
  .rail {
    background: var(--panel-2);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .rail__top {
    padding: 18px 16px 12px;
  }
  .ws {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 8px;
    border-radius: var(--r-sm);
    transition: background .16s ease;
  }
  .ws:hover { background: var(--line-2); }
  .ws__mark {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: linear-gradient(150deg, #4b5bd6, #6d77e8);
    color: #fff;
    display: grid; place-items: center;
    font-weight: 700; font-size: 14px;
    box-shadow: var(--shadow-sm);
    flex: none;
  }
  .ws__meta { min-width: 0; line-height: 1.25; }
  .ws__name { font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }
  .ws__sub { font-size: 11.5px; color: var(--ink-3); }
  .ws__chev { margin-left: auto; color: var(--ink-3); flex: none; }

  .search {
    margin: 6px 16px 14px;
    position: relative;
  }
  .search input {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: var(--r-sm);
    padding: 8px 10px 8px 32px;
    font-size: 13px;
    color: var(--ink);
    transition: border-color .16s ease, box-shadow .16s ease;
  }
  .search input::placeholder { color: var(--ink-3); }
  .search input:focus {
    outline: none;
    border-color: #c8cdf4;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }

  .nav { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 16px; }
  .nav::-webkit-scrollbar { width: 8px; }
  .nav::-webkit-scrollbar-thumb { background: #e2e0d9; border-radius: 8px; border: 2px solid var(--panel-2); }

  .nav__label {
    font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-3);
    padding: 14px 10px 6px;
  }
  .nav__item {
    width: 100%;
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px;
    border-radius: var(--r-sm);
    font-size: 13px;
    color: var(--ink-2);
    transition: background .14s ease, color .14s ease;
    text-align: left;
  }
  .nav__item:hover { background: var(--line-2); color: var(--ink); }
  .nav__item.is-active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .nav__item.is-active .nav__ic { color: var(--accent); }
  .nav__ic { color: var(--ink-3); flex: none; transition: color .14s ease; }
  .nav__item .count { margin-left: auto; font-size: 11.5px; color: var(--ink-3); font-weight: 500; }
  .nav__item.is-active .count { color: var(--accent); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

  .rail__foot {
    border-top: 1px solid var(--line);
    padding: 10px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: #e7e4dc url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'/>") center/cover;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 600; color: var(--ink-2);
    flex: none;
  }
  .rail__foot .nm { font-size: 12.5px; font-weight: 600; line-height: 1.2; }
  .rail__foot .pl { font-size: 11px; color: var(--ink-3); }

  /* ---------- List ---------- */
  .list {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .list__head {
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--line-2);
  }
  .list__title-row { display: flex; align-items: center; justify-content: space-between; }
  .list__title { font-size: 17px; font-weight: 650; letter-spacing: -.02em; }
  .iconbtn {
    width: 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center; color: var(--ink-2);
    transition: background .14s ease, color .14s ease;
  }
  .iconbtn:hover { background: var(--line-2); color: var(--ink); }
  .iconbtn.primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
  .iconbtn.primary:hover { background: #3f4fce; color: #fff; }

  .list__meta {
    margin-top: 8px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--ink-3);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 9px; border-radius: 99px;
    font-size: 11.5px; font-weight: 500;
    background: var(--line-2); color: var(--ink-2);
    transition: background .14s ease;
  }
  .chip:hover { background: var(--line); }
  .chip svg { color: var(--ink-3); }

  .list__scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; }
  .list__scroll::-webkit-scrollbar { width: 8px; }
  .list__scroll::-webkit-scrollbar-thumb { background: #e9e7e0; border-radius: 8px; border: 2px solid var(--panel); }

  .card {
    position: relative;
    width: 100%; text-align: left;
    padding: 13px 14px 14px 16px;
    border-radius: var(--r-md);
    transition: background .14s ease;
    display: block;
  }
  .card + .card { margin-top: 2px; }
  .card::before {
    content: ""; position: absolute; left: 6px; top: 16px; bottom: 16px;
    width: 3px; border-radius: 3px; background: transparent;
    transition: background .16s ease;
  }
  .card:hover { background: var(--panel-2); }
  .card.is-active { background: #fff; box-shadow: var(--shadow-md); }
  .card.is-active::before { background: var(--accent); }

  .card__top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .card__title { font-size: 14px; font-weight: 600; letter-spacing: -.01em; color: var(--ink); line-height: 1.35; }
  .card__time { font-size: 11px; color: var(--ink-3); flex: none; white-space: nowrap; }
  .card__excerpt {
    margin-top: 4px; font-size: 12.5px; line-height: 1.5; color: var(--ink-2);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card__foot { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
  .tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--ink-2);
    padding: 2px 8px; border-radius: 6px; background: var(--line-2);
  }
  .card__star { margin-left: auto; color: var(--amber); display: none; }
  .card.is-fav .card__star { display: block; }

  /* ---------- Editor ---------- */
  .editor {
    background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
    position: relative;
  }
  .editor__bar {
    height: 52px; flex: none;
    display: flex; align-items: center; gap: 6px;
    padding: 0 18px;
    border-bottom: 1px solid var(--line-2);
  }
  .crumb { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-3); }
  .crumb b { color: var(--ink-2); font-weight: 600; }
  .crumb svg { opacity: .6; }
  .bar__spacer { flex: 1; }
  .toolset { display: flex; align-items: center; gap: 2px; }
  .tool {
    width: 30px; height: 30px; border-radius: 7px;
    display: grid; place-items: center; color: var(--ink-2);
    transition: background .14s ease, color .14s ease;
  }
  .tool:hover { background: var(--line-2); color: var(--ink); }
  .tool.is-on { background: var(--accent-soft); color: var(--accent-ink); }
  .bar__sep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; }
  .share {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 13px; border-radius: 8px;
    font-size: 12.5px; font-weight: 600;
    background: var(--ink); color: #fff;
    transition: background .16s ease;
  }
  .share:hover { background: #34322e; }

  .doc__scroll { flex: 1; min-height: 0; overflow-y: auto; }
  .doc__scroll::-webkit-scrollbar { width: 10px; }
  .doc__scroll::-webkit-scrollbar-thumb { background: #e9e7e0; border-radius: 8px; border: 3px solid var(--panel); }
  .doc {
    max-width: 720px;
    margin: 0 auto;
    padding: 44px 56px 120px;
  }
  .doc__kicker {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; color: var(--ink-3); margin-bottom: 18px;
  }
  .doc__kicker .tag { background: var(--accent-soft); color: var(--accent-ink); }

  .doc h1 {
    font-family: var(--serif);
    font-size: 34px; line-height: 1.18; letter-spacing: -.02em;
    font-weight: 600; color: var(--ink);
    margin-bottom: 14px;
  }
  .doc__sub { font-size: 14px; color: var(--ink-3); margin-bottom: 28px; display: flex; gap: 16px; align-items: center; }
  .doc__sub span { display: inline-flex; gap: 6px; align-items: center; }

  .doc h2 {
    font-family: var(--serif);
    font-size: 21px; line-height: 1.3; letter-spacing: -.01em;
    font-weight: 600; margin: 32px 0 10px;
  }
  .doc p {
    font-family: var(--serif);
    font-size: 16px; line-height: 1.72; color: #2c2a27;
    margin-bottom: 16px;
  }
  .doc p .hl { background: #fdf3d6; padding: 0 3px; border-radius: 3px; }
  .doc a.ln { color: var(--accent-ink); text-decoration: none; border-bottom: 1px solid #c5cbf2; }

  .callout {
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 var(--r-md) var(--r-md) 0;
    padding: 14px 18px;
    margin: 22px 0;
  }
  .callout p { margin: 0; font-size: 15px; color: var(--accent-ink); font-family: var(--ui); line-height: 1.6; }

  .checklist { margin: 8px 0 18px; }
  .check {
    display: flex; align-items: flex-start; gap: 11px;
    padding: 6px 4px; border-radius: 8px;
    transition: background .12s ease;
    cursor: pointer;
  }
  .check:hover { background: var(--panel-2); }
  .check__box {
    width: 19px; height: 19px; border-radius: 6px;
    border: 1.8px solid #cfccc4; flex: none; margin-top: 2px;
    display: grid; place-items: center;
    transition: background .16s ease, border-color .16s ease;
  }
  .check__box svg { opacity: 0; transform: scale(.6); transition: opacity .16s ease, transform .16s ease; color: #fff; }
  .check.done .check__box { background: var(--accent); border-color: var(--accent); }
  .check.done .check__box svg { opacity: 1; transform: scale(1); }
  .check__txt { font-family: var(--serif); font-size: 16px; line-height: 1.5; color: #2c2a27; transition: color .16s ease; }
  .check.done .check__txt { color: var(--ink-3); text-decoration: line-through; }

  .divider { height: 1px; background: var(--line); margin: 30px 0; border: none; }

  .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0 8px; }
  .swatch {
    height: 96px; border-radius: var(--r-md);
    display: flex; align-items: flex-end; padding: 12px;
    font-size: 12px; font-weight: 600; color: #fff;
    box-shadow: var(--shadow-sm);
  }

  .doc__foot {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 40px;
    display: flex; align-items: center; gap: 18px;
    padding: 0 24px;
    border-top: 1px solid var(--line-2);
    background: rgba(255,255,255,.86);
    backdrop-filter: blur(8px);
    font-size: 12px; color: var(--ink-3);
  }
  .doc__foot .sep { color: var(--line); }

  /* ---------- mobile nav button ---------- */
  .mobtop { display: none; }
  .back { display: none; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1080px) {
    .app { grid-template-columns: 0 320px 1fr; }
    .rail { position: fixed; left: 0; top: 0; bottom: 0; width: 256px; z-index: 40; transform: translateX(-100%); transition: transform .24s ease; box-shadow: var(--shadow-md); }
    .rail.open { transform: translateX(0); }
    .scrim { position: fixed; inset: 0; background: rgba(28,27,25,.28); opacity: 0; pointer-events: none; transition: opacity .24s ease; z-index: 39; }
    .scrim.show { opacity: 1; pointer-events: auto; }
    .mobtop { display: inline-grid; }
  }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .list { grid-column: 1; }
    .editor {
      position: fixed; inset: 0; z-index: 30;
      transform: translateX(100%); transition: transform .26s cubic-bezier(.4,0,.2,1);
    }
    body.viewing .editor { transform: translateX(0); }
    .back { display: inline-grid; }
    .doc { padding: 32px 22px 110px; }
    .doc h1 { font-size: 28px; }
    .gallery { grid-template-columns: 1fr 1fr; }
  }

  .scrim { display: none; }
  @media (max-width: 1080px) { .scrim { display: block; } }
</style>
</head>
<body>
  <div class="scrim" id="scrim"></div>

  <div class="app">
    <!-- SIDEBAR -->
    <aside class="rail" id="rail">
      <div class="rail__top">
        <div class="ws">
          <div class="ws__mark">V</div>
          <div class="ws__meta">
            <div class="ws__name">Verso 워크스페이스</div>
            <div class="ws__sub">개인 · 218개 노트</div>
          </div>
          <svg class="ws__chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 9l4 4 4-4"/></svg>
        </div>
      </div>

      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="filter" type="text" placeholder="노트 검색…" />
      </div>

      <nav class="nav">
        <button class="nav__item is-active">
          <svg class="nav__ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z" opacity=".0"/><path d="M3 7l9-4 9 4v10l-9 4-9-4z" opacity="0"/><path d="M4 5h16M4 12h16M4 19h10"/></svg>
          모든 노트 <span class="count">218</span>
        </button>
        <button class="nav__item">
          <svg class="nav__ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg>
          즐겨찾기 <span class="count">9</span>
        </button>
        <button class="nav__item">
          <svg class="nav__ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 7v10M7 12h10" opacity="0"/><circle cx="12" cy="12" r="9" opacity="0"/><path d="M5 7h14M5 12h14M5 17h9"/></svg>
          최근 항목 <span class="count">24</span>
        </button>

        <div class="nav__label">노트북</div>
        <button class="nav__item"><span class="dot" style="background:var(--accent)"></span>디자인 시스템 <span class="count">42</span></button>
        <button class="nav__item"><span class="dot" style="background:var(--sage)"></span>제품 리서치 <span class="count">31</span></button>
        <button class="nav__item"><span class="dot" style="background:var(--amber)"></span>주간 회고 <span class="count">58</span></button>
        <button class="nav__item"><span class="dot" style="background:var(--rose)"></span>개인 메모 <span class="count">77</span></button>

        <div class="nav__label">태그</div>
        <button class="nav__item"><svg class="nav__ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l9-9h7v7l-9 9z"/><circle cx="15.5" cy="8.5" r="1.3"/></svg>초안</button>
        <button class="nav__item"><svg class="nav__ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l9-9h7v7l-9 9z"/><circle cx="15.5" cy="8.5" r="1.3"/></svg>아이디어</button>
        <button class="nav__item"><svg class="nav__ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l9-9h7v7l-9 9z"/><circle cx="15.5" cy="8.5" r="1.3"/></svg>참고자료</button>
      </nav>

      <div class="rail__foot">
        <div class="avatar">서연</div>
        <div>
          <div class="nm">윤서연</div>
          <div class="pl">Pro 플랜</div>
        </div>
      </div>
    </aside>

    <!-- LIST -->
    <section class="list">
      <div class="list__head">
        <div class="list__title-row">
          <button class="iconbtn mobtop" id="menuBtn" aria-label="메뉴" style="margin-right:8px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="list__title">모든 노트</div>
          <button class="iconbtn primary" id="newBtn" aria-label="새 노트">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div class="list__meta">
          <span class="chip">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 12h10M4 6h16M10 18h4"/></svg>
            정렬: 수정일
          </span>
          <span class="chip">전체</span>
          <span style="margin-left:auto">218개</span>
        </div>
      </div>

      <div class="list__scroll" id="listScroll"><!-- cards injected --></div>
    </section>

    <!-- EDITOR -->
    <section class="editor">
      <div class="editor__bar">
        <button class="iconbtn back" id="backBtn" aria-label="뒤로">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <div class="crumb">
          <span>디자인 시스템</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
          <b id="crumbTitle">컴포넌트 토큰 정리</b>
        </div>
        <div class="bar__spacer"></div>
        <div class="toolset">
          <button class="tool is-on" title="굵게"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 5h7a3.5 3.5 0 010 7H7zM7 12h8a3.5 3.5 0 010 7H7z"/></svg></button>
          <button class="tool" title="기울임"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 5h-6M11 19H5M15 5l-4 14"/></svg></button>
          <button class="tool" title="목록"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h12M8 12h12M8 18h12M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></button>

  });
  document.getElementById('backBtn').addEventListener('click', () => {
    document.body.classList.remove('viewing');
  });

  // editor toolbar toggle feel
  document.querySelectorAll('.toolset .tool').forEach(t => {
    t.addEventListener('click', () => t.classList.toggle('is-on'));
  });

  // init
  renderList();
  openNote('n1');
  bindChecks();
</script>
</body>
</html>
