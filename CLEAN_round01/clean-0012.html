<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cadence — 팀 보드</title>
<style>
  /* ============ Reset & Tokens ============ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #fbfbfc;
    --ink-900: #15181d;
    --ink-700: #3a3f47;
    --ink-500: #6b7280;
    --ink-400: #98a0ab;
    --ink-300: #c2c8d0;
    --line: #e8eaee;
    --line-strong: #dfe2e7;
    --accent: #4f46e5;
    --accent-soft: #eef0fe;
    --accent-ink: #4338ca;
    --radius-s: 7px;
    --radius-m: 10px;
    --radius-l: 14px;
    --shadow-card: 0 1px 2px rgba(20,24,32,.05), 0 1px 1px rgba(20,24,32,.03);
    --shadow-pop: 0 12px 32px -8px rgba(20,24,32,.18), 0 4px 10px -4px rgba(20,24,32,.10);
    --shadow-drag: 0 18px 40px -10px rgba(20,24,32,.28);
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;

    /* status hues */
    --c-backlog: #8b93a1;
    --c-todo: #3b82f6;
    --c-progress: #f59e0b;
    --c-review: #8b5cf6;
    --c-done: #10b981;
  }

  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink-900);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "cv05" 1, "ss01" 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ============ Top Bar ============ */
  .topbar {
    height: 56px;
    flex: 0 0 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 22px;
    z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(140deg, #6366f1, #4f46e5);
    display: grid; place-items: center;
    box-shadow: 0 2px 6px rgba(79,70,229,.35);
  }
  .brand-mark svg { width: 16px; height: 16px; }
  .brand-name { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }

  .crumb {
    display: flex; align-items: center; gap: 9px;
    color: var(--ink-400); font-size: 13px;
    padding-left: 18px; border-left: 1px solid var(--line);
    height: 24px;
  }
  .crumb .sep { color: var(--ink-300); }
  .crumb .cur { color: var(--ink-700); font-weight: 550; }

  .topbar-spacer { flex: 1 1 auto; }

  .search {
    position: relative; flex: 0 0 auto; width: 232px;
  }
  .search input {
    width: 100%; height: 34px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-s);
    background: var(--surface-2);
    padding: 0 12px 0 32px;
    font-family: inherit; font-size: 13px; color: var(--ink-900);
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .search input::placeholder { color: var(--ink-400); }
  .search input:focus {
    outline: none; background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--ink-400); }

  .icon-btn {
    width: 34px; height: 34px; border-radius: var(--radius-s);
    border: 1px solid var(--line-strong); background: var(--surface);
    display: grid; place-items: center; cursor: pointer; color: var(--ink-500);
    transition: background .15s, color .15s, border-color .15s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink-900); border-color: var(--ink-300); }
  .icon-btn svg { width: 17px; height: 17px; }

  .avatar-stack { display: flex; align-items: center; }
  .avatar-stack .avatar { margin-left: -7px; border: 2px solid var(--surface); }
  .avatar-stack .avatar:first-child { margin-left: 0; }

  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 650; color: #fff;
    flex: 0 0 auto; user-select: none;
  }
  .avatar.sm { width: 22px; height: 22px; font-size: 9.5px; }

  .btn-primary {
    height: 34px; padding: 0 14px; border: none; cursor: pointer;
    border-radius: var(--radius-s); background: var(--accent); color: #fff;
    font-family: inherit; font-size: 13px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
    box-shadow: 0 1px 2px rgba(79,70,229,.4);
    transition: background .15s, transform .08s;
  }
  .btn-primary:hover { background: #4338ca; }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary svg { width: 15px; height: 15px; }

  /* ============ Sub Bar ============ */
  .subbar {
    height: 52px; flex: 0 0 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px;
    padding: 0 22px; z-index: 10;
  }
  .seg {
    display: inline-flex; background: var(--surface-2);
    border: 1px solid var(--line-strong); border-radius: var(--radius-s);
    padding: 2px; gap: 2px;
  }
  .seg button {
    height: 26px; padding: 0 11px; border: none; background: transparent;
    border-radius: 5px; font-family: inherit; font-size: 12.5px; font-weight: 550;
    color: var(--ink-500); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: background .15s, color .15s;
  }
  .seg button svg { width: 14px; height: 14px; }
  .seg button.active { background: var(--surface); color: var(--ink-900); box-shadow: var(--shadow-card); }

  .filter-chip {
    height: 30px; padding: 0 11px; border: 1px solid var(--line-strong);
    background: var(--surface); border-radius: var(--radius-s);
    font-family: inherit; font-size: 12.5px; font-weight: 500; color: var(--ink-700);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: background .15s, border-color .15s;
  }
  .filter-chip:hover { background: var(--surface-2); border-color: var(--ink-300); }
  .filter-chip svg { width: 14px; height: 14px; color: var(--ink-400); }
  .filter-chip .dot { width: 7px; height: 7px; border-radius: 50%; }

  .subbar-spacer { flex: 1 1 auto; }
  .meta-muted { font-size: 12.5px; color: var(--ink-400); display: flex; align-items: center; gap: 7px; }
  .meta-muted strong { color: var(--ink-700); font-weight: 600; }

  /* ============ Board ============ */
  .board-scroll {
    flex: 1 1 auto; overflow-x: auto; overflow-y: hidden;
    padding: 20px 22px 24px;
  }
  .board {
    display: flex; gap: 16px; height: 100%; align-items: flex-start;
    min-height: 100%;
  }
  .column {
    flex: 0 0 300px; width: 300px; max-height: 100%;
    display: flex; flex-direction: column;
    background: #f0f1f4;
    border: 1px solid var(--line);
    border-radius: var(--radius-l);
  }
  .col-head {
    display: flex; align-items: center; gap: 8px;
    padding: 13px 14px 11px;
  }
  .col-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .col-title { font-size: 13px; font-weight: 650; letter-spacing: -.005em; color: var(--ink-900); }
  .col-count {
    font-size: 11.5px; font-weight: 600; color: var(--ink-400);
    background: var(--surface); border: 1px solid var(--line-strong);
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 20px;
    display: grid; place-items: center;
  }
  .col-head .spacer { flex: 1; }
  .col-act { width: 24px; height: 24px; border-radius: 6px; border: none; background: transparent; color: var(--ink-400); cursor: pointer; display: grid; place-items: center; transition: background .15s, color .15s; }
  .col-act:hover { background: rgba(0,0,0,.05); color: var(--ink-700); }
  .col-act svg { width: 15px; height: 15px; }

  .col-body {
    flex: 1 1 auto; overflow-y: auto; padding: 2px 10px 10px;
    display: flex; flex-direction: column; gap: 9px;
    scrollbar-width: thin; scrollbar-color: var(--ink-300) transparent;
  }
  .col-body::-webkit-scrollbar { width: 8px; }
  .col-body::-webkit-scrollbar-thumb { background: transparent; border-radius: 8px; }
  .col-body:hover::-webkit-scrollbar-thumb { background: var(--ink-300); }

  .col-body.drop-active { background: rgba(79,70,229,.045); border-radius: var(--radius-m); }

  .add-card {
    margin: 0 10px 12px; height: 32px; border: 1px dashed var(--line-strong);
    background: transparent; border-radius: var(--radius-s); color: var(--ink-500);
    font-family: inherit; font-size: 12.5px; font-weight: 550; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .add-card:hover { background: var(--surface); color: var(--accent-ink); border-color: var(--accent); }
  .add-card svg { width: 14px; height: 14px; }

  /* ============ Card ============ */
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-m); padding: 12px 12px 11px;
    box-shadow: var(--shadow-card); cursor: grab;
    transition: box-shadow .15s, border-color .15s, transform .1s;
    position: relative;
  }
  .card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-pop); }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .4; }
  .card.ghost-lift { box-shadow: var(--shadow-drag); transform: rotate(1.5deg); }

  .card-labels { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
  .label {
    font-size: 10.5px; font-weight: 650; letter-spacing: .01em;
    padding: 2px 8px; border-radius: 5px; line-height: 1.4;
  }
  .label.design   { background: #fdeef4; color: #b53a73; }
  .label.eng      { background: #eaf1fe; color: #2f5fc4; }
  .label.research { background: #fff2e0; color: #b3700f; }
  .label.bug      { background: #fdeaea; color: #c0392b; }
  .label.ops      { background: #ecf6f0; color: #1c8d5a; }
  .label.content  { background: #f0eefe; color: #6d4bd1; }

  .card-title {
    font-size: 13.5px; font-weight: 560; line-height: 1.42;
    color: var(--ink-900); letter-spacing: -.006em;
    margin-bottom: 5px;
  }
  .card-desc {
    font-size: 12px; color: var(--ink-500); line-height: 1.5;
    margin-bottom: 11px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .card-progress { margin-bottom: 11px; }
  .progress-meta { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-400); margin-bottom: 5px; font-weight: 550; }
  .progress-track { height: 5px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width .4s cubic-bezier(.4,0,.2,1); }

  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-meta { display: flex; align-items: center; gap: 12px; color: var(--ink-400); }
  .meta-item { display: flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 550; }
  .meta-item svg { width: 13px; height: 13px; }
  .meta-item.due { padding: 2px 7px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); }
  .meta-item.due.soon { background: #fff4e5; border-color: #ffe2bd; color: #b3700f; }
  .meta-item.due.over { background: #fdeaea; border-color: #fad4d1; color: #c0392b; }

  .priority {
    position: absolute; top: 12px; right: 12px;
    display: flex; align-items: center; gap: 2px;
  }
  .pri-bar { width: 3px; border-radius: 2px; background: var(--ink-300); }
  .pri-bar.a { height: 7px; } .pri-bar.b { height: 10px; } .pri-bar.c { height: 13px; }
  .priority.high .pri-bar { background: #ef4444; }
  .priority.med .pri-bar.a, .priority.med .pri-bar.b { background: #f59e0b; }
  .priority.low .pri-bar.a { background: var(--c-todo); }

  /* empty column hint */
  .col-empty {
    border: 1px dashed var(--line-strong); border-radius: var(--radius-m);
    padding: 18px 12px; text-align: center; color: var(--ink-400);
    font-size: 12px; margin-top: 2px;
  }

  /* ============ Responsive: Mobile 390 ============ */
  @media (max-width: 640px) {
    .topbar { padding: 0 14px; gap: 12px; }
    .crumb { display: none; }
    .search { display: none; }
    .topbar .icon-btn.hide-m { display: none; }
    .btn-primary span { display: none; }
    .btn-primary { padding: 0 11px; }

    .subbar { padding: 0 14px; gap: 10px; overflow-x: auto; scrollbar-width: none; }
    .subbar::-webkit-scrollbar { display: none; }
    .subbar .meta-muted, .subbar-spacer { display: none; }
    .filter-chip { flex: 0 0 auto; }

    .board-scroll {
      padding: 16px 14px 18px;
      scroll-snap-type: x mandatory;
    }
    .board { height: 100%; }
    .column {
      flex: 0 0 84vw; width: 84vw; scroll-snap-align: start;
    }
  }
</style>
</head>

  <header class="topbar">

      <div class="brand-mark">

    <button class="filter-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>담당자<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>

    <div class="subbar-spacer"></div>

    <div class="meta-muted">6월 9일 마감 · <strong>23</strong>개 작업 · <strong>5</strong>명</div>
  </div>

  <!-- Board -->
  <main class="board-scroll">
    <div class="board" id="board"></div>

<script>
/* ============ Mock Data ============ */
const MEMBERS = {
  jh: { name: "정현우", color: "#4f46e5" },
  sy: { name: "서예린", color: "#0ea5e9" },

  bk: { name: "백도윤", color: "#ec4899" },
};
function initials(name){ return name.slice(0, name.length>=2?2:1).length===2 ? name.slice(0,2) : name; }
// Korean: take last 2 chars feel; we'll just take first char + second char if exists
function initialsK(name){ return name.length>=2 ? name.slice(name.length-2) : name; }

const COLUMNS = [
  { id: "backlog",  title: "백로그",     color: "var(--c-backlog)" },
  { id: "todo",     title: "할 일",      color: "var(--c-todo)" },
  { id: "progress", title: "진행 중",    color: "var(--c-progress)" },
  { id: "review",   title: "리뷰",       color: "var(--c-review)" },
  { id: "done",     title: "완료",       color: "var(--c-done)" },
];

const CARDS = [
  { col:"backlog", labels:[["research","리서치"]], title:"온보딩 이탈 구간 사용자 인터뷰 정리", desc:"3주차 인터뷰 8건의 핵심 페인포인트를 정성 코딩으로 군집화.", pri:"low", assignees:["sy","hj"], comments:2, attach:1, due:"6/14" },
  { col:"backlog", labels:[["design","디자인"],["content","콘텐츠"]], title:"빈 상태(Empty State) 일러스트 가이드", desc:"보드/리스트/검색 결과 없음 상태에 적용할 톤과 카피 정의.", pri:"low", assignees:["mk"], subtasks:[0,4], comments:0, attach:3, due:"6/20" },
  { col:"backlog", labels:[["eng","엔지니어링"]], title:"오프라인 캐시 전략 기술 검토", desc:"IndexedDB vs. 서비스 워커 캐시 비교, 동기화 충돌 시나리오 도출.", pri:"med", assignees:["jh"], comments:5, due:"6/24" },

  { col:"todo", labels:[["design","디자인"]], title:"보드 카드 컴포넌트 디자인 토큰 정리", desc:"간격·라운드·그림자 토큰을 Figma 변수로 통일하고 코드와 매핑.", pri:"med", assignees:["mk","sy"], subtasks:[1,6], comments:3, attach:2, due:"6/10" },
  { col:"todo", labels:[["eng","엔지니어링"]], title:"드래그 앤 드롭 키보드 접근성", desc:"방향키로 카드 이동, 포커스 링과 ARIA live 영역 안내 추가.", pri:"high", assignees:["jh"], subtasks:[0,3], comments:1, due:"6/11" },
  { col:"todo", labels:[["ops","운영"]], title:"릴리스 노트 자동 생성 워크플로", desc:"머지된 PR 라벨 기준으로 변경 로그 초안을 자동 생성.", pri:"low", assignees:["bk"], comments:0, due:"6/18" },
  { col:"todo", labels:[["content","콘텐츠"]], title:"도움말 센터 신규 가이드 3편 작성", desc:"보드 만들기 · 멤버 초대 · 자동화 설정 가이드 초안.", pri:"low", assignees:["hj"], subtasks:[1,3], attach:1, due:"6/19" },

  { col:"progress", labels:[["eng","엔지니어링"],["design","디자인"]], title:"실시간 협업 커서 동기화", desc:"WebSocket 기반 멀티 커서 표시, 100ms 이하 지연 목표로 보간 처리.", pri:"high", assignees:["jh","sy"], subtasks:[4,7], comments:8, attach:2, due:"6/9" },
  { col:"progress", labels:[["design","디자인"]], title:"모바일 보드 스와이프 인터랙션", desc:"컬럼 간 스냅 스크롤과 카드 길게 눌러 이동 제스처 프로토타입.", pri:"med", assignees:["mk"], subtasks:[2,5], comments:4, due:"6/12" },
  { col:"progress", labels:[["bug","버그"]], title:"필터 적용 시 카운트 불일치 수정", desc:"담당자 필터와 라벨 필터 조합에서 컬럼 카운트가 어긋나는 문제.", pri:"high", assignees:["bk"], comments:2, due:"6/9" },

  { col:"review", labels:[["eng","엔지니어링"]], title:"카드 상세 패널 라우팅 리팩터", desc:"URL 동기화와 뒤로가기 동작, 딥링크 진입 케이스 검증 요청.", pri:"med", assignees:["jh"], subtasks:[6,6], comments:6, attach:1, due:"6/10" },
  { col:"review", labels:[["content","콘텐츠"]], title:"온보딩 체크리스트 카피 검수", desc:"5단계 문구 톤 통일, 행동 유도형 동사로 재작성한 버전 리뷰.", pri:"low", assignees:["hj","sy"], comments:3, due:"6/13" },

  { col:"done", labels:[["design","디자인"]], title:"새 색상 시스템 적용", desc:"중립 그레이 9단계와 액센트 토큰을 전 화면에 반영 완료.", pri:"med", assignees:["mk"], subtasks:[8,8], comments:5, attach:4, due:"6/4", done:true },
  { col:"done", labels:[["eng","엔지니어링"]], title:"보드 가상 스크롤 성능 개선", desc:"1000+ 카드에서도 60fps 유지하도록 렌더 윈도잉 적용.", pri:"high", assignees:["jh"], subtasks:[5,5], comments:9, due:"6/3", done:true },
  { col:"done", labels:[["ops","운영"]], title:"E2E 테스트 파이프라인 안정화", desc:"플레이키 테스트 6건 격리, CI 평균 시간 40% 단축.", pri:"med", assignees:["bk","jh"], comments:2, due:"6/2", done:true },
];

/* ============ Render ============ */
const board = document.getElementById("board");

// top avatars
const topAv = document.getElementById("topAvatars");
["jh","sy","mk","hj"].forEach(k=>{
  const m = MEMBERS[k];
  const a = document.createElement("div");
  a.className = "avatar"; a.style.background = m.color; a.textContent = initialsK(m.name); a.title = m.name;
  topAv.appendChild(a);
});

function dueClass(due, done){
  if(done) return "";
  // simple heuristic vs "today" = 6/9
  const [mm,dd] = due.split("/").map(Number);
  const today = 9;
  if(mm < 6) return "over";
  if(mm === 6 && dd < today) return "over";
  if(mm === 6 && dd <= today+2) return "soon";
  return "";
}

function makeCard(c){
  const el = document.createElement("article");
  el.className = "card";
  el.draggable = true;

  const labels = (c.labels||[]).map(([cls,txt])=>`<span class="label ${cls}">${txt}</span>`).join("");
  const priLevels = { high:"high", med:"med", low:"low" };
  const priBars = `<div class="priority ${priLevels[c.pri]||""}"><span class="pri-bar a"></span><span class="pri-bar b"></span><span class="pri-bar c"></span></div>`;

  let progress = "";
  if(c.subtasks){
    const [d,t] = c.subtasks;
    const pct = t? Math.round(d/t*100):0;
    progress = `<div class="card-progress">
      <div class="progress-meta"><span>하위 작업</span><span>${d}/${t}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>`;
  }

  const avatars = (c.assignees||[]).map(k=>{
    const m = MEMBERS[k];
    return `<div class="avatar sm" style="background:${m.color}" title="${m.name}">${initialsK(m.name)}</div>`;
  }).join("");

  let meta = "";
  if(c.comments){ meta += `<span class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>${c.comments}</span>`; }
  if(c.attach){ meta += `<span class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.4 11.05 12.25 20.2a5 5 0 0 1-7.07-7.07l9.19-9.19a3 3 0 0 1 4.24 4.24l-9.2 9.19a1 1 0 0 1-1.41-1.41l8.49-8.5"/></svg>${c.attach}</span>`; }

  const dc = dueClass(c.due, c.done);
  const dueIcon = c.done
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m20 6-11 11-5-5"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`;
  const dueChip = `<span class="meta-item due ${dc}">${dueIcon}${c.due}</span>`;

  el.innerHTML = `
    ${priBars}
    ${labels?`<div class="card-labels">${labels}</div>`:""}
    <div class="card-title">${c.title}</div>
    <div class="card-desc">${c.desc}</div>
    ${progress}
    <div class="card-foot">
      <div class="card-meta">${dueChip}${meta}</div>
      <div class="avatar-stack">${avatars}</div>
    </div>
  `;
  attachDrag(el);
  return el;
}

function buildColumn(colDef){
  const col = document.createElement("section");
  col.className = "column"; col.dataset.col = colDef.id;

  const head = document.createElement("div");
  head.className = "col-head";
  head.innerHTML = `
    <span class="col-dot" style="background:${colDef.color}"></span>
    <span class="col-title">${colDef.title}</span>
    <span class="col-count">0</span>
    <span class="spacer"></span>
    <button class="col-act" title="추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="col-act" title="더보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
  `;

  const body = document.createElement("div");
  body.className = "col-body"; body.dataset.col = colDef.id;

  const cards = CARDS.filter(c=>c.col===colDef.id);
  cards.forEach(c=> body.appendChild(makeCard(c)));

  const addBtn = document.createElement("button");
  addBtn.className = "add-card";
  addBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>카드 추가`;
  addBtn.addEventListener("click", ()=> addNewCard(body, addBtn));

  setupDropzone(body);

  col.appendChild(head);
  col.appendChild(body);
  col.appendChild(addBtn);
  board.appendChild(col);
  updateCount(col);
  return col;
}

COLUMNS.forEach(buildColumn);

/* ============ Counts ============ */
function updateCount(col){
  const n = col.querySelectorAll(".col-body > .card").length;
  col.querySelector(".col-count").textContent = n;
}
function updateAllCounts(){ document.querySelectorAll(".column").forEach(updateCount); }

/* ============ Drag & Drop ============ */
let dragged = null;

function attachDrag(card){
  card.addEventListener("dragstart", (e)=>{
    dragged = card;
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain",""); } catch(_){}
  });
  card.addEventListener("dragend", ()=>{
    card.classList.remove("dragging");
    document.querySelectorAll(".col-body").forEach(b=>b.classList.remove("drop-active"));
    dragged = null;
    updateAllCounts();
  });
}

function getAfterElement(container, y){
  const els = [...container.querySelectorAll(".card:not(.dragging)")];
  return els.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if(offset < 0 && offset > closest.offset){
      return { offset, element: child };
    }
    return closest;
  }, { offset: -Infinity, element: null }).element;
}

function setupDropzone(body){
  body.addEventListener("dragover", (e)=>{
    e.preventDefault();
    if(!dragged) return;
    body.classList.add("drop-active");
    const after = getAfterElement(body, e.clientY);
    if(after == null){ body.appendChild(dragged); }
    else { body.insertBefore(dragged, after); }
  });
  body.addEventListener("dragleave", (e)=>{
    if(!body.contains(e.relatedTarget)) body.classList.remove("drop-active");
  });
  body.addEventListener("drop", (e)=>{
    e.preventDefault();
    body.classList.remove("drop-active");
    updateAllCounts();
  });
}

/* ============ Add Card ============ */
function addNewCard(body, addBtn){
  const el = document.createElement("article");
  el.className = "card";
  el.draggable = true;
  el.innerHTML = `
    <div class="card-title" contenteditable="true" data-ph="작업 제목을 입력하세요…" style="outline:none;"></div>
    <div class="card-foot" style="margin-top:8px">
      <div class="card-meta"><span class="meta-item due"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>날짜</span></div>
      <div class="avatar-stack"><div class="avatar sm" style="background:#c2c8d0">+</div></div>
    </div>`;
  attachDrag(el);
  body.appendChild(el);
  const title = el.querySelector(".card-title");
  // placeholder behaviour
  title.addEventListener("blur", ()=>{
    if(title.textContent.trim()===""){ el.remove(); }
    updateAllCounts();
  });
  title.focus();
  body.scrollTop = body.scrollHeight;
  updateCount(body.closest(".column"));
}

// contenteditable placeholder style
const style = document.createElement("style");
style.textContent = `.card-title[contenteditable]:empty:before{content:attr(data-ph);color:var(--ink-400);}`;
document.head.appendChild(style);
</script>
