<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folio — Mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfbfa;
    --surface:#ffffff;
    --surface-2:#f6f6f4;
    --line:#ecebe7;
    --line-strong:#e2e1dc;
    --ink:#1d1d1b;
    --ink-2:#54534e;
    --ink-3:#8c8b84;
    --ink-4:#b3b2aa;
    --accent:#2f5d50;
    --accent-soft:#e9f0ed;
    --accent-ink:#234a40;
    --amber:#c08a2d;
    --amber-soft:#f6eddb;
    --rose:#b4524a;
    --rose-soft:#f6e6e3;
    --blue:#3a6098;
    --blue-soft:#e7eef6;
    --radius:14px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(28,28,24,.04), 0 8px 24px -16px rgba(28,28,24,.18);
    --shadow-lg:0 24px 60px -28px rgba(28,28,24,.32);
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --serif:'Newsreader',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    font-size:14px;
    line-height:1.5;
  }
  ::selection{background:var(--accent-soft);color:var(--accent-ink)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#deddd6;border-radius:9px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#cbcac1;background-clip:content-box}

  /* ---------- shell ---------- */
  .app{
    display:grid;
    grid-template-columns:240px 372px 1fr;
    height:100vh;
    background:var(--surface);
  }

  /* ---------- sidebar ---------- */
  .sidebar{
    background:var(--surface-2);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    padding:20px 20px 16px;
  }
  .brand-mark{
    width:30px;height:30px;border-radius:9px;
    background:var(--accent);
    color:#fff;display:grid;place-items:center;
    font-weight:700;font-size:15px;letter-spacing:-.02em;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
  }
  .brand-name{font-weight:600;font-size:15.5px;letter-spacing:-.02em}
  .brand-sub{font-size:11px;color:var(--ink-3);margin-top:-2px;letter-spacing:.01em}

  .compose{
    margin:4px 16px 14px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    height:40px;border-radius:11px;
    background:var(--accent);color:#fff;
    font-weight:550;font-size:13.5px;letter-spacing:-.01em;
    box-shadow:var(--shadow);
    transition:transform .14s ease, box-shadow .2s ease, background .2s ease;
  }
  .compose:hover{background:#27514599;background:#275145;transform:translateY(-1px);box-shadow:0 4px 14px -6px rgba(47,93,80,.5)}
  .compose:active{transform:translateY(0)}
  .compose svg{width:16px;height:16px}

  .nav{padding:0 12px;overflow-y:auto;flex:1;min-height:0}
  .nav-group{margin-bottom:18px}
  .nav-label{
    font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-4);padding:0 10px 7px;
  }
  .nav-item{
    display:flex;align-items:center;gap:11px;
    width:100%;height:34px;padding:0 10px;border-radius:9px;
    color:var(--ink-2);font-size:13.5px;font-weight:450;
    transition:background .14s ease,color .14s ease;
    position:relative;
  }
  .nav-item .ico{width:17px;height:17px;color:var(--ink-3);flex:none;transition:color .14s ease}
  .nav-item .ico svg{width:100%;height:100%;display:block}
  .nav-item .txt{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-item .count{font-size:11.5px;font-weight:550;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .nav-item:hover{background:#efeeea}
  .nav-item.active{background:var(--surface);color:var(--ink);font-weight:550;box-shadow:0 1px 2px rgba(28,28,24,.05)}
  .nav-item.active .ico{color:var(--accent)}
  .nav-item.active .count{color:var(--accent-ink)}
  .nav-item.active::before{
    content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);
    width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--accent);
  }
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .dot.g{background:var(--accent)}
  .dot.a{background:var(--amber)}
  .dot.b{background:var(--blue)}
  .dot.r{background:var(--rose)}

  .storage{padding:14px 22px 16px;border-top:1px solid var(--line)}
  .storage-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-bottom:7px}
  .storage-bar{height:5px;border-radius:5px;background:#e6e5df;overflow:hidden}
  .storage-fill{height:100%;width:64%;border-radius:5px;background:linear-gradient(90deg,var(--accent),#5a8a7b)}
  .me{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
  .me .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#3a6098,#6d4f9c);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
  .me .who{min-width:0;flex:1}
  .me .nm{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me .em{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me .gear{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);transition:background .14s,color .14s}
  .me .gear:hover{background:var(--surface-2);color:var(--ink)}
  .me .gear svg{width:16px;height:16px}

  /* ---------- list column ---------- */
  .list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
  .list-head{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
  .list-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .list-title{font-size:18px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
  .list-title .badge{font-size:11px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:20px;font-variant-numeric:tabular-nums}
  .icon-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3);transition:background .14s,color .14s}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink)}
  .icon-btn svg{width:17px;height:17px}
  .list-tools{display:flex;align-items:center;gap:6px}

  .search{
    display:flex;align-items:center;gap:9px;
    height:38px;padding:0 12px;border-radius:10px;
    background:var(--surface-2);border:1px solid transparent;
    transition:border-color .16s,background .16s,box-shadow .16s;
  }
  .search:focus-within{background:var(--surface);border-color:var(--line-strong);box-shadow:0 0 0 3px rgba(47,93,80,.08)}
  .search svg{width:16px;height:16px;color:var(--ink-3);flex:none}
  .search input{flex:1;border:none;outline:none;background:none;font-size:13.5px;color:var(--ink)}
  .search input::placeholder{color:var(--ink-4)}
  .search kbd{font-size:10.5px;color:var(--ink-4);border:1px solid var(--line-strong);border-radius:5px;padding:1px 5px;font-family:var(--sans);background:var(--surface)}

  .filters{display:flex;gap:6px;padding:11px 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{
    flex:none;font-size:12.5px;font-weight:500;color:var(--ink-2);
    padding:5px 12px;border-radius:18px;background:var(--surface-2);
    transition:background .14s,color .14s,box-shadow .14s;white-space:nowrap;
  }
  .chip:hover{background:#eeede9}
  .chip.active{background:var(--ink);color:#fff}
  .chip.active:hover{background:#000}

  .threads{overflow-y:auto;flex:1;min-height:0}
  .thread{
    display:grid;grid-template-columns:auto 1fr;gap:12px;
    padding:14px 18px 14px 16px;
    border-bottom:1px solid var(--line);
    cursor:pointer;position:relative;
    transition:background .13s ease;
  }
  .thread:hover{background:#faf9f7}
  .thread.active{background:var(--accent-soft)}
  .thread.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  .thread.unread .t-from{font-weight:700;color:var(--ink)}
  .thread.unread .t-subj{font-weight:600;color:var(--ink)}
  .t-unread-dot{position:absolute;left:6px;top:20px;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0}
  .thread.unread .t-unread-dot{opacity:1}
  .thread.active.unread::before{display:none}

  .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;flex:none;letter-spacing:-.01em}
  .t-body{min-width:0}
  .t-row1{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:2px}
  .t-from{font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-time{font-size:11.5px;color:var(--ink-4);flex:none;font-variant-numeric:tabular-nums}
  .t-subj{font-size:13px;font-weight:450;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
  .t-prev{font-size:12.5px;color:var(--ink-3);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .t-meta{display:flex;align-items:center;gap:6px;margin-top:8px}
  .tag{font-size:10.5px;font-weight:550;padding:2px 7px;border-radius:6px;letter-spacing:.01em}
  .tag.work{color:var(--accent-ink);background:var(--accent-soft)}
  .tag.team{color:var(--blue);background:var(--blue-soft)}
  .tag.invoice{color:var(--amber);background:var(--amber-soft)}
  .tag.urgent{color:var(--rose);background:var(--rose-soft)}
  .t-attach{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--ink-3)}
  .t-attach svg{width:12px;height:12px}
  .t-star{margin-left:auto;color:var(--ink-4);transition:color .14s,transform .14s}
  .t-star svg{width:15px;height:15px;display:block}
  .t-star:hover{transform:scale(1.15)}
  .t-star.on{color:var(--amber)}
  .t-star.on svg{fill:var(--amber)}

  /* ---------- reading pane ---------- */
  .reader{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
  .reader-bar{
    display:flex;align-items:center;gap:4px;
    padding:13px 24px;border-bottom:1px solid var(--line);background:var(--surface);
  }
  .reader-bar .back{display:none}
  .reader-bar .grow{flex:1}
  .read-content{overflow-y:auto;flex:1;min-height:0}
  .read-inner{max-width:760px;margin:0 auto;padding:34px 40px 60px}

  .read-subject{font-size:23px;font-weight:600;letter-spacing:-.025em;line-height:1.25;margin-bottom:16px}
  .read-subject .tag{vertical-align:middle;margin-left:8px;font-size:11px;padding:3px 9px}

  .read-from{display:flex;align-items:center;gap:13px;margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--line)}
  .read-from .av{width:46px;height:46px;font-size:16px}
  .rf-info{flex:1;min-width:0}
  .rf-top{display:flex;align-items:baseline;gap:8px}
  .rf-name{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .rf-handle{font-size:12.5px;color:var(--ink-3)}
  .rf-to{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .rf-time{font-size:12.5px;color:var(--ink-3);text-align:right;flex:none}
  .rf-actions{display:flex;gap:6px;flex:none}

  .read-body{font-size:15px;line-height:1.72;color:#2c2b27}
  .read-body p{margin-bottom:18px}
  .read-body strong{font-weight:600;color:var(--ink)}
  .read-body .lead{font-family:var(--serif);font-size:18.5px;line-height:1.6;color:#383732;margin-bottom:22px}
  .read-body ul{margin:0 0 18px;padding-left:4px;list-style:none}
  .read-body li{position:relative;padding-left:22px;margin-bottom:9px}
  .read-body li::before{content:"";position:absolute;left:4px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .read-body a.inline{color:var(--accent-ink);text-decoration:none;border-bottom:1px solid var(--accent-soft);font-weight:500}
  .read-body a.inline:hover{border-bottom-color:var(--accent)}
  .sig{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-3);line-height:1.6}
  .sig strong{color:var(--ink-2);font-weight:600}

  .attachments{margin-top:30px}
  .att-title{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4);margin-bottom:11px}
  .att-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .att{
    display:flex;align-items:center;gap:12px;padding:12px 14px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    transition:border-color .15s,box-shadow .15s,transform .15s;cursor:pointer;
  }
  .att:hover{border-color:var(--line-strong);box-shadow:var(--shadow);transform:translateY(-1px)}
  .att-ic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:10px;font-weight:700;color:#fff;letter-spacing:.02em}
  .att-ic.pdf{background:#b4524a}
  .att-ic.fig{background:#7d5bd1}
  .att-nm{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .att-sz{font-size:11.5px;color:var(--ink-3);margin-top:1px}

  .reply-dock{padding:16px 40px 24px;max-width:760px;margin:0 auto;width:100%}
  .reply-box{
    border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);
    box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .2s,border-color .2s;
  }
  .reply-box:focus-within{border-color:#cfcec6;box-shadow:0 0 0 3px rgba(47,93,80,.08),var(--shadow)}
  .reply-input{width:100%;border:none;outline:none;resize:none;padding:15px 17px;font-size:14px;line-height:1.6;color:var(--ink);background:none;min-height:54px}
  .reply-input::placeholder{color:var(--ink-4)}
  .reply-foot{display:flex;align-items:center;justify-content:space-between;padding:9px 12px 11px;border-top:1px solid var(--line)}
  .reply-tools{display:flex;gap:2px}
  .reply-tools .icon-btn{width:30px;height:30px}
  .reply-tools .icon-btn svg{width:15px;height:15px}
  .send{display:flex;align-items:center;gap:7px;height:34px;padding:0 16px;border-radius:9px;background:var(--accent);color:#fff;font-size:13px;font-weight:550;transition:background .18s,transform .12s}
  .send:hover{background:#275145;transform:translateY(-1px)}
  .send:active{transform:translateY(0)}
  .send svg{width:15px;height:15px}

  .pill-btn{display:flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:9px;color:var(--ink-2);font-size:12.5px;font-weight:500;transition:background .14s,color .14s}
  .pill-btn:hover{background:var(--surface-2);color:var(--ink)}
  .pill-btn svg{width:15px;height:15px}

  /* ---------- compose modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(28,28,24,.34);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
  .overlay.show{opacity:1;pointer-events:auto}
  .modal{
    position:fixed;right:28px;bottom:0;width:560px;max-width:calc(100vw - 32px);
    background:var(--surface);border-radius:16px 16px 0 0;
    box-shadow:var(--shadow-lg);z-index:51;
    transform:translateY(110%);transition:transform .28s cubic-bezier(.22,1,.36,1);
    display:flex;flex-direction:column;max-height:86vh;
  }
  .modal.show{transform:translateY(0)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--ink);color:#fff;border-radius:16px 16px 0 0}
  .modal-head .title{font-size:14px;font-weight:600}
  .modal-head .x{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#c9c8c2;transition:background .14s,color .14s}
  .modal-head .x:hover{background:rgba(255,255,255,.12);color:#fff}
  .modal-head .x svg{width:16px;height:16px}
  .modal-field{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
  .modal-field label{font-size:13px;color:var(--ink-3);width:42px;flex:none}
  .modal-field input{flex:1;border:none;outline:none;font-size:13.5px;color:var(--ink);background:none}
  .modal-field input::placeholder{color:var(--ink-4)}
  .modal-body{flex:1;padding:16px 18px;overflow-y:auto}
  .modal-body textarea{width:100%;border:none;outline:none;resize:none;font-size:14px;line-height:1.65;color:var(--ink);min-height:200px;background:none}
  .modal-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line)}

  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;font-size:13px;font-weight:500;
    padding:11px 18px;border-radius:11px;box-shadow:var(--shadow-lg);
    display:flex;align-items:center;gap:9px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast svg{width:16px;height:16px;color:#7fd1bc}

  .empty{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--ink-4);gap:14px;text-align:center;padding:40px}
  .empty svg{width:46px;height:46px;color:var(--line-strong)}
  .empty p{font-size:14px;max-width:240px;line-height:1.55}

  /* ---------- mobile ---------- */
  .mobile-tabs{display:none}
  @media (max-width:900px){
    .app{grid-template-columns:1fr;grid-template-rows:1fr}
    .sidebar{display:none}
    .list{border-right:none}
    .reader{display:none;position:fixed;inset:0;z-index:40}
    body.reading .list{display:none}
    body.reading .reader{display:flex}
    .reader-bar .back{display:grid}
    .read-inner{padding:24px 20px 40px}
    .reply-dock{padding:14px 20px 22px}
    .att-grid{grid-template-columns:1fr}
    .read-subject{font-size:20px}
    .modal{right:0;left:0;width:100%;max-width:100%}
    .list-head{padding:16px 16px 12px}
    .thread{padding:13px 16px 13px 14px}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">F</div>
      <div>
        <div class="brand-name">Folio</div>
        <div class="brand-sub">Workspace</div>
      </div>
    </div>

    <button class="compose" id="composeBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      메일 작성
    </button>

    <nav class="nav">
      <div class="nav-group">
        <button class="nav-item active"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5Z"/><path d="M9 21v-7h6v7"/></svg></span><span class="txt">받은편지함</span><span class="count">12</span></button>

    <div class="thread ${e.unread?'unread':''} ${e.id===activeId?'active':''}" data-id="${e.id}">
      <span class="t-unread-dot"></span>

          ${e.attach?`<span class="t-attach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.6 1.6 0 0 1-2.3-2.3l7.8-7.8"/></svg>${e.attach}</span>`:''}
          <button class="t-star ${e.star?'on':''}" data-star="${e.id}" aria-label="중요 표시">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 2.9 5.9 6.5.9-4.7 4.6 1.1 6.4L12 18.2 6.2 21.3l1.1-6.4L2.6 9.8l6.5-.9L12 3Z"/></svg>
          </button>
        </div>
      </div>
    </div>`).join('');
}

function renderReader(){
  const e=emails.find(x=>x.id===activeId);
  if(!e){readContent.innerHTML='';return}
  readContent.innerHTML=`
    <div class="read-inner">
      <h1 class="read-subject">${e.subject} ${e.tags.map(t=>`<span class="tag ${t[1]}">${t[0]}</span>`).join('')}</h1>
      <div class="read-from">
        ${avHTML(e.av,e.init)}
        <div class="rf-info">
          <div class="rf-top"><span class="rf-name">${e.from}</span><span class="rf-handle">&lt;${e.handle}&gt;</span></div>
          <div class="rf-to">받는사람: ${e.to}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
          <span class="rf-time">${e.time}</span>
          <div class="rf-actions">
            <button class="icon-btn" aria-label="답장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 17 4 12l5-5M4 12h11a5 5 0 0 1 5 5v2"/></svg></button>
            <button class="icon-btn" aria-label="전달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 17 5-5-5-5M20 12H9a5 5 0 0 0-5 5v2"/></svg></button>
          </div>
        </div>
      </div>
      <div class="read-body">${e.body}</div>
      ${e.atts&&e.atts.length?`
      <div class="attachments">
        <div class="att-title">첨부파일 ${e.atts.length}</div>
        <div class="att-grid">
          ${e.atts.map(a=>`<div class="att"><div class="att-ic ${a[2]}">${a[2].toUpperCase()}</div><div style="min-width:0"><div class="att-nm">${a[0]}</div><div class="att-sz">${a[1]}</div></div></div>`).join('')}
        </div>
      </div>`:''}
    </div>
    <div class="reply-dock">
      <div class="reply-box">
        <textarea class="reply-input" placeholder="${e.from}님에게 답장…"></textarea>
        <div class="reply-foot">
          <div class="reply-tools">
            <button class="icon-btn" aria-label="첨부"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.6 1.6 0 0 1-2.3-2.3l7.8-7.8"/></svg></button>
            <button class="icon-btn" aria-label="이미지"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="m21 15-5-5L5 21"/></svg></button>
            <button class="icon-btn" aria-label="이모지"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg></button>
          </div>
          <button class="send" id="replySend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2 15 22l-4-9-9-4 20-7Z"/></svg>보내기</button>
        </div>
      </div>
    </div>`;
  readContent.scrollTop=0;
  document.getElementById('replySend').addEventListener('click',()=>{
    const ta=readContent.querySelector('.reply-input');
    if(ta.value.trim()){ta.value='';showToast('답장을 보냈습니다')}
  });
}

threadsEl.addEventListener('click',ev=>{
  const star=ev.target.closest('[data-star]');
  if(star){ev.stopPropagation();const e=emails.find(x=>x.id==star.dataset.star);e.star=!e.star;renderList();return}
  const t=ev.target.closest('.thread');
  if(!t)return;
  activeId=+t.dataset.id;
  const e=emails.find(x=>x.id===activeId);
  if(e.unread){e.unread=false}
  renderList();renderReader();
  document.body.classList.add('reading');
});

document.getElementById('backBtn').addEventListener('click',()=>document.body.classList.remove('reading'));

document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active');filter=c.dataset.f;renderList();
}));

document.getElementById('searchInput').addEventListener('input',e=>{query=e.target.value;renderList()});

// nav folders (visual only)
document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>{
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
  n.classList.add('active');
}));

// archive / trash
function removeActive(msg){
  const idx=emails.findIndex(x=>x.id===activeId);
  if(idx<0)return;
  emails.splice(idx,1);
  if(emails.length){activeId=emails[Math.min(idx,emails.length-1)].id;renderReader()}
  else readContent.innerHTML='';
  renderList();document.body.classList.remove('reading');showToast(msg);
}
document.getElementById('archiveBtn').addEventListener('click',()=>removeActive('보관함으로 이동했습니다'));
document.getElementById('trashBtn').addEventListener('click',()=>removeActive('휴지통으로 이동했습니다'));

// compose modal
const overlay=document.getElementById('overlay'),modal=document.getElementById('modal');
function openModal(){overlay.classList.add('show');modal.classList.add('show')}
function closeModal(){overlay.classList.remove('show');modal.classList.remove('show')}
document.getElementById('composeBtn').addEventListener('click',openModal);
document.getElementById('closeModal').addEventListener('click',closeModal);
overlay.addEventListener('click',closeModal);
document.getElementById('sendModal').addEventListener('click',()=>{closeModal();showToast('메일을 보냈습니다')});

// keyboard
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('searchInput').focus()}
  if(e.key==='Escape')closeModal();
});

// toast
let toastT;
const toast=document.getElementById('toast');
function showToast(msg){
  document.getElementById('toastMsg').textContent=msg;
  toast.classList.add('show');clearTimeout(toastT);
  toastT=setTimeout(()=>toast.classList.remove('show'),2400);
}

renderList();renderReader();
</script>
</body>
</html>
