<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Itinera · 리스본 4일 여행 일정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EE;
    --paper-2:#FBF9F5;
    --card:#FFFFFF;
    --ink:#16130F;
    --ink-2:#534B41;
    --ink-3:#8A8076;
    --line:#E7E1D6;
    --line-2:#EFEAE1;
    --accent:#B5512F;
    --accent-soft:#F2E2D9;
    --sage:#5F7256;
    --sage-soft:#E7ECE2;
    --ocean:#3B6075;
    --ocean-soft:#E1E9EE;
    --gold:#9A7B2E;
    --gold-soft:#F0E8D2;
    --shadow:0 1px 2px rgba(22,19,15,.04), 0 8px 24px rgba(22,19,15,.05);
    --shadow-hover:0 2px 4px rgba(22,19,15,.05), 0 14px 36px rgba(22,19,15,.09);
    --r:16px;
    --r-sm:11px;
    --maxw:1320px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  ::selection{background:var(--accent-soft);color:var(--accent)}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 40px}

  /* ───────── Topbar ───────── */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:rgba(247,244,238,.82);
    backdrop-filter:saturate(140%) blur(14px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    display:flex;align-items:center;justify-content:space-between;
    height:64px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
  .brand .mark{
    width:30px;height:30px;border-radius:9px;
    background:linear-gradient(150deg,var(--accent),#cf6a44);
    display:grid;place-items:center;color:#fff;flex:0 0 auto;
    box-shadow:0 4px 10px rgba(181,81,47,.28);
  }
  .brand .mark svg{width:17px;height:17px}
  .brand .name{font-size:16px}
  .brand .name b{font-family:"Fraunces",serif;font-weight:600}
  .topbar-actions{display:flex;align-items:center;gap:8px}
  .tbtn{
    height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font-size:13.5px;font-weight:500;
    font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    transition:border-color .18s ease, background .18s ease, transform .18s ease;
  }
  .tbtn:hover{border-color:#d8cfc0;transform:translateY(-1px)}
  .tbtn svg{width:15px;height:15px;opacity:.7}
  .tbtn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tbtn.primary:hover{background:#2a241d}
  .tbtn.primary svg{opacity:.85}
  .topbar .avatar{
    width:38px;height:38px;border-radius:50%;flex:0 0 auto;
    background:linear-gradient(150deg,#dfd7c8,#c9bfae);
    display:grid;place-items:center;font-weight:600;font-size:13px;color:#5a5043;
    border:1px solid var(--line);
  }

  /* ───────── Layout ───────── */
  .layout{
    display:grid;
    grid-template-columns:352px 1fr;
    gap:48px;
    align-items:start;
    padding:44px 0 80px;
  }

  /* ───────── Sidebar ───────── */
  .sidebar{position:sticky;top:96px}

  .hero{
    border-radius:var(--r);
    overflow:hidden;
    border:1px solid var(--line);
    background:var(--card);
    box-shadow:var(--shadow);
  }
  .hero-img{
    height:172px;position:relative;
    background:
      radial-gradient(120% 90% at 80% -10%, rgba(255,255,255,.35), transparent 60%),
      linear-gradient(165deg,#c9633f 0%,#b5512f 42%,#7d4a52 100%);
    overflow:hidden;
  }
  .hero-img .sun{
    position:absolute;width:90px;height:90px;border-radius:50%;
    top:30px;right:34px;background:radial-gradient(circle at 35% 35%,#ffe9c2,#ffcf86);
    opacity:.85;filter:blur(.3px);
  }
  .hero-img .hill{position:absolute;bottom:0;left:0;right:0;height:64px}
  .hero-img .tag{
    position:absolute;top:16px;left:16px;
    background:rgba(255,255,255,.9);color:var(--accent);
    font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    padding:5px 10px;border-radius:8px;
  }
  .hero-body{padding:22px 22px 24px}
  .hero-loc{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:13px;font-weight:500;margin-bottom:8px}
  .hero-loc svg{width:14px;height:14px}
  .hero-title{font-family:"Fraunces",serif;font-weight:600;font-size:29px;line-height:1.08;letter-spacing:-.02em;margin-bottom:14px}
  .hero-dates{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2)}
  .hero-dates .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-3)}

  .stats{
    display:grid;grid-template-columns:1fr 1fr;gap:1px;
    margin-top:20px;background:var(--line);
    border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  }
  .stat{background:var(--card);padding:16px 18px}
  .stat .num{font-family:"Fraunces",serif;font-size:23px;font-weight:600;letter-spacing:-.01em}
  .stat .num small{font-size:13px;color:var(--ink-3);font-family:"Inter";font-weight:500;margin-left:2px}
  .stat .lbl{font-size:12px;color:var(--ink-3);margin-top:2px}

  .navcard{
    margin-top:20px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:10px;box-shadow:var(--shadow);
  }
  .navcard h4{
    font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-3);padding:10px 12px 8px;
  }
  .daylink{
    display:flex;align-items:center;gap:13px;
    padding:11px 12px;border-radius:11px;cursor:pointer;
    text-decoration:none;color:var(--ink);
    transition:background .16s ease;
  }
  .daylink:hover{background:var(--paper-2)}
  .daylink.active{background:var(--accent-soft)}
  .daylink .idx{
    width:30px;height:30px;border-radius:9px;flex:0 0 auto;
    display:grid;place-items:center;font-size:12.5px;font-weight:600;
    background:var(--paper);color:var(--ink-2);border:1px solid var(--line);
    transition:all .16s ease;
  }
  .daylink.active .idx{background:var(--accent);color:#fff;border-color:var(--accent)}
  .daylink .meta .t{font-size:13.5px;font-weight:500;line-height:1.3}
  .daylink .meta .d{font-size:11.5px;color:var(--ink-3)}
  .daylink .chev{margin-left:auto;width:15px;height:15px;color:var(--ink-3);opacity:0;transition:opacity .16s ease,transform .16s ease}
  .daylink:hover .chev,.daylink.active .chev{opacity:1}
  .daylink.active .chev{color:var(--accent);transform:translateX(2px)}

  .budget{
    margin-top:20px;background:linear-gradient(160deg,#1c1812,#2c2419);
    border-radius:var(--r);padding:20px 22px;color:#efe9df;
    box-shadow:var(--shadow);
  }
  .budget .row{display:flex;align-items:baseline;justify-content:space-between}
  .budget .lbl{font-size:12px;color:#b9ab97;letter-spacing:.03em}
  .budget .amt{font-family:"Fraunces",serif;font-size:27px;font-weight:600;letter-spacing:-.01em}
  .budget .amt small{font-size:13px;color:#b9ab97;font-family:"Inter";font-weight:500}
  .budget .bar{height:6px;border-radius:4px;background:rgba(255,255,255,.12);margin:14px 0 10px;overflow:hidden}
  .budget .bar i{display:block;height:100%;width:68%;border-radius:4px;background:linear-gradient(90deg,#cf6a44,#e2a766)}
  .budget .sub{font-size:12px;color:#9b8e7c}

  /* ───────── Content ───────── */
  .content{min-width:0}
  .content-head{margin-bottom:8px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
  .content-head .eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:9px}
  .content-head h1{font-family:"Fraunces",serif;font-weight:600;font-size:34px;line-height:1.1;letter-spacing:-.02em}
  .content-head p{color:var(--ink-2);font-size:14.5px;margin-top:8px;max-width:50ch}
  .seg{
    display:inline-flex;background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:4px;gap:2px;flex:0 0 auto;
  }
  .seg button{
    border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:500;
    color:var(--ink-2);padding:7px 14px;border-radius:8px;cursor:pointer;transition:all .16s ease;
  }
  .seg button.on{background:var(--ink);color:#fff}

  .day{padding-top:38px;scroll-margin-top:92px}
  .day-head{display:flex;align-items:center;gap:16px;margin-bottom:6px}
  .day-badge{
    flex:0 0 auto;width:54px;height:54px;border-radius:14px;
    background:var(--card);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:var(--shadow);
  }
  .day-badge .k{font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  .day-badge .v{font-family:"Fraunces",serif;font-size:23px;font-weight:600;line-height:1;letter-spacing:-.01em}
  .day-titles .h{font-family:"Fraunces",serif;font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
  .day-titles .s{font-size:13px;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .weather{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2)}
  .weather svg{width:14px;height:14px;color:var(--gold)}
  .sep{width:3px;height:3px;border-radius:50%;background:var(--line);display:inline-block}

  /* timeline */
  .timeline{position:relative;margin:22px 0 0;padding-left:0}
  .stop{
    position:relative;display:grid;grid-template-columns:64px 28px 1fr;
    align-items:start;column-gap:0;
  }
  .stop .time{
    text-align:right;padding-right:18px;padding-top:18px;
    font-size:12.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;
  }
  .stop .time .ampm{display:block;font-size:10.5px;font-weight:500;color:var(--ink-3);margin-top:1px}
  .rail{position:relative;display:flex;justify-content:center}
  .rail::before{
    content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line-2);
  }
  .stop:first-child .rail::before{top:24px}
  .stop:last-child .rail::before{bottom:auto;height:24px}
  .rail .node{
    position:relative;z-index:2;margin-top:22px;
    width:13px;height:13px;border-radius:50%;background:var(--card);
    border:2.5px solid var(--accent);
    transition:transform .18s ease, background .18s ease;
  }
  .stop.cat-food .rail .node{border-color:var(--gold)}
  .stop.cat-sight .rail .node{border-color:var(--ocean)}
  .stop.cat-nature .rail .node{border-color:var(--sage)}
  .stop.cat-stay .rail .node{border-color:var(--ink-3)}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 18px;margin:8px 0 18px;box-shadow:var(--shadow);
    transition:box-shadow .2s ease, transform .2s ease, border-color .2s ease;
  }
  .card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:#ddd4c5}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .card .ttl{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
  .card .ttl .check{
    width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);
    flex:0 0 auto;display:grid;place-items:center;cursor:pointer;background:var(--paper-2);
    transition:all .16s ease;
  }
  .card .ttl .check svg{width:11px;height:11px;color:#fff;opacity:0;transition:opacity .14s ease}
  .stop.done .card .ttl .check{background:var(--sage);border-color:var(--sage)}
  .stop.done .card .ttl .check svg{opacity:1}
  .stop.done .card .ttl .name{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line)}
  .stop.done .card{opacity:.72}
  .chip{
    font-size:11px;font-weight:600;letter-spacing:.02em;padding:4px 9px;border-radius:7px;flex:0 0 auto;
    background:var(--accent-soft);color:var(--accent);
  }
  .chip.food{background:var(--gold-soft);color:#7d6320}
  .chip.sight{background:var(--ocean-soft);color:var(--ocean)}
  .chip.nature{background:var(--sage-soft);color:var(--sage)}
  .chip.stay{background:#ece8e1;color:var(--ink-2)}
  .card .desc{font-size:13.5px;color:var(--ink-2);margin-top:9px;line-height:1.6}
  .card-foot{display:flex;align-items:center;gap:16px;margin-top:13px;flex-wrap:wrap}
  .mini{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);font-weight:500}
  .mini svg{width:13.5px;height:13.5px;opacity:.8}
  .mini.price{color:var(--ink-2)}
  .card-foot .spacer{margin-left:auto}
  .linkbtn{
    display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;
    color:var(--accent);text-decoration:none;padding:5px 9px;border-radius:8px;
    transition:background .16s ease;
  }
  .linkbtn:hover{background:var(--accent-soft)}
  .linkbtn svg{width:13px;height:13px}

  .transit{
    display:flex;align-items:center;gap:9px;
    margin:-6px 0 14px;padding-left:2px;
    font-size:12px;color:var(--ink-3);font-weight:500;
  }
  .transit svg{width:14px;height:14px;opacity:.7}
  .transit .ln{flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 10px)}

  .endcard{
    margin-top:30px;background:var(--paper-2);border:1px dashed var(--line);
    border-radius:var(--r);padding:24px;display:flex;align-items:center;gap:16px;
  }
  .endcard .ic{width:42px;height:42px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
  .endcard .ic svg{width:20px;height:20px;color:var(--accent)}
  .endcard h5{font-family:"Fraunces",serif;font-size:16px;font-weight:600}
  .endcard p{font-size:13px;color:var(--ink-2);margin-top:2px}
  .endcard .tbtn{margin-left:auto}

  /* ───────── Mobile tabs ───────── */
  .mtabs{display:none}

  /* ───────── Responsive ───────── */
  @media (max-width:1080px){
    :root{--maxw:760px}
    .wrap{padding:0 28px}
    .layout{grid-template-columns:1fr;gap:0;padding:28px 0 70px}
    .sidebar{position:static;margin-bottom:6px}
    .hero{display:grid;grid-template-columns:200px 1fr}
    .hero-img{height:100%}
    .stats{grid-template-columns:repeat(4,1fr)}
    .navcard{display:none}
    .budget{margin-top:18px}
    .mtabs{
      display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
      position:sticky;top:64px;z-index:40;
      padding:14px 0;margin:0 -28px;padding-left:28px;padding-right:28px;
      background:rgba(247,244,238,.9);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }
    .mtabs::-webkit-scrollbar{display:none}
    .mtab{
      flex:0 0 auto;padding:9px 15px;border-radius:10px;border:1px solid var(--line);
      background:var(--card);font-size:13px;font-weight:500;color:var(--ink-2);
      cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .16s ease;
    }
    .mtab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
    .content-head{flex-direction:column;align-items:flex-start;margin-top:24px}
  }
  @media (max-width:560px){
    :root{--maxw:430px}
    .wrap{padding:0 18px}
    .topbar-inner{height:58px}
    .topbar .label-hide{display:none}
    .tbtn span{display:none}
    .tbtn{padding:0 11px}
    .hero{grid-template-columns:1fr}
    .hero-img{height:140px}
    .stats{grid-template-columns:1fr 1fr}
    .mtabs{top:58px;margin:0 -18px;padding-left:18px;padding-right:18px}
    .content-head h1{font-size:27px}
    .stop{grid-template-columns:50px 24px 1fr}
    .stop .time{padding-right:12px;font-size:11.5px}
    .day-badge{width:48px;height:48px}
    .card:hover{transform:none}
    .endcard{flex-wrap:wrap}
    .endcard .tbtn{margin-left:0;width:100%;justify-content:center}
  }
</style>
</head>
<body>

  <!-- Topbar -->
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
        </span>
        <span class="name"><b>Itinera</b></span>
      </div>
      <div class="topbar-actions">
        <button class="tbtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          <span>공유</span>
        </button>
        <button class="tbtn primary" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          <span>일정 편집</span>
        </button>
        <span class="avatar label-hide" aria-hidden="true">JK</span>
      </div>
    </div>
  </header>

  <!-- Mobile day tabs -->
  <nav class="mtabs wrap" id="mtabs" aria-label="일자 선택"></nav>

  <main class="wrap">
    <div class="layout">

      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="hero">
          <div class="hero-img" aria-hidden="true">
            <div class="sun"></div>
            <span class="tag">가을 여행</span>
            <svg class="hill" viewBox="0 0 360 64" preserveAspectRatio="none">
              <path d="M0 50 Q60 18 120 40 T240 34 T360 28 V64 H0 Z" fill="rgba(255,255,255,.16)"/>
              <path d="M0 58 Q70 36 140 50 T280 46 T360 44 V64 H0 Z" fill="rgba(255,255,255,.24)"/>
            </svg>
          </div>
          <div class="hero-body">
            <div class="hero-loc">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>
              포르투갈 · 리스본
            </div>
            <div class="hero-title">리스본,<br>언덕과 강 사이</div>
            <div class="hero-dates">
              <span>10월 14일 — 17일</span>
              <span class="dot"></span>
              <span>2026</span>
            </div>
          </div>
        </div>

        <div class="stats">
          <div class="stat"><div class="num">4<small>일</small></div><div class="lbl">전체 일정</div></div>
          <div class="stat"><div class="num">14<small>곳</small></div><div class="lbl">방문 장소</div></div>
          <div class="stat"><div class="num">2<small>명</small></div><div class="lbl">동행 인원</div></div>
          <div class="stat"><div class="num">19<small>km</small></div><div class="lbl">총 도보</div></div>
        </div>

        <div class="navcard" id="daynav">
          <h4>여행 일정</h4>
        </div>

        <div class="budget">
          <div class="row">
            <span class="lbl">예상 경비 · 1인</span>
          </div>
          <div class="row" style="margin-top:4px">
            <span class="amt">€820<small> / €1,200</small></span>
          </div>
          <div class="bar"><i></i></div>
          <div class="sub">숙박 · 식비 · 입장료 포함 (항공 제외)</div>
        </div>
      </aside>

      <!-- Content -->
      <section class="content">
        <div class="content-head">
          <div>
            <div class="eyebrow">Day-by-day</div>
            <h1>상세 여행 일정</h1>
            <p>도보 중심으로 짠 리스본 4일 코스예요. 카드를 눌러 다녀온 곳을 체크할 수 있어요.</p>
          </div>
          <div class="seg" role="group" aria-label="보기 방식">
            <button class="on" type="button">타임라인</button>
            <button type="button">지도</button>
          </div>
        </div>

        <div id="days"></div>

        <div class="endcard">
          <div class="ic" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
          </div>
          <div>
            <h5>일정이 거의 완성됐어요</h5>
            <p>장소를 추가하거나 순서를 바꿔 나만의 코스로 다듬어 보세요.</p>
          </div>
          <button class="tbtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            장소 추가
          </button>
        </div>
      </section>

    </div>
  </main>

<script>
  /* ── icons ── */
  const I = {
    sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6 1.5A4 4 0 0 0 6 19Z"/></svg>',
    clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
    euro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 7a6 6 0 1 0 0 10M4 10h8M4 14h7"/></svg>',
    walk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="m10 22 2-6 2 2 1 4M9 11l4-2 2 3 3 1"/></svg>',
    tram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="15" rx="2"/><path d="M4 11h16M12 3v8M8 21l2-3M16 21l-2-3"/></svg>',
    train:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="13" rx="2"/><path d="M4 11h16M8 21l2-3M16 21l-2-3"/><circle cx="8.5" cy="13.5" r=".6" fill="currentColor"/><circle cx="15.5" cy="13.5" r=".6" fill="currentColor"/></svg>',
    map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 3-6 2v16l6-2 6 2 6-2V3l-6 2-6-2Z"/><path d="M9 3v16M15 5v16"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'
  };

  const CATS = {
    food:{label:'식사',cls:'food'}, sight:{label:'명소',cls:'sight'},
    nature:{label:'자연',cls:'nature'}, stay:{label:'숙소',cls:'stay'}
  };

  const TRANSIT = {walk:I.walk, tram:I.tram, train:I.train};

  /* ── mock itinerary data ── */
  const DAYS = [
    {
      id:'day-1', n:1, date:'10월 14일 · 화', short:'화', title:'도착, 그리고 알파마',
      sub:'리스본 첫날 · 골목 산책', wx:{ic:'sun',t:'24°'},
      stops:[
        {time:'14:30',ampm:'오후',cat:'stay',name:'호텔 다 바이샤 체크인',
         desc:'바이샤 한복판에 자리한 부티크 호텔. 짐을 풀고 잠시 숨 고르기. 옥상 테라스에서 도시 전경이 한눈에 들어와요.',
         loc:'Baixa',dur:'40분',price:null,transit:null},
        {time:'15:40',ampm:'오후',cat:'sight',name:'코메르시우 광장',
         desc:'테주강을 마주한 거대한 노란 광장. 개선문을 지나 강가까지 천천히 걸으며 도시의 첫인상을 담아요.',
         loc:'Praça do Comércio',dur:'50분',price:'무료',transit:{type:'walk',label:'도보 6분 · 0.4km'}},
        {time:'17:00',ampm:'오후',cat:'sight',name:'산타 주스타 엘리베이터',
         desc:'1902년에 지어진 철제 전망 엘리베이터. 꼭대기 전망대에서 보는 노을 진 시가지가 압권이에요.',
         loc:'Elevador de Santa Justa',dur:'45분',price:'€5.30',transit:{type:'walk',label:'도보 8분 · 0.5km'}},
        {time:'19:30',ampm:'저녁',cat:'food',name:'타임아웃 마켓',
         desc:'리스본 대표 셰프들의 부스가 한자리에. 바칼라우와 비뉴 베르드 한 잔으로 가볍게 첫 저녁을 마무리.',
         loc:'Mercado da Ribeira',dur:'1시간 30분',price:'€25~',transit:{type:'tram',label:'트램 15분'}}
      ]
    },
    {
      id:'day-2', n:2, date:'10월 15일 · 수', short:'수', title:'벨렝과 강변',
      sub:'대항해 시대의 흔적', wx:{ic:'sun',t:'23°'},
      stops:[
        {time:'09:00',ampm:'오전',cat:'food',name:'파스테이스 드 벨렝',
         desc:'1837년부터 이어진 에그타르트의 원조. 갓 구운 따뜻한 타르트에 시나몬을 뿌려 아침으로.',
         loc:'Pastéis de Belém',dur:'40분',price:'€6',transit:{type:'tram',label:'트램 25분'}},
        {time:'10:00',ampm:'오전',cat:'sight',name:'제로니무스 수도원',
         desc:'마누엘 양식의 정수. 정교한 회랑과 천장 장식을 천천히 둘러보세요. 오픈 직후가 가장 한산해요.',
         loc:'Mosteiro dos Jerónimos',dur:'1시간 20분',price:'€12',transit:{type:'walk',label:'도보 4분 · 0.3km'}},
        {time:'12:00',ampm:'오후',cat:'sight',name:'벨렝 탑',
         desc:'강 위에 떠 있는 듯한 16세기 요새. 발견기념비까지 강변 산책로를 따라 걷기 좋아요.',
         loc:'Torre de Belém',dur:'1시간',price:'€8',transit:{type:'walk',label:'도보 12분 · 0.9km'}},
        {time:'16:00',ampm:'오후',cat:'nature',name:'LX 팩토리',
         desc:'옛 방직 공장을 개조한 복합 문화 공간. 서점 ‘레르 데바가르’와 독립 상점을 구경하며 오후를 보내요.',
         loc:'LX Factory',dur:'1시간 30분',price:'무료',transit:{type:'tram',label:'트램 10분'}}
      ]
    },
    {
      id:'day-3', n:3, date:'10월 16일 · 목', short:'목', title:'신트라 당일치기',
      sub:'동화 속 궁전 마을', wx:{ic:'cloud',t:'20°'},
      stops:[
        {time:'08:20',ampm:'오전',cat:'stay',name:'로시우 역 출발',
         desc:'신트라행 근교 열차에 탑승. 약 40분이면 안개 낀 산속 마을에 도착해요. 1일권을 미리 끊어 두면 편해요.',
         loc:'Estação do Rossio',dur:'40분',price:'€2.40',transit:null},
        {time:'09:30',ampm:'오전',cat:'sight',name:'페나 궁전',
         desc:'노랑·빨강이 어우러진 낭만주의 궁전. 언덕 위 테라스에서 보는 구름바다가 비현실적이에요.',
         loc:'Palácio da Pena',dur:'2시간',price:'€14',transit:{type:'tram',label:'434버스 15분'}},
        {time:'13:00',ampm:'오후',cat:'nature',name:'킨타 다 헤갈레이라',
         desc:'신비로운 정원과 나선형 우물. 이끼 낀 돌계단을 따라 비밀스러운 동굴길을 탐험해요.',
         loc:'Quinta da Regaleira',dur:'1시간 40분',price:'€12',transit:{type:'walk',label:'도보 18분 · 1.3km'}},
        {time:'16:00',ampm:'오후',cat:'food',name:'피리키타 베이커리',
         desc:'신트라 명물 트라베세이루와 케이자다. 돌아가는 열차를 기다리며 달콤한 간식으로 충전.',
         loc:'Casa Piriquita',dur:'40분',price:'€8',transit:{type:'walk',label:'도보 10분 · 0.7km'}}
      ]
    },
    {
      id:'day-4', n:4, date:'10월 17일 · 금', short:'금', title:'시아두와 작별',
      sub:'마지막 날 · 언덕 위 전망', wx:{ic:'sun',t:'25°'},
      stops:[
        {time:'10:00',ampm:'오전',cat:'sight',name:'상 조르즈 성',
         desc:'도시에서 가장 높은 언덕의 무어인 성채. 성벽을 걸으며 붉은 지붕이 빼곡한 시내를 내려다봐요.',
         loc:'Castelo de São Jorge',dur:'1시간 20분',price:'€15',transit:{type:'tram',label:'28번 트램 20분'}},
        {time:'12:30',ampm:'오후',cat:'food',name:'세르베자리아 하미루',
         desc:'현지인이 사랑하는 해산물 맛집. 마늘새우와 차가운 맥주, 그리고 후식으로 비파나 샌드위치까지.',
         loc:'Cervejaria Ramiro',dur:'1시간 30분',price:'€35~',transit:{type:'walk',label:'도보 14분 · 1.0km'}},
        {time:'15:00',ampm:'오후',cat:'nature',name:'산타 카타리나 전망대',
         desc:'테주강이 가장 넓게 보이는 미라도루. 버스킹 선율을 들으며 마지막 오후 햇살을 즐겨요.',
         loc:'Miradouro de Santa Catarina',dur:'50분',price:'무료',transit:{type:'tram',label:'트램 12분'}},
        {time:'18:30',ampm:'저녁',cat:'stay',name:'공항으로 이동',
         desc:'시아두에서 마지막 기념품을 산 뒤 공항으로. 메트로 레드 라인으로 25분이면 도착해요.',
         loc:'Aeroporto de Lisboa',dur:'25분',price:'€1.80',transit:{type:'train',label:'메트로 25분'}}
      ]
    }
  ];

  /* ── render ── */
  const daysEl = document.getElementById('days');
  const navEl = document.getElementById('daynav');
  const mtabsEl = document.getElementById('mtabs');

  DAYS.forEach(day=>{
    // nav link
    const link = document.createElement('a');
    link.className='daylink';
    link.href='#'+day.id;
    link.dataset.target=day.id;
    link.innerHTML=`
      <span class="idx">${String(day.n).padStart(2,'0')}</span>
      <span class="meta"><span class="t">${day.title}</span><span class="d">${day.date}</span></span>
      <span class="chev">${I.chev}</span>`;
    navEl.appendChild(link);

    // mobile tab
    const tab=document.createElement('button');
    tab.className='mtab';tab.dataset.target=day.id;
    tab.textContent=`Day ${day.n} · ${day.short}`;
    mtabsEl.appendChild(tab);

    // day section
    const sec=document.createElement('section');
    sec.className='day';sec.id=day.id;
    let stopsHtml='';
    day.stops.forEach(s=>{
      const c=CATS[s.cat];
      const t=s.transit?`<div class="transit"><span class="ln"></span>${TRANSIT[s.transit.type]}<span>${s.transit.label}</span><span class="ln"></span></div>`:'';
      stopsHtml+=`
        ${t}
        <div class="stop cat-${s.cat}">
          <div class="time">${s.time}<span class="ampm">${s.ampm}</span></div>
          <div class="rail"><span class="node"></span></div>
          <div class="card">
            <div class="card-top">
              <div class="ttl">
                <span class="check" role="button" tabindex="0" aria-label="방문 완료 표시">${I.check}</span>
                <span class="name">${s.name}</span>
              </div>
              <span class="chip ${c.cls}">${c.label}</span>
            </div>
            <p class="desc">${s.desc}</p>
            <div class="card-foot">
              <span class="mini">${I.clock}${s.dur}</span>
              <span class="mini">${I.pin}${s.loc}</span>
              ${s.price?`<span class="mini price">${I.euro}${s.price}</span>`:''}
              <a class="linkbtn" href="#" onclick="return false">${I.map}지도</a>
            </div>
          </div>
        </div>`;
    });
    sec.innerHTML=`
      <div class="day-head">
        <div class="day-badge"><span class="k">Day</span><span class="v">${day.n}</span></div>
        <div class="day-titles">
          <div class="h">${day.title}</div>
          <div class="s">
            <span>${day.date}</span><span class="sep"></span>
            <span>${day.sub}</span><span class="sep"></span>
            <span class="weather">${I[day.wx.ic]}${day.wx.t}</span>
          </div>
        </div>
      </div>
      <div class="timeline">${stopsHtml}</div>`;
    daysEl.appendChild(sec);
  });

  /* ── check interaction ── */
  daysEl.addEventListener('click',e=>{
    const chk=e.target.closest('.check');
    if(!chk)return;
    chk.closest('.stop').classList.toggle('done');
  });
  daysEl.addEventListener('keydown',e=>{
    if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('check')){
      e.preventDefault();
      e.target.closest('.stop').classList.toggle('done');
    }
  });

  /* ── scroll spy ── */
  const links=[...navEl.querySelectorAll('.daylink')];
  const tabs=[...mtabsEl.querySelectorAll('.mtab')];
  const setActive=id=>{
    links.forEach(l=>l.classList.toggle('active',l.dataset.target===id));
    tabs.forEach(t=>{
      const on=t.dataset.target===id;
      t.classList.toggle('on',on);
      if(on)t.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
    });
  };
  const io=new IntersectionObserver(entries=>{
    entries.forEach(en=>{ if(en.isIntersecting) setActive(en.target.id); });
  },{rootMargin:'-45% 0px -50% 0px',threshold:0});
  DAYS.forEach(d=>io.observe(document.getElementById(d.id)));
  setActive(DAYS[0].id);

  tabs.forEach(t=>t.addEventListener('click',()=>{
    document.getElementById(t.dataset.target).scrollIntoView({behavior:'smooth',block:'start'});
  }));
</script>
</body>
</html>
