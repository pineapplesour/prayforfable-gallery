<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cadence — 음악 플레이어</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F6F5F1;
    --surface:#FFFFFF;
    --surface-2:#F0EEE8;
    --ink:#1C1B19;
    --ink-2:#6E6A62;
    --ink-3:#9C978D;
    --line:#E7E3DB;
    --line-2:#EFECE5;
    --accent:#B8503A;
    --accent-soft:#F3E3DD;
    --radius:18px;
    --radius-sm:12px;
    --shadow-sm:0 1px 2px rgba(28,27,25,.04), 0 2px 8px rgba(28,27,25,.04);
    --shadow-md:0 4px 16px rgba(28,27,25,.06), 0 12px 36px rgba(28,27,25,.06);
    --font-sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-display:'Fraunces', Georgia, serif;
    --ease:cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font-sans);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::selection{background:var(--accent-soft)}

  /* ============ App grid ============ */
  .app{
    display:grid;
    grid-template-columns:264px 1fr;
    grid-template-rows:1fr 88px;
    height:100vh;
    width:100%;
  }

  /* ============ Sidebar ============ */
  .sidebar{
    grid-row:1 / 2;
    grid-column:1 / 2;
    border-right:1px solid var(--line);
    padding:26px 20px 20px;
    display:flex;
    flex-direction:column;
    gap:26px;
    overflow:hidden;
    background:var(--bg);
  }
  .brand{display:flex;align-items:center;gap:11px;padding:0 6px}
  .brand-mark{
    width:32px;height:32px;border-radius:9px;flex:none;
    background:linear-gradient(140deg,#2A2825,#5A5048);
    display:grid;place-items:center;color:#fff;
  }
  .brand-mark svg{width:17px;height:17px}
  .brand-name{font-family:var(--font-display);font-size:20px;font-weight:500;letter-spacing:-.01em}
  .brand-name span{color:var(--accent)}

  .nav{display:flex;flex-direction:column;gap:2px}
  .nav-item{
    display:flex;align-items:center;gap:13px;
    padding:10px 12px;border-radius:11px;
    color:var(--ink-2);font-size:14.5px;font-weight:500;
    transition:background .18s var(--ease), color .18s var(--ease);
    position:relative;
  }
  .nav-item svg{width:19px;height:19px;flex:none;stroke-width:1.7}
  .nav-item:hover{background:var(--surface-2);color:var(--ink)}
  .nav-item.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
  .nav-item.active::before{
    content:"";position:absolute;left:-20px;top:50%;transform:translateY(-50%);
    width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--accent);
  }

  .side-label{
    font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-3);padding:0 12px;margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .side-label button{color:var(--ink-3);display:grid;place-items:center;transition:color .18s}
  .side-label button:hover{color:var(--ink)}
  .side-label button svg{width:16px;height:16px;stroke-width:1.8}

  .playlists{display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px}
  .playlists::-webkit-scrollbar{width:0}
  .pl-item{
    display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;
    color:var(--ink-2);transition:background .16s var(--ease), color .16s var(--ease);
  }
  .pl-item:hover{background:var(--surface-2);color:var(--ink)}
  .pl-cover{width:36px;height:36px;border-radius:8px;flex:none;box-shadow:var(--shadow-sm)}
  .pl-meta{min-width:0}
  .pl-title{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-sub{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ============ Main ============ */
  .main{
    grid-row:1 / 2;grid-column:2 / 3;
    overflow-y:auto;padding:0;
    position:relative;
  }
  .main::-webkit-scrollbar{width:10px}
  .main::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid var(--bg)}

  .topbar{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:18px 36px;
    background:linear-gradient(var(--bg) 60%, rgba(246,245,241,0));
  }
  .search{
    display:flex;align-items:center;gap:10px;flex:1;max-width:380px;
    background:var(--surface);border:1px solid var(--line);
    padding:10px 15px;border-radius:13px;box-shadow:var(--shadow-sm);
    transition:border-color .18s, box-shadow .18s;
  }
  .search:focus-within{border-color:#D8D2C7;box-shadow:0 0 0 3px var(--surface-2)}
  .search svg{width:18px;height:18px;color:var(--ink-3);stroke-width:1.8;flex:none}
  .search input{border:none;outline:none;background:none;font-size:14px;color:var(--ink);width:100%}
  .search input::placeholder{color:var(--ink-3)}
  .topbar-actions{display:flex;align-items:center;gap:10px}
  .icon-btn{
    width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
    color:var(--ink-2);background:var(--surface);border:1px solid var(--line);
    box-shadow:var(--shadow-sm);transition:transform .14s var(--ease), color .16s;
  }
  .icon-btn svg{width:18px;height:18px;stroke-width:1.8}
  .icon-btn:hover{color:var(--ink)}
  .icon-btn:active{transform:scale(.94)}
  .avatar{
    width:40px;height:40px;border-radius:11px;flex:none;
    background:linear-gradient(140deg,#C9B6A0,#9C8268);
    display:grid;place-items:center;color:#fff;font-weight:600;font-size:14px;
    box-shadow:var(--shadow-sm);
  }

  .content{padding:8px 36px 48px;max-width:1080px}

  /* hero / now playing */
  .greet{font-size:13px;color:var(--ink-2);margin-bottom:6px;font-weight:500}
  .hero{
    display:grid;grid-template-columns:300px 1fr;gap:34px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:28px;box-shadow:var(--shadow-md);
    margin-bottom:38px;
  }
  .hero-art{
    width:300px;height:300px;border-radius:16px;position:relative;overflow:hidden;
    box-shadow:0 10px 30px rgba(28,27,25,.16);
  }
  .hero-art::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(120% 90% at 70% 10%, rgba(255,255,255,.32), transparent 55%);
    mix-blend-mode:soft-light;
  }
  .hero-disc{
    position:absolute;right:-46px;bottom:-46px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%, #2a2724 0 18%, #1c1b19 18% 22%, #2a2724 22% 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06), 0 8px 24px rgba(0,0,0,.25);
    opacity:.0;transition:opacity .4s;
  }
  .hero-info{display:flex;flex-direction:column;justify-content:center}
  .hero-tag{
    display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;
  }
  .hero-tag .eq{display:inline-flex;gap:2px;align-items:flex-end;height:13px}
  .hero-tag .eq i{width:2.5px;background:var(--accent);border-radius:2px;height:40%;animation:eq 1s var(--ease) infinite}
  .hero-tag .eq i:nth-child(2){animation-delay:.25s;height:80%}
  .hero-tag .eq i:nth-child(3){animation-delay:.5s;height:55%}
  .hero-tag .eq i:nth-child(4){animation-delay:.15s;height:95%}
  @keyframes eq{0%,100%{height:25%}50%{height:100%}}
  body.paused .eq i{animation-play-state:paused}

  .hero-title{font-family:var(--font-display);font-weight:500;font-size:42px;line-height:1.05;letter-spacing:-.02em;margin-bottom:10px}
  .hero-artist{font-size:16px;color:var(--ink-2);font-weight:500;margin-bottom:6px}
  .hero-meta{font-size:13px;color:var(--ink-3);margin-bottom:26px}
  .hero-controls{display:flex;align-items:center;gap:14px}
  .btn-play-lg{
    display:inline-flex;align-items:center;gap:10px;
    background:var(--ink);color:#fff;font-size:14.5px;font-weight:600;
    padding:13px 26px;border-radius:13px;transition:transform .14s var(--ease), background .2s;
  }
  .btn-play-lg svg{width:18px;height:18px}
  .btn-play-lg:hover{background:#000}
  .btn-play-lg:active{transform:scale(.97)}
  .btn-ghost{
    width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
    border:1px solid var(--line);color:var(--ink-2);background:var(--surface);
    transition:color .16s, border-color .16s, transform .14s;
  }
  .btn-ghost svg{width:19px;height:19px;stroke-width:1.7}
  .btn-ghost:hover{color:var(--ink);border-color:#D8D2C7}
  .btn-ghost:active{transform:scale(.94)}
  .btn-ghost.liked{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
  .btn-ghost.liked svg{fill:var(--accent);stroke:var(--accent)}

  /* queue */
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  .section-title{font-size:18px;font-weight:600;letter-spacing:-.01em}
  .section-link{font-size:13px;color:var(--ink-2);font-weight:500;transition:color .16s}
  .section-link:hover{color:var(--ink)}

  .track-head{
    display:grid;grid-template-columns:28px 1fr 150px 64px;gap:16px;align-items:center;
    padding:0 14px 10px;font-size:11.5px;font-weight:600;letter-spacing:.05em;
    text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line-2);
  }
  .track-head .th-right{text-align:right}
  .tracklist{display:flex;flex-direction:column;padding-top:6px}
  .track{
    display:grid;grid-template-columns:28px 1fr 150px 64px;gap:16px;align-items:center;
    padding:9px 14px;border-radius:12px;cursor:pointer;
    transition:background .15s var(--ease);
  }
  .track:hover{background:var(--surface)}
  .track.playing{background:var(--surface);box-shadow:var(--shadow-sm)}
  .t-index{font-size:13.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:center;position:relative}
  .t-index .play-ic{display:none}
  .track:hover .t-index .num{display:none}
  .track:hover .t-index .play-ic{display:inline-flex}
  .play-ic svg{width:15px;height:15px;color:var(--ink)}
  .track.playing .t-index .num,.track.playing .t-index .play-ic{display:none}
  .track.playing .t-index .eq-mini{display:inline-flex}
  .eq-mini{display:none;gap:2px;align-items:flex-end;height:14px;justify-content:center}
  .eq-mini i{width:2.5px;background:var(--accent);border-radius:2px;animation:eq .9s var(--ease) infinite}
  .eq-mini i:nth-child(1){height:50%}
  .eq-mini i:nth-child(2){height:90%;animation-delay:.3s}
  .eq-mini i:nth-child(3){height:65%;animation-delay:.15s}
  body.paused .eq-mini i{animation-play-state:paused}

  .t-main{display:flex;align-items:center;gap:13px;min-width:0}
  .t-cover{width:42px;height:42px;border-radius:9px;flex:none;box-shadow:var(--shadow-sm)}
  .t-text{min-width:0}
  .t-title{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track.playing .t-title{color:var(--accent)}
  .t-artist{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-album{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-right{display:flex;align-items:center;justify-content:flex-end;gap:14px}
  .t-like{color:var(--ink-3);display:grid;place-items:center;opacity:0;transition:opacity .15s, color .15s}
  .track:hover .t-like{opacity:1}
  .t-like svg{width:16px;height:16px;stroke-width:1.7}
  .t-like:hover{color:var(--accent)}
  .t-like.on{opacity:1;color:var(--accent)}
  .t-like.on svg{fill:var(--accent);stroke:var(--accent)}
  .t-dur{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}

  /* ============ Player bar ============ */
  .player{
    grid-row:2 / 3;grid-column:1 / 3;
    border-top:1px solid var(--line);
    background:var(--surface);
    display:grid;grid-template-columns:1fr minmax(420px,560px) 1fr;
    align-items:center;gap:24px;
    padding:0 24px;
  }
  .now{display:flex;align-items:center;gap:14px;min-width:0}
  .now-cover{width:56px;height:56px;border-radius:12px;flex:none;box-shadow:var(--shadow-sm)}
  .now-text{min-width:0}
  .now-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now-artist{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now-like{color:var(--ink-3);margin-left:4px;flex:none;transition:color .16s, transform .14s}
  .now-like svg{width:18px;height:18px;stroke-width:1.7}
  .now-like:hover{color:var(--ink)}
  .now-like:active{transform:scale(.9)}
  .now-like.on{color:var(--accent)}
  .now-like.on svg{fill:var(--accent);stroke:var(--accent)}

  .center{display:flex;flex-direction:column;align-items:center;gap:8px}
  .ctrls{display:flex;align-items:center;gap:18px}
  .c-btn{color:var(--ink-2);display:grid;place-items:center;transition:color .16s, transform .14s}
  .c-btn svg{width:20px;height:20px;stroke-width:1.8}
  .c-btn:hover{color:var(--ink)}
  .c-btn:active{transform:scale(.9)}
  .c-btn.toggle.on{color:var(--accent)}
  .c-btn.toggle.on::after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:26px}
  .c-btn.toggle{position:relative}
  .btn-play{
    width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;
    display:grid;place-items:center;transition:transform .14s var(--ease), background .2s;
  }
  .btn-play svg{width:19px;height:19px}
  .btn-play:hover{background:#000}
  .btn-play:active{transform:scale(.92)}

  .progress-row{display:flex;align-items:center;gap:11px;width:100%}
  .time{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;width:38px;flex:none}
  .time.r{text-align:right}
  .bar{
    flex:1;height:5px;background:var(--surface-2);border-radius:5px;position:relative;cursor:pointer;
  }
  .bar-fill{height:100%;background:var(--ink);border-radius:5px;width:0;position:relative}
  .bar:hover .bar-fill{background:var(--accent)}
  .bar-knob{
    position:absolute;right:-6px;top:50%;width:12px;height:12px;border-radius:50%;
    background:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.25);transform:translateY(-50%) scale(0);
    transition:transform .14s var(--ease);
  }
  .bar:hover .bar-knob{transform:translateY(-50%) scale(1)}
  .bar:hover .bar-knob{background:var(--accent)}

  .right{display:flex;align-items:center;justify-content:flex-end;gap:14px}
  .r-btn{color:var(--ink-2);display:grid;place-items:center;transition:color .16s, transform .14s}
  .r-btn svg{width:18px;height:18px;stroke-width:1.8}
  .r-btn:hover{color:var(--ink)}
  .r-btn:active{transform:scale(.9)}
  .vol{display:flex;align-items:center;gap:9px}
  .vol-bar{width:92px;height:5px;background:var(--surface-2);border-radius:5px;position:relative;cursor:pointer}
  .vol-fill{height:100%;background:var(--ink);border-radius:5px;width:70%;position:relative}
  .vol-bar:hover .vol-fill{background:var(--accent)}
  .vol-knob{position:absolute;right:-5px;top:50%;width:11px;height:11px;border-radius:50%;background:var(--ink);transform:translateY(-50%) scale(0);transition:transform .14s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
  .vol-bar:hover .vol-knob{transform:translateY(-50%) scale(1)}

  /* mobile bottom tab (hidden on desktop) */
  .tabbar{display:none}

  /* ============ Responsive ============ */
  @media (max-width:1100px){
    .hero{grid-template-columns:220px 1fr;gap:26px;padding:22px}
    .hero-art{width:220px;height:220px}
    .hero-title{font-size:34px}
    .player{grid-template-columns:1fr minmax(320px,1fr) auto;gap:16px}
    .t-album{display:none}
    .track,.track-head{grid-template-columns:28px 1fr 64px}
    .th-album{display:none}
  }

  @media (max-width:760px){
    body{overflow:auto}
    .app{
      grid-template-columns:1fr;
      grid-template-rows:1fr auto auto;
      height:auto;min-height:100vh;
    }
    .sidebar{display:none}
    .main{grid-row:1;grid-column:1;height:auto;overflow:visible}
    .topbar{padding:14px 18px;gap:12px}
    .topbar .icon-btn:first-of-type{display:none}
    .content{padding:6px 18px 24px}
    .hero{grid-template-columns:1fr;gap:20px;padding:18px;margin-bottom:28px}
    .hero-art{width:100%;height:auto;aspect-ratio:1/1;max-width:340px;margin:0 auto}
    .hero-info{align-items:flex-start}
    .hero-title{font-size:32px}
    .hero-controls{flex-wrap:wrap}

    /* player becomes compact mini-bar fixed above tab bar */
    .player{
      grid-row:2;grid-column:1;
      position:fixed;bottom:58px;left:8px;right:8px;
      display:flex;align-items:center;gap:12px;
      border:1px solid var(--line);border-radius:16px;
      padding:8px 12px;box-shadow:var(--shadow-md);z-index:40;
      height:auto;
    }
    .now{flex:1}
    .now-cover{width:44px;height:44px;border-radius:10px}
    .now-like{display:none}
    .center{flex:none}
    .ctrls{gap:6px}
    .ctrls .c-btn.shuffle,.ctrls .c-btn.repeat{display:none}
    .progress-row{display:none}
    .right{display:none}
    .btn-play{width:40px;height:40px}

    /* thin progress line under mini player */
    .center::after{content:none}

    .tabbar{
      display:flex;position:fixed;bottom:0;left:0;right:0;height:58px;z-index:50;
      background:var(--surface);border-top:1px solid var(--line);
      padding-bottom:env(safe-area-inset-bottom);
    }
    .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:10.5px;font-weight:500}
    .tab svg{width:21px;height:21px;stroke-width:1.7}
    .tab.active{color:var(--ink)}
    .content{padding-bottom:140px}
  }
  @media (max-width:420px){
    .hero-title{font-size:28px}
    .search input{font-size:13.5px}
  }
</style>
</head>
<body class="paused">
<div class="app">

  <!-- ============ Sidebar ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div class="brand-name">Cad<span>ence</span></div>
    </div>

    <nav class="nav">
      <a class="nav-item active" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg>
        홈
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        둘러보기
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v16H4zM14 4h6v16h-6z"/></svg>
        라이브러리
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-9.7-9A5.2 5.2 0 0 1 12 6.5 5.2 5.2 0 0 1 21.7 12C19.5 16.4 12 21 12 21Z"/></svg>
        즐겨찾기
      </a>
    </nav>

    <div style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div class="side-label">
        플레이리스트
        <button aria-label="새 플레이리스트"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="playlists" id="playlists"></div>
    </div>
  </aside>

  <!-- ============ Main ============ -->
  <main class="main">
    <header class="topbar">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input type="text" placeholder="곡, 아티스트, 앨범 검색" aria-label="검색" />
      </label>
      <div class="topbar-actions">
        <button class="icon-btn" aria-label="알림"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
        <div class="avatar">소</div>
      </div>
    </header>

    <div class="content">
      <div class="greet" id="greet">좋은 오후예요, 소연님</div>

      <!-- now playing hero -->
      <section class="hero">
        <div class="hero-art" id="heroArt"><div class="hero-disc" id="heroDisc"></div></div>
        <div class="hero-info">
          <div class="hero-tag">
            <span class="eq"><i></i><i></i><i></i><i></i></span>
            지금 재생 중
          </div>
          <h1 class="hero-title" id="heroTitle">—</h1>
          <div class="hero-artist" id="heroArtist">—</div>
          <div class="hero-meta" id="heroMeta">—</div>
          <div class="hero-controls">
            <button class="btn-play-lg" id="heroPlay">
              <svg id="heroPlayIc" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <span id="heroPlayLabel">재생</span>
            </button>
            <button class="btn-ghost" id="heroLike" aria-label="좋아요">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-9.7-9A5.2 5.2 0 0 1 12 6.5 5.2 5.2 0 0 1 21.7 12C19.5 16.4 12 21 12 21Z"/></svg>
            </button>
            <button class="btn-ghost" id="heroShare" aria-label="공유">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
            </button>
          </div>
        </div>
      </section>

      <!-- queue -->
      <div class="section-head">
        <h2 class="section-title">다음 트랙 · 저녁의 결</h2>
        <a class="section-link" href="#">전체 보기</a>
      </div>

      <div class="track-head">
        <span style="text-align:center">#</span>
        <span>제목</span>
        <span class="th-album">앨범</span>
        <span class="th-right">시간</span>
      </div>
      <div class="tracklist" id="tracklist"></div>
    </div>
  </main>

  <!-- ============ Player bar ============ -->
  <footer class="player">
    <div class="now">
      <div class="now-cover" id="nowCover"></div>
      <div class="now-text">
        <div class="now-title" id="nowTitle">—</div>
        <div class="now-artist" id="nowArtist">—</div>
      </div>
      <button class="now-like" id="nowLike" aria-label="좋아요">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-9.7-9A5.2 5.2 0 0 1 12 6.5 5.2 5.2 0 0 1 21.7 12C19.5 16.4 12 21 12 21Z"/></svg>
      </button>
    </div>

    <div class="center">
      <div class="ctrls">
        <button class="c-btn toggle shuffle" id="shuffleBtn" aria-label="셔플">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>
        <button class="c-btn" id="prevBtn" aria-label="이전">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6 9 12l11 6z"/></svg>
        </button>
        <button class="btn-play" id="playBtn" aria-label="재생">
          <svg id="playIc" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="c-btn" id="nextBtn" aria-label="다음">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6L4 18z"/></svg>
        </button>
        <button class="c-btn toggle repeat" id="repeatBtn" aria-label="반복">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>
      <div class="progress-row">
        <span class="time" id="curTime">0:00</span>
        <div class="bar" id="bar"><div class="bar-fill" id="barFill"><div class="bar-knob"></div></div></div>
        <span class="time r" id="durTime">0:00</span>
      </div>
    </div>

    <div class="right">
      <button class="r-btn" id="queueBtn" aria-label="대기열">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h13M3 12h13M3 18h9M17 12l4 3-4 3z"/></svg>
      </button>
      <button class="r-btn" id="lyricsBtn" aria-label="가사">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 10h10M4 15h16M4 20h7"/></svg>
      </button>
      <div class="vol">
        <button class="r-btn" id="muteBtn" aria-label="음소거">
          <svg id="volIc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>
        </button>
        <div class="vol-bar" id="volBar"><div class="vol-fill" id="volFill"><div class="vol-knob"></div></div></div>
      </div>
    </div>
  </footer>

  <!-- mobile tab bar -->
  <nav class="tabbar">
    <button class="tab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg>홈</button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>둘러보기</button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v16H4zM14 4h6v16h-6z"/></svg>보관함</button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-9.7-9A5.2 5.2 0 0 1 12 6.5 5.2 5.2 0 0 1 21.7 12C19.5 16.4 12 21 12 21Z"/></svg>즐겨찾기</button>
  </nav>
</div>

<script>
(function(){
  "use strict";

  const gradients = [
    "linear-gradient(145deg,#E8C9A0,#C2895F)",
    "linear-gradient(145deg,#A9B8A0,#6C8676)",
    "linear-gradient(145deg,#C9B6D6,#8C78A6)",
    "linear-gradient(145deg,#E4B6A6,#B06E63)",
    "linear-gradient(145deg,#AEC1CC,#6C8898)",
    "linear-gradient(145deg,#D8C6A0,#A68C60)",
    "linear-gradient(145deg,#C8A9A0,#8A6C68)",
    "linear-gradient(145deg,#B6C2B0,#7C8E7E)",
    "linear-gradient(145deg,#D4B9C2,#9C6E7E)",
    "linear-gradient(145deg,#BFC6B0,#86916A)"
  ];

  const tracks = [
    {title:"종이 배",        artist:"Mild Atlas",     album:"느린 해안",        dur:223, g:0},
    {title:"유리 정원",      artist:"한유나",          album:"저녁의 결",        dur:198, g:2},
    {title:"느린 조류",      artist:"Marin",          album:"바다의 호흡",      dur:245, g:4},
    {title:"흐린 오후",      artist:"여름 우체국",      album:"저녁의 결",        dur:211, g:1},
    {title:"안개 속에서",    artist:"Lowtide Club",   album:"무드 라이트",      dur:176, g:6},
    {title:"창가의 빛",      artist:"노을 상점",        album:"저녁의 결",        dur:234, g:5},
    {title:"먼 곳의 신호",   artist:"Pale Signal",    album:"드리프트",         dur:258, g:3},
    {title:"잔잔한 밤",      artist:"한유나",          album:"저녁의 결",        dur:189, g:8},
    {title:"눈 내리는 거리", artist:"Winterlight",    album:"하얀 계절",        dur:267, g:7},
    {title:"마지막 정류장",  artist:"여름 우체국",      album:"저녁의 결",        dur:205, g:9}
  ];

  const playlists = [
    {title:"저녁의 결",      sub:"24곡 · 한유나",  g:2},
    {title:"집중 모드",      sub:"40곡 · Cadence", g:4},
    {title:"비 오는 날",     sub:"18곡 · 큐레이션", g:6},
    {title:"아침 루틴",      sub:"32곡 · 나의 믹스", g:0},
    {title:"드라이브 나잇",   sub:"27곡 · Cadence", g:3},
    {title:"카페 백그라운드", sub:"55곡 · 큐레이션", g:5},
    {title:"고요한 새벽",     sub:"21곡 · 나의 믹스", g:8}
  ];

  const liked = new Set([1,5]);

  let cur = 0, playing = false, t = 0, vol = 0.7, muted = false;
  let shuffle = false, repeat = false;

  const $ = (s)=>document.querySelector(s);
  const fmt = (s)=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};

  // ---- build playlists ----
  const plWrap = $("#playlists");
  playlists.forEach(p=>{
    const el = document.createElement("a");
    el.className="pl-item"; el.href="#";
    el.innerHTML = `<div class="pl-cover" style="background:${gradients[p.g]}"></div>
      <div class="pl-meta"><div class="pl-title">${p.title}</div><div class="pl-sub">${p.sub}</div></div>`;
    plWrap.appendChild(el);
  });

  // ---- build tracklist ----
  const tlWrap = $("#tracklist");
  tracks.forEach((tr,i)=>{
    const el = document.createElement("div");
    el.className="track"; el.dataset.i=i;
    el.innerHTML = `
      <div class="t-index">
        <span class="num">${i+1}</span>
        <span class="play-ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
        <span class="eq-mini"><i></i><i></i><i></i></span>
      </div>
      <div class="t-main">
        <div class="t-cover" style="background:${gradients[tr.g]}"></div>
        <div class="t-text"><div class="t-title">${tr.title}</div><div class="t-artist">${tr.artist}</div></div>
      </div>
      <div class="t-album">${tr.album}</div>
      <div class="t-right">
        <button class="t-like ${liked.has(i)?'on':''}" data-like="${i}" aria-label="좋아요">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-9.7-9A5.2 5.2 0 0 1 12 6.5 5.2 5.2 0 0 1 21.7 12C19.5 16.4 12 21 12 21Z"/></svg>
        </button>
        <span class="t-dur">${fmt(tr.dur)}</span>
      </div>`;
    el.addEventListener("click",(e)=>{
      if(e.target.closest("[data-like]")) return;
      if(i===cur){ togglePlay(); } else { loadTrack(i,true); }
    });
    tlWrap.appendChild(el);
  });

  tlWrap.addEventListener("click",(e)=>{
    const b = e.target.closest("[data-like]");
    if(!b) return;
    e.stopPropagation();
    const i = +b.dataset.like;
    if(liked.has(i)) liked.delete(i); else liked.add(i);
    b.classList.toggle("on", liked.has(i));
    if(i===cur) syncLike();
  });

  // ---- elements ----
  const heroArt=$("#heroArt"), heroDisc=$("#heroDisc"), heroTitle=$("#heroTitle"),
        heroArtist=$("#heroArtist"), heroMeta=$("#heroMeta"), heroLike=$("#heroLike"),
        heroPlayLabel=$("#heroPlayLabel"), heroPlayIc=$("#heroPlayIc");
  const nowCover=$("#nowCover"), nowTitle=$("#nowTitle"), nowArtist=$("#nowArtist"), nowLike=$("#nowLike");
  const barFill=$("#barFill"), curTime=$("#curTime"), durTime=$("#durTime");
  const playIc=$("#playIc");

  const playIconPath = '<path d="M8 5v14l11-7z"/>';
  const pauseIconPath = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';

  function loadTrack(i, autoplay){
    cur = i; t = 0;
    const tr = tracks[i];
    heroArt.style.background = gradients[tr.g];
    heroArt.appendChild(heroDisc);
    heroTitle.textContent = tr.title;
    heroArtist.textContent = tr.artist;
    heroMeta.textContent = `${tr.album} · ${fmt(tr.dur)}`;
    nowCover.style.background = gradients[tr.g];
    nowTitle.textContent = tr.title;
    nowArtist.textContent = tr.artist;
    durTime.textContent = fmt(tr.dur);
    syncLike();
    renderRows();
    updateProgress();
    if(autoplay) setPlaying(true); else updatePlayUI();
  }

  function syncLike(){
    const on = liked.has(cur);
    heroLike.classList.toggle("liked", on);
    nowLike.classList.toggle("on", on);
  }

  function renderRows(){
    document.querySelectorAll(".track").forEach(el=>{
      el.classList.toggle("playing", +el.dataset.i===cur && playing);
    });
  }

  function updatePlayUI(){
    playIc.innerHTML = playing ? pauseIconPath : playIconPath;
    heroPlayIc.innerHTML = playing ? pauseIconPath : playIconPath;
    heroPlayLabel.textContent = playing ? "일시정지" : "재생";
    document.body.classList.toggle("paused", !playing);
    renderRows();
  }

  function setPlaying(p){ playing = p; updatePlayUI(); }
  function togglePlay(){ setPlaying(!playing); }

  function next(){
    let n;
    if(shuffle){ do{ n=Math.floor(Math.random()*tracks.length);}while(n===cur && tracks.length>1); }
    else n=(cur+1)%tracks.length;
    loadTrack(n, true);
  }
  function prev(){
    if(t>3){ t=0; updateProgress(); return; }
    let n = (cur-1+tracks.length)%tracks.length;
    loadTrack(n, true);
  }

  function updateProgress(){
    const d = tracks[cur].dur;
    barFill.style.width = (t/d*100)+"%";
    curTime.textContent = fmt(t);
  }

  // ---- controls ----
  $("#playBtn").addEventListener("click",togglePlay);
  $("#heroPlay").addEventListener("click",togglePlay);
  $("#nextBtn").addEventListener("click",next);
  $("#prevBtn").addEventListener("click",prev);
  $("#shuffleBtn").addEventListener("click",function(){shuffle=!shuffle;this.classList.toggle("on",shuffle);});
  $("#repeatBtn").addEventListener("click",function(){repeat=!repeat;this.classList.toggle("on",repeat);});
  heroLike.addEventListener("click",toggleLikeCur);
  nowLike.addEventListener("click",toggleLikeCur);
  function toggleLikeCur(){
    if(liked.has(cur)) liked.delete(cur); else liked.add(cur);
    syncLike();
    const row = document.querySelector(`[data-like="${cur}"]`);
    if(row) row.classList.toggle("on", liked.has(cur));
  }

  // ---- seek ----
  const bar = $("#bar");
  let seeking=false;
  function seekFromEvent(e){
    const r = bar.getBoundingClientRect();
    const x = (e.touches?e.touches[0].clientX:e.clientX) - r.left;
    const ratio = Math.min(1,Math.max(0,x/r.width));
    t = ratio*tracks[cur].dur;
    updateProgress();
  }
  bar.addEventListener("mousedown",(e)=>{seeking=true;seekFromEvent(e);});
  window.addEventListener("mousemove",(e)=>{if(seeking)seekFromEvent(e);});
  window.addEventListener("mouseup",()=>{seeking=false;});
  bar.addEventListener("touchstart",(e)=>{seeking=true;seekFromEvent(e);},{passive:true});
  bar.addEventListener("touchmove",(e)=>{if(seeking)seekFromEvent(e);},{passive:true});
  bar.addEventListener("touchend",()=>{seeking=false;});

  // ---- volume ----
  const volBar=$("#volBar"), volFill=$("#volFill"), volIc=$("#volIc");
  function setVol(v){
    vol = Math.min(1,Math.max(0,v));
    muted = vol===0;
    volFill.style.width = (vol*100)+"%";
    volIc.innerHTML = (muted)
      ? '<path d="M11 5 6 9H2v6h4l5 4z"/><path d="m17 9 5 5M22 9l-5 5"/>'
      : '<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/>';
  }
  let vSeek=false;
  function volFromEvent(e){
    const r=volBar.getBoundingClientRect();
    const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    setVol(x/r.width);
  }
  volBar.addEventListener("mousedown",(e)=>{vSeek=true;volFromEvent(e);});
  window.addEventListener("mousemove",(e)=>{if(vSeek)volFromEvent(e);});
  window.addEventListener("mouseup",()=>{vSeek=false;});
  let lastVol=0.7;
  $("#muteBtn").addEventListener("click",()=>{
    if(vol>0){lastVol=vol;setVol(0);} else setVol(lastVol||0.7);
  });

  // ---- keyboard ----
  window.addEventListener("keydown",(e)=>{
    if(e.target.tagName==="INPUT") return;
    if(e.code==="Space"){e.preventDefault();togglePlay();}
    else if(e.code==="ArrowRight"&&e.shiftKey){next();}
    else if(e.code==="ArrowLeft"&&e.shiftKey){prev();}
  });

  // ---- playback loop ----
  let last = null;
  function loop(ts){
    if(last==null) last=ts;
    const dt=(ts-last)/1000; last=ts;
    if(playing && !seeking){
      t += dt;
      const d = tracks[cur].dur;
      if(t>=d){
        if(repeat){ t=0; }
        else { next(); }
      }
      updateProgress();
    }
    requestAnimationFrame(loop);
  }

  // ---- init ----
  setVol(0.7);
  loadTrack(0,false);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
