<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>두나리아 유적: 모래정령 도감</title>
<style>
  :root{
    --sand:#d9b06a; --sand2:#c79a52; --deep:#1c1410; --gold:#f4d27a;
    --ink:#26201a; --panel:#2b2118; --panelb:#4a382a; --txt:#f6ead2;
    --hp:#5fd06a; --hpm:#e8c84a; --hpl:#e85a5a; --xp:#5aa9e8;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; background:#0c0907; overflow:hidden;
    font-family:"Courier New",monospace; color:var(--txt);
    image-rendering:pixelated; image-rendering:crisp-edges; user-select:none;}
  #stage{position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center;}
  #frame{position:relative; width:min(100vw,calc(100vh*0.66)); max-width:560px; height:min(100vh,calc(100vw*1.5));
    max-height:860px; background:#160f0a; box-shadow:0 0 0 4px #2b1d12, 0 0 60px #000 inset; overflow:hidden;
    display:flex; flex-direction:column;}
  canvas{display:block; width:100%; image-rendering:pixelated;}
  #gameCanvas{background:#caa15c; flex:0 0 auto;}
  /* ---- text/UI panels ---- */
  .panel{background:var(--panel); border:4px solid var(--panelb); border-radius:6px;
    box-shadow:0 0 0 2px var(--deep), 4px 4px 0 #00000066;}
  #uiArea{flex:1 1 auto; position:relative; padding:6px; display:flex; flex-direction:column; gap:6px; min-height:0;}
  #topbar{display:flex; justify-content:space-between; align-items:center; font-size:12px; padding:4px 8px;}
  #topbar .coins{color:var(--gold);}
  #msgbox{flex:1 1 auto; padding:10px 12px; font-size:14px; line-height:1.5; overflow:hidden; min-height:64px;
    display:flex; align-items:center;}
  #msgbox.tap{cursor:pointer;}
  .blink::after{content:" \25BC"; animation:bk .8s steps(1) infinite; color:var(--gold);}
  @keyframes bk{50%{opacity:0;}}
  /* ---- battle ---- */
  #battle{position:absolute; inset:0; display:none; flex-direction:column; background:#1a120c;}
  #battle.show{display:flex;}
  #battleScene{position:relative; flex:1 1 auto; background:linear-gradient(#e3b86a,#caa15c 55%,#9c7838);}
  .mon{position:absolute; width:120px; height:120px;}
  #foeWrap{top:18px; right:18px;}
  #allyWrap{bottom:14px; left:14px;}
  .nameplate{position:absolute; background:#2b2118ee; border:3px solid var(--panelb); border-radius:5px;
    padding:5px 8px; font-size:11px; min-width:150px;}
  #foePlate{top:14px; left:14px;}
  #allyPlate{bottom:10px; right:14px;}
  .barlab{display:flex; justify-content:space-between; font-size:10px; margin-bottom:2px;}
  .bar{height:8px; background:#0c0907; border:1px solid #000; border-radius:2px; overflow:hidden;}
  .bar>i{display:block; height:100%; transition:width .35s; }
  #battleMenu{flex:0 0 auto; padding:6px; display:flex; gap:6px;}
  #bmsg{flex:1 1 auto; min-height:78px;}
  #bbtns{display:grid; grid-template-columns:1fr 1fr; gap:6px; width:48%;}
  .btn{background:var(--panelb); border:3px solid #6b5238; border-radius:5px; color:var(--txt);
    font-family:inherit; font-size:13px; font-weight:bold; padding:8px 4px; cursor:pointer; text-align:center;
    box-shadow:0 2px 0 #00000066;}
  .btn:active{transform:translateY(1px); box-shadow:none;}
  .btn.sm{font-size:11px; padding:6px 3px;}
  .btn.full{width:100%;}
  /* ---- overlay menus (list) ---- */
  #overlay{position:absolute; inset:0; background:#0c0907ee; display:none; flex-direction:column; padding:10px; z-index:30;}
  #overlay.show{display:flex;}
  #overlay h2{font-size:15px; color:var(--gold); margin-bottom:8px; text-align:center; letter-spacing:1px;}
  #ovList{flex:1 1 auto; overflow-y:auto; display:flex; flex-direction:column; gap:6px;}
  .row{display:flex; align-items:center; gap:8px; padding:6px 8px; cursor:pointer;}
  .row:active{background:#3a2c1f;}
  .rowspr{width:42px; height:42px; flex:0 0 auto; image-rendering:pixelated;}
  .rowinfo{flex:1 1 auto; font-size:12px; line-height:1.4;}
  .rowinfo .nm{color:var(--gold); font-weight:bold;}
  .typetag{display:inline-block; font-size:9px; padding:1px 5px; border-radius:8px; color:#000; font-weight:bold; margin-left:4px;}
  .mini.bar{width:90px;}
  /* ---- dpad ---- */
  #touch{position:absolute; bottom:8px; left:0; right:0; display:none; justify-content:space-between;
    padding:0 14px; z-index:20; pointer-events:none;}
  #touch.show{display:flex;}
  #dpad{position:relative; width:132px; height:132px; pointer-events:auto;}
  .dbtn{position:absolute; width:44px; height:44px; background:#2b2118cc; border:3px solid #6b5238;
    border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--gold);}
  .dbtn:active{background:#6b5238;}
  #dU{top:0; left:44px;} #dD{bottom:0; left:44px;} #dL{top:44px; left:0;} #dR{top:44px; right:0;}
  #actbtns{display:flex; flex-direction:column; gap:8px; pointer-events:auto; align-self:flex-end;}
  .abtn{width:54px; height:54px; border-radius:50%; background:#7a3b2a; border:3px solid #b06a4a;
    color:#fff; font-size:13px; font-weight:bold; display:flex; align-items:center; justify-content:center;}
  .abtn:active{background:#b06a4a;}
  #abtnB{background:#3a4a7a; border-color:#5a6ab0;}
  /* ---- title ---- */
  #title{position:absolute; inset:0; background:radial-gradient(#3a2a18,#160f0a); display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:50; padding:20px; text-align:center;}
  #title h1{font-size:24px; color:var(--gold); text-shadow:3px 3px 0 #5a3a18; letter-spacing:2px; line-height:1.3;}
  #title .sub{font-size:12px; color:#c79a52;}
  #title canvas{width:120px; height:120px; margin:6px 0;}
  .credit{font-size:9px; color:#8a7456; line-height:1.5; max-width:300px; margin-top:6px;}
  #title.hide,#overlay.hide{display:none;}
  .hint{font-size:11px; color:#b59a72; line-height:1.6;}
  .flash{animation:fl 1s steps(1) infinite;}
  @keyframes fl{50%{opacity:.3;}}
  #toast{position:absolute; top:8px; left:50%; transform:translateX(-50%); background:#2b2118ee;
    border:3px solid var(--gold); border-radius:6px; padding:6px 12px; font-size:12px; z-index:60; display:none;}
  #toast.show{display:block; animation:tp .3s;}
  @keyframes tp{from{opacity:0; transform:translate(-50%,-10px);}}
  .shake{animation:sk .4s;}
  @keyframes sk{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
</style>
</head>
<body>
<div id="stage"><div id="frame">

  <canvas id="gameCanvas" width="240" height="216"></canvas>

  <div id="uiArea">
    <div id="topbar" class="panel">
      <span id="locName">두나리아 외곽</span>
      <span class="coins">◈ <span id="coinNum">300</span></span>
    </div>
    <div id="msgbox" class="panel">탐험을 시작하세요. 메뉴(Z/Enter 또는 A버튼)로 파티·아이템 확인.</div>
    <div style="display:flex; gap:6px;">
      <button class="btn sm" style="flex:1" onclick="openMenu('party')">파티</button>
      <button class="btn sm" style="flex:1" onclick="openMenu('box')">보관함</button>
      <button class="btn sm" style="flex:1" onclick="openMenu('bag')">가방</button>
      <button class="btn sm" style="flex:1" onclick="openMenu('dex')">도감</button>
      <button class="btn sm" style="flex:1" onclick="openMenu('help')">조작</button>
    </div>
  </div>

  <!-- BATTLE -->
  <div id="battle">
    <div id="battleScene">
      <div id="foePlate" class="nameplate">
        <div class="barlab"><b id="foeName">??</b> <span id="foeLv">Lv?</span></div>
        <div class="bar"><i id="foeHp" style="width:100%;background:var(--hp)"></i></div>
      </div>
      <canvas id="foeWrap" class="mon" width="60" height="60"></canvas>
      <canvas id="allyWrap" class="mon" width="60" height="60"></canvas>
      <div id="allyPlate" class="nameplate">
        <div class="barlab"><b id="allyName">??</b> <span id="allyLv">Lv?</span></div>
        <div class="bar"><i id="allyHp" style="width:100%;background:var(--hp)"></i></div>
        <div class="barlab" style="margin-top:3px"><span style="font-size:9px">HP <span id="allyHpNum"></span></span><span style="font-size:9px">XP</span></div>
        <div class="bar" style="height:5px"><i id="allyXp" style="width:0%;background:var(--xp)"></i></div>
      </div>
    </div>
    <div id="battleMenu">
      <div id="bmsg" class="panel" style="padding:8px 10px; font-size:13px; display:flex; align-items:center;">야생 크리처가 나타났다!</div>
      <div id="bbtns">
        <button class="btn" id="bAtk" onclick="battleAttack()">공격</button>
        <button class="btn" id="bSkill" onclick="openSkills()">스킬</button>
        <button class="btn" id="bBag" onclick="battleBag()">가방</button>
        <button class="btn" id="bRun" onclick="battleRun()">도망/교체</button>
      </div>
    </div>
  </div>

  <!-- OVERLAY LIST MENUS -->
  <div id="overlay">
    <h2 id="ovTitle">메뉴</h2>
    <div id="ovList"></div>
    <button class="btn full" style="margin-top:8px" onclick="closeOverlay()">닫기 (X/Esc)</button>
  </div>

  <!-- TOUCH CONTROLS -->
  <div id="touch">
    <div id="dpad">
      <div class="dbtn" id="dU">▲</div><div class="dbtn" id="dD">▼</div>
      <div class="dbtn" id="dL">◀</div><div class="dbtn" id="dR">▶</div>
    </div>
    <div id="actbtns">
      <div class="abtn" id="abtnA">A</div>
      <div class="abtn" id="abtnB">B</div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- TITLE -->
  <div id="title">
    <h1>두나리아 유적<br><span style="font-size:16px">모래정령 도감</span></h1>
    <canvas id="titleSpr" width="60" height="60"></canvas>
    <div class="sub">사막 고대유적의 정령을 잡고 키워라</div>
    <div class="hint" id="startHint">아무 키나 누르거나 화면을 탭하여 시작</div>
    <div class="credit">
      포켓몬에서 영감 — © Nintendo / Game Freak / The Pokémon Company.<br>
      본 작품은 장르·메커니즘만 차용한 <b>오리지널 구현</b>입니다.<br>
      크리처·이름·타입·지역·진화는 모두 독자 창작물입니다.
    </div>
  </div>

</div></div>

function drawSprite(ctx, sprKey, x, y, scale){
  const grid = SPR[sprKey]||SPR.duneki, pal=PAL[sprKey]||PAL.duneki;
  ctx.imageSmoothingEnabled=false;
  for(let r=0;r<grid.length;r++){
    const row=grid[r];
    for(let c=0;c<row.length;c++){
      const ch=row[c];
      if(ch==='.'||ch===' ') continue;
      ctx.fillStyle = pal[ch]||pal.a;
      ctx.fillRect(x+c*scale, y+r*scale, scale, scale);
    }
  }
}
function spriteDataURL(sprKey, scale){
  const cv=document.createElement('canvas'); cv.width=10*scale; cv.height=10*scale;
  drawSprite(cv.getContext('2d'), sprKey, 0,0, scale);
  return cv.toDataURL();
}

// ---------- CREATURE INSTANCE ----------
let UID=1;
function statAt(base, lv, isHp){
  if(isHp) return Math.floor(base*2*lv/100)+lv+10;
  return Math.floor(base*2*lv/100)+5;
}
function xpForLevel(lv){ return Math.floor(0.8*lv*lv*lv); } // cumulative-ish curve
function makeMon(specKey, lv){
  const s=DEX[specKey];
  const maxhp=statAt(s.base.hp,lv,true);
  // gather moves up to lv (keep last 4)
  let pool=LEARN[specKey].filter(m=>m[0]<=lv).map(m=>m[1]);
  pool=[...new Set(pool)]; if(pool.length>4) pool=pool.slice(pool.length-4);
  if(pool.length===0) pool=['tackle'];
  return {
    uid:UID++, spec:specKey, name:s.name, type:s.type, lv:lv,
    hp:maxhp, maxhp:maxhp,
    atk:statAt(s.base.atk,lv), def:statAt(s.base.def,lv), spd:statAt(s.base.spd,lv),
    moves:pool, xp:xpForLevel(lv), xpNext:xpForLevel(lv+1)
  };
}
function recalcStats(m, healFull){
  const s=DEX[m.spec];
  const newMax=statAt(s.base.hp,m.lv,true);
  const diff=newMax-m.maxhp;
  m.maxhp=newMax; m.atk=statAt(s.base.atk,m.lv); m.def=statAt(s.base.def,m.lv); m.spd=statAt(s.base.spd,m.lv);
  if(healFull) m.hp=m.maxhp; else m.hp=Math.min(m.maxhp, m.hp+Math.max(0,diff));
}

const cv=document.getElementById('gameCanvas'), ctx=cv.getContext('2d');
const TILE=24; // logical tile px on a 240-wide canvas -> 10 tiles visible
const VIEWW=10, VIEWH=9;
function camOffset(){
  let cx=G.px-Math.floor(VIEWW/2), cy=G.py-Math.floor(VIEWH/2);
  cx=Math.max(0,Math.min(MAPW-VIEWW,cx)); cy=Math.max(0,Math.min(MAPH-VIEWH,cy));
  return {cx,cy};
}
function tileColor(t){
  switch(t){
    case 0: return '#caa15c'; case 1: return '#6b4a2a'; case 2: return '#b89a4a';
    case 3: return '#3a8aa0'; case 4: return '#bda878'; case 5: return '#d0a0e0';
    case 6: return '#d0a050'; case 7: return '#8a6a40'; case 8: return '#8a7a4a';
    case 9: return '#caa15c'; default: return '#caa15c';
  }
}
function drawTileDetail(t, sx, sy){
  if(t===2){ // glyph grass: small marks
    ctx.fillStyle='#8a6a30';
    ctx.fillRect(sx+4,sy+12,3,8); ctx.fillRect(sx+10,sy+8,3,12); ctx.fillRect(sx+16,sy+13,3,7);
  } else if(t===1){ // pillar
    ctx.fillStyle='#4a3018'; ctx.fillRect(sx+3,sy+2,18,20);
    ctx.fillStyle='#7a5a36'; ctx.fillRect(sx+5,sy+4,14,4); ctx.fillRect(sx+5,sy+11,14,4); ctx.fillRect(sx+5,sy+18,14,3);
  } else if(t===3){ // water shimmer
    ctx.fillStyle='#56a8c0'; ctx.fillRect(sx+2,sy+6,8,3); ctx.fillRect(sx+13,sy+14,8,3);
  } else if(t===5){ // shrine
    ctx.fillStyle='#7a4a9a'; ctx.fillRect(sx+6,sy+4,12,16);
    ctx.fillStyle='#f0d0ff'; ctx.fillRect(sx+9,sy+2,6,4); ctx.fillRect(sx+10,sy+9,4,8);
  } else if(t===6){ // shop
    ctx.fillStyle='#8a5a20'; ctx.fillRect(sx+3,sy+5,18,15);
    ctx.fillStyle='#f0c040'; ctx.fillRect(sx+5,sy+2,14,4);
    ctx.fillStyle='#2b1a0a'; ctx.fillRect(sx+9,sy+12,6,8);
  } else if(t===7){ // sign
    ctx.fillStyle='#5a3a1a'; ctx.fillRect(sx+11,sy+8,2,12);
    ctx.fillStyle='#c0a060'; ctx.fillRect(sx+6,sy+3,12,8);
  } else if(t===8){ // deep ruins encounter
    ctx.fillStyle='#5a4a28'; ctx.fillRect(sx+3,sy+3,18,18);
    ctx.fillStyle='#8a7a48'; ctx.fillRect(sx+6,sy+6,12,12);
    ctx.fillStyle='#3a2a10'; ctx.fillRect(sx+10,sy+10,4,4);
  } else if(t===4){ // path
    ctx.fillStyle='#a89060'; ctx.fillRect(sx+2,sy+2,2,2); ctx.fillRect(sx+18,sy+16,2,2);
  }
}
const TRAINER_POS={x:9,y:10};
function drawPlayer(sx,sy){
  // simple explorer in desert garb
  ctx.fillStyle='#3a2a6a'; ctx.fillRect(sx+7,sy+10,10,10); // body
  ctx.fillStyle='#e0b878'; ctx.fillRect(sx+8,sy+4,8,7);   // head
  ctx.fillStyle='#c89858'; // hat brim
  ctx.fillRect(sx+6,sy+3,12,3); ctx.fillRect(sx+9,sy+0,6,4);
  ctx.fillStyle='#2b1a0a'; // eyes depend on dir
  if(G.dir==='down'){ctx.fillRect(sx+9,sy+7,2,2); ctx.fillRect(sx+13,sy+7,2,2);}
  else if(G.dir==='up'){/* back of head */}
  else if(G.dir==='left'){ctx.fillRect(sx+8,sy+7,2,2);}
  else {ctx.fillRect(sx+14,sy+7,2,2);}
  ctx.fillStyle='#5a4a8a'; ctx.fillRect(sx+8,sy+20,3,3); ctx.fillRect(sx+13,sy+20,3,3); // feet
}
function render(){
  const {cx,cy}=camOffset();
  ctx.clearRect(0,0,cv.width,cv.height);
  for(let ry=0;ry<VIEWH;ry++) for(let rx=0;rx<VIEWW;rx++){
    const mx=cx+rx, my=cy+ry; if(mx<0||my<0||mx>=MAPW||my>=MAPH) continue;
    const t=MAP[my][mx], sx=rx*TILE, sy=ry*TILE;
    ctx.fillStyle=tileColor(t); ctx.fillRect(sx,sy,TILE,TILE);
    // subtle sand texture
    ctx.fillStyle='rgba(0,0,0,0.04)'; ctx.fillRect(sx,sy+TILE-3,TILE,3);
    drawTileDetail(t,sx,sy);
    if(my===TRAINER_POS.y && mx===TRAINER_POS.x && !G.trainerBeaten['ruinkeeper']){
      // trainer NPC
      ctx.fillStyle='#7a2a2a'; ctx.fillRect(sx+7,sy+10,10,10);
      ctx.fillStyle='#e0b878'; ctx.fillRect(sx+8,sy+4,8,7);
      ctx.fillStyle='#d0c040'; ctx.fillRect(sx+6,sy+2,12,4);
      ctx.fillStyle='#2b1a0a'; ctx.fillRect(sx+9,sy+7,2,2); ctx.fillRect(sx+13,sy+7,2,2);
    }
  }
  // player
  drawPlayer((G.px-cx)*TILE,(G.py-cy)*TILE);
}

// ---------- MOVEMENT ----------
function tileAt(x,y){ if(x<0||y<0||x>=MAPW||y>=MAPH) return 1; return MAP[y][x]; }
function blocked(t){ return t===1||t===3||t===5||t===6||t===7; }
function tryMove(dx,dy,ndir){
  if(G.mode!=='world'||G.inBattle) return;
  G.dir=ndir;
  const nx=G.px+dx, ny=G.py+dy, t=tileAt(nx,ny);
  // trainer block
  if(nx===TRAINER_POS.x && ny===TRAINER_POS.y && !G.trainerBeaten['ruinkeeper']){ render(); return; }
  if(blocked(t)){ render(); return; }
  G.px=nx; G.py=ny; G.steps++;
  render();
  updateLoc();
  // encounter check
  if(t===2 && Math.random()<0.18) startWild('grass');
  else if(t===8 && Math.random()<0.30) startWild('deep');
}
function updateLoc(){
  const t=tileAt(G.px,G.py);
  let name='두나리아 외곽';
  // pick zone by region
  if(G.py>=12 && G.px<=6) name='오아시스 가장자리';
  else if(G.py>=1 && G.py<=4 && G.px>=11) name='유적 신전 입구';
  else if(t===8 || (G.px>=11&&G.py<=4)) name='고대 신전 깊은 곳';
  else if(t===2) name='유적 모래밭';
  document.getElementById('locName').textContent=name;
}

function activeAlly(){ return G.party.find(m=>m.hp>0)||G.party[0]; }

function startWild(zone){
  // pick species by zone

  if(zone==='deep') pool=[['monolux',1],['phantomos',1],['solflare',1],['aquaba',1],['scarabex',0.4],['tytan',0.6]];
  else pool=[['duneki',2],['emberit',2],['glyphid',2],['oasipin',2],['mirajin',2],['sandil',0.6]];

// damage calc
function calcDamage(atkMon, defMon, move){
  let mult=1, stab = (move.type && move.type===atkMon.type)?1.2:1;
  if(move.type){ mult=EFF[move.type][defMon.type]; }
  const base=( (2*atkMon.lv/5+2) * move.pow * (atkMon.atk/Math.max(1,defMon.def)) )/12 + 2;
  const rnd=0.85+Math.random()*0.15;
  const dmg=Math.max(1, Math.floor(base*mult*stab*rnd));
  return {dmg, mult};
}
function delay(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function doAllyMove(moveKey){
  if(B.busy) return; B.busy=true; showBattleButtons(false); closeSkills();
  const move=MOVES[moveKey];
  const acc=move.acc;
  if(Math.random()*100>acc){ setBMsg(B.ally.name+'의 '+move.name+'! …빗나갔다!'); await delay(900); await foeTurn(); return; }
  const {dmg,mult}=calcDamage(B.ally,B.foe,move);
  B.foe.hp-=dmg; setBMsg(B.ally.name+'의 '+move.name+'!'); foeCv.classList.add('shake');
  await delay(450); foeCv.classList.remove('shake'); setBars();
  const lab=effLabel(mult); if(lab) setBMsg(lab); await delay(lab?700:300);
  if(B.foe.hp<=0){ await foeFaint(); return; }
  await foeTurn();
}
async function foeTurn(){
  if(B.foe.hp<=0){ await foeFaint(); return; }
  if(B.ally.hp<=0){ await allyFaint(); return; }
  const mk=B.foe.moves[Math.floor(Math.random()*B.foe.moves.length)];
  const move=MOVES[mk];
  if(Math.random()*100>move.acc){ setBMsg('상대 '+B.foe.name+'의 '+move.name+'! …빗나갔다!'); await delay(900); endTurn(); return; }
  const {dmg,mult}=calcDamage(B.foe,B.ally,move);
  B.ally.hp-=dmg; setBMsg('상대 '+B.foe.name+'의 '+move.name+'!'); allyCv.classList.add('shake');
  await delay(450); allyCv.classList.remove('shake'); setBars();
  const lab=effLabel(mult); if(lab) setBMsg(lab); await delay(lab?700:300);
  if(B.ally.hp<=0){ await allyFaint(); return; }
  endTurn();
}
function endTurn(){ B.busy=false; showBattleButtons(true); setBMsg('무엇을 할까?'); }

async function foeFaint(){
  setBMsg('상대 '+B.foe.name+'(을)를 쓰러뜨렸다!'); foeCv.style.opacity='0.2'; await delay(900);
  // xp
  const yield_=DEX[B.foe.spec].xpYield, gain=Math.floor(yield_*B.foe.lv/6)+4;
  await gainXP(B.ally, gain);
  foeCv.style.opacity='1';
  if(B.isTrainer){
    B.trainerIdx++;
    if(B.trainerIdx<B.trainerTeam.length){
      B.foe=B.trainerTeam[B.trainerIdx]; G.dex[B.foe.spec]=Math.max(G.dex[B.foe.spec]||0,1);
      drawBattleMons(); refreshBattleUI();
      setBMsg('카림이 '+B.foe.name+'(을)를 내보냈다!'); await delay(1000); endTurn(); return;
    } else {
      G.trainerBeaten['ruinkeeper']=true; G.coins+=250; refreshTop();
      setBMsg('유적 수호자 카림을 이겼다! 상금 ◈250 획득. "모래의 정령이 너를 인정했다."');
      await delay(300); B.busy=true; showBattleButtons(false);
      setTimeout(endBattle,1800); return;
    }
  } else {
    setBMsg(B.foe.name+'(을)를 쓰러뜨렸다!'); B.busy=true; showBattleButtons(false);
    setTimeout(endBattle,1400);
  }
}
async function allyFaint(){
  setBMsg(B.ally.name+'(이)가 쓰러졌다…'); allyCv.style.opacity='0.2'; await delay(1100);
  allyCv.style.opacity='1';
  const next=G.party.find(m=>m.hp>0);
  if(next){
    B.ally=next; drawBattleMons(); refreshBattleUI();
    setBMsg('가라, '+B.ally.name+'!'); await delay(1000); endTurn();
  } else {
    setBMsg('파티가 전멸했다… 유적의 샘으로 돌아간다.'); B.busy=true; showBattleButtons(false);
    setTimeout(()=>{ healParty(); G.px=6;G.py=6; endBattle(); say('정신을 차리니 유적 어귀였다. 파티는 회복되었다.'); },1900);
  }
}
async function gainXP(mon, amount){
  mon.xp+=amount; setBMsg(mon.name+'(은)는 경험치 '+amount+'을 얻었다!'); setBars(); await delay(900);
  while(mon.xp>=xpForLevel(mon.lv+1) && mon.lv<60){
    mon.lv++; recalcStats(mon,false);
    setBMsg(mon.name+'(은)는 Lv'+mon.lv+'(으)로 성장했다!'); refreshBattleUI();
    if(mon===B.ally){ document.getElementById('allyLv').textContent='Lv'+mon.lv; }
    await delay(1000);
    // learn new move?
    const newMoves=LEARN[mon.spec].filter(m=>m[0]===mon.lv).map(m=>m[1]);
    for(const nm of newMoves){ if(!mon.moves.includes(nm)){ if(mon.moves.length<4){mon.moves.push(nm);} else {mon.moves.shift(); mon.moves.push(nm);} setBMsg(mon.name+'(은)는 '+MOVES[nm].name+'(을)를 배웠다!'); await delay(1000);} }
    // evolution
    const ev=DEX[mon.spec].evolve;
    if(ev && mon.lv>=ev.lv){
      const oldName=mon.name;
      setBMsg('어라…? '+oldName+'의 모습이…'); await delay(1100);
      mon.spec=ev.to; mon.name=DEX[ev.to].name; mon.type=DEX[ev.to].type;
      recalcStats(mon,false);
      G.dex[ev.to]=2;
      if(mon===B.ally) drawBattleMons();
      refreshBattleUI();
      setBMsg('축하합니다! '+oldName+'(은)는 '+mon.name+'(으)로 진화했다!'); await delay(1400);
    }
  }
  setBars();
}

  wrap.dataset.mode='';

function battleBag(){
  if(B.busy)return;
  const wrap=document.getElementById('bbtns'); wrap.dataset.mode='bag'; wrap.innerHTML='';
  const opts=[
    {k:'potion',nm:'회복약',act:()=>useHeal(20,'potion')},
    {k:'superpotion',nm:'고급회복약',act:()=>useHeal(60,'superpotion')},
    {k:'ball',nm:'유적봉인구',act:()=>throwBall(1.0)},

async function useHeal(amt,key){
  if(B.busy)return;
  if(B.ally.hp>=B.ally.maxhp){ toast('이미 가득 찼다'); return; }
  G.bag[key]--; B.busy=true; restoreBattleBtns(); showBattleButtons(false);
  B.ally.hp=Math.min(B.ally.maxhp,B.ally.hp+amt); setBars();
  setBMsg(B.ally.name+'의 HP를 '+amt+' 회복했다!'); await delay(1000);
  await foeTurn();
}
async function throwBall(power){
  if(B.busy)return;
  if(B.isTrainer){ toast('수호자의 정령은 포획할 수 없다!'); return; }
  const key = power>1.5?'goldball':'ball';
  G.bag[key]--; B.busy=true; restoreBattleBtns(); showBattleButtons(false);
  setBMsg('봉인구를 던졌다!'); foeCv.classList.add('shake'); await delay(700); foeCv.classList.remove('shake');
  // catch chance
  const s=DEX[B.foe.spec]; const hpFactor=(3*B.foe.maxhp-2*Math.max(0,B.foe.hp))/(3*B.foe.maxhp);
  const a = (s.catchRate * power * hpFactor)/255;
  const p=Math.min(0.95,Math.max(0.05,a));
  let shakes=0; for(let i=0;i<3;i++){ if(Math.random()<Math.min(0.98,p+0.25)) {shakes++; setBMsg('흔들… ('+shakes+')'); await delay(550);} else break; }
  if(Math.random()<p){
    setBMsg(B.foe.name+'(을)를 잡았다! 도감에 등록.'); foeCv.style.opacity='0'; await delay(1100);
    G.dex[B.foe.spec]=2;
    const caught=makeMon(B.foe.spec,B.foe.lv); caught.hp=Math.max(1,B.foe.hp); caught.xp=B.foe.xp;
    if(G.party.length<6){ G.party.push(caught); setBMsg(B.foe.name+'(이)가 파티에 합류했다!'); }
    else { G.box.push(caught); setBMsg('파티가 가득 차 '+B.foe.name+'(은)는 보관함으로 보내졌다.'); }
    await delay(1300); foeCv.style.opacity='1'; B.busy=true; showBattleButtons(false); setTimeout(endBattle,400);
  } else {
    setBMsg('아쉽다! '+B.foe.name+'(이)가 봉인구를 빠져나왔다!'); foeCv.style.opacity='1'; await delay(1000);
    await foeTurn();
  }
}
function battleRun(){
  if(B.busy)return;
  if(B.isTrainer){ toast('수호자전에서는 도망칠 수 없다! 교체만 가능.'); openSwitch(); return; }
  // offer switch or run
  const wrap=document.getElementById('bbtns'); wrap.dataset.mode='switch'; wrap.innerHTML='';
  const alive=G.party.filter(m=>m.hp>0 && m!==B.ally);
  const runB=document.createElement('button'); runB.className='btn sm'; runB.textContent='도망친다';
  runB.onclick=async()=>{ if(B.busy)return; if(Math.random()<0.85){ B.busy=true; setBMsg('무사히 도망쳤다!'); showBattleButtons(false); setTimeout(endBattle,1000);} else { B.busy=true; restoreBattleBtns(); showBattleButtons(false); setBMsg('도망치지 못했다!'); await delay(900); await foeTurn(); } };
  wrap.appendChild(runB);
  const swB=document.createElement('button'); swB.className='btn sm'; swB.textContent='정령 교체'; swB.onclick=openSwitch;
  wrap.appendChild(swB);
  const back=document.createElement('button'); back.className='btn sm'; back.textContent='뒤로'; back.onclick=restoreBattleBtns;
  wrap.appendChild(back);
}
function openSwitch(){
  const wrap=document.getElementById('bbtns'); wrap.dataset.mode='switch'; wrap.innerHTML='';
  let any=false;
  G.party.forEach(m=>{
    if(m===B.ally) return;
    const b=document.createElement('button'); b.className='btn sm'; b.disabled=m.hp<=0;
    b.style.opacity=m.hp<=0?'0.4':'1';
    b.innerHTML=`${m.name}<br><span style="font-size:9px">Lv${m.lv} ${Math.max(0,m.hp)}/${m.maxhp}</span>`;
    if(m.hp>0){ any=true; b.onclick=()=>switchTo(m); }
    wrap.appendChild(b);
  });
  if(!any){ toast('교체할 정령이 없다'); restoreBattleBtns(); return; }
  const back=document.createElement('button'); back.className='btn sm'; back.textContent='뒤로'; back.onclick=restoreBattleBtns;
  wrap.appendChild(back);
}
async function switchTo(m){
  if(B.busy)return; B.busy=true; restoreBattleBtns(); showBattleButtons(false);
  B.ally=m; drawBattleMons(); refreshBattleUI();
  setBMsg('가라, '+m.name+'!'); await delay(1000); await foeTurn();
}
function endBattle(){
  battleEl.classList.remove('show'); G.inBattle=false; G.mode='world';
  document.getElementById('touch').classList.toggle('show', isTouch);
  restoreBattleBtns(); showBattleButtons(true); foeCv.style.opacity='1'; allyCv.style.opacity='1';
  render(); refreshTop();
  // reorder party so a living mon leads
  if(G.party.length && G.party[0].hp<=0){ const i=G.party.findIndex(m=>m.hp>0); if(i>0){ const a=G.party.splice(i,1)[0]; G.party.unshift(a);} }
}

let isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0 || window.innerWidth<=480;

document.addEventListener('keydown',(e)=>{
  if(G.mode==='title'){ startGame(); e.preventDefault(); return; }
  const k=e.key.toLowerCase();
  if(G.mode==='overlay'){
    if(k==='escape'||k==='x') closeOverlay();
    return;
  }
  if(G.mode==='battle'){
    return; // battle is button-driven
  }
  // world
  if(k==='arrowup'||k==='w'){ tryMove(0,-1,'up'); e.preventDefault(); }
  else if(k==='arrowdown'||k==='s'){ tryMove(0,1,'down'); e.preventDefault(); }
  else if(k==='arrowleft'||k==='a'){ tryMove(-1,0,'left'); e.preventDefault(); }
  else if(k==='arrowright'||k==='d'){ tryMove(1,0,'right'); e.preventDefault(); }
  else if(k==='z'||k==='enter'||k===' '){ interact(); e.preventDefault(); }
  else if(k==='x'||k==='escape'){ /* close (no-op in world) */ }
});

// touch dpad
function bindHold(id, fn){
  const el=document.getElementById(id);
  let iv=null;
  const start=(e)=>{ e.preventDefault(); fn(); iv=setInterval(fn,170); };
  const stop=(e)=>{ if(e)e.preventDefault(); clearInterval(iv); iv=null; };
  el.addEventListener('touchstart',start,{passive:false});
  el.addEventListener('touchend',stop,{passive:false});
  el.addEventListener('touchcancel',stop,{passive:false});
  el.addEventListener('mousedown',start);
  el.addEventListener('mouseup',stop);
  el.addEventListener('mouseleave',stop);
}
bindHold('dU',()=>tryMove(0,-1,'up'));
bindHold('dD',()=>tryMove(0,1,'down'));
bindHold('dL',()=>tryMove(-1,0,'left'));
bindHold('dR',()=>tryMove(1,0,'right'));
function tapBtn(id,fn){ const el=document.getElementById(id);
  el.addEventListener('touchstart',(e)=>{e.preventDefault(); fn();},{passive:false});
  el.addEventListener('click',(e)=>{e.preventDefault(); fn();});
}

  // responsive canvas height: keep tile aspect
  fitCanvas();
  window.addEventListener('resize',()=>{ isTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0||window.innerWidth<=480; fitCanvas(); if(G.mode==='world')render(); refreshTouchVisibility(); });
}
function fitCanvas(){
  // canvas internal res fixed (240x216). CSS handles scaling via width:100%.
  // ensure height auto matches aspect
  cv.style.height = (cv.clientWidth*216/240)+'px';
}
boot();
window.__GAME=G; window.__DEX=DEX; // expose for verification
</script>
