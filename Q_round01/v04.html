<style>
  :root{
    --bg:#1a0f12; --panel:#241317; --ink:#ffeede; --hot:#ff7a3c; --emb:#ffb547;
    --shadow:#0c0608; --line:#46232a; --good:#7dd87d; --bad:#ff6b6b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#000;color:var(--ink);
    font-family:'Courier New',monospace;overflow:hidden;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%,#2a161a,#0a0506 80%);}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;
    background:#0a0506;touch-action:none;display:block;
    box-shadow:0 0 0 3px var(--line),0 0 40px #000;}
  /* HUD overlay (DOM) */
  #ui{position:fixed;inset:0;pointer-events:none;font-size:13px;}
  .pad{pointer-events:auto;}
  #credit{position:fixed;left:6px;bottom:4px;font-size:9px;color:#9b6f5e;
    max-width:60vw;line-height:1.25;pointer-events:none;text-shadow:1px 1px 0 #000;}
  /* touch controls */
  #touch{position:fixed;inset:0;display:none;pointer-events:none;}
  .tbtn{position:absolute;pointer-events:auto;background:rgba(60,30,34,.82);
    border:2px solid var(--line);color:var(--ink);border-radius:12px;
    font-family:inherit;font-weight:bold;font-size:18px;
    display:flex;align-items:center;justify-content:center;user-select:none;
    box-shadow:0 3px 0 #000;}
  .tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #000;background:var(--hot);}
  #dpad{position:fixed;left:14px;bottom:18px;width:150px;height:150px;pointer-events:none;}
  #dpad .tbtn{width:48px;height:48px;}
  #d-up{left:51px;top:0;} #d-dn{left:51px;top:102px;}
  #d-lf{left:0;top:51px;} #d-rt{left:102px;top:51px;}
  #abtns{position:fixed;right:14px;bottom:24px;width:150px;height:140px;pointer-events:none;}
  #abtns .tbtn{width:60px;height:60px;border-radius:50%;font-size:15px;}
  #b-a{right:0;bottom:0;background:rgba(255,122,60,.85);}
  #b-b{right:74px;bottom:42px;}
  #b-m{right:0;bottom:78px;width:46px;height:46px;font-size:11px;}
  .hint{position:fixed;top:6px;right:8px;font-size:10px;color:#9b6f5e;
    text-align:right;line-height:1.35;text-shadow:1px 1px 0 #000;}
</style>

   포켓몬 장르에서 영감받은 100% 오리지널 픽셀 몬스터 JRPG.
   실제 포켓몬 종/이름/스프라이트/타입표/코드 복제 없음.
   화산지대(엠버폴) 테마. 단일 자기완결 HTML. 백엔드 없음.
   ============================================================ */
const CV = document.getElementById('cv');
const X = CV.getContext('2d');
X.imageSmoothingEnabled = false;
const W = 320, H = 288;

/* ---------- responsive scaling ---------- */
function fit(){
  const sw = window.innerWidth, sh = window.innerHeight;
  const scale = Math.max(1, Math.floor(Math.min(sw/W, sh/H)));
  CV.style.width = (W*scale)+'px';
  CV.style.height = (H*scale)+'px';
  const touchUI = (window.matchMedia && window.matchMedia('(pointer:coarse)').matches)
    || ('ontouchstart' in window) || sw < 760;
  document.getElementById('touch').style.display = touchUI ? 'block' : 'none';
  document.getElementById('kbhint').style.display = touchUI ? 'none' : 'block';
}
window.addEventListener('resize', fit);

// EFF[atk][def] = multiplier
const EFF = {
  EMBER:{EMBER:.5,TIDE:.5,BLOOM:2 ,CRAG:.5,VOLT:1 ,WISP:1 },
  TIDE :{EMBER:2 ,TIDE:.5,BLOOM:.5,CRAG:2 ,VOLT:.5,WISP:1 },
  BLOOM:{EMBER:.5,TIDE:2 ,BLOOM:.5,CRAG:2 ,VOLT:1 ,WISP:1 },
  CRAG :{EMBER:2 ,TIDE:.5,BLOOM:.5,CRAG:1 ,VOLT:2 ,WISP:1 },
  VOLT :{EMBER:1 ,TIDE:2 ,BLOOM:1 ,CRAG:.5,VOLT:.5,WISP:1 },
  WISP :{EMBER:1 ,TIDE:1 ,BLOOM:1 ,CRAG:1 ,VOLT:1 ,WISP:2 },
};
function effMult(atkType, defType){ return (EFF[atkType] && EFF[atkType][defType]!=null)?EFF[atkType][defType]:1; }

/* ============================================================
   SPRITE RENDERING (cached canvases for performance)
   ============================================================ */
const spriteCache = {};
function buildSprite(id){
  if(spriteCache[id]) return spriteCache[id];
  const s = DEX[id];
  const c = document.createElement('canvas'); c.width=16; c.height=16;
  const g = c.getContext('2d');
  for(let r=0;r<16;r++){
    const row = s.art[r]||'';
    for(let col=0;col<16;col++){
      const ch=row[col]||'.';
      if(ch==='.'||ch===' ')continue;
      const color=s.cm[ch]; if(!color)continue;
      g.fillStyle=color; g.fillRect(col,r,1,1);
    }
  }
  spriteCache[id]=c; return c;
}
function drawSprite(id, dx, dy, size, flip){
  const c = buildSprite(id);
  if(flip){
    X.save(); X.translate(dx+size,dy); X.scale(-1,1);
    X.drawImage(c,0,0,16,16,0,0,size,size); X.restore();
  } else {
    X.drawImage(c,0,0,16,16,dx,dy,size,size);
  }
}

/* ============================================================
   CREATURE INSTANCES (party members / wild)
   ============================================================ */
function statAt(base, lv, isHp){
  if(isHp) return Math.floor((2*base*lv)/100) + lv + 10;
  return Math.floor((2*base*lv)/100) + 5;
}
function learnsetAt(id, lv){
  const s=DEX[id]; const set=[];
  for(const e of s.moves){ if(e.lv<=lv && set.indexOf(e.m)<0) set.push(e.m); }
  return set.slice(-4); // last up-to-4
}
function makeCreature(id, lv){
  const s=DEX[id];
  const maxhp=statAt(s.base.hp,lv,true);
  return {
    id, name:s.name, type:s.type, lv,
    exp:0, expNext: lv*lv*5 + 20,
    maxhp, hp:maxhp,
    atk:statAt(s.base.atk,lv), def:statAt(s.base.def,lv), spd:statAt(s.base.spd,lv),
    moves:learnsetAt(id,lv), defBuff:0
  };
}
function recompute(cr){ // after level up / evolution
  const s=DEX[cr.id];
  const ratio = cr.hp/cr.maxhp;
  cr.maxhp=statAt(s.base.hp,cr.lv,true);
  cr.atk=statAt(s.base.atk,cr.lv); cr.def=statAt(s.base.def,cr.lv); cr.spd=statAt(s.base.spd,cr.lv);
  cr.hp=Math.max(1,Math.round(cr.maxhp*ratio));
  cr.name=s.name; cr.type=s.type;
  const learn=learnsetAt(cr.id,cr.lv);
  cr.moves=learn;
}

}

/* damage formula */
function calcDamage(attacker, mv, defender){
  // mv is the resolved move object (already looked up by caller)
  if(mv.kind==='buff'){ return {dmg:0, eff:1, buff:true}; }
  const eff=effMult(mv.type, defender.type);
  const stab = (mv.type===attacker.type)?1.4:1.0;
  const aStat=attacker.atk, dStat=defender.def*(1+0.5*(defender.defBuff||0));
  const rand=0.85+Math.random()*0.15;
  let dmg=Math.floor((((2*attacker.lv/5+2)*mv.pow*(aStat/Math.max(1,dStat)))/12 +2)*stab*eff*rand);
  dmg=Math.max(1,dmg);
  return {dmg, eff, buff:false};
}
function effWord(e){ return e>1.5?'효과가 굉장하다!': (e<0.9 && e>0)?'효과가 별로인 듯하다…': e===0?'효과가 없다…':''; }

function chain(fns){
  // execute fns sequentially through bmsg callbacks
  let i=0;
  function next(){
    if(i>=fns.length){ endTurn(); return; }
    const f=fns[i++];
    f(next);
  }
  next();
}
function doAttack(att, defn, moveKey, fromPlayer, done){
  const mv=MOVES[moveKey];
  const hit = Math.random() <= mv.acc;
  const who = fromPlayer ? att.name : `야생 ${att.name}`;
  if(mv.kind==='buff'){
    att.defBuff=(att.defBuff||0)+1;
    bmsg([`${who}의 ${mv.name}!`,`${att.name}의 방어가 올랐다!`], done);
    return;
  }
  if(!hit){ bmsg([`${who}의 ${mv.name}!`,'하지만 빗나갔다!'], done); return; }
  const r=calcDamage(att,mv,defn);
  defn.hp=Math.max(0, defn.hp-r.dmg);
  const ew=effWord(r.eff);
  const lines=[`${who}의 ${mv.name}!`];
  if(ew) lines.push(ew);
  bmsg(lines, ()=>{
    if(defn.hp<=0){
      if(defn===B.foe){ onFoeFaint(done); }
      else { onYouFaint(done); }
    } else { if(done) done(); }
  });
}
function foeAct(done){
  const mvs=B.foe.moves;
  const mk=mvs[Math.floor(Math.random()*mvs.length)];
  doAttack(B.foe,B.you,mk,false,done);
}
function endTurn(){
  if(!B.active) return;
  if(B.foe.hp<=0 || B.you.hp<=0) return;
  B.menu='main'; B.cursor=0; B.busy=false;
}

function onFoeFaint(done){
  const gained=Math.floor(B.foe.lv*B.foe.lv*0.6)+8;
  bmsg([`야생 ${B.foe.name}(을)를 쓰러뜨렸다!`, `${B.you.name}(은)는 ${gained} 경험치를 얻었다!`], ()=>{
    gainExp(B.you, gained, ()=>{
      if(B.isTrainer){ G.money+=300; bmsg(['트레이너 대결에서 승리! 300코인 획득!'],()=>{ G.trainerDone=true; endBattle(); }); }
      else endBattle();
    });
  });
}
function onYouFaint(done){
  bmsg([`${B.you.name}(은)는 쓰러졌다…`], ()=>{
    const next=G.party.find(c=>c.hp>0);
    if(next){
      B.you=next;
      bmsg([`가라, ${B.you.name}!`], ()=>{ B.menu='main'; B.busy=false; });
    } else {
      bmsg(['눈앞이 캄캄해졌다…','엠버폴 회복소로 돌아왔다.'], ()=>{
        G.party.forEach(c=>{c.hp=c.maxhp;});
        G.px=1; G.py=1; endBattle();
      });
    }
  });
}
function gainExp(cr, amt, cb){
  cr.exp+=amt;
  function step(){
    if(cr.exp>=cr.expNext && cr.lv<60){
      cr.exp-=cr.expNext; cr.lv++; cr.expNext=cr.lv*cr.lv*5+20;
      const before=cr.moves.slice();
      recompute(cr);
      const news=cr.moves.filter(m=>before.indexOf(m)<0);
      const lines=[`${cr.name}(은)는 레벨 ${cr.lv}(이)가 되었다!`];
      news.forEach(m=> lines.push(`${cr.name}(은)는 ${MOVES[m].name}(을)를 배웠다!`));
      // evolution check
      const sp=DEX[cr.id];
      if(sp.evo && cr.lv>=sp.evo.lv){
        const newName=DEX[sp.evo.to].name;
        bmsg(lines,()=>{
          bmsg([`어라…? ${cr.name}의 모습이…!`,`${cr.name}(은)는 ${newName}(으)로 진화했다!`],()=>{
            cr.id=sp.evo.to; recompute(cr); G.caught[cr.id]='caught';
            step();
          });
        });
        return;
      }
      bmsg(lines, step);
      return;
    }
    if(cb) cb();
  }
  step();
}

/* ----- catching ----- */
function tryCatch(){
  if(B.isTrainer){ bmsg(['남의 크리처는 잡을 수 없다!']); return; }
  if(G.bag.spark_ball<=0){ bmsg(['스파크볼이 없다!']); return; }
  G.bag.spark_ball--;
  const sp=DEX[B.foe.id];
  const hpFactor=1-(B.foe.hp/B.foe.maxhp)*0.7; // lower hp -> easier
  const chance=Math.min(0.95, sp.catchRate*0.6 + hpFactor*0.6);
  bmsg([`${B.you.name}(이)가 스파크볼을 던졌다!`], ()=>{
    let shakes=0;
    for(let i=0;i<3;i++){ if(Math.random()<chance) shakes++; else break; }
    const caught = (shakes===3) && (Math.random()<chance+0.1);
    const shakeMsgs=[];
    for(let i=0;i<Math.max(1,shakes);i++) shakeMsgs.push('흔들… '+'●'.repeat(i+1));
    if(caught){
      shakeMsgs.push(`해냈다! ${B.foe.name}(을)를 잡았다!`);
      bmsg(shakeMsgs, ()=>{
        const captured=B.foe;
        G.caught[captured.id]='caught';
        captured.hp=captured.maxhp; captured.exp=0;
        if(G.party.length<6){ G.party.push(captured); bmsg([`${captured.name}(이)가 파티에 합류했다!`],endBattle); }
        else { G.box.push(captured); bmsg([`${captured.name}(은)는 보관함으로 보내졌다.`],endBattle); }
      });
    } else {
      shakeMsgs.push(`아쉽다! ${B.foe.name}(이)가 튀어나왔다!`);
      bmsg(shakeMsgs, ()=>{ if(B.foe.hp>0) foeAct(()=>{B.menu='main';B.busy=false;}); else {B.menu='main';B.busy=false;} });
    }
  });
}

    // new game: give starter choice
    G.scene='dialog';
    say([
      '엠버폴 화산 연구소에 온 걸 환영한다, 트레이너!',

/* ---- WORLD ---- */
function updateWorld(evs){
  if(evs.includes('m')){ openMenu(); return; }
  if(evs.includes('a')){ interact(); return; }
  if(moveLock>0){ moveLock--; }
  // movement (hold)
  let dx=0,dy=0,nf=G.facing;
  if(KEY.up){dy=-1;nf='up';} else if(KEY.down){dy=1;nf='down';}
  else if(KEY.left){dx=-1;nf='left';} else if(KEY.right){dx=1;nf='right';}
  if(dx||dy){
    G.facing=nf;
    if(moveLock<=0){
      const nx=G.px+dx, ny=G.py+dy;
      const t=tileAt(nx,ny);
      if(t!==1){ // walkable
        G.px=nx; G.py=ny; moveLock=7; walkAnim^=1; G.steps++;
        onStep(t);
      } else { moveLock=4; }
    }
  }
}
function onStep(t){
  // lava burn
  if(t===3){
    const lead=G.party.find(c=>c.hp>0);
    if(lead){ lead.hp=Math.max(1,lead.hp-2); }
  }
  // encounters
  let rate=0, pool=null;
  if(t===2){ rate=0.18; pool='grass'; }
  else if(t===3){ rate=0.22; pool='lava'; }
  else if(t===4){ rate=0.20; pool='water'; }
  if(pool && Math.random()<rate){
    spawnWild(pool);
  }
}
function spawnWild(pool){
  let id, lvMin, lvMax;
  if(pool==='lava'){ id=pick(['emberpup','emberpup','magmaw']); lvMin=4; lvMax=12; }
  else if(pool==='water'){ id=pick(['puddlet','puddlet','tidalfin']); lvMin=3; lvMax=10; }
  else { id=pick(['seedling','boulderkin','seedling','boulderkin','thornbloom']); lvMin=3; lvMax=9; }
  if(DEX[id].stage>=2){ lvMin=Math.max(lvMin,14); lvMax=lvMax+6; }
  const lv=lvMin+Math.floor(Math.random()*(lvMax-lvMin+1));
  startBattle(id, lv, false);
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

function interact(){
  let tx=G.px, ty=G.py;
  if(G.facing==='up')ty--; else if(G.facing==='down')ty++;
  else if(G.facing==='left')tx--; else tx++;
  const t=tileAt(tx,ty);
  if(t===8){ say(SIGNS[tx+','+ty]||'낡은 표지판이다.'); return; }
  if(t===5){ // heal center (also can stand on)
    healParty(); return;
  }
  // also if standing ON heal/shop tile interact with current
  const cur=tileAt(G.px,G.py);
  if(cur===5){ healParty(); return; }
  if(cur===6 || t===6){ openShop(); return; }
  if(t===7){ trainerBattle(); return; }
}
function healParty(){
  G.party.forEach(c=>{c.hp=c.maxhp;});
  G.healCount++;
  say(['엠버폴 회복소.','크리처들이 완전히 회복되었다!']);
}
function trainerBattle(){
  if(G.trainerDone){ say('트레이너 카이: "좋은 승부였어!"'); return; }
  say(['트레이너 카이: "내 화산 크리처를 보여주지!"'],()=>{
    startBattle('magmaw', 14, true);
  });
}

/* ---- MENU (pause / starter / party) ---- */
function openMenu(){ M.open=true; M.page='root'; M.cursor=0; G.scene='menu'; }
function closeMenu(){ M.open=false; G.scene='world'; }
const MENU_ROOT=['크리처','가방','회복소 정보','도감','닫기'];
function updateMenu(evs){
  if(M.page==='starter'){
    if(evs.includes('left'))starter.cursor=(starter.cursor+2)%3;
    if(evs.includes('right'))starter.cursor=(starter.cursor+1)%3;
    if(evs.includes('a')){
      const id=starter.opts[starter.cursor];
      const cr=makeCreature(id,5);
      G.party.push(cr); G.caught[id]='caught';
      starter.open=false; M.open=false;
      G.scene='dialog';
      say([`${DEX[id].name}(을)를 파트너로 선택했다!`,
           '수풀(풀숲)·물가·용암지대에서 야생 크리처를 만나 잡아보자.',
           '메뉴(C 또는 메뉴버튼)에서 크리처/가방 확인. 핑크 십자=회복소, 노란 가게=상점.'],
          ()=>{ G.scene='world'; });
    }
    return;
  }
  if(M.page==='root'){
    if(evs.includes('up'))M.cursor=(M.cursor+MENU_ROOT.length-1)%MENU_ROOT.length;
    if(evs.includes('down'))M.cursor=(M.cursor+1)%MENU_ROOT.length;
    if(evs.includes('b')){ closeMenu(); return; }
    if(evs.includes('a')){
      switch(M.cursor){
        case 0: M.page='party'; M.cursor=0; break;
        case 1: M.page='bag'; M.cursor=0; break;
        case 2: M.page='info'; break;
        case 3: M.page='dex'; break;
        case 4: closeMenu(); break;
      }
    }
    return;
  }
  if(M.page==='party'){
    if(G.party.length>0){
      if(evs.includes('up'))M.cursor=(M.cursor+G.party.length-1)%G.party.length;
      if(evs.includes('down'))M.cursor=(M.cursor+1)%G.party.length;
    }
    if(evs.includes('b')){ M.page='root'; M.cursor=0; }
    return;
  }
  if(M.page==='bag'){
    const items=bagList();
    if(items.length>0){
      if(evs.includes('up'))M.cursor=(M.cursor+items.length-1)%items.length;
      if(evs.includes('down'))M.cursor=(M.cursor+1)%items.length;
      if(evs.includes('a')){
        const it=items[M.cursor];
        if(it.key==='salve'){ M.page='useSalve'; M.sub=0; }
      }
    }
    if(evs.includes('b')){ M.page='root'; M.cursor=1; }
    return;
  }
  if(M.page==='useSalve'){
    if(G.party.length>0){
      if(evs.includes('up'))M.sub=(M.sub+G.party.length-1)%G.party.length;
      if(evs.includes('down'))M.sub=(M.sub+1)%G.party.length;
      if(evs.includes('a')){
        const c=G.party[M.sub];
        if(G.bag.salve>0 && c.hp<c.maxhp){ c.hp=Math.min(c.maxhp,c.hp+40); G.bag.salve--; M.page='bag'; M.cursor=0; }
      }
    }
    if(evs.includes('b')){ M.page='bag'; }
    return;
  }
  if(M.page==='info'||M.page==='dex'){
    if(evs.includes('b')||evs.includes('a')){ M.page='root'; }
    return;
  }
}
function bagList(){
  const out=[];
  out.push({key:'spark_ball',name:'스파크볼',n:G.bag.spark_ball});
  out.push({key:'salve',name:'화상연고',n:G.bag.salve});
  return out;
}

/* ---- SHOP ---- */
function openShop(){ S.open=true; S.cursor=0; G.scene='shop'; }
function updateShop(evs){
  const n=SHOP_ITEMS.length+1; // +exit
  if(evs.includes('up'))S.cursor=(S.cursor+n-1)%n;
  if(evs.includes('down'))S.cursor=(S.cursor+1)%n;
  if(evs.includes('b')){ S.open=false; G.scene='world'; return; }
  if(evs.includes('a')){
    if(S.cursor===SHOP_ITEMS.length){ S.open=false; G.scene='world'; return; }
    const it=SHOP_ITEMS[S.cursor];
    if(G.money>=it.price){ G.money-=it.price; G.bag[it.key]=(G.bag[it.key]||0)+1; }
  }
}

/* ---- BATTLE ---- */
const BMENU=['싸운다','가방','크리처','도망친다'];
function updateBattle(evs){
  if(B.busy || B.menu==='msg'){
    if(evs.includes('a')||evs.includes('b')) bmsgAdvance();
    return;
  }
  if(B.menu==='main'){
    if(evs.includes('up'))B.cursor=(B.cursor+2)%4;
    if(evs.includes('down'))B.cursor=(B.cursor+2)%4;
    if(evs.includes('left'))B.cursor=(B.cursor%2===1)?B.cursor-1:B.cursor+1;
    if(evs.includes('right'))B.cursor=(B.cursor%2===0)?B.cursor+1:B.cursor-1;
    // simpler 2x2 nav
    if(evs.includes('a')){
      switch(B.cursor){
        case 0: B.menu='fight'; B.sub=0; break;
        case 1: B.menu='bag'; B.sub=0; break;
        case 2: B.menu='party'; B.sub=0; break;
        case 3:
          if(!B.runOk){ bmsg(['트레이너 대결에서는 도망칠 수 없다!']); }
          else if(Math.random()<0.75){ bmsg(['무사히 도망쳤다!'], endBattle); }
          else { bmsg(['도망치지 못했다!'], ()=>{ foeAct(()=>{B.menu='main';B.busy=false;}); }); }
          break;
      }
    }
    return;
  }
  if(B.menu==='fight'){
    const mvs=B.you.moves;
    if(evs.includes('up'))B.sub=(B.sub+mvs.length-1)%mvs.length;
    if(evs.includes('down'))B.sub=(B.sub+1)%mvs.length;
    if(evs.includes('b')){ B.menu='main'; }
    if(evs.includes('a')){
      const mk=mvs[B.sub];
      B._pendingMove=mk;
      B.menu='msg'; B.busy=true; B.msg=[]; // chain will fill
      const youFirst=B.you.spd>=B.foe.spd;
      if(youFirst) chain([ (n)=>doAttack(B.you,B.foe,mk,true,n), (n)=>{ if(B.foe.hp>0&&B.you.hp>0) foeAct(n); else n&&n(); } ]);
      else chain([ (n)=>foeAct(n), (n)=>{ if(B.you.hp>0&&B.foe.hp>0) doAttack(B.you,B.foe,mk,true,n); else n&&n(); } ]);
    }
    return;
  }
  if(B.menu==='bag'){
    const opts=[{key:'spark_ball',name:'스파크볼',n:G.bag.spark_ball},{key:'salve',name:'화상연고',n:G.bag.salve}];
    if(evs.includes('up'))B.sub=(B.sub+opts.length-1)%opts.length;
    if(evs.includes('down'))B.sub=(B.sub+1)%opts.length;
    if(evs.includes('b')){ B.menu='main'; }
    if(evs.includes('a')){
      const it=opts[B.sub];
      if(it.key==='spark_ball'){ B.menu='msg';B.busy=true;B.msg=[]; tryCatch(); }
      else if(it.key==='salve'){
        if(G.bag.salve>0 && B.you.hp<B.you.maxhp){
          G.bag.salve--; B.you.hp=Math.min(B.you.maxhp,B.you.hp+40);
          B.menu='msg';B.busy=true;B.msg=[];
          bmsg([`${B.you.name}의 HP를 40 회복했다!`], ()=>{ foeAct(()=>{B.menu='main';B.busy=false;}); });
        } else { bmsg(['지금은 쓸 수 없다.']); }
      }
    }
    return;
  }
  if(B.menu==='party'){
    const alive=G.party;
    if(evs.includes('up'))B.sub=(B.sub+alive.length-1)%alive.length;
    if(evs.includes('down'))B.sub=(B.sub+1)%alive.length;
    if(evs.includes('b')){ B.menu='main'; }
    if(evs.includes('a')){
      const c=G.party[B.sub];
      if(c===B.you){ /* same */ B.menu='main'; }
      else if(c.hp<=0){ bmsg([`${c.name}(은)는 싸울 수 없다!`]); }
      else {
        B.you=c;
        B.menu='msg';B.busy=true;B.msg=[];
        bmsg([`가라, ${c.name}!`], ()=>{ foeAct(()=>{B.menu='main';B.busy=false;}); });
      }
    }
    return;
  }
}

function draw(){
  X.clearRect(0,0,W,H);
  switch(G.scene){
    case 'title': drawTitle(); break;
    case 'world': drawWorld(); drawWorldHUD(); break;
    case 'dialog': drawWorld(); drawDialog(); break;
    case 'battle': drawBattle(); break;
    case 'menu':
      if(M.page==='starter'){ drawStarter(); }
      else { drawWorld(); drawMenu(); }
      break;
    case 'shop': drawWorld(); drawShop(); break;
    case 'box': drawWorld(); break;
  }
}

  X.fillText(s,x,y); X.textAlign='left';
}

function drawWorld(){
  lavaTick=(lavaTick+1)%1000;
  // camera centered on player
  const camx = clamp(G.px*16 - W/2 + 8, 0, MAP_W*16 - W);
  const camy = clamp(G.py*16 - (H-40)/2 + 8, 0, MAP_H*16 - (H-40));
  px('#1a0e10',0,0,W,H);
  const startX=Math.floor(camx/16), startY=Math.floor(camy/16);
  for(let ty=startY; ty<=startY+ Math.ceil((H-40)/16)+1; ty++){
    for(let tx=startX; tx<=startX+ Math.ceil(W/16)+1; tx++){
      if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) continue;
      const sx=tx*16-camx, sy=ty*16-camy;
      drawTile(MAP[ty][tx], sx, sy);
    }
  }
  // trainer sprite on tile 7
  for(let ty=0;ty<MAP_H;ty++)for(let tx=0;tx<MAP_W;tx++){
    if(MAP[ty][tx]===7){
      const sx=tx*16-camx, sy=ty*16-camy;
      // mini rival trainer
      px('#3a2a4a',sx+4,sy+8,8,7); px('#c489ff',sx+4,sy+8,8,2);
      px('#f2c9a0',sx+5,sy+2,6,6); px('#2a1a3a',sx+4,sy+1,8,3);
      px('#1a0a05',sx+6,sy+4,2,2);px('#1a0a05',sx+9,sy+4,2,2);
    }
  }
  // player
  const psx=G.px*16-camx, psy=G.py*16-camy;
  drawPlayer(psx,psy,G.facing);
}
function clamp(v,a,b){ return v<a?a:v>b?b:v; }

function wrapText(s,x,y,maxw,lh,col){
  X.fillStyle=col||'#ffeede'; X.font="9px 'Courier New',monospace"; X.textBaseline='top';
  const words=s.split('');
  let line='', yy=y;
  for(let i=0;i<words.length;i++){
    const test=line+words[i];
    if(X.measureText(test).width>maxw){ X.fillText(line,x,yy); line=words[i]; yy+=lh; }
    else line=test;
  }
  X.fillText(line,x,yy);
}

      text(TYPE_KR[c.type],150,y,'#'+TYPE_COL[c.type].slice(1),9);
      text(`Lv${c.lv}`,210,y,'#ffd24a',10);
      text(`HP ${c.hp}/${c.maxhp}`,52,y+14,'#ffd9c0',9);
      hpbar(150,y+16,90,c.hp,c.maxhp);
      text(`A:${c.atk} D:${c.def} S:${c.spd}`,52,y+24,'#9b6f5e',7);
    }
    text('B: 뒤로',W-60,H-48,'#9b6f5e',8);
  } else if(M.page==='bag'){
    frame(8,8,W-16,160);
    text2('가방',W/2,14,'#ffb547',12,true);
    const items=bagList();
    for(let i=0;i<items.length;i++){
      const y=36+i*24, sel=(i===M.cursor);
      if(sel)px('#3a1c20',12,y-2,W-24,22);
      text((sel?'▶ ':'  ')+items[i].name,20,y,sel?'#ffeede':'#bfa39a',11);
      text('x'+items[i].n, W-50,y,'#ffd24a',11);
    }
    text(`코인: ${G.money}`,20,120,'#ffd24a',10);
    text('A: 화상연고 사용 · B: 뒤로',20,140,'#9b6f5e',8);
  } else if(M.page==='useSalve'){
    frame(8,8,W-16,H-40);
    text2('누구에게 사용?',W/2,14,'#ffb547',12,true);
    for(let i=0;i<G.party.length;i++){
      const c=G.party[i], y=34+i*30, sel=(i===M.sub);
      if(sel)px('#3a1c20',12,y-2,W-24,28);
      drawSprite(c.id,16,y,24);
      text(`${c.name} Lv${c.lv}`,46,y,'#ffeede',10);
      text(`HP ${c.hp}/${c.maxhp}`,46,y+12,'#ffd9c0',9);
      hpbar(170,y+12,90,c.hp,c.maxhp);
    }
    text('화상연고 보유: '+G.bag.salve,20,H-56,'#ffd24a',9);
    text('A: 사용 · B: 뒤로',20,H-44,'#9b6f5e',8);
  } else if(M.page==='info'){
    frame(8,8,W-16,170);
    text2('엠버폴 안내',W/2,14,'#ffb547',12,true);
    const lines=[
      '핑크 십자 = 회복소 (밟고 A: 무료 회복)',
      '노란 가게 = 상점 (밟고 A: 아이템 구매)',
      '초록 수풀 = 풀/바위 크리처 조우',
      '용암 분지 = 불꽃 크리처 (걸을 때 화상)',
      '파란 물가 = 물결 크리처 조우',
      '보라 트레이너 = 다가가 A로 대결',
      'HP 0 전멸 시 회복소로 귀환',
    ];
    lines.forEach((l,i)=>text(l,18,40+i*17,'#ffeede',9));
    text('B/A: 닫기',W-70,H-50,'#9b6f5e',8);
  } else if(M.page==='dex'){
    frame(8,8,W-16,H-40);
    text2('크리처 도감',W/2,12,'#ffb547',12,true);
    for(let i=0;i<DEX_IDS.length;i++){
      const id=DEX_IDS[i];
      const st=G.caught[id];
      const col=i%2, row=Math.floor(i/2);
      const x=14+col*150, y=30+row*36;
      const known = st==='caught'||st==='seen';
      if(known){ drawSprite(id, x, y, 28); }
      else { px('#2a1a1e',x,y,28,28); text('?',x+10,y+8,'#5a4a40',14); }
      const mark = st==='caught'?'●': st==='seen'?'○':' ';
      text(mark+(known?DEX[id].name:'？？？'), x+32, y+4,'#ffeede',9);
      if(known) text('Lv진화 '+(DEX[id].evo?DEX[id].evo.lv:'-'),x+32,y+16,'#9b6f5e',7);
    }
    text('● 잡음 ○ 봄 · B: 뒤로',16,H-48,'#9b6f5e',8);
  }
}

/* ---- shop ---- */
function drawShop(){
  frame(8,8,W-16,170);
  text2('엠버폴 상점',W/2,14,'#ffb547',12,true);
  text('코인: '+G.money,W-110,16,'#ffd24a',10);
  for(let i=0;i<SHOP_ITEMS.length;i++){
    const it=SHOP_ITEMS[i], y=40+i*30, sel=(i===S.cursor);
    if(sel)px('#3a1c20',12,y-2,W-24,28);
    text((sel?'▶ ':'  ')+it.name,18,y,sel?'#ffeede':'#bfa39a',11);
    text(it.price+'코인',W-90,y,'#ffd24a',10);
    text(it.desc,30,y+12,'#9b6f5e',7);
  }
  const ey=40+SHOP_ITEMS.length*30, esel=(S.cursor===SHOP_ITEMS.length);
  if(esel)px('#3a1c20',12,ey-2,W-24,16);
  text((esel?'▶ ':'  ')+'나간다',18,ey,esel?'#ffeede':'#bfa39a',11);
  text('A: 구매 · ↑↓ 이동 · B: 나가기',18,160,'#9b6f5e',8);
}

/* ============================================================
   LOOP
   ============================================================ */
let lastT=0, acc=0;
function loop(t){
  acc += (t-lastT); lastT=t;
  // ~30fps logic tick for movement pacing
  if(acc>=33){ update(); acc=0; }
  draw();
  requestAnimationFrame(loop);
}

/* boot */
fit();
requestAnimationFrame(loop);
// expose for test harness
window.__G=G; window.__B=B; window.__DEX=DEX; window.__startBattle=startBattle;
window.__giveStarter=function(id){ const cr=makeCreature(id||'emberpup',5); G.party.push(cr); G.caught[cr.id]='caught'; G.scene='world'; };
</script>
