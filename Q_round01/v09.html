<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>스카이펠 사가 — Skyfell Saga</title>
<style>
  :root{
    --bg:#0d1326; --panel:#101a36; --panel2:#16244a; --ink:#eaf2ff; --dim:#9fb2d8;
    --gold:#ffd66b; --hp:#5fe07a; --hpl:#ffd24a; --hpd:#ff5a6e; --xp:#6fb6ff;
    --acc:#7ad0ff; --border:#2b3c6e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#05070f;color:var(--ink);
    font-family:'Courier New',ui-monospace,monospace; overflow:hidden;
    user-select:none; -webkit-user-select:none; touch-action:none;}
  #stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#16224a,#05070f 70%);}
  canvas{image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;
    background:#0a1124;box-shadow:0 0 0 3px var(--border),0 0 40px #0008;border-radius:6px;}
  /* ---- UI overlays ---- */
  #ui{position:absolute;inset:0;pointer-events:none;}
  .layer{position:absolute;inset:0;pointer-events:none;}
  .panel{position:absolute;background:var(--panel);border:3px solid var(--border);border-radius:8px;
    box-shadow:0 6px 0 #0006, inset 0 0 0 2px #ffffff14; pointer-events:auto;}
  /* panels used as inline cards inside full-screen menus must flow normally, not stack absolutely */
  .full .panel{position:relative;inset:auto;}
  .ttl{color:var(--gold);font-weight:bold;letter-spacing:1px;text-shadow:1px 1px 0 #000;}
  .btn{pointer-events:auto;cursor:pointer;background:var(--panel2);border:2px solid var(--border);
    color:var(--ink);border-radius:8px;font-family:inherit;font-weight:bold;font-size:15px;
    padding:10px 8px;text-align:center;text-shadow:1px 1px 0 #000;transition:transform .05s,background .1s;}
  .btn:hover{background:#1e3266;}
  .btn:active{transform:translateY(2px);}
  .btn.sel{background:#27407e;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
  .btn[disabled]{opacity:.4;cursor:default;}
  /* dialog */
  #dlg{left:50%;transform:translateX(-50%);bottom:18px;width:min(680px,92vw);min-height:84px;
    padding:14px 18px;font-size:17px;line-height:1.5;display:none;}
  #dlg .cont{position:absolute;right:14px;bottom:6px;color:var(--gold);font-size:13px;animation:bl 1s steps(2) infinite;}
  @keyframes bl{50%{opacity:.2}}
  /* title */
  #title{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,8,18,.86);pointer-events:auto;}
  #title h1{font-size:clamp(30px,8vw,58px);margin:0;color:var(--gold);text-shadow:3px 3px 0 #000,0 0 24px #ffd66b66;letter-spacing:2px;}
  #title .sub{color:var(--acc);font-size:16px;letter-spacing:3px;margin-top:-6px;}
  #title .credit{color:var(--dim);font-size:11px;max-width:520px;text-align:center;line-height:1.6;padding:0 16px;margin-top:8px;}
  #title .start{font-size:20px;padding:14px 34px;animation:pulse 1.4s infinite;}
  @keyframes pulse{50%{box-shadow:0 0 0 1px var(--gold),0 0 22px #ffd66b88}}
  /* battle */
  #battle{display:none;}
  .hpbox{position:absolute;background:var(--panel);border:3px solid var(--border);border-radius:8px;padding:8px 10px;width:230px;box-shadow:0 4px 0 #0006;}
  .hpbox .nm{font-weight:bold;font-size:15px;text-shadow:1px 1px 0 #000;}
  .hpbox .lv{color:var(--gold);float:right;font-size:13px;}
  .bar{height:9px;background:#0a1330;border:1px solid #000;border-radius:5px;margin-top:5px;overflow:hidden;}
  .bar>i{display:block;height:100%;background:var(--hp);transition:width .35s;}
  .xpbar{height:5px;margin-top:3px;}
  .xpbar>i{background:var(--xp);}
  .hpnum{font-size:11px;color:var(--dim);margin-top:2px;text-align:right;}
  /* menus */
  .menu{position:absolute;display:grid;gap:8px;}
  #partyScreen,#boxScreen,#shopScreen,#bagScreen,#dexScreen{display:none;}
  .full{background:rgba(5,8,18,.92);overflow:auto;pointer-events:auto;}
  .row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--border);border-radius:8px;background:var(--panel);margin:6px 0;cursor:pointer;}
  .row:hover{background:#16244a;}
  .row.sel{border-color:var(--gold);}
  .spr{image-rendering:pixelated;border-radius:6px;background:#0a1330;flex:0 0 auto;}
  .small{font-size:12px;color:var(--dim);}
  .chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid #0006;color:#04101f;font-weight:bold;margin-right:3px;}
  #toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#000a;border:2px solid var(--gold);
    color:var(--gold);padding:8px 16px;border-radius:20px;font-size:14px;display:none;pointer-events:none;z-index:50;}
  /* touch controls */
  #touch{position:absolute;inset:0;display:none;pointer-events:none;}
  .dpad{position:absolute;left:16px;bottom:20px;width:150px;height:150px;pointer-events:auto;}
  .dbtn{position:absolute;width:50px;height:50px;background:#16244acc;border:2px solid var(--border);border-radius:10px;color:var(--ink);font-size:20px;display:flex;align-items:center;justify-content:center;}
  .dbtn:active{background:#27407e;}
  .du{left:50px;top:0}.dd{left:50px;top:100px}.dl{left:0;top:50px}.dr{left:100px;top:50px}
  .abtns{position:absolute;right:16px;bottom:20px;display:flex;flex-direction:column;gap:12px;align-items:center;pointer-events:auto;}
  .abtn{width:60px;height:60px;border-radius:50%;background:#27407ecc;border:3px solid var(--gold);color:var(--gold);font-weight:bold;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .abtn.b{background:#7e2740cc;border-color:#ff8aa0;color:#ff8aa0;width:50px;height:50px;}
  .abtn:active{transform:scale(.9);}
  #topbar{position:absolute;left:10px;top:8px;display:flex;gap:8px;align-items:center;pointer-events:none;}
  .tag{background:#000a;border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:13px;color:var(--gold);}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
  .hint{position:absolute;right:10px;top:8px;background:#000a;border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:11px;color:var(--dim);pointer-events:none;}
</style>
</head>

<div id="stage">
  <canvas id="cv" width="480" height="320"></canvas>
  <div id="ui">
    <div id="topbar"></div>
    <div class="hint" id="hint">방향키 이동 · Z 확인 · X 메뉴</div>
    <div id="toast"></div>
    <div class="flash" id="flash"></div>

    <!-- DIALOG -->
    <div id="dlg" class="panel"><span id="dlgTxt"></span><span class="cont">▼ Z</span></div>

    <!-- TITLE -->
    <div id="title" class="layer">
      <h1>스카이펠 사가</h1>
      <div class="sub">SKYFELL SAGA</div>
      <div class="btn start" id="startBtn">▶ 모험 시작</div>
      <div class="credit">하늘섬을 떠도는 비행 크리처를 잡고 키우는 오리지널 JRPG.<br>

    </div>
  </div>
</div>

   스카이펠 사가 — 단일 HTML 픽셀 몬스터 수집 JRPG
   포켓몬에서 영감받은 완전 오리지널 구현. 모든 크리처/타입/지역은 오리지널.
   ========================================================================= */
const CV = document.getElementById('cv'), CTX = CV.getContext('2d');
CTX.imageSmoothingEnabled = false;
const VW = 480, VH = 320;       // virtual resolution
const TILE = 32;                // logical tile size in overworld pixels
const PX = 2;                   // sprite pixel scale for creatures
let LAST = 0;

/* ---------- responsive canvas ---------- */
function resize(){
  const s = document.getElementById('stage');
  const aw = s.clientWidth, ah = s.clientHeight;
  const scale = Math.min(aw/VW, ah/VH);
  CV.style.width = Math.floor(VW*scale)+'px';
  CV.style.height = Math.floor(VH*scale)+'px';
}
window.addEventListener('resize', resize); resize();

/* ---------- input ---------- */
const KEY = {};
const held = {up:0,down:0,left:0,right:0};
addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' ','z','x','enter'].includes(k)) e.preventDefault();
  if(KEY[k]) return; KEY[k]=true;
  if(k==='arrowup')held.up=1; if(k==='arrowdown')held.down=1;
  if(k==='arrowleft')held.left=1; if(k==='arrowright')held.right=1;
  onPress(k);
});
addEventListener('keyup', e=>{
  const k=e.key.toLowerCase(); KEY[k]=false;
  if(k==='arrowup')held.up=0; if(k==='arrowdown')held.down=0;
  if(k==='arrowleft')held.left=0; if(k==='arrowright')held.right=0;
});
function onPress(k){
  if(k==='z'||k==='enter'||k===' ') GAME.btnA();
  else if(k==='x'||k==='escape'||k==='backspace') GAME.btnB();
  else if(k==='arrowup') GAME.dir('up');
  else if(k==='arrowdown') GAME.dir('down');
  else if(k==='arrowleft') GAME.dir('left');
  else if(k==='arrowright') GAME.dir('right');
}

  Lumen:  {Shade:2.0, Spark:0.5, Lumen:0.5},
  Shade:  {Lumen:2.0, Verdant:2.0, Shade:0.5},
};
function eff(atkType, defType){
  const r = (CHART[atkType]||{})[defType];
  return r===undefined ? 1.0 : r;
}

/* =========================================================================
   CREATURE INSTANCE
   ========================================================================= */
let UID = 1;
function statAt(base, lv, isHp){
  if(isHp) return Math.floor((2*base*lv)/100) + lv + 10;
  return Math.floor((2*base*lv)/100) + 5;
}
function xpForLevel(lv){ return Math.floor(0.8 * lv*lv*lv); } // medium-fast-ish
function makeMon(speciesId, lv){
  const sp = DEX[speciesId];
  const m = {
    uid: UID++, sp:speciesId, name:sp.name, lv,
    type:sp.type, xp:xpForLevel(lv),
    moves:[], hp:0, maxhp:0,
  };
  recalc(m);
  // learn moves up to level
  const learn = sp.moves.filter(x=>x[0]<=lv).map(x=>x[1]);
  m.moves = learn.slice(-4).map(mv=>({id:mv, pp:MOVES[mv].pp, max:MOVES[mv].pp}));
  if(m.moves.length===0) m.moves=[{id:sp.moves[0][1], pp:MOVES[sp.moves[0][1]].pp, max:MOVES[sp.moves[0][1]].pp}];
  m.hp = m.maxhp;
  return m;
}
function recalc(m){
  const sp=DEX[m.sp], b=sp.base;
  m.maxhp = statAt(b.hp, m.lv, true);
  m.atk = statAt(b.atk, m.lv);
  m.def = statAt(b.def, m.lv);
  m.spd = statAt(b.spd, m.lv);
}

function firstHealthy(){ return STATE.party.findIndex(m=>m.hp>0); }
function beginBattleCommon(){
  B.youIdx = firstHealthy()<0?0:firstHealthy();
  B.you = STATE.party[B.youIdx];
  B.phase='intro'; B.busy=true; B.caught=false; B.fleeAttempts=0;
  B.enemyShake=B.youShake=B.enemyFlash=B.youFlash=0; B.enemyFly=0;
  STATE.scene='battle';
  showBattleUI();
  setTimeout(()=>{ B.busy=false; B.phase='menu'; renderBattleUI(); }, 700);
}
function pushLog(t){ B.log=t; renderBattleUI(); }

function damageCalc(att, def, move){
  const mv=MOVES[move.id];
  const stab = att.type===mv.type ? 1.5 : 1.0;
  const e = eff(mv.type, def.type);
  const rnd = 0.85 + Math.random()*0.15;
  const base = (((2*att.lv/5+2)*mv.pow*(att.atk/Math.max(1,def.def)))/50)+2;
  let dmg = Math.floor(base*stab*e*rnd);
  return {dmg:Math.max(1,dmg), e, crit:false};
}

/* turn resolution */
function playerMove(moveIndex){
  if(B.busy) return;
  const mv=B.you.moves[moveIndex];
  if(!mv || mv.pp<=0){ toast('PP가 부족합니다'); return; }
  B.busy=true; B.phase='anim';
  // determine order by speed
  const youFirst = B.you.spd >= B.enemy.spd || B.enemy.hp<=0;
  const acts=[];
  acts.push(()=>doAttack(B.you, B.enemy, mv, true));
  acts.push(()=>{ if(B.enemy.hp>0) enemyTurn(); });
  if(youFirst) runSeq(acts); else runSeq([acts[1],acts[0]]);
}
function enemyTurn(){
  if(B.enemy.hp<=0) return;
  const mv = B.enemy.moves[Math.floor(Math.random()*B.enemy.moves.length)];
  doAttack(B.enemy, B.you, mv, false);
}
function doAttack(attacker, defender, mvslot, byPlayer){
  return new Promise(res=>{
    const mv=MOVES[mvslot.id];
    if(mvslot.pp!==undefined) mvslot.pp=Math.max(0,mvslot.pp-1);
    pushLog(`${attacker.name}의 ${mv.name}!`);
    setTimeout(()=>{
      // accuracy
      if(Math.random()*100 > mv.acc){
        pushLog(`${attacker.name}의 공격은 빗나갔다!`);
        setTimeout(res, 650); return;
      }
      const {dmg,e}=damageCalc(attacker, defender, mvslot);
      defender.hp=Math.max(0, defender.hp-dmg);
      // animation flags
      if(byPlayer){ B.enemyShake=10; B.enemyFlash=6; } else { B.youShake=10; B.youFlash=6; }
      flashScreen(0.15);
      renderBattleUI();
      let extra = e>1?' 효과가 굉장했다!': e<1?' 효과가 별로였다...':'';
      if(extra) setTimeout(()=>pushLog(extra.trim()),350);
      setTimeout(()=>{
        if(defender.hp<=0){ onFaint(defender, byPlayer).then(res); }
        else res();
      }, 700);
    }, 500);
  });
}
function onFaint(mon, byPlayer){
  return new Promise(res=>{
    if(byPlayer){ // enemy fainted
      B.enemyFly=1;
      pushLog(`상대 ${mon.name}이(가) 쓰러졌다!`);
      setTimeout(()=>{
        // XP gain
        const gain = Math.floor((DEX[mon.sp].base.hp + mon.lv*7));
        grantXP(B.you, gain).then(()=>{
          if(!B.wild){
            B.trainerIdx++;
            if(B.trainerIdx < B.trainerTeam.length){
              B.enemy=B.trainerTeam[B.trainerIdx]; B.enemyFly=0;
              STATE.dexSeen.add(B.enemy.sp);
              pushLog(`${B.trainer.name}은(는) ${B.enemy.name}을(를) 내보냈다!`);
              setTimeout(()=>{ B.busy=false; B.phase='menu'; renderBattleUI(); res(); }, 900);
            } else { winTrainer(); res(); }
          } else { endBattle('win'); res(); }
        });
      }, 800);
    } else { // your mon fainted
      pushLog(`${mon.name}이(가) 쓰러졌다!`);
      setTimeout(()=>{
        const next=firstHealthy();
        if(next<0){ endBattle('lose'); res(); }
        else {
          B.youIdx=next; B.you=STATE.party[next];
          pushLog(`힘내라 ${B.you.name}!`);
          setTimeout(()=>{ B.busy=false; B.phase='menu'; B.youFly=0; renderBattleUI(); res(); }, 800);
        }
      }, 800);
    }
  });
}
function grantXP(mon, amt){
  return new Promise(res=>{
    if(mon.hp<=0){ res(); return; }
    mon.xp += amt;
    pushLog(`${mon.name}은(는) ${amt} 경험치를 얻었다!`);
    let leveled=false;
    setTimeout(function step(){
      if(mon.xp >= xpForLevel(mon.lv+1) && mon.lv<50){
        mon.lv++; leveled=true;
        const oldmax=mon.maxhp; recalc(mon); mon.hp += (mon.maxhp-oldmax);
        pushLog(`${mon.name}은(는) Lv.${mon.lv}이 되었다!`);
        // learn new moves
        for(const [lv,mid] of DEX[mon.sp].moves){
          if(lv===mon.lv && !mon.moves.find(x=>x.id===mid)){
            if(mon.moves.length<4) mon.moves.push({id:mid,pp:MOVES[mid].pp,max:MOVES[mid].pp});
            else { mon.moves.shift(); mon.moves.push({id:mid,pp:MOVES[mid].pp,max:MOVES[mid].pp}); }
            setTimeout(()=>pushLog(`${MOVES[mid].name}을(를) 배웠다!`),300);
          }
        }
        renderBattleUI();
        setTimeout(step, 900);
      } else {
        // evolution check
        const evo=DEX[mon.sp].evo;
        if(evo && mon.lv>=evo.lv){ doEvolve(mon).then(res); }
        else res();
      }
    }, 700);
  });
}
function doEvolve(mon){
  return new Promise(res=>{
    const toSp=DEX[mon.sp].evo.to, oldName=mon.name;
    pushLog(`어라...? ${oldName}의 모습이...!`);
    flashScreen(0.4);
    setTimeout(()=>{
      mon.sp=toSp; mon.name=DEX[toSp].name; mon.type=DEX[toSp].type;
      const oldmax=mon.maxhp; recalc(mon); mon.hp += (mon.maxhp-oldmax);
      STATE.dexCaught.add(toSp); STATE.dexSeen.add(toSp);
      flashScreen(0.6);
      pushLog(`축하합니다! ${oldName}은(는) ${mon.name}(으)로 진화했다!`);
      renderBattleUI();
      setTimeout(res, 1300);
    }, 1100);
  });
}
async function runSeq(acts){
  for(const a of acts){ if(!B.active) return; await a(); if(!B.active) return; }
  if(B.active && B.phase!=='menu'){ B.busy=false; B.phase='menu'; renderBattleUI(); }
}

/* throw ball */
function throwBall(itemKey){
  if(B.busy) return;
  if(!B.wild){ toast('조련사의 크리처는 잡을 수 없습니다!'); return; }
  if((STATE.bag[itemKey]||0)<=0){ toast('볼이 없습니다'); return; }
  STATE.bag[itemKey]--;
  B.busy=true; B.phase='anim';
  const ball=ITEMS[itemKey];
  pushLog(`${ball.name}을(를) 던졌다!`);
  B.ballAnim=1;
  setTimeout(()=>{
    const e=B.enemy, sp=DEX[e.sp];
    const hpFactor=(3*e.maxhp - 2*e.hp)/(3*e.maxhp);
    const rate=Math.min(255, sp.catchRate*hpFactor*ball.rate);
    const p = rate/255;
    let shakes=0;
    for(let i=0;i<3;i++){ if(Math.random()<Math.pow(p,0.25)) shakes++; else break; }
    const success = shakes>=3 || Math.random()<p;
    // animate shakes
    let i=0;
    const shakeTimer=setInterval(()=>{
      i++; B.ballShake=(B.ballShake?0:1); renderBattleUI();
      if(i>=shakes*2+1){
        clearInterval(shakeTimer); B.ballShake=0;
        if(success){ doCatch(); }
        else {
          B.ballAnim=0;
          pushLog(`아쉽다! ${e.name}이(가) 볼에서 나왔다!`);
          setTimeout(()=>{ if(e.hp>0) enemyTurn().then?null:null; runSeq([()=>{ if(B.enemy.hp>0) return new Promise(r=>{enemyTurn();setTimeout(r,1)}); }]); B.busy=false;B.phase='menu';renderBattleUI(); }, 900);
        }
      }
    }, 420);
  }, 700);
}
function doCatch(){
  const e=B.enemy;
  B.caught=true; B.ballAnim=0;
  pushLog(`신난다! ${e.name}을(를) 잡았다!`);
  STATE.dexCaught.add(e.sp); STATE.dexSeen.add(e.sp);
  // add to party or box
  if(STATE.party.length<6){ STATE.party.push(e); }
  else { STATE.box.push(e); }
  flashScreen(0.3);
  setTimeout(()=>{
    const where = STATE.party.length<=6 && STATE.party[STATE.party.length-1]===e ? '파티에' : '보관함에';
    pushLog(`${e.name}을(를) ${STATE.box.includes(e)?'보관함':'파티'}에 넣었다.`);
    setTimeout(()=>endBattle('caught'), 1100);
  }, 900);
}

function tryFlee(){
  if(B.busy) return;
  if(!B.wild){ toast('승부에서 도망칠 수 없습니다!'); return; }
  B.fleeAttempts++;
  const chance = Math.min(0.95, 0.5 + B.fleeAttempts*0.15 + (B.you.spd>B.enemy.spd?0.2:0));
  if(Math.random()<chance){ pushLog('무사히 도망쳤다!'); B.busy=true; setTimeout(()=>endBattle('flee'),800); }
  else { pushLog('도망칠 수 없었다!'); B.busy=true; B.phase='anim';
    runSeq([()=>new Promise(r=>{ if(B.enemy.hp>0){enemyTurn();} setTimeout(r,1); })]); }
}

function winTrainer(){
  const npc=B.trainer;
  STATE.trainers[npc.id]=true;
  STATE.money+=npc.reward;
  STATE.badges++;
  pushLog(`${npc.name}을(를) 이겼다!  ${npc.reward}G 획득!`);
  setTimeout(()=>{
    if(npc.win) pushLog(npc.win[0]);
    setTimeout(()=>endBattle('win'), 1400);
  }, 1100);
}
function endBattle(result){
  B.active=false; B.busy=false;
  document.getElementById('battle').style.display='none';
  STATE.scene='over';
  setHint();
  if(result==='lose'){
    // whiteout -> heal at nest

let BCTX=null;
function renderBattleScene(){
  const bc=document.getElementById('bcv'); if(!bc)return; if(!BCTX)BCTX=bc.getContext('2d');
  const c=BCTX; c.imageSmoothingEnabled=false;
  // sky bg
  const g=c.createLinearGradient(0,0,0,VH); g.addColorStop(0,'#2a3f7a');g.addColorStop(.6,'#3a5fb0');g.addColorStop(1,'#7aa8e0');
  c.fillStyle=g; c.fillRect(0,0,VW,VH);
  // clouds
  c.fillStyle='#ffffff55';
  for(let i=0;i<5;i++){const cx=(i*120+ (Date.now()/40)%600)%600-60, cy=40+i*30;
    c.beginPath();c.arc(cx,cy,20,0,7);c.arc(cx+18,cy+4,16,0,7);c.fill();}
  // platforms
  c.fillStyle='#3a8a4a'; c.beginPath();c.ellipse(120,210,90,26,0,0,7);c.fill();
  c.fillStyle='#2c6e38'; c.beginPath();c.ellipse(120,216,90,22,0,0,7);c.fill();
  c.fillStyle='#3a8a4a'; c.beginPath();c.ellipse(360,140,80,22,0,0,7);c.fill();
  c.fillStyle='#2c6e38'; c.beginPath();c.ellipse(360,145,80,18,0,0,7);c.fill();
  // enemy
  if(B.enemy && B.enemyFly<2){
    const ex=360-32 + (B.enemyShake>0?(Math.random()*8-4):0);
    const ey=80 + (B.enemyFly?(-(1-0)*0):0);
    c.save();
    if(B.enemyFlash>0){c.globalAlpha=0.5+Math.random()*0.5;}
    const sc=4;
    drawCreature(c, B.enemy, ex - (16*sc-64)/2, ey, sc);
    if(B.enemyFlash>0){ c.globalCompositeOperation='source-atop'; c.fillStyle='#fff8'; c.fillRect(ex-30,ey,16*sc,16*sc); c.globalCompositeOperation='source-over'; }
    c.restore();
  }
  // your mon (back-ish, larger)
  if(B.you && B.you.hp>0){
    const yx=80 + (B.youShake>0?(Math.random()*8-4):0);
    const yy=150;
    c.save();
    const sc=5;
    drawCreature(c, B.you, yx, yy, sc);
    if(B.youFlash>0){ c.globalCompositeOperation='source-atop'; c.fillStyle='#ff6a6a99'; c.fillRect(yx,yy,16*sc,16*sc); c.globalCompositeOperation='source-over'; }
    c.restore();
  }
  // ball animation
  if(B.ballAnim){
    const bx = B.ballShake? 360+(Math.random()*8-4):360;
    c.fillStyle='#ff5a6e'; c.beginPath();c.arc(bx,140,8,Math.PI,0);c.fill();
    c.fillStyle='#fff'; c.beginPath();c.arc(bx,140,8,0,Math.PI);c.fill();
    c.strokeStyle='#222';c.lineWidth=2;c.beginPath();c.moveTo(bx-8,140);c.lineTo(bx+8,140);c.stroke();
    c.fillStyle='#ffd66b';c.beginPath();c.arc(bx,140,3,0,7);c.fill();
  }
  // decay flags
  if(B.enemyShake>0)B.enemyShake--; if(B.youShake>0)B.youShake--;
  if(B.enemyFlash>0)B.enemyFlash--; if(B.youFlash>0)B.youFlash--;
  if(B.enemyFly===1){ B.enemyFly=2; }
}

function doSwitch(i){

function useItemInBattle(k){
  if(B.busy)return; const it=ITEMS[k];
  if(it.kind==='ball'){ throwBall(k); return; }
  if(it.kind==='heal'){
    if(B.you.hp>=B.you.maxhp){ toast('이미 체력이 가득합니다'); return; }
    STATE.bag[k]--; B.busy=true; B.phase='anim';
    const before=B.you.hp; B.you.hp=Math.min(B.you.maxhp,B.you.hp+it.amt);
    pushLog(`${it.name}을(를) 사용! HP +${B.you.hp-before}`); renderBattleUI();
    runSeq([()=>new Promise(r=>setTimeout(r,700)),
            ()=>new Promise(r=>{ if(B.enemy.hp>0) enemyTurn(); setTimeout(r,1); })]);
  } else if(it.kind==='revive'){
    const fainted=STATE.party.find(m=>m.hp<=0);
    if(!fainted){ toast('기절한 크리처가 없습니다'); return; }
    STATE.bag[k]--; fainted.hp=Math.floor(fainted.maxhp/2);
    pushLog(`${fainted.name}이(가) 부활했다!`); B.busy=true; B.phase='anim';
    runSeq([()=>new Promise(r=>setTimeout(r,700)),
            ()=>new Promise(r=>{ if(B.enemy.hp>0) enemyTurn(); setTimeout(r,1); })]);
  }
}

/* =========================================================================
   OVERWORLD MOVEMENT & INTERACTION
   ========================================================================= */
const MOVE_SPEED=4; // px per frame
function tryMove(dir){
  const p=STATE.player;
  if(p.moving) return;
  p.dir=dir;
  let nx=p.tx, ny=p.ty;
  if(dir==='up')ny--; if(dir==='down')ny++; if(dir==='left')nx--; if(dir==='right')nx++;
  if(blocked(nx,ny) || npcAt(nx,ny)){ p.faceOnly=true; return; }
  p.moving=true; p.tx=nx; p.ty=ny; p.anim=0;
}
function updateOver(){
  const p=STATE.player;
  if(p.moving){
    const tgx=p.tx*TILE, tgy=p.ty*TILE;
    if(p.px<tgx)p.px=Math.min(tgx,p.px+MOVE_SPEED);
    if(p.px>tgx)p.px=Math.max(tgx,p.px-MOVE_SPEED);
    if(p.py<tgy)p.py=Math.min(tgy,p.py+MOVE_SPEED);
    if(p.py>tgy)p.py=Math.max(tgy,p.py-MOVE_SPEED);
    p.anim++;
    if(p.px===tgx&&p.py===tgy){
      p.moving=false;
      // arrived: check encounter / tile events
      onArrive();
    }
  } else if(STATE.scene==='over'){
    // continuous movement from held keys / dpad
    let d=null;
    if(held.up)d='up'; else if(held.down)d='down'; else if(held.left)d='left'; else if(held.right)d='right';
    if(d) tryMove(d);
  }
}
function onArrive(){
  const p=STATE.player;
  const t=tileAt(p.tx,p.ty);
  if(t===2){ // tall grass -> chance encounter
    if(Math.random()<0.16){ spawnWild(); }
  }
}
const WILD_TABLE=[
  ['fluffin',[3,7]],['dewdrip',[3,7]],['sprigil',[4,7]],['cindle',[4,7]],
  ['voltik',[5,9]],['granwing',[6,9]],['noctyl',[7,10]],['lumara',[8,11]],
];
function spawnWild(){
  // weighted: commons more likely
  const r=Math.random();
  let pick;
  if(r<0.30)pick=WILD_TABLE[0]; else if(r<0.55)pick=WILD_TABLE[1];
  else if(r<0.72)pick=WILD_TABLE[2]; else if(r<0.85)pick=WILD_TABLE[3];
  else if(r<0.92)pick=WILD_TABLE[4]; else if(r<0.97)pick=WILD_TABLE[5];
  else if(r<0.99)pick=WILD_TABLE[6]; else pick=WILD_TABLE[7];
  const [id,[lo,hi]]=pick; const lv=lo+Math.floor(Math.random()*(hi-lo+1));
  flashScreen(0.5);
  setTimeout(()=>startWildBattle(id,lv),250);
}
function interact(){
  const p=STATE.player;
  let fx=p.tx,fy=p.ty;
  if(p.dir==='up')fy--; if(p.dir==='down')fy++; if(p.dir==='left')fx--; if(p.dir==='right')fx++;
  const n=npcAt(fx,fy);
  if(!n) return;
  if(n.kind==='heal'){
    dialog([n.name+': '+n.lines[0]], ()=>{ healParty(); toast('파티가 모두 회복되었다!'); });
  } else if(n.kind==='shop'){
    dialog([n.name+': '+n.lines[0]], ()=>openShop());
  } else if(n.kind==='trainer'){
    if(STATE.trainers[n.id]){ dialog([n.name+': '+ (n.win?n.win[0]:'좋은 승부였어!')]); }
    else { dialog([n.name+': '+n.lines[0]], ()=>startTrainerBattle(n)); }
  } else {
    dialog(n.lines.map(l=>n.name+': '+l));
  }
}

let DLG={lines:[],idx:0,cb:null,active:false};
function dialog(lines, cb){
  DLG={lines:Array.isArray(lines)?lines:[lines], idx:0, cb:cb||null, active:true};
  STATE.scene='dialog';
  const d=document.getElementById('dlg'); d.style.display='block';
  document.getElementById('dlgTxt').textContent=DLG.lines[0];
}
function advanceDialog(){
  DLG.idx++;
  if(DLG.idx>=DLG.lines.length){
    document.getElementById('dlg').style.display='none';
    DLG.active=false; STATE.scene='over';
    if(DLG.cb){ const cb=DLG.cb; DLG.cb=null; cb(); }
  } else {
    document.getElementById('dlgTxt').textContent=DLG.lines[DLG.idx];
  }
}

   ========================================================================= */
function buildTouch(){
  if(document.getElementById('touch')) return;
  const t=document.createElement('div'); t.id='touch';
  t.innerHTML=`
    <div class="dpad">
      <div class="dbtn du" data-d="up">▲</div>
      <div class="dbtn dd" data-d="down">▼</div>
      <div class="dbtn dl" data-d="left">◀</div>
      <div class="dbtn dr" data-d="right">▶</div>
    </div>
    <div class="abtns">
      <div class="abtn" data-a="A">A</div>
      <div class="abtn b" data-a="B">B</div>
    </div>`;
  document.getElementById('ui').appendChild(t);
  // dpad: hold
  t.querySelectorAll('.dbtn').forEach(b=>{
    const d=b.dataset.d;
    const on=e=>{e.preventDefault(); held[d]=1; if(STATE.scene==='over')tryMove(d); else GAME.dir(d);};
    const off=e=>{e.preventDefault(); held[d]=0;};
    b.addEventListener('touchstart',on,{passive:false}); b.addEventListener('touchend',off,{passive:false});
    b.addEventListener('mousedown',on); b.addEventListener('mouseup',off); b.addEventListener('mouseleave',off);
  });
  t.querySelectorAll('.abtn').forEach(b=>{
    const a=b.dataset.a;
    const on=e=>{e.preventDefault(); a==='A'?GAME.btnA():GAME.btnB();};
    b.addEventListener('touchstart',on,{passive:false}); b.addEventListener('click',on);
  });
}
function detectTouch(){
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0 || window.innerWidth<700;
  if(isTouch){ buildTouch(); document.getElementById('touch').style.display='block';
    document.getElementById('hint').textContent='D패드 이동 · A 확인 · B 메뉴'; }
}

   START BUTTON + MAIN LOOP
   ========================================================================= */
document.getElementById('startBtn').addEventListener('click', ()=>startGame());

function loop(ts){
  const dt=ts-LAST; LAST=ts;
  if(STATE.scene==='over'||STATE.scene==='dialog'){ updateOver(); renderOver(dt); }
  else if(STATE.scene==='title'){ /* canvas idle bg */ idleBg(); }
  else if(STATE.scene==='battle'){ renderBattleScene(); }
  else { renderOver(dt); } // menus over the world
  renderTopbar(); setHint();
  requestAnimationFrame(loop);
}
function idleBg(){
  drawTileBg();
  // floating islands silhouette for title
  CTX.fillStyle='#16224a';
  for(let i=0;i<4;i++){const x=(i*140+(Date.now()/60)%560)%560-40, y=80+i*40;
    CTX.beginPath();CTX.ellipse(x,y,40,14,0,0,7);CTX.fill();}
  CTX.fillStyle='#dfeefc22';
  for(let i=0;i<6;i++){const x=(i*100+(Date.now()/30)%600)%600-30,y=40+((i*53)%200);
    CTX.beginPath();CTX.arc(x,y,16,0,7);CTX.arc(x+14,y+4,12,0,7);CTX.fill();}
}
detectTouch();
renderTopbar();
requestAnimationFrame(loop);

// expose for debugging / self-test
window.__SKY={STATE,startGame,chooseStarter,startWildBattle,startTrainerBattle,playerMove,throwBall,B,DEX,MOVES,GAME,tryMove,spawnWild};
</script>
