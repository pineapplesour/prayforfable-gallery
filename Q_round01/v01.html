<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>루미그로브 모험기 — Lumigrove</title>
<style>
  :root{
    --bg:#0f1020; --panel:#1b1d33; --ink:#eef2ff; --accent:#7be0a4; --warn:#ff7b8a;
    --pixel:4px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:'Courier New',ui-monospace,monospace;overflow:hidden;}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;image-rendering:pixelated;background:#000;
    box-shadow:0 0 0 4px #000, 0 0 0 8px #2a2d4d, 0 10px 40px rgba(0,0,0,.6);}
  canvas{display:block;image-rendering:pixelated;}
  /* ---- UI overlays ---- */
  .overlay{position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;pointer-events:none;}
  .overlay.show{display:flex;}
  .box{background:rgba(15,16,32,.94);border:4px solid #4a4f7a;border-radius:8px;
    padding:14px 16px;pointer-events:auto;max-width:92%;}
  .title{font-weight:bold;letter-spacing:1px;}
  button.btn{font-family:inherit;cursor:pointer;background:#2a2d4d;color:var(--ink);
    border:3px solid #565c8c;border-radius:6px;padding:10px 12px;font-size:14px;
    margin:3px;min-width:78px;}
  button.btn:hover{background:#383d63;}
  button.btn:disabled{opacity:.4;cursor:default;}
  button.btn.sel{outline:3px solid var(--accent);}
  /* dialog */
  #dialog{position:absolute;left:8px;right:8px;bottom:8px;display:none;
    background:rgba(12,13,28,.96);border:4px solid #565c8c;border-radius:8px;
    padding:12px 14px;min-height:62px;font-size:15px;line-height:1.4;pointer-events:auto;z-index:30;}
  #dialog.show{display:block;}
  #dialog .more{position:absolute;right:10px;bottom:6px;color:var(--accent);
    animation:blink 1s steps(2) infinite;}
  @keyframes blink{50%{opacity:0;}}
  /* touch controls */
  #touch{position:absolute;inset:0;display:none;pointer-events:none;z-index:20;}
  #touch.show{display:block;}
  .dpad{position:absolute;left:14px;bottom:18px;width:148px;height:148px;}
  .dbtn{position:absolute;width:48px;height:48px;background:rgba(60,66,110,.78);
    border:3px solid #8189c4;border-radius:8px;color:#fff;font-size:20px;
    display:flex;align-items:center;justify-content:center;pointer-events:auto;user-select:none;}
  .dbtn:active{background:rgba(120,128,200,.9);}
  .d-up{left:50px;top:0;} .d-dn{left:50px;top:100px;}
  .d-lf{left:0;top:50px;} .d-rt{left:100px;top:50px;}
  .abtns{position:absolute;right:14px;bottom:24px;}
  .abtn{width:64px;height:64px;border-radius:50%;background:rgba(123,224,164,.85);
    border:3px solid #fff;color:#10231a;font-weight:bold;font-size:16px;margin:6px;
    display:inline-flex;align-items:center;justify-content:center;pointer-events:auto;user-select:none;}
  .abtn.b{background:rgba(255,123,138,.85);color:#2a0d10;}
  .abtn:active{filter:brightness(1.2);}
  /* hud / credit */
  #credit{position:absolute;top:4px;left:6px;right:6px;font-size:9px;color:#9aa0cf;
    z-index:5;text-align:center;pointer-events:none;line-height:1.2;}
  #hint{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;
    color:#7d83b3;z-index:5;pointer-events:none;}
  .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .hpbar{height:8px;background:#3a1d22;border:2px solid #000;border-radius:4px;overflow:hidden;width:140px;}
  .hpfill{height:100%;background:var(--accent);transition:width .25s;}
  .xpbar{height:5px;background:#1d2233;border:1px solid #000;width:140px;margin-top:2px;}
  .xpfill{height:100%;background:#6fa8ff;}
  .small{font-size:12px;color:#aeb4e0;}
  .center{text-align:center;}
  h1.menu{font-size:22px;margin:6px 0;color:var(--accent);text-shadow:2px 2px #000;}
  .typechip{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;
    border:1px solid #000;margin-left:4px;color:#10131f;font-weight:bold;}
  .list{max-height:220px;overflow:auto;width:300px;}
  .listitem{display:flex;justify-content:space-between;align-items:center;
    padding:6px 8px;border:2px solid #3a3f63;border-radius:6px;margin:3px 0;background:#191b30;cursor:pointer;}
  .listitem.sel{outline:3px solid var(--accent);}
  .flash{animation:fl .2s 3;}
  @keyframes fl{50%{opacity:.25;}}
</style>
</head>

<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="credit">포켓몬에서 영감 — © Nintendo / Game Freak / The Pokémon Company. 오리지널 구현 (Lumigrove)</div>
    <div id="hint"></div>

    <!-- battle / menu overlays -->
    <div id="ovTitle" class="overlay"></div>
    <div id="ovBattle" class="overlay"></div>
    <div id="ovMenu" class="overlay"></div>

    <!-- dialog -->
    <div id="dialog"><span id="dlgText"></span><span class="more">▼</span></div>

    <!-- touch -->
    <div id="touch">
      <div class="dpad">
        <div class="dbtn d-up" data-dir="up">▲</div>
        <div class="dbtn d-dn" data-dir="down">▼</div>
        <div class="dbtn d-lf" data-dir="left">◀</div>
        <div class="dbtn d-rt" data-dir="right">▶</div>
      </div>
      <div class="abtns">
        <div class="abtn" data-act="A">A</div>
        <div class="abtn b" data-act="B">B</div>
      </div>
    </div>
  </div>

const TILE = 16;           // logical tile size in pixels
const VIEW_W = 15, VIEW_H = 11; // tiles shown
const SCREEN_W = VIEW_W * TILE; // 240
const SCREEN_H = VIEW_H * TILE; // 176

// ---------- scaling to fit device ----------
const stage = document.getElementById('stage');
const cv = document.getElementById('game');
cv.width = SCREEN_W; cv.height = SCREEN_H;
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

let isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || window.innerWidth < 700;

function fit(){
  const margin = isTouch ? 0 : 24;
  const availW = window.innerWidth - margin;
  const availH = window.innerHeight - margin;
  let scale = Math.floor(Math.min(availW/SCREEN_W, availH/SCREEN_H));
  if(scale < 1) scale = Math.min(availW/SCREEN_W, availH/SCREEN_H);
  scale = Math.max(scale, 1);
  const w = SCREEN_W*scale, h = SCREEN_H*scale;
  stage.style.width = w+'px'; stage.style.height = h+'px';
  cv.style.width = w+'px'; cv.style.height = h+'px';
}
window.addEventListener('resize', fit);

};

  Verdant:{Tide:2, Stone:2, Ember:.5, Verdant:.5, Gale:.5},

  Spark:  {Tide:2, Gale:2, Stone:.5, Spark:.5, Verdant:.5},

  Gale:   {Verdant:2, Stone:2, Spark:.5, Gale:.5},
  Normal: {Stone:.5},
};
function eff(atk, def){
  const r = EFF[atk]; if(!r) return 1;
  return (def in r) ? r[def] : 1;
}

// ============================================================
//  CREATURE INSTANCE
// ============================================================
function statAt(base, lv){ return Math.floor(base * (1 + (lv-1)*0.12)); }
function maxHpAt(species, lv){ return Math.floor(SPECIES[species].baseHP * (1 + (lv-1)*0.10)) + 5; }
function xpForLevel(lv){ return Math.floor(8 * lv * lv); } // cumulative-ish per level need

function makeCreature(speciesKey, lv, wild){
  const sp = SPECIES[speciesKey];
  const c = {
    species: speciesKey, name: sp.name, type: sp.type, lv,
    xp: 0, wild: !!wild,
    moves: sp.moves.map(m => ({name:m[0], type:m[1], power:m[2]})),
  };
  c.maxHp = maxHpAt(speciesKey, lv);
  c.hp = c.maxHp;
  c.atk = statAt(sp.atk, lv);
  c.def = statAt(sp.def, lv);
  c.spd = statAt(sp.spd, lv);
  // apply learned moves up to lv
  applyLearnset(c);
  return c;
}
function applyLearnset(c){
  const sp = SPECIES[c.species];
  if(!sp.learn) return;
  for(const lvStr in sp.learn){
    const lv = parseInt(lvStr,10);
    if(c.lv >= lv){
      const m = sp.learn[lvStr];
      if(!c.moves.find(x=>x.name===m[0])){
        const nm = {name:m[0], type:m[1], power:m[2]};
        if(c.moves.length < 4) c.moves.push(nm);
        else c.moves[3] = nm; // replace last
      }
    }
  }
}
function recalcStats(c){
  const sp = SPECIES[c.species];
  c.maxHp = maxHpAt(c.species, c.lv);
  c.atk = statAt(sp.atk, c.lv);
  c.def = statAt(sp.def, c.lv);
  c.spd = statAt(sp.spd, c.lv);
}

// Build numeric grid; map letters
const MAP = [];
for(let y=0;y<MAP_H;y++){
  const row=[];
  const line = RAW[y] || ("2".repeat(MAP_W));
  for(let x=0;x<MAP_W;x++){
    let ch = line[x] || '2';
    if(ch==='a') ch='4';
    row.push(parseInt(ch,10));
  }
  MAP.push(row);
}
function tileAt(x,y){
  if(y<0||y>=MAP_H||x<0||x>=MAP_W) return 2;
  return MAP[y][x];
}
const BLOCKING = new Set([2,3,5,6,9]);
function isBlocked(x,y){ return BLOCKING.has(tileAt(x,y)); }

// ============================================================

// ============================================================
function camOffset(){
  let cx = G.player.x - Math.floor(VIEW_W/2);
  let cy = G.player.y - Math.floor(VIEW_H/2);
  cx = Math.max(0, Math.min(cx, MAP_W-VIEW_W));
  cy = Math.max(0, Math.min(cy, MAP_H-VIEW_H));
  return {cx,cy};
}
function drawTile(px,py,t){
  // base
  let base = '#5aa14a';
  if(t===3) base='#3a78c0';
  ctx.fillStyle = base;
  ctx.fillRect(px,py,TILE,TILE);
  switch(t){
    case 0: case 7: case 8: // grass variants
      ctx.fillStyle='#69b556';
      for(let i=0;i<4;i++){ ctx.fillRect(px+(i*4+2)%TILE, py+((i*5+3)%TILE), 2,2); }
      if(t===7){ ctx.fillStyle='#ff8ad1'; ctx.fillRect(px+5,py+5,3,3); ctx.fillStyle='#ffe04a'; ctx.fillRect(px+6,py+6,1,1); }
      if(t===8){ ctx.fillStyle='#9be8b0'; ctx.fillRect(px+4,py+4,8,8); ctx.fillStyle='#fff'; ctx.fillRect(px+7,py+5,2,6); ctx.fillRect(px+5,py+7,6,2); }
      break;
    case 1: // tall grass
      ctx.fillStyle='#3f8a3a'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#56a94c';
      for(let i=0;i<TILE;i+=3){ ctx.fillRect(px+i, py+4+((i)%3), 2, 12); }
      ctx.fillStyle='#2f6b2a';
      for(let i=1;i<TILE;i+=4){ ctx.fillRect(px+i, py+8, 1, 8); }
      break;
    case 2: // tree
      ctx.fillStyle='#3a78c0'; // (unused) keep base grassy under
      ctx.fillStyle='#5aa14a'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#6b4a2a'; ctx.fillRect(px+6,py+9,4,7);
      ctx.fillStyle='#2e6e2c'; ctx.beginPath?0:0;
      ctx.fillRect(px+3,py+2,10,9);
      ctx.fillStyle='#3f8a3a'; ctx.fillRect(px+4,py+1,8,4);
      ctx.fillStyle='#256022'; ctx.fillRect(px+3,py+8,10,2);
      break;
    case 3: // water
      ctx.fillStyle='#3a78c0'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#5a98e0';
      ctx.fillRect(px+2,py+3+((G.walkFrame)%2),6,1);
      ctx.fillRect(px+8,py+9-((G.walkFrame)%2),5,1);
      break;
    case 4: // path
      ctx.fillStyle='#c8b48a'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#b8a378';
      ctx.fillRect(px+2,py+2,2,2); ctx.fillRect(px+10,py+8,2,2);
      break;
    case 5: // sign
      ctx.fillStyle='#5aa14a'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#8a5a2a'; ctx.fillRect(px+3,py+2,10,7);
      ctx.fillStyle='#6b4a2a'; ctx.fillRect(px+7,py+9,2,6);
      ctx.fillStyle='#e8d8b0'; ctx.fillRect(px+4,py+3,8,5);
      ctx.fillStyle='#5a4a30'; ctx.fillRect(px+5,py+4,6,1); ctx.fillRect(px+5,py+6,4,1);
      break;
    case 6: // house
      ctx.fillStyle='#5aa14a'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#c05a3a'; ctx.fillRect(px+1,py+1,14,6); // roof
      ctx.fillStyle='#e8d8c0'; ctx.fillRect(px+2,py+7,12,8); // wall
      ctx.fillStyle='#6b4a2a'; ctx.fillRect(px+6,py+9,4,6); // door
      ctx.fillStyle='#8ad8ff'; ctx.fillRect(px+3,py+9,2,2); ctx.fillRect(px+11,py+9,2,2);
      break;
    case 9: // shop
      ctx.fillStyle='#5aa14a'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#3a6ac0'; ctx.fillRect(px+1,py+1,14,6);
      ctx.fillStyle='#e8e0d0'; ctx.fillRect(px+2,py+7,12,8);
      ctx.fillStyle='#6b4a2a'; ctx.fillRect(px+6,py+9,4,6);
      ctx.fillStyle='#ffe04a'; ctx.fillRect(px+3,py+8,3,3); // sign light
      break;
  }
}
function drawSprite12(spec, dx, dy, scale){
  const sp = SPECIES[spec].sprite;
  const pal = Object.assign({}, PAL_COMMON, sp.pal);
  for(let y=0;y<12;y++){
    const row = sp.rows[y];
    for(let x=0;x<12;x++){
      const ch = row[x];
      const col = pal[ch];
      if(!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(dx + x*scale, dy + y*scale, scale, scale);
    }
  }
}
function drawPlayer(px,py){
  const f = G.walkFrame%2;
  // body
  ctx.fillStyle='#3a4a8a'; ctx.fillRect(px+4,py+7,8,7);   // torso
  ctx.fillStyle='#e8c08a'; ctx.fillRect(px+5,py+2,6,5);   // face
  ctx.fillStyle='#c0302a'; ctx.fillRect(px+4,py+1,8,3);   // cap
  ctx.fillStyle='#c0302a'; ctx.fillRect(px+3,py+2,2,1);   // cap brim by dir
  // eyes by dir
  ctx.fillStyle='#1a1326';
  if(G.player.dir==='down'){ ctx.fillRect(px+6,py+4,1,1); ctx.fillRect(px+9,py+4,1,1); }
  else if(G.player.dir==='up'){ /* back */ ctx.fillStyle='#7a5a3a'; ctx.fillRect(px+5,py+3,6,3); }
  else if(G.player.dir==='left'){ ctx.fillRect(px+6,py+4,1,1); }
  else { ctx.fillRect(px+9,py+4,1,1); }
  // legs (animate)
  ctx.fillStyle='#2a2a40';
  if(f===0){ ctx.fillRect(px+4,py+14,3,2); ctx.fillRect(px+9,py+14,3,2);}
  else { ctx.fillRect(px+5,py+14,3,2); ctx.fillRect(px+8,py+14,3,2);}
}
function drawNPC(px,py,t){
  ctx.fillStyle='#5a3a8a'; ctx.fillRect(px+4,py+7,8,7);
  ctx.fillStyle='#e8c08a'; ctx.fillRect(px+5,py+2,6,5);
  ctx.fillStyle='#2a8a4a'; ctx.fillRect(px+4,py+1,8,3);
  ctx.fillStyle='#1a1326'; ctx.fillRect(px+6,py+4,1,1); ctx.fillRect(px+9,py+4,1,1);
  ctx.fillStyle='#2a2a40'; ctx.fillRect(px+4,py+14,3,2); ctx.fillRect(px+9,py+14,3,2);
}

function renderOverworld(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,SCREEN_W,SCREEN_H);
  const {cx,cy} = camOffset();
  for(let y=0;y<VIEW_H;y++){
    for(let x=0;x<VIEW_W;x++){
      const mx=cx+x, my=cy+y;
      drawTile(x*TILE, y*TILE, tileAt(mx,my));
    }
  }
  // trainers
  for(const t of TRAINERS){
    if(t.beaten && t.captured) continue;
    const sx=(t.x-cx)*TILE, sy=(t.y-cy)*TILE;
    if(sx>=-TILE&&sx<SCREEN_W&&sy>=-TILE&&sy<SCREEN_H) drawNPC(sx,sy,t);
  }
  // player
  drawPlayer((G.player.x-cx)*TILE, (G.player.y-cy)*TILE);
}

const dlg = document.getElementById('dialog');
const dlgText = document.getElementById('dlgText');
let dlgQueue = [], dlgCb = null, dlgActive=false;
function say(lines, cb){
  if(typeof lines==='string') lines=[lines];
  dlgQueue = lines.slice(); dlgCb = cb||null; dlgActive=true;
  nextDlg();
}
dlg.addEventListener('click', ()=>{ if(dlgActive) nextDlg(); });
function nextDlg(){
  if(dlgQueue.length===0){
    dlg.classList.remove('show'); dlgActive=false;
    const cb=dlgCb; dlgCb=null;
    if(cb) cb();
    return;
  }
  dlgText.textContent = dlgQueue.shift();
  dlg.classList.add('show');
}

let inputLock=false;
function startOverworld(){
  G.scene='overworld';
  if(isTouch){ const tc=document.getElementById('touch'); if(tc) tc.style.display='block'; }
  updateHint();
  loop();
}
function updateHint(){
  const h=document.getElementById('hint');
  if(G.scene==='overworld')
    h.textContent = isTouch? '메뉴: A를 멈춰서 누름' : 'P:파티  Z:확인  ←↑↓→ 이동';
  else h.textContent='';
}
const DIRV = {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function tryMove(dir){
  if(G.scene!=='overworld'||inputLock||dlgActive) return;
  G.player.dir=dir;
  const [dx,dy]=DIRV[dir];
  const nx=G.player.x+dx, ny=G.player.y+dy;
  // trainer block / engage
  const tr = TRAINERS.find(t=>t.x===nx&&t.y===ny&&!t.beaten);
  if(tr){ engageTrainer(tr); return; }
  if(isBlocked(nx,ny)){
    // sign/shop interact handled by A; movement just blocked
    G.walkFrame^=1; return;
  }
  if(TRAINERS.find(t=>t.x===nx&&t.y===ny)){ G.walkFrame^=1; return; } // beaten trainer still stands
  G.player.x=nx; G.player.y=ny; G.player.steps++; G.walkFrame^=1;
  // heal tile
  if(tileAt(nx,ny)===8){ healParty(); say('따스한 빛이 크리처들을 회복시켰다!'); }
  // encounter
  if(tileAt(nx,ny)===1 && Math.random()<0.18){ startWildBattle(); }
}
function interact(){
  if(G.scene!=='overworld'||dlgActive){ if(dlgActive) nextDlg(); return; }
  const [dx,dy]=DIRV[G.player.dir];
  const fx=G.player.x+dx, fy=G.player.y+dy;
  const t=tileAt(fx,fy);
  // trainer
  const tr=TRAINERS.find(x=>x.x===fx&&x.y===fy);
  if(tr && !tr.beaten){ engageTrainer(tr); return; }
  if(tr && tr.beaten){ say(`${tr.name}: 좋은 승부였어!`); return; }
  if(t===5 || SIGNS[`${fx},${fy}`]){ say(SIGNS[`${fx},${fy}`]||'표지판: 풀숲 주의!'); return; }
  if(t===6){ say('집 문은 잠겨 있다.'); return; }
  if(t===9){ openShop(); return; }
  // otherwise open menu (esp touch)
  openMenu();
}
function healParty(){ G.party.forEach(c=>{ c.hp=c.maxHp; }); }

const ovBattle = document.getElementById('ovBattle');
let B = null; // battle state
function activeMon(){ return G.party.find(c=>c.hp>0); }

function startWildBattle(){
  const rare = Math.random()<0.25;
  const pool = rare? WILD_GRASS_RARE : WILD_GRASS;
  const sp = pool[Math.floor(Math.random()*pool.length)];
  const lv = 3 + Math.floor(Math.random()* (rare?6:4)) + Math.floor(G.player.steps/120);
  const foe = makeCreature(sp, Math.max(3,lv), true);
  beginBattle(foe, null);
}
function engageTrainer(tr){
  if(tr.beaten){ return; }
  G.player.dir = (tr.y>G.player.y)?'down':(tr.y<G.player.y)?'up':(tr.x>G.player.x)?'right':'left';
  say([`${tr.name}: ${tr.msg}`], ()=>{
    const team = tr.team.map(([s,l])=>makeCreature(s,l,false));
    beginBattle(team[0], {tr, team, idx:0});
  });
}

function beginBattle(foe, trainer){
  // guarantee the player has at least one usable creature
  if(G.party.length===0){ G.party.push(makeCreature(STARTERS[0],5,false)); G.dex.add(STARTERS[0]); }
  if(!activeMon()){ healParty(); }
  G.scene='battle';
  B = { foe, you: activeMon(), trainer, menu:'main', busy:false,
        canCatch: !trainer, log:[] };
  renderBattle();
  const intro = trainer? `${trainer.tr.name}이(가) ${foe.name}을(를) 내보냈다!`
                       : `앗! 야생 ${foe.name}이(가) 나타났다!`;
  battleSay([intro, `가라, ${B.you.name}!`], ()=>{ B.menu='main'; renderBattle(); });
}

let bsQueue=[], bsCb=null, bsCur='';
function battleSay(lines, cb){
  if(typeof lines==='string') lines=[lines];
  bsQueue=lines.slice(); bsCb=cb||null; B.busy=true; B.menu='msg';
  // show first line, then full render once (DOM rebuild preserves bsCur)
  bsCur = bsQueue.length? bsQueue.shift() : '';
  renderBattle();
}
// called when player advances the message box
function advanceBS(){
  if(bsQueue.length>0){
    bsCur = bsQueue.shift();
    const el=document.getElementById('bMsg');
    if(el) el.textContent = bsCur;   // update in place, no full rebuild
    return;
  }
  // queue empty -> end of this message group
  B.busy=false; bsCur='';
  const cb=bsCb; bsCb=null;
  if(cb) cb();
}

function hpColor(c){ const r=c.hp/c.maxHp; return r>0.5?'#7be0a4':r>0.2?'#ffd24a':'#ff7b8a'; }

function renderBattle(keepMsg){
  const you=B.you, foe=B.foe;
  let html = `<div class="box" style="width:96%;max-width:340px;padding:8px">`;
  // arena canvas
  html += `<canvas id="bArena" width="320" height="150" style="width:100%;image-rendering:pixelated;border:3px solid #2a2d4d;border-radius:6px;background:linear-gradient(#bfe0ff,#9be8b0)"></canvas>`;
  // info bars
  html += `<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:12px">
    <div><b>${foe.name}</b> Lv${foe.lv} <span class="typechip" style="background:${TYPES[foe.type].col}">${TYPES[foe.type].ko}</span>
      <div class="hpbar"><div class="hpfill" style="width:${100*foe.hp/foe.maxHp}%;background:${hpColor(foe)}"></div></div></div>
    <div style="text-align:right"><b>${you.name}</b> Lv${you.lv}
      <div class="hpbar" style="margin-left:auto"><div class="hpfill" style="width:${100*you.hp/you.maxHp}%;background:${hpColor(you)}"></div></div>
      <div class="small">${you.hp}/${you.maxHp}</div></div>
  </div>`;
  // menu / message
  if(B.menu==='main'){
    html += `<div class="row" style="margin-top:6px">
      <button class="btn" id="mFight">싸운다</button>
      <button class="btn" id="mBag">가방</button>
      <button class="btn" id="mParty">파티</button>
      <button class="btn" id="mRun" ${B.trainer?'disabled':''}>${B.trainer?'못 도망':'도망'}</button>
    </div>`;
  } else if(B.menu==='fight'){
    html += `<div class="row" style="margin-top:6px">
      ${you.moves.map((m,i)=>`<button class="btn" data-mv="${i}" style="min-width:120px">${m.name}<br><span class="typechip" style="background:${TYPES[m.type].col}">${TYPES[m.type].ko}</span> <span class="small">${m.power||'-'}</span></button>`).join('')}
      <button class="btn" id="mBack">↩ 뒤로</button></div>`;
  } else if(B.menu==='bag'){
    html += `<div class="row" style="margin-top:6px">
      ${Object.entries(G.bag).map(([k,v])=>`<button class="btn" data-item="${k}" ${v<=0?'disabled':''}>${k} x${v}</button>`).join('')}
      <button class="btn" id="mBack">↩ 뒤로</button></div>`;
  } else if(B.menu==='party'){
    html += `<div class="list">${G.party.map((c,i)=>`<div class="listitem" data-sw="${i}">
      <span>${c.name} Lv${c.lv} ${c===you?'(전투중)':''}</span>
      <span class="small">${c.hp}/${c.maxHp}</span></div>`).join('')}</div>
      <button class="btn" id="mBack">↩ 뒤로</button>`;
  } else { // msg
    html += `<div style="margin-top:6px;min-height:40px;background:#10131f;border:3px solid #565c8c;border-radius:6px;padding:8px;font-size:14px;cursor:pointer" id="bMsgWrap"><span id="bMsg">${bsCur||''}</span><span class="more">▼</span></div>`;
  }
  html += `</div>`;
  ovBattle.innerHTML = html; ovBattle.classList.add('show');
  drawArena();
  wireBattle();
}
function drawArena(){
  const c=document.getElementById('bArena'); if(!c)return;
  const a=c.getContext('2d'); a.imageSmoothingEnabled=false;
  a.clearRect(0,0,320,150);
  // ground platforms
  a.fillStyle='#7bc86a'; a.beginPath();
  a.ellipse?a.ellipse(240,52,46,12,0,0,7):0; a.fill?a.fill():0;
  a.fillStyle='#6ab85a'; if(a.ellipse){a.beginPath();a.ellipse(80,128,60,16,0,0,7);a.fill();}
  // foe sprite (top-right)
  if(B.foe.hp>0) drawSpriteTo(a, B.foe.species, 240-36, 8, 6);
  // your sprite (bottom-left, bigger back-ish)
  if(B.you.hp>0) drawSpriteTo(a, B.you.species, 80-42, 70, 7);
}

function wireBattle(){
  const $=id=>document.getElementById(id);
  if(B.menu==='msg'){
    const wrap=$('bMsgWrap'); if(wrap) wrap.onclick=()=>{ if(B && B.menu==='msg') advanceBS(); };
    return;
  }
  if(B.menu==='main'){
    $('mFight').onclick=()=>{B.menu='fight';renderBattle();};
    $('mBag').onclick=()=>{B.menu='bag';renderBattle();};
    $('mParty').onclick=()=>{B.menu='party';renderBattle();};
    $('mRun').onclick=()=>{ if(B.trainer)return; tryRun(); };
  } else if(B.menu==='fight'){
    ovBattle.querySelectorAll('button[data-mv]').forEach(b=>b.onclick=()=>playerMove(parseInt(b.dataset.mv)));
    $('mBack').onclick=()=>{B.menu='main';renderBattle();};
  } else if(B.menu==='bag'){
    ovBattle.querySelectorAll('button[data-item]').forEach(b=>b.onclick=()=>useItem(b.dataset.item));
    $('mBack').onclick=()=>{B.menu='main';renderBattle();};
  } else if(B.menu==='party'){
    ovBattle.querySelectorAll('div[data-sw]').forEach(d=>d.onclick=()=>switchMon(parseInt(d.dataset.sw)));
    $('mBack').onclick=()=>{B.menu='main';renderBattle();};
  }
}

function damageCalc(att, defn, move){
  if(!move.power) return {dmg:0, mult:1, miss:false};
  const mult = eff(move.type, defn.type);
  const stab = (move.type===att.type)?1.3:1;
  const variance = 0.85 + Math.random()*0.3;
  let dmg = ((att.atk*2*move.power/25)/Math.max(1,defn.def))*0.6 + 2;
  dmg = Math.max(1, Math.floor(dmg*mult*stab*variance));
  return {dmg, mult};
}
function effText(m){ return m===0?'효과가 없는 것 같다…': m>=2?'효과가 굉장했다!': m<=0.5?'효과가 별로인 듯하다…':''; }

function playerMove(i){
  if(B.busy) return;
  const move=B.you.moves[i];
  // decide order by speed
  const youFirst = B.you.spd >= B.foe.spd;
  const seq = youFirst? ['you','foe'] : ['foe','you'];
  runTurn(seq, move);
}
function foeChooseMove(){
  // simple AI: prefer super-effective
  const ms=B.foe.moves.filter(m=>m.power>0);
  let best=ms[0], bestE=-1;
  for(const m of ms){ const e=eff(m.type,B.you.type); if(e>bestE){bestE=e;best=m;} }
  return best || B.foe.moves[0];
}
function runTurn(seq, yourMove){
  B.busy=true;
  const foeMove=foeChooseMove();
  const steps=[];
  for(const who of seq){
    if(who==='you') steps.push((cb)=>doAttack(B.you,B.foe,yourMove,'you',cb));
    else steps.push((cb)=>doAttack(B.foe,B.you,foeMove,'foe',cb));
  }
  // run sequential with KO checks
  function run(idx){
    if(idx>=steps.length){ endTurn(); return; }
    steps[idx](()=>{
      // check KO
      if(B.foe.hp<=0){ onFoeFaint(); return; }
      if(B.you.hp<=0){ onYouFaint(); return; }
      run(idx+1);
    });
  }
  run(0);
}
function doAttack(att, defn, move, side, done){
  const lines=[`${att.name}의 ${move.name}!`];
  if(move.power===0){
    // status / heal move
    if(move.name.includes('회복')||move.name.includes('광합성')){
      const heal=Math.floor(att.maxHp*0.4); att.hp=Math.min(att.maxHp,att.hp+heal);
      lines.push(`${att.name}이(가) 체력을 회복했다!`);
    } else { lines.push('하지만 큰 효과는 없었다…'); }
    battleSay(lines, done); return;
  }
  const {dmg,mult}=damageCalc(att,defn,move);
  defn.hp=Math.max(0,defn.hp-dmg);
  const et=effText(mult);
  if(et) lines.push(et);
  battleSay(lines, ()=>{ done&&done(); });
}
function endTurn(){
  if(B.you.hp<=0){ onYouFaint(); return; }
  if(B.foe.hp<=0){ onFoeFaint(); return; }
  B.busy=false; B.menu='main'; renderBattle();
}

function onFoeFaint(){
  const foe=B.foe;
  // xp gain
  const gain = Math.floor((SPECIES[foe.species].baseHP/6 + foe.lv*4) * (B.trainer?1.5:1));
  battleSay([`적 ${foe.name}을(를) 쓰러뜨렸다!`, `${B.you.name}은(는) 경험치 ${gain}을(를) 얻었다!`], ()=>{
    gainXP(B.you, gain, ()=>{
      if(B.trainer){ trainerNext(); }
      else { endBattle(); }
    });
  });
}
function trainerNext(){
  const t=B.trainer; t.idx++;
  if(t.idx>=t.team.length){
    t.tr.beaten=true;
    const reward = 2;
    G.bag['포획볼'] = (G.bag['포획볼']||0)+reward;
    battleSay([`${t.tr.name}을(를) 이겼다!`,`상으로 포획볼 ${reward}개를 받았다.`], endBattle);
  } else {
    B.foe = t.team[t.idx];
    battleSay([`${t.tr.name}이(가) ${B.foe.name}을(를) 내보냈다!`], ()=>{ B.menu='main'; renderBattle(); });
  }
}
function onYouFaint(){
  battleSay([`${B.you.name}은(는) 쓰러졌다!`], ()=>{
    const next=G.party.find(c=>c.hp>0);
    if(next){ B.you=next; battleSay([`가라, ${next.name}!`], ()=>{B.menu='main';renderBattle();}); }
    else { battleSay(['눈앞이 캄캄해졌다…','마을에서 정신을 차렸다.'], ()=>{
      healParty(); G.player.x=5; G.player.y=5; G.player.dir='down'; endBattle(); }); }
  });
}
function gainXP(c, amount, done){
  c.xp += amount;
  let leveled=false, evolveTo=null;
  while(c.xp >= xpForLevel(c.lv+1) && c.lv<50){
    c.xp -= xpForLevel(c.lv+1);
    c.lv++;
    leveled=true;
    const oldMax=c.maxHp; recalcStats(c); c.hp += (c.maxHp-oldMax);
    applyLearnset(c);
    const sp=SPECIES[c.species];
    if(sp.evolveTo && sp.evolveLv && c.lv>=sp.evolveLv){ evolveTo=sp.evolveTo; }
  }
  if(leveled){
    battleSay([`${c.name}은(는) 레벨 ${c.lv}이(가) 되었다!`], ()=>{
      if(evolveTo){
        const from=c.name;
        c.species=evolveTo; c.name=SPECIES[evolveTo].name; c.type=SPECIES[evolveTo].type;
        recalcStats(c); applyLearnset(c); G.dex.add(evolveTo);
        battleSay([`어라…?`, `${from}이(가) ${c.name}(으)로 진화했다!`], done);
      } else done&&done();
    });
  } else done&&done();
}

function tryRun(){
  if(B.trainer) return;
  const chance = 0.5 + 0.3*(B.you.spd>=B.foe.spd?1:0);
  if(Math.random()<chance){ battleSay(['무사히 도망쳤다!'], endBattle); }
  else { battleSay(['도망칠 수 없었다!'], ()=>{ const m=foeChooseMove(); doAttack(B.foe,B.you,m,'foe',()=>{ if(B.you.hp<=0) onYouFaint(); else { B.busy=false;B.menu='main';renderBattle(); } }); }); }
}
function useItem(item){
  if((G.bag[item]||0)<=0) return;
  if(item==='회복약'){
    if(B.you.hp>=B.you.maxHp){ battleSay(['이미 체력이 가득 찼다.'],()=>{B.menu='main';renderBattle();}); return; }
    G.bag[item]--; const heal=40; B.you.hp=Math.min(B.you.maxHp,B.you.hp+heal);
    battleSay([`${B.you.name}의 체력을 ${heal} 회복했다!`], ()=>{ foeFreeTurn(); });
  } else if(item==='포획볼'){
    if(!B.canCatch){ battleSay(['트레이너의 크리처는 잡을 수 없다!'],()=>{B.menu='main';renderBattle();}); return; }
    G.bag[item]--; attemptCatch();
  }
}
function foeFreeTurn(){
  const m=foeChooseMove();
  doAttack(B.foe,B.you,m,'foe',()=>{ if(B.you.hp<=0) onYouFaint(); else { B.busy=false;B.menu='main';renderBattle(); } });
}
function attemptCatch(){
  const foe=B.foe;
  const hpFactor = 1 - foe.hp/foe.maxHp; // lower hp -> easier
  const base = SPECIES[foe.species].catchRate;
  const p = Math.min(0.95, base + hpFactor*0.55 + 0.05);
  battleSay(['포획볼을 던졌다!','...','...'], ()=>{
    if(Math.random()<p){
      G.dex.add(foe.species);
      const caught = makeCreature(foe.species, foe.lv, false);
      caught.hp = foe.hp; caught.xp = 0;
      if(G.party.length<6) G.party.push(caught); else G.box.push(caught);
      const where = G.party.length<=6 && G.party[G.party.length-1]===caught ? '파티에' : '보관함으로';
      battleSay([`해냈다! ${foe.name}을(를) 잡았다!`, `${foe.name}을(를) ${G.party.length<=6?'파티에':'보관함으로'} 넣었다.`], endBattle);
    } else {
      battleSay(['아쉽다! 크리처가 튀어나왔다!'], ()=>{ foeFreeTurn(); });
    }
  });
}
function switchMon(i){
  const c=G.party[i];
  if(c.hp<=0){ battleSay([`${c.name}은(는) 싸울 수 없다!`],()=>{B.menu='party';renderBattle();}); return; }
  if(c===B.you){ B.menu='main'; renderBattle(); return; }
  B.you=c;
  battleSay([`돌아와! 가라, ${c.name}!`], ()=>{ foeFreeTurn(); });
}
function endBattle(){
  ovBattle.classList.remove('show'); B=null; G.scene='overworld'; updateHint();
}

  body.querySelectorAll('canvas.dc').forEach(c=>{ if(G.dex.has(c.dataset.st)) drawSpriteTo(c.getContext('2d'),c.dataset.st,2,2,3); });

const heldKeys={};
window.addEventListener('keydown', e=>{
  const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
  if(G.scene==='title') return;
  if(dlgActive){ if(k==='z'||k==='Z'||k==='Enter'||k===' ') nextDlg(); return; }
  if(G.scene==='battle'){
    if(B&&B.menu==='msg'&&(k==='z'||k==='Z'||k==='Enter'||k===' ')){ advanceBS(); }
    if(k==='x'||k==='X'){ if(B&&['fight','bag','party'].includes(B.menu)){B.menu='main';renderBattle();} }
    return;
  }
  if(G.scene==='overworld'){
    if(k==='ArrowUp') tryMove('up');
    else if(k==='ArrowDown') tryMove('down');
    else if(k==='ArrowLeft') tryMove('left');
    else if(k==='ArrowRight') tryMove('right');
    else if(k==='z'||k==='Z'||k==='Enter') interact();
    else if(k==='p'||k==='P') { if(ovMenu.classList.contains('show')) closeMenu(); else openMenu(); }
    else if(k==='x'||k==='X') closeMenu();
  }
});

// touch controls
let moveTimer=null;
function bindTouch(){
  document.querySelectorAll('.dbtn').forEach(b=>{
    const dir=b.dataset.dir;
    const start=e=>{ e.preventDefault(); tryMove(dir);
      clearInterval(moveTimer); moveTimer=setInterval(()=>tryMove(dir),180); };
    const stop=e=>{ e&&e.preventDefault(); clearInterval(moveTimer); };
    b.addEventListener('touchstart',start,{passive:false});
    b.addEventListener('touchend',stop); b.addEventListener('touchcancel',stop);
    b.addEventListener('mousedown',start); b.addEventListener('mouseup',stop); b.addEventListener('mouseleave',stop);
  });
  document.querySelectorAll('.abtn').forEach(b=>{
    const act=b.dataset.act;
    const h=e=>{ e.preventDefault();
      if(dlgActive){ nextDlg(); return; }
      if(G.scene==='battle'){ if(act==='A'&&B&&B.menu==='msg') advanceBS(); else if(act==='B'&&B&&['fight','bag','party'].includes(B.menu)){B.menu='main';renderBattle();} return; }
      if(G.scene==='overworld'){ if(act==='A') interact(); else { if(ovMenu.classList.contains('show'))closeMenu(); else openMenu(); } }
    };
    b.addEventListener('touchstart',h,{passive:false});
    b.addEventListener('click',h);
  });
}

function boot(){
  fit();
  if(isTouch){ document.getElementById('touch').classList.add('show'); }
  bindTouch();
  resetTrainers();
  showTitle();
  requestAnimationFrame(loop);
