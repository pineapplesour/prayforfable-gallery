/* ---------- Canvas / scaling ---------- */
const BASE_W = 320, BASE_H = 288;       // internal pixel resolution (10x9 tiles @32px)
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
let SCALE = 2;
function fit(){
  const pad = 8;
  const availW = window.innerWidth - pad, availH = window.innerHeight - pad;
  // leave room for touch controls on small screens
  const touchRoom = (window.innerWidth < 760) ? 180 : 0;
  const s = Math.max(1, Math.floor(Math.min(availW/BASE_W, (availH-touchRoom)/BASE_H)));
  SCALE = s;
  cv.width = BASE_W; cv.height = BASE_H;
  cv.style.width = (BASE_W*s)+'px';
  cv.style.height = (BASE_H*s)+'px';
  ctx.imageSmoothingEnabled = false;
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0 || window.innerWidth<760;
  document.getElementById('touch').style.display = isTouch ? 'flex' : 'none';
}
window.addEventListener('resize', fit);

/* ---------- Stat / leveling math ---------- */
function statAt(species, stat, lv){
  const b = SPECIES[species].base[stat];
  if(stat==='hp') return Math.floor(b + b*0.09*lv + lv*2 + 8);
  return Math.floor(b + b*0.06*lv + lv);
}
function xpForLevel(lv){ return Math.floor(8*lv*lv + 12*lv); } // total xp to reach lv from 1-ish curve
function xpToNext(lv){ return Math.floor(6 + lv*lv*1.2 + lv*4); }
function movesAtLevel(species, lv){
  const set=[]; for(const [l,m] of SPECIES[species].learn){ if(l<=lv) set.push(m); }
  return set.slice(-4); // keep last 4 learned
}

/* ---------- Creature instance factory ---------- */
let UID=1;
function makeCreature(speciesId, lv){
  const s = SPECIES[speciesId];
  const c = {
    uid: UID++, species:speciesId, name:s.name, type:s.type, lv:lv,
    maxhp: statAt(speciesId,'hp',lv),
    moves: movesAtLevel(speciesId, lv),
    xp: 0,
  };
  c.hp = c.maxhp;
  c.atk = statAt(speciesId,'atk',lv);
  c.def = statAt(speciesId,'def',lv);
  c.spd = statAt(speciesId,'spd',lv);
  return c;
}
function recomputeStats(c){
  c.maxhp = statAt(c.species,'hp',c.lv);
  c.atk = statAt(c.species,'atk',c.lv);
  c.def = statAt(c.species,'def',c.lv);
  c.spd = statAt(c.species,'spd',c.lv);
  c.moves = movesAtLevel(c.species, c.lv);
}

// draw a creature sprite into ctx at (dx,dy) with pixel size ps, optional flip & frame bob
function drawCreature(c, dx, dy, ps, opt){
  opt = opt||{};
  const sp = SPECIES[c.species];
  const grid = SHAPES[sp.shape];
  const pal = sp.pal;
  const flip = opt.flip;
  const bob = opt.bob||0;
  ctx.save();
  ctx.translate(dx, dy+bob);
  for(let y=0;y<16;y++){
    const row = grid[y];
    for(let x=0;x<16;x++){
      const v = row.charCodeAt(x)-48;
      if(v===0) continue;
      const col = pal[v-1];
      const rx = flip ? (15-x) : x;
      ctx.fillStyle = col;
      ctx.fillRect(rx*ps, y*ps, ps, ps);
    }
  }
  ctx.restore();
}

const pressed={};   // edge-trigger
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
  if(!keys[k]) pressed[k]=true;
  keys[k]=true;
  // map z/x/enter/esc
  if(k==='Enter') { if(!keys['z']) pressed['z']=true; keys['z']=true; }
  if(k==='Escape'){ if(!keys['x']) pressed['x']=true; keys['x']=true; }
});
window.addEventListener('keyup',e=>{
  const k=e.key; keys[k]=false;
  if(k==='Enter') keys['z']=false;
  if(k==='Escape') keys['x']=false;
});
// touch buttons -> synth keys
function bindTouch(id){
  const el=document.getElementById(id); if(!el) return;
  const k=el.getAttribute('data-k');
  const dn=(ev)=>{ ev.preventDefault(); if(!keys[k]) pressed[k]=true; keys[k]=true; };
  const up=(ev)=>{ ev.preventDefault(); keys[k]=false; };
  el.addEventListener('touchstart',dn,{passive:false});
  el.addEventListener('touchend',up,{passive:false});
  el.addEventListener('touchcancel',up,{passive:false});
  el.addEventListener('mousedown',dn);
  el.addEventListener('mouseup',up);
  el.addEventListener('mouseleave',up);
}
['dU','dD','dL','dR','bA','bB'].forEach(bindTouch);
function consumePress(k){ if(pressed[k]){ pressed[k]=false; return true; } return false; }

function clear(col){ ctx.fillStyle=col||'#04080d'; ctx.fillRect(0,0,BASE_W,BASE_H); }
function text(s,x,y,col,size){
  ctx.fillStyle=col||'#dff3ff';

  ctx.fillText(s,x,y);
}
function textC(s,x,y,col,size){
  ctx.fillStyle=col||'#dff3ff';
  ctx.font=(size||10)+"px 'Courier New',monospace";
  ctx.textBaseline='top'; ctx.textAlign='center';
  ctx.fillText(s,x,y); ctx.textAlign='left';
}
function panel(x,y,w,h,fill){
  ctx.fillStyle=fill||'rgba(8,28,44,.95)';
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='#2a6f8f'; ctx.lineWidth=2;
  ctx.strokeRect(x+1,y+1,w-2,h-2);
  ctx.strokeStyle='#0a3a52'; ctx.lineWidth=1;
  ctx.strokeRect(x+3,y+3,w-6,h-6);
}
function bar(x,y,w,h,frac,col,bg){
  ctx.fillStyle=bg||'#05202e'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=col; ctx.fillRect(x,y,Math.max(0,Math.round(w*frac)),h);
  ctx.strokeStyle='#0a3a52'; ctx.strokeRect(x+.5,y+.5,w-1,h-1);
}

/* ---------- Tile drawing (procedural deep-sea) ---------- */
function drawTile(ch, sx, sy){
  // base seabed gradient-ish
  // water
  ctx.fillStyle='#0a2336'; ctx.fillRect(sx,sy,TS,TS);
  // subtle dither
  if(((sx/TS + sy/TS)|0)%2===0){ ctx.fillStyle='#0c2a40'; ctx.fillRect(sx,sy,TS,TS); }
  switch(ch){
    case '7': // sand
      ctx.fillStyle='#1a2e3a'; ctx.fillRect(sx,sy,TS,TS);
      ctx.fillStyle='#22424f';
      for(let i=0;i<6;i++){ ctx.fillRect(sx+rndSeed(sx+sy+i)*28, sy+rndSeed(sx*sy+i)*28, 3,2); }
      break;
    case '1': // rock wall
      ctx.fillStyle='#12202a'; ctx.fillRect(sx,sy,TS,TS);
      ctx.fillStyle='#1d3340'; ctx.fillRect(sx+2,sy+2,TS-4,TS-4);
      ctx.fillStyle='#0a151c'; ctx.fillRect(sx+6,sy+8,8,6);
      ctx.fillRect(sx+18,sy+16,8,8);
      ctx.fillStyle='#27414f'; ctx.fillRect(sx+4,sy+4,6,4); ctx.fillRect(sx+20,sy+6,6,4);
      break;
    case '2': // seaweed (encounter)
      // sand floor + waving kelp
      ctx.fillStyle='#0f2a1f'; ctx.fillRect(sx,sy,TS,TS);
      ctx.fillStyle='#1f7a4a';
      const ph=(G.tick*0.08)+(sx*0.3+sy*0.2);
      for(let k=0;k<4;k++){
        const bx=sx+5+k*7;
        for(let yy=0;yy<7;yy++){
          const off=Math.round(Math.sin(ph+yy*0.5+k)*1.6);
          ctx.fillStyle = yy%2? '#2aa05a':'#1f7a4a';
          ctx.fillRect(bx+off, sy+TS-3-yy*4, 3,4);
        }
      }
      break;
    case '3': // coral
      ctx.fillStyle='#0a2336'; ctx.fillRect(sx,sy,TS,TS);
      ctx.fillStyle='#e0668a'; ctx.fillRect(sx+8,sy+10,4,16);
      ctx.fillStyle='#ff8aa8'; ctx.fillRect(sx+14,sy+6,4,20);
      ctx.fillStyle='#ffb0c4'; ctx.fillRect(sx+20,sy+12,4,14);
      break;
    case 'V': // healing vent
      ctx.fillStyle='#1a2e3a'; ctx.fillRect(sx,sy,TS,TS);
      ctx.fillStyle='#0e1a22'; ctx.fillRect(sx+8,sy+18,16,10);
      // bubbles
      const bb=(G.tick*0.15)%24;
      ctx.fillStyle='#7fe0d8';
      ctx.globalAlpha=.8;
      ctx.fillRect(sx+12, sy+24-bb, 4,4);
      ctx.fillRect(sx+18, sy+22-((bb+10)%24), 3,3);
      ctx.globalAlpha=1;
      ctx.fillStyle='#37e0d8'; ctx.fillRect(sx+10,sy+24,12,4);
      break;
    case 'S': // shop (clam)
      ctx.fillStyle='#1a2e3a'; ctx.fillRect(sx,sy,TS,TS);
      ctx.fillStyle='#c8b0d8';
      ctx.beginPath(); ctx.moveTo(sx+4,sy+24); ctx.lineTo(sx+16,sy+8); ctx.lineTo(sx+28,sy+24); ctx.fill();
      ctx.fillStyle='#e8d0f8'; ctx.fillRect(sx+6,sy+22,20,4);
      ctx.fillStyle='#ffd76a'; ctx.fillRect(sx+14,sy+16,4,4);
      break;
    case 'b': // trainer (NPC diver)
      drawTile('7',sx,sy);
      drawDiver(sx+8, sy+4, '#ff8a4a');
      break;
    case 'a': // ambient deco — anemone
      ctx.fillStyle='#0a2336'; ctx.fillRect(sx,sy,TS,TS);
      ctx.fillStyle='#5a37e0'; ctx.fillRect(sx+12,sy+18,8,10);
      ctx.fillStyle='#8a6cff';
      for(let i=0;i<5;i++){ ctx.fillRect(sx+8+i*4, sy+10+Math.round(Math.sin(G.tick*0.1+i)*2), 2,8); }
      break;
    default: break; // water
  }
}
// cheap deterministic pseudo random for static deco
function rndSeed(n){ const x=Math.sin(n*12.9898)*43758.5453; return x-Math.floor(x); }

/* ---------- Diver / player sprite ---------- */
function drawDiver(x,y,suit){
  suit=suit||'#37e0d8';

function drawPlayer(){
  const px = G.player.px - G.cam.x;
  const py = G.player.py - G.cam.y;
  drawDiver(px, py-2, '#37e0d8');
}

/* =====================================================================
   WORLD UPDATE
   ===================================================================== */
function updateWorld(dt){
  const p=G.player;
  if(p.moving){
    const tgx=p.tx*TS, tgy=p.ty*TS;
    const sp=2.6*dt*60/16*1.6; // px per frame approx
    const step = 2.4;
    if(p.px<tgx) p.px=Math.min(tgx,p.px+step); else if(p.px>tgx) p.px=Math.max(tgx,p.px-step);
    if(p.py<tgy) p.py=Math.min(tgy,p.py+step); else if(p.py>tgy) p.py=Math.max(tgy,p.py-step);
    if(p.px===tgx && p.py===tgy){
      p.moving=false;
      G.steps++;
      // encounter check on seaweed
      const ch=tileAt(p.tx,p.ty);
      if(isEncounter(ch) && chance(0.16)){
        startWildEncounter();
        return;
      }
    }
  } else {
    let nx=p.tx, ny=p.ty, moved=false;
    if(keys['ArrowUp']){ p.dir='up'; ny--; moved=true; }
    else if(keys['ArrowDown']){ p.dir='down'; ny++; moved=true; }
    else if(keys['ArrowLeft']){ p.dir='left'; nx--; moved=true; }
    else if(keys['ArrowRight']){ p.dir='right'; nx++; moved=true; }
    if(moved){
      const tch=tileAt(nx,ny);
      if(!isWall(tch) && tch!=='3'){
        // interactive tiles that block but trigger:
        if(tch==='V'){ healParty(); G.msg='열수분출구의 온기가 파티를 모두 회복시켰다!'; setMsg(G.msg); }
        else if(tch==='S'){ openShop(); }
        else if(tch==='b'){ if(!G.trainerDefeated) startTrainerBattle(); else { G.msg='탐사대원: 좋은 잠수였어!'; setMsg(G.msg);} }
        else { p.tx=nx; p.ty=ny; p.moving=true; }
        // V,S,b are "interact" tiles standing in front
      }
    }
    // open menu
    if(consumePress('x')){ openMenu(); }
  }
  // camera centers on player, clamped
  const cw=VIEW_W*TS, chh=VIEW_H*TS;
  G.cam.x = clamp(p.px - cw/2 + TS/2, 0, MAP_W*TS - cw);
  G.cam.y = clamp(p.py - chh/2 + TS/2, 0, MAP_H*TS - chh);
}

let msgTimer=0;
function setMsg(s){ G.msg=s; msgTimer=140; document.getElementById('hint').textContent=s; }

function drawWorld(){
  clear('#06141f');
  // draw visible tiles
  const startX=Math.floor(G.cam.x/TS), startY=Math.floor(G.cam.y/TS);
  for(let ty=startY-1; ty<startY+VIEW_H+2; ty++){
    for(let tx=startX-1; tx<startX+VIEW_W+2; tx++){
      if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) continue;
      const sx=tx*TS-G.cam.x, sy=ty*TS-G.cam.y;
      drawTile(MAP[ty][tx], sx, sy);
    }
  }
  drawPlayer();
  // light vignette / depth
  const grd=ctx.createRadialGradient(BASE_W/2,BASE_H/2,40, BASE_W/2,BASE_H/2,220);
  grd.addColorStop(0,'rgba(0,0,0,0)'); grd.addColorStop(1,'rgba(0,8,16,.55)');
  ctx.fillStyle=grd; ctx.fillRect(0,0,BASE_W,BASE_H);
  // floating bubbles ambiance
  ctx.fillStyle='rgba(120,220,230,.25)';
  for(let i=0;i<10;i++){
    const bx=(i*37 + (G.tick*0.4)%320)%320;
    const by=(BASE_H - ((G.tick*0.6 + i*53)%BASE_H));
    ctx.fillRect(bx, by, 2,2);
  }
  // top HUD bar
  panel(2,2,BASE_W-4,18,'rgba(6,20,32,.9)');
  text('심해 잠수 수집행',8,5,'#7fe0d8',11);
  text('₽'+G.money,BASE_W-70,5,'#ffd76a',11);
  // bottom message
  if(msgTimer>0){
    panel(2,BASE_H-26,BASE_W-4,24,'rgba(6,20,32,.95)');
    text(G.msg,10,BASE_H-20,'#dff3ff',10);
    msgTimer--;
    if(msgTimer===0) document.getElementById('hint').textContent = controlHint();
  } else {
    document.getElementById('hint').textContent = controlHint();
  }
}
function controlHint(){
  return '이동: 방향키/D패드 · 메뉴: X(B) · 결정: Z(A) · 수풀=조우 · 분출구=회복';
}

function openMenu(){ G.mode='menu'; menu.sel=0; }
function updateMenu(){
  if(consumePress('ArrowUp')) menu.sel=(menu.sel+menu.items.length-1)%menu.items.length;
  if(consumePress('ArrowDown')) menu.sel=(menu.sel+1)%menu.items.length;
  if(consumePress('x')){ G.mode='world'; return; }
  if(consumePress('z')){
    const it=menu.items[menu.sel];
    if(it==='닫기') G.mode='world';
    else if(it==='파티'){ G.mode='party'; party.sel=0; }
    else if(it==='가방'){ G.mode='bag'; bagUI.sel=0; }
    else if(it==='도감'){ G.mode='dex'; dexUI.sel=0; }
    else if(it==='크레딧'){ G.mode='credit'; }
    else if(it==='회복(자가)'){ /* small free heal nudge */ G.mode='world'; setMsg('회복은 열수분출구(V)에서! 또는 회복약 사용.'); }
  }
}
function drawMenu(){
  drawWorld();
  ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(0,0,BASE_W,BASE_H);
  panel(BASE_W-118, 24, 112, 130);
  text('메뉴',BASE_W-110,30,'#7fe0d8',12);

    text(menu.items[i], BASE_W-100, y, i===menu.sel?'#fff':'#bfe3f0', 10);
  }
}

function drawCreatureSmall(c,x,y,ps){
  // draw 16x16 sprite scaled by ps, fit ~32px box
  const sp=SPECIES[c.species], grid=SHAPES[sp.shape], pal=sp.pal;
  for(let yy=0;yy<16;yy++){ const row=grid[yy];
    for(let xx=0;xx<16;xx++){ const v=row.charCodeAt(xx)-48; if(!v)continue;
      ctx.fillStyle=pal[v-1]; ctx.fillRect(x+xx*ps,y+yy*ps,ps,ps);
    }}
}

    else setMsg('₽가 부족하다...');
  }
}

/* =====================================================================
   BATTLE SYSTEM
   ===================================================================== */
const B = {
  active:false, isTrainer:false,
  enemy:null, enemyTeam:[], enemyIdx:0,
  myIdx:0,
  state:'intro', // intro, menu, fight, item, switch, run, anim, msg, win, lose, caught
  msgQ:[], msg:'', sub:0, sel:0,
  log:'', shake:0, flashMy:0, flashEn:0,
  catchAnim:0, ballThrow:null, captured:false,
  myAnimX:0, enAnimX:0,
};
function myMon(){ return G.party[B.myIdx]; }
function firstAlive(team){ for(let i=0;i<team.length;i++) if(team[i].hp>0) return i; return -1; }

function startWildEncounter(){
  // pick wild species weighted by area
  const pool=['guppi','sparko','frosti','venni','anglo','shello','guppi','frosti'];
  const sid=pool[rnd(pool.length)];
  const lv = clamp(3 + rnd(6) + Math.floor(G.steps/30), 3, 14);
  const e = makeCreature(sid, lv);
  markDex(sid, false);
  B.active=true; B.isTrainer=false; B.enemy=e; B.enemyTeam=[e]; B.enemyIdx=0;
  B.captured=false;
  B.myIdx = Math.max(0, firstAlive(G.party));
  G.mode='battle'; B.state='intro';
  queue('야생 '+e.name+'(Lv'+e.lv+') 출현!');
}
function startTrainerBattle(){
  const team=[ makeCreature('toxar',12), makeCreature('jelvolt',13) ];
  B.active=true; B.isTrainer=true; B.enemyTeam=team; B.enemyIdx=0; B.enemy=team[0];
  for(const c of team) markDex(c.species,false);
  B.myIdx=Math.max(0,firstAlive(G.party));
  G.mode='battle'; B.state='intro';
  queue('탐사대원 마린이 승부를 걸어왔다!');
  queue('마린은 '+B.enemy.name+'을(를) 내보냈다!');
}
function queue(s){ B.msgQ.push(s); if(!B.msg){ nextMsg(); } }
function nextMsg(){ if(B.msgQ.length){ B.msg=B.msgQ.shift(); B._msgT=1; } else { B.msg=''; B._after && B._after(); } }

/* battle menu */
const bmenu={sel:0, items:['싸운다','가방','교체','도망']};
const fmenu={sel:0};
const imenu={sel:0};
const smenu={sel:0};

function updateBattle(){
  B.tick=(B.tick||0)+1;
  if(B.shake>0) B.shake--;
  if(B.flashMy>0) B.flashMy--;
  if(B.flashEn>0) B.flashEn--;
  if(B.catchAnim>0){ B.catchAnim--; if(B.catchAnim===0) resolveCatch(); return; }

  // message advancing
  if(B.msg){
    if(consumePress('z')||consumePress('x')){
      const wasLast = B.msgQ.length===0;
      nextMsg();
      if(wasLast && !B.msg){
        // after-message hook handled in nextMsg via _after
        if(B._pending){ const f=B._pending; B._pending=null; f(); }
      }
    }
    return;
  }

  switch(B.state){
    case 'intro':
      // when intro msgs cleared:
      B.state='menu'; bmenu.sel=0; break;
    case 'menu': battleMenuInput(); break;
    case 'fight': fightMenuInput(); break;
    case 'item': itemMenuInput(); break;
    case 'switch': switchMenuInput(); break;
    case 'win': if(consumePress('z')||consumePress('x')){ endBattle(); } break;
    case 'lose': if(consumePress('z')||consumePress('x')){ endBattle(); } break;
  }
}

function battleMenuInput(){
  if(consumePress('ArrowUp')) bmenu.sel=(bmenu.sel+2)%4;
  if(consumePress('ArrowDown')) bmenu.sel=(bmenu.sel+2)%4;
  if(consumePress('ArrowLeft')) bmenu.sel=(bmenu.sel%2===1)?bmenu.sel-1:bmenu.sel;
  if(consumePress('ArrowRight')) bmenu.sel=(bmenu.sel%2===0)?bmenu.sel+1:bmenu.sel;
  if(consumePress('z')){
    const it=bmenu.items[bmenu.sel];
    if(it==='싸운다'){ B.state='fight'; fmenu.sel=0; }
    else if(it==='가방'){ B.state='item'; imenu.sel=0; }
    else if(it==='교체'){ B.state='switch'; smenu.sel=0; }
    else if(it==='도망'){ tryRun(); }
  }
}
function fightMenuInput(){
  const moves=myMon().moves;
  if(consumePress('ArrowUp')) fmenu.sel=(fmenu.sel+moves.length-1)%moves.length;
  if(consumePress('ArrowDown')) fmenu.sel=(fmenu.sel+1)%moves.length;
  if(consumePress('x')){ B.state='menu'; return; }
  if(consumePress('z')){ doTurn('move', moves[fmenu.sel]); }
}
function itemMenuInput(){
  const items=bagList();
  if(items.length){
    if(consumePress('ArrowUp')) imenu.sel=(imenu.sel+items.length-1)%items.length;
    if(consumePress('ArrowDown')) imenu.sel=(imenu.sel+1)%items.length;
  }
  if(consumePress('x')){ B.state='menu'; return; }
  if(consumePress('z') && items.length){
    const it=items[imenu.sel];
    if(it.includes('포획구슬')){
      if(B.isTrainer){ queue('상대 크리처는 포획할 수 없다!'); B._pending=()=>{B.state='menu';}; return; }
      doTurn('catch', it);
    } else if(it==='회복약'){
      const m=myMon();
      if(m.hp>=m.maxhp){ queue('이미 체력이 가득하다!'); B._pending=()=>{B.state='item';}; return; }
      doTurn('heal', it);
    }
  }
}
function switchMenuInput(){
  if(consumePress('ArrowUp')) smenu.sel=(smenu.sel+G.party.length-1)%G.party.length;
  if(consumePress('ArrowDown')) smenu.sel=(smenu.sel+1)%G.party.length;
  if(consumePress('x')){ B.state='menu'; return; }
  if(consumePress('z')){
    if(smenu.sel===B.myIdx){ queue('이미 출전 중이다!'); B._pending=()=>{B.state='switch';}; return; }
    if(G.party[smenu.sel].hp<=0){ queue('기절한 크리처는 못 내보낸다!'); B._pending=()=>{B.state='switch';}; return; }
    const old=myMon();
    B.myIdx=smenu.sel;
    queue(old.name+' 회수! 가라 '+myMon().name+'!');
    B._pending=()=>{ enemyTurn(()=>{ B.state='menu'; }); };
  }
}

/* ---------- Turn resolution ---------- */
function calcDamage(att, def, move){
  const m=MOVES[move];
  const stab = (att.type===m.type)?1.25:1.0;
  const eff = typeMult(m.type, def.type);
  const variance = 0.85 + Math.random()*0.3;
  let dmg = ((att.atk*1.0 + att.lv*0.6) * (m.pow/45) * stab * eff / (1 + def.def*0.04)) * variance;
  dmg = Math.max(1, Math.floor(dmg));
  return {dmg, eff, stab};
}
function effWord(e){ return e>=2?'효과가 굉장했다!':(e<=0.5?'효과가 별로인 듯하다...':''); }

function doTurn(kind, arg){
  // determine order by speed for 'move' actions; item/catch happen first then enemy
  const me=myMon(), en=B.enemy;
  if(kind==='move'){
    const meFirst = me.spd>=en.spd;
    const acts=[];
    acts.push(()=>playerMove(arg));
    acts.push(()=>{ if(en.hp>0) enemyAttack(()=>{}); });
    if(meFirst) runSeq([ ()=>playerMove(arg, ()=>{
        if(en.hp<=0){ onEnemyFaint(); }
        else enemyAttack(()=>{ checkMyFaint(()=>{ B.state='menu'; }); });
      }) ]);
    else runSeq([ ()=>enemyAttack(()=>{
        checkMyFaint(()=>{
          if(me.hp>0) playerMove(arg, ()=>{ if(en.hp<=0) onEnemyFaint(); else B.state='menu'; });
        });
      }) ]);
  } else if(kind==='catch'){
    throwBall(arg);
  } else if(kind==='heal'){
    const m=myMon(); const before=m.hp; m.hp=clamp(m.hp+40,0,m.maxhp); G.bag[arg]--;
    queue(m.name+'의 체력을 '+(m.hp-before)+' 회복!');
    B._pending=()=>{ enemyAttack(()=>{ checkMyFaint(()=>{ B.state='menu'; }); }); };
  }
}
function runSeq(fns){ // run a single starting fn (chain handled via callbacks)
  fns[0]();
}
function playerMove(move, after){
  const me=myMon(), en=B.enemy;
  B.enAnimX=8; B.flashEn=8; B.shake=6;
  const {dmg,eff}=calcDamage(me,en,move);
  en.hp=clamp(en.hp-dmg,0,en.maxhp);
  const w=effWord(eff);
  queue(me.name+'의 '+move+'!'+(w?' '+w:''));
  B._pending=()=>{ if(after) after(); else B.state='menu'; };
}
function enemyAttack(after){
  const me=myMon(), en=B.enemy;
  if(en.hp<=0){ if(after)after(); return; }
  const move=en.moves[rnd(en.moves.length)];
  B.myAnimX=-8; B.flashMy=8; B.shake=6;
  const {dmg,eff}=calcDamage(en,me,move);
  me.hp=clamp(me.hp-dmg,0,me.maxhp);
  const w=effWord(eff);
  queue('적 '+en.name+'의 '+move+'!'+(w?' '+w:''));
  B._pending=()=>{ if(after) after(); };
}
function checkMyFaint(cont){
  const me=myMon();
  if(me.hp<=0){
    queue(me.name+'이(가) 기절했다!');
    const alive=firstAlive(G.party);
    if(alive<0){ B._pending=()=>{ B.state='lose'; queue('눈앞이 캄캄해졌다...'); }; }
    else { B.myIdx=alive; B._pending=()=>{ queue('가라 '+myMon().name+'!'); B._pending=cont; }; }
  } else { cont(); }
}
function onEnemyFaint(){
  const en=B.enemy;
  queue('적 '+en.name+'을(를) 쓰러뜨렸다!');
  // XP
  const me=myMon();
  const gain = Math.floor(en.lv*6 + 10);
  B._pending=()=>{ grantXP(me, gain, ()=>{
    // trainer next mon?
    if(B.isTrainer){
      B.enemyIdx++;
      if(B.enemyIdx<B.enemyTeam.length){
        B.enemy=B.enemyTeam[B.enemyIdx];
        queue('마린은 '+B.enemy.name+'을(를) 내보냈다!');
        B._pending=()=>{ B.state='menu'; };
      } else {
        winBattle(true);
      }
    } else {
      winBattle(false);
    }
  }); };
}
function grantXP(c, amt, done){
  queue(c.name+'은(는) 경험치 '+amt+'를 얻었다!');
  B._pending=()=>{
    c.xp += amt;
    let leveled=false;
    while(c.xp>=xpToNext(c.lv) && c.lv<50){
      c.xp-=xpToNext(c.lv); c.lv++; leveled=true;
      const prevMoves=c.moves.slice();
      recomputeStats(c); c.hp=clamp(c.hp+statAt(c.species,'hp',c.lv)-statAt(c.species,'hp',c.lv-1), 0, c.maxhp);
      queue(c.name+'은(는) Lv'+c.lv+'(으)로 올랐다!');
      const newMoves=c.moves.filter(m=>!prevMoves.includes(m));
      for(const nm of newMoves) queue(c.name+'은(는) '+nm+'을(를) 배웠다!');
      // evolution
      const sp=SPECIES[c.species];
      if(sp.evo && c.lv>=sp.evo.lv){
        const to=sp.evo.to;
        queue('어라...? '+c.name+'의 모습이...!');
        queue(c.name+'은(는) '+SPECIES[to].name+'(으)로 진화했다!');
        c.species=to; c.name=SPECIES[to].name; c.type=SPECIES[to].type;
        recomputeStats(c); markDex(to,true);
      }
    }
    B._pending=()=>{ done(); };
  };
}

/* ---------- Catch ---------- */
function throwBall(ballName){
  const en=B.enemy;
  G.bag[ballName]--;
  const big = ballName.includes('대형');
  queue((big?'대형포획구슬':'포획구슬')+'을 던졌다!');
  B._pending=()=>{
    B.ballThrow={name:ballName, big};
    B.catchAnim=70; // frames of shake animation
    // compute catch result now, reveal after anim
    const hpFrac=en.hp/en.maxhp;
    const ballBonus = big?1.7:1.0;
    const rate = clamp((1.15 - hpFrac) * ballBonus * (1 - en.lv*0.012), 0.05, 0.95);
    B._catchRoll = Math.random() < rate;
    B._catchShakes = B._catchRoll?3:(rnd(3));
  };
}
function resolveCatch(){
  const en=B.enemy;
  if(B._catchRoll){
    B.captured=true;
    markDex(en.species,true);
    if(G.party.length<6){ G.party.push(en); queue(en.name+'을(를) 포획했다!'); }
    else queue(en.name+'을(를) 포획! (파티 가득 — 보관)');
    queue('심해도감에 데이터가 기록됐다.');
    B._pending=()=>{ B.state='win'; };
  } else {
    queue('앗! '+en.name+'이(가) 튀어나왔다!');
    B._pending=()=>{ enemyAttack(()=>{ checkMyFaint(()=>{ B.state='menu'; }); }); };
  }
}
function enemyTurn(after){ enemyAttack(()=>{ checkMyFaint(after); }); }

function tryRun(){
  if(B.isTrainer){ queue('승부 중엔 도망칠 수 없다!'); B._pending=()=>{B.state='menu';}; return; }
  const me=myMon(), en=B.enemy;
  if(me.spd>=en.spd || chance(0.6)){
    queue('무사히 도망쳤다!');
    B._pending=()=>{ endBattle(); };
  } else {
    queue('도망치지 못했다!');
    B._pending=()=>{ enemyAttack(()=>{ checkMyFaint(()=>{ B.state='menu'; }); }); };
  }
}
function winBattle(isTrainer){
  if(isTrainer){
    const prize=800; G.money+=prize; G.trainerDefeated=true;
    queue('탐사대원 마린을 이겼다!');
    queue('상금 ₽'+prize+'을(를) 받았다!');
  } else {
    const prize=20+B.enemy.lv*8; G.money+=prize;
    queue('₽'+prize+'을(를) 주웠다!');
  }
  B._pending=()=>{ B.state='win'; };
}
function endBattle(){
  B.active=false; G.mode='world'; B.msg=''; B.msgQ=[]; B._pending=null;
  setMsg('탐사를 계속한다...');
}

/* ---------- Battle draw ---------- */
function drawBattle(){
  // deep-sea battle backdrop
  const g=ctx.createLinearGradient(0,0,0,BASE_H);
  g.addColorStop(0,'#0a3450'); g.addColorStop(.6,'#072233'); g.addColorStop(1,'#04141f');
  ctx.fillStyle=g; ctx.fillRect(0,0,BASE_W,BASE_H);
  // light rays
  ctx.globalAlpha=.06; ctx.fillStyle='#9fe7ff';
  for(let i=0;i<5;i++){ ctx.save(); ctx.translate(40+i*60,0); ctx.rotate(0.15); ctx.fillRect(0,0,18,BASE_H); ctx.restore(); }
  ctx.globalAlpha=1;
  // floor
  ctx.fillStyle='#0a2030'; ctx.fillRect(0,BASE_H-70,BASE_W,70);
  ctx.fillStyle='#0e2a3c'; ctx.fillRect(0,BASE_H-72,BASE_W,4);

  const sh = B.shake>0? (rnd(3)-1):0;
  const en=B.enemy, me=myMon();

  // enemy platform (top right)
  ctx.fillStyle='rgba(10,40,60,.6)'; ctx.beginPath();
  ctx.ellipse(232, 96, 46, 14, 0,0,Math.PI*2); ctx.fill();
  // enemy sprite
  if(en){
    const bob=Math.round(Math.sin(B.tick*0.1)*2);
    const ex = 200 + (B.enAnimX>0?(B.enAnimX=Math.max(0,B.enAnimX-2),6):0) + sh;
    let alpha=1;
    if(B.flashEn>0 && B.flashEn%2===0) alpha=0.3;
    ctx.globalAlpha=alpha;
    drawSpriteAt(en, ex, 48+bob, 4, false);
    ctx.globalAlpha=1;
  }
  // catch ball anim over enemy
  if(B.catchAnim>0 && B.ballThrow){
    const t=1-(B.catchAnim/70);
    const bx=232, by=72;
    drawBall(bx-8, by-8 - Math.round(Math.sin(t*Math.PI)* ( (B.catchAnim>50)?40:0 )), B.ballThrow.big);
    if(B.catchAnim<50){
      // shake
      const sk=Math.round(Math.sin(B.catchAnim*0.6)* ((B.catchAnim<14&&!B._catchRoll)? 0 : 3));
      // already drawn; redraw with shake
    }
  }

  // my sprite (bottom left, back-ish — we show front sprite flipped)
  if(me && me.hp>0){
    const bob=Math.round(Math.sin(B.tick*0.1+1)*2);
    const mx = 56 + (B.myAnimX<0?(B.myAnimX=Math.min(0,B.myAnimX+2),-6):0);
    let alpha=1; if(B.flashMy>0 && B.flashMy%2===0) alpha=0.3;
    ctx.globalAlpha=alpha;
    drawSpriteAt(me, mx, 150+bob, 4, true);
    ctx.globalAlpha=1;
  }

  // enemy info box (top-left)
  if(en){
    panel(8,16,150,40);
    text(en.name,16,20,'#fff',11);
    text('Lv'+en.lv,120,20,'#ffd76a',10);
    ctx.fillStyle=TCOL[en.type]; ctx.fillRect(16,34,4,7); text(en.type,22,34,TCOL[en.type],8);
    bar(58,34,90,7,en.hp/en.maxhp, en.hp/en.maxhp>0.3?'#52e07a':'#e05252');
  }
  // my info box (bottom-right above command)
  if(me){
    panel(BASE_W-160,118,152,46);
    text(me.name,BASE_W-152,122,'#fff',11);
    text('Lv'+me.lv,BASE_W-44,122,'#ffd76a',10);
    bar(BASE_W-100,136,90,7,me.hp/me.maxhp, me.hp/me.maxhp>0.3?'#52e07a':'#e05252');
    text(me.hp+'/'+me.maxhp,BASE_W-152,150,'#bfe3f0',9);
    const need=xpToNext(me.lv);
    bar(BASE_W-100,150,90,3,clamp(me.xp/need,0,1),'#6ab4ff');
  }

  // command / message panel (bottom)
  panel(2,BASE_H-58,BASE_W-4,56,'rgba(5,18,28,.97)');
  if(B.msg){
    wrapText(B.msg, 12, BASE_H-50, BASE_W-24, 12, '#dff3ff');
    if(((B.tick>>3)&1)) text('▼',BASE_W-18,BASE_H-14,'#ffd76a',10);
    return;
  }
  // draw current sub-menu
  if(B.state==='menu'){
    drawCmdGrid(bmenu.items, bmenu.sel);
  } else if(B.state==='fight'){
    drawMoveList();
  } else if(B.state==='item'){
    drawItemList();
  } else if(B.state==='switch'){
    drawSwitchList();
  } else if(B.state==='win'||B.state==='lose'){
    text(B.state==='win'?'▶ 계속하려면 Z/A':'▶ Z/A',12,BASE_H-40,'#ffd76a',11);
  } else {
    text('...',12,BASE_H-40,'#bfe3f0',11);
  }
}
function drawCmdGrid(items, sel){
  // 2x2
  for(let i=0;i<items.length;i++){
    const col=i%2, row=(i/2)|0;
    const x=170+col*70, y=BASE_H-48+row*22;

    text(items[i], x+6, y, i===sel?'#fff':'#bfe3f0', 11);

  text('무엇을 할까?',14,BASE_H-44,'#7fe0d8',11);
}
function drawMoveList(){

}
function drawItemList(){
  const items=bagList();
  if(!items.length){ text('가방이 비었다',12,BASE_H-44,'#bfe3f0',11); text('X: 뒤로',12,BASE_H-26,'#7fb6d0',9); return; }
  for(let i=0;i<items.length;i++){
    const y=BASE_H-50+i*12;
    if(i===imenu.sel){ ctx.fillStyle='#13405e'; ctx.fillRect(8,y-1,200,12); }
    text((i===imenu.sel?'▶':' ')+items[i]+'  x'+G.bag[items[i]],10,y,i===imenu.sel?'#fff':'#bfe3f0',10);
  }
  text('X: 뒤로',BASE_W-70,BASE_H-18,'#7fb6d0',8);
}
function drawSwitchList(){
  for(let i=0;i<G.party.length;i++){
    const c=G.party[i]; const y=BASE_H-52+i*11;
    if(i===smenu.sel){ ctx.fillStyle='#13405e'; ctx.fillRect(8,y-1,220,11); }
    const col = c.hp<=0?'#e05252':(i===B.myIdx?'#37e0d8':(i===smenu.sel?'#fff':'#bfe3f0'));
    text((i===smenu.sel?'▶':' ')+c.name+' Lv'+c.lv+'  '+c.hp+'/'+c.maxhp+(i===B.myIdx?' (출전)':''),10,y,col,9);
  }
  text('X: 뒤로',BASE_W-70,BASE_H-16,'#7fb6d0',8);
}
function drawSpriteAt(c, cx, cy, ps, flip){
  // center 16x16 at cx,cy
  const sp=SPECIES[c.species], grid=SHAPES[sp.shape], pal=sp.pal;
  const ox=cx - 8*ps, oy=cy-8*ps;
  for(let yy=0;yy<16;yy++){ const row=grid[yy];
    for(let xx=0;xx<16;xx++){ const v=row.charCodeAt(xx)-48; if(!v) continue;
      const rx=flip?(15-xx):xx;
      ctx.fillStyle=pal[v-1]; ctx.fillRect(ox+rx*ps,oy+yy*ps,ps,ps);
    }}
}
function drawBall(x,y,big){
  const s=big?'#ffd76a':'#e05252';
  ctx.fillStyle=s; ctx.fillRect(x,y,16,8);
  ctx.fillStyle='#e8f4ff'; ctx.fillRect(x,y+8,16,8);
  ctx.fillStyle='#0a151c'; ctx.fillRect(x,y+7,16,2);
  ctx.fillStyle='#cdfcff'; ctx.fillRect(x+6,y+6,4,4);
}
function wrapText(s,x,y,maxw,lh,col){
  ctx.fillStyle=col; ctx.font="11px 'Courier New',monospace"; ctx.textBaseline='top';
  // simple char-based wrap for Korean monospace-ish
  let line='', yy=y;
  const words=s.split('');
  for(const ch of words){
    if(ctx.measureText(line+ch).width>maxw){ ctx.fillText(line,x,yy); line=ch; yy+=lh; }
    else line+=ch;
  }
  ctx.fillText(line,x,yy);
}

/* =====================================================================
   TITLE SCREEN
   ===================================================================== */
const title={sel:0, items:['모험 시작','크레딧']};
function updateTitle(){
  if(consumePress('ArrowUp')) title.sel=(title.sel+title.items.length-1)%title.items.length;
  if(consumePress('ArrowDown')) title.sel=(title.sel+1)%title.items.length;
  if(consumePress('z')){
    if(title.sel===0){ newGame(); G.mode='world'; setMsg('수풀을 헤치고 야생 크리처를 찾아라!'); }
    else { G._creditFromTitle=true; G.mode='credit'; }
  }
}
function drawTitle(){
  // gradient sea
  const g=ctx.createLinearGradient(0,0,0,BASE_H);
  g.addColorStop(0,'#0e4a6e'); g.addColorStop(.5,'#083350'); g.addColorStop(1,'#03101a');
  ctx.fillStyle=g; ctx.fillRect(0,0,BASE_W,BASE_H);
  // bubbles
  ctx.fillStyle='rgba(150,230,240,.3)';
  for(let i=0;i<24;i++){
    const bx=(i*53+ (G.tick*0.5))%BASE_W;
    const by=(BASE_H-((G.tick*0.7+i*40)%BASE_H));
    const r=1+(i%3); ctx.fillRect(bx,by,r,r);
  }
  // light rays
  ctx.globalAlpha=.08; ctx.fillStyle='#bff7ff';
  for(let i=0;i<6;i++){ ctx.save(); ctx.translate(30+i*55,0); ctx.rotate(0.16); ctx.fillRect(0,0,16,BASE_H); ctx.restore(); }
  ctx.globalAlpha=1;
  // floating showcase creatures
  drawSpriteAt({species:'levira'}, 70, 120+Math.round(Math.sin(G.tick*0.05)*4), 3, false);
  drawSpriteAt({species:'anglo'}, 240, 100+Math.round(Math.sin(G.tick*0.05+2)*4), 3, true);
  drawSpriteAt({species:'glacir'}, 250, 180+Math.round(Math.sin(G.tick*0.06+1)*3), 2, false);
  // diver
  drawDiver(140, 150+Math.round(Math.sin(G.tick*0.08)*3), '#37e0d8');

  // title text
  ctx.textAlign='center';
  ctx.fillStyle='#04121a'; ctx.font="bold 26px 'Courier New',monospace"; ctx.fillText('심해 잠수 수집행',BASE_W/2+2,42);
  ctx.fillStyle='#7fe0d8'; ctx.fillText('심해 잠수 수집행',BASE_W/2,40);
  ctx.fillStyle='#ffd76a'; ctx.font="12px 'Courier New',monospace"; ctx.fillText('ABYSSAL  DIVERS',BASE_W/2,70);
  ctx.textAlign='left';

  // menu
  panel(BASE_W/2-58, 210, 116, 50);
  for(let i=0;i<title.items.length;i++){
    const y=218+i*18;
    ctx.textAlign='center';
    if(i===title.sel){ ctx.fillStyle='#13405e'; ctx.fillRect(BASE_W/2-52,y-2,104,16); }
    ctx.fillStyle=i===title.sel?'#fff':'#bfe3f0'; ctx.font="12px 'Courier New',monospace";
    ctx.fillText((i===title.sel?'▶ ':'')+title.items[i],BASE_W/2,y);
    ctx.textAlign='left';
  }
  // credit footer (always visible on title)
  ctx.textAlign='center';
  ctx.fillStyle='#5a8aa0'; ctx.font="8px 'Courier New',monospace";
  ctx.fillText('포켓몬에서 영감 — © Nintendo / Game Freak / The Pokémon Company. 오리지널 구현', BASE_W/2, BASE_H-12);
  ctx.textAlign='left';
  document.getElementById('hint').textContent='Z/A: 결정 · 방향키: 선택';
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  G.tick++;
  B.tick=(B.tick||0)+1;

  switch(G.mode){
    case 'title': updateTitle(); drawTitle(); break;
    case 'world': updateWorld(dt); drawWorld(); break;
    case 'menu': updateMenu(); drawMenu(); break;
    case 'party': updateParty(); drawParty(); break;
    case 'bag': updateBag(); drawBag(); break;
    case 'dex': updateDex(); drawDex(); break;
    case 'shop': updateShop(); drawShop(); break;
    case 'credit': drawCredit(); break;
    case 'battle': updateBattle(); drawBattle(); break;
  }
  // clear edge-press leftovers each frame for keys not consumed
  for(const k in pressed){ if(pressed[k]) { /* leave for next consume if same frame */ } }
  requestAnimationFrame(frame);
}

/* boot */
fit();
G.mode='title';
requestAnimationFrame(frame);

// expose for self-test
window.__G=G; window.__B=B; window.__SPECIES=SPECIES; window.__newGame=newGame;
window.__startWild=startWildEncounter;
</script>
