<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sun, You Overslept — 늦잠 자는 태양</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241f1c;
    --paper:#f4efe2;
    --warm:#ffe27a;
    --sun:#ffce4d;
    --sunDeep:#f9a13b;
    --night0:#10122b;
    --night1:#1b2150;
    --night2:#2c3a78;
    --day0:#a9dcff;
    --day1:#d6efff;
    --day2:#fbe9b8;
    --grass0:#4a7a52;
    --grass1:#3f6a47;
    --grassDay0:#74c06b;
    --grassDay1:#5aa857;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Gowun Dodum',sans-serif;
    background:var(--night0);
    color:var(--paper);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  #stage{
    position:fixed;inset:0;
    width:100vw;height:100vh;
    overflow:hidden;
    cursor:default;
  }
  svg#scene{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:max(100vw,calc(100vh * 1.6));
    height:max(100vh,calc(100vw / 1.6));
    display:block;
  }

  /* ---------- HUD / TYPO ---------- */
  .hud{
    position:fixed;z-index:30;
    pointer-events:none;
  }
  .topbar{
    top:0;left:0;right:0;
    padding:26px clamp(20px,4vw,56px) 0;
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:16px;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand .mark{
    width:42px;height:42px;border-radius:13px;
    background:radial-gradient(circle at 35% 30%, #fff7d6, var(--sun) 55%, var(--sunDeep));
    border:2.5px solid var(--ink);
    box-shadow:0 6px 0 rgba(0,0,0,.25);
    display:grid;place-items:center;
    position:relative;flex:none;
  }
  .brand .mark::before{
    content:"";position:absolute;inset:-9px;border-radius:18px;
    background:
      repeating-conic-gradient(from 0deg, var(--sun) 0 9deg, transparent 9deg 30deg);
    -webkit-mask:radial-gradient(circle, transparent 60%, #000 61%);
    mask:radial-gradient(circle, transparent 60%, #000 61%);
    opacity:.0;transition:opacity .6s;
  }
  body.is-day .brand .mark::before{opacity:.9;animation:spin 22s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .brand .name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:15px;letter-spacing:.14em;
    text-transform:uppercase;line-height:1;
    color:var(--paper);
  }
  .brand .name small{
    display:block;font-family:'Gowun Dodum';
    font-weight:400;font-size:10.5px;letter-spacing:.32em;
    opacity:.65;margin-top:5px;text-transform:none;
  }
  .meta{
    text-align:right;font-family:'Space Grotesk';
    font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;
    opacity:.6;line-height:1.9;
  }
  .meta b{color:var(--warm);font-weight:500}

  .headline{
    left:0;right:0;top:50%;transform:translateY(-50%);
    padding:0 clamp(20px,5vw,72px);
    max-width:760px;
  }
  .kicker{
    display:inline-flex;align-items:center;gap:9px;
    font-family:'Space Grotesk';font-size:11px;font-weight:500;
    letter-spacing:.3em;text-transform:uppercase;
    padding:7px 14px;border:1.6px solid rgba(255,255,255,.32);
    border-radius:999px;background:rgba(20,20,40,.34);
    backdrop-filter:blur(4px);
    color:var(--paper);margin-bottom:20px;
  }
  .kicker .dot{
    width:8px;height:8px;border-radius:50%;background:var(--warm);
    box-shadow:0 0 10px var(--warm);animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.7)}}
  h1{
    font-family:'Jua',sans-serif;font-weight:400;
    font-size:clamp(40px,7.4vw,98px);
    line-height:.98;letter-spacing:-.01em;
    color:#fff;
    text-shadow:0 4px 0 rgba(0,0,0,.28), 0 14px 40px rgba(0,0,0,.35);
    transition:color .8s;
  }
  h1 .em{
    color:var(--sun);
    text-shadow:0 4px 0 rgba(0,0,0,.3), 0 0 40px rgba(255,206,77,.5);
    position:relative;display:inline-block;
  }
  h1 .zzz{font-size:.5em;vertical-align:super;opacity:.8}
  .sub{
    margin-top:22px;max-width:430px;
    font-size:clamp(14px,1.5vw,17px);line-height:1.7;
    color:rgba(255,255,255,.82);
    text-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  body.is-day h1{color:var(--ink)}
  body.is-day h1 .em{color:var(--sunDeep);text-shadow:0 3px 0 rgba(255,255,255,.5),0 0 30px rgba(249,161,59,.5)}
  body.is-day .sub{color:rgba(36,31,28,.78);text-shadow:0 1px 4px rgba(255,255,255,.5)}
  body.is-day .kicker{border-color:rgba(36,31,28,.3);background:rgba(255,255,255,.4);color:var(--ink)}
  body.is-day .brand .name{color:var(--ink)}
  body.is-day .brand .name small,body.is-day .meta{opacity:.55}
  body.is-day .meta{color:var(--ink)}

  /* ---------- CONTROL DOCK ---------- */
  .dock{
    left:50%;transform:translateX(-50%);
    bottom:clamp(20px,3.5vh,40px);
    pointer-events:auto;
    display:flex;align-items:center;gap:18px;
    padding:13px 18px;
    background:rgba(16,18,40,.55);
    border:1.6px solid rgba(255,255,255,.18);
    border-radius:20px;
    backdrop-filter:blur(14px) saturate(1.2);
    box-shadow:0 18px 50px rgba(0,0,0,.45);
    transition:background .8s,border-color .8s;
  }
  body.is-day .dock{background:rgba(255,255,255,.5);border-color:rgba(36,31,28,.16)}
  .dock .ico{font-size:17px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
  .timeWrap{display:flex;flex-direction:column;gap:5px;width:min(46vw,260px)}
  .timeRow{display:flex;justify-content:space-between;font-family:'Space Grotesk';
    font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.75}
  body.is-day .timeRow{color:var(--ink)}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:7px;
    border-radius:99px;outline:none;cursor:grab;
    background:linear-gradient(90deg,var(--night1),var(--night2) 40%,var(--sunDeep) 72%,var(--warm));
    border:1.6px solid var(--ink);
  }
  input[type=range]:active{cursor:grabbing}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff7d6,var(--sun) 55%,var(--sunDeep));
    border:2.5px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.3);
    transition:transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.12)}
  input[type=range]::-moz-range-thumb{
    width:22px;height:22px;border-radius:50%;border:2.5px solid var(--ink);
    background:radial-gradient(circle at 35% 30%,#fff7d6,var(--sun) 55%,var(--sunDeep));
  }
  .btn{
    pointer-events:auto;cursor:pointer;flex:none;
    font-family:'Jua';font-size:14px;color:var(--ink);
    padding:11px 18px;border-radius:14px;
    background:linear-gradient(180deg,#fff3c4,var(--sun));
    border:2.5px solid var(--ink);
    box-shadow:0 5px 0 var(--ink);
    transition:transform .08s,box-shadow .08s,filter .2s;
    white-space:nowrap;display:flex;align-items:center;gap:7px;
  }
  .btn:hover{filter:brightness(1.04)}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .btn .em{font-size:16px}

  .hint{
    position:fixed;right:clamp(16px,3vw,40px);bottom:clamp(20px,3.5vh,40px);
    z-index:30;pointer-events:none;
    font-family:'Space Grotesk';font-size:10.5px;letter-spacing:.18em;
    text-transform:uppercase;opacity:.55;text-align:right;line-height:1.8;
  }
  body.is-day .hint{color:var(--ink)}
  .hint kbd{
    font-family:'Space Grotesk';display:inline-block;
    padding:1px 6px;border:1.4px solid currentColor;border-radius:6px;
    opacity:.9;font-size:9.5px;
  }

  /* clickable cursor on interactive svg parts */
  .clickable{cursor:pointer}

  @media (max-width:720px){
    .headline{top:96px;transform:none;text-align:left;max-width:none;padding:0 22px}
    h1{font-size:clamp(34px,11vw,52px)}
    .kicker{margin-bottom:14px;font-size:10px;padding:6px 12px}
    .sub{display:block;margin-top:14px;font-size:13.5px;max-width:88%}
    .hint{display:none}
    .meta{display:none}
    .dock{gap:10px;padding:11px 13px;flex-wrap:wrap;justify-content:center;width:calc(100vw - 28px);max-width:430px}
    .timeWrap{width:100%;order:3}
  }
  @media (max-width:430px){
    .sub{display:none}
    .brand .name small{display:none}
  }
  @media (max-height:520px){
    .headline{display:none}
  }
</style>
</head>
<body>
<div id="stage">
  <svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-label="늦잠 자는 태양 일러스트">
    <defs>
      <!-- sky gradient (animated via JS by swapping stop colors) -->
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#10122b" id="sky0"/>
        <stop offset="0.5" stop-color="#1b2150" id="sky1"/>
        <stop offset="1"   stop-color="#2c3a78" id="sky2"/>
      </linearGradient>
      <radialGradient id="dawnGlow" cx="0.82" cy="0.62" r="0.7">
        <stop offset="0" stop-color="#ffd27a" stop-opacity="0" id="dawn0"/>
        <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="sunBody" cx="0.36" cy="0.3" r="0.85">
        <stop offset="0" stop-color="#fff6cf"/>
        <stop offset="0.55" stop-color="#ffce4d"/>
        <stop offset="1" stop-color="#f9a13b"/>
      </radialGradient>
      <radialGradient id="moonBody" cx="0.36" cy="0.32" r="0.85">
        <stop offset="0" stop-color="#fbfcff"/>
        <stop offset="1" stop-color="#cdd3e6"/>
      </radialGradient>
      <linearGradient id="grassG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a7a52" id="gr0"/>
        <stop offset="1" stop-color="#3f6a47" id="gr1"/>
      </linearGradient>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="7"/>
      </filter>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="14" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- ===== SKY ===== -->
    <rect x="0" y="0" width="1600" height="1000" fill="url(#sky)"/>
    <rect x="0" y="0" width="1600" height="1000" fill="url(#dawnGlow)" id="dawnRect"/>

    <!-- ===== STARS (parallax far) ===== -->
    <g id="stars"></g>
    <g id="clouds" opacity="0"></g>

    <!-- ===== SUN RAYS halo behind everything sky-side ===== -->
    <g id="sunHalo" opacity="0" transform="translate(1230,360)">
      <g id="rayRing"></g>
    </g>

    <!-- ===== MOON (clocking out, top-left) ===== -->
    <g id="moon" transform="translate(330,250)" class="clickable">
      <g id="moonFloat">
        <circle r="62" fill="url(#moonBody)" stroke="#241f1c" stroke-width="6"/>
        <!-- craters -->
        <circle cx="-22" cy="-26" r="9" fill="#bcc3da" stroke="#241f1c" stroke-width="2.5"/>
        <circle cx="24" cy="14" r="13" fill="#bcc3da" stroke="#241f1c" stroke-width="2.5"/>
        <circle cx="-6" cy="30" r="6" fill="#bcc3da" stroke="#241f1c" stroke-width="2.5"/>
        <!-- sleepy face -->
        <g transform="translate(0,2)">
          <path d="M -30,-6 Q -20,-12 -10,-6" fill="none" stroke="#241f1c" stroke-width="5" stroke-linecap="round" id="moonEyeL"/>
          <path d="M 10,-6 Q 20,-12 30,-6" fill="none" stroke="#241f1c" stroke-width="5" stroke-linecap="round" id="moonEyeR"/>
          <ellipse cx="-26" cy="8" rx="8" ry="5" fill="#f6a6c6" opacity="0.55"/>
          <ellipse cx="26" cy="8" rx="8" ry="5" fill="#f6a6c6" opacity="0.55"/>
          <path d="M -9,22 Q 0,15 9,22" fill="none" stroke="#241f1c" stroke-width="4.5" stroke-linecap="round"/>
        </g>
        <!-- nightcap -->
        <path d="M -46,-40 Q 0,-92 50,-40 Q 4,-58 -46,-40 Z" fill="#7c6fb0" stroke="#241f1c" stroke-width="5" stroke-linejoin="round"/>
        <circle cx="52" cy="-44" r="9" fill="#f4f0d8" stroke="#241f1c" stroke-width="4"/>
        <!-- zzz -->
        <g id="moonZzz" fill="#fff" stroke="#241f1c" stroke-width="2" font-family="Jua,sans-serif" font-weight="bold">
          <text x="58" y="-58" font-size="22">z</text>
          <text x="76" y="-78" font-size="28">Z</text>
        </g>
      </g>
    </g>

    <!-- ===== ROLLING HILLS (back) ===== -->
    <path id="hillBack" d="M 0,720 Q 320,650 700,700 Q 1100,755 1600,690 L 1600,1000 L 0,1000 Z"
      fill="#34614a" stroke="#241f1c" stroke-width="0"/>
    <!-- ===== FOREGROUND GRASS ===== -->
    <path id="grassFront" d="M 0,800 Q 260,738 540,772 Q 820,806 1120,762 Q 1360,728 1600,772 L 1600,1000 L 0,1000 Z"
      fill="url(#grassG)" stroke="#241f1c" stroke-width="8" stroke-linejoin="round"/>

    <!-- little path of grass tufts -->
    <g id="tufts" stroke="#2f5a3b" stroke-width="5" stroke-linecap="round" opacity="0.8"></g>

    <!-- ===== TREE ===== -->
    <g id="tree" transform="translate(190,640)">
      <rect x="-16" y="60" width="32" height="120" rx="10" fill="#7a4a33" stroke="#241f1c" stroke-width="6"/>
      <ellipse cx="0" cy="20" rx="92" ry="78" fill="#3f6a47" stroke="#241f1c" stroke-width="6"/>
      <ellipse cx="-44" cy="48" rx="56" ry="46" fill="#477a52" stroke="#241f1c" stroke-width="6"/>
      <ellipse cx="50" cy="44" rx="52" ry="44" fill="#477a52" stroke="#241f1c" stroke-width="6"/>
      <circle cx="-30" cy="-6" r="6" fill="#e8607a" stroke="#241f1c" stroke-width="2.5" id="apple1"/>
      <circle cx="36" cy="22" r="6" fill="#e8607a" stroke="#241f1c" stroke-width="2.5" id="apple2"/>
      <circle cx="6" cy="44" r="6" fill="#e8607a" stroke="#241f1c" stroke-width="2.5"/>
    </g>

    <!-- ===== THE HOUSE with open bedroom ===== -->
    <g id="house" transform="translate(940,470)">
      <!-- body -->
      <rect x="0" y="120" width="440" height="320" fill="#e7d3b0" stroke="#241f1c" stroke-width="8"/>
      <!-- roof -->
      <polygon points="-30,120 220,-30 470,120" fill="#c0623e" stroke="#241f1c" stroke-width="8" stroke-linejoin="round"/>
      <polygon points="-30,120 220,-30 470,120" fill="none" stroke="#a04e30" stroke-width="0"/>
      <!-- roof shingle lines -->
      <g stroke="#a04e30" stroke-width="3" opacity="0.6">
        <line x1="30" y1="98" x2="410" y2="98"/>
        <line x1="70" y1="70" x2="370" y2="70"/>
        <line x1="110" y1="42" x2="330" y2="42"/>
      </g>
      <!-- chimney with smoke -->
      <rect x="330" y="-2" width="42" height="78" fill="#9a503a" stroke="#241f1c" stroke-width="6"/>
      <rect x="324" y="-12" width="54" height="16" rx="4" fill="#7a3e2c" stroke="#241f1c" stroke-width="5"/>
      <g id="smoke" fill="#d8d3c8" opacity="0.0">
        <circle cx="351" cy="-30" r="11"/>
        <circle cx="361" cy="-52" r="14"/>
        <circle cx="346" cy="-78" r="17"/>
      </g>

      <!-- BEDROOM cut-out -->
      <g id="bedroom">
        <rect x="120" y="170" width="280" height="230" fill="#fff4e0" stroke="#241f1c" stroke-width="7"/>
        <!-- wallpaper stripes -->
        <g stroke="#f2dcb8" stroke-width="10" opacity="0.9">
          <line x1="160" y1="170" x2="160" y2="400"/>
          <line x1="210" y1="170" x2="210" y2="400"/>
          <line x1="260" y1="170" x2="260" y2="400"/>
          <line x1="310" y1="170" x2="310" y2="400"/>
          <line x1="360" y1="170" x2="360" y2="400"/>
        </g>
        <!-- window inside, small picture -->
        <rect x="132" y="186" width="56" height="56" rx="6" fill="#bfe2ff" stroke="#241f1c" stroke-width="5"/>
        <circle cx="160" cy="206" r="9" fill="#ffe27a" stroke="#241f1c" stroke-width="3" id="picSun"/>
        <path d="M 136,232 q 12,-10 24,0 q 12,-10 24,0" fill="none" stroke="#7fb98f" stroke-width="3"/>
        <!-- floor lamp -->
        <line x1="358" y1="392" x2="358" y2="300" stroke="#241f1c" stroke-width="6"/>
        <path d="M 340,300 L 376,300 L 370,278 L 346,278 Z" fill="#ffe9a8" stroke="#241f1c" stroke-width="5" stroke-linejoin="round" id="lampShade"/>
        <ellipse cx="358" cy="392" rx="22" ry="7" fill="#caa978" stroke="#241f1c" stroke-width="4"/>

        <!-- rug -->
        <ellipse cx="250" cy="392" rx="120" ry="14" fill="#e2a3a3" stroke="#241f1c" stroke-width="4"/>

        <!-- BED -->
        <g id="bed" transform="translate(150,300)">
          <!-- headboard -->
          <rect x="-8" y="-66" width="22" height="100" rx="8" fill="#9a7b59" stroke="#241f1c" stroke-width="6"/>
          <rect x="206" y="-30" width="20" height="64" rx="8" fill="#9a7b59" stroke="#241f1c" stroke-width="6"/>
          <!-- mattress -->
          <rect x="8" y="2" width="206" height="40" rx="10" fill="#fbe6c0" stroke="#241f1c" stroke-width="6"/>
          <!-- pillow -->
          <rect x="14" y="-26" width="64" height="40" rx="14" fill="#fff" stroke="#241f1c" stroke-width="6"/>
          <!-- blanket -->
          <path id="blanket" d="M 70,8 Q 150,-10 214,6 L 214,42 Q 150,30 70,46 Z"
            fill="#8a7bd0" stroke="#241f1c" stroke-width="6" stroke-linejoin="round"/>
          <path d="M 70,8 Q 150,-10 214,6" fill="none" stroke="#a99ce0" stroke-width="3"/>
          <!-- blanket fold lines -->
          <g stroke="#6f60b8" stroke-width="3" opacity="0.7">
            <path d="M 110,4 Q 112,24 108,44" fill="none"/>
            <path d="M 160,-2 Q 162,20 158,40" fill="none"/>
          </g>
        </g>

        <!-- ===== SUN CHARACTER asleep in bed ===== -->
        <g id="sunChar" transform="translate(228,272)">
          <!-- rays (rotate when awake) -->
          <g id="sunRays" opacity="0.5">
            <g stroke="#f9a13b" stroke-width="6" stroke-linecap="round" fill="none">
              <line x1="0" y1="-58" x2="0" y2="-78"/>
              <line x1="42" y1="-42" x2="56" y2="-56"/>
              <line x1="58" y1="0" x2="80" y2="0"/>
              <line x1="42" y1="42" x2="56" y2="56"/>
              <line x1="-42" y1="-42" x2="-56" y2="-56"/>
              <line x1="-58" y1="0" x2="-80" y2="0"/>
              <line x1="-42" y1="42" x2="-56" y2="56"/>
            </g>
          </g>
          <!-- head -->
          <circle r="50" fill="url(#sunBody)" stroke="#241f1c" stroke-width="7" id="sunHead"/>
          <!-- cheeks -->
          <ellipse cx="-26" cy="14" rx="10" ry="6.5" fill="#f6926b" opacity="0.65"/>
          <ellipse cx="26" cy="14" rx="10" ry="6.5" fill="#f6926b" opacity="0.65"/>
          <!-- eyes: closed (sleep) default -->
          <g id="eyesClosed">
            <path d="M -30,-4 Q -18,7 -6,-4" fill="none" stroke="#241f1c" stroke-width="5" stroke-linecap="round"/>
            <path d="M 6,-4 Q 18,7 30,-4" fill="none" stroke="#241f1c" stroke-width="5" stroke-linecap="round"/>
          </g>
          <!-- eyes: open (awake) hidden default -->
          <g id="eyesOpen" opacity="0">
            <circle cx="-18" cy="-4" r="11" fill="#fff" stroke="#241f1c" stroke-width="4"/>
            <circle cx="18" cy="-4" r="11" fill="#fff" stroke="#241f1c" stroke-width="4"/>
            <circle cx="-15" cy="-2" r="5" fill="#241f1c" id="pupilL"/>
            <circle cx="21" cy="-2" r="5" fill="#241f1c" id="pupilR"/>
            <circle cx="-17" cy="-4" r="1.8" fill="#fff"/>
            <circle cx="19" cy="-4" r="1.8" fill="#fff"/>
          </g>
          <!-- mouth: sleepy O default -->
          <ellipse id="mouthSleep" cx="0" cy="22" rx="7" ry="9" fill="#9a3b2c" stroke="#241f1c" stroke-width="4"/>
          <!-- mouth: smile hidden -->
          <path id="mouthSmile" d="M -16,18 Q 0,34 16,18" fill="none" stroke="#241f1c" stroke-width="5" stroke-linecap="round" opacity="0"/>
          <!-- sleeping bubble Zzz -->
          <g id="sunZzz" font-family="Jua,sans-serif" fill="#fff" stroke="#241f1c" stroke-width="2.5" font-weight="bold">
            <text x="44" y="-30" font-size="20">z</text>

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const NS = "http://www.w3.org/2000/svg";

/* ---------- build stars ---------- */
(function stars(){
  const g = $("#stars");
  const W=1600,H=760, N=120;
  let html="";
  for(let i=0;i<N;i++){
    const x=Math.random()*W, y=Math.random()*H*0.95;
    const r=Math.random()*1.6+0.5;
    const tw=(Math.random()*3+2).toFixed(2);
    const dl=(Math.random()*4).toFixed(2);
    if(Math.random()<0.12){
      // sparkle star
      const s=(Math.random()*4+4).toFixed(1);
      html+=`<g class="star" transform="translate(${x.toFixed(1)},${y.toFixed(1)})" style="--tw:${tw}s;--dl:${dl}s">
        <path d="M0,-${s} L${(s*0.28).toFixed(1)},-${(s*0.28).toFixed(1)} L${s},0 L${(s*0.28).toFixed(1)},${(s*0.28).toFixed(1)} L0,${s} L-${(s*0.28).toFixed(1)},${(s*0.28).toFixed(1)} L-${s},0 L-${(s*0.28).toFixed(1)},-${(s*0.28).toFixed(1)} Z" fill="#fff6df"/></g>`;
    } else {
      html+=`<circle class="star" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="#f4f3ee" style="--tw:${tw}s;--dl:${dl}s"/>`;
    }
  }
  g.innerHTML=html;
})();

/* twinkle css injected */
(function(){
  const st=document.createElement("style");
  st.textContent=`
  .star{animation:twk var(--tw) ease-in-out infinite alternate;animation-delay:var(--dl);transform-box:fill-box;transform-origin:center}
  @keyframes twk{from{opacity:.25}to{opacity:1}}
  `;
  document.head.appendChild(st);
})();

/* ---------- build sun ray ring (halo) ---------- */
(function rayRing(){
  const g=$("#rayRing");
  let html="";
  for(let i=0;i<16;i++){
    const a=i*(360/16);
    html+=`<line x1="0" y1="-150" x2="0" y2="-200" stroke="#ffd27a" stroke-width="10" stroke-linecap="round" transform="rotate(${a})" opacity="0.8"/>`;
  }
  html+=`<circle r="140" fill="#ffe27a" opacity="0.18"/>`;
  g.innerHTML=html;
})();

/* ---------- grass tufts ---------- */
(function tufts(){
  const g=$("#tufts");
  let html="";
  for(let i=0;i<40;i++){
    const x=(Math.random()*1600).toFixed(0);
    const y=(820+Math.random()*150).toFixed(0);
    const h=(8+Math.random()*14).toFixed(0);
    html+=`<path d="M ${x},${y} q -3,-${h} 0,-${(h*1.2).toFixed(0)} M ${x},${y} q 3,-${h} 0,-${(h*1.2).toFixed(0)}"/>`;
  }
  g.innerHTML=html;
})();

/* ---------- sparkles (fireflies that fade with dawn) ---------- */
(function sparks(){
  const g=$("#sparks");
  let html="";
  for(let i=0;i<14;i++){
    const x=(150+Math.random()*1300).toFixed(0);
    const y=(560+Math.random()*240).toFixed(0);
    const dl=(Math.random()*5).toFixed(2);
    html+=`<circle class="firefly" cx="${x}" cy="${y}" r="2.6" fill="#fff3a8" style="--dl:${dl}s"/>`;
  }
  g.innerHTML=html;
  const st=document.createElement("style");
  st.textContent=`.firefly{filter:drop-shadow(0 0 6px #ffe27a);animation:ff 3.4s ease-in-out infinite;animation-delay:var(--dl)}
  @keyframes ff{0%,100%{opacity:.1;transform:translateY(0)}50%{opacity:.95;transform:translateY(-8px)}}`;
  document.head.appendChild(st);
})();

/* ---------- clouds (appear by day) ---------- */
(function clouds(){
  const g=$("#clouds");
  function cloud(x,y,s){
    return `<g transform="translate(${x},${y}) scale(${s})">
      <ellipse cx="0" cy="0" rx="60" ry="34" fill="#ffffff" stroke="#241f1c" stroke-width="5"/>
      <ellipse cx="-44" cy="8" rx="36" ry="24" fill="#ffffff" stroke="#241f1c" stroke-width="5"/>
      <ellipse cx="46" cy="8" rx="40" ry="26" fill="#ffffff" stroke="#241f1c" stroke-width="5"/>
      <rect x="-80" y="14" width="168" height="22" fill="#ffffff"/>
    </g>`;
  }
  g.innerHTML = cloud(360,180,1)+cloud(820,120,0.78)+cloud(1240,210,0.9);
})();

/* ================= COLOR INTERPOLATION ================= */
function hx(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mix(a,b,t){const A=hx(a),B=hx(b);return `rgb(${Math.round(A[0]+(B[0]-A[0])*t)},${Math.round(A[1]+(B[1]-A[1])*t)},${Math.round(A[2]+(B[2]-A[2])*t)})`;}
function lerp(a,b,t){return a+(b-a)*t;}
function clamp01(x){return Math.max(0,Math.min(1,x));}

const PAL={
  night:{ sky0:"#0c0e26", sky1:"#171d4a", sky2:"#283672", gr0:"#34614a", gr1:"#2a5440" },
  dawn :{ sky0:"#3a2f63", sky1:"#7e5f8e", sky2:"#f0a86b", gr0:"#4a7a52", gr1:"#3f6a47" },
  day  :{ sky0:"#7ec8ff", sky1:"#bfe6ff", sky2:"#fbe6b6", gr0:"#74c06b", gr1:"#5aa857" }
};

function setSky(t){ // t 0..1 night->day
  let a,b,seg;
  if(t<0.5){ a=PAL.night;b=PAL.dawn; seg=t/0.5; }
  else { a=PAL.dawn;b=PAL.day; seg=(t-0.5)/0.5; }
  $("#sky0").setAttribute("stop-color",mix(a.sky0,b.sky0,seg));
  $("#sky1").setAttribute("stop-color",mix(a.sky1,b.sky1,seg));
  $("#sky2").setAttribute("stop-color",mix(a.sky2,b.sky2,seg));
  $("#gr0").setAttribute("stop-color",mix(a.gr0,b.gr0,seg));
  $("#gr1").setAttribute("stop-color",mix(a.gr1,b.gr1,seg));

  // dawn glow strongest mid
  const glow = Math.sin(t*Math.PI); // 0 at ends, 1 at middle
  $("#dawn0").setAttribute("stop-opacity",(0.55*Math.max(t<0.85?glow:0, t>0.5?(t-0.5)*1.4:0)).toFixed(2));
  $("#dawnRect").setAttribute("opacity", clamp01(0.2+t*0.8).toFixed(2));

  // stars fade out
  $("#stars").setAttribute("opacity", clamp01(1 - t*1.7).toFixed(2));
  $("#sparks").setAttribute("opacity", clamp01(1 - t*2).toFixed(2));
  // clouds fade in
  $("#clouds").setAttribute("opacity", clamp01((t-0.55)*2.4).toFixed(2));
  // moon leaves (drift up-left & fade)
  const md = t;
  $("#moon").setAttribute("transform",`translate(${330 - md*220},${250 - md*230})`);
  $("#moon").setAttribute("opacity", clamp01(1 - (t-0.3)*1.9).toFixed(2));
  // sun halo grows
  $("#sunHalo").setAttribute("opacity", clamp01((t-0.4)*1.8).toFixed(2));
  $("#sunHalo").setAttribute("transform",`translate(1230,${440 - t*120}) scale(${(0.4+t*0.8).toFixed(2)})`);
  // smoke from chimney appears as morning
  $("#smoke").setAttribute("opacity", clamp01((t-0.45)*1.6).toFixed(2));

  // lamp turns off in day
  $("#lampShade").setAttribute("fill", t>0.6 ? "#e9d9b0" : "#ffe9a8");

  // body class day toggle for HUD theming
  document.body.classList.toggle("is-day", t>0.62);

  // status + clock text
  updateHUD(t);
}

function updateHUD(t){
  // clock from 04:30 -> 07:30 across t
  const total = 4.5*60 + t*180; // minutes
  const hh = Math.floor(total/60), mm = Math.floor(total%60);
  $("#clockTxt").textContent = String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
  let phase, status;
  if(t<0.34){ phase="NIGHT · 깊은 밤"; }
  else if(t<0.62){ phase="DAWN · 새벽"; }
  else if(t<0.85){ phase="SUNRISE · 해돋이"; }
  else { phase="MORNING · 아침"; }
  $("#phaseTxt").textContent = phase;
  status = awake ? (t>0.6?"눈부신 아침!":"방금 깸 😵") : (t>0.55?"늦잠 비상!":"아직 자는 중");
  $("#statusTxt").textContent = status;
}

/* ================= AWAKE STATE ================= */
let awake=false;
const sunChar=$("#sunChar");

function blendAwake(p){ // p 0 asleep .. 1 awake
  // eyes
  $("#eyesClosed").setAttribute("opacity",(1-p).toFixed(2));
  $("#eyesOpen").setAttribute("opacity",p.toFixed(2));
  // mouth
  $("#mouthSleep").setAttribute("opacity",(1-p).toFixed(2));
  $("#mouthSmile").setAttribute("opacity",p.toFixed(2));
  // zzz
  $("#sunZzz").setAttribute("opacity",(1-p).toFixed(2));
  $("#hZzz").style.opacity = (1-p).toFixed(2);
  // rays brighten + the char sits up (translate up & scale)
  $("#sunRays").setAttribute("opacity",(0.4+p*0.6).toFixed(2));
  const ty = -p*30;
  sunChar.setAttribute("transform",`translate(228,${272+ty})`);
  // blanket slides down when awake
  const bl=$("#blanket");
  bl.setAttribute("transform",`translate(0,${p*26})`);
  bl.setAttribute("opacity",(1-p*0.15).toFixed(2));
}

let awakeP=0, awakeTarget=0;
function tickAwake(){
  awakeP += (awakeTarget-awakeP)*0.08;
  blendAwake(awakeP);
  if(Math.abs(awakeTarget-awakeP)>0.001) requestAnimationFrame(tickAwake);
  else blendAwake(awakeTarget);
}
function wakeUp(){
  if(awake) return;
  awake=true; awakeTarget=1;
  tickAwake();
  // drag time toward day
  animateTimeTo(Math.max(parseInt(timeEl.value),78), 1400);
  ding(); setTimeout(ding,180);
  updateHUD(parseInt(timeEl.value)/100);
  burst($("#sunChar"));
}

/* ================= AUDIO (WebAudio, no files) ================= */
let actx=null;
function AC(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return actx; }
function tone(freq,dur,type="sine",vol=0.18,when=0){
  const c=AC(); if(!c) return;
  const t0=c.currentTime+when;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
function ring(){ // alarm trill
  for(let i=0;i<8;i++){ tone(i%2?1180:1480,0.07,"square",0.10,i*0.075); }
}
function ding(){ tone(880,0.4,"triangle",0.16,0); tone(1320,0.5,"sine",0.10,0.02); }
function chirp(){ tone(2100,0.06,"sine",0.12,0); tone(2600,0.07,"sine",0.10,0.06); }
function crowSound(){ // doodle-doo-ish glide
  const c=AC(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type="sawtooth"; const t0=c.currentTime;
  o.frequency.setValueAtTime(520,t0);
  o.frequency.linearRampToValueAtTime(760,t0+0.12);
  o.frequency.linearRampToValueAtTime(420,t0+0.34);
  o.frequency.linearRampToValueAtTime(640,t0+0.5);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(0.12,t0+0.04);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+0.6);
  o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+0.62);
}

/* ================= INTERACTIONS ================= */
const timeEl=$("#time");

let animId=null;
function animateTimeTo(target,ms){
  cancelAnimationFrame(animId);
  const start=parseInt(timeEl.value), t0=performance.now();
  function step(now){
    const k=Math.min(1,(now-t0)/ms);
    const e=1-Math.pow(1-k,3);
    const v=Math.round(start+(target-start)*e);
    timeEl.value=v; setSky(v/100);
    if(k<1) animId=requestAnimationFrame(step);
  }
  animId=requestAnimationFrame(step);
}

let userTouched=false;
timeEl.addEventListener("input",()=>{
  userTouched=true;
  cancelAnimationFrame(animId);   // stop any auto-drift the moment the user grabs the slider
  setSky(parseInt(timeEl.value)/100);
});

/* alarm clock: shake + ring, and nudges sun awake a bit */
let shakeT=null;
function shakeClock(){
  AC();
  ring();
  $("#ringFx").setAttribute("opacity","1");
  const grp=$("#clockShake");
  let n=0;
  clearInterval(shakeT);
  shakeT=setInterval(()=>{
    n++;
    const a=(n%2?1:-1)*7;
    const dx=(n%2?1:-1)*4;
    grp.setAttribute("transform",`rotate(${a} 14 6) translate(${dx} ${ -Math.abs(a)*0.2 })`);
    // bells flash
    $("#bellL").setAttribute("fill", n%2?"#ff7a7a":"#ff5a5a");
    $("#bellR").setAttribute("fill", n%2?"#ff5a5a":"#ff7a7a");
    if(n>14){
      clearInterval(shakeT);
      grp.setAttribute("transform","rotate(0 14 6)");
      $("#ringFx").setAttribute("opacity","0");
    }
  },60);
  // nudge sun: little jump + advance time slightly
  jolt($("#sunChar"));
  const v=parseInt(timeEl.value);
  if(!awake) animateTimeTo(Math.min(v+10,58),700);
  // 3 clicks -> wake
  alarmHits++;
  if(alarmHits>=3) wakeUp();
}
let alarmHits=0;
$("#clockGrp").addEventListener("click",shakeClock);

/* clicking the sun directly wakes him */
$("#sunChar").parentElement.addEventListener("click",(e)=>{
  // only when clicking near sun (it's inside bedroom group); easier: dedicated handler
});
$("#sunChar").addEventListener("click",(e)=>{ e.stopPropagation(); AC(); wakeUp(); });
$("#sunChar").classList.add("clickable");

$("#wake").addEventListener("click",()=>{ AC(); wakeUp(); });

/* rooster crows */
$("#rooster").addEventListener("click",()=>{
  AC(); crowSound();
  $("#crow").setAttribute("opacity","1");
  $("#beakTop").setAttribute("transform","rotate(-14 -44 -16)");
  const rb=$("#roosterBob");
  rb.setAttribute("transform","translate(0,-6)");
  setTimeout(()=>{ $("#crow").setAttribute("opacity","0"); $("#beakTop").removeAttribute("transform"); rb.setAttribute("transform","translate(0,0)"); },520);
  if(!awake){ alarmHits++; if(alarmHits>=3) wakeUp(); else animateTimeTo(Math.min(parseInt(timeEl.value)+6,56),600); }
});

/* bird chirps + taps */
$("#bird").addEventListener("click",()=>{
  AC(); chirp();
  $("#birdNote").setAttribute("opacity","1");
  const b=$("#birdBob"); let k=0;
  const iv=setInterval(()=>{ k++; b.setAttribute("transform",`translate(${k%2?-5:5},0)`); if(k>5){clearInterval(iv); b.setAttribute("transform","translate(0,0)"); $("#birdNote").setAttribute("opacity","0");} },70);
});

/* moon click: yawns and drifts faster */
$("#moon").addEventListener("click",()=>{
  AC(); tone(330,0.5,"sine",0.12,0);
  const f=$("#moonFloat"); f.style.transition="transform .5s ease"; f.setAttribute("transform","translate(0,-10) scale(1.06)");
  setTimeout(()=>f.setAttribute("transform","translate(0,0) scale(1)"),520);
});

/* ---------- little physics-ish helpers ---------- */
function jolt(el){
  let k=0; const base=el.getAttribute("transform")||"";
  const m=base.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  const bx=m?+m[1]:0, by=m?+m[2]:0;
  const iv=setInterval(()=>{ k++; el.setAttribute("transform",`translate(${bx},${by-(k%2?6:0)})`); if(k>6){clearInterval(iv); el.setAttribute("transform",`translate(${bx},${by})`);} },55);
}
function burst(el){
  // sparkle burst around sun
  const svg=$("#scene");
  const cx=1168+228, cy=470+272; // sun world coords (house tx + sunchar tx)
  // approximate using bbox
  let bb; try{ bb=el.getBoundingClientRect(); }catch(e){}
  for(let i=0;i<10;i++){
    const s=document.createElementNS(NS,"circle");
    const ang=i*36*Math.PI/180, R=10;
    s.setAttribute("cx",1168);s.setAttribute("cy",742);
    s.setAttribute("r",3.4);s.setAttribute("fill","#fff3a8");
    s.setAttribute("filter","url(#glow)");
    $("#sparks").appendChild(s);
    const dx=Math.cos(ang)*90, dy=Math.sin(ang)*90;
    s.animate([{transform:"translate(0,0)",opacity:1},{transform:`translate(${dx}px,${dy}px)`,opacity:0}],
      {duration:700,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=()=>s.remove();
  }
}

/* ================= AMBIENT LOOPS ================= */
// rooster idle bob
let rb=0; setInterval(()=>{ rb=(rb+1)%2; const e=$("#roosterBob"); if(!e.getAttribute("transform")||e.getAttribute("transform")==="translate(0,0)"||e.getAttribute("transform")===`translate(0,${rb?-2:0})`) e.setAttribute("transform",`translate(0,${rb?-2:0})`);},900);
// clock hands tick
let tickN=0;
setInterval(()=>{ tickN++; const a=tickN*6; $("#handM").setAttribute("transform",`rotate(${a} 14 6)`); $("#handH").setAttribute("transform",`rotate(${a/12} 14 6)`); },1000);

// breathing of sleeping sun (subtle scale) when asleep
let breathe=0;
function breath(){
  breathe+=0.04;
  if(awakeP<0.5){
    const s=1+Math.sin(breathe)*0.02;
    $("#sunHead").setAttribute("transform",`scale(${s})`);
  } else { $("#sunHead").removeAttribute("transform"); }
  requestAnimationFrame(breath);
}
breath();

// blanket gentle rise/fall while sleeping
let bb2=0;
setInterval(()=>{ if(awakeP<0.5){ bb2+=0.5; const dy=Math.sin(bb2)*1.5; const bl=$("#blanket"); bl.setAttribute("transform",`translate(0,${dy})`);} },120);

// moon zzz float
let mz=0; setInterval(()=>{ mz+=0.5; $("#moonZzz").setAttribute("transform",`translate(0,${Math.sin(mz)*2.5})`); },140);

// sun rays slow rotate when awake
let rr=0;
function rotateRays(){ if(awakeP>0.4){ rr+=0.3; $("#sunRays").setAttribute("transform",`rotate(${rr})`); $("#rayRing").setAttribute("transform",`rotate(${-rr*0.6})`);} requestAnimationFrame(rotateRays); }
rotateRays();

// auto-crow every ~9s if still asleep (the rooster keeps trying)
setInterval(()=>{ if(!awake && document.visibilityState==="visible"){ $("#rooster").dispatchEvent(new Event("click")); } }, 9000);

/* ================= PARALLAX ================= */
const stage=$("#stage");
let px=0,py=0,tx=0,ty=0;
window.addEventListener("pointermove",e=>{
  const nx=(e.clientX/window.innerWidth-0.5);
  const ny=(e.clientY/window.innerHeight-0.5);
  tx=nx; ty=ny;
});
function plx(){
  px+=(tx-px)*0.06; py+=(ty-py)*0.06;
  $("#stars").style.transform=`translate(${px*-22}px,${py*-12}px)`;
  $("#clouds").style.transform=`translate(${px*-40}px,${py*-16}px)`;
  $("#moon").style.transform=`translate(${px*-30}px,${py*-16}px)`;
  $("#tree").style.transform=`translate(${px*26}px,${py*10}px)`;
  $("#clockGrp").style.transform=`translate(${px*40}px,${py*16}px)`;
  $("#rooster").style.transform=`translate(${px*-14}px,${py*-8}px)`;
  $("#bird").style.transform=`translate(${px*18}px,${py*8}px)`;
  requestAnimationFrame(plx);
}
plx();

/* ================= INIT ================= */
setSky(parseInt(timeEl.value)/100);
blendAwake(0);

// gentle entrance: drift time slightly so first paint already breathes (only if untouched)
setTimeout(()=>{ if(!awake && !userTouched) animateTimeTo(22,2600); }, 600);

// unlock audio on first gesture
["pointerdown","keydown"].forEach(ev=>window.addEventListener(ev,()=>AC(),{once:true}));
</script>
</body>
