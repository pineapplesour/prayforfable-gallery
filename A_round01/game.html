<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>PRISM // BREAKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#05060c;
    --ink:#eef2ff;
    --dim:#7b86b8;
    --c1:#ff3d7f;   /* magenta */
    --c2:#39e6ff;   /* cyan */
    --c3:#ffd24a;   /* gold */
    --c4:#9b5cff;   /* violet */
    --c5:#4dff9e;   /* mint */
    --glass:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;overflow:hidden}
  body{position:fixed;inset:0}

  /* ---------- ambient field ---------- */
  #void{position:fixed;inset:0;z-index:0}
  .grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
  .vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 38%, transparent 40%, rgba(0,0,0,.55) 100%);}
  .scan{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.022) 0 1px, transparent 1px 3px);}

  /* ---------- stage / canvas ---------- */
  #stageWrap{position:fixed;inset:0;z-index:4;display:grid;place-items:center}
  #stage{position:relative;filter:drop-shadow(0 40px 120px rgba(0,0,0,.6))}
  #game{display:block;border-radius:18px;
    box-shadow:0 0 0 1px var(--line), inset 0 0 60px rgba(57,230,255,.04), 0 30px 90px rgba(0,0,0,.65);}

  /* ---------- HUD ---------- */
  #hud{position:fixed;z-index:6;left:50%;top:0;transform:translateX(-50%);
    width:min(96vw,720px);padding:14px clamp(8px,2.5vw,22px);
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    pointer-events:none;opacity:0;transition:opacity .5s}
  #hud.on{opacity:1}
  .hud-block{display:flex;flex-direction:column;gap:2px}
  .hud-lbl{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.32em;
    text-transform:uppercase;color:var(--dim)}
  .hud-val{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:clamp(18px,2.4vw,26px);
    line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  #scoreVal{color:var(--c2);text-shadow:0 0 22px rgba(57,230,255,.5)}
  #comboVal{color:var(--c1);text-shadow:0 0 22px rgba(255,61,127,.5)}
  .hud-mid{align-items:center}
  #lives{display:flex;gap:6px;margin-top:3px}
  .pip{width:11px;height:11px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--c1) 60%, #7a0a36 100%);
    box-shadow:0 0 12px rgba(255,61,127,.6);transition:.25s}
  .pip.dead{background:#1b1f33;box-shadow:none;transform:scale(.7);opacity:.5}

  /* ---------- TITLE overlay ---------- */
  #title{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(130% 100% at 50% 30%, rgba(8,10,22,.35), rgba(3,4,9,.86) 70%);
    backdrop-filter:blur(2px);transition:opacity .55s, transform .55s;padding:24px}
  #title.gone{opacity:0;transform:scale(1.06);pointer-events:none}
  .kicker{font-family:"JetBrains Mono",monospace;font-size:clamp(10px,1.6vw,12px);
    letter-spacing:.55em;text-transform:uppercase;color:var(--c2);
    margin-bottom:18px;opacity:0;animation:rise .8s .15s both}
  .kicker b{color:var(--c1)}
  .logo{position:relative;line-height:.82;font-weight:700;letter-spacing:-.04em;
    font-size:clamp(56px,15.5vw,168px)}
  .logo .l1{display:block;background:linear-gradient(95deg,#fff 10%,var(--c2) 55%,var(--c4) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 40px rgba(57,230,255,.25));opacity:0;animation:rise .9s .25s both}
  .logo .l2{display:block;background:linear-gradient(95deg,var(--c1) 0%,var(--c3) 60%,#fff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 40px rgba(255,61,127,.3));opacity:0;animation:rise .9s .4s both}
  .logo .slash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);
    font-family:"JetBrains Mono",monospace;font-weight:800;color:var(--c3);
    font-size:.5em;letter-spacing:0;text-shadow:0 0 30px rgba(255,210,74,.6);
    opacity:0;animation:rise .8s .55s both}
  .tag{margin-top:22px;max-width:480px;color:var(--dim);font-size:clamp(13px,1.7vw,15px);
    line-height:1.6;letter-spacing:.01em;opacity:0;animation:rise .9s .6s both}
  .tag em{color:var(--ink);font-style:normal;font-weight:500}
  #play{margin-top:34px;position:relative;cursor:pointer;border:none;
    font-family:"JetBrains Mono",monospace;font-weight:800;letter-spacing:.18em;
    font-size:clamp(13px,1.8vw,15px);text-transform:uppercase;color:#05060c;
    padding:17px 46px;border-radius:999px;
    background:linear-gradient(100deg,var(--c2),var(--c5));
    box-shadow:0 0 0 1px rgba(255,255,255,.4), 0 14px 40px rgba(57,230,255,.4);
    opacity:0;animation:rise .9s .75s both, pulse 2.4s 1.6s infinite}
  #play:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.6),0 20px 56px rgba(57,230,255,.6)}
  #play:active{transform:translateY(0) scale(.97)}
  .hint{margin-top:18px;font-family:"JetBrains Mono",monospace;font-size:11px;
    letter-spacing:.22em;color:var(--dim);text-transform:uppercase;
    opacity:0;animation:rise 1s 1s both}
  .hint kbd{display:inline-block;padding:2px 8px;margin:0 2px;border-radius:6px;
    border:1px solid var(--line);background:var(--glass);color:var(--ink);font-weight:500}
  .credit{position:fixed;left:0;right:0;bottom:14px;z-index:8;text-align:center;
    font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.4em;
    color:rgba(123,134,184,.45);text-transform:uppercase;pointer-events:none}

  /* ---------- toast / banner ---------- */
  #banner{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(.6);
    z-index:7;pointer-events:none;text-align:center;opacity:0;
    font-weight:700;letter-spacing:-.02em;font-size:clamp(34px,7vw,74px);
    background:linear-gradient(95deg,var(--c3),var(--c1));-webkit-background-clip:text;
    background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(255,61,127,.4))}
  #banner.show{animation:bannerPop 1.1s cubic-bezier(.2,1.3,.4,1) both}

  /* ---------- mobile control hint ---------- */
  .mctl{position:fixed;z-index:6;bottom:18px;left:50%;transform:translateX(-50%);
    font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.25em;
    color:var(--dim);text-transform:uppercase;opacity:0;transition:.4s;pointer-events:none}
  .mctl.on{opacity:.8}

  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.4),0 14px 40px rgba(57,230,255,.4)}
    50%{box-shadow:0 0 0 1px rgba(255,255,255,.6),0 14px 64px rgba(57,230,255,.75)}}
  @keyframes bannerPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
    18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
    32%{transform:translate(-50%,-50%) scale(1)}
    78%{opacity:1}100%{opacity:0;transform:translate(-50%,-58%) scale(1)}}

  @media (max-width:560px){
    .logo .slash{font-size:.42em}
    #hud{padding-top:10px}
  }
</style>
</head>
<body>
  <canvas id="void"></canvas>
  <div class="scan"></div>
  <div class="grain"></div>
  <div class="vignette"></div>

  <div id="stageWrap"><div id="stage"><canvas id="game"></canvas></div></div>

  <div id="hud">
    <div class="hud-block">
      <span class="hud-lbl">Score</span>
      <span class="hud-val" id="scoreVal">000000</span>
    </div>
    <div class="hud-block hud-mid">
      <span class="hud-lbl">Wave</span>
      <span class="hud-val" id="waveVal" style="color:var(--c3);text-shadow:0 0 22px rgba(255,210,74,.45)">1</span>
      <div id="lives"></div>
    </div>
    <div class="hud-block" style="align-items:flex-end">
      <span class="hud-lbl">Combo</span>
      <span class="hud-val" id="comboVal">x1</span>
    </div>
  </div>

  <div id="banner"></div>
  <div class="mctl" id="mctl">◂ DRAG TO MOVE ▸</div>

  <div id="title">
    <span class="kicker"><b>◈</b>&nbsp; LUMEN ARCADE &nbsp;·&nbsp; SINGLE&nbsp;FILE &nbsp;<b>◈</b></span>
    <h1 class="logo">
      <span class="l1">PRISM</span>
      <span class="slash">//</span>
      <span class="l2">BREAKER</span>
    </h1>
    <p class="tag">보이드 속을 떠다니는 <em>빛의 결정</em>을 깨라.<br/>한 번의 튕김, 한 번의 콤보. 모든 파편이 소리로 터진다.</p>
    <button id="play">▶ &nbsp;Insert&nbsp;Light</button>
    <p class="hint"><kbd>← →</kbd> 또는 <kbd>마우스</kbd> 이동 · <kbd>SPACE</kbd> 발사 · <kbd>P</kbd> 일시정지</p>
  </div>
  <div class="credit">PRISM // BREAKER — A3 SINGLE-FILE BUILD · WEBAUDIO · NO LIBS</div>

<script>
"use strict";
/* ============================================================
   PRISM // BREAKER  — single-file neon breakout
   ============================================================ */
(function(){
  const VW = innerWidth, VH = innerHeight, DPR = Math.min(devicePixelRatio||1, 2);

  /* ---------- ambient void canvas ---------- */
  const vc = document.getElementById('void'), vx = vc.getContext('2d');
  function fitVoid(){ vc.width = innerWidth*DPR; vc.height = innerHeight*DPR; vc.style.width=innerWidth+'px'; vc.style.height=innerHeight+'px'; vx.setTransform(DPR,0,0,DPR,0,0); }
  fitVoid();
  const stars = [], NSTAR = Math.min(150, Math.floor(innerWidth*innerHeight/9000));
  for(let i=0;i<NSTAR;i++) stars.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,z:Math.random()*.9+.1,r:Math.random()*1.5+.3,tw:Math.random()*6.28});
  const orbs=[]; const ORBC=['#ff3d7f','#39e6ff','#9b5cff','#ffd24a','#4dff9e'];
  for(let i=0;i<5;i++) orbs.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*240+160,a:Math.random()*6.28,sp:(Math.random()*.0006+.0002)*(Math.random()<.5?-1:1),c:ORBC[i%ORBC.length]});
  let vt=0;
  function drawVoid(){
    vt+=0.016;
    vx.clearRect(0,0,innerWidth,innerHeight);
    // base gradient
    const g=vx.createLinearGradient(0,0,innerWidth,innerHeight);
    g.addColorStop(0,'#070811'); g.addColorStop(.5,'#04050b'); g.addColorStop(1,'#0a0712');
    vx.fillStyle=g; vx.fillRect(0,0,innerWidth,innerHeight);
    // drifting nebula orbs
    vx.globalCompositeOperation='lighter';
    for(const o of orbs){
      o.a+=o.sp; const cx=o.x+Math.cos(o.a)*60, cy=o.y+Math.sin(o.a*1.3)*50;
      const rg=vx.createRadialGradient(cx,cy,0,cx,cy,o.r);
      rg.addColorStop(0,o.c+'22'); rg.addColorStop(1,o.c+'00');
      vx.fillStyle=rg; vx.beginPath(); vx.arc(cx,cy,o.r,0,6.2832); vx.fill();
    }
    // stars
    for(const s of stars){
      s.tw+=0.04; const tw=(Math.sin(s.tw)*.5+.5);
      vx.globalAlpha=(.25+tw*.7)*s.z;
      vx.fillStyle = tw>.85?'#bff4ff':'#ffffff';
      vx.beginPath(); vx.arc(s.x,s.y,s.r*s.z,0,6.2832); vx.fill();
    }
    vx.globalAlpha=1; vx.globalCompositeOperation='source-over';
    requestAnimationFrame(drawVoid);
  }
  drawVoid();
  addEventListener('resize',()=>{fitVoid();sizeGame();});

  /* ---------- game canvas ---------- */
  const gc = document.getElementById('game'), gx = gc.getContext('2d');
  // logical play field
  let W=520, H=720; // updated on size
  function sizeGame(){
    const maxW = Math.min(innerWidth*0.96, 560);
    const maxH = innerHeight*0.92;
    let w = maxW, h = w*1.38;
    if(h>maxH){ h=maxH; w=h/1.38; }
    W=Math.round(w); H=Math.round(h);
    gc.style.width=W+'px'; gc.style.height=H+'px';
    gc.width=Math.round(W*DPR); gc.height=Math.round(H*DPR);
    gx.setTransform(DPR,0,0,DPR,0,0);
  }
  sizeGame();

  /* ---------- audio (WebAudio, no files) ---------- */
  let AC=null, master=null;
  function audioInit(){
    if(AC) return;
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value=0.6; master.connect(AC.destination);
  }
  function blip(freq, dur=0.08, type='triangle', vol=0.3, slideTo=null){
    if(!AC) return;
    const t=AC.currentTime;
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
  }
  function noiseHit(dur=0.12, vol=0.25){
    if(!AC) return;
    const t=AC.currentTime, n=Math.floor(AC.sampleRate*dur);
    const buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    const src=AC.createBufferSource(); src.buffer=buf;
    const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1200; f.Q.value=1.2;
    const g=AC.createGain(); g.gain.value=vol;
    src.connect(f); f.connect(g); g.connect(master); src.start(t);
  }
  function chord(freqs,dur=0.5,vol=0.18){ freqs.forEach((f,i)=>setTimeout(()=>blip(f,dur,'sawtooth',vol),i*55)); }

  /* ---------- game state ---------- */
  const PAL=['#ff3d7f','#39e6ff','#ffd24a','#9b5cff','#4dff9e'];
  let state='title'; // title|play|pause|over|win
  let score=0, dispScore=0, wave=1, lives=3, combo=1, comboTimer=0, maxComboThisLife=1;
  let shakeX=0, shakeY=0, shakeMag=0, flash=0, slowmo=1;
  const paddle={x:0,y:0,w:108,h:14,vx:0,tx:null};
  const balls=[];
  const bricks=[];
  const parts=[]; // particles
  const floats=[]; // floating score text
  const pops=[]; // ring shockwaves
  const drops=[]; // powerup capsules
  let stuck=true; // ball stuck to paddle before launch
  let keyL=false, keyR=false;

  function reset(full){
    if(full){ score=0; wave=1; lives=3; }
    combo=1; comboTimer=0; maxComboThisLife=1;
    paddle.w=108; paddle.x=W/2; paddle.y=H-46; paddle.vx=0; paddle.tx=null;
    balls.length=0; parts.length=0; floats.length=0; pops.length=0; drops.length=0;
    spawnBall(true); stuck=true;
  }
  function spawnBall(onPaddle){
    const b={x:paddle.x,y:paddle.y-22,r:8,vx:0,vy:0,sp:6.0+wave*0.35,trail:[]};
    if(!onPaddle){ const a=-Math.PI/2 + (Math.random()*0.6-0.3); b.vx=Math.cos(a)*b.sp; b.vy=Math.sin(a)*b.sp; }
    balls.push(b); return b;
  }

  function buildWave(){
    bricks.length=0;
    const cols = Math.min(9, 6 + Math.floor(wave/2));
    const rows = Math.min(7, 3 + Math.floor(wave/1.4));
    const pad=8, top=80, side=18;
    const bw=(W-side*2-pad*(cols-1))/cols, bh=24;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        // some gaps for shape variety
        if((wave>2) && ((r+c)%7===0) && Math.random()<0.32) continue;
        const hp = r<1?1 : (Math.random()<0.18+wave*0.02?2:1);
        bricks.push({
          x:side+c*(bw+pad), y:top+r*(bh+pad), w:bw, h:bh,
          c:PAL[(r+c)%PAL.length], hp:hp, max:hp,
          spin:Math.random()*6.28, t:Math.random()*6.28
        });
      }
    }
  }

  /* ---------- particles ---------- */
  function burst(x,y,color,n,spd){
    for(let i=0;i<n;i++){
      const a=Math.random()*6.2832, s=Math.random()*spd+1;
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,
        life:1,decay:0.018+Math.random()*0.02,sz:Math.random()*3.5+1.5,c:color,
        g:0.12,rot:Math.random()*6.28,vr:(Math.random()-.5)*.3,sq:Math.random()<.5});
    }
  }
  function shard(x,y,color){
    for(let i=0;i<6;i++){
      const a=Math.random()*6.2832, s=Math.random()*5+2;
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:0.02,sz:Math.random()*5+3,
        c:color,g:0.18,rot:Math.random()*6.28,vr:(Math.random()-.5)*.5,sq:true});
    }
  }
  function ring(x,y,color){ pops.push({x,y,r:4,max:46,life:1,c:color}); }
  function floatTxt(x,y,txt,color){ floats.push({x,y,txt,color,life:1,vy:-0.9}); }

  function shake(m){ shakeMag=Math.min(18,shakeMag+m); }

  /* ---------- input ---------- */
  const stageEl=document.getElementById('stage');
  function localX(clientX){ const r=gc.getBoundingClientRect(); return (clientX-r.left)/r.width*W; }
  function onMove(clientX){ if(state!=='play') return; paddle.tx=Math.max(paddle.w/2,Math.min(W-paddle.w/2,localX(clientX))); }
  addEventListener('mousemove',e=>onMove(e.clientX));
  addEventListener('touchmove',e=>{ if(state==='play'){e.preventDefault(); onMove(e.touches[0].clientX);} },{passive:false});
  addEventListener('touchstart',e=>{ if(state==='play'){ onMove(e.touches[0].clientX); if(stuck) launch(); } },{passive:true});
  addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'||e.key==='a') keyL=true;
    if(e.key==='ArrowRight'||e.key==='d') keyR=true;
    if(e.code==='Space'){ e.preventDefault(); if(state==='play'&&stuck) launch(); else if(state==='over'||state==='win') startGame(); }
    if(e.key==='p'||e.key==='P'){ togglePause(); }
    if(e.key==='Enter'&&state==='title') startGame();
  });
  addEventListener('keyup',e=>{ if(e.key==='ArrowLeft'||e.key==='a')keyL=false; if(e.key==='ArrowRight'||e.key==='d')keyR=false; });
  gc.addEventListener('mousedown',()=>{ if(state==='play'&&stuck) launch(); });

  function launch(){
    if(!stuck) return; stuck=false;
    for(const b of balls){ if(b.vx===0&&b.vy===0){ const a=-Math.PI/2+(Math.random()*0.4-0.2); b.vx=Math.cos(a)*b.sp; b.vy=Math.sin(a)*b.sp; } }
    blip(620,0.12,'square',0.22,1100);
  }

  /* ---------- flow ---------- */
  const titleEl=document.getElementById('title');
  const hudEl=document.getElementById('hud');
  const mctl=document.getElementById('mctl');
  const livesEl=document.getElementById('lives');
  function renderLives(){
    livesEl.innerHTML='';
    for(let i=0;i<3;i++){ const p=document.createElement('span'); p.className='pip'+(i<lives?'':' dead'); livesEl.appendChild(p); }
  }
  function startGame(){
    audioInit(); if(AC&&AC.state==='suspended') AC.resume();
    titleEl.classList.add('gone'); hudEl.classList.add('on');
    if('ontouchstart' in window) mctl.classList.add('on');
    state='play'; reset(true); buildWave(); renderLives();
    chord([330,440,550],0.4,0.14);
    banner('WAVE 1');
  }
  function togglePause(){
    if(state==='play'){ state='pause'; banner('PAUSED'); }
    else if(state==='pause'){ state='play'; document.getElementById('banner').classList.remove('show'); }
  }
  document.getElementById('play').addEventListener('click',startGame);

  const bannerEl=document.getElementById('banner');
  function banner(txt){ bannerEl.textContent=txt; bannerEl.classList.remove('show'); void bannerEl.offsetWidth; bannerEl.classList.add('show'); }

  function loseLife(){
    lives--; renderLives(); combo=1; shake(16); flash=0.6;
    blip(180,0.4,'sawtooth',0.3,60); noiseHit(0.25,0.3);
    if(lives<=0){ gameOver(); return; }
    paddle.x=W/2; spawnBall(true); stuck=true;
    banner('×'+lives+' LEFT');
  }
  function gameOver(){
    state='over'; shake(20); flash=0.8;
    chord([220,165,110],0.7,0.2);
    setTimeout(()=>showEnd('SIGNAL LOST', false),700);
  }
  function nextWave(){
    wave++; score+=500; shake(8); flash=0.4;
    chord([523,659,784,1046],0.5,0.15);
    banner('WAVE '+wave);
    if(wave>9){ winGame(); return; }
    setTimeout(()=>{ if(state==='play'){ paddle.x=W/2; balls.length=0; spawnBall(true); stuck=true; buildWave(); document.getElementById('waveVal').textContent=wave; } },300);
  }
  function winGame(){ state='win'; chord([523,659,784,1046,1318],0.6,0.18); setTimeout(()=>showEnd('VOID CLEARED', true),600); }

  function showEnd(headline, won){
    titleEl.innerHTML=''+
      '<span class="kicker" style="color:'+(won?'var(--c5)':'var(--c1)')+'">◈&nbsp; '+(won?'PERFECT RUN':'RUN ENDED')+' &nbsp;◈</span>'+
      '<h1 class="logo"><span class="'+(won?'l1':'l2')+'">'+headline.split(' ')[0]+'</span>'+
      '<span class="'+(won?'l2':'l1')+'" style="font-size:.62em">'+(headline.split(' ')[1]||'')+'</span></h1>'+
      '<p class="tag">최종 점수 <em style="font-family:JetBrains Mono;color:var(--c2)">'+String(score).padStart(6,'0')+'</em>'+
        ' · 도달 웨이브 <em style="color:var(--c3)">'+wave+'</em><br/>최고 콤보 <em style="color:var(--c1)">×'+maxComboThisLife+'</em></p>'+
      '<button id="play">▶ &nbsp;Run It Back</button>'+
      '<p class="hint">SPACE 또는 클릭으로 재시작</p>';
    titleEl.classList.remove('gone');
    document.getElementById('play').addEventListener('click',startGame);
  }

  /* ---------- collision helper ---------- */
  function ballBrick(b,br){
    if(b.x+b.r<br.x||b.x-b.r>br.x+br.w||b.y+b.r<br.y||b.y-b.r>br.y+br.h) return false;
    // resolve by smallest overlap
    const ox = (b.x < br.x+br.w/2) ? (b.x+b.r)-br.x : br.x+br.w-(b.x-b.r);
    const oy = (b.y < br.y+br.h/2) ? (b.y+b.r)-br.y : br.y+br.h-(b.y-b.r);
    if(ox<oy){ b.vx*=-1; b.x += (b.x<br.x+br.w/2)?-ox:ox; }
    else     { b.vy*=-1; b.y += (b.y<br.y+br.h/2)?-oy:oy; }
    return true;
  }

  /* ---------- update ---------- */
  function update(){
    if(state!=='play') return;
    // paddle movement
    let target=paddle.tx;
    if(keyL) target=paddle.x-9; if(keyR) target=paddle.x+9;
    if(target!=null){ const d=target-paddle.x; paddle.vx=d*0.32; paddle.x+=paddle.vx; }
    paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,paddle.x));

    // combo decay
    if(comboTimer>0){ comboTimer--; if(comboTimer<=0&&combo>1){ combo=1; updateHud(); } }

    // balls
    for(let i=balls.length-1;i>=0;i--){
      const b=balls[i];
      if(stuck && b.vx===0 && b.vy===0){ b.x=paddle.x; b.y=paddle.y-22; b.trail.length=0; continue; }
      b.x+=b.vx; b.y+=b.vy;
      b.trail.push({x:b.x,y:b.y}); if(b.trail.length>10) b.trail.shift();
      // walls
      if(b.x-b.r<0){ b.x=b.r; b.vx*=-1; wallFx(b,'#39e6ff'); }
      if(b.x+b.r>W){ b.x=W-b.r; b.vx*=-1; wallFx(b,'#39e6ff'); }
      if(b.y-b.r<0){ b.y=b.r; b.vy*=-1; wallFx(b,'#9b5cff'); }
      // paddle
      if(b.vy>0 && b.y+b.r>=paddle.y-paddle.h/2 && b.y-b.r<=paddle.y+paddle.h/2 &&
         b.x>=paddle.x-paddle.w/2-b.r && b.x<=paddle.x+paddle.w/2+b.r && b.y<paddle.y+10){
        const rel=(b.x-paddle.x)/(paddle.w/2); const ang=-Math.PI/2 + rel*1.05;
        const sp=Math.hypot(b.vx,b.vy);
        b.vx=Math.cos(ang)*sp; b.vy=Math.sin(ang)*sp; b.y=paddle.y-paddle.h/2-b.r-0.5;
        burst(b.x,paddle.y-paddle.h/2,'#39e6ff',8,3.5); ring(b.x,paddle.y,'#39e6ff');
        blip(300+rel*180,0.06,'square',0.18); shake(2.5);
      }
      // fall
      if(b.y-b.r>H){ balls.splice(i,1); if(balls.length===0) loseLife(); continue; }
      // bricks
      for(let j=bricks.length-1;j>=0;j--){
        const br=bricks[j];
        if(ballBrick(b,br)){
          br.hp--;
          if(br.hp<=0){
            // destroy
            burst(br.x+br.w/2,br.y+br.h/2,br.c,16,5); shard(br.x+br.w/2,br.y+br.h/2,br.c);
            ring(br.x+br.w/2,br.y+br.h/2,br.c);
            const gain=100*combo;
            score+=gain; floatTxt(br.x+br.w/2,br.y,(combo>1?'×'+combo+' ':'')+gain,br.c);
            combo=Math.min(99,combo+1); comboTimer=140; maxComboThisLife=Math.max(maxComboThisLife,combo);
            shake(3+Math.min(combo,8)); flash=0.18;
            blip(420+Math.min(combo,12)*40,0.07,'triangle',0.22,640+Math.min(combo,12)*30);
            // chance powerup
            if(Math.random()<0.09) drops.push({x:br.x+br.w/2,y:br.y+br.h/2,vy:2.2,type:Math.random()<0.55?'multi':'wide',t:0});
            bricks.splice(j,1);
          } else {
            burst(b.x,b.y,br.c,5,3); blip(520,0.05,'square',0.14); shake(1.5);
          }
          break;
        }
      }
    }

    // powerup drops
    for(let i=drops.length-1;i>=0;i--){
      const d=drops[i]; d.y+=d.vy; d.t+=0.15;
      if(d.y>paddle.y-20 && d.y<paddle.y+20 && Math.abs(d.x-paddle.x)<paddle.w/2+14){
        if(d.type==='multi'){ const cur=[...balls]; cur.forEach(b=>{ if(b.vx||b.vy){ const nb=spawnBall(false); nb.x=b.x;nb.y=b.y; const a=Math.atan2(b.vy,b.vx)+(Math.random()<.5?.5:-.5); const s=Math.hypot(b.vx,b.vy); nb.vx=Math.cos(a)*s;nb.vy=Math.sin(a)*s; }}); banner('MULTI'); }
        else { paddle.w=Math.min(200,paddle.w+44); banner('WIDE'); setTimeout(()=>{paddle.w=Math.max(108,paddle.w-44);},9000); }
        burst(d.x,d.y,'#4dff9e',14,4); blip(660,0.18,'sine',0.25,1320); drops.splice(i,1); continue;
      }
      if(d.y>H){ drops.splice(i,1); }
    }

    // particles
    for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.vx*=0.99; p.rot+=p.vr; p.life-=p.decay; if(p.life<=0) parts.splice(i,1); }
    for(let i=pops.length-1;i>=0;i--){ const p=pops[i]; p.r+=(p.max-p.r)*0.2; p.life-=0.06; if(p.life<=0) pops.splice(i,1); }
    for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.y+=f.vy; f.life-=0.018; if(f.life<=0) floats.splice(i,1); }

    // shake decay
    if(shakeMag>0){ shakeX=(Math.random()-.5)*shakeMag; shakeY=(Math.random()-.5)*shakeMag; shakeMag*=0.86; if(shakeMag<0.4)shakeMag=0; } else { shakeX=shakeY=0; }
    if(flash>0) flash-=0.04;

    // wave clear
    if(bricks.length===0 && state==='play'){ nextWave(); }

    // hud numbers
    if(dispScore<score){ dispScore=Math.min(score,dispScore+Math.ceil((score-dispScore)/8)); updateHud(); }
  }
  function wallFx(b,c){ burst(b.x,b.y,c,4,2.5); blip(260,0.04,'sine',0.1); shake(1); }

  function updateHud(){
    document.getElementById('scoreVal').textContent=String(dispScore).padStart(6,'0');
    const cv=document.getElementById('comboVal'); cv.textContent='×'+combo;
    cv.style.transform='scale('+(combo>1?1.12:1)+')';
    document.getElementById('waveVal').textContent=wave;
  }

  /* ---------- render ---------- */
  function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

  function render(){
    gx.setTransform(DPR,0,0,DPR,0,0);
    gx.clearRect(0,0,W,H);
    gx.save(); gx.translate(shakeX,shakeY);

    // playfield backdrop
    const bg=gx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'rgba(20,14,36,.55)'); bg.addColorStop(1,'rgba(6,8,18,.75)');
    gx.fillStyle=bg; roundRect(gx,0,0,W,H,18); gx.fill();
    // faint grid
    gx.strokeStyle='rgba(120,140,220,.05)'; gx.lineWidth=1;
    for(let x=0;x<W;x+=34){ gx.beginPath(); gx.moveTo(x,0); gx.lineTo(x,H); gx.stroke(); }
    for(let y=0;y<H;y+=34){ gx.beginPath(); gx.moveTo(0,y); gx.lineTo(W,y); gx.stroke(); }
    // inner frame glow
    gx.strokeStyle='rgba(57,230,255,.18)'; gx.lineWidth=1.5; roundRect(gx,1,1,W-2,H-2,17); gx.stroke();

    // bricks
    gx.globalCompositeOperation='source-over';
    for(const br of bricks){
      br.t+=0.03;
      const cracked = br.hp<br.max;
      gx.save();
      // glow
      gx.shadowColor=br.c; gx.shadowBlur=cracked?6:14;
      const grad=gx.createLinearGradient(br.x,br.y,br.x,br.y+br.h);
      grad.addColorStop(0,shade(br.c,1.25)); grad.addColorStop(1,br.c);
      gx.fillStyle=grad; gx.globalAlpha=cracked?0.7:1;
      roundRect(gx,br.x,br.y,br.w,br.h,6); gx.fill();
      // glossy top
      gx.shadowBlur=0; gx.globalAlpha=cracked?0.18:0.4; gx.fillStyle='rgba(255,255,255,.9)';
      roundRect(gx,br.x+3,br.y+2.5,br.w-6,br.h*0.32,3); gx.fill();
      // facet line
      gx.globalAlpha=0.5; gx.strokeStyle='rgba(255,255,255,.25)'; gx.lineWidth=1;
      gx.beginPath(); gx.moveTo(br.x+br.w*0.5,br.y+2); gx.lineTo(br.x+br.w*0.5,br.y+br.h-2); gx.stroke();
      if(cracked){ gx.strokeStyle='rgba(0,0,0,.4)'; gx.beginPath();
        gx.moveTo(br.x+br.w*0.3,br.y+3); gx.lineTo(br.x+br.w*0.55,br.y+br.h*0.7); gx.lineTo(br.x+br.w*0.4,br.y+br.h-3); gx.stroke(); }
      gx.restore();
    }

    // powerup drops
    for(const d of drops){
      gx.save(); gx.translate(d.x,d.y); gx.rotate(d.t*0.6);
      gx.shadowColor=d.type==='multi'?'#39e6ff':'#4dff9e'; gx.shadowBlur=16;
      gx.fillStyle=d.type==='multi'?'#39e6ff':'#4dff9e';
      roundRect(gx,-13,-8,26,16,8); gx.fill();
      gx.shadowBlur=0; gx.fillStyle='#05060c'; gx.font='800 11px JetBrains Mono'; gx.textAlign='center'; gx.textBaseline='middle';
      gx.fillText(d.type==='multi'?'+':'W',0,0.5);
      gx.restore();
    }

    // ball trails + balls
    for(const b of balls){
      for(let i=0;i<b.trail.length;i++){ const t=b.trail[i], a=i/b.trail.length;
        gx.globalAlpha=a*0.4; gx.fillStyle='#39e6ff'; gx.beginPath(); gx.arc(t.x,t.y,b.r*a*0.9,0,6.2832); gx.fill(); }
      gx.globalAlpha=1;
      const rg=gx.createRadialGradient(b.x-2,b.y-2,1,b.x,b.y,b.r*1.6);
      rg.addColorStop(0,'#ffffff'); rg.addColorStop(.4,'#bff4ff'); rg.addColorStop(1,'#39e6ff');
      gx.shadowColor='#39e6ff'; gx.shadowBlur=22; gx.fillStyle=rg;
      gx.beginPath(); gx.arc(b.x,b.y,b.r,0,6.2832); gx.fill(); gx.shadowBlur=0;
    }

    // paddle
    gx.save();
    gx.shadowColor='#ff3d7f'; gx.shadowBlur=20;
    const pg=gx.createLinearGradient(paddle.x-paddle.w/2,0,paddle.x+paddle.w/2,0);
    pg.addColorStop(0,'#9b5cff'); pg.addColorStop(.5,'#ff3d7f'); pg.addColorStop(1,'#ffd24a');
    gx.fillStyle=pg; roundRect(gx,paddle.x-paddle.w/2,paddle.y-paddle.h/2,paddle.w,paddle.h,paddle.h/2); gx.fill();
    gx.shadowBlur=0; gx.globalAlpha=0.45; gx.fillStyle='rgba(255,255,255,.9)';
    roundRect(gx,paddle.x-paddle.w/2+4,paddle.y-paddle.h/2+2,paddle.w-8,paddle.h*0.35,3); gx.fill();
    gx.globalAlpha=1; gx.restore();
    // launch hint line
    if(stuck && state==='play'){
      gx.globalAlpha=0.25+Math.sin(vt*4)*0.15; gx.strokeStyle='#39e6ff'; gx.lineWidth=1.5; gx.setLineDash([4,6]);
      gx.beginPath(); gx.moveTo(paddle.x,paddle.y-30); gx.lineTo(paddle.x,paddle.y-90); gx.stroke();
      gx.setLineDash([]); gx.globalAlpha=1;
    }

    // particles
    for(const p of parts){
      gx.globalAlpha=Math.max(0,p.life); gx.fillStyle=p.c;
      gx.shadowColor=p.c; gx.shadowBlur=8;
      if(p.sq){ gx.save(); gx.translate(p.x,p.y); gx.rotate(p.rot); gx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz); gx.restore(); }
      else { gx.beginPath(); gx.arc(p.x,p.y,p.sz*p.life,0,6.2832); gx.fill(); }
    }
    gx.shadowBlur=0; gx.globalAlpha=1;
    // shockwave rings
    for(const p of pops){ gx.globalAlpha=p.life*0.6; gx.strokeStyle=p.c; gx.lineWidth=2; gx.beginPath(); gx.arc(p.x,p.y,p.r,0,6.2832); gx.stroke(); }
    gx.globalAlpha=1;
    // floating score
    gx.textAlign='center'; gx.font='800 15px JetBrains Mono';
    for(const f of floats){ gx.globalAlpha=Math.max(0,f.life); gx.fillStyle=f.color; gx.shadowColor=f.color; gx.shadowBlur=10; gx.fillText(f.txt,f.x,f.y); }
    gx.shadowBlur=0; gx.globalAlpha=1;

    gx.restore();
    // white flash overlay
    if(flash>0){ gx.globalAlpha=flash*0.5; gx.fillStyle='#ffffff'; roundRect(gx,0,0,W,H,18); gx.fill(); gx.globalAlpha=1; }

    // pause veil
    if(state==='pause'){ gx.fillStyle='rgba(5,6,12,.55)'; roundRect(gx,0,0,W,H,18); gx.fill(); }
  }
  function shade(hex,f){ const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.min(255,r*f); g=Math.min(255,g*f); b=Math.min(255,b*f);
    return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')'; }

  /* ---------- title-screen demo balls (alive before start) ---------- */
  const demo=[]; for(let i=0;i<3;i++) demo.push({x:Math.random()*W,y:Math.random()*H*0.7+40,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,c:PAL[i%PAL.length]});
  function renderTitleDemo(){
    gx.setTransform(DPR,0,0,DPR,0,0); gx.clearRect(0,0,W,H);
    const bg=gx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'rgba(20,14,36,.55)'); bg.addColorStop(1,'rgba(6,8,18,.75)');
    gx.fillStyle=bg; roundRect(gx,0,0,W,H,18); gx.fill();
    gx.strokeStyle='rgba(120,140,220,.05)'; gx.lineWidth=1;
    for(let x=0;x<W;x+=34){ gx.beginPath(); gx.moveTo(x,0); gx.lineTo(x,H); gx.stroke(); }
    for(let y=0;y<H;y+=34){ gx.beginPath(); gx.moveTo(0,y); gx.lineTo(W,y); gx.stroke(); }
    gx.strokeStyle='rgba(57,230,255,.18)'; gx.lineWidth=1.5; roundRect(gx,1,1,W-2,H-2,17); gx.stroke();
    for(const d of demo){ d.x+=d.vx; d.y+=d.vy;
      if(d.x<14||d.x>W-14)d.vx*=-1; if(d.y<14||d.y>H-14)d.vy*=-1;
      const rg=gx.createRadialGradient(d.x-2,d.y-2,1,d.x,d.y,16);
      rg.addColorStop(0,'#fff'); rg.addColorStop(1,d.c);
      gx.shadowColor=d.c; gx.shadowBlur=24; gx.fillStyle=rg; gx.beginPath(); gx.arc(d.x,d.y,9,0,6.2832); gx.fill(); gx.shadowBlur=0;
    }
  }

  /* ---------- main loop ---------- */
  function loop(){
    if(state==='title'){ renderTitleDemo(); }
    else { update(); render(); }
    requestAnimationFrame(loop);
  }
  // intro flourish on the void
  banner; // noop
  loop();

})();
</script>
