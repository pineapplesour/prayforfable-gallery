<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>밤초원 · 반딧불 시계</title>
<style>
  :root{
    --glass-bg: rgba(255,255,255,0.085);
    --glass-bg-2: rgba(255,255,255,0.045);
    --glass-bd: rgba(255,255,255,0.30);
    --glass-hi: rgba(255,255,255,0.34);
    --ink: rgba(255,255,255,0.96);
    --ink-dim: rgba(232,244,236,0.74);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:#04080a;
    font-family:"Inter","Helvetica Neue","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;
    touch-action:none;cursor:crosshair;z-index:0;}
  /* deep vignette so glass always reads on top */
  #veil{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(130% 100% at 50% 18%, rgba(10,26,22,0) 38%, rgba(2,8,8,0.55) 100%);}

  #stage{position:fixed;inset:0;z-index:2;}

  /* ---------- liquid glass panels ---------- */
  .glass{
    position:absolute;
    border-radius:26px;
    background:
      linear-gradient(155deg, var(--glass-bg), var(--glass-bg-2));
    border:1px solid var(--glass-bd);
    box-shadow:
      0 30px 70px rgba(0,0,0,0.42),
      0 8px 24px rgba(0,0,0,0.28),
      inset 0 1px 0 var(--glass-hi),
      inset 0 0 36px rgba(255,255,255,0.05);
    backdrop-filter: blur(20px) saturate(1.45) brightness(1.05);
    -webkit-backdrop-filter: blur(20px) saturate(1.45) brightness(1.05);
    color:var(--ink);
    overflow:hidden;
    cursor:grab;
    will-change:transform;
    transition:box-shadow .25s ease;
  }
  .glass:active{cursor:grabbing;}
  /* soft refractive sheen sweeping the surface */
  .glass::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(120deg,
      rgba(255,255,255,0.14) 0%,
      rgba(255,255,255,0.02) 26%,
      rgba(255,255,255,0) 55%,
      rgba(180,255,210,0.05) 100%);
    mix-blend-mode:screen;
  }
  /* faint inner edge to fake glass thickness */
  .glass::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    box-shadow:inset 0 -1px 0 rgba(255,255,255,0.10),
               inset 1px 0 0 rgba(255,255,255,0.06);
  }
  .glass.lift{box-shadow:
      0 44px 96px rgba(0,0,0,0.50),
      0 12px 30px rgba(0,0,0,0.30),
      inset 0 1px 0 var(--glass-hi),
      inset 0 0 40px rgba(170,255,205,0.10);}

  .pad{position:relative;z-index:1;padding:26px 28px;}

  /* clock widget */
  #clock{width:min(360px,82vw);left:8vw;top:50%;transform:translateY(-50%);}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;
    color:var(--ink-dim);margin:0 0 14px;}
  .time{font-size:clamp(46px,8vw,68px);font-weight:200;letter-spacing:.01em;line-height:.98;
    font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:.06em;
    text-shadow:0 2px 24px rgba(150,255,200,0.18);}
  .time .sec{font-size:.42em;font-weight:400;color:var(--ink-dim);align-self:flex-end;
    margin-bottom:.28em;}
  .ampm{font-size:.30em;font-weight:600;letter-spacing:.18em;color:var(--ink-dim);
    align-self:flex-end;margin-bottom:.5em;}
  .date{margin:14px 0 0;font-size:14px;font-weight:500;color:var(--ink-dim);letter-spacing:.02em;}
  .rule{height:1px;margin:20px 0 16px;border:0;
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,0.32),rgba(255,255,255,0));}
  .stats{display:flex;gap:10px;}
  .chip{flex:1;border-radius:16px;padding:12px 14px;
    background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.12);}
  .chip .k{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-dim);}
  .chip .v{margin-top:5px;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;}

  /* small meta widget top-right */
  #meta{width:min(248px,72vw);right:7vw;top:14vh;}
  #meta .pad{padding:20px 22px;}
  #meta h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.01em;}
  #meta p{margin:8px 0 0;font-size:12.5px;line-height:1.55;color:var(--ink-dim);}
  .flies{margin-top:16px;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-dim);}
  .dot{width:9px;height:9px;border-radius:50%;background:#ffe9a8;
    box-shadow:0 0 10px 2px rgba(255,224,150,0.9),0 0 22px 6px rgba(255,210,110,0.35);
    animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.5;transform:scale(.85);}50%{opacity:1;transform:scale(1.15);}}

  /* hint pill bottom */
  #hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:3;
    color:rgba(255,255,255,.82);font-size:12.5px;letter-spacing:.12em;
    background:rgba(8,24,20,.34);padding:9px 20px;border-radius:99px;
    border:1px solid rgba(255,255,255,0.14);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    pointer-events:none;transition:opacity 1.4s;white-space:nowrap;}

  @media (max-width:520px){
    #clock{left:50%;top:auto;bottom:auto;transform:translate(-50%,0);position:absolute;top:9vh;width:84vw;}
    #meta{right:auto;left:50%;transform:translateX(-50%);top:auto;bottom:13vh;width:84vw;}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="veil"></div>

<div id="stage">
  <!-- 시계 글래스 위젯 -->
  <section class="glass" id="clock" data-px="0.020">
    <div class="pad">
      <p class="eyebrow">밤초원 · 반딧불</p>
      <div class="time">
        <span id="hh">--</span><span>:</span><span id="mm">--</span>
        <span class="sec" id="ss">--</span><span class="ampm" id="ap">--</span>
      </div>
      <p class="date" id="date">로딩…</p>
      <hr class="rule">
      <div class="stats">
        <div class="chip"><div class="k">반딧불</div><div class="v" id="cFlies">0</div></div>
        <div class="chip"><div class="k">수면 파문</div><div class="v" id="cRipple">0</div></div>
        <div class="chip"><div class="k">기온</div><div class="v">17°</div></div>
      </div>
    </div>
  </section>

  <!-- 보조 글래스 위젯 -->
  <aside class="glass" id="meta" data-px="0.045">
    <div class="pad">
      <h2>고요한 풀밭의 밤</h2>
      <p>탁한 물빛 위로 반딧불이 느리게 떠다니고, 지나간 자리마다 수면이 굴절합니다. 글래스는 아래 씬을 진짜로 흐립니다.</p>
      <div class="flies"><span class="dot"></span>실시간 앰비언트 가동 중</div>
    </div>
  </aside>
</div>

<div id="hint">수면을 클릭 ─ 파문 · 반딧불 소환　|　패널 드래그 가능</div>

<script>
'use strict';
(()=>{
const TAU=Math.PI*2;
const canvas=document.getElementById('scene');
const hint=document.getElementById('hint');

/* counters shown in the glass */
let flyCount=0, rippleCount=0;
const setCounts=()=>{
  document.getElementById('cFlies').textContent=flyCount;
  document.getElementById('cRipple').textContent=rippleCount;
};

/* ============================================================
   WebGL2 water-ripple base (night-meadow palette).
   Falls back to a Canvas2D ambient scene if WebGL2 missing.
   ============================================================ */
let gl=null;
try{ gl=canvas.getContext('webgl2',{antialias:false,alpha:false}); }catch(e){ gl=null; }

let cssW=0,cssH=0,dpr=1;

/* shared firefly state (used by both backends) */
function makeFly(){
  return{
    x:Math.random(), y:Math.random(),
    a:Math.random()*TAU, sp:0.012+Math.random()*0.02,
    turn:0, ph:Math.random()*TAU, phs:0.6+Math.random()*0.9,
    size:0.9+Math.random()*1.3, hue:42+Math.random()*16,
    wakeT:Math.random()*0.3
  };
}
let flies=[];
function resetFlies(n){ flies=[]; for(let i=0;i<n;i++) flies.push(makeFly()); flyCount=n; }

const drops=[];               // ripple impulses {x,y,r,s} in CSS px
function addDrop(x,y,r,s){ drops.push({x,y,r,s}); if(drops.length>26)drops.shift(); }

function updateFlies(dt,addWake){
  for(const f of flies){
    f.turn+=(Math.random()-0.5)*4.2*dt; f.turn*=Math.exp(-dt*1.3);
    f.a+=f.turn*dt*6;
    f.ph+=dt*f.phs*TAU;
    // gentle drift + soft bounce off edges
    f.x+=Math.cos(f.a)*f.sp*dt; f.y+=Math.sin(f.a)*f.sp*dt*0.7;
    if(f.x<0.04||f.x>0.96) f.a=Math.PI-f.a, f.x=Math.max(0.04,Math.min(0.96,f.x));
    if(f.y<0.05||f.y>0.95) f.a=-f.a, f.y=Math.max(0.05,Math.min(0.95,f.y));
    f.wakeT-=dt;
    if(addWake && f.wakeT<=0){
      addDrop(f.x*cssW, f.y*cssH, 5, 0.05);
      f.wakeT=0.5+Math.random()*0.6;
    }
  }
}

/* ---------------- WebGL backend ---------------- */
let webglOK=false;
if(gl){
try{
  gl.getExtension('EXT_color_buffer_float');
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);

  const VERT=`#version 300 es
  layout(location=0) in vec2 aPos; out vec2 vUv;
  void main(){vUv=aPos*0.5+0.5;gl_Position=vec4(aPos,0.,1.);}`;

  const SIM_FRAG=`#version 300 es
  precision highp float;
  uniform sampler2D uPrev; uniform vec2 uTexel;
  uniform vec4 uDrops[8]; uniform int uCount;
  in vec2 vUv; out vec4 o;
  void main(){
    vec2 c=texture(uPrev,vUv).rg;
    float sum=
      texture(uPrev,vUv+vec2(uTexel.x,0.)).r+
      texture(uPrev,vUv-vec2(uTexel.x,0.)).r+
      texture(uPrev,vUv+vec2(0.,uTexel.y)).r+
      texture(uPrev,vUv-vec2(0.,uTexel.y)).r;
    float nh=(sum*0.5-c.g)*0.990;
    vec2 px=vUv/uTexel;
    for(int i=0;i<8;i++){ if(i>=uCount)break;
      vec4 d=uDrops[i]; float dist=distance(px,d.xy);
      if(dist<d.z) nh+=d.w*(cos(dist/d.z*3.14159)*0.5+0.5);
    }
    vec2 e=min(vUv,1.0-vUv);
    float edge=smoothstep(0.0,0.05,min(e.x,e.y));
    nh*=mix(0.84,1.0,edge);
    o=vec4(nh,c.r,0.,1.);
  }`;

  const RENDER_FRAG=`#version 300 es
  precision highp float;
  uniform sampler2D uH; uniform sampler2D uBottom; uniform sampler2D uFly;
  uniform vec2 uTexel; uniform float uT;
  in vec2 vUv; out vec4 o;
  void main(){
    vec2 d=uTexel*1.5;
    float h =texture(uH,vUv).r;
    float hL=texture(uH,vUv-vec2(d.x,0.)).r;
    float hR=texture(uH,vUv+vec2(d.x,0.)).r;
    float hB=texture(uH,vUv-vec2(0.,d.y)).r;
    float hT=texture(uH,vUv+vec2(0.,d.y)).r;
    vec3 n=normalize(vec3((hL-hR)*6.0,(hB-hT)*6.0,1.0));
    n.xy+=0.0024*vec2(
      sin(vUv.x*120.0+uT*1.0)+sin(vUv.y*84.0-uT*0.6),
      cos(vUv.x*70.0-uT*0.8)+cos(vUv.y*132.0+uT*1.2));
    n=normalize(n);
    vec2 off=n.xy*0.040;
    vec3 bottom=texture(uBottom,vUv+off).rgb;
    float lap=(hL+hR+hB+hT-4.0*h);
    /* caustics tinted cool-green for the meadow water */
    float caust=min(max(-lap,0.0)*88.0,0.7);
    bottom+=vec3(0.55,1.0,0.72)*caust*0.42;
    bottom*=1.0-min(max(lap,0.0)*68.0,0.30);
    vec3 water=vec3(0.05,0.16,0.15);
    vec3 col=mix(bottom,water,0.30);
    /* fireflies glow layer (additive) */
    vec4 fly=texture(uFly,vUv+off*0.4);
    col+=fly.rgb*fly.a;
    /* specular moon-ish highlight on ripples */
    vec3 L=normalize(vec3(-0.30,0.40,0.86));
    float spec=pow(max(dot(reflect(vec3(0.,0.,-1.),n),L),0.0),130.0);
    col+=vec3(0.80,0.95,0.80)*spec*0.80;
    float vg=smoothstep(1.02,0.30,length(vUv-0.5));
    col*=mix(0.52,1.0,vg);
    o=vec4(col,1.0);
  }`;

  const compile=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));return sh;};
  const program=(vs,fs)=>{const p=gl.createProgram();
    gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
    gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;};

  const simProg=program(VERT,SIM_FRAG), renProg=program(VERT,RENDER_FRAG);
  const su={prev:gl.getUniformLocation(simProg,'uPrev'),texel:gl.getUniformLocation(simProg,'uTexel'),
    drops:gl.getUniformLocation(simProg,'uDrops[0]'),count:gl.getUniformLocation(simProg,'uCount')};
  const ru={h:gl.getUniformLocation(renProg,'uH'),bottom:gl.getUniformLocation(renProg,'uBottom'),
    fly:gl.getUniformLocation(renProg,'uFly'),texel:gl.getUniformLocation(renProg,'uTexel'),
    t:gl.getUniformLocation(renProg,'uT')};

  const quad=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,quad);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

  let simW=0,simH=0,texA=null,texB=null,fboA=null,fboB=null;
  const bCan=document.createElement('canvas'),bctx=bCan.getContext('2d');
  const fCan=document.createElement('canvas'),fctx=fCan.getContext('2d');
  const bottomTex=gl.createTexture(),flyTex=gl.createTexture();
  let flyTexW=0,flyTexH=0, gScale=1;

  const texParams=()=>{
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  };
  const makeTarget=(w,h)=>{
    const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null); texParams();
    const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
    gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT); return [t,f];
  };
  const createSim=()=>{
    if(texA){gl.deleteTexture(texA);gl.deleteTexture(texB);gl.deleteFramebuffer(fboA);gl.deleteFramebuffer(fboB);}
    const scale=Math.min(0.5,768/Math.max(cssW,cssH));
    simW=Math.max(64,Math.round(cssW*scale)); simH=Math.max(64,Math.round(cssH*scale));
    [texA,fboA]=makeTarget(simW,simH); [texB,fboB]=makeTarget(simW,simH);
  };

  /* painted meadow-pond bottom: murky green depth + grass clumps + speckle */
  function paintBottom(){
    const c=bctx,w=cssW,h=cssH;
    c.setTransform(gScale,0,0,gScale,0,0);
    const g=c.createRadialGradient(w*0.5,h*0.40,0,w*0.5,h*0.5,Math.max(w,h)*0.8);
    g.addColorStop(0,'#1d3326'); g.addColorStop(0.5,'#13261d'); g.addColorStop(1,'#070f0b');
    c.fillStyle=g; c.fillRect(0,0,w,h);
    // dark moss blobs
    for(let i=0;i<11;i++){
      const x=Math.random()*w,y=Math.random()*h,r=90+Math.random()*220;
      const ag=c.createRadialGradient(x,y,0,x,y,r);
      ag.addColorStop(0,'rgba(8,26,14,0.34)'); ag.addColorStop(1,'rgba(8,26,14,0)');
      c.fillStyle=ag; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
    }
    // submerged grass blades
    for(let i=0;i<140;i++){
      const x=Math.random()*w,y=Math.random()*h, len=18+Math.random()*46, ang=-Math.PI/2+(Math.random()-0.5)*0.7;
      c.strokeStyle='rgba(40,80,46,'+(0.06+Math.random()*0.10).toFixed(3)+')';
      c.lineWidth=1+Math.random()*1.6; c.beginPath(); c.moveTo(x,y);
      c.quadraticCurveTo(x+Math.cos(ang)*len*0.4+(Math.random()-0.5)*14, y+Math.sin(ang)*len*0.5,
                         x+Math.cos(ang)*len, y+Math.sin(ang)*len); c.stroke();
    }
    // fine speckle (sediment + faint warm motes)
    for(let i=0;i<2200;i++){
      const x=Math.random()*w,y=Math.random()*h,r=Math.random()*1.6+0.3;
      c.fillStyle=Math.random()<0.4
        ?'rgba(210,235,170,'+(Math.random()*0.07).toFixed(3)+')'
        :'rgba(6,14,8,'+(Math.random()*0.14).toFixed(3)+')';
      c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
    }
  }

  /* fireflies drawn to a separate canvas -> uploaded as additive glow texture */
  function drawFlyCanvas(t){
    fctx.setTransform(gScale,0,0,gScale,0,0);
    fctx.clearRect(0,0,cssW,cssH);
    fctx.globalCompositeOperation='lighter';
    for(const f of flies){
      const px=f.x*cssW, py=f.y*cssH;
      const blink=0.35+0.65*(0.5+0.5*Math.sin(f.ph));
      const R=(7+f.size*7)*blink;
      const g=fctx.createRadialGradient(px,py,0,px,py,R*3);
      const a=blink;
      g.addColorStop(0,'rgba(255,'+(238)+','+(176)+','+(0.95*a).toFixed(3)+')');
      g.addColorStop(0.25,'rgba(255,'+(214)+','+(120)+','+(0.45*a).toFixed(3)+')');
      g.addColorStop(1,'rgba(255,200,90,0)');
      fctx.fillStyle=g; fctx.beginPath(); fctx.arc(px,py,R*3,0,TAU); fctx.fill();
      // hot core
      fctx.fillStyle='rgba(255,252,224,'+(0.9*a).toFixed(3)+')';
      fctx.beginPath(); fctx.arc(px,py,1.4+f.size*0.7,0,TAU); fctx.fill();
    }
    fctx.globalCompositeOperation='source-over';
  }

  function uploadBottom(){ gl.bindTexture(gl.TEXTURE_2D,bottomTex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,bCan); texParams(); }
  function uploadFly(){ gl.bindTexture(gl.TEXTURE_2D,flyTex);
    if(flyTexW!==fCan.width||flyTexH!==fCan.height){
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,fCan); texParams();
      flyTexW=fCan.width; flyTexH=fCan.height;
    } else gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,gl.RGBA,gl.UNSIGNED_BYTE,fCan); }

  const dropArr=new Float32Array(32);
  function simulate(){
    gl.useProgram(simProg); gl.viewport(0,0,simW,simH);
    gl.uniform2f(su.texel,1/simW,1/simH);
    for(let step=0;step<2;step++){
      let n=0;
      if(step===0){
        n=Math.min(drops.length,8);
        for(let j=0;j<n;j++){ const d=drops[j];
          dropArr[j*4]=d.x/cssW*simW; dropArr[j*4+1]=(1-d.y/cssH)*simH;
          dropArr[j*4+2]=Math.max(2,d.r*simW/cssW); dropArr[j*4+3]=d.s; }
        drops.splice(0,n);
      }
      gl.uniform4fv(su.drops,dropArr); gl.uniform1i(su.count,n);
      gl.bindFramebuffer(gl.FRAMEBUFFER,fboB);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,texA); gl.uniform1i(su.prev,0);
      gl.drawArrays(gl.TRIANGLES,0,3);
      let tt=texA;texA=texB;texB=tt; tt=fboA;fboA=fboB;fboB=tt;
    }
  }
  function renderGL(t){
    gl.useProgram(renProg); gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texA);gl.uniform1i(ru.h,0);
    gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,bottomTex);gl.uniform1i(ru.bottom,1);
    gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,flyTex);gl.uniform1i(ru.fly,2);
    gl.uniform2f(ru.texel,1/simW,1/simH); gl.uniform1f(ru.t,t);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }

  window.__resizeGL=()=>{
    dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(cssW*dpr); canvas.height=Math.round(cssH*dpr);
    gScale=Math.min(dpr,1.5);
    fCan.width=Math.round(cssW*gScale); fCan.height=Math.round(cssH*gScale);
    flyTexW=0; bCan.width=fCan.width; bCan.height=fCan.height;
    paintBottom(); uploadBottom(); createSim();
  };
  window.__frameGL=(t,dt)=>{
    drawFlyCanvas(t); uploadFly(); simulate(); renderGL(t);
  };
  webglOK=true;
}catch(err){ webglOK=false; console.warn('WebGL path failed, using 2D fallback:',err); }
}

/* ---------------- Canvas2D fallback backend ---------------- */
let ctx2d=null;
if(!webglOK){
  ctx2d=canvas.getContext('2d');
  const ripples=[]; // expanding rings for fallback
  window.__addRingFallback=(x,y)=>{ ripples.push({x,y,r:4,a:0.5}); };
  window.__resize2D=()=>{
    dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(cssW*dpr); canvas.height=Math.round(cssH*dpr);
    ctx2d.setTransform(dpr,0,0,dpr,0,0);
  };
  window.__frame2D=(t,dt)=>{
    const w=cssW,h=cssH,c=ctx2d;
    const g=c.createRadialGradient(w*0.5,h*0.4,0,w*0.5,h*0.5,Math.max(w,h)*0.85);
    g.addColorStop(0,'#1a2f23');g.addColorStop(0.5,'#11221a');g.addColorStop(1,'#060d09');
    c.fillStyle=g;c.fillRect(0,0,w,h);
    // moving ripple rings
    c.lineWidth=1.4;
    for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];
      r.r+=60*dt; r.a-=0.5*dt;
      if(r.a<=0){ripples.splice(i,1);continue;}
      c.strokeStyle='rgba(160,230,190,'+r.a.toFixed(3)+')';
      c.beginPath();c.arc(r.x,r.y,r.r,0,TAU);c.stroke();
    }
    // fireflies
    c.globalCompositeOperation='lighter';
    for(const f of flies){
      const px=f.x*w,py=f.y*h, blink=0.35+0.65*(0.5+0.5*Math.sin(f.ph)), R=(7+f.size*7)*blink;
      const fg=c.createRadialGradient(px,py,0,px,py,R*3);
      fg.addColorStop(0,'rgba(255,238,176,'+(0.9*blink).toFixed(3)+')');
      fg.addColorStop(0.3,'rgba(255,210,110,'+(0.4*blink).toFixed(3)+')');
      fg.addColorStop(1,'rgba(255,200,90,0)');
      c.fillStyle=fg;c.beginPath();c.arc(px,py,R*3,0,TAU);c.fill();
      c.fillStyle='rgba(255,252,224,'+(0.9*blink).toFixed(3)+')';
      c.beginPath();c.arc(px,py,1.4+f.size*0.7,0,TAU);c.fill();
    }
    c.globalCompositeOperation='source-over';
    // drain CSS-space drops into expanding rings
    while(drops.length){const d=drops.shift(); if(d.s>0.2) ripples.push({x:d.x,y:d.y,r:4,a:0.5});}
    // vignette
    const vg=c.createRadialGradient(w*0.5,h*0.45,h*0.2,w*0.5,h*0.5,Math.max(w,h)*0.75);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(2,8,6,0.6)');
    c.fillStyle=vg;c.fillRect(0,0,w,h);
  };
}

/* ---------------- layout / loop ---------------- */
function resize(){
  cssW=window.innerWidth; cssH=window.innerHeight;
  if(webglOK) window.__resizeGL(); else window.__resize2D();
}
window.addEventListener('resize',resize);

/* interaction: click water -> ripple + spawn firefly */
canvas.addEventListener('pointerdown',e=>{
  const x=e.clientX,y=e.clientY;
  addDrop(x,y,18,1.3); rippleCount++;
  if(flies.length<48){
    const f=makeFly(); f.x=x/cssW; f.y=y/cssH; flies.push(f); flyCount=flies.length;
  }
  setCounts();
  hint.style.opacity=0;
});
let lmx=-1,lmy=-1;
canvas.addEventListener('pointermove',e=>{
  if(lmx<0){lmx=e.clientX;lmy=e.clientY;return;}
  const d=Math.hypot(e.clientX-lmx,e.clientY-lmy);
  if(d>24){ addDrop(e.clientX,e.clientY,7,0.06); lmx=e.clientX;lmy=e.clientY; }
});

resize();
resetFlies(16);
for(let i=0;i<3;i++) addDrop(Math.random()*cssW,Math.random()*cssH,14,0.6);
setCounts();
setTimeout(()=>{hint.style.opacity=0;},9000);

let last=0, ambT=2.5;
function frame(ts){
  requestAnimationFrame(frame);
  const t=ts/1000;
  const dt=Math.min(0.05,Math.max(0.001,t-last)); last=t;
  ambT-=dt;
  if(ambT<=0){ addDrop(Math.random()*cssW,Math.random()*cssH,8,0.3); ambT=2.5+Math.random()*4; }
  updateFlies(dt,true);
  if(webglOK) window.__frameGL(t,dt); else window.__frame2D(t,dt);
}
requestAnimationFrame(frame);

/* ============================================================
   Live clock in the glass widget
   ============================================================ */
const DOW=['일','월','화','수','목','금','토'];
function tick(){
  const d=new Date();
  let h=d.getHours(); const ap=h<12?'AM':'PM'; let h12=h%12; if(h12===0)h12=12;
  const mm=String(d.getMinutes()).padStart(2,'0');
  const ss=String(d.getSeconds()).padStart(2,'0');
  document.getElementById('hh').textContent=String(h12).padStart(2,'0');
  document.getElementById('mm').textContent=mm;
  document.getElementById('ss').textContent=ss;
  document.getElementById('ap').textContent=ap;
  document.getElementById('date').textContent=
    `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;
}
tick(); setInterval(tick,1000);

/* ============================================================
   Glass panels: mouse parallax + drag
   ============================================================ */
const panels=[...document.querySelectorAll('.glass')];
const base=new Map(); // panel -> {px, dx, dy}
panels.forEach(p=>base.set(p,{px:parseFloat(p.dataset.px||'0.03'),dx:0,dy:0}));

let mx=0,my=0; // normalized -0.5..0.5 pointer offset from center
window.addEventListener('pointermove',e=>{
  mx=(e.clientX/window.innerWidth)-0.5;
  my=(e.clientY/window.innerHeight)-0.5;
});
function applyTransforms(){
  panels.forEach(p=>{
    const b=base.get(p);
    const tx=b.dx - mx*window.innerWidth*b.px;
    const ty=b.dy - my*window.innerHeight*b.px;
    // clock keeps its vertical centering base transform
    if(p.id==='clock' && window.innerWidth>520)
      p.style.transform=`translate(${tx}px, calc(-50% + ${ty}px))`;
    else if(p.id==='clock')
      p.style.transform=`translate(calc(-50% + ${tx}px), ${ty}px)`;
    else if(p.id==='meta' && window.innerWidth<=520)
      p.style.transform=`translate(calc(-50% + ${tx}px), ${ty}px)`;
    else
      p.style.transform=`translate(${tx}px, ${ty}px)`;
  });
  requestAnimationFrame(applyTransforms);
}
requestAnimationFrame(applyTransforms);

/* drag panels by grabbing them (but not while interacting with water) */
panels.forEach(p=>{
  let dragging=false,sx=0,sy=0,ox=0,oy=0;
  p.addEventListener('pointerdown',e=>{
    dragging=true; p.classList.add('lift');
    const b=base.get(p); ox=b.dx; oy=b.dy; sx=e.clientX; sy=e.clientY;
    p.setPointerCapture(e.pointerId); e.stopPropagation();
  });
  p.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const b=base.get(p); b.dx=ox+(e.clientX-sx); b.dy=oy+(e.clientY-sy);
  });
  const end=()=>{ dragging=false; p.classList.remove('lift'); };
  p.addEventListener('pointerup',end);
  p.addEventListener('pointercancel',end);
});
})();
</script>
