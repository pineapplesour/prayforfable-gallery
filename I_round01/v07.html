<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단풍 개울 · 캘린더 글래스</title>
<style>
  :root{
    --ink: #f3efe6;
    --ink-soft: rgba(243,239,230,.66);
    --ink-faint: rgba(243,239,230,.40);
    --accent: #ffb15a;
    --accent2: #ff7a45;
    --glass-bg: rgba(20,30,30,.30);
    --glass-bg-2: rgba(16,26,26,.42);
    --glass-stroke: rgba(255,255,255,.30);
    --glass-hi: rgba(255,255,255,.38);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a1012;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Pretendard","Apple SD Gothic Neo",-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;color:var(--ink);}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none;}
  /* very soft top depth-haze so the floor reads deep, like frangollo's murk */
  #haze{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(255,210,150,.10), transparent 55%),
      radial-gradient(140% 120% at 50% 120%, rgba(4,12,10,.55), transparent 60%);
    mix-blend-mode:soft-light;}

  /* ---- floating liquid-glass layer ---- */
  #stage{position:fixed;inset:0;z-index:2;}
  .glass{
    position:absolute;
    border-radius:26px;
    background:var(--glass-bg);
    border:1px solid var(--glass-stroke);
    box-shadow:
      0 26px 60px -16px rgba(0,0,0,.55),
      0 8px 22px rgba(0,0,0,.30),
      inset 0 1px 0 var(--glass-hi),
      inset 0 0 0 1px rgba(255,255,255,.04);
    backdrop-filter:blur(22px) saturate(1.5);
    -webkit-backdrop-filter:blur(22px) saturate(1.5);
    will-change:transform;
    transition:box-shadow .2s ease;
  }
  .glass::before{ /* curved top-edge light catch -> liquid feel */
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0) 30%, rgba(255,255,255,0) 78%, rgba(255,255,255,.05));
  }
  .glass.drag{cursor:grab;}
  .glass.dragging{cursor:grabbing;box-shadow:
      0 38px 80px -14px rgba(0,0,0,.62),
      0 10px 26px rgba(0,0,0,.34),
      inset 0 1px 0 var(--glass-hi);}
  .grip{position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:38px;height:5px;border-radius:99px;background:rgba(255,255,255,.22);}

  /* ---- main calendar panel ---- */
  #cal{width:340px;padding:26px 24px 22px;left:0;top:0;}
  .cal-head{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 2px 18px;}
  .cal-month{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;}
  .cal-year{font-size:34px;line-height:1;font-weight:800;letter-spacing:.01em;}
  .cal-sub{font-size:12px;color:var(--ink-soft);letter-spacing:.04em;margin-top:4px;}
  .nav{display:flex;gap:8px;}
  .nav button{width:32px;height:32px;border-radius:999px;border:1px solid rgba(255,255,255,.28);
    background:rgba(255,255,255,.07);color:var(--ink);font-size:15px;cursor:pointer;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:background .15s ease,transform .1s ease;}
  .nav button:hover{background:rgba(255,255,255,.18);}
  .nav button:active{transform:scale(.92);}
  .dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .dow{margin-bottom:6px;}
  .dow span{text-align:center;font-size:11px;letter-spacing:.06em;color:var(--ink-faint);padding:4px 0;}
  .dow span.sun{color:rgba(255,140,120,.8);}
  .dow span.sat{color:rgba(140,190,255,.78);}
  .cell{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    font-size:13px;border-radius:11px;color:var(--ink);cursor:pointer;
    transition:background .14s ease,transform .1s ease;}
  .cell.pad{color:var(--ink-faint);opacity:.45;cursor:default;}
  .cell:not(.pad):hover{background:rgba(255,255,255,.12);}
  .cell.sun{color:rgba(255,150,130,.95);}
  .cell.sat{color:rgba(155,200,255,.95);}
  .cell.today{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#241208;font-weight:800;
    box-shadow:0 6px 16px rgba(255,122,69,.40),inset 0 1px 0 rgba(255,255,255,.4);}
  .cell.sel{outline:1.5px solid rgba(255,255,255,.7);outline-offset:-1.5px;}
  .cell .dot{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
    width:4px;height:4px;border-radius:50%;background:var(--accent);}
  .cell.today .dot{background:#241208;}

  /* ---- small chips ---- */
  #now{width:182px;padding:16px 18px 17px;left:0;top:0;}
  .now-label{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);}
  .now-time{font-size:30px;font-weight:800;letter-spacing:.02em;margin-top:2px;
    font-variant-numeric:tabular-nums;}
  .now-date{font-size:12px;color:var(--ink-soft);margin-top:1px;}

  #temp{width:170px;padding:16px 18px;left:0;top:0;}
  .temp-row{display:flex;align-items:center;gap:12px;}
  .temp-ico{font-size:30px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));}
  .temp-big{font-size:28px;font-weight:800;line-height:1;}
  .temp-cap{font-size:11px;color:var(--ink-soft);letter-spacing:.03em;margin-top:3px;}
  .temp-bar{margin-top:13px;height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;}
  .temp-bar i{display:block;height:100%;width:62%;border-radius:99px;
    background:linear-gradient(90deg,#7fd0c4,var(--accent));}

  .sig{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:3;
    font-size:11px;letter-spacing:.18em;color:rgba(255,255,255,.42);
    background:rgba(8,18,18,.30);padding:7px 18px;border-radius:99px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none;white-space:nowrap;}

  @media (max-width:520px){
    #cal{width:min(340px,86vw);}
    #now,#temp{width:min(182px,64vw);}
    .sig{font-size:10px;letter-spacing:.12em;padding:6px 14px;}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="haze"></div>

<div id="stage">
  <!-- main calendar glass -->
  <section class="glass drag" id="cal">
    <div class="grip"></div>
    <div class="cal-head">
      <div>
        <div class="cal-month" id="mLabel">OCTOBER</div>
        <div class="cal-year" id="yLabel">2026</div>
        <div class="cal-sub">단풍이 물에 닿는 달</div>
      </div>
      <div class="nav">
        <button id="prev" aria-label="이전 달">‹</button>
        <button id="next" aria-label="다음 달">›</button>
      </div>
    </div>
    <div class="dow">
      <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- clock chip -->
  <section class="glass drag" id="now">
    <div class="grip"></div>
    <div class="now-label">지금</div>
    <div class="now-time" id="clock">00:00</div>
    <div class="now-date" id="today">—</div>
  </section>

  <!-- weather chip -->
  <section class="glass drag" id="temp">
    <div class="grip"></div>
    <div class="temp-row">
      <div class="temp-ico">🍁</div>
      <div>
        <div class="temp-big">14°</div>
        <div class="temp-cap">맑음 · 개울 바람</div>
      </div>
    </div>
    <div class="temp-bar"><i></i></div>
  </section>
</div>

<div class="sig">단풍 개울 · 떠있는 리퀴드 글래스 · 드래그해 보세요</div>

<script>
'use strict';
(()=>{
const TAU=Math.PI*2;
const cv=document.getElementById('scene');
const ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,t=0;

/* ---------- responsive sizing ---------- */
function resize(){
  W=window.innerWidth; H=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildFloor();
  layout();
}
window.addEventListener('resize',resize);

/* ---------- static pond/creek floor (painted once per size) ---------- */
let floor=document.createElement('canvas');
let fctx=floor.getContext('2d');
function buildFloor(){
  floor.width=Math.round(W*DPR); floor.height=Math.round(H*DPR);
  const c=fctx; c.setTransform(DPR,0,0,DPR,0,0);
  // murky autumn water base: teal floor warming toward amber center
  const g=c.createRadialGradient(W*0.5,H*0.40,0,W*0.5,H*0.5,Math.max(W,H)*0.85);
  g.addColorStop(0,'#3c5a4e');
  g.addColorStop(0.45,'#2c4a44');
  g.addColorStop(0.78,'#21383a');
  g.addColorStop(1,'#16282c');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // warm sediment blooms (amber/olive) for depth
  for(let i=0;i<11;i++){
    const x=Math.random()*W,y=Math.random()*H,r=120+Math.random()*260;
    const ag=c.createRadialGradient(x,y,0,x,y,r);
    const warm=Math.random()<0.5;
    ag.addColorStop(0, warm?'rgba(150,110,52,0.18)':'rgba(40,72,52,0.22)');
    ag.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=ag; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
  }
  // fine sediment speckle
  for(let i=0;i<2200;i++){
    const x=Math.random()*W,y=Math.random()*H,r=Math.random()*1.6+0.3;
    c.fillStyle=Math.random()<0.5
      ?'rgba(255,232,180,'+(Math.random()*0.07).toFixed(3)+')'
      :'rgba(14,22,16,'+(Math.random()*0.12).toFixed(3)+')';
    c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
  }
  // smooth river pebbles
  const np=Math.max(16,Math.round(W*H/46000));
  for(let i=0;i<np;i++) pebble(c,Math.random()*W,Math.random()*H,12+Math.random()*40,Math.random()*TAU);
}
function pebble(c,x,y,r,rot){
  c.save(); c.translate(x,y); c.rotate(rot);
  const ry=r*(0.6+Math.random()*0.32);
  c.fillStyle='rgba(0,0,0,0.28)';
  c.beginPath(); c.ellipse(r*0.12,ry*0.2,r*1.02,ry*1.02,0,0,TAU); c.fill();
  const hue=30+Math.random()*40, sat=8+Math.random()*16, li=32+Math.random()*24;
  const g=c.createRadialGradient(-r*0.35,-ry*0.4,r*0.08,0,0,r*1.15);
  g.addColorStop(0,'hsl('+hue+','+sat+'%,'+(li+18)+'%)');
  g.addColorStop(0.7,'hsl('+hue+','+sat+'%,'+li+'%)');
  g.addColorStop(1,'hsl('+hue+','+(sat+6)+'%,'+(li-15)+'%)');
  c.fillStyle=g;
  c.beginPath(); c.ellipse(0,0,r,ry,0,0,TAU); c.fill();
  c.restore();
}

/* ---------- drifting maple leaves ---------- */
function makeLeaf(){
  const palette=[['#ff8a3d','#d8410c'],['#ffb347','#e07a17'],['#ff6f5e','#b8331f'],['#f2c14e','#c98a1e'],['#e8552f','#8f230f']];
  const p=palette[(Math.random()*palette.length)|0];
  return {
    x:Math.random()*W, y:Math.random()*H,
    s:18+Math.random()*22,
    a:Math.random()*TAU, va:(Math.random()-0.5)*0.5,
    vx:(Math.random()-0.5)*8, vy:6+Math.random()*10,
    sway:Math.random()*TAU, swaySp:0.5+Math.random()*0.7,
    c0:p[0], c1:p[1],
    depth:0.5+Math.random()*0.5      // parallax / blur factor
  };
}
let leaves=[];
function drawLeaf(c,L){
  const s=L.s;
  c.save();
  c.translate(L.x,L.y);
  c.rotate(L.a);
  // soft drop shadow on the floor (depth blur cue)
  c.save();
  c.translate(s*0.18,s*0.22);
  c.globalAlpha=0.22*L.depth;
  c.fillStyle='rgba(0,0,0,1)';
  mapleLeafPath(c,s*1.04);
  c.fill();
  c.restore();
  // leaf body
  const g=c.createLinearGradient(-s*0.5,-s*0.6,s*0.5,s*0.6);
  g.addColorStop(0,L.c0); g.addColorStop(1,L.c1);
  c.fillStyle=g;
  c.globalAlpha=0.92;
  mapleLeafPath(c,s);
  c.fill();
  // central vein
  c.globalAlpha=0.35;
  c.strokeStyle='rgba(60,18,6,0.7)';
  c.lineWidth=Math.max(1,s*0.05);
  c.beginPath(); c.moveTo(0,s*0.5); c.lineTo(0,-s*0.46); c.stroke();
  c.restore();
}
function mapleLeafPath(c,s){
  // stylized 5-lobe maple silhouette
  c.beginPath();
  const lobes=5, spread=0.62;
  c.moveTo(0,s*0.52);                       // stem base
  for(let i=0;i<lobes;i++){
    const base=-Math.PI/2 + (i-(lobes-1)/2)*spread;
    const tip=base, mid1=base-spread*0.32, mid2=base+spread*0.32;
    const inner=s*0.30, outer=s*0.62;
    c.quadraticCurveTo(Math.cos(mid1)*inner, -Math.sin(mid1)*inner + 0,
                       Math.cos(tip)*outer, -Math.sin(tip)*outer);
    c.quadraticCurveTo(Math.cos(mid2)*inner, -Math.sin(mid2)*inner,
                       0, 0);
  }
  c.closePath();
}

/* ---------- a couple of slow koi for life ---------- */
function makeKoi(spec){
  return {x:W*spec.x,y:H*spec.y,a:spec.a,len:spec.len,phase:Math.random()*10,
    speed:18+Math.random()*8,turnT:1+Math.random()*3,turn:0,
    core:spec.c0,mid:spec.c1,edge:spec.c2,patch:spec.patch};
}
let koi=[];
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;};
function updateKoi(f,dt){
  f.turnT-=dt;
  if(f.turnT<=0){ f.turn=(Math.random()-0.5)*1.2; f.turnT=2+Math.random()*4; }
  const m=90;
  let ta=f.a+f.turn*dt;
  if(f.x<m||f.y<m||f.x>W-m||f.y>H-m) ta=Math.atan2(H*0.5-f.y,W*0.5-f.x);
  f.a+=Math.max(-1.2*dt,Math.min(1.2*dt,angDiff(ta,f.a)));
  f.x+=Math.cos(f.a)*f.speed*dt; f.y+=Math.sin(f.a)*f.speed*dt;
  f.x=Math.max(20,Math.min(W-20,f.x)); f.y=Math.max(20,Math.min(H-20,f.y));
  f.phase+=dt*(2.2+f.speed*0.05)*2.2;
}
function drawKoi(c,f){
  const L=f.len;
  c.save(); c.translate(f.x,f.y); c.rotate(f.a);
  // body silhouette via spine + width
  const segs=14, pts=[];
  const amp=L*0.07;
  for(let i=0;i<=segs;i++){
    const s=i/segs;
    pts.push({x:L*0.5-s*L, y:Math.sin(f.phase-s*4.2)*amp*Math.pow(s,1.4)});
  }
  const wf=s=>L*0.15*Math.pow(Math.sin(Math.PI*Math.min(0.1+s*0.9,1)),0.85)*(1-0.55*(s))+L*0.02;
  // tail fan
  c.save();
  const tp=pts[segs];
  c.translate(tp.x,tp.y);
  c.rotate(Math.atan2(pts[segs].y-pts[segs-1].y,pts[segs].x-pts[segs-1].x));
  const tl=L*0.5, sw=Math.sin(f.phase-5)*tl*0.3;
  const tg=c.createRadialGradient(0,0,tl*0.05,0,0,tl);
  tg.addColorStop(0,hexA(f.mid,0.8)); tg.addColorStop(1,hexA(f.mid,0));
  c.fillStyle=tg;
  c.beginPath(); c.moveTo(0,0);
  c.bezierCurveTo(tl*0.4,sw, tl*0.8,tl*0.4+sw, tl,tl*0.5+sw);
  c.bezierCurveTo(tl*0.6,sw*0.4, tl*0.6,-tl*0.4+sw, tl,-tl*0.5+sw);
  c.closePath(); c.fill();
  c.restore();
  // body
  const top=[],bot=[];
  for(let i=0;i<pts.length;i++){
    const p=pts[i], pa=pts[Math.max(0,i-1)], pb=pts[Math.min(pts.length-1,i+1)];
    let dx=pb.x-pa.x,dy=pb.y-pa.y; const l=Math.hypot(dx,dy)||1; dx/=l;dy/=l;
    const w=wf(i/segs);
    top.push({x:p.x-dy*w,y:p.y+dx*w}); bot.push({x:p.x+dy*w,y:p.y-dx*w});
  }
  c.beginPath();
  c.moveTo(top[0].x,top[0].y);
  for(let i=1;i<top.length;i++)c.lineTo(top[i].x,top[i].y);
  for(let i=bot.length-1;i>=0;i--)c.lineTo(bot[i].x,bot[i].y);
  c.closePath();
  const bg=c.createRadialGradient(L*0.12,0,L*0.04,L*0.05,0,L*0.6);
  bg.addColorStop(0,f.core); bg.addColorStop(0.55,f.mid); bg.addColorStop(1,f.edge);
  c.fillStyle=bg; c.fill();
  // patch
  if(f.patch){
    c.save(); c.beginPath();
    c.moveTo(top[0].x,top[0].y);
    for(let i=1;i<top.length;i++)c.lineTo(top[i].x,top[i].y);
    for(let i=bot.length-1;i>=0;i--)c.lineTo(bot[i].x,bot[i].y);
    c.closePath(); c.clip();
    c.fillStyle=f.patch;
    c.beginPath(); c.ellipse(pts[5].x,pts[5].y,L*0.16,L*0.12,0,0,TAU); c.fill();
    c.restore();
  }
  // top highlight
  c.save();
  c.beginPath();
  c.moveTo(top[0].x,top[0].y);
  for(let i=1;i<top.length;i++)c.lineTo(top[i].x,top[i].y);
  for(let i=bot.length-1;i>=0;i--)c.lineTo(bot[i].x,bot[i].y);
  c.closePath(); c.clip();
  const hg=c.createRadialGradient(L*0.12,0,0,L*0.08,0,L*0.5);
  hg.addColorStop(0,'rgba(255,255,255,0.28)'); hg.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=hg; c.beginPath(); c.ellipse(L*0.1,0,L*0.42,L*0.09,0,0,TAU); c.fill();
  c.restore();
  c.restore();
}
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}

/* ---------- rising bubbles ---------- */
let bubbles=[];
function makeBubble(){return{x:Math.random()*W,y:H+Math.random()*H,r:2+Math.random()*9,
  vy:6+Math.random()*16,wob:Math.random()*TAU,wsp:0.6+Math.random()*1.2,al:0.05+Math.random()*0.12};}

/* ---------- caustic shimmer overlay (slow moving light net) ---------- */
function caustics(c){
  c.save();
  c.globalCompositeOperation='soft-light';
  const cell=120;
  for(let gx=-1;gx<W/cell+1;gx++){
    for(let gy=-1;gy<H/cell+1;gy++){
      const x=gx*cell+Math.sin(t*0.4+gy)*30;
      const y=gy*cell+Math.cos(t*0.33+gx)*30;
      const r=cell*(0.5+0.2*Math.sin(t*0.5+gx*0.7+gy));
      const g=c.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,'rgba(255,244,210,0.10)');
      g.addColorStop(1,'rgba(255,244,210,0)');
      c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
    }
  }
  c.restore();
}

/* ---------- init creatures ---------- */
function seed(){
  leaves=[]; for(let i=0;i<11;i++) leaves.push(makeLeaf());
  bubbles=[]; for(let i=0;i<26;i++){const b=makeBubble(); b.y=Math.random()*H; bubbles.push(b);}
  koi=[
    makeKoi({x:0.30,y:0.62,a:0.3,len:96,c0:'#ffffff',c1:'#f4ead8',c2:'#d2c2a6',patch:'rgba(241,71,18,0.9)'}),
    makeKoi({x:0.70,y:0.34,a:2.6,len:118,c0:'#ffb347',c1:'#ff7d17',c2:'#cf4708',patch:null}),
    makeKoi({x:0.55,y:0.78,a:-1.2,len:80,c0:'#ff7a45',c1:'#f04a12',c2:'#a82803',patch:'rgba(255,255,255,0.85)'})
  ];
}

/* ---------- main animation ---------- */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  t=ts/1000;
  const dt=Math.min(0.05,Math.max(0.001,t-last)); last=t;

  // floor (with a faint global drift to feel like flowing water)
  ctx.clearRect(0,0,W,H);
  const drift=Math.sin(t*0.15)*6;
  ctx.drawImage(floor,drift,Math.cos(t*0.12)*5,floor.width/DPR,floor.height/DPR);

  // koi swim below leaves
  for(const f of koi){updateKoi(f,dt); ctx.save(); ctx.globalAlpha=0.92; drawKoi(ctx,f); ctx.restore();}

  // bubbles
  for(const b of bubbles){
    b.y-=b.vy*dt; b.wob+=b.wsp*dt;
    const x=b.x+Math.sin(b.wob)*6;
    if(b.y< -20){b.y=H+10;b.x=Math.random()*W;}
    ctx.beginPath(); ctx.arc(x,b.y,b.r,0,TAU);
    ctx.strokeStyle='rgba(220,240,235,'+(b.al+0.05)+')'; ctx.lineWidth=1;
    ctx.fillStyle='rgba(200,230,225,'+(b.al*0.5)+')'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(x-b.r*0.3,b.y-b.r*0.3,b.r*0.25,0,TAU);
    ctx.fillStyle='rgba(255,255,255,'+(b.al+0.18)+')'; ctx.fill();
  }

  // floating leaves (slow ambient drift + sway)
  for(const L of leaves){
    L.sway+=L.swaySp*dt;
    L.x+=(L.vx+Math.sin(L.sway)*10)*dt*0.6;
    L.y+=L.vy*dt*0.6;
    L.a+=L.va*dt;
    if(L.y> H+40){L.y=-40;L.x=Math.random()*W;}
    if(L.x> W+40)L.x=-40; if(L.x< -40)L.x=W+40;
    drawLeaf(ctx,L);
  }

  // caustic light net + vignette
  caustics(ctx);
  const vg=ctx.createRadialGradient(W*0.5,H*0.5,Math.min(W,H)*0.2,W*0.5,H*0.5,Math.max(W,H)*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(3,10,9,0.5)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

/* ---------- calendar widget ---------- */
const grid=document.getElementById('grid');
const mLabel=document.getElementById('mLabel');
const yLabel=document.getElementById('yLabel');
const MN=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const real=new Date();
let viewY=real.getFullYear(), viewM=real.getMonth();
let sel=null;
function renderCal(){
  mLabel.textContent=MN[viewM]; yLabel.textContent=viewY;
  grid.innerHTML='';
  const first=new Date(viewY,viewM,1).getDay();
  const days=new Date(viewY,viewM+1,0).getDate();
  const prevDays=new Date(viewY,viewM,0).getDate();
  for(let i=first-1;i>=0;i--){
    const c=document.createElement('div'); c.className='cell pad'; c.textContent=prevDays-i; grid.appendChild(c);
  }
  for(let d=1;d<=days;d++){
    const c=document.createElement('div'); c.className='cell'; c.textContent=d;
    const dow=new Date(viewY,viewM,d).getDay();
    if(dow===0)c.classList.add('sun'); if(dow===6)c.classList.add('sat');
    if(viewY===real.getFullYear()&&viewM===real.getMonth()&&d===real.getDate()) c.classList.add('today');
    if(sel===d) c.classList.add('sel');
    if([8,17,26].includes(d)){const dot=document.createElement('span');dot.className='dot';c.appendChild(dot);}
    c.addEventListener('click',()=>{sel=d;renderCal();});
    grid.appendChild(c);
  }
  const total=first+days, tail=(7-(total%7))%7;
  for(let i=1;i<=tail;i++){const c=document.createElement('div');c.className='cell pad';c.textContent=i;grid.appendChild(c);}
}
document.getElementById('prev').addEventListener('click',()=>{viewM--;if(viewM<0){viewM=11;viewY--;}sel=null;renderCal();});
document.getElementById('next').addEventListener('click',()=>{viewM++;if(viewM>11){viewM=0;viewY++;}sel=null;renderCal();});
renderCal();

/* clock */
const clk=document.getElementById('clock'), td=document.getElementById('today');
const KD=['일','월','화','수','목','금','토'];
function tick(){
  const d=new Date();
  clk.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  td.textContent=`${d.getMonth()+1}월 ${d.getDate()}일 (${KD[d.getDay()]})`;
}
tick(); setInterval(tick,1000*15);

/* ---------- panel layout (responsive, first-paint positions) ---------- */
const cal=document.getElementById('cal');
const now=document.getElementById('now');
const temp=document.getElementById('temp');
function layout(){
  const narrow=W<760;
  if(narrow){
    const cx=(W-cal.offsetWidth)/2;
    place(cal, cx, Math.max(54,H*0.10));
    place(now, Math.max(14,cx-6), Math.max(54,H*0.10)+cal.offsetHeight+14);
    place(temp, Math.min(W-temp.offsetWidth-14, cx+cal.offsetWidth-temp.offsetWidth+6),
               Math.max(54,H*0.10)+cal.offsetHeight+14);
  }else{
    const gx=Math.max(40,W*0.5-cal.offsetWidth-30);
    const gy=Math.max(60,H*0.5-cal.offsetHeight*0.5);
    place(cal, gx, gy);
    place(now, gx+cal.offsetWidth+26, gy);
    place(temp, gx+cal.offsetWidth+26, gy+now.offsetHeight+22);
  }
}
function place(el,x,y){el._x=x;el._y=y;apply(el);}
function apply(el){el.style.transform=`translate(${el._x+ (el._px||0)}px, ${el._y+(el._py||0)}px)`;}

/* ---------- drag + subtle mouse parallax ---------- */
let drag=null,offx=0,offy=0;
document.querySelectorAll('.glass.drag').forEach(el=>{
  el.addEventListener('pointerdown',e=>{
    drag=el; el.classList.add('dragging'); el.setPointerCapture(e.pointerId);
    offx=e.clientX-el._x-(el._px||0); offy=e.clientY-el._y-(el._py||0);
    el.style.zIndex=10;
  });
});
window.addEventListener('pointermove',e=>{
  if(drag){
    drag._px=0;drag._py=0;
    drag._x=e.clientX-offx; drag._y=e.clientY-offy; apply(drag);
    return;
  }
  // parallax: panels drift opposite cursor, scaled by an implied depth
  const nx=(e.clientX/W-0.5), ny=(e.clientY/H-0.5);
  cal._px=-nx*10;  cal._py=-ny*10;  apply(cal);
  now._px=-nx*20;  now._py=-ny*20;  apply(now);
  temp._px=-nx*16; temp._py=-ny*16; apply(temp);
});
window.addEventListener('pointerup',()=>{ if(drag){drag.classList.remove('dragging');drag=null;} });

/* ---------- boot ---------- */
resize();
seed();
requestAnimationFrame(frame);
})();
</script>
