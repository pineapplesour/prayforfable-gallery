<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잉어연못 · 글래스 뮤직</title>
<style>
  :root{
    --glass-bg: rgba(14, 20, 22, 0.34);
    --glass-bg-2: rgba(10, 16, 18, 0.46);
    --glass-stroke: rgba(255,255,255,0.16);
    --glass-stroke-soft: rgba(255,255,255,0.08);
    --txt: rgba(244,248,246,0.96);
    --txt-dim: rgba(228,238,234,0.62);
    --accent: #ffb24d;
    --accent-2: #ff7d3a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;overflow:hidden;
    background:#06090b;color:var(--txt);
    font-family:"Pretendard","Hiragino Kaku Gothic ProN","Yu Gothic","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* ambient natural base */
  #pond{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;}
  /* soft top vignette so glass reads */
  #veil{position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 8%, rgba(0,0,0,0) 40%, rgba(2,6,7,0.42) 100%),
      linear-gradient(180deg, rgba(4,9,11,0.30) 0%, rgba(4,9,11,0) 26%);
  }

  /* ===== floating liquid-glass stage ===== */
  #stage{position:fixed;inset:0;pointer-events:none;}
  .panel{
    position:absolute;pointer-events:auto;
    background:var(--glass-bg);
    -webkit-backdrop-filter:blur(22px) saturate(1.35);
    backdrop-filter:blur(22px) saturate(1.35);
    border:1px solid var(--glass-stroke);
    border-radius:26px;
    box-shadow:
      0 18px 48px rgba(0,0,0,0.40),
      0 6px 16px rgba(0,0,0,0.28),
      inset 0 1px 0 rgba(255,255,255,0.22),
      inset 0 0 0 1px rgba(255,255,255,0.04);
    will-change:transform;
    transition:box-shadow .35s ease, border-color .35s ease;
  }
  .panel::before{ /* glossy inner top highlight */
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.03) 22%, rgba(255,255,255,0) 46%);
    mix-blend-mode:screen;
  }
  .panel::after{ /* faint edge sheen */
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    box-shadow:inset 0 -1px 0 rgba(0,0,0,0.18);
  }
  .panel.drag{cursor:grabbing;box-shadow:
      0 28px 70px rgba(0,0,0,0.52),
      0 10px 22px rgba(0,0,0,0.34),
      inset 0 1px 0 rgba(255,255,255,0.30);}
  .grip{cursor:grab;}

  /* --- main music player --- */
  #player{ left:8%; top:50%; width:360px; padding:22px 22px 20px;}
  .pl-top{display:flex;align-items:center;gap:14px;}
  .art{
    width:74px;height:74px;border-radius:18px;flex:0 0 auto;position:relative;overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
    background:
      radial-gradient(120% 120% at 25% 20%, #ffd27a 0%, #ff9b42 38%, #f0571f 72%, #8c2a06 100%);
  }
  .art::after{content:"";position:absolute;inset:0;
    background:radial-gradient(60% 60% at 70% 78%, rgba(255,255,255,0.0), rgba(0,0,0,0.30));}
  .art .koi-dot{position:absolute;left:50%;top:50%;width:34px;height:18px;transform:translate(-50%,-50%) rotate(-18deg);
    background:#fff;border-radius:60% 40% 50% 50%/60% 60% 40% 40%;opacity:.92;
    box-shadow:0 0 0 3px rgba(244,71,18,0.55);}
  .pl-meta{min-width:0;}
  .pl-eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--txt-dim);}
  .pl-title{font-size:19px;font-weight:700;margin:3px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pl-artist{font-size:13px;color:var(--txt-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .pl-vis{display:flex;align-items:flex-end;gap:4px;height:30px;margin:16px 2px 12px;}
  .pl-vis i{flex:1;background:linear-gradient(180deg,var(--accent),var(--accent-2));border-radius:3px;
    height:30%;transform-origin:bottom;}

  .pl-progress{margin:4px 2px 0;}
  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,0.14);overflow:hidden;position:relative;}
  .bar>span{position:absolute;left:0;top:0;bottom:0;width:34%;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));}
  .bar>b{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:#fff;
    transform:translate(-50%,-50%);left:34%;box-shadow:0 2px 6px rgba(0,0,0,0.4);}
  .times{display:flex;justify-content:space-between;font-size:11px;color:var(--txt-dim);margin-top:7px;
    font-variant-numeric:tabular-nums;}

  .pl-ctrl{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:14px;}
  .pl-ctrl button{
    -webkit-appearance:none;appearance:none;border:0;cursor:pointer;color:var(--txt);
    background:rgba(255,255,255,0.07);width:42px;height:42px;border-radius:50%;
    display:grid;place-items:center;transition:transform .12s ease,background .2s ease;
    border:1px solid var(--glass-stroke-soft);
  }
  .pl-ctrl button:hover{background:rgba(255,255,255,0.14);}
  .pl-ctrl button:active{transform:scale(.92);}
  .pl-ctrl .play{width:58px;height:58px;background:linear-gradient(180deg,#fff,#e9efec);color:#10201d;
    box-shadow:0 10px 22px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.8);}
  .pl-ctrl .play:hover{background:#fff;}
  .pl-ctrl svg{width:20px;height:20px;}
  .pl-ctrl .play svg{width:24px;height:24px;}

  /* --- queue / now playing list --- */
  #queue{ right:8%; top:18%; width:300px; padding:18px;}
  .q-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .q-head h3{margin:0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt-dim);font-weight:600;}
  .q-pill{font-size:11px;color:var(--txt);background:rgba(255,255,255,0.10);
    border:1px solid var(--glass-stroke-soft);padding:4px 11px;border-radius:99px;}
  .q-row{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:14px;transition:background .2s;cursor:pointer;}
  .q-row:hover{background:rgba(255,255,255,0.07);}
  .q-row.on{background:rgba(255,178,77,0.12);}
  .q-no{width:18px;text-align:center;font-size:12px;color:var(--txt-dim);font-variant-numeric:tabular-nums;}
  .q-row.on .q-no{color:var(--accent);}
  .q-info{min-width:0;flex:1;}
  .q-t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .q-a{font-size:11.5px;color:var(--txt-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .q-d{font-size:11.5px;color:var(--txt-dim);font-variant-numeric:tabular-nums;}

  /* --- small ambient/status chip --- */
  #chip{ left:8%; bottom:7%; padding:12px 18px; border-radius:99px;
    display:flex;align-items:center;gap:11px;}
  #chip .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 4px rgba(255,178,77,0.18);}
  #chip span{font-size:12.5px;color:var(--txt);letter-spacing:.02em;}
  #chip b{color:var(--accent);font-weight:600;}

  .hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    color:rgba(255,255,255,.66);font-size:12px;letter-spacing:.12em;
    background:rgba(2,18,20,.34);padding:7px 18px;border-radius:99px;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    pointer-events:none;transition:opacity 1.4s;white-space:nowrap;z-index:5;}

  /* responsive: 390 mobile */
  @media (max-width:560px){
    #player{ left:50%; top:auto; bottom:14px; transform:translateX(-50%); width:min(92vw,360px);}
    #queue{ right:50%; left:auto; top:12px; transform:translateX(50%); width:min(92vw,360px); max-height:none;}
    #chip{ left:50%; bottom:auto; top:calc(12px + 252px); transform:translateX(-50%);}
    .hint{display:none;}
  }
</style>
</head>
<body>
<canvas id="pond"></canvas>
<div id="veil"></div>

<div id="stage">
  <!-- now playing list -->
  <section class="panel" id="queue">
    <div class="q-head grip" data-drag>
      <h3>재생 대기열</h3>
      <span class="q-pill">5곡 · 연못 믹스</span>
    </div>
    <div id="qlist"></div>
  </section>

  <!-- main player -->
  <section class="panel" id="player">
    <div class="pl-top grip" data-drag>
      <div class="art"><div class="koi-dot"></div></div>
      <div class="pl-meta">
        <div class="pl-eyebrow">지금 재생 중</div>
        <div class="pl-title" id="npTitle">물 위의 잔물결</div>
        <div class="pl-artist" id="npArtist">고요 · 앰비언트 코이</div>
      </div>
    </div>

    <div class="pl-vis" id="vis"></div>

    <div class="pl-progress">
      <div class="bar"><span id="barFill"></span><b id="barKnob"></b></div>
      <div class="times"><span id="tCur">1:12</span><span id="tDur">3:34</span></div>
    </div>

    <div class="pl-ctrl">
      <button id="prev" title="이전">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14l-11-7z"/></svg>
      </button>
      <button class="play" id="play" title="재생/일시정지">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="next" title="다음">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg>
      </button>
    </div>
  </section>

  <!-- ambient chip -->
  <section class="panel" id="chip">
    <span class="dot"></span>
    <span>연못 온도 <b>18°C</b> · 코이 6마리 헤엄치는 중</span>
  </section>
</div>

<div class="hint" id="hint">물 위를 클릭 → 파문 · 패널은 드래그</div>

<script>
'use strict';
/* ============================================================
   AMBIENT BASE: koi pond (Canvas2D height-field water + fish)
   ============================================================ */
(()=>{
const TAU=Math.PI*2;
const cv=document.getElementById('pond');
const ctx=cv.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1;

/* offscreen layers */
const bottomCan=document.createElement('canvas'),bx=bottomCan.getContext('2d');
const fishCan=document.createElement('canvas'),fx=fishCan.getContext('2d');

/* low-res ripple height field */
let GW=0,GH=0,cur=null,prev=null;
function makeField(){
  const scale=Math.min(0.30, 360/Math.max(W,H));
  GW=Math.max(48,Math.round(W*scale));
  GH=Math.max(48,Math.round(H*scale));
  cur=new Float32Array(GW*GH);
  prev=new Float32Array(GW*GH);
}
function drop(px,py,r,amp){
  const gx=Math.round(px/W*GW), gy=Math.round(py/H*GH);
  const rr=Math.max(1,Math.round(r/W*GW));
  for(let y=-rr;y<=rr;y++)for(let x=-rr;x<=rr;x++){
    const d=Math.hypot(x,y); if(d>rr)continue;
    const ix=gx+x, iy=gy+y;
    if(ix<1||iy<1||ix>=GW-1||iy>=GH-1)continue;
    prev[iy*GW+ix]+=amp*(Math.cos(d/rr*Math.PI)*0.5+0.5);
  }
}
function stepWater(){
  for(let y=1;y<GH-1;y++){
    for(let x=1;x<GW-1;x++){
      const i=y*GW+x;
      const v=(prev[i-1]+prev[i+1]+prev[i-GW]+prev[i+GW])*0.5 - cur[i];
      cur[i]=v*0.978;            /* slow, gentle damping */
    }
  }
  const t=cur;cur=prev;prev=t;
}

/* ---- pond bottom: murky water + pebbles + flecks ---- */
function paintBottom(){
  const w=bottomCan.width=Math.round(W*DPR);
  const h=bottomCan.height=Math.round(H*DPR);
  bx.setTransform(DPR,0,0,DPR,0,0);
  const cw=W,ch=H;
  const g=bx.createRadialGradient(cw*0.5,ch*0.40,0,cw*0.5,ch*0.5,Math.max(cw,ch)*0.80);
  g.addColorStop(0,'#3a4a3a');g.addColorStop(0.5,'#2c3a30');g.addColorStop(1,'#1a241d');
  bx.fillStyle=g;bx.fillRect(0,0,cw,ch);
  for(let i=0;i<11;i++){
    const x=Math.random()*cw,y=Math.random()*ch,r=90+Math.random()*210;
    const ag=bx.createRadialGradient(x,y,0,x,y,r);
    ag.addColorStop(0,'rgba(22,34,22,0.30)');ag.addColorStop(1,'rgba(22,34,22,0)');
    bx.fillStyle=ag;bx.beginPath();bx.arc(x,y,r,0,TAU);bx.fill();
  }
  const flecks=Math.round(cw*ch/900);
  for(let i=0;i<flecks;i++){
    const x=Math.random()*cw,y=Math.random()*ch,r=Math.random()*1.6+0.4;
    bx.fillStyle=Math.random()<0.5
      ?'rgba(255,240,205,'+(Math.random()*0.07).toFixed(3)+')'
      :'rgba(14,20,12,'+(Math.random()*0.12).toFixed(3)+')';
    bx.beginPath();bx.arc(x,y,r,0,TAU);bx.fill();
  }
  const np=Math.max(10,Math.round(cw*ch/52000));
  for(let i=0;i<np;i++)pebble(Math.random()*cw,Math.random()*ch,12+Math.random()*44,Math.random()*TAU);
}
function pebble(x,y,r,rot){
  bx.save();bx.translate(x,y);bx.rotate(rot);
  const ry=r*(0.62+Math.random()*0.3);
  bx.fillStyle='rgba(0,0,0,0.28)';
  bx.beginPath();bx.ellipse(r*0.13,ry*0.2,r*1.02,ry*1.02,0,0,TAU);bx.fill();
  const hue=28+Math.random()*34,sat=6+Math.random()*14,li=32+Math.random()*24;
  const g=bx.createRadialGradient(-r*0.35,-ry*0.4,r*0.08,0,0,r*1.15);
  g.addColorStop(0,'hsl('+hue+','+sat+'%,'+(li+16)+'%)');
  g.addColorStop(0.7,'hsl('+hue+','+sat+'%,'+li+'%)');
  g.addColorStop(1,'hsl('+hue+','+(sat+5)+'%,'+(li-14)+'%)');
  bx.fillStyle=g;bx.beginPath();bx.ellipse(0,0,r,ry,0,0,TAU);bx.fill();
  bx.restore();
}

/* ---- koi fish ---- */
function palette(type){
  if(type==='orange')return{core:'#ffc77a',mid:'#ff8a2e',edge:'#cf4708',fin:'rgba(255,138,38,',patches:[]};
  if(type==='red')return{core:'#ff8a55',mid:'#f04a12',edge:'#a82803',fin:'rgba(238,76,26,',patches:[]};
  if(type==='kohaku'){const p=[];const n=3+(Math.random()*2|0);
    for(let i=0;i<n;i++)p.push({s:0.12+Math.random()*0.6,o:(Math.random()-0.5)*1.2,r:0.13+Math.random()*0.12,col:'rgba(241,71,18,0.92)'});
    return{core:'#ffffff',mid:'#f4ecdd',edge:'#cdbfa8',fin:'rgba(255,234,214,',patches:p};}
  if(type==='calico'){const p=[];
    for(let i=0;i<3;i++)p.push({s:0.12+Math.random()*0.56,o:(Math.random()-0.5)*1.3,r:0.11+Math.random()*0.11,col:'rgba(249,109,30,0.9)'});
    for(let i=0;i<3;i++)p.push({s:0.1+Math.random()*0.66,o:(Math.random()-0.5)*1.4,r:0.05+Math.random()*0.06,col:'rgba(34,34,46,0.85)'});
    return{core:'#ffffff',mid:'#f1e9da',edge:'#c9bba2',fin:'rgba(255,240,224,',patches:p};}
  return{core:'#ffffff',mid:'#f6efe3',edge:'#d3c5ae',fin:'rgba(255,238,222,',
    patches:[{s:0.07,o:0,r:0.12,col:'rgba(234,40,18,0.95)'}]};
}
function makeFish(type,len){
  const pal=palette(type);
  return{x:120+Math.random()*Math.max(60,W-240),y:120+Math.random()*Math.max(60,H-240),
    a:Math.random()*TAU,len,phase:Math.random()*10,speed:24,spT:26,turn:0,
    changeT:Math.random()*3,wakeT:Math.random()*0.2,speedN:0.3,po:Math.random()*TAU,
    core:pal.core,mid:pal.mid,edge:pal.edge,fin:pal.fin,patches:pal.patches};
}
let fishes=[];
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;};
function updateFish(f,dt){
  f.changeT-=dt;
  if(f.changeT<=0){f.spT=14+Math.random()*30; if(Math.random()<0.14)f.spT=60+Math.random()*30; f.changeT=2.5+Math.random()*4;}
  f.turn+=(Math.random()-0.5)*2.6*dt; f.turn*=Math.exp(-dt*1.4);
  let ta=f.a+f.turn;
  const m=80;
  if(f.x<m||f.y<m||f.x>W-m||f.y>H-m) ta=Math.atan2(H*0.5-f.y,W*0.5-f.x);
  for(const g of fishes){if(g===f)continue;const dx=f.x-g.x,dy=f.y-g.y;if(dx*dx+dy*dy<5200){ta=Math.atan2(dy,dx);break;}}
  const da=angDiff(ta,f.a),mt=1.0*dt;
  f.a+=Math.max(-mt,Math.min(mt,da));
  f.speed+=(f.spT-f.speed)*Math.min(1,dt*1.6);
  f.x+=Math.cos(f.a)*f.speed*dt; f.y+=Math.sin(f.a)*f.speed*dt;
  f.x=Math.max(24,Math.min(W-24,f.x)); f.y=Math.max(24,Math.min(H-24,f.y));
  f.speedN=Math.min(1,f.speed/110);
  f.phase+=dt*(3.0+f.speed*0.07)*2.2;
  f.wakeT-=dt;
  if(f.wakeT<=0&&f.speed>26){drop(f.x+Math.cos(f.a)*f.len*0.42,f.y+Math.sin(f.a)*f.len*0.42,8+f.speedN*8,0.05+0.12*f.speedN);f.wakeT=0.12+Math.random()*0.08;}
}
function bodyOutline(pts,wf){
  const top=[],bot=[];
  for(let i=0;i<pts.length;i++){
    const p=pts[i],pa=pts[Math.max(0,i-1)],pb=pts[Math.min(pts.length-1,i+1)];
    let dx=pb.x-pa.x,dy=pb.y-pa.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
    const w=wf(p.s);
    top.push({x:p.x-dy*w,y:p.y+dx*w});bot.push({x:p.x+dy*w,y:p.y-dx*w});
  }return{top,bot};
}
function tailLobe(c,len,spread,sw){const ty=spread+sw;
  c.beginPath();c.moveTo(0,0);
  c.bezierCurveTo(len*0.32,spread*0.06+sw*0.2,len*0.72,ty*0.6,len,ty);
  c.bezierCurveTo(len*0.78,ty*0.98,len*0.30,spread*0.55+sw*0.25,0,0);
  c.closePath();c.fill();}
function finShape(c,x,y,ang,len,flip){c.save();c.translate(x,y);c.rotate(ang);if(flip)c.scale(1,-1);
  c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(len*0.55,-len*0.10,len,len*0.22);
  c.quadraticCurveTo(len*0.45,len*0.34,0,0);c.closePath();c.fill();c.restore();}
function drawFish(c,f){
  const L=f.len;c.save();c.translate(f.x,f.y);c.rotate(f.a);
  const segs=16,pts=[];const amp=L*(0.05+0.06*f.speedN);
  for(let i=0;i<=segs;i++){const s=i/segs;pts.push({x:L*0.48-s*L*0.96,y:Math.sin(f.phase-s*4.4)*amp*Math.pow(s,1.5),s});}
  const wmax=L*0.16;
  const wf=s=>wmax*Math.pow(Math.sin(Math.PI*Math.min(0.10+s*0.90,1)),0.85)*(1-0.58*s)+L*0.018;
  const tp=pts[segs],tq=pts[segs-1];const tang=Math.atan2(tp.y-tq.y,tp.x-tq.x);
  c.save();c.translate(tp.x,tp.y);c.rotate(tang);
  const tl=L*0.64,sw=Math.sin(f.phase-5.2)*tl*0.30;
  const tg=c.createRadialGradient(0,0,tl*0.06,0,0,tl);
  tg.addColorStop(0,f.fin+'0.85)');tg.addColorStop(0.55,f.fin+'0.5)');tg.addColorStop(1,f.fin+'0)');
  c.fillStyle=tg;
  tailLobe(c,tl,tl*0.52,sw);tailLobe(c,tl,-tl*0.52,sw*0.85);
  tailLobe(c,tl*0.72,tl*0.16,sw*0.7);tailLobe(c,tl*0.72,-tl*0.16,sw*0.6);c.restore();
  const pp=pts[5],wp=wf(pts[5].s);const fl=Math.sin(f.phase*1.2+f.po)*0.22;
  c.fillStyle=f.fin+'0.55)';
  finShape(c,pp.x,pp.y+wp*0.85,2.3+fl,L*0.24,false);
  finShape(c,pp.x,pp.y-wp*0.85,-2.3-fl,L*0.24,true);
  const o=bodyOutline(pts,wf);
  const path=()=>{c.beginPath();c.moveTo(o.top[0].x,o.top[0].y);
    for(let i=1;i<o.top.length;i++)c.lineTo(o.top[i].x,o.top[i].y);
    for(let i=o.bot.length-1;i>=0;i--)c.lineTo(o.bot[i].x,o.bot[i].y);
    c.quadraticCurveTo(pts[0].x+L*0.16,pts[0].y,o.top[0].x,o.top[0].y);c.closePath();};
  const bg=c.createRadialGradient(L*0.12,0,L*0.05,L*0.05,0,L*0.62);
  bg.addColorStop(0,f.core);bg.addColorStop(0.55,f.mid);bg.addColorStop(1,f.edge);
  path();c.fillStyle=bg;c.fill();
  if(f.patches.length){c.save();path();c.clip();
    for(const p of f.patches){const i=Math.min(segs,Math.round(p.s*segs));const pt=pts[i],w=wf(p.s);
      c.beginPath();c.ellipse(pt.x,pt.y+p.o*w,p.r*L,p.r*L*0.75,0,0,TAU);c.fillStyle=p.col;c.fill();}
    c.restore();}
  c.save();path();c.clip();
  const hg=c.createRadialGradient(L*0.15,0,0,L*0.10,0,L*0.5);
  hg.addColorStop(0,'rgba(255,255,255,0.28)');hg.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=hg;c.beginPath();c.ellipse(L*0.10,0,L*0.45,wmax*0.55,0,0,TAU);c.fill();c.restore();
  path();c.strokeStyle='rgba(40,15,0,0.16)';c.lineWidth=1;c.stroke();
  const ep=pts[1],ew=wf(pts[1].s);
  c.fillStyle='#19120a';
  c.beginPath();c.arc(ep.x,ep.y+ew*0.72,L*0.026,0,TAU);c.fill();
  c.beginPath();c.arc(ep.x,ep.y-ew*0.72,L*0.026,0,TAU);c.fill();
  c.restore();
}

/* slow drifting bubbles (frangollo-like soft depth blobs) */
let bubbles=[];
function makeBubbles(){bubbles=[];const n=Math.max(6,Math.round(W*H/120000));
  for(let i=0;i<n;i++)bubbles.push({x:Math.random()*W,y:Math.random()*H,r:18+Math.random()*70,
    vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,o:0.05+Math.random()*0.08});}

/* ---- composite render with water refraction ---- */
let imgData=null,buf=null;
function ensureImg(){
  const w=cv.width,h=cv.height;
  if(!imgData||imgData.width!==w||imgData.height!==h){imgData=ctx.createImageData(w,h);buf=imgData.data;}
}
function render(t){
  /* draw bottom + bubbles + fish onto a source canvas (fishCan) */
  fishCan.width=cv.width;fishCan.height=cv.height;
  fx.setTransform(DPR,0,0,DPR,0,0);
  fx.clearRect(0,0,W,H);
  fx.drawImage(bottomCan,0,0,W,H);
  /* bubbles */
  for(const b of bubbles){
    const g=fx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    g.addColorStop(0,'rgba(180,210,200,'+b.o+')');
    g.addColorStop(0.7,'rgba(120,150,140,'+(b.o*0.5)+')');
    g.addColorStop(1,'rgba(120,150,140,0)');
    fx.fillStyle=g;fx.beginPath();fx.arc(b.x,b.y,b.r,0,TAU);fx.fill();
  }
  for(const f of fishes)drawFish(fx,f);
  /* water tint pass on top of source so the whole thing reads as submerged */
  fx.fillStyle='rgba(16,46,46,0.20)';fx.fillRect(0,0,W,H);

  /* refraction: sample source with displacement from height field */
  ensureImg();
  const src=fx.getImageData(0,0,cv.width,cv.height).data;
  const w=cv.width,h=cv.height;
  const dispScale=3.4*DPR;
  for(let y=0;y<h;y++){
    const gy=y/h*(GH-1);const gy0=gy|0;const fyv=gy-gy0;
    for(let x=0;x<w;x++){
      const gx=x/w*(GW-1);const gx0=gx|0;const fxv=gx-gx0;
      const i00=gy0*GW+gx0;
      const hL=cur[i00], hR=cur[i00+1]||hL, hD=cur[i00+GW]||hL;
      const dHx=(hR-hL), dHy=(hD-hL);
      let sx=x+dHx*dispScale*40, sy=y+dHy*dispScale*40;
      sx=sx<0?0:sx>=w?w-1:sx; sy=sy<0?0:sy>=h?h-1:sy;
      const si=((sy|0)*w+(sx|0))*4;
      const di=(y*w+x)*4;
      /* caustic-ish brighten on crests */
      const cr=(-(hL))*0.0;
      let add=Math.min(40,Math.max(0,(dHx*dHx+dHy*dHy)*9000));
      buf[di]  =Math.min(255,src[si]+add);
      buf[di+1]=Math.min(255,src[si+1]+add);
      buf[di+2]=Math.min(255,src[si+2]+add*0.85);
      buf[di+3]=255;
    }
  }
  ctx.putImageData(imgData,0,0);
  /* surface sheen + vignette overlay (drawn after, in device px via reset transform) */
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  const vg=ctx.createRadialGradient(w*0.5,h*0.42,Math.min(w,h)*0.2,w*0.5,h*0.5,Math.max(w,h)*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(2,8,9,0.45)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,w,h);
  ctx.restore();
}

/* ---- layout / loop ---- */
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  paintBottom();makeField();makeBubbles();imgData=null;
  for(const f of fishes){f.x=Math.max(40,Math.min(W-40,f.x));f.y=Math.max(40,Math.min(H-40,f.y));}
}
window.addEventListener('resize',resize);

cv.addEventListener('pointerdown',e=>{
  drop(e.clientX,e.clientY,22,1.4);
  const hint=document.getElementById('hint');if(hint)hint.style.opacity=0;
});
let lmx=-1,lmy=-1;
cv.addEventListener('pointermove',e=>{
  if(lmx<0){lmx=e.clientX;lmy=e.clientY;return;}
  if(Math.hypot(e.clientX-lmx,e.clientY-lmy)>30){drop(e.clientX,e.clientY,9,0.10);lmx=e.clientX;lmy=e.clientY;}
});

resize();
fishes=[makeFish('orange',112),makeFish('kohaku',98),makeFish('calico',86),
        makeFish('red',122),makeFish('orange',70),makeFish('tancho',82)];
for(let i=0;i<3;i++)drop(Math.random()*W,Math.random()*H,16,0.6);
setTimeout(()=>{const h=document.getElementById('hint');if(h)h.style.opacity=0;},9000);

let ambT=3,last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const t=ts/1000;const dt=Math.min(0.05,Math.max(0.001,t-last));last=t;
  ambT-=dt; if(ambT<=0){drop(Math.random()*W,Math.random()*H,10,0.30);ambT=4+Math.random()*5;}
  for(const b of bubbles){b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<-90)b.x=W+90;if(b.x>W+90)b.x=-90;if(b.y<-90)b.y=H+90;if(b.y>H+90)b.y=-90;}
  for(const f of fishes)updateFish(f,dt);
  stepWater();
  render(t);
}
requestAnimationFrame(frame);

/* expose ambient pulse for glass parallax */
window.__pondMouse=(x,y)=>{}; /* placeholder */
})();

/* ============================================================
   FLOATING GLASS UI: drag + parallax + working music widget
   ============================================================ */
(()=>{
const stage=document.getElementById('stage');
const panels=[...document.querySelectorAll('.panel')];

/* --- parallax: panels drift slightly opposite to mouse --- */
const base=new WeakMap();
panels.forEach((p,i)=>base.set(p,{depth:0.6+i*0.5, dx:0, dy:0}));
let mx=0,my=0,tx=0,ty=0;
window.addEventListener('pointermove',e=>{
  tx=(e.clientX/window.innerWidth-0.5);
  ty=(e.clientY/window.innerHeight-0.5);
});
function applyTransforms(){
  mx+=(tx-mx)*0.06; my+=(ty-my)*0.06;
  for(const p of panels){
    const b=base.get(p);
    const px=-mx*8*b.depth + b.dx;
    const py=-my*8*b.depth + b.dy;
    /* honor CSS centering on mobile (translateX) by reading data flag */
    const center=p.dataset.center;
    if(center==='x') p.style.transform=`translate(calc(-50% + ${px}px), ${py}px)`;
    else if(center==='cx') p.style.transform=`translate(calc(50% + ${px}px), ${py}px)`;
    else p.style.transform=`translate(${px}px, ${py}px)`;
  }
  requestAnimationFrame(applyTransforms);
}
/* detect centered panels (mobile) once, on load + resize */
function tagCenter(){
  for(const p of panels){
    const cs=getComputedStyle(p);
    // crude: if left:50% used we treat as centered-x
    const m=cs.transform; // already overwritten; instead infer from id+width
  }
}
requestAnimationFrame(applyTransforms);

/* --- dragging via grip handles --- */
let drag=null;
function pointerDown(e){
  const handle=e.target.closest('[data-drag]');
  if(!handle)return;
  const panel=handle.closest('.panel');
  if(!panel)return;
  const b=base.get(panel);
  drag={panel,b,sx:e.clientX,sy:e.clientY,odx:b.dx,ody:b.dy};
  panel.classList.add('drag');
  panel.style.zIndex=999;
  e.preventDefault();
}
function pointerMove(e){
  if(!drag)return;
  drag.b.dx=drag.odx+(e.clientX-drag.sx);
  drag.b.dy=drag.ody+(e.clientY-drag.sy);
}
function pointerUp(){
  if(!drag)return;
  drag.panel.classList.remove('drag');
  drag=null;
}
stage.addEventListener('pointerdown',pointerDown);
window.addEventListener('pointermove',pointerMove);
window.addEventListener('pointerup',pointerUp);

/* --- music widget logic --- */
const tracks=[
  {t:'물 위의 잔물결', a:'고요 · 앰비언트 코이', d:214},
  {t:'느린 헤엄', a:'Tancho · Lo-fi Pond', d:188},
  {t:'수면 아래 빛', a:'Caustics', d:241},
  {t:'돌 틈의 그늘', a:'Pebble Drift', d:176},
  {t:'붉은 비단잉어', a:'Kohaku Nights', d:203},
];
let idx=0,playing=true,cur=72; /* seconds into track */
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

const npTitle=document.getElementById('npTitle');
const npArtist=document.getElementById('npArtist');
const barFill=document.getElementById('barFill');
const barKnob=document.getElementById('barKnob');
const tCur=document.getElementById('tCur');
const tDur=document.getElementById('tDur');
const playIcon=document.getElementById('playIcon');
const qlist=document.getElementById('qlist');

function buildQueue(){
  qlist.innerHTML='';
  tracks.forEach((tr,i)=>{
    const row=document.createElement('div');
    row.className='q-row'+(i===idx?' on':'');
    row.innerHTML=`<div class="q-no">${i===idx&&playing?'▮':i+1}</div>
      <div class="q-info"><div class="q-t">${tr.t}</div><div class="q-a">${tr.a}</div></div>
      <div class="q-d">${fmt(tr.d)}</div>`;
    row.addEventListener('click',e=>{
      if(e.target.closest('[data-drag]'))return;
      idx=i;cur=0;playing=true;refresh();
    });
    qlist.appendChild(row);
  });
}
function refresh(){
  const tr=tracks[idx];
  npTitle.textContent=tr.t;
  npArtist.textContent=tr.a;
  tDur.textContent=fmt(tr.d);
  playIcon.innerHTML=playing
    ?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'    /* pause */
    :'<path d="M8 5v14l11-7z"/>';                /* play */
  buildQueue();
  tick();
}
function tick(){
  const tr=tracks[idx];
  const p=Math.min(1,cur/tr.d);
  barFill.style.width=(p*100).toFixed(2)+'%';
  barKnob.style.left=(p*100).toFixed(2)+'%';
  tCur.textContent=fmt(cur);
}
document.getElementById('play').addEventListener('click',()=>{playing=!playing;refresh();});
document.getElementById('next').addEventListener('click',()=>{idx=(idx+1)%tracks.length;cur=0;refresh();});
document.getElementById('prev').addEventListener('click',()=>{
  if(cur>3){cur=0;tick();return;} idx=(idx-1+tracks.length)%tracks.length;cur=0;refresh();
});
/* scrub by clicking the bar */
document.querySelector('.bar').addEventListener('click',e=>{
  const r=e.currentTarget.getBoundingClientRect();
  cur=Math.max(0,Math.min(tracks[idx].d,( (e.clientX-r.left)/r.width)*tracks[idx].d));
  tick();
});

/* equalizer bars */
const vis=document.getElementById('vis');
const BARS=22;
for(let i=0;i<BARS;i++){const i2=document.createElement('i');vis.appendChild(i2);}
const visEls=[...vis.children];
let phase=0;
function animateVis(dt){
  phase+=dt;
  visEls.forEach((el,i)=>{
    let h;
    if(playing){
      h=(Math.sin(phase*5 + i*0.7)*0.5+0.5)*0.55
        +(Math.sin(phase*11 + i*1.9)*0.5+0.5)*0.35+0.1;
    }else h=0.10+0.02*Math.sin(i);
    el.style.height=(h*100).toFixed(1)+'%';
  });
}

/* progress + visualizer clock */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(playing){
    cur+=dt;
    if(cur>=tracks[idx].d){idx=(idx+1)%tracks.length;cur=0;refresh();}
    tick();
  }
  animateVis(dt);
}
buildQueue();refresh();requestAnimationFrame(loop);
})();
</script>
