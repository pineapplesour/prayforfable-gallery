<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>빗방울 파문 · 글래스 채팅</title>
<style>
  :root{
    --glass-bg: rgba(20,28,34,0.30);
    --glass-bg-2: rgba(14,20,26,0.42);
    --glass-line: rgba(255,255,255,0.22);
    --glass-hi: rgba(255,255,255,0.32);
    --text: #f3f7f8;
    --muted: rgba(225,238,240,0.62);
    --accent: #7fd8c8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:#05080a;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans KR","Yu Gothic",Segoe UI,sans-serif;
    color:var(--text);}
  /* ----- ambient natural base (canvas) ----- */
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;z-index:0;}
  /* color/atmosphere grade over the pond */
  #grade{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(120% 90% at 28% 18%, rgba(120,200,190,0.10), transparent 55%),
      radial-gradient(130% 100% at 80% 100%, rgba(8,14,20,0.55), transparent 60%);
    mix-blend-mode:soft-light;}
  #vig{position:fixed;inset:0;z-index:1;pointer-events:none;
    box-shadow:inset 0 0 220px 40px rgba(0,0,0,0.55);}

  /* ----- floating glass layer ----- */
  #stage{position:fixed;inset:0;z-index:3;}
  .glass{
    position:absolute;
    background:var(--glass-bg);
    border:1px solid var(--glass-line);
    border-radius:26px;
    box-shadow:
      0 30px 70px rgba(0,0,0,0.45),
      0 4px 14px rgba(0,0,0,0.30),
      inset 0 1px 0 var(--glass-hi),
      inset 0 0 0 1px rgba(255,255,255,0.04);
    backdrop-filter: blur(16px) saturate(1.45) brightness(1.04);
    -webkit-backdrop-filter: blur(16px) saturate(1.45) brightness(1.04);
    will-change: transform;
    overflow:hidden;
  }
  /* liquid sheen sweeping highlight on the glass surface */
  .glass::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(135deg,
      rgba(255,255,255,0.16) 0%,
      rgba(255,255,255,0.02) 26%,
      transparent 52%,
      rgba(255,255,255,0.05) 100%);
    mix-blend-mode:screen;
  }
  .grip{cursor:grab;}
  .grip:active{cursor:grabbing;}

  /* ---- chat panel ---- */
  #chat{ left:8vw; top:50%; width:min(86vw,360px);
    transform:translateY(-50%); display:flex; flex-direction:column; }
  .chat-head{display:flex;align-items:center;gap:11px;padding:16px 18px 13px;
    border-bottom:1px solid rgba(255,255,255,0.10);}
  .ava{width:38px;height:38px;border-radius:50%;flex:0 0 auto;
    background:radial-gradient(circle at 32% 28%, #9bf0dd, #2f9b8a 60%, #14564d);
    box-shadow:0 2px 8px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.45);
    position:relative;}
  .ava::after{content:"";position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;
    border-radius:50%;background:#56e0a0;border:2px solid rgba(14,20,26,0.7);}
  .who{flex:1;min-width:0;}
  .who b{display:block;font-size:15px;font-weight:700;letter-spacing:.2px;}
  .who span{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;}
  .drops-led{font-size:11px;color:var(--accent);letter-spacing:.12em;
    background:rgba(127,216,200,0.10);border:1px solid rgba(127,216,200,0.25);
    padding:3px 9px;border-radius:999px;white-space:nowrap;}

  .chat-body{padding:15px 16px 6px;display:flex;flex-direction:column;gap:11px;
    max-height:46vh;overflow-y:auto;scrollbar-width:thin;}
  .chat-body::-webkit-scrollbar{width:6px;}
  .chat-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.18);border-radius:99px;}
  .msg{max-width:80%;font-size:13.5px;line-height:1.5;padding:9px 13px;border-radius:16px;
    opacity:0;transform:translateY(8px);animation:rise .55s ease forwards;}
  .msg.them{align-self:flex-start;background:rgba(255,255,255,0.09);
    border:1px solid rgba(255,255,255,0.12);border-bottom-left-radius:5px;}
  .msg.me{align-self:flex-end;color:#06231f;font-weight:600;
    background:linear-gradient(135deg,#9bf0dd,#62cdbb);
    box-shadow:0 4px 12px rgba(98,205,187,0.30);border-bottom-right-radius:5px;}
  .msg .t{display:block;font-size:10px;opacity:.55;margin-top:4px;font-weight:400;}
  .msg.me .t{color:#06231f;}
  @keyframes rise{to{opacity:1;transform:none;}}

  .typing{align-self:flex-start;display:flex;gap:4px;align-items:center;
    padding:11px 14px;border-radius:16px;border-bottom-left-radius:5px;
    background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.12);}
  .typing i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.6);
    animation:blink 1.1s infinite;}
  .typing i:nth-child(2){animation-delay:.18s;}
  .typing i:nth-child(3){animation-delay:.36s;}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}

  .chat-foot{padding:12px 14px 14px;border-top:1px solid rgba(255,255,255,0.10);}
  .composer{display:flex;align-items:center;gap:9px;
    background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.22);
    border-radius:999px;padding:0 6px 0 15px;height:44px;}
  .composer input{flex:1;min-width:0;background:transparent;border:0;outline:none;
    color:var(--text);font-size:14px;font-family:inherit;}
  .composer input::placeholder{color:rgba(225,238,240,0.5);}
  .send{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;
    background:linear-gradient(135deg,#9bf0dd,#56c2b0);color:#06231f;
    display:grid;place-items:center;transition:transform .12s ease;}
  .send:hover{transform:scale(1.07);}
  .send:active{transform:scale(.92);}

  /* ---- small status widget (top-right) ---- */
  #pond{ right:7vw; top:11vh; width:min(70vw,230px); padding:16px 18px; }
  #pond .ttl{font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;}
  #pond .big{font-size:30px;font-weight:800;margin:6px 0 2px;letter-spacing:.5px;}
  #pond .big small{font-size:13px;font-weight:600;color:var(--muted);}
  #pond .sub{font-size:12px;color:var(--muted);}
  .bars{display:flex;gap:5px;align-items:flex-end;height:34px;margin-top:13px;}
  .bars b{flex:1;border-radius:4px 4px 2px 2px;
    background:linear-gradient(180deg,#9bf0dd,rgba(98,205,187,0.25));
    animation:eq 1.6s ease-in-out infinite;transform-origin:bottom;}
  @keyframes eq{0%,100%{transform:scaleY(.32);}50%{transform:scaleY(1);}}

  /* hint */
  #hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:4;
    color:rgba(255,255,255,.72);font-size:12px;letter-spacing:.14em;white-space:nowrap;
    background:rgba(10,18,22,.40);padding:8px 18px;border-radius:99px;
    border:1px solid rgba(255,255,255,0.10);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    pointer-events:none;transition:opacity 1.4s;}

  @media (max-width:560px){
    #chat{left:50%;top:46%;transform:translate(-50%,-50%);width:88vw;}
    #pond{right:6vw;left:auto;top:5vh;width:54vw;}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="grade"></div>
<div id="vig"></div>

<div id="stage">
  <!-- status glass widget -->
  <section class="glass grip" id="pond">
    <div class="ttl">RAIN POND</div>
    <div class="big" id="dropCount">0<small> 파문</small></div>
    <div class="sub">잔잔한 빗속, 코이 한 마리</div>
    <div class="bars" id="bars"></div>
  </section>

  <!-- chat glass widget -->
  <section class="glass" id="chat">
    <header class="chat-head grip">
      <div class="ava"></div>
      <div class="who"><b>코이</b><span>물결 너머에서 · 온라인</span></div>
      <div class="drops-led">빗속</div>
    </header>
    <div class="chat-body" id="body"></div>
    <footer class="chat-foot">
      <form class="composer" id="composer">
        <input id="entry" type="text" placeholder="빗방울처럼 한 줄…" autocomplete="off">
        <button class="send" type="submit" aria-label="보내기">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M4 12L20 4L14 20L11 13L4 12Z" fill="currentColor"/>
          </svg>
        </button>
      </form>
    </footer>
  </section>
</div>

<div id="hint">수면을 클릭 ─ 파문이 인다 · 패널은 드래그</div>

<script>
'use strict';
/* =====================================================================
   BASE: ambient rain-pond water (frangollo lineage — webgl2 height-field
   ripple sim with refraction/caustics). Variation: continuous rain drops
   + one slow drifting koi. Graceful 2D fallback if no WebGL2.
===================================================================== */
(()=>{
const TAU=Math.PI*2;
const canvas=document.getElementById('gl');
const hint=document.getElementById('hint');
const dropCountEl=document.getElementById('dropCount');
let totalDrops=0;
function bumpDrops(n){ totalDrops+=n; dropCountEl.firstChild.nodeValue=totalDrops.toLocaleString(); }

const gl=canvas.getContext('webgl2',{antialias:false,alpha:false});

/* ---------- 2D fallback (no webgl2) ---------- */
function fallback2D(){
  const ctx=canvas.getContext('2d');
  let W,H,ripples=[],koiX=0,koiY=0,koiA=0;
  function rs(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;koiX=W*0.6;koiY=H*0.5;}
  rs();addEventListener('resize',rs);
  canvas.addEventListener('pointerdown',e=>{ripples.push({x:e.clientX,y:e.clientY,r:0,a:1});bumpDrops(1);hint.style.opacity=0;});
  function loop(t){
    requestAnimationFrame(loop);
    const g=ctx.createRadialGradient(W*0.5,H*0.42,0,W*0.5,H*0.5,Math.max(W,H)*0.8);
    g.addColorStop(0,'#1c3b3a');g.addColorStop(.6,'#12302f');g.addColorStop(1,'#0a1c1d');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    if(Math.random()<0.08)ripples.push({x:Math.random()*W,y:Math.random()*H,r:0,a:.7,thin:1});
    for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.r+=r.thin?1.4:2.4;r.a-=0.012;
      if(r.a<=0){ripples.splice(i,1);continue;}
      ctx.strokeStyle='rgba(180,235,225,'+r.a*0.5+')';ctx.lineWidth=r.thin?1:2;
      ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke();}
    koiA+=Math.sin(t/900)*0.004;koiX+=Math.cos(koiA)*0.6;koiY+=Math.sin(koiA)*0.6;
    if(koiX<60||koiX>W-60)koiA=Math.PI-koiA;if(koiY<60||koiY>H-60)koiA=-koiA;
    ctx.save();ctx.translate(koiX,koiY);ctx.rotate(koiA);
    ctx.fillStyle='rgba(255,140,40,0.85)';ctx.beginPath();ctx.ellipse(0,0,34,12,0,0,TAU);ctx.fill();
    ctx.beginPath();ctx.moveTo(-30,0);ctx.lineTo(-50,-12);ctx.lineTo(-50,12);ctx.fill();ctx.restore();
  }
  requestAnimationFrame(loop);
}
if(!gl){ fallback2D(); /* still wire chat below */ setupChat(); return; }

gl.getExtension('EXT_color_buffer_float');
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);

const VERT=`#version 300 es
layout(location=0) in vec2 aPos; out vec2 vUv;
void main(){vUv=aPos*0.5+0.5;gl_Position=vec4(aPos,0.,1.);}`;

/* height-field propagation + drops */
const SIM_FRAG=`#version 300 es
precision highp float;
uniform sampler2D uPrev; uniform vec2 uTexel;
uniform vec4 uDrops[12]; uniform int uCount;
in vec2 vUv; out vec4 o;
void main(){
  vec2 c=texture(uPrev,vUv).rg;
  float sum=
    texture(uPrev,vUv+vec2(uTexel.x,0.)).r+
    texture(uPrev,vUv-vec2(uTexel.x,0.)).r+
    texture(uPrev,vUv+vec2(0.,uTexel.y)).r+
    texture(uPrev,vUv-vec2(0.,uTexel.y)).r;
  float nh=(sum*0.5-c.g)*0.9915;
  vec2 px=vUv/uTexel;
  for(int i=0;i<12;i++){
    if(i>=uCount)break;
    vec4 d=uDrops[i];
    float dist=distance(px,d.xy);
    if(dist<d.z) nh+=d.w*(cos(dist/d.z*3.14159)*0.5+0.5);
  }
  vec2 e=min(vUv,1.0-vUv);
  float edge=smoothstep(0.0,0.05,min(e.x,e.y));
  nh*=mix(0.85,1.0,edge);
  o=vec4(nh,c.r,0.,1.);
}`;

/* render: refract the painted pond bottom + koi through the height field */
const RENDER_FRAG=`#version 300 es
precision highp float;
uniform sampler2D uH; uniform sampler2D uBottom; uniform sampler2D uFish;
uniform vec2 uTexel; uniform float uT;
in vec2 vUv; out vec4 o;
void main(){
  vec2 d=uTexel*1.5;
  float h =texture(uH,vUv).r;
  float hL=texture(uH,vUv-vec2(d.x,0.)).r;
  float hR=texture(uH,vUv+vec2(d.x,0.)).r;
  float hB=texture(uH,vUv-vec2(0.,d.y)).r;
  float hT=texture(uH,vUv+vec2(0.,d.y)).r;
  vec3 n=normalize(vec3((hL-hR)*6.0,(hB-hT)*6.0,1.0));
  /* faint perpetual micro-chop so the surface is never dead still */
  n.xy+=0.0024*vec2(
    sin(vUv.x*120.0+uT*1.1)+sin(vUv.y*84.0-uT*0.6),
    cos(vUv.x*70.0-uT*0.8)+cos(vUv.y*132.0+uT*1.3));
  n=normalize(n);
  vec2 off=n.xy*0.040;
  vec3 bottom=texture(uBottom,vUv+off).rgb;
  float lap=(hL+hR+hB+hT-4.0*h);
  float caust=min(max(-lap,0.0)*88.0,0.7);
  bottom+=vec3(0.78,0.96,0.92)*caust*0.55;
  bottom*=1.0-min(max(lap,0.0)*68.0,0.30);
  float sh=texture(uFish,vUv+off+vec2(0.012,-0.016)).a;
  bottom*=1.0-sh*0.30;
  vec3 water=vec3(0.07,0.26,0.27);
  vec3 col=mix(bottom,water,0.30);
  vec4 fish=texture(uFish,vUv+off*0.45);
  vec3 fcol=mix(fish.rgb,water,0.10);
  col=mix(col,fcol,fish.a);
  vec3 L=normalize(vec3(-0.30,0.45,0.84));
  float spec=pow(max(dot(reflect(vec3(0.,0.,-1.),n),L),0.0),140.0);
  col+=vec3(0.85,0.98,0.95)*spec*0.9;
  float vg=smoothstep(0.98,0.30,length(vUv-0.5));
  col*=mix(0.55,1.0,vg);
  o=vec4(col,1.0);
}`;

function compile(t,s){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));return sh;}
function program(v,f){const p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,v));
  gl.attachShader(p,compile(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;}
const simProg=program(VERT,SIM_FRAG), renProg=program(VERT,RENDER_FRAG);
const su={prev:gl.getUniformLocation(simProg,'uPrev'),texel:gl.getUniformLocation(simProg,'uTexel'),
  drops:gl.getUniformLocation(simProg,'uDrops[0]'),count:gl.getUniformLocation(simProg,'uCount')};
const ru={h:gl.getUniformLocation(renProg,'uH'),bottom:gl.getUniformLocation(renProg,'uBottom'),
  fish:gl.getUniformLocation(renProg,'uFish'),texel:gl.getUniformLocation(renProg,'uTexel'),
  t:gl.getUniformLocation(renProg,'uT')};

const quad=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,quad);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

let cssW=0,cssH=0,dpr=1,fishScale=1;
let simW=0,simH=0,texA=null,texB=null,fboA=null,fboB=null;
const bCan=document.createElement('canvas'),bctx=bCan.getContext('2d');
const fCan=document.createElement('canvas'),fctx=fCan.getContext('2d');
const bottomTex=gl.createTexture(),fishTex=gl.createTexture();
let fishTexW=0,fishTexH=0;

function texParams(){gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);}
function makeTarget(w,h){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);texParams();
  const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);return [t,f];}
function createSim(){
  if(texA){gl.deleteTexture(texA);gl.deleteTexture(texB);gl.deleteFramebuffer(fboA);gl.deleteFramebuffer(fboB);}
  const scale=Math.min(0.5,768/Math.max(cssW,cssH));
  simW=Math.max(64,Math.round(cssW*scale));simH=Math.max(64,Math.round(cssH*scale));
  [texA,fboA]=makeTarget(simW,simH);[texB,fboB]=makeTarget(simW,simH);}
function uploadBottom(){gl.bindTexture(gl.TEXTURE_2D,bottomTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,bCan);texParams();}
function uploadFish(){gl.bindTexture(gl.TEXTURE_2D,fishTex);
  if(fishTexW!==fCan.width||fishTexH!==fCan.height){
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,fCan);texParams();
    fishTexW=fCan.width;fishTexH=fCan.height;
  }else gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,gl.RGBA,gl.UNSIGNED_BYTE,fCan);}

/* ---- pond bottom: dusky greenish water with subtle pebbles/silt ---- */
function paintBottom(){
  const c=bctx,w=cssW,h=cssH;
  c.setTransform(fishScale,0,0,fishScale,0,0);
  const g=c.createRadialGradient(w*0.5,h*0.40,0,w*0.5,h*0.5,Math.max(w,h)*0.78);
  g.addColorStop(0,'#3a5a52');g.addColorStop(0.55,'#27433e');g.addColorStop(1,'#152a28');
  c.fillStyle=g;c.fillRect(0,0,w,h);
  for(let i=0;i<10;i++){const x=Math.random()*w,y=Math.random()*h,r=90+Math.random()*200;
    const ag=c.createRadialGradient(x,y,0,x,y,r);
    ag.addColorStop(0,'rgba(20,40,32,0.30)');ag.addColorStop(1,'rgba(20,40,32,0)');
    c.fillStyle=ag;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}
  for(let i=0;i<2600;i++){const x=Math.random()*w,y=Math.random()*h,r=Math.random()*1.6+0.4;
    c.fillStyle=Math.random()<0.5?'rgba(210,240,225,'+(Math.random()*0.07).toFixed(3)+')'
      :'rgba(10,20,16,'+(Math.random()*0.13).toFixed(3)+')';
    c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}
  const np=Math.max(10,Math.round(w*h/70000));
  for(let i=0;i<np;i++)drawPebble(c,Math.random()*w,Math.random()*h,14+Math.random()*42,Math.random()*TAU);
}
function drawPebble(c,x,y,r,rot){c.save();c.translate(x,y);c.rotate(rot);
  const ry=r*(0.6+Math.random()*0.3);
  c.fillStyle='rgba(0,0,0,0.28)';c.beginPath();c.ellipse(r*0.12,ry*0.2,r*1.02,ry*1.02,0,0,TAU);c.fill();
  const hue=120+Math.random()*40,sat=8+Math.random()*12,li=24+Math.random()*20;
  const g=c.createRadialGradient(-r*0.35,-ry*0.4,r*0.08,0,0,r*1.15);
  g.addColorStop(0,'hsl('+hue+','+sat+'%,'+(li+15)+'%)');
  g.addColorStop(0.7,'hsl('+hue+','+sat+'%,'+li+'%)');
  g.addColorStop(1,'hsl('+hue+','+(sat+5)+'%,'+(li-12)+'%)');
  c.fillStyle=g;c.beginPath();c.ellipse(0,0,r,ry,0,0,TAU);c.fill();c.restore();}

/* ---- single slow koi (variation: just one, calm) ---- */
function makeKoi(){return{x:cssW*0.62,y:cssH*0.46,a:Math.random()*TAU,len:120,
  phase:0,speed:24,spT:24,turn:0,changeT:2,wakeT:0.2,speedN:0.25,po:Math.random()*TAU};}
let koi=null;
const drops=[];
function addDrop(x,y,r,s){drops.push({x,y,r,s});if(drops.length>40)drops.shift();}
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;};

function updateKoi(f,dt){
  f.changeT-=dt;
  if(f.changeT<=0){f.spT=16+Math.random()*26;if(Math.random()<0.15)f.spT=60+Math.random()*30;
    f.changeT=3+Math.random()*4;}
  f.turn+=(Math.random()-0.5)*2.6*dt;f.turn*=Math.exp(-dt*1.3);
  let ta=f.a+f.turn;const m=95;
  if(f.x<m||f.y<m||f.x>cssW-m||f.y>cssH-m)ta=Math.atan2(cssH*0.5-f.y,cssW*0.5-f.x);
  const da=angDiff(ta,f.a),mt=1.0*dt;
  f.a+=Math.max(-mt,Math.min(mt,da));
  f.speed+=(f.spT-f.speed)*Math.min(1,dt*1.6);
  f.x+=Math.cos(f.a)*f.speed*dt;f.y+=Math.sin(f.a)*f.speed*dt;
  f.x=Math.max(24,Math.min(cssW-24,f.x));f.y=Math.max(24,Math.min(cssH-24,f.y));
  f.speedN=Math.min(1,f.speed/110);f.phase+=dt*(3.2+f.speed*0.07)*2.3;
  f.wakeT-=dt;
  if(f.wakeT<=0&&f.speed>22){addDrop(f.x+Math.cos(f.a)*f.len*0.42,f.y+Math.sin(f.a)*f.len*0.42,
    6+f.speedN*8,0.05+0.14*f.speedN);f.wakeT=0.12+Math.random()*0.08;}
}
function bodyOutline(pts,wf){const top=[],bot=[];
  for(let i=0;i<pts.length;i++){const p=pts[i];const pa=pts[Math.max(0,i-1)],pb=pts[Math.min(pts.length-1,i+1)];
    let dx=pb.x-pa.x,dy=pb.y-pa.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;const w=wf(p.s);
    top.push({x:p.x-dy*w,y:p.y+dx*w});bot.push({x:p.x+dy*w,y:p.y-dx*w});}return{top,bot};}
function tailLobe(c,len,spread,sw){const ty=spread+sw;c.beginPath();c.moveTo(0,0);
  c.bezierCurveTo(len*0.32,spread*0.06+sw*0.2,len*0.72,ty*0.6,len,ty);
  c.bezierCurveTo(len*0.78,ty*0.98,len*0.30,spread*0.55+sw*0.25,0,0);c.closePath();c.fill();}
function finShape(c,x,y,ang,len,flip){c.save();c.translate(x,y);c.rotate(ang);if(flip)c.scale(1,-1);
  c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(len*0.55,-len*0.10,len,len*0.22);
  c.quadraticCurveTo(len*0.45,len*0.34,0,0);c.closePath();c.fill();c.restore();}
function drawKoi(c,f){
  const L=f.len;c.save();c.translate(f.x,f.y);c.rotate(f.a);
  const segs=16,pts=[],amp=L*(0.05+0.06*f.speedN);
  for(let i=0;i<=segs;i++){const s=i/segs;
    pts.push({x:L*0.48-s*L*0.96,y:Math.sin(f.phase-s*4.4)*amp*Math.pow(s,1.5),s});}
  const wmax=L*0.16;
  const wf=s=>wmax*Math.pow(Math.sin(Math.PI*Math.min(0.10+s*0.90,1)),0.85)*(1-0.58*s)+L*0.018;
  const tp=pts[segs],tq=pts[segs-1],tang=Math.atan2(tp.y-tq.y,tp.x-tq.x);
  c.save();c.translate(tp.x,tp.y);c.rotate(tang);
  const tl=L*0.66,sw=Math.sin(f.phase-5.2)*tl*0.30;
  const tg=c.createRadialGradient(0,0,tl*0.06,0,0,tl);
  tg.addColorStop(0,'rgba(255,150,60,0.85)');tg.addColorStop(0.55,'rgba(255,150,60,0.5)');tg.addColorStop(1,'rgba(255,150,60,0)');
  c.fillStyle=tg;
  tailLobe(c,tl,tl*0.52,sw);tailLobe(c,tl,-tl*0.52,sw*0.85);
  tailLobe(c,tl*0.72,tl*0.16,sw*0.7);tailLobe(c,tl*0.72,-tl*0.16,sw*0.6);c.restore();
  const pp=pts[5],wp=wf(pts[5].s),fl=Math.sin(f.phase*1.2+f.po)*0.22;
  c.fillStyle='rgba(255,150,60,0.55)';
  finShape(c,pp.x,pp.y+wp*0.85,2.3+fl,L*0.24,false);finShape(c,pp.x,pp.y-wp*0.85,-2.3-fl,L*0.24,true);
  const o=bodyOutline(pts,wf);
  const path=()=>{c.beginPath();c.moveTo(o.top[0].x,o.top[0].y);
    for(let i=1;i<o.top.length;i++)c.lineTo(o.top[i].x,o.top[i].y);
    for(let i=o.bot.length-1;i>=0;i--)c.lineTo(o.bot[i].x,o.bot[i].y);
    c.quadraticCurveTo(pts[0].x+L*0.16,pts[0].y,o.top[0].x,o.top[0].y);c.closePath();};
  const bg=c.createRadialGradient(L*0.12,0,L*0.05,L*0.05,0,L*0.62);
  bg.addColorStop(0,'#ffd9a0');bg.addColorStop(0.55,'#ff8a26');bg.addColorStop(1,'#cf4708');
  path();c.fillStyle=bg;c.fill();
  /* kohaku patch */
  c.save();path();c.clip();
  c.fillStyle='rgba(245,235,220,0.92)';
  c.beginPath();c.ellipse(L*0.16,0,L*0.16,L*0.10,0,0,TAU);c.fill();
  c.beginPath();c.ellipse(-L*0.12,wmax*0.2,L*0.10,L*0.08,0,0,TAU);c.fill();c.restore();
  c.save();path();c.clip();
  const hg=c.createRadialGradient(L*0.15,0,0,L*0.10,0,L*0.5);
  hg.addColorStop(0,'rgba(255,255,255,0.30)');hg.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=hg;c.beginPath();c.ellipse(L*0.10,0,L*0.45,wmax*0.55,0,0,TAU);c.fill();c.restore();
  path();c.strokeStyle='rgba(40,15,0,0.18)';c.lineWidth=1;c.stroke();
  const ep=pts[1],ew=wf(pts[1].s);c.fillStyle='#19120a';
  c.beginPath();c.arc(ep.x,ep.y+ew*0.72,L*0.026,0,TAU);c.fill();
  c.beginPath();c.arc(ep.x,ep.y-ew*0.72,L*0.026,0,TAU);c.fill();c.restore();
}
function drawFishCanvas(t){fctx.setTransform(fishScale,0,0,fishScale,0,0);
  fctx.clearRect(0,0,cssW,cssH);if(koi)drawKoi(fctx,koi);}

const dropArr=new Float32Array(48);
function simulate(){
  gl.useProgram(simProg);gl.viewport(0,0,simW,simH);
  gl.uniform2f(su.texel,1/simW,1/simH);
  for(let step=0;step<2;step++){
    let n=0;
    if(step===0){n=Math.min(drops.length,12);
      for(let j=0;j<n;j++){const d=drops[j];
        dropArr[j*4]=d.x/cssW*simW;dropArr[j*4+1]=(1-d.y/cssH)*simH;
        dropArr[j*4+2]=Math.max(2,d.r*simW/cssW);dropArr[j*4+3]=d.s;}
      drops.splice(0,n);}
    gl.uniform4fv(su.drops,dropArr);gl.uniform1i(su.count,n);
    gl.bindFramebuffer(gl.FRAMEBUFFER,fboB);gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,texA);gl.uniform1i(su.prev,0);
    gl.drawArrays(gl.TRIANGLES,0,3);
    let tt=texA;texA=texB;texB=tt;tt=fboA;fboA=fboB;fboB=tt;}
}
function render(t){
  gl.useProgram(renProg);gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texA);gl.uniform1i(ru.h,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,bottomTex);gl.uniform1i(ru.bottom,1);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,fishTex);gl.uniform1i(ru.fish,2);
  gl.uniform2f(ru.texel,1/simW,1/simH);gl.uniform1f(ru.t,t);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
function resize(){
  cssW=innerWidth;cssH=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(cssW*dpr);canvas.height=Math.round(cssH*dpr);
  fishScale=Math.min(dpr,1.5);fCan.width=Math.round(cssW*fishScale);fCan.height=Math.round(cssH*fishScale);
  fishTexW=0;bCan.width=fCan.width;bCan.height=fCan.height;
  paintBottom();uploadBottom();createSim();
  if(koi){koi.x=Math.max(40,Math.min(cssW-40,koi.x));koi.y=Math.max(40,Math.min(cssH-40,koi.y));}
}
addEventListener('resize',resize);
canvas.addEventListener('pointerdown',e=>{addDrop(e.clientX,e.clientY,18,1.3);bumpDrops(1);hint.style.opacity=0;});
let lmx=-1,lmy=-1;
canvas.addEventListener('pointermove',e=>{
  if(lmx<0){lmx=e.clientX;lmy=e.clientY;return;}
  const d=Math.hypot(e.clientX-lmx,e.clientY-lmy);
  if(d>26){addDrop(e.clientX,e.clientY,7,0.06);lmx=e.clientX;lmy=e.clientY;}});

resize();koi=makeKoi();
for(let i=0;i<5;i++)addDrop(Math.random()*cssW,Math.random()*cssH,14,0.6);
setTimeout(()=>{hint.style.opacity=0;},8000);

/* rain cadence: frequent gentle drops + occasional fatter splash */
let rainT=0.25,last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const t=ts/1000,dt=Math.min(0.05,Math.max(0.001,t-last));last=t;
  rainT-=dt;
  if(rainT<=0){
    const fat=Math.random()<0.22;
    addDrop(Math.random()*cssW,Math.random()*cssH,fat?16:8,fat?0.7:0.34);
    bumpDrops(1);
    rainT=fat?(0.5+Math.random()*0.7):(0.18+Math.random()*0.28);
  }
  updateKoi(koi,dt);drawFishCanvas(t);uploadFish();simulate();render(t);
}
requestAnimationFrame(frame);
setupChat();
})();

/* =====================================================================
   GLASS LAYER: draggable panels, mouse parallax, scripted ambient chat.
===================================================================== */
function setupChat(){
  const stage=document.getElementById('stage');
  const body=document.getElementById('body');
  const composer=document.getElementById('composer');
  const entry=document.getElementById('entry');

  /* equalizer bars */
  const bars=document.getElementById('bars');
  for(let i=0;i<9;i++){const b=document.createElement('b');
    b.style.animationDelay=(i*0.12)+'s';
    b.style.animationDuration=(1.2+Math.random()*0.9)+'s';bars.appendChild(b);}

  function now(){const d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
  function add(text,who){
    const m=document.createElement('div');m.className='msg '+who;
    m.innerHTML=text+'<span class="t">'+now()+'</span>';
    body.appendChild(m);body.scrollTop=body.scrollHeight;return m;}
  function typing(){const w=document.createElement('div');w.className='typing';
    w.innerHTML='<i></i><i></i><i></i>';body.appendChild(w);body.scrollTop=body.scrollHeight;return w;}

  const script=[
    {who:'them',t:'비 와요. 수면 보면 파문이 겹쳐요.'},
    {who:'them',t:'클릭하면 거기서도 동그라미가 퍼져요 🌧️'},
    {who:'me',t:'유리창 너머로 물결이 흐려 보이네.'},
    {who:'them',t:'그게 backdrop-filter예요. 진짜로 아래를 굴절시켜요.'},
    {who:'them',t:'패널을 끌어보세요 — 물결 위를 떠다녀요.'}
  ];
  let i=0;
  function step(){
    if(i>=script.length)return;
    const s=script[i++];
    if(s.who==='them'){const tp=typing();
      setTimeout(()=>{tp.remove();add(s.t,'them');setTimeout(step,700+Math.random()*600);},900+Math.random()*700);
    }else{add(s.t,'me');setTimeout(step,700+Math.random()*500);}
  }
  setTimeout(step,900);

  const replies=['물결처럼 닿았어요 ✨','파문 하나 더 보냈어요.','빗방울이 대답을 적셔요.','수면이 잠깐 반짝였어요.','잔잔히, 잘 도착했어요.'];
  composer.addEventListener('submit',e=>{
    e.preventDefault();const v=entry.value.trim();if(!v)return;
    add(v.replace(/</g,'&lt;'),'me');entry.value='';
    const tp=typing();
    setTimeout(()=>{tp.remove();add(replies[Math.floor(Math.random()*replies.length)],'them');},
      800+Math.random()*700);
  });

  /* ---- mouse parallax of the whole glass stage ---- */
  let baseX=0,baseY=0,curX=0,curY=0;
  addEventListener('mousemove',e=>{
    baseX=(e.clientX/innerWidth-0.5)*18;
    baseY=(e.clientY/innerHeight-0.5)*14;
  });
  (function px(){requestAnimationFrame(px);
    curX+=(baseX-curX)*0.06;curY+=(baseY-curY)*0.06;
    stage.style.transform='translate('+curX.toFixed(2)+'px,'+curY.toFixed(2)+'px)';
  })();

  /* ---- drag panels by their .grip handles ---- */
  document.querySelectorAll('.glass').forEach(panel=>{
    const grip=panel.querySelector('.grip')||panel;
    let dragging=false,sx=0,sy=0,ox=0,oy=0;
    // capture starting geometry once, switch to left/top positioning
    function pin(){const r=panel.getBoundingClientRect();
      panel.style.left=r.left+'px';panel.style.top=r.top+'px';
      panel.style.right='auto';panel.style.bottom='auto';panel.style.transform='none';}
    grip.addEventListener('pointerdown',e=>{
      if(e.target.closest('input,button,.composer'))return;
      dragging=true;pin();
      const r=panel.getBoundingClientRect();ox=r.left;oy=r.top;sx=e.clientX;sy=e.clientY;
      panel.style.zIndex=10;grip.setPointerCapture(e.pointerId);
    });
    grip.addEventListener('pointermove',e=>{
      if(!dragging)return;
      let nx=ox+(e.clientX-sx),ny=oy+(e.clientY-sy);
      nx=Math.max(4,Math.min(innerWidth-panel.offsetWidth-4,nx));
      ny=Math.max(4,Math.min(innerHeight-panel.offsetHeight-4,ny));
      panel.style.left=nx+'px';panel.style.top=ny+'px';
    });
    grip.addEventListener('pointerup',e=>{dragging=false;});
    grip.addEventListener('pointercancel',()=>{dragging=false;});
  });
}
</script>
