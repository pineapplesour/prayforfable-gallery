<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>STYLE:ON — AI Stylist Work OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root{
  --ink:#0a0908;
  --ink2:#14110f;
  --paper:#f4f0ea;
  --accent:#ff3b30;        /* signature coral-red */
  --accent2:#ff6a52;
  --accent-soft:rgba(255,59,48,.14);
  --line:rgba(244,240,234,.12);
  --muted:rgba(244,240,234,.52);
  --muted2:rgba(244,240,234,.34);
  --font:"Pretendard","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --display:"Archivo Black","Pretendard",sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease2:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--font);
  background:var(--ink);
  color:var(--paper);
  overflow:hidden;
  position:fixed;inset:0;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
/* particle / grain background */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 120% at 50% 8%,transparent 40%,rgba(0,0,0,.55) 100%);
  mix-blend-mode:multiply;}
.grain{position:fixed;inset:-50%;z-index:2;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  animation:grain 7s steps(6) infinite;}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-6%,4%)}40%{transform:translate(4%,-5%)}60%{transform:translate(-3%,3%)}80%{transform:translate(5%,2%)}100%{transform:translate(0,0)}}

/* deck */
#deck{position:relative;z-index:3;width:100%;height:100%;}
.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;justify-content:center;
  padding:clamp(28px,5vw,96px);
  opacity:0;visibility:hidden;
  transform:translateY(34px) scale(.985);
  transition:opacity .62s var(--ease2),transform .72s var(--ease2),visibility .62s;
  will-change:transform,opacity;
}
.slide.active{opacity:1;visibility:visible;transform:none;}
.slide.prev{transform:translateY(-34px) scale(.985);}
.slide-inner{width:100%;max-width:1320px;margin:0 auto;}

/* corner meta frame */
.frame{position:fixed;z-index:6;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted2);pointer-events:none;font-weight:600;}
.frame.tl{top:26px;left:30px;}
.frame.tr{top:26px;right:30px;text-align:right;}
.frame.bl{bottom:26px;left:30px;}
.frame .br-tick{color:var(--accent);}
.frame.tl::before,.frame.tr::after{content:"";display:block;width:30px;height:1px;background:var(--line);margin:7px 0;}
.frame.tr::after{margin-left:auto;}

/* shared type */
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:clamp(11px,1vw,13px);
  letter-spacing:.32em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px;}
.kicker::before{content:"";width:34px;height:2px;background:var(--accent);display:inline-block;}
.kicker .no{color:var(--muted2);letter-spacing:.2em;}
h1.head{font-family:var(--display);font-weight:900;line-height:.94;letter-spacing:-.02em;
  font-size:clamp(34px,5.6vw,76px);margin-bottom:18px;}
h2.head{font-weight:800;line-height:1.06;letter-spacing:-.025em;
  font-size:clamp(28px,4.2vw,58px);margin-bottom:16px;}
.sub{font-size:clamp(15px,1.4vw,20px);color:var(--muted);max-width:62ch;line-height:1.55;font-weight:500;}
.accent{color:var(--accent);}
.up{text-transform:uppercase;}

/* ===== Slide 1 — cover kinetic typo ===== */
#s1{justify-content:center;}
.cover-grid{display:grid;grid-template-columns:1.25fr .9fr;gap:48px;align-items:center;width:100%;max-width:1320px;margin:0 auto;}
.cover-left{position:relative;}
.cover-eyebrow{font-size:13px;letter-spacing:.36em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:26px;}
.cover-eyebrow b{color:var(--accent);}
#kinetic{font-family:var(--display);font-weight:900;line-height:.86;letter-spacing:-.03em;
  font-size:clamp(58px,12vw,168px);user-select:none;margin-bottom:26px;}
#kinetic .ltr{display:inline-block;will-change:transform;transition:color .3s;}
#kinetic .colon{color:var(--accent);}
.cover-line{font-size:clamp(16px,1.7vw,24px);font-weight:700;line-height:1.4;margin-bottom:12px;max-width:30ch;}
.cover-slogan{font-size:clamp(14px,1.3vw,17px);color:var(--muted);line-height:1.55;margin-bottom:30px;max-width:34ch;}
.cover-badges{display:flex;flex-wrap:wrap;gap:10px;}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;
  padding:9px 15px;border:1px solid var(--line);border-radius:100px;color:var(--paper);
  background:rgba(255,255,255,.02);backdrop-filter:blur(6px);}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}

/* phone mock */
.phone{position:relative;width:clamp(220px,20vw,290px);aspect-ratio:9/19;margin:0 auto;
  border-radius:38px;border:1px solid rgba(255,255,255,.14);padding:11px;
  background:linear-gradient(160deg,#1c1815,#0d0b0a);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.06);
  transform:rotateX(6deg) rotateY(-10deg);transform-style:preserve-3d;
  animation:float 6s ease-in-out infinite;}
@keyframes float{0%,100%{transform:rotateX(6deg) rotateY(-10deg) translateY(0)}50%{transform:rotateX(6deg) rotateY(-10deg) translateY(-14px)}}
.phone-screen{width:100%;height:100%;border-radius:28px;background:linear-gradient(180deg,#0e0c0b,#07060500);
  overflow:hidden;position:relative;padding:16px 13px;}
.ps-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.ps-logo{font-family:var(--display);font-size:16px;letter-spacing:-.02em;}
.ps-logo .c{color:var(--accent);}
.ps-dot{width:24px;height:24px;border-radius:7px;background:var(--accent-soft);border:1px solid var(--line);}
.ps-row{display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px;margin-bottom:7px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);opacity:0;transform:translateX(14px);}
.ps-row .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:12px;font-weight:800;color:#fff;}
.ps-row .nm{font-size:11px;font-weight:600;}
.ps-row .ds{font-size:9px;color:var(--muted2);}
.ps-cta{margin-top:8px;text-align:center;font-size:11px;font-weight:700;color:#fff;
  padding:9px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 10px 24px -8px var(--accent);}

/* ===== generic content blocks ===== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease2),transform .6s var(--ease2);}
.slide.active .reveal{opacity:1;transform:none;}

.card{padding:20px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.022);
  position:relative;overflow:hidden;transition:transform .35s var(--ease),border-color .35s,background .35s;}
.card::before{content:"";position:absolute;left:0;top:0;height:100%;width:3px;background:var(--accent);transform:scaleY(0);transform-origin:top;transition:transform .4s var(--ease);}
.card:hover{transform:translateY(-5px);border-color:rgba(255,59,48,.4);background:rgba(255,59,48,.04);}
.card:hover::before{transform:scaleY(1);}
.card .n{font-family:var(--display);font-size:13px;color:var(--accent);margin-bottom:9px;letter-spacing:.04em;}
.card h3{font-size:clamp(15px,1.3vw,18px);font-weight:700;margin-bottom:7px;}
.card p{font-size:13px;color:var(--muted);line-height:1.5;}
.card .ico{font-size:20px;margin-bottom:10px;display:block;}

/* feature 10 grid */
.feat{padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02);
  display:flex;flex-direction:column;gap:6px;transition:.3s var(--ease);position:relative;overflow:hidden;}
.feat:hover{transform:translateY(-4px);background:rgba(255,59,48,.05);border-color:rgba(255,59,48,.35);}
.feat .fn{font-family:var(--display);font-size:11px;color:var(--accent);}
.feat .ft{font-size:14px;font-weight:700;}
.feat .fd{font-size:11px;color:var(--muted2);line-height:1.4;}

/* market stats */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:8px;}
.stat{padding:22px 20px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.022);position:relative;overflow:hidden;}
.stat .big{font-family:var(--display);font-size:clamp(30px,3.6vw,52px);line-height:1;color:var(--accent);letter-spacing:-.02em;}
.stat .unit{font-size:clamp(15px,1.4vw,20px);color:var(--accent2);font-weight:800;}
.stat .lab{font-size:12.5px;color:var(--muted);margin-top:11px;line-height:1.45;font-weight:500;}
.stat .yr{font-size:10px;letter-spacing:.2em;color:var(--muted2);margin-bottom:9px;text-transform:uppercase;font-weight:700;}
.stat .bar{height:4px;border-radius:4px;background:rgba(255,255,255,.07);margin-top:14px;overflow:hidden;}
.stat .bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1.4s var(--ease2);}

/* before-after flow */
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:24px;align-items:center;margin:18px 0;}
.flow-col{padding:22px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.02);}
.flow-col.after{border-color:rgba(255,59,48,.35);background:rgba(255,59,48,.05);}
.flow-col .t{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted2);font-weight:700;margin-bottom:14px;}
.flow-col.after .t{color:var(--accent);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{font-size:13px;font-weight:600;padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);}
.flow-col.after .chip{border-color:rgba(255,59,48,.3);}
.arrow{font-size:30px;color:var(--accent);font-weight:800;}

/* tiers */
.tier{padding:20px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.02);transition:.3s var(--ease);}
.tier.hl{border-color:rgba(255,59,48,.5);background:rgba(255,59,48,.06);}
.tier .tn{font-size:18px;font-weight:800;margin-bottom:4px;}
.tier .tp{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:12px;letter-spacing:.04em;}
.tier .td{font-size:12.5px;color:var(--muted);line-height:1.5;}

/* timeline / roadmap */
.timeline{display:flex;flex-direction:column;gap:0;margin-top:6px;}
.tl-item{display:grid;grid-template-columns:120px 1fr;gap:22px;padding:16px 0;border-top:1px solid var(--line);position:relative;}
.tl-item:last-child{border-bottom:1px solid var(--line);}
.tl-when{font-family:var(--display);font-size:13px;color:var(--accent);letter-spacing:.02em;display:flex;flex-direction:column;gap:3px;}
.tl-when .ph{font-size:10px;color:var(--muted2);letter-spacing:.16em;}
.tl-body h3{font-size:16px;font-weight:700;margin-bottom:5px;}
.tl-body p{font-size:13px;color:var(--muted);line-height:1.45;}

/* arch layers */
.layer{padding:16px 18px;border:1px solid var(--line);border-radius:14px;margin-bottom:11px;background:rgba(255,255,255,.02);transition:.3s var(--ease);}
.layer:hover{border-color:rgba(255,59,48,.32);background:rgba(255,59,48,.04);}
.layer .lh{display:flex;align-items:baseline;gap:12px;margin-bottom:9px;}
.layer .lh .lt{font-size:15px;font-weight:800;}
.layer .lh .ld{font-size:11.5px;color:var(--muted2);}
.layer .pills{display:flex;flex-wrap:wrap;gap:8px;}
.pill{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--paper);}
.layer.fly{border-color:rgba(255,59,48,.4);background:linear-gradient(120deg,rgba(255,59,48,.07),transparent);}
.layer.fly .lt{color:var(--accent);}

/* formula bar */
.formula{margin-top:18px;padding:16px 22px;border:1px dashed rgba(255,59,48,.4);border-radius:14px;
  font-size:clamp(14px,1.4vw,18px);font-weight:700;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  background:rgba(255,59,48,.04);}
.formula .op{color:var(--accent);}
.formula .res{color:var(--accent);font-family:var(--display);}

/* team list */
.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.tm{padding:18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02);transition:.3s var(--ease);}
.tm:hover{transform:translateY(-4px);border-color:rgba(255,59,48,.3);}
.tm .role{font-size:14px;font-weight:800;margin-bottom:6px;}
.tm .school{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.04em;margin-bottom:7px;}
.tm .what{font-size:12px;color:var(--muted);line-height:1.45;}

/* checklist */
.check{display:flex;gap:14px;padding:15px 0;border-top:1px solid var(--line);}
.check:last-child{border-bottom:1px solid var(--line);}
.check .num{font-family:var(--display);font-size:13px;color:var(--accent);min-width:30px;}
.check h3{font-size:15px;font-weight:700;margin-bottom:4px;}
.check p{font-size:12.5px;color:var(--muted);line-height:1.45;}

/* closing */
#s15 .slide-inner{text-align:center;}
.close-head{font-family:var(--display);font-size:clamp(30px,5vw,68px);line-height:1.02;letter-spacing:-.025em;margin-bottom:18px;}
.close-msgs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0;}
.cm{padding:18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02);}
.cm .ct{font-family:var(--display);font-size:13px;color:var(--accent);margin-bottom:7px;}
.cm p{font-size:12.5px;color:var(--muted);line-height:1.4;}
.close-slogan{font-size:clamp(16px,2vw,28px);font-weight:800;margin-top:10px;letter-spacing:-.01em;}
.close-slogan .accent{font-style:italic;}

/* nav UI */
.nav-dots{position:fixed;right:26px;top:50%;transform:translateY(-50%);z-index:8;display:flex;flex-direction:column;gap:11px;}
.nav-dots button{width:9px;height:9px;border-radius:50%;border:1px solid var(--muted2);background:transparent;cursor:pointer;padding:0;transition:.3s var(--ease);}
.nav-dots button.on{background:var(--accent);border-color:var(--accent);transform:scale(1.35);box-shadow:0 0 12px var(--accent);}
.progress{position:fixed;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));z-index:9;width:0;transition:width .5s var(--ease2);box-shadow:0 0 14px var(--accent);}
.pager{position:fixed;bottom:24px;right:30px;z-index:8;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;}
.pager .cur{font-family:var(--display);color:var(--accent);font-size:15px;}
.arrows{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:8;display:flex;gap:10px;}
.arrows button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.03);
  color:var(--paper);cursor:pointer;font-size:16px;display:grid;place-items:center;transition:.3s var(--ease);backdrop-filter:blur(8px);}
.arrows button:hover{border-color:var(--accent);color:var(--accent);background:rgba(255,59,48,.08);}
.hint{position:fixed;bottom:26px;left:30px;z-index:8;font-size:11px;color:var(--muted2);letter-spacing:.1em;font-weight:600;}

/* count-up reveal for bars in stats handled via JS */

/* ===== responsive ===== */
@media(max-width:900px){
  .cover-grid{grid-template-columns:1fr;gap:30px;}
  .cover-right{display:none;}
  .grid2,.grid3,.grid4,.grid5{grid-template-columns:1fr 1fr;}
  .stat-row{grid-template-columns:1fr 1fr;gap:12px;}
  .flow{grid-template-columns:1fr;gap:14px;}
  .arrow{transform:rotate(90deg);text-align:center;justify-self:center;}
  .team-grid{grid-template-columns:1fr 1fr;}
  .close-msgs{grid-template-columns:1fr 1fr;}
  .nav-dots{display:none;}
  .tl-item{grid-template-columns:88px 1fr;gap:14px;}
}
@media(max-width:480px){
  .slide{padding:64px 20px 92px;justify-content:flex-start;overflow-y:auto;}
  #s1{justify-content:center;}
  .grid3,.grid4,.grid5,.grid2{grid-template-columns:1fr;}
  .stat-row{grid-template-columns:1fr 1fr;}
  .team-grid{grid-template-columns:1fr 1fr;}
  .close-msgs{grid-template-columns:1fr 1fr;}
  .frame.tr,.frame.bl{display:none;}
  h1.head{font-size:30px;}
}
@media(max-height:560px) and (min-width:901px){
  .slide{justify-content:flex-start;padding-top:60px;overflow-y:auto;}
}
.no-anim *{animation:none!important;transition:none!important;}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="vignette"></div>
<div class="grain"></div>

<div class="progress" id="progress"></div>
<div class="frame tl">STYLE:ON<br>AI Stylist Work OS</div>
<div class="frame tr">Investor Deck · 2026<br><span class="br-tick">●</span> Pre-Seed / Seed</div>
<div class="frame bl">From Stylist Tool<br>to Industry Infrastructure</div>

<main id="deck"></main>

<div class="nav-dots" id="dots"></div>
<div class="pager"><span class="cur" id="cur">01</span><span>/</span><span id="total">15</span></div>
<div class="arrows">
  <button id="prev" aria-label="이전">←</button>
  <button id="next" aria-label="다음">→</button>
</div>
<div class="hint">← → · SPACE · SCROLL · DOTS</div>

<script>
/* ============ SLIDE CONTENT (built in JS, real numbers locked) ============ */
const slides = [];

/* 1 — COVER */
slides.push(`
<section class="slide" id="s1">
  <div class="cover-grid">
    <div class="cover-left">
      <div class="cover-eyebrow">AI STYLIST <b>WORK OS</b> · INVESTOR DECK</div>
      <div id="kinetic" aria-label="STYLE:ON"></div>
      <div class="cover-line">현직 스타일리스트가 만든 협찬·소싱·피팅·정산 <span class="accent">통합 워크 플랫폼</span></div>
      <div class="cover-slogan">스타일리스트의 일을 더 체계적으로, 현장을 더 스마트하게.</div>
      <div class="cover-badges">
        <span class="badge"><span class="dot"></span>MVP 구축 완료</span>
        <span class="badge"><span class="dot"></span>협업 네트워크 연계</span>
        <span class="badge"><span class="dot"></span>AI 기반 10개 핵심 기능</span>
      </div>
    </div>
    <div class="cover-right">
      <div class="phone">
        <div class="phone-screen">
          <div class="ps-top"><div class="ps-logo">STYLE<span class="c">:</span>ON</div><div class="ps-dot"></div></div>
          <div class="ps-row"><div class="ic">S</div><div><div class="nm">ON Sourcing</div><div class="ds">무드 기반 의상 소싱</div></div></div>

/* ============ MOUNT ============ */
const deck=document.getElementById("deck");
deck.innerHTML=slides.join("");
const slideEls=[...document.querySelectorAll(".slide")];
const TOTAL=slideEls.length;
document.getElementById("total").textContent=TOTAL.toString().padStart(2,"0");

/* dots */
const dotsWrap=document.getElementById("dots");
slideEls.forEach((_,i)=>{const b=document.createElement("button");b.setAttribute("aria-label","슬라이드 "+(i+1));b.onclick=()=>go(i);dotsWrap.appendChild(b);});
const dots=[...dotsWrap.children];

let cur=0,busy=false;
function go(n){
  n=Math.max(0,Math.min(TOTAL-1,n));
  if(n===cur)return;
  const dir=n>cur?1:-1;
  slideEls[cur].classList.remove("active");
  slideEls[cur].classList.toggle("prev",dir>0);
  cur=n;
  slideEls.forEach((s,i)=>{if(i!==cur)s.classList.remove("active");});
  slideEls[cur].classList.add("active");
  slideEls[cur].classList.remove("prev");
  dots.forEach((d,i)=>d.classList.toggle("on",i===cur));
  document.getElementById("cur").textContent=(cur+1).toString().padStart(2,"0");
  document.getElementById("progress").style.width=((cur+1)/TOTAL*100)+"%";
  triggerSlide(slideEls[cur]);
}
function triggerSlide(el){
  // count-up + bars
  el.querySelectorAll("[data-count]").forEach(node=>{
    if(node.dataset.done)return;node.dataset.done="1";
    const target=parseFloat(node.dataset.count);const dec=(node.dataset.count.indexOf(".")>=0)?1:0;
    const dur=1200;const t0=performance.now();
    (function tick(t){const p=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-p,3);
      node.textContent=(target*e).toFixed(dec);if(p<1)requestAnimationFrame(tick);else node.textContent=target.toFixed(dec);})(t0);
  });
  el.querySelectorAll(".bar i[data-w]").forEach(b=>{requestAnimationFrame(()=>{b.style.width=b.dataset.w+"%";});});
  // phone rows stagger (slide 1)
  el.querySelectorAll(".ps-row").forEach((r,i)=>{setTimeout(()=>{r.style.transition="opacity .5s var(--ease2),transform .5s var(--ease2)";r.style.opacity="1";r.style.transform="none";},220+i*110);});
}

/* nav events */
document.getElementById("next").onclick=()=>go(cur+1);
document.getElementById("prev").onclick=()=>go(cur-1);
window.addEventListener("keydown",e=>{
  if(["ArrowRight","ArrowDown"," ","PageDown"].includes(e.key)){e.preventDefault();go(cur+1);}
  else if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==="Home")go(0);else if(e.key==="End")go(TOTAL-1);
});
let wheelLock=false;
window.addEventListener("wheel",e=>{
  if(wheelLock)return;
  // allow inner scroll on small screens
  const sc=slideEls[cur];
  if(sc.scrollHeight>sc.clientHeight){
    const atTop=sc.scrollTop<=0,atBot=sc.scrollTop+sc.clientHeight>=sc.scrollHeight-2;
    if(!(atTop&&e.deltaY<0)&&!(atBot&&e.deltaY>0))return;
  }
  if(Math.abs(e.deltaY)<18)return;
  wheelLock=true;go(cur+(e.deltaY>0?1:-1));setTimeout(()=>wheelLock=false,820);
},{passive:true});
let tsx=0,tsy=0;
window.addEventListener("touchstart",e=>{tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;},{passive:true});
window.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tsx,dy=e.changedTouches[0].clientY-tsy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){go(cur+(dx<0?1:-1));}
  else if(Math.abs(dy)>70&&Math.abs(dy)>Math.abs(dx)){
    const sc=slideEls[cur];if(sc.scrollHeight>sc.clientHeight+8)return;go(cur+(dy<0?1:-1));}
},{passive:true});

/* ============ KINETIC TYPOGRAPHY (cover) ============ */
const kinetic=document.getElementById("kinetic");
const word="STYLE:ON";
const letters=[];
[...word].forEach((ch,i)=>{
  const span=document.createElement("span");
  span.className="ltr"+(ch===":"?" colon":"");
  span.textContent=ch===":"?":":ch;
  // start scattered then settle within 0.8s (no blocking — text is the first paint)
  span.style.transition="transform .8s cubic-bezier(.16,1,.3,1),opacity .8s ease";
  span.style.opacity="0";
  span.style.transform=`translate(${(Math.random()*2-1)*30}px,${(Math.random()*2-1)*44}px) rotate(${(Math.random()*2-1)*8}deg)`;
  kinetic.appendChild(span);
  letters.push({el:span,bx:0,by:0,vx:0,vy:0,ox:0,oy:0});
});
// settle immediately (first paint shows cover; letters converge <=0.8s, no click/key)
requestAnimationFrame(()=>{requestAnimationFrame(()=>{
  letters.forEach((L)=>{L.el.style.opacity="1";L.el.style.transform="none";});
});});

// after settle, hand off to spring physics reacting to pointer
let mouse={x:-9999,y:-9999},springOn=false;
setTimeout(()=>{
  letters.forEach(L=>{L.el.style.transition="none";});
  springOn=true;runSpring();
},860);
function runSpring(){
  if(!springOn)return;
  if(cur===0){
    letters.forEach(L=>{
      const r=L.el.getBoundingClientRect();
      const cx=r.left+r.width/2,cy=r.top+r.height/2;
      const dx=cx-mouse.x,dy=cy-mouse.y;
      const dist=Math.hypot(dx,dy);
      let fx=0,fy=0;
      if(dist<170&&dist>0.1){const force=(170-dist)/170*14;fx=dx/dist*force;fy=dy/dist*force;}
      // spring back to home (0,0 offset)
      L.vx+=(0-L.ox)*0.10+fx*0.4;
      L.vy+=(0-L.oy)*0.10+fy*0.4;
      L.vx*=0.82;L.vy*=0.82;
      L.ox+=L.vx;L.oy+=L.vy;
      const rot=(L.vx*0.4);
      L.el.style.transform=`translate(${L.ox.toFixed(2)}px,${L.oy.toFixed(2)}px) rotate(${rot.toFixed(2)}deg)`;
      L.el.style.color=(dist<150&&L.el.classList.contains("colon")===false)?"":"";
    });
  }
  requestAnimationFrame(runSpring);
}
window.addEventListener("pointermove",e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
window.addEventListener("pointerleave",()=>{mouse.x=-9999;mouse.y=-9999;});

/* ============ PARTICLE BACKGROUND ============ */
const cv=document.getElementById("bg"),cx2=cv.getContext("2d");
let W,H,dpr,parts=[];
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr;
  cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";
  const count=Math.min(70,Math.floor(innerWidth/26));
  parts=Array.from({length:count},()=>({
    x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()*2-1)*0.18*dpr,vy:(Math.random()*2-1)*0.18*dpr,
    r:(Math.random()*1.6+0.4)*dpr,a:Math.random()*0.5+0.1
  }));
}
resize();addEventListener("resize",resize);
let pm={x:-9999,y:-9999};
addEventListener("pointermove",e=>{pm.x=e.clientX*dpr;pm.y=e.clientY*dpr;});
function drawBG(){
  cx2.clearRect(0,0,W,H);
  // connecting lines + drift
  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    // mouse repel
    const dx=p.x-pm.x,dy=p.y-pm.y,d=Math.hypot(dx,dy);
    if(d<120*dpr&&d>0.1){p.x+=dx/d*1.2;p.y+=dy/d*1.2;}
    cx2.beginPath();cx2.arc(p.x,p.y,p.r,0,7);
    cx2.fillStyle="rgba(255,59,48,"+p.a*0.55+")";cx2.fill();
    for(let j=i+1;j<parts.length;j++){
      const q=parts[j],ddx=p.x-q.x,ddy=p.y-q.y,dd=Math.hypot(ddx,ddy);
      if(dd<110*dpr){cx2.beginPath();cx2.moveTo(p.x,p.y);cx2.lineTo(q.x,q.y);
        cx2.strokeStyle="rgba(255,59,48,"+(1-dd/(110*dpr))*0.10+")";cx2.lineWidth=dpr*0.6;cx2.stroke();}
    }
  }
  requestAnimationFrame(drawBG);
}
drawBG();

/* ============ INIT — slide 1 is the first paint, no gate ============ */
slideEls[0].classList.add("active");
dots[0].classList.add("on");
document.getElementById("progress").style.width=(1/TOTAL*100)+"%";
triggerSlide(slideEls[0]);

/* reduced motion */
if(matchMedia("(prefers-reduced-motion:reduce)").matches){document.body.classList.add("no-anim");}
</script>
