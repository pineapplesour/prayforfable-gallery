/* ---------- typed state machine ---------- */
const STATE = {
  language: "ko",
  role: "brand",
  route: "home",
  network: "online",
  ui: { phase: "idle" },            // idle | composing | submitting | queued | running | completed | failed | cancelling
  forecast: { candidate: "cr_amelie", phase: "idle", result: null, jobId: null },
  chat: { activeId: "cv_amelie", phase: "idle", jobId: null, lastActionId: null, extra: {} }, // per-thread extra messages
  menuOpen: false,
};

const ROUTES = ["home","directory","match","forecast","chat","create","payment"];
const NAV = [
  {r:"home", k:"nav.home", icon:"home"},
  {r:"directory", k:"nav.directory", icon:"layout-grid"},
  {r:"match", k:"nav.match", icon:"git-merge"},
  {r:"forecast", k:"nav.forecast", icon:"trending-up"},
  {r:"chat", k:"nav.chat", icon:"message-circle"},
  {r:"create", k:"nav.create", icon:"sparkles"},
  {r:"payment", k:"nav.payment", icon:"shield-check"},
];

/* ---------- i18n helper ---------- */
function t(key){ return (I18N[STATE.language] && I18N[STATE.language][key]) || (I18N.ko[key]) || key; }

/* ---------- COMMAND DISPATCHER (single entry; renderer never calls network) ---------- */
function dispatch(cmd, payload={}) {
  switch(cmd){
    case "BOOT": render(); break;
    case "NAVIGATE":
      if (ROUTES.includes(payload.route)) { STATE.route = payload.route; STATE.menuOpen=false; render(); window.scrollTo({top:0,behavior:"instant"}); }
      break;
    case "CHANGE_LANGUAGE":
      STATE.language = STATE.language === "ko" ? "en" : "ko"; render();
      break;
    case "SET_ROLE":
      if (payload.role==="brand"||payload.role==="creator"){ STATE.role = payload.role; render(); }
      break;
    case "TOGGLE_MENU":
      STATE.menuOpen = !STATE.menuOpen; renderMenu(); break;
    case "SUBMIT_QUESTION": effectChatSubmit(payload); break;     // chat send
    case "CANCEL_JOB": effectChatCancel(payload); break;
    case "RUN_FORECAST": effectForecast(payload); break;
    case "SELECT_CHAT":
      STATE.chat.activeId = payload.id; STATE.chat.phase="idle"; renderRoute(); break;
    case "SELECT_CANDIDATE":
      STATE.forecast.candidate = payload.id; if(STATE.forecast.phase!=="running"){STATE.forecast.phase="idle"; STATE.forecast.result=null;} renderRoute(); break;
    case "ESCROW_ACTION": effectEscrow(payload); break;
    case "TOAST": toast(payload.msg); break;
    default: console.warn("unknown command", cmd);
  }
}

/* ---------- effects (async / mock; the ONLY place state mutates over time) ---------- */
function effectForecast(){
  if (STATE.forecast.phase === "running") return;  // idempotency: ignore while running
  const id = STATE.forecast.candidate;
  STATE.forecast.phase = "queued"; STATE.forecast.jobId = "fc_"+Date.now(); renderRoute();
  setTimeout(()=>{ STATE.forecast.phase="running"; renderRoute(); }, 350);
  setTimeout(()=>{
    const c = findCreator(id);
    const base = (c.er||4)*1.0;
    STATE.forecast.result = {
      roas: (2.6 + base*0.55).toFixed(1),
      reach: c.followers,
      eng: ((c.er||4)*1.18).toFixed(1),
      spend: 1800 + Math.round((c.fit||80)*22),
      confidence: Math.min(96, 70 + Math.round((c.fit||80)/4)),
      scenarios: [
        { name:"Conservative", roas:(2.2+base*0.4).toFixed(1), w:55 },
        { name:"Expected", roas:(2.6+base*0.55).toFixed(1), w:80 },
        { name:"Aggressive", roas:(3.1+base*0.7).toFixed(1), w:96 },
      ],
      factors: [
        { label: STATE.language==="ko"?"오디언스 적합도":"Audience fit", w: Math.min(95,(c.fit||80)) },
        { label: STATE.language==="ko"?"인게이지먼트율":"Engagement rate", w: Math.min(92, (c.er||4)*15) },
        { label: STATE.language==="ko"?"시장 모멘텀":"Market momentum", w: 72 },
        { label: STATE.language==="ko"?"채널 검증":"Channel verification", w: c.platforms? Math.min(90, c.platforms.length*30) : 60 },
      ],
    };
    STATE.forecast.phase = "completed"; renderRoute();
    announce(t("fc.completedNote"));
  }, 1700);
}

function effectChatSubmit(payload){
  const conv = MOCK.conversations.find(c=>c.id===STATE.chat.activeId);
  if(!conv) return;
  const text = (payload.text||"").trim();
  if(!text) return;
  // idempotency: same clientActionId -> ignore; also ignore while a job is active
  if (STATE.chat.phase==="submitting" || STATE.chat.phase==="running") return;
  if (payload.clientActionId && payload.clientActionId===STATE.chat.lastActionId) return;
  STATE.chat.lastActionId = payload.clientActionId;
  const extra = STATE.chat.extra[conv.id] || (STATE.chat.extra[conv.id]=[]);
  const now = new Date(); const ts = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  extra.push({ from:"me", text, t:ts, pending:true });
  STATE.chat.phase="submitting"; STATE.chat.jobId="msg_"+Date.now(); renderRoute(); scrollChat();
  const myJob = STATE.chat.jobId;
  setTimeout(()=>{
    if(STATE.chat.jobId!==myJob) return;   // cancelled
    extra[extra.length-1].pending=false; STATE.chat.phase="running"; renderRoute();
  }, 500);
  setTimeout(()=>{
    if(STATE.chat.jobId!==myJob) return;   // cancelled job must not append a reply
    const c = findCreator(conv.creator);
    const replies = STATE.language==="ko"
      ? ["좋아요, 컨셉 정리해서 공유드릴게요.","확인했어요. 일정 조율해볼게요.","네! 레퍼런스 보내드릴게요."]
      : ["Great, I'll share the concept.","Got it — let me align the schedule.","Sure! Sending references over."];
    extra.push({ from:"them", text: replies[Math.floor(Math.random()*replies.length)], t: ts });
    STATE.chat.phase="completed"; renderRoute(); scrollChat();
  }, 1500);
}
function effectChatCancel(){
  if(STATE.chat.phase==="submitting"||STATE.chat.phase==="running"){
    STATE.chat.phase="cancelled"; STATE.chat.jobId=null; renderRoute();
  }
}
function effectEscrow(payload){
  const p = MOCK.payments.find(x=>x.id===payload.id); if(!p) return;
  if(payload.action==="release"){ p.status="released"; announce(t("pay.released_ok")); toast(t("pay.released_ok")); }
  if(payload.action==="refund"){ p.status="refunded"; announce(t("pay.refunded_ok")); toast(t("pay.refunded_ok")); }
  if(payload.action==="dispute"){ p.status="disputed"; announce(t("pay.disputed_ok")); toast(t("pay.disputed_ok")); }
  renderRoute();
}

/* ---------- announce + toast ---------- */
function announce(msg){ const r=document.getElementById("live-region"); if(r) r.textContent=msg; }
let toastTimer=null;
function toast(msg){
  let el=document.getElementById("toast");
  if(!el){ el=document.createElement("div"); el.id="toast"; el.className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] rounded-2xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white shadow-glow flex items-center gap-2"; document.body.appendChild(el); }
  el.innerHTML = '<span class="grid h-5 w-5 place-items-center rounded-full bg-brand-500"><i data-lucide="check" class="h-3 w-3"></i></span>'+msg;
  el.style.opacity="1"; el.style.transform="translate(-50%,0)";
  if(window.lucide) lucide.createIcons();
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ el.style.opacity="0"; el.style.transform="translate(-50%,12px)"; }, 2400);
}

/* =====================================================================
   RENDERERS (pure: read STATE, write DOM; never start network)
   ===================================================================== */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function render(){
  document.documentElement.lang = STATE.language;
  renderNav();
  renderMenu();
  renderI18nStatic();
  renderRoleButtons();
  document.getElementById("lang-label").textContent = STATE.language.toUpperCase();
  renderRoute();
  if(window.lucide) lucide.createIcons();
}

function renderI18nStatic(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k=el.getAttribute("data-i18n");
    if (I18N[STATE.language] && I18N[STATE.language][k]!=null) el.textContent = I18N[STATE.language][k];
  });
}
function renderRoleButtons(){
  document.querySelectorAll(".role-btn").forEach(b=>{
    const active = b.getAttribute("data-role")===STATE.role;
    b.classList.toggle("bg-white", active); b.classList.toggle("text-brand-700", active); b.classList.toggle("shadow-sm", active);
    b.classList.toggle("text-slate-500", !active);
  });
}
function renderNav(){
  const html = NAV.map(n=>{
    const active = STATE.route===n.r ? "active" : "";
    return `<a href="#/${n.r}" data-action="nav" data-route="${n.r}" class="nav-link ${active} relative px-3 py-2 hover:text-brand-600 transition">${t(n.k)}</a>`;
  }).join("");
  document.getElementById("desktop-nav").innerHTML = html;
}
function renderMenu(){
  const menu=document.getElementById("mobile-menu");
  menu.hidden = !STATE.menuOpen;
  document.getElementById("mobile-nav").innerHTML = NAV.map(n=>{
    const active = STATE.route===n.r ? "text-brand-600 bg-brand-50" : "";
    return `<a href="#/${n.r}" data-action="nav" data-route="${n.r}" class="flex items-center gap-3 rounded-xl px-3 py-2.5 ${active} hover:bg-slate-50"><i data-lucide="${n.icon}" class="h-4 w-4"></i>${t(n.k)}</a>`;
  }).join("");
  if(window.lucide) lucide.createIcons();
}

function renderRoute(){
  const app=document.getElementById("app");
  let html="";
  switch(STATE.route){
    case "home": html=viewHome(); break;
    case "directory": html=viewDirectory(); break;
    case "match": html=viewMatch(); break;
    case "forecast": html=viewForecast(); break;
    case "chat": html=viewChat(); break;
    case "create": html=viewCreate(); break;
    case "payment": html=viewPayment(); break;
  }
  app.innerHTML = html;
  if(window.lucide) lucide.createIcons();
  if(STATE.route==="chat") scrollChat();
}

/* =====================================================================
   EVENT DELEGATION (registered ONCE; no per-render onclick stacking)
   ===================================================================== */
document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.getAttribute("data-action");
  switch(action){
    case "nav": e.preventDefault(); location.hash = "#/"+el.getAttribute("data-route"); break;
    case "toggle-lang": dispatch("CHANGE_LANGUAGE"); break;
    case "set-role": dispatch("SET_ROLE",{role:el.getAttribute("data-role")}); break;
    case "toggle-menu": dispatch("TOGGLE_MENU"); break;
    case "open-creator": location.hash="#/forecast"; setTimeout(()=>dispatch("SELECT_CANDIDATE",{id:el.getAttribute("data-id")}),0); break;
    case "dir-chip": dirSearch = el.getAttribute("data-q")===t("dir.recommended")?"":el.getAttribute("data-q"); renderRoute(); break;
    case "pick-candidate": dispatch("SELECT_CANDIDATE",{id:el.getAttribute("data-id")}); break;
    case "run-forecast": dispatch("RUN_FORECAST"); break;
    case "select-chat": dispatch("SELECT_CHAT",{id:el.getAttribute("data-id")}); break;
    case "cancel-chat": dispatch("CANCEL_JOB"); break;
    case "goto-payment": location.hash="#/payment"; break;
    case "use-id": toast((STATE.language==="ko"?"ID 복사됨: ":"ID copied: ")+el.getAttribute("data-id")); break;
    case "escrow-act": dispatch("ESCROW_ACTION",{id:el.getAttribute("data-id"),action:el.getAttribute("data-act")}); break;
    case "wm-mode": wmMode=el.getAttribute("data-mode"); wmPreview=false; renderRoute(); break;
    case "generate-preview": generatePreview(); break;
    case "apply-one": toast((STATE.language==="ko"?"지원 완료: ":"Applied: ")+el.getAttribute("data-id")); break;
  }
});

document.addEventListener("submit",(e)=>{
  const el=e.target.closest("[data-action]"); if(!el) return;
  const action=el.getAttribute("data-action");
  if(["home-search","dir-search","send-offer","register-campaign","chat-send","create-escrow"].includes(action)) e.preventDefault();
  switch(action){
    case "home-search": location.hash="#/directory"; { const v=el.querySelector("input").value; setTimeout(()=>{dirSearch=v; renderRoute();},0);} break;
    case "dir-search": dirSearch=document.getElementById("dir-input").value; renderRoute(); break;
    case "send-offer": sendOffer(); break;
    case "register-campaign": registerCampaign(); break;
    case "chat-send": {
      const input=document.getElementById("chat-input"); const text=input.value;
      dispatch("SUBMIT_QUESTION",{text, clientActionId:"ca_"+Date.now()});
      input.value="";
    } break;
    case "create-escrow": createEscrowUI(); break;
  }
});

// submit-style flows that touch STATE.ui.phase (simulate brief async)
function withBusy(fn, label){
  STATE.ui.phase="running"; renderRoute();
  setTimeout(()=>{ STATE.ui.phase="completed"; fn&&fn(); renderRoute(); if(label) toast(label); }, 850);
}
function sendOffer(){
  const target=document.getElementById("offer-target").value;
  const msg=document.getElementById("offer-msg").value.trim();
  const amt=Number(document.getElementById("offer-amt").value)||0;
  STATE.ui.phase="submitting"; renderRoute();
  setTimeout(()=>{
    MOCK.offers.unshift({id:"of_"+Date.now().toString(36), target, conv:"cv_new", message:msg||"(no message)", amount:amt, status:"open"});
    STATE.ui.phase="completed"; toast(t("match.sentOk")); announce(t("match.sentOk"));
    location.hash="#/chat";
  }, 850);
}
function registerCampaign(){
  const title=document.getElementById("c-title").value.trim()||"Untitled";
  const min=Number(document.getElementById("c-min").value)||0, max=Number(document.getElementById("c-max").value)||0;
  const reg=document.getElementById("c-reg").value.split(",").map(s=>s.trim()).filter(Boolean);
  const plat=document.getElementById("c-plat").value.split(",").map(s=>s.trim()).filter(Boolean);
  withBusy(()=>{ MOCK.campaigns.unshift({id:"cp_"+Date.now().toString(36),title,regions:reg.length?reg:["Global"],min,max,platforms:plat,status:"open"}); }, t("create.registered"));
}
function generatePreview(){
  if(STATE.ui.phase==="running") return;
  const myId=++wmRenderId; STATE.ui.phase="running"; wmPreview=false; renderRoute();
  setTimeout(()=>{ if(myId!==wmRenderId) return; STATE.ui.phase="completed"; wmPreview=true; renderRoute(); }, 900);
}
function createEscrowUI(){
  const payee=document.getElementById("e-payee").value;
  const amt=Number(document.getElementById("e-amt").value)||0;
  const cur=(document.getElementById("e-cur").value||"USD").toUpperCase();
  withBusy(()=>{ MOCK.payments.unshift({id:"pm_"+Date.now().toString(36),payee,payer:"br_atelier",amount:amt,currency:cur,status:"funded"}); }, t("pay.created"));
}

/* keyboard: Enter in chat handled by form submit; Escape closes menu */
document.addEventListener("keydown",(e)=>{ if(e.key==="Escape" && STATE.menuOpen){ STATE.menuOpen=false; renderMenu(); } });

/* ---------- hash router ---------- */
function syncFromHash(){
  const h=(location.hash||"#/home").replace(/^#\//,"").split("/")[0];
  const route = ROUTES.includes(h)?h:"home";
  if(route!==STATE.route){ STATE.route=route; }
  STATE.menuOpen=false;
  render();
  window.scrollTo({top:0,behavior:"instant"});
}
window.addEventListener("hashchange", syncFromHash);
window.addEventListener("online", ()=>{ STATE.network="online"; });
window.addEventListener("offline", ()=>{ STATE.network="offline"; });

/* ---------- BOOT: home is the first paint, no splash ---------- */
if(!location.hash) location.hash="#/home";
syncFromHash();
</script>
</body>
