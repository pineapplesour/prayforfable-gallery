/* ---------------- mockApi: simulates async jobs (no real fetch) ---- */
const mockApi = {
  runForecast(input, { onStatus, onResult }){
    // honors offline queue + cancellable job, cache hits
    const key = `${input.partnerId}|${input.budget}|${input.days}|${input.platform}`;
    const job = { id: uid("job"), cancelled:false, key };
    const cached = STATE.forecast.cache[key];
    if (cached){
      setTimeout(()=>{ if(!job.cancelled) onResult({ ...cached, cached:true, jobId:job.id }); }, 260);
      onStatus("queued");
      return job;
    }
    onStatus("queued");
    setTimeout(()=>{ if(job.cancelled) return; onStatus("running"); }, 420);
    setTimeout(()=>{
      if (job.cancelled) return;
      const p = PARTNERS.find(x=>x.id===input.partnerId) || PARTNERS[0];
      const base = p.roas/100;
      const budget = Math.max(200, Number(input.budget)||1000);
      const days = Math.max(1, Number(input.days)||14);
      const roas = +(base * (1 + Math.min(days,30)/120) * (0.9 + (p.fit/200))).toFixed(2);
      const revenue = Math.round(budget * roas);
      const reach = Math.round(budget * (parseFloat(p.reach) ? 1 : 1) * (8 + p.er ? parseFloat(p.er)*4 : 30));
      const reachNum = Math.round(budget * (12 + parseFloat(p.er)*6) * (days/14));
      const conv = Math.round(reachNum * (parseFloat(p.er)/100) * 0.22);
      const cpa = conv ? Math.round(budget / conv) : 0;
      const conf = Math.min(96, 62 + Math.round(p.fit/4) + (days>=14?6:0));
      const result = {
        jobId: job.id, cached:false, roas, revenue, reach:reachNum, conv, cpa, conf,
        breakdown: p.platforms.map((pl,i)=>({ name:pl, pct: i===0?64:36 }))
      };
      STATE.forecast.cache[key] = result;
      onResult(result);
    }, 1700);
    return job;
  }
};

/* ====================================================================
   COMMAND DISPATCH  (event -> command -> reducer -> effects -> render)
   The renderer never starts jobs; effects never patch DOM directly.
==================================================================== */
function dispatch(cmd, payload={}){
  switch(cmd){
    case "BOOT":
      STATE.ui.phase = "idle";
      STATE.route = parseRoute();
      break;
    case "NAVIGATE":
      STATE.route = payload.route;
      STATE.ui.menuOpen = false;
      if (location.hash !== "#/"+payload.route) location.hash = "#/"+payload.route;
      break;
    case "CHANGE_LANGUAGE":
      STATE.language = STATE.language === "ko" ? "en" : "ko";
      localStorage.setItem("buylow.lang", STATE.language);
      document.documentElement.lang = STATE.language;
      break;
    case "SET_ROLE":
      STATE.role = payload.role;
      localStorage.setItem("buylow.role", STATE.role);
      break;
    case "TOGGLE_MENU":
      STATE.ui.menuOpen = !STATE.ui.menuOpen;
      break;
    case "SELECT_CHAT":
      STATE.data.activeChatId = payload.chatId;
      break;
    case "CREATE_CHAT": {
      const id = uid("conv");
      const partner = PARTNERS[Math.floor(Math.random()*PARTNERS.length)];
      STATE.data.chats[id] = { id, partnerId:partner.id, messages:[] };
      STATE.data.activeChatId = id;
      break;
    }
    case "SUBMIT_MESSAGE": {
      // idempotent: ignore if same clientActionId already produced a message
      const chat = STATE.data.chats[STATE.data.activeChatId];
      if (!chat || !payload.text.trim()) break;
      if (chat.messages.some(m => m.clientActionId === payload.clientActionId)) break;
      const at = new Date().toLocaleTimeString(STATE.language, {hour:"2-digit",minute:"2-digit"});
      chat.messages.push({ id:uid("m"), from:"me", text:payload.text.trim(), at,
        clientActionId:payload.clientActionId, status: STATE.network==="online"?"sent":"queued",
        nuance: payload.nuance || null });
      // simulated partner auto-reply only when online
      if (STATE.network === "online"){
        const jobId = uid("job");
        chat._pendingReply = jobId;
        setTimeout(()=>{
          const c = STATE.data.chats[chat.id];
          if (!c || c._pendingReply !== jobId) return; // ownership guard
          c._pendingReply = null;
          c.messages.push({ id:uid("m"), from:"them", jobId,
            text: STATE.language==="ko" ? "좋아요, 확인하고 컨셉 정리해서 회신드릴게요." : "Sounds good — I'll review and send the concept.",
            at: new Date().toLocaleTimeString(STATE.language,{hour:"2-digit",minute:"2-digit"}) });
          render();
        }, 1200);
      }
      break;
    }
    case "TRANSLATE_DRAFT": {
      // attaches a nuance note to the composer (UI flow only)
      STATE.ui.draftNuance = STATE.language==="ko"
        ? "원문 톤: 친근 → 비즈니스 정중체로 다듬을 수 있어요."
        : "Tone: casual → can be refined to polite business.";
      break;
    }
    case "SEND_OFFER": {
      const t = payload;
      const convId = uid("conv");
      STATE.data.chats[convId] = { id:convId, partnerId:t.targetId, messages:[
        { id:uid("m"), from:"me", text:t.message, at:"방금" }
      ]};
      STATE.data.offers.unshift({ id:uid("of"), targetId:t.targetId, message:t.message, amount:t.amount, status:"open", convId });
      STATE.data.activeChatId = convId;
      showToast("toast.offer","toast.offerBody");
      break;
    }
    case "CREATE_CAMPAIGN":
      STATE.data.campaigns.unshift({ id:uid("cmp"), title:payload.title, regions:payload.regions,
        bmin:payload.bmin, bmax:payload.bmax, platforms:payload.platforms, status:"open" });
      showToast("toast.campaign","toast.campaignBody");
      break;
    case "APPLY_CAMPAIGN":
      showToast("toast.offer","toast.offerBody");
      break;
    case "GENERATE_PREVIEW":
      STATE.ui.previewReady = payload.mode;
      showToast("toast.preview","toast.previewBody");
      break;
    case "CREATE_ESCROW":
      STATE.data.payments.unshift({ id:uid("pay"), payeeId:payload.payeeId, amount:payload.amount,
        currency:payload.currency, status:"funded", milestone: STATE.language==="ko"?"신규 마일스톤":"New milestone",
        events:[{t: STATE.language==="ko"?"예치 완료":"Funded", at: STATE.language==="ko"?"방금":"just now"}] });
      showToast("toast.escrow","toast.escrowBody");
      break;
    case "ESCROW_ACTION": {
      const pay = STATE.data.payments.find(p=>p.id===payload.id);
      if (!pay) break;
      const map = { release:"released", refund:"refunded", dispute:"disputed" };
      pay.status = map[payload.action];
      const label = STATE.language==="ko"
        ? ({release:"릴리즈 완료", refund:"환불 처리", dispute:"분쟁 접수"})[payload.action]
        : ({release:"Released", refund:"Refunded", dispute:"Disputed"})[payload.action];
      pay.events = (pay.events||[]).concat([{t:label, at: STATE.language==="ko"?"방금":"just now"}]);
      break;
    }
    case "FORECAST_RUN": {
      if (STATE.forecast.phase === "running" || STATE.forecast.phase === "queued") break;
      STATE.forecast.result = null;
      STATE.forecast.phase = "queued";
      STATE.forecast.input = payload;
      STATE.forecast.job = mockApi.runForecast(payload, {
        onStatus: (s)=>{ STATE.forecast.phase = s; render(); },
        onResult: (r)=>{ STATE.forecast.phase = "completed"; STATE.forecast.result = r; render(); }
      });
      break;
    }
    case "FORECAST_CANCEL":
      if (STATE.forecast.job) STATE.forecast.job.cancelled = true;
      STATE.forecast.phase = "idle"; STATE.forecast.job = null;
      break;
    case "NETWORK_TOGGLE":
      STATE.network = STATE.network === "online" ? "offline" : "online";
      break;
    case "OPEN_PARTNER":
      openPartnerDrawer(payload.id);
      return; // drawer manages its own DOM
    case "CLOSE_DRAWER":
      $("#drawer").hidden = true; return;
    case "CLOSE_TOAST":
      $("#toast").hidden = true; return;
  }
  render();
}

/* ---------------- routing ---------------- */
function parseRoute(){
  const h = (location.hash || "").replace(/^#\//,"");
  const r = h.split("?")[0];
  return NAV.some(n=>n.route===r) ? r : "home";
}
window.addEventListener("hashchange", ()=>{
  const r = parseRoute();
  if (r !== STATE.route){ STATE.route = r; STATE.ui.menuOpen=false; render(); }
});

/* ---------------- toast helper ---------------- */
let toastTimer;
function showToast(titleKey, bodyKey){
  $("#toastTitle").textContent = T(titleKey);
  $("#toastBody").textContent = T(bodyKey);
  $("#toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ $("#toast").hidden = true; }, 3600);
}

/* ====================================================================
   RENDER (pure: reads STATE, writes DOM; never starts jobs)
==================================================================== */
const VIEWS = {}; // route -> function returning HTML string

function render(){
  document.documentElement.setAttribute("data-state", STATE.ui.phase);
  renderShell();
  const view = VIEWS[STATE.route] || VIEWS.home;
  const app = $("#app");
  app.innerHTML = view();
  applyI18n(app);
  // run any per-view hook
  if (typeof view.after === "function") view.after();
  window.lucide && lucide.createIcons();
  // restore focus target for chat
  if (STATE.route === "chat") scrollChatToBottom();
}

function applyI18n(root){
  $$("[data-i18n]", root).forEach(el => { el.textContent = T(el.getAttribute("data-i18n")); });
  $$("[data-i18n-ph]", root).forEach(el => { el.setAttribute("placeholder", T(el.getAttribute("data-i18n-ph"))); });
}

function pill(text, cls="bg-brand-50 text-brand-700"){
  return `<span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold ${cls}">${esc(text)}</span>`;

function statusPill(status){
  const map = {
    funded:"bg-brand-50 text-brand-700", in_review:"bg-amber-50 text-amber-700",
    released:"bg-emerald-50 text-emerald-700", refunded:"bg-slate-100 text-slate-600",
    disputed:"bg-rose-50 text-rose-700", open:"bg-blue-50 text-blue-700", pending:"bg-slate-100 text-slate-500"
  };
  return pill(T("status."+status), map[status]||"bg-slate-100 text-slate-600");
}
function sectionHead(eyebrow, title, body){
  return `<div class="mb-1 space-y-1">

    ${body?`<p class="max-w-2xl text-sm leading-relaxed text-slate-500">${esc(body)}</p>`:""}

}
function partnerById(id){ return PARTNERS.find(p=>p.id===id) || PARTNERS[0]; }

        <div><label class="block text-xs font-bold text-slate-500">${T("fc.days")}</label><input name="days" type="number" value="${esc(fcForm.days)}" class="mt-1.5 w-full rounded-2xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-brand-400 focus:ring-4 focus:ring-brand-100" /></div>

      <label class="mt-4 block text-xs font-bold text-slate-500">${T("fc.platform")}</label>
      <select name="platform" class="mt-1.5 w-full rounded-2xl border border-slate-200 bg-white px-3 py-2.5 text-sm outline-none focus:border-brand-400 focus:ring-4 focus:ring-brand-100">${plats}</select>
      ${busy?`

        </div>`:`
        <button type="submit" class="mt-5 flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-brand-600 to-indigo-600 py-3 text-sm font-bold text-white shadow-lg shadow-brand-500/30 transition hover:-translate-y-0.5">
          <i data-lucide="trending-up" class="h-4 w-4"></i>${T("fc.run")}
        </button>`}
    </form>

    <!-- result -->
    <div class="rounded-3xl border border-slate-100 bg-white p-6 shadow-card lg:col-span-3">
      <div class="flex items-center justify-between"><h3 class="text-lg font-extrabold">${T("fc.resultTitle")}</h3>${r&&r.cached?pill(T("fc.cached"),"bg-emerald-50 text-emerald-700"):""}</div>
      ${r?`
        <div class="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-3">

          <div class="rounded-2xl bg-slate-50 p-4"><p class="text-2xl font-extrabold">${(r.reach/1000).toFixed(0)}k</p><p class="text-xs text-slate-400">${T("fc.reach")}</p></div>
          <div class="rounded-2xl bg-slate-50 p-4"><p class="text-2xl font-extrabold">${r.conv.toLocaleString()}</p><p class="text-xs text-slate-400">${T("fc.conv")}</p></div>
          <div class="rounded-2xl bg-slate-50 p-4"><p class="text-2xl font-extrabold">${fmt$(r.cpa)}</p><p class="text-xs text-slate-400">${T("fc.cpa")}</p></div>
          <div class="rounded-2xl bg-slate-50 p-4"><p class="text-2xl font-extrabold text-emerald-600">${fmt$(r.revenue)}</p><p class="text-xs text-slate-400">Est. revenue</p></div>

        <div class="mt-2 space-y-2">
          ${r.breakdown.map(b=>`
            <div><div class="flex justify-between text-xs font-semibold text-slate-500"><span>${b.name}</span><span>${b.pct}%</span></div>

        </div>`}
    </div>
  </div>`;
};

/* ==================== VIEW: CHAT ==================== */
VIEWS.chat = function(){

  const activeP = active ? partnerById(active.partnerId) : null;

  <div class="grid h-[calc(100vh-13rem)] min-h-[520px] gap-4 lg:grid-cols-[320px_1fr]">

    <aside class="flex flex-col overflow-hidden rounded-3xl border border-slate-100 bg-white shadow-card ${active?'hidden lg:flex':'flex'}">

      </div>
      <div class="no-scrollbar flex-1 overflow-y-auto p-2">
        ${chatIds.map(id=>{const c=STATE.data.chats[id];const p=partnerById(c.partnerId);const last=c.messages[c.messages.length-1];const sel=id===STATE.data.activeChatId;return `

    <!-- thread -->
    <section class="flex flex-col overflow-hidden rounded-3xl border border-slate-100 bg-white shadow-card ${active?'flex':'hidden lg:flex'}">
      ${active?`
        <div class="flex items-center gap-3 border-b border-slate-100 p-4">
          <button data-action="back-list" class="grid h-9 w-9 place-items-center rounded-full text-slate-500 hover:bg-slate-100 lg:hidden"><i data-lucide="arrow-left" class="h-5 w-5"></i></button>
          <span class="relative h-10 w-10 overflow-hidden rounded-2xl">${avatar(activeP.id,activeP.name)}</span>
          <div class="min-w-0 flex-1"><p class="truncate text-sm font-extrabold">${esc(activeP.name)}</p><p class="text-xs text-emerald-600">● ${T("chat.online")}</p></div>
          ${pill(activeP.fit+"% fit","bg-emerald-50 text-emerald-700")}

        <div class="flex items-center justify-between gap-2 border-b border-slate-100 bg-brand-50/50 px-4 py-2.5">
          <span class="flex items-center gap-2 text-xs font-bold text-brand-700"><i data-lucide="shield-check" class="h-4 w-4"></i>${esc(activeEscrow.milestone)} · ${fmt$(activeEscrow.amount)}</span>
          <div class="flex items-center gap-2">${statusPill(activeEscrow.status)}
            <button data-action="escrow-release" data-id="${activeEscrow.id}" class="rounded-lg bg-emerald-600 px-2.5 py-1 text-xs font-bold text-white hover:bg-emerald-700">${T("chat.escrowRelease")}</button></div>
        </div>`:`
        <div class="flex items-center justify-between gap-2 border-b border-slate-100 px-4 py-2.5">
          <span class="flex items-center gap-2 text-xs font-semibold text-slate-400"><i data-lucide="shield" class="h-4 w-4"></i>${T("chat.escrow")}</span>
          <button data-action="escrow-create" data-id="${activeP.id}" class="rounded-lg border border-brand-200 px-2.5 py-1 text-xs font-bold text-brand-700 hover:bg-brand-50">${T("chat.escrowCreate")}</button>
        </div>`}

        <div id="chatThread" class="no-scrollbar flex-1 space-y-3 overflow-y-auto p-4">
          ${active.messages.map(m=>m.from==="me"?`
            <div class="flex flex-col items-end">
              <p class="max-w-[80%] rounded-2xl rounded-br-md bg-gradient-to-r from-brand-600 to-indigo-600 px-3.5 py-2.5 text-sm text-white">${esc(m.text)}</p>

            </div>`:`
            <div class="flex flex-col items-start">
              <p class="max-w-[80%] rounded-2xl rounded-bl-md bg-slate-100 px-3.5 py-2.5 text-sm text-slate-700">${esc(m.text)}</p>

        <form data-action="submit-message" class="border-t border-slate-100 p-3">
          ${STATE.ui.draftNuance?`<div class="mb-2 flex items-center gap-2 rounded-xl bg-brand-50 px-3 py-1.5 text-xs text-brand-700"><i data-lucide="wand-2" class="h-3.5 w-3.5"></i>${esc(STATE.ui.draftNuance)}</div>`:""}

            <input id="chatInput" name="text" autocomplete="off" data-i18n-ph="chat.placeholder" class="min-w-0 flex-1 rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm outline-none focus:border-brand-400 focus:ring-4 focus:ring-brand-100" />
            <button type="submit" class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 text-white shadow-lg shadow-brand-500/30 transition hover:-translate-y-0.5"><i data-lucide="send" class="h-5 w-5"></i></button>
          </div>
        </form>`
      :`<div class="grid flex-1 place-items-center text-center text-slate-400"><div><i data-lucide="message-circle" class="mx-auto h-10 w-10 text-slate-300"></i><p class="mt-2 text-sm">${T("chat.empty")}</p></div></div>`}
    </section>
  </div>`;
};

      ${previewReady?`
        <div class="mt-4 overflow-hidden rounded-2xl border border-slate-100">
          ${previewReady==='image'?`
            <div class="relative aspect-[16/9] bg-gradient-to-br from-slate-900 to-brand-700">

            </div>`:`
            <div class="relative bg-slate-50 p-4">
              <p class="text-sm leading-relaxed text-slate-600">${STATE.language==='ko'?'크리에이터 검토용 런칭 프리뷰 노트.':'Launch preview notes for creator review only.'}</p>
              <span class="absolute right-3 top-3 rotate-6 rounded-lg border border-brand-200 px-2 py-1 text-[10px] font-bold text-brand-400/70">BUYLOW PREVIEW</span>
            </div>`}

    </form>
  </div>

  <!-- public campaigns -->
  <section class="mt-6 rounded-3xl border border-slate-100 bg-white p-6 shadow-card">
    <h3 class="text-lg font-extrabold">${T("create.public")}</h3>
    <div class="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
      ${campaigns.map(c=>`
        <div class="rounded-2xl border border-slate-100 p-4">
          <div class="flex items-center justify-between">${statusPill(c.status)}<span class="text-xs text-slate-400">${c.platforms.join(" · ")}</span></div>
          <p class="mt-2 text-sm font-bold">${esc(c.title)}</p>
          <p class="mt-1 text-xs text-slate-400">${c.regions.join(", ")}</p>
          <p class="mt-2 text-sm font-extrabold text-brand-600">${fmt$(c.bmin)} – ${fmt$(c.bmax)}</p>
        </div>`).join("")}
    </div>
  </section>`;
};

/* ==================== VIEW: PAYMENT (Escrow) ==================== */
VIEWS.payment = function(){
  const payments = STATE.data.payments;
  const held = payments.filter(p=>p.status==="funded"||p.status==="in_review").reduce((a,p)=>a+p.amount,0);

  const payeeOpts = PARTNERS.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.country}</option>`).join("");
  const milestones = [
    { t: STATE.language==='ko'?'계약 체결 · 착수금':'Contract · deposit', pct:30, done:true },
    { t: STATE.language==='ko'?'산출물 1차 제출':'First deliverable', pct:40, done:true },
    { t: STATE.language==='ko'?'최종 검수 · 릴리즈':'Final review · release', pct:30, done:false }
  ];
  return `
  <div class="rounded-[2rem] border border-slate-100 bg-white p-6 shadow-card sm:p-8">
    ${sectionHead(T("pay.eyebrow"), T("pay.title"), T("pay.body"))}
    <div class="mt-5 grid grid-cols-3 gap-3">
      <div class="rounded-2xl bg-gradient-to-br from-brand-600 to-indigo-600 p-4 text-white"><p class="text-2xl font-extrabold">${fmt$(held)}</p><p class="text-xs opacity-80">${T("pay.held")}</p></div>
      <div class="rounded-2xl bg-slate-50 p-4"><p class="text-2xl font-extrabold text-emerald-600">${fmt$(released)}</p><p class="text-xs text-slate-400">${T("pay.released")}</p></div>
      <div class="rounded-2xl bg-slate-50 p-4"><p class="text-2xl font-extrabold">${fmt$(volume)}</p><p class="text-xs text-slate-400">${T("pay.volume")}</p></div>
    </div>
  </div>

  <div class="mt-6 grid gap-6 lg:grid-cols-5">
    <!-- create escrow + milestone -->
    <div class="space-y-6 lg:col-span-2">
      <form data-action="submit-escrow" class="rounded-3xl border border-slate-100 bg-white p-6 shadow-card">
        <h3 class="text-lg font-extrabold">${T("pay.create")}</h3>
        <label class="mt-4 block text-xs font-bold text-slate-500">${T("pay.payee")}</label>
        <select name="payee" class="mt-1.5 w-full rounded-2xl border border-slate-200 bg-white px-3 py-2.5 text-sm outline-none focus:border-brand-400 focus:ring-4 focus:ring-brand-100">${payeeOpts}</select>
        <div class="mt-4 grid grid-cols-2 gap-3">
          <div><label class="block text-xs font-bold text-slate-500">${T("pay.amount")}</label><input name="amount" type="number" value="1200" class="mt-1.5 w-full rounded-2xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-brand-400 focus:ring-4 focus:ring-brand-100" /></div>
          <div><label class="block text-xs font-bold text-slate-500">${T("pay.currency")}</label>
            <select name="currency" class="mt-1.5 w-full rounded-2xl border border-slate-200 bg-white px-3 py-2.5 text-sm outline-none focus:border-brand-400 focus:ring-4 focus:ring-brand-100"><option>USD</option><option>EUR</option><option>KRW</option></select></div>
        </div>
        <button type="submit" class="mt-5 flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-brand-600 to-indigo-600 py-3 text-sm font-bold text-white shadow-lg shadow-brand-500/30 transition hover:-translate-y-0.5"><i data-lucide="shield-check" class="h-4 w-4"></i>${T("pay.fund")}</button>
      </form>

      <div class="rounded-3xl border border-slate-100 bg-white p-6 shadow-card">
        <h3 class="text-lg font-extrabold">${T("pay.schedule")}</h3>
        <div class="mt-4 space-y-3">
          ${milestones.map((m,i)=>`
            <div class="flex items-center gap-3">
              <span class="grid h-8 w-8 shrink-0 place-items-center rounded-full text-xs font-bold ${m.done?'bg-emerald-100 text-emerald-600':'bg-slate-100 text-slate-400'}">${m.done?'✓':i+1}</span>
              <div class="flex-1"><p class="text-sm font-semibold ${m.done?'':'text-slate-400'}">${m.t}</p>
                <div class="mt-1 h-1.5 overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full ${m.done?'bg-emerald-500':'bg-slate-300'}" style="width:${m.done?100:0}%"></div></div></div>
              <span class="text-xs font-bold text-slate-500">${m.pct}%</span>
            </div>`).join("")}
        </div>
      </div>
    </div>

    <!-- escrow deals -->
    <div class="rounded-3xl border border-slate-100 bg-white p-6 shadow-card lg:col-span-3">
      <h3 class="text-lg font-extrabold">${T("pay.list")}</h3>
      <div class="mt-4 space-y-3">
        ${payments.map(p=>{const pt=partnerById(p.payeeId);const acting=p.status==="funded"||p.status==="in_review";return `
          <div class="rounded-2xl border border-slate-100 p-4">
            <div class="flex items-center gap-3">
              <span class="h-11 w-11 shrink-0 overflow-hidden rounded-2xl">${avatar(pt.id,pt.name)}</span>
              <div class="min-w-0 flex-1"><p class="truncate text-sm font-bold">${esc(pt.name)}</p><p class="truncate text-xs text-slate-400">${esc(p.milestone)} · ${pt.country}</p></div>
              <div class="shrink-0 text-right"><p class="text-base font-extrabold">${p.currency} ${p.amount.toLocaleString()}</p>${statusPill(p.status)}</div>
            </div>
            <details class="mt-3 group">
              <summary class="flex cursor-pointer list-none items-center gap-1 text-xs font-bold text-brand-600">${T("pay.timeline")} <i data-lucide="chevron-down" class="h-3.5 w-3.5 transition group-open:rotate-180"></i></summary>
              <div class="mt-2 space-y-1.5 border-l-2 border-slate-100 pl-3">

              </div>
            </details>
            ${acting?`
            <div class="mt-3 flex flex-wrap gap-2">
              <button data-action="escrow-action" data-id="${p.id}" data-act="release" class="rounded-xl bg-emerald-600 px-3 py-1.5 text-xs font-bold text-white hover:bg-emerald-700">${T("pay.release")}</button>
              <button data-action="escrow-action" data-id="${p.id}" data-act="refund" class="rounded-xl border border-slate-200 px-3 py-1.5 text-xs font-bold text-slate-600 hover:bg-slate-50">${T("pay.refund")}</button>
              <button data-action="escrow-action" data-id="${p.id}" data-act="dispute" class="rounded-xl border border-rose-200 px-3 py-1.5 text-xs font-bold text-rose-600 hover:bg-rose-50">${T("pay.dispute")}</button>
            </div>`:''}
          </div>`;}).join("")}
      </div>
    </div>
  </div>`;
};

/* ====================================================================
   EVENT DELEGATION  (registered ONCE — re-render never stacks listeners)
==================================================================== */
document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.getAttribute("data-action");
  switch(action){
    case "nav": {
      e.preventDefault();
      dispatch("NAVIGATE", { route: el.getAttribute("data-route") });
      // chained intent: open partner forecast prefill
      if (el.getAttribute("data-action-extra")==="forecast-partner"){
        fcForm.partner = el.getAttribute("data-id"); $("#drawer").hidden=true; render();
      }
      break;
    }
    case "toggle-lang": dispatch("CHANGE_LANGUAGE"); break;
    case "toggle-menu": dispatch("TOGGLE_MENU"); break;
    case "set-role": dispatch("SET_ROLE", { role: el.getAttribute("data-role") }); break;
    case "open-partner": dispatch("OPEN_PARTNER", { id: el.getAttribute("data-id") }); break;
    case "close-drawer": dispatch("CLOSE_DRAWER"); break;
    case "close-toast": dispatch("CLOSE_TOAST"); break;
    case "open-toast": showToast("toast.welcome","toast.welcomeBody"); break;
    case "select-chat": dispatch("SELECT_CHAT", { chatId: el.getAttribute("data-id") }); break;
    case "back-list": dispatch("SELECT_CHAT", { chatId: null }); break;
    case "new-chat": dispatch("CREATE_CHAT"); break;
    case "translate-draft": dispatch("TRANSLATE_DRAFT"); break;
    case "propose": {
      const p = partnerById(el.getAttribute("data-id"));
      $("#drawer").hidden = true;
      dispatch("SEND_OFFER", { targetId:p.id, message: (STATE.language==='ko'?'협업 제안드려요. 조건 조율해요.':'Proposing a collab — let\'s align terms.'), amount:2000 });
      dispatch("NAVIGATE", { route:"chat" });
      break;
    }
    case "use-partner": { matchForm.target = el.getAttribute("data-id"); render(); break; }
    case "dir-chip": { dirSearch = el.getAttribute("data-q"); render(); break; }
    case "cancel-forecast": dispatch("FORECAST_CANCEL"); break;
    case "preview-mode": { createPreviewMode = el.getAttribute("data-mode"); render(); break; }
    case "apply-campaign": dispatch("APPLY_CAMPAIGN", { id: el.getAttribute("data-id") }); break;
    case "escrow-create": dispatch("CREATE_ESCROW", { payeeId: el.getAttribute("data-id"), amount:1500, currency:"USD" }); break;
    case "escrow-release": dispatch("ESCROW_ACTION", { id: el.getAttribute("data-id"), action:"release" }); break;
    case "escrow-action": dispatch("ESCROW_ACTION", { id: el.getAttribute("data-id"), action: el.getAttribute("data-act") }); break;
  }
});

/* input events (search) — delegated */
document.addEventListener("input", (e)=>{
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.getAttribute("data-action");
  if (a === "dir-search"){ dirSearch = el.value; render(); }
});

/* form submits — delegated */
document.addEventListener("submit", (e)=>{
  const form = e.target.closest("form[data-action]");
  if (!form) return;
  e.preventDefault();
  const a = form.getAttribute("data-action");
  const fd = new FormData(form);
  if (a === "submit-offer"){
    matchForm.message = fd.get("message"); matchForm.amount = fd.get("amount"); matchForm.target = fd.get("target");
    dispatch("SEND_OFFER", { targetId: fd.get("target"), message: fd.get("message"), amount: Number(fd.get("amount")) });
    dispatch("NAVIGATE", { route:"chat" });
  } else if (a === "submit-message"){
    const text = fd.get("text"); if (!String(text).trim()) return;
    dispatch("SUBMIT_MESSAGE", { text, clientActionId: uid("ca"), nuance: STATE.ui.draftNuance });
    STATE.ui.draftNuance = null;
    render();
    requestAnimationFrame(()=>{ const i=$("#chatInput"); if(i) i.focus(); });
  } else if (a === "submit-forecast"){
    fcForm = { partner:fd.get("partner"), budget:fd.get("budget"), days:fd.get("days"), platform:fd.get("platform") };
    dispatch("FORECAST_RUN", { partnerId:fd.get("partner"), budget:fd.get("budget"), days:fd.get("days"), platform:fd.get("platform") });
  } else if (a === "submit-campaign"){
    const title = fd.get("title"), brief = fd.get("brief");
    if (!title || !brief) return;
    dispatch("CREATE_CAMPAIGN", { title, brief,
      bmin:Number(fd.get("bmin")), bmax:Number(fd.get("bmax")),
      platforms:String(fd.get("platforms")).split(",").map(s=>s.trim()).filter(Boolean),
      regions:String(fd.get("regions")).split(",").map(s=>s.trim()).filter(Boolean) });
    form.reset();
  } else if (a === "submit-apply"){
    dispatch("APPLY_CAMPAIGN", {});
  } else if (a === "submit-preview"){
    dispatch("GENERATE_PREVIEW", { mode: createPreviewMode });
  } else if (a === "submit-escrow"){
    dispatch("CREATE_ESCROW", { payeeId:fd.get("payee"), amount:Number(fd.get("amount")), currency:fd.get("currency") });
  }
});

/* keyboard: Esc closes overlays */
document.addEventListener("keydown", (e)=>{
  if (e.key === "Escape"){
    if (!$("#drawer").hidden){ $("#drawer").hidden = true; return; }
    if (STATE.ui.menuOpen){ dispatch("TOGGLE_MENU"); }
  }
});

/* network status -> offline queue note */
window.addEventListener("online", ()=>{ STATE.network="online"; render(); });
window.addEventListener("offline", ()=>{ STATE.network="offline"; render(); });

/* ====================================================================
   BOOT  (home content IS the first paint — no splash / no entry gate)
==================================================================== */
document.documentElement.lang = STATE.language;
function boot(){ dispatch("BOOT"); }
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
