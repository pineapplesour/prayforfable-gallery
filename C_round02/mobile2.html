<style>
  *{ -webkit-tap-highlight-color: transparent; }
  html,body{ font-family:'Pretendard',system-ui,sans-serif; background:#eef0f6; overflow-x:hidden; max-width:100%; }
  #app{ overflow-x:hidden; }
  #app *{ max-width:100%; }
  .no-scrollbar > *{ max-width:none; }
  .gradient-text{
    background:linear-gradient(135deg,#7c3aed,#a78bfa);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .glass{ background:rgba(255,255,255,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .glass-dark{ background:rgba(17,24,39,.55); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .no-scrollbar::-webkit-scrollbar{ display:none; }
  .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .fade-up{ animation:fadeUp .4s ease both; }
  @keyframes floaty{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .floaty{ animation:floaty 6s ease-in-out infinite; }
  @keyframes pingdot{ 0%{transform:scale(1);opacity:.8} 75%,100%{transform:scale(2.4);opacity:0} }
  .ping-dot::after{ content:'';position:absolute;inset:0;border-radius:9999px;background:#22c55e;animation:pingdot 1.6s cubic-bezier(0,0,.2,1) infinite; }
  @keyframes typing{ 0%{opacity:.2} 20%{opacity:1} 100%{opacity:.2} }
  .typing span{ display:inline-block;width:6px;height:6px;border-radius:9999px;background:#7c3aed;margin:0 2px;animation:typing 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s } .typing span:nth-child(3){ animation-delay:.4s }
  .tab-active i{ transform:translateY(-2px); }
  /* phone frame for desktop preview */
  .phone-shell{ width:100%; max-width:430px; }
  @media (min-width:768px){
    body{ display:flex; align-items:flex-start; justify-content:center; padding:32px 0; }
    .phone-shell{
      width:430px; height:920px; max-height:calc(100vh - 64px);
      border:10px solid #1f2330; border-radius:46px; overflow:hidden;
      box-shadow:0 40px 90px -30px rgba(76,29,149,.5), 0 0 0 2px rgba(255,255,255,.04);
      position:relative; background:#fff;
    }
  }
  @media (prefers-reduced-motion: reduce){
    .fade-up,.floaty,.ping-dot::after,.typing span{ animation:none !important; }
  }
  [data-screen]{ display:none; }
  [data-screen].is-active{ display:block; }
  .hidden-imp{ display:none !important; }
</style>
</head>

  function computeForecast(){
    const c = CREATORS.find(x=>x.id===state.forecast.partner) || CREATORS[0];
    const budget = Math.max(100, Number(state.forecast.budget)||0);
    const erNum = parseFloat(c.er)/100;
    const reachNum = parseFloat(c.reach) * (c.reach.includes('M')?1000000:1000);
    const platMult = { Instagram:1.0, TikTok:1.15, YouTube:0.92 }[state.forecast.platform] || 1.0;
    const roasNum = parseFloat(c.roas) * platMult;
    const estReach = Math.round(reachNum * platMult * (0.55 + budget/20000));
    const estConv = Math.round(estReach * erNum * 0.12);
    const estRevenue = budget * roasNum;
    const estCpa = estConv ? (budget/estConv) : 0;
    const fmt = (n)=> n>=1000000 ? (n/1000000).toFixed(1)+'M' : n>=1000 ? (n/1000).toFixed(0)+'K' : String(n);
    return {
      creator:c,
      roas: roasNum.toFixed(1)+'x',
      reach: fmt(estReach),
      conv: estConv.toLocaleString(),
      cpa: '$'+estCpa.toFixed(2),
      confidence: Math.min(97, c.fit - 2),
      scenarios: { low:(roasNum*0.78).toFixed(1)+'x', base:roasNum.toFixed(1)+'x', high:(roasNum*1.22).toFixed(1)+'x' },
      breakdown: c.plats.map((p,i)=>({ name:p, pct: i===0?58:i===1?30:12 }))
    };
  }

  /* =====================================================================

  const VIEWS = { home:viewHome, directory:viewDirectory, matching:viewMatching, forecast:viewForecast, chat:viewChat, create:viewCreate, payment:viewPayment };

  function render(){
    const fn = VIEWS[state.route] || viewHome;
    const view = $('#view');
    view.innerHTML = fn();
    document.documentElement.setAttribute('data-state', state.chat.ui.phase);

  function go(route){
    if(!VIEWS[route]) route='home';
    state.route = route;
    if(location.hash !== '#/'+route) location.hash = '#/'+route;
    render();
  }

  /* =====================================================================
     CHAT STATE MACHINE — dispatch(command, payload)
     Locked invariants: idempotent submit, single placeholder, job ownership,
     cancelled jobs never append, language is state.
     ===================================================================== */
  const timers = {};
  function dispatch(cmd, payload={}){
    const chat = state.chat;
    const conv = CONVERSATIONS.find(c=>c.id===chat.activeConvId);
    switch(cmd){
      case 'SELECT_CHAT': {
        chat.activeConvId = payload.convId;
        chat.ui.phase = chat.activeJobByConv[payload.convId] ? 'running' : 'idle';
        render();
        break;
      }
      case 'SUBMIT_QUESTION': {
        const text = (payload.text||'').trim();
        if(!text) return;
        // INVARIANT 1: ignore submit while a job is active for same chat (no new clientActionId)
        if(chat.activeJobByConv[conv.id]) return;
        const clientActionId = uid('cact');
        const userMsgId = uid('msg');
        const assistantId = uid('msg');
        // INVARIANT 2: exactly one user message + one assistant placeholder
        conv.msgs.push({ who:'me', text, _id:userMsgId });
        const jobId = uid('job');
        chat.jobs[jobId] = { convId:conv.id, assistantId, clientActionId, phase:'submitting' };
        chat.activeJobByConv[conv.id] = clientActionId;
        chat.ui.phase = 'submitting';
        render();
        // effect: simulate async assistant reply
        timers[jobId] = setTimeout(()=> dispatch('JOB_STATUS_RECEIVED', { jobId }), 600);
        break;
      }
      case 'JOB_STATUS_RECEIVED': {
        const job = chat.jobs[payload.jobId];
        if(!job || job.phase==='cancelled') return;
        job.phase = 'running';
        if(chat.activeConvId===job.convId) chat.ui.phase='running';
        render();
        timers[payload.jobId] = setTimeout(()=> dispatch('JOB_RESULT_RECEIVED', { jobId:payload.jobId }), 1400);
        break;
      }
      case 'JOB_RESULT_RECEIVED': {
        const job = chat.jobs[payload.jobId];
        if(!job) return;
        // INVARIANT 4: cancelled jobs must not append final answers later
        if(job.phase==='cancelled') return;
        const ownerConv = CONVERSATIONS.find(c=>c.id===job.convId);
        if(!ownerConv) return;
        const creator = CREATORS.find(c=>c.id===ownerConv.creatorId)||CREATORS[0];
        const replies = state.lang==='ko'
          ? ['좋아요, 일정 맞춰볼게요! 컨셉 시트 공유드릴게요 📎','확인했습니다. 견적 정리해서 보내드릴게요.','관심 있어요! 이번 주 안에 샘플 컷 보내드릴 수 있어요.']
          : ['Sounds good — I can fit the schedule. Sharing a concept sheet 📎','Got it. I will send over a tidy quote.','Interested! I can send sample cuts within this week.'];
        const reply = replies[Math.floor(Math.random()*replies.length)];
        // INVARIANT 3: result attaches to the assistant placeholder owning the same jobId (its own conv)
        ownerConv.msgs.push({ who:'them', text:reply, _id:job.assistantId });
        job.phase='completed';
        delete chat.activeJobByConv[job.convId];
        // INVARIANT 5: only updates its own chat — UI phase only flips if active chat is owner
        if(chat.activeConvId===job.convId) chat.ui.phase='completed';
        render();
        if(chat.activeConvId===job.convId){
          setTimeout(()=>{ if(state.chat.ui.phase==='completed' && !state.chat.activeJobByConv[chat.activeConvId]){ state.chat.ui.phase='idle'; if(state.route==='chat') render(); } }, 400);
        }
        break;
      }
      case 'CANCEL_JOB': {
        const cid = chat.activeJobByConv[conv.id];
        if(!cid) return;
        const jobId = Object.keys(chat.jobs).find(j=>chat.jobs[j].clientActionId===cid);
        if(jobId){ chat.jobs[jobId].phase='cancelled'; clearTimeout(timers[jobId]); }
        delete chat.activeJobByConv[conv.id];
        chat.ui.phase='cancelled';
        render();
        setTimeout(()=>{ if(state.chat.ui.phase==='cancelled'){ state.chat.ui.phase='idle'; if(state.route==='chat') render(); } }, 1500);
        break;
      }
      case 'RETRY_JOB': {
        chat.ui.phase='idle';
        const input = $('#chatInput');
        render();
        break;
      }
    }
  }

  /* =====================================================================
     EVENT DELEGATION (registered once — no stacked listeners)
     ===================================================================== */
  document.addEventListener('click', (e)=>{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.getAttribute('data-action');
    switch(action){
      case 'nav': e.preventDefault(); go(el.getAttribute('data-route')); break;
      case 'set-role': {
        const r = el.getAttribute('data-role');
        if(r!==state.role){ state.role=r; toast('toast.role'); render(); }
        break;
      }
      case 'toggle-language': {
        state.lang = state.lang==='ko'?'en':'ko';
        render();
        break;
      }
      case 'open-profile': {
        const c = CREATORS.find(x=>x.id===el.getAttribute('data-id'));
        if(c){ state.match.selectedId=c.id; go('matching'); }
        break;
      }
      case 'dir-chip': { state.dir.q = el.getAttribute('data-q')||''; render(); break; }
      case 'use-candidate': { state.match.selectedId = el.getAttribute('data-id'); toast('toast.selected'); render(); break; }
      case 'send-offer': {
        if(state.match.sending) return;
        state.match.sending = true; render();
        setTimeout(()=>{ state.match.sending=false; toast('toast.offerSent'); go('chat'); }, 900);
        break;
      }
      case 'run-forecast': {
        if(state.forecast.phase==='running') return;
        const b = $('[data-action="fc-budget"]'); if(b) state.forecast.budget = b.value;
        state.forecast.phase='running'; state.forecast.result=null; render();
        setTimeout(()=>{ state.forecast.result=computeForecast(); state.forecast.phase='completed'; render(); }, 1400);
        break;
      }
      case 'preview-mode': { state.create.previewMode = el.getAttribute('data-mode'); state.create.previewDone=false; render(); break; }
      case 'generate-preview': {
        if(state.create.rendering) return;
        state.create.rendering=true; render();
        setTimeout(()=>{ state.create.rendering=false; state.create.previewDone=true; toast('toast.preview'); render(); }, 1000);
        break;
      }
      case 'register-campaign': {
        const title=($('#cTitle')||{}).value, brief=($('#cBrief')||{}).value;
        if(!title || !brief){ toast('create.needFields'); return; }
        toast('toast.campaign');
        break;
      }
      case 'apply-campaign': { toast('toast.applied'); break; }
      case 'hold-escrow': {
        if(state.pay.holding) return;
        state.pay.holding=true; render();
        setTimeout(()=>{
          const amt=Number(($('#eAmt')||{value:0}).value)||0;
          const cur=(($('#eCur')||{value:'USD'}).value)||'USD';
          const payee=(($('#ePayee')||{value:'creator'}).value)||'creator';
          PAYMENTS.unshift({ id:uid('pay'), currency:cur.toUpperCase(), amount:amt, status:'funded', payer:'brand_buylow', payee });
          state.pay.holding=false; toast('toast.escrow'); render();
        }, 900);
        break;
      }
      case 'escrow-release': { const p=PAYMENTS.find(x=>x.id===el.getAttribute('data-id')); if(p){p.status='released'; toast('toast.released'); render();} break; }
      case 'escrow-refund': { const p=PAYMENTS.find(x=>x.id===el.getAttribute('data-id')); if(p){p.status='refunded'; toast('toast.refunded'); render();} break; }
      case 'escrow-dispute': { const p=PAYMENTS.find(x=>x.id===el.getAttribute('data-id')); if(p){p.status='disputed'; toast('toast.disputed'); render();} break; }
      // chat commands -> state machine
      case 'select-chat': dispatch('SELECT_CHAT', { convId: el.getAttribute('data-id') }); break;
      case 'submit-question': {
        const input=$('#chatInput'); const text=input?input.value:'';
        if(input) input.value='';
        dispatch('SUBMIT_QUESTION', { text });
        break;
      }
      case 'cancel-job': dispatch('CANCEL_JOB'); break;
      case 'retry-job': dispatch('RETRY_JOB'); break;
    }
  });

  // search input (delegated via input event)
  document.addEventListener('input', (e)=>{
    const el = e.target.closest('[data-action]'); if(!el) return;
    const action = el.getAttribute('data-action');
    if(action==='dir-search'){ state.dir.q = el.value; updateDirResults(); }
    else if(action==='fc-budget'){ state.forecast.budget = el.value; }
  });
  document.addEventListener('change', (e)=>{
    const el = e.target.closest('[data-action]'); if(!el) return;
    const action = el.getAttribute('data-action');
    if(action==='fc-partner'){ state.forecast.partner = el.value; }
    else if(action==='fc-platform'){ state.forecast.platform = el.value; }
  });
  // enter-to-send in chat
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && e.target.id==='chatInput'){
      e.preventDefault();
      const text=e.target.value; e.target.value='';
      dispatch('SUBMIT_QUESTION', { text });
    }
  });

  // partial re-render for directory search (keep input focus)
  function updateDirResults(){
    if(state.route!=='directory') return;
    const view=$('#view'); const cur=$('[data-action="dir-search"]');
    const focusPos = cur ? cur.selectionStart : null;
    view.innerHTML = viewDirectory();
    applyStaticI18n();
    if(window.lucide) try{ lucide.createIcons(); }catch(e){}
    const next=$('[data-action="dir-search"]');
    if(next){ next.focus(); if(focusPos!=null) try{ next.setSelectionRange(focusPos,focusPos); }catch(e){} }
  }

  /* ---------------- hash routing + boot ---------------- */
  window.addEventListener('hashchange', ()=>{
    const r = (location.hash||'#/home').replace('#/','');
    if(r!==state.route){ state.route = VIEWS[r]?r:'home'; render(); }
  });

  function boot(){
    const r = (location.hash||'').replace('#/','');
    state.route = VIEWS[r] ? r : 'home';
    render();
  }
  // first paint = home content immediately (no splash/gate)
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
