<head>

        keyframes: {
          fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },

          rise: 'rise .6s cubic-bezier(.2,.8,.2,1) both',

<style>
  :root { color-scheme: light; }
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Pretendard', system-ui, sans-serif; overflow-x: hidden; }
  .gradient-text {
    background: linear-gradient(135deg, #7c3aed, #a78bfa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .glass {
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .glass-dark {
    background: rgba(15,23,42,.72);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }

  .scroll-thin::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 99px; }
  .scroll-thin::-webkit-scrollbar-track { background: transparent; }
  .hide-scroll::-webkit-scrollbar { display: none; }
  .hide-scroll { scrollbar-width: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  /* nav active state driven by data-active, not class soup */
  [data-nav][data-active="true"] {
    background: linear-gradient(135deg, #7c3aed, #6d28d9);
    color: #fff; box-shadow: 0 8px 24px -8px rgba(124,58,237,.6);

  [data-nav][data-active="true"] .nav-ico { color: #fff; }
  [data-nav][data-active="false"]:hover { background: #f1f5ff; }
  /* state-gated visibility */
  [data-visible-phase] { display: none; }
  /* collapsed (rail) sidebar density mode — desktop only */
  body[data-rail="true"] #sidebar { width: 5.25rem; }
  body[data-rail="true"] #sidebar .rail-hide { display: none; }
  body[data-rail="true"] #sidebar [data-nav] { justify-content: center; padding-left: 0; padding-right: 0; }
  @media (min-width:1024px){ body[data-rail="true"] #mainCol { padding-left: 5.25rem; } }

<body class="bg-slate-50 text-slate-900 antialiased" data-rail="false">

<!-- decorative violet blobs -->
<div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">

  <div class="absolute top-1/3 -right-32 h-[28rem] w-[28rem] rounded-full bg-indigo-100/50 blur-3xl"></div>
  <div class="absolute -bottom-32 left-1/4 h-80 w-80 rounded-full bg-brand-200/40 blur-3xl"></div>
</div>

<!-- ============ APP SHELL: sidebar + main + context rail ============ -->

        <i data-lucide="gem" class="h-6 w-6"></i>
      </div>
      <div class="rail-hide leading-tight">
        <p class="text-lg font-extrabold tracking-tight"><span class="gradient-text">Buy</span><span class="text-slate-900">low</span></p>
        <p class="text-[11px] font-semibold text-slate-400" data-i18n="brand.tagline"></p>
      </div>
      <button data-action="toggle-rail" title="패널 접기" class="rail-hide ml-auto hidden h-8 w-8 place-items-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-brand-600 lg:grid">
        <i data-lucide="panel-left-close" class="h-4 w-4"></i>
      </button>
    </div>

    <!-- role switcher -->
    <div class="rail-hide px-4 pb-4">
      <div class="rounded-2xl bg-slate-100/70 p-1.5">
        <div class="grid grid-cols-2 gap-1 text-xs font-bold">
          <button data-action="set-role" data-role="brand" class="role-btn rounded-xl py-2 transition" data-active="true"><span data-i18n="role.brand"></span></button>

        </div>
      </div>
    </div>
    <!-- rail-mode expand button -->
    <button data-action="toggle-rail" title="패널 펼치기" class="mx-auto mb-3 hidden h-9 w-9 place-items-center rounded-xl text-slate-400 transition hover:bg-slate-100 hover:text-brand-600" id="railExpand">
      <i data-lucide="panel-left-open" class="h-5 w-5"></i>
    </button>

    <!-- nav -->
    <nav class="flex-1 space-y-1 overflow-y-auto px-4 pb-4 scroll-thin hide-scroll" id="navList"></nav>

    <!-- workspace credit / session -->
    <div class="border-t border-slate-200/70 px-4 py-4">
      <div class="rail-hide mb-3 rounded-2xl bg-gradient-to-br from-brand-50 to-indigo-50 p-3.5">
        <div class="flex items-center justify-between text-[11px] font-bold text-slate-500">
          <span data-i18n="ws.credit"></span><span class="text-brand-700" id="wsCreditVal">$7,300</span>
        </div>
        <div class="mt-2 h-1.5 w-full overflow-hidden rounded-full bg-white/70"><div class="h-full rounded-full bg-gradient-to-r from-brand-600 to-indigo-500" style="width:62%"></div></div>

      </div>

        <div class="rail-hide min-w-0 flex-1">

          <p class="truncate text-[11px] text-slate-400"><span id="meRoleLabel"></span></p>

    </div>
    <div id="paletteResults" class="max-h-80 overflow-y-auto scroll-thin p-2"></div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-[60] -translate-x-1/2 translate-y-4 opacity-0 transition-all duration-300">

</div>

let seenActionIds = new Set();

function dispatch(cmd, payload) { reduce(cmd, payload || {}); render(); }
function setPhase(p, job) { state.ui.phase = p; if (job !== undefined) state.ui.job = job; document.documentElement.setAttribute("data-state-phase", p); }

function reduce(cmd, p) {
  switch (cmd) {
    case "BOOT": buildMock(); setPhase("idle", null); break;
    case "CHANGE_LANGUAGE": state.language = state.language === "ko" ? "en" : "ko"; break;
    case "SET_ROLE": if (p.role && p.role !== state.role) { state.role = p.role; } break;
    case "NAVIGATE": if (p.route) { state.route = p.route; if (state.ui.phase==="composing") setPhase("idle"); } break;

    case "TOGGLE_SIDEBAR": state._sidebar = !state._sidebar; break;
    case "CLOSE_SIDEBAR": state._sidebar = false; break;
    case "TOGGLE_RAIL": state.ui.rail = !state.ui.rail; break;
    case "TOGGLE_CONTEXT": state.ui.context = !state.ui.context; break;
    case "OPEN_PALETTE": state.ui.palette = true; state.palette.query = ""; break;
    case "CLOSE_PALETTE": state.ui.palette = false; break;
    case "PALETTE_QUERY": state.palette.query = p.value; break;

    case "FORM_INPUT": { const [f,k] = p.field.split("."); if (state.forms[f]) state.forms[f][k] = p.value; break; }
    case "DIR_TAB": state.dir.tab = p.tab; break;
    case "DIR_SEARCH": state.dir.query = p.value; break;
    case "PIN_PARTNER": state.ui.pinned = p.id; break;

    case "CHAT_SELECT": state.chat.active = p.id; if (MOCK.conversations[p.id]) MOCK.conversations[p.id].unread = 0; break;

    case "JOB_SUBMIT": {
      if (!p.clientActionId || seenActionIds.has(p.clientActionId)) return;
      if (state.ui.phase === "submitting" || state.ui.phase === "queued" || state.ui.phase === "running") return;
      seenActionIds.add(p.clientActionId);
      setPhase("submitting", { kind:p.kind, clientActionId:p.clientActionId, jobId:"job-"+Math.random().toString(36).slice(2,8), payload:p.data });
      break;
    }
    case "JOB_QUEUED": setPhase("queued"); break;
    case "JOB_RUNNING": setPhase("running"); break;
    case "JOB_RESULT": { const job = state.ui.job; if (!job || job.jobId !== p.jobId) return; applyJobResult(job); setPhase("completed", job); break; }
    case "JOB_FAILED": setPhase("failed", state.ui.job); break;
    case "JOB_CLEAR": setPhase("idle", null); break;

    case "OPEN_SOURCE": state.sourceWindow = p; setPhase("source_open"); break;
    case "CLOSE_SOURCE": state.sourceWindow = null; setPhase("idle"); break;

    case "NETWORK_OFFLINE": state.network = "offline"; break;
    case "NETWORK_ONLINE": state.network = "online"; break;
    default: break;
  }
}

function logActivity(a) { if (!MOCK.activity) MOCK.activity = []; MOCK.activity.unshift({ ...a, t: state.language==="ko"?"방금":"now" }); MOCK.activity = MOCK.activity.slice(0,8); }

function applyJobResult(job) {
  const d = job.payload || {};
  if (job.kind === "send-offer") {
    const id = "of-"+Math.random().toString(36).slice(2,8);
    const convId = "cv-"+d.target;
    MOCK.offers.unshift({ id, target:d.target, conv:convId, amount:Number(d.amount)||0, status:"open", message:d.message });
    if (!MOCK.conversations[convId]) {
      MOCK.conversations[convId] = { id:convId, partner:d.target, unread:0, messages:[{id:"m1",from:"me",text:d.message,time:"now"}] };
      MOCK.convOrder.unshift(convId);
    } else {
      MOCK.conversations[convId].messages.push({id:"m"+Date.now(),from:"me",text:d.message,time:"now"});
      MOCK.convOrder = [convId, ...MOCK.convOrder.filter(x=>x!==convId)];
    }
    state.chat.active = convId; state.ui.pinned = d.target;
    logActivity({ kind:"offer", who:d.target });
    toast(t("match.send"), "check");
  } else if (job.kind === "create-campaign") {
    MOCK.campaigns.unshift({ id:"cmp-"+Math.random().toString(36).slice(2,6), title:d.title||"New campaign", brief:d.brief||"", budgetMin:Number(d.bmin)||0, budgetMax:Number(d.bmax)||0, platforms:(d.platforms||"").split(",").map(s=>s.trim()).filter(Boolean), regions:(d.regions||"").split(",").map(s=>s.trim()).filter(Boolean), status:"active", applicants:0 });
    state.forms.create.title=""; state.forms.create.brief="";
    logActivity({ kind:"campaign", title:d.title||"New campaign" });
    toast(t("cr.done"), "check");
  } else if (job.kind === "apply-campaign") {
    toast(t("cr.applied"), "check");
  } else if (job.kind === "asset-preview") {
    MOCK.assetPreview = { mode:d.previewMode, watermark:d.watermark, filename:d.filename, concept:d.concept, at:Date.now() };
  } else if (job.kind === "forecast") {
    MOCK.forecast = computeForecast(d);
  } else if (job.kind === "send-message") {
    const c = MOCK.conversations[d.conv];
    if (c) { c.messages.push({ id:"m"+Date.now(), from:"me", text:d.text, time:"now" });
      setTimeout(() => { c.messages.push({ id:"r"+Date.now(), from:c.partner, text: autoReply(), time:"now", translated: autoReply() }); logActivity({kind:"msg", who:c.partner}); render(); }, 1400);
    }
    state.chat.draft="";
  } else if (job.kind === "escrow") {
    MOCK.payments.unshift({ id:"pay-"+Math.random().toString(36).slice(2,6), payee:d.payee, currency:d.currency, amount:Number(d.amount)||0, status:"held", milestones:[{key:"ms.contract",done:true},{key:"ms.review",done:false},{key:"ms.publish",done:false}] });
    logActivity({ kind:"escrow", amount:Number(d.amount)||0 });
    toast(t("pay.done"), "check");
  } else if (job.kind === "release-milestone") {
    const pmt = MOCK.payments.find(x=>x.id===d.id);
    if (pmt) { const m = pmt.milestones.find(x=>!x.done); if(m) m.done=true; if(pmt.milestones.every(x=>x.done)) pmt.status="released"; }
    logActivity({ kind:"release" });
    toast(t("pay.released"), "check");
  }
}

function autoReply() {
  const pool = state.language==="ko"
    ? ["좋아요, 바로 진행할게요!","컨셉 확인했습니다. 초안 보내드릴게요.","감사합니다 — 일정 맞춰볼게요.","오퍼 검토 후 회신드리겠습니다."]
    : ["Sounds great, let's go!","Got the concept, sending a draft.","Thanks — I'll match the timeline.","I'll review the offer and reply."];
  return pool[Math.floor(Math.random()*pool.length)];
}

function computeForecast(d) {
  const budget = Math.max(200, Number(d.budget)||0);
  const chMult = { Instagram:1.0, YouTube:0.85, TikTok:1.25, Snapchat:0.7 }[d.channel] || 1;
  const reach = Math.round(budget * 410 * chMult);
  const conv = Math.round(reach * 0.018);
  const roas = Math.round((360 + chMult*120));
  const cpa = (budget / Math.max(1,conv)).toFixed(2);
  const weeks = [1,2,3,4].map((w,i)=> Math.round(reach * [0.18,0.46,0.78,1][i]));
  const mix = [{ ch:d.channel, pct: 55 },{ ch:"UGC reshare", pct: 25 },{ ch:"Paid boost", pct: 20 }];
  return { reach, conv, roas, cpa, weeks, mix, conf: 86 };
}

      ${p.role==="creator"?`<div class="mt-5 grid grid-cols-3 gap-2 text-center">
        <div class="rounded-2xl bg-brand-50 py-3"><p class="text-lg font-extrabold text-brand-700">${p.roas}%</p><p class="text-[10px] text-slate-400">${esc(t("dir.metric.roas"))}</p></div>
        <div class="rounded-2xl bg-indigo-50 py-3"><p class="text-lg font-extrabold text-indigo-700">${NF(p.reach)}</p><p class="text-[10px] text-slate-400">${esc(t("dir.metric.reach"))}</p></div>
        <div class="rounded-2xl bg-rose-50 py-3"><p class="text-lg font-extrabold text-rose-600">${p.eng}%</p><p class="text-[10px] text-slate-400">${esc(t("dir.metric.eng"))}</p></div>
      </div>`:""}
      <div class="mt-5 flex flex-wrap gap-2">${(p.platforms||[]).map(x=>pill(x,"bg-slate-100 text-slate-600")).join("")}${(p.langs||[]).map(x=>pill(x,"bg-brand-50 text-brand-700")).join("")}</div>
      <div class="mt-6 grid gap-2">
        ${p.role==="creator"?`<button data-action="offer-target" data-target="${p.id}" class="flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-brand-600 to-indigo-600 py-3 text-sm font-bold text-white shadow-lg shadow-brand-500/30"><i data-lucide="send" class="h-4 w-4"></i>${esc(t("match.send"))}</button>`:""}
        <button data-action="pin-partner" data-id="${p.id}" class="flex w-full items-center justify-center gap-2 rounded-2xl border border-slate-200 py-3 text-sm font-bold text-slate-600 transition hover:border-brand-300 hover:text-brand-600"><i data-lucide="pin" class="h-4 w-4"></i>${esc(t("rail.pinned"))}</button>
      </div>
    `;
  } else { d.classList.add("hidden"); d.style.display = "none"; }
}

/* --------------------------------------------------------- PALETTE */
function paletteItems() {
  const q = (state.palette.query||"").trim().toLowerCase();
  const routes = NAV.map(n=>({ type:"route", id:n.route, icon:n.icon, label:t("nav."+n.route), sub:t("title."+n.route) }));
  const partners = ALL_PARTNERS.map(p=>({ type:"partner", id:p.id, icon:p.role==="brand"?"building-2":"user", label:p.name, sub:`${p.flag||""} ${p.country} · ${(p.cats||[]).join(", ")||p.role}` }));
  const campaigns = (MOCK.campaigns||[]).map(c=>({ type:"campaign", id:c.id, icon:"megaphone", label:c.title, sub:`${c.regions.join(", ")} · $${c.budgetMin.toLocaleString()}+` }));
  let all = [...routes, ...partners, ...campaigns];
  if (q) all = all.filter(it => (it.label+" "+it.sub).toLowerCase().includes(q));
  return all.slice(0, 9);
}
function renderPalette() {
  const pal = $("#palette");
  if (!state.ui.palette) { pal.classList.add("hidden"); return; }
  pal.classList.remove("hidden");
  const inp = $("#paletteInput");
  inp.setAttribute("placeholder", t("search.placeholder"));
  const items = paletteItems();
  $("#paletteResults").innerHTML = items.length ? items.map(it=>`
    <button data-action="palette-go" data-type="${it.type}" data-id="${it.id}" class="flex w-full items-center gap-3 rounded-2xl px-3 py-2.5 text-left transition hover:bg-brand-50">
      <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-slate-100 text-slate-500"><i data-lucide="${it.icon}" class="h-4 w-4"></i></span>
      <div class="min-w-0 flex-1"><p class="truncate text-sm font-bold text-slate-800">${esc(it.label)}</p><p class="truncate text-[11px] text-slate-400">${esc(it.sub)}</p></div>
      <span class="rounded-full bg-slate-100 px-2 py-0.5 text-[10px] font-bold text-slate-400">${it.type}</span>
    </button>`).join("") : `<p class="px-3 py-8 text-center text-sm text-slate-400">${esc(t("dir.empty"))}</p>`;
  if (window.lucide) lucide.createIcons();
}

/* --------------------------------------------------------- TOAST */
let toastTimer;
function toast(msg, ico) {
  const el = $("#toast");
  $("#toastMsg").textContent = msg;
  $("#toastIco").innerHTML = `<i data-lucide="${ico||"check"}" class="h-4 w-4"></i>`;
  if (window.lucide) lucide.createIcons();
  el.classList.remove("translate-y-4","opacity-0");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.add("translate-y-4","opacity-0"), 2600);
}

/* ------------------------------------------------- JOB EFFECT (sim) */
function runJob(kind, data) {
  const cid = uid();
  dispatch("JOB_SUBMIT", { kind, data, clientActionId: cid });
  if (state.network === "offline") { setPhase("offline_queued"); render(); return; }
  const jobId = state.ui.job?.jobId;
  if (!jobId) return;
  setTimeout(()=>dispatch("JOB_QUEUED"), 220);
  setTimeout(()=>dispatch("JOB_RUNNING"), 520);
  const dur = kind==="forecast" ? 1400 : 900;
  setTimeout(()=>{ dispatch("JOB_RESULT", { jobId }); setTimeout(()=>dispatch("JOB_CLEAR"), 700); }, dur);
}

/* ------------------------------------------- ACTION DISPATCHER (once) */
function bindOnce() {
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const a = el.getAttribute("data-action");
    switch (a) {
      case "toggle-sidebar": dispatch("TOGGLE_SIDEBAR"); break;
      case "close-sidebar": dispatch("CLOSE_SIDEBAR"); break;
      case "toggle-rail": dispatch("TOGGLE_RAIL"); break;
      case "toggle-context": dispatch("TOGGLE_CONTEXT"); break;
      case "toggle-language": dispatch("CHANGE_LANGUAGE"); break;
      case "set-role": dispatch("SET_ROLE", { role: el.getAttribute("data-role") }); break;
      case "navigate": location.hash = "#/" + el.getAttribute("data-route"); break;
      case "dir-tab": dispatch("DIR_TAB", { tab: el.getAttribute("data-tab") }); break;
      case "open-source": dispatch("OPEN_SOURCE", { sourceId: el.getAttribute("data-source-id"), citationLabel: el.getAttribute("data-source-id") }); break;
      case "close-source": dispatch("CLOSE_SOURCE"); break;
      case "pin-partner": dispatch("PIN_PARTNER", { id: el.getAttribute("data-id") }); toast(t("rail.pinned"), "pin"); break;
      case "open-chat": dispatch("CHAT_SELECT", { id: el.getAttribute("data-conv") }); location.hash = "#/chat"; break;
      case "chat-select": dispatch("CHAT_SELECT", { id: el.getAttribute("data-id") }); break;
      case "chat-back": state.chat.active = null; render(); break;
      case "open-palette": dispatch("OPEN_PALETTE"); setTimeout(()=>{const i=$("#paletteInput"); if(i) i.focus();}, 30); break;
      case "close-palette": dispatch("CLOSE_PALETTE"); break;
      case "palette-go": {
        const type = el.getAttribute("data-type"), id = el.getAttribute("data-id");
        dispatch("CLOSE_PALETTE");
        if (type==="route") location.hash = "#/"+id;
        else if (type==="partner") { dispatch("PIN_PARTNER", { id }); dispatch("OPEN_SOURCE", { sourceId:id, citationLabel:id }); }
        else if (type==="campaign") location.hash = "#/create";
        break;
      }
      case "offer-target":
        state.forms.offer.target = el.getAttribute("data-target");
        state.ui.pinned = el.getAttribute("data-target");
        if (state.ui.phase==="source_open") dispatch("CLOSE_SOURCE");
        location.hash = "#/matches"; break;
      case "preview-mode": state.forms.create.previewMode = el.getAttribute("data-mode"); render(); break;
      case "submit-offer": runJob("send-offer", { ...state.forms.offer }); break;
      case "submit-campaign":
        if (!state.forms.create.title.trim() || !state.forms.create.brief.trim()) { toast(state.language==="ko"?"제목과 브리프를 입력하세요":"Title and brief required","alert-triangle"); break; }
        runJob("create-campaign", { ...state.forms.create }); break;
      case "apply-campaign": runJob("apply-campaign", { id: el.getAttribute("data-id"), ...state.forms.create }); break;
      case "submit-preview": runJob("asset-preview", { ...state.forms.create }); break;
      case "submit-forecast": runJob("forecast", { ...state.forms.forecast }); break;
      case "submit-escrow": runJob("escrow", { ...state.forms.escrow }); break;
      case "release-milestone": runJob("release-milestone", { id: el.getAttribute("data-id") }); break;
      case "send-message":
        if (!state.chat.draft.trim()) break;
        runJob("send-message", { conv: state.chat.active, text: state.chat.draft.trim() }); break;
      default: break;
    }
  });

  document.addEventListener("input", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const a = el.getAttribute("data-action");
    if (a === "form-input") {
      const field = el.getAttribute("data-field");
      const [f,k] = field.split(".");
      if (state.forms[f]) state.forms[f][k] = el.value;
    } else if (a === "dir-search") {
      state.dir.query = el.value;
      const caret = el.selectionStart; render();
      const ni = document.querySelector('[data-action="dir-search"]'); if (ni){ ni.focus(); try{ni.setSelectionRange(caret,caret);}catch(_){} }
    } else if (a === "palette-input") {
      state.palette.query = el.value;
      const caret = el.selectionStart; renderPalette();
      const ni = $("#paletteInput"); if (ni){ ni.focus(); try{ni.setSelectionRange(caret,caret);}catch(_){} }
    } else if (a === "chat-draft") {
      state.chat.draft = el.value;
      const btn = document.querySelector('[data-action="send-message"]');
      if (btn) btn.disabled = !el.value.trim();
      if (el.value.trim() && state.ui.phase==="idle") setPhase("composing");
      if (!el.value.trim() && state.ui.phase==="composing") setPhase("idle");
    }
  });

  document.addEventListener("keydown", (e) => {
    // ⌘K / Ctrl+K command palette
    if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) { e.preventDefault(); dispatch("OPEN_PALETTE"); setTimeout(()=>{const i=$("#paletteInput"); if(i) i.focus();}, 30); return; }
    if (e.key === "Escape") { if (state.ui.palette) dispatch("CLOSE_PALETTE"); else if (state.ui.phase==="source_open") dispatch("CLOSE_SOURCE"); return; }
    const el = e.target.closest && e.target.closest('[data-action="chat-draft"]');
    if (el && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (state.chat.draft.trim()) runJob("send-message", { conv: state.chat.active, text: state.chat.draft.trim() }); }
  });

  window.addEventListener("offline", () => dispatch("NETWORK_OFFLINE"));
  window.addEventListener("online", () => dispatch("NETWORK_ONLINE"));
  window.addEventListener("hashchange", routeFromHash);
  window.addEventListener("resize", () => render());
}

/* --------------------------------------------------------- ROUTER */
const VALID = NAV.map(n=>n.route);
function routeFromHash() {
  const r = (location.hash || "#/home").replace(/^#\/?/, "") || "home";
  const route = VALID.includes(r) ? r : "home";
  dispatch("NAVIGATE", { route });
  if (state._sidebar) dispatch("CLOSE_SIDEBAR");
  window.scrollTo({top:0, behavior:"auto"});
}

/* --------------------------------------------------------- BOOT */
function boot() {
  bindOnce();
  dispatch("BOOT");      // builds mock, sets idle (no blocking splash)
  routeFromHash();       // first paint = home content
  render();
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

})();
</script>
