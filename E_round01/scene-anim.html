<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DITHER486 — SUNSET DRIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --rust:#b5471f; --salmon:#e8845b; --maroon:#3a141a; --peach:#f2c79a;
    --teal:#1f8a82; --teal-dk:#0e4a48; --dgreen:#16302a;
    --ink:#1a0d10; --paper:#f2c79a; --amber:#f0b15c;
    --bezel:#241318; --bezel-hi:#3c2026;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; background:#100608; overflow:hidden;
    font-family:'VT323',monospace;
    -webkit-font-smoothing:none; image-rendering:pixelated;}
  body{display:flex; align-items:center; justify-content:center;
    color:var(--paper);
    background:
      radial-gradient(120% 90% at 50% 10%, #1c0c10 0%, #0a0406 70%);
  }

  /* ====== monitor bezel ====== */
  #shell{
    position:relative;
    width:min(96vw, calc(96vh * 1.5));
    height:min(96vh, calc(96vw / 1.5));
    aspect-ratio:3/2;
    background:linear-gradient(160deg,#3a2026,#1c1014 60%,#120a0c);
    border-radius:14px;
    padding:clamp(8px,1.6vmin,20px);
    box-shadow:
      0 0 0 2px #060304,
      0 18px 50px rgba(0,0,0,.7),
      inset 0 2px 0 rgba(255,180,140,.10),
      inset 0 -3px 8px rgba(0,0,0,.6);
  }
  #screen{
    position:relative; width:100%; height:100%;
    border-radius:8px; overflow:hidden;
    background:#1a0c10;
    box-shadow:inset 0 0 0 2px #050203, inset 0 0 40px rgba(0,0,0,.55);
  }

  /* main dithered canvas fills screen */
  #view{position:absolute; inset:0; width:100%; height:100%;
    image-rendering:pixelated; display:block;}

  /* CRT overlays */
  #scan{position:absolute; inset:0; pointer-events:none; z-index:6;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,.16) 3px, rgba(0,0,0,.16) 3px);
    mix-blend-mode:multiply; opacity:1; transition:opacity .2s;}
  #vig{position:absolute; inset:0; pointer-events:none; z-index:7;
    background:radial-gradient(120% 120% at 50% 50%,
      rgba(0,0,0,0) 58%, rgba(0,0,0,.45) 100%);}
  #shell.flat #scan{opacity:0}

  /* ====== HUD chrome ====== */
  .chip{
    position:absolute; z-index:10;
    background:linear-gradient(180deg,var(--teal),var(--teal-dk));
    border:2px solid #0a3634;
    border-radius:9px;
    box-shadow:0 3px 0 #062523, 0 6px 10px rgba(0,0,0,.4),
      inset 0 1px 0 rgba(180,255,250,.35);
    color:#eafffb;
  }
  .chip .ttl{font-family:'Press Start 2P',monospace;
    font-size:clamp(6px,1.05vmin,10px); letter-spacing:1px;
    color:#bff8f0; text-shadow:0 1px 0 #06302e;}

  /* CONTROL chip top-right */
  #ctl{top:clamp(8px,1.6vmin,18px); right:clamp(8px,1.6vmin,18px);
    padding:clamp(7px,1.2vmin,12px) clamp(9px,1.4vmin,14px);
    min-width:clamp(118px,17vmin,180px);}
  #ctl .row{display:flex; align-items:center; gap:8px; justify-content:space-between;}
  #ctl .hdr{display:flex; align-items:center; gap:7px; margin-bottom:7px;}
  #ctl .led{width:9px; height:9px; border-radius:50%;
    background:var(--amber); box-shadow:0 0 6px var(--amber), inset 0 0 0 1px #6e3c0d;
    animation:blink 1.6s steps(2) infinite;}
  @keyframes blink{50%{opacity:.35}}
  .pbtn{
    font-family:'VT323',monospace; font-size:clamp(12px,1.9vmin,18px);
    line-height:1; cursor:pointer; user-select:none;
    background:linear-gradient(180deg,#f0b15c,#b5471f);
    color:#2a0f06; border:2px solid #5a1d09;
    border-radius:6px; padding:4px 8px;
    box-shadow:0 2px 0 #3a1206, inset 0 1px 0 rgba(255,230,190,.5);
    text-transform:uppercase; letter-spacing:1px;}
  .pbtn:active{transform:translateY(2px); box-shadow:0 0 0 #3a1206, inset 0 1px 0 rgba(255,230,190,.5)}
  .pbtn[aria-pressed="true"]{background:linear-gradient(180deg,#6ad6cc,#1f8a82); color:#062b29; border-color:#0a3634;}
  #ctl .clock{font-family:'Press Start 2P',monospace;
    font-size:clamp(8px,1.5vmin,13px); color:#fff2dd;
    text-shadow:0 1px 0 #06302e; letter-spacing:0;}
  #ctl .phase{font-size:clamp(11px,1.7vmin,16px); color:#bff8f0; letter-spacing:1px;}

  /* slider chip bottom */
  #bar{left:50%; transform:translateX(-50%);
    bottom:clamp(8px,1.8vmin,20px);
    padding:clamp(7px,1.2vmin,11px) clamp(12px,1.8vmin,18px);
    display:flex; align-items:center; gap:clamp(8px,1.4vmin,14px);
    width:min(72%, 560px);}
  #bar .lab{font-family:'Press Start 2P',monospace;
    font-size:clamp(6px,1vmin,9px); color:#bff8f0; white-space:nowrap;}
  input[type=range]{-webkit-appearance:none; appearance:none;
    flex:1; height:14px; background:transparent; cursor:pointer;}
  input[type=range]::-webkit-slider-runnable-track{
    height:10px; border-radius:3px;
    background:linear-gradient(90deg,#3a141a,#b5471f 35%,#f0b15c 55%,#1f8a82 100%);
    border:2px solid #07302e;}
  input[type=range]::-moz-range-track{height:10px; border-radius:3px;
    background:linear-gradient(90deg,#3a141a,#b5471f 35%,#f0b15c 55%,#1f8a82 100%);
    border:2px solid #07302e;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none;
    width:14px; height:22px; margin-top:-8px; border-radius:3px;
    background:linear-gradient(180deg,#f2c79a,#b5471f);
    border:2px solid #2a0f06; box-shadow:0 0 0 1px #f0b15c, 0 2px 4px rgba(0,0,0,.5);}
  input[type=range]::-moz-range-thumb{width:14px; height:22px; border-radius:3px;
    background:linear-gradient(180deg,#f2c79a,#b5471f);
    border:2px solid #2a0f06;}

  /* title plate top-left */
  #title{top:clamp(8px,1.6vmin,18px); left:clamp(8px,1.6vmin,18px);
    padding:clamp(6px,1.1vmin,11px) clamp(9px,1.4vmin,14px);
    background:linear-gradient(180deg,#2a1014,#160a0c);
    border:2px solid #5a1d09; border-radius:9px;
    box-shadow:0 3px 0 #0c0506, inset 0 1px 0 rgba(255,160,120,.2);}
  #title .big{font-family:'Press Start 2P',monospace;
    font-size:clamp(7px,1.25vmin,12px); color:var(--salmon);
    letter-spacing:1px; text-shadow:1px 1px 0 #3a141a;}
  #title .sub{font-family:'VT323',monospace;
    font-size:clamp(11px,1.7vmin,16px); color:var(--peach);
    letter-spacing:3px; margin-top:3px;}

  .fxbtn{font-family:'Press Start 2P',monospace; font-size:clamp(5px,.95vmin,9px);
    letter-spacing:1px;}

  /* boot flicker (non-blocking, the scene shows underneath immediately) */
  @keyframes bootflick{0%{opacity:.0}8%{opacity:.5}10%{opacity:0}12%{opacity:.7}14%{opacity:0}100%{opacity:0}}
  #boot{position:absolute; inset:0; background:#0a0406; z-index:8;
    pointer-events:none; animation:bootflick 1.1s ease-out forwards;}

  @media (max-width:560px){
    #ctl{min-width:108px;}
    #bar{width:86%;}
    #title .sub{letter-spacing:2px;}
  }
</style>
</head>
<body>
  <div id="shell">
    <div id="screen">
      <canvas id="view"></canvas>
      <div id="boot"></div>
      <div id="scan"></div>
      <div id="vig"></div>

      <div id="title" class="chip" style="background:none;">
        <div class="big">DITHER&nbsp;486</div>
        <div class="sub">SUNSET&nbsp;DRIVE</div>
      </div>

      <div id="ctl" class="chip">
        <div class="hdr">
          <span class="led"></span>
          <span class="ttl">CONTROL</span>
        </div>
        <div class="row" style="margin-bottom:6px;">
          <span class="clock" id="clock">06:00</span>
          <span class="phase" id="phase">DAWN</span>
        </div>
        <div class="row" style="gap:6px;">
          <button class="pbtn" id="play" aria-pressed="true">►&nbsp;AUTO</button>
          <button class="pbtn fxbtn" id="crt" aria-pressed="true">CRT</button>
        </div>
      </div>

      <div id="bar" class="chip">
        <span class="lab" id="dawnlab">DAWN</span>
        <input type="range" id="time" min="0" max="1000" value="250">
        <span class="lab" id="nitelab">NIGHT</span>
      </div>
    </div>
  </div>

<script>
(()=>{
"use strict";
/* ============================================================
   DITHER486 — procedural parallax landscape, true ordered
   (Bayer 8x8) dithering quantized to a fixed retro palette.
   Day cycle: dawn -> day -> dusk -> night, sun/moon orbit.
   ============================================================ */

const view = document.getElementById('view');
const vctx = view.getContext('2d');
vctx.imageSmoothingEnabled = false;

/* Offscreen low-res buffer that we draw the smooth scene into. */
const buf = document.createElement('canvas');
const bctx = buf.getContext('2d', {willReadFrequently:true});

/* ---- fixed limited palette (486 / VGA-ish sunset) ----
   ~14 colors: rust orange, salmon, deep maroon, peach,
   teal + dark green accents, plus a few sky/water steps. */
const PAL = [
  [ 22, 10, 14],  // near-black maroon
  [ 58, 20, 26],  // deep maroon
  [ 96, 30, 30],  // brick
  [181, 71, 31],  // rust orange
  [224,108, 64],  // burnt salmon
  [232,132, 91],  // salmon
  [240,177, 92],  // amber
  [242,199,154],  // peach
  [252,230,196],  // pale highlight
  [ 14, 74, 72],  // teal dark
  [ 31,138,130],  // teal
  [ 22, 48, 42],  // dark green
  [ 46, 92, 78],  // moss
  [ 38, 26, 60],  // night indigo
];
/* flatten for speed */
const PR=new Float64Array(PAL.length),PG=new Float64Array(PAL.length),PB=new Float64Array(PAL.length);
for(let i=0;i<PAL.length;i++){PR[i]=PAL[i][0];PG[i]=PAL[i][1];PB[i]=PAL[i][2];}

/* nearest palette index (squared distance) */
function nearest(r,g,b){
  let bi=0,bd=1e12;
  for(let i=0;i<PAL.length;i++){
    const dr=r-PR[i],dg=g-PG[i],db=b-PB[i];
    const d=dr*dr+dg*dg+db*db;
    if(d<bd){bd=d;bi=i;}
  }
  return bi;
}

/* Bayer 8x8 ordered-dither matrix, normalized to [-0.5,0.5) */
const BAYER8 = (()=>{
  const m=[
    [ 0,32, 8,40, 2,34,10,42],
    [48,16,56,24,50,18,58,26],
    [12,44, 4,36,14,46, 6,38],
    [60,28,52,20,62,30,54,22],
    [ 3,35,11,43, 1,33, 9,41],
    [51,19,59,27,49,17,57,25],
    [15,47, 7,39,13,45, 5,37],
    [63,31,55,23,61,29,53,21]];
  const out=new Float64Array(64);
  for(let y=0;y<8;y++)for(let x=0;x<8;x++) out[y*8+x]=(m[y][x]+0.5)/64 - 0.5;
  return out;
})();

/* internal render resolution — chunky like a 320x200 VGA buffer.
   We keep it low so dither dots read big when scaled up. */
let LW=320, LH=Math.round(320/1.5); // 320x213
function sizeBuffers(){
  const r = view.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  // display canvas: device-pixel for crisp nearest-neighbor blocks
  view.width  = Math.max(2, Math.round(r.width));
  view.height = Math.max(2, Math.round(r.height));
  vctx.imageSmoothingEnabled=false;
  // pick low-res keeping aspect ~ screen, capped for performance
  const aspect = r.width/r.height;
  LW = 320;
  LH = Math.max(80, Math.round(LW/aspect));
  buf.width=LW; buf.height=LH;
  bctx.imageSmoothingEnabled=true;
}

/* ---------- color helpers for smooth scene ---------- */
function lerp(a,b,t){return a+(b-a)*t;}
function mix(c1,c2,t){return [lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)];}
function rgb(c){return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;}

/* keyframe palette per time-of-day (t 0..1 over the loop) */
/* phases: 0 dawn, .28 day, .55 dusk, .8 night, 1 -> dawn */
const SKY = {
  // [topColor, midColor, horizonColor]
  dawn: [[58,28,52],[181,71,31],[242,199,154]],
  day:  [[18,108,118],[60,160,158],[242,210,170]],
  dusk: [[58,20,46],[181,60,40],[240,140,80]],
  night:[[10,8,26],[22,16,46],[58,30,60]],
};
function phaseColors(t){
  // build piecewise across dawn->day->dusk->night->dawn
  const stops=[
    {p:0.00,k:SKY.dawn},
    {p:0.26,k:SKY.day},
    {p:0.52,k:SKY.dusk},
    {p:0.74,k:SKY.night},
    {p:1.00,k:SKY.dawn},
  ];
  let a=stops[0],b=stops[1];
  for(let i=0;i<stops.length-1;i++){
    if(t>=stops[i].p && t<=stops[i+1].p){a=stops[i];b=stops[i+1];break;}
  }
  const lt=(t-a.p)/Math.max(1e-6,(b.p-a.p));
  return [mix(a.k[0],b.k[0],lt),mix(a.k[1],b.k[1],lt),mix(a.k[2],b.k[2],lt)];
}

/* deterministic star field */
const STARS=[];
for(let i=0;i<90;i++){STARS.push({x:Math.random(),y:Math.random()*0.55,s:Math.random()});}

/* twinkle towns reflection points */
const TOWN=[];
for(let i=0;i<26;i++){TOWN.push({x:Math.random(),h:0.4+Math.random()*1.6,w:1+Math.random()*2});}

let phaseName='DAWN';

/* ---------- draw the smooth scene at low res ---------- */
function drawScene(t){
  const W=LW,H=LH;
  const horizon=H*0.62;
  const [top,midC,hor]=phaseColors(t);

  // sun/moon angle. sun rides 0..0.55 (day), moon 0.5..1
  const dayAmt = Math.max(0, Math.cos((t-0.26)*Math.PI*2)*0.5+0.5); // bright midday
  // sun arc: appears dawn->dusk
  const sunPhase = t; // 0..1
  const arc = (ph)=>{
    const a = ph*Math.PI; // 0..pi across screen
    return {x: W*(0.12+ph*0.76), y: horizon - Math.sin(a)*H*0.5};
  };

  // sky gradient
  const g=bctx.createLinearGradient(0,0,0,horizon);
  g.addColorStop(0,rgb(top));
  g.addColorStop(0.55,rgb(midC));
  g.addColorStop(1,rgb(hor));
  bctx.fillStyle=g; bctx.fillRect(0,0,W,horizon);

  // stars at night (fade with how dark it is)
  const darkness = Math.max(0, (top[0]+top[1]+top[2])<120 ? 1 : 0) ;
  const nightF = Math.max(0, Math.min(1, (1.0 - (top[1])/90))); // greenish midband low at night
  if(nightF>0.05){
    for(const s of STARS){
      const tw=0.5+0.5*Math.sin((t*40)+s.s*30);
      bctx.fillStyle=`rgba(252,230,196,${(0.25+0.6*tw)*nightF})`;
      bctx.fillRect((s.x*W)|0,(s.y*horizon)|0,1,1);
    }
  }

  // celestial body — sun in warm half, moon in cool half
  const isMoon = (t>0.55 || t<0.04);
  const body = isMoon ? arc((t<0.04? t+ (1-0.55) : (t-0.55))/0.49) : arc((t)/0.55);
  // clamp on screen
  body.x=Math.max(W*0.08,Math.min(W*0.92,body.x));
  // glow
  const gr=bctx.createRadialGradient(body.x,body.y,1,body.x,body.y,H*0.4);
  if(isMoon){
    gr.addColorStop(0,'rgba(242,230,210,0.55)');
    gr.addColorStop(0.3,'rgba(120,140,170,0.20)');
    gr.addColorStop(1,'rgba(120,140,170,0)');
  }else{
    gr.addColorStop(0,'rgba(252,236,200,0.85)');
    gr.addColorStop(0.25,'rgba(240,150,70,0.45)');
    gr.addColorStop(1,'rgba(240,150,70,0)');
  }
  bctx.fillStyle=gr; bctx.fillRect(0,0,W,horizon+10);
  // disc
  const rad=H*0.055;
  bctx.beginPath(); bctx.arc(body.x,body.y,rad,0,7);
  bctx.fillStyle = isMoon? '#f2e6d2':'#fce6c4'; bctx.fill();
  if(isMoon){ // crater shadow
    bctx.beginPath(); bctx.arc(body.x+rad*0.35,body.y-rad*0.2,rad*0.85,0,7);
    bctx.fillStyle=rgb(top); bctx.fill();
  }

  // ---- distant mountains (parallax layer 3) ----
  const mtFar = mix(midC,[58,20,26],0.55);
  ridge(bctx, horizon, H*0.18, 0.018, t*8, mtFar, W, 7);
  // ---- mid hills (layer 2) ----
  const mtMid = mix([96,30,30],[58,20,26], 0.4+0.3*nightF);
  ridge(bctx, horizon+H*0.02, H*0.12, 0.04, t*22+50, mtMid, W, 11);

  // ---- water ----
  const wTop = mix(hor,midC,0.4);
  const wBot = mix([58,20,26],[22,10,14],0.6);
  const wg=bctx.createLinearGradient(0,horizon,0,H);
  wg.addColorStop(0,rgb(mix(wTop,[240,150,70], isMoon?0:0.3)));
  wg.addColorStop(1,rgb(wBot));
  bctx.fillStyle=wg; bctx.fillRect(0,horizon,W,H-horizon);

  // sun/moon reflection column on water (shimmer)
  for(let y=horizon|0; y<H; y++){
    const dy=(y-horizon)/(H-horizon);
    const wob=Math.sin((y*0.6)+(t*30))*(2+dy*6);
    const wWidth = 3+dy*12;
    bctx.globalAlpha = (1-dy)*0.7;
    bctx.fillStyle = isMoon? 'rgba(220,225,235,0.5)':'rgba(252,220,150,0.65)';
    bctx.fillRect((body.x+wob-wWidth/2)|0, y, wWidth|0, 1);
  }
  bctx.globalAlpha=1;

  // horizontal water bands for dithered ripple feel
  bctx.globalAlpha=0.18;
  for(let y=horizon|0; y<H; y+=2){
    bctx.fillStyle = (y%4===0)? rgb(wTop):rgb(wBot);
    bctx.fillRect(0,y,W,1);
  }
  bctx.globalAlpha=1;

  // ---- foreground bridge silhouette (the hero, layer 1) ----
  drawBridge(bctx, W, H, horizon, t, isMoon, nightF);

  // town lights reflection at dusk/night
  if(nightF>0.3){
    for(const c of TOWN){
      const lx=c.x*W, ly=horizon-1;
      bctx.fillStyle=`rgba(240,177,92,${0.5+0.4*Math.sin(t*50+c.x*40)})`;
      bctx.fillRect(lx|0, (ly-c.h)|0, c.w|0, c.h|0);
      // water reflection
      bctx.fillStyle=`rgba(240,150,70,${0.25})`;
      bctx.fillRect(lx|0, (horizon+2)|0, c.w|0, (c.h*1.4)|0);
    }
  }

  // phase name for HUD
  if(t<0.22) phaseName='DAWN';
  else if(t<0.5) phaseName='DAY';
  else if(t<0.72) phaseName='DUSK';
  else phaseName='NIGHT';
}

/* layered ridge generator (procedural mountains) */
function ridge(ctx, baseY, amp, freq, seed, color, W, oct){
  ctx.fillStyle=rgb(color);
  ctx.beginPath();
  ctx.moveTo(0,baseY);
  for(let x=0;x<=W;x++){
    let y=baseY;
    let f=freq, a=amp;
    for(let o=0;o<3;o++){
      y -= Math.sin(x*f + seed + o*2.1)*a;
      f*=2.1; a*=0.5;
    }
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,baseY+amp*4); ctx.lineTo(0,baseY+amp*4);
  ctx.closePath(); ctx.fill();
}

/* hero suspension bridge silhouette + animated cars */
function drawBridge(ctx, W, H, horizon, t, isMoon, nightF){
  const deckY = horizon - H*0.02;
  const towerColor = mix([96,30,30],[22,10,14], 0.3+0.4*nightF);
  const col = rgb(towerColor);
  ctx.fillStyle=col; ctx.strokeStyle=col;
  // two towers
  const tx=[W*0.28, W*0.72];
  const topY = horizon - H*0.34;
  const baseY = H*0.92;
  ctx.lineWidth=Math.max(2,W*0.012);
  for(const x of tx){
    // legs
    ctx.fillRect((x-W*0.012)|0, topY|0, (W*0.008)|0, (baseY-topY)|0);
    ctx.fillRect((x+W*0.004)|0, topY|0, (W*0.008)|0, (baseY-topY)|0);
    // crossbeams
    for(let i=0;i<4;i++){
      const yy=topY + (deckY-topY)*0.15 + i*((deckY-topY)*0.22);
      ctx.fillRect((x-W*0.014)|0, yy|0, (W*0.03)|0, 2);
    }
  }
  // main suspension cables (catenary)
  ctx.lineWidth=Math.max(1.5,W*0.006);
  ctx.beginPath();
  for(let x=W*0.06;x<=W*0.94;x++){
    let y;
    if(x<tx[0]) y=lerp(deckY+H*0.02, topY, (x-W*0.06)/(tx[0]-W*0.06));
    else if(x<tx[1]){
      const u=(x-tx[0])/(tx[1]-tx[0]);
      y=topY + Math.sin(u*Math.PI)*H*0.12; // sag down
    } else y=lerp(topY, deckY+H*0.02, (x-tx[1])/(W*0.94-tx[1]));
    if(x===((W*0.06)|0)) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  // vertical hangers
  ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=W*0.1;x<W*0.9;x+=W*0.03){
    let cy;
    if(x<tx[0]) cy=lerp(deckY+H*0.02, topY,(x-W*0.06)/(tx[0]-W*0.06));
    else if(x<tx[1]){const u=(x-tx[0])/(tx[1]-tx[0]); cy=topY+Math.sin(u*Math.PI)*H*0.12;}
    else cy=lerp(topY, deckY+H*0.02,(x-tx[1])/(W*0.94-tx[1]));
    ctx.moveTo(x,cy); ctx.lineTo(x,deckY);
  }
  ctx.stroke();
  // deck
  ctx.fillStyle=rgb(mix(towerColor,[22,10,14],0.3));
  ctx.fillRect(0,deckY|0, W, Math.max(2,(H*0.018)|0));

  // animated headlights crossing the deck
  ctx.save();
  const carCount=5;
  for(let i=0;i<carCount;i++){
    const speed=(i%2? 1:-1);
    const prog=((t*1.4*60 + i*0.21)%1);
    const cx = speed>0 ? prog*W : (1-prog)*W;
    const cy = deckY-1;
    // light beam
    ctx.fillStyle = speed>0? 'rgba(252,236,200,0.9)':'rgba(232,90,60,0.9)';
    ctx.fillRect(cx|0, cy|0, 2,2);
    ctx.fillStyle = speed>0? 'rgba(252,236,200,0.25)':'rgba(232,90,60,0.25)';
    ctx.fillRect((cx + (speed>0? 2:-6))|0, cy|0, 4,1);
  }
  ctx.restore();
}

/* ---------- the dither pass ---------- */
function dither(){
  const W=LW,H=LH;
  const img=bctx.getImageData(0,0,W,H);
  const d=img.data;
  // dither strength — spreads quantization across the bayer cell
  const S=40; // in 0..255 color space
  for(let y=0;y<H;y++){
    const by=(y&7)*8;
    for(let x=0;x<W;x++){
      const i=(y*W+x)<<2;
      const thr=BAYER8[by+(x&7)]*S;
      const idx=nearest(d[i]+thr, d[i+1]+thr, d[i+2]+thr);
      d[i]  =PR[idx];
      d[i+1]=PG[idx];
      d[i+2]=PB[idx];
    }
  }
  bctx.putImageData(img,0,0);
  // blit scaled up with nearest neighbor to the visible canvas
  vctx.imageSmoothingEnabled=false;
  vctx.clearRect(0,0,view.width,view.height);
  vctx.drawImage(buf,0,0,W,H,0,0,view.width,view.height);
}

/* ---------- time / loop control ---------- */
const slider=document.getElementById('time');
const clockEl=document.getElementById('clock');
const phaseEl=document.getElementById('phase');
const playBtn=document.getElementById('play');
const crtBtn=document.getElementById('crt');
const shell=document.getElementById('shell');

let auto=true, T=0.10, last=performance.now();

playBtn.addEventListener('click',()=>{auto=!auto; playBtn.setAttribute('aria-pressed',auto);
  playBtn.textContent = auto? '► AUTO':'❚❚ HOLD';});
crtBtn.addEventListener('click',()=>{
  const on = shell.classList.toggle('flat')===false;
  crtBtn.setAttribute('aria-pressed', on);
});
slider.addEventListener('input',()=>{auto=false; playBtn.setAttribute('aria-pressed',false);
  playBtn.textContent='❚❚ HOLD'; T=+slider.value/1000;});

function fmtClock(t){
  // map loop 0..1 to 04:00 .. 28:00(=04:00) so dawn starts ~5h
  const hours=(t*24+4)%24;
  const h=Math.floor(hours), m=Math.floor((hours-h)*60);
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

let acc=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(auto){ T=(T+dt*0.045)%1; slider.value=(T*1000)|0; }
  drawScene(T);
  dither();
  clockEl.textContent=fmtClock(T);
  phaseEl.textContent=phaseName;
  requestAnimationFrame(frame);
}

let rT;
window.addEventListener('resize',()=>{clearTimeout(rT); rT=setTimeout(sizeBuffers,120);});
sizeBuffers();
requestAnimationFrame(frame);
})();
</script>
