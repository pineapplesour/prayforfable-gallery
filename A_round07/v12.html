<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>ORISOLVE — 종이접기의 호흡</title>
<style>
  :root{ --bg0:#07080d; --ink:#e9eef7; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased;cursor:crosshair}
  #stage{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* ---- HUD ---- */
  .hud{position:fixed;z-index:6;pointer-events:none;user-select:none}
  #title{left:max(20px,3.4vw);top:max(18px,3vh)}
  #title h1{font-size:clamp(15px,1.5vw,22px);font-weight:700;letter-spacing:.42em;
    text-transform:uppercase;opacity:.92}
  #title .sub{margin-top:7px;font-size:clamp(9px,.82vw,12px);letter-spacing:.32em;
    opacity:.42;font-weight:300}
  #title .ko{margin-top:3px;font-size:clamp(9px,.8vw,12px);letter-spacing:.2em;opacity:.34;font-weight:300}
  #legend{right:max(20px,3.4vw);top:max(18px,3vh);text-align:right;font-size:clamp(8px,.74vw,11px);
    letter-spacing:.16em;line-height:2;opacity:.5;font-weight:300}
  #legend b{font-weight:600;opacity:.85}
  #legend .m{color:#ff8d6b}.l{color:#7cc7ff}
  #hint{left:0;right:0;bottom:max(16px,2.6vh);text-align:center;font-size:clamp(9px,.82vw,12px);
    letter-spacing:.26em;opacity:.0;font-weight:300;transition:opacity 1.1s ease}
  #hint.on{opacity:.5}
  /* phase readout */
  #phase{right:max(20px,3.4vw);bottom:max(16px,2.6vh);text-align:right;font-weight:300}
  #phase .big{font-size:clamp(26px,3.4vw,52px);letter-spacing:.04em;font-variant-numeric:tabular-nums;
    line-height:1;opacity:.9}
  #phase .lab{font-size:clamp(8px,.72vw,11px);letter-spacing:.3em;opacity:.4;margin-top:5px}
  #form{left:max(20px,3.4vw);bottom:max(16px,2.6vh);font-weight:300}
  #form .nm{font-size:clamp(13px,1.5vw,22px);letter-spacing:.24em;opacity:.85}
  #form .lab{font-size:clamp(8px,.72vw,11px);letter-spacing:.3em;opacity:.4;margin-top:5px}
  @media (max-width:520px){
    #legend{display:none}
    #title h1{letter-spacing:.3em}
    #hint{bottom:max(58px,9vh)}
    #phase .big{font-size:30px}
    #form .nm{font-size:16px}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="paper"></canvas>
</div>

<div class="hud" id="title">
  <h1>ORISOLVE</h1>
  <div class="sub">A BREATHING CREASE PATTERN</div>
  <div class="ko">접고 펴는 한 장의 호흡</div>
</div>
<div class="hud" id="legend">
  <div><span class="m">━━</span> <b>산접기</b> mountain</div>
  <div><span class="l">┄┄</span> <b>골접기</b> valley</div>
  <div style="margin-top:8px;opacity:.7">DRAG&nbsp;회전 · WHEEL&nbsp;줌</div>
  <div style="opacity:.7">CLICK&nbsp;형태전환 · SPACE&nbsp;정지</div>
</div>
<div class="hud" id="form"><div class="nm" id="formName">SQUARE</div><div class="lab">CURRENT FORM</div></div>
<div class="hud" id="phase"><div class="big" id="phaseNum">0.00</div><div class="lab">FOLD PHASE</div></div>
<div class="hud" id="hint">움직여 보세요 · 클릭으로 다른 종이를 접습니다</div>

<script>
"use strict";
/* =====================================================================
   ORISOLVE — single-file generative origami.
   Hand-rolled 3D: each "model" is a flat sheet whose vertices fold along
   a crease hierarchy. We interpolate fold angles over a phase 0->1->0 so
   the paper continuously folds into a form and unfolds back to flat,
   then morphs to the next form. Painter's-algorithm canvas2D render with
   per-face lambert+rim lighting and a subtle paper grain.
   ===================================================================== */

const cvs = document.getElementById('paper');
const ctx = cvs.getContext('2d', { alpha:false });
let W=0,H=0,DPR=1,CX=0,CY=0;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W*DPR); cvs.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX = W/2; CY = H/2;
}
window.addEventListener('resize', resize); resize();

/* ---------- vector helpers ---------- */
const V = (x,y,z)=>({x,y,z});
const sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z);
const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z);
const scl=(a,s)=>V(a.x*s,a.y*s,a.z*s);
const dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const cross=(a,b)=>V(a.y*b.z-a.z*b.y, a.z*b.x-a.x*b.z, a.x*b.y-a.y*b.x);
const len=a=>Math.hypot(a.x,a.y,a.z);
const norm=a=>{const l=len(a)||1;return V(a.x/l,a.y/l,a.z/l);};

/* rotate point p around axis through point o, unit dir d, angle ang (Rodrigues) */
function rotAxis(p,o,d,ang){
  const v=sub(p,o), c=Math.cos(ang), s=Math.sin(ang);
  const term1=scl(v,c);
  const term2=scl(cross(d,v),s);
  const term3=scl(d,dot(d,v)*(1-c));
  return add(o, add(add(term1,term2),term3));
}

/* =====================================================================
   MODEL DEFINITION
   A model = list of vertices (flat sheet coords on XY plane, z=0) +
   faces (vertex index loops) + an ordered list of fold creases.
   Each crease: {a,b (point indices on hinge line), affects: set of vertex
   indices that move, dir:+1/-1 mountain/valley, target:angle, sub:[child creases]}.
   We apply creases as a tree: rotating a parent moves its children's hinge.
   To keep it robust we resolve everything analytically each frame given a
   global fold parameter f in [0,1].
   ===================================================================== */

/* Build a generic sheet grid so we always have visible facets even at flat.
   But each named form supplies its own crease program. We model 4 forms,
   each as a procedural fold tree over a unit square centered at origin. */

const S = 1.0; // half-size of square -> square spans [-1,1]

// utility: classify which side of a directed line (in flat XY) a point is on
function sideOfLine(px,py, ax,ay, bx,by){
  return (bx-ax)*(py-ay)-(by-ay)*(px-ax);
}

/* Each form provides:
   verts: flat XY positions (array of {x,y})
   faces: index loops (for shading)
   creases: ordered [{ax,ay,bx,by, sel:(x,y)=>bool, ang:radians, m:bool}]
            applied sequentially; sel picks flat-points to rotate; rotation
            about the (possibly already-transformed) hinge endpoints.
   We store hinge by indices into verts so transformed positions are used. */

function makeGrid(n){
  // n x n quad grid over [-1,1]^2
  const verts=[], idx=(i,j)=>i*(n+1)+j;
  for(let i=0;i<=n;i++)for(let j=0;j<=n;j++)
    verts.push({x:-1+2*j/n, y:-1+2*i/n});
  const faces=[];
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)
    faces.push([idx(i,j),idx(i,j+1),idx(i+1,j+1),idx(i+1,j)]);
  return {verts,faces};
}

/* ---- FORM 1: CRANE-ish bird base (diagonal preliminary fold) ----
   We use a fine grid and fold along the two diagonals + petal folds,
   creating a winged form. Selection-based rotation around grid hinge lines. */

function formCrane(){
  const g = makeGrid(12);
  // crease program: hinge lines defined by two flat anchor points (resolved to
  // nearest grid verts so transforms carry through), selection = flat predicate.
  const creases=[
    // 1. fold along main diagonal (mountain) -> lift one triangle
    {a:[-1,-1],b:[1,1], sel:(x,y)=> (x-y)>0.001, ang:1.55, m:true},
    // 2. valley fold the lifted triangle along anti-diagonal of its half
    {a:[0,-1],b:[1,0], sel:(x,y)=> (x-y)>0.001 && (x+y)>0.0, ang:-1.2, m:false},
    {a:[-1,0],b:[0,1], sel:(x,y)=> (x-y)<-0.001 && (x+y)>0.0, ang:1.2, m:true},
    // 3. neck/tail thin folds (the long spikes)
    {a:[-1,-1],b:[0.2,-0.2], sel:(x,y)=> (x+y)<-0.55 && (x-y)<0.0, ang:1.9, m:true},
    {a:[1,1],b:[-0.2,0.2], sel:(x,y)=> (x+y)>0.55 && (x-y)>0.0, ang:-1.9, m:false},
    // 4. wing droop
    {a:[-1,1],b:[1,-1], sel:(x,y)=> (x+y)>0.2, ang:0.5, m:true},
  ];
  return {g, creases, name:'CRANE'};
}

/* ---- FORM 2: WATERBOMB / accordion star ----
   radial accordion: alternate mountain/valley wedges folding up to a 3D star. */
function formStar(){
  const g = makeGrid(14);
  const creases=[];
  const N=8;
  for(let k=0;k<N;k++){
    const t0=k/N*Math.PI*2, t1=(k+0.5)/N*Math.PI*2;
    const ax=Math.cos(t0), ay=Math.sin(t0);
    creases.push({
      a:[0,0], b:[ax,ay],
      sel:(x,y)=>{
        const a=Math.atan2(y,x); let d=a-t0; while(d<0)d+=Math.PI*2; while(d>Math.PI*2)d-=Math.PI*2;
        return d>0 && d< (Math.PI*2/N);
      },
      ang: (k%2? 1.0:-1.0), m:(k%2===0)
    });
  }
  // central pinch to lift the star
  creases.push({a:[-1,0],b:[1,0], sel:(x,y)=> Math.hypot(x,y)<0.6, ang:0.9, m:true});
  return {g, creases, name:'STAR'};
}

/* ---- FORM 3: BOAT / fan accordion (parallel pleats) ---- */
function formFan(){
  const g = makeGrid(16);
  const creases=[];
  const N=10;
  for(let k=1;k<N;k++){
    const yx = -1 + 2*k/N;
    creases.push({
      a:[-1,yx], b:[1,yx],
      sel:(x,y)=> y> yx-0.0001,
      ang: (k%2? 1.0:-1.0)*1.25, m:(k%2===0)
    });
  }
  // give it a slight curl across
  creases.push({a:[-1,-1],b:[-1,1], sel:(x,y)=> x>-0.5, ang:0.35, m:true});
  return {g, creases, name:'FAN'};
}

/* ---- FORM 4: LOTUS / box pull (square twist) ---- */
function formLotus(){
  const g = makeGrid(14);
  const creases=[];
  // square twist: four mountain folds forming a rotated inner square + 4 valleys
  const r=0.5;
  const c=[[r,r],[-r,r],[-r,-r],[r,-r]];
  for(let k=0;k<4;k++){
    const p0=c[k], p1=c[(k+1)%4];
    creases.push({
      a:p0,b:p1,
      sel:(x,y)=> sideOfLine(x,y,p0[0],p0[1],p1[0],p1[1])>0 && Math.max(Math.abs(x),Math.abs(y))>r-0.02,
      ang:1.3, m:(k%2===0)
    });
  }
  // lift petals at corners
  const corners=[[1,1],[-1,1],[-1,-1],[1,-1]];
  corners.forEach((cc,k)=>{
    creases.push({
      a:[cc[0]*0.5,cc[1]*0.5], b:[cc[0]*0.5*0.0+ (k%2? cc[0]*0.5:-cc[0]*0.5), cc[1]*0.5],
      sel:(x,y)=> Math.sign(x)===Math.sign(cc[0]) && Math.sign(y)===Math.sign(cc[1]) && Math.hypot(x,y)>0.62,
      ang:1.1, m:(k%2===0)
    });
  });
  return {g, creases, name:'LOTUS'};
}

const FORMS = [formCrane(), formStar(), formFan(), formLotus()];
let formIdx = 0;

/* ---------- crease evaluation ----------
   Given a form and fold amount f in [0,1], produce 3D positions for each
   grid vertex. We apply creases sequentially. To carry hinge transforms,
   we resolve hinge endpoints by tracking the SAME selection logic: a hinge
   point's 3D position is computed by applying all *prior* creases to its
   flat anchor (treated as a virtual vertex). This keeps folds composable. */

function evalForm(form, f){
  const {g, creases} = form;
  // start: flat 3D
  const P = g.verts.map(v=>V(v.x, v.y, 0));
  // We also need to know each vertex's CURRENT flat-following membership.
  // Selection is on FLAT coords (stable), rotation applied to live 3D coords.
  // Track anchor points for hinges as virtual points folded the same way.
  const flat = g.verts;

  function applyCrease(cr, amount){
    // resolve hinge endpoints: fold the two anchor flat-points through all
    // creases applied so far that select them.
    const A = foldPoint(cr.a[0], cr.a[1], creases.indexOf(cr));
    const B = foldPoint(cr.b[0], cr.b[1], creases.indexOf(cr));
    const axis = norm(sub(B,A));
    const ang = cr.ang * amount * (cr.m? 1 : -1);
    for(let i=0;i<P.length;i++){
      if(cr.sel(flat[i].x, flat[i].y)){
        P[i] = rotAxis(P[i], A, axis, ang);
      }
    }
  }

  // helper: compute folded 3D position of an arbitrary flat point up to crease
  // index `upto` (exclusive). Used only for hinge anchors -> cheap.
  function foldPoint(fx,fy,upto){
    let p = V(fx,fy,0);
    for(let ci=0; ci<upto; ci++){
      const cr=creases[ci];
      if(cr.sel(fx,fy)){
        // hinge of this prior crease:
        const A = foldPoint(cr.a[0],cr.a[1],ci);
        const B = foldPoint(cr.b[0],cr.b[1],ci);
        const axis=norm(sub(B,A));
        const ang=cr.ang*foldAmtForCrease(ci)*(cr.m?1:-1);
        p = rotAxis(p,A,axis,ang);
      }
    }
    return p;
  }

  // each crease folds in a staggered window so it looks sequential & alive
  function foldAmtForCrease(ci){
    const n=creases.length;
    const start = ci/(n+1.5);
    const end   = start + 1/(n*0.75+1);
    let t=(f-start)/(end-start);
    t=Math.max(0,Math.min(1,t));
    return ease(t);
  }

  for(let ci=0; ci<creases.length; ci++){
    applyCrease(creases[ci], foldAmtForCrease(ci));
  }
  return P;
}
function ease(t){ return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

/* ---------- camera / interaction ---------- */
let rotX=-0.62, rotY=0.6, rotXT=-0.62, rotYT=0.6;
let zoom=1, zoomT=1;
let autoSpin=true, paused=false;
let lightDir = norm(V(-0.4,0.7,0.9));
let pointer={x:0,y:0,has:false,down:false,px:0,py:0,moved:0};

function project(p){
  // apply view rotation (Y then X), perspective, scale to screen
  let x=p.x, y=p.y, z=p.z;
  // rotate Y
  let cy=Math.cos(rotY),sy=Math.sin(rotY);
  let x1=x*cy + z*sy, z1=-x*sy + z*cy;
  // rotate X
  let cx=Math.cos(rotX),sx=Math.sin(rotX);
  let y1=y*cx - z1*sx, z2=y*sx + z1*cx;
  const baseScale = Math.min(W,H)*0.30*zoom;
  const persp = 4.2/(4.2 - z2*0.9);
  return {
    sx: CX + x1*baseScale*persp,
    sy: CY - y1*baseScale*persp,
    z: z2,
    p: V(x1,y1,z2) // view-space for normal/lighting
  };
}

/* ---------- render ---------- */
let lastForm=null, morphFrom=null, morphT=1;
let phaseShown=0;

function frame(t){
  requestAnimationFrame(frame);
  const time = t*0.001;

  // smooth camera
  if(autoSpin && !pointer.down) rotYT += 0.0026;
  rotX += (rotXT-rotX)*0.09;
  rotY += (rotYT-rotY)*0.09;
  zoom += (zoomT-zoom)*0.08;

  // breathing fold phase: 0->1->0 triangle-ish with ease, period ~ 9s
  let fp;
  if(!paused){ phaseClock += 0.0017; }
  const cyc = (phaseClock % 1);
  const tri = cyc<0.5 ? cyc*2 : (1-(cyc-0.5)*2);
  fp = ease(tri);
  phaseShown += (fp-phaseShown)*0.2;

  // form morphing: when crossing the flat point (phase near 0) advance form if queued
  if(cyc<0.02 && queuedForm!==null){
    formIdx = queuedForm; queuedForm=null;
    document.getElementById('formName').textContent = FORMS[formIdx].name;
  }

  const form = FORMS[formIdx];
  const P = evalForm(form, fp);

  // background — deep gradient + vignette
  paintBG(time);

  // ---- ground contact shadow (project verts onto a floor plane) ----
  drawContactShadow(P);

  // build faces with view-space data
  const faces = form.g.faces;
  const drawList=[];
  for(let fi=0; fi<faces.length; fi++){
    const loop = faces[fi];
    const proj = loop.map(i=>project(P[i]));
    const aV=proj[0].p, bV=proj[1].p, cV=proj[2].p;
    let nrm = norm(cross(sub(bV,aV), sub(cV,aV)));
    let zc=0; for(const q of proj) zc+=q.z; zc/=proj.length;
    // world-height of face centroid (for valley/mountain reading)
    let hz=0; for(const i of loop) hz+=P[i].z; hz/=loop.length;
    drawList.push({proj, nrm, zc, hz, fi, loop});
  }
  drawList.sort((a,b)=>a.zc-b.zc);

  const Lview = lightDir;
  const flatness = 1 - fp; // 1 when flat

  for(const d of drawList){
    const facing = d.nrm.z;             // >0 toward camera
    const front  = facing>=0;
    const ndl    = Math.abs(dot(d.nrm, Lview));
    // specular (Blinn-ish): halfway between light and view(+z)
    const half   = norm(V(Lview.x, Lview.y, Lview.z+1));
    const spec   = Math.pow(Math.max(0, Math.abs(dot(d.nrm, half))), 22)*0.9;
    // diffuse term, lifted so shadow side keeps paper translucency
    let lit = 0.22 + 0.78*Math.pow(ndl,1.1);
    const rim = Math.pow(1-Math.abs(facing),3.0)*0.6; // grazing edge glow

    let r,gc,b;
    if(front){
      // porcelain → cool indigo in shadow
      r = (236*lit) + rim*30  + spec*255;
      gc= (240*lit) + rim*55  + spec*255;
      b = (252*lit) + rim*120 + spec*255;
    }else{
      // underside: warm amber → rose, makes inverted folds pop
      r = (255*lit*0.99) + rim*60 + spec*255;
      gc= (171*lit*0.95) + rim*30 + spec*220;
      b = (126*lit*0.9 ) + rim*70 + spec*200;
    }
    // height tint: peaks catch a touch more warmth/light
    const hl = Math.max(0, d.hz)*26;
    r+=hl; gc+=hl*0.8; b+=hl*0.5;

    ctx.beginPath();
    ctx.moveTo(d.proj[0].sx, d.proj[0].sy);
    for(let k=1;k<d.proj.length;k++) ctx.lineTo(d.proj[k].sx, d.proj[k].sy);
    ctx.closePath();
    ctx.fillStyle = `rgb(${clamp(r)},${clamp(gc)},${clamp(b)})`;
    ctx.fill();

    // crease ink — printed pattern. Stronger when flat (reads as a crease map),
    // softer when folded (real geometry carries it). Mountain warm / valley cool.
    const inkA = (0.08 + 0.30*flatness) ;
    ctx.lineWidth = 0.55 + 0.5*flatness;
    ctx.strokeStyle = front
      ? `rgba(86,120,196,${inkA})`
      : `rgba(196,92,66,${inkA*1.1})`;
    ctx.stroke();
  }

  drawGlints(P, form, time);

  document.getElementById('phaseNum').textContent = phaseShown.toFixed(2);
}

// project a flat shadow of the model onto y = floor, blurred & dark
function drawContactShadow(P){
  // floor is below the form; we splat soft blobs from low vertices
  ctx.save();
  ctx.globalCompositeOperation='multiply';
  for(let i=0;i<P.length;i+=3){
    const sp = project(V(P[i].x, P[i].y, Math.min(P[i].z,0)-0.05));
    // fake floor: push downward in screen space proportionally to height above floor
    const drop = (P[i].z+1.2)*Math.min(W,H)*0.045;
    const x=sp.sx, y=sp.sy+drop;
    const rad = 16+ (1-Math.min(1,Math.abs(P[i].z)))*10;
    const g=ctx.createRadialGradient(x,y,0,x,y,rad);
    g.addColorStop(0,'rgba(0,0,0,0.16)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(x,y,rad,0,7); ctx.fill();
  }
  ctx.restore();
}

let phaseClock = 0.0;
let queuedForm = null;

function clamp(v){ return v<0?0:(v>255?255:v|0); }

function paintBG(time){
  const g = ctx.createRadialGradient(CX, CY*0.85, 40, CX, CY, Math.max(W,H)*0.85);
  g.addColorStop(0, '#10131e');
  g.addColorStop(0.5, '#0a0c14');
  g.addColorStop(1, '#05060a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // faint drifting paper-grain specks (cheap)
  ctx.save();
  ctx.globalAlpha=0.05;
  for(let i=0;i<26;i++){
    const a=i*2.39 + time*0.05;
    const rr=(i/26)*Math.max(W,H)*0.6;
    const x=CX+Math.cos(a)*rr, y=CY+Math.sin(a*1.3)*rr*0.7;
    ctx.fillStyle='#9fb4e0';
    ctx.fillRect(x,y,1.4,1.4);
  }
  ctx.restore();
}

function drawGlints(P, form, time){
  // soft specular sparkles at the highest, light-facing fold ridges
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const step = Math.max(1, (form.g.verts.length/70)|0);
  for(let i=0;i<P.length;i+=step){
    const up = P[i].z;
    if(up<0.06) continue;
    const pr = project(P[i]);
    const inten = Math.min(1, up*0.85);
    const r = 8+inten*22;
    const gg = ctx.createRadialGradient(pr.sx,pr.sy,0,pr.sx,pr.sy,r);
    gg.addColorStop(0, `rgba(255,251,238,${0.22*inten})`);
    gg.addColorStop(0.4, `rgba(255,243,220,${0.10*inten})`);
    gg.addColorStop(1, 'rgba(255,243,220,0)');
    ctx.fillStyle=gg;
    ctx.beginPath(); ctx.arc(pr.sx,pr.sy,r,0,7); ctx.fill();
  }
  ctx.restore();
}

/* ---------- input ---------- */
function setPointer(e){
  const t = e.touches? e.touches[0] : e;
  if(!t) return;
  pointer.x=t.clientX; pointer.y=t.clientY;
}
cvs.addEventListener('pointerdown', e=>{
  pointer.down=true; pointer.px=e.clientX; pointer.py=e.clientY; pointer.moved=0;
  autoSpin=false;
  cvs.setPointerCapture && cvs.setPointerCapture(e.pointerId);
});
window.addEventListener('pointermove', e=>{
  setPointer(e);
  if(pointer.down){
    const dx=e.clientX-pointer.px, dy=e.clientY-pointer.py;
    rotYT += dx*0.006;
    rotXT += dy*0.006;
    rotXT = Math.max(-1.4, Math.min(1.4, rotXT));
    pointer.px=e.clientX; pointer.py=e.clientY;
    pointer.moved += Math.abs(dx)+Math.abs(dy);
  } else {
    // light follows pointer subtly when idle
    const nx=(e.clientX/W-0.5), ny=(e.clientY/H-0.5);
    lightDir = norm(V(-0.4 - nx*0.9, 0.7 - ny*0.9, 0.9));
  }
});
window.addEventListener('pointerup', e=>{
  if(pointer.down && pointer.moved<6){
    // tap/click = morph to next form at next flat moment
    queuedForm = (formIdx+1)%FORMS.length;
  }
  pointer.down=false;
  setTimeout(()=>{autoSpin=true;}, 2600);
});
window.addEventListener('wheel', e=>{
  e.preventDefault();
  zoomT *= (e.deltaY>0? 0.92 : 1.08);
  zoomT = Math.max(0.5, Math.min(2.6, zoomT));
}, {passive:false});
window.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); paused=!paused; }
  if(e.code==='ArrowRight'){ queuedForm=(formIdx+1)%FORMS.length; }
  if(e.code==='ArrowLeft'){ queuedForm=(formIdx+FORMS.length-1)%FORMS.length; }
});
// pinch zoom (touch)
let pinchD=0;
window.addEventListener('touchmove', e=>{
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if(pinchD){ zoomT *= d/pinchD; zoomT=Math.max(0.5,Math.min(2.6,zoomT)); }
    pinchD=d; e.preventDefault();
  }
},{passive:false});
window.addEventListener('touchend', ()=>{pinchD=0;});

/* show hint briefly */
const hint=document.getElementById('hint');
setTimeout(()=>hint.classList.add('on'), 900);
setTimeout(()=>hint.classList.remove('on'), 6500);

document.getElementById('formName').textContent = FORMS[0].name;

/* debug/capture bridge (no effect on normal use) */
Object.defineProperty(window,'FORMS',{get:()=>FORMS});
Object.defineProperty(window,'formIdx',{get:()=>formIdx,set:v=>formIdx=v});
Object.defineProperty(window,'queuedForm',{get:()=>queuedForm,set:v=>queuedForm=v});
Object.defineProperty(window,'paused',{get:()=>paused,set:v=>paused=v});
Object.defineProperty(window,'phaseClock',{get:()=>phaseClock,set:v=>phaseClock=v});
Object.defineProperty(window,'rotX',{get:()=>rotX,set:v=>rotX=v});
Object.defineProperty(window,'rotY',{get:()=>rotY,set:v=>rotY=v});
Object.defineProperty(window,'rotXT',{get:()=>rotXT,set:v=>rotXT=v});
Object.defineProperty(window,'rotYT',{get:()=>rotYT,set:v=>rotYT=v});
Object.defineProperty(window,'zoom',{get:()=>zoom,set:v=>zoom=v});
Object.defineProperty(window,'zoomT',{get:()=>zoomT,set:v=>zoomT=v});

requestAnimationFrame(frame);
</script>
