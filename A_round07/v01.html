<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>無限晶洞 · Infinite Crystal Cave</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #02030a; }
  body { font-family: "SF Mono", "Menlo", "Consolas", ui-monospace, monospace; -webkit-tap-highlight-color: transparent; cursor: crosshair; }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  /* ---- Overlay HUD ---- */
  .ui { position: fixed; pointer-events: none; user-select: none; z-index: 5; }
  .corner { mix-blend-mode: screen; }

  #title {
    top: clamp(18px, 4.2vh, 46px); left: clamp(18px, 3.2vw, 54px);
    color: #dff3ff; letter-spacing: .02em;
  }
  #title .jp {
    font-size: clamp(26px, 5.4vw, 58px);
    font-weight: 200; line-height: .96;
    text-shadow: 0 0 24px rgba(120,200,255,.55), 0 0 60px rgba(80,140,255,.25);
    background: linear-gradient(110deg,#bfe9ff 0%,#9bd0ff 30%,#e7c9ff 60%,#bfe9ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #title .en {
    margin-top: .35em; font-size: clamp(9px, 1.25vw, 12px);
    letter-spacing: .58em; text-transform: uppercase; opacity: .62; padding-left: .2em;
    color: #9fd6ff;
  }

  #readout {
    bottom: clamp(16px, 3.4vh, 40px); left: clamp(18px, 3.2vw, 54px);
    color: #8fb6d8; font-size: clamp(9px, 1.05vw, 11px);
    letter-spacing: .16em; line-height: 1.85; opacity: .8;
  }
  #readout b { color: #d6f0ff; font-weight: 400; }
  #readout .k { color: #6f8db0; }

  #hint {
    bottom: clamp(16px, 3.4vh, 40px); right: clamp(18px, 3.2vw, 54px);
    text-align: right; color: #8fb6d8; font-size: clamp(9px, 1.05vw, 11px);
    letter-spacing: .14em; line-height: 1.95; opacity: .72;
  }
  #hint span { color: #e7d2ff; }

  #vignette { position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: radial-gradient(130% 120% at 50% 42%, transparent 52%, rgba(2,3,12,.55) 100%);
    mix-blend-mode: multiply; }

  /* faint grain to kill banding feel */
  #grain { position: fixed; inset: -50%; z-index: 6; pointer-events: none; opacity: .035;
    background-image: repeating-radial-gradient(circle at 0 0, #fff 0, #fff .5px, transparent .8px, transparent 3px);
    mix-blend-mode: overlay; animation: g 1.1s steps(2) infinite; }
  @keyframes g { 0%{transform:translate(0,0)} 50%{transform:translate(-1%, 1%)} 100%{transform:translate(1%,-1%)} }

  .fade { animation: fin 2.6s ease both; }
  @keyframes fin { from { opacity: 0; transform: translateY(8px); } to { opacity: var(--o,1); transform: none; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="vignette"></div>

<div class="ui corner fade" id="title" style="--o:1">
  <div class="jp">無限晶洞</div>
  <div class="en">Infinite&nbsp;Crystal&nbsp;Cave</div>
</div>

<div class="ui corner fade" id="readout" style="--o:.8">
  <div>DEPTH <b id="r-depth">0.00</b> <span class="k">·</span> FACET <b id="r-facet">∞</b></div>
  <div>HUE <b id="r-hue">198°</b> <span class="k">·</span> FPS <b id="r-fps">60</b></div>
</div>

<div class="ui corner fade" id="hint" style="--o:.72">
  <div>드래그 — <span>시선</span></div>
  <div>스크롤 — <span>심연으로</span></div>
  <div>클릭 — <span>빛의 파동</span></div>
</div>

<div id="grain"></div>

<!-- ============================ SHADER ============================ -->
<script id="vert" type="x-shader/x-fragment">
attribute vec2 p;
void main(){ gl_Position = vec4(p, 0.0, 1.0); }
</script>

<script id="frag" type="x-shader/x-fragment">
precision highp float;

uniform vec2  uRes;
uniform float uTime;
uniform vec2  uMouse;     // smoothed look, -1..1
uniform float uDepth;     // smoothed scroll depth
uniform float uPulse;     // 0..1 decaying click energy
uniform vec2  uPulseDir;  // pulse origin in clip space
uniform float uDPR;

#define PI 3.14159265359
#define MAX_STEPS 96
#define MAX_DIST  34.0
#define SURF      0.0018

// ---- hash / noise ----
float hash11(float n){ return fract(sin(n)*43758.5453123); }
float hash13(vec3 p){ p = fract(p*0.3183099+vec3(.1,.2,.3)); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }

mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }

// smooth min for organic crystal welds
float smin(float a, float b, float k){
  float h = clamp(0.5 + 0.5*(b-a)/k, 0.0, 1.0);
  return mix(b, a, h) - k*h*(1.0-h);
}

// octahedron crystal
float sdOcta(vec3 p, float s){
  p = abs(p);
  return (p.x+p.y+p.z - s)*0.57735027;
}

// global animation drivers, kept in functions so DE + normal agree
float gTime;
float gDepth;

// The infinite crystal field via domain folding + repetition.
// returns distance in .x and a "facet id / material" channel in .y, glow accum in .z
vec3 mapFull(vec3 p){
  // slow forward drift handled by camera; here we add breathing + twist
  vec3 q = p;

  // gentle helical twist that intensifies with depth -> "diving" feel
  float tw = 0.16 + gDepth*0.05;
  q.xy *= rot(q.z*tw + gTime*0.05);

  // mirror/fold to create kaleidoscopic cavern walls
  float fold = 2.4;
  vec3 c = vec3(fold, fold, 3.0);
  vec3 cell = floor((q + 0.5*c)/c);
  vec3 r = q - c*floor((q+0.5*c)/c);  // repeated coords

  // per-cell jitter so crystals feel grown, not gridded
  float idH = hash13(cell*1.37);
  r.xy *= rot(idH*6.2831);

  // breathing scale
  float breath = 0.86 + 0.10*sin(gTime*0.6 + idH*6.28 + cell.z*0.7);

  // main crystal cluster: octahedron + smaller satellites
  float s1 = sdOcta(r, 0.62*breath);
  // twin shard offset
  float s2 = sdOcta(r - vec3(0.0,0.0,0.0) , 0.0);
  vec3 r2 = r; r2.xz *= rot(1.1+idH*3.0); r2 -= vec3(0.55,0.0,0.0);
  s2 = sdOcta(r2, 0.30*breath);

  float crystal = smin(s1, s2, 0.18);

  // a third tiny floating gem, animated
  vec3 r3 = r; r3 -= vec3(0.0, sin(gTime*0.9+idH*9.0)*0.45, 0.0);
  float s3 = sdOcta(r3, 0.16*breath);
  crystal = smin(crystal, s3, 0.10);

  // carve out the "cave": we are INSIDE, so we want the cavern hollow.
  // Subtract a noisy tube around the path -> open corridor.
  float tube = length(p.xy + 0.6*vec2(sin(p.z*0.4+gTime*0.1), cos(p.z*0.33))) - (1.55 + 0.25*sin(p.z*0.2));
  // The walls are crystals (positive space) bounded by the corridor.
  float walls = max(crystal, -tube - 0.05);

  // distant haze crystals very far (cheap big octa) to fill background
  float far = sdOcta(mod(q+vec3(1.5),9.0)-4.5, 1.6) ;
  walls = min(walls, far*0.9);

  // material id from cell hash
  float matId = idH;

  return vec3(walls, matId, crystal);
}

float map(vec3 p){ return mapFull(p).x; }

vec3 calcNormal(vec3 p){
  vec2 e = vec2(1.0,-1.0)*0.0009;
  return normalize(
    e.xyy*map(p+e.xyy) + e.yyx*map(p+e.yyx) +
    e.yxy*map(p+e.yxy) + e.xxx*map(p+e.xxx));
}

// soft shadow
float softShadow(vec3 ro, vec3 rd, float k){
  float res = 1.0, t = 0.04;
  for(int i=0;i<24;i++){
    float h = map(ro + rd*t);
    if(h<0.0008) return 0.0;
    res = min(res, k*h/t);
    t += clamp(h, 0.02, 0.4);
    if(t>9.0) break;
  }
  return clamp(res,0.0,1.0);
}

// cheap AO
float ao(vec3 p, vec3 n){
  float occ=0.0, sca=1.0;
  for(int i=0;i<5;i++){
    float hr = 0.02 + 0.14*float(i);
    float d = map(p + n*hr);
    occ += (hr - d)*sca;
    sca *= 0.72;
  }
  return clamp(1.0 - 2.2*occ, 0.0, 1.0);
}

// living palette — cosine palette, hue drifts with depth + time
vec3 palette(float t){
  vec3 a = vec3(0.52, 0.50, 0.58);
  vec3 b = vec3(0.45, 0.48, 0.52);
  vec3 c = vec3(1.0, 1.0, 1.0);
  vec3 d = vec3(0.18, 0.40, 0.72) + 0.10*sin(gDepth*0.3);
  return a + b*cos(6.28318*(c*t + d));
}

void main(){
  gTime = uTime;
  gDepth = uDepth;

  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;

  // ---- camera ----
  // forward travel along z is the "depth" plus slow auto-drift
  float travel = uDepth*1.7 + uTime*0.42;
  vec3 ro = vec3(0.0, 0.0, travel);

  // look direction steered by mouse (smoothed on CPU)
  vec2 look = uMouse * vec2(0.55, 0.42);
  // subtle idle sway so it's alive even with no input
  look += vec2(sin(uTime*0.23)*0.06, cos(uTime*0.19)*0.045);

  vec3 fwd = normalize(vec3(look.x, look.y, 1.0));
  vec3 rgt = normalize(cross(vec3(0.0,1.0,0.0), fwd));
  vec3 up  = cross(fwd, rgt);
  float fovZoom = 1.3 - uPulse*0.18;
  vec3 rd = normalize(uv.x*rgt + uv.y*up + fovZoom*fwd);

  // gentle camera roll
  float roll = sin(uTime*0.12)*0.12 + uMouse.x*0.10;
  rd.xy *= rot(roll);

  // ---- raymarch ----
  float t = 0.0;
  float glow = 0.0;       // volumetric accumulation
  float matId = 0.0;
  vec3  glowCol = vec3(0.0);
  bool  hit = false;
  vec3  hitP;

  for(int i=0;i<MAX_STEPS;i++){
    vec3 pos = ro + rd*t;
    vec3 m = mapFull(pos);
    float d = m.x;

    // volumetric glow: accumulate inverse distance to crystals -> inner light
    float g = exp(-abs(d)*3.2);
    // pulse wave: a spherical shell of light expanding from camera on click
    float wave = 0.0;
    if(uPulse>0.001){
      float wr = (1.0-uPulse)*16.0;       // wave radius grows as pulse decays
      float dd = abs(t - wr);
      wave = exp(-dd*dd*1.4) * uPulse * 1.7;
    }
    glow += g*0.018 + wave*0.06;
    glowCol += palette(m.y + t*0.02 + gTime*0.01) * (g*0.018 + wave*0.05);

    if(d < SURF*(1.0+t*0.5)){ hit=true; hitP=pos; matId=m.y; break; }
    t += d*0.85;            // slight understep for crisp facets
    if(t > MAX_DIST) break;
  }

  vec3 col = vec3(0.0);

  // ---- background (deep space gradient + nebula) ----
  vec3 bg = mix(vec3(0.012,0.02,0.05), vec3(0.04,0.07,0.15), pow(max(0.0,0.6-uv.y),1.5));
  bg += 0.04*palette(uv.x*0.3 + gTime*0.02)* (0.5+0.5*sin(uv.x*8.0+uv.y*5.0));

  if(hit){
    vec3 n = calcNormal(hitP);
    vec3 v = -rd;

    // two key lights: cool from above-front, warm rim from behind
    vec3 L1 = normalize(vec3(0.5, 0.7, -0.3));
    vec3 L2 = normalize(vec3(-0.6, -0.2, 0.5));

    float dif1 = max(dot(n,L1),0.0);
    float dif2 = max(dot(n,L2),0.0);
    float sh = softShadow(hitP + n*0.01, L1, 9.0);
    float occ = ao(hitP, n);

    float fres = pow(1.0 - max(dot(n,v),0.0), 3.0);

    // crystal base colour from palette, varied per facet
    vec3 base = palette(matId*1.3 + 0.1);
    base = mix(base, vec3(0.7,0.85,1.0), 0.35);

    // -------- refraction / chromatic dispersion --------
    // bend the view ray into the crystal slightly, sample environment colour
    // with per-channel offset for prism rainbow on edges.
    vec3 refr = refract(rd, n, 0.86);
    vec3 envR = palette(matId + dot(refr, vec3(0.6))*0.5 + 0.00);
    vec3 envG = palette(matId + dot(refr, vec3(0.6))*0.5 + 0.06);
    vec3 envB = palette(matId + dot(refr, vec3(0.6))*0.5 + 0.12);
    vec3 dispersion = vec3(envR.r, envG.g, envB.b);

    // reflection sparkle
    vec3 ref = reflect(rd, n);
    float spec = pow(max(dot(ref, L1),0.0), 60.0);
    float spec2= pow(max(dot(ref, L2),0.0), 28.0);

    // assemble
    col  = base * (0.18 + 0.9*dif1*sh*occ + 0.35*dif2*occ);
    col += dispersion * (0.45*fres + 0.25);             // glassy interior
    col += vec3(1.0,0.95,0.85) * spec * 1.6 * sh;       // hot highlight
    col += palette(matId+0.3) * spec2 * 0.7;            // colored secondary
    col += base * fres * 0.6;                            // edge glow

    // interior caustic shimmer
    float caust = sin(hitP.x*6.0+gTime)*sin(hitP.y*6.0+gTime*1.3)*sin(hitP.z*5.0);
    col += palette(matId+0.5) * smoothstep(0.4,1.0,caust) * 0.12 * occ;

    // distance fog into the cavern
    float fog = 1.0 - exp(-t*0.10);
    col = mix(col, bg*1.2, fog);

    // pulse lights up surfaces it passes
    col += palette(matId)*uPulse*exp(-abs(t-(1.0-uPulse)*16.0)*1.2)*0.8;

  } else {
    col = bg;
  }

  // ---- add volumetric glow (the soul of the piece) ----
  glowCol = glowCol / max(glow, 0.0001);
  col += glowCol * pow(glow, 0.9) * 0.9;
  col += vec3(0.3,0.5,0.9) * glow * 0.05;

  // mouse-following soft light bloom in screen space
  vec2 mScreen = uMouse*vec2(0.5,0.5);
  float ml = exp(-length(uv - mScreen)*2.2);
  col += palette(gTime*0.05+0.2) * ml * 0.10 * (0.6+0.4*sin(gTime));

  // pulse origin flash in screen space
  if(uPulse>0.001){
    float pf = exp(-length(uv - uPulseDir*vec2(0.5,0.5))*3.0);
    col += vec3(0.9,0.95,1.0)*pf*uPulse*0.5;
  }

  // ---- post: tone map + grade + vignette ----
  col = max(col, 0.0);
  // ACES-ish
  col = (col*(2.51*col+0.03))/(col*(2.43*col+0.59)+0.14);

  // gentle blue-shadow / warm-highlight split tone
  col = mix(col, col*vec3(0.92,0.98,1.12), 0.5*(1.0-dot(col,vec3(0.33))));

  // saturation lift
  float lum = dot(col, vec3(0.299,0.587,0.114));
  col = mix(vec3(lum), col, 1.18);

  // vignette
  float vig = 1.0 - 0.32*dot(uv,uv);
  col *= vig;

  // subtle filmic grain
  float gr = hash13(vec3(gl_FragCoord.xy, gTime*60.0))-0.5;
  col += gr*0.018;

  gl_FragColor = vec4(clamp(col,0.0,1.0), 1.0);
}
</script>

<script>
(() => {
  "use strict";
  const cv = document.getElementById('gl');
  const gl = cv.getContext('webgl', { antialias:false, alpha:false, premultipliedAlpha:false, powerPreference:'high-performance' })
          || cv.getContext('experimental-webgl');

  if(!gl){
    document.body.innerHTML = '<div style="color:#9fd6ff;font-family:monospace;padding:40px;font-size:14px">WebGL을 사용할 수 없습니다 — 다른 브라우저에서 열어주세요.</div>';
    return;
  }

  // ---------- compile ----------
  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById('vert').textContent));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  // fullscreen triangle
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const locP = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(locP);
  gl.vertexAttribPointer(locP, 2, gl.FLOAT, false, 0, 0);

  const U = n => gl.getUniformLocation(prog, n);
  const uRes=U('uRes'), uTime=U('uTime'), uMouse=U('uMouse'), uDepth=U('uDepth'),
        uPulse=U('uPulse'), uPulseDir=U('uPulseDir'), uDPR=U('uDPR');

  // ---------- state ----------
  let DPR = 1, W=0, H=0;
  // performance cap: render resolution scaled, max device pixels limited
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    // resolution scaling: heavier shader -> cap total pixels
    const cssW = window.innerWidth, cssH = window.innerHeight;
    let scale = DPR;
    const targetMaxPx = 2400 * 1350;          // ~3.2M px budget
    let px = cssW*cssH*scale*scale;
    if(px > targetMaxPx) scale *= Math.sqrt(targetMaxPx/px);
    scale = Math.max(0.6, scale);
    W = Math.round(cssW*scale); H = Math.round(cssH*scale);
    cv.width = W; cv.height = H;
    cv.style.width = cssW+'px'; cv.style.height = cssH+'px';
    gl.viewport(0,0,W,H);
  }
  window.addEventListener('resize', resize, {passive:true});
  resize();

  // input — smoothed
  let mx=0, my=0;            // raw target -1..1
  let smx=0, smy=0;          // smoothed
  let dragging=false, lastX=0, lastY=0;
  let orbitX=0, orbitY=0;    // accumulated drag look
  let depthTarget=0, depth=0;
  let pulse=0; let pulseDirX=0, pulseDirY=0;

  function setFromClient(x,y){
    mx = (x/window.innerWidth)*2-1;
    my = -((y/window.innerHeight)*2-1);
  }
  window.addEventListener('mousemove', e=>{
    setFromClient(e.clientX, e.clientY);
    if(dragging){
      orbitX += (e.clientX-lastX)/window.innerWidth*2.2;
      orbitY += (e.clientY-lastY)/window.innerHeight*1.8;
      orbitY = Math.max(-0.9, Math.min(0.9, orbitY));
      lastX=e.clientX; lastY=e.clientY;
    }
  }, {passive:true});
  window.addEventListener('mousedown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
  window.addEventListener('mouseup', e=>{
    dragging=false;
    // a quick down/up = pulse (only if barely moved)
    triggerPulse(e.clientX, e.clientY);
  });
  window.addEventListener('click', ()=>{}, {passive:true});

  function triggerPulse(x,y){
    pulse = 1.0;
    if(x!=null){
      pulseDirX = (x/window.innerWidth)*2-1;
      pulseDirY = -((y/window.innerHeight)*2-1);
    }
  }

  window.addEventListener('wheel', e=>{
    depthTarget += e.deltaY*0.0024;
    depthTarget = Math.max(-2, Math.min(60, depthTarget));
  }, {passive:true});

  // touch
  let tActive=false, tLastX=0,tLastY=0, tStartX=0,tStartY=0, tStartT=0, lastTouchDist=0;
  cv.addEventListener('touchstart', e=>{
    if(e.touches.length===1){
      tActive=true;
      const t=e.touches[0];
      tLastX=t.clientX; tLastY=t.clientY;
      tStartX=t.clientX; tStartY=t.clientY; tStartT=performance.now();
      setFromClient(t.clientX,t.clientY);
    } else if(e.touches.length===2){
      lastTouchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    }
  }, {passive:true});
  cv.addEventListener('touchmove', e=>{
    if(e.touches.length===1 && tActive){
      const t=e.touches[0];
      orbitX += (t.clientX-tLastX)/window.innerWidth*2.4;
      orbitY += (t.clientY-tLastY)/window.innerHeight*1.9;
      orbitY = Math.max(-0.9, Math.min(0.9, orbitY));
      tLastX=t.clientX; tLastY=t.clientY;
      setFromClient(t.clientX,t.clientY);
    } else if(e.touches.length===2){
      const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      depthTarget += (d-lastTouchDist)*0.01;
      depthTarget = Math.max(-2, Math.min(60, depthTarget));
      lastTouchDist=d;
    }
  }, {passive:true});
  cv.addEventListener('touchend', e=>{
    if(tActive){
      const dt = performance.now()-tStartT;
      const moved = Math.hypot(tLastX-tStartX, tLastY-tStartY);
      if(dt<260 && moved<14) triggerPulse(tStartX, tStartY); // tap = pulse
    }
    if(e.touches.length===0) tActive=false;
  }, {passive:true});

  // keyboard: space = pulse, arrows = depth
  window.addEventListener('keydown', e=>{
    if(e.code==='Space'){ triggerPulse(window.innerWidth/2, window.innerHeight/2); e.preventDefault(); }
    if(e.code==='ArrowUp')   depthTarget=Math.min(60, depthTarget+0.6);
    if(e.code==='ArrowDown') depthTarget=Math.max(-2, depthTarget-0.6);
  });

  // ---------- HUD refs ----------
  const rDepth=document.getElementById('r-depth'),
        rFacet=document.getElementById('r-facet'),
        rHue=document.getElementById('r-hue'),
        rFps=document.getElementById('r-fps');

  // ---------- loop ----------
  const t0 = performance.now();
  let last = t0, fpsT=t0, frames=0, fps=60;

  function frame(now){
    const dt = Math.min(0.05, (now-last)/1000); last=now;
    const time = (now - t0)/1000;

    // smooth inputs
    const ease = 1 - Math.pow(0.0015, dt);  // frame-rate independent
    // combine pointer position with accumulated orbit drag
    const tgX = Math.max(-1.6, Math.min(1.6, mx*0.5 + orbitX));
    const tgY = Math.max(-1.0, Math.min(1.0, my*0.5 + orbitY));
    smx += (tgX - smx)*ease;
    smy += (tgY - smy)*ease;
    depth += (depthTarget - depth)*(1 - Math.pow(0.02, dt));
    pulse *= Math.pow(0.18, dt);            // decay
    if(pulse < 0.001) pulse = 0;

    gl.uniform2f(uRes, W, H);
    gl.uniform1f(uTime, time);
    gl.uniform2f(uMouse, smx, smy);
    gl.uniform1f(uDepth, depth);
    gl.uniform1f(uPulse, pulse);
    gl.uniform2f(uPulseDir, pulseDirX, pulseDirY);
    gl.uniform1f(uDPR, DPR);

    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // fps + hud
    frames++;
    if(now - fpsT > 500){
      fps = Math.round(frames*1000/(now-fpsT));
      frames=0; fpsT=now;
      rFps.textContent = fps;
      rDepth.textContent = depth.toFixed(2);
      const hue = Math.round((( (Math.sin(depth*0.3)*0.5+0.5)*120 + 180 )%360));
      rHue.textContent = hue + '°';
      rFacet.textContent = pulse>0.1 ? '✦' : '∞';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // expose for verification
  window.__crystal = {
    get fps(){ return fps; },
    pulse: ()=>triggerPulse(window.innerWidth/2, window.innerHeight/2),
    dive: (d)=>{ depthTarget = d; }
  };
})();
</script>
