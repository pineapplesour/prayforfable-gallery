<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>STYLE:ON — AI Stylist Work OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#F4F1E8;        /* warm off-white */
  --paper2:#EAE6D6;
  --ink:#111111;
  --acid:#C6FF1A;         /* acid lime */
  --magenta:#FF2D8E;      /* electric magenta */
  --blue:#1F4BFF;         /* vivid blue */
  --orange:#FF5B12;       /* vivid orange */
  --cyan:#22E0D6;         /* cyan */
  --violet:#7A3CFF;
  --bd:4px;
  --shadow:10px 10px 0 0 var(--ink);
  --shadow-sm:6px 6px 0 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans KR','Archivo',sans-serif;
  overflow:hidden;
  position:fixed;inset:0;
}
.mono{font-family:'Space Mono',monospace;}
.disp{font-family:'Archivo','Space Grotesk',sans-serif;font-weight:900;letter-spacing:-.02em;line-height:.92;}

/* ===== DECK ===== */
#deck{position:absolute;inset:0;}
.slide{
  position:absolute;inset:0;
  padding:clamp(28px,4.2vw,72px);
  display:none;
  flex-direction:column;
  opacity:0;
  background:var(--paper);
  background-image:
    linear-gradient(var(--paper2) 1px,transparent 1px),
    linear-gradient(90deg,var(--paper2) 1px,transparent 1px);
  background-size:46px 46px;
}
.slide.active{display:flex;animation:slideIn .5s cubic-bezier(.2,.9,.2,1) forwards;}
.slide.prev{display:flex;animation:slideOut .5s cubic-bezier(.5,0,.8,.2) forwards;}
@keyframes slideIn{from{opacity:0;transform:translateX(46px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideOut{from{opacity:1;transform:translateX(0);}to{opacity:0;transform:translateX(-46px);}}

/* ===== top frame ===== */
.frame{
  display:flex;justify-content:space-between;align-items:flex-start;
  font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.14em;
  border-bottom:var(--bd) solid var(--ink);
  padding-bottom:10px;margin-bottom:clamp(14px,2.2vh,28px);
  flex:0 0 auto;
}
.frame .tag{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:9px;}
.brand .mk{
  width:22px;height:22px;background:var(--ink);color:var(--acid);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;
  font-family:'Archivo',sans-serif;
}
.kicker{
  display:inline-block;background:var(--ink);color:var(--paper);
  font-family:'Space Mono',monospace;font-weight:700;font-size:11px;
  text-transform:uppercase;letter-spacing:.16em;
  padding:6px 12px;
}

/* generic body wrap */
.body{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0;}
h1.title{font-family:'Archivo',sans-serif;font-weight:900;letter-spacing:-.025em;line-height:.95;}
.sub{font-size:clamp(13px,1.15vw,18px);max-width:62ch;line-height:1.5;color:#222;font-weight:500;}

/* cards */
.card{
  background:var(--paper);
  border:var(--bd) solid var(--ink);
  box-shadow:var(--shadow-sm);
  padding:clamp(14px,1.4vw,22px);
}
.card.flat{box-shadow:none;}

/* chips */
.chip{
  border:3px solid var(--ink);background:var(--paper);
  font-family:'Space Mono',monospace;font-weight:700;font-size:12px;
  text-transform:uppercase;letter-spacing:.08em;padding:8px 14px;
  display:inline-flex;align-items:center;gap:8px;box-shadow:4px 4px 0 var(--ink);
}
.dot{width:9px;height:9px;border:2px solid var(--ink);}
.fill-acid{background:var(--acid);}
.fill-mag{background:var(--magenta);}
.fill-blue{background:var(--blue);}
.fill-org{background:var(--orange);}
.fill-cyan{background:var(--cyan);}
.fill-vio{background:var(--violet);}
.txt-w{color:#fff;}

/* ===== NAV ===== */
#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;justify-content:space-between;align-items:center;
  padding:10px clamp(20px,3vw,40px);
  border-top:var(--bd) solid var(--ink);
  background:var(--paper2);
}
.navbtn{
  width:42px;height:42px;border:3px solid var(--ink);background:var(--paper);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-weight:900;font-size:18px;font-family:'Archivo';box-shadow:4px 4px 0 var(--ink);
  transition:transform .08s,box-shadow .08s,background .15s;
}
.navbtn:hover{background:var(--acid);}
.navbtn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
.navmid{display:flex;align-items:center;gap:18px;}
.dots{display:flex;gap:6px;flex-wrap:wrap;max-width:60vw;}
.pd{width:11px;height:11px;border:2px solid var(--ink);background:var(--paper);cursor:pointer;transition:background .15s,transform .1s;}
.pd.on{background:var(--magenta);transform:scale(1.25);}
.counter{font-family:'Space Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.05em;}
.counter b{font-size:18px;}

#progress{position:fixed;top:0;left:0;height:6px;background:var(--magenta);z-index:50;border-right:3px solid var(--ink);transition:width .45s cubic-bezier(.2,.9,.2,1);}

/* ===== logo motion (slide1 intro, <=0.8s) ===== */
@keyframes popIn{0%{transform:translateY(26px) scale(.96);opacity:0;}100%{transform:translateY(0) scale(1);opacity:1;}}
@keyframes wipe{0%{clip-path:inset(0 100% 0 0);}100%{clip-path:inset(0 0 0 0);}}
@keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
.anim-pop{animation:popIn .55s cubic-bezier(.2,.9,.2,1) both;}
.anim-wipe{animation:wipe .7s cubic-bezier(.4,0,0,1) both;}
.cursor{display:inline-block;width:.5ch;background:var(--magenta);animation:blink 1s steps(1) infinite;}

/* count-up emphasis */
.bignum{font-family:'Archivo';font-weight:900;line-height:1;letter-spacing:-.03em;}

/* ===== bar chart (brutal) ===== */
.bars{display:flex;align-items:flex-end;gap:clamp(10px,1.4vw,26px);height:100%;}
.bar-wrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;}
.bar{
  border:var(--bd) solid var(--ink);height:0;
  transition:height 1.1s cubic-bezier(.2,.9,.2,1);
  position:relative;box-shadow:6px 6px 0 var(--ink);
  display:flex;align-items:flex-start;justify-content:center;
}
.bar .bv{position:absolute;top:-30px;width:100%;text-align:center;font-family:'Space Mono';font-weight:700;font-size:13px;}
.bar-lbl{margin-top:10px;font-family:'Space Mono';font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:center;line-height:1.25;}

/* utility grids */
.grid{display:grid;gap:clamp(10px,1.1vw,18px);}
.num-badge{
  width:34px;height:34px;min-width:34px;border:3px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-family:'Archivo';font-weight:900;font-size:16px;
}

/* feature mini-cards (s3) */
.feat{display:flex;gap:12px;align-items:flex-start;border:3px solid var(--ink);padding:11px 13px;background:var(--paper);transition:transform .12s,box-shadow .12s;}
.feat:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);}
.feat .fn{font-weight:800;font-size:14px;font-family:'Archivo';}
.feat .fd{font-size:11.5px;color:#333;line-height:1.35;}

/* tier cards */
.tier{display:flex;flex-direction:column;gap:8px;border:var(--bd) solid var(--ink);padding:16px;background:var(--paper);}
.tier .tn{font-family:'Archivo';font-weight:900;font-size:22px;}
.tier .tp{font-family:'Space Mono';font-weight:700;font-size:12px;}

/* scrollers off */
.slide::-webkit-scrollbar{display:none;}

/* ===== responsive ===== */
@media (max-width:760px){
  :root{--shadow:6px 6px 0 0 var(--ink);--shadow-sm:4px 4px 0 0 var(--ink);--bd:3px;}
  .slide{padding:18px 16px 70px;}
  .frame{font-size:9px;flex-wrap:wrap;gap:6px;}
  .dots{display:none;}
  .navmid .counter b{font-size:16px;}
  .body{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .slide::-webkit-scrollbar{display:none;}
  .m-stack{grid-template-columns:1fr !important;}
  .m-2{grid-template-columns:1fr 1fr !important;}
  .bars{gap:6px;}
  .bar .bv{font-size:10px;top:-22px;}
  .bar-lbl{font-size:9px;}
}
.hideart{display:flex;}
@media (max-width:920px){.hideart{display:none !important;}}
</style>
</head>
<body>
<div id="progress"></div>
<div id="deck"></div>

<div id="nav">
  <div class="navbtn" id="prev" aria-label="이전">&#8592;</div>
  <div class="navmid">
    <div class="counter"><b id="cur">01</b> / <span id="tot">15</span></div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="navbtn" id="next" aria-label="다음">&#8594;</div>
</div>

<script>
/* ============================================================
   STYLE:ON IR — Neo-brutalist deck. All content from ir_content.md
   ============================================================ */
const A='acid',M='mag',B='blue',O='org',C='cyan',V='vio';
const fillMap={acid:'fill-acid',mag:'fill-mag',blue:'fill-blue',org:'fill-org',cyan:'fill-cyan',vio:'fill-vio'};
function fc(c){return fillMap[c];}
const whiteOn=['mag','blue','org','vio'];
function fgFor(c){return whiteOn.includes(c)?'#fff':'#111';}

/* ---- shared header ---- */
function frame(idx,label,right){
  return `<div class="frame">
    <div class="tag">
      <div class="brand"><span class="mk">S</span><span>STYLE:ON</span></div>
      <span style="opacity:.5">/</span><span>${label}</span>
    </div>
    <div class="tag"><span>${right||'AI STYLIST WORK OS'}</span><span style="opacity:.5">·</span><span>${String(idx).padStart(2,'0')} / 15</span></div>
  </div>`;
}

/* ===================== SLIDES ===================== */
const slides=[];

/* ---------- S1 COVER ---------- */
slides.push(()=>`
${frame(1,'COVER','PRE-SEED · SEED')}
<div class="body" style="justify-content:center;">
  <div style="display:flex;gap:clamp(20px,4vw,60px);align-items:center;flex-wrap:wrap;">
    <div style="flex:1 1 420px;min-width:300px;">
      <div class="kicker anim-pop" style="animation-delay:.05s;margin-bottom:18px;">현직 스타일리스트가 만든 통합 워크 플랫폼</div>
      <h1 class="title" style="font-size:clamp(48px,8.4vw,128px);">
        <span class="anim-pop" style="display:inline-block;animation-delay:.12s;">STYLE</span><span class="anim-pop" style="display:inline-block;animation-delay:.22s;color:var(--magenta);">:ON</span><span class="cursor" style="height:.78em;margin-left:.06em;">&nbsp;</span>
      </h1>
      <div class="anim-wipe" style="animation-delay:.34s;background:var(--ink);color:var(--acid);display:inline-block;padding:8px 16px;font-family:'Archivo';font-weight:800;font-size:clamp(16px,2.4vw,34px);margin-top:10px;letter-spacing:-.01em;">AI STYLIST WORK&nbsp;OS</div>
      <p class="sub anim-pop" style="animation-delay:.5s;margin-top:22px;font-size:clamp(14px,1.4vw,19px);">협찬 · 소싱 · 피팅 · 정산을 한곳에 묶는 통합 워크 플랫폼.<br><b>"스타일리스트의 일을 더 체계적으로, 현장을 더 스마트하게."</b></p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;">
        ${[['MVP 구축 완료',A],['협업 네트워크 연계',C],['AI 10개 핵심 기능',M]].map((b,i)=>`<span class="chip anim-pop" style="animation-delay:${.6+i*.08}s;"><span class="dot ${fc(b[1])}"></span>${b[0]}</span>`).join('')}
      </div>
    </div>
    <div class="hideart" style="flex:1 1 300px;min-width:280px;flex-direction:column;gap:14px;">
      ${[['ON SOURCING','무드 기반 의상 소싱',M],['ON SPONSOR','브랜드 협찬 확인·요청',B],['ON PAY','영수증 OCR 정산',A]].map((c,i)=>`
        <div class="card anim-pop" style="animation-delay:${.4+i*.12}s;display:flex;justify-content:space-between;align-items:center;border-width:4px;">
          <div><div class="mono" style="font-size:11px;letter-spacing:.1em;color:#666;">APP MODULE</div><div style="font-family:'Archivo';font-weight:900;font-size:22px;">${c[0]}</div><div style="font-size:12px;color:#333;">${c[1]}</div></div>
          <div style="width:54px;height:54px;border:4px solid var(--ink);background:var(--${c[2]==M?'magenta':c[2]==B?'blue':'acid'});"></div>
        </div>`).join('')}
    </div>
  </div>
</div>`);

/* ---------- S2 PROBLEM ---------- */
slides.push(()=>{
  const pains=[['협찬','브랜드별 개별 문의, 회신 지연',M],['의상 수배','쇼룸/대행사 보유처 탐색 비효율',B],['피팅','실물 준비와 반복 피팅 비용 증가',O],['리서치','인스타/샤오훙슈/룩북 수동 탐색',V],['정산','영수증 수기 정리, 누락·오기입 발생',A],['정보 단절','담당자/노하우가 카톡방에 흩어짐',C]];
  return `
${frame(2,'PROBLEM')}
<div class="body">
  <span class="kicker fill-mag" style="background:var(--magenta);color:#fff;margin-bottom:14px;">PROBLEM</span>
  <h1 class="title" style="font-size:clamp(26px,4.4vw,58px);max-width:18ch;">스타일리스트의 일은 아직도<br><span style="background:var(--acid);box-shadow:0 -.42em 0 var(--acid) inset;">파편화</span>되어 있습니다</h1>
  <p class="sub" style="margin-top:14px;">메일, DM, 카톡, 엑셀, 수집, 인터넷으로 오가는 비효율적인 현장 업무 (As-is Workflow)</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:16px 0;">
    ${['메일','DM','카톡','엑셀','수집','SNS'].map(x=>`<span class="chip" style="box-shadow:none;font-size:11px;padding:6px 10px;">${x}</span><span style="align-self:center;font-weight:900;">⟶</span>`).join('').replace(/<span style="align-self:center;font-weight:900;">⟶<\/span>$/,'')}
  </div>
  <div class="grid m-2" style="grid-template-columns:repeat(3,1fr);">
    ${pains.map((p,i)=>`<div class="feat" style="background:var(--paper);box-shadow:4px 4px 0 var(--ink);">
      <div class="num-badge ${fc(p[2])}" style="color:${fgFor(p[2])};">${i+1}</div>
      <div><div class="fn">${p[0]}</div><div class="fd">${p[1]}</div></div></div>`).join('')}
  </div>
  <div style="margin-top:16px;background:var(--ink);color:var(--paper);padding:14px 18px;border:var(--bd) solid var(--ink);font-weight:700;font-size:clamp(13px,1.4vw,18px);">
    스타일리스트의 시간은 <span style="color:var(--acid);">스타일링이 아닌 반복 업무</span>에 잠식되고 있습니다.
  </div>
</div>`;});

/* ---------- S3 PRODUCT (10 features) ---------- */
slides.push(()=>{
  const f=[['ON Sourcing','무드 기반 의상 소싱',M],['ON Sponsor','브랜드 협찬 확인·요청',B],['ON Track','픽업·반납 트래킹',O],['ON Ref','레퍼런스 검색',V],['ON Lens','사진 제품 검색',C],['ON Fit','AI 가상 피팅',M],['ON Trend','트렌드 예측',A],['ON Pay','영수증 OCR 정산',B],['ON Desk','촬영 일정 관리',O],['ON Crew','실무 커뮤니티·아카이브',V]];
  return `
${frame(3,'PRODUCT')}
<div class="body">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;">
    <div>
      <span class="kicker" style="margin-bottom:10px;">PRODUCT</span>
      <h1 class="title" style="font-size:clamp(24px,3.8vw,48px);margin-top:10px;"><span style="color:var(--magenta);">10개</span> 핵심 기능으로 구성된 Stylist Work OS</h1>
      <p class="sub" style="margin-top:8px;">스타일리스트의 전체 워크플로우를 하나의 플랫폼에서 연결합니다.</p>
    </div>
    <div class="bignum" style="font-size:clamp(56px,9vw,110px);color:var(--ink);"><span class="cu" data-to="10">0</span><span style="color:var(--magenta);">개</span></div>
  </div>
  <div class="grid m-2" style="grid-template-columns:repeat(5,1fr);margin-top:16px;">
    ${f.map((x,i)=>`<div class="feat" style="flex-direction:column;gap:6px;box-shadow:4px 4px 0 var(--ink);">
      <div class="num-badge ${fc(x[2])}" style="color:${fgFor(x[2])};">${String(i+1).padStart(2,'0')}</div>
      <div class="fn" style="font-size:13px;">${x[0]}</div><div class="fd">${x[1]}</div></div>`).join('')}
  </div>
  <div style="margin-top:16px;border:var(--bd) solid var(--ink);background:var(--acid);padding:13px 18px;font-weight:800;font-size:clamp(13px,1.4vw,18px);font-family:'Archivo';">
    단일 기능 앱이 아니라, 스타일리스트 전체 업무를 연결하는 <u>운영체제(OS)</u>
  </div>
</div>`;});

/* ---------- S4 SOLUTION before/after ---------- */
slides.push(()=>{
  const flow=['사진(의상) 입력','AI 소싱','협찬 요청','픽업/반납','일정·정산','영수증 OCR','커뮤니티/아카이브'];
  const eff=[['업무 시간 단축','반복 잡무를 단일 워크플로우로 흡수',A],['누락·실수 감소','AI·OCR 정산으로 오기입/누락 최소화',M],['실무 정보의 자산화','노하우·데이터를 축적해 자산으로',B]];
  return `
${frame(4,'SOLUTION')}
<div class="body">
  <span class="kicker fill-blue" style="background:var(--blue);color:#fff;margin-bottom:12px;">SOLUTION</span>
  <h1 class="title" style="font-size:clamp(24px,4vw,52px);">STYLE:ON이 <span style="background:var(--acid);box-shadow:0 -.4em 0 var(--acid) inset;">모든 업무</span>를 하나로 연결합니다</h1>
  <div style="display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;margin:18px 0;">
    ${flow.map((s,i)=>`<div style="flex:1;min-width:84px;display:flex;align-items:center;gap:8px;">
      <div class="card flat" style="flex:1;border-width:3px;padding:9px 7px;text-align:center;font-family:'Space Mono';font-weight:700;font-size:11px;background:${i%2?'var(--paper2)':'var(--paper)'};">${s}</div>
      ${i<flow.length-1?'<span style="font-weight:900;font-size:18px;">⟶</span>':''}</div>`).join('')}
  </div>
  <div class="grid m-2" style="grid-template-columns:1fr 1fr;margin-bottom:16px;">
    <div class="card" style="border-width:4px;">
      <div class="mono" style="font-weight:700;letter-spacing:.1em;color:var(--magenta);font-size:13px;">// BEFORE</div>
      <div style="font-family:'Archivo';font-weight:900;font-size:18px;margin:6px 0;">분산된 도구들</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">${['메일','DM','카톡','엑셀','수집'].map(x=>`<span style="border:2px solid var(--ink);padding:4px 9px;font-size:11px;font-family:'Space Mono';text-decoration:line-through;opacity:.7;">${x}</span>`).join('')}</div>
    </div>

/* ===================== ENGINE ===================== */
const deck=document.getElementById('deck');
const TOTAL=slides.length;
document.getElementById('tot').textContent=TOTAL;
let cur=0,animating=false;

// build slide shells
const els=slides.map((fn,i)=>{
  const d=document.createElement('section');
  d.className='slide';d.dataset.i=i;d.innerHTML=fn();
  deck.appendChild(d);return d;
});

// dots
const dotsEl=document.getElementById('dots');
els.forEach((_,i)=>{
  const p=document.createElement('div');p.className='pd';p.dataset.i=i;
  p.onclick=()=>go(i);dotsEl.appendChild(p);
});
const pds=[...dotsEl.children];

function paintMeta(){
  document.getElementById('cur').textContent=String(cur+1).padStart(2,'0');
  pds.forEach((p,i)=>p.classList.toggle('on',i===cur));
  document.getElementById('progress').style.width=((cur+1)/TOTAL*100)+'%';
}

function runAnims(slide){
  // count-up
  slide.querySelectorAll('.cu').forEach(el=>{
    const to=parseFloat(el.dataset.to);const dec=parseInt(el.dataset.dec||'0');
    const dur=1100;const st=performance.now();
    function tick(now){
      let t=Math.min(1,(now-st)/dur);
      t=1-Math.pow(1-t,3);
      const v=to*t;
      el.textContent=dec?v.toFixed(dec):Math.round(v);
      if(t<1)requestAnimationFrame(tick);else el.textContent=dec?to.toFixed(dec):to;
    }
    el.textContent='0';requestAnimationFrame(tick);
  });
  // bars
  slide.querySelectorAll('.bar').forEach((b,i)=>{
    b.style.height='0';
    setTimeout(()=>{b.style.height=b.dataset.h+'%';},120+i*140);
  });
}

function go(n){
  if(animating||n===cur||n<0||n>=TOTAL)return;
  animating=true;
  const old=els[cur],nw=els[n];
  old.classList.remove('active');old.classList.add('prev');
  nw.classList.add('active');
  // re-render to reset inline anims
  nw.innerHTML=slides[n]();
  cur=n;paintMeta();
  runAnims(nw);
  setTimeout(()=>{old.classList.remove('prev');animating=false;},520);
}
function next(){go(cur+1);}
function prev(){go(cur-1);}

document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;

// keyboard
window.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next();}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev();}
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(TOTAL-1);
});
// wheel
let wlock=false;
window.addEventListener('wheel',e=>{
  if(wlock)return;
  if(Math.abs(e.deltaY)<24&&Math.abs(e.deltaX)<24)return;
  wlock=true;
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  if(d>0)next();else prev();
  setTimeout(()=>wlock=false,640);
},{passive:true});
// touch
let tx=0,ty=0;
window.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
window.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){dx<0?next():prev();}
},{passive:true});

// init
els[0].classList.add('active');
paintMeta();
runAnims(els[0]);
</script>
