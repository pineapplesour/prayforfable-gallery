<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>여여 — 불교 공부 길동무</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#f7f5f0;
    --paper-2:#fbfaf6;
    --side:#f1eee7;
    --side-edge:#e6e1d7;
    --ink:#23211c;
    --ink-2:#56524a;
    --ink-3:#8c877b;
    --ink-4:#b4afa3;
    --line:#e7e2d8;
    --line-2:#ddd7ca;
    --bubble-user:#ece7db;
    --accent:#3a4f6e;        /* 쪽빛 indigo */
    --accent-soft:#eef1f6;
    --accent-ink:#2c3e57;
    --ok:#5b7a5b;
    --danger:#a4543d;
    --radius:16px;
    --radius-sm:11px;
    --shadow:0 1px 2px rgba(40,36,28,.05), 0 8px 30px rgba(40,36,28,.06);
    --maxw:760px;
    --side-w:282px;
    font-synthesis:none;
    -webkit-text-size-adjust:100%;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:15px;
    line-height:1.5;
    letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  ::selection{background:#d9e0ec;}

  .app{
    display:grid;
    grid-template-columns:var(--side-w) 1fr;
    height:100dvh;
    overflow:hidden;
  }

  /* ---------------- Sidebar ---------------- */
  .sidebar{
    background:var(--side);
    border-right:1px solid var(--side-edge);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:11px;
    padding:18px 18px 14px;
  }
  .mark{
    width:30px;height:30px;flex:none;position:relative;
  }
  .mark svg{display:block;width:100%;height:100%;}
  .brand-name{
    font-family:"Noto Serif KR",serif;
    font-weight:600;
    font-size:18px;
    letter-spacing:.02em;
    line-height:1;
  }
  .brand-sub{
    font-size:11px;
    color:var(--ink-3);
    margin-top:3px;
    letter-spacing:0;
  }

  .new-btn{
    margin:4px 14px 12px;
    display:flex;align-items:center;gap:9px;
    padding:10px 13px;
    background:var(--paper-2);
    border:1px solid var(--line-2);
    border-radius:12px;
    color:var(--ink);
    font-size:14px;font-weight:600;
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .05s;
    text-align:left;
  }
  .new-btn:hover{border-color:#cdc6b6;background:#fff;}
  .new-btn:active{transform:translateY(1px);}
  .new-btn svg{width:16px;height:16px;flex:none;color:var(--ink-2);}

  .convos{
    flex:1;
    overflow-y:auto;
    padding:4px 10px 10px;
    min-height:0;
    scrollbar-width:thin;
    scrollbar-color:#d3cdbf transparent;
  }
  .convos::-webkit-scrollbar{width:9px;}
  .convos::-webkit-scrollbar-thumb{background:#d8d2c4;border-radius:9px;border:2.5px solid var(--side);}
  .convos::-webkit-scrollbar-thumb:hover{background:#c8c1b0;}

  .group-label{
    font-size:11px;
    font-weight:600;
    color:var(--ink-3);
    letter-spacing:.04em;
    padding:14px 10px 6px;
  }
  .convo{
    display:block;width:100%;
    text-align:left;
    border:0;background:transparent;
    padding:9px 11px;
    border-radius:10px;
    color:var(--ink-2);
    font-size:13.5px;
    cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:background .12s,color .12s;
    position:relative;
  }
  .convo:hover{background:#eae5db;color:var(--ink);}
  .convo.active{background:#e3ddcf;color:var(--ink);font-weight:600;}
  .convo.active::before{
    content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:3px;height:16px;border-radius:3px;background:var(--accent);
  }

  .side-foot{
    border-top:1px solid var(--side-edge);
    padding:10px 12px;
    display:flex;align-items:center;gap:10px;
  }
  .avatar{
    width:30px;height:30px;border-radius:50%;
    background:linear-gradient(150deg,#9aa9bf,#6d7e98);
    color:#fff;font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex:none;
    letter-spacing:0;
  }
  .who{font-size:13px;font-weight:600;line-height:1.2;}
  .who small{display:block;font-weight:400;color:var(--ink-3);font-size:11px;}
  .gear{margin-left:auto;color:var(--ink-3);background:none;border:0;cursor:pointer;padding:6px;border-radius:8px;}
  .gear:hover{background:#e6e1d6;color:var(--ink-2);}
  .gear svg{width:18px;height:18px;display:block;}

  /* ---------------- Main ---------------- */
  .main{
    display:flex;flex-direction:column;min-width:0;min-height:0;
    background:var(--paper);
    position:relative;
  }
  .topbar{
    height:56px;flex:none;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;
    padding:0 20px;
    background:rgba(247,245,240,.85);
    backdrop-filter:saturate(150%) blur(8px);
  }
  .hamburger{display:none;border:0;background:none;cursor:pointer;color:var(--ink-2);padding:6px;margin-left:-6px;border-radius:8px;}
  .hamburger svg{width:22px;height:22px;display:block;}
  .topbar h1{
    font-size:15px;font-weight:600;margin:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .topbar h1 span{color:var(--ink-3);font-weight:400;}
  .mode{
    margin-left:auto;
    display:flex;align-items:center;gap:7px;
    font-size:12.5px;color:var(--ink-2);
    border:1px solid var(--line-2);
    background:var(--paper-2);
    padding:6px 11px;border-radius:999px;cursor:pointer;
    transition:border-color .15s,background .15s;
    white-space:nowrap;
  }
  .mode:hover{border-color:#cdc6b6;background:#fff;}
  .mode .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);}
  .mode svg{width:13px;height:13px;color:var(--ink-3);}

  .thread-wrap{flex:1;overflow-y:auto;min-height:0;scroll-behavior:smooth;}
  .thread-wrap::-webkit-scrollbar{width:11px;}
  .thread-wrap::-webkit-scrollbar-thumb{background:#ddd6c7;border-radius:11px;border:3px solid var(--paper);}
  .thread-wrap::-webkit-scrollbar-thumb:hover{background:#cfc7b5;}
  .thread{
    max-width:var(--maxw);
    margin:0 auto;
    padding:30px 24px 22px;
  }

  .daydiv{
    text-align:center;margin:6px 0 22px;
    font-size:11.5px;color:var(--ink-3);
    position:relative;
  }
  .daydiv span{background:var(--paper);padding:0 12px;position:relative;z-index:1;}
  .daydiv::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line);}

  .msg{display:flex;gap:14px;margin:22px 0;animation:rise .4s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .msg .ava{
    width:30px;height:30px;flex:none;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    margin-top:1px;
  }
  .msg.bot .ava{background:#fff;border:1px solid var(--line-2);}
  .msg.bot .ava svg{width:18px;height:18px;}
  .msg .body{min-width:0;flex:1;}
  .msg .name{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:4px;}
  .msg .name small{font-weight:400;color:var(--ink-4);margin-left:7px;font-size:11px;}
  .bubble-text{font-size:15px;color:var(--ink);}
  .bubble-text p{margin:0 0 11px;}
  .bubble-text p:last-child{margin-bottom:0;}
  .bubble-text strong{font-weight:700;}
  .bubble-text ul{margin:4px 0 12px;padding-left:2px;list-style:none;}
  .bubble-text li{position:relative;padding-left:20px;margin:6px 0;}
  .bubble-text li::before{
    content:"";position:absolute;left:4px;top:9px;width:5px;height:5px;border-radius:50%;
    background:var(--accent);opacity:.65;
  }
  .bubble-text .quote{
    border-left:2.5px solid var(--line-2);
    padding:2px 0 2px 14px;
    color:var(--ink-2);
    font-family:"Noto Serif KR",serif;
    font-size:14.5px;
    margin:4px 0 12px;
  }

  /* user message */
  .msg.me{justify-content:flex-end;}
  .msg.me .body{flex:0 1 auto;display:flex;flex-direction:column;align-items:flex-end;}
  .msg.me .bubble{
    background:var(--bubble-user);
    border:1px solid #e2dccd;
    padding:11px 15px;border-radius:15px 15px 4px 15px;
    font-size:15px;color:var(--ink);
    max-width:520px;
  }
  .msg.me .stamp{font-size:10.5px;color:var(--ink-4);margin-top:5px;margin-right:3px;}

  .msg .tools{
    display:flex;gap:4px;margin-top:9px;opacity:0;transition:opacity .15s;
  }
  .msg.bot:hover .tools{opacity:1;}
  .tbtn{
    border:1px solid transparent;background:none;cursor:pointer;
    color:var(--ink-3);padding:5px;border-radius:7px;line-height:0;
  }
  .tbtn:hover{background:#ece7dc;color:var(--ink-2);}
  .tbtn svg{width:15px;height:15px;}
  .tbtn.tagged{color:var(--accent);}

  /* sources card */
  .refs{
    margin-top:12px;border:1px solid var(--line);border-radius:12px;
    background:var(--paper-2);padding:11px 13px;
  }
  .refs .rtitle{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.03em;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .refs .rtitle svg{width:13px;height:13px;}
  .ref{display:flex;gap:9px;font-size:12.5px;color:var(--ink-2);padding:4px 0;}
  .ref b{color:var(--ink);font-weight:600;}
  .ref .rnum{color:var(--accent);font-weight:700;flex:none;font-variant-numeric:tabular-nums;}

  /* typing */
  .typing{display:flex;gap:5px;padding:4px 0;}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-4);animation:blink 1.2s infinite both;}
  .typing i:nth-child(2){animation-delay:.18s;}
  .typing i:nth-child(3){animation-delay:.36s;}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}

  /* ---------------- Composer ---------------- */
  .composer-wrap{
    flex:none;padding:6px 24px 18px;
    background:linear-gradient(to top,var(--paper) 62%,rgba(247,245,240,0));
  }
  .composer{
    max-width:var(--maxw);margin:0 auto;
  }
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .chip{
    border:1px solid var(--line-2);background:var(--paper-2);
    color:var(--ink-2);font-size:12.5px;padding:7px 12px;border-radius:999px;cursor:pointer;
    transition:border-color .15s,background .15s,color .15s;white-space:nowrap;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent-ink);background:#fff;}
  .box{
    border:1px solid var(--line-2);
    background:var(--paper-2);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:8px 8px 8px 16px;
    display:flex;align-items:flex-end;gap:8px;
    transition:border-color .15s,box-shadow .15s;
  }
  .box:focus-within{border-color:#b6bdca;box-shadow:0 0 0 3px var(--accent-soft),var(--shadow);}
  .box textarea{
    flex:1;border:0;background:none;resize:none;outline:none;
    font:inherit;font-size:15px;color:var(--ink);
    line-height:1.5;max-height:160px;padding:7px 0;min-width:0;
  }
  .box textarea::placeholder{color:var(--ink-4);}
  .icobtn{
    border:0;background:none;cursor:pointer;color:var(--ink-3);
    padding:8px;border-radius:9px;line-height:0;flex:none;
  }
  .icobtn:hover{background:#ece7dc;color:var(--ink-2);}
  .icobtn svg{width:19px;height:19px;}
  .send{
    flex:none;width:38px;height:38px;border-radius:11px;border:0;cursor:pointer;
    background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
    transition:background .15s,opacity .15s,transform .05s;
  }
  .send:hover{background:#32465f;}
  .send:active{transform:translateY(1px);}
  .send:disabled{background:#cdc8bb;cursor:default;}
  .send svg{width:18px;height:18px;}
  .foot-note{
    text-align:center;font-size:11px;color:var(--ink-4);margin-top:10px;
  }

  .scrim{display:none;}

  /* ---------------- Mobile ---------------- */
  @media (max-width:820px){
    .app{grid-template-columns:1fr;}
    .sidebar{
      position:fixed;z-index:40;left:0;top:0;bottom:0;width:84vw;max-width:312px;
      transform:translateX(-102%);transition:transform .26s cubic-bezier(.2,.7,.3,1);
      box-shadow:0 0 40px rgba(0,0,0,.18);
    }
    .app.nav-open .sidebar{transform:none;}
    .scrim{
      display:block;position:fixed;inset:0;z-index:35;background:rgba(30,26,20,.32);
      opacity:0;pointer-events:none;transition:opacity .26s;
    }
    .app.nav-open .scrim{opacity:1;pointer-events:auto;}
    .hamburger{display:inline-flex;}
    .thread{padding:22px 16px 16px;}
    .composer-wrap{padding:6px 14px 14px;}
    .msg.me .bubble{max-width:80vw;}
    .mode .mlabel{display:none;}
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="12.5" stroke="#3a4f6e" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="68 12" transform="rotate(35 16 16)"/>
          <circle cx="16" cy="16" r="3" fill="#c08a3e"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">여여 <span style="font-family:Pretendard;font-size:11px;font-weight:500;color:var(--ink-3);">如如</span></div>
        <div class="brand-sub">불교 공부 길동무</div>
      </div>
    </div>

    <button class="new-btn" id="newBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      새 대화 시작
    </button>

    <nav class="convos" id="convos">
      <div class="group-label">오늘</div>
      <button class="convo active" data-id="anger">동료가 내 공을 가로챘을 때</button>
      <button class="convo" data-id="heart">반야심경의 '공(空)' 한 줄 풀이</button>

      <div class="group-label">이번 주</div>
      <button class="convo" data-id="sit">좌선, 다리 저림 없이 앉는 법</button>
      <button class="convo" data-id="impermanence">무상(無常)과 허무주의는 다른가</button>
      <button class="convo" data-id="precept">술자리, 불음주계를 어떻게</button>

      <div class="group-label">지난 30일</div>
      <button class="convo" data-id="memorial">49재, 절차보다 마음가짐</button>
      <button class="convo" data-id="breath">출퇴근 지하철에서 하는 호흡</button>
      <button class="convo" data-id="book">입문서 한 권만 고른다면</button>
    </nav>

    <div class="side-foot">
      <div class="avatar">하</div>
      <div class="who">하준<small>무료 플랜 · 일상 모드</small></div>
      <button class="gear" title="설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <!-- ================= MAIN ================= -->
  <main class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="메뉴">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h1 id="chatTitle">동료가 내 공을 가로챘을 때</h1>
      <button class="mode" id="modeBtn">
        <span class="dot"></span>
        <span class="mlabel">일상 모드</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </header>

    <div class="thread-wrap" id="threadWrap">
      <div class="thread" id="thread">
        <div class="daydiv"><span>오늘 · 오전 9:14</span></div>
        <!-- messages injected by JS -->
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <div class="chips" id="chips">
          <button class="chip">그 감정, 화인지 서운함인지 모르겠어</button>
          <button class="chip">3분짜리 호흡법 알려줘</button>
          <button class="chip">관련 경전 구절 더 보기</button>
        </div>
        <div class="box">
          <textarea id="input" rows="1" placeholder="여여에게 물어보기 — 줄바꿈은 Shift+Enter"></textarea>
          <button class="icobtn" title="첨부" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3 3 0 0 1 4.24 4.24l-9.2 9.19a1 1 0 0 1-1.41-1.41l8.49-8.49"/></svg>
          </button>
          <button class="send" id="send" title="보내기" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          </button>
        </div>
        <div class="foot-note">여여는 수행과 교리 공부를 돕는 안내자예요. 위급한 상황엔 전문가의 도움을 받으세요.</div>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  // ---- bot avatar SVG (enso-ish ring) ----
  var BOT = '<svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="11.5" stroke="#3a4f6e" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="62 14" transform="rotate(35 16 16)"/><circle cx="16" cy="16" r="2.4" fill="#c08a3e"/></svg>';

  // ---- mock conversations ----
  // each message: {who:'bot'|'me', name?, time?, html, refs?}
  var DATA = {
    anger: {
      title:"동료가 내 공을 가로챘을 때",
      day:"오늘 · 오전 9:14",
      msgs:[

      '<button class="tbtn" title="도움이 됐어요"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 10v12"/><path d="M15 5.88L14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88z"/></svg></button>'+
      '<button class="tbtn" title="아쉬워요"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M17 14V2"/><path d="M9 18.12L10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88z"/></svg></button>'+
      '<button class="tbtn" title="다시 답하기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 2v6h6"/><path d="M21 12A9 9 0 0 0 6 5.3L3 8"/><path d="M21 22v-6h-6"/><path d="M3 12a9 9 0 0 0 15 6.7l3-2.7"/></svg></button>'+
      '</div>';
  }

  function msgNode(m){
    var el = document.createElement('div');
    el.className = 'msg ' + (m.who==='me'?'me':'bot');
    if(m.who==='me'){
      el.innerHTML = '<div class="body"><div class="bubble">'+m.html+'</div>'+
        (m.time?'<div class="stamp">'+esc(m.time)+'</div>':'')+'</div>';
    }else{
      el.innerHTML = '<div class="ava">'+BOT+'</div>'+
        '<div class="body">'+
        '<div class="name">'+esc(m.name||'여여')+(m.time?'<small>'+esc(m.time)+'</small>':'')+'</div>'+
        '<div class="bubble-text">'+m.html+'</div>'+
        (m.refs?refsHTML(m.refs):'')+
        toolbarHTML()+
        '</div>';
    }
    return el;
  }

  function render(id){
    var conv = DATA[id];
    if(!conv) return;
    current = id;
    chatTitle.textContent = conv.title;
    thread.innerHTML = '<div class="daydiv"><span>'+esc(conv.day)+'</span></div>';
    conv.msgs.forEach(function(m){ thread.appendChild(msgNode(m)); });
    // jump to bottom without smooth on switch
    threadWrap.style.scrollBehavior='auto';
    threadWrap.scrollTop = threadWrap.scrollHeight;
    threadWrap.style.scrollBehavior='smooth';
    // active state
    Array.prototype.forEach.call(convos.querySelectorAll('.convo'),function(b){
      b.classList.toggle('active', b.dataset.id===id);
    });
  }

  function scrollBottom(){ threadWrap.scrollTop = threadWrap.scrollHeight; }

  // ---- sending ----
  function autoHeight(){
    input.style.height='auto';
    input.style.height = Math.min(input.scrollHeight,160)+'px';
  }
  function refreshSend(){ send.disabled = input.value.trim().length===0; }

  input.addEventListener('input', function(){ autoHeight(); refreshSend(); });
  input.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSend(); }
  });
  send.addEventListener('click', doSend);

  var busy=false;
  function doSend(){
    var text = input.value.trim();
    if(!text || busy) return;
    var now = new Date();
    var hh = now.getHours(), mm = now.getMinutes();
    var ap = hh<12?'오전':'오후'; var h12=hh%12; if(h12===0)h12=12;
    var stamp = ap+' '+h12+':'+(mm<10?'0'+mm:mm);

    thread.appendChild(msgNode({who:'me', time:stamp, html:esc(text).replace(/\n/g,'<br>')}));
    input.value=''; autoHeight(); refreshSend(); scrollBottom();

    busy=true;
    // typing indicator
    var t = document.createElement('div');
    t.className='msg bot';
    t.innerHTML='<div class="ava">'+BOT+'</div><div class="body"><div class="name">여여</div><div class="bubble-text"><div class="typing"><i></i><i></i><i></i></div></div></div>';
    thread.appendChild(t); scrollBottom();

    var reply = CANNED[Math.floor(Math.random()*CANNED.length)];
    setTimeout(function(){
      t.remove();
      var node = msgNode({who:'bot', name:'여여', time:stamp, html:'<p></p>'});
      thread.appendChild(node);
      scrollBottom();
      // word-by-word reveal
      var target = node.querySelector('.bubble-text p');
      var words = reply.split(' ');
      var i=0;
      (function step(){
        if(i<words.length){
          target.textContent += (i?' ':'')+words[i];
          i++; scrollBottom();
          setTimeout(step, 32+Math.random()*36);
        }else{
          busy=false;
        }
      })();
    }, 720);
  }

  // ---- sidebar nav ----
  convos.addEventListener('click', function(e){
    var b = e.target.closest('.convo');
    if(!b) return;
    render(b.dataset.id);
    closeNav();
  });
  newBtn.addEventListener('click', function(){
    current='__new';
    chatTitle.textContent='새 대화';
    thread.innerHTML =
      '<div class="msg bot"><div class="ava">'+BOT+'</div><div class="body">'+
      '<div class="name">여여</div>'+
      '<div class="bubble-text"><p>안녕하세요, 여여예요. 교리든 수행이든, 혹은 그냥 오늘 마음이 시끄러운 일이든 — 무엇이든 편하게 꺼내 보세요. 정답을 주기보다, 같이 들여다보는 쪽으로 도울게요.</p></div>'+
      toolbarHTML()+'</div></div>';
    Array.prototype.forEach.call(convos.querySelectorAll('.convo'),function(x){x.classList.remove('active');});
    closeNav();
    input.focus();
  });

  // chips
  chips.addEventListener('click', function(e){
    var c = e.target.closest('.chip');
    if(!c) return;
    input.value = c.textContent;
    autoHeight(); refreshSend(); input.focus();
  });

  // mobile nav
  function openNav(){ app.classList.add('nav-open'); }
  function closeNav(){ app.classList.remove('nav-open'); }
  hamburger.addEventListener('click', openNav);
  scrim.addEventListener('click', closeNav);

  // boot
  render('anger');
  refreshSend();
})();
</script>
</body>
</html>
