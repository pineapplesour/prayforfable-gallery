<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>미잔 · MĪZĀN — 이슬람 지식 동행자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#091519;
    --bg-1:#0c1d23;
    --panel:#0f2329;
    --panel-2:#102b30;
    --line:rgba(201,162,91,.18);
    --line-soft:rgba(201,162,91,.10);
    --gold:#d9b86a;
    --gold-bright:#f1d896;
    --teal:#3f9d92;
    --teal-deep:#16454a;
    --terra:#c07a4e;
    --ivory:#f1ead8;
    --ivory-dim:#c7c0ad;
    --muted:#8aa09c;
    --muted-2:#637c79;
    --user-bg:linear-gradient(135deg,#1a3a3a,#173034);
    --ai-bg:rgba(14,38,43,.62);
    --radius:18px;
    --serif:"Noto Serif KR",serif;
    --sans:"Noto Sans KR",sans-serif;
    --arab:"Amiri",serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    color:var(--ivory);
    background:var(--bg-0);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- background canvas ---------- */
  #bg{position:fixed;inset:0;z-index:0;display:block;}
  .vignette{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(120% 90% at 70% 18%, rgba(63,157,146,.10), transparent 55%),
      radial-gradient(140% 120% at 20% 100%, rgba(192,122,78,.10), transparent 50%),
      radial-gradient(100% 100% at 50% 50%, transparent 40%, rgba(5,12,15,.72) 100%);
  }

  /* ---------- shell ---------- */
  .app{
    position:relative;z-index:2;
    height:100vh;
    display:grid;
    grid-template-columns:286px minmax(0,1fr) 344px;
  }

  /* ---------- sidebar ---------- */
  .sidebar{
    border-right:1px solid var(--line-soft);
    background:linear-gradient(180deg, rgba(9,21,25,.78), rgba(9,21,25,.55));
    backdrop-filter:blur(10px);
    display:flex;flex-direction:column;
    min-height:0;
  }
  .brand{
    padding:24px 22px 18px;
    display:flex;align-items:center;gap:13px;
    border-bottom:1px solid var(--line-soft);
  }
  .brand .mark{width:40px;height:40px;flex:none;filter:drop-shadow(0 0 10px rgba(217,184,106,.35))}
  .brand .word{line-height:1.05}
  .brand .word b{
    font-family:var(--serif);font-weight:600;letter-spacing:.32em;
    font-size:18px;color:var(--ivory);display:block;
  }
  .brand .word span{
    font-family:var(--arab);font-size:13px;color:var(--gold);
    letter-spacing:.04em;opacity:.92;
  }

  .new-chat{
    margin:18px 18px 6px;
    padding:13px 16px;
    display:flex;align-items:center;gap:10px;justify-content:center;
    border:1px solid var(--line);
    border-radius:13px;
    background:linear-gradient(135deg, rgba(217,184,106,.12), rgba(63,157,146,.06));
    color:var(--ivory);font-size:13.5px;font-weight:500;cursor:pointer;
    transition:.25s;
  }
  .new-chat:hover{border-color:var(--gold);background:linear-gradient(135deg, rgba(217,184,106,.2), rgba(63,157,146,.1));transform:translateY(-1px)}
  .new-chat svg{width:16px;height:16px}

  .nav-label{
    padding:18px 22px 8px;
    font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted-2);font-weight:700;
    display:flex;align-items:center;gap:9px;
  }
  .nav-label::after{content:"";height:1px;flex:1;background:var(--line-soft)}

  .threads{flex:1;overflow-y:auto;padding:4px 12px 18px;min-height:0}
  .thread{
    position:relative;
    padding:13px 14px 13px 16px;
    border-radius:12px;
    cursor:pointer;margin-bottom:3px;
    transition:.2s;
  }
  .thread::before{
    content:"";position:absolute;left:4px;top:50%;transform:translateY(-50%);
    width:6px;height:6px;rotate:45deg;
    background:transparent;border:1px solid var(--muted-2);transition:.2s;
  }
  .thread:hover{background:rgba(63,157,146,.08)}
  .thread.active{background:linear-gradient(90deg, rgba(217,184,106,.13), transparent)}
  .thread.active::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(217,184,106,.6)}
  .thread h4{font-family:var(--serif);font-weight:500;font-size:13.5px;color:var(--ivory);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thread.active h4{color:var(--gold-bright)}
  .thread p{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thread time{font-size:10px;color:var(--muted-2);margin-top:5px;display:block;letter-spacing:.04em}

  .side-foot{
    padding:15px 20px;border-top:1px solid var(--line-soft);
    display:flex;align-items:center;gap:11px;
  }
  .side-foot .ava{width:32px;height:32px;border-radius:9px;background:var(--teal-deep);display:grid;place-items:center;font-family:var(--serif);font-size:13px;color:var(--gold-bright);border:1px solid var(--line)}
  .side-foot .who{line-height:1.25}
  .side-foot .who b{font-size:12.5px;font-weight:500;color:var(--ivory-dim)}
  .side-foot .who span{font-size:10.5px;color:var(--muted-2);display:block}

  /* ---------- main ---------- */
  .main{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}

  .topbar{
    padding:17px 30px;
    display:flex;align-items:center;gap:15px;
    border-bottom:1px solid var(--line-soft);
    background:linear-gradient(180deg, rgba(12,29,35,.55), transparent);
  }
  .topbar .ai-mark{width:38px;height:38px;flex:none}
  .topbar .ai-id{flex:1;line-height:1.2}
  .topbar .ai-id h1{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.01em}
  .topbar .ai-id .sub{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-top:3px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
  .topbar .tools{display:flex;gap:9px}
  .tbtn{
    width:36px;height:36px;border-radius:10px;border:1px solid var(--line-soft);
    background:rgba(255,255,255,.02);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.2s;
  }
  .tbtn:hover{color:var(--gold);border-color:var(--line)}
  .tbtn svg{width:17px;height:17px}

  .menu-btn{display:none}

  .stream{
    flex:1;overflow-y:auto;min-height:0;
    padding:30px 30px 14px;
  }
  .stream-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:26px}

  .daydiv{display:flex;align-items:center;gap:14px;color:var(--muted-2);font-size:11px;letter-spacing:.12em}
  .daydiv::before,.daydiv::after{content:"";height:1px;flex:1;background:var(--line-soft)}
  .daydiv .gem{width:7px;height:7px;rotate:45deg;border:1px solid var(--gold);background:rgba(217,184,106,.2)}

  .msg{display:flex;gap:14px;animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .msg .av{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center}
  .msg.ai .av{background:radial-gradient(circle at 30% 25%, rgba(217,184,106,.22), rgba(22,69,74,.5));border:1px solid var(--line)}
  .msg.ai .av svg{width:24px;height:24px}
  .msg.me{flex-direction:row-reverse}
  .msg.me .av{background:var(--teal-deep);border:1px solid var(--line-soft);font-family:var(--serif);color:var(--gold-bright);font-size:14px}

  .bubble{max-width:78%;position:relative}
  .msg.me .bubble{display:flex;flex-direction:column;align-items:flex-end}
  .role{font-size:11px;color:var(--muted-2);margin:2px 2px 7px;letter-spacing:.06em}
  .msg.ai .role b{color:var(--gold);font-weight:600}

  .body{
    font-family:var(--serif);font-weight:300;
    font-size:14.5px;line-height:1.85;color:var(--ivory);
    padding:16px 19px;border-radius:16px;
  }
  .msg.ai .body{
    background:var(--ai-bg);
    border:1px solid var(--line-soft);
    border-left:2px solid var(--gold);
    backdrop-filter:blur(6px);
  }
  .msg.me .body{
    background:var(--user-bg);
    border:1px solid rgba(63,157,146,.25);
    border-right:2px solid var(--teal);
    color:var(--ivory);
  }
  .body p+p{margin-top:11px}
  .body strong{color:var(--gold-bright);font-weight:600}
  .body em{color:var(--teal);font-style:normal;border-bottom:1px dotted rgba(63,157,146,.5)}

  .ayah{
    margin:14px 0 4px;padding:15px 18px;
    border-radius:13px;
    background:linear-gradient(135deg, rgba(22,69,74,.4), rgba(9,21,25,.3));
    border:1px solid var(--line);
    position:relative;overflow:hidden;
  }
  .ayah::before{
    content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
    background:
      radial-gradient(circle at 100% 0%, rgba(217,184,106,.12), transparent 40%);
  }
  .ayah .ar{font-family:var(--arab);font-size:22px;line-height:1.9;color:var(--gold-bright);direction:rtl;text-align:right;letter-spacing:0}
  .ayah .ko{font-family:var(--serif);font-size:13px;color:var(--ivory-dim);margin-top:9px;font-weight:300}
  .ayah .ref{font-size:11px;color:var(--gold);margin-top:8px;letter-spacing:.05em;font-family:var(--sans)}

  .inline-src{margin-top:13px;display:flex;flex-wrap:wrap;gap:7px}
  .chip-src{
    font-size:11px;color:var(--gold);
    border:1px solid var(--line);border-radius:20px;
    padding:5px 12px;display:inline-flex;align-items:center;gap:6px;
    background:rgba(217,184,106,.06);font-family:var(--sans);
  }
  .chip-src .gem{width:5px;height:5px;rotate:45deg;background:var(--gold)}

  /* typing */
  .typing .body{display:inline-flex;gap:6px;padding:18px 20px}
  .typing .body i{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.4;animation:tp 1.1s infinite}
  .typing .body i:nth-child(2){animation-delay:.18s}
  .typing .body i:nth-child(3){animation-delay:.36s}
  @keyframes tp{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

  /* ---------- composer ---------- */
  .composer{
    padding:8px 30px 22px;
    background:linear-gradient(0deg, rgba(9,21,25,.7), transparent);
  }
  .composer-inner{max-width:760px;margin:0 auto}
  .suggest{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
  .suggest button{
    font-family:var(--sans);font-size:12px;color:var(--ivory-dim);
    border:1px solid var(--line-soft);border-radius:11px;
    padding:8px 13px;background:rgba(255,255,255,.02);cursor:pointer;transition:.2s;
    display:inline-flex;align-items:center;gap:7px;
  }
  .suggest button::before{content:"";width:5px;height:5px;rotate:45deg;background:var(--teal);opacity:.7}
  .suggest button:hover{border-color:var(--gold);color:var(--gold-bright);background:rgba(217,184,106,.07)}

  .field{
    display:flex;align-items:flex-end;gap:12px;
    border:1px solid var(--line);border-radius:16px;
    background:rgba(8,20,24,.7);padding:10px 10px 10px 18px;
    transition:.25s;backdrop-filter:blur(8px);
  }
  .field:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,184,106,.08)}
  .field textarea{
    flex:1;background:none;border:none;outline:none;resize:none;
    color:var(--ivory);font-family:var(--serif);font-size:14.5px;line-height:1.6;
    max-height:120px;padding:7px 0;font-weight:300;
  }
  .field textarea::placeholder{color:var(--muted-2)}
  .send{
    width:42px;height:42px;flex:none;border:none;border-radius:12px;cursor:pointer;
    background:linear-gradient(135deg, var(--gold), var(--terra));
    display:grid;place-items:center;transition:.2s;
  }
  .send:hover{transform:translateY(-2px) rotate(-3deg);filter:brightness(1.1)}
  .send svg{width:19px;height:19px;color:#1a1208}
  .disclaim{text-align:center;font-size:10.5px;color:var(--muted-2);margin-top:11px;letter-spacing:.02em}

  /* ---------- context panel ---------- */
  .context{
    border-left:1px solid var(--line-soft);
    background:linear-gradient(180deg, rgba(9,21,25,.65), rgba(9,21,25,.45));
    backdrop-filter:blur(10px);
    display:flex;flex-direction:column;min-height:0;
  }
  .ctx-head{padding:23px 22px 16px;border-bottom:1px solid var(--line-soft)}
  .ctx-head .kick{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2);font-weight:700}
  .ctx-head h3{font-family:var(--serif);font-size:16px;font-weight:600;margin-top:7px;color:var(--ivory);display:flex;align-items:center;gap:9px}
  .ctx-head h3 .mini{width:16px;height:16px}

  .ctx-body{flex:1;overflow-y:auto;padding:18px;min-height:0;display:flex;flex-direction:column;gap:13px}

  .src-card{
    border:1px solid var(--line-soft);border-radius:14px;
    padding:15px 16px;background:rgba(14,38,43,.4);
    transition:.25s;cursor:default;position:relative;overflow:hidden;
  }
  .src-card:hover{border-color:var(--line);background:rgba(14,38,43,.65)}
  .src-card .tag{
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
    color:var(--teal);display:inline-flex;align-items:center;gap:6px;margin-bottom:9px;
  }
  .src-card.q .tag{color:var(--gold)}
  .src-card .tag .gem{width:5px;height:5px;rotate:45deg;background:currentColor}
  .src-card h5{font-family:var(--serif);font-size:14px;font-weight:500;color:var(--ivory);margin-bottom:7px}
  .src-card p{font-size:12px;line-height:1.7;color:var(--muted);font-family:var(--serif);font-weight:300}
  .src-card .more{margin-top:10px;font-size:11px;color:var(--gold);display:inline-flex;align-items:center;gap:5px;cursor:pointer}
  .src-card .more:hover{color:var(--gold-bright)}
  .src-card .more svg{width:12px;height:12px}

  .ctx-note{
    margin-top:4px;padding:14px 15px;border-radius:13px;
    border:1px dashed var(--line-soft);
    font-size:11.5px;line-height:1.7;color:var(--muted);font-family:var(--serif);font-weight:300;
  }
  .ctx-note b{color:var(--ivory-dim);font-weight:500}

  /* compass ornament */
  .ornament{padding:16px 22px 22px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:13px}
  .ornament .ico{width:40px;height:40px;flex:none}
  .ornament .txt{line-height:1.4}
  .ornament .txt b{font-size:12px;color:var(--gold);font-family:var(--serif);font-weight:500;display:block}
  .ornament .txt span{font-size:10.5px;color:var(--muted-2)}

  /* scrollbars */
  ::-webkit-scrollbar{width:9px}
  ::-webkit-scrollbar-thumb{background:rgba(217,184,106,.16);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(217,184,106,.3);background-clip:padding-box}

  .scrim{display:none}

  /* ---------- responsive ---------- */
  @media(max-width:1180px){
    .app{grid-template-columns:262px minmax(0,1fr)}
    .context{display:none}
  }
  @media(max-width:760px){
    .app{grid-template-columns:1fr}
    .sidebar{
      position:fixed;left:0;top:0;bottom:0;width:280px;z-index:40;
      transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,.7,.2,1);
    }
    .sidebar.open{transform:none}
    .scrim{display:block;position:fixed;inset:0;background:rgba(4,10,12,.6);z-index:39;opacity:0;pointer-events:none;transition:.3s}
    .scrim.show{opacity:1;pointer-events:auto}
    .menu-btn{display:grid}
    .topbar{padding:14px 16px}
    .stream{padding:20px 16px 10px}
    .composer{padding:6px 16px 18px}
    .bubble{max-width:84%}
    .stream-inner{gap:20px}
    .ayah .ar{font-size:19px}
  }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>

  <div class="scrim" id="scrim"></div>

  <div class="app">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="mark" id="brandMark"></span>
        <span class="word"><b>MĪZĀN</b><span>مِيزَان · 미잔</span></span>
      </div>

      <button class="new-chat" id="newChat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
        새로운 대화 펼치기
      </button>

      <div class="nav-label">대화의 결</div>
      <div class="threads" id="threadList"></div>

      <div class="side-foot">
        <div class="ava">يٰ</div>
        <div class="who"><b>야스민 · 게스트</b><span>지식의 길에 함께</span></div>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <main class="main">
      <header class="topbar">
        <button class="tbtn menu-btn" id="menuBtn" aria-label="메뉴">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg>
        </button>
        <span class="ai-mark" id="aiMark"></span>
        <div class="ai-id">
          <h1>미잔 <span style="font-family:var(--arab);color:var(--gold);font-size:14px">المِيزان</span></h1>
          <div class="sub"><span class="dot"></span> 근거를 함께 살피는 이슬람 지식 동행자</div>
        </div>
        <div class="tools">
          <button class="tbtn" title="번역 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h7M7 5v3c0 4-2 7-4 8m1-5c0 2 3 4 6 4M13 19l4-9 4 9m-7-3h6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="tbtn" title="저장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 4h9l4 4v12H6z M9 4v5h6" stroke-linejoin="round"/></svg></button>
        </div>
      </header>

      <div class="stream" id="stream">
        <div class="stream-inner" id="streamInner"></div>
      </div>

      <div class="composer">
        <div class="composer-inner">
          <div class="suggest" id="suggest"></div>
          <div class="field">
            <textarea id="input" rows="1" placeholder="묻고 싶은 것을 적어보세요 — 미잔이 근거와 함께 헤아립니다"></textarea>
            <button class="send" id="send" aria-label="보내기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h13M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <p class="disclaim">미잔은 학문적 견해와 출처를 제시합니다 · 구속력 있는 판단은 가까운 이맘·학자와 상의하세요</p>
        </div>
      </div>
    </main>

    <!-- ============ CONTEXT PANEL ============ -->
    <aside class="context">
      <div class="ctx-head">
        <div class="kick">이번 답변의 결</div>
        <h3><span class="mini" id="ctxMini"></span> 함께 본 근거</h3>
      </div>
      <div class="ctx-body" id="ctxBody"></div>
      <div class="ornament">
        <span class="ico" id="ctxOrn"></span>
        <div class="txt"><b>끝없이 이어지는 문양</b><span>하나에서 무한으로 — 타우히드의 기하학</span></div>
      </div>
    </aside>

  </div>

<script>
/* ========================================================
   기하 별 SVG 생성기 (khatam / octagram)
======================================================== */
function starPath(cx,cy,points,outer,inner,rot){
  const n=points*2; let d="";
  for(let i=0;i<n;i++){
    const r=(i%2===0)?outer:inner;
    const a=rot + i*Math.PI/points - Math.PI/2;
    const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
    d+=(i===0?"M":"L")+x.toFixed(2)+" "+y.toFixed(2)+" ";
  }
  return d+"Z";
}
function starSVG(size,points,outer,inner,opt={}){
  const c=size/2;
  const fill=opt.fill||"none", stroke=opt.stroke||"var(--gold)", sw=opt.sw||1.4;
  const inner2 = opt.double? `<path d="${starPath(c,c,points,outer*0.56,inner*0.5,Math.PI/points)}" fill="${opt.fill2||'rgba(217,184,106,.18)'}" stroke="${stroke}" stroke-width="${sw*0.8}"/>`:"";
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%">
    <path d="${starPath(c,c,points,outer,inner,0)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>
    ${inner2}
  </svg>`;
}

const input=document.getElementById('input');
const sendBtn=document.getElementById('send');
const stream=document.getElementById('stream');
let replyIdx=0;

function autoGrow(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';}
input.addEventListener('input',autoGrow);
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});

function scrollDown(){stream.scrollTop=stream.scrollHeight;}

function send(){
  const v=input.value.trim();
  if(!v)return;
  const t=THREADS[current];
  const um={role:'me',text:`<p>${v.replace(/</g,'&lt;')}</p>`};
  t.messages.push(um);
  streamInner.appendChild(buildMsg(um));
  input.value='';autoGrow();scrollDown();

  // typing indicator
  const typing=document.createElement('div');
  typing.className='msg ai typing';
  typing.innerHTML=`<div class="av">${AI_AV}</div><div class="bubble"><div class="role"><b>미잔</b> · 헤아리는 중</div><div class="body"><i></i><i></i><i></i></div></div>`;
  streamInner.appendChild(typing);scrollDown();

  setTimeout(()=>{
    typing.remove();
    const rm={role:'ai',text:REPLIES[replyIdx%REPLIES.length]};
    replyIdx++;
    t.messages.push(rm);
    streamInner.appendChild(buildMsg(rm));
    scrollDown();
  },1250+Math.random()*500);
}

/* ========================================================
   배경 — 살아있는 기하 타일링 (khatam tessellation)
======================================================== */
const cv=document.getElementById('bg');
const ctx=cv.getContext('2d');
let W,H,DPR,stars=[];
const SPACING=118, OUT=46, INN=18;

function build(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  stars=[];
  const sp=SPACING, w=innerWidth, h=innerHeight;
  for(let y=-sp;y<h+sp;y+=sp){
    for(let x=-sp;x<w+sp;x+=sp){
      // 두 격자를 엇갈리게 — 별과 사이공간
      stars.push({x:x, y:y, big:true});
      stars.push({x:x+sp/2, y:y+sp/2, big:false});
    }
  }
}
build();
addEventListener('resize',build);

/* 빛 위치 — 마우스 따라가되, 멈추면 천천히 공전 */
let light={x:innerWidth*0.7,y:innerHeight*0.25};
let target={x:innerWidth*0.7,y:innerHeight*0.25};
let lastMove=-9999, t0=performance.now();
addEventListener('pointermove',e=>{target.x=e.clientX;target.y=e.clientY;lastMove=performance.now();});

function path8(x,y,out,inn,rot){
  const n=16;
  ctx.beginPath();
  for(let i=0;i<n;i++){
    const r=(i%2===0)?out:inn;
    const a=rot+i*Math.PI/8-Math.PI/2;
    const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.closePath();
}

function frame(now){
  const t=(now-t0)/1000;
  // idle orbit
  if(now-lastMove>2600){
    const a=t*0.18;
    target.x=innerWidth*(0.5+0.34*Math.cos(a));
    target.y=innerHeight*(0.45+0.30*Math.sin(a*1.15));
  }
  light.x+=(target.x-light.x)*0.045;
  light.y+=(target.y-light.y)*0.045;

  // backdrop gradient
  const g=ctx.createLinearGradient(0,0,innerWidth,innerHeight);
  g.addColorStop(0,'#091519'); g.addColorStop(.5,'#0b1c22'); g.addColorStop(1,'#081317');
  ctx.fillStyle=g; ctx.fillRect(0,0,innerWidth,innerHeight);

  const pulse=0.5+0.5*Math.sin(t*0.6);

  for(const s of stars){
    const dx=s.x-light.x, dy=s.y-light.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    const glow=Math.max(0,1-d/360);
    const baseRot=(s.big?0:Math.PI/8) + Math.sin(t*0.25+s.x*0.01+s.y*0.012)*0.05;
    const out=s.big?OUT:OUT*0.5, inn=s.big?INN:INN*0.5;

    // stroke
    const al=0.05 + glow*0.55 + (s.big?0.02:0);
    if(glow>0.04){
      // warm glow fill near light
      path8(s.x,s.y,out*0.5,inn*0.5,baseRot+Math.PI/8);
      ctx.fillStyle=`rgba(217,184,106,${glow*0.10})`;
      ctx.fill();
    }
    path8(s.x,s.y,out,inn,baseRot);
    const gold = glow>0.15;
    if(gold){
      ctx.strokeStyle=`rgba(${241},${216},${150},${al})`;
    }else{
      ctx.strokeStyle=`rgba(63,157,146,${0.06+pulse*0.04})`;
    }
    ctx.lineWidth=s.big?1.2:0.9;
    ctx.stroke();

    // inner double for big stars
    if(s.big && glow>0.1){
      path8(s.x,s.y,out*0.52,inn*0.5,baseRot+Math.PI/8);
      ctx.strokeStyle=`rgba(241,216,150,${glow*0.35})`;
      ctx.lineWidth=0.8; ctx.stroke();
    }
  }

  // soft light bloom
  const bloom=ctx.createRadialGradient(light.x,light.y,0,light.x,light.y,300);
  bloom.addColorStop(0,'rgba(217,184,106,.07)');
  bloom.addColorStop(1,'rgba(217,184,106,0)');
  ctx.fillStyle=bloom; ctx.fillRect(0,0,innerWidth,innerHeight);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ========================================================
   init
======================================================== */
renderThread('t1');
</script>
</body>
