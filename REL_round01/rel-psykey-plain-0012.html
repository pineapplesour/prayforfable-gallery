<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>여백 — 마음 정리 대화</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --bg:#F7F5F1;
    --surface:#FFFFFF;
    --surface-2:#FBFAF7;
    --ink:#2B2824;
    --ink-soft:#5A554E;
    --muted:#938C82;
    --line:#EAE6DF;
    --line-strong:#DED8CF;
    --accent:#5E7363;        /* 차분한 세이지 */
    --accent-ink:#3F5044;
    --accent-wash:#EAEFEA;
    --user-bubble:#33413A;
    --user-ink:#F4F2EC;
    --radius:16px;
    --radius-sm:11px;
    --shadow-sm:0 1px 2px rgba(43,40,36,.04), 0 1px 1px rgba(43,40,36,.03);
    --shadow-md:0 8px 30px rgba(43,40,36,.10);
    --sans:"Pretendard Variable", Pretendard, system-ui, -apple-system, "Segoe UI", sans-serif;
    --sidebar-w:284px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::selection{background:var(--accent-wash)}

  .app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100dvh}

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--surface-2);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    min-height:0;
  }
  .brand{
    display:flex;align-items:center;gap:11px;
    padding:20px 20px 16px;
  }
  .brand .mark{
    width:30px;height:30px;border-radius:9px;flex:0 0 auto;
    background:linear-gradient(150deg,#7C9182,#516455);
    display:grid;place-items:center;box-shadow:var(--shadow-sm);
  }
  .brand .mark svg{display:block}
  .brand .name{font-size:17px;font-weight:700;letter-spacing:-.02em}
  .brand .name b{font-weight:700}
  .brand .name span{color:var(--muted);font-weight:500;font-size:12px;display:block;letter-spacing:.02em;margin-top:1px}

  .newchat{
    margin:4px 14px 12px;
    display:flex;align-items:center;gap:9px;justify-content:center;
    padding:11px 14px;border-radius:11px;
    background:var(--accent);color:#fff;font-size:14px;font-weight:600;
    box-shadow:var(--shadow-sm);transition:background .15s ease, transform .08s ease;
  }
  .newchat:hover{background:var(--accent-ink)}
  .newchat:active{transform:translateY(1px)}

  .search{margin:0 14px 14px;position:relative}
  .search input{
    width:100%;border:1px solid var(--line-strong);background:var(--surface);
    border-radius:10px;padding:9px 12px 9px 33px;font-size:13px;color:var(--ink);
    outline:none;transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search input::placeholder{color:var(--muted)}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}

  .threads{flex:1;overflow-y:auto;padding:0 10px 12px;min-height:0}
  .threads::-webkit-scrollbar{width:9px}
  .threads::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:9px;border:3px solid var(--surface-2)}
  .group-label{
    font-size:11px;font-weight:600;color:var(--muted);
    letter-spacing:.04em;padding:14px 10px 6px;text-transform:uppercase;
  }
  .thread{
    display:block;width:100%;text-align:left;
    padding:9px 11px;border-radius:10px;margin-bottom:2px;
    color:var(--ink-soft);transition:background .12s ease;position:relative;
  }
  .thread:hover{background:#F0EDE6}
  .thread.active{background:#ECE9E1}
  .thread .t-title{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thread .t-preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

  .side-foot{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
  .side-foot .ava{width:32px;height:32px;border-radius:50%;background:#D9D2C7;color:#6B6356;display:grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 auto}
  .side-foot .who{flex:1;min-width:0}
  .side-foot .who b{font-size:13px;font-weight:600;display:block;letter-spacing:-.01em}
  .side-foot .who span{font-size:11.5px;color:var(--muted)}
  .side-foot .gear{color:var(--muted);padding:6px;border-radius:8px;transition:background .12s,color .12s}
  .side-foot .gear:hover{background:#EFEBE3;color:var(--ink)}

  /* ---------- Main ---------- */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
  .topbar{
    height:60px;flex:0 0 auto;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:0 22px;background:rgba(247,245,241,.86);backdrop-filter:blur(8px)
  }
  .hamb{display:none;color:var(--ink-soft);padding:7px;border-radius:8px}
  .hamb:hover{background:#EDEAE2}
  .topbar .title-wrap{flex:1;min-width:0}
  .topbar .title{font-size:15px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .sub{font-size:12px;color:var(--muted);margin-top:1px;display:flex;align-items:center;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
  .badge{
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--accent-ink);
    background:var(--accent-wash);padding:5px 10px;border-radius:99px;flex:0 0 auto
  }

  .scroll{flex:1;overflow-y:auto;min-height:0}
  .scroll::-webkit-scrollbar{width:11px}
  .scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:9px;border:3px solid var(--bg)}
  .stream{max-width:760px;margin:0 auto;padding:30px 24px 8px}

  .daydiv{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:11.5px;font-weight:600;margin:6px 0 22px}
  .daydiv::before,.daydiv::after{content:"";height:1px;background:var(--line);flex:1}

  .msg{display:flex;gap:13px;margin-bottom:22px;align-items:flex-start}
  .msg .ava{
    width:32px;height:32px;border-radius:9px;flex:0 0 auto;margin-top:2px;
    background:linear-gradient(150deg,#7C9182,#516455);display:grid;place-items:center;box-shadow:var(--shadow-sm)
  }
  .msg .body{min-width:0;max-width:100%}
  .msg .meta{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
  .msg .meta b{font-size:13px;font-weight:700;letter-spacing:-.01em}
  .msg .meta time{font-size:11px;color:var(--muted)}
  .bubble{
    background:var(--surface);border:1px solid var(--line);
    padding:13px 16px;border-radius:4px var(--radius) var(--radius) var(--radius);
    font-size:14.5px;line-height:1.72;color:var(--ink);box-shadow:var(--shadow-sm);
    word-break:break-word;
  }
  .bubble p+p{margin-top:11px}
  .bubble em{font-style:normal;background:var(--accent-wash);color:var(--accent-ink);padding:1px 5px;border-radius:5px;font-weight:600}

  /* user message: right aligned */
  .msg.me{flex-direction:row-reverse}
  .msg.me .body{display:flex;flex-direction:column;align-items:flex-end}
  .msg.me .ava{background:#D9D2C7;color:#6B6356;font-size:13px;font-weight:700}
  .msg.me .meta{flex-direction:row-reverse}
  .msg.me .bubble{
    background:var(--user-bubble);color:var(--user-ink);border-color:transparent;
    border-radius:var(--radius) 4px var(--radius) var(--radius);
  }

  /* technique card inside assistant message */
  .card{
    margin-top:11px;border:1px solid var(--line-strong);border-radius:12px;
    background:var(--surface-2);padding:13px 15px;
  }
  .card .ck{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--accent-ink);letter-spacing:.02em;margin-bottom:7px;text-transform:uppercase}
  .card .ct{font-size:14px;font-weight:700;margin-bottom:5px;letter-spacing:-.01em}
  .card .cd{font-size:13px;line-height:1.65;color:var(--ink-soft)}
  .card .crow{display:flex;gap:18px;margin-top:10px}
  .card .crow div{flex:1}
  .card .crow .lab{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px}
  .card .crow .val{font-size:13px;color:var(--ink);line-height:1.5}

  /* typing */
  .typing .bubble{display:inline-flex;gap:5px;align-items:center;padding:15px 18px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.5;animation:blink 1.3s infinite ease-in-out}
  .typing span:nth-child(2){animation-delay:.18s}
  .typing span:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-4px);opacity:.9}}

  /* ---------- Composer ---------- */
  .composer{flex:0 0 auto;padding:6px 24px 16px;background:linear-gradient(180deg,rgba(247,245,241,0),var(--bg) 30%)}
  .chips{max-width:760px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    font-size:12.5px;font-weight:600;color:var(--accent-ink);
    background:var(--surface);border:1px solid var(--line-strong);
    padding:7px 13px;border-radius:99px;transition:background .12s,border-color .12s,transform .08s;
  }
  .chip:hover{background:var(--accent-wash);border-color:var(--accent)}
  .chip:active{transform:translateY(1px)}

  .inputwrap{
    max-width:760px;margin:0 auto;background:var(--surface);
    border:1px solid var(--line-strong);border-radius:18px;
    padding:8px 8px 8px 16px;display:flex;align-items:flex-end;gap:8px;
    box-shadow:var(--shadow-md);transition:border-color .15s ease, box-shadow .15s ease;
  }
  .inputwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash), var(--shadow-md)}
  .inputwrap textarea{
    flex:1;border:none;outline:none;resize:none;background:transparent;
    font-family:inherit;font-size:14.5px;line-height:1.6;color:var(--ink);
    padding:9px 0;max-height:160px;
  }
  .inputwrap textarea::placeholder{color:var(--muted)}
  .send{
    width:38px;height:38px;border-radius:11px;flex:0 0 auto;
    background:var(--accent);color:#fff;display:grid;place-items:center;
    transition:background .15s ease, transform .08s ease, opacity .15s ease;
  }
  .send:hover{background:var(--accent-ink)}
  .send:active{transform:translateY(1px)}
  .send:disabled{opacity:.4;cursor:default}
  .disc{max-width:760px;margin:9px auto 0;text-align:center;font-size:11px;color:var(--muted);line-height:1.5}
  .disc a{color:var(--ink-soft);text-decoration:underline;text-underline-offset:2px}

  /* mobile */
  .backdrop{display:none}
  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    .sidebar{
      position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);z-index:40;
      transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
      box-shadow:var(--shadow-md);
    }
    .sidebar.open{transform:none}
    .hamb{display:grid;place-items:center}
    .backdrop.show{display:block;position:fixed;inset:0;background:rgba(43,40,36,.32);z-index:30}
    .stream,.composer .chips,.inputwrap,.disc{max-width:100%}
    .topbar{padding:0 16px}
    .stream{padding:22px 16px 8px}
    .composer{padding:6px 16px 14px}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="1.7" opacity=".55"/>
          <path d="M12 3a9 9 0 0 1 0 18" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="name"><b>여백</b><span>마음 정리 대화</span></div>
    </div>

    <button class="newchat" id="newChat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      새 대화 시작
    </button>

    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-3.2-3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input type="text" placeholder="대화 검색" id="searchInput" />
    </div>

    <nav class="threads" id="threads">
      <div class="group-label">오늘</div>
      <button class="thread active" data-id="rumination">
        <div class="t-title">되새김에서 빠져나오기</div>
        <div class="t-preview">머릿속에 맴도는 장면 정리하기</div>
      </button>
      <button class="thread" data-id="sleep">
        <div class="t-title">잠들기 어려운 밤</div>
        <div class="t-preview">생각을 이기지 말고 속도 늦추기</div>
      </button>
      <div class="group-label">지난 7일</div>
      <button class="thread" data-id="present">
        <div class="t-title">발표 전 긴장 다루기</div>
        <div class="t-preview">떨림을 신호로 다시 읽기</div>
      </button>
      <button class="thread" data-id="boundary">
        <div class="t-title">거절이 어려울 때</div>
        <div class="t-preview">'미안함'과 '책임' 구분하기</div>
      </button>
      <button class="thread" data-id="compare">
        <div class="t-title">남과 비교가 멈추지 않을 때</div>
        <div class="t-preview">피드 대신 기준점 바꾸기</div>
      </button>
    </nav>

    <div class="side-foot">
      <div class="ava">서</div>
      <div class="who"><b>서연</b><span>개인 기록 · 동기화됨</span></div>
      <button class="gear" aria-label="설정">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 0 1-4 0v-.1A1.6 1.6 0 0 0 7 19.3a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 0 1 0-4h.1A1.6 1.6 0 0 0 2.7 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9 2.6h0A1.6 1.6 0 0 0 10 1.1V1a2 2 0 0 1 4 0v.1A1.6 1.6 0 0 0 17 2.7a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.2a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1.4 1z" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
    </div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <!-- ===== Main ===== -->
  <main class="main">
    <header class="topbar">
      <button class="hamb" id="hamb" aria-label="메뉴">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="title-wrap">
        <div class="title" id="chatTitle">되새김에서 빠져나오기</div>
        <div class="sub"><span class="dot"></span> 여백 · 응답 중심 모드</div>
      </div>
      <span class="badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8"/></svg>
        비공개 기록
      </span>
    </header>

    <div class="scroll" id="scroll">
      <div class="stream" id="stream"><!-- messages injected --></div>
    </div>

    <div class="composer">
      <div class="chips" id="chips"></div>
      <div class="inputwrap">
        <textarea id="input" rows="1" placeholder="지금 떠오르는 생각을 그대로 적어도 괜찮아요…"></textarea>
        <button class="send" id="send" aria-label="보내기" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h13M12 5l7 7-7 7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <p class="disc">여백은 전문 의료·상담을 대신하지 않아요. 위급하다고 느껴지면 <a href="#">상담 연결</a>을 눌러 도움받을 수 있는 곳을 안내해 드릴게요.</p>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  /* ---------- mock conversation data ---------- */
  const A = "assistant", U = "user";
  const THREADS = {
    rumination: {
      title:"되새김에서 빠져나오기",
      day:"오늘 · 6월 21일",
      msgs:[
        {r:U,t:"오늘 회의에서 한 말이 계속 머릿속에 맴돌아요. 별것도 아닌데, 자려고 누우면 그 장면만 반복돼요.",time:"22:41"},
        {r:A,t:"그 장면이 자꾸 돌아온다는 건, 머리가 아직 그 상황을 ‘처리 중’이라는 신호일 때가 많아요. 어떤 부분이 가장 선명하게 남아 있나요 — 내가 한 말인지, 아니면 그때 다른 사람들의 표정 같은 건지?",time:"22:41"},
        {r:U,t:"제가 말을 더듬은 거요. 팀장이 살짝 웃었던 것 같기도 하고.",time:"22:43"},
        {r:A,t:"‘웃었던 <em>것 같기도</em> 하고’ — 거기 들어간 ‘같다’가 눈에 띄어요. 확실히 본 장면과, 내가 채워 넣은 해석을 잠깐 나눠볼까요?",time:"22:43",
          card:{k:"함께 해보기",ti:"사실과 해석 나누기",d:"같은 장면을 두 칸으로 적어보면, 뇌가 ‘위협’으로 묶어둔 걸 풀어서 볼 수 있어요.",
            rows:[["실제로 일어난 일","말을 한 번 고쳐 말했다"],["내가 덧붙인 해석","사람들이 나를 한심하게 봤다"]]}},
        {r:U,t:"사실만 적으면… 제가 한 문장을 두 번 고쳐 말했다. 그게 다네요.",time:"22:46"},
        {r:A,t:"그게 다예요. 나머지(웃음의 의미, 사람들이 날 어떻게 봤을까)는 아직 증거가 없는 가설이고요. 가설을 사실처럼 다루면 뇌는 계속 경보를 울려요. 오늘 밤 그 장면이 또 떠오르면, ‘이건 해석이다’라고 한 줄로 라벨만 붙여보는 건 어때요?",time:"22:46"},
        {r:U,t:"해볼게요. 근데 그래도 잠은 안 올 것 같은데.",time:"22:48"},

      ],
      chips:["내 상황에 맞는 문장","죄책감이 올라올 때","상대가 서운해하면"]
    },
    compare:{
      title:"남과 비교가 멈추지 않을 때",

      msgs:[

        {r:A,t:"피드는 남들의 ‘완성본’과 내 ‘작업 중인 과정’을 나란히 놓아요. 애초에 공정한 비교가 아니죠. 그래도 비교 자체를 막긴 어려우니, 기준점을 바꿔볼게요 — 3개월 전의 나와 비교하면, 지금 달라진 게 뭐가 있을까요?",time:"23:19"},

      ],
      chips:["오늘 움직인 한 칸 적기","피드 줄이는 현실적 방법","그래도 조급할 때"]
    }
  };

  /* ---------- canned assistant replies for live sending ---------- */
  const REPLIES = [
    "좋아요, 천천히 가볼게요. 방금 적은 것 중에서 가장 마음이 걸리는 단어 하나만 골라볼래요? 거기서부터 풀어보면 돼요.",
    "그렇게 느낄 만해요. 그 감정을 ‘없애야 할 것’이 아니라 ‘무언가를 알려주는 신호’로 본다면, 지금 무엇을 알려주려는 걸까요?",
    "지금 그 생각이 ‘사실’에 가까운지, ‘해석’에 가까운지 한 번 나눠볼게요. 확실히 일어난 일만 한 문장으로 적는다면 뭐라고 쓸 수 있을까요?",
    "잘 말해줬어요. 한 번에 다 정리하지 않아도 괜찮아요. 오늘은 여기까지만 짚고, 작게 한 가지만 시도해 본다면 무엇이 좋을까요?"
  ];
  let replyIdx = 0;

  /* ---------- DOM refs ---------- */
  const stream = document.getElementById('stream');
  const scroll = document.getElementById('scroll');
  const chipsEl = document.getElementById('chips');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const chatTitle = document.getElementById('chatTitle');
  const threadsEl = document.getElementById('threads');
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('backdrop');

  let current = 'rumination';

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  // keep <em> tags from data while escaping the rest
  function rich(t){
    return esc(t).replace(/&lt;em&gt;/g,'<em>').replace(/&lt;\/em&gt;/g,'</em>');
  }

  function avatar(role){
    if(role===U) return '<div class="ava">서</div>';
    return '<div class="ava" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="1.7" opacity=".55"/><path d="M12 3a9 9 0 0 1 0 18" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg></div>';
  }

  function cardHTML(c){
    let rows = c.rows.map(r=>`<div><div class="lab">${esc(r[0])}</div><div class="val">${esc(r[1])}</div></div>`).join('');
    return `<div class="card"><div class="ck">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 3v18M3 12h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".5"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/></svg>
      ${esc(c.k)}</div>
      <div class="ct">${esc(c.ti)}</div>
      <div class="cd">${esc(c.d)}</div>
      <div class="crow">${rows}</div></div>`;
  }

  function msgHTML(m){
    const me = m.r===U;
    const name = me ? '서연' : '여백';
    const paras = m.t.split('\n').map(p=>`<p>${rich(p)}</p>`).join('');
    const card = m.card ? cardHTML(m.card) : '';
    return `<div class="msg ${me?'me':''}">${avatar(m.r)}
      <div class="body">
        <div class="meta"><b>${name}</b><time>${esc(m.time||'')}</time></div>
        <div class="bubble">${paras}${card}</div>
      </div></div>`;
  }

  function renderThread(id){
    const th = THREADS[id];
    if(!th) return;
    current = id;
    chatTitle.textContent = th.title;
    let html = `<div class="daydiv">${esc(th.day)}</div>`;
    html += th.msgs.map(msgHTML).join('');
    stream.innerHTML = html;
    chipsEl.innerHTML = th.chips.map(c=>`<button class="chip">${esc(c)}</button>`).join('');
    replyIdx = 0;
    scrollBottom(false);
  }

  function scrollBottom(smooth){
    requestAnimationFrame(()=>{
      scroll.scrollTo({top:scroll.scrollHeight, behavior: smooth?'smooth':'auto'});
    });
  }

  function nowTime(){
    const d = new Date();
    return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }

  function appendUser(text){
    const el = document.createElement('div');
    el.innerHTML = msgHTML({r:U,t:text,time:nowTime()});
    stream.appendChild(el.firstChild);
    scrollBottom(true);
  }

  function showTyping(){
    const div = document.createElement('div');
    div.className = 'msg typing';
    div.id = 'typing';
    div.innerHTML = avatar(A)+'<div class="body"><div class="meta"><b>여백</b></div><div class="bubble"><span></span><span></span><span></span></div></div>';
    stream.appendChild(div);
    scrollBottom(true);
  }
  function removeTyping(){ const t=document.getElementById('typing'); if(t) t.remove(); }

  function appendAssistant(text){
    const el = document.createElement('div');
    el.innerHTML = msgHTML({r:A,t:text,time:nowTime()});
    stream.appendChild(el.firstChild);
    scrollBottom(true);
  }

  function sendMessage(text){
    text = (text||'').trim();
    if(!text) return;
    appendUser(text);
    input.value='';
    autoGrow();
    sendBtn.disabled = true;
    showTyping();
    const reply = REPLIES[replyIdx % REPLIES.length];
    replyIdx++;
    setTimeout(()=>{
      removeTyping();
      appendAssistant(reply);
    }, 900 + Math.random()*700);
  }

  /* ---------- events ---------- */
  function autoGrow(){
    input.style.height='auto';
    input.style.height = Math.min(input.scrollHeight,160)+'px';
  }
  input.addEventListener('input', ()=>{
    autoGrow();
    sendBtn.disabled = input.value.trim()==='';
  });
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage(input.value);
    }
  });
  sendBtn.addEventListener('click', ()=>sendMessage(input.value));

  chipsEl.addEventListener('click', e=>{
    const c = e.target.closest('.chip');
    if(c) sendMessage(c.textContent);
  });

  threadsEl.addEventListener('click', e=>{
    const t = e.target.closest('.thread');
    if(!t) return;
    threadsEl.querySelectorAll('.thread').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    renderThread(t.dataset.id);
    closeSidebar();
  });

  document.getElementById('newChat').addEventListener('click', ()=>{
    threadsEl.querySelectorAll('.thread').forEach(x=>x.classList.remove('active'));
    current='__new';
    chatTitle.textContent='새 대화';
    stream.innerHTML = `<div class="daydiv">${nowTime()} · 새 대화</div>`+
      msgHTML({r:A,t:"안녕하세요. 무엇이든 떠오르는 대로 적어주세요. 정리된 문장이 아니어도 괜찮아요 — 여기서 같이 풀어가면 돼요.",time:nowTime()});
    chipsEl.innerHTML = ["요즘 머리가 복잡해요","잠을 잘 못 자요","뭐부터 말할지 모르겠어요"]
      .map(c=>`<button class="chip">${c}</button>`).join('');
    replyIdx=0;
    scrollBottom(false);
    input.focus();
    closeSidebar();
  });

  // search filter
  document.getElementById('searchInput').addEventListener('input', e=>{
    const q = e.target.value.trim().toLowerCase();
    threadsEl.querySelectorAll('.thread').forEach(t=>{
      const txt = t.textContent.toLowerCase();
      t.style.display = txt.includes(q) ? '' : 'none';
    });
    threadsEl.querySelectorAll('.group-label').forEach(g=>{
      g.style.display = q ? 'none' : '';
    });
  });

  // mobile drawer
  function openSidebar(){ sidebar.classList.add('open'); backdrop.classList.add('show'); }
  function closeSidebar(){ sidebar.classList.remove('open'); backdrop.classList.remove('show'); }
  document.getElementById('hamb').addEventListener('click', openSidebar);
  backdrop.addEventListener('click', closeSidebar);

  /* ---------- init (first paint = the chat) ---------- */
  renderThread('rumination');
})();
</script>
</body>
