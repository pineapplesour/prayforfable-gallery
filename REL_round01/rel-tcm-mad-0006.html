<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>脈經 · 기(氣)를 읽는 대화</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#070d0b;
    --ink2:#0a1411;
    --paper:#ece4d3;
    --paper-dim:#9aa39a;
    --paper-faint:#69736b;
    --mok:#54b07e;   /* 木 wood - jade */
    --hwa:#e2563a;   /* 火 fire - cinnabar */
    --to:#d8a64f;    /* 土 earth - ochre */
    --geum:#cdd6cf;  /* 金 metal - silver */
    --su:#4d86c0;    /* 水 water - indigo */
    --glass:rgba(12,20,17,.52);
    --edge:rgba(120,180,150,.16);
    --edge-bright:rgba(120,200,160,.4);
    --serif:'Noto Serif KR',serif;
    --sans:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:radial-gradient(120% 120% at 70% 8%, #0d1813 0%, #070d0b 55%, #040806 100%);
    color:var(--paper);
    font-family:var(--sans);
    overflow:hidden;
    display:grid;place-items:center;
    height:100dvh;
  }
  #qi{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(110% 90% at 50% 50%, transparent 52%, rgba(2,6,4,.62) 100%);}
  .grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.04;mix-blend-mode:overlay;
    background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px);}

  /* ===== APP CARD ===== */
  .app{
    position:relative;z-index:2;
    width:min(1180px,95vw);height:min(848px,92dvh);
    display:grid;
    grid-template-columns:268px 1fr;
    grid-template-rows:auto 1fr;
    background:var(--glass);
    backdrop-filter:blur(16px) saturate(120%);
    -webkit-backdrop-filter:blur(16px) saturate(120%);
    border:1px solid var(--edge);
    border-radius:22px;
    box-shadow:0 40px 120px -30px rgba(0,0,0,.8),
               inset 0 1px 0 rgba(255,255,255,.05);
    overflow:hidden;
  }

  /* ===== HEADER ===== */
  header{
    grid-column:1/-1;
    display:flex;align-items:center;gap:18px;
    padding:16px 22px;
    border-bottom:1px solid var(--edge);
    background:linear-gradient(180deg, rgba(20,32,26,.45), rgba(8,14,11,.1));
  }
  .seal{
    width:46px;height:46px;flex:0 0 auto;border-radius:13px;
    display:grid;place-items:center;
    font-family:var(--serif);font-weight:700;font-size:22px;color:#0a1411;
    background:
      radial-gradient(140% 140% at 30% 20%, #7fd6a3, var(--mok) 60%, #2e7a52);
    box-shadow:0 0 0 1px rgba(127,214,163,.35),0 6px 22px -6px rgba(84,176,126,.6),
               inset 0 1px 2px rgba(255,255,255,.5);
    position:relative;overflow:hidden;
  }
  .seal::after{content:"";position:absolute;inset:0;
    background:radial-gradient(60% 60% at 50% 120%, rgba(255,255,255,.4), transparent 70%);}
  .brand h1{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:.04em;line-height:1.1;}
  .brand h1 b{color:var(--mok);font-weight:700;}
  .brand p{font-size:11px;color:var(--paper-faint);letter-spacing:.16em;margin-top:3px;font-weight:300;}
  .pulsewrap{flex:1;min-width:0;height:48px;position:relative;display:flex;align-items:center;}
  #pulse{width:100%;height:100%;display:block;}
  .pulse-label{position:absolute;right:8px;top:4px;font-size:9px;letter-spacing:.22em;color:var(--paper-faint);}
  .sijin{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;
    padding-left:16px;border-left:1px solid var(--edge);
  }
  .sijin .gan{font-family:var(--serif);font-size:15px;color:var(--to);letter-spacing:.1em;}
  .sijin .org{font-size:10px;color:var(--paper-dim);letter-spacing:.06em;}
  .sijin .dot{width:6px;height:6px;border-radius:50%;background:var(--to);box-shadow:0 0 10px var(--to);
    animation:breathe 3.4s ease-in-out infinite;align-self:flex-end;margin-top:1px;}
  @keyframes breathe{0%,100%{opacity:.4;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}

  /* ===== LEFT RAIL ===== */
  .rail{
    grid-row:2;grid-column:1;
    border-right:1px solid var(--edge);
    padding:22px 20px;
    display:flex;flex-direction:column;gap:24px;
    overflow:hidden;
    background:linear-gradient(180deg, rgba(10,18,14,.2), rgba(6,11,9,.05));
  }
  .rail h2{font-size:10px;letter-spacing:.26em;color:var(--paper-faint);font-weight:500;margin-bottom:14px;text-transform:uppercase;}
  .ohaeng{display:flex;flex-direction:column;gap:13px;}
  .el{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;}
  .el .hj{font-family:var(--serif);font-size:16px;text-align:center;}
  .el .nm{font-size:11px;color:var(--paper-dim);letter-spacing:.04em;}
  .el .bar{grid-column:2/-1;height:5px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;position:relative;margin-top:2px;}
  .el .fill{position:absolute;inset:0;width:50%;border-radius:4px;transform-origin:left;}
  .el-row{display:flex;flex-direction:column;gap:5px;}
  .el-head{display:flex;align-items:center;gap:8px;}
  .el .pct{font-size:10px;color:var(--paper-faint);margin-left:auto;font-variant-numeric:tabular-nums;}

  .legend{margin-top:auto;padding-top:18px;border-top:1px solid var(--edge);}
  .legend p{font-size:11px;line-height:1.7;color:var(--paper-faint);font-weight:300;}
  .legend .q{font-family:var(--serif);color:var(--mok);font-size:13px;display:block;margin-bottom:6px;letter-spacing:.05em;}

  /* ===== CHAT ===== */
  .chat{
    grid-row:2;grid-column:2;
    display:flex;flex-direction:column;min-height:0;position:relative;
  }
  .scroll{
    flex:1;overflow-y:auto;overflow-x:hidden;
    padding:26px 30px 14px;
    display:flex;flex-direction:column;gap:18px;
    scrollbar-width:thin;scrollbar-color:rgba(120,180,150,.25) transparent;
  }
  .scroll::-webkit-scrollbar{width:6px;}
  .scroll::-webkit-scrollbar-thumb{background:rgba(120,180,150,.22);border-radius:6px;}

  .sysline{align-self:center;font-size:10px;letter-spacing:.22em;color:var(--paper-faint);
    padding:5px 14px;border:1px solid var(--edge);border-radius:30px;
    background:rgba(8,14,11,.4);text-transform:uppercase;}

  .msg{display:flex;gap:12px;max-width:80%;
    animation:rise .7s cubic-bezier(.16,.84,.34,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
  .msg .av{width:34px;height:34px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;
    font-family:var(--serif);font-size:15px;font-weight:500;margin-top:2px;}
  .msg.ai{align-self:flex-start;}
  .msg.ai .av{color:#08120d;background:radial-gradient(140% 140% at 30% 20%,#86dca8,var(--mok) 65%,#2c7850);
    box-shadow:0 4px 16px -4px rgba(84,176,126,.55),inset 0 1px 1px rgba(255,255,255,.5);}
  .msg.me{align-self:flex-end;flex-direction:row-reverse;}
  .msg.me .av{color:var(--to);background:rgba(216,166,79,.1);border:1px solid rgba(216,166,79,.35);font-size:12px;}

  .bubble{
    padding:14px 17px;border-radius:16px;font-size:14.5px;line-height:1.78;letter-spacing:-.01em;
    position:relative;word-break:keep-all;
  }
  .ai .bubble{
    background:linear-gradient(165deg, rgba(22,38,30,.82), rgba(12,22,17,.78));
    border:1px solid var(--edge-bright);border-top-left-radius:5px;
    box-shadow:0 10px 30px -14px rgba(0,0,0,.7);color:#e6ecdf;
  }
  .me .bubble{
    background:linear-gradient(165deg, rgba(60,46,18,.6), rgba(40,30,12,.5));
    border:1px solid rgba(216,166,79,.28);border-top-right-radius:5px;color:#f0e6d2;
  }
  .bubble .hl{color:var(--mok);font-weight:500;}
  .me .bubble .hl{color:var(--to);}
  .bubble .pt{font-family:var(--serif);color:var(--to);font-weight:500;border-bottom:1px dotted rgba(216,166,79,.5);}
  .ai .bubble .pt{color:#8fd6ac;border-color:rgba(143,214,172,.45);}

  .caret{display:inline-block;width:7px;height:15px;margin-left:1px;vertical-align:-2px;
    background:var(--mok);border-radius:1px;animation:blink .9s steps(1) infinite;box-shadow:0 0 8px var(--mok);}
  @keyframes blink{50%{opacity:0}}

  /* typing pulse indicator */
  .typing{display:flex;align-items:center;gap:6px;padding:6px 2px;}
  .typing span{width:8px;height:8px;border-radius:50%;background:var(--mok);opacity:.4;
    animation:tp 1.2s ease-in-out infinite;box-shadow:0 0 10px rgba(84,176,126,.7);}
  .typing span:nth-child(2){animation-delay:.18s}
  .typing span:nth-child(3){animation-delay:.36s}
  @keyframes tp{0%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-5px)}}

  /* ===== COMPOSER ===== */
  .composer{
    border-top:1px solid var(--edge);padding:14px 22px 18px;
    background:linear-gradient(0deg, rgba(14,24,19,.5), transparent);
  }
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{font-size:12px;color:var(--paper-dim);padding:6px 13px;border-radius:30px;cursor:pointer;
    border:1px solid var(--edge);background:rgba(10,18,14,.4);transition:.25s;letter-spacing:.02em;white-space:nowrap;}
  .chip:hover{color:var(--mok);border-color:var(--edge-bright);background:rgba(84,176,126,.08);transform:translateY(-1px);}
  .inrow{display:flex;align-items:flex-end;gap:11px;
    background:rgba(7,13,10,.7);border:1px solid var(--edge);border-radius:16px;padding:8px 8px 8px 18px;
    transition:border-color .25s,box-shadow .25s;}
  .inrow:focus-within{border-color:var(--edge-bright);box-shadow:0 0 0 3px rgba(84,176,126,.1);}
  .inrow textarea{
    flex:1;background:none;border:none;outline:none;resize:none;color:var(--paper);
    font-family:var(--sans);font-size:14.5px;line-height:1.5;max-height:96px;padding:7px 0;
  }
  .inrow textarea::placeholder{color:var(--paper-faint);}
  .send{width:42px;height:42px;flex:0 0 auto;border-radius:12px;border:none;cursor:pointer;
    display:grid;place-items:center;color:#08120d;
    background:radial-gradient(140% 140% at 30% 20%,#86dca8,var(--mok) 65%,#2c7850);
    box-shadow:0 6px 18px -6px rgba(84,176,126,.6);transition:.2s;}
  .send:hover{transform:translateY(-1px) scale(1.04);}
  .send:active{transform:scale(.94);}
  .send svg{width:20px;height:20px;}
  .disclaim{font-size:10px;color:var(--paper-faint);text-align:center;margin-top:10px;letter-spacing:.08em;}

  /* ===== MOBILE ===== */
  @media (max-width:760px){
    body{align-items:stretch;}
    .app{width:100vw;height:100dvh;border-radius:0;border-left:none;border-right:none;
      grid-template-columns:1fr;grid-template-rows:auto 1fr;}
    .rail{display:none;}
    .chat{grid-column:1;}
    header{padding:12px 15px;gap:12px;}
    .seal{width:40px;height:40px;font-size:19px;border-radius:11px;}
    .brand h1{font-size:16px;}
    .pulsewrap{display:none;}
    .sijin{padding-left:0;border-left:none;margin-left:auto;}
    .scroll{padding:18px 16px 10px;gap:14px;}
    .msg{max-width:88%;}
    .composer{padding:12px 14px calc(14px + env(safe-area-inset-bottom));}
    .chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .chips::-webkit-scrollbar{display:none;}
  }
  @media (max-width:760px) and (min-width:561px){.pulsewrap{display:flex;}}
</style>
</head>
<body>
  <canvas id="qi"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>

  <main class="app">
    <header>
      <div class="seal">溫</div>
      <div class="brand">
        <h1><b>脈經</b> 맥경</h1>
        <p>氣 · 한의 상담 인터페이스</p>
      </div>
      <div class="pulsewrap">
        <canvas id="pulse"></canvas>
        <span class="pulse-label">寸關尺 · 脈診</span>
      </div>
      <div class="sijin">
        <span class="gan" id="ganji">子時</span>
        <span class="org" id="org">담경(膽經)이 깨어있는 시간</span>
        <span class="dot"></span>
      </div>
    </header>

    <aside class="rail">
      <div>
        <h2>五行 · 기 균형</h2>
        <div class="ohaeng" id="ohaeng"></div>
      </div>
      <div class="legend">
        <p>
          <span class="q">不通則痛</span>
          막히면 아프고, 통하면 아프지 않다. 온(溫)은 당신의 결을 따라 흐름이 멈춘 자리를 함께 짚습니다.
        </p>
      </div>
    </aside>

    <section class="chat">
      <div class="scroll" id="scroll"></div>
      <div class="composer">
        <div class="chips" id="chips">
          <div class="chip" data-q="저는 평소 추위를 잘 타는 편이에요. 어떤 차가 맞을까요?">차 추천</div>
          <div class="chip" data-q="밤에 잠을 깊게 못 자요. 어떻게 하면 좋을까요?">수면</div>
          <div class="chip" data-q="기운 올리는 지압 혈자리 알려주세요.">지압 혈자리</div>
          <div class="chip" data-q="제 체질이 궁금해요. 어떻게 알 수 있나요?">체질</div>
          <div class="chip" data-q="요즘 자주 두통이 있어요.">두통</div>
        </div>
        <div class="inrow">
          <textarea id="input" rows="1" placeholder="증상을 들려주세요 — 언제부터, 무엇과 함께 오는지…"></textarea>
          <button class="send" id="send" aria-label="보내기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-3-7-7-1z"/></svg>
          </button>
        </div>
        <p class="disclaim">일반적 건강 정보이며 의학적 진단이 아닙니다 · 증상이 지속되면 전문의와 상담하세요</p>
      </div>
    </section>
  </main>

<script>
/* ============================================================
   氣 FIELD  — flowing qi/meridian particle field on canvas
   ============================================================ */
(function(){
  const cv = document.getElementById('qi');
  const ctx = cv.getContext('2d');
  let W,H,DPR,particles=[],travelers=[],ripples=[];
  const EL = [
    {c:[84,176,126]},   // 木
    {c:[226,86,58]},    // 火
    {c:[216,166,79]},   // 土
    {c:[205,214,207]},  // 金
    {c:[77,134,192]}    // 水
  ];
  const mouse = {x:-9999,y:-9999,active:false};
  let phase = 0;          // shifts with scroll
  let phaseTarget = 0;

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = cv.clientWidth = window.innerWidth;
    H = cv.clientHeight = window.innerHeight;
    cv.width = W*DPR; cv.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle='#070d0b'; ctx.fillRect(0,0,W,H);
    initParticles();
  }
  function initParticles(){
    const n = Math.round(Math.min(720, (W*H)/3200));
    particles = [];
    for(let i=0;i<n;i++){
      particles.push({
        x:Math.random()*W, y:Math.random()*H,
        e:i%5,
        sp:0.5+Math.random()*1.0,
        life:Math.random()*200
      });
    }
    travelers = [];
    for(let i=0;i<7;i++){
      travelers.push({x:Math.random()*W,y:Math.random()*H,e:Math.floor(Math.random()*5),sp:1.1+Math.random()*0.7});
    }
  }

  // smooth pseudo-curl flow field via layered trig — cheap, organic
  function flow(x,y,t){
    const a = Math.sin(x*0.0016 + t*0.00031 + phase)*1.35
            + Math.cos(y*0.0019 - t*0.00026)*1.35
            + Math.sin((x+y)*0.00092 + t*0.00041)*0.9;
    return a;
  }

  function step(t){
    // fade trails
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(7,13,11,0.085)';
    ctx.fillRect(0,0,W,H);

    phase += (phaseTarget - phase)*0.04;

    ctx.globalCompositeOperation='lighter';

    // particles
    for(let p of particles){
      const ang = flow(p.x,p.y,t);
      let vx = Math.cos(ang)*p.sp;
      let vy = Math.sin(ang)*p.sp;

      // acupoint vortex around pointer
      if(mouse.active){
        const dx=p.x-mouse.x, dy=p.y-mouse.y;
        const d2=dx*dx+dy*dy;
        const R=150;
        if(d2 < R*R){
          const d=Math.sqrt(d2)||1;
          const f=(1-d/R);
          // perpendicular swirl + slight inward pull
          vx += (-dy/d)*f*2.6 + (-dx/d)*f*0.7;
          vy += ( dx/d)*f*2.6 + (-dy/d)*f*0.7;
        }
      }
      const px=p.x, py=p.y;
      p.x+=vx; p.y+=vy; p.life--;
      if(p.x<-20)p.x=W+20; if(p.x>W+20)p.x=-20;
      if(p.y<-20)p.y=H+20; if(p.y>H+20)p.y=-20;
      if(p.life<0){p.life=120+Math.random()*200;}

      const col=EL[p.e].c;
      const sp=Math.min(1, Math.hypot(vx,vy)/3.4);
      ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},${0.10+sp*0.32})`;
      ctx.lineWidth=0.9;
      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(p.x,p.y);ctx.stroke();
    }

    // bright pulse travelers — like qi running a channel
    for(let tr of travelers){
      const ang=flow(tr.x,tr.y,t);
      tr.x+=Math.cos(ang)*tr.sp*1.7;
      tr.y+=Math.sin(ang)*tr.sp*1.7;
      if(tr.x<0||tr.x>W||tr.y<0||tr.y>H){tr.x=Math.random()*W;tr.y=Math.random()*H;}
      const col=EL[tr.e].c;
      const g=ctx.createRadialGradient(tr.x,tr.y,0,tr.x,tr.y,16);
      g.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},0.55)`);
      g.addColorStop(1,`rgba(${col[0]},${col[1]},${col[2]},0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(tr.x,tr.y,16,0,7);ctx.fill();
    }

    // acupoint press ripples
    for(let i=ripples.length-1;i>=0;i--){
      const r=ripples[i]; r.rad+=2.4; r.a*=0.955;
      if(r.a<0.02){ripples.splice(i,1);continue;}
      ctx.strokeStyle=`rgba(134,220,168,${r.a})`;ctx.lineWidth=1.4;
      ctx.beginPath();ctx.arc(r.x,r.y,r.rad,0,7);ctx.stroke();
      ctx.strokeStyle=`rgba(216,166,79,${r.a*0.5})`;
      ctx.beginPath();ctx.arc(r.x,r.y,r.rad*0.6,0,7);ctx.stroke();
    }
  }

  // pointer
  window.addEventListener('pointermove',e=>{
    if(e.target.closest && e.target.closest('.app') && window.innerWidth>760){
      // still track for parallax but vortex only on bg-ish areas
    }
    mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true;
  },{passive:true});
  window.addEventListener('pointerdown',e=>{
    ripples.push({x:e.clientX,y:e.clientY,rad:4,a:0.7});
  },{passive:true});
  window.addEventListener('pointerleave',()=>mouse.active=false);
  window.addEventListener('wheel',e=>{phaseTarget+=e.deltaY*0.0011;},{passive:true});
  window.addEventListener('resize',resize);

  resize();

  /* ============================================================
     脈 PULSE — scrolling oriental pulse waveform (header)
     ============================================================ */
  const pc = document.getElementById('pulse');
  const pctx = pc.getContext('2d');
  let pw,ph,buf=[],bi=0;
  function presize(){
    const r=Math.min(window.devicePixelRatio||1,2);
    pw=pc.clientWidth; ph=pc.clientHeight;
    pc.width=pw*r; pc.height=ph*r; pctx.setTransform(r,0,0,r,0,0);
    buf=new Array(Math.ceil(pw)).fill(ph/2);
  }
  let beat=0;
  function pulseStep(t){
    if(!pw)return;
    beat += 0.05;
    // oriental pulse: gentle base wave + periodic "맥상" beat clusters
    let v = Math.sin(beat*0.9)*4 + Math.sin(beat*2.3)*2;
    const ph2 = beat % (Math.PI*2);
    // a sharp beat every cycle
    const bp = beat*0.34 % 1;
    if(bp<0.06) v -= Math.sin(bp/0.06*Math.PI)*16;
    else if(bp<0.12) v += Math.sin((bp-0.06)/0.06*Math.PI)*9;
    buf[bi% buf.length] = ph/2 + v;
    bi++;
    pctx.clearRect(0,0,pw,ph);
    pctx.beginPath();
    for(let x=0;x<buf.length;x++){
      const idx=(bi+x)%buf.length;
      const y=buf[idx];
      if(x===0)pctx.moveTo(x,y);else pctx.lineTo(x,y);
    }
    const grad=pctx.createLinearGradient(0,0,pw,0);
    grad.addColorStop(0,'rgba(84,176,126,0)');
    grad.addColorStop(0.2,'rgba(84,176,126,0.7)');
    grad.addColorStop(0.85,'rgba(143,214,172,0.95)');
    grad.addColorStop(1,'rgba(216,166,79,0.9)');
    pctx.strokeStyle=grad;pctx.lineWidth=1.6;pctx.lineJoin='round';
    pctx.shadowColor='rgba(84,176,126,0.5)';pctx.shadowBlur=6;
    pctx.stroke();pctx.shadowBlur=0;
    // leading dot
    pctx.fillStyle='#cdeedb';
    pctx.beginPath();pctx.arc(buf.length-1,buf[(bi+buf.length-1)%buf.length],2,0,7);pctx.fill();
  }
  presize();
  window.addEventListener('resize',presize);

  /* main loop */
  function loop(t){ step(t); pulseStep(t); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();

(function(){
  const data=[
    {hj:'木',nm:'목 · 간담',c:'var(--mok)',base:62,amp:14,ph:0},
    {hj:'火',nm:'화 · 심소장',c:'var(--hwa)',base:48,amp:18,ph:1.3},
    {hj:'土',nm:'토 · 비위',c:'var(--to)',base:55,amp:12,ph:2.6},
    {hj:'金',nm:'금 · 폐대장',c:'var(--geum)',base:67,amp:10,ph:3.9},
    {hj:'水',nm:'수 · 신방광',c:'var(--su)',base:43,amp:16,ph:5.2}
  ];
  const wrap=document.getElementById('ohaeng');
  if(!wrap)return;
  const rows=data.map(d=>{
    const row=document.createElement('div');row.className='el-row';
    row.innerHTML=`<div class="el-head"><span class="hj" style="color:${d.c}">${d.hj}</span>
      <span class="nm">${d.nm}</span><span class="pct">0</span></div>
      <div class="bar"><div class="fill" style="background:${d.c}"></div></div>`;
    wrap.appendChild(row);
    return {fill:row.querySelector('.fill'),pct:row.querySelector('.pct'),d};
  });
  function tick(){
    const t=performance.now()/1000;
    rows.forEach(r=>{
      const v=r.d.base + Math.sin(t*0.4 + r.d.ph)*r.d.amp + Math.sin(t*0.13+r.d.ph*2)*4;
      const cl=Math.max(8,Math.min(96,v));
      r.fill.style.transform=`scaleX(${cl/100})`;
      r.fill.style.boxShadow=`0 0 10px ${r.d.c}`;
      r.pct.textContent=Math.round(cl);
    });
    requestAnimationFrame(tick);
  }
  tick();
})();

    ['卯時','대장경(大腸經)'],['辰時','위경(胃經)'],['巳時','비경(脾經)'],
    ['午時','심경(心經)'],['未時','소장경(小腸經)'],['申時','방광경(膀胱經)'],
    ['酉時','신경(腎經)'],['戌時','심포경(心包經)'],['亥時','삼초경(三焦經)']

  function upd(){

/* ============================================================
   CHAT ENGINE — flowing mock conversation + typewriter + replies
   ============================================================ */
(function(){
  const scroll=document.getElementById('scroll');
  const input=document.getElementById('input');
  const send=document.getElementById('send');
  let busy=false;

  function autoscroll(){ scroll.scrollTo({top:scroll.scrollHeight,behavior:'smooth'}); }

  function sysline(text){
    const d=document.createElement('div');d.className='sysline';d.textContent=text;
    scroll.appendChild(d);autoscroll();
  }

  function bubble(who,html,opts={}){
    const m=document.createElement('div');m.className='msg '+who;
    const av=document.createElement('div');av.className='av';
    av.textContent = who==='ai' ? '溫' : '나';
    const b=document.createElement('div');b.className='bubble';
    m.appendChild(av);m.appendChild(b);
    scroll.appendChild(m);
    if(opts.instant){ b.innerHTML=html; autoscroll(); return Promise.resolve(); }
    return typewrite(b,html);
  }

  // typewriter that respects inline HTML tags
  function typewrite(node,html){
    return new Promise(res=>{
      node.innerHTML='<span class="caret"></span>';
      const caret=node.querySelector('.caret');
      let i=0;
      const tokens=tokenize(html);
      function next(){
        if(i>=tokens.length){ caret.remove(); res(); return; }
        const tk=tokens[i++];
        caret.insertAdjacentHTML('beforebegin', tk);
        if(scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight<140)autoscroll();
        const last=tk.replace(/<[^>]+>/g,'').slice(-1);
        let delay=tk.indexOf('<')===0?0:(/[.,…?!·]/.test(last)?120:18+Math.random()*30);
        setTimeout(next,delay);
      }
      next();
    });
  }
  // split html into tokens: whole tags as one, text char-by-char
  function tokenize(html){
    const out=[];const re=/(<[^>]+>)|([\s\S])/g;let m;
    while((m=re.exec(html))){ out.push(m[1]?m[1]:m[2]); }
    return out;
  }

  function typingIndicator(){
    const m=document.createElement('div');m.className='msg ai';
    m.innerHTML='<div class="av">溫</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    scroll.appendChild(m);autoscroll();return m;
  }

  const wait=ms=>new Promise(r=>setTimeout(r,ms));

  async function aiSay(html,thinkMs=900){
    const ind=typingIndicator();
    await wait(thinkMs);
    ind.remove();
    await bubble('ai',html);
  }

  /* ---- canned reply router ---- */
  function reply(text){
    const t=text.toLowerCase();
    const has=(...k)=>k.some(w=>text.includes(w));
    if(has('차','茶','마시','음용')) return '추위를 잘 타신다면 몸 안의 화로가 약한 거예요. <span class="hl">계피·생강</span>이 양기(陽氣)를 지펴 손끝까지 데워 줍니다. 아침·오후 한 잔씩, 따뜻하게요. 반대로 갈증·열감이 잦은 날엔 <span class="pt">국화·결명자</span>로 식혀 균형을 맞춰 주세요.';
    if(has('잠','수면','불면','자다','깨','꿈')) return '자정 무렵은 <span class="pt">담경(膽經)·간경(肝經)</span>이 기를 갈무리하는 시간이에요. 11시 전에 누우면 회복이 두 배가 됩니다. 자기 전 발바닥 <span class="pt">용천(湧泉)</span>을 30초만 천천히 문지르면, 위로 떴던 기운이 아래로 내려와 잠이 한층 깊어져요.';
    if(has('혈','지압','경혈','누르','穴')) return '기운을 끌어올릴 땐 무릎 아래 손가락 네 마디, <span class="pt">족삼리(足三里)</span>가 으뜸이에요. 엄지·검지 사이 <span class="pt">합곡(合谷)</span>은 막힌 기를 뚫어 줍니다. 시큰한 느낌이 올 때까지 1분씩, 숨을 길게 내쉬며 눌러 보세요.';
    if(has('체질','사상','태양','소음','소양','태음')) return '체질은 결을 읽는 일이에요. 평소 <span class="hl">추위·더위</span> 중 무엇이 더 힘드신지, 소화가 빠른지 더딘지, 땀이 많은지 적은지 — 이 세 갈래만 알려 주시면 큰 가닥을 잡아 드릴게요.';
    if(has('두통','머리','편두통','지끈')) return '두통도 <span class="pt">불통즉통(不通則痛)</span> — 기혈이 머리에서 막힌 신호예요. 관자놀이 <span class="pt">태양(太陽)</span>혈과 목덜미 <span class="pt">풍지(風池)</span>를 지그시 풀어 주세요. 어느 쪽이, 하루 중 언제 더 무거워지나요? 길을 함께 따라가 봅시다.';
    if(has('소화','속','체','더부룩','위','배')) return '비위(脾胃)가 기를 만드는 부엌이에요. 배꼽 위 <span class="pt">중완(中脘)</span>을 시계방향으로 부드럽게 쓸어 주시고, 찬 음식은 잠시 멀리. 식후 백 보 천천히 걷는 것만으로도 기운의 흐름이 살아납니다.';
    if(has('스트레스','화','짜증','우울','불안','답답')) return '가슴이 답답할 땐 간기(肝氣)가 뭉친 거예요. 손등 <span class="pt">태충(太衝)</span>을 누르며 숨을 넷 세고 들이쉬고, 여섯 세며 내쉬어 보세요. 막힌 기가 풀리는 자리입니다. 요즘 무엇이 마음을 무겁게 하나요?';
    return '조금 더 들려주세요 — 언제부터인지, 무엇과 함께 오는지. 결(脈)을 같이 짚어 보면 흐름이 멈춘 자리가 보입니다. 추위·소화·잠, 셋 중 가장 신경 쓰이는 건 무엇인가요?';
  }

  async function userSend(text){
    if(busy||!text.trim())return;
    busy=true;
    await bubble('me', escapeHTML(text.trim()), {instant:true});
    await wait(420);
    await aiSay(reply(text), 800+Math.random()*700);
    busy=false;
  }
  function escapeHTML(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

  /* ---- composer wiring ---- */
  send.addEventListener('click',()=>{const v=input.value;input.value='';input.style.height='auto';userSend(v);});
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=input.value;input.value='';input.style.height='auto';userSend(v);}
  });
  input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(96,input.scrollHeight)+'px';});
  document.getElementById('chips').addEventListener('click',e=>{
    const c=e.target.closest('.chip');if(!c||busy)return;userSend(c.dataset.q);
  });

  /* ---- opening sequence: a real conversation that flows in ---- */
  async function intro(){
    sysline('望聞問切 · 진맥 세션 시작');
    await wait(700);
    await bubble('ai','안녕하세요, 저는 <span class="hl">온(溫)</span>이에요. 맥을 짚듯 천천히 들을게요. 요즘 몸이 보내는 신호 중, 가장 마음 쓰이는 건 무엇인가요?');
    await wait(900);
    await bubble('me','요즘 손발이 차고, 오후만 되면 기운이 쭉 빠져요.', {instant:true});
    await wait(500);
    await aiSay('손끝까지 양기(陽氣)가 닿지 못하는 전형적인 <span class="pt">기허(氣虛)</span> 신호예요. 비위(脾胃)가 만든 기운이 오후에 바닥나는 거죠. 엄지·검지 사이 <span class="pt">합곡(合谷)</span>과 무릎 아래 <span class="pt">족삼리(足三里)</span>를 따뜻한 손으로 1분씩 눌러 보세요. <span class="hl">생강대추차</span> 한 잔이 오후를 받쳐 주는 기둥이 됩니다.', 1100);
    await wait(700);
    await bubble('me','밤에 잠도 자꾸 깨고요.', {instant:true});
    await wait(500);
    await aiSay('낮의 기허가 밤의 얕은 잠으로 이어지곤 해요. 잠들기 전 발바닥 <span class="pt">용천(湧泉)</span>을 천천히 문질러 떠 있는 기운을 아래로 내려 주세요. 아래 빠른 질문을 골라 더 깊이 들어가도 좋아요.');
  }
  intro();
})();
</script>
