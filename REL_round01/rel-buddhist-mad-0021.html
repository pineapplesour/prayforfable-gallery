<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>공명 共鳴 — 대화하는 선(禪)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0a0908;
    --paper:#0e0c0a;
    --bone:#efe7d8;
    --bone-dim:rgba(239,231,216,.60);
    --bone-faint:rgba(239,231,216,.30);
    --verm:#ff4d2a;
    --verm-deep:#e0371a;
    --indigo:#7b6dff;
    --line:rgba(239,231,216,.12);
    --line-soft:rgba(239,231,216,.07);
    --serif:"Noto Serif KR",Georgia,"Times New Roman",serif;
    --sans:"Noto Sans KR",system-ui,-apple-system,sans-serif;
    --mono:"Space Mono",ui-monospace,"SFMono-Regular",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--ink);
    color:var(--bone);
    font-family:var(--sans);
    overflow:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- ambient generative canvas ---------- */
  #field{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;}
  .grain{
    position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .vignette{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(130% 100% at 50% 35%,transparent 45%,rgba(5,4,3,.55) 100%);
  }

  /* ---------- app shell ---------- */
  .app{position:relative;z-index:2;display:flex;height:100vh;height:100dvh;width:100%;}

  /* ---------- left rail ---------- */
  .rail{
    width:248px;flex:0 0 248px;
    display:flex;flex-direction:column;
    padding:26px 22px 22px;
    border-right:1px solid var(--line-soft);
    background:linear-gradient(180deg,rgba(12,10,9,.66),rgba(12,10,9,.30));
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  }
  .brand{display:flex;align-items:baseline;gap:9px;}
  .brand h1{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:.06em;line-height:1;}
  .brand .han{font-family:var(--serif);color:var(--verm);font-size:14px;letter-spacing:.18em;}
  .brand-sub{margin-top:10px;font-size:11px;letter-spacing:.26em;color:var(--bone-faint);font-family:var(--mono);text-transform:uppercase;}

  .breath{margin-top:30px;display:flex;align-items:center;gap:14px;}
  .breath-ring{position:relative;width:46px;height:46px;flex:0 0 46px;}
  .breath-ring::before,.breath-ring::after{
    content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--verm);
    animation:breathe 8s ease-in-out infinite;
  }
  .breath-ring::after{border-color:var(--bone-faint);animation-delay:-4s;}
  .breath-dot{position:absolute;top:50%;left:50%;width:5px;height:5px;border-radius:50%;background:var(--verm);transform:translate(-50%,-50%);box-shadow:0 0 10px var(--verm);}
  @keyframes breathe{0%,100%{transform:scale(.62);opacity:.85}50%{transform:scale(1.12);opacity:.25}}
  .breath-txt{font-size:12px;line-height:1.5;color:var(--bone-dim);}
  .breath-txt b{display:block;color:var(--bone);font-weight:400;font-family:var(--serif);letter-spacing:.04em;}

  .threads{margin-top:34px;flex:1;min-height:0;overflow-y:auto;}
  .threads .label{font-size:10px;letter-spacing:.24em;color:var(--bone-faint);font-family:var(--mono);text-transform:uppercase;margin-bottom:14px;}
  .thread{
    display:flex;align-items:center;gap:11px;padding:11px 12px;margin:0 -6px 3px;border-radius:11px;cursor:pointer;
    transition:background .25s ease,transform .25s ease;
  }
  .thread:hover{background:var(--line-soft);}
  .thread.active{background:linear-gradient(90deg,rgba(255,77,42,.14),transparent);}
  .thread .tick{width:7px;height:7px;border-radius:50%;border:1px solid var(--bone-faint);flex:0 0 7px;transition:.25s;}
  .thread.active .tick{background:var(--verm);border-color:var(--verm);box-shadow:0 0 9px var(--verm);}
  .thread span{font-size:13px;color:var(--bone-dim);letter-spacing:.01em;}
  .thread.active span{color:var(--bone);}

  .rail-foot{font-size:10px;color:var(--bone-faint);line-height:1.7;font-family:var(--mono);letter-spacing:.05em;padding-top:16px;border-top:1px solid var(--line-soft);}

  /* ---------- stage ---------- */
  .stage{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 30px;border-bottom:1px solid var(--line-soft);
    background:linear-gradient(180deg,rgba(10,9,8,.55),transparent);
  }
  .topbar .who{display:flex;align-items:center;gap:13px;}
  .stamp{
    width:40px;height:40px;flex:0 0 40px;border-radius:11px;
    background:linear-gradient(150deg,var(--verm),var(--verm-deep));
    display:grid;place-items:center;font-family:var(--serif);font-size:21px;color:#1a0d08;font-weight:600;
    box-shadow:0 6px 22px rgba(255,77,42,.32),inset 0 0 0 1px rgba(255,210,180,.35);
    position:relative;
  }
  .stamp::after{content:"";position:absolute;inset:4px;border:1px solid rgba(26,13,8,.35);border-radius:7px;}
  .who-meta b{font-family:var(--serif);font-weight:500;font-size:16px;letter-spacing:.05em;}
  .who-meta small{display:block;font-size:11px;color:var(--bone-dim);margin-top:3px;letter-spacing:.02em;}
  .status{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--bone-dim);letter-spacing:.08em;}
  .status .pulse{width:6px;height:6px;border-radius:50%;background:var(--verm);box-shadow:0 0 8px var(--verm);animation:pulse 2.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .topbar .tools{display:flex;align-items:center;gap:10px;}
  .ghost-btn{
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--bone-dim);
    background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;transition:.22s;
  }
  .ghost-btn:hover{color:var(--bone);border-color:var(--bone-faint);background:var(--line-soft);}

  /* ---------- messages ---------- */
  .scroll{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth;}
  .scroll::-webkit-scrollbar{width:8px;}
  .scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
  .stream{max-width:760px;margin:0 auto;padding:40px 32px 30px;display:flex;flex-direction:column;gap:30px;}

  .turn{display:flex;gap:16px;opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards;}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .turn .av{flex:0 0 34px;height:34px;margin-top:4px;}
  .av.ai{
    border-radius:9px;background:linear-gradient(150deg,var(--verm),var(--verm-deep));
    display:grid;place-items:center;font-family:var(--serif);font-size:17px;color:#1a0d08;font-weight:600;
    box-shadow:0 4px 16px rgba(255,77,42,.3);
  }
  .av.me{border-radius:50%;border:1px solid var(--bone-faint);position:relative;}
  .av.me::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bone-dim);}
  .bubble{position:relative;}
  .bubble .name{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--bone-faint);margin-bottom:8px;}
  .bubble .body{
    font-family:var(--serif);font-weight:300;font-size:18px;line-height:1.85;color:var(--bone);
    letter-spacing:.005em;position:relative;
  }
  .bubble .body .brush{
    display:inline-block;width:0;height:2px;margin-top:11px;border-radius:2px;
    background:linear-gradient(90deg,var(--verm),transparent);
    animation:draw 1.1s .35s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes draw{to{width:64px}}

  /* user turn variant */
  .turn.me{flex-direction:row-reverse;}
  .turn.me .bubble{max-width:78%;}
  .turn.me .name{text-align:right;}
  .turn.me .body{
    font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.7;
    background:linear-gradient(135deg,rgba(123,109,255,.16),rgba(239,231,216,.06));
    border:1px solid var(--line);border-radius:16px 16px 4px 16px;padding:14px 18px;color:var(--bone);
  }

  /* typing indicator */
  .typing{display:flex;gap:16px;opacity:0;animation:rise .5s forwards;}
  .typing .dots{display:flex;align-items:center;gap:6px;height:34px;margin-top:4px;padding:0 4px;}
  .typing .dots i{width:7px;height:7px;border-radius:50%;background:var(--bone-dim);animation:blink 1.3s infinite;}
  .typing .dots i:nth-child(2){animation-delay:.2s}
  .typing .dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.2;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* ---------- composer ---------- */
  .composer{padding:14px 32px 26px;background:linear-gradient(0deg,rgba(10,9,8,.7),transparent);}
  .composer-inner{max-width:760px;margin:0 auto;}
  .chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{
    font-size:12.5px;color:var(--bone-dim);background:rgba(239,231,216,.04);
    border:1px solid var(--line);border-radius:999px;padding:8px 15px;cursor:pointer;transition:.22s;letter-spacing:.01em;
  }
  .chip:hover{color:var(--bone);border-color:var(--verm);background:rgba(255,77,42,.08);transform:translateY(-1px);}
  .inputrow{
    display:flex;align-items:flex-end;gap:12px;
    background:rgba(14,12,10,.72);border:1px solid var(--line);border-radius:20px;padding:10px 10px 10px 20px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .25s;
  }
  .inputrow:focus-within{border-color:var(--bone-faint);}
  .inputrow textarea{
    flex:1;background:transparent;border:none;outline:none;resize:none;color:var(--bone);
    font-family:var(--serif);font-weight:300;font-size:16.5px;line-height:1.7;max-height:130px;padding:8px 0;
  }
  .inputrow textarea::placeholder{color:var(--bone-faint);}
  .send{
    flex:0 0 46px;width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(150deg,var(--verm),var(--verm-deep));color:#1a0d08;
    display:grid;place-items:center;transition:.22s;box-shadow:0 6px 20px rgba(255,77,42,.34);
  }
  .send:hover{transform:translateY(-2px) scale(1.04);}
  .send:active{transform:scale(.95);}
  .send svg{width:20px;height:20px;}
  .composer-note{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--bone-faint);margin-top:14px;}

  /* mobile chips bar (rail substitute) */
  .mobilebar{display:none;}

  /* ---------- breath overlay ---------- */
  .breath-overlay{
    position:fixed;inset:0;z-index:40;display:none;place-items:center;
    background:radial-gradient(circle at 50% 50%,rgba(10,9,8,.7),rgba(6,5,4,.94));
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);cursor:pointer;
  }
  .breath-overlay.on{display:grid;}
  .bo-stage{display:flex;flex-direction:column;align-items:center;gap:34px;text-align:center;}
  .bo-ring{width:200px;height:200px;border-radius:50%;border:1px solid var(--verm);position:relative;
    animation:boBreathe 10s ease-in-out infinite;}
  .bo-ring::after{content:"";position:absolute;inset:-22px;border-radius:50%;border:1px solid var(--bone-faint);animation:boBreathe 10s ease-in-out infinite;animation-delay:-.4s;}
  .bo-core{position:absolute;top:50%;left:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);background:var(--verm);box-shadow:0 0 30px var(--verm);}
  @keyframes boBreathe{0%,100%{transform:scale(.55)}45%,55%{transform:scale(1.15)}}
  .bo-label{font-family:var(--serif);font-size:26px;font-weight:300;letter-spacing:.3em;color:var(--bone);}
  .bo-hint{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--bone-faint);text-transform:uppercase;}

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    .rail{display:none;}
    .stage{height:100vh;height:100dvh;}
    .topbar{padding:14px 18px;}
    .mobilebar{
      display:flex;gap:8px;overflow-x:auto;padding:12px 18px 4px;
      border-bottom:1px solid var(--line-soft);scrollbar-width:none;
    }
    .mobilebar::-webkit-scrollbar{display:none;}
    .mthread{
      flex:0 0 auto;font-size:12px;color:var(--bone-dim);padding:7px 14px;border:1px solid var(--line);
      border-radius:999px;white-space:nowrap;cursor:pointer;
    }
    .mthread.active{color:var(--bone);border-color:var(--verm);background:rgba(255,77,42,.1);}
    .stream{padding:26px 18px 20px;gap:24px;}
    .bubble .body{font-size:16.5px;line-height:1.8;}
    .turn.me .bubble{max-width:82%;}
    .composer{padding:12px 16px 20px;}
    .who-meta small{display:none;}
    .topbar .ghost-btn{padding:8px 12px;}
  }
  @media (max-width:420px){
    .brand h1{font-size:26px;}
    .stamp{width:36px;height:36px;flex-basis:36px;font-size:18px;}
    .bo-ring{width:160px;height:160px;}
    .bubble .body{font-size:16px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s!important;}
  }
</style>
</head>
<body>
  <canvas id="field"></canvas>
  <div class="grain"></div>
  <div class="vignette"></div>

  <div class="app">
    <!-- LEFT RAIL -->
    <aside class="rail">
      <div class="brand">
        <h1>공명</h1><span class="han">共鳴</span>
      </div>
      <div class="brand-sub">대화하는 선(禪)</div>

      <div class="breath">
        <div class="breath-ring"><span class="breath-dot"></span></div>
        <div class="breath-txt"><b>지금 여기</b>숨이 한 번 드나드는 동안</div>
      </div>

      <div class="threads">
        <div class="label">대화의 결</div>
        <div class="thread active" data-k="후회"><span class="tick"></span><span>지나간 일 · 후회</span></div>
        <div class="thread" data-k="밤"><span class="tick"></span><span>잠 못 드는 밤</span></div>
        <div class="thread" data-k="관계"><span class="tick"></span><span>관계의 매듭</span></div>
        <div class="thread" data-k="멍"><span class="tick"></span><span>그냥, 멍하니</span></div>
        <div class="thread" data-k="갈망"><span class="tick"></span><span>자꾸 바라는 마음</span></div>
      </div>

      <div class="rail-foot">無門關 · gateless<br/>v0.1 — 답을 주지 않고<br/>함께 머무는 인터페이스</div>
    </aside>

    <!-- STAGE -->
    <main class="stage">
      <div class="topbar">
        <div class="who">
          <div class="stamp">鳴</div>
          <div class="who-meta">
            <b>공명</b>
            <small>묻고 — 잠시 머물고 — 울리는</small>
          </div>
        </div>
        <div class="tools">
          <span class="status"><span class="pulse"></span>듣는 중</span>
          <button class="ghost-btn" id="breathBtn">호흡 ◐</button>
        </div>
      </div>

      <!-- mobile thread chips -->
      <div class="mobilebar">
        <div class="mthread active">지나간 일 · 후회</div>
        <div class="mthread">잠 못 드는 밤</div>
        <div class="mthread">관계의 매듭</div>
        <div class="mthread">그냥, 멍하니</div>
        <div class="mthread">자꾸 바라는 마음</div>
      </div>

      <div class="scroll" id="scroll">
        <div class="stream" id="stream"></div>
      </div>

      <div class="composer">
        <div class="composer-inner">
          <div class="chips" id="chips">
            <div class="chip">마음이 무거워요</div>
            <div class="chip">놓고 싶은 게 있어요</div>
            <div class="chip">오늘 고마운 것</div>
            <div class="chip">그냥 숨 고르기</div>
          </div>
          <div class="inputrow">
            <textarea id="input" rows="1" placeholder="마음을 한 줄, 적어보세요…"></textarea>
            <button class="send" id="send" aria-label="보내기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
          <div class="composer-note">공명은 정답이 아니라 결을 건넵니다 · 위급할 땐 가까운 사람에게</div>
        </div>
      </div>
    </main>
  </div>

  <!-- BREATH OVERLAY -->
  <div class="breath-overlay" id="breathOverlay">
    <div class="bo-stage">
      <div class="bo-ring"><span class="bo-core"></span></div>
      <div class="bo-label" id="boLabel">들 숨</div>
      <div class="bo-hint">화면을 누르면 돌아갑니다</div>
    </div>
  </div>

<script>
/* =====================================================================
   공명 共鳴 — ambient ink-field + flowing chat
   single file · canvas2D · 60fps · no backend
   ===================================================================== */
(() => {
  "use strict";
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------- generative ink field ---------------- */
  const cv = document.getElementById("field");
  const ctx = cv.getContext("2d", { alpha:false });
  let W=0, H=0, DPR=1;
  let particles=[];
  const ripples=[];
  const mouse={x:-9999,y:-9999,px:-9999,py:-9999,active:false};
  let ensoTimer=0, enso=null;

  const PAL=[
    {r:239,g:231,b:216,w:.60},  // bone
    {r:123,g:109,b:255,w:.22},  // indigo
    {r:255,g: 90,b: 40,w:.18},  // vermilion
  ];
  function pickColor(){
    const x=Math.random(); let a=0;
    for(const c of PAL){ a+=c.w; if(x<=a) return c; }
    return PAL[0];
  }

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    cv.width=W*DPR; cv.height=H*DPR;
    cv.style.width=W+"px"; cv.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle="#0a0908"; ctx.fillRect(0,0,W,H);
    seed();
  }

  function seed(){
    const area=W*H;
    let n=Math.floor(area/7200);
    n=Math.max(220,Math.min(n, W<900?600:1300));
    particles=new Array(n);
    for(let i=0;i<n;i++) particles[i]=spawn();
  }
  function spawn(x,y){
    const c=pickColor();
    return {
      x: x!=null?x:Math.random()*W,
      y: y!=null?y:Math.random()*H,
      px:0, py:0, c,
      life: 60+Math.random()*240,
      sp: .5+Math.random()*1.1,
    };
  }

  // cheap organic flow angle (layered sine — fast, swirly)
  function flow(x,y,t){
    return (
      Math.sin(x*0.0026 + t*0.10) +
      Math.cos(y*0.0031 - t*0.075) +
      Math.sin((x+y)*0.0017 + t*0.05) +
      Math.cos((x-y)*0.0022 - t*0.04)
    )*1.15;
  }

  let t0=performance.now();
  function frame(now){
    const t=(now-t0)/1000;
    // fade-trail
    ctx.globalCompositeOperation="source-over";
    ctx.fillStyle="rgba(10,9,8,0.085)";
    ctx.fillRect(0,0,W,H);

    // particles (glow accumulation)
    ctx.globalCompositeOperation="lighter";
    ctx.lineWidth=1.15;
    const spd = reduced? .35 : 1;
    for(let i=0;i<particles.length;i++){
      const p=particles[i];
      p.px=p.x; p.py=p.y;
      let a=flow(p.x,p.y,t);

      // mouse swirl
      if(mouse.active){
        const dx=p.x-mouse.x, dy=p.y-mouse.y;
        const d2=dx*dx+dy*dy;
        if(d2<28000){
          const d=Math.sqrt(d2)||1;
          const f=(1-d/170)*1.4;
          a += Math.atan2(dy,dx)+Math.PI*0.5;
          p.x += (-dy/d)*f; p.y += (dx/d)*f;
        }
      }
      // ripple push
      for(let r=0;r<ripples.length;r++){
        const rp=ripples[r];
        const dx=p.x-rp.x, dy=p.y-rp.y;
        const d=Math.sqrt(dx*dx+dy*dy)||1;
        const band=Math.abs(d-rp.r);
        if(band<26){
          const f=(1-band/26)*rp.alpha*1.6;
          p.x += (dx/d)*f; p.y += (dy/d)*f;
        }
      }

      p.x += Math.cos(a)*p.sp*spd;
      p.y += Math.sin(a)*p.sp*spd;

      // draw segment
      const c=p.c;
      ctx.strokeStyle="rgba("+c.r+","+c.g+","+c.b+",0.07)";
      ctx.beginPath();
      ctx.moveTo(p.px,p.py);
      ctx.lineTo(p.x,p.y);
      ctx.stroke();

      p.life-=1;
      if(p.life<=0 || p.x<-20||p.x>W+20||p.y<-20||p.y>H+20){
        particles[i]=spawn();
      }
    }

    // ripples (glowing bone rings)
    for(let r=ripples.length-1;r>=0;r--){
      const rp=ripples[r];
      rp.r += rp.sp;
      rp.alpha *= 0.972;
      ctx.strokeStyle="rgba("+rp.cr+","+rp.cg+","+rp.cb+","+rp.alpha.toFixed(3)+")";
      ctx.lineWidth=1.4;
      ctx.beginPath();
      ctx.arc(rp.x,rp.y,rp.r,0,Math.PI*2);
      ctx.stroke();
      if(rp.alpha<0.012 || rp.r>rp.max) ripples.splice(r,1);
    }

    // ensō auto-draw (signature brush ring)
    ensoTimer-=1;
    if(!enso && ensoTimer<=0 && !reduced){
      const cx=W*0.5 + (Math.random()-0.5)*W*0.2;
      const cy=H*0.5 + (Math.random()-0.5)*H*0.2;
      enso={x:cx,y:cy,rad:Math.min(W,H)*(0.16+Math.random()*0.07),
            ang:Math.random()*Math.PI*2,prog:0,life:1};
      ensoTimer=520+Math.random()*360;
    }
    if(enso){
      ctx.globalCompositeOperation="lighter";
      const seg=enso.prog;
      const open=Math.PI*0.22;
      const total=Math.PI*2-open;
      if(seg<1) enso.prog+=0.018;
      else enso.life-=0.012;
      const a0=enso.ang;
      const a1=enso.ang+total*Math.min(seg,1);
      const steps=46;
      for(let s=0;s<steps;s++){
        const f=s/steps;
        const aa=a0+(a1-a0)*f;
        const wob=Math.sin(f*9+enso.ang)*4;
        const rr=enso.rad+wob;
        const x=enso.x+Math.cos(aa)*rr;
        const y=enso.y+Math.sin(aa)*rr;
        const al=(0.10*enso.life)*(0.4+0.6*Math.sin(f*Math.PI));
        ctx.fillStyle="rgba(255,90,40,"+al.toFixed(3)+")";
        const w=2.4*(0.5+f*0.8);
        ctx.beginPath(); ctx.arc(x,y,w,0,Math.PI*2); ctx.fill();
      }
      if(enso.life<=0) enso=null;
    }

    mouse.active=false;
    requestAnimationFrame(frame);
  }

  function makeRipple(x,y,opt={}){
    ripples.push({
      x,y,r:opt.r0||4,sp:opt.sp||1.7,max:opt.max||Math.max(W,H)*0.7,
      alpha:opt.alpha||0.5,
      cr:opt.cr!=null?opt.cr:239, cg:opt.cg!=null?opt.cg:231, cb:opt.cb!=null?opt.cb:216,
    });
  }

  window.addEventListener("pointermove",e=>{
    mouse.px=mouse.x; mouse.py=mouse.y;
    mouse.x=e.clientX; mouse.y=e.clientY; mouse.active=true;
  },{passive:true});
  cv.addEventListener("pointerdown",e=>{
    makeRipple(e.clientX,e.clientY,{alpha:0.6,sp:2.2,cr:255,cg:90,cb:40});
    for(let i=0;i<10;i++) particles.push(spawn(e.clientX,e.clientY));
  });
  window.addEventListener("resize",resize);
  resize();
  requestAnimationFrame(frame);

  /* ---------------- chat engine ---------------- */
  const stream=document.getElementById("stream");
  const scroll=document.getElementById("scroll");
  const input=document.getElementById("input");
  const sendBtn=document.getElementById("send");

  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  function toBottom(){ scroll.scrollTop=scroll.scrollHeight; }

  function rippleForRole(role){
    if(role==="ai") makeRipple(W*0.42,H*0.45,{alpha:0.5,sp:1.8,cr:255,cg:90,cb:40});
    else makeRipple(W*0.5,H*0.86,{alpha:0.45,sp:1.6,cr:123,cg:109,cb:255});
  }

  function addTurn(role,text){
    const turn=document.createElement("div");
    turn.className="turn"+(role==="me"?" me":"");
    const av=document.createElement("div");
    av.className="av "+(role==="ai"?"ai":"me");
    if(role==="ai") av.textContent="鳴";
    const bub=document.createElement("div");
    bub.className="bubble";
    const name=document.createElement("div");
    name.className="name";
    name.textContent=role==="ai"?"공명":"나";
    const body=document.createElement("div");
    body.className="body";
    body.textContent=text;
    if(role==="ai"){ const br=document.createElement("span"); br.className="brush"; body.appendChild(document.createElement("br")); body.appendChild(br); }
    bub.appendChild(name); bub.appendChild(body);
    turn.appendChild(av); turn.appendChild(bub);
    stream.appendChild(turn);
    toBottom();
    rippleForRole(role);
  }

  function showTyping(){
    const t=document.createElement("div");
    t.className="typing"; t.id="typing-x";
    t.innerHTML='<div class="av ai">鳴</div><div class="dots"><i></i><i></i><i></i></div>';
    stream.appendChild(t); toBottom();
    return t;
  }
  function hideTyping(){ const t=document.getElementById("typing-x"); if(t) t.remove(); }

  const script=[
    {role:"ai", text:"들어와요. 신발은 벗어두고 와도 돼요. 오늘 어떤 마음이 당신을 여기까지 데려왔어요?"},
    {role:"me", text:"자꾸 지나간 일이 떠올라요. 후회가 머릿속에서 안 꺼져요."},
    {role:"ai", text:"후회는 끄는 게 아니에요. 불을 손으로 덮으면 더 뜨거워지잖아요. 떠오르면 그냥 '아, 또 왔구나' 하고 이름만 붙여보세요. 쫓아내지 말고, 손님처럼."},
    {role:"me", text:"이름을 붙이면 뭐가 달라지나요?"},
    {role:"ai", text:"붙잡힌 게 '나'에서 '지나가는 것'으로 자리를 옮겨요. 강물에 비친 구름을 보고 강이라 부르지 않듯이. 생각은 흐르는 쪽이고, 당신은 그걸 바라보는 강바닥이에요."},
    {role:"me", text:"그래도 밤이 되면 다시 처음부터예요."},
    {role:"ai", text:"그럼 오늘 밤엔 밤에게 자리를 조금 내어주세요. 싸우지 말고요. 숨을 한 번 들이쉬고 — 천천히 — 내쉬어 보세요. 내쉴 때 어깨가 1cm만 내려가면, 오늘은 그걸로 충분합니다."},
  ];

  const replies=[
    "그 말, 무게를 재지 않고 잠시 그대로 둘게요. 여기 안전해요.",
    "지금 그 느낌은 몸 어디에 있어요? 가슴인가요, 목 언저리인가요?",
    "답을 서둘러 찾기 전에, 질문이 조금 더 부드러워져도 괜찮아요.",
    "들이쉬고… 내쉬고. 딱 한 호흡만큼만 같이 있어볼까요.",
    "바꾸지 않아도 돼요. 그냥 알아차린 것만으로 이미 한 걸음이에요.",
    "흘려보내려 애쓰는 그 마음까지, 함께 바라봐 줄게요.",
  ];
  let rIdx=0;

  async function runScript(){
    // first greeting already feels present quickly
    await sleep(500);
    for(let i=0;i<script.length;i++){
      const m=script[i];
      if(m.role==="ai"){
        const ty=showTyping();
        await sleep(Math.min(2200, 700+m.text.length*22));
        hideTyping();
      } else {
        await sleep(620);
      }
      addTurn(m.role,m.text);
      await sleep(m.role==="ai"?780:520);
    }
  }

  let busy=false;
  async function handleSend(raw){
    const text=(raw==null?input.value:raw).trim();
    if(!text||busy) return;
    busy=true;
    addTurn("me",text);
    input.value=""; autoGrow();
    const ty=showTyping();
    await sleep(900+Math.random()*900);
    hideTyping();
    addTurn("ai", replies[rIdx % replies.length]); rIdx++;
    busy=false;
  }

  function autoGrow(){
    input.style.height="auto";
    input.style.height=Math.min(input.scrollHeight,130)+"px";
  }
  input.addEventListener("input",autoGrow);
  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); handleSend(); }
  });
  sendBtn.addEventListener("click",()=>handleSend());
  document.getElementById("chips").addEventListener("click",e=>{
    const c=e.target.closest(".chip"); if(!c) return;
    handleSend(c.textContent);
  });

  // thread switches (cosmetic, with ripple)
  document.querySelectorAll(".thread").forEach(el=>{
    el.addEventListener("click",()=>{
      document.querySelectorAll(".thread").forEach(t=>t.classList.remove("active"));
      el.classList.add("active");
      makeRipple(W*0.3,H*0.4,{alpha:0.5,sp:2,cr:255,cg:90,cb:40});
    });
  });
  document.querySelectorAll(".mthread").forEach(el=>{
    el.addEventListener("click",()=>{
      document.querySelectorAll(".mthread").forEach(t=>t.classList.remove("active"));
      el.classList.add("active");
    });
  });

  /* ---------------- breath overlay ---------------- */
  const overlay=document.getElementById("breathOverlay");
  const boLabel=document.getElementById("boLabel");
  const labels=["들 숨","머 묾","날 숨","비 움"];
  let boTimer=null, li=0;
  document.getElementById("breathBtn").addEventListener("click",()=>{
    overlay.classList.add("on");
    li=0; boLabel.textContent=labels[0];
    clearInterval(boTimer);
    boTimer=setInterval(()=>{ li=(li+1)%labels.length; boLabel.textContent=labels[li]; },2500);
  });
  overlay.addEventListener("click",()=>{
    overlay.classList.remove("on"); clearInterval(boTimer);
  });

  runScript();
})();
</script>
</body>
</html>
