<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VIGILIA · 루멘 — 빛의 묵상 동행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Noto+Serif+KR:wght@300;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#05050b;
    --ink2:#0a0a16;
    --gold:#ecc97f;
    --gold-soft:#f4e2b8;
    --ruby:#e1476f;
    --cobalt:#5b7bff;
    --amethyst:#b07bf0;
    --emerald:#5fd1a8;
    --amber:#ffb56b;
    --paper:#efe9df;
    --mute:#9a93b4;
    --glass: rgba(16,15,32,.46);
    --glass-strong: rgba(13,12,26,.72);
    --line: rgba(236,201,127,.20);
    --serif:"Noto Serif KR", serif;
    --latin:"Cormorant Garamond", serif;
    --ui:"Inter", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    background:#04040a;
    color:var(--paper);
    font-family:var(--ui);
    overflow:hidden;
    position:fixed; inset:0;
  }

  /* ── generative canvas ── */
  #bg{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; }

  /* atmosphere overlays */
  .vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(130% 100% at 50% 42%, transparent 38%, rgba(2,2,8,.55) 78%, rgba(1,1,5,.92) 100%);
    mix-blend-mode:multiply;
  }
  .grain{
    position:fixed; inset:-50%; z-index:2; pointer-events:none; opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation:grain 7s steps(6) infinite;
  }
  @keyframes grain{
    0%{transform:translate(0,0)} 20%{transform:translate(-4%,3%)} 40%{transform:translate(3%,-2%)}
    60%{transform:translate(-2%,4%)} 80%{transform:translate(4%,-3%)} 100%{transform:translate(0,0)}
  }

  /* ── layout ── */
  .stage{
    position:relative; z-index:3; height:100%;
    display:grid; grid-template-columns: 1fr min(440px, 40%);
  }
  .leftpane{ position:relative; min-width:0; }
  #anchor{ position:absolute; inset:0; pointer-events:none; }

  .brand{
    position:absolute; left:clamp(28px,4vw,64px); top:clamp(26px,4vh,52px);
    pointer-events:none;
  }
  .crest{ display:flex; align-items:center; gap:13px; }
  .crest .mark{
    width:34px; height:34px; border-radius:50%;
    background:
      radial-gradient(circle at 50% 38%, #fff 0%, var(--gold-soft) 30%, var(--gold) 52%, rgba(236,201,127,.05) 70%);
    box-shadow:0 0 22px rgba(236,201,127,.55), inset 0 0 9px rgba(255,255,255,.45);
    position:relative;
  }
  .crest .mark::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    border:1px solid rgba(255,255,255,.25);
  }
  .crest .word{
    font-family:var(--latin); font-weight:600; font-size:26px; letter-spacing:.34em;
    color:var(--gold-soft); text-shadow:0 0 24px rgba(236,201,127,.35);
    padding-left:.34em;
  }
  .tagline{
    margin-top:9px; font-family:var(--serif); font-weight:300;
    font-size:13px; letter-spacing:.02em; color:var(--mute);
  }

  .poem{
    position:absolute; left:clamp(28px,4vw,64px); bottom:clamp(28px,5vh,56px);
    max-width:min(70%,420px); pointer-events:none;
  }
  .poem .lat{
    font-family:var(--latin); font-style:italic; font-size:clamp(26px,3.4vw,46px);
    line-height:1.05; color:var(--gold-soft);
    text-shadow:0 0 30px rgba(236,201,127,.28);
  }
  .poem .ko{
    margin-top:14px; font-family:var(--serif); font-weight:300;
    font-size:clamp(13px,1.2vw,15px); line-height:1.85; color:rgba(239,233,223,.62);
    max-width:30ch;
  }
  .poem .ko b{ color:var(--gold-soft); font-weight:500; }

  /* ── chat panel ── */
  .chat{
    position:relative; display:flex; flex-direction:column; min-height:0;
    background:linear-gradient(180deg, rgba(8,7,18,.30) 0%, rgba(7,6,16,.62) 16%, rgba(6,5,14,.78) 100%);
    backdrop-filter:blur(14px) saturate(120%);
    -webkit-backdrop-filter:blur(14px) saturate(120%);
    border-left:1px solid var(--line);
    box-shadow:-30px 0 90px -40px rgba(0,0,0,.8);
  }
  .chat-head{
    display:flex; align-items:center; gap:13px;
    padding:20px 24px 16px; border-bottom:1px solid rgba(236,201,127,.10);
  }
  .orb{
    --s:38px; width:var(--s); height:var(--s); border-radius:50%; flex:0 0 auto; position:relative;
    background:radial-gradient(circle at 50% 40%, #fff 0%, var(--gold-soft) 26%, var(--gold) 50%, #8a6a2e 80%, rgba(0,0,0,0) 100%);
    box-shadow:0 0 20px rgba(236,201,127,.55);
    animation:breathe 5.6s ease-in-out infinite;
  }
  @keyframes breathe{ 0%,100%{transform:scale(1);filter:brightness(1)} 50%{transform:scale(1.07);filter:brightness(1.22)} }
  .chat-head .who{ display:flex; flex-direction:column; line-height:1.25; }
  .chat-head .who .n{ font-weight:600; font-size:15px; letter-spacing:.01em; }
  .chat-head .who .s{ font-size:11.5px; color:var(--mute); display:flex; align-items:center; gap:6px; }
  .dotlive{ width:6px; height:6px; border-radius:50%; background:var(--emerald); box-shadow:0 0 9px var(--emerald); animation:livepulse 2.4s infinite; }
  @keyframes livepulse{ 0%,100%{opacity:.45} 50%{opacity:1} }
  .chat-head .spacer{ flex:1; }
  .chat-head .vigil{
    font-family:var(--latin); font-size:13px; letter-spacing:.16em; color:var(--mute);
    border:1px solid var(--line); padding:6px 11px; border-radius:20px;
  }

  .thread{
    flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;
    padding:22px 22px 8px; display:flex; flex-direction:column; gap:14px;
    scrollbar-width:thin; scrollbar-color:rgba(236,201,127,.25) transparent;
  }
  .thread::-webkit-scrollbar{ width:6px; }
  .thread::-webkit-scrollbar-thumb{ background:rgba(236,201,127,.22); border-radius:6px; }

  .daymark{
    align-self:center; font-family:var(--serif); font-weight:300; font-size:11px;
    letter-spacing:.28em; color:rgba(236,201,127,.5); text-transform:uppercase;
    padding:2px 0 6px;
  }

  .msg{ display:flex; gap:11px; max-width:90%; opacity:0; transform:translateY(14px) scale(.99); animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes rise{ to{ opacity:1; transform:none; } }
  .msg .av{
    width:30px; height:30px; border-radius:50%; flex:0 0 auto; margin-top:2px;
    background:radial-gradient(circle at 50% 40%, #fff 0%, var(--gold-soft) 30%, var(--gold) 55%, rgba(0,0,0,0) 78%);
    box-shadow:0 0 14px rgba(236,201,127,.5);
  }
  .bubble{
    font-family:var(--serif); font-weight:300; font-size:14.5px; line-height:1.72;
    padding:12px 15px; border-radius:16px; position:relative; letter-spacing:.005em;
    word-break:keep-all;
  }
  .msg.ai{ align-self:flex-start; }
  .msg.ai .bubble{
    color:#f2ece1;
    background:linear-gradient(160deg, rgba(40,33,66,.62), rgba(22,19,42,.62));
    border:1px solid rgba(180,160,255,.16);
    border-top-left-radius:5px;
    box-shadow:0 14px 40px -22px rgba(120,90,255,.5), inset 0 0 24px rgba(120,100,200,.06);
  }
  .msg.me{ align-self:flex-end; flex-direction:row-reverse; }
  .msg.me .bubble{
    color:#1a160c;
    background:linear-gradient(160deg, var(--gold-soft), var(--gold));
    border-top-right-radius:5px;
    box-shadow:0 14px 40px -20px rgba(236,201,127,.7);
    font-weight:400;
  }
  .bubble .caret{ display:inline-block; width:2px; height:1em; background:currentColor; margin-left:2px; vertical-align:-2px; animation:blink .8s steps(2) infinite; opacity:.7;}
  @keyframes blink{ 50%{opacity:0} }

  .typing{ display:flex; gap:5px; align-items:center; padding:4px 2px; }
  .typing i{ width:7px; height:7px; border-radius:50%; background:var(--amethyst); box-shadow:0 0 10px var(--amethyst); animation:td 1.3s infinite ease-in-out; }
  .typing i:nth-child(2){ animation-delay:.18s } .typing i:nth-child(3){ animation-delay:.36s }
  @keyframes td{ 0%,60%,100%{ transform:translateY(0); opacity:.4 } 30%{ transform:translateY(-6px); opacity:1 } }

  /* ── composer ── */
  .composer{ padding:12px 18px 18px; border-top:1px solid rgba(236,201,127,.10); }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:11px; }
  .chip{
    font-family:var(--ui); font-size:12px; color:var(--gold-soft);
    background:rgba(236,201,127,.06); border:1px solid var(--line);
    padding:7px 12px; border-radius:18px; cursor:pointer; white-space:nowrap;
    transition:.25s; letter-spacing:.01em;
  }
  .chip:hover{ background:rgba(236,201,127,.16); transform:translateY(-1px); box-shadow:0 6px 18px -10px rgba(236,201,127,.6); }
  .inputrow{ display:flex; align-items:flex-end; gap:9px; }
  .candle-btn{
    flex:0 0 auto; width:46px; height:46px; border-radius:14px; cursor:pointer;
    background:radial-gradient(circle at 50% 30%, rgba(255,181,107,.35), rgba(30,24,50,.6));
    border:1px solid rgba(255,181,107,.3); display:grid; place-items:center;
    transition:.25s; position:relative; overflow:hidden;
  }
  .candle-btn:hover{ transform:translateY(-1px); box-shadow:0 8px 22px -10px rgba(255,181,107,.7); }
  .candle-btn svg{ width:20px; height:20px; }
  .candle-btn .flame{ transform-origin:50% 80%; animation:flick 1.6s infinite ease-in-out; }
  @keyframes flick{ 0%,100%{ transform:scaleY(1) translateX(0) } 50%{ transform:scaleY(1.12) translateX(.5px) } }
  .candle-count{
    position:absolute; top:3px; right:4px; font-size:9.5px; font-weight:600;
    color:var(--amber); font-family:var(--ui);
  }
  .field{
    flex:1; display:flex; align-items:center; gap:8px;
    background:rgba(10,9,22,.6); border:1px solid var(--line); border-radius:14px;
    padding:5px 6px 5px 15px; transition:.25s;
  }
  .field:focus-within{ border-color:rgba(236,201,127,.5); box-shadow:0 0 0 3px rgba(236,201,127,.08); }
  .field input{
    flex:1; background:transparent; border:0; outline:0; color:var(--paper);
    font-family:var(--serif); font-weight:300; font-size:14.5px; padding:9px 0;
  }
  .field input::placeholder{ color:var(--mute); }
  .send{
    width:38px; height:38px; border-radius:11px; border:0; cursor:pointer; flex:0 0 auto;
    background:linear-gradient(150deg, var(--gold-soft), var(--gold)); color:#1a150a;
    display:grid; place-items:center; transition:.2s;
  }
  .send:hover{ transform:translateY(-1px) rotate(2deg); box-shadow:0 8px 22px -8px rgba(236,201,127,.8); }
  .send:active{ transform:scale(.94); }
  .send svg{ width:18px; height:18px; }

  /* ── responsive ── */
  @media (max-width: 860px){
    .stage{ grid-template-columns:1fr; grid-template-rows: 34vh 1fr; }
    .leftpane{ overflow:hidden; }
    .brand{ left:20px; top:18px; }
    .crest .word{ font-size:21px; letter-spacing:.28em; }
    .tagline{ font-size:11.5px; }
    .poem{ display:none; }
    .chat{ border-left:0; border-top:1px solid var(--line); border-radius:22px 22px 0 0;
      box-shadow:0 -30px 80px -40px rgba(0,0,0,.85); }
    .chat-head{ padding:15px 18px 12px; }
    .chat-head .vigil{ display:none; }
    .thread{ padding:16px 16px 6px; }
    .msg{ max-width:94%; }
    .bubble{ font-size:14px; }
  }
  @media (max-width: 420px){
    .stage{ grid-template-rows: 30vh 1fr; }
  }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="stage">
    <div class="leftpane">
      <div id="anchor"></div>
      <div class="brand">
        <div class="crest">
          <div class="mark"></div>
          <div class="word">VIGILIA</div>
        </div>
        <div class="tagline">루멘 — 당신 곁의 묵상 동행</div>
      </div>
      <div class="poem">
        <div class="lat">Lumen<br>in tenebris</div>
        <div class="ko">어둠 속에서도 빛은 <b>꺼지지 않습니다</b>. 화면에 켜지는 촛불 하나하나가, 당신이 부른 이름을 향해 깊어집니다.</div>
      </div>
    </div>

    <aside class="chat">
      <div class="chat-head">
        <div class="orb"></div>
        <div class="who">
          <div class="n">루멘 <span style="font-weight:300;color:var(--mute);font-size:12px">Lumen</span></div>
          <div class="s"><span class="dotlive"></span> 지금 함께 깨어 있는 중</div>
        </div>
        <div class="spacer"></div>
        <div class="vigil">VIGILIA · 저녁</div>
      </div>

      <div class="thread" id="thread">
        <div class="daymark">오늘 저녁 · 봉헌</div>
      </div>

      <div class="composer">
        <div class="chips" id="chips">
          <div class="chip">오늘은 마음이 무거워요</div>
          <div class="chip">감사한 일이 있었어요</div>
          <div class="chip">노베나를 시작하고 싶어요</div>
        </div>
        <div class="inputrow">
          <button class="candle-btn" id="candleBtn" title="촛불 켜기" aria-label="촛불 켜기">
            <span class="candle-count" id="candleCount">0</span>
            <svg viewBox="0 0 24 24" fill="none">
              <path class="flame" d="M12 3c1.6 2.2 3 3.6 3 5.4a3 3 0 0 1-6 0C9 6.6 10.4 5.2 12 3z" fill="#ffce8a"/>
              <path class="flame" d="M12 5.2c.9 1.3 1.7 2.1 1.7 3.2a1.7 1.7 0 0 1-3.4 0c0-1.1.8-1.9 1.7-3.2z" fill="#fff3d6"/>
              <rect x="9.4" y="12" width="5.2" height="8.4" rx="1.4" fill="#e9d6ad"/>
            </svg>
          </button>
          <div class="field">
            <input id="input" type="text" autocomplete="off" placeholder="여기, 머무는 한 문장이면 충분해요…" />
            <button class="send" id="send" aria-label="보내기">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l15-7-4 7 4 7-15-7z" fill="#1a150a"/></svg>
            </button>
          </div>
        </div>
      </div>
    </aside>
  </div>

<script>
(()=>{
  "use strict";
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ───────────────────────── Canvas / generative rose window ───────────────────────── */
  const cv = document.getElementById('bg');
  const ctx = cv.getContext('2d', { alpha:false });
  const anchor = document.getElementById('anchor');
  let W=0,H=0,DPR=1, cx=0, cy=0, baseR=0, isMobile=false, bgGrad=null;

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio||1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W*DPR); cv.height = Math.floor(H*DPR);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const r = anchor.getBoundingClientRect();
    cx = r.left + r.width/2;
    cy = r.top + r.height/2;
    isMobile = W <= 860;
    baseR = Math.min(isMobile? r.width*1.15 : Math.min(r.width,r.height), Math.min(W,H)) * (isMobile?0.40:0.345);
    if(baseR < 90) baseR = Math.min(W,H)*0.3;
    bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W,H)*0.85);
    bgGrad.addColorStop(0, '#171132');
    bgGrad.addColorStop(0.32,'#0d0a20');
    bgGrad.addColorStop(0.7, '#070514');
    bgGrad.addColorStop(1,  '#040309');
  }
  window.addEventListener('resize', resize);

  /* pointer + scroll energy */
  const ptr = { x:.5, y:.5, tx:.5, ty:.5 };
  let bloom = 0, bloomT = 0;
  function setPtr(px,py){ ptr.tx = px / W; ptr.ty = py / H; }
  window.addEventListener('mousemove', e=> setPtr(e.clientX, e.clientY));
  window.addEventListener('touchmove', e=>{ if(e.touches[0]) setPtr(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  window.addEventListener('wheel', e=>{ bloomT = Math.min(1.4, bloomT + Math.abs(e.deltaY)*0.0012); }, {passive:true});

  const PAL = ['#ecc97f','#e1476f','#5b7bff','#b07bf0','#5fd1a8','#ffb56b'];
  function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }

  /* rings of gothic lancets */
  const RINGS = [
    { r:0.30, n:8,  w:0.115, len:0.20, dir: 1, off:0   },
    { r:0.52, n:12, w:0.085, len:0.20, dir:-1, off:0.5 },
    { r:0.74, n:16, w:0.060, len:0.17, dir: 1, off:0   },
    { r:0.92, n:24, w:0.038, len:0.11, dir:-1, off:0.3 },
  ];

  function lancet(ox,oy,ang,ri,ro,hw,col,alpha){
    const bx=ox+Math.cos(ang)*ri, by=oy+Math.sin(ang)*ri;
    const tx=ox+Math.cos(ang)*ro, ty=oy+Math.sin(ang)*ro;
    const px=-Math.sin(ang)*hw, py=Math.cos(ang)*hw;
    const mx=(bx+tx)/2, my=(by+ty)/2;
    const g = ctx.createLinearGradient(bx,by,tx,ty);
    g.addColorStop(0, hexA(col, alpha*0.10));
    g.addColorStop(0.45, hexA(col, alpha*0.85));
    g.addColorStop(0.72, hexA('#fff6e2', alpha*0.9));
    g.addColorStop(1, hexA(col, 0));
    ctx.beginPath();
    ctx.moveTo(bx,by);
    ctx.quadraticCurveTo(mx+px, my+py, tx, ty);
    ctx.quadraticCurveTo(mx-px, my-py, bx, by);
    ctx.fillStyle=g; ctx.fill();
    // crisp gold tracery edge
    ctx.lineWidth=0.7; ctx.strokeStyle=hexA('#f4e2b8', alpha*0.5); ctx.stroke();
  }

  /* particles: dust motes */
  let motes=[];
  function seedMotes(){
    const N = isMobile? 70 : 140;
    motes = Array.from({length:N}, ()=>({
      x:Math.random()*W, y:Math.random()*H,
      vy:-(0.08+Math.random()*0.28), sw:Math.random()*Math.PI*2,
      sp:0.4+Math.random()*1.2, r:0.5+Math.random()*1.9,
      a:0.12+Math.random()*0.45, hue:PAL[(Math.random()*PAL.length)|0]
    }));
  }

  /* expanding light ripples on each message */
  const ripples=[];
  function ripple(strength){ ripples.push({r:baseR*0.12, life:1, str:strength||1}); bloomT=Math.min(1.5,bloomT+0.6); }

  /* persistent candles */
  const candles=[];
  function addCandle(){
    if(candles.length>=7) return;
    const i=candles.length;
    candles.push({ i, seed:Math.random()*100, born:performance.now() });
  }

  let t0=performance.now(), rot=0;
  function frame(now){
    const dt = Math.min(40, now - t0)/16.667; t0=now;
    rot += (reduce?0.0006:0.0018)*dt;

    ptr.x += (ptr.tx-ptr.x)*0.05; ptr.y += (ptr.ty-ptr.y)*0.05;
    bloomT *= Math.pow(0.94, dt); bloom += (bloomT-bloom)*0.08;

    const breath = 1 + Math.sin(now*0.0006)*0.035 + bloom*0.05;
    const R = baseR*breath;
    const par = isMobile? 0 : 1;
    const ox = cx + (ptr.x-0.5)*46*par;
    const oy = cy + (ptr.y-0.5)*30*par;
    const tilt = (ptr.x-0.5)*0.10*par;

    // base
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle=bgGrad; ctx.fillRect(0,0,W,H);

    // additive light world
    ctx.globalCompositeOperation='lighter';

    // god-rays
    const rays = 9;
    for(let i=0;i<rays;i++){
      const a = (i/rays)*Math.PI*2 + now*0.00006 + tilt;
      const flick = 0.55 + 0.45*Math.sin(now*0.001 + i*1.7);
      const len = Math.max(W,H)*1.25;
      const hw = 0.052 + 0.02*Math.sin(now*0.0013+i);
      const x1=ox+Math.cos(a-hw)*len, y1=oy+Math.sin(a-hw)*len;
      const x2=ox+Math.cos(a+hw)*len, y2=oy+Math.sin(a+hw)*len;
      const g=ctx.createLinearGradient(ox,oy,(x1+x2)/2,(y1+y2)/2);
      g.addColorStop(0, hexA('#ffe9bf', (0.05+bloom*0.05)*flick));
      g.addColorStop(0.5, hexA('#e7c889', 0.02*flick));
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(x1,y1); ctx.lineTo(x2,y2); ctx.closePath();
      ctx.fillStyle=g; ctx.fill();
    }

    // tracery rings
    for(let k=0;k<RINGS.length;k++){
      ctx.beginPath();
      ctx.arc(ox,oy, RINGS[k].r*R, 0, Math.PI*2);
      ctx.lineWidth = 0.8; ctx.strokeStyle = hexA('#ecc97f', 0.10+0.05*Math.sin(now*0.0008+k));
      ctx.stroke();
    }
    // radial spokes
    const spokes=12;
    for(let i=0;i<spokes;i++){
      const a=(i/spokes)*Math.PI*2 + rot*0.4;
      ctx.beginPath();
      ctx.moveTo(ox+Math.cos(a)*R*0.18, oy+Math.sin(a)*R*0.18);
      ctx.lineTo(ox+Math.cos(a)*R*1.02, oy+Math.sin(a)*R*1.02);
      ctx.lineWidth=0.6; ctx.strokeStyle=hexA('#f4e2b8',0.06); ctx.stroke();
    }

    // lancet petals
    for(let k=0;k<RINGS.length;k++){
      const ring=RINGS[k];
      const ri=ring.r*R, ro=(ring.r+ring.len)*R, hw=ring.w*R;
      for(let i=0;i<ring.n;i++){
        const a=(i/ring.n)*Math.PI*2 + (ring.off*Math.PI*2/ring.n) + rot*ring.dir + tilt*0.5;
        const col=PAL[(i+k)%PAL.length];
        const sh=0.6+0.4*Math.sin(now*0.0016 + i*0.9 + k*1.3);
        lancet(ox,oy,a, ri, ro, hw, col, (0.5+0.5*sh)*(0.8+bloom*0.3));
      }
    }

    // ripples
    for(let i=ripples.length-1;i>=0;i--){
      const rp=ripples[i]; rp.r += (6.5+rp.str*2)*dt; rp.life -= 0.012*dt;
      if(rp.life<=0){ ripples.splice(i,1); continue; }
      ctx.beginPath(); ctx.arc(ox,oy, rp.r, 0, Math.PI*2);
      ctx.lineWidth=2.2*rp.life; ctx.strokeStyle=hexA('#fff2d4', 0.28*rp.life*rp.str);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(ox,oy, rp.r*0.78, 0, Math.PI*2);
      ctx.lineWidth=1.2*rp.life; ctx.strokeStyle=hexA('#b07bf0', 0.18*rp.life);
      ctx.stroke();
    }

    // central luminous core
    const coreR = R*0.16*(1+bloom*0.4) + Math.sin(now*0.0022)*3;
    const cg=ctx.createRadialGradient(ox,oy,0,ox,oy,coreR*2.4);
    cg.addColorStop(0,'rgba(255,255,255,0.95)');
    cg.addColorStop(0.25, hexA('#f4e2b8',0.8));
    cg.addColorStop(0.6, hexA('#ecc97f',0.18));
    cg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.arc(ox,oy,coreR*2.4,0,Math.PI*2); ctx.fillStyle=cg; ctx.fill();
    // quatrefoil hint at core
    for(let i=0;i<4;i++){
      const a=i/4*Math.PI*2 + rot*1.2;
      const lx=ox+Math.cos(a)*coreR*0.7, ly=oy+Math.sin(a)*coreR*0.7;
      const lg=ctx.createRadialGradient(lx,ly,0,lx,ly,coreR*0.8);
      lg.addColorStop(0,'rgba(255,250,235,0.7)'); lg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(lx,ly,coreR*0.8,0,Math.PI*2); ctx.fillStyle=lg; ctx.fill();
    }

    // dust motes
    for(const m of motes){
      m.y += m.vy*dt; m.sw += 0.02*m.sp*dt;
      m.x += Math.sin(m.sw)*0.25*m.sp;
      if(m.y < -6){ m.y=H+6; m.x=Math.random()*W; }
      const g=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r*4);
      g.addColorStop(0, hexA(m.hue, m.a*(0.8+bloom*0.5)));
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(m.x,m.y,m.r*4,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    }

    // candles row (in the rose region, beneath)
    if(candles.length){
      const span = Math.min(W*0.5, R*1.7);
      const cyBase = oy + R*1.18;
      for(const c of candles){
        const n = candles.length;
        const fx = ox + (n===1?0:((c.i/(n-1))-0.5)*span);
        const flick = Math.sin(now*0.012 + c.seed)*0.5 + Math.sin(now*0.031+c.seed*2)*0.3;
        const fy = cyBase + flick*2;
        const fr = 13 + flick*3;
        const g=ctx.createRadialGradient(fx,fy,0,fx,fy,fr*3);
        g.addColorStop(0,'rgba(255,244,214,0.95)');
        g.addColorStop(0.25, hexA('#ffb56b',0.7));
        g.addColorStop(0.6, hexA('#ff8a4b',0.18));
        g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.beginPath(); ctx.ellipse(fx,fy,fr*1.6,fr*3,0,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
        // bright wick
        ctx.beginPath(); ctx.arc(fx,fy+2,2.4,0,Math.PI*2); ctx.fillStyle='rgba(255,255,240,0.95)'; ctx.fill();
      }
    }

    requestAnimationFrame(frame);
  }

  resize(); seedMotes();
  requestAnimationFrame(frame);
  window.addEventListener('resize', ()=>{ seedMotes(); });

  /* ───────────────────────── Chat (mock conversation flow) ───────────────────────── */
  const thread = document.getElementById('thread');
  const input  = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const chips  = document.getElementById('chips');
  const candleBtn = document.getElementById('candleBtn');
  const candleCount = document.getElementById('candleCount');

  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  function scrollDown(){ thread.scrollTo({ top: thread.scrollHeight, behavior:'smooth' }); }

  function addUser(text){
    const m=document.createElement('div'); m.className='msg me';
    const b=document.createElement('div'); b.className='bubble'; b.textContent=text;
    m.appendChild(b); thread.appendChild(m);
    ripple(0.9); scrollDown();
  }

  async function aiSay(text){
    // typing indicator
    const tm=document.createElement('div'); tm.className='msg ai';
    const av=document.createElement('div'); av.className='av';
    const tb=document.createElement('div'); tb.className='bubble';
    tb.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';
    tm.appendChild(av); tm.appendChild(tb); thread.appendChild(tm); scrollDown();
    await sleep(620 + Math.min(900, text.length*16) + Math.random()*260);

    // typed reveal
    tb.innerHTML='';
    const span=document.createElement('span'); tb.appendChild(span);
    const caret=document.createElement('span'); caret.className='caret'; tb.appendChild(caret);
    ripple(1.1);
    for(let i=0;i<text.length;i++){
      span.textContent += text[i];
      if(i%3===0) scrollDown();
      await sleep(reduce?6:16 + (/[.,…?!]/.test(text[i])?70:0));
    }
    caret.remove(); scrollDown();
  }

  const replies = [
    '천천히요. 빛은 서두르는 법이 없어요.',
    '그 마음, 흩어지지 않게 여기 같이 둘게요.',
    '오늘은 여기까지만 해도 충분해요. 잘 오셨어요.',
    '한 호흡 쉬어가요. 들이쉬고… 내쉬고. 그게 이미 기도예요.',
    '말이 되지 않아도 괜찮아요. 침묵도 하나의 응답이니까요.',
    '그 질문, 서둘러 닫지 말고 오래 품어도 좋아요.'
  ];
  const pick = a => a[(Math.random()*a.length)|0];

  function chooseReply(text){
    if(/촛불|candle|초\b/.test(text)) return '촛불을 켜셨네요. 화면의 빛이 한 겹 더 깊어졌어요. 그 불빛이 누구를 향하는지, 마음속으로 이름 하나 천천히 불러볼까요.';
    if(/할머니|할아버지|엄마|아빠|어머니|아버지|가족|친구/.test(text)) return '소중한 이름이네요. 그 이름을 빛 가운데 둘게요. 원하시면 오늘부터 9일, 노베나의 첫째 날로 함께 시작해요.';
    if(/감사|고마워|고맙|기뻐|기쁜|좋은 일/.test(text)) return '그 감사가 벌써 기도예요. 작은 것에 눈뜨는 사람은, 이미 충분히 풍요로워요.';
    if(/무겁|힘들|지쳐|지친|불안|두려|슬퍼|슬프|외로/.test(text)) return '무겁죠. 전부 들지 않아도 돼요. 그중 한 조각만, 여기 살며시 내려놓아요.';
    if(/노베나|기도|묵상|미사|성체/.test(text)) return '좋아요. 거창하지 않아도 돼요. 오늘 저녁, 촛불 한 자루와 한 문장 — “여기 있습니다.” 그 한 줄로 충분히 시작돼요.';
    return pick(replies);
  }

  // unified AI queue (so user messages after the script wait their turn)
  let busy=false; const q=[];
  function enqueueAI(text){ q.push(text); pump(); }
  async function pump(){
    if(busy) return;
    const t=q.shift(); if(t===undefined) return;
    busy=true; await aiSay(t); busy=false; pump();
  }

  function handleSend(raw){
    const text=(raw!==undefined?raw:input.value).trim();
    if(!text) return;
    input.value='';
    addUser(text);
    enqueueAI(chooseReply(text));
  }

  sendBtn.addEventListener('click', ()=>handleSend());
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') handleSend(); });
  chips.addEventListener('click', e=>{ const c=e.target.closest('.chip'); if(c) handleSend(c.textContent); });

  candleBtn.addEventListener('click', ()=>{
    addCandle();
    candleCount.textContent = String(candles.length);
    bloomT=Math.min(1.6, bloomT+0.7);
    if(candles.length===1){ enqueueAI('첫 촛불이 켜졌어요. 저 빛이 흔들려도 꺼지지 않게, 제가 곁에서 같이 지킬게요.'); }
  });

  /* ── scripted opening (auto-plays, flows in real time) ── */
  const opening = [
    {role:'ai', text:'안녕하세요. 저는 루멘이에요. 오늘 하루, 지금 어디쯤 와 계신가요?'},
    {role:'me', text:'요즘 기도가 잘 안 돼요. 말이 입에서 안 나와요.'},
    {role:'ai', text:'말이 끊긴 바로 그 자리에서 기도가 시작되기도 해요. 오늘은 딱 한 문장만 같이 둘까요 — “여기 있습니다.”'},
    {role:'me', text:'그 한 문장으로 충분할까요?'},
    {role:'ai', text:'사무엘도 그렇게 답했어요. 길게 말하는 사람보다, 가만히 머무는 사람을 부르시는 것 같아요.'},
    {role:'me', text:'할머니 생각이 자꾸 나요. 뭔가 해드리고 싶은데.'},
    {role:'ai', text:'그럼 촛불 하나부터 어떨까요. 왼쪽 ✦ 버튼을 누르면, 화면의 빛이 그 마음만큼 더 깊어질 거예요.'}
  ];

  async function runOpening(){
    busy=true;
    await sleep(700);
    for(const step of opening){
      if(step.role==='ai'){ await aiSay(step.text); }
      else { addUser(step.text); await sleep(560); }
    }
    busy=false; pump();
  }
  runOpening();

})();
</script>
</body>
</html>
