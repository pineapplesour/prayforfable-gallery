<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ANANTA · 아난타</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+Devanagari:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#080411;
    --ink2:#120a26;
    --gold:#ffcf6b;
    --gold-deep:#f5a623;
    --vermilion:#ff5630;
    --lotus:#ff8fb6;
    --violet:#8a6bff;
    --cyan:#54e3d6;
    --text:#f4ecdd;
    --muted:#b9a9c9;
    --glass:rgba(20,11,38,.46);
    --glass-line:rgba(255,207,107,.20);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(140% 120% at 50% 0%, #160c2e 0%, #0a0518 48%, #050209 100%);
    color:var(--text);
    font-family:"Noto Sans KR",system-ui,sans-serif;
    overflow:hidden;
    position:fixed;inset:0;
  }
  #cosmos{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

  /* grain + vignette over canvas */
  .veil{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(120% 100% at 50% 42%, transparent 40%, rgba(4,2,9,.55) 100%);
    mix-blend-mode:multiply}

  .stage{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:26px}

  /* ---------- chat card ---------- */
  .app{
    position:relative;
    width:min(540px,100%);
    height:min(880px,calc(100% - 4px));
    display:flex;flex-direction:column;
    border-radius:30px;
    background:
      linear-gradient(180deg, rgba(28,16,52,.66), rgba(10,6,22,.72));
    backdrop-filter:blur(22px) saturate(135%);
    -webkit-backdrop-filter:blur(22px) saturate(135%);
    border:1px solid var(--glass-line);
    box-shadow:
      0 40px 120px -30px rgba(0,0,0,.85),
      0 0 0 1px rgba(255,255,255,.03) inset,
      0 1px 0 rgba(255,255,255,.10) inset;
    overflow:hidden;
  }
  /* breathing gold rim */
  .app::before{
    content:"";position:absolute;inset:0;border-radius:30px;padding:1px;
    background:linear-gradient(135deg, rgba(255,207,107,.5), rgba(138,107,255,.18) 40%, rgba(255,86,48,.4) 75%, rgba(84,227,214,.25));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    opacity:.55;pointer-events:none;animation:rim 9s ease-in-out infinite}
  @keyframes rim{0%,100%{opacity:.35}50%{opacity:.8}}

  /* ---------- header ---------- */
  .top{
    position:relative;z-index:3;
    display:flex;align-items:center;gap:14px;
    padding:18px 20px 16px;
    border-bottom:1px solid rgba(255,255,255,.06);
    background:linear-gradient(180deg, rgba(18,10,38,.5), rgba(18,10,38,0));
  }
  .sigil{position:relative;width:46px;height:46px;flex:none}
  .sigil canvas{width:100%;height:100%;display:block}
  .sigil .ring{position:absolute;inset:-4px;border-radius:50%;
    box-shadow:0 0 22px rgba(255,207,107,.45);animation:pulse 3.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 14px rgba(255,207,107,.30)}50%{box-shadow:0 0 30px rgba(255,143,182,.55)}}
  .who{flex:1;min-width:0}
  .who h1{font-family:"Marcellus",serif;font-weight:400;font-size:19px;letter-spacing:.06em;
    display:flex;align-items:center;gap:9px;line-height:1}
  .who h1 .dev{font-family:"Noto Serif Devanagari",serif;color:var(--gold);font-size:18px;text-shadow:0 0 18px rgba(255,207,107,.5)}
  .who p{font-size:11.5px;color:var(--muted);margin-top:5px;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
  .live{display:inline-flex;align-items:center;gap:5px;color:#9affe0;font-weight:500}
  .live i{width:6px;height:6px;border-radius:50%;background:#54e3d6;box-shadow:0 0 8px #54e3d6;animation:blink 1.8s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .top .glyphbtn{width:34px;height:34px;border-radius:11px;flex:none;
    border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);
    color:var(--muted);font-size:15px;display:grid;place-items:center;cursor:pointer;transition:.25s}
  .top .glyphbtn:hover{color:var(--gold);border-color:var(--glass-line);transform:translateY(-1px)}

  /* ---------- stream ---------- */
  .stream{
    position:relative;z-index:3;flex:1;overflow-y:auto;overflow-x:hidden;
    padding:22px 18px 12px;
    display:flex;flex-direction:column;gap:16px;
    scrollbar-width:thin;scrollbar-color:rgba(255,207,107,.3) transparent;
  }
  .stream::-webkit-scrollbar{width:6px}
  .stream::-webkit-scrollbar-thumb{background:rgba(255,207,107,.28);border-radius:3px}

  .daymark{align-self:center;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(220,200,235,.5);padding:5px 14px;border-radius:20px;
    border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025)}

  .row{display:flex;gap:11px;max-width:90%;opacity:0;transform:translateY(14px) scale(.98);
    animation:rise .6s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .row.ai{align-self:flex-start}
  .row.me{align-self:flex-end;flex-direction:row-reverse}

  .av{width:30px;height:30px;border-radius:50%;flex:none;margin-top:2px;position:relative;overflow:hidden}
  .av.ai{background:
      radial-gradient(circle at 50% 40%, rgba(255,207,107,.9), rgba(255,86,48,.7) 55%, rgba(40,18,70,1) 100%);
      box-shadow:0 0 16px rgba(255,143,80,.5)}
  .av.ai::after{content:"ॐ";position:absolute;inset:0;display:grid;place-items:center;
    font-family:"Noto Serif Devanagari",serif;font-size:15px;color:#1a0c2e;font-weight:600}
  .row.me .av{display:none}

  .bub{position:relative;padding:12px 15px;border-radius:18px;font-size:14.5px;line-height:1.62;
    word-break:break-word;letter-spacing:.005em}
  .row.ai .bub{
    background:linear-gradient(180deg, rgba(48,28,82,.72), rgba(28,15,52,.66));
    border:1px solid rgba(255,207,107,.16);
    border-top-left-radius:6px;color:#f3ecdf;
    box-shadow:0 10px 30px -16px rgba(0,0,0,.7)}
  .row.me .bub{
    background:linear-gradient(135deg, rgba(255,143,80,.92), rgba(255,86,48,.86));
    color:#fff;border-top-right-radius:6px;font-weight:400;
    box-shadow:0 10px 28px -14px rgba(255,86,48,.7)}
  .bub .tag{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold);margin-bottom:5px;opacity:.85}
  .row.me .bub .tag{display:none}
  .bub .san{font-family:"Noto Serif Devanagari",serif;color:var(--gold);font-style:normal}

  /* typing */
  .typing{display:flex;gap:5px;padding:14px 16px;align-items:center}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.5;
    animation:td 1.3s infinite}
  .typing span:nth-child(2){animation-delay:.18s}
  .typing span:nth-child(3){animation-delay:.36s}
  @keyframes td{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}

  .cursor{display:inline-block;width:2px;height:1em;background:var(--gold);margin-left:1px;
    vertical-align:-2px;animation:blink 1s steps(1) infinite}

  /* ---------- composer ---------- */
  .dock{position:relative;z-index:3;padding:12px 16px 16px;
    border-top:1px solid rgba(255,255,255,.06);
    background:linear-gradient(0deg, rgba(14,8,28,.6), rgba(14,8,28,0))}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:11px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;font-size:12px;color:var(--muted);padding:7px 13px;border-radius:20px;
    border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.03);cursor:pointer;
    white-space:nowrap;transition:.2s}
  .chip:hover{color:var(--gold);border-color:var(--glass-line);background:rgba(255,207,107,.07)}
  .inwrap{display:flex;align-items:flex-end;gap:10px;
    background:rgba(8,4,18,.55);border:1px solid rgba(255,255,255,.10);
    border-radius:20px;padding:8px 8px 8px 16px;transition:.25s}
  .inwrap:focus-within{border-color:rgba(255,207,107,.4);box-shadow:0 0 0 3px rgba(255,207,107,.08)}
  .inwrap textarea{flex:1;background:none;border:none;outline:none;color:var(--text);
    font-family:inherit;font-size:14.5px;line-height:1.5;resize:none;max-height:96px;padding:5px 0}
  .inwrap textarea::placeholder{color:rgba(185,169,201,.55)}
  .send{width:40px;height:40px;flex:none;border:none;border-radius:14px;cursor:pointer;
    background:linear-gradient(135deg,var(--gold),var(--vermilion));
    color:#1a0c2e;font-size:17px;display:grid;place-items:center;transition:.2s;
    box-shadow:0 6px 18px -6px rgba(255,86,48,.7)}
  .send:hover{transform:translateY(-2px) scale(1.04)}
  .send:active{transform:scale(.94)}

  @media(max-width:480px){
    .stage{padding:0}
    .app{height:100%;width:100%;border-radius:0;border:none}
    .app::before{border-radius:0}
    .who h1{font-size:18px}
    .row{max-width:92%}
  }
  @media(max-width:380px){ .bub{font-size:14px} }
</style>
</head>
<body>
  <canvas id="cosmos"></canvas>
  <div class="veil"></div>

  <div class="stage">
    <main class="app" id="app">
      <header class="top">
        <div class="sigil"><span class="ring"></span><canvas id="avatar"></canvas></div>
        <div class="who">
          <h1>ANANTA <span class="dev">अनंत</span></h1>
          <p><span class="live"><i></i>흐름 중</span> · 베단타 대화 안내자</p>
        </div>
        <button class="glyphbtn" id="toneBtn" title="색 전환">◐</button>
      </header>

      <section class="stream" id="stream">
        <div class="daymark">오늘 · 새벽 5:14</div>
      </section>

      <div class="dock">
        <div class="chips" id="chips">
          <button class="chip">결과에 흔들리지 않는 법</button>
          <button class="chip">'나'는 누구인가</button>
          <button class="chip">디왈리의 진짜 의미</button>
          <button class="chip">호흡 한 가지만</button>
        </div>
        <div class="inwrap">
          <textarea id="input" rows="1" placeholder="아난타에게 무엇이든 물어보세요…"></textarea>
          <button class="send" id="send" aria-label="보내기">↑</button>
        </div>
      </div>
    </main>
  </div>

<script>
/* ============================================================
   1. 살아있는 얀트라 우주 — Canvas 2D generative background
   ============================================================ */
(function(){
  const cv = document.getElementById('cosmos');
  const ctx = cv.getContext('2d');
  let W=0,H=0,DPR=1, cx=0, cy=0;
  const mouse = {x:0,y:0, tx:0, ty:0};
  const ripples = [];
  const sparks = [];

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = cv.width = innerWidth*DPR;
    H = cv.height = innerHeight*DPR;
    cv.style.width = innerWidth+'px';
    cv.style.height = innerHeight+'px';
    cx = W/2; cy = H*0.46;
  }
  resize();
  addEventListener('resize', resize);
  addEventListener('pointermove', e=>{ mouse.tx = e.clientX/innerWidth-0.5; mouse.ty = e.clientY/innerHeight-0.5; });

  // orbiting petal particles
  const parts = [];
  const PN = 150;
  for(let i=0;i<PN;i++){
    parts.push({
      a: Math.random()*Math.PI*2,
      r: 60 + Math.random()*460,
      sp: (Math.random()*0.4+0.1)*(Math.random()<.5?-1:1)*0.0016,
      sz: Math.random()*1.6+0.4,
      hue: Math.random(),
      tw: Math.random()*Math.PI*2
    });
  }

  function polygon(n, rad, rot, scale){
    ctx.beginPath();
    for(let i=0;i<=n;i++){
      const a = rot + i/n*Math.PI*2;
      const x = cx + Math.cos(a)*rad*scale;
      const y = cy + Math.sin(a)*rad*scale;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath();
  }
  function triangle(rad, rot, up, scale){
    ctx.beginPath();
    for(let i=0;i<3;i++){
      const a = rot + (up?-Math.PI/2:Math.PI/2) + i/3*Math.PI*2;
      const x = cx + Math.cos(a)*rad*scale;
      const y = cy + Math.sin(a)*rad*scale;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath();
  }

  let t=0;
  // tone palettes (cycled by header button)
  const palettes = [
    {a:[255,207,107], b:[255,86,48],  c:[138,107,255]},  // dusk gold
    {a:[84,227,214],  b:[138,107,255],c:[255,143,182]},  // night lotus
    {a:[255,143,182], b:[255,207,107],c:[255,86,48]}     // dawn fire
  ];
  let pal = 0, palT = 0;
  window.__cycleTone = ()=>{ pal=(pal+1)%palettes.length; };
  function mix(c1,c2,k){ return [c1[0]+(c2[0]-c1[0])*k, c1[1]+(c2[1]-c1[1])*k, c1[2]+(c2[2]-c1[2])*k]; }

  window.__pulse = (strength=1)=>{
    ripples.push({r:20*DPR, a:0.9*strength, w:2.4});
    for(let i=0;i<46;i++){
      const a=Math.random()*Math.PI*2, v=(Math.random()*2.4+0.6)*DPR;
      sparks.push({x:cx,y:cy, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1, sz:Math.random()*2.2+0.6});
    }
  };

  function frame(){
    t += 0.016;
    palT += (pal - palT)*0.04;
    const P = (k)=>{
      const i0 = Math.floor(palT)%palettes.length;
      const i1 = (i0+1)%palettes.length;
      const f = palT-Math.floor(palT);
      const g0 = palettes[i0][k], g1 = palettes[i1][k];
      return mix(g0,g1,f);
    };
    const cA = P('a'), cB = P('b'), cC = P('c');

    mouse.x += (mouse.tx-mouse.x)*0.05;
    mouse.y += (mouse.ty-mouse.y)*0.05;
    const ox = mouse.x*40*DPR, oy = mouse.y*40*DPR;

    // motion-blur trail
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(6,3,14,0.20)';
    ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.translate(ox,oy);
    ctx.globalCompositeOperation='lighter';

    const breathe = 1 + Math.sin(t*0.7)*0.035;
    const base = Math.min(W,H)*0.00072;

    // ---- concentric rotating yantra triangles (Sri Yantra inspired) ----
    const layers = 9;
    for(let i=0;i<layers;i++){
      const k = i/layers;
      const rad = (60 + i*52) * base * 100 / DPR * 0.01 * DPR; // scaled radius
      const r = (70 + i*48)*DPR*breathe;
      const rot = t*(0.06 + i*0.012)*(i%2?-1:1) + i*0.3;
      const col = i%2 ? mix(cA,cB,k) : mix(cB,cC,k);
      const al = 0.10 + 0.16*(1-k);
      ctx.strokeStyle = `rgba(${col[0]|0},${col[1]|0},${col[2]|0},${al})`;
      ctx.lineWidth = (1.1 - k*0.6)*DPR;
      triangle(r, rot, true, 1);
      ctx.stroke();
      triangle(r*0.92, -rot*1.1, false, 1);
      ctx.stroke();
      if(i%3===0){
        ctx.strokeStyle = `rgba(${col[0]|0},${col[1]|0},${col[2]|0},${al*0.6})`;
        polygon(6, r*0.7, rot*0.7, 1); ctx.stroke();
      }
    }

    // ---- outer lotus petals ----
    const petalR = 300*DPR*breathe;
    const petals = 24;
    ctx.lineWidth = 1*DPR;
    for(let i=0;i<petals;i++){
      const a = t*0.05 + i/petals*Math.PI*2;
      const px = cx+Math.cos(a)*petalR, py = cy+Math.sin(a)*petalR;
      const g = ctx.createRadialGradient(px,py,0,px,py,30*DPR);
      const col = mix(cA,cC,(i%petals)/petals);
      g.addColorStop(0,`rgba(${col[0]|0},${col[1]|0},${col[2]|0},0.5)`);
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.ellipse(px,py, 26*DPR, 9*DPR, a, 0, Math.PI*2);
      ctx.fill();
    }

    // ---- orbiting particles ----
    for(const p of parts){
      p.a += p.sp; p.tw += 0.03;
      const rr = p.r*DPR*breathe;
      const x = cx+Math.cos(p.a)*rr, y = cy+Math.sin(p.a)*rr*0.82;
      const col = mix(cA,cB,p.hue);
      const fl = (Math.sin(p.tw)*0.5+0.5);
      ctx.fillStyle=`rgba(${col[0]|0},${col[1]|0},${col[2]|0},${0.25+fl*0.5})`;
      ctx.beginPath();
      ctx.arc(x,y, p.sz*DPR*(0.6+fl*0.7), 0, Math.PI*2);
      ctx.fill();
    }

    // ---- central bindu bloom ----
    const bloom = ctx.createRadialGradient(cx,cy,0,cx,cy,150*DPR*breathe);
    bloom.addColorStop(0,`rgba(${cA[0]|0},${cA[1]|0},${cA[2]|0},0.9)`);
    bloom.addColorStop(0.25,`rgba(${cB[0]|0},${cB[1]|0},${cB[2]|0},0.35)`);
    bloom.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=bloom;
    ctx.beginPath(); ctx.arc(cx,cy,150*DPR*breathe,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`rgba(255,250,235,${0.8+Math.sin(t*2)*0.15})`;
    ctx.beginPath(); ctx.arc(cx,cy, 4*DPR*breathe,0,Math.PI*2); ctx.fill();

    // ---- ripples (on send) ----
    for(let i=ripples.length-1;i>=0;i--){
      const rp = ripples[i];
      rp.r += 6*DPR; rp.a *= 0.972;
      ctx.strokeStyle=`rgba(${cA[0]|0},${cA[1]|0},${cA[2]|0},${rp.a})`;
      ctx.lineWidth=rp.w*DPR;
      ctx.beginPath(); ctx.arc(cx,cy,rp.r,0,Math.PI*2); ctx.stroke();
      if(rp.a<0.01) ripples.splice(i,1);
    }
    // ---- sparks ----
    for(let i=sparks.length-1;i>=0;i--){
      const s=sparks[i];
      s.x+=s.vx; s.y+=s.vy; s.vx*=0.97; s.vy*=0.97; s.life-=0.018;
      ctx.fillStyle=`rgba(${cA[0]|0},${cA[1]|0},${cA[2]|0},${Math.max(s.life,0)})`;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.sz*DPR*s.life,0,Math.PI*2); ctx.fill();
      if(s.life<=0) sparks.splice(i,1);
    }

    ctx.restore();
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ============================================================
   2. Header sigil — mini rotating yantra avatar
   ============================================================ */
(function(){
  const cv=document.getElementById('avatar');
  const ctx=cv.getContext('2d');
  const D=Math.min(devicePixelRatio||1,2);
  cv.width=46*D; cv.height=46*D;
  let t=0;
  function f(){
    t+=0.02;
    ctx.clearRect(0,0,cv.width,cv.height);
    const c=23*D;
    ctx.translate(c,c);
    ctx.rotate(t);
    for(let i=0;i<3;i++){
      ctx.beginPath();
      for(let j=0;j<3;j++){
        const a=(i%2?Math.PI:0)+j/3*Math.PI*2;
        const r=(14-i*3)*D;
        const x=Math.cos(a)*r,y=Math.sin(a)*r;
        j?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.closePath();
      ctx.strokeStyle=`rgba(26,12,46,${0.85-i*0.2})`;
      ctx.lineWidth=1.4*D; ctx.stroke();
    }
    ctx.setTransform(1,0,0,1,0,0);
    requestAnimationFrame(f);
  }
  f();
})();

/* ============================================================
   3. 대화 엔진 — autoplay flow + live typing + user replies
   ============================================================ */
(function(){
  const stream=document.getElementById('stream');
  const input=document.getElementById('input');
  const sendBtn=document.getElementById('send');

  const scroll=()=> stream.scrollTo({top:stream.scrollHeight, behavior:'smooth'});

  function userRow(text){
    const row=document.createElement('div');
    row.className='row me';
    row.innerHTML=`<div class="bub"></div>`;
    row.querySelector('.bub').textContent=text;
    stream.appendChild(row); scroll();
    if(window.__pulse) window.__pulse(1);
  }

  function typingRow(){
    const row=document.createElement('div');
    row.className='row ai';
    row.innerHTML=`<div class="av ai"></div><div class="bub"><div class="typing"><span></span><span></span><span></span></div></div>`;
    stream.appendChild(row); scroll();
    return row;
  }

  // AI reply: html may include <span class="san"> & line breaks
  function aiReveal(row, tag, html){
    const bub=row.querySelector('.bub');
    bub.innerHTML = (tag?`<span class="tag">${tag}</span>`:'') + `<span class="body"></span><span class="cursor"></span>`;
    const body=bub.querySelector('.body');
    const cur=bub.querySelector('.cursor');
    // tokenized typing that preserves tags
    const tokens = html.split(/(<[^>]+>)/g).filter(Boolean);
    let ti=0, ci=0, acc='';
    return new Promise(res=>{
      function step(){
        if(ti>=tokens.length){ cur.remove(); res(); return; }
        const tk=tokens[ti];
        if(tk.startsWith('<')){ acc+=tk; ti++; body.innerHTML=acc; step(); return; }
        if(ci<tk.length){
          acc+=tk[ci++]; body.innerHTML=acc;
          if(Math.random()<0.25) scroll();
          setTimeout(step, 12+Math.random()*26);
        } else { ci=0; ti++; step(); }
      }
      step();
    });
  }

  const wait=ms=>new Promise(r=>setTimeout(r,ms));

  async function aiSay(tag, html, think=900){
    const tr=typingRow();
    await wait(think);
    tr.querySelector('.bub').innerHTML='';
    await aiReveal(tr, tag, html);
    scroll();
  }

  // ---- scripted opening conversation (mock data) ----
  const script=[
    {who:'ai', tag:'아난타', think:600, html:'안녕하세요. 새벽이네요. 잠이 오지 않는 마음 하나가 여기 닿았군요.<br>오늘은 무엇이 당신을 깨어 있게 하나요?'},
    {who:'me', text:'요즘 일이 계속 안 풀려요. 노력해도 결과가 없으니까 다 무의미하게 느껴져요.'},
    {who:'ai', tag:'카르마 요가', think:1100, html:'그 무게, 진짜로 무겁죠. 한 가지만 짚어볼게요.<br>『기타』에는 <span class="san">कर्मण्येवाधिकारस्ते</span> — "너의 권한은 <b>행위</b>에 있을 뿐, 그 <b>열매</b>에는 없다"는 말이 있어요. 결과는 애초에 당신 손 밖에 있던 거예요.'},
    {who:'me', text:'근데 결과를 놓으라는 건 그냥 포기하라는 말 같아서요.'},
    {who:'ai', tag:'아난타', think:1200, html:'아니에요. 포기는 행위까지 멈추는 거고, 이건 행위는 끝까지 하되 <b>집착만</b> 내려놓는 거예요.<br>전력으로 활을 당기되, 화살이 어디 꽂힐지로 나를 정의하지 않는 것. 그래야 다음 화살을 또 당길 힘이 남아요.'},
    {who:'me', text:'…그 말은 좀 와닿네요. 마음이 가라앉는 작은 방법도 있을까요?'},
    {who:'ai', tag:'수행 · 한 호흡', think:1100, html:'네, 딱 하나만. 숨을 들이쉴 때 속으로 <span class="san">सो</span>(소), 내쉴 때 <span class="san">हम्</span>(함). "그것이 곧 나"라는 뜻이에요.<br>의미를 믿을 필요도 없어요. 그냥 호흡에 소리 하나를 얹어 주의를 묶어두는 거예요. 1분이면 충분해요.'},
  ];

  // ---- canned replies for free input / chips ----
  const replies=[
    {tag:'다르마', html:'좋은 물음이에요. <span class="san">धर्म</span>는 거창한 운명이 아니라, <b>지금 이 자리에서 당신만이 할 수 있는 일</b>에 가까워요. 남의 길을 잘 사는 것보다, 내 길을 서툴게 사는 게 낫다고 하죠.'},
    {tag:'아트만', html:'"나는 누구인가"는 끝까지 남는 질문이에요. 베단타는 답합니다 — 당신은 생각도, 감정도, 역할도 아니라고. 그 모든 걸 <b>바라보고 있는</b> 고요한 것, 그게 <span class="san">आत्मन्</span>이에요.'},
    {tag:'빛 · 디왈리', html:'디왈리의 등불은 바깥 어둠보다 <b>안의 어둠</b>을 위한 거예요. <span class="san">तमसो मा ज्योतिर्गमय</span> — "어둠에서 빛으로 이끌어 달라". 한 해의 무지를 태우고 다시 시작하는 의식이죠.'},
    {tag:'아난타', html:'그 마음 그대로 가져와 주세요. 함께 천천히 들여다볼게요.<br>지금 가장 크게 느껴지는 감정 하나만, 이름을 붙여본다면요?'},
  ];
  let rIdx=0;

  async function handleUser(text){
    userRow(text);
    await wait(500);
    const r=replies[rIdx%replies.length]; rIdx++;
    await aiSay(r.tag, r.html, 950);
  }

  // run opening script
  (async function run(){
    for(const s of script){
      if(s.who==='me'){ await wait(700); userRow(s.text); }
      else await aiSay(s.tag, s.html, s.think);
      await wait(360);
    }
  })();

  // ---- input wiring ----
  function fire(){
    const v=input.value.trim();
    if(!v) return;
    input.value=''; input.style.height='auto';
    handleUser(v);
  }
  sendBtn.addEventListener('click', fire);
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); fire(); }
  });
  input.addEventListener('input', ()=>{
    input.style.height='auto';
    input.style.height=Math.min(input.scrollHeight,96)+'px';
  });
  document.getElementById('chips').addEventListener('click', e=>{
    const c=e.target.closest('.chip'); if(!c) return;
    handleUser(c.textContent);
  });

  // tone switch + pulse
  document.getElementById('toneBtn').addEventListener('click', ()=>{
    if(window.__cycleTone) window.__cycleTone();
    if(window.__pulse) window.__pulse(0.7);
  });
})();
</script>
