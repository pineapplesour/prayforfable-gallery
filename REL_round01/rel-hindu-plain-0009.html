<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setu — 힌두 사상 대화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Noto+Serif+KR:wght@400;500;600&family=Newsreader:ital,opt@1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fcfbf9;
    --bg-sidebar:#f4f1ec;
    --bg-elev:#ffffff;
    --ink:#211d18;
    --ink-2:#5d564c;
    --ink-3:#928a7d;
    --line:#e8e3da;
    --line-2:#ddd6ca;
    --accent:#c75b2c;       /* 절제된 사프란/테라코타 */
    --accent-soft:#f6e7dd;
    --accent-ink:#9b3f17;
    --indigo:#3b3a6b;        /* 차분한 인디고, 상호작용 보조 */
    --bubble-user:#2b2a52;
    --bubble-user-ink:#f4f3ff;
    --bubble-ai:#ffffff;
    --shadow:0 1px 2px rgba(40,30,20,.04),0 8px 24px rgba(40,30,20,.05);
    --shadow-soft:0 1px 0 rgba(40,30,20,.03);
    --radius:16px;
    --sidebar-w:288px;
    --font:'Inter','Noto Serif KR',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow:hidden;
  }
  ::selection{background:var(--accent-soft);color:var(--accent-ink)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  .app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100dvh;}

  /* ---------- 사이드바 ---------- */
  .sidebar{
    background:var(--bg-sidebar);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    min-height:0;
  }
  .brand{
    display:flex;align-items:center;gap:11px;
    padding:18px 18px 14px;
  }
  .mark{
    width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(150deg,var(--accent),#e08b4f);
    display:grid;place-items:center;
    box-shadow:0 2px 8px rgba(199,91,44,.28);
  }
  .mark svg{width:19px;height:19px}
  .brand-name{font-weight:600;font-size:15.5px;letter-spacing:-.01em}
  .brand-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}

  .new-btn{
    margin:4px 14px 12px;
    display:flex;align-items:center;gap:9px;
    padding:10px 13px;border-radius:11px;
    background:var(--bg-elev);border:1px solid var(--line-2);
    font-size:13.5px;font-weight:500;color:var(--ink);
    box-shadow:var(--shadow-soft);
    transition:border-color .15s,transform .12s;
  }
  .new-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
  .new-btn svg{width:16px;height:16px;color:var(--accent)}

  .search{margin:0 14px 8px;position:relative}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3)}
  .search input{
    width:100%;padding:9px 11px 9px 33px;border-radius:10px;
    border:1px solid transparent;background:rgba(0,0,0,.035);
    font-size:13px;color:var(--ink);outline:none;
  }
  .search input::placeholder{color:var(--ink-3)}
  .search input:focus{border-color:var(--line-2);background:var(--bg-elev)}

  .threads{flex:1 1 auto;overflow-y:auto;padding:6px 10px 12px}
  .threads::-webkit-scrollbar{width:8px}
  .threads::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);border-radius:8px;border:2px solid var(--bg-sidebar)}
  .grp-label{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);padding:12px 10px 6px}
  .thread{
    display:block;width:100%;text-align:left;
    padding:9px 11px;border-radius:10px;
    font-size:13.5px;color:var(--ink-2);
    line-height:1.35;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    transition:background .12s,color .12s;
    margin-bottom:1px;
  }
  .thread:hover{background:rgba(0,0,0,.04);color:var(--ink)}
  .thread.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}

  .me{
    display:flex;align-items:center;gap:10px;
    padding:11px 16px;border-top:1px solid var(--line);
  }
  .avatar{
    width:31px;height:31px;border-radius:50%;flex:none;
    background:linear-gradient(135deg,#6d6ba8,#3b3a6b);
    color:#fff;font-size:12px;font-weight:600;
    display:grid;place-items:center;
  }
  .me-name{font-size:13px;font-weight:500}
  .me-plan{font-size:11px;color:var(--ink-3)}
  .me .gear{margin-left:auto;width:17px;height:17px;color:var(--ink-3)}

  /* ---------- 채팅 메인 ---------- */
  .main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  .topbar{
    display:flex;align-items:center;gap:12px;
    padding:13px 22px;border-bottom:1px solid var(--line);
    background:rgba(252,251,249,.86);backdrop-filter:blur(8px);
    z-index:5;
  }
  .hamburger{display:none;width:20px;height:20px;color:var(--ink-2)}
  .topbar-title{font-size:15px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar-sub{font-size:12px;color:var(--ink-3);margin-top:1px}
  .badge{
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;
    padding:5px 11px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent-ink);
    font-size:11.5px;font-weight:600;letter-spacing:.01em;flex:none;
  }
  .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}

  .scroll{flex:1 1 auto;overflow-y:auto;scroll-behavior:smooth}
  .scroll::-webkit-scrollbar{width:10px}
  .scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.09);border-radius:8px;border:3px solid var(--bg)}
  .thread-wrap{max-width:760px;margin:0 auto;padding:30px 24px 18px}

  .turn{display:flex;gap:14px;margin-bottom:26px;animation:rise .4s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .turn .ava{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;margin-top:2px}
  .turn.ai .ava{background:linear-gradient(150deg,var(--accent),#e08b4f);box-shadow:0 2px 7px rgba(199,91,44,.25)}
  .turn.ai .ava svg{width:16px;height:16px}
  .turn.user{flex-direction:row-reverse}
  .turn.user .ava{background:linear-gradient(135deg,#6d6ba8,#3b3a6b);color:#fff;font-size:11px;font-weight:600}

  .body{min-width:0;max-width:calc(100% - 44px)}
  .turn.user .body{display:flex;flex-direction:column;align-items:flex-end}
  .who{font-size:12px;font-weight:600;color:var(--ink-3);margin:2px 0 6px}
  .turn.user .who{text-align:right}

  .bubble{
    padding:13px 16px;border-radius:var(--radius);
    font-size:14.5px;line-height:1.62;letter-spacing:-.005em;
  }
  .turn.ai .bubble{
    background:var(--bubble-ai);border:1px solid var(--line);
    border-top-left-radius:5px;box-shadow:var(--shadow);
    color:#2a251e;
  }
  .turn.user .bubble{
    background:var(--bubble-user);color:var(--bubble-user-ink);
    border-top-right-radius:5px;
  }
  .bubble p{margin:0 0 10px}
  .bubble p:last-child{margin-bottom:0}
  .bubble strong{font-weight:600;color:var(--accent-ink)}
  .turn.user .bubble strong{color:#fff}
  .bubble ul{margin:8px 0 10px;padding-left:2px;list-style:none}
  .bubble li{position:relative;padding-left:20px;margin-bottom:7px}
  .bubble li:before{content:"";position:absolute;left:4px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .bubble li b{font-weight:600;color:var(--ink)}

  .shloka{
    margin:4px 0 12px;padding:13px 16px;
    border-left:3px solid var(--accent);
    background:linear-gradient(90deg,var(--accent-soft),rgba(246,231,221,.25));
    border-radius:0 10px 10px 0;
  }
  .shloka .sa{font-family:'Newsreader',serif;font-style:italic;font-size:15px;color:var(--accent-ink);line-height:1.5}
  .shloka .tr{font-size:12.5px;color:var(--ink-2);margin-top:5px}

  .meta{display:flex;align-items:center;gap:14px;margin-top:9px;padding-left:2px}
  .meta button{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-3);transition:color .12s}
  .meta button:hover{color:var(--accent)}
  .meta svg{width:13px;height:13px}

  /* 타이핑 */
  .typing{display:inline-flex;gap:5px;padding:15px 17px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:blink 1.3s infinite}
  .typing span:nth-child(2){animation-delay:.18s}
  .typing span:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* 제안 칩 */
  .chips{max-width:760px;margin:0 auto;padding:2px 24px 6px;display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);
    background:var(--bg-elev);font-size:12.5px;color:var(--ink-2);
    transition:all .14s;box-shadow:var(--shadow-soft);
  }
  .chip:hover{border-color:var(--accent);color:var(--accent-ink);transform:translateY(-1px)}

  /* 입력 */
  .composer-wrap{padding:8px 24px 20px;background:linear-gradient(to top,var(--bg) 60%,transparent)}
  .composer{
    max-width:760px;margin:0 auto;
    display:flex;align-items:flex-end;gap:10px;
    background:var(--bg-elev);border:1px solid var(--line-2);
    border-radius:18px;padding:9px 9px 9px 16px;
    box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s;
  }
  .composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(199,91,44,.09),var(--shadow)}
  .composer textarea{
    flex:1;border:none;outline:none;resize:none;background:transparent;
    font-family:inherit;font-size:14.5px;line-height:1.55;color:var(--ink);
    max-height:160px;padding:7px 0;
  }
  .composer textarea::placeholder{color:var(--ink-3)}
  .send{
    width:38px;height:38px;border-radius:12px;flex:none;
    background:var(--accent);display:grid;place-items:center;
    transition:transform .12s,background .15s,opacity .15s;
  }
  .send svg{width:18px;height:18px;color:#fff}
  .send:hover{transform:translateY(-1px);background:#b34e23}
  .send:disabled{background:var(--line-2);opacity:.7;cursor:default;transform:none}
  .foot{max-width:760px;margin:8px auto 0;text-align:center;font-size:11px;color:var(--ink-3)}

  /* 모바일 드로어 백드롭 */
  .backdrop{display:none;position:fixed;inset:0;background:rgba(30,22,14,.34);z-index:40;opacity:0;transition:opacity .2s}

  /* ---------- 반응형 (390) ---------- */
  @media (max-width:880px){
    .app{grid-template-columns:1fr}
    .sidebar{
      position:fixed;top:0;left:0;bottom:0;width:84vw;max-width:320px;z-index:50;
      transform:translateX(-102%);transition:transform .26s cubic-bezier(.4,0,.2,1);
      box-shadow:6px 0 30px rgba(30,22,14,.16);
    }
    .app.nav-open .sidebar{transform:none}
    .app.nav-open .backdrop{display:block;opacity:1}
    .hamburger{display:block}
    .thread-wrap{padding:22px 16px 14px}
    .chips{padding:2px 16px 6px}
    .composer-wrap{padding:8px 14px 16px}
    .topbar{padding:12px 16px}
    .bubble{font-size:14px}
    .turn.user .body{max-width:88%}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="backdrop" id="backdrop"></div>

  <!-- 사이드바 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 18c3-1.5 4.5-4 4.5-7C8.5 8 7 6 5 5"/>
          <path d="M12 18V6"/>
          <path d="M20 18c-3-1.5-4.5-4-4.5-7C15.5 8 17 6 19 5"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Setu</div>
        <div class="brand-sub">힌두 사상 · 문헌 길잡이</div>
      </div>
    </div>

    <button class="new-btn" id="newChat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      새 대화
    </button>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
      <input type="text" placeholder="대화 검색" id="searchInput">
    </div>

    <nav class="threads" id="threadList"></nav>

    <div class="me">
      <div class="avatar">민</div>
      <div>
        <div class="me-name">민지</div>
        <div class="me-plan">탐구자 플랜</div>
      </div>
      <svg class="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V22a2 2 0 0 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H2a2 2 0 0 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3 1.6 1.6 0 0 0 1-1.5V2a2 2 0 0 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8 1.6 1.6 0 0 0 1.5 1H22a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    </div>
  </aside>

  <!-- 메인 -->
  <main class="main">
    <header class="topbar">
      <svg class="hamburger" id="openNav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      <div style="min-width:0">
        <div class="topbar-title" id="topTitle">브라흐만과 아트만은 같은가</div>
        <div class="topbar-sub" id="topSub">출처 표기 · 6개 전통 비교 가능</div>
      </div>
      <span class="badge"><span class="dot"></span>출처 연결됨</span>
    </header>

    <div class="scroll" id="scroll">
      <div class="thread-wrap" id="messages"></div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="개념, 문헌 구절, 축제, 수행에 대해 물어보세요…"></textarea>
        <button class="send" id="send" type="submit" aria-label="보내기" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <div class="foot">Setu는 학문적 해석을 정리해 드립니다. 신앙적 판단은 스스로 내려 주세요.</div>
    </div>
  </main>
</div>

<script>
/* ---------- 목 데이터: 실제로 흐르는 대화 ---------- */
const conversations = [
  {
    id:"c1", title:"브라흐만과 아트만은 같은가", group:"오늘",
    sub:"출처 표기 · 6개 전통 비교 가능",
    chips:["드바이타는 왜 둘을 나누나?","‘넷티 넷티’가 뭐죠?","일상어로 비유해 줘"],
    messages:[
      {role:"user",html:"<p>‘아트만이 곧 브라흐만이다’라는 말을 자주 듣는데, 그러면 개인의 ‘나’는 그냥 환상이라는 뜻인가요?</p>"},
      {role:"ai",html:`<p>‘환상’이라는 한 단어로 닫아 버리기엔 학파마다 입장이 꽤 다릅니다. 같은 문장을 두고도 해석이 갈려요.</p>
        <ul>
          <li><b>아드바이타(불이론)</b> — 아트만과 브라흐만은 본질적으로 둘이 아닙니다. 분리된 ‘나’라는 감각은 실재가 아니라 <strong>덧씌워진 인식</strong>이라고 봅니다.</li>
          <li><b>비시슈타드바이타(한정불이론)</b> — 하나이긴 하되, 개별 영혼은 신성의 <strong>속성·부분</strong>으로 실재합니다. 녹아 사라지지 않아요.</li>
          <li><b>드바이타(이원론)</b> — 영혼과 신은 영원히 구별됩니다. 합일이 아니라 <strong>관계</strong>가 핵심이죠.</li>
        </ul>
        <p>그래서 “나는 환상인가?”의 답은 어느 우산 아래 서 있느냐에 따라 달라집니다.</p>
        <div class="shloka"><div class="sa">tat tvam asi</div><div class="tr">‘그것이 곧 너이다’ — 찬도기야 우파니샤드의 대표 구절(마하바키야)</div></div>`,
        cite:"우파니샤드 · 베단타 3학파 비교"},
      {role:"user",html:"<p>아드바이타 입장이 제일 와닿는데, ‘덧씌워진 인식’이라는 게 구체적으로 어떤 느낌이에요?</p>"},
      {role:"ai",html:`<p>고전적으로 드는 비유가 ‘새끼줄과 뱀’입니다. 어스름에 밧줄을 보고 뱀이라 놀라죠. 뱀은 실재한 적이 없지만, 착각하는 순간에는 심장이 진짜로 뜁니다.</p>
        <p>여기서 핵심은 두 가지예요. 첫째, 잘못 본다고 밧줄이 사라지지는 않습니다. 둘째, <strong>새로운 걸 만들어 내야 풀리는 게 아니라 ‘다시 보면’ 풀립니다.</strong> 아드바이타가 말하는 깨달음도 비슷한 결입니다 — 없던 ‘나’를 없애는 게 아니라, 한 번도 분리된 적 없었다는 걸 알아차리는 쪽에 가깝죠.</p>`,
        cite:"샹카라 주석 · 밧줄-뱀 비유"}
    ]
  },
  {
    id:"c2", title:"카르마, 오해 없이 이해하기", group:"오늘",
    sub:"개념 정리 · 흔한 오역 교정",
    chips:["‘업보’와 운명론은 다른가?","니슈카마 카르마란?","상키야의 구나 3요소"],
    messages:[
      {role:"user",html:"<p>카르마가 결국 ‘착하게 살면 복 받는다’ 같은 권선징악 아닌가요?</p>"},
      {role:"ai",html:`<p>널리 쓰이는 요약이지만, 원래 개념은 도덕적 상벌 시스템보다 <strong>인과의 역학</strong>에 가깝습니다. 행위(카르마)에는 결과의 씨앗이 따라붙는다 — 그 정도가 출발점이에요.</p>
        <ul>

/* 새 질문에 대한 가벼운 시뮬레이션 응답(목) */
const cannedReplies = [
  `<p>좋은 질문이에요. 짧게 정리하면, 이 주제는 ‘하나의 정답’보다 <strong>학파별 강조점의 차이</strong>로 보는 편이 정확합니다.</p><p>원하시면 특정 전통을 기준으로 더 좁혀서 설명해 드릴게요 — 어느 쪽이 궁금하신가요?</p>`,
  `<p>맥락을 조금 더 좁혀 볼게요. 같은 용어라도 문헌에 따라 결이 달라서, 출처를 함께 보면 오해가 줄어듭니다.</p><ul><li><b>경전적 근거</b> — 어디서 비롯된 개념인지</li><li><b>해석 전통</b> — 후대 주석이 어떻게 비틀었는지</li><li><b>실천적 함의</b> — 수행이나 일상에서 어떻게 쓰이는지</li></ul><p>이 세 축으로 풀어 드리면 도움이 될까요?</p>`,
  `<p>흥미로운 지점을 짚으셨네요. 흔한 단순화를 한 겹 걷어내면, 실제 전승은 그보다 다층적입니다.</p><p>핵심만 말씀드리면, <strong>지역과 시대에 따라 같은 상징이 다르게 읽혔다</strong>는 점이에요. 구체적인 예가 필요하시면 하나 골라 비교해 드릴게요.</p>`
];

/* ---------- 렌더링 ---------- */
const $ = s => document.querySelector(s);
const messagesEl=$("#messages"), chipsEl=$("#chips"), scrollEl=$("#scroll"),
      threadListEl=$("#threadList"), inputEl=$("#input"), sendBtn=$("#send"),
      appEl=$("#app");
let activeId="c1", busy=false;

function iconBtns(){
  return `<div class="meta">
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>유용해요</button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>복사</button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.4 2.6L3 8"/><path d="M3 3v5h5"/></svg>다시</button>
  </div>`;
}

function turnHTML(m){
  if(m.role==="user"){
    return `<div class="turn user"><div class="ava">민</div><div class="body"><div class="who">민지</div><div class="bubble">${m.html}</div></div></div>`;
  }
  const cite = m.cite ? `<div class="who" style="margin:8px 0 0;color:var(--accent-ink);font-weight:500">↳ ${m.cite}</div>` : "";
  return `<div class="turn ai"><div class="ava"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c3-1.5 4.5-4 4.5-7C8.5 8 7 6 5 5"/><path d="M12 18V6"/><path d="M20 18c-3-1.5-4.5-4-4.5-7C15.5 8 17 6 19 5"/></svg></div><div class="body"><div class="who">Setu</div><div class="bubble">${m.html}</div>${iconBtns()}${cite}</div></div>`;
}

function renderConversation(c){
  messagesEl.innerHTML = c.messages.map(turnHTML).join("");
  chipsEl.innerHTML = (c.chips||[]).map(t=>`<button class="chip">${t}</button>`).join("");
  $("#topTitle").textContent=c.title;
  $("#topSub").textContent=c.sub||"";
  chipsEl.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{
    inputEl.value=ch.textContent; syncSend(); inputEl.focus(); autoGrow();
  }));
  requestAnimationFrame(()=>scrollEl.scrollTop=scrollEl.scrollHeight);
}

function renderThreadList(filter=""){
  const groups={};
  conversations.filter(c=>c.title.toLowerCase().includes(filter.toLowerCase()))
    .forEach(c=>{(groups[c.group]=groups[c.group]||[]).push(c)});
  let html="";
  for(const g in groups){
    html+=`<div class="grp-label">${g}</div>`;
    html+=groups[g].map(c=>`<button class="thread ${c.id===activeId?'active':''}" data-id="${c.id}">${c.title}</button>`).join("");
  }
  threadListEl.innerHTML=html||`<div class="grp-label" style="text-transform:none">결과 없음</div>`;
  threadListEl.querySelectorAll(".thread").forEach(t=>t.addEventListener("click",()=>{
    activeId=t.dataset.id;
    renderConversation(conversations.find(c=>c.id===activeId));
    renderThreadList($("#searchInput").value);
    appEl.classList.remove("nav-open");
  }));
}

/* ---------- 입력/전송 ---------- */
function autoGrow(){inputEl.style.height="auto";inputEl.style.height=Math.min(inputEl.scrollHeight,160)+"px";}
function syncSend(){sendBtn.disabled = inputEl.value.trim().length===0 || busy;}
inputEl.addEventListener("input",()=>{autoGrow();syncSend();});
inputEl.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#composer").requestSubmit();}
});

$("#composer").addEventListener("submit",e=>{
  e.preventDefault();
  const text=inputEl.value.trim();
  if(!text||busy) return;
  const conv=conversations.find(c=>c.id===activeId);
  conv.messages.push({role:"user",html:`<p>${escapeHtml(text)}</p>`});
  inputEl.value="";autoGrow();busy=true;syncSend();
  appendLast();

  // 타이핑 인디케이터
  const typing=document.createElement("div");
  typing.className="turn ai";typing.id="typingT";
  typing.innerHTML=`<div class="ava"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c3-1.5 4.5-4 4.5-7C8.5 8 7 6 5 5"/><path d="M12 18V6"/><path d="M20 18c-3-1.5-4.5-4-4.5-7C15.5 8 17 6 19 5"/></svg></div><div class="body"><div class="bubble" style="padding:0"><div class="typing"><span></span><span></span><span></span></div></div></div>`;
  messagesEl.appendChild(typing);
  scrollEl.scrollTop=scrollEl.scrollHeight;

  setTimeout(()=>{
    document.getElementById("typingT")?.remove();
    const reply=cannedReplies[Math.floor(Math.random()*cannedReplies.length)];
    conv.messages.push({role:"ai",html:reply,cite:"Setu · 학파 비교 정리"});
    appendLast();
    busy=false;syncSend();
  },1150+Math.random()*700);
});

function appendLast(){
  const conv=conversations.find(c=>c.id===activeId);
  const m=conv.messages[conv.messages.length-1];
  const wrap=document.createElement("div");
  wrap.innerHTML=turnHTML(m);
  messagesEl.appendChild(wrap.firstElementChild);
  scrollEl.scrollTop=scrollEl.scrollHeight;
}

function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* 새 대화 */
$("#newChat").addEventListener("click",()=>{
  const c={id:"c"+Date.now(),title:"새 대화",group:"오늘",sub:"무엇이든 물어보세요",
    chips:["브라흐만이 뭐죠?","박티 전통 소개","마하바라타 한눈에"],
    messages:[{role:"ai",html:`<p>안녕하세요, Setu예요. 힌두 사상·문헌·축제·수행 어느 쪽이든 <strong>출처를 함께</strong> 정리해 드립니다.</p><p>특정 학파의 시각으로 비교해 보고 싶다면 말씀만 주세요.</p>`,cite:"Setu"}]};
  conversations.unshift(c);activeId=c.id;
  renderConversation(c);renderThreadList();
  appEl.classList.remove("nav-open");inputEl.focus();
});

/* 검색 */
$("#searchInput").addEventListener("input",e=>renderThreadList(e.target.value));

/* 모바일 드로어 */
$("#openNav").addEventListener("click",()=>appEl.classList.add("nav-open"));
$("#backdrop").addEventListener("click",()=>appEl.classList.remove("nav-open"));

/* 초기 렌더 */
renderThreadList();
renderConversation(conversations.find(c=>c.id===activeId));
syncSend();
</script>
</body>
</html>
