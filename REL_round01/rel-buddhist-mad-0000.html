<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>여백 · 餘白 — 마음의 여백을 위한 대화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#080b0c;
    --ink2:#0e1316;
    --paper:#ece6da;
    --paper-dim:rgba(236,230,218,.52);
    --paper-faint:rgba(236,230,218,.30);
    --celadon:#8fb7a7;
    --celadon-deep:#5d8576;
    --amber:#dcb277;
    --amber-deep:#b88a4e;
    --line:rgba(236,230,218,.10);
    --serif:'Gowun Batang', serif;
    --sans:'Noto Sans KR', system-ui, sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---------- living background ---------- */
  #field{
    position:fixed; inset:0;
    width:100%; height:100%;
    display:block;
    z-index:0;
  }
  /* grain + vignette */
  .veil{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(125% 95% at 50% 18%, transparent 42%, rgba(4,6,7,.55) 100%),
      radial-gradient(80% 60% at 50% 120%, rgba(143,183,167,.06), transparent 70%);
  }
  .grain{
    position:fixed; inset:-150%; z-index:1; pointer-events:none; opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation:grainShift 7s steps(6) infinite;
  }
  @keyframes grainShift{
    0%{transform:translate(0,0)} 100%{transform:translate(8%,6%)}
  }

  /* ---------- app shell ---------- */
  .stage{
    position:relative; z-index:2;
    height:100%;
    display:grid;
    grid-template-rows:auto 1fr auto;
    max-width:840px;
    margin:0 auto;
    padding:0 22px;
  }

  /* ---------- header ---------- */
  header{
    display:flex; align-items:center; gap:14px;
    padding:22px 4px 16px;
  }
  .sigil{
    width:42px; height:42px; flex:0 0 42px;
    position:relative;
    animation:breathe 6.5s ease-in-out infinite;
  }
  .sigil svg{ width:100%; height:100%; display:block; }
  .ring-spin{ transform-origin:50% 50%; animation:spin 46s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.07); } }

  .id{ display:flex; flex-direction:column; gap:2px; line-height:1.1; }
  .id .name{ font-family:var(--serif); font-size:21px; letter-spacing:.06em; }
  .id .name small{ font-size:12px; color:var(--paper-faint); letter-spacing:.18em; margin-left:6px; }
  .id .state{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--paper-dim); letter-spacing:.06em; }
  .pulse-dot{ width:6px; height:6px; border-radius:50%; background:var(--celadon);
    box-shadow:0 0 0 0 rgba(143,183,167,.6); animation:dotPulse 3.4s ease-out infinite; }
  @keyframes dotPulse{ 0%{ box-shadow:0 0 0 0 rgba(143,183,167,.45);} 70%{ box-shadow:0 0 0 9px rgba(143,183,167,0);} 100%{ box-shadow:0 0 0 0 rgba(143,183,167,0);} }

  .hwadu{
    margin-left:auto;
    font-family:var(--sans); font-size:12px; letter-spacing:.04em;
    color:var(--paper-dim);
    background:rgba(236,230,218,.04);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 15px;
    cursor:pointer;
    transition:.4s ease;
    white-space:nowrap;
  }
  .hwadu:hover{ color:var(--paper); border-color:rgba(220,178,119,.4); background:rgba(220,178,119,.07); }

  /* ---------- conversation ---------- */
  .scroll{
    overflow-y:auto;
    overflow-x:hidden;
    padding:18px 2px 12px;
    scrollbar-width:thin;
    scrollbar-color:rgba(236,230,218,.14) transparent;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 38px, #000 calc(100% - 14px), transparent 100%);
            mask-image:linear-gradient(to bottom, transparent 0, #000 38px, #000 calc(100% - 14px), transparent 100%);
  }
  .scroll::-webkit-scrollbar{ width:6px; }
  .scroll::-webkit-scrollbar-thumb{ background:rgba(236,230,218,.13); border-radius:3px; }

  .thread{ display:flex; flex-direction:column; gap:18px; padding-bottom:8px; }

  .turn{ display:flex; gap:12px; max-width:86%; opacity:0; transform:translateY(14px);
    animation:rise .9s cubic-bezier(.16,.84,.34,1) forwards; }
  @keyframes rise{ to{ opacity:1; transform:none; } }

  .turn.ai{ align-self:flex-start; }
  .turn.me{ align-self:flex-end; flex-direction:row-reverse; }

  .av{ width:30px; height:30px; flex:0 0 30px; margin-top:3px; opacity:.92; }
  .av svg{ width:100%; height:100%; }
  .turn.me .av{ display:none; }

  .bubble{
    position:relative;
    font-family:var(--serif);
    font-size:16.5px;
    line-height:1.72;
    letter-spacing:.01em;
    padding:14px 18px;
    border-radius:4px 16px 16px 16px;
    backdrop-filter:blur(9px) saturate(1.1);
    -webkit-backdrop-filter:blur(9px) saturate(1.1);
    word-break:keep-all;
  }
  .turn.ai .bubble{
    background:linear-gradient(180deg, rgba(18,26,28,.50), rgba(13,19,21,.40));
    border:1px solid rgba(143,183,167,.16);
    border-left:2px solid var(--celadon-deep);
    color:#eef1ec;
    box-shadow:0 12px 40px -22px rgba(0,0,0,.9);
  }
  .turn.me .bubble{
    border-radius:16px 4px 16px 16px;
    background:linear-gradient(180deg, rgba(220,178,119,.16), rgba(184,138,78,.08));
    border:1px solid rgba(220,178,119,.26);
    color:#f4ead9;
  }
  .bubble .cursor{ display:inline-block; width:.5ch; color:var(--celadon);
    animation:blink 1s steps(2) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  .turn .meta{ margin-top:7px; font-family:var(--sans); font-size:10.5px; letter-spacing:.1em;
    color:var(--paper-faint); text-transform:uppercase; }
  .turn.me .bubble + .meta, .turn.me .meta{ text-align:right; }

  /* typing indicator */
  .typing{ display:flex; gap:5px; align-items:center; padding:16px 18px; }
  .typing span{ width:7px; height:7px; border-radius:50%; background:var(--celadon);
    opacity:.4; animation:bob 1.3s ease-in-out infinite; }
  .typing span:nth-child(2){ animation-delay:.18s; }
  .typing span:nth-child(3){ animation-delay:.36s; }
  @keyframes bob{ 0%,100%{ transform:translateY(0); opacity:.35; } 40%{ transform:translateY(-5px); opacity:.95; } }

  /* ---------- composer ---------- */
  .composer{ padding:6px 2px 22px; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; min-height:0; }
  .chip{ font-family:var(--sans); font-size:12.5px; color:var(--paper-dim);
    border:1px solid var(--line); background:rgba(236,230,218,.03);
    padding:7px 13px; border-radius:999px; cursor:pointer; transition:.35s ease;
    opacity:0; transform:translateY(6px); animation:rise .6s ease forwards; }
  .chip:hover{ color:var(--paper); border-color:rgba(143,183,167,.4); background:rgba(143,183,167,.08); }

  .inputbar{
    display:flex; align-items:flex-end; gap:10px;
    background:linear-gradient(180deg, rgba(18,24,26,.62), rgba(11,15,17,.55));
    border:1px solid var(--line);
    border-radius:18px;
    padding:8px 8px 8px 18px;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow:0 18px 50px -28px rgba(0,0,0,.95);
  }
  .inputbar textarea{
    flex:1; resize:none; border:none; outline:none; background:transparent;
    color:var(--paper); font-family:var(--serif); font-size:16px; line-height:1.6;
    max-height:120px; padding:8px 0; min-height:24px;
  }
  .inputbar textarea::placeholder{ color:var(--paper-faint); }
  .send{
    flex:0 0 auto; width:42px; height:42px; border-radius:13px; border:none; cursor:pointer;
    background:linear-gradient(150deg, var(--celadon), var(--celadon-deep));
    color:#0a0f0d; display:grid; place-items:center; transition:.35s ease;
    box-shadow:0 0 22px -6px rgba(143,183,167,.5);
  }
  .send:hover{ background:linear-gradient(150deg, var(--amber), var(--amber-deep)); transform:translateY(-1px); }
  .send svg{ width:20px; height:20px; }
  .hint{ text-align:center; font-size:10.5px; color:var(--paper-faint); letter-spacing:.08em; margin-top:11px; }

  /* ---------- responsive ---------- */
  @media (max-width:640px){
    .stage{ padding:0 14px; }
    header{ padding:16px 2px 12px; gap:11px; }
    .sigil{ width:36px; height:36px; flex-basis:36px; }
    .id .name{ font-size:18px; }
    .id .name small{ display:block; margin:2px 0 0; font-size:10px; }
    .hwadu{ padding:7px 11px; font-size:11px; }
    .turn{ max-width:94%; }
    .bubble{ font-size:15.5px; padding:13px 15px; }
    .scroll{ padding-top:14px; }
    .composer{ padding-bottom:16px; }
  }
  @media (prefers-reduced-motion:reduce){
    .grain{ animation:none; } .ring-spin{ animation-duration:120s; }
  }
</style>
</head>
<body>
  <canvas id="field"></canvas>
  <div class="veil"></div>
  <div class="grain"></div>

  <main class="stage">
    <header>
      <div class="sigil" id="headSigil"></div>
      <div class="id">
        <div class="name">여백<small>餘白</small></div>
        <div class="state"><span class="pulse-dot"></span>지금, 여기에 함께 있습니다</div>
      </div>
      <button class="hwadu" id="hwaduBtn">오늘의 화두 ↺</button>
    </header>

    <section class="scroll" id="scroll">
      <div class="thread" id="thread"></div>
    </section>

    <section class="composer">
      <div class="chips" id="chips"></div>
      <div class="inputbar">
        <textarea id="ta" rows="1" placeholder="마음에 떠오른 것을 천천히 적어 보세요…"></textarea>
        <button class="send" id="send" aria-label="보내기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="hint">여백은 정답을 주지 않습니다 — 다만 함께 멈춰 줄 뿐입니다</div>
    </section>
  </main>

<script>
/* ============================================================
   여백 · 餘白  —  생성형 잉크 위를 흐르는 선(禪) 대화
   단일 파일 / 외부 의존 없음(폰트 CDN만)
   ============================================================ */

/* ---------- 0. 붓 원(ensō) 시질 SVG ---------- */
function enso(spin){
  const cls = spin ? 'ring-spin' : '';
  return `<svg viewBox="0 0 100 100">
    <defs>
      <linearGradient id="g${spin?'h':'a'}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8fb7a7"/>
        <stop offset="1" stop-color="#dcb277"/>
      </linearGradient>
    </defs>
    <g class="${cls}">
      <circle cx="50" cy="50" r="38" fill="none" stroke="url(#g${spin?'h':'a'})"
        stroke-width="5.2" stroke-linecap="round"
        stroke-dasharray="205 60" transform="rotate(28 50 50)" opacity="0.92"/>
      <circle cx="50" cy="50" r="38" fill="none" stroke="url(#g${spin?'h':'a'})"
        stroke-width="1.4" stroke-linecap="round"
        stroke-dasharray="150 90" transform="rotate(-40 50 50)" opacity="0.35"/>
    </g>
  </svg>`;
}
document.getElementById('headSigil').innerHTML = enso(true);

/* ============================================================
   1. 살아있는 배경 — 컬노이즈 흐름장(잉크/향연) + 싱잉볼 공명
   ============================================================ */
const cv = document.getElementById('field');
const ctx = cv.getContext('2d', { alpha:false });
let W=0, H=0, DPR=1, cx=0, cy=0;
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

function resize(){
  DPR = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx = W*0.5; cy = H*0.34;
  ctx.fillStyle = '#080b0c'; ctx.fillRect(0,0,W,H);
}
addEventListener('resize', resize); resize();

/* 부드러운 값 노이즈 */
function hash(x,y){ const n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash(xi,yi), b=hash(xi+1,yi), c=hash(xi,yi+1), d=hash(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b+d-c)*u*v;
}

/* 입자 */
const COUNT = Math.round(Math.min(720, Math.max(260, (W*H)/2300)));
const P = [];
function seed(p){
  p.x = Math.random()*W; p.y = Math.random()*H;
  p.px = p.x; p.py = p.y;
  p.life = 60 + Math.random()*220;
  p.t = Math.random()*p.life;
  p.hue = Math.random();           // 0=청자, 1=호박
  p.sp = 0.6 + Math.random()*0.9;
}
for(let i=0;i<COUNT;i++){ const p={}; seed(p); P.push(p); }

/* 공명 링 */
const rings = [];
function strike(power){
  rings.push({ r:6, max: Math.max(W,H)*0.62, life:1, pow:power||1,
               ox:cx + (Math.random()-.5)*40, oy:cy + (Math.random()-.5)*30 });
}
let lastStrike = 0;

const mouse = { x:cx, y:cy, on:false };
addEventListener('pointermove', e=>{ mouse.x=e.clientX; mouse.y=e.clientY; mouse.on=true; });
addEventListener('pointerdown', e=>{ mouse.x=e.clientX; mouse.y=e.clientY; rings.push({r:4,max:240,life:1,pow:.7,ox:e.clientX,oy:e.clientY}); });
addEventListener('pointerleave', ()=> mouse.on=false);

const FS = 0.0016;            // 흐름장 스케일
let tt = 0;

function lerp(a,b,t){ return a+(b-a)*t; }

function frame(ms){
  tt = ms*0.00005;

  // 잔상 페이드 — 잉크가 물에 번지는 느낌
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(8,11,12,0.078)';
  ctx.fillRect(0,0,W,H);

  // 중심 호흡 글로우 (싱잉볼 심장박동)
  const beat = 0.5 + 0.5*Math.sin(ms*0.0009);
  const gr = ctx.createRadialGradient(cx,cy,0, cx,cy, 230+beat*120);
  gr.addColorStop(0, `rgba(143,183,167,${0.05+beat*0.05})`);
  gr.addColorStop(0.5, `rgba(220,178,119,${0.018+beat*0.02})`);
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = gr; ctx.fillRect(0,0,W,H);

  // 입자 흐름
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = 1.05;
  const speedMul = reduce ? 0.4 : 1;
  for(let i=0;i<P.length;i++){
    const p = P[i];
    const ang = vnoise(p.x*FS + tt, p.y*FS - tt) * Math.PI * 4;
    let vx = Math.cos(ang), vy = Math.sin(ang);

    // 공명 링의 방사 임펄스
    for(const r of rings){
      const dx=p.x-r.ox, dy=p.y-r.oy, d=Math.hypot(dx,dy);
      if(Math.abs(d - r.r) < 46){
        const f = (1 - Math.abs(d-r.r)/46) * r.life * r.pow * 0.9;
        vx += (dx/(d||1))*f; vy += (dy/(d||1))*f;
      }
    }
    // 포인터의 미묘한 끌림
    if(mouse.on){
      const dx=mouse.x-p.x, dy=mouse.y-p.y, d=Math.hypot(dx,dy);
      if(d<170){ const f=(1-d/170)*0.5; vx+=(dx/(d||1))*f; vy+=(dy/(d||1))*f; }
    }

    const s = p.sp*1.5*speedMul;
    p.px=p.x; p.py=p.y;
    p.x += vx*s; p.y += vy*s;
    p.t++;

    // 재생성 / 화면 밖 래핑
    if(p.t>p.life || p.x<-20||p.x>W+20||p.y<-20||p.y>H+20){ seed(p); continue; }

    const fade = Math.sin((p.t/p.life)*Math.PI); // 태어나고 사라짐
    const cR = lerp(143, 220, p.hue), cG = lerp(183, 178, p.hue), cB = lerp(167, 119, p.hue);
    ctx.strokeStyle = `rgba(${cR|0},${cG|0},${cB|0},${0.16*fade})`;
    ctx.beginPath(); ctx.moveTo(p.px,p.py); ctx.lineTo(p.x,p.y); ctx.stroke();
  }

  // 공명 링 렌더
  ctx.globalCompositeOperation = 'lighter';
  for(let i=rings.length-1;i>=0;i--){
    const r = rings[i];
    r.r += 2.6*(reduce?0.5:1); r.life *= 0.987;
    if(r.r>r.max || r.life<0.04){ rings.splice(i,1); continue; }
    ctx.beginPath(); ctx.arc(r.ox,r.oy,r.r,0,Math.PI*2);
    ctx.strokeStyle = `rgba(220,178,119,${0.10*r.life*r.pow})`;
    ctx.lineWidth = 1.4; ctx.stroke();
    ctx.beginPath(); ctx.arc(r.ox,r.oy,r.r*0.62,0,Math.PI*2);
    ctx.strokeStyle = `rgba(143,183,167,${0.07*r.life*r.pow})`;
    ctx.stroke();
  }

  // 주기적 타종
  if(ms - lastStrike > (reduce?12000:6800)){ strike(0.85); lastStrike = ms; }

  requestAnimationFrame(frame);
}
strike(1); lastStrike = -3000;
requestAnimationFrame(frame);

/* ============================================================
   2. 대화 오케스트레이션
   ============================================================ */
const thread = document.getElementById('thread');
const scroll = document.getElementById('scroll');
const chipsEl = document.getElementById('chips');

function toBottom(){ scroll.scrollTo({ top: scroll.scrollHeight, behavior:'smooth' }); }
function now(){
  const d=new Date();
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}

/* 메시지 노드 생성 */
function makeTurn(role){
  const t = document.createElement('div');
  t.className = 'turn ' + (role==='ai'?'ai':'me');
  if(role==='ai'){
    const av = document.createElement('div'); av.className='av'; av.innerHTML=enso(false);
    t.appendChild(av);
  }
  const wrap = document.createElement('div'); wrap.style.minWidth='0';
  const b = document.createElement('div'); b.className='bubble';
  const m = document.createElement('div'); m.className='meta';
  m.textContent = (role==='ai'?'여백 · ':'나 · ')+now();
  wrap.appendChild(b); wrap.appendChild(m);
  t.appendChild(wrap);
  thread.appendChild(t);
  return b;
}

/* 사용자 메시지 즉시 */
function addUser(text){
  const b = makeTurn('me'); b.textContent = text; toBottom();
}

/* AI 타이핑 인디케이터 → 스트리밍 */
function showTyping(){
  const t = document.createElement('div');
  t.className = 'turn ai'; t.dataset.typing='1';
  const av=document.createElement('div'); av.className='av'; av.innerHTML=enso(false);
  const wrap=document.createElement('div');
  const ty=document.createElement('div'); ty.className='bubble typing';
  ty.innerHTML='<span></span><span></span><span></span>';
  wrap.appendChild(ty); t.appendChild(av); t.appendChild(wrap);
  thread.appendChild(t); toBottom();
  return t;
}

function streamAI(text){
  return new Promise(resolve=>{
    const typing = showTyping();
    strike(0.9); // AI가 입을 열 때 공명
    setTimeout(()=>{
      typing.remove();
      const b = makeTurn('ai');
      const cur = document.createElement('span'); cur.className='cursor'; cur.textContent='▍';
      b.appendChild(cur);
      let i=0;
      (function type(){
        if(i<text.length){
          const ch = text[i++];
          cur.insertAdjacentText('beforebegin', ch);
          if(i%6===0) toBottom();
          const delay = ch===' '?14 : (/[.,…?!·\n]/.test(ch)?170:34);
          setTimeout(type, reduce?6:delay);
        } else { cur.remove(); toBottom(); resolve(); }
      })();
    }, reduce?250:850 + Math.random()*500);
  });
}

const wait = ms => new Promise(r=>setTimeout(r,ms));

/* ---------- 첫 화면(첫 페인트가 곧 작품) ---------- */
const opening = "어서 오세요. 급할 것 없어요.\n숨 한 번 길게 내쉬고, 떠오른 말을 천천히 꺼내 보세요.";
(function paintOpening(){
  const b = makeTurn('ai'); b.textContent = opening;
})();

/* ---------- 대본 ---------- */
const script = [
  {r:'me', t:'요즘 머리가 너무 복잡해서 뭐부터 해야 할지 모르겠어요.'},
  {r:'ai', t:'복잡한 건 생각이 많아서가 아니라, 모든 걸 동시에 붙잡으려 해서일 때가 많아요. 지금 떠 있는 것 중에 딱 하나만 골라볼까요?'},
  {r:'me', t:'음… 내일 발표가 제일 걱정돼요.'},
  {r:'ai', t:'좋아요. 나머지는 잠시 내려놓고 그 하나만. 발표의 어떤 부분이 가장 무겁게 느껴지나요 — 망치는 장면인가요, 사람들의 시선인가요?'},
  {r:'me', t:'사람들이 날 어떻게 볼지가 무서워요.'},
  {r:'ai', t:'그 시선은 아직 일어나지 않은 일이에요. 우리는 종종 미래의 관객을 미리 만들어 두고, 그 앞에서 혼자 떨곤 하죠. 내일의 당신은 지금보다 딱 한 번 더 준비되어 있을 거예요.'},
  {r:'me', t:'그렇게 생각하니 조금 가벼워지네요.'},
  {r:'ai', t:'그 가벼움이 진짜예요. 무거움도 가벼움도 지나갑니다 — 머무는 건 그걸 바라보는 당신뿐이고요. 오늘은 여기까지만 해도 충분해요.'},
];

async function runScript(){
  await wait(1400);
  for(const step of script){
    if(step.r==='me'){ await wait(700); addUser(step.t); await wait(620); }
    else { await streamAI(step.t); await wait(500); }
  }
  revealChips();
}
runScript();

/* ============================================================
   3. 상호작용 — 입력 / 칩 / 화두
   ============================================================ */
const replies = [
  '잠시 멈추고, 지금 몸 어디에 그 느낌이 머무는지 살펴봐요. 가슴인가요, 어깨인가요?',
  '말로 꺼내 놓으니 어떤가요. 생각은 손님이라, 이름을 불러주면 머물던 자리에서 조금 비켜섭니다.',
  '꼭 답을 찾지 않아도 괜찮아요. 흐르는 강은 길을 묻지 않고도 바다에 닿더라고요.',
  '그 마음, 틀린 게 아니에요. 다만 그 위에 평가 한 겹을 더 얹지 않기로 해요.',
  '한 호흡만 같이 쉬어 볼까요 — 들이쉬고, 잠깐 멈추고, 길게 내쉬고. 그거면 지금은 충분합니다.',
];
let rIdx = 0;

const koans = [
  '두 손이 마주쳐 소리가 난다 — 한 손의 소리는 어디에 있을까요.',
  '길을 가다 부처를 만나면, 그 부처도 내려놓으세요.',
  '구하지 않을 때 비로소 가득 차는 그릇이 있습니다.',
  '문 없는 문(無門) — 들어갈 문이 없다는 건, 이미 안에 있다는 뜻일지도요.',
  '눈송이는 떨어질 자리를 고르지 않습니다.',
];
let kIdx = 0;

const ta = document.getElementById('ta');
const sendBtn = document.getElementById('send');

ta.addEventListener('input', ()=>{ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,120)+'px'; });
ta.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSend(); }
});
sendBtn.addEventListener('click', doSend);

let busy = false;
async function doSend(){
  const v = ta.value.trim();
  if(!v || busy) return;
  busy = true;
  ta.value=''; ta.style.height='auto';
  addUser(v);
  chipsEl.innerHTML='';
  await wait(380);
  await streamAI(replies[rIdx++ % replies.length]);
  busy=false;
  revealChips();
}

const chipText = ['조금 더 듣고 싶어요','마음이 한결 가벼워요','다른 이야기를 꺼내볼게요'];
function revealChips(){
  chipsEl.innerHTML='';
  chipText.forEach((c,i)=>{
    const el=document.createElement('div'); el.className='chip'; el.textContent=c;
    el.style.animationDelay=(i*0.07)+'s';
    el.onclick=()=>{ if(busy) return; ta.value=c; doSend(); };
    chipsEl.appendChild(el);
  });
}

document.getElementById('hwaduBtn').addEventListener('click', async ()=>{
  if(busy) return; busy=true;
  chipsEl.innerHTML='';
  await streamAI('오늘의 화두 ─ '+koans[kIdx++ % koans.length]);
  busy=false; revealChips();
});
</script>
</body>
</html>
