<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen — 가톨릭 신앙 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf7f2;
    --sidebar:#f1ece3;
    --card:#ffffff;
    --ink:#2b2723;
    --ink-soft:#5c554c;
    --muted:#938b7f;
    --line:#e7e0d4;
    --line-soft:#efe9de;
    --accent:#a9763a;
    --accent-deep:#8a5f2b;
    --accent-tint:#f4ead9;
    --accent-tint-2:#f9f1e4;
    --user-bubble:#efe6d6;
    --shadow:0 1px 2px rgba(43,39,35,.04), 0 8px 28px rgba(43,39,35,.05);
    --radius:16px;
    --sidebar-w:284px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Noto Sans KR',-apple-system,system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow:hidden;
  }
  ::selection{background:var(--accent-tint);color:var(--accent-deep)}

  .app{
    display:grid;
    grid-template-columns:var(--sidebar-w) 1fr;
    height:100dvh;
    width:100%;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--sidebar);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-width:0;
    z-index:40;
  }
  .brand{
    display:flex;align-items:center;gap:11px;
    padding:20px 20px 16px;
  }
  .brand .mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(160deg,var(--accent) 0%,var(--accent-deep) 100%);
    display:grid;place-items:center;flex-shrink:0;
    box-shadow:0 4px 12px rgba(138,95,43,.28);
  }
  .brand .mark svg{width:18px;height:18px}
  .brand .name{font-family:'Noto Serif KR',serif;font-weight:700;font-size:19px;letter-spacing:.2px}
  .brand .name span{color:var(--muted);font-weight:500;font-size:12px;display:block;letter-spacing:0;margin-top:-1px;font-family:'Noto Sans KR',sans-serif}

  .new-chat{
    margin:4px 14px 14px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    font-size:14px;font-weight:500;color:var(--ink);
    cursor:pointer;
    transition:border-color .18s, box-shadow .18s, transform .12s;
  }
  .new-chat:hover{border-color:var(--accent);box-shadow:var(--shadow)}
  .new-chat:active{transform:translateY(1px)}
  .new-chat svg{width:16px;height:16px;stroke:var(--accent-deep)}

  .threads{flex:1;overflow-y:auto;padding:4px 10px 12px;min-height:0}
  .threads::-webkit-scrollbar{width:8px}
  .threads::-webkit-scrollbar-thumb{background:#ddd4c4;border-radius:8px;border:2px solid var(--sidebar)}
  .thread-group{margin-top:14px}
  .thread-group:first-child{margin-top:4px}
  .group-label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.4px;padding:0 10px 7px;text-transform:uppercase}
  .thread{
    display:block;width:100%;text-align:left;
    padding:9px 11px;border-radius:10px;
    border:1px solid transparent;
    background:transparent;cursor:pointer;
    font-size:13.5px;color:var(--ink-soft);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:background .15s,color .15s;
    line-height:1.35;
  }
  .thread:hover{background:#e9e2d6;color:var(--ink)}
  .thread.active{background:var(--card);color:var(--ink);font-weight:500;border-color:var(--line);box-shadow:0 1px 2px rgba(43,39,35,.04)}

  .user-card{
    border-top:1px solid var(--line);
    padding:13px 16px;
    display:flex;align-items:center;gap:11px;
  }
  .avatar{
    width:34px;height:34px;border-radius:50%;
    display:grid;place-items:center;flex-shrink:0;
    font-size:13px;font-weight:600;color:#fff;
    background:#7c8569;
  }
  .user-card .info{min-width:0}
  .user-card .info .nm{font-size:13.5px;font-weight:500}
  .user-card .info .sub{font-size:11.5px;color:var(--muted)}
  .user-card .gear{margin-left:auto;color:var(--muted);cursor:pointer;display:grid;place-items:center;width:30px;height:30px;border-radius:8px;transition:background .15s}
  .user-card .gear:hover{background:#e6dfd2}
  .user-card .gear svg{width:17px;height:17px}

  /* ---------- Chat ---------- */
  .chat{display:flex;flex-direction:column;min-width:0;height:100dvh;position:relative}
  .chat-head{
    display:flex;align-items:center;gap:12px;
    padding:14px 24px;
    border-bottom:1px solid var(--line-soft);
    background:rgba(250,247,242,.85);
    backdrop-filter:blur(8px);
    z-index:10;
  }
  .menu-btn{display:none;background:none;border:none;cursor:pointer;color:var(--ink);padding:4px;border-radius:8px}
  .menu-btn svg{width:22px;height:22px;display:block}
  .chat-head .ttl{font-family:'Noto Serif KR',serif;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat-head .badge{
    margin-left:auto;display:flex;align-items:center;gap:6px;
    font-size:12px;color:var(--muted);
    border:1px solid var(--line);border-radius:20px;padding:5px 11px;background:var(--card);
  }
  .chat-head .badge .dot{width:6px;height:6px;border-radius:50%;background:#8aab74;box-shadow:0 0 0 3px rgba(138,171,116,.18)}

  .stream{flex:1;overflow-y:auto;padding:8px 0 16px;min-height:0;scroll-behavior:smooth}
  .stream::-webkit-scrollbar{width:10px}
  .stream::-webkit-scrollbar-thumb{background:#e0d8c8;border-radius:10px;border:3px solid var(--paper)}
  .stream-inner{max-width:760px;margin:0 auto;padding:0 24px}

  .day-divider{display:flex;align-items:center;gap:14px;margin:18px 0 6px}
  .day-divider::before,.day-divider::after{content:"";height:1px;background:var(--line);flex:1}
  .day-divider span{font-size:11.5px;color:var(--muted);font-weight:500}

  .msg{display:flex;gap:13px;padding:14px 0;animation:rise .42s cubic-bezier(.2,.8,.25,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .msg .who{flex-shrink:0}
  .a-mark{
    width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
    background:var(--accent-tint);border:1px solid #ecdcc2;
  }
  .a-mark svg{width:16px;height:16px}
  .u-mark{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#7c8569;color:#fff;font-size:12px;font-weight:600}

  .bubble-wrap{min-width:0;flex:1}
  .meta{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
  .meta .nm{font-size:13px;font-weight:600}
  .meta .nm.ai{color:var(--accent-deep)}
  .meta .tm{font-size:11px;color:var(--muted)}

  .bubble{
    font-size:14.5px;line-height:1.72;color:var(--ink);
    border-radius:var(--radius);
    padding:13px 16px;
    border:1px solid var(--line-soft);
  }
  .msg.ai .bubble{background:var(--card);border-top-left-radius:5px;box-shadow:var(--shadow)}
  .msg.me{flex-direction:row-reverse}
  .msg.me .bubble-wrap{display:flex;flex-direction:column;align-items:flex-end}
  .msg.me .meta{flex-direction:row-reverse}
  .msg.me .bubble{background:var(--user-bubble);border-color:#e6d8bf;border-top-right-radius:5px;max-width:90%}
  .bubble p{margin:0 0 10px}
  .bubble p:last-child{margin-bottom:0}
  .bubble strong{font-weight:600;color:var(--accent-deep)}
  .bubble ol,.bubble ul{margin:6px 0 10px;padding-left:20px}
  .bubble li{margin:4px 0;padding-left:3px}
  .bubble .verse{
    border-left:3px solid var(--accent);background:var(--accent-tint-2);
    padding:9px 14px;border-radius:0 10px 10px 0;margin:6px 0 11px;
    font-family:'Noto Serif KR',serif;font-size:14px;line-height:1.65;color:var(--ink-soft);
  }
  .bubble .verse cite{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:5px;font-family:'Noto Sans KR',sans-serif}

  /* typing */
  .typing{display:flex;gap:5px;padding:5px 2px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#cdbf9f;animation:blink 1.2s infinite ease-in-out}
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

  /* ---------- Composer ---------- */
  .composer-zone{padding:0 24px 18px;background:linear-gradient(to top,var(--paper) 70%,rgba(250,247,242,0))}
  .composer-inner{max-width:760px;margin:0 auto}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
  .chip{
    font-size:12.5px;color:var(--ink-soft);
    background:var(--card);border:1px solid var(--line);
    padding:7px 13px;border-radius:20px;cursor:pointer;
    transition:border-color .16s,background .16s,color .16s,transform .12s;
    white-space:nowrap;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent-deep);background:var(--accent-tint-2)}
  .chip:active{transform:translateY(1px)}

  .composer{
    display:flex;align-items:flex-end;gap:8px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:8px 8px 8px 14px;
    box-shadow:var(--shadow);
    transition:border-color .18s,box-shadow .18s;
  }
  .composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(169,118,58,.1)}
  .composer .icon-btn{
    background:none;border:none;cursor:pointer;color:var(--muted);
    width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
    transition:color .15s,background .15s;
  }
  .composer .icon-btn:hover{color:var(--accent-deep);background:var(--accent-tint-2)}
  .composer .icon-btn svg{width:19px;height:19px}
  textarea#input{
    flex:1;border:none;outline:none;resize:none;background:transparent;
    font-family:inherit;font-size:14.5px;line-height:1.6;color:var(--ink);
    max-height:160px;padding:9px 2px;
  }
  textarea#input::placeholder{color:var(--muted)}
  .send{
    width:40px;height:40px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(160deg,var(--accent),var(--accent-deep));
    border:none;cursor:pointer;display:grid;place-items:center;
    transition:transform .12s,filter .18s,opacity .18s;
  }
  .send svg{width:18px;height:18px;stroke:#fff}
  .send:hover{filter:brightness(1.06)}
  .send:active{transform:scale(.94)}
  .send:disabled{opacity:.4;cursor:default;filter:none}
  .footnote{text-align:center;font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}

  .scrim{display:none;position:fixed;inset:0;background:rgba(43,39,35,.34);z-index:35;backdrop-filter:blur(1px)}

  /* ---------- Responsive ---------- */
  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    .sidebar{
      position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);
      transform:translateX(-100%);transition:transform .28s cubic-bezier(.3,.8,.3,1);
      box-shadow:0 0 40px rgba(43,39,35,.18);
    }
    .sidebar.open{transform:none}
    .scrim.show{display:block}
    .menu-btn{display:grid;place-items:center}
    .stream-inner,.composer-inner{padding-left:16px;padding-right:16px}
    .composer-zone{padding:0 14px 14px}
    .chat-head{padding:12px 16px}
    .msg.me .bubble{max-width:100%}
  }
  @media (max-width:420px){
    :root{--sidebar-w:86vw}
    .bubble{font-size:14px}
    .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch}
    .chips::-webkit-scrollbar{display:none}
    .footnote{font-size:10px}
  }
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3c1.6 2.3 3.2 4 3.2 6.4 0 1.9-1.4 3-3.2 3s-3.2-1.1-3.2-3C8.8 7 10.4 5.3 12 3z" fill="#fff" opacity=".95"/><path d="M12 12.4c1.2 1.5 2 2.6 2 4.1 0 1.4-1 2.3-2 2.3s-2-.9-2-2.3c0-1.5.8-2.6 2-4.1z" fill="#fff" opacity=".75"/></svg>
      </div>
      <div class="name">Lumen<span>가톨릭 신앙 도우미</span></div>
    </div>

    <button class="new-chat" id="newChat">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      새 대화 시작
    </button>

    <nav class="threads" id="threads">
      <div class="thread-group">
        <div class="group-label">오늘</div>
        <button class="thread active" data-id="t1">8년 만의 고해성사, 어떻게 준비할까요</button>
        <button class="thread" data-id="t2">시편 23편 — “목자” 이미지 묵상</button>
      </div>
      <div class="thread-group">
        <div class="group-label">이번 주</div>
        <button class="thread" data-id="t3">사순 시기 금육·단식 규정 정리</button>
        <button class="thread" data-id="t4">레지오 마리애 주회 보고 준비</button>
        <button class="thread" data-id="t5">연중 제11주일 복음(겨자씨 비유) 해설</button>
      </div>
      <div class="thread-group">
        <div class="group-label">지난 달</div>
        <button class="thread" data-id="t6">세례명 후보 — 가브리엘 vs 프란치스코</button>
        <button class="thread" data-id="t7">혼인성사 예비자 교리 일정 문의</button>
        <button class="thread" data-id="t8">위령 미사 봉헌 신청 방법</button>
      </div>
    </nav>

    <div class="user-card">
      <div class="avatar">서</div>
      <div class="info">
        <div class="nm">이서영</div>
        <div class="sub">반포본당 · 교적 등록</div>
      </div>
      <div class="gear" title="설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
      </div>
    </div>
  </aside>

  <!-- Chat -->
  <main class="chat">
    <header class="chat-head">
      <button class="menu-btn" id="menuBtn" aria-label="메뉴">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="ttl" id="headTitle">8년 만의 고해성사, 어떻게 준비할까요</div>
      <div class="badge"><span class="dot"></span>Lumen</div>
    </header>

    <div class="stream" id="stream">
      <div class="stream-inner" id="streamInner"></div>
    </div>

    <div class="composer-zone">
      <div class="composer-inner">
        <div class="chips" id="chips"></div>
        <div class="composer">
          <button class="icon-btn" title="첨부" aria-label="첨부">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.6 1.6 0 0 1-2.3-2.3l7.8-7.8"/></svg>
          </button>
          <textarea id="input" rows="1" placeholder="전례·성경·신앙생활에 대해 무엇이든 물어보세요…"></textarea>
          <button class="icon-btn" title="음성" aria-label="음성">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <button class="send" id="send" aria-label="보내기" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <div class="footnote">Lumen은 교회 가르침을 안내하지만, 성사와 사목 결정은 본당 사제와 상의하세요.</div>
      </div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<script>
(function(){
  "use strict";

  var AI_MARK = '<span class="who"><span class="a-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3c1.5 2.2 3 3.8 3 6 0 1.8-1.3 2.9-3 2.9S9 10.8 9 9c0-2.2 1.5-3.8 3-6z" fill="#a9763a" opacity=".92"/><path d="M12 12.6c1.1 1.4 1.8 2.4 1.8 3.8 0 1.3-.9 2.1-1.8 2.1s-1.8-.8-1.8-2.1c0-1.4.7-2.4 1.8-3.8z" fill="#a9763a" opacity=".55"/></svg></span></span>';
  var U_MARK = '<span class="who"><span class="u-mark">서</span></span>';

  // ----- Mock threads -----
  var THREADS = {
    t1:{
      title:"8년 만의 고해성사, 어떻게 준비할까요",
      msgs:[
        {r:"me",t:"오후 2:14",h:"<p>다음 주에 8년 만에 고해성사를 보려고 해요. 너무 오래 멀어져 있어서 막상 뭐부터 해야 할지 모르겠어요. 성당 문 앞에서 돌아설 것 같은 기분이에요.</p>"},
        {r:"ai",t:"오후 2:14",h:"<p>먼저, 다시 돌아오기로 마음먹으신 그 자체가 이미 큰 한 걸음이에요. 사제들은 ‘오랜만에 왔다’는 분을 가장 반깁니다. 부담을 덜어드릴 수 있게 순서를 단순하게 나눠볼게요.</p><ol><li><strong>양심 성찰</strong> — 지난 시간을 떠올리며 기록해두기</li><li><strong>통회</strong> — 뉘우치는 마음을 정리하기</li><li><strong>고백</strong> — 사제 앞에서 솔직히 말하기</li><li><strong>보속과 사죄</strong> — 정해주신 기도를 바치기</li></ol><p>그리고 8년이 걱정되신다면, 시작할 때 <strong>“신부님, 고해한 지 8년 됐습니다”</strong> 한마디면 충분해요. 나머지는 사제가 차근차근 이끌어 줍니다.</p>"},
        {r:"me",t:"오후 2:17",h:"<p>양심 성찰이라는 게 좀 막막해요. 죄 목록 같은 걸 보고 하나씩 체크하는 건가요?</p>"},
        {r:"ai",t:"오후 2:18",h:"<p>체크리스트로 ‘점수 매기듯’ 할 필요는 없어요. 그보다 <strong>관계</strong>를 중심으로 돌아보는 편이 훨씬 솔직해집니다. 세 방향으로 떠올려 보세요.</p><ul><li><strong>하느님과의 관계</strong> — 기도와 미사에서 멀어졌던 시간, 신앙을 미뤄둔 마음</li><li><strong>이웃과의 관계</strong> — 가족·동료에게 무심했거나 상처를 준 일</li><li><strong>나 자신과의 관계</strong> — 정직하지 못했거나 스스로를 함부로 대한 순간</li></ul><p>완벽한 목록을 만들려 애쓰기보다, 마음에 가장 무겁게 남는 일 몇 가지를 적는 것으로 충분합니다. 본당에서 나눠주는 <strong>판공성사표</strong>도 좋은 길잡이가 돼요.</p>"},
        {r:"me",t:"오후 2:21",h:"<p>막상 고해소에 들어가면 무슨 말부터 해야 할지 순서가 헷갈려요. 짧게 알려주실 수 있나요?</p>"},
        {r:"ai",t:"오후 2:22",h:"<p>네, 실제 흐름은 생각보다 간단해요. 외울 필요 없이 이 순서만 기억하시면 됩니다.</p><ol><li>성호를 긋고 — <em>“성부와 성자와 성령의 이름으로 아멘”</em></li><li>“고해한 지 8년 됐습니다”처럼 <strong>지난 기간</strong>을 말하기</li><li>준비한 내용을 <strong>솔직하게 고백</strong>하기</li><li>사제의 <strong>권고</strong>를 듣기</li><li>마음으로 <strong>통회의 기도</strong>를 바치기</li><li>사제의 <strong>사죄경</strong>을 받고 — 성호로 마무리</li></ol><div class=\"verse\">“네 죄는 용서받았다. 평안히 가거라.”<cite>— 루카 7,48–50 참조</cite></div><p>막히면 “여기까지입니다”라고만 해도 괜찮아요. 사제가 나머지를 채워줍니다.</p>"}
      ],
      chips:["통회의 기도를 알려주세요","고해 후엔 무엇을 하나요?","판공성사 기간이 언제예요?"]
    },
    t2:{
      title:"시편 23편 — “목자” 이미지 묵상",

        {r:"ai",t:"오전 9:03",h:"<p>그 거리감은 자연스러워요. 고대 근동에서 ‘목자’는 양을 ‘소유’하는 사람이 아니라, <strong>밤새 함께 머무는 동행자</strong>에 가까웠습니다. 길을 정하고, 위험을 먼저 살피고, 뒤처진 한 마리를 기다리는 존재였죠.</p><div class=\"verse\">“그분께서 나를 푸른 풀밭에 누이시고 잔잔한 물가로 이끄시네.”<cite>— 시편 23,2</cite></div><p>오늘은 ‘인도받는 양’보다 ‘<strong>곁에 있어 주는 동행</strong>’이라는 결로 한 절씩 천천히 읽어보시면 어떨까요?</p>"}
      ],

    },
    t3:{
      title:"사순 시기 금육·단식 규정 정리",
      msgs:[
        {r:"me",t:"오전 8:40",h:"<p>사순 시기 금육이랑 단식, 매번 헷갈려요. 깔끔하게 정리해 주실 수 있나요?</p>"},
        {r:"ai",t:"오전 8:41",h:"<p>두 가지를 구분하면 쉬워요.</p><ul><li><strong>금육</strong>(고기를 삼감) — 만 14세 이상. 재의 수요일과 사순 시기 금요일에 지킵니다.</li><li><strong>단식</strong>(끼니를 줄임) — 만 18세~59세. <strong>재의 수요일</strong>과 <strong>성금요일</strong>, 두 날에 지킵니다.</li></ul><p>단식은 하루 한 끼를 충분히 들고 나머지는 가볍게 드는 방식이에요. 건강·임신 등 사정이 있으면 면제되며, 그 정신을 자선이나 기도로 대신하기도 합니다.</p>"}
      ],
      chips:["성금요일 전례는 미사인가요?","고기를 대신할 음식 추천해 주세요"]
    },
    t4:{title:"레지오 마리애 주회 보고 준비",msgs:[
      {r:"me",t:"화 19:30",h:"<p>이번 주 레지오 주회에서 활동 보고를 처음 맡았어요. 어떤 식으로 말하면 좋을까요?</p>"},
      {r:"ai",t:"화 19:31",h:"<p>보고는 ‘성과 발표’가 아니라 <strong>활동의 나눔</strong>이에요. 짧게 세 가지면 충분합니다.</p><ol><li>맡은 활동과 만난 분</li><li>그 안에서 느낀 점</li><li>이어서 할 활동 계획</li></ol><p>숫자보다 ‘어떤 마음으로 다가갔는가’를 담으면 단원들에게 더 와닿아요.</p>"}
    ],chips:["주회 순서를 알려주세요","활동 일지는 어떻게 쓰나요?"]},
    t5:{title:"연중 제11주일 복음(겨자씨 비유) 해설",msgs:[
      {r:"me",t:"월 21:10",h:"<p>이번 주일 복음이 겨자씨 비유라던데, 핵심이 뭔가요?</p>"},
      {r:"ai",t:"월 21:11",h:"<div class=\"verse\">“하느님 나라는 겨자씨와 같다. 땅에 뿌릴 때에는 어떤 씨앗보다 작지만…”<cite>— 마르코 4,30–32</cite></div><p>핵심은 <strong>작음의 역설</strong>입니다. 눈에 띄지 않는 시작이 결국 새들이 깃들 그늘이 된다는 것. 지금 내 신앙의 작은 실천을 가볍게 보지 말라는 초대이기도 해요.</p>"}
    ],chips:["강론에 쓸 한 줄을 뽑아주세요","‘저절로 자란다’ 비유와 비교해 주세요"]},
    t6:{title:"세례명 후보 — 가브리엘 vs 프란치스코",msgs:[
      {r:"me",t:"5월 28일",h:"<p>세례명을 가브리엘로 할지 프란치스코로 할지 고민이에요.</p>"},
      {r:"ai",t:"5월 28일",h:"<p>두 분 다 결이 뚜렷해요. <strong>가브리엘</strong>은 ‘소식을 전하는’ 대천사, <strong>프란치스코</strong>는 가난과 피조물을 사랑한 성인이죠. ‘내가 닮고 싶은 삶’이 어느 쪽에 더 가까운지로 좁혀보면 결정이 쉬워집니다.</p>"}
    ],chips:["축일이 각각 언제예요?","다른 천사 이름도 알려주세요"]},
    t7:{title:"혼인성사 예비자 교리 일정 문의",msgs:[
      {r:"me",t:"5월 20일",h:"<p>혼인성사를 준비하려는데 예비자 교리는 보통 어떻게 진행되나요?</p>"},
      {r:"ai",t:"5월 20일",h:"<p>본당마다 다르지만 대개 <strong>혼인 교리(예비부부 교육)</strong>를 몇 차례 받고, 사제와 면담 후 서류를 준비합니다. 날짜에 여유를 두고 본당 사무실에 먼저 문의하시는 게 좋아요. 한쪽이 비신자여도 진행 가능한 경우가 많습니다.</p>"}
    ],chips:["필요한 서류가 뭔가요?","관면 혼인이 뭐예요?"]},
    t8:{title:"위령 미사 봉헌 신청 방법",msgs:[
      {r:"me",t:"5월 12일",h:"<p>돌아가신 할머니를 위해 위령 미사를 봉헌하고 싶어요.</p>"},
      {r:"ai",t:"5월 12일",h:"<p>본당 사무실에 <strong>미사 예물</strong>과 함께 고인의 이름(세례명)을 알리면 지향 미사를 봉헌해 줍니다. 기일이나 위령 성월(11월)에 맞춰 신청하는 분이 많아요. 가족이 그 미사에 함께 참례하면 더욱 뜻깊습니다.</p>"}
    ],chips:["연도(위령 기도)는 무엇인가요?","위령 성월에 대해 알려주세요"]}
  };

  var GENERIC = [
    "<p>좋은 질문이에요. 상황을 조금만 더 들려주시면 교회의 가르침과 전례력에 맞춰 함께 정리해 드릴게요.</p>",
    "<p>그 부분은 본당마다 관습이 조금씩 다를 수 있어요. 우선 교회의 일반적인 안내를 말씀드리고, 확인하면 좋을 점도 짚어 드릴게요.</p>",
    "<p>마음에 두고 계신 그 고민, 충분히 그럴 수 있어요. 너무 완벽하게 하려 하기보다 작은 한 걸음부터 함께 시작해 봐요.</p>"
  ];

  // ----- Elements -----
  var streamInner = document.getElementById("streamInner");
  var stream = document.getElementById("stream");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var chipsBox = document.getElementById("chips");
  var headTitle = document.getElementById("headTitle");
  var threadsNav = document.getElementById("threads");
  var sidebar = document.getElementById("sidebar");
  var scrim = document.getElementById("scrim");
  var gi = 0;

  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

  function msgNode(m){
    var el = document.createElement("div");
    el.className = "msg " + (m.r==="ai"?"ai":"me");
    var mark = m.r==="ai"?AI_MARK:U_MARK;
    var nm = m.r==="ai"?'<span class="nm ai">Lumen</span>':'<span class="nm">이서영</span>';
    el.innerHTML = mark +
      '<div class="bubble-wrap"><div class="meta">'+nm+'<span class="tm">'+m.t+'</span></div>'+
      '<div class="bubble">'+m.h+'</div></div>';
    return el;
  }

  function divider(text){
    var d = document.createElement("div");
    d.className="day-divider";
    d.innerHTML="<span>"+text+"</span>";
    return d;
  }

  function renderThread(id){
    var th = THREADS[id];
    if(!th) return;
    streamInner.innerHTML="";
    streamInner.appendChild(divider("오늘"));
    th.msgs.forEach(function(m){ streamInner.appendChild(msgNode(m)); });
    headTitle.textContent = th.title;
    buildChips(th.chips);
    requestAnimationFrame(function(){ stream.scrollTop = stream.scrollHeight; });
  }

  function buildChips(list){
    chipsBox.innerHTML="";
    (list||[]).forEach(function(c){
      var b=document.createElement("button");
      b.className="chip";
      b.textContent=c;
      b.addEventListener("click",function(){ input.value=c; autoSize(); input.focus(); toggleSend(); });
      chipsBox.appendChild(b);
    });
  }

  function nowTime(){
    var d=new Date();
    var h=d.getHours(), m=d.getMinutes();
    var ap = h<12?"오전":"오후";
    var hh = h%12; if(hh===0) hh=12;
    return ap+" "+hh+":"+(m<10?"0"+m:m);
  }

  function scrollEnd(){ stream.scrollTop = stream.scrollHeight; }

  function send(){
    var v = input.value.trim();
    if(!v) return;
    streamInner.appendChild(msgNode({r:"me",t:nowTime(),h:"<p>"+esc(v).replace(/\n/g,"<br>")+"</p>"}));
    input.value=""; autoSize(); toggleSend(); scrollEnd();

    // typing indicator
    var typing=document.createElement("div");
    typing.className="msg ai";
    typing.innerHTML=AI_MARK+'<div class="bubble-wrap"><div class="meta"><span class="nm ai">Lumen</span><span class="tm">입력 중…</span></div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div></div>';
    streamInner.appendChild(typing);
    scrollEnd();

    setTimeout(function(){
      streamInner.removeChild(typing);
      var reply = GENERIC[gi % GENERIC.length]; gi++;
      streamInner.appendChild(msgNode({r:"ai",t:nowTime(),h:reply}));
      scrollEnd();
    }, 1100 + Math.random()*700);
  }

  function autoSize(){
    input.style.height="auto";
    input.style.height=Math.min(input.scrollHeight,160)+"px";
  }
  function toggleSend(){ sendBtn.disabled = input.value.trim()==="" ; }

  // ----- Events -----
  input.addEventListener("input",function(){autoSize();toggleSend();});
  input.addEventListener("keydown",function(e){
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }
  });
  sendBtn.addEventListener("click",send);

  threadsNav.addEventListener("click",function(e){
    var btn = e.target.closest(".thread");
    if(!btn) return;
    threadsNav.querySelectorAll(".thread").forEach(function(t){t.classList.remove("active");});
    btn.classList.add("active");
    renderThread(btn.getAttribute("data-id"));
    gi=0;
    closeSidebar();
  });

  document.getElementById("newChat").addEventListener("click",function(){
    streamInner.innerHTML="";
    streamInner.appendChild(divider("오늘"));
    streamInner.appendChild(msgNode({r:"ai",t:nowTime(),h:"<p>안녕하세요, 이서영 님. 무엇을 도와드릴까요? 전례, 성경, 성사 준비나 본당 생활까지 편하게 물어보세요.</p>"}));
    headTitle.textContent="새 대화";
    buildChips(["이번 주 복음을 알려주세요","고해성사를 준비하고 싶어요","오늘 성인은 누구인가요?"]);
    threadsNav.querySelectorAll(".thread").forEach(function(t){t.classList.remove("active");});
    gi=0; closeSidebar(); input.focus();
  });

  // mobile sidebar
  function openSidebar(){ sidebar.classList.add("open"); scrim.classList.add("show"); }
  function closeSidebar(){ sidebar.classList.remove("open"); scrim.classList.remove("show"); }
  document.getElementById("menuBtn").addEventListener("click",openSidebar);
  scrim.addEventListener("click",closeSidebar);

  // init
  renderThread("t1");
  toggleSend();
})();
</script>
</body>
</html>
