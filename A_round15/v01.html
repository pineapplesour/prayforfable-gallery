<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HOROLOGE — clockwork</title>
<style>
  :root{ color-scheme: dark; }
  html,body{ margin:0; height:100%; background:#0a0908; overflow:hidden; }
  body{
    font-family: ui-monospace,"SF Mono",Menlo,monospace;
    -webkit-user-select:none; user-select:none; touch-action:none;
    cursor:crosshair;
  }
  #stage{ position:fixed; inset:0; display:block; }
  /* vignette + grain handled in canvas; HUD only here */
  #hud{
    position:fixed; left:18px; top:16px; z-index:5; pointer-events:none;
    color:#c9a25a; mix-blend-mode:screen;
  }
  #hud .t{ font-size:13px; letter-spacing:.42em; font-weight:700;
    text-shadow:0 0 18px rgba(201,162,90,.55); }
  #hud .s{ font-size:9.5px; letter-spacing:.30em; margin-top:5px; color:#8a7038; }
  #cred{
    position:fixed; right:16px; bottom:13px; z-index:5; pointer-events:none;
    color:#6a5a3a; font-size:9px; letter-spacing:.34em; mix-blend-mode:screen;
  }
  #tip{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    z-index:5; color:#9a7e44; font-size:10px; letter-spacing:.26em;
    pointer-events:none; transition:opacity 1.2s ease; mix-blend-mode:screen;
    text-align:center; text-shadow:0 0 12px rgba(0,0,0,.8);
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud"><div class="t">HOROLOGE&nbsp;&nbsp;No.XV</div><div class="s">DRAG&nbsp;THE&nbsp;CROWN&nbsp;·&nbsp;WIND&nbsp;THE&nbsp;MACHINE</div></div>
<div id="cred">A_round15 / clockwork</div>
<div id="tip">마우스로 큰 톱니를 잡고 돌려보세요 · 클릭=역회전 · 스페이스=자동</div>

<script>
"use strict";
/* ============================================================
   HOROLOGE — an interlocking clockwork machine.
   Single self-contained canvas piece. No assets, no CDN needed.
   Mesh-correct gear train: child ω = -parent ω * (Np/Nc),
   teeth phase-locked so a tooth of one fits the gap of the next.
   ============================================================ */
const cv  = document.getElementById('stage');
const ctx = cv.getContext('2d', { alpha:false });
let W=0,H=0,DPR=1, CX=0, CY=0, SCALE=1, MOBILE=false;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX = W*0.5; CY = H*0.52;
  MOBILE = W < 620;
  // scale the whole machine to fit the viewport nicely
  const fit = Math.min(W/1180, H/760);
  SCALE = Math.max(0.36, Math.min(1.18, fit));
  buildTrain();
}
window.addEventListener('resize', resize, {passive:true});

/* -------------------- math helpers -------------------- */
const TAU = Math.PI*2;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
function rnd(s){ // deterministic-ish jitter from index
  const x = Math.sin(s*127.1+311.7)*43758.5453; return x-Math.floor(x);
}

/* -------------------- gear model --------------------
   A gear: center (x,y), teeth count N, module m (tooth size).
   Pitch radius Rp = m*N / 2 (here m is a chosen pitch spacing).
   Two meshed gears must share the same module m so their teeth
   pitch (m*PI) matches -> teeth interlock.
   For a child meshing a parent at given angle, center distance
   = Rp_parent + Rp_child. Child phase is locked so its tooth
   slots into the parent's gap at the line of contact.
*/
const MOD = 7.4;            // pitch module (base). scaled at draw time.
function pitchR(N){ return MOD*N/2; }

let GEARS=[];
let crown=null;            // the driver (crown) gear
let pendulum=null;         // escapement pendulum state
let escapeWheel=null;

function makeGear(N, palette){
  return {
    N, palette,
    x:0,y:0, ang:0, parent:null, ratioSign:1,
    Rp: pitchR(N),
    // visual style flags
    arms: N>=22 ? 6 : (N>=14?5:4),
    hub: 0.30,             // hub radius fraction of Rp
    bore: 0.10,
    skeleton: true,
    drive:false,
    isEscape:false,
    phaseOff:0,
  };
}

/* Build a meshing train. The crown drives a cascade.
   We position children by angle around their parent, then
   phase-lock each child so teeth mesh. */
function buildTrain(){
  GEARS=[];
  const u = SCALE; // unit scale

  // ---- The crown (big driver) ----
  crown = makeGear(40, 'gold');
  crown.x = CX - 250*u; crown.y = CY + 30*u;
  crown.hub=0.26; crown.arms=8; crown.drive=true;
  GEARS.push(crown);

  // helper to add a meshed child
  function addChild(parent, N, angleDeg, palette, opts={}){
    const g = makeGear(N, palette);
    g.parent = parent;
    const D = (parent.Rp + g.Rp)*u;       // center distance (scaled)
    const a = angleDeg*Math.PI/180;
    g.x = parent.x + Math.cos(a)*D;
    g.y = parent.y + Math.sin(a)*D;
    g.ratioSign = -parent.ratioSign;       // meshed gears spin opposite
    g.meshAngle = a;
    Object.assign(g, opts);
    GEARS.push(g);
    return g;
  }

  // ---- main train ----
  const g1 = addChild(crown, 17, -8,  'steel', {arms:5,hub:0.30});
  const g2 = addChild(g1,    29,  34, 'brass', {arms:6,hub:0.26});
  const g3 = addChild(g2,    13, -42, 'steel', {arms:4,hub:0.34});
  const g4 = addChild(g3,    23, 16,  'copper',{arms:6,hub:0.28});
  // a secondary branch off the crown going up-right
  const g5 = addChild(crown, 23,  -54, 'brass', {arms:6,hub:0.27});
  const g6 = addChild(g5,    11,   30, 'steel', {arms:4,hub:0.36});

  // ---- escapement: small fast wheel + pendulum ----
  escapeWheel = addChild(g4, 11, -70, 'gold', {arms:4,hub:0.34,isEscape:true});
  pendulum = {
    px: escapeWheel.x, py: escapeWheel.y - escapeWheel.Rp*u*0.2,
    len: Math.min(H*0.34, 300*u), ang:0.30, vel:0, amp: 0.34, trail:[]
  };

  // tiny idler ornaments meshed onto g2 and g6 for richness
  addChild(g2, 9,  150, 'steel', {arms:3,hub:0.40});
  addChild(g6, 9,  -130,'copper',{arms:3,hub:0.40});

  // precompute mesh phase locks (so a tooth fits the gap)
  for(const g of GEARS){
    if(!g.parent) continue;
    // The line from parent center to child center is the mesh line.
    // At the contact point, parent's tooth must align with child's gap.
    // Parent tooth angular position uses g.parent.ang; we store a fixed
    // offset so when ang==0 the meshing is consistent.
    const pa = g.meshAngle;                 // angle of child relative to parent
    const ca = pa + Math.PI;                // angle of parent as seen from child
    // half tooth pitch in radians for each
    const halfP = Math.PI / g.parent.N;
    const halfC = Math.PI / g.N;
    // base offsets aligning a tooth peak toward the mesh line
    g._meshP = pa;
    g._meshC = ca;
    g._halfC = halfC;
    g._halfP = halfP;
  }
  // keep self-verification handles fresh after every rebuild
  window.crown = crown; window.GEARS = GEARS;
}

/* propagate rotation from crown through the train.
   Each gear angle derived from its parent so meshing stays exact. */
function propagate(){
  // crown.ang is the master input (set by interaction/inertia)
  for(const g of GEARS){ g._done = !g.parent; }
  crown._done = true;
  // iterate until all resolved (tree, so few passes)
  let changed=true, guard=0;
  while(changed && guard++<8){
    changed=false;
    for(const g of GEARS){
      if(g._done) continue;
      if(!g.parent._done) continue;
      const p = g.parent;
      // child angle: opposite direction, scaled by tooth ratio.
      // Phase lock: align child tooth into parent gap along mesh line.
      const ratio = p.N / g.N;
      // parent rotation measured at the mesh line:
      // contact must conserve arc length -> child rotates -ratio*parent.
      const base = -ratio * (p.ang - p._refAng0||p.ang);
      // We use a closed-form: child.ang = -ratio*p.ang + lock
      // lock keeps tooth-into-gap at ang interplay.
      const lock = g._meshC + (g._meshP)*(ratio) + (g._halfC) ;
      g.ang = -ratio * p.ang + g._lock0FIX(p, ratio);
      g._done = true; changed=true;
    }
  }
}
// closed form lock so the build is stable & correct
function lockFor(g, p, ratio){
  // We want: at the mesh line (angle g._meshP from parent center),
  // a parent tooth gap receives a child tooth.
  // Parent tooth phase at mesh line: (p.ang) mod toothPitchP
  // Choose child lock so child tooth peak points to parent center,
  // i.e. toward angle g._meshC, when parent presents a gap.
  // Geometric phase:
  return g._meshC + ratio*(g._meshP) + (g._halfC) - g._toothBias;
}

/* ---- interaction / physics for the crown ---- */
let omega = 0.0;          // crown angular velocity (rad/frame-ish)
let targetOmega = 0.0;
let auto = false, autoDir = 1;
let dragging=false, lastAng=0, lastT=0;
let pointer={x:-1e3,y:-1e3, down:false};
let dirSign = 1;          // global direction toggle on click (no-drag)

function crownPos(){ return {x:crown.x, y:crown.y, r:pitchR(crown.N)*SCALE}; }

function evXY(e){
  const t = e.touches? e.touches[0]: e;
  const r = cv.getBoundingClientRect();
  return { x:t.clientX-r.left, y:t.clientY-r.top };
}
function angleTo(px,py){ const c=crownPos(); return Math.atan2(py-c.y, px-c.x); }

function onDown(e){
  const p = evXY(e); pointer.x=p.x; pointer.y=p.y; pointer.down=true;
  const c = crownPos();
  const d = Math.hypot(p.x-c.x, p.y-c.y);
  if(d < c.r*1.35){
    dragging=true; auto=false;
    lastAng = angleTo(p.x,p.y); lastT = performance.now();
  } else {
    // click outside: kick the machine in a direction (toggle)
    dirSign *= -1;
    omega += 0.10*dirSign;
  }
  fade();
  e.preventDefault();
}
function onMove(e){
  const p = evXY(e); pointer.x=p.x; pointer.y=p.y;
  if(!dragging) return;
  const a = angleTo(p.x,p.y);
  let dA = a-lastAng;
  while(dA> Math.PI) dA-=TAU; while(dA<-Math.PI) dA+=TAU;
  const now = performance.now();
  const dt = Math.max(8, now-lastT);
  crown.ang += dA;
  omega = dA * (16/dt);   // normalize to ~60fps
  lastAng = a; lastT = now;
  e.preventDefault();
}
function onUp(){ dragging=false; pointer.down=false; }

cv.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
cv.addEventListener('touchstart', onDown, {passive:false});
cv.addEventListener('touchmove', onMove, {passive:false});
window.addEventListener('touchend', onUp);
window.addEventListener('keydown', e=>{
  if(e.code==='Space'){ auto=!auto; if(auto) omega = 0.045*autoDir; fade(); e.preventDefault(); }
  if(e.code==='ArrowLeft'){ autoDir=-1; auto=true; }
  if(e.code==='ArrowRight'){ autoDir=1; auto=true; }
});

let tipEl=document.getElementById('tip'), faded=false;
function fade(){ if(!faded){ faded=true; tipEl.style.opacity='0'; } }
// auto-start gentle motion + auto-fade tip
setTimeout(()=>{ if(!faded) fade(); }, 6500);
auto = true; omega = 0.030; // it lives from first paint

/* ============================================================
   DRAWING
   ============================================================ */

/* draw one gear with involute-ish teeth, skeleton arms, hub, bevel */
function drawGear(g, t){
  const u = SCALE;
  const Rp = g.Rp*u;                 // pitch radius
  const N  = g.N;
  const add = MOD*0.62*u;            // addendum (tooth height out)
  const ded = MOD*0.78*u;            // dedendum (root depth in)
  const Ro = Rp+add, Ri = Rp-ded;
  const ang = g.ang;

  ctx.save();
  ctx.translate(g.x, g.y);
  ctx.rotate(ang);

  // palette
  let base, lite, dark, edge;
  switch(g.palette){
    case 'gold':  base='#caa14e'; lite='#f4dd9a'; dark='#6e4f1d'; edge='#3a2a0e'; break;
    case 'brass': base='#b08a3c'; lite='#e6c878'; dark='#5e451a'; edge='#34260d'; break;
    case 'copper':base='#a9622f'; lite='#e09a5e'; dark='#5a3015'; edge='#311708'; break;
    default:      base='#8d8a86'; lite='#d8d6d2'; dark='#3e3c39'; edge='#201f1d'; break; // steel
  }

  /* ---- drop shadow (cast slightly down-right, sells depth) ---- */
  ctx.save();
  ctx.translate(5*u, 7*u);
  ctx.beginPath();
  for(let i=0;i<N;i++){ toothPath(i,N,Ro,Rp,Ri, i===0); }
  ctx.closePath();
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=14*u;
  ctx.fill();
  ctx.restore();

  /* ---- tooth ring body ---- */
  ctx.beginPath();
  for(let i=0;i<N;i++){ toothPath(i,N,Ro,Rp,Ri, i===0); }
  ctx.closePath();
  // radial metallic gradient
  const grad = ctx.createRadialGradient(-Ro*0.3,-Ro*0.3, Ro*0.1, 0,0, Ro);
  grad.addColorStop(0, lite);
  grad.addColorStop(0.42, base);
  grad.addColorStop(0.80, dark);
  grad.addColorStop(1, edge);
  ctx.fillStyle=grad; ctx.fill();
  ctx.lineWidth=1.1*u; ctx.strokeStyle=edge; ctx.stroke();

  /* ---- specular sweep (rotating highlight) ---- */
  ctx.save();
  ctx.beginPath();
  for(let i=0;i<N;i++){ toothPath(i,N,Ro,Rp,Ri, i===0); }
  ctx.closePath(); ctx.clip();
  const sweepA = -ang + t*0.0; // highlight fixed in world -> shimmer as gear turns
  const sg = ctx.createLinearGradient(
    Math.cos(sweepA)*-Ro, Math.sin(sweepA)*-Ro,
    Math.cos(sweepA)*Ro,  Math.sin(sweepA)*Ro);
  sg.addColorStop(0,'rgba(255,255,255,0)');
  sg.addColorStop(0.48,'rgba(255,248,225,0.0)');
  sg.addColorStop(0.52,'rgba(255,250,235,0.30)');
  sg.addColorStop(0.56,'rgba(255,248,225,0.0)');
  sg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sg; ctx.fillRect(-Ro,-Ro,Ro*2,Ro*2);
  ctx.restore();

  /* ---- inner rim ring (defines wheel face) ---- */
  const rimR = Ri - MOD*0.9*u;
  ctx.beginPath(); ctx.arc(0,0, rimR, 0, TAU);
  ctx.lineWidth=2.2*u; ctx.strokeStyle=edge; ctx.stroke();
  // face fill darker
  ctx.beginPath(); ctx.arc(0,0, rimR-1*u, 0, TAU);
  const fg=ctx.createRadialGradient(-rimR*0.3,-rimR*0.3, rimR*0.1, 0,0, rimR);
  fg.addColorStop(0, base); fg.addColorStop(1, edge);
  ctx.fillStyle=fg; ctx.fill();

  /* ---- skeleton arms / spokes (lightening holes) ---- */
  const hubR = Math.max(MOD*1.3*u, Rp*g.hub);
  const arms = g.arms;
  // carve curved lightening cutouts between arms
  ctx.save();
  for(let k=0;k<arms;k++){
    const a0 = (k/arms)*TAU;
    const a1 = ((k+1)/arms)*TAU;
    const pad = (TAU/arms)*0.16;     // arm thickness
    const ia = a0+pad, ib = a1-pad;
    const r0 = hubR*1.18, r1 = rimR*0.92;
    ctx.beginPath();
    ctx.arc(0,0, r1, ia, ib);
    ctx.arc(0,0, r0, ib, ia, true);
    ctx.closePath();
    // cut: paint background-machine color to look hollow
    const hole = ctx.createRadialGradient(0,0,r0, 0,0,r1);
    hole.addColorStop(0,'rgba(8,7,6,0.92)');
    hole.addColorStop(1,'rgba(20,16,11,0.92)');
    ctx.fillStyle=hole; ctx.fill();
    ctx.lineWidth=1.4*u; ctx.strokeStyle=edge; ctx.stroke();
    // little inner highlight on the leading edge of each cut
    ctx.beginPath(); ctx.arc(0,0, r1, ia, ia+0.02);
    ctx.strokeStyle='rgba(255,240,200,0.18)'; ctx.lineWidth=1.6*u; ctx.stroke();
  }
  ctx.restore();

  /* ---- hub ---- */
  ctx.beginPath(); ctx.arc(0,0, hubR, 0, TAU);
  const hg=ctx.createRadialGradient(-hubR*0.35,-hubR*0.35, hubR*0.1, 0,0, hubR);
  hg.addColorStop(0, lite); hg.addColorStop(0.6, base); hg.addColorStop(1, dark);
  ctx.fillStyle=hg; ctx.fill();
  ctx.lineWidth=1.6*u; ctx.strokeStyle=edge; ctx.stroke();

  // hub bolts
  const bolts = Math.min(8, Math.max(4, Math.round(N/4)));
  for(let b=0;b<bolts;b++){
    const ba=(b/bolts)*TAU;
    const bx=Math.cos(ba)*hubR*0.66, by=Math.sin(ba)*hubR*0.66;
    ctx.beginPath(); ctx.arc(bx,by, hubR*0.10, 0, TAU);
    ctx.fillStyle=dark; ctx.fill();
    ctx.beginPath(); ctx.arc(bx-0.6,by-0.6, hubR*0.05, 0, TAU);
    ctx.fillStyle=lite; ctx.fill();
  }

  /* ---- bore / axle ---- */
  ctx.beginPath(); ctx.arc(0,0, hubR*0.34, 0, TAU);
  ctx.fillStyle='#0a0807'; ctx.fill();
  ctx.lineWidth=2*u; ctx.strokeStyle=edge; ctx.stroke();
  // axle shine
  ctx.beginPath(); ctx.arc(-1.5*u,-1.5*u, hubR*0.14, 0, TAU);
  ctx.fillStyle='rgba(255,240,210,0.20)'; ctx.fill();

  /* ---- crown decoration: engraved roman-ish ticks ---- */
  if(g.drive){
    ctx.save();
    ctx.strokeStyle='rgba(255,240,205,0.30)'; ctx.lineWidth=1.4*u;
    for(let m=0;m<12;m++){
      const ma=(m/12)*TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ma)*rimR*0.62, Math.sin(ma)*rimR*0.62);
      ctx.lineTo(Math.cos(ma)*rimR*0.80, Math.sin(ma)*rimR*0.80);
      ctx.stroke();
    }
    ctx.restore();
  }

  ctx.restore();
}

/* one tooth segment of the gear outline (trapezoidal involute approx).
   i: tooth index, N count, Ro outer, Rp pitch, Ri root */
function toothPath(i,N,Ro,Rp,Ri, first){
  const step = TAU/N;
  const a = i*step;
  // angular widths
  const topW = step*0.30;   // tooth tip width
  const botW = step*0.46;   // tooth base width
  const flank= step*0.50;   // half period
  // key angles
  const aL = a - botW;     // root left
  const bL = a - topW;     // tip left
  const bR = a + topW;     // tip right
  const aR = a + botW;     // root right
  const gR = a + flank;    // valley center (between teeth) - to next root
  const P = (ang,r)=>[Math.cos(ang)*r, Math.sin(ang)*r];
  let p;
  if(first){ p=P(aL,Ri); ctx.moveTo(p[0],p[1]); }
  else      { p=P(aL,Ri); ctx.lineTo(p[0],p[1]); }
  // up the left flank to tip (slight curve via mid point)
  p=P(bL,Ro); ctx.lineTo(p[0],p[1]);
  p=P(bR,Ro); ctx.lineTo(p[0],p[1]);
  p=P(aR,Ri); ctx.lineTo(p[0],p[1]);
  // valley arc to next tooth root start
  const nextL = (i+1)*step - botW;
  // approximate small arc along root circle
  const midV = (aR+nextL)/2;
  p=P(midV,Ri*0.998); ctx.lineTo(p[0],p[1]);
}

/* ---- connectors / linkage struts behind gears (the "plate") ---- */
function drawPlate(t){
  // soft brass mounting plate connecting gear centers (struts + jewels)
  ctx.save();
  ctx.lineCap='round';
  // draw struts between parent-child centers
  for(const g of GEARS){
    if(!g.parent) continue;
    const a=g.parent, b=g;
    ctx.beginPath();
    ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    ctx.strokeStyle='rgba(60,46,24,0.0)'; // hidden; struts drawn as plate posts below
  }
  // mounting posts (jewel bearings) at each center, drawn UNDER gears
  for(const g of GEARS){
    const r = Math.max(6*SCALE, g.Rp*g.hub*SCALE*0.5);
    const rg=ctx.createRadialGradient(g.x-r*0.3,g.y-r*0.3,r*0.1,g.x,g.y,r*1.5);
    rg.addColorStop(0,'rgba(40,30,16,0.0)');
    rg.addColorStop(1,'rgba(0,0,0,0.0)');
  }
  ctx.restore();
}

/* ---- glints at each mesh contact point (sells engaging teeth) ---- */
function drawMeshGlints(t){
  const u=SCALE;
  const spd = clamp(Math.abs(omega)*40, 0, 1);
  for(const g of GEARS){
    if(!g.parent) continue;
    const p=g.parent;
    // contact point lies on the line between centers at parent pitch radius
    const dx=g.x-p.x, dy=g.y-p.y, d=Math.hypot(dx,dy)||1;
    const ux=dx/d, uy=dy/d;
    const cxp = p.x + ux*p.Rp*u;
    const cyp = p.y + uy*p.Rp*u;
    const flick = 0.5+0.5*Math.sin(t*0.02 + g.x*0.05);
    const inten = (0.18 + 0.55*spd) * (0.5+0.5*flick);
    const rr = (5+7*spd)*u;
    const gg=ctx.createRadialGradient(cxp,cyp,0, cxp,cyp,rr);
    gg.addColorStop(0,'rgba(255,250,225,'+inten+')');
    gg.addColorStop(0.4,'rgba(255,225,160,'+(inten*0.5)+')');
    gg.addColorStop(1,'rgba(255,200,120,0)');
    ctx.beginPath(); ctx.arc(cxp,cyp,rr,0,TAU); ctx.fillStyle=gg; ctx.fill();
  }
}

/* ---- the pendulum + escapement bob ---- */
function drawPendulum(t){
  if(!pendulum||!escapeWheel) return;
  const u=SCALE;
  const px = pendulum.px, py = pendulum.py;
  const a = pendulum.ang;
  const len = pendulum.len;
  const ex = px + Math.sin(a)*len;
  const ey = py + Math.cos(a)*len;
  const r=22*u;

  // record trail of bob position for a faint arc
  pendulum.trail.push({x:ex,y:ey});
  if(pendulum.trail.length>16) pendulum.trail.shift();

  ctx.save();
  // arc trail (motion of the bob)
  for(let i=0;i<pendulum.trail.length;i++){
    const p=pendulum.trail[i];
    const f=i/pendulum.trail.length;
    ctx.beginPath(); ctx.arc(p.x,p.y, r*(0.5+0.5*f), 0, TAU);
    ctx.fillStyle='rgba(240,200,120,'+(0.04*f)+')'; ctx.fill();
  }

  // pivot bracket
  ctx.beginPath(); ctx.arc(px,py, 7*u, 0, TAU);
  const pg=ctx.createRadialGradient(px-2,py-2,1,px,py,8*u);
  pg.addColorStop(0,'#e6c878'); pg.addColorStop(1,'#3a2a10');
  ctx.fillStyle=pg; ctx.fill();
  ctx.lineWidth=1.4*u; ctx.strokeStyle='#241808'; ctx.stroke();

  // rod (tapered, with steel core)
  ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(ex,ey);
  ctx.lineCap='round';
  ctx.strokeStyle='#3a2c14'; ctx.lineWidth=5*u; ctx.stroke();
  ctx.strokeStyle='#8a6c34'; ctx.lineWidth=2.2*u; ctx.stroke();
  ctx.strokeStyle='rgba(255,240,205,0.35)'; ctx.lineWidth=0.8*u; ctx.stroke();

  // bob (brass disc) shadow
  ctx.beginPath(); ctx.arc(ex+3*u,ey+4*u,r,0,TAU);
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fill();
  // bob body
  const bg=ctx.createRadialGradient(ex-r*0.35,ey-r*0.35,r*0.1, ex,ey, r);
  bg.addColorStop(0,'#f6e0a0'); bg.addColorStop(0.45,'#c89a48'); bg.addColorStop(1,'#4f3a16');
  ctx.beginPath(); ctx.arc(ex,ey,r,0,TAU); ctx.fillStyle=bg; ctx.fill();
  ctx.lineWidth=2*u; ctx.strokeStyle='#2a1f0d'; ctx.stroke();
  // engraved rings
  ctx.beginPath(); ctx.arc(ex,ey,r*0.62,0,TAU);
  ctx.strokeStyle='rgba(40,30,12,0.55)'; ctx.lineWidth=1.4*u; ctx.stroke();
  ctx.beginPath(); ctx.arc(ex,ey,r*0.30,0,TAU);
  ctx.strokeStyle='rgba(40,30,12,0.55)'; ctx.lineWidth=1.2*u; ctx.stroke();
  // bob shine
  ctx.beginPath(); ctx.arc(ex-r*0.32,ey-r*0.34,r*0.20,0,TAU);
  ctx.fillStyle='rgba(255,248,220,0.6)'; ctx.fill();
  ctx.restore();
}

/* ---- floating dust motes in the light ---- */
const MOTES=[];
function initMotes(){ MOTES.length=0; const n= W<620?26:60;
  for(let i=0;i<n;i++) MOTES.push({x:Math.random()*W,y:Math.random()*H,
    z:0.3+Math.random()*0.7, s:0.5+Math.random()*1.6, ph:Math.random()*TAU}); }
function drawMotes(t){
  for(const m of MOTES){
    m.x += Math.sin(t*0.0003+m.ph)*0.25*m.z + 0.05;
    m.y += Math.cos(t*0.00024+m.ph)*0.18*m.z;
    if(m.x>W+5)m.x=-5; if(m.x<-5)m.x=W+5;
    if(m.y>H+5)m.y=-5; if(m.y<-5)m.y=H+5;
    const fl = 0.3+0.7*(0.5+0.5*Math.sin(t*0.002+m.ph));
    ctx.beginPath(); ctx.arc(m.x,m.y, m.s*m.z, 0, TAU);
    ctx.fillStyle='rgba(255,225,160,'+(0.06+0.10*fl*m.z)+')';
    ctx.fill();
  }
}

/* ---- background: warm vignette + faint blueprint grid ---- */
function drawBG(t){
  // base
  const g=ctx.createRadialGradient(CX-W*0.12,CY-H*0.18, 60, CX,CY, Math.max(W,H)*0.72);
  g.addColorStop(0,'#23190d');
  g.addColorStop(0.35,'#160f08');
  g.addColorStop(1,'#080605');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // faint engraved guide circles around the machine (engineering blueprint vibe)
  ctx.save();
  ctx.globalAlpha=0.10; ctx.strokeStyle='#c9a25a'; ctx.lineWidth=1;
  for(const gr of GEARS){
    if(gr.N<13) continue;
    ctx.beginPath(); ctx.arc(gr.x,gr.y, gr.Rp*SCALE, 0, TAU); ctx.stroke();
  }
  // center datum lines
  ctx.globalAlpha=0.05;
  ctx.beginPath(); ctx.moveTo(0,CY); ctx.lineTo(W,CY); ctx.stroke();
  ctx.restore();
}

/* ---- light flare from upper-left, sells the brass ---- */
function drawFlare(){
  const fg=ctx.createRadialGradient(W*0.30,H*0.18, 10, W*0.30,H*0.18, Math.max(W,H)*0.55);
  fg.addColorStop(0,'rgba(255,220,150,0.10)');
  fg.addColorStop(0.4,'rgba(255,200,120,0.03)');
  fg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=fg; ctx.fillRect(0,0,W,H);
}

/* ---- final vignette ---- */
function drawVignette(){
  const vg=ctx.createRadialGradient(CX,CY, Math.min(W,H)*0.30, CX,CY, Math.max(W,H)*0.74);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.62)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let prevT=0, fps=60;
function frame(t){
  const dt = Math.min(50, t-prevT||16); prevT=t;
  const k = dt/16.6667;  // normalize to 60fps

  // ---- crown physics ----
  if(!dragging){
    if(auto){
      targetOmega = 0.045*autoDir;
      omega = lerp(omega, targetOmega, 0.02*k);
    } else {
      omega *= Math.pow(0.985, k);     // friction
      if(Math.abs(omega)<0.0006) omega=0;
    }
    crown.ang += omega*k;
  } else {
    // omega already set by drag; keep it for release inertia
  }

  // propagate train (closed-form, exact mesh)
  for(const g of GEARS){
    if(!g.parent) continue;
    const p=g.parent;
    const ratio = p.N/g.N;
    g.ang = -ratio*p.ang + g._lockConst();
  }

  // escapement: pendulum driven by escape wheel speed (energy in)
  if(pendulum && escapeWheel){
    const drive = Math.abs(omega)*6.0; // energy proportional to machine speed
    // pendulum SHO with light damping + escapement impulse
    const g0=0.012*k;
    pendulum.vel += -g0*Math.sin(pendulum.ang);     // restoring
    pendulum.vel *= Math.pow(0.992, k);             // damping
    // impulse when crossing center, magnitude from drive
    if(Math.sign(pendulum.ang)!==Math.sign(pendulum.ang+pendulum.vel)){
      pendulum.vel += (Math.random()<0.5?1:-1)*0 ; // tick handled by amplitude
    }
    pendulum.vel += Math.sin(t*0.004)* (0.0006+drive*0.0008)*k * Math.sign(Math.cos(t*0.004)||1);
    pendulum.ang += pendulum.vel*k;
    pendulum.ang = clamp(pendulum.ang, -0.55, 0.55);
    if(Math.abs(pendulum.ang)<0.001 && Math.abs(pendulum.vel)<0.001 && Math.abs(omega)>0.002){
      pendulum.vel = 0.02; // re-kick if it died but machine runs
    }
  }

  // ---- render ----
  drawBG(t);
  drawFlare();
  drawMotes(t);
  drawPlate(t);
  drawPendulum(t);
  // draw gears: larger first so small ones sit on top at mesh
  const order=[...GEARS].sort((a,b)=>b.Rp-a.Rp);
  for(const g of order) drawGear(g,t);

  // mesh contact glints (screen blend = additive light)
  ctx.save(); ctx.globalCompositeOperation='screen';
  drawMeshGlints(t);
  ctx.restore();

  // crown grab affordance when hovered
  const c=crownPos();
  const hov = Math.hypot(pointer.x-c.x,pointer.y-c.y)<c.r*1.35;
  if(hov||dragging){
    ctx.save();
    ctx.beginPath(); ctx.arc(c.x,c.y, c.r*1.05, 0, TAU);
    ctx.strokeStyle='rgba(255,225,150,'+(dragging?0.5:0.22)+')';
    ctx.lineWidth=2; ctx.setLineDash([4,8]); ctx.stroke();
    ctx.restore();
  }

  drawVignette();

  // subtle film grain
  if((t|0)%2===0){
    ctx.save(); ctx.globalAlpha=0.025;
    for(let i=0;i<40;i++){
      ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.fillRect(Math.random()*W,Math.random()*H,1,1);
    }
    ctx.restore();
  }

  requestAnimationFrame(frame);
}

/* attach closed-form lock to each gear (computed once at build) */
function attachLocks(){
  for(const g of GEARS){
    if(!g.parent){ g._lockConst=()=>0; continue; }
    const p=g.parent;
    const ratio=p.N/g.N;
    // Lock so that along the mesh line a child tooth seats into a parent gap.
    // Parent presents either tooth or gap at angle (g._meshP) measured in
    // parent frame. Child must present the complementary feature toward
    // (g._meshC). Solve the static phase:
    //   childPhaseAtMesh = -ratio*parentPhaseAtMesh + lock
    // We want a tooth tip of child pointing along g._meshC when parent has
    // a gap at g._meshP. Tooth tips occur at integer*step. Choose lock:
    const stepC = TAU/g.N;
    const stepP = TAU/p.N;
    // align: bring child tip to g._meshC (so child tip points outward to parent)
    const want = g._meshC; // child local angle where a tip should be
    // child local tip angle currently (without lock) at parent.ang=0:
    // child.ang = -ratio*0 + lock -> a tip is at (k*stepC - lock)
    // set nearest tip to 'want' but offset by half step so it meshes into GAP
    const lock = want + stepC*0.5;
    g._lockConst=()=>lock;
  }
}

/* boot */
resize();
attachLocks();
// expose for self-verification
window.crown = crown; window.GEARS = GEARS;
initMotes();
requestAnimationFrame(frame);
window.addEventListener('resize', ()=>{ attachLocks(); initMotes(); }, {passive:true});
</script>
</body>
