<!DOCTYPE html>
<html lang="ko" data-state-phase="booting">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>buylow — 브랜드 × 글로벌 인플루언서 매칭</title>
<script src="https://cdn.tailwindcss.com"></script>

<script>

        },
      },
    },

<style>
  :root { color-scheme: light; }
  html, body { overflow-x: hidden; }
  body { font-family: 'Pretendard', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .gradient-text {
    background: linear-gradient(135deg, #7c3aed, #a78bfa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .glass { background: rgba(255,255,255,.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .glass-dark { background: rgba(255,255,255,.07); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  /* visible-state gating: elements only show when current phase is in their data-visible-state list (handled by JS toggling .vs-on) */
  [data-visible-state]:not(.vs-on) { display: none !important; }
  .route { animation: fadein .5s ease both; }
  .tap { transition: transform .15s ease, box-shadow .2s ease, background-color .2s ease; }
  .tap:active { transform: scale(.97); }
  .lift { transition: transform .2s ease, box-shadow .25s ease; }
  .lift:hover { transform: translateY(-4px); }
  .ping-dot { box-shadow: 0 0 0 0 rgba(124,58,237,.5); animation: ping 1.8s cubic-bezier(0,0,.2,1) infinite; }
  @keyframes ping { 75%,100% { box-shadow: 0 0 0 8px rgba(124,58,237,0); } }
  .typing span { display:inline-block; width:5px; height:5px; border-radius:9999px; background:#a78bfa; animation: bounce 1.2s infinite; }
  .typing span:nth-child(2){animation-delay:.15s} .typing span:nth-child(3){animation-delay:.3s}
  @keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:.5} 40%{transform:translateY(-4px);opacity:1} }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  /* desktop: center the phone-shell, show ambient backdrop */
  @media (min-width: 1024px) {
    body { background:
      radial-gradient(60% 50% at 20% 10%, rgba(124,58,237,.10), transparent 60%),
      radial-gradient(50% 50% at 90% 20%, rgba(99,102,241,.10), transparent 60%),

</head>
<body class="bg-slate-50 text-slate-900 antialiased">

<!-- ====================== BOOTING SPLASH ====================== -->
<div id="splash" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-gradient-to-b from-white to-brand-50 transition-opacity duration-500">
  <div class="flex items-center gap-3 mb-6">
    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-brand-600 to-indigo-600 flex items-center justify-center shadow-glow">
      <i data-lucide="sparkles" class="w-6 h-6 text-white"></i>
    </div>
    <span class="text-2xl font-extrabold tracking-tight">buy<span class="gradient-text">low</span></span>
  </div>
  <div class="flex gap-1.5 typing"><span></span><span></span><span></span></div>
  <p class="mt-5 text-sm text-slate-400" data-i18n="boot.loading">매칭 엔진을 준비하는 중…</p>
</div>

<!-- ====================== APP SHELL (phone) ====================== -->
<div id="app" class="relative mx-auto w-full max-w-[440px] min-h-screen bg-slate-50 lg:my-6 lg:min-h-0 lg:h-[860px] lg:rounded-[2.5rem] lg:shadow-2xl lg:ring-1 lg:ring-slate-200/70 lg:overflow-hidden flex flex-col">

  <!-- decorative violet blobs -->
  <div class="pointer-events-none absolute -top-16 -right-10 w-56 h-56 rounded-full bg-brand-200/40 blur-3xl"></div>
  <div class="pointer-events-none absolute top-72 -left-14 w-48 h-48 rounded-full bg-indigo-200/30 blur-3xl"></div>

  <!-- ===== Top bar (glass) ===== -->
  <header class="glass sticky top-0 z-40 border-b border-slate-100/80">
    <div class="flex items-center justify-between px-4 h-14">
      <button data-action="go-home" class="tap flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-brand-600 to-indigo-600 flex items-center justify-center shadow-glow">
          <i data-lucide="sparkles" class="w-4 h-4 text-white"></i>
        </div>
        <span class="text-lg font-extrabold tracking-tight">buy<span class="gradient-text">low</span></span>
      </button>
      <div class="flex items-center gap-2">
        <!-- role switcher -->
        <button data-action="cycle-role" class="tap flex items-center gap-1.5 rounded-full bg-brand-50 pl-2.5 pr-2 py-1 text-xs font-bold text-brand-700 ring-1 ring-brand-100">
          <i data-lucide="user-round-cog" class="w-3.5 h-3.5"></i>
          <span data-bind="role-label">브랜드</span>
        </button>
        <!-- language toggle -->
        <button data-action="toggle-language" class="tap flex items-center gap-1 rounded-full bg-slate-100 px-2.5 py-1 text-xs font-bold text-slate-600 ring-1 ring-slate-200">
          <i data-lucide="languages" class="w-3.5 h-3.5"></i>
          <span data-bind="lang-label">KO</span>
        </button>
        <!-- health/online dot -->
        <span class="relative flex items-center" title="online">
          <span class="ping-dot inline-block w-2 h-2 rounded-full bg-brand-500"></span>
        </span>
      </div>
    </div>
  </header>

  <!-- offline banner (state-driven) -->
  <div data-visible-state="offline" class="bg-amber-50 text-amber-700 text-xs font-semibold px-4 py-2 flex items-center gap-2 border-b border-amber-100">
    <i data-lucide="wifi-off" class="w-3.5 h-3.5"></i><span data-i18n="net.offline">오프라인 — 작업이 대기열에 보관됩니다</span>
  </div>

  <!-- ===== Routed content ===== -->
  <main id="view" class="relative flex-1 overflow-y-auto no-scrollbar pb-28"></main>

  <!-- ===== Bottom tab bar ===== -->
  <nav class="glass absolute bottom-0 inset-x-0 z-40 border-t border-slate-100/80 px-2 pb-[max(8px,env(safe-area-inset-bottom))] pt-1.5">
    <div class="flex items-stretch justify-around">
      <button data-action="nav" data-route="home"      class="tab tap flex flex-col items-center gap-0.5 flex-1 py-1.5 rounded-2xl"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px] font-bold" data-i18n="nav.home">홈</span></button>
      <button data-action="nav" data-route="directory" class="tab tap flex flex-col items-center gap-0.5 flex-1 py-1.5 rounded-2xl"><i data-lucide="compass" class="w-5 h-5"></i><span class="text-[10px] font-bold" data-i18n="nav.directory">디렉토리</span></button>

      <button data-action="nav" data-route="payment"   class="tab tap flex flex-col items-center gap-0.5 flex-1 py-1.5 rounded-2xl"><i data-lucide="wallet" class="w-5 h-5"></i><span class="text-[10px] font-bold" data-i18n="nav.payment">결제</span></button>

  </nav>
</div>

<!-- ====================== SOURCE / DETAIL SHEET (source_open) ====================== -->
<div id="sheet" data-visible-state="source_open" class="fixed inset-0 z-[90] flex items-end justify-center">
  <div data-action="close-source" class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm"></div>
  <div class="relative w-full max-w-[440px] glass rounded-t-[2rem] max-h-[82vh] overflow-y-auto no-scrollbar shadow-soft route">
    <div class="sticky top-0 glass flex items-center justify-between px-5 pt-4 pb-3 border-b border-slate-100">
      <h3 class="text-base font-extrabold" data-bind="sheet-title">상세</h3>
      <button data-action="close-source" class="tap w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center"><i data-lucide="x" class="w-4 h-4 text-slate-500"></i></button>
    </div>
    <div id="sheet-body" class="px-5 py-4"></div>
  </div>
</div>

<!-- ====================== TOAST ====================== -->
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-28 z-[95] hidden">
  <div class="glass flex items-center gap-2 rounded-full pl-3 pr-4 py-2 shadow-soft ring-1 ring-slate-200 text-sm font-semibold text-slate-700">
    <span class="w-2 h-2 rounded-full bg-brand-500"></span><span id="toast-msg"></span>
  </div>
</div>

        </button>

    <!-- open offers -->
    <section class="px-4 pt-6">
      <h2 class="text-base font-extrabold mb-3">${esc(t('m.offers'))}</h2>

          <div class="rounded-3xl bg-white shadow-card ring-1 ring-slate-100 p-4 flex items-center gap-3">

              <div class="mt-1.5 flex items-center gap-1.5">${pill('#'+o.id.slice(-4),'bg-slate-100 text-slate-500')}${pill(o.status,'bg-amber-50 text-amber-600')}</div></div>
            <div class="text-right shrink-0"><p class="font-extrabold gradient-text">$${o.amount.toLocaleString()}</p>

          </div>`).join('') : `<div class="rounded-3xl bg-white ring-1 ring-slate-100 p-6 text-center text-sm text-slate-400">${esc(t('m.noffers'))}</div>`}

    <!-- escrow progress -->

          <button data-action="open-payment" data-id="${p.id}" class="tap lift w-full text-left rounded-3xl bg-white shadow-card ring-1 ring-slate-100 p-4">

  /* ---------- FORECAST ---------- */
  function viewForecast() {
    const f = state.forecast;
    const camp = CAMPAIGNS.find(c=>c.id===f.campaignId) || CAMPAIGNS[0];
    let body = '';
    if (f.phase === 'idle' && !f.result) {
      body = `<div class="rounded-3xl bg-white shadow-card ring-1 ring-slate-100 p-8 text-center">
        <div class="mx-auto w-14 h-14 rounded-2xl bg-brand-100 text-brand-600 flex items-center justify-center"><i data-lucide="line-chart" class="w-7 h-7"></i></div>
        <p class="mt-3 text-sm text-slate-400">${esc(t('f.empty'))}</p></div>`;
    } else if (f.phase === 'queued' || f.phase === 'running') {
      const label = f.phase === 'queued' ? t('f.queued') : t('f.simulating');
      const pct = f.phase === 'queued' ? 8 : Math.min(92, 20 + f.elapsed * 16);
      body = `<div class="rounded-3xl bg-white shadow-card ring-1 ring-slate-100 p-6">
        <div class="flex items-center gap-2 text-sm font-bold text-brand-700"><span class="inline-flex gap-1 typing"><span></span><span></span><span></span></span>${esc(label)}</div>
        <div class="mt-4 h-2 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full bg-gradient-to-r from-brand-600 to-indigo-500 transition-all duration-500" style="width:${pct}%"></div></div>
        <p class="mt-3 text-xs text-slate-400">${esc(camp.title)} · ${esc(camp.platforms.join(', '))}</p>
        <button data-action="cancel-forecast" class="tap mt-4 w-full rounded-2xl bg-slate-100 text-slate-600 text-sm font-bold py-2.5">${esc(t('f.cancel'))}</button>
      </div>`;
    } else if (f.phase === 'failed') {
      body = `<div class="rounded-3xl bg-rose-50 ring-1 ring-rose-100 p-6 text-center">
        <i data-lucide="alert-triangle" class="w-7 h-7 text-rose-500 mx-auto"></i>
        <p class="mt-2 text-sm font-semibold text-rose-600">${esc(t('f.failed'))}</p>
        <button data-action="run-forecast" class="tap mt-4 rounded-2xl bg-rose-600 text-white text-sm font-bold px-6 py-2.5">${esc(t('f.retry'))}</button></div>`;
    } else if (f.phase === 'completed' && f.result) {
      const r = f.result;
      body = `
      <div class="rounded-3xl bg-gradient-to-br from-brand-600 to-indigo-600 text-white p-5 shadow-glow">
        <div class="flex items-center justify-between"><p class="text-sm font-bold text-white/80">${esc(t('f.result.title'))}</p>${pill(t('f.conf')+' '+r.conf+'%','bg-white/20 text-white')}</div>
        <p class="mt-1 text-lg font-extrabold">${esc(camp.title)}</p>
        <div class="mt-4 grid grid-cols-2 gap-3">
          ${fMetric(t('f.reach'), r.reach, 'eye')}
          ${fMetric(t('f.eng'), r.eng, 'heart')}
          ${fMetric(t('f.conv'), r.conv, 'shopping-bag')}
          ${fMetric(t('f.roi'), r.roi, 'trending-up')}
        </div>
      </div>
      <div class="mt-3 rounded-3xl bg-white shadow-card ring-1 ring-slate-100 p-5">
        <p class="text-sm font-extrabold mb-3">${esc(t('f.breakdown'))}</p>
        ${r.platforms.map((p)=>`<div class="mb-3 last:mb-0"><div class="flex items-center justify-between text-xs mb-1"><span class="font-bold text-slate-600">${esc(p.name)}</span><span class="text-slate-400">${esc(p.val)}</span></div>
          <div class="h-2 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full bg-gradient-to-r from-brand-500 to-indigo-400" style="width:${p.pct}%"></div></div></div>`).join('')}
        <p class="mt-2 text-[11px] text-slate-400">${esc(t('f.note'))}</p>
      </div>
      <button data-action="run-forecast" class="tap mt-3 w-full rounded-2xl bg-slate-100 text-slate-600 text-sm font-bold py-3 flex items-center justify-center gap-2"><i data-lucide="refresh-cw" class="w-4 h-4"></i>${esc(t('f.again'))}</button>`;
    }
    const running = f.phase==='queued' || f.phase==='running';
    return `
    <section class="px-4 pt-5">
      <div class="rounded-[2rem] bg-white shadow-soft ring-1 ring-slate-100 p-5">
        <p class="text-[11px] font-bold uppercase tracking-wider text-brand-600">${esc(t('f.eyebrow'))}</p>
        <h1 class="mt-1 text-2xl font-extrabold tracking-tight">${esc(t('f.title'))}</h1>
        <p class="mt-2 text-sm text-slate-500 leading-relaxed">${esc(t('f.body'))}</p>
        <label class="block mt-4 text-xs font-bold text-slate-500">${esc(t('f.pick'))}</label>
        <div class="mt-1.5 flex gap-2 overflow-x-auto no-scrollbar -mx-1 px-1 pb-1">
          ${CAMPAIGNS.map((c)=>`<button data-action="pick-forecast" data-id="${c.id}" ${running?'disabled':''} class="tap shrink-0 rounded-2xl px-3.5 py-2 text-xs font-bold ring-1 ${f.campaignId===c.id?'bg-brand-600 text-white ring-brand-600 shadow-glow':'bg-slate-50 text-slate-600 ring-slate-200'} ${running?'opacity-50':''}">${esc(c.title)}</button>`).join('')}
        </div>
        <button data-action="run-forecast" ${running?'disabled':''} class="tap mt-4 w-full rounded-2xl ${running?'bg-slate-200 text-slate-400':'bg-gradient-to-r from-brand-600 to-indigo-600 text-white shadow-glow'} text-sm font-bold py-3 flex items-center justify-center gap-2">
          <i data-lucide="${running?'loader':'play'}" class="w-4 h-4 ${running?'animate-spin':''}"></i>${esc(running ? t('f.running') : t('f.run'))}</button>
      </div>
    </section>
    <section class="px-4 pt-5">${body}</section>
    <div class="h-4"></div>`;
  }
  function fMetric(l,v,icon){ return `<div class="glass-dark rounded-2xl p-3"><div class="flex items-center gap-1.5 text-white/70 text-[11px] font-semibold"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${esc(l)}</div><p class="mt-1 text-xl font-extrabold">${esc(v)}</p></div>`; }

  /* ---------- CHAT ---------- */
  function viewChat() {

    return `

  function bubble(m, translated) {

    return `<div class="flex ${mine?'justify-end':'justify-start'}">

          ${sub && !mine ? `<p class="mt-1.5 pt-1.5 border-t border-slate-100 text-xs text-slate-400 leading-relaxed break-words">${esc(sub)}</p>` : ''}

      const p = profileById(sw.id); if (!p) { state.sourceWindow=null; return; }

        <div class="flex items-center gap-3">
          <img src="${p.avatar}" class="w-16 h-16 rounded-2xl object-cover"/>

        </div>
        ${isPay ? `<div class="mt-4"><p class="text-xs font-bold text-slate-500 mb-2">${esc(t('p.milestones'))}</p>${item.milestones.map(m=>`<div class="flex items-center gap-2 py-1.5"><span class="w-5 h-5 rounded-full ${m.done?'bg-brand-600 text-white':'bg-slate-100 text-slate-300'} flex items-center justify-center"><i data-lucide="${m.done?'check':'circle'}" class="w-3 h-3"></i></span><span class="text-sm ${m.done?'font-bold':'text-slate-400'}">${esc(m.l)}</span></div>`).join('')}</div>`
        : `<div class="mt-4"><p class="text-xs font-bold text-slate-500 mb-2">${state.language==='en'?'Recent messages':'최근 메시지'}</p>${item.messages.slice(-2).map(m=>`<p class="text-sm text-slate-600 py-1 truncate">${esc(m.text)}</p>`).join('')}</div>
        <button data-action="open-chat" data-id="${item.id}" class="tap mt-4 w-full rounded-2xl bg-gradient-to-r from-brand-600 to-indigo-600 text-white text-sm font-bold py-3 shadow-glow">${esc(t('c.viewdeal'))}</button>`}`;
    }
    $('[data-bind="sheet-title"]').textContent = title;
    $('#sheet-body').innerHTML = body;
    if (window.lucide) window.lucide.createIcons();
    applyVisibleStates();
  }
  function convForProfile(pid){ const c = state.conversations.find(c=>c.cpId===pid); return c ? c.id : state.conversations[0].id; }

  /* ============================================================================
     COMMANDS / REDUCER / EFFECTS
  ============================================================================ */
  function dispatch(cmd, payload) {
    payload = payload || {};
    switch (cmd) {
      case 'BOOT': state.phase = 'idle'; break;
      case 'NAV': state.route = payload.route; if (state.route!=='chat') state.chat.phase = state.chat.phase==='idle'?'idle':state.chat.phase; break;
      case 'CHANGE_LANGUAGE': state.language = state.language==='ko'?'en':'ko'; toast(t('common.toast.lang')+' '+state.language.toUpperCase()); break;
      case 'CYCLE_ROLE': {
        const order=['brand','creator','admin']; state.role = order[(order.indexOf(state.role)+1)%order.length];
        toast(t('common.toast.role')+' '+t('role.'+state.role)); break;
      }
      case 'OPEN_SOURCE': state.sourceWindow = payload; break;
      case 'CLOSE_SOURCE': state.sourceWindow = null; break;
      case 'DIR_FILTER': state.dir.filter = payload.filter; break;
      case 'DIR_SEARCH': state.dir.search = payload.value; break;
      case 'SET_TARGET': state.offerForm.target = payload.id; toast((profileById(payload.id)||{}).name+' '+(state.language==='en'?'selected':'선택됨')); break;
      case 'SELECT_CHAT': {
        state.chat.activeId = payload.id;
        const c = state.conversations.find(x=>x.id===payload.id); if (c) c.unread = 0;
        break;
      }
      case 'PICK_FORECAST': state.forecast.campaignId = payload.id; if(state.forecast.phase==='completed'){state.forecast.phase='idle';state.forecast.result=null;} break;
      default: break;
    }
  }

  /* ---- offer submit (submitting -> idle) ---- */
  function submitOffer() {
    if (state.phase === 'submitting') return; // idempotency: already active
    const target = profileById(state.offerForm.target);
    if (!target) { toast(state.language==='en'?'Pick a partner':'대상을 선택하세요'); return; }
    const amount = Number(state.offerForm.amount)||0;
    state.phase = 'submitting'; renderChrome();
    setTimeout(() => {
      const convId = 'cv_'+uid();
      const conv = { id:convId, counterpart:target.name, cpId:target.id, avatar:target.avatar, role:target.role, offer:amount, status:'offer', unread:0, translated:true,
        messages:[{ id:uid(), from:'me', text:state.offerForm.msg, tr:state.offerForm.msg, trEn:state.offerForm.msg, ts:nowTime(), offer:amount }] };
      state.conversations.unshift(conv);
      state.offers.unshift({ id:'of_'+uid().slice(-4), counterpart:target.name, cpId:target.id, amount, status:'sent', conv:convId, message:state.offerForm.msg });
      state.phase = 'idle';
      state.chat.activeId = convId;
      state.route = 'chat';
      render();
      toast((state.language==='en'?'Offer sent to ':'오퍼 전송: ')+target.name);
    }, 900);
  }

  /* ---- chat message submit -> job(queued->running->completed) ---- */
  function submitMessage(text) {
    const conv = state.conversations.find(c=>c.id===state.chat.activeId);
    if (!conv || !text.trim()) return;
    // INVARIANT: ignore submit while a job is active for this chat (idempotency)
    if (state.chat.phase==='queued' || state.chat.phase==='running' || state.phase==='submitting') return;
    const clientActionId = uid();
    state.chat.clientActionId = clientActionId;
    state.chat.jobId = 'job_'+uid();
    // 1 user message
    conv.messages.push({ id:uid(), from:'me', text:text.trim(), tr:text.trim(), trEn:text.trim(), ts:nowTime() });
    state.phase = 'queued'; state.chat.phase = 'queued';
    render(); scrollMessages();
    const jobId = state.chat.jobId;
    setTimeout(() => {
      if (state.chat.jobId !== jobId) return; // cancelled/replaced
      state.phase='running'; state.chat.phase='running'; renderChrome(); render(); scrollMessages();
      runReplyJob(conv, jobId);
    }, 500);
  }
  function runReplyJob(conv, jobId) {
    setTimeout(() => {
      if (state.chat.jobId !== jobId) return; // CANCEL guard: don't append to cancelled job
      const reply = pickReply(conv);
      conv.messages.push(reply);
      conv.offer = reply.offer || conv.offer;
      state.phase='completed'; state.chat.phase='completed';
      render(); scrollMessages();
      setTimeout(()=>{ if(state.chat.phase==='completed'){ state.phase='idle'; state.chat.phase='idle'; renderChrome(); } }, 400);
    }, 1300);
  }
  function pickReply(conv) {
    const replies = state.language==='en'
      ? ['Sounds good — let me check the schedule and confirm.', 'Could we lock bilingual captions into the deliverables?', 'Happy to proceed. Please open the escrow.']
      : ['좋아요, 일정 확인하고 바로 회신드릴게요.', '이중언어 자막을 납품물에 포함해도 될까요?', '진행 좋습니다. 에스크로 열어주세요.'];
    const bump = Math.random()>0.5 ? Math.round(conv.offer*1.1/50)*50 : null;
    return { id:uid(), from:'them', text:replies[Math.floor(Math.random()*replies.length)], tr:'…', trEn:'…', ts:nowTime(), offer: bump };
  }
  function cancelChatJob() {
    if (state.chat.phase==='queued' || state.chat.phase==='running') {
      state.phase='cancelling'; renderChrome();
      const conv = state.conversations.find(c=>c.id===state.chat.activeId);
      state.chat.jobId = null; // invalidate -> result job won't append
      state.chat.phase='cancelled'; state.phase='cancelled';
      render();
      setTimeout(()=>{ state.phase='idle'; state.chat.phase='idle'; renderChrome(); }, 300);
      toast(state.language==='en'?'Cancelled':'취소됨');
    }
  }

  /* ---- forecast job ---- */
  function runForecast() {
    const f = state.forecast;
    if (f.phase==='queued'||f.phase==='running') return;
    f.phase='queued'; f.result=null; f.elapsed=0; f.jobId='fc_'+uid();
    state.phase='queued'; render();
    const jobId = f.jobId;
    setTimeout(()=>{
      if (f.jobId!==jobId) return;
      f.phase='running'; state.phase='running'; render();
      const tick = setInterval(()=>{
        if (f.jobId!==jobId){ clearInterval(tick); return; }
        f.elapsed++; render();
        if (f.elapsed>=4){
          clearInterval(tick);
          // small chance of failure to exercise failed state
          if (Math.random()<0.12){ f.phase='failed'; state.phase='failed'; render(); return; }
          f.result = buildForecast(); f.phase='completed'; state.phase='completed'; render();
          setTimeout(()=>{ if(state.phase==='completed'){state.phase='idle';renderChrome();} },300);
        }
      }, 600);
    }, 600);
  }
  function cancelForecast() {
    const f=state.forecast;
    if (f.phase==='queued'||f.phase==='running'){ f.jobId=null; f.phase='idle'; state.phase='idle'; render(); toast(state.language==='en'?'Forecast cancelled':'예측 취소됨'); }
  }
  function buildForecast() {
    const camp = CAMPAIGNS.find(c=>c.id===state.forecast.campaignId)||CAMPAIGNS[0];
    const base = (camp.bmin+camp.bmax)/2;
    const reach = Math.round(base*420/1000);
    const r = {
      conf: 70+Math.floor(Math.random()*22),
      reach: (reach/1000).toFixed(1)+'M',
      eng: (4+Math.random()*4).toFixed(1)+'%',
      conv: (reach*0.018).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',')+'',
      roi: (2.4+Math.random()*2.3).toFixed(1)+'x',
      platforms: camp.platforms.map((p,i)=>({ name:p, val:((reach*(0.6-i*0.18))/1000).toFixed(1)+'M', pct: 90-i*28 })),
    };
    return r;
  }

  /* ---- create / payment mock mutations ---- */
  function createCampaign() {
    const title = ($('#cr-title')||{}).value || '';
    if (!title.trim()) { toast(state.language==='en'?'Title required':'제목을 입력하세요'); return; }
    const c = { id:'c_'+uid(), title:title.trim(), regions:(($('#cr-region')||{}).value||'').split(',').map(s=>s.trim()).filter(Boolean)||['—'], platforms:(($('#cr-plat')||{}).value||'').split(',').map(s=>s.trim()).filter(Boolean)||['—'], bmin:Number(($('#cr-bmin')||{}).value)||1000, bmax:Number(($('#cr-bmax')||{}).value)||2000, applicants:0, status:'open', brand:state.role==='brand'?'My Brand':'GLOWON' };
    CAMPAIGNS.unshift(c);
    toast(t('cr.created')); render();
  }
  function applyCampaign(id){ const c=CAMPAIGNS.find(x=>x.id===id); if(c) c.applicants++; toast(t('cr.applied')); render(); }
  function wmGenerate() {
    const txt = ($('#cr-wm')||{}).value || 'BUYLOW PREVIEW';
    const mode = state._wmMode==='image'?'image':'text';
    const box = $('#wm-preview');
    if (!box) return;
    if (mode==='image') {
      box.innerHTML = `<div class="relative rounded-2xl overflow-hidden ring-1 ring-slate-200 aspect-[16/9] bg-gradient-to-br from-slate-900 to-brand-700 flex items-center justify-center">
        <p class="text-white/90 font-extrabold text-sm">Dubai Skincare Debut</p>
        <div class="absolute inset-0 flex items-center justify-center"><p class="text-white/15 text-3xl font-extrabold rotate-[-18deg] tracking-widest">${esc(txt)}</p></div></div>`;
    } else {
      box.innerHTML = `<div class="rounded-2xl ring-1 ring-slate-200 bg-slate-50 p-4 relative overflow-hidden"><p class="text-sm text-slate-600 leading-relaxed">Launch preview notes for creator review only. 두바이 데뷔 캠페인의 컨셉 브리프입니다.</p>
        <p class="absolute inset-0 flex items-center justify-center text-slate-900/5 text-2xl font-extrabold rotate-[-15deg]">${esc(txt)}</p></div>`;
    }
    toast(state.language==='en'?'Preview rendered':'미리보기 생성됨');
  }
  function createEscrow() {
    const payee = profileById(state._payee) || CREATORS[0];
    const amt = Number(($('#es-amt')||{}).value)||1200;
    const cur = ($('#es-cur')||{}).value || 'USD';
    state.payments.unshift({ id:'pay_'+uid().slice(-3), payee:payee.name, cpId:payee.id, amount:amt, currency:cur, status:'funded', milestones:[{l:'착수금',done:true},{l:'1차 납품',done:false},{l:'최종',done:false}] });
    toast(state.language==='en'?'Escrow created':'에스크로 생성됨'); render();
  }
  function releasePayment(id){ const p=state.payments.find(x=>x.id===id); if(p){ p.status='released'; p.milestones.forEach(m=>m.done=true);} toast(state.language==='en'?'Funds released':'지급 승인됨'); render(); }
  function disputePayment(id){ const p=state.payments.find(x=>x.id===id); if(p) p.status='disputed'; toast(state.language==='en'?'Dispute opened':'분쟁 제기됨'); render(); }
  function verify(id,r){ const v=VERIFICATIONS.find(x=>x.id===id); if(v) v.status=r; toast((r==='approve'?(state.language==='en'?'Approved ':'승인 '):(state.language==='en'?'Rejected ':'반려 '))+v.name); render(); }

  function nowTime(){ const d=new Date(); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
  function scrollMessages(){ const s=$('#msg-scroll'); if(s) s.scrollTop = s.scrollHeight; }

  /* ============================================================================
     DELEGATED EVENT LISTENER (registered once)
  ============================================================================ */
  function onAction(el, action) {
    const id = el.getAttribute('data-id');
    switch (action) {
      case 'go-home': dispatch('NAV',{route:'home'}); render(); break;
      case 'nav': dispatch('NAV',{route:el.getAttribute('data-route')}); render(); if(el.getAttribute('data-route')==='chat') setTimeout(scrollMessages,50); break;
      case 'toggle-language': dispatch('CHANGE_LANGUAGE'); render(); break;
      case 'cycle-role': dispatch('CYCLE_ROLE'); render(); break;
      case 'open-profile': dispatch('OPEN_SOURCE',{type:'profile',id}); renderSheet(); applyVisibleStates(); break;
      case 'open-campaign': dispatch('OPEN_SOURCE',{type:'campaign',id}); renderSheet(); applyVisibleStates(); break;
      case 'open-deal': dispatch('OPEN_SOURCE',{type:'deal',id}); renderSheet(); applyVisibleStates(); break;
      case 'open-payment': dispatch('OPEN_SOURCE',{type:'payment',id}); renderSheet(); applyVisibleStates(); break;
      case 'close-source': dispatch('CLOSE_SOURCE'); applyVisibleStates(); break;
      case 'dir-filter': dispatch('DIR_FILTER',{filter:el.getAttribute('data-filter')}); render(); break;
      case 'set-target': dispatch('SET_TARGET',{id}); render(); break;
      case 'offer-to': dispatch('CLOSE_SOURCE'); dispatch('SET_TARGET',{id}); dispatch('NAV',{route:'matches'}); render(); break;
      case 'send-offer': submitOffer(); break;
      case 'pick-forecast': dispatch('PICK_FORECAST',{id}); render(); break;
      case 'forecast-campaign': dispatch('CLOSE_SOURCE'); dispatch('PICK_FORECAST',{id}); dispatch('NAV',{route:'forecast'}); render(); runForecast(); break;
      case 'run-forecast': runForecast(); break;
      case 'cancel-forecast': cancelForecast(); break;
      case 'select-chat': dispatch('SELECT_CHAT',{id}); render(); setTimeout(scrollMessages,50); break;
      case 'open-chat': dispatch('CLOSE_SOURCE'); dispatch('SELECT_CHAT',{id}); dispatch('NAV',{route:'chat'}); render(); setTimeout(scrollMessages,50); break;
      case 'quick-reply': { const inp=$('#chat-input'); if(inp){ inp.value=el.getAttribute('data-text'); inp.focus(); } break; }
      case 'send-message': { const inp=$('#chat-input'); if(inp){ const v=inp.value; inp.value=''; submitMessage(v); } break; }
      case 'cancel-job': cancelChatJob(); break;
      case 'attach': toast(state.language==='en'?'Brief attached (mock)':'브리프 첨부됨(목)'); break;
      case 'create-campaign': createCampaign(); break;
      case 'apply-campaign': applyCampaign(id); break;
      case 'wm-mode': state._wmMode = el.getAttribute('data-mode'); render(); break;
      case 'wm-generate': wmGenerate(); break;
      case 'set-payee': state._payee = id; render(); break;
      case 'create-escrow': createEscrow(); break;
      case 'release-payment': releasePayment(id); break;
      case 'dispute-payment': disputePayment(id); break;
      case 'verify': verify(id, el.getAttribute('data-r')); break;
      case 'add-card': toast(state.language==='en'?'Add card (mock)':'카드 추가(목)'); break;
      default: break;
    }
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.getAttribute('data-action');
    // ignore pure input actions on click
    if (['dir-search','set-offer-amount','set-offer-msg','chat-input'].includes(action)) return;
    e.preventDefault();
    onAction(el, action);
  });
  // input events (delegated)
  document.addEventListener('input', (e) => {
    const el = e.target.closest('[data-action]'); if (!el) return;
    const action = el.getAttribute('data-action');
    if (action==='dir-search') { state.dir.search = el.value; render(); const s=$('input[data-action="dir-search"]'); if(s){s.focus(); s.setSelectionRange(s.value.length,s.value.length);} }
    else if (action==='set-offer-amount') state.offerForm.amount = el.value;
    else if (action==='set-offer-msg') state.offerForm.msg = el.value;
    else if (action==='chat-input') { state.chat.draft = el.value; if(state.chat.phase==='idle' && el.value){ /* composing */ } }
  });
  // chat input: enter to send, auto-grow
  document.addEventListener('keydown', (e) => {
    const el = e.target.closest('#chat-input'); if (!el) return;
    if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); const v=el.value; el.value=''; submitMessage(v); }
  });
  document.addEventListener('input', (e)=>{ const el=e.target.closest('#chat-input'); if(!el) return; el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,96)+'px'; });

  /* ----------------------------- boot ----------------------------- */
  function boot() {
    if (window.lucide) window.lucide.createIcons();
    render(); // initial render under booting
    setTimeout(() => {
      dispatch('BOOT'); // booting -> idle
      const sp = $('#splash'); sp.style.opacity='0'; setTimeout(()=>sp.style.display='none', 500);
      render();
    }, 850);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
