<!DOCTYPE html>
<html lang="ko" data-state="booting">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Buylow — 한국 브랜드 × 글로벌 인플루언서</title>
<meta name="description" content="Buylow: 한국 브랜드와 글로벌 인플루언서를 잇는 매칭·에스크로 플랫폼" />

<!-- Pretendard -->

<!-- Tailwind (Re:Connect 가족 토큰) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'] },
        colors: {
          brand: {
            50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd',
            400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9',
            800: '#5b21b6', 900: '#4c1d95',
          },
        },
        boxShadow: {
          soft: '0 10px 40px -10px rgba(15,23,42,.10)',
          card: '0 4px 20px -2px rgba(15,23,42,.06)',
          glow: '0 18px 50px -12px rgba(124,58,237,.45)',
        },
        keyframes: {
          fadeIn: { '0%': { opacity: 0, transform: 'translateY(10px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
          float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
          ping2: { '75%,100%': { transform: 'scale(2)', opacity: 0 } },
          shimmer: { '100%': { transform: 'translateX(100%)' } },
        },
        animation: {
          fadeIn: 'fadeIn .5s ease both',
          float: 'float 6s ease-in-out infinite',
          ping2: 'ping2 1.6s cubic-bezier(0,0,.2,1) infinite',
        },
      },
    },
  };
</script>
<!-- Lucide -->
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  html, body { background: #f8fafc; max-width: 100%; overflow-x: clip; }
  body { color: #0f172a; -webkit-font-smoothing: antialiased; overflow-x: clip; }
  main { overflow-x: clip; }
  .gradient-text {
    background: linear-gradient(135deg, #7c3aed, #a78bfa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .glass-nav { background: rgba(255,255,255,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .blob { position: absolute; border-radius: 9999px; filter: blur(64px); pointer-events: none; z-index: 0; }
  .skel { position: relative; overflow: hidden; background: #eef2f7; }
  .skel::after { content:''; position:absolute; inset:0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent); animation: shimmer 1.4s infinite; }
  @keyframes shimmer { 100% { transform: translateX(100%); } }
  /* visible-state helper: shown only when html[data-state] matches a token in data-visible-state */
  [data-visible-state] { display: none; }
  [data-action] { cursor: pointer; }
  ::selection { background: #ddd6fe; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
  .route { display: none; }
  .route.active { display: block; animation: fadeIn .45s ease both; }
</style>
</head>
<body class="font-sans antialiased text-slate-900 min-h-screen flex flex-col">

<!-- ====================== TOP GLASS NAV ====================== -->
<header class="glass-nav fixed top-0 inset-x-0 z-40 border-b border-slate-200/70">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-3">
    <a data-action="navigate" data-route="home" class="flex items-center gap-2 shrink-0 group">
      <span class="relative grid place-items-center w-9 h-9 rounded-2xl bg-gradient-to-br from-brand-600 to-indigo-600 shadow-glow">
        <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
        <span class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5">
          <span class="absolute inset-0 rounded-full bg-emerald-400 animate-ping2"></span>
          <span class="relative block w-2.5 h-2.5 rounded-full bg-emerald-500 ring-2 ring-white"></span>
        </span>
      </span>
      <span class="text-xl font-extrabold tracking-tight">
        <span class="text-slate-900">Buy</span><span class="gradient-text">low</span>
      </span>
    </a>

    <!-- desktop nav -->
    <nav class="hidden lg:flex items-center gap-1 ml-4" data-nav="primary"></nav>

    <div class="ml-auto flex items-center gap-2">
      <!-- role switcher -->
      <div class="hidden md:flex items-center gap-1 p-1 rounded-full bg-slate-100/80 border border-slate-200" data-nav="roles"></div>
      <!-- language toggle -->
      <button data-action="toggle-language" class="hidden sm:inline-flex items-center gap-1.5 h-9 px-3 rounded-full text-sm font-semibold text-slate-600 hover:text-brand-700 hover:bg-brand-50 transition">
        <i data-lucide="languages" class="w-4 h-4"></i>
        <span data-bind="lang-label">KO</span>
      </button>
      <!-- network status -->
      <button data-action="toggle-network" title="network" class="relative inline-flex items-center justify-center w-9 h-9 rounded-full text-slate-500 hover:bg-slate-100 transition">
        <i data-lucide="wifi" class="w-5 h-5" data-bind="network-icon"></i>
      </button>
      <!-- notifications -->
      <button class="relative hidden sm:inline-flex items-center justify-center w-9 h-9 rounded-full text-slate-500 hover:bg-slate-100 transition">
        <i data-lucide="bell" class="w-5 h-5"></i>
        <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-brand-600"></span>
      </button>
      <!-- primary CTA -->
      <button data-action="navigate" data-route="create" class="hidden sm:inline-flex items-center gap-1.5 h-10 px-4 rounded-full text-sm font-bold text-white bg-gradient-to-r from-brand-600 to-indigo-600 shadow-lg shadow-brand-500/30 hover:-translate-y-0.5 transition">
        <i data-lucide="rocket" class="w-4 h-4"></i><span data-i18n="nav.cta"></span>
      </button>
      <!-- mobile hamburger -->
      <button data-action="open-menu" class="lg:hidden inline-flex items-center justify-center w-10 h-10 rounded-xl text-slate-700 hover:bg-slate-100 transition">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>
    </div>
  </div>
</header>

<!-- mobile menu overlay -->
<div data-bind="menu-overlay" class="fixed inset-0 z-50 hidden">
  <div data-action="close-menu" class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm"></div>
  <div class="absolute right-0 top-0 h-full w-[84%] max-w-xs glass-nav border-l border-slate-200 p-5 flex flex-col gap-2 animate-fadeIn overflow-y-auto no-scrollbar">
    <div class="flex items-center justify-between mb-2">
      <span class="text-lg font-extrabold tracking-tight"><span class="text-slate-900">Buy</span><span class="gradient-text">low</span></span>
      <button data-action="close-menu" class="w-9 h-9 grid place-items-center rounded-full hover:bg-slate-100"><i data-lucide="x" class="w-5 h-5 text-slate-600"></i></button>
    </div>
    <nav class="flex flex-col gap-1" data-nav="mobile"></nav>
    <div class="mt-3 pt-3 border-t border-slate-200">
      <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2" data-i18n="menu.role"></div>
      <div class="flex items-center gap-1 p-1 rounded-2xl bg-slate-100" data-nav="roles-mobile"></div>
    </div>
    <button data-action="toggle-language" class="mt-2 inline-flex items-center justify-center gap-2 h-11 rounded-2xl border border-slate-200 text-sm font-semibold text-slate-700">
      <i data-lucide="languages" class="w-4 h-4"></i><span data-bind="lang-label-2">KO</span>

      <i data-lucide="rocket" class="w-4 h-4"></i><span data-i18n="nav.cta"></span>
    </button>
  </div>
</div>

<!-- ====================== MAIN ====================== -->
<main class="flex-1 pt-16 pb-24 lg:pb-12 relative">
  <div class="blob bg-brand-200/40 w-[480px] h-[480px] -top-32 -right-24"></div>
  <div class="blob bg-indigo-200/40 w-[420px] h-[420px] top-[40rem] -left-32"></div>

  <!-- =============== HOME =============== -->
  <section id="route-home" class="route" data-route-view="home"></section>
  <!-- =============== DIRECTORY =============== -->
  <section id="route-directory" class="route" data-route-view="directory"></section>
  <!-- =============== MATCHES =============== -->
  <section id="route-matches" class="route" data-route-view="matches"></section>
  <!-- =============== FORECAST =============== -->
  <section id="route-forecast" class="route" data-route-view="forecast"></section>
  <!-- =============== CHAT =============== -->
  <section id="route-chat" class="route" data-route-view="chat"></section>
  <!-- =============== CREATE =============== -->
  <section id="route-create" class="route" data-route-view="create"></section>
  <!-- =============== PAYMENT =============== -->
  <section id="route-payment" class="route" data-route-view="payment"></section>
</main>

<!-- ====================== MOBILE BOTTOM NAV ====================== -->
<nav class="lg:hidden glass-nav fixed bottom-0 inset-x-0 z-40 border-t border-slate-200/70 pb-[env(safe-area-inset-bottom)]">
  <div class="grid grid-cols-5 h-16" data-nav="bottom"></div>
</nav>

<!-- ====================== TOAST ====================== -->
<div data-bind="toast-wrap" class="fixed bottom-20 lg:bottom-6 inset-x-0 z-[60] flex flex-col items-center gap-2 px-4 pointer-events-none"></div>

<!-- ====================== SOURCE / DETAIL DRAWER ====================== -->
<div data-bind="drawer" data-visible-state="source_open" class="fixed inset-0 z-[55]">
  <div data-action="close-source" class="absolute inset-0 bg-slate-900/45 backdrop-blur-sm"></div>
  <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-soft p-6 overflow-y-auto no-scrollbar animate-fadeIn" data-bind="drawer-body"></div>
</div>

/* =====================================================================
   STATE MACHINE  (locked runtime contract)
   phases: booting idle composing submitting queued running
           completed failed cancelling cancelled source_open offline_queued
   ===================================================================== */
const PHASES = ["booting","idle","composing","submitting","queued","running","completed","failed","cancelling","cancelled","source_open","offline_queued"];

const state = {
  product: "buylow",
  language: "ko",
  role: "brand",                 // brand | creator | agency
  route: "home",
  network: "online",
  menuOpen: false,
  sourceWindow: null,            // open partner profile drawer payload
  ui: { phase: "booting", elapsedSeconds: 0, progressStage: "queued" },
  // domain
  offers: SEED_OFFERS.slice(),
  payments: SEED_PAYMENTS.slice(),
  conversations: structuredClone(SEED_CONVERSATIONS),
  activeChatId: SEED_CONVERSATIONS[0].id,
  // job slots (one active job per kind keeps invariants simple here)
  jobs: {},                      // jobId -> {kind, chatId, assistantMessageId, clientActionId, stage, result}
  forecast: { jobId:null, status:"empty", stage:"queued", elapsed:0, result:null },
  preview:  { jobId:null, status:"empty", result:null },
  chatJob:  { jobId:null, clientActionId:null },
  outbox: [],                    // offline queue of {command,payload}
};

/* ---------- helpers ---------- */
const t = (k) => (I18N[state.language][k] ?? I18N.ko[k] ?? k);
const uid = (p="id") => p + "-" + Math.random().toString(36).slice(2,9);
const profileById = (id) => PROFILES.find((p) => p.id === id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
const fmtNum = (n) => n.toLocaleString();

function setPhase(phase) {
  if (!PHASES.includes(phase)) throw new Error("unknown phase " + phase);
  state.ui.phase = phase;
  document.documentElement.setAttribute("data-state", phase);
  applyVisibleStates();
}

function applyVisibleStates() {
  const phase = state.ui.phase;
  document.querySelectorAll("[data-visible-state]").forEach((el) => {
    const tokens = el.getAttribute("data-visible-state").split(/\s+/);
    el.style.display = tokens.includes(phase) ? "" : "none";
  });
}

/* ---------- toast effect ---------- */
function toast(key, kind="ok") {
  const wrap = document.querySelector("[data-bind='toast-wrap']");
  const colors = { ok:"from-brand-600 to-indigo-600", warn:"from-amber-500 to-orange-500", err:"from-rose-500 to-pink-600" };
  const el = document.createElement("div");
  el.className = `pointer-events-auto max-w-sm w-full sm:w-auto px-4 py-3 rounded-2xl text-white text-sm font-semibold shadow-glow bg-gradient-to-r ${colors[kind]||colors.ok} animate-fadeIn flex items-center gap-2`;
  el.innerHTML = `<span class="inline-block w-1.5 h-1.5 rounded-full bg-white/90"></span><span>${esc(t(key))}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transform = "translateY(8px)"; el.style.transition="all .35s"; }, 2600);
  setTimeout(() => el.remove(), 3100);
}

/* =====================================================================
   RUNTIME: event -> command -> reducer -> effects -> reducer -> render
   The renderer never starts effects. Effects never touch DOM directly.
   ===================================================================== */
const runtime = {
  dispatch(command, payload = {}) {
    switch (command) {
      case "BOOT": this._boot(); break;
      case "NAVIGATE": this._navigate(payload.route); break;
      case "CHANGE_LANGUAGE": this._toggleLanguage(); break;
      case "SWITCH_ROLE": this._switchRole(payload.role); break;
      case "OPEN_MENU": state.menuOpen = true; this._renderMenu(); break;
      case "CLOSE_MENU": state.menuOpen = false; this._renderMenu(); break;
      case "OPEN_SOURCE": this._openSource(payload.id); break;
      case "CLOSE_SOURCE": this._closeSource(); break;
      case "NETWORK_TOGGLE": this._toggleNetwork(); break;
      case "SUBMIT_OFFER": this._submitOffer(payload); break;
      case "USE_TARGET": this._useTarget(payload.id); break;
      case "RUN_FORECAST": this._runForecast(payload); break;
      case "CANCEL_JOB": this._cancelForecast(); break;
      case "RETRY_JOB": this._runForecast(payload, true); break;
      case "SELECT_CHAT": this._selectChat(payload.id); break;
      case "SUBMIT_QUESTION": this._sendMessage(payload); break;
      case "GENERATE_PREVIEW": this._generatePreview(payload); break;
      case "REGISTER_CAMPAIGN": this._registerCampaign(payload); break;
      case "APPLY_CAMPAIGN": this._applyCampaign(payload); break;
      case "FUND_ESCROW": this._fundEscrow(payload.id); break;
      case "RELEASE_ESCROW": this._releaseEscrow(payload.id); break;
      default: console.warn("unknown command", command);
    }
  },

  _boot() {
    setPhase("booting");
    renderChrome();
    renderRoute();
    // simulate boot handshake
    setTimeout(() => { setPhase("idle"); }, 350);
  },

  _navigate(route) {
    if (!route) return;
    state.route = route;
    state.menuOpen = false;
    if (location.hash !== "#/" + route) location.hash = "#/" + route;
    this._renderMenu();
    renderChrome();
    renderRoute();
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (state.ui.phase !== "running" && state.ui.phase !== "queued") setPhase("idle");
  },

  _toggleLanguage() {
    state.language = state.language === "ko" ? "en" : "ko";
    document.documentElement.lang = state.language;
    applyI18n();
    renderChrome();
    renderRoute();
    toast("toast.lang");
  },

  _switchRole(role) {
    if (!role || role === state.role) return;
    state.role = role;
    renderChrome();
    renderRoute();
    toast("toast.role");
  },

  _renderMenu() {
    const overlay = document.querySelector("[data-bind='menu-overlay']");
    overlay.classList.toggle("hidden", !state.menuOpen);
    document.body.style.overflow = state.menuOpen ? "hidden" : "";
    if (state.menuOpen) lucide.createIcons();
  },

  _openSource(id) {
    const p = profileById(id);
    if (!p) return;
    state.sourceWindow = { id, prev: state.ui.phase };
    renderDrawer(p);
    setPhase("source_open");
  },
  _closeSource() {
    const prev = state.sourceWindow?.prev || "idle";
    state.sourceWindow = null;
    setPhase(prev === "source_open" ? "idle" : prev);
  },

  _toggleNetwork() {
    if (state.network === "online") {
      state.network = "offline";
      setPhase("offline_queued");
      toast("toast.offline", "warn");
    } else {
      state.network = "online";
      // flush outbox
      const queued = state.outbox.splice(0);
      queued.forEach((item) => this.dispatch(item.command, { ...item.payload, _flushed: true }));
      setPhase("idle");
      if (queued.length) toast("toast.online");
    }
    renderChrome();
  },

  /* ---- offer (idempotent submit) ---- */
  _submitOffer(payload) {
    if (state.network === "offline" && !payload._flushed) {
      state.outbox.push({ command: "SUBMIT_OFFER", payload });
      toast("toast.offline", "warn");
      return;
    }
    // idempotency: ignore duplicate while a submit with same clientActionId is active
    if (state.ui.phase === "submitting" && state._activeOfferAction === payload.clientActionId) {
      toast("toast.offer.guard", "warn");
      return;
    }
    setPhase("submitting");
    state._activeOfferAction = payload.clientActionId;
    const btn = document.querySelector("[data-bind='offer-submit']");
    if (btn) { btn.disabled = true; }
    setTimeout(() => {
      const convId = "cv-" + (payload.target || "new");
      const offer = { id: uid("of"), target: payload.target, conv: convId,
        message: payload.message, amount: Number(payload.amount)||0, status: "negotiating" };
      state.offers.unshift(offer);
      // ensure a conversation exists
      if (!state.conversations.find((c) => c.id === convId)) {
        const p = profileById(payload.target);
        state.conversations.unshift({ id: convId, with: payload.target, title: p ? p.displayName : "New", unread: 0,
          last: payload.message, messages: [{ id: uid("m"), who:"me", text: payload.message, t: "now" }] });
      }
      state._activeOfferAction = null;
      setPhase("completed");
      renderRoute();
      toast("toast.offer");
      setTimeout(() => { state.route = "chat"; state.activeChatId = convId; this._navigate("chat"); }, 400);
    }, 900);
  },

  _useTarget(id) {
    state._pendingTarget = id;
    if (state.route !== "matches") this._navigate("matches");
    else renderRoute();
    const sel = document.querySelector("[data-bind='offer-target']");
    if (sel) sel.value = id;
  },

  /* ---- forecast async job: booting->queued->running->completed/failed ---- */
  _runForecast(payload, isRetry) {
    if (state.network === "offline") {
      state.outbox.push({ command: "RUN_FORECAST", payload });
      toast("toast.offline", "warn");
      return;
    }
    // cache hit simulation
    const key = `${payload.creator}|${payload.budget}|${payload.market}|${payload.platform}`;
    if (!isRetry && state._forecastCache && state._forecastCache.key === key) {
      state.forecast = { ...state._forecastCache.value, status:"completed", cached:true, jobId: uid("job") };
      setPhase("completed");
      renderForecast();
      toast("toast.forecast.done");
      return;
    }
    const jobId = uid("job");
    state.forecast = { jobId, status:"queued", stage:"queued", elapsed:0, result:null, params: payload, cached:false };
    state.jobs[jobId] = { kind:"forecast", clientActionId: payload.clientActionId };
    setPhase("queued");
    renderForecast();
    const stages = ["queued","modeling","scoring","finalize"];
    let si = 0;
    state.forecast._timer = setInterval(() => {
      // cancelled mid-flight
      if (state.forecast.jobId !== jobId) { clearInterval(state.forecast._timer); return; }
      state.forecast.elapsed += 1;
      // advance stage every few seconds (compressed 60s -> ~6s)
      if (state.forecast.elapsed === 1) { state.forecast.status = "running"; setPhase("running"); }
      if (state.forecast.elapsed % 2 === 0 && si < stages.length - 1) { si++; state.forecast.stage = stages[si]; }
      renderForecast();
      if (state.forecast.elapsed >= 6) {
        clearInterval(state.forecast._timer);
        // ~12% simulated failure
        if (Math.random() < 0.12) {
          state.forecast.status = "failed";
          setPhase("failed");
          renderForecast();
          return;
        }
        const c = profileById(payload.creator);
        const budget = Number(payload.budget) || 2000;
        const base = c ? c.roas : 380;
        const result = {
          reach: Math.round((budget * (c?6:5) ) * (0.9 + Math.random()*0.4)),
          roas: Math.round(base * (0.92 + Math.random()*0.2)),
          conversions: Math.round(budget / (18 + Math.random()*8)),
          cpa: (15 + Math.random()*9).toFixed(1),
          confidence: Math.round(72 + Math.random()*22),
          creator: c ? c.displayName : payload.creator,
          market: payload.market, platform: payload.platform, budget,
        };
        state.forecast = { jobId, status:"completed", stage:"finalize", elapsed: state.forecast.elapsed, result, cached:false, params:payload };
        state._forecastCache = { key, value: { result, stage:"finalize", elapsed: state.forecast.elapsed } };
        setPhase("completed");
        renderForecast();
        toast("toast.forecast.done");
      }
    }, 1000);
  },

  _cancelForecast() {
    if (!state.forecast.jobId) return;
    setPhase("cancelling");
    clearInterval(state.forecast._timer);
    const jid = state.forecast.jobId;
    setTimeout(() => {
      state.forecast = { jobId:null, status:"cancelled", stage:"queued", elapsed:0, result:null };
      delete state.jobs[jid];
      setPhase("cancelled");
      renderForecast();
      setTimeout(() => setPhase("idle"), 300);
    }, 400);
  },

  /* ---- chat ---- */
  _selectChat(id) {
    state.activeChatId = id;
    const c = state.conversations.find((x) => x.id === id);
    if (c) c.unread = 0;
    renderChat();
  },

  _sendMessage(payload) {
    const conv = state.conversations.find((c) => c.id === state.activeChatId);
    if (!conv) return;
    const text = (payload.text || "").trim();
    if (!text) return;
    if (state.network === "offline") {
      state.outbox.push({ command: "SUBMIT_QUESTION", payload });
      toast("toast.offline", "warn");
      return;
    }
    // idempotency: one user message + one assistant placeholder per clientActionId
    if (state.chatJob.clientActionId === payload.clientActionId) return;
    state.chatJob = { jobId: uid("job"), clientActionId: payload.clientActionId, chatId: conv.id };
    setPhase("submitting");
    const userMsg = { id: uid("m"), who:"me", text, t:"now" };
    conv.messages.push(userMsg);
    conv.last = text;
    renderChat();
    const input = document.querySelector("[data-bind='chat-input']");
    if (input) input.value = "";
    // simulate delivery + typing + reply, attached to its own conversation (job ownership)
    const ownChatId = conv.id;
    setPhase("queued");
    renderChat();
    setTimeout(() => {
      setPhase("running");
      renderChat();
      setTimeout(() => {
        const target = state.conversations.find((c) => c.id === ownChatId);
        if (target && state.chatJob.chatId === ownChatId) {
          const replies = ["좋아요, 진행하시죠! 🙌","확인했어요. 일정 조율할게요.","에스크로 충전되면 바로 시작합니다.","Sounds great — sending the draft soon!"];
          const reply = { id: uid("m"), who:"them", text: replies[Math.floor(Math.random()*replies.length)], t:"now" };
          target.messages.push(reply);
          target.last = reply.text;
        }
        state.chatJob = { jobId:null, clientActionId:null };
        setPhase("completed");
        renderChat();
        setTimeout(() => setPhase("idle"), 200);
      }, 1400);
    }, 500);
  },

  /* ---- preview watermark async job ---- */
  _generatePreview(payload) {
    if (state.network === "offline") { state.outbox.push({command:"GENERATE_PREVIEW",payload}); toast("toast.offline","warn"); return; }
    const jobId = uid("job");
    state.preview = { jobId, status:"running", result:null, params: payload };
    setPhase("running");
    renderCreate();
    setTimeout(() => {
      if (state.preview.jobId !== jobId) return;
      state.preview = { jobId, status:"completed", result: { ...payload, url: "#preview" } };
      setPhase("completed");
      renderCreate();
      toast("toast.preview.done");
      setTimeout(() => setPhase("idle"), 200);
    }, 1500);
  },

  _registerCampaign(payload) {
    if (state.network === "offline") { state.outbox.push({command:"REGISTER_CAMPAIGN",payload}); toast("toast.offline","warn"); return; }
    setPhase("submitting");
    setTimeout(() => {
      CAMPAIGNS.unshift({ id: uid("c"), title: payload.title || "Untitled", brand: "Glow Atelier",
        regions: (payload.regions||"").split(",").map(s=>s.trim()).filter(Boolean),
        platforms: (payload.platforms||"").split(",").map(s=>s.trim()).filter(Boolean),
        budgetMin: Number(payload.budgetMin)||0, budgetMax: Number(payload.budgetMax)||0, applicants: 0, status:"open" });
      setPhase("completed");
      renderCreate();
      toast("toast.campaign");
      setTimeout(() => setPhase("idle"), 200);
    }, 900);
  },

  _applyCampaign(payload) {
    if (state.network === "offline") { state.outbox.push({command:"APPLY_CAMPAIGN",payload}); toast("toast.offline","warn"); return; }
    setPhase("submitting");
    setTimeout(() => {
      const c = CAMPAIGNS.find((x) => x.id === payload.campaignId);
      if (c) c.applicants += 1;
      setPhase("completed");
      renderCreate();
      toast("toast.apply");
      setTimeout(() => setPhase("idle"), 200);
    }, 800);
  },

  _fundEscrow(id) {
    const p = state.payments.find((x) => x.id === id);
    if (p) { p.status = "funded"; renderPayment(); toast("toast.fund"); }
  },
  _releaseEscrow(id) {
    const p = state.payments.find((x) => x.id === id);
    if (p) { p.status = "released"; renderPayment(); toast("toast.release"); }
  },
};

   ===================================================================== */
function applyI18n() {
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
    el.setAttribute("placeholder", t(el.getAttribute("data-i18n-ph")));
  });
  // lang labels
  const lab = state.language.toUpperCase();
  document.querySelectorAll("[data-bind='lang-label'],[data-bind='lang-label-2']").forEach((e)=> e.textContent = lab === "KO" ? "KO" : "EN");
}

function renderChrome() {
  // primary desktop nav
  const prim = document.querySelector("[data-nav='primary']");
  prim.innerHTML = ROUTES.map((r) => navBtn(r, "px-3 h-9 rounded-full text-sm font-semibold transition flex items-center gap-1.5")).join("");
  // mobile sheet nav
  const mob = document.querySelector("[data-nav='mobile']");
  mob.innerHTML = ROUTES.map((r) => navBtn(r, "px-3 h-11 rounded-xl text-[15px] font-semibold transition flex items-center gap-2.5 w-full")).join("");

  const bottomRoutes = ROUTES.filter((r)=>["home","directory","matches","chat","payment"].includes(r.id));

  }).join("");

  ["roles","roles-mobile"].forEach((slot) => {

    el.innerHTML = ROLES.map((role) => {

      return `<button data-action="switch-role" data-role="${role}" class="px-3 ${slot==='roles'?'h-7':'h-9 flex-1'} rounded-full text-xs font-bold transition ${active?'bg-white text-brand-700 shadow-card':'text-slate-500 hover:text-slate-700'}" data-i18n="role.${role}">${esc(t('role.'+role))}</button>`;

function navBtn(r, cls) {
  const active = state.route === r.id;
  const activeCls = active ? "bg-brand-50 text-brand-700" : "text-slate-600 hover:text-brand-700 hover:bg-slate-100";

}

function renderRoute() {
  document.querySelectorAll("[data-route-view]").forEach((el) => {
    el.classList.toggle("active", el.getAttribute("data-route-view") === state.route);

  ({ home:renderHome, directory:renderDirectory, matches:renderMatches,
     forecast:renderForecast, chat:renderChat, create:renderCreate, payment:renderPayment }[state.route] || renderHome)();
  applyI18n();
  lucide.createIcons();
}

/* ---------- FORECAST (async job w/ state machine) ---------- */
function renderForecast() {
  const creators = PROFILES.filter((p)=>p.role==="creator");
  const f = state.forecast;
  const stages = ["queued","modeling","scoring","finalize"];
  const stageIdx = stages.indexOf(f.stage);
  const isBusy = f.status==="queued" || f.status==="running";
  const progressPct = isBusy ? Math.min(95, (f.elapsed/6)*100) : (f.status==="completed"?100:0);

  let resultPanel = "";
  if (f.status === "completed" && f.result) {
    const r = f.result;
    resultPanel = card(`<div class="p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-extrabold" data-i18n="fc.result.title">${esc(t('fc.result.title'))}</h2>
        ${f.cached ? `<span class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 text-[11px] font-bold inline-flex items-center gap-1"><i data-lucide="zap" class="w-3 h-3"></i><span data-i18n="fc.cached">${esc(t('fc.cached'))}</span></span>` : pill(r.creator,"brand")}

          .map(([k,v,ic,tone])=>`<div class="p-4 rounded-2xl bg-slate-50 border border-slate-200">
            <div class="flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wide text-slate-400"><i data-lucide="${ic}" class="w-3.5 h-3.5 text-brand-500"></i><span data-i18n="${k}">${esc(t(k))}</span></div>

    <div class="mt-8 grid lg:grid-cols-2 gap-6 items-start">
      ${card(`<div class="p-6">
        <form data-bind="forecast-form" class="space-y-3">

          <div class="grid grid-cols-2 gap-3">

/* ---------- CHAT ---------- */
function renderChat() {
  const conv = state.conversations.find((c)=>c.id===state.activeChatId) || state.conversations[0];
  const busy = state.ui.phase==="queued" || state.ui.phase==="running" || state.ui.phase==="submitting";
  const typing = state.ui.phase==="running" && state.chatJob.chatId===conv.id;

  const list = state.conversations.map((c)=>{ const p=profileById(c.with);
    const active = c.id===state.activeChatId;

/* ---------- PAYMENT ---------- */
function renderPayment() {
  const held = state.payments.filter(p=>p.status==="funded"||p.status==="in_review").reduce((a,b)=>a+b.amount,0);
  const released = state.payments.filter(p=>p.status==="released").reduce((a,b)=>a+b.amount,0);
  const disputes = state.payments.filter(p=>p.status==="disputed").length;
  const statusTone = (s)=>({funded:"emerald",in_review:"amber",released:"indigo",refunded:"slate",disputed:"rose",draft:"slate"}[s]||"slate");
  const vTone = (s)=>({approved:"emerald",pending:"amber",rejected:"rose"}[s]||"slate");

  const html = wrap(`
    ${card(`<div class="p-6 sm:p-8">
      <span class="text-[11px] font-bold uppercase tracking-wider text-brand-600" data-i18n="pay.eyebrow">${esc(t('pay.eyebrow'))}</span>
      <h1 class="mt-2 text-2xl sm:text-3xl font-extrabold tracking-tight" data-i18n="pay.title">${esc(t('pay.title'))}</h1>
      <p class="mt-3 text-slate-600 max-w-2xl leading-relaxed" data-i18n="pay.body">${esc(t('pay.body'))}</p>
      <div class="mt-6 grid grid-cols-3 gap-3">
        ${[["$"+fmtNum(held),"pay.summary.held","emerald"],["$"+fmtNum(released),"pay.summary.released","indigo"],[disputes,"pay.summary.dispute","rose"]]
          .map(([v,k,tone])=>`<div class="p-4 rounded-2xl bg-slate-50 border border-slate-200">
            <div class="text-2xl font-extrabold text-slate-900">${esc(String(v))}</div>
            <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mt-0.5" data-i18n="${k}">${esc(t(k))}</div></div>`).join("")}
      </div>
    </div>`,"shadow-soft")}

    <div class="mt-8 grid lg:grid-cols-3 gap-6 items-start">
      <!-- escrow list -->
      <div class="lg:col-span-2">${card(`<div class="p-6">
        ${sectionHead("pay.escrow")}
        <div class="space-y-3">
          ${state.payments.length ? state.payments.map((p)=>`
            <div class="p-4 rounded-2xl border border-slate-200 bg-slate-50/60 flex items-center gap-4 flex-wrap">
              <span class="grid place-items-center w-11 h-11 rounded-xl bg-white border border-slate-200 shrink-0"><i data-lucide="lock" class="w-5 h-5 text-brand-600"></i></span>
              <div class="flex-1 min-w-0"><div class="font-extrabold text-slate-900">${p.currency} ${fmtNum(p.amount)}</div>
                <div class="text-xs text-slate-500 truncate">${esc(t('pay.payer'))} ${esc(p.payer)} → ${esc(t('pay.payee'))} ${esc(p.payee)}</div></div>
              ${pill(t('pay.status.'+p.status), statusTone(p.status))}
              <div class="flex gap-2 shrink-0">
                ${p.status!=="funded"&&p.status!=="released"?`<button data-action="fund-escrow" data-id="${p.id}" class="h-9 px-3 rounded-xl bg-brand-50 text-brand-700 text-xs font-bold hover:bg-brand-100" data-i18n="pay.fund">${esc(t('pay.fund'))}</button>`:''}
                ${p.status==="funded"||p.status==="in_review"?`<button data-action="release-escrow" data-id="${p.id}" class="h-9 px-3 rounded-xl bg-emerald-50 text-emerald-700 text-xs font-bold hover:bg-emerald-100" data-i18n="pay.release">${esc(t('pay.release'))}</button>`:''}
              </div>
            </div>`).join("") : `<div class="text-sm text-slate-400 py-6 text-center" data-i18n="pay.noescrow">${esc(t('pay.noescrow'))}</div>`}
        </div>
      </div>`,"shadow-soft")}</div>

      <!-- verification + methods -->
      <div class="space-y-6">
        ${card(`<div class="p-6">
          ${sectionHead("pay.verify")}
          <div class="space-y-2.5">
            ${VERIFICATIONS.map((v)=>`<div class="flex items-center justify-between gap-2">
              <span class="text-sm font-semibold text-slate-700 truncate">${esc(v.name)}</span>${pill(t('pay.verify.'+v.status), vTone(v.status))}</div>`).join("")}
          </div>
        </div>`)}
        ${card(`<div class="p-6">
          ${sectionHead("pay.method")}
          <div class="space-y-2.5">
            ${[["Visa •••• 4242","credit-card","brand"],["Wire / SWIFT","building-2","indigo"],["PayPal Business","wallet","slate"]].map(([m,ic,tone])=>`
              <div class="flex items-center gap-3 p-3 rounded-2xl border border-slate-200">
                <span class="grid place-items-center w-9 h-9 rounded-xl bg-${tone==='brand'?'brand':(tone==='indigo'?'indigo':'slate')}-50"><i data-lucide="${ic}" class="w-4 h-4 text-${tone==='brand'?'brand':(tone==='indigo'?'indigo':'slate')}-600"></i></span>
                <span class="text-sm font-semibold text-slate-700">${esc(m)}</span></div>`).join("")}
          </div>
        </div>`)}
      </div>
    </div>
  `);
  document.getElementById("route-payment").innerHTML = html;
  lucide.createIcons();
}

        <div class="text-sm text-slate-500">${p.flag} ${esc(p.country)} · ${esc(p.role==="brand"?t('role.brand'):(p.tier||"Creator"))}</div></div>
    </div>
    <p class="mt-4 text-sm text-slate-600 leading-relaxed">${esc(p.bio)}</p>
    ${p.role==="creator"?`<div class="mt-5 grid grid-cols-3 gap-3">
      ${[["ROAS",p.roas+"%"],[t('home.followers'),fmtNum(p.followers)],["Reach",p.reach]].map(([k,v])=>`
        <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 text-center"><div class="text-lg font-extrabold text-slate-900">${esc(v)}</div><div class="text-[10px] font-bold uppercase tracking-wide text-slate-400">${esc(k)}</div></div>`).join("")}
    </div>`:''}
    <div class="mt-5 space-y-3">
      <div><div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5" data-i18n="drawer.langs">${esc(t('drawer.langs'))}</div>
        <div class="flex flex-wrap gap-1.5">${(p.languages||[]).map((l)=>pill(l.toUpperCase(),"slate")).join("")}</div></div>
      <div><div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5" data-i18n="drawer.cats">${esc(t('drawer.cats'))}</div>
        <div class="flex flex-wrap gap-1.5">${(p.categories||[]).map((c)=>pill(c,"brand")).join("")}</div></div>
      <div><div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5" data-i18n="dir.verified">${esc(t('dir.verified'))}</div>
        <div class="flex flex-wrap gap-1.5">${(p.verified||[]).map((v)=>pill(v,"emerald")).join("")}</div></div>
    </div>
    <div class="mt-6 flex gap-2">
      <button data-action="use-target" data-id="${p.id}" class="flex-1 h-12 rounded-2xl text-white font-bold bg-gradient-to-r from-brand-600 to-indigo-600 shadow-lg shadow-brand-500/30 inline-flex items-center justify-center gap-2">
        <i data-lucide="send" class="w-4 h-4"></i><span data-i18n="drawer.send">${esc(t('drawer.send'))}</span></button>
      <button data-action="open-chat-conv" data-conv="cv-${p.id}" data-target="${p.id}" class="h-12 px-5 rounded-2xl border border-slate-200 font-bold text-slate-700 hover:bg-slate-50">${esc(t('mat.openchat'))}</button>
    </div>
  `;
  lucide.createIcons();
}

/* =====================================================================
   EVENT DELEGATION (registered once — no stacking listeners)
   ===================================================================== */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.getAttribute("data-action");
  switch (action) {
    case "navigate": runtime.dispatch("NAVIGATE", { route: el.dataset.route }); break;
    case "toggle-language": runtime.dispatch("CHANGE_LANGUAGE"); break;
    case "switch-role": runtime.dispatch("SWITCH_ROLE", { role: el.dataset.role }); break;
    case "open-menu": runtime.dispatch("OPEN_MENU"); break;
    case "close-menu": runtime.dispatch("CLOSE_MENU"); break;
    case "open-source": runtime.dispatch("OPEN_SOURCE", { id: el.dataset.id }); break;
    case "close-source": runtime.dispatch("CLOSE_SOURCE"); break;
    case "toggle-network": runtime.dispatch("NETWORK_TOGGLE"); break;
    case "use-target": runtime.dispatch("CLOSE_SOURCE"); runtime.dispatch("USE_TARGET", { id: el.dataset.id }); break;
    case "home-search-go": {
      const v = document.querySelector("[data-bind='home-search']")?.value || "";
      dirFilter = v; runtime.dispatch("NAVIGATE", { route: "directory" });
      break;
    }
    case "dir-quick": dirFilter = el.dataset.q; renderDirectory(); applyI18n(); lucide.createIcons(); break;
    case "submit-offer": {
      const target = document.querySelector("[data-bind='offer-target']")?.value;
      const message = document.querySelector("[data-bind='offer-message']")?.value;
      const amount = document.querySelector("[data-bind='offer-amount']")?.value;
      runtime.dispatch("SUBMIT_OFFER", { target, message, amount, clientActionId: uid("act") });
      break;
    }
    case "open-chat-conv": {
      const conv = el.dataset.conv, target = el.dataset.target;
      if (!state.conversations.find((c)=>c.id===conv)) {
        const p = profileById(target);
        state.conversations.unshift({ id:conv, with:target, title:p?p.displayName:"New", unread:0, last:"…", messages:[] });
      }
      state.activeChatId = conv;
      runtime.dispatch("NAVIGATE", { route:"chat" });
      break;
    }
    case "run-forecast": {
      const params = {
        creator: document.querySelector("[data-bind='fc-creator']")?.value,
        budget: document.querySelector("[data-bind='fc-budget']")?.value,
        market: document.querySelector("[data-bind='fc-market']")?.value,
        platform: document.querySelector("[data-bind='fc-platform']")?.value,
        clientActionId: uid("act"),
      };
      state._lastForecastParams = params;
      runtime.dispatch("RUN_FORECAST", params);
      break;
    }
    case "cancel-forecast": runtime.dispatch("CANCEL_JOB"); break;
    case "retry-forecast": runtime.dispatch("RETRY_JOB", state._lastForecastParams || {}); break;
    case "select-chat": runtime.dispatch("SELECT_CHAT", { id: el.dataset.id }); break;
    case "send-message": {
      const text = document.querySelector("[data-bind='chat-input']")?.value;
      runtime.dispatch("SUBMIT_QUESTION", { text, clientActionId: uid("act") });
      break;
    }
    case "toggle-translate": state._translate = !state._translate; renderChat(); applyI18n(); break;
    case "set-preview-mode": state._pvMode = el.dataset.mode; renderCreate(); applyI18n(); break;
    case "generate-preview": {
      runtime.dispatch("GENERATE_PREVIEW", {
        filename: document.querySelector("[data-bind='pv-file']")?.value,
        watermark: document.querySelector("[data-bind='pv-wm']")?.value,
        concept: document.querySelector("[data-bind='pv-concept']")?.value,
        mode: state._pvMode || "text",
      });
      break;
    }
    case "register-campaign": {
      runtime.dispatch("REGISTER_CAMPAIGN", {
        title: document.querySelector("[data-bind='c-title']")?.value,
        brief: document.querySelector("[data-bind='c-brief']")?.value,
        budgetMin: document.querySelector("[data-bind='c-bmin']")?.value,
        budgetMax: document.querySelector("[data-bind='c-bmax']")?.value,
        platforms: document.querySelector("[data-bind='c-plat']")?.value,
        regions: document.querySelector("[data-bind='c-reg']")?.value,
      });
      break;
    }
    case "apply-campaign": runtime.dispatch("APPLY_CAMPAIGN", { campaignId: el.dataset.id }); break;
    case "fund-escrow": runtime.dispatch("FUND_ESCROW", { id: el.dataset.id }); break;
    case "release-escrow": runtime.dispatch("RELEASE_ESCROW", { id: el.dataset.id }); break;
  }
});

// enter-to-send in chat / search on input
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    const t1 = e.target;
    if (t1.matches?.("[data-bind='chat-input']")) {
      e.preventDefault();
      runtime.dispatch("SUBMIT_QUESTION", { text: t1.value, clientActionId: uid("act") });
    } else if (t1.matches?.("[data-bind='home-search']")) {
      e.preventDefault(); dirFilter = t1.value; runtime.dispatch("NAVIGATE", { route: "directory" });
    }
  }
});
document.addEventListener("input", (e) => {
  if (e.target.matches?.("[data-bind='dir-search']")) {
    dirFilter = e.target.value;
    const grid = document.getElementById("route-directory");
    const focusVal = e.target.value;
    renderDirectory(); applyI18n(); lucide.createIcons();
    const again = document.querySelector("[data-bind='dir-search']");
    if (again) { again.focus(); again.value = focusVal; again.setSelectionRange(focusVal.length, focusVal.length); }
  }
});

/* ---------- hash routing ---------- */
function syncFromHash() {
  const h = (location.hash || "#/home").replace("#/","");
  const route = ROUTES.find((r)=>r.id===h) ? h : "home";
  if (route !== state.route) { state.route = route; renderChrome(); renderRoute(); }
}
window.addEventListener("hashchange", syncFromHash);

/* ---------- BOOT ---------- */
window.addEventListener("DOMContentLoaded", () => {
  document.documentElement.lang = state.language;
  if (location.hash) { const h = location.hash.replace("#/",""); if (ROUTES.find((r)=>r.id===h)) state.route = h; }
  runtime.dispatch("BOOT");
});
</script>
