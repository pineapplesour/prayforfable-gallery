<style>

  .blob{ position:absolute; border-radius:9999px; filter:blur(48px); pointer-events:none; z-index:0; }

  .spin{ animation: spin 0.8s linear infinite; }

    *{ animation:none !important; transition:none !important; }

<body class="font-sans text-slate-900 antialiased min-h-screen">

<!-- decorative violet blobs -->
<div class="blob bg-brand-200/40 w-[420px] h-[420px] -top-24 -left-24"></div>
<div class="blob bg-indigo-200/30 w-[380px] h-[380px] top-[40%] -right-32"></div>

<!-- ========================= TOP GLASS NAV ========================= -->
<header class="glass-nav sticky top-0 z-40 border-b border-slate-100">

      </a>

      <!-- desktop primary nav -->
      <nav class="hidden lg:flex items-center gap-1 ml-4" data-nav="desktop">
        <button data-action="nav" data-route="home"      class="nav-link px-3 py-2 rounded-xl text-sm font-semibold text-slate-500 hover:text-brand-700 hover:bg-brand-50 transition" data-i18n="nav.home"></button>
        <button data-action="nav" data-route="directory" class="nav-link px-3 py-2 rounded-xl text-sm font-semibold text-slate-500 hover:text-brand-700 hover:bg-brand-50 transition" data-i18n="nav.directory"></button>
        <button data-action="nav" data-route="matches"   class="nav-link px-3 py-2 rounded-xl text-sm font-semibold text-slate-500 hover:text-brand-700 hover:bg-brand-50 transition" data-i18n="nav.matches"></button>
        <button data-action="nav" data-route="forecast"  class="nav-link px-3 py-2 rounded-xl text-sm font-semibold text-slate-500 hover:text-brand-700 hover:bg-brand-50 transition" data-i18n="nav.forecast"></button>
        <button data-action="nav" data-route="chat"      class="nav-link px-3 py-2 rounded-xl text-sm font-semibold text-slate-500 hover:text-brand-700 hover:bg-brand-50 transition" data-i18n="nav.chat"></button>
        <button data-action="nav" data-route="create"    class="nav-link px-3 py-2 rounded-xl text-sm font-semibold text-slate-500 hover:text-brand-700 hover:bg-brand-50 transition" data-i18n="nav.create"></button>
        <button data-action="nav" data-route="payment"   class="nav-link px-3 py-2 rounded-xl text-sm font-semibold text-slate-500 hover:text-brand-700 hover:bg-brand-50 transition" data-i18n="nav.payment"></button>

        <div class="hidden md:flex items-center p-0.5 rounded-full bg-slate-100 text-xs font-semibold" data-bind="role-switcher">
          <button data-action="set-role" data-role="brand"   class="role-pill px-3 py-1.5 rounded-full transition" data-i18n="role.brand"></button>
          <button data-action="set-role" data-role="creator" class="role-pill px-3 py-1.5 rounded-full transition" data-i18n="role.creator"></button>

    <div class="flex items-center justify-between mb-4">
      <span class="text-lg font-extrabold tracking-tight">buy<span class="gradient-text">low</span></span>
      <button data-action="toggle-menu" class="grid place-items-center w-9 h-9 rounded-xl hover:bg-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>

<!-- ========================= MAIN ROUTER OUTLET ========================= -->
<main class="relative z-10 mx-auto max-w-[1180px] px-4 sm:px-6 pb-28 lg:pb-12 pt-5" data-bind="outlet">

  <div data-visible-state="booting" class="space-y-4 animate-pulse" style="display:block">
    <div class="h-44 rounded-3xl bg-white shadow-card"></div>
    <div class="grid sm:grid-cols-3 gap-4">
      <div class="h-28 rounded-3xl bg-white shadow-card"></div>
      <div class="h-28 rounded-3xl bg-white shadow-card"></div>
      <div class="h-28 rounded-3xl bg-white shadow-card"></div>
    </div>
  </div>
  <!-- routed view injected here -->
  <div data-bind="view" data-visible-state="idle composing submitting queued running completed failed cancelling cancelled source_open offline_queued"></div>
</main>

  /* ---------- forecast mock job (no fetch, polling-style) ---------- */
  function clearJob(){ if(App.job){ App.job.timers.forEach(clearTimeout); App.job=null; } }
  function runForecast(form){
    clearJob();
    const budget = Number(form.budget.value)||1000;
    const market = form.market.value, channel = form.channel.value;
    const cid = "fc-"+Date.now();
    App.job = { id:cid, kind:"forecast", clientActionId:cid, timers:[], market, channel, budget };
    // cache hit simulation: same market+channel+budget within session
    const key = `${market}|${channel}|${budget}`;
    const cache = App._fcCache && App._fcCache[key];
    setState("submitting");
    setFcStatus(t("fc.running"), 8);
    const steps = cache
      ? [[300,"queued",t("fc.queued"),35],[700,"completed",null,100]]
      : [[500,"queued",t("fc.queued"),30],[1500,"running",t("fc.running"),68],[2600,"running",t("fc.running"),88],[3400,"completed",null,100]];
    steps.forEach(([ms,st,label,pct])=>{
      App.job.timers.push(setTimeout(()=>{
        if(!App.job || App.job.id!==cid) return;   // ownership guard
        if(st==="completed"){
          App.forecast = computeForecast(budget, market, channel, !!cache);
          App._fcCache = App._fcCache||{}; App._fcCache[key]=true;
          setFcStatus("",100);
          setState("completed");
          refreshForecastResult();
          clearJob();
        } else {
          setState(st);
          if(label!=null) setFcStatus(label, pct);
        }
      }, ms));
    });
  }
  function computeForecast(budget, market, channel, cache){
    const seed = (budget % 97) + market.length + channel.length;
    const roasBase = {Instagram:430,TikTok:470,YouTube:390,"UGC Mix":410}[channel]||420;
    const marketMul = {UAE:1.18,Japan:1.05,Singapore:1.12,Mexico:0.92,Brazil:0.96,UK:1.0}[market]||1;
    const roas = Math.round(roasBase*marketMul + (seed%30));
    const reachN = Math.round(budget*marketMul*42 + seed*120);
    const conv = Math.round(budget*marketMul*0.9 + (seed%50));
    const cpe = (budget/Math.max(conv,1)).toFixed(2);
    const reach = reachN>=1000 ? (reachN/1000).toFixed(0)+"k" : String(reachN);
    const confidence = 72 + (seed%18);
    const breakdown = [
      {name:channel, pct: 48 + (seed%8)},
      {name:"Story / Shorts", pct: 27 + (seed%5)},
      {name:"UGC repost", pct: 14 + (seed%4)},
    ];
    const sum = breakdown.reduce((s,b)=>s+b.pct,0);
    breakdown.push({name:"Cross-post", pct: Math.max(100-sum,6)});
    return { roas, reach, conv, cpe, confidence, market, channel, cache, breakdown };
  }
  function setFcStatus(label, pct){
    const s=$('[data-bind="fc-status"]'); const b=$('[data-bind="fc-bar"]');
    if(s && label) s.textContent=label;
    if(b && pct!=null) b.style.width=pct+"%";
  }
  function refreshForecastResult(){
    const host=$('[data-bind="fc-result"]'); if(host){ host.innerHTML=renderForecastResult(); applyI18n(); icons(); }
  }

  /* ---------- chat helpers ---------- */
  function appendMessage(conv, msg){
    DB.messages[conv] = DB.messages[conv]||[]; DB.messages[conv].push(msg);
    const c = DB.conversations.find(x=>x.id===conv); if(c) c.last = msg.body;
    const thread=$('[data-bind="chat-thread"]');
    if(thread){ thread.insertAdjacentHTML("beforeend", renderBubble(msg)); icons(); thread.scrollTop=thread.scrollHeight; }
  }

  /* ---------- preview mode highlight ---------- */
  function highlightPreviewMode(mode){
    App._previewMode = mode;
    $$(".preview-mode").forEach(b=>{
      const on = b.getAttribute("data-mode")===mode;
      b.classList.toggle("bg-brand-600", on); b.classList.toggle("text-white", on);
      b.classList.toggle("border-brand-600", on); b.classList.toggle("text-slate-600", !on);
    });
  }

  /* ============================ EVENT DISPATCH (single delegated listener) ============================ */
  function dispatch(action, el, ev){
    switch(action){
      case "nav": {
        const r = el.getAttribute("data-route");
        if(r && VIEWS[r]){ location.hash = "#/"+r; }
        App.menuOpen=false; $('[data-bind="mobile-menu"]').hidden=true;
        break;
      }
      case "toggle-menu": {
        App.menuOpen=!App.menuOpen; const m=$('[data-bind="mobile-menu"]'); m.hidden=!App.menuOpen; icons();
        break;
      }
      case "change-language": {
        App.lang = App.lang==="ko"?"en":"ko";
        applyI18n();   // CHANGE_LANGUAGE: re-render from keys, do not patch text nodes
        render();
        break;
      }
      case "set-role": {
        const role=el.getAttribute("data-role"); if(role && role!==App.role){ App.role=role; render(); toast(role==="brand"?(App.lang==="ko"?"브랜드 모드":"Brand mode"):(App.lang==="ko"?"크리에이터 모드":"Creator mode")); }
        break;
      }
      case "dir-search": {
        App._dirQuery = el.value;
        const host=$('[data-bind="dir-results"]');
        if(host){ const all=[...DB.creators,...DB.brands]; host.innerHTML=renderDirList(all); applyI18n(); icons(); }
        break;
      }
      case "use-target": { toast((App.lang==="ko"?"대상 선택: ":"Target: ")+el.getAttribute("data-name")); break; }
      case "send-offer": {
        ev.preventDefault();
        const f=el; const name=f.target.value, amount=Number(f.amount.value)||0, msg=f.message.value;
        DB.offers.unshift({ id:"of-"+Math.floor(1000+Math.random()*9000), to:name, conv:"cv-new", amount, status:"sent", msg });
        const host=$('[data-bind="offer-list"]'); if(host){ host.innerHTML=renderOffers(); icons(); }
        toast(App.lang==="ko"?"제안이 전송되어 대화가 열렸습니다.":"Offer sent — conversation opened.");
        break;
      }
      case "run-forecast": { ev.preventDefault(); runForecast(el); break; }
      case "cancel-job": {
        if(App.job){ setState("cancelling"); clearJob(); setState("cancelled"); refreshForecastResult(); toast(t("fc.cancelled")); }
        break;
      }
      case "retry-job": {
        const form=$('form[data-action="run-forecast"]'); if(form) runForecast(form);
        break;
      }
      case "select-chat": {
        const c=el.getAttribute("data-conv"); if(c){ App.chat.conv=c; render(); }
        break;
      }
      case "compose": {
        // entering composing state when user types
        if(App.route==="chat" && el.value.trim() && App.state==="idle") setState("composing");
        if(App.route==="chat" && !el.value.trim() && App.state==="composing") setState("idle");
        break;
      }
      case "translate-draft": {
        const ta=$('textarea[name="draft"]'); const hint=$('[data-bind="chat-hint"]'); const tgt=$('select[name="target"]').value;
        if(!ta.value.trim()){ toast(App.lang==="ko"?"먼저 메시지를 입력하세요.":"Type a message first."); break; }
        hint.textContent=t("chat.translating");
        setTimeout(()=>{ hint.innerHTML=`<span class="text-brand-700 font-semibold">→ ${tgt.toUpperCase()}</span> ${esc(mockTranslate(ta.value,tgt))}`; },700);
        break;
      }
      case "review-draft": {
        const ta=$('textarea[name="draft"]'); const hint=$('[data-bind="chat-hint"]');
        if(!ta.value.trim()){ toast(App.lang==="ko"?"먼저 메시지를 입력하세요.":"Type a message first."); break; }
        hint.textContent=t("chat.reviewing");
        setTimeout(()=>{ hint.innerHTML=`<span class="text-indigo-700 font-semibold">✓ ${App.lang==="ko"?"공손하고 명확함 — 보내도 좋아요.":"Polite & clear — good to send."}</span>`; },900);
        break;
      }
      case "send-message": {
        ev.preventDefault();
        const ta=el.draft; const body=ta.value.trim(); if(!body) break;
        // invariant: one user message per submit; ignore empty repeated submits
        appendMessage(App.chat.conv, { from:"me", body, translated:null });
        ta.value=""; $('[data-bind="chat-hint"]').textContent=""; setState("idle");
        // simulate counterpart reply (job-style)
        setTimeout(()=>{ appendMessage(App.chat.conv, { from:"them", body:(App.lang==="ko"?"확인했어요, 곧 회신드릴게요! 👍":"Got it, I'll get back shortly! 👍"), translated:(App.lang==="ko"?null:"확인했어요, 곧 회신드릴게요!") }); }, 1200);
        break;
      }
      case "start-call": {
        const kind=el.getAttribute("data-kind"); const bar=$('[data-bind="call-bar"]'); const txt=$('[data-bind="call-bar-text"]');
        App.chat.call=kind; bar.hidden=false; txt.textContent=(kind==="video"?"📹 ":"📞 ")+t("chat.callRinging"); icons();
        setTimeout(()=>{ if(App.chat.call){ txt.textContent=(kind==="video"?"📹 ":"📞 ")+(App.lang==="ko"?"통화 연결됨 00:01":"Connected 00:01"); } },1400);
        break;
      }
      case "end-call": { App.chat.call=null; $('[data-bind="call-bar"]').hidden=true; toast(t("chat.callEnd")); break; }
      case "create-campaign": {
        ev.preventDefault();
        const f=el; if(!f.title.value.trim()||!f.brief.value.trim()){ toast(App.lang==="ko"?"제목과 브리프는 필수입니다.":"Title and brief are required."); break; }
        DB.campaigns.unshift({ id:"cmp-"+Date.now(), title:f.title.value, regions:f.regions.value.split(",").map(s=>s.trim()).filter(Boolean), platforms:f.platforms.value.split(",").map(s=>s.trim()), bmin:Number(f.bmin.value)||0, bmax:Number(f.bmax.value)||0, proposals:0, status:"open", brief:f.brief.value });
        toast(t("create.registered")); render();
        break;
      }
      case "apply-campaign": {
        ev.preventDefault(); toast(t("create.applied"));
        break;
      }
      case "set-preview-mode": { highlightPreviewMode(el.getAttribute("data-mode")); break; }
      case "gen-preview": {
        ev.preventDefault();
        const wm=el.watermark.value||"BUYLOW PREVIEW"; $('[data-bind="wm"]').textContent=wm;
        const canvas=$('[data-bind="preview-canvas"]'); canvas.classList.add("animate-fadeIn"); setTimeout(()=>canvas.classList.remove("animate-fadeIn"),500);
        toast(App.lang==="ko"?"워터마크 프리뷰 생성됨":"Watermark preview generated");
        break;
      }
      case "fund-escrow": {
        ev.preventDefault();
        const f=el; DB.payments.unshift({ id:"pay-"+Math.floor(7000+Math.random()*999), cur:f.currency.value, amount:Number(f.amount.value)||0, status:"funded", payer:(App.role==="brand"?"You (Brand)":"GLOWON"), payee:f.payee.value });
        const host=$('[data-bind="pay-list"]'); if(host){ host.innerHTML=renderPayList(); icons(); }
        toast(t("pay.funded"));
        break;
      }
      case "escrow-action": {
        const id=el.getAttribute("data-id"), op=el.getAttribute("data-op");
        const p=DB.payments.find(x=>x.id===id); if(p){ p.status=({release:"released",refund:"refunded",dispute:"disputed"})[op]; }
        const host=$('[data-bind="pay-list"]'); if(host){ host.innerHTML=renderPayList(); icons(); }
        toast(escrowLabel(p.status));
        break;
      }
      case "verify-action": {
        const id=el.getAttribute("data-id"), op=el.getAttribute("data-op");
        const v=DB.verifications.find(x=>x.id===id); if(v){ v.status=(op==="approve"?"approved":"rejected"); }
        const host=$('[data-bind="verify-list"]'); if(host){ host.innerHTML=renderVerify(); icons(); }
        toast(op==="approve"?t("pay.approved"):t("pay.rejected"));
        break;
      }
      case "test-translate": {
        const out=$('[data-bind="runtime-out"]'); out.textContent=t("pay.testing");
        setTimeout(()=>{ out.innerHTML=`<span class="text-emerald-600 font-semibold">✓ "Hello, I'd like to propose a campaign collaboration." (${App.lang==="ko"?"지연 412ms":"latency 412ms"})</span>`; },800);
        break;
      }
      case "save-runtime": { ev.preventDefault(); $('[data-bind="runtime-out"]').innerHTML=`<span class="text-emerald-600 font-semibold">✓ ${esc(t("pay.saved"))}</span>`; break; }
    }
  }
  function mockTranslate(s, tgt){
    const m={ja:"こんにちは、キャンペーンのご提案です。",en:"Hello, here is our campaign proposal.",ar:"مرحبًا، إليك عرض حملتنا.",ko:"안녕하세요, 캠페인 제안입니다."};
    return m[tgt]||s;
  }

  /* one delegated click listener (no per-render rebinding) */
  document.addEventListener("click", (ev)=>{
    const el = ev.target.closest("[data-action]");
    if(!el) return;
    const action = el.getAttribute("data-action");
    // skip form submits handled by submit listener
    if(["send-offer","run-forecast","send-message","create-campaign","apply-campaign","gen-preview","fund-escrow","save-runtime"].includes(action)){
      if(el.tagName==="FORM") return; // handled on submit
      // buttons inside forms with these actions: let submit handle
    }
    dispatch(action, el, ev);
  });
  // delegated submit for forms with data-action
  document.addEventListener("submit", (ev)=>{
    const el = ev.target.closest("form[data-action]");
    if(!el) return;
    dispatch(el.getAttribute("data-action"), el, ev);
  });
  // delegated input for search/compose
  document.addEventListener("input", (ev)=>{
    const el = ev.target.closest("[data-action]");
    if(!el) return;
    const a=el.getAttribute("data-action");
    if(a==="dir-search"||a==="compose") dispatch(a, el, ev);
  });

  /* ---------- network sim (offline_queued state path) ---------- */
  window.addEventListener("offline", ()=>{ App.online=false; applyI18n(); });
  window.addEventListener("online",  ()=>{ App.online=true; applyI18n(); });

  /* ---------- hash router ---------- */
  function readRoute(){
    const h=(location.hash||"").replace(/^#\/?/,"").split("?")[0];
    return VIEWS[h] ? h : "home";
  }
  function onRoute(){
    App.route = readRoute();
    // entering a fresh route resets transient job state to idle (forecast keeps its result only on its own route)
    if(App.route!=="forecast" && (App.state==="running"||App.state==="queued"||App.state==="submitting")) { clearJob(); }
    setState("idle");
    render();
  }
  window.addEventListener("hashchange", onRoute);

  /* ---------- BOOT ---------- */
  function boot(){
    setState("booting");
    applyI18n(); icons();
    setTimeout(()=>{                 // simulate first-load hydration
      if(!location.hash) location.hash="#/home";
      onRoute();
    }, 350);
  }
  document.addEventListener("DOMContentLoaded", boot);
})();
</script>
