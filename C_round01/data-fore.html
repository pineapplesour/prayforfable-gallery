<style>
  html { scroll-behavior: smooth; overflow-x: clip; max-width: 100%; }

    background: rgba(255, 255, 255, 0.82);

  }
  .gradient-text {
    background: linear-gradient(135deg, #7c3aed, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .gradient-cta { background-image: linear-gradient(135deg, #7c3aed, #6366f1); }
  /* view router */
  .view { display: none; }
  .view.is-active { display: block; animation: fadeIn 0.4s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes floatY { 0% { transform: translateY(0); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0); } }
  .animate-float { animation: floatY 6s ease-in-out infinite; }
  @keyframes pingDot { 0% { transform: scale(1); opacity: .7; } 75%,100% { transform: scale(2.2); opacity: 0; } }
  .ping-dot::after {
    content: ''; position: absolute; inset: 0; border-radius: 9999px;
    background: #22c55e; animation: pingDot 1.8s cubic-bezier(0,0,.2,1) infinite;
  }
  /* blobs */
  .blob { position: absolute; border-radius: 9999px; filter: blur(64px); z-index: 0; pointer-events: none; }
  /* scrollbars (horizontal scrollers) */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  /* state-driven visibility: JS toggles inline display per current state.
     Views are hidden until first render, so no flash before JS runs. */
  .view:not(.is-active) [data-visible-state] { display: none; }
  /* chart bar grow */
  @keyframes barGrow { from { height: 0; } }
  .bar-grow { animation: barGrow .7s cubic-bezier(.2,.8,.2,1); }
  /* typing dots */
  .typing span { display:inline-block; width:6px; height:6px; border-radius:9999px; background:#a78bfa; margin:0 1px; animation: blink 1.2s infinite both; }
  .typing span:nth-child(2){ animation-delay:.2s; } .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink { 0%,80%,100%{ opacity:.25; } 40%{ opacity:1; } }
  /* nav link active */
  .nav-link[aria-current="page"] { color: #7c3aed; background: #f5f3ff; }
  .bottom-link[aria-current="page"] { color: #7c3aed; }
  .bottom-link[aria-current="page"] .bn-ico { transform: translateY(-2px); }
  @media (prefers-reduced-motion: reduce) {
    .view.is-active, .animate-float, .bar-grow, .ping-dot::after, .typing span { animation: none !important; }
    html { scroll-behavior: auto; }
  }
</style>

/* Simulates async backend jobs so views never call fetch directly. */
const mockApi = {
  _delay: (ms) => new Promise((r) => setTimeout(r, ms)),
  async dashboard() { await this._delay(120); return { partners: MOCK.influencers.length, campaigns: MOCK.campaigns.filter(c=>c.status==="open").length, influencers: MOCK.influencers, campaigns: MOCK.campaigns }; },
  async networkProfiles() { await this._delay(120); return [...MOCK.influencers, ...MOCK.brands]; },
  async offers() { await this._delay(100); return MOCK.offers; },
  async payments() { await this._delay(100); return MOCK.payments; },
  async campaigns() { await this._delay(100); return MOCK.campaigns; },
  async conversations() { await this._delay(100); return MOCK.conversations; },
  async messages(id) { await this._delay(90); return MOCK.messagesByConv[id] || []; },
  /* createOffer returns a job-style async result */
  async createOffer(input) { await this._delay(600); const id = "cv_" + Math.floor(Math.random()*9000+1000); MOCK.offers.unshift({ id: "off_"+Math.random().toString(16).slice(2,8), target: input.target, conv: id, amount: input.amount, status: "pending", message: input.message }); return { conversationId: id }; },
  async createCampaign(input) { await this._delay(700); MOCK.campaigns.unshift({ id:"cmp_"+Math.random().toString(16).slice(2,6), title: input.title, regions: input.regions, platforms: input.platforms, min: input.min, max: input.max, status:"open", applicants:0, brand:"GLOWUP Lab" }); return { title: input.title }; },
  async applyCampaign(input) { await this._delay(600); return { title: input.title }; },
  async createEscrow(input) { await this._delay(700); MOCK.payments.unshift({ id:"pay_"+Math.random().toString(16).slice(2,6), cur: input.cur, amount: input.amount, status:"held", payer:"GLOWUP Lab", payee: input.payee, milestone:"1/3 초안 승인 대기" }); return input; },
  async releaseEscrow(id) { await this._delay(500); const p = MOCK.payments.find(x=>x.id===id); if(p){p.status="released";p.milestone="3/3 완료";} return p; },
  async disputeEscrow(id) { await this._delay(500); const p = MOCK.payments.find(x=>x.id===id); if(p){p.status="disputed";p.milestone="분쟁 검토";} return p; },
  async generatePreview(input) { await this._delay(800); return { ok: true, mode: input.mode }; },
  /* forecast = long async job with queued -> running -> completed/failed */
  async runForecast(input, onState) {
    onState && onState("queued"); await this._delay(700);
    onState && onState("running"); await this._delay(1300);
    const seed = (input.influencer || "x").length + (input.budget||1000);
    const roas = (3.6 + (seed % 17) / 10).toFixed(1);
    return {
      roas, reach: (0.4 + (seed % 9) / 10).toFixed(1) + "M",
      conv: (1.8 + (seed % 11) / 10).toFixed(1) + "%",
      cpa: "$" + (6 + (seed % 7)),
      trend: MOCK.kpi.roasTrend.map((v,i)=> +(v + ((seed+i)%5)/10).toFixed(1)),
      reachBars: [["Instagram", 38 + seed%20], ["TikTok", 30 + seed%25], ["YouTube", 22 + seed%15], ["Reels", 18 + seed%12]],
      match: [["콘텐츠 적합도", 88 + seed%10], ["오디언스 겹침", 74 + seed%18], ["과거 ROAS", 80 + seed%15], ["응답 속도", 70 + seed%24], ["가격 적합도", 66 + seed%28]],
      conf: 86 + (seed % 9),
    };
  },
};

function setState(s) {

}
function t(key, vars) {
  let s = (I18N[App.lang] && I18N[App.lang][key]) || (I18N.ko[key]) || key;
  if (vars) for (const k in vars) s = s.replace("{"+k+"}", vars[k]);

}

/* ---------------- tiny DOM helpers ---------------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
function esc(x){ return String(x==null?"":x).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function icon(name, cls){ return `<i data-lucide="${name}" class="${cls||""}"></i>`; }
function refreshIcons(){ if (window.lucide) window.lucide.createIcons(); }

/* ---------------- i18n apply ---------------- */
function applyI18n(root=document) {

}

/* ---------------- toast ---------------- */
let toastTimer = null;
function toast(titleKey, bodyKey, vars) {
  const box = $("[data-bind='toast']");
  $("[data-bind='toast-title']").textContent = t(titleKey, vars);
  $("[data-bind='toast-body']").textContent = t(bodyKey, vars);
  box.classList.remove("hidden");
  refreshIcons();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> box.classList.add("hidden"), 3200);
}

/* ---------------- chart helpers (inline SVG) ---------------- */
function lineChart(values, opts={}) {
  const w = opts.w||320, h = opts.h||120, pad = 14;
  const max = Math.max(...values)*1.12, min = Math.min(...values)*0.85;
  const sx = (i)=> pad + i*(w-2*pad)/(values.length-1);
  const sy = (v)=> h-pad - (v-min)/(max-min)*(h-2*pad);
  const pts = values.map((v,i)=>[sx(i),sy(v)]);
  const path = pts.map((p,i)=> (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area = path + ` L ${sx(values.length-1)} ${h-pad} L ${pad} ${h-pad} Z`;
  const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="#7c3aed"/>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-auto" preserveAspectRatio="none" role="img" aria-label="trend">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a78bfa" stop-opacity=".35"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#lg)"/><path d="${path}" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}
  </svg>`;
}
function barChart(rows) { // rows: [[label, val(0-100)], ...]
  const max = Math.max(...rows.map(r=>r[1]), 1);
  return `<div class="space-y-3">` + rows.map(r=>`
    <div>
      <div class="flex justify-between text-xs font-semibold mb-1"><span class="text-slate-600">${esc(r[0])}</span><span class="text-brand-700">${r[1]}%</span></div>
      <div class="h-2.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full gradient-cta bar-grow" style="width:${Math.round(r[1]/max*100)}%"></div></div>
    </div>`).join("") + `</div>`;
}
function radialGauge(pct) {
  const r=46, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg viewBox="0 0 120 120" class="w-28 h-28">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="#ede9fe" stroke-width="12"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="#7c3aed" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 60 60)"/>
    <text x="60" y="58" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">${pct}%</text>
    <text x="60" y="76" text-anchor="middle" font-size="9" font-weight="700" fill="#7c3aed">CONFIDENCE</text>
  </svg>`;
}
function vbars(rows) { // vertical mini bars [[label,val]]
  const max = Math.max(...rows.map(r=>r[1]),1);
  return `<div class="flex items-end gap-3 h-36 px-1">` + rows.map(r=>`
    <div class="flex-1 h-full flex flex-col items-center justify-end gap-1.5">
      <span class="text-[10px] font-extrabold text-brand-700">${r[1]}</span>
      <div class="w-full rounded-t-lg gradient-cta bar-grow" style="height:${Math.max(8, Math.round(r[1]/max*78))}%"></div>
      <span class="text-[10px] font-semibold text-slate-500 text-center leading-tight">${esc(r[0])}</span>
    </div>`).join("") + `</div>`;
}

/* ---------------- reusable UI bits ---------------- */
function pill(text, tone="brand") {
  const tones = { brand:"bg-brand-50 text-brand-700", slate:"bg-slate-100 text-slate-600", green:"bg-emerald-50 text-emerald-700", blue:"bg-blue-50 text-blue-700", amber:"bg-amber-50 text-amber-700", rose:"bg-rose-50 text-rose-700" };
  return `<span class="inline-flex items-center rounded-full px-2.5 py-1 text-[11px] font-bold ${tones[tone]||tones.brand}">${esc(text)}</span>`;
}
function statusPill(status) {
  const map = { held:["보관 중","amber"], released:["지급 완료","green"], disputed:["분쟁 검토","rose"], pending:["대기","slate"], accepted:["수락됨","green"], open:["모집 중","green"], reviewing:["심사 중","amber"], approved:["승인","green"], rejected:["반려","rose"] };
  const m = map[status] || [status,"slate"]; return pill(m[0], m[1]);
}

        <div class="min-w-0"><p class="font-extrabold truncate">${esc(conv.name)}</p>
          <p class="text-xs ${conv.online?'text-emerald-600':'text-slate-400'} font-semibold flex items-center gap-1">${conv.online?'<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>'+esc(t("c.online")):'offline'}</p></div>
        <span class="ml-auto inline-flex items-center gap-1.5 rounded-full bg-brand-50 text-brand-700 text-xs font-bold px-3 py-1.5">${icon("languages","w-3.5 h-3.5")} ${esc(t("c.translate"))}</span>
      </header>
      <div data-bind="chat-thread" class="flex-1 overflow-y-auto no-scrollbar p-5 space-y-3 bg-slate-50/40">
        ${msgs.map(m=>chatBubble(m)).join("")}

        <form data-action="send-message" class="flex items-end gap-2">
          <input name="text" autocomplete="off" placeholder="${esc(t("c.composerPlaceholder"))}" class="flex-1 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-brand-400"/>
          <button type="submit" data-bind="send-btn" class="grid place-items-center w-12 h-12 rounded-2xl gradient-cta text-white shadow-glow shrink-0 disabled:opacity-50">
            <span data-visible-state="idle composing">${icon("send","w-5 h-5")}</span>
            <span data-visible-state="submitting queued running">${icon("loader-circle","w-5 h-5 animate-spin")}</span>
          </button>
        </form>
        <p data-bind="msg-status" class="text-[11px] font-semibold text-slate-400 mt-1.5 px-1 h-4"></p>
      </footer>
    </section>
  </div>`;
}
function chatBubble(m) {
  if (m.from === "me") return `<div class="flex justify-end"><div class="max-w-[78%] rounded-2xl rounded-br-md gradient-cta text-white px-4 py-2.5 shadow-card"><p class="text-sm leading-snug">${esc(m.text)}</p><p class="text-[10px] text-white/70 text-right mt-1">${esc(m.t||"")}${m.pending?' · '+esc(t("c.statusSubmitting")):''}</p></div></div>`;
  return `<div class="flex justify-start"><div class="max-w-[78%] rounded-2xl rounded-bl-md bg-white border border-slate-100 px-4 py-2.5 shadow-card"><p class="text-sm leading-snug text-slate-800">${esc(m.text)}</p><p class="text-[10px] text-slate-400 mt-1">${esc(m.t||"")}</p></div></div>`;
}

function renderPayment() {
  const pays = App.data.payments || MOCK.payments;
  const held = pays.filter(p=>p.status==="held").reduce((a,b)=>a+b.amount,0);
  const released = pays.filter(p=>p.status==="released").reduce((a,b)=>a+b.amount,0);
  return `
  <div class="rounded-4xl border border-slate-100 bg-white shadow-soft p-6 sm:p-8">
    <span class="text-xs font-bold text-brand-600 uppercase tracking-wider">${esc(t("p.eyebrow"))}</span>
    <h1 class="text-3xl font-extrabold tracking-tight mt-2">${esc(t("p.title"))}</h1>
    <p class="text-slate-600 mt-2 max-w-2xl">${esc(t("p.body"))}</p>
    <div class="grid grid-cols-3 gap-3 mt-6">
      <div class="rounded-2xl bg-amber-50 p-4"><p class="text-2xl font-extrabold text-amber-700">$${held.toLocaleString()}</p><p class="text-[11px] font-bold text-slate-500">${esc(t("p.summaryHeld"))}</p></div>
      <div class="rounded-2xl bg-emerald-50 p-4"><p class="text-2xl font-extrabold text-emerald-700">$${released.toLocaleString()}</p><p class="text-[11px] font-bold text-slate-500">${esc(t("p.summaryReleased"))}</p></div>
      <div class="rounded-2xl bg-brand-50 p-4"><p class="text-2xl font-extrabold text-brand-700">${pays.length}</p><p class="text-[11px] font-bold text-slate-500">${esc(t("p.summaryEscrows"))}</p></div>
    </div>
  </div>

  <div class="grid lg:grid-cols-5 gap-6 mt-8">
    <div class="lg:col-span-2 rounded-4xl border border-slate-100 bg-white shadow-soft p-6 self-start">
      <h2 class="text-lg font-extrabold mb-1">${esc(t("p.newEscrow"))}</h2>
      <p class="text-xs text-slate-400 mb-4">${esc(t("p.feeNote"))}</p>
      <form data-action="submit-escrow" class="space-y-3">
        <label class="block"><span class="text-xs font-bold text-slate-500">${esc(t("p.payee"))}</span>
          <select name="payee" class="mt-1 w-full rounded-2xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-brand-400">${MOCK.influencers.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select></label>
        <div class="grid grid-cols-3 gap-2">
          <label class="block col-span-2"><span class="text-xs font-bold text-slate-500">${esc(t("p.amount"))}</span><input name="amount" type="number" value="1200" class="mt-1 w-full rounded-2xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-brand-400"/></label>
          <label class="block"><span class="text-xs font-bold text-slate-500">${esc(t("p.currency"))}</span><input name="currency" value="USD" class="mt-1 w-full rounded-2xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-brand-400"/></label>
        </div>
        <button type="submit" data-bind="escrow-btn" class="w-full rounded-2xl gradient-cta text-white font-bold py-3 shadow-glow disabled:opacity-60">
          <span data-visible-state="idle composing">${esc(t("p.hold"))}</span><span data-visible-state="submitting queued running">${esc(t("p.holding"))}</span></button>
      </form>
      <div class="mt-6 pt-5 border-t border-slate-100">
        <h3 class="text-sm font-extrabold mb-3">${esc(t("p.verifyTitle"))}</h3>
        <div class="space-y-2">${MOCK.verifications.map(v=>`
          <div class="flex items-center justify-between rounded-xl bg-slate-50 px-3 py-2"><div><p class="text-sm font-bold">${esc(v.name)}</p><p class="text-[11px] text-slate-500">${esc(v.platform)}</p></div>${statusPill(v.status)}</div>`).join("")}</div>
      </div>
    </div>

    <div class="lg:col-span-3 rounded-4xl border border-slate-100 bg-white shadow-soft p-6">
      <h2 class="text-lg font-extrabold mb-4">${esc(t("p.milestones"))}</h2>
      <div class="space-y-3">${pays.map(p=>`
        <div class="rounded-3xl border border-slate-100 p-4">
          <div class="flex items-center gap-3">
            <span class="grid place-items-center w-11 h-11 rounded-2xl ${p.status==="released"?"bg-emerald-50 text-emerald-600":p.status==="disputed"?"bg-rose-50 text-rose-600":"bg-amber-50 text-amber-600"} shrink-0">${icon(p.status==="released"?"check-circle-2":p.status==="disputed"?"alert-triangle":"lock","w-5 h-5")}</span>
            <div class="min-w-0 flex-1"><div class="flex items-center gap-2"><p class="font-extrabold">${esc(p.cur)} ${p.amount.toLocaleString()}</p>${statusPill(p.status)}</div>
              <p class="text-xs text-slate-500 mt-0.5">${esc(p.payer)} → ${esc(p.payee)}</p></div>
          </div>
          <div class="mt-3 flex items-center justify-between gap-3">
            <p class="text-xs font-semibold text-slate-600">${esc(p.milestone)}</p>
            ${p.status==="held"?`<div class="flex gap-2">
              <button data-action="release-escrow" data-id="${p.id}" class="rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 transition">${esc(t("p.release"))}</button>
              <button data-action="dispute-escrow" data-id="${p.id}" class="rounded-xl border border-rose-200 text-rose-600 hover:bg-rose-50 text-xs font-bold px-3 py-2 transition">${esc(t("p.dispute"))}</button>
            </div>`:""}
          </div>
        </div>`).join("")}</div>
    </div>
  </div>`;
}

/* ---------------- router ---------------- */
const RENDERERS = { home: renderHome, directory: renderDirectory, matches: renderMatches, forecast: renderForecast, chat: renderChat, create: renderCreate, payment: renderPayment };
function applyVisibleStates(root=document) {
  const cur = (App.route==="forecast") ? App.forecast.state : ((App.route==="chat") ? App.chat.msgState : App.state);
  $$("[data-visible-state]", root).forEach(el => {
    const allowed = el.getAttribute("data-visible-state").split(/\s+/);
    el.style.display = allowed.includes(cur) ? "" : "none";
  });
}
function syncNavActive() {
  $$(".nav-link, .bottom-link, .m-link").forEach(a => {
    if (a.getAttribute("data-route") === App.route) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  syncRoleButtons();
}
function syncRoleButtons() {
  $$(".role-btn").forEach(b => {
    const on = b.getAttribute("data-role") === App.role;
    b.classList.toggle("bg-white", on); b.classList.toggle("text-brand-700", on); b.classList.toggle("shadow-sm", on);
    b.classList.toggle("text-slate-500", !on);
  });
}
function renderRoute() {
  const route = App.route;
  const host = $("#view-"+route);
  if (!host || !RENDERERS[route]) return;
  // hide all, render target
  $$(".view").forEach(v => v.classList.remove("is-active"));
  host.innerHTML = RENDERERS[route]();
  host.classList.add("is-active");
  applyI18n(host);
  applyVisibleStates(host);
  syncNavActive();
  refreshIcons();
  window.scrollTo({ top: 0, behavior: "auto" });
  if (route === "chat") scrollChatBottom();
}
function go(route) {
  if (!RENDERERS[route]) route = "home";
  App.route = route;
  if (route !== "chat") App.chat.mobileOpen = false;
  if (App.menuOpen) closeMenu();
  if (location.hash !== "#/"+route) location.hash = "#/"+route;
  // each route is "idle" baseline unless it owns a sub-state
  if (route !== "forecast" && App.state !== "idle") setState("idle");
  renderRoute();
}
function parseHash() { const h = (location.hash||"").replace(/^#\//,""); return h.split("?")[0] || "home"; }

/* ---------------- menu ---------------- */
function openMenu(){ App.menuOpen=true; const p=$("[data-bind='menu-panel']"); p.classList.remove("hidden"); $("[data-action='toggle-menu']").setAttribute("aria-expanded","true"); refreshIcons(); }
function closeMenu(){ App.menuOpen=false; $("[data-bind='menu-panel']").classList.add("hidden"); $("[data-action='toggle-menu']").setAttribute("aria-expanded","false"); }

/* ---------------- chat helpers ---------------- */
function scrollChatBottom(){ const th=$("[data-bind='chat-thread']"); if(th) th.scrollTop = th.scrollHeight; }
function setMsgState(s){ App.chat.msgState=s; applyVisibleStates($("#view-chat")); const lbl=$("[data-bind='msg-status']"); if(lbl){ const map={idle:"",composing:t("c.statusComposing"),submitting:t("c.statusSubmitting"),queued:t("c.statusQueued"),running:t("c.statusRunning"),completed:t("c.statusCompleted"),failed:t("c.statusFailed")}; lbl.textContent=map[s]||""; } }

/* ---------------- forecast state machine ---------------- */
function setForecastState(s){ App.forecast.state=s; if(STATES.includes(s)) setState(s); applyVisibleStates($("#view-forecast")); const lbl=$("[data-bind='forecast-status']"); if(lbl){ lbl.textContent = s==="queued"?t("f.queued"):t("f.running"); } }
async function runForecast(influencer, budget) {
  const fs = App.forecast;
  if (["queued","running"].includes(fs.state)) return; // invariant: ignore while active
  fs.influencer = influencer; fs.budget = budget; fs.cancelled = false; fs.result = null;
  const jobId = "fc_"+Date.now(); fs.jobId = jobId;
  const bar = ()=>$("[data-bind='forecast-bar']");
  setForecastState("queued"); if(bar()) bar().style.width="18%";
  try {
    const res = await mockApi.runForecast({influencer, budget}, (st)=>{ if(fs.jobId!==jobId) return; setForecastState(st); if(st==="running"&&bar()) bar().style.width="72%"; });
    if (fs.jobId !== jobId || fs.cancelled) return;       // cancelled jobs never attach results
    fs.result = res; setForecastState("completed");
    toast("toast.forecast","toast.forecastBody",{name:influencer});
  } catch(e) {
    if (fs.jobId !== jobId || fs.cancelled) return;
    setForecastState("failed");
  }
  renderRoute();
}
function cancelForecast(){ const fs=App.forecast; if(!["queued","running"].includes(fs.state)) return; fs.cancelled=true; fs.jobId=null; setForecastState("cancelling"); setTimeout(()=>{ setForecastState("cancelled"); },350); }

/* ---------------- data load + first paint ---------------- */
async function loadAll() {
  // mock-api layer; views never fetch directly
  const [dashboard, profiles, offers, payments, campaigns, conversations] = await Promise.all([
    mockApi.dashboard(), mockApi.networkProfiles(), mockApi.offers(), mockApi.payments(), mockApi.campaigns(), mockApi.conversations()
  ]);
  App.data = { dashboard, profiles, offers, payments, campaigns, conversations };
}

/* ---------------- delegated action dispatcher (registered once) ---------------- */
function onAction(e) {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.getAttribute("data-action");

  // form submissions
  if (el.tagName === "FORM" || (el.closest("form") && action.startsWith("submit"))) {} // handled in submit listener

  switch (action) {
    case "navigate": e.preventDefault(); go(el.getAttribute("data-route")); break;
    case "toggle-menu": e.preventDefault(); App.menuOpen ? closeMenu() : openMenu(); break;
    case "change-language": e.preventDefault(); App.lang = App.lang==="ko"?"en":"ko"; document.documentElement.lang=App.lang; applyI18n(document); renderRoute(); break;
    case "set-role": e.preventDefault(); { const r=el.getAttribute("data-role"); if(r!==App.role){ App.role=r; syncRoleButtons(); toast("toast.role","toast.roleBody",{role:t("role."+r)}); if(App.route==="create"||App.route==="home") renderRoute(); } } break;
    case "select-chat": e.preventDefault(); App.chat.selected=el.getAttribute("data-conv"); App.chat.mobileOpen=true; App.chat.msgState="idle"; renderRoute(); break;
    case "chat-back": e.preventDefault(); App.chat.mobileOpen=false; renderRoute(); break;
    case "propose": case "use-target": e.preventDefault(); { const tg=el.getAttribute("data-target"); App.matchTarget=tg; go("matches"); } break;
    case "dir-filter": e.preventDefault(); App.dirSearch=el.getAttribute("data-q"); renderRoute(); break;
    case "cancel-forecast": e.preventDefault(); cancelForecast(); break;
    case "preview-mode": e.preventDefault(); App.previewMode=el.getAttribute("data-mode"); syncPreviewMode(); break;
    case "release-escrow": e.preventDefault(); doRelease(el.getAttribute("data-id")); break;
    case "dispute-escrow": e.preventDefault(); doDispute(el.getAttribute("data-id")); break;
  }
}
function onInput(e){ const el=e.target.closest("[data-action]"); if(!el) return; if(el.getAttribute("data-action")==="dir-search"){ App.dirSearch=el.value; clearTimeout(App._ds); App._ds=setTimeout(()=>{ const focusVal=el.value; renderRoute(); const inp=$("[data-action='dir-search']"); if(inp){ inp.focus(); inp.setSelectionRange(focusVal.length,focusVal.length); } },180); } }

async function onSubmit(e) {
  const form = e.target.closest("form[data-action]");
  if (!form) return;
  e.preventDefault();
  const action = form.getAttribute("data-action");
  const fd = new FormData(form);

  if (action === "submit-offer") {
    if (["submitting","queued","running"].includes(App.state)) return; // idempotency guard
    setState("submitting"); applyVisibleStates($("#view-matches")); disableSubmit(form,true);
    const res = await mockApi.createOffer({ target: fd.get("target"), message: fd.get("message"), amount: Number(fd.get("amount")) });
    App.data.offers = await mockApi.offers();
    setState("completed"); toast("toast.offer","toast.offerBody",{id:res.conversationId});
    setState("idle"); renderRoute();
  }
  else if (action === "submit-forecast") {
    runForecast(fd.get("influencer")||MOCK.influencers[0].name, Number(fd.get("budget"))||1000);
  }
  else if (action === "send-message") {
    sendMessage(form, fd.get("text"));
  }
  else if (action === "submit-campaign") {
    if (["submitting","queued","running"].includes(App.state)) return;
    setState("submitting"); applyVisibleStates($("#view-create")); disableSubmit(form,true);
    const title = fd.get("title")||"새 캠페인";
    await mockApi.createCampaign({ title, brief:fd.get("brief"), min:Number(fd.get("min")), max:Number(fd.get("max")), platforms:String(fd.get("platforms")).split(",").map(s=>s.trim()).filter(Boolean), regions:String(fd.get("regions")).split(",").map(s=>s.trim()).filter(Boolean) });
    App.data.campaigns = await mockApi.campaigns();
    setState("completed"); toast("toast.campaign","toast.campaignBody",{title});
    setState("idle"); renderRoute();
  }
  else if (action === "submit-apply") {
    if (["submitting","queued","running"].includes(App.state)) return;
    setState("submitting"); applyVisibleStates($("#view-create")); disableSubmit(form,true);
    const title = fd.get("campaign")||"캠페인";
    await mockApi.applyCampaign({ title });
    setState("completed"); toast("toast.applied","toast.appliedBody",{title});
    setState("idle"); renderRoute();
  }
  else if (action === "submit-preview") {
    if (["submitting","queued","running"].includes(App.state)) return;
    setState("submitting"); applyVisibleStates($("#view-create")); disableSubmit(form,true);
    await mockApi.generatePreview({ mode: App.previewMode||"text" });
    setState("completed");
    const frame=$("[data-bind='preview-frame']"); frame.classList.remove("hidden");
    $("[data-bind='preview-title']").textContent = fd.get("filename")||"preview";
    $("[data-bind='preview-mark']").textContent = fd.get("watermark")||"BUYLOW";
    toast("toast.preview","toast.previewBody");
    setState("idle"); applyVisibleStates($("#view-create")); disableSubmit(form,false);
  }
  else if (action === "submit-escrow") {
    if (["submitting","queued","running"].includes(App.state)) return;
    setState("submitting"); applyVisibleStates($("#view-payment")); disableSubmit(form,true);
    const cur=String(fd.get("currency")||"USD").toUpperCase(), amt=Number(fd.get("amount"));
    await mockApi.createEscrow({ payee:fd.get("payee"), amount:amt, cur });
    App.data.payments = await mockApi.payments();
    setState("completed"); toast("toast.escrow","toast.escrowBody",{cur,amt:amt.toLocaleString()});
    setState("idle"); renderRoute();
  }
}
function disableSubmit(form, on){ const b=form.querySelector("button[type='submit']"); if(b) b.disabled=on; }

/* message send: full state machine + invariants */
async function sendMessage(form, text) {
  text=(text||"").trim(); if(!text) return;
  if (["submitting","queued","running"].includes(App.chat.msgState)) return; // one active submit per chat
  const conv = App.chat.selected;
  const list = MOCK.messagesByConv[conv] || (MOCK.messagesByConv[conv]=[]);
  const now = new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
  list.push({ from:"me", text, t:now });
  form.reset();
  // re-render thread
  const th=$("[data-bind='chat-thread']");
  th.insertAdjacentHTML("beforeend", chatBubble({from:"me",text,t:now}));
  refreshIcons(); scrollChatBottom();
  setMsgState("submitting"); await mockApi._delay(350);
  setMsgState("queued"); await mockApi._delay(300);
  setMsgState("running");
  // show typing then reply
  const typing=$("[data-bind='chat-typing']"); typing.classList.remove("hidden"); scrollChatBottom();
  await mockApi._delay(1100);
  typing.classList.add("hidden");
  const reply={from:"them",text:"좋아요! 데이터 확인하고 바로 회신드릴게요. 🙌",t:new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})};
  list.push(reply);
  th.insertAdjacentHTML("beforeend", chatBubble(reply));
  setMsgState("completed"); scrollChatBottom();
  setTimeout(()=>setMsgState("idle"), 900);
}

async function doRelease(id){ await mockApi.releaseEscrow(id); App.data.payments=await mockApi.payments(); toast("toast.released","toast.releasedBody"); renderRoute(); }
async function doDispute(id){ await mockApi.disputeEscrow(id); App.data.payments=await mockApi.payments(); toast("toast.disputed","toast.disputedBody"); renderRoute(); }

function syncPreviewMode(){ const m=App.previewMode||"text"; $$(".pmode-btn").forEach(b=>{ const on=b.getAttribute("data-mode")===m; b.classList.toggle("bg-white",on); b.classList.toggle("text-brand-700",on); b.classList.toggle("shadow-sm",on); }); const cf=$("[data-bind='concept-field']"); if(cf) cf.style.display = m==="text"?"":"none"; }

/* ---------------- boot ---------------- */
function boot() {
  window.App = App; // debug/introspection only
  setState("booting");
  document.documentElement.lang = App.lang;
  applyI18n(document);
  syncRoleButtons();
  // delegated listeners (registered once)
  document.addEventListener("click", onAction);
  document.addEventListener("submit", onSubmit);
  document.addEventListener("input", onInput);
  window.addEventListener("hashchange", ()=>{ const r=parseHash(); if(r!==App.route) go(r); });
  // load data, then first paint
  loadAll().then(()=>{
    setState("idle");
    App.previewMode = "text";
    go(parseHash());
    refreshIcons();
  });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
</script>
