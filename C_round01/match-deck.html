    theme: {
      extend: {
        fontFamily: {

          brand: {
            50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd',

        },

          card: '0 4px 20px -2px rgba(0,0,0,.05)',

        },
        keyframes: {
          fadeIn: { '0%': { opacity: 0, transform: 'translateY(10px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },

          ping2: { '75%,100%': { transform: 'scale(2)', opacity: 0 } },
          shimmer: { '100%': { transform: 'translateX(100%)' } },
        },
        animation: {
          fadeIn: 'fadeIn .5s ease-out both',
          float: 'float 6s ease-in-out infinite',
          ping2: 'ping2 1.6s cubic-bezier(0,0,.2,1) infinite',

<style>
  html, body { background: #f8fafc; color: #0f172a; }
  body { font-family: 'Pretendard', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .gradient-text {
    background: linear-gradient(135deg, #7c3aed, #a78bfa);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .glass-nav { background: rgba(255,255,255,.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .glass-card { background: rgba(255,255,255,.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #ddd6fe; border-radius: 99px; }
  /* state-driven visibility */
  [data-visible-state] { display: none; }
  /* swipe deck */
  .deck-card { transition: transform .35s cubic-bezier(.22,1,.36,1), opacity .3s ease; will-change: transform; touch-action: pan-y; }
  .deck-card.dragging { transition: none; }
  .deck-card.fly-left { transform: translateX(-130%) rotate(-18deg) !important; opacity: 0; }
  .deck-card.fly-right { transform: translateX(130%) rotate(18deg) !important; opacity: 0; }
  .deck-card.fly-up { transform: translateY(-130%) scale(.9) !important; opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    .animate-float { animation: none !important; }
  }
  .skel { position: relative; overflow: hidden; background: #eef2f7; }
  .skel::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent); animation: shimmer 1.4s infinite; }
  @keyframes shimmer { 100% { transform: translateX(100%); } }
  .typing-dot { animation: float 1s infinite; }
  [data-view] { display: none; }
  [data-view].active { display: block; animation: fadeIn .45s ease-out both; }

<script>
/* ---------------- global store + finite state machine ---------------- */
const STATES = ["booting","idle","composing","submitting","queued","running","completed","failed","cancelling","cancelled","source_open","offline_queued"];
const Store = {
  lang: "ko",
  role: "brand",
  route: "home",
  online: true,
  // per-job state machine instances keyed by domain (offer, forecast, chat, escrow, campaign)
  jobs: {},            // jobId -> {kind, state, clientActionId, ownerId, result}
  jobState: {},        // domain -> current state string (for data-state slots)
  listeners: new Set(),
};
function emit() { Store.listeners.forEach((fn) => fn()); }

/* allowed transitions (locked runtime contract) */
const TRANSITIONS = {
  idle:        ["submitting","composing"],
  composing:   ["submitting","idle"],
  submitting:  ["queued","failed","cancelling"],
  queued:      ["running","cancelling","offline_queued","failed"],
  running:     ["completed","failed","cancelling"],
  cancelling:  ["cancelled"],
  offline_queued: ["queued","cancelled"],
  completed:   ["idle","composing"],
  failed:      ["idle","submitting"],
  cancelled:   ["idle","composing"],
};
function canTransition(from, to) {
  if (from === to) return true;
  return (TRANSITIONS[from] || []).includes(to);
}
function setJobState(domain, to) {
  const from = Store.jobState[domain] || "idle";
  if (!canTransition(from, to)) {
    console.warn(`[fsm] blocked ${domain}: ${from} -> ${to}`);
    return false;
  }
  Store.jobState[domain] = to;
  applyStateSlots();
  return true;
}

/* dispatch a command (the only way state changes) */
const COMMANDS = {};
function dispatch(cmd, payload) {
  const handler = COMMANDS[cmd];
  if (!handler) { console.warn("[dispatch] unknown command", cmd); return; }
  return handler(payload || {});
}
</script>
<script>
/* ---------------- i18n + render helpers ---------------- */
function t(key) { return (I18N[Store.lang] && I18N[Store.lang][key]) || (I18N.ko[key]) || key; }
function applyI18n(root) {
  (root || document).querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  (root || document).querySelectorAll("[data-i18n-ph]").forEach((el) => {
    el.setAttribute("placeholder", t(el.getAttribute("data-i18n-ph")));
  });
}
function setLangLabel() {
  document.querySelectorAll('[data-bind="lang-label"]').forEach((el) => { el.textContent = Store.lang === "ko" ? "EN" : "한국어"; });
  document.documentElement.lang = Store.lang;
}
/* apply data-state visibility + active nav + role buttons */
function applyStateSlots() {
  // visible-state: show element only if any of its tokens equals matching domain state
  document.querySelectorAll("[data-visible-state]").forEach((el) => {
    const domain = el.getAttribute("data-domain") || "_";
    const want = (el.getAttribute("data-visible-state") || "").split(/\s+/);
    const cur = Store.jobState[domain] || "idle";
    // restore to explicit display (CSS default is none) so visibility is reliable
    const shown = el.getAttribute("data-display") || (el.classList.contains("items-center") ? "inline-flex" : "block");
    el.style.display = want.includes(cur) ? shown : "none";
  });
}
function setActiveNav() {
  document.querySelectorAll("[data-nav]").forEach((el) => {
    const on = el.getAttribute("data-route") === Store.route;
    el.classList.toggle("bg-brand-50", on);
    el.classList.toggle("text-brand-700", on);
    el.classList.toggle("text-slate-600", !on);
  });
  document.querySelectorAll("[data-bnav]").forEach((el) => {
    const on = el.getAttribute("data-route") === Store.route;
    el.classList.toggle("text-brand-600", on);
    el.classList.toggle("text-slate-400", !on);
  });
}
function setRoleButtons() {
  document.querySelectorAll(".role-btn").forEach((el) => {
    const on = el.getAttribute("data-role") === Store.role;
    el.classList.toggle("bg-white", on);
    el.classList.toggle("text-brand-700", on);
    el.classList.toggle("shadow-card", on);
    el.classList.toggle("text-slate-500", !on);
  });
}
function icons() { if (window.lucide) window.lucide.createIcons(); }
function toast(msg, kind) {
  const root = document.getElementById("toast-root");
  const el = document.createElement("div");
  const color = kind === "error" ? "bg-rose-600" : kind === "info" ? "bg-slate-900" : "bg-brand-600";
  el.className = `pointer-events-auto flex items-center gap-2 rounded-2xl ${color} px-4 py-3 text-sm font-semibold text-white shadow-glow animate-fadeIn`;
  el.innerHTML = `<span class="inline-flex h-2 w-2 rounded-full bg-white/80"></span><span></span>`;
  el.lastElementChild.textContent = msg;
  root.appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .4s, transform .4s"; el.style.opacity = "0"; el.style.transform = "translateY(8px)"; setTimeout(() => el.remove(), 400); }, 2600);
}
const fmtNum = (n) => n >= 1000 ? (n/1000).toFixed(n%1000===0?0:1) + "K" : String(n);
const money = (n) => "$" + Number(n).toLocaleString();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
</script>

let dirFilter = "all";
let dirSearch = "";
VIEWS.directory = function () {
  const all = [...MOCK.creators, ...MOCK.brands];
  const q = dirSearch.trim().toLowerCase();
  let list = all.filter((p) => dirFilter === "all" ? true : p.role === dirFilter);
  if (q) list = list.filter((p) => [p.name, p.country, p.bio, (p.cats||[]).join(" "), (p.langs||[]).join(" "), p.role].join(" ").toLowerCase().includes(q));
  const regions = [...new Set(all.map((p) => `${p.flag} ${p.country}`))].slice(0, 6);
  const featured = list.slice(0, 3);
  const rest = list.slice(3);
  const filterBtn = (key, label) => `<button data-action="dir-filter" data-filter="${key}" class="dir-fbtn rounded-full px-4 py-2 text-sm font-bold transition ${dirFilter===key?"bg-brand-600 text-white shadow-lg shadow-brand-500/30":"bg-white text-slate-600 border border-slate-200"}">${esc(label)}</button>`;
  return `
  <div class="space-y-6">
    <section class="rounded-[2rem] border border-slate-100 bg-white p-7 shadow-soft sm:p-9">
      <span class="text-xs font-bold uppercase tracking-widest text-brand-600" data-i18n="dir.eyebrow">${t("dir.eyebrow")}</span>
      <h1 class="mt-2 text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl" data-i18n="dir.title">${t("dir.title")}</h1>
      <p class="mt-2 max-w-2xl text-base leading-relaxed text-slate-500" data-i18n="dir.body">${t("dir.body")}</p>
      <div class="mt-5 flex items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50/70 px-4 py-3 focus-within:border-brand-400 focus-within:ring-4 focus-within:ring-brand-100">
        <i data-lucide="search" class="h-5 w-5 text-brand-500"></i>
        <input data-action="dir-search" id="dir-search-input" value="${esc(dirSearch)}" class="w-full bg-transparent text-sm text-slate-900 outline-none placeholder:text-slate-400" data-i18n-ph="dir.search" placeholder="${t("dir.search")}" />
      </div>
      <div class="mt-4 flex flex-wrap gap-2">${filterBtn("all",t("dir.filterAll"))}${filterBtn("creator",t("dir.filterCreator"))}${filterBtn("brand",t("dir.filterBrand"))}</div>
      <div class="mt-4">
        <p class="mb-2 text-xs font-bold uppercase tracking-wide text-slate-400" data-i18n="dir.trending">${t("dir.trending")}</p>
        <div class="flex flex-wrap gap-2">
          ${regions.map((r) => `<span class="rounded-full bg-brand-50 px-3 py-1.5 text-xs font-semibold text-brand-700">${esc(r)}</span>`).join("")}
          <span class="rounded-full bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-600">YouTube</span>
          <span class="rounded-full bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-600">UGC</span>
          <span class="rounded-full bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-600">${t("dir.recommended")}</span>
        </div>
      </div>
    </section>

    ${featured.length ? sectionCard(`
      ${heading("dir.featuredTitle","dir.featuredMeta")}
      <div class="grid gap-4 md:grid-cols-3">${featured.map((p) => personCard(p)).join("")}</div>
    `) : ""}

    ${sectionCard(`
      <div class="mb-5 flex items-end justify-between gap-3">
        <div><h2 class="text-xl font-extrabold tracking-tight text-slate-900">${t("dir.resultsTitle")} (${list.length})</h2>
        <p class="mt-1 text-sm text-slate-500" data-i18n="dir.resultsMeta">${t("dir.resultsMeta")}</p></div>
      </div>
      ${(rest.length?rest:list).length
        ? `<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">${(rest.length?rest:list).map((p) => personCard(p)).join("")}</div>`
        : `<p class="rounded-2xl bg-slate-50 px-5 py-8 text-center text-sm text-slate-400" data-i18n="dir.empty">${t("dir.empty")}</p>`}
    `)}
  </div>`;
};
</script>
<script>
/* ---- MATCHES (swipe deck) ---- */
let deck = [];
let deckInit = false;
function resetDeck() { deck = MOCK.creators.map((c) => c.id); deckInit = true; }
VIEWS.matches = function () {
  if (!deckInit) resetDeck();
  const offerTarget = MOCK.creators[0];
  const network = MOCK.creators.slice(0, 6);
  return `
  <div class="space-y-6">
    <section class="rounded-[2rem] border border-slate-100 bg-white p-7 shadow-soft sm:p-9">
      <span class="text-xs font-bold uppercase tracking-widest text-brand-600" data-i18n="match.eyebrow">${t("match.eyebrow")}</span>
      <h1 class="mt-2 text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl" data-i18n="match.title">${t("match.title")}</h1>
      <p class="mt-2 max-w-2xl text-base leading-relaxed text-slate-500" data-i18n="match.body">${t("match.body")}</p>
      <div class="mt-5 grid grid-cols-3 gap-3">
        ${[["match.openOffers",MOCK.offers.length],["match.escrow",MOCK.payments.length],["match.candidates",MOCK.creators.length]].map(([k,v]) => `
          <div class="rounded-3xl bg-slate-50/70 p-4"><p class="text-2xl font-extrabold text-slate-900">${v}</p><p class="text-xs font-semibold text-slate-400" data-i18n="${k}">${t(k)}</p></div>`).join("")}
      </div>
    </section>

    <div class="grid gap-6 lg:grid-cols-2">
      <!-- swipe deck -->
      ${sectionCard(`
        <div class="mb-4 flex items-center justify-between">
          <h2 class="text-xl font-extrabold tracking-tight text-slate-900" data-i18n="match.deckTitle">${t("match.deckTitle")}</h2>
          <span class="rounded-full bg-brand-50 px-3 py-1 text-xs font-bold text-brand-700"><span id="deck-count">${deck.length}</span> <span data-i18n="match.deckHint">${t("match.deckHint")}</span></span>
        </div>
        <div id="deck-wrap" class="relative mx-auto h-[460px] w-full max-w-sm select-none">${deckHTML()}</div>
        <div class="mt-5 flex items-center justify-center gap-4">
          <button data-action="swipe" data-dir="left" class="flex h-14 w-14 items-center justify-center rounded-full border border-slate-200 bg-white text-rose-500 shadow-card transition hover:-translate-y-1 hover:shadow-soft" aria-label="${t("match.pass")}"><i data-lucide="x" class="h-6 w-6"></i></button>
          <button data-action="swipe" data-dir="up" class="flex h-12 w-12 items-center justify-center rounded-full bg-gradient-to-br from-brand-600 to-indigo-600 text-white shadow-glow transition hover:-translate-y-1" aria-label="${t("match.superlike")}"><i data-lucide="zap" class="h-5 w-5"></i></button>
          <button data-action="swipe" data-dir="right" class="flex h-14 w-14 items-center justify-center rounded-full border border-emerald-200 bg-white text-emerald-500 shadow-card transition hover:-translate-y-1 hover:shadow-soft" aria-label="${t("match.like")}"><i data-lucide="heart" class="h-6 w-6"></i></button>
        </div>
      `)}

      <!-- direct offer + lists -->
      <div class="space-y-6">
        ${sectionCard(`
          <h2 class="text-xl font-extrabold tracking-tight text-slate-900" data-i18n="match.newOfferTitle">${t("match.newOfferTitle")}</h2>
          <p class="mb-4 mt-1 text-sm text-slate-500" data-i18n="match.newOfferBody">${t("match.newOfferBody")}</p>
          <form data-action="send-offer" class="space-y-3" autocomplete="off">
            ${field("match.target","target",offerTarget.name)}
            ${field("match.message","message","다음 롤아웃을 위해 직접 라인을 열고 조건을 확정하고 싶어요.",{textarea:true})}
            ${field("match.amount","amount","2200",{type:"number"})}
            <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-brand-600 to-indigo-600 py-3 text-sm font-bold text-white shadow-lg shadow-brand-500/30 transition hover:opacity-95" data-domain="offer">
              <span data-visible-state="idle completed cancelled failed" data-domain="offer" style="display:inline-flex" class="items-center gap-2"><i data-lucide="send" class="h-4 w-4"></i><span data-i18n="match.send">${t("match.send")}</span></span>
              <span data-visible-state="submitting queued running" data-domain="offer" class="items-center gap-2"><i data-lucide="loader-2" class="h-4 w-4 animate-spin"></i><span data-i18n="match.sending">${t("match.sending")}</span></span>
            </button>
          </form>
        `)}

        ${sectionCard(`
          <h2 class="mb-4 text-xl font-extrabold tracking-tight text-slate-900" data-i18n="match.openOffersList">${t("match.openOffersList")}</h2>
          <div id="offers-list" class="space-y-3">${offersListHTML()}</div>
        `)}
      </div>
    </div>

    ${sectionCard(`
      <h2 class="mb-4 text-xl font-extrabold tracking-tight text-slate-900" data-i18n="match.publicNetwork">${t("match.publicNetwork")}</h2>
      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        ${network.map((p) => `
          <div class="flex flex-col gap-2 rounded-3xl border border-slate-100 bg-white p-5 shadow-card">
            <div class="flex items-center gap-3">
              <img src="${AV(p.img)}" class="h-11 w-11 rounded-2xl object-cover" alt="" />
              <div class="min-w-0"><p class="truncate text-sm font-extrabold text-slate-900">${esc(p.name)}</p><p class="truncate text-xs text-slate-400">${p.flag} ${esc(p.country)} · ${esc(p.cats[0])}</p></div>
            </div>
            <p class="line-clamp-2 text-sm text-slate-500">${esc(p.bio)}</p>
            <button data-action="use-target" data-target="${esc(p.name)}" class="mt-1 rounded-2xl border border-slate-200 py-2 text-xs font-bold text-slate-700 transition hover:border-brand-300 hover:text-brand-700" data-i18n="match.useId">${t("match.useId")}</button>
          </div>`).join("")}
      </div>
    `)}

    <!-- match modal -->
    <div id="match-modal" class="fixed inset-0 z-[70] hidden items-center justify-center p-4" data-state="closed">
      <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" data-action="close-match"></div>
      <div class="relative w-full max-w-sm rounded-[2rem] bg-white p-8 text-center shadow-glow animate-fadeIn">
        <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-gradient-to-br from-brand-600 to-indigo-600 shadow-glow"><i data-lucide="heart-handshake" class="h-8 w-8 text-white"></i></div>
        <h3 class="text-2xl font-extrabold gradient-text" data-i18n="match.matchedTitle">${t("match.matchedTitle")}</h3>
        <p class="mt-2 text-sm text-slate-500"><span id="match-name" class="font-bold text-slate-700"></span><span data-i18n="match.matchedBody">${t("match.matchedBody")}</span></p>
        <div class="mt-6 space-y-2">
          <button data-action="navigate" data-route="chat" class="flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-brand-600 to-indigo-600 py-3 text-sm font-bold text-white" data-i18n="match.startChat">${t("match.startChat")}</button>
          <button data-action="close-match" class="w-full rounded-2xl border border-slate-200 py-3 text-sm font-bold text-slate-600" data-i18n="match.keepSwiping">${t("match.keepSwiping")}</button>
        </div>
      </div>
    </div>
  </div>`;
};
function deckHTML() {
  if (!deck.length) {
    return `<div class="flex h-full flex-col items-center justify-center gap-4 rounded-[2rem] border-2 border-dashed border-slate-200 bg-slate-50/50 text-center">
      <i data-lucide="check-circle-2" class="h-10 w-10 text-brand-400"></i>
      <p class="px-6 text-sm text-slate-400" data-i18n="match.deckEmpty">${t("match.deckEmpty")}</p>
      <button data-action="reset-deck" class="rounded-2xl bg-brand-600 px-5 py-2.5 text-sm font-bold text-white" data-i18n="match.deckReset">${t("match.deckReset")}</button>
    </div>`;
  }
  // render up to 3 stacked, top last so it's on top
  return deck.slice(0, 3).map((id, i) => {
    const c = MOCK.creators.find((x) => x.id === id);
    const depth = i; const isTop = i === 0;
    const scale = 1 - depth * 0.04; const ty = depth * 14;
    return `
    <div class="deck-card absolute inset-0 ${isTop?"deck-top cursor-grab":""}" data-card-id="${id}" style="transform:translateY(${ty}px) scale(${scale}); z-index:${10-depth};">
      <div class="flex h-full flex-col overflow-hidden rounded-[2rem] border border-slate-100 bg-white shadow-soft">
        <div class="relative h-56 shrink-0 overflow-hidden">
          <img src="${AV(c.img)}" class="h-full w-full object-cover" alt="${esc(c.name)}" />
          <div class="absolute inset-0 bg-gradient-to-t from-slate-900/70 via-transparent"></div>
          <span class="absolute right-4 top-4 rounded-full bg-white/90 px-3 py-1 text-xs font-bold text-brand-700 backdrop-blur">${c.tier}</span>
          <span class="like-stamp absolute left-4 top-4 rounded-xl border-4 border-emerald-400 px-3 py-1 text-lg font-extrabold uppercase text-emerald-400 opacity-0 -rotate-12">LIKE</span>
          <span class="nope-stamp absolute right-4 top-14 rounded-xl border-4 border-rose-400 px-3 py-1 text-lg font-extrabold uppercase text-rose-400 opacity-0 rotate-12">NOPE</span>
          <div class="absolute bottom-4 left-4 right-4 text-white">
            <h3 class="text-2xl font-extrabold tracking-tight">${esc(c.name)}</h3>
            <p class="text-sm font-semibold text-white/90">${c.flag} ${esc(c.country)} · ${esc(c.cats.join(", "))}</p>
          </div>
        </div>
        <div class="flex flex-1 flex-col gap-3 p-5">
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="rounded-2xl bg-brand-50 py-2"><p class="text-base font-extrabold text-brand-700">${c.roas}%</p><p class="text-[10px] font-semibold text-slate-400">ROAS</p></div>
            <div class="rounded-2xl bg-indigo-50 py-2"><p class="text-base font-extrabold text-indigo-700">${esc(c.reach)}</p><p class="text-[10px] font-semibold text-slate-400">Reach</p></div>
            <div class="rounded-2xl bg-rose-50 py-2"><p class="text-base font-extrabold text-rose-600">${c.er}%</p><p class="text-[10px] font-semibold text-slate-400">ER</p></div>
          </div>
          <p class="line-clamp-2 text-sm leading-relaxed text-slate-500">${esc(c.bio)}</p>
          <div class="mt-auto flex flex-wrap gap-1.5">${c.platforms.map((pl) => `<span class="rounded-full bg-slate-100 px-2.5 py-1 text-[11px] font-semibold text-slate-600">${esc(pl)}</span>`).join("")}<span class="rounded-full bg-slate-100 px-2.5 py-1 text-[11px] font-semibold text-slate-600">${fmtNum(c.followers)} ${t("home.followers")}</span></div>
        </div>
      </div>
    </div>`;
  }).reverse().join("");
}
function offersListHTML() {
  if (!MOCK.offers.length) return `<p class="rounded-2xl bg-slate-50 px-4 py-6 text-center text-sm text-slate-400" data-i18n="match.noOffers">${t("match.noOffers")}</p>`;
  return MOCK.offers.map((o) => `
    <div class="flex items-center gap-3 rounded-3xl border border-slate-100 bg-white p-4">
      <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-brand-50 text-brand-600"><i data-lucide="send" class="h-4 w-4"></i></span>
      <div class="min-w-0 flex-1">
        <p class="truncate text-sm font-extrabold text-slate-900">${esc(o.target)}</p>
        <p class="truncate text-xs text-slate-400">${esc(o.message)}</p>
      </div>
      <div class="shrink-0 text-right">
        <p class="text-sm font-extrabold text-brand-600">${money(o.amount)}</p>
        <span class="rounded-full bg-slate-100 px-2 py-0.5 text-[10px] font-bold text-slate-500">${t("state."+o.status)}</span>
      </div>
    </div>`).join("");
}
</script>
<script>
/* ---- FORECAST ---- */
let fcResult = null;
VIEWS.forecast = function () {
  const creatorOpts = MOCK.creators.map((c) => `<option value="${esc(c.name)}">${esc(c.name)} · ${c.flag} ${esc(c.country)}</option>`).join("");
  return `
  <div class="space-y-6">
    <section class="rounded-[2rem] border border-slate-100 bg-white p-7 shadow-soft sm:p-9">
      <span class="text-xs font-bold uppercase tracking-widest text-brand-600" data-i18n="fc.eyebrow">${t("fc.eyebrow")}</span>
      <h1 class="mt-2 text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl" data-i18n="fc.title">${t("fc.title")}</h1>
      <p class="mt-2 max-w-2xl text-base leading-relaxed text-slate-500" data-i18n="fc.body">${t("fc.body")}</p>
    </section>

    <div class="grid gap-6 lg:grid-cols-5">
      ${sectionCard(`
        <form data-action="run-forecast" class="space-y-4" autocomplete="off">
          <label class="block space-y-1.5">
            <span class="text-xs font-bold uppercase tracking-wide text-slate-500" data-i18n="fc.creator">${t("fc.creator")}</span>
            <select name="creator" class="w-full rounded-2xl border border-slate-200 bg-slate-50/60 px-4 py-3 text-sm text-slate-900 outline-none focus:border-brand-400 focus:bg-white focus:ring-4 focus:ring-brand-100">${creatorOpts}</select>
          </label>
          ${field("fc.budget","budget","2500",{type:"number"})}
          <label class="block space-y-1.5">
            <span class="text-xs font-bold uppercase tracking-wide text-slate-500" data-i18n="fc.platform">${t("fc.platform")}</span>
            <select name="platform" class="w-full rounded-2xl border border-slate-200 bg-slate-50/60 px-4 py-3 text-sm text-slate-900 outline-none focus:border-brand-400 focus:bg-white focus:ring-4 focus:ring-brand-100">
              <option>TikTok</option><option>Instagram</option><option>YouTube</option><option>All platforms</option>
            </select>
          </label>
          <label class="block space-y-1.5">
            <span class="text-xs font-bold uppercase tracking-wide text-slate-500" data-i18n="fc.scenario">${t("fc.scenario")}</span>
            <div class="grid grid-cols-3 gap-2">
              ${["worst","base","best"].map((s,i) => `<label class="cursor-pointer"><input type="radio" name="scenario" value="${s}" class="peer sr-only" ${i===1?"checked":""}><span class="block rounded-2xl border border-slate-200 py-2.5 text-center text-xs font-bold text-slate-500 transition peer-checked:border-brand-500 peer-checked:bg-brand-50 peer-checked:text-brand-700" data-i18n="fc.${s}">${t("fc."+s)}</span></label>`).join("")}
            </div>
          </label>
          <div data-visible-state="idle completed cancelled failed" data-domain="forecast" style="display:block">
            <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-brand-600 to-indigo-600 py-3 text-sm font-bold text-white shadow-lg shadow-brand-500/30 transition hover:opacity-95">
              <i data-lucide="trending-up" class="h-4 w-4"></i><span data-i18n="${fcResult?"fc.rerun":"fc.run"}">${fcResult?t("fc.rerun"):t("fc.run")}</span>
            </button>
          </div>
          <div data-visible-state="submitting queued running" data-domain="forecast" class="space-y-3">
            <div class="flex items-center gap-3 rounded-2xl bg-brand-50 px-4 py-3 text-sm font-bold text-brand-700"><i data-lucide="loader-2" class="h-4 w-4 animate-spin"></i><span id="fc-status" data-i18n="fc.running">${t("fc.running")}</span></div>
            <div class="h-2 overflow-hidden rounded-full bg-slate-100"><div id="fc-bar" class="h-full w-0 rounded-full bg-gradient-to-r from-brand-500 to-indigo-500 transition-all duration-300"></div></div>
            <button type="button" data-action="cancel-forecast" class="w-full rounded-2xl border border-slate-200 py-2.5 text-xs font-bold text-slate-500 transition hover:border-rose-300 hover:text-rose-500" data-i18n="fc.cancel">${t("fc.cancel")}</button>
          </div>
        </form>
      `,"lg:col-span-2")}

      ${sectionCard(`<div id="fc-result">${forecastResultHTML()}</div>`,"lg:col-span-3")}
    </div>
  </div>`;
};
function forecastResultHTML() {
  if (!fcResult) {
    return `<div class="flex h-full min-h-[280px] flex-col items-center justify-center gap-3 text-center">
      <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-50 text-brand-400"><i data-lucide="bar-chart-3" class="h-7 w-7"></i></span>
      <p class="max-w-xs text-sm text-slate-400" data-i18n="fc.empty">${t("fc.empty")}</p>
    </div>`;
  }
  const r = fcResult;
  const metrics = [
    { ic: "users", k: "fc.reach", v: r.reach, c: "brand" },
    { ic: "trending-up", k: "fc.roas", v: r.roas + "%", c: "indigo" },
    { ic: "shopping-bag", k: "fc.conv", v: r.conv.toLocaleString(), c: "emerald" },
    { ic: "dollar-sign", k: "fc.cpa", v: money(r.cpa), c: "rose" },
  ];
  const colorMap = { brand:"bg-brand-50 text-brand-700", indigo:"bg-indigo-50 text-indigo-700", emerald:"bg-emerald-50 text-emerald-700", rose:"bg-rose-50 text-rose-600" };
  return `
    <div class="mb-5 flex items-center justify-between">
      <h2 class="text-xl font-extrabold tracking-tight text-slate-900">${esc(r.creator)} · ${esc(r.platform)}</h2>
      <span class="flex items-center gap-1.5 rounded-full bg-emerald-50 px-3 py-1 text-xs font-bold text-emerald-600"><i data-lucide="badge-check" class="h-3.5 w-3.5"></i>${t("fc.confidence")} ${r.confidence}%</span>
    </div>
    <div class="grid grid-cols-2 gap-3">
      ${metrics.map((m) => `<div class="rounded-3xl border border-slate-100 bg-white p-4 shadow-card">
        <span class="mb-2 flex h-9 w-9 items-center justify-center rounded-2xl ${colorMap[m.c]}"><i data-lucide="${m.ic}" class="h-4 w-4"></i></span>
        <p class="text-2xl font-extrabold text-slate-900">${m.v}</p>
        <p class="text-xs font-semibold text-slate-400" data-i18n="${m.k}">${t(m.k)}</p>
      </div>`).join("")}
    </div>
    <div class="mt-5">
      <p class="mb-3 text-xs font-bold uppercase tracking-wide text-slate-500" data-i18n="fc.breakdown">${t("fc.breakdown")}</p>
      <div class="space-y-2.5">

        ${[["pay.step1"],["pay.step2"],["pay.step3"]].map(([k],i) => {
          const done = i < s; const cur = i === s-1;
          return `<div class="flex flex-1 items-center gap-1">
            <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-[11px] font-bold ${done?"bg-brand-600 text-white":cur?"bg-brand-100 text-brand-700":"bg-slate-100 text-slate-400"}">${done?"✓":i+1}</span>
            <span class="text-[10px] font-semibold ${done||cur?"text-slate-600":"text-slate-300"}" data-i18n="${k}">${t(k)}</span>
            ${i<2?`<span class="h-0.5 flex-1 rounded ${i<s-1?"bg-brand-500":"bg-slate-100"}"></span>`:""}
          </div>`;
        }).join("")}
      </div>
      ${["funded","in_review"].includes(p.status) ? `<div class="flex flex-wrap gap-2">
        <button data-action="escrow-release" data-id="${p.id}" class="flex items-center gap-1.5 rounded-xl bg-emerald-600 px-4 py-2 text-xs font-bold text-white transition hover:bg-emerald-700"><i data-lucide="check" class="h-3.5 w-3.5"></i><span data-i18n="pay.release">${t("pay.release")}</span></button>
        <button data-action="escrow-refund" data-id="${p.id}" class="flex items-center gap-1.5 rounded-xl border border-slate-200 px-4 py-2 text-xs font-bold text-slate-600 transition hover:border-slate-300"><i data-lucide="undo-2" class="h-3.5 w-3.5"></i><span data-i18n="pay.refund">${t("pay.refund")}</span></button>
        <button data-action="escrow-dispute" data-id="${p.id}" class="flex items-center gap-1.5 rounded-xl border border-rose-200 px-4 py-2 text-xs font-bold text-rose-500 transition hover:bg-rose-50"><i data-lucide="alert-triangle" class="h-3.5 w-3.5"></i><span data-i18n="pay.dispute">${t("pay.dispute")}</span></button>
      </div>` : ""}
    </div>`;
  }).join("");
}
</script>
<script>
/* ============================ ROUTER ============================ */
const ROUTES = ["home","directory","matches","forecast","chat","create","payment"];
function currentRoute() {
  const h = (location.hash || "#/home").replace(/^#\//, "").split("?")[0];
  return ROUTES.includes(h) ? h : "home";
}
function render() {
  const route = Store.route;
  const app = document.getElementById("app");
  app.innerHTML = `<div data-view class="active">${(VIEWS[route]||VIEWS.home)()}</div>`;
  applyI18n(app);
  icons();
  setActiveNav();
  applyStateSlots();
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  // post-render wiring
  if (route === "matches") wireDeck();
  if (route === "chat") scrollThread();
}
function go(route) {
  if (!ROUTES.includes(route)) route = "home";
  if (location.hash !== "#/" + route) { location.hash = "#/" + route; return; } // hashchange will render
  Store.route = route; render();
}
window.addEventListener("hashchange", () => { Store.route = currentRoute(); render(); });
</script>
<script>
/* ============================ COMMANDS ============================ */
COMMANDS.navigate = ({ route }) => { closeMenu(); go(route); };
COMMANDS["toggle-lang"] = () => { Store.lang = Store.lang === "ko" ? "en" : "ko"; setLangLabel(); applyI18n(document); render(); };
COMMANDS["set-role"] = ({ role }) => { if (role!==Store.role){ Store.role = role; MOCK.account.role = role; setRoleButtons(); render(); toast((role==="brand"?t("role.brand"):t("role.creator"))); } };
COMMANDS["open-menu"] = () => openMenu();
COMMANDS["close-menu"] = () => closeMenu();

/* directory */
COMMANDS["dir-filter"] = ({ filter }) => { dirFilter = filter; render(); };
let dirDebounce;
COMMANDS["dir-search"] = ({ value }) => {
  dirSearch = value;
  clearTimeout(dirDebounce);
  dirDebounce = setTimeout(() => { render(); const inp = document.getElementById("dir-search-input"); if (inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);} }, 220);
};

/* matches: swipe + offer */
COMMANDS.swipe = ({ dir }) => doSwipe(dir);
COMMANDS["reset-deck"] = () => { resetDeck(); render(); };
COMMANDS["close-match"] = () => { const m = document.getElementById("match-modal"); if (m){ m.classList.add("hidden"); m.classList.remove("flex"); } };
COMMANDS["use-target"] = ({ target }) => { const f = document.querySelector('form[data-action="send-offer"] [name="target"]'); if (f){ f.value = target; f.focus(); toast(target + " → " + t("match.target")); } };
COMMANDS.propose = ({ target }) => { go("matches"); setTimeout(() => { const f = document.querySelector('[name="target"]'); if (f) f.value = target; toast(target + " · " + t("dir.propose")); }, 80); };

COMMANDS["send-offer"] = ({ form }) => {
  if (["submitting","queued","running"].includes(Store.jobState.offer)) return; // idempotency invariant
  const fd = new FormData(form);
  const target = fd.get("target"), message = fd.get("message"), amount = Number(fd.get("amount"))||0;
  if (!target) { toast("대상을 입력하세요", "error"); return; }
  const clientActionId = "offer-" + Date.now();
  runJob("offer", { clientActionId }, () => {
    MOCK.offers.unshift({ id: "ofr_" + Math.floor(Math.random()*9000+1000), target, conv: "cv_new", message, amount, status: "queued" });
    const el = document.getElementById("offers-list"); if (el){ el.innerHTML = offersListHTML(); applyI18n(el); icons(); }
    toast(t("match.sent"));
  });
};

/* forecast */
COMMANDS["run-forecast"] = ({ form }) => {
  if (["submitting","queued","running"].includes(Store.jobState.forecast)) return;
  const fd = new FormData(form);
  const creator = fd.get("creator"), budget = Number(fd.get("budget"))||1000, platform = fd.get("platform"), scenario = fd.get("scenario")||"base";
  const mult = scenario==="best"?1.25:scenario==="worst"?0.78:1;
  const cr = MOCK.creators.find((c) => c.name === creator) || MOCK.creators[0];
  runJobWithProgress("forecast", () => {
    const baseReach = (budget/1000) * (cr.followers/1000) * 2.4 * mult;
    fcResult = {
      creator, platform, confidence: Math.round(72 + Math.random()*20),
      reach: fmtNum(Math.round(baseReach)),
      roas: Math.round(cr.roas * mult * (0.9 + Math.random()*0.2)),
      conv: Math.round(budget * 0.42 * mult),
      cpa: Math.round(budget / (budget*0.042*mult) * 10),
      breakdown: cr.platforms.map((p,i) => ({ name: p, pct: i===0?Math.round(55+Math.random()*10):Math.round(30-i*5+Math.random()*10) })).concat([{name:"Other",pct:12}]).slice(0,3),
      weekly: Array.from({length:6}, (_,i) => Math.round((35 + i*9 + Math.random()*15))).map((v)=>Math.min(100,v)),
    };
    const el = document.getElementById("fc-result"); if (el){ el.innerHTML = forecastResultHTML(); applyI18n(el); icons(); }
    // refresh the submit button label (run -> rerun)
    const lbl = document.querySelector('[data-domain="forecast"] [data-i18n="fc.run"], [data-domain="forecast"] [data-i18n="fc.rerun"]');
    if (lbl){ lbl.setAttribute("data-i18n","fc.rerun"); lbl.textContent = t("fc.rerun"); }
    toast(t("fc.confidence") + " " + fcResult.confidence + "%");
  });
};
COMMANDS["cancel-forecast"] = () => {
  if (!["submitting","queued","running"].includes(Store.jobState.forecast)) return;
  Store._cancel = Store._cancel || {}; Store._cancel.forecast = true;
  setJobState("forecast","cancelling"); setJobState("forecast","cancelled");
  toast(t("fc.cancelled"), "info");
  setTimeout(() => setJobState("forecast","idle"), 50);
};

/* chat */
COMMANDS["select-conv"] = ({ conv }) => { activeConv = conv; const c = MOCK.conversations.find((x)=>x.id===conv); if(c) c.unread=0; render(); };
COMMANDS["back-conv"] = () => { activeConv = ""; render(); };
COMMANDS["toggle-translate"] = () => { translateOn = !translateOn; render(); };
COMMANDS["send-message"] = ({ form }) => {
  const fd = new FormData(form); const text = (fd.get("text")||"").toString().trim();
  if (!text) return;
  const c = MOCK.conversations.find((x) => x.id === activeConv); if (!c) return;
  if (!Store.online) { c.msgs.push({ who:"me", text, tr:"", t: nowHM(), queued:true }); toast(t("chat.offline"),"info"); }
  else c.msgs.push({ who: "me", text, tr: "", t: nowHM() });
  c.last = text;
  form.reset();
  const scroll = document.getElementById("thread-scroll"); if (scroll){ scroll.innerHTML = messagesHTML(c); applyI18n(scroll); scrollThread(); }
  // simulate reply
  if (Store.online) {
    const typing = document.getElementById("typing-row");
    if (typing){ typing.classList.remove("hidden"); scrollThread(); }
    setTimeout(() => {
      const replies = ["좋아요, 진행해볼게요!","네, 일정 맞춰볼게요.","컨셉 공유 감사해요 ✨","바로 확인하고 답신드릴게요."];
      const rep = replies[Math.floor(Math.random()*replies.length)];
      c.msgs.push({ who:"them", text: rep, tr: "Sounds good, let's proceed!", t: nowHM() }); c.last = rep;
      const sc = document.getElementById("thread-scroll"); if (sc){ sc.innerHTML = messagesHTML(c); applyI18n(sc); scrollThread(); }
      // update conv list preview
    }, 1300);
  }
};

/* create */
COMMANDS["preview-mode"] = ({ mode }) => { previewMode = mode; previewUrl = null; render(); };
COMMANDS["create-campaign"] = ({ form }) => {
  if (["submitting","queued","running"].includes(Store.jobState.campaign)) return;
  const fd = new FormData(form);
  const title = (fd.get("title")||"").toString().trim(), brief = (fd.get("brief")||"").toString().trim();
  if (!title || !brief) { toast(t("create.required"), "error"); return; }
  runJob("campaign", {}, () => {
    MOCK.campaigns.unshift({ id:"cmp_"+Date.now(), title, brand: MOCK.account.name, regions:(fd.get("regions")||"").toString().split(",").map(s=>s.trim()).filter(Boolean), platforms:(fd.get("platforms")||"").toString().split(",").map(s=>s.trim()).filter(Boolean), min:Number(fd.get("budgetMin"))||0, max:Number(fd.get("budgetMax"))||0, status:"open", applicants:0, brief });
    toast(t("create.registered")); form.reset(); render();
  });
};
COMMANDS["apply-campaign"] = ({ form, submitter }) => {
  const id = submitter && submitter.getAttribute("data-campaign");
  const c = MOCK.campaigns.find((x) => x.id === id); if (c) c.applicants++;
  toast(t("create.applied"));
  render();
};
COMMANDS["generate-preview"] = ({ form }) => {
  if (["submitting","queued","running"].includes(Store.jobState.preview)) return;
  const fd = new FormData(form);
  runJob("preview", {}, () => {
    previewUrl = buildPreviewSvg(fd.get("watermark"), previewMode, fd.get("concept"));
    const el = document.getElementById("preview-frame"); if (el){ el.innerHTML = previewFrameHTML(); }
    toast(previewMode==="image"?t("create.imagePreview"):t("create.textPreview"));
  });
};

/* payment escrow transitions */
COMMANDS["create-escrow"] = ({ form }) => {
  if (["submitting","queued","running"].includes(Store.jobState.escrow)) return;
  const fd = new FormData(form);
  runJob("escrow", {}, () => {
    MOCK.payments.unshift({ id:"pay_"+Date.now(), currency:(fd.get("currency")||"USD").toString().toUpperCase(), amount:Number(fd.get("amount"))||0, status:"funded", payer: MOCK.account.name, payee: (fd.get("payee")||"creator").toString() });
    toast(t("pay.created")); render();
  });
};
COMMANDS["escrow-release"] = ({ id }) => { const p = MOCK.payments.find((x)=>x.id===id); if(p){ p.status="released"; refreshHolds(); toast(t("pay.released")); } };
COMMANDS["escrow-refund"] = ({ id }) => { const p = MOCK.payments.find((x)=>x.id===id); if(p){ p.status="refunded"; refreshHolds(); toast(t("pay.refunded"),"info"); } };
COMMANDS["escrow-dispute"] = ({ id }) => { const p = MOCK.payments.find((x)=>x.id===id); if(p){ p.status="disputed"; refreshHolds(); toast(t("pay.disputed"),"error"); } };
function refreshHolds() { const el = document.getElementById("holds-list"); if (el){ el.innerHTML = holdsListHTML(); applyI18n(el); icons(); } render(); }
</script>
<script>
/* ============================ JOB RUNNERS (state machine) ============================ */
/* runJob: idle -> submitting -> queued -> running -> completed -> idle */
function runJob(domain, meta, onComplete) {
  if (!setJobState(domain, "submitting")) return;
  setTimeout(() => {
    if (!setJobState(domain, "queued")) return;
    setTimeout(() => {
      setJobState(domain, "running");
      setTimeout(() => {
        try { onComplete && onComplete(); setJobState(domain, "completed"); }
        catch (e) { console.error(e); setJobState(domain, "failed"); }
        setTimeout(() => setJobState(domain, "idle"), 60);
      }, 520);
    }, 260);
  }, 220);
}
/* runJobWithProgress: drives a progress bar + supports cancel */
function runJobWithProgress(domain, onComplete) {
  Store._cancel = Store._cancel || {}; Store._cancel[domain] = false;
  if (!setJobState(domain, "submitting")) return;
  const statusEl = () => document.getElementById("fc-status");
  const barEl = () => document.getElementById("fc-bar");
  let pct = 0;
  setTimeout(() => {
    if (Store._cancel[domain]) return;
    setJobState(domain, "queued");
    if (statusEl()) statusEl().textContent = t("fc.queued");
    setTimeout(() => {
      if (Store._cancel[domain]) return;
      setJobState(domain, "running");
      if (statusEl()) statusEl().textContent = t("fc.running");
      const tick = setInterval(() => {
        if (Store._cancel[domain]) { clearInterval(tick); return; }
        pct = Math.min(100, pct + 12 + Math.random()*10);
        if (barEl()) barEl().style.width = pct + "%";
        if (pct >= 100) {
          clearInterval(tick);
          if (Store._cancel[domain]) return;
          try { onComplete && onComplete(); setJobState(domain, "completed"); } catch(e){ console.error(e); setJobState(domain,"failed"); }
          setTimeout(() => setJobState(domain, "idle"), 60);
        }
      }, 200);
    }, 320);
  }, 260);
}

/* ============================ SWIPE DECK ============================ */
function doSwipe(dir) {
  if (!deck.length) return;
  const topId = deck[0];
  const card = document.querySelector(`.deck-card[data-card-id="${topId}"]`);
  const creator = MOCK.creators.find((c) => c.id === topId);
  if (card) card.classList.add(dir === "left" ? "fly-left" : dir === "up" ? "fly-up" : "fly-right");
  setTimeout(() => {
    deck.shift();
    const wrap = document.getElementById("deck-wrap");
    if (wrap) { wrap.innerHTML = deckHTML(); applyI18n(wrap); icons(); wireDeck(); }
    const cnt = document.getElementById("deck-count"); if (cnt) cnt.textContent = deck.length;
    if (dir === "right" || dir === "up") {
      if (creator && !MOCK.liked.includes(creator.id)) MOCK.liked.push(creator.id);
      if (creator && !MOCK.conversations.find((c) => c.name === creator.name)) {
        MOCK.conversations.unshift({ id:"cv_"+creator.id, name: creator.name, img: creator.img, online: true, last: dir==="up"?"바로 제안 검토 중이에요!":"매칭 감사해요! 이야기 나눠요.", unread: 1, tags: dir==="up"?["offer"]:[],
          msgs:[{ who:"them", text: dir==="up"?"바로 제안 주셔서 감사해요! 조건 알려주세요.":"매칭 감사합니다! 어떤 캠페인인가요?", tr:"Thanks for matching! What's the campaign?", t: nowHM() }] });
      }
      if (dir === "up") toast(creator.name + " · " + t("match.superlike"));
      showMatch(creator);
    }
  }, (dir === "left" || dir === "right" || dir === "up") ? 340 : 0);
}
function showMatch(creator) {
  const m = document.getElementById("match-modal");
  if (!m || !creator) return;
  const nm = document.getElementById("match-name"); if (nm) nm.textContent = creator.name;
  m.classList.remove("hidden"); m.classList.add("flex"); icons();
}
function wireDeck() {
  const top = document.querySelector(".deck-card.deck-top");
  if (!top) return;
  let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false;
  const like = top.querySelector(".like-stamp"), nope = top.querySelector(".nope-stamp");
  const onDown = (e) => { dragging = true; top.classList.add("dragging"); const p = e.touches ? e.touches[0] : e; startX = p.clientX; startY = p.clientY; };
  const onMove = (e) => {
    if (!dragging) return;
    const p = e.touches ? e.touches[0] : e; dx = p.clientX - startX; dy = p.clientY - startY;
    top.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx*0.05}deg)`;
    if (like) like.style.opacity = dx > 30 ? Math.min(1, dx/120) : 0;
    if (nope) nope.style.opacity = dx < -30 ? Math.min(1, -dx/120) : 0;
  };
  const onUp = () => {
    if (!dragging) return; dragging = false; top.classList.remove("dragging");
    if (dx > 110) doSwipe("right");
    else if (dx < -110) doSwipe("left");
    else if (dy < -120) doSwipe("up");
    else { top.style.transform = ""; if (like) like.style.opacity = 0; if (nope) nope.style.opacity = 0; }
    dx = 0; dy = 0;
  };
  top.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  top.addEventListener("touchstart", onDown, { passive: true });
  top.addEventListener("touchmove", onMove, { passive: true });
  top.addEventListener("touchend", onUp);
}

/* ============================ small helpers ============================ */
function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function scrollThread() { const sc = document.getElementById("thread-scroll"); if (sc) sc.scrollTop = sc.scrollHeight; }
function openMenu() { const m = document.getElementById("mobile-menu"); m.classList.remove("hidden"); icons(); }
function closeMenu() { const m = document.getElementById("mobile-menu"); m.classList.add("hidden"); }
</script>
<script>
/* ============================ DELEGATED EVENTS (registered once) ============================ */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.getAttribute("data-action");
  const isFormSubmitAction = ["send-offer","run-forecast","send-message","create-campaign","apply-campaign","generate-preview","create-escrow"].includes(action);
  if (isFormSubmitAction && el.closest("form")) return;
  if (el.tagName === "A" && action === "navigate") e.preventDefault();
  dispatch(action, {
    route: el.getAttribute("data-route"), role: el.getAttribute("data-role"),
    filter: el.getAttribute("data-filter"), dir: el.getAttribute("data-dir"),
    conv: el.getAttribute("data-conv"), target: el.getAttribute("data-target"),
    mode: el.getAttribute("data-mode"), id: el.getAttribute("data-id"),
  });
});
document.addEventListener("submit", (e) => {
  const form = e.target.closest("form[data-action]");
  if (!form) return;
  e.preventDefault();
  dispatch(form.getAttribute("data-action"), { form, submitter: e.submitter });
});
document.addEventListener("input", (e) => {
  const el = e.target.closest("[data-action='dir-search']");
  if (el) dispatch("dir-search", { value: el.value });
});
window.addEventListener("online", () => { Store.online = true; dispatch("__net", {}); toast(t("chat.online"), "info"); });
window.addEventListener("offline", () => { Store.online = false; toast(t("chat.offline"), "error"); });
COMMANDS.__net = () => { MOCK.conversations.forEach((c) => c.msgs.forEach((m) => { if (m.queued) m.queued = false; })); if (Store.route === "chat") render(); };
document.addEventListener("keydown", (e) => {
  if (Store.route !== "matches") return;
  if (e.target.matches("input,textarea,select")) return;
  if (e.key === "ArrowLeft") doSwipe("left");
  else if (e.key === "ArrowRight") doSwipe("right");
  else if (e.key === "ArrowUp") doSwipe("up");
});
</script>
<script>
/* ============================ BOOT ============================ */
function boot() {
  document.documentElement.setAttribute("data-app-state", "booting");
  ["offer","forecast","campaign","preview","escrow","chat"].forEach((d) => { Store.jobState[d] = "idle"; });
  Store.lang = "ko"; Store.role = "brand"; Store.online = navigator.onLine !== false;
  Store.route = currentRoute();
  setLangLabel(); setRoleButtons(); applyI18n(document);
  render(); icons();
  document.documentElement.setAttribute("data-app-state", "idle");
  const splash = document.getElementById("boot-splash");
  setTimeout(() => { splash.style.opacity = "0"; setTimeout(() => splash.remove(), 500); }, 380);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
